meaning = "单个圆柱齿轮按规定画法：齿顶圆和齿顶线画粗实线，分度圆和分度线画细点画线，齿根圆和齿根线画细实线或省略；通过轴线的剖视中轮齿按不剖处理，齿根线改画粗实线。"
components = ["端视图：粗实线齿顶圆、细点画线分度圆、细实线齿根圆（可省略），以及轮毂孔和键槽。", "非圆外形视图：齿顶线粗实线，分度线点画线（略超出轮廓），齿根线细实线或省略。", "剖视：齿顶线、齿根线均为粗实线，分度线点画线；齿顶线与齿根线之间的轮齿部分不画剖面线。", "斜齿、人字齿：用三条细实线表示齿线方向。", "通常两个视图，或一个视图加孔和键槽的局部视图；图纸右上角配齿轮参数表。"]
variants = ["视图", "全剖/半剖（轮齿不剖，齿根线粗实线）", "一个视图加局部视图"]
dxf_forms = ["End view: thick CIRCLE (tip), CENTER-linetype CIRCLE (pitch), optional thin CIRCLE (root), concentric with the bore CIRCLE and keyway LINEs", "Section: thick LINEs at tip and root, CENTER LINE at pitch, HATCH ANSI31 bounded by the root line so the tooth band stays blank", "Parameter table as LINE grid + TEXT (模数 m, 齿数 z, 压力角 α 20%%d, 精度等级)", "Tip diameter as linear DIMENSION with %%c override, e.g. '%%c84h11'"]
