[[concepts]]
id = "DC-G3-086"
name = "花键长度标注"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "花键长度按三种形式之一标注：只注工作长度；注工作长度和尾部长度；或注工作长度和全长。"
components = ["工作长度：从花键起始端到工作长度终止端（细实线）的尺寸。", "尾部长度：从工作长度终止端到尾部末端（细实线）的尺寸，尾部画成约30°斜线。", "全长：从花键起始端到尾部末端的总长。", "尺寸线平行于轴线，注在花键视图一侧。"]
variants = ["只注工作长度", "工作长度+尾部长度", "工作长度+全长"]
dxf_forms = ["Linear DIMENSION (parallel to the shaft axis) whose extension lines start at the spline end face and at the thin end-of-working-length LINE", "Second DIMENSION chained (tail length) or from the same origin (overall length) to the thin tail-end LINE", "Thin LINEs perpendicular to the axis (end of working length, end of tail) and a thin oblique LINE at about 30° (tail)"]
recognition = "锚点为外花键视图（大径粗实线、小径细实线，并有花键标记或断面齿形）；找垂直于轴线的细实线（工作长度终止端、尾部末端）和约30°的细斜线（尾部）。与这些细线端点关联的线性尺寸即花键长度：只有一个尺寸为工作长度；另一尺寸与之首尾相接（链式）为工作长度+尾部长度，与之同一起点（基准式）为工作长度+全长。与螺纹长度区分：螺纹终止线为粗实线，螺纹段有M标记；与键槽长度区分：键槽为局部长圆形槽。"
confusions = ["螺纹长度标注：终止线为粗实线，长度不含螺尾。", "键槽长度：键槽为长圆形局部槽，不是全周花键。", "普通轴段长度：起止为粗实线台阶。"]
related = ["DC-G3-040", "DC-G3-092", "DC-G3-085", "DC-G3-089", "DC-G4-139", "DC-G4-012"]
priority = "medium"
text_forms = []
knowledge_units = ["K13", "K35"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.3-2000 第4.1.5条b)（图5～图7）及第4.1.3条（终止端、尾部细实线，30°）。链式/基准式区分方法为识别推断。"
