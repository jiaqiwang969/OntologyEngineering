[[concepts]]
id = "DC-G4-063"
name = "图样特定缺省尺寸规范的注法"
aliases = []
group = "G4"
kind = "note"
meaning = "在标题框内或附近声明整张图样的尺寸缺省规范操作集，使所有尺寸默认采用指定规范（如最小二乘尺寸、包容要求），而不是ISO缺省的两点尺寸（线性）或两线角度尺寸（角度）。"
components = ["线性尺寸：'线性尺寸 GB/T 38762'后接选定的规范修饰符，如GG、Ⓔ、(CC)", "角度尺寸：'角度尺寸 GB/T 38762.3'后接修饰符，如LG", "两者同时变更时分两行书写，用'线性尺寸'/'角度尺寸'前缀区分", "图中用到的其他修饰符可在缺省规范之后的括号中列出，便于读图"]
variants = ["linear default", "angular default", "combined linear + angular", "'GB/T 38762 Ⓔ' making envelope the default"]
dxf_forms = ["TEXT/MTEXT near or inside the title block: '线性尺寸 GB/T 38762 GG'; Ⓔ as circled letter or CIRCLE + TEXT", "ATTRIB value of a title-block INSERT"]
