[[concepts]]
id = "DC-G6-072"
name = "要求去除材料的扩展图形符号"
aliases = ["去除材料扩展图形符号", "去除材料表面符号"]
group = "G6"
kind = "symbol"
meaning = "在基本符号的V形开口处加一短横、使两斜边与短横围成三角形的符号，表示该表面应采用去除材料的方法（如车、铣、磨、钻）获得。"
components = ["两斜边与基本符号相同；短横平行于被注表面，连接短边上端与长边上同高的点，围成等边三角形，长边继续伸出。", "三角形高等于短边竖高（≈1.4h），长边伸到约3h；加横线后成为完整符号（文本写MRR）。", "单独使用时可表示“被加工表面”。", "GB/T 131-1993：基本符号加一短划，例举车、铣、钻、磨、剪切、抛光、腐蚀、电火花、气割等。", "区域法版本另加小菱形；ISO 21920-1草案只以完整符号“应去除材料”的形式出现。"]
variants = ["GB/T 131-2006 扩展图形符号 (text form MRR)", "GB/T 131-1993 基本符号加一短划 (turning, milling, grinding, EDM, flame cutting etc.)", "standing alone it may mean '被加工表面' (B.1.2)", "areal version with diamond (GB/T 33523.1)", "ISO 21920-1 draft: only as complete symbol b) 应去除材料"]
dxf_forms = ["INSERT of a 3- or 4-LINE block: short leg, long leg, closing stroke (and bar for the complete form); value via ATTRIB or adjacent TEXT", "exploded: closed triangle (3 LINEs or a closed LWPOLYLINE) plus the longer LINE continuing the right side", "triangle not filled (no SOLID/HATCH); a filled triangle points to a datum feature or arrowhead instead", "proxy or anonymous block (MRR type) from mechanical add-ons after DWG→DXF"]
recognition = "锚点：基本符号两斜边；再找一条与被注表面平行的短线，两端分别落在短边上端和长边上，围成边长约1.6h的等边三角形，长边从三角形一角继续延伸到约3h。三角形未填充，开口方向背离表面。区分基准三角形（等腰、底边贴在轮廓上、常涂黑，经连线接字母方框）；区分旧式▽光洁度符号（倒置等边三角形，无长边伸出，与级别数字连用）；区分尺寸箭头（细长、实心）。"
confusions = ["基本图形符号：开口处无短横", "不去除材料符号：开口内为小圆而非短横", "基准要素标识的三角形：底边贴轮廓，常涂黑，并连字母方框", "旧式▽光洁度符号：倒置等边三角形，无长边伸出（来源未涉及）", "尺寸箭头：细长、通常实心"]
related = ["DC-G6-071", "DC-G6-069", "DC-G6-063", "DC-G6-068", "DC-G6-076", "DC-G6-003", "DC-G5-009"]
priority = "high"
text_forms = ["MRR Ra 0.8（文本中）"]
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "Old ▽ finish marks predate the sources and are mentioned from general knowledge only."
