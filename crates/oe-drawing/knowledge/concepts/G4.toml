[[concepts]]
id = "DC-G4-035"
name = "轴测图角度尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "轴测图上标注角度时，尺寸线画成与所在坐标平面相应的椭圆弧，角度数字一般写在尺寸线的中断处，字头向上。"
components = ["尺寸线：位于对应坐标面内的椭圆弧（正圆弧的轴测投影），中心在角顶点。", "尺寸界线：沿角两边方向，即轴测图中的两条棱线或其延长线。", "角度数字：写在椭圆弧中断处，字头向上。", "分为水平面内的角度和垂直面内的角度两种情形（图20a、b）；1984版第3.3条与2013版第6.3条规定相同。"]
variants = ["horizontal-plane angle", "vertical-plane angle"]
dxf_forms = ["ELLIPSE entity with partial start/end parameters as the dimension line, plus SOLID or INSERT arrowheads", "TEXT '30%%d' upright (rotation 0) placed in the gap of the elliptical arc", "rarely a DIMENSION entity, because angular dimensions in CAD draw circular arcs; usually exploded geometry", "layer 08 or template dimension layer"]
recognition = "锚点为带°的文字，其附近有细实线的部分椭圆（ELLIPSE起止参数不为完整一周，或样条近似），椭圆中心位于两条棱线交点，两端箭头分别触及两条棱线；文字直立放在弧中断处。与椭圆轮廓区分：轮廓为粗实线、无箭头和数字；与二维角度尺寸区分：二维为正圆弧（ARC或角度DIMENSION）。"
confusions = ["二维角度尺寸：尺寸线是正圆弧。", "轴测圆的椭圆轮廓：粗实线，无箭头、无角度文字。", "椭圆弧上的弧长注法：数字前有⌒，单位为长度。"]
related = ["DC-G4-032", "DC-G4-033", "DC-G4-034", "DC-G2-087"]
priority = "rare"
text_forms = ["30°", "60°"]
knowledge_units = ["K11", "K12", "K13", "K10"]
