dxf_forms = ["INSERT of a block: legs + bar (+ closing stroke or CIRCLE) + diamond; requirement TEXT/ATTRIB under the bar", "exploded LINE strokes + TEXT on layer 08/11 (GB/T 14665)", "process TEXT above the bar, lay letter beside the V"]
recognition = "锚点：完整符号判据加菱形判据；横线下文字以S-L、S-F开头或参数代号以S、V开头时可确认区域法。普通零件图上罕见，应验证整行规范。区分轮廓法完整符号（无菱形，参数R、W、P开头）和草案轮廓法完整符号（附加横杠）。"
confusions = ["轮廓法完整符号：没有菱形，参数R、W、P开头", "ISO 21920-1草案完整符号：附加一条横杠，无菱形"]
