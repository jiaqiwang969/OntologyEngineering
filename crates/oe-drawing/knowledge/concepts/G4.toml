variants = ["定形尺寸", "定位尺寸", "总体尺寸"]
dxf_forms = ["no dedicated DXF form: ordinary DIMENSION entities (dimtype 0/1/3/4) or exploded LINE/SOLID/TEXT", "the class must be derived from geometry (which features the extension lines touch); nothing is stored in the file"]
recognition = "无独立图形锚点。对每个尺寸找到其两条界线所接的几何要素：两端都在同一形体（同一孔圆、同一凸台、同一槽）上→定形；一端在尺寸基准（对称中心线、底面、主要端面）、另一端在某形体中心或表面→定位；两端为整个视图外轮廓的最外边界、数值最大且位于最外层→总体。需要先完成形体分解和尺寸基准识别。与装配图五类尺寸区分：后者按装配功能分类且只在装配图上。"
confusions = ["装配图尺寸类别（规格、装配、安装、外形、其他重要尺寸）：分类依据和适用图样不同", "尺寸基准：是起算要素，不是尺寸类别"]
related = ["DC-G4-031", "DC-G4-076", "DC-G4-075", "DC-G9-013"]
