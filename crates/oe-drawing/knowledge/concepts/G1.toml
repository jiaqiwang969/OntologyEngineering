[[concepts]]
id = "DC-G1-018"
name = "基准线（指引线的参考线）"
aliases = []
group = "G1"
kind = "line"
meaning = "与指引线末端相连的水平或竖直细实线，在其上方或旁边注写说明文字；此处“基准线”指参考线，不是几何公差的基准。"
components = ["细实线，水平或竖直，接在指引线指向注释的一端。", "长度为固定的6 mm，或与注释文字同长。", "注释优先写在基准线上方，相距约两倍线宽，不得接触基准线。", "指引线本身水平或竖直时注释顺指引线方向写，不适用时可省略基准线；特定应用中必须画出。"]
variants = ["固定长度 6 mm", "与注释说明等长", "省略基准线（指引线本身水平或竖直时）"]
dxf_forms = ["LEADER entity whose last segment is horizontal (hook line/landing) with associated MTEXT", "MULTILEADER (MLEADER) with a landing (dogleg) of about 6 mm", "QLEADER result: LEADER + MTEXT", "exploded: oblique LINE + horizontal LINE + TEXT above it", "GB add-ons (e.g. CAXA 引出说明) export as LINEs + TEXT"]
recognition = "锚点为文字（TEXT/MTEXT），其底边下方约0.5~1.5 mm 处有一条水平细线，线长≈6 mm 或≈文字宽度；线的一端与一条斜细线（指引线）端点相连。判据：文字底边到线的距离小于字高的一半；线长与文字宽相近；斜线与水平线夹角大于15°。与尺寸线（两端有终端、跨两条尺寸界线）、文字下划线（MTEXT \\L 格式，无连接斜线）、焊缝基准线（实线+虚线并列，挂焊缝符号）区分。"
confusions = ["尺寸线：两端有箭头或斜线，与尺寸界线垂直相接。", "几何公差基准：基准字母方框加涂黑或空心三角形，含义完全不同。", "文字下划线：无指引线相连。", "焊缝符号的基准线：可带平行虚线，承载焊缝符号。"]
related = ["DC-G1-028", "DC-G1-080", "DC-G1-111", "DC-G1-094", "DC-G7-109", "DC-G8-024"]
priority = "high"
text_forms = ["4×Ø8", "M20×2LH-6H", "C1"]
knowledge_units = ["K03", "K52", "K55", "K24"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 24745 表3 同时列有“参考线”和“基准线”；MLEADER 等存储形式为通用 CAD 实践。"
