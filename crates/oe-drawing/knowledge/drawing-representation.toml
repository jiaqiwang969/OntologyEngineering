[[cards]]
id = "drawing_sheet"
expression_kind = "sheet_frame"
title = "一张图纸：图框与其中的标题栏"
meaning = "每张图样都有自己的图框，标题栏在图框右下角；一个模型空间可以并排放几张图纸。视图、视图编号、尺寸终端的配对都在一张图纸之内，不跨图纸。图号相同的两张图纸是同一图样的两个版本：标题栏日期较晚、并有同一日期的更改说明（常写在图框外）的一张是现行版本，取代日期较早的一张。"
sources = [
  "GB/T 14689-2008 技术制图 图纸幅面和格式 4 图框格式",
  "GB/T 10609.1-2008 技术制图 标题栏（标题栏位于图框右下角；签字区的年月日）",
  "机械制图（第7版）§1-1 图纸幅面、图框格式和标题栏",
]
knowledge_units = ["K03", "K61"]
recognition = "以图幅边框图块为锚（规则 sheet_size_rectangular_border 所读的图框）：其中有标题栏的图框是一张图纸。模型空间里有两张以上时，每个视图、每个图纸级表达归它所在的图纸，视图编号前加“sheet-n:”；只有一张时不加前缀。尺寸的两个终端不在同一张图纸时不配对。各图纸标题栏中的图号与日期（八位数字年月日，或以分隔符分开的年、月、日）相同图号时，日期较晚、且图框外有写同一日期的说明的图纸取代较早的图纸，记为图纸的依据。"
markers = []
concepts = ["DC-G1-085", "DC-G9-028"]

