[[concepts]]
id = "DC-G2-043"
name = "剖切符号"
aliases = []
group = "G2"
kind = "symbol"
meaning = "指示剖切面起、迄和转折位置（粗短画）及投射方向（箭头）的符号，旁注字母，与剖视图或断面图的名称“X—X”对应。"
components = ["粗短画：粗实线短段，位于剖切面的起点、终点和转折处，尽量不与轮廓线相交。", "箭头：画在起、迄粗短画的外端，与粗短画垂直，指向投射方向。", "字母：大写拉丁字母（GB/T 17452也允许阿拉伯数字），水平书写在粗短画或箭头外侧；转折处也注，位置有限时可省。", "剖切线：粗短画之间的细点画线，可省略。", "省略：按投影关系配置且中间无隔开时可省箭头；GB未采用ISO箭头指向剖切线的画法。"]
variants = ["with arrows", "without arrows (section in projection relation)", "letters or Arabic numerals", "ISO form with arrows pointing at the cutting line not adopted in GB/T 17452", "省略箭头（按投影关系配置）", "省略转折处字母"]
dxf_forms = ["Thick strokes as LINE on layer 01 (or LWPOLYLINE with constant width 0.5–1.0), about 5–10 mm long on paper", "Arrow as LINE/LWPOLYLINE shaft + SOLID or tapered-width LWPOLYLINE head, or LEADER/QLEADER with arrowhead", "INSERT of a cutting-symbol block from mechanical add-ons (CAXA, GstarCAD, AutoCAD Mechanical); may arrive as anonymous *U block or proxy entity", "Letter as TEXT/MTEXT on layer 11, upright whatever the stroke direction", "Optional cutting line: LINE on layer 05 with CENTER-type linetype"]
recognition = "以成对或成组的短粗线段为锚点：线宽同粗实线，长度约1～3倍字高，位于视图轮廓外侧或跨轮廓边，两两共线（或经直角、斜角转折相接）构成一条穿过视图的剖切路径；起、迄段外端连有与之垂直的箭头；近旁有单个大写字母，且同字母在别处以“X—X”出现在一个剖视或断面图上方。向视图箭头没有粗短画；尺寸箭头成对位于尺寸线两端并带数值；焊缝指引箭头连基准线和焊缝符号。"
confusions = ["向视图箭头：只有箭头和字母，没有粗短画。", "剖切线：只有细点画线。", "尺寸箭头：位于尺寸线两端，有数值。", "焊缝指引箭头：连接基准线和焊缝符号。", "粗点画线（限定范围）：是长线而非短画。"]
related = ["DC-G1-007", "DC-G1-008", "DC-G2-065", "DC-G2-066", "DC-G2-067", "DC-G2-072", "DC-G2-015", "DC-G2-016", "DC-G2-032"]
priority = "high"
text_forms = ["A", "B", "1"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = ["view_callout", "view_mark_targets", "view_member_relations"]
recognizer = "partial"
seen_on_drawing = ["second"]
expert_checked = false
notes = "粗短画长度、箭头与块的存储方式为一般 CAD 实践。已在第二张图上出现。"
