[[constraints]]
id="release_distribution_identity_and_atomic_selection"
requirement="req_delivery"
module="dist"
check="verify"
rust_path="crates/oe-dist/src/release_macos.rs"
statement="发行外壳与skill公开源码身份分离；完整清单绑定七程序和当前源码，显式新根接收、原子本机选择、对前版本重核后回退。私有来源不分发，工程与方法治理继续原owner；当前记录变化需显式预期摘要，不静默覆盖，未知平台拒绝。"
severity="error"

[[constraints]]
id="release_source_assembly_preserves_private_boundary"
requirement="req_delivery"
module="dist"
check="assemble"
rust_path="crates/oe-dist/src/release_build.rs"
statement="复用原分发闭包与隐私检查，只复制显式公共清单和固定七个程序；安装根公开源与编译捕获一致，原根私有目录不复制，准备失败不发布不完整发行。"
severity="error"

[[validations]]
id="release_install_and_atomic_activation_roundtrip"
module="dist"
constraint="release_distribution_identity_and_atomic_selection"
behavior="release_install_and_atomic_activation_roundtrip"
rust_path="crates/oe-dist/tests/release.rs"
oracle="新根安装、首次启用、带预期身份升级及回退保留对应字节；陈旧预期、篡改、额外文件、链接与已有目标拒绝，旧选择不变"
scope="macOS发行事务及本机选择；不代表NX原生或工程采用"

[[validations]]
id="release_cli_manifest_and_transaction_failures"
module="cli"
constraint="release_distribution_identity_and_atomic_selection"
behavior="release_cli_manifest_and_transaction_failures"
rust_path="crates/oe-cli/tests/release_cli.rs"
oracle="实际CLI完整verify/install/init/activate/status/rollback接线和错误退出，拒绝错误摘要且不泄露私有路径"
scope="macOS CLI发行事务；完整原生及实物验收另行保持"

[[validations]]
id="release_public_inventory_includes_runtime_and_excludes_private"
module="cli"
constraint="release_source_assembly_preserves_private_boundary"
behavior="maintain_manifest_covers_new_runtime_and_entry_contract_without_private_roots"
rust_path="crates/oe-cli/tests/release_cli.rs"
oracle="实际CLI完整列出runtime新增文件及ENTRY-CONTRACT-DETAILS，逐项SHA/bytes一致；var/.git和sources中非公开README的私有资料及其悬空链接不采集"
scope="发行装配的公共输入闭包；装配隐私检查和真实安装由另行发布接收证明，非本反例执行范围"

[[constraints]]
id="release_sources_public_readme_only"
requirement="req_delivery"
module="dist"
check="package_skill"
rust_path="crates/oe-dist/src/package.rs"
statement="sources/ is the private original-library root for books, supplier originals and indexes. Only exact sources/README.md is a public distribution input; nested or case-variant README paths and every other sources payload refuse. Portable manifests, release assembly and platform release checks use the same exception. Installed trees may hold unlisted local source data without reading its content; a listed README remains hash-bound, required and non-symlinked. Distribution installation still refuses private payloads. Historical manifests that never listed the README retain their existing private sources meaning."
severity="error"

[[validations]]
id="release_sources_public_readme_transport"
module="dist"
constraint="release_sources_public_readme_only"
behavior="only_public_sources_readme_is_transported_with_local_library_present"
rust_path="crates/oe-dist/tests/package.rs"
oracle="The actual shared release inventory and ZIP transport include only the exact public README while books, supplier data, nested README files, indexes and private dangling links remain excluded. Explicit forged inventories cannot distribute those private originals."
scope="Bounded native transport with owned fixtures; no source-content applicability or engineering adoption claim."

[[validations]]
id="release_sources_public_readme_mac_installation"
module="dist"
constraint="release_sources_public_readme_only"
behavior="installed_sources_are_private_but_public_readme_remains_verified"
rust_path="crates/oe-dist/tests/release.rs"
oracle="An installed macOS release accepts changed local source originals, refuses redistributing them and rejects missing, symlinked or changed public README bytes. Older manifests without this public file continue to ignore local source contents."
scope="macOS release software boundary only; Windows and engineering acceptance require their own evidence."

[[validations]]
id="release_sources_public_readme_windows_installation"
module="dist"
constraint="release_sources_public_readme_only"
behavior="windows_installed_sources_are_private_but_public_readme_remains_verified"
rust_path="crates/oe-dist/tests/release_windows.rs"
oracle="The Windows release owner preserves native ACL/reparse rules while allowing installed local source data, refusing its redistribution and rejecting missing, linked or changed public README bytes. Historical unlisted local README files remain private."
scope="Windows native test definition; another platform's pass does not supply Windows execution evidence."

[[constraints]]
id="code_sources_readme_manifest_domain"
requirement="req_code_evolution"
module="code_evolution"
check="public_manifest_matching"
rust_path="crates/oe-evolution/src/lib.rs"
statement="New source captures use an explicit ten-key SourceReadmeDerived32 domain with public_sources exactly [sources/README.md], retaining the existing derived-model resource limits. The shared code_identity owner inventories only that exact regular file under sources and never reads private sibling contents. Historical nine-key CurrentDerived32 and seven-key Legacy16 domains retain their original whole-sources exclusion, byte limits and serialized identities. Full manifests select only their exact known shape; digest-only CodeBinaryRef checks may re-observe the three fixed domains without rewriting the expected digest. Unknown exceptions, caller limits and actual public byte/mode/membership changes refuse."
severity="error"

[[validations]]
id="code_sources_readme_private_and_historical_domains"
module="code_evolution"
constraint="code_sources_readme_manifest_domain"
behavior="sources_readme_is_public_only_in_new_profile_and_private_bytes_stay_excluded"
rust_path="crates/oe-evolution/tests/public_manifest_profiles.rs"
oracle="Independent literal seven/nine-key expected manifests and digest-only binary references remain unchanged when a local README is added or changed. The new ten-key capture binds that README and rejects its mutation/removal while changes to books, supplier originals, nested README files, indexes and private links do not affect public identity."
scope="Bounded source identity and compatibility; not executable behavior or engineering qualification."

[[validations]]
id="code_sources_readme_exact_regular_entry"
module="code_evolution"
constraint="code_sources_readme_manifest_domain"
behavior="source_readme_exception_requires_exact_name_and_regular_file"
rust_path="crates/oe-evolution/tests/public_manifest_profiles.rs"
oracle="Case-variant README names remain private, README directories are never traversed, and new-domain README/root symlinks refuse. Historical digest-only references still observe their unchanged whole-sources exclusion even when the new domain refuses that local README."
scope="Owned filesystem counterexamples; no claim of source-content privacy classification or engineering adoption."


[[constraints]]
id="release_windows_acl_identity_and_atomic_selection"
requirement="req_delivery"
module="dist"
check="verify"
rust_path="crates/oe-dist/src/release_windows.rs"
statement="Windows x64发行使用显式manifest/2与固定七.exe，mode必须为0且不冒充Unix权限。新stage、安装根和选择库具有受保护DACL，仅当前用户、SYSTEM及Administrators受信；源仅只读核对。清单、目录和文件绑定本地卷/文件身份、拒绝重解析和多硬链接，并核完整有序命名空间、大小及SHA。安装不覆盖已有根；非阻塞锁、预期current摘要和原子提交保持旧选择及回退，失败记录和未知保持。不授予全Windows/native/工程采用。"
severity="error"

[[constraints]]
id="release_windows_portable_source_closure"
