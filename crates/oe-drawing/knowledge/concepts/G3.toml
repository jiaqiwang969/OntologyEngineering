[[concepts]]
id = "DC-G3-218"
name = "中心孔标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "标准中心孔在图样上的规定标记，写明标准编号、型式（R弧形、A不带护锥、B带护锥、C带螺纹）和主要尺寸，与中心孔保留要求符号或指引线一起注在轴端，代替画出中心孔结构。"
components = ["R、A、B型：标准编号“GB/T 4459.5-”+型式字母+导向孔直径D+“/”+锥孔端面直径D1，如GB/T 4459.5-B2.5/8。", "C型：标准编号-C+螺纹代号（M与公称直径）+L与螺纹长度+“/”+锥孔端面直径D2，如GB/T 4459.5-CM10L30/16.3。", "中心钻按中心孔标准GB/T 145选择；D与D1、D2的对应值见中心孔尺寸值表。", "标记写在要求保留/不允许保留符号右侧，或可以保留时写在指引线基准线上；简化时可省标准编号并在前加数量，如2×R3.15/6.7。", "旧图（含教材习题图）中常见“中心孔B6 GB/T 145—2001”一类按GB/T 145写的形式。"]
variants = ["R型", "A型", "B型", "C型（带螺纹）", "B 型"]
dxf_forms = ["TEXT/MTEXT on layer 11 placed right of the centre-hole symbol (exploded LINEs or block INSERT), or on a LEADER/MULTILEADER reference line from the shaft end face", "Standard number sometimes split onto a second TEXT line under the reference line", "In CAXA/GstarCAD symbol libraries the designation may be ATTRIB text of the centre-hole symbol INSERT"]
recognition = "锚点为文字正则 (GB/?T\\s?4459\\.5\\s?[-—]\\s?)?(\\d+\\s?[×xX]\\s?)?(([RAB])\\s?(\\d+(\\.\\d+)?)\\s?/\\s?(\\d+(\\.\\d+)?)|C\\s?M\\d+(\\.\\d+)?\\s?L\\d+(\\.\\d+)?\\s?/\\s?\\d+(\\.\\d+)?)，旧式补充 中心孔\\s?[RABC]\\s?\\d+(\\.\\d+)?。位置：文字左端靠近轴类零件端面与轴线交点处的符号顶点或引线终点（距离约1倍字高内）。合法性：D1>D且R/A型D1/D约2.1、B型约2.8~3.2，或查中心孔尺寸值表。字高应与图上尺寸数字一致。"
