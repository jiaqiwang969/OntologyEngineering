[[concepts]]
id = "DC-G2-066"
name = "剖视图标注的省略"
aliases = []
group = "G2"
kind = "text_convention"
meaning = "剖视图在一定条件下可省略部分或全部标注：按投影关系配置且中间无其他图形隔开时省略箭头；单一剖切平面通过机件对称面或基本对称面且按投影关系配置、中间无隔开时不必标注；单一剖切位置明确的局部剖视不必标注。"
components = ["省箭头：剖切符号只有粗短画和字母，剖视图仍有名称。", "完全省略：无剖切符号、无名称，剖视图与另一视图按投影关系对齐。", "局部剖视：剖切位置明确时不标注。"]
variants = ["arrows omitted", "label omitted entirely", "local section unlabelled"]
dxf_forms = ["Absence of entities: cutting strokes without arrows, or no strokes/label at all; detectable only through alignment between view clusters"]
recognition = "这是判断规则而非可见符号。剖视图没有名称时，检查它是否与另一视图按投影关系对齐（共享水平或竖直方向的外形坐标）、中间无其他视图、且另一视图中对应的对称中心线贯穿；满足则判为完全省略标注的剖视。剖切符号无箭头时须满足投影关系配置。条件不满足而缺标注，应报“缺标注”，不自动补推。"
confusions = ["缺漏标注：图纸缺陷。", "外形视图：没有剖面线。"]
related = ["DC-G2-043", "DC-G2-065", "DC-G2-067", "DC-G2-071", "DC-G2-023", "DC-G2-020"]
priority = "high"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
