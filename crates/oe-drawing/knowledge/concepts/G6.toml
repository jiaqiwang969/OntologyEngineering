[[concepts]]
id = "DC-G6-046"
name = "表面结构参数代号与极限值的注写"
aliases = ["幅度参数 Ra / Rz 注写", "表面结构参数注写规则"]
group = "G6"
kind = "surface_indication"
meaning = "规定横线下方参数代号和极限值的写法：代号（轮廓字母R、W、P加特征字母）后空一格写以微米计的数值，多项要求逐行叠写。"
components = ["2006版：代号与数值之间必须留空格（Ra 0.8、Rz 3.2）；默认的上限、16%规则、5个取样长度和默认传输带都不写出。", "可在代号前加传输带（如0.0025-0.8/）和U/L，在代号后加取样长度个数（Rz3）或max（Ramax）。", "多项要求分行写在a、b及其下方，每项一行。", "1993版：Ra可只写数值不写代号；Ry、Rz须写代号并紧接数值（Ry3.2、Rz200），上下限值上下叠写。", "区域法（GB/T 33523.1）代号与数值间用双空格；ISO 21920-1草案数值紧跟代号后以空格分隔，首行参数决定缺省设置。"]
variants = ["GB/T 131-2006: space between code and value is mandatory", "GB/T 131-1993 表3: Ry/Rz codes written before the value (e.g. Ry3.2, Rz200); Ra usually without code (separate entry)", "GB/T 33523.1: double space between areal code and value", "ISO 21920-1 draft: limit directly after code separated by a space; first line determines default settings", "Ra", "Rz", "Ra 与 Rz 同时（两行）", "max", "U/L", "传输带 0.0025-0.8/", "取样长度个数 Ra3"]
dxf_forms = ["TEXT 'Ra 3.2' as one entity; on older or careless drawings 'Ra3.2' without a space", "two TEXT entities 'Ra' and '3.2' placed side by side", "ATTRIB holding only the value (e.g. '3.2') while 'Ra' is fixed TEXT inside the block definition", "MTEXT with \\P for stacked lines, or two TEXT entities ≈1.5h apart", "1993-style subscript code: 'R' + smaller TEXT 'a'/'y'/'z' offset downward"]
recognition = "锚点：完整符号横线下方、左端紧靠长边的文字。词法近似为：可选“U ”或“L ”，可选传输带“数-数/”或“-数/”，代号[RWP][a-zA-Z]{1,3}（可带数字和max），空格，数值\\d+(\\.\\d+)?。块属性只有数值时，代号在块定义的固定TEXT中，需合并。区分半径尺寸R0.8（R后直接数字、附着尺寸线或圆弧）、管螺纹Rc/Rp（后接分数尺寸代号）、尺寸公差（带±或叠写偏差）、标题栏附近的注释文字。"
confusions = ["半径尺寸R0.8：R后直接为数字，附着尺寸线或圆弧", "管螺纹Rc1/2、Rp3/4：后接分数尺寸代号", "尺寸公差文字：含±、上下偏差或公差带代号", "1993版只注数值的代号：无参数代号，数值在V形开口上方"]
related = ["DC-G6-075", "DC-G6-045", "DC-G6-013", "DC-G6-030", "DC-G6-021", "DC-G6-056", "DC-G6-027", "DC-G6-073", "DC-G6-074", "DC-G3-215"]
priority = "high"
text_forms = ["Ra 0.8", "Rz 3.2", "Ra 1.6 / Rz 6.3（两行）", "Rz3 6.3", "Ry3.2（1993）", "Rz200（1993）"]
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "The lexical pattern is a recognition aid, not from the sources. A missing space ('Ra3.2') is common in practice although GB/T 131-2006 requires it."
