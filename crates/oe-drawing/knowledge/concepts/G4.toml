[[concepts]]
id = "DC-G4-087"
name = "坐标网格法尺寸（印制板类）"
aliases = []
group = "G4"
kind = "simplified_representation"
meaning = "印制板一类的平板零件不逐个标注尺寸，而用带刻度编号的坐标网格表示，孔、焊盘和轮廓的位置直接按网格坐标读取。"
