[[concepts]]
id = "DC-G6-073"
name = "表面粗糙度参数数值系列表"
aliases = []
group = "G6"
kind = "table"
meaning = "GB/T 1031规定的表面粗糙度参数优选数值和取样长度系列；图上注写的数值通常取自这些系列，因此可用来校验识别出的数值是否合理。"
components = ["Ra系列（μm）：0.012、0.025、0.05、0.1、0.2、0.4、0.8、1.6、3.2、6.3、12.5、25、50、100。", "Rz系列（μm）：0.025、0.05、0.1、0.2、0.4、0.8、1.6、3.2、6.3、12.5、25、50、100、200、400、800、1600。", "Rsm系列（mm）0.006–12.5；Rmr(c)系列10%–90%，c值用μm或Rz的百分数（5%–90%）。", "取样长度lr（mm）：0.08、0.25、0.8、2.5、8、25；Ra、Rz值与lr及评定长度ln=5lr的对应表（如Ra大于0.1至2.0对应lr 0.8、ln 4.0）。", "不能满足要求时可选附录A补充系列；GB/T 10610给出按Ra、Rz、Rsm估值选取截止波长的规则。"]
variants = ["GB/T 1031-2009 表1-表7 (supplementary series in 附录A)", "GB/T 10610-2009 表1-表3 for cut-off selection"]
dxf_forms = ["not drawn as a table on part drawings; values appear as TEXT/ATTRIB numbers inside codes", "may appear as preset values in company roughness-block attribute prompts or tool palettes — general practice", "on old drawings, values without code (1993 Ra numbers) still follow the Ra series"]
recognition = "用作识别后的校验：从代号中解析出的Ra、Rz数值应属于系列（允许补充系列时放宽）；1993版只注数值的代号若数值属于Ra系列，可信度提高；取样长度数值应属于lr系列。不在系列中的数值可能是尺寸、加工余量或识别错误。"
confusions = ["一般公差表：属于尺寸公差", "配合表：属于极限与配合"]
related = ["DC-G6-046", "DC-G6-027", "DC-G6-028", "DC-G6-013", "DC-G6-061", "DC-G6-045"]
priority = "medium"
text_forms = ["0.8", "1.6", "3.2", "6.3", "12.5", "25"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The table itself does not appear on drawings; priority reflects how often its values are used for validation."
