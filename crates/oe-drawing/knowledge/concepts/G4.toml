[[concepts]]
id = "DC-G4-088"
name = "孔的旁注法"
aliases = []
group = "G4"
kind = "simplified_representation"
meaning = "各类孔（光孔、螺孔、沉孔、埋头孔、锪平孔）用指引线引出，在基准线上下以“数量×孔径”加深度↧、沉孔/锪平⌴、埋头孔⌵等符号写出孔的全部尺寸，代替在剖视中逐项标注。"
components = ["指引线：细实线；在非圆视图中从孔轴线与端面的交点引出（无箭头），在圆视图中以箭头指向孔的圆周", "基准线：与指引线相连的水平细实线，第一行文字写在其上方，第二行写在下方或第一行之下", "第一行：数量×孔径与深度，如 4×Ø4↧10、8×Ø6.4、4×M6↧8", "第二行：⌴Ø12↧4.5（沉孔，有深度）、⌴Ø20（锪平，无深度）、⌵Ø10×90°（埋头孔，直径×锥角）", "符号比例（教材）：线宽h/10；深度符号横竖各长h、两斜线夹角60°；埋头符号90°、斜线高h；沉孔/锪平符号宽2h、高h", "简化前（旧式）：在剖视中分别标注直径、深度、锥角，计数写成“4-Ø4”，或用“深”“沉孔”“锪平”字样"]
variants = ["blind hole with depth", "countersunk hole", "counterbored hole", "spotfaced hole", "older word-form notes (深, 沉孔, 锪平) as pre-simplification forms", "注在轴线视图上", "注在圆视图上", "带 '通孔' 字样"]
dxf_forms = ["LEADER or MULTILEADER (arrowhead on the circular view, none on the axial view) with a two-line MTEXT", "exploded: LINE leader + horizontal LINE reference line + one TEXT per row", "symbols as gdt.shx characters in MTEXT, e.g. '{\\Fgdt;x}' depth, '{\\Fgdt;v}' counterbore, '{\\Fgdt;w}' countersink, or Unicode \\U+21A7 / \\U+2334 / \\U+2335", "symbols as small INSERT blocks or exploded LINE strokes placed between TEXT fragments", "count prefix written as '4×', '4X', '4x' or old '4-'; Ø as %%c, Φ or φ", "CAXA hole-callout objects may arrive as anonymous blocks or ACAD_PROXY_ENTITY"]
recognition = "锚点：以“n×”（或旧式“n-”）开头并含Ø/M的文字，其下沿紧贴一条水平细线（基准线，长度≈文字宽度），基准线一端接一条斜向细线。追踪斜线末端：落在CIRCLE圆周且有箭头→圆视图旁注；无箭头且端点落在孔轴线（点画线）与端面轮廓交点→非圆视图旁注。第二行查找⌴（凵形，宽约2h高约h）、⌵（90°V形高约h）和↧（竖线带横线、高约h）；注意SHX符号在DXF中可能显示为普通字母x/v/w，需看文字样式字体是否为gdt类。与螺纹标记区分：M开头且含螺距/公差带；与零件序号区分：序号指引线末端为圆点、数字无Ø；与表面结构、几何公差指引线区分：其基准端接符号或框格。"
confusions = ["螺纹标记（M10-7H 等）：以螺纹代号为主体，可与旁注结合但含义不同", "零件序号指引线：末端圆点，横线或圆圈上只有序号数字", "表面结构指引线：末端接√形符号", "几何公差指引线：连接公差框格", "普通直径尺寸：有尺寸线和两端箭头，无“n×”及孔结构符号"]
related = ["DC-G4-052", "DC-G4-051", "DC-G4-045", "DC-G4-094", "DC-G4-023", "DC-G1-018"]
priority = "high"
text_forms = ["4×Ø4↧10", "6×Ø6.5 ⌵Ø10×90°", "8×Ø6.4 ⌴Ø12↧4.5", "4×Ø8.5 ⌴Ø20", "4×M6↧8", "4-Ø4（旧式）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K39"]
