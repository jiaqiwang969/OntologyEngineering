recognition = "以文字为锚点：前缀为型材符号或字母代号，中间是若干个用×连接的尺寸，可夹标准编号（GB/T数字），末尾用短画接一个较大的长度数值。几何验证：文字旋转角与附近一条长构件线（单线简图或双线轮廓）平行，相距约1～2个字高；在明细栏中出现时位于名称/规格栏。区分零件序号：序号是带指引线的单个数字；区分尺寸数字：依附尺寸线，无×链和末尾长度段；区分螺纹紧固件标记：以螺纹规格M…开头。"
