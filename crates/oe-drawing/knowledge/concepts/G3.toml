recognition = "锚点为文字正则 \\bNPT\\s?\\d*(\\s?\\d/\\d|/\\d+)?(-LH)?\\b；位于引线基准线上，引线指向锥螺纹或管接头螺纹段。字母组合NPT很少与其他符号冲突，主要防止与说明文字中的英文缩写混淆（需后接尺寸代号）。"
