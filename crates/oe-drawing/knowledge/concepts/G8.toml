[[concepts]]
id = "DC-G8-011"
name = "装配技术要求注语"
aliases = ["装配图技术要求"]
group = "G8"
kind = "note"
meaning = "装配图“技术要求”中用文字说明部件在装配、调试、检验和使用方面的要求，如装配前清洗、结合面接触检查、多螺钉拧紧顺序、轴承和齿轮装配后检查、涂润滑脂或密封胶、空载或压力试验等。"
components = ["标题“技术要求”，下面按1、2、3…编号逐条写出，只有一条时可不编号。", "装配前要求：零件清理和清洗、密封件浸油、管子去毛刺倒角、尺寸复查。", "装配过程要求：同一零件的多个螺钉交叉、对称、均匀拧紧，某处涂××润滑脂或密封胶，平键与键槽两侧均匀接触。", "装配后检查：结合面用××塞尺检查塞入深度、齿面接触斑点与侧隙、轴承用手转动灵活、空载运行平稳不漏油。", "试验：在××MPa压力下保持××min不渗漏，按某标准进行性能、寿命或可靠性试验。"]
variants = ["装配前清洗", "塞尺检查", "交叉对称拧紧", "涂润滑脂/密封胶", "接触斑点与侧隙"]
dxf_forms = ["MTEXT block on layer 11 whose first line is '技术要求', followed by numbered paragraphs, or one TEXT per line", "heading '技术要求' often a separate TEXT about one size larger, centred above the items"]
recognition = "以内容等于“技术要求”的文字为锚点，取其下方左对齐、行距约1.5倍字高的条目；判为装配类注语的依据是关键词：装配前、装配时、装配后、拧紧、塞尺、接触斑点、侧隙、啮合、涂…密封胶或润滑脂、空载试验、漏油、转动灵活、调试。同时图上有明细栏和零件序号（说明是装配图）。与零件图技术要求的区别：后者关键词是热处理、未注倒角或圆角、铸件、锻件、去毛刺、未注公差。"
confusions = ["零件图技术要求：针对单个零件的制造和检验，关键词不同，所在图上没有明细栏。", "明细栏备注：表格单元格内的短语，没有“技术要求”标题。", "焊接技术要求：关键词为焊缝、焊条、焊后处理，出现在焊接件图上。"]
related = ["DC-G9-002", "DC-G9-006", "DC-G9-007", "DC-G8-013"]
priority = "medium"
text_forms = ["技术要求", "装配前所有零件应清洗干净", "结合面用0.05mm塞尺检查不得塞入", "各螺钉应交叉、对称、均匀拧紧", "两齿轮轮齿的啮合面占齿长的3/4以上", "在××MPa压力下试验××min，不得渗漏"]
knowledge_units = ["K03", "K52", "K55", "K14", "K61", "K21", "K40"]
