components = ["基本符号：横置矩形套在轴线上，矩形内画一条连续波浪线（表示螺纹），构件粗线带实心楔斜接在矩形上方。", "可用符号：拱形螺母——倒U形轮廓两脚向外展开，其内有一小段圆弧，外侧另有一段同心圆弧，罩在轴上方。", "2013版条号5.1.3（表2），1984版2.1.3，图形一致。"]
variants = ["基本符号", "可用符号"]
dxf_forms = ["Closed LWPOLYLINE rectangle with an inner SPLINE, ARC chain or bulged LWPOLYLINE wave on layer 01; axis as LINE", "Link as inclined LINE with SOLID wedge", "Alternative arched nut as ARCs + LINE/SPLINE feet", "INSERT of a screw-pair library block"]
recognition = "锚点为被轴线贯穿的横置矩形，矩形内部有一条贯通的波浪线（由多段圆弧或样条组成，波峰数约2~4），矩形上接有带实心楔的构件斜线。与压缩/拉伸弹簧符号区分：弹簧为不带外框的锯齿线或波浪线，两端连在构件上；与螺杆传动符号区分：螺杆传动表示螺母类型（整体、开合、滚珠），附在轴上的是螺母符号而不是带构件斜线的矩形。"
confusions = ["机构简图弹簧符号：无外框矩形，锯齿或波浪线本身即弹簧。", "螺杆传动符号：表示整体螺母、开合螺母或滚珠螺母，侧重传动件。", "零件图上的螺纹画法：螺纹以粗、细实线成对表示，无波浪线。"]
