[[concepts]]
id = "DC-G6-076"
name = "表面结构要求的文本表示（APA、MRR、NMR）"
aliases = []
group = "G6"
kind = "text_convention"
meaning = "在报告、合同等文本中，用字母组APA（允许任何工艺）、MRR（要求去除材料）、NMR（不允许去除材料）代替三种完整图形符号，后接要求；一行有多项要求时用分号隔开。"
components = ["APA、MRR、NMR分别对应三种完整符号。", "后接与图上相同的要求写法，如MRR Ra 0.8; Rz1 3.2、MRR 0.0025-0.8/Rz 3.2、MRR U Rz 0.8; L Ra 0.2、NMR Fe/Ep·Ni15pCr0.3r; Rz 0.8。", "纹理符号和加工余量不用文本形式；图样上用图形符号而不用这些字母组。"]
variants = ["e.g. 'MRR Ra 0.8; Rz1 3.2'", "drawing form uses the graphical symbol instead", "lay symbols and machining allowance are not used in text form"]
dxf_forms = ["MTEXT/TEXT in technical-requirement notes or tables (rare on drawings), e.g. 'MRR Ra 0.8'", "plain text in title-block attachments or specification sheets"]
recognition = "词法：以APA、MRR或NMR开头，空格后接表面结构要求（参数代号与数值，可含传输带、U/L、分号分隔多项）。若出现在图上的技术要求文字中，可直接解析为对应完整符号的要求。普通零件图上罕见。区分技术要求中其他无关的三字母缩写。"
confusions = ["技术要求中其他三字母缩写：后面不接表面结构参数"]
related = ["DC-G6-069", "DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G6-046"]
priority = "rare"
text_forms = ["MRR Ra 0.8; Rz1 3.2", "MRR 0.0025-0.8/Rz 3.2", "MRR U Rz 0.8; L Ra 0.2", "NMR Fe/Ep·Ni15pCr0.3r; Rz 0.8", "MRR 车 Rz 3.2"]
knowledge_units = ["K31", "K32"]
