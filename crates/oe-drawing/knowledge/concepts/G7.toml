meaning = "焊缝补充符号中表示焊缝表面形状的一组：平面（表面平齐）、凹面（表面凹陷）、凸面（表面凸起）和圆滑过渡（焊趾过渡圆滑），画在基本符号外侧并与焊缝表面对应。"
components = ["平面：短直线。", "凹面：凸向基本符号的浅弧。", "凸面：背离基本符号的浅弧。", "圆滑过渡：竖线下端两侧接小弧，放在焊趾处。"]
