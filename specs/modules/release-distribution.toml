[[constraints]]
id="release_semantic_profile_preserves_old_and_explicit_new_scope"
requirement="req_delivery"
module="dist"
check="check"
rust_path="crates/oe-dist/src/release_profile.rs"
statement="oev2.rc4-feature-off/1固定rc.4且不含任何语义依赖feature；oev2.rc5-local-source/1固定rc.5且精确包含两个既有来源feature。版本、缺项、额外/重复/乱序feature与未知profile拒绝，不把声明入口或编译匹配当作行为接收。"
severity="error"

[[constraints]]
id="release_profile_observes_actual_runtime_and_current_source"
requirement="req_delivery"
module="cli"
check="release"
rust_path="crates/oe-cli/src/distribution.rs"
statement="check-profile复用当前执行绑定，核CLI/runtime/根VERSION一致；语义features来自该依赖build.rs的实际Cargo输入，不能从CLI自身空features或用户JSON猜测。保持原manifest/1及Windows/2、正式选择、行为与工程采用分离。整个依赖图仍需真实Cargo artifact记录；未声明已验证Windows。"
severity="error"

