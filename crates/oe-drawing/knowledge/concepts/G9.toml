[[concepts]]
id = "DC-G9-005"
name = "表面处理与涂装注语"
aliases = []
group = "G9"
kind = "note"
meaning = "技术要求中说明零件表面镀覆、化学处理和涂装要求的注语，如镀铬、钝化、磷化、阳极氧化、抛光、喷漆，可用镀覆代号表示，并可用“镀前、镀后、涂前、涂后”说明要求适用的阶段。"
components = ["适用范围：全部表面、除注明“不镀覆”以外的表面、非工作表面、未加工处等。", "处理及代号：如镀铬 Fe/Ep·Cr25b、钝化 Cu/Ct·P、磷化 Fe/Ct·MnPh、阳极氧化 Al/Et·A·Cl(BK)，格式为基体材料/处理方法·镀覆层。", "涂装：如“非工作表面抛光、喷漆”“未加工处涂××漆”“喷××色漆”。", "阶段限定：“镀前”“镀后”“涂前”“涂后”，常与尺寸配合使用。"]
variants = ["镀覆代号形式 Fe/Ep·Cr…", "钝化", "磷化", "阳极氧化", "喷漆/涂漆", "镀前/镀后/涂前/涂后"]
dxf_forms = ["TEXT/MTEXT in 技术要求; coating designations contain '/', the middle dot '·' (often typed as '.' or '•') and letters", "leader note at a surface, or a thick dash-dot line (layer 06) marking the treated zone together with a note"]
recognition = "以关键词（镀、钝化、磷化、氧化、发黑、喷漆、涂漆、抛光、喷砂、喷丸）或镀覆代号模式“[A-Z][a-z]?/[A-Z][a-z]?[·.•]”为锚点；“全部表面”“除…外”“非工作表面”等范围词用于确定作用对象。与表面结构符号中的加工方法（写在表面结构符号长边横线上）和热处理注语（淬火、回火、调质、渗碳）区分。"
confusions = ["表面结构要求中的加工方法或表面处理：写在表面结构符号的横线上。", "粗点画线表示的局部处理范围：线型只标记区域，注语说明处理内容。", "热处理注语：淬火、调质、渗碳、时效等。"]
related = ["DC-G6-060", "DC-G4-073", "DC-G9-002", "DC-G7-025"]
priority = "medium"
text_forms = ["其余表面镀铬 Fe/Ep·Cr25b", "全部表面磷化 Fe/Ct·MnPh", "全部表面阳极氧化 Al/Et·A·Cl(BK)", "非工作表面抛光、喷漆", "未加工处涂××漆", "镀后"]
knowledge_units = ["K03", "K52", "K55", "K33"]
