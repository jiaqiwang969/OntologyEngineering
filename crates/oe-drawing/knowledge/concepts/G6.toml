[[concepts]]
id = "DC-G6-026"
name = "局部表面要求范围的粗点画线"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "只对表面某一部分有要求（局部热处理、局部镀涂或局部粗糙度）时，在该部分轮廓旁平行画一条粗点画线表示范围并注出尺寸，要求写在相连的符号或说明上。"
components = ["粗点画线平行于轮廓、画在紧靠轮廓的外侧，其长度即要求范围。", "用尺寸确定范围的起止位置（1993）；ISO 21920-1草案用理论正确尺寸。", "要求可写在表面结构符号横线上方（如“35~40 HRC”“渗碳深度0.7~0.9，56~62 HRC”）或经指引线注出。", "1993版附录B：不镀覆的部分用粗点画线画出并在横线上注明“不镀覆”（B9）；相同要求的表面受位置限制时用粗点画线画出，在引出线上注一次（B12）。", "ISO 21920-1草案9.2：限制要求用宽的长点画线表示（图16、17）。"]
variants = ["GB/T 131-1993 4.11 图27 图28 (local heat treatment / coating range; requirement may be written above the symbol line)", "GB/T 131-1993 B9 (portion not coated, marked '不镀覆'), B12 (same-requirement surfaces outlined, one symbol on the leader)", "ISO 21920-1 draft 9.2: restricted area shown by a long-dashed dotted wide line with theoretically exact dimensions (图16, 图17)"]
dxf_forms = ["LINE/LWPOLYLINE with a dash-dot linetype (e.g. CENTER, DASHDOT, ACAD_ISO04W100) and thick lineweight (≈0.5–0.7 mm), on layer 06 (粗点画线, GB/T 14665)", "offset ≈1–2 mm outside and parallel to the outline", "DIMENSIONs (or framed theoretically exact dimensions in the draft) fixing the extent", "roughness INSERT with TEXT above the bar (e.g. '35~40 HRC', '不镀覆') attached to the chain line"]
recognition = "锚点：线型为点画线且线宽为粗线（约等于粗实线宽）的一段直线或折线，平行并紧邻某轮廓外侧（间距约1–2 mm），两端有尺寸定位，附近有表面结构符号或热处理、镀涂文字。线型应由LTYPE实际划段判断，不能只看图层名。区分中心线（细点画线，穿过对称中心并超出轮廓）、剖切符号（只在起止处画粗短画，配箭头和字母）；热处理标准中的粗点画线用途相同，可按热处理卡联合解释。"
confusions = ["中心线/轴线：细点画线，穿过图形对称中心", "剖切符号：只在起止和转折处画粗短画，配箭头字母", "热处理区域粗点画线：同为粗点画线，按热处理卡解释"]
related = ["DC-G6-022", "DC-G6-060", "DC-G6-019", "DC-G1-039", "DC-G7-021"]
priority = "low"
text_forms = ["35~40 HRC", "渗碳深度0.7~0.9，56~62 HRC", "不镀覆"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
