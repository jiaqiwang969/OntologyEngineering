[[concepts]]
id = "DC-G3-050"
name = "蜗轮画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "蜗轮一般用一个通过轴线的剖视图表达其带喉部的轮缘（轮齿不剖），再配一个视图或局部视图表达轮毂、键槽；圆视图中通常只画最外圆和分度圆。"
components = ["剖视图：轮缘截面上部为喉部凹弧，齿顶弧、分度弧（细点画线）、齿根弧同心于蜗杆中心；轮齿区不画剖面线，齿根线为粗实线。", "圆视图（垂直轴线）：画出最大外圆和分度圆（点画线），齿顶圆、齿根圆可不画；或只画表示轮毂、键槽的局部视图。", "配蜗轮参数表（模数、齿数、螺旋角旋向、配对蜗杆等）。"]
variants = ["剖视加端视图", "一个视图加局部视图"]
dxf_forms = ["section view: thick ARCs (tip/throat, root) and CENTER-linetype ARC (pitch) centred on the mating worm axis, which is shown as a short CENTER LINE/cross outside the wheel", "HATCH ANSI31 on hub/web/rim body excluding the tooth band", "circular view: thick CIRCLE (outer) + CENTER-linetype CIRCLE (pitch) + keyway LWPOLYLINE", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为剖视图轮缘外侧的一组同心圆弧（凹向外），其圆心不在蜗轮轴线上，而在离轴线一个中心距处（配对蜗杆的轴线位置，常有一短点画线十字标出）；圆弧组中一条为点画线（分度弧）；轮齿区无剖面线。圆视图中只有外圆和分度点画线圆两大圆。与圆柱齿轮区分：齿轮齿顶线为直线；与带轮区分：V带轮的轮缘为V形槽直线侧面，且无分度点画线。"
confusions = ["圆柱齿轮：齿顶线为平行轴线的直线，无喉部凹弧。", "带轮：轮缘为V形或平槽，无分度点画线和参数表。", "滑轮/绳轮：绳槽为凹弧但无分度点画线与齿参数。"]
related = ["DC-G3-049", "DC-G3-048", "DC-G3-022", "DC-G3-213", "DC-G4-002"]
