[[concepts]]
id = "DC-G5-062"
name = "延伸公差带（Ⓟ）"
aliases = ["延伸公差带符号 Ⓟ"]
group = "G5"
kind = "symbol"
meaning = "延伸公差带 Ⓟ：公差值后的带圈 P，表示公差带作用在被测孔（或面）向实体外延伸的一段上，常用于螺纹孔、销孔，保证装入的螺柱、销不发生干涉。"
components = ["带圈 P：圆直径约 0.75H，写在第二格公差值之后（第 7 组）", "直接标注：视图中用细双点画线画出延伸部分，延伸长度用方框理论正确尺寸并在数值前加 Ⓟ（DC-G5-099）", "间接标注（仅盲孔）：Ⓟ 后直接写长度，如 Ⓟ25；起点有偏置时写成 Ⓟ32-7（远端距离减近端偏置）", "也可写在第二、第三基准字母后，表示延伸基准"]
