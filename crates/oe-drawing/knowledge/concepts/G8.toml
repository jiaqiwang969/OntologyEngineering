[[concepts]]
id = "DC-G8-003"
name = "实心件、紧固件和标准部件按不剖绘制"
aliases = ["实心件和标准件按不剖绘制"]
group = "G8"
kind = "conventional_representation"
meaning = "装配图剖视中，剖切平面纵向通过紧固件（螺栓、螺母、垫圈、螺钉）和实心零件（轴、连杆、球、钩子、键、销）的轴线或对称面时，这些零件按不剖绘制，只画外形；标准产品（如油杯）或已由其他图形表达清楚的部件也可不剖。"
components = ["被纵向剖切的实心件只画外形轮廓，不画剖面线；周围被剖零件的剖面线画到其轮廓为止。", "需要表明实心件上的凹槽、键槽、销孔等结构时，在其上作局部剖视，用波浪线界定范围并画剖面线。", "剖切平面垂直于实心件轴线（横剖）时，实心件断面必须画剖面线。", "标准部件（油杯、滚动轴承等）或已另有图形表达的部件可整体按不剖画出外形。"]
variants = ["solid parts", "fasteners", "standard units", "local section to reveal keyway etc."]
dxf_forms = ["uncut solid part: closed outline of LINE/ARC on layer 01 inside a hatched area, with no HATCH of its own", "neighbouring parts: HATCH ANSI31 (layer 10) whose boundary loops stop at the shaft or bolt outline", "local section on the shaft: SPLINE/LWPOLYLINE wavy line on layer 02 with a HATCH inside it", "standard parts often as INSERT of library blocks (bolt, nut, washer) left unhatched"]
recognition = "以剖视图中的剖面线区域为锚点：若一个粗实线围成的长条形或回转形区域被两侧剖面线区域夹住（剖面线边界正好停在它的轮廓上），自身没有HATCH，且其轴线与剖切位置线或视图对称中心线共线，则判为实心件纵剖按不剖。螺纹紧固件可由螺纹小径细实线、六角头轮廓和倒角线加以确认。其中若有波浪线围成的小区域带剖面线，则是局部剖示键槽、销孔等。与漏画剖面线的区别：漏画区域通常属于空心零件（有内孔线）；与肋纵剖的区别：肋属于同一零件，轮廓与本体相连。"
confusions = ["未画剖面线的孔或空腔：两侧轮廓之间是空的，没有零件外形线；实心件内部有倒角、螺纹线、头部等外形线。", "肋、轮辐纵剖不画剖面线：肋属于同一零件，与本体以粗实线分界并相连；实心件是独立零件。", "漏画剖面线的空心轴：空心轴纵剖时必须画剖面线，内孔线可辨。", "横剖的实心件：横剖时必须画剖面线，断面为圆形或带键槽的圆形。"]
related = ["DC-G3-046", "DC-G3-060", "DC-G8-005", "DC-G2-009", "DC-G2-023"]
priority = "medium"
text_forms = []
knowledge_units = ["K11", "K12", "K13", "K34", "K15"]
recognition_cards = []
recognizer = "none"
