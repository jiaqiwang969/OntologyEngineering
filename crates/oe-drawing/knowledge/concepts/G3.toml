[[concepts]]
id = "DC-G3-007"
name = "凹坑"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在铸件表面上锪出或铸出的浅凹平面，作为螺栓头、螺母或垫圈的支承面，以减少加工面积并使接触平稳。"
components = ["浅凹台阶：自表面向内凹入很小深度的平底面，直径约为垫圈外径或略大。", "与孔同心，孔从凹坑底面穿出。", "标注常用锪平符号加直径，深度可不注（以锪平至不见毛面为准）。"]
variants = []
dxf_forms = ["Section: thick LINE step inward from the outline (two short side LINEs + floor LINE); plan view: CIRCLE (spot-face dia) concentric with the hole CIRCLE", "Leader + MTEXT '⌴Ø20' — the spot-face glyph may be a special-font character or written as text '锪平'", "Hole callout via 旁注 leader, e.g. '4×Ø9 ⌴Ø20'"]
recognition = "锚点：孔的同心圆组，外圈直径约为孔径的1.8–2.2倍；在剖视中对应自表面向内的浅台阶（深度远小于直径，常为1–3 mm或不注），并配有锪平符号或'锪平'字样。区分：沉孔深度能容纳螺钉头并注深度；凸台为外凸；埋头孔为90°锥形，用⌵符号。"
confusions = ["柱形沉孔：深度明显，注 ⌴Ø…↧…。", "凸台：轮廓外凸。", "埋头孔：锥形，符号⌵。"]
