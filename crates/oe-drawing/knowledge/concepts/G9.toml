[[concepts]]
id = "DC-G9-028"
name = "标题栏"
aliases = []
group = "G9"
kind = "table"
meaning = "每张图样都必须配置的栏目，位于图框右下角，由更改区、签字区、其他区（材料标记、阶段标记、质量、比例、张次）和名称及代号区（单位名称、图样名称、图样代号、投影符号）组成；看图方向与看标题栏方向一致。"
components = ["位置：图框内框右下角，右边和下边与内框线重合；长边水平且与图纸长边平行为X型图纸，长边与图纸长边垂直为Y型图纸。", "尺寸（CAD格式）：宽180 mm、高56 mm（8行×7 mm）；左区80 mm（上为更改区，下为签字区），中区50 mm（材料标记，阶段标记4×6.5，质量12，比例12，张次），右区50 mm（名称及代号区）。", "名称及代号区自上而下为单位名称、图样名称、图样代号，2008版在右下有投影符号格；早期格式（GB/T 18229—2000图7）没有投影符号格，“质量”写作“重量”。", "线型：外框粗实线，内部分格多为细实线。", "装配图中明细栏紧贴其上方且同宽；教材学生作业用130×28的简化格式。"]
variants = ["GB/T 10609.1 format reproduced in GB/T 18229 图7", "X型（长边水平）/Y型（长边与图纸长边垂直）", "GB/T 10609.1—2008 格式举例（图1-2）", "制图作业简化标题栏（图1-3）", "装配图中与明细栏连成一体（图10-26）"]
dxf_forms = ["INSERT of a title-block block (often combined with the frame block of a GB A0–A4 template) with ATTRIBs for name, number, material, scale, mass, sheet and organisation", "exploded: LWPOLYLINE/LINE grid (outer border layer 01, inner lines layer 02) + TEXT labels and values (layer 11)", "in model-space drawings the frame and title block are often inserted with a scale factor equal to the inverse drawing scale (e.g. ×2 for 1:2)", "CAXA and GstarCAD/AutoCAD Mechanical exports: title block as a block reference with attribute definitions, or as proxy/anonymous blocks"]
recognition = "以图框内框的右下角为锚点：找右下角与内框重合的矩形表格，宽高比约180:56（约3.2；学生格式约4.6），内部有多条等距水平线（间距约为高度的1/8）和多条竖线，文字中含“设计”“审核”“比例”“标记”“处数”中至少三项即可确认。标题栏宽与内框宽之比可推出幅面和插入比例（A4竖放时标题栏几乎占满内框宽度）。若标题栏是带ATTRIB的INSERT，直接按属性取值。与明细栏（在其上方，表头含序号、名称、数量）、参数表（在右上角）、技术要求（无格线）区分。"
confusions = ["明细栏：在标题栏上方，多行等高，序号递增。", "更改记录表：单独的表格，只有更改记录的列。", "齿轮参数表或表格图参数表：通常在图框右上角，列为名称、代号、数值。", "技术要求文字块：没有格线。"]
related = ["DC-G9-017", "DC-G9-018", "DC-G9-019", "DC-G9-020", "DC-G9-021", "DC-G9-022", "DC-G9-023", "DC-G9-024", "DC-G9-025", "DC-G9-026", "DC-G9-027", "DC-G9-016", "DC-G8-025", "DC-G1-085", "DC-G1-084"]
priority = "high"
text_forms = ["设计", "审核", "批准", "比例", "共 1 张 第 1 张", "阶段标记", "质量"]
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = ["title_block_field", "drawing_sheet"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "现有 GB/T 10609.1 文本为空白页，格式取自教材图1-2 和 GB/T 18229—2000 图7 的 OCR（180 宽、8×7=56 高，中区 4×6.5+12+12）；右区各格的高度 OCR 读不可靠，未写入。外框粗、内部细的线型以及 CAD 存储形式来自一般实践。"
