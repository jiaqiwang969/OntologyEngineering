[[concepts]]
id = "DC-G1-002"
name = "不可见轮廓线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细虚线表示物体被遮挡部分的外形轮廓（含孔、内腔等曲面在投射方向上的转向轮廓），只在需要说明时画出。"
components = ["细虚线（No.02.1），与可见轮廓的粗实线处于同一视图。", "典型位置：内孔在非圆视图中的两条素线（关于轴线对称成对出现）、内腔外形、被遮挡凸台的轮廓。", "视图中用粗实线画可见轮廓，必要时才用细虚线画不可见轮廓；剖视已表达清楚的内部结构一般不再画虚线。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE with a dashed linetype (HIDDEN, HIDDEN2, DASHED, ACAD_ISO02W100 or a Chinese-named type such as 虚线), thin lineweight, layer 04 / 虚线 / HIDDEN, colour yellow (ACI 2)", "pairs of parallel dashed LINEs symmetric about a centre-type axis LINE (hidden bore)", "dashed CIRCLE/ARC in an end view for a hidden hole outline", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为虚线实体。常见模式：两条等长平行虚线关于一条点画线对称，间距等于另一视图中某圆的直径（隐藏的孔）；或一个虚线圆与另一视图中孔的位置对应。剖视图（有 HATCH 和 X—X 标题）中虚线应很少，出现时核对是否属于未剖部分。与不可见棱边线同型，二维识别中合并为隐藏线，再由投影对应确定其为曲面轮廓。"
confusions = ["不可见棱边线：同为细虚线，语义不同（面—面交线与曲面转向轮廓）。", "粗虚线（允许表面处理）：线宽粗、紧贴表面平行偏移，不构成外形。", "不可见螺纹：牙顶、牙底线都画细虚线，易被当作普通隐藏孔，需结合螺纹终止线和螺纹标记判别。"]
related = ["DC-G1-001", "DC-G1-045", "DC-G1-015", "DC-G1-055", "DC-G3-001"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
