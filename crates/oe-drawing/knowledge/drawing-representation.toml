meaning = "序号圆点可超出图块范围的距离 = 该值 × 图块尺寸"

[[cards.lexicon]]
concept = "DC-G8-003"
entry = "standard_code"
values = ["GB/T", "GB", "JB/T", "JB", "ISO", "DIN"]
meaning = "标准编号的前缀：明细栏代号列中以此开头的是标准件"

[[cards]]
id = "annotation_mask"
expression_kind = "mask"
title = "注写处的遮罩"
meaning = "图样上文字、符号与框格处的图线和剖面线应断开（注写处不画线）。CAD 用遮罩对象（WIPEOUT，或文字的背景遮罩）实现：遮罩不是图线，它挡住先画的线，属于其轮廓与之相同的那个对象（框格的矩形、基准符号的圆、粗糙度符号的三角、零件块的外形），通常紧接在该对象之前写入。"
sources = [
  "GB/T 17453-2005 技术制图 图样画法 剖面区域的表示法 图5（剖面区域内注写时剖面线断开）",
  "GB/T 4458.4-2003 机械制图 尺寸注法 3.2（尺寸数字不可被任何图线通过，否则须将图线断开）",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 4.4（标准件按不剖绘制，其轮廓挡住被剖零件的剖面线）",
]
knowledge_units = ["K14", "K55"]
recognition = "遮罩的多边形顶点至少九成落在某个已识别对象（图块）的线、圆或弧上（容差为遮罩尺寸的 2%）：它就是那个对象的遮罩，并入其表达；优先取紧接在遮罩之后写入的对象。"
markers = []
concepts = ["DC-G2-001"]

[[cards.components]]
role = "native_member"
primitives = ["WIPEOUT"]
requirement = "遮罩多边形"

[[cards.variants]]
id = "outline_mask"
title = "轮廓与对象相同的遮罩"
distinguishing = "矩形（框格）、多边形近似的圆（基准、序号）、三角（粗糙度符号）或零件外形"
encodings = ["loose"]
tests = ["mask_joins_the_frame_it_follows"]

[[cards.counter_examples]]
statement = "顶点不落在任何对象轮廓上的遮罩不并入对象，保持未解释"
test = "mask_following_no_object_stays_unresolved"

[[cards.parameters]]
name = "outline_tolerance"
value = 0.02
meaning = "遮罩顶点到对象图线的距离容差 = 该值 × 遮罩外接框对角线"

[[cards.parameters]]
name = "vertex_fraction_min"
value = 0.9
meaning = "落在对象轮廓上的遮罩顶点比例下限"

[[cards]]
id = "sheet_frame_border"
expression_kind = "sheet_frame"
title = "图框与装订边附加栏"
meaning = "图纸边界线（细实线）内用粗实线画图框；留装订边的格式在左边留出装订边。装订边内常有会签栏、附加栏（签字、日期等）和倒写的图样代号框，它们属于图框，不是标题栏；标题栏在图框内的右下角。CAD 常把图框与这些栏做成一个图块。"
sources = [
  "GB/T 14689-2008 技术制图 图纸幅面和格式 4.1、4.2（图框格式与装订边）、5（标题栏方位）",
  "GB/T 10609.1-2008 技术制图 标题栏（位于图框右下角）",
  "机械制图（第7版）§1-1 一、图纸幅面和格式",
]
knowledge_units = ["K03", "K52", "K55"]
recognition = "一个图块中有两个面积都不小于全图范围四分之一的矩形（四条直线或一条闭合多段线），小的四边都缩在大的里面：大的是纸边界，小的是图框；块中的文字全部在两者之间（装订边内），则整块是带装订边附加栏的图框，不是标题栏。文字在图框之内（如右下角的标题栏格）时不归此卡；表格的行线与外框围成的矩形共用边，不是一内一外。"
markers = []
concepts = ["DC-G1-085"]

[[cards.components]]
role = "frame_border"
primitives = ["LINE", "LWPOLYLINE", "INSERT"]
requirement = "图纸边界线、图框线与装订边附加栏的格线和文字"

[[cards.variants]]
id = "border_with_margin_columns"
title = "图框块中装订边内有附加栏文字"
distinguishing = "文字全在图框外的装订边内"
encodings = ["block"]
tests = ["frame_block_with_margin_columns_is_not_a_title_block"]

[[cards.counter_examples]]
statement = "文字在图框之内（标题栏格）的图块不归为附加栏图框，仍按标题栏判断"
test = "frame_block_holding_a_title_grid_stays_a_title_block"

[[cards.parameters]]
name = "border_area_min"
value = 0.25
meaning = "图框矩形面积下限 = 该值 × 全图范围面积"

[[cards]]
id = "coincident_redraw"
expression_kind = "any"
title = "重画的重合图线"
meaning = "同一对象在同一位置画了两遍：散线和文字与一个已读图块（标题栏、登记栏、图框、符号块）按插入变换后的内容逐条重合。重合的图线只表示一次，重画的一份是该图块表达的重合来源，不是另外的要素，也不另成表达。"
sources = [
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.3 重合图线的优先顺序",
  "GB/T 4457.4-2002 机械制图 图样画法 图线 4.1（图线重合时只画其中一种）",
]
knowledge_units = ["K03", "K61"]
recognition = "对每个已读出的图块，按插入变换算出块内直线与文字的位置：未被其他规则读出的散线，两端点与块内某条直线的两端点重合；未读出的文字，内容与块内文字相同、插入点重合；散线副本至少占块内直线的给定比例才算重画（偶然一条线重合不算）。副本作为该图块表达的重合来源。"
markers = []
concepts = ["DC-G1-055"]

[[cards.components]]
role = "coincident_source"
primitives = ["LINE", "TEXT", "MTEXT"]
requirement = "与已读图块的直线或文字逐条重合的散线或文字"

[[cards.variants]]
id = "block_redrawn_loose"
title = "图块内容用散线和文字原样重画"
distinguishing = "散线与文字逐条落在已读图块的直线与文字上（含按比例插入的图块）"
encodings = ["loose"]
tests = ["loose_copy_of_a_read_block_is_coincident"]

[[cards.counter_examples]]
statement = "只有个别散线碰巧与图块内的一条线重合（如零件轮廓与图框线相接），不是重画的副本"
test = "single_line_on_a_block_line_is_not_a_copy"

[[cards.parameters]]
name = "coincidence_tolerance"
value = 0.002
meaning = "端点或插入点重合的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "copy_share_min"
value = 0.5
meaning = "散线副本至少占块内直线条数的比例"

[[cards]]
id = "callout_rows"
expression_kind = "dimension"
title = "标注的附注行"
meaning = "尺寸和孔的旁注常写成两行：基准线（指引线的水平折线）上方一行写数量、要素和尺寸，下方一行写深度、贯通、分布或作用范围；没有基准线的尺寸，这些附注词写在数值正下方。附注词属于该尺寸，说明数量、分布和作用范围，不另成注写。沿数值方向紧挨着写、用“此直径”等指代该尺寸的说明句，是以该尺寸为界的要求；尺寸终端所落的同心短弧是这一要求的分界线（范围线）。"
sources = [
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 表1（孔的旁注法）、4.2（均布与 EQS）",
  "GB/T 4458.4-2003 机械制图 尺寸注法 4.1（尺寸数字的注写位置）",
  "GB/T 4457.4-2002 机械制图 图样画法 图线 表1 细实线（范围线及分界线）",
  "机械制图（第7版）§8-1 螺纹的标注、§9-1 零件图的尺寸注法（旁注法）",
]
knowledge_units = ["K17", "K39", "K55"]
recognition = "以尺寸的数值文字为锚：与之平行、字高相称的文字，在同一行内相邻（缝隙小于给定倍数字高），或在其正下方一到两行（行距按字高），并且全部由本卡词表中的词组成（数量 n-、n×、n处，要素、大小、分布、贯通、深度加数值、作用范围）时，并入该尺寸，标签按行序拼读；不全由词表词组成的文字不并入。数值后紧跟的一上一下两段较小的带符号数字是它的上下偏差（dimension_text 卡）。沿数值方向写在其下、含指代词的说明句，作为以该尺寸为界的要求另成一个表达并共享该尺寸的成员，尺寸终端落在其上的同心短弧是分界线。"
markers = ["均布", "两侧", "一周"]
concepts = ["DC-G1-111", "DC-G4-066", "DC-G4-043", "DC-G4-067", "DC-G1-047", "DC-G4-094", "DC-G4-088", "DC-G3-089"]

[[cards.components]]
role = "note_text"
primitives = ["TEXT", "MTEXT"]
requirement = "数值同一行或其下一到两行、全由附注词组成的文字；或含指代词的说明句"

[[cards.components]]
role = "tolerance_text"
primitives = ["TEXT", "MTEXT"]
requirement = "数值后一上一下两段较小的带符号数字（上下偏差）"

[[cards.components]]
role = "extension_line"
primitives = ["ARC"]
requirement = "尺寸终端所落、与零件同心的短弧（要求的分界线）"

[[cards.variants]]
id = "rows_on_reference_line"
title = "附注词写在基准线上下或数值正下方"
distinguishing = "同一行相邻的数量、要素词，下一行的深度、贯通、分布、范围词；数值与附注词也可写在同一段文字里（如框格上方的“数量-直径 均布”）"
encodings = ["text"]
tests = ["callout_words_under_the_value_join_the_dimension", "hole_callout_rows_on_and_under_the_reference_line", "value_and_callout_words_in_one_text_over_a_frame"]

[[cards.variants]]
id = "bounded_requirement"
title = "以尺寸为界的要求"
distinguishing = "沿数值方向写的说明句含“此直径”等指代词；尺寸终端落在一段同心短弧上"
encodings = ["text"]
tests = ["sentence_referring_to_a_diameter_is_a_bounded_requirement"]

[[cards.counter_examples]]
statement = "数值下方的文字不全由附注词组成（另一个尺寸的数值、一句技术要求）时不并入该尺寸"
test = "other_text_under_a_value_is_not_a_callout_row"

