[[concepts]]
id = "DC-G3-109"
name = "动密封圈通用画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "装配剖视图中不需要确切表示密封圈形状和结构时，用矩形线框加中央的对角交叉符号（X形）表示动密封圈（如油封、往复密封圈），框内不画剖面线。"
components = ["矩形线框：与密封圈剖面外形尺寸一致、与图样同比例，粗实线。", "对角线符号：线框中央两条交叉斜线（X形），粗实线，端点不得碰到线框。", "表示密封方向时：在对角线一端加箭头，指向密封的一侧。", "需表示外形时：画出真实剖面轮廓，中央仍画对角线符号。", "位置：2009版可画在轴的一侧或两侧；1996版规定画在轴的两侧。"]
variants = ["2009：画在轴的一侧或两侧", "1996：画在轴的两侧", "画出外形轮廓的通用画法"]
dxf_forms = ["Thick closed LWPOLYLINE or four LINEs forming the rectangle (layer 01), no HATCH inside", "Two crossing thick LINEs (diagonal X) inside the frame, endpoints held off the frame by a small gap", "Optional arrowhead (SOLID or LWPOLYLINE with width) at one end of a diagonal for the sealing direction", "May be an INSERT of a seal symbol block from a standard-part library"]
recognition = "以装配剖视中紧贴轴外圆（或孔壁）的小矩形线框为锚点：粗实线、内部无剖面线，一条长边与轴线平行并贴合轴外圆线，另一条贴合座孔。框内两条斜线交于框中心，方向接近框的对角线，端点与框边留有间隙（约为线宽的数倍）。区分滚动轴承通用画法：轴承为正立十字（两臂平行于框边）；区分表示平面的对角线：那是细实线、端点到达平面轮廓角点、位于零件视图中；区分剖面线：剖面线是一组平行线而不是两条交叉线。"
confusions = ["滚动轴承通用画法：正立十字，非斜交X。", "表示平面的对角线：细实线，端点接触轮廓角点。", "剖面线或非金属材料剖面符号：成组平行或网格线。", "迷宫式密封特征画法：T形、U形凸凹符号。"]
related = ["DC-G3-012", "DC-G3-013", "DC-G3-114", "DC-G3-118", "DC-G3-168", "DC-G3-121", "DC-G3-026", "DC-G3-133"]
