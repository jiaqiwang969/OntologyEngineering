[[concepts]]
id = "DC-G4-028"
name = "楔体尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "用楔体特征（楔体比率C、楔体角β或楔体斜度S，三者择一）与尺寸（大/小端高度H、h或厚度T、t，给定截面处高度Hx或厚度Tx及其定位长度Lx，楔体长度L）的适当组合完整定义楔形结构；超出必要数量的尺寸写在圆括号内作为辅助参考尺寸。"
components = ["特征参数：楔体比率（优选写作1:x）、楔体角（如20°）或楔体斜度（1:x，可选写作百分数如36.4%），按功能只选其一作为定义特征。", "尺寸参数：大端/小端高度H、h或大端/小端厚度T、t，给定横截面处高度Hx或厚度Tx及其位置Lx，楔体长度L，均为普通线性尺寸。", "典型组合（图1～图4）：如“特征＋一端尺寸＋长度”或“两端尺寸＋长度”，注出数量不超过必要数。", "辅助尺寸：由其余尺寸可推出的多余尺寸（如角度或另一端高度）加圆括号作为参考，不承担公差。", "公差标注（第5章）另按尺寸公差或位置度/面轮廓度规定，不属于本卡的尺寸组合本身。"]
variants = ["ratio 1:2.835641 or %", "angle 20°", "slope 1:2.747477", "given heights", "given thicknesses"]
dxf_forms = ["DIMENSION dimtype 0/1 (linear/aligned) for H, h, T, t, Hx, L, Lx", "DIMENSION dimtype 2 or 5 (angular) for the wedge angle β, text '20%%d'", "TEXT/MTEXT ratio or slope '1:2.835641' / '36.4%' on a reference LINE joined by a LEADER/MULTILEADER (or exploded LINE) to the sloping face", "auxiliary dimensions with override text '(<>)' or DIMPOST '(<>)'", "layer 08 or template dimension layer"]
recognition = "锚点为楔形轮廓：两条不平行、夹角较小的直线轮廓（平面斜面）与两端面围成的结构，无回转轴线。在其附近收集：两端高度或厚度的线性尺寸、长度尺寸，以及一个特征值——“1:数字”或“数字%”形式的比值文字、或带°的角度尺寸。若同一组中有数值加圆括号，判为辅助参考尺寸，并检查其余尺寸是否恰好构成必要组合。与圆锥区分：圆锥轮廓关于细点画线轴线对称、尺寸带Ø、锥度用▷符号；与斜度∠区分：斜度符号只给一个面的斜率，不与两端高度/长度构成成组定义。"
confusions = ["圆锥尺寸：轮廓关于轴线对称，直径带Ø，锥度用▷符号；楔体是平面斜面，尺寸为高度/厚度。", "斜度符号∠标注：只表示单个面的倾斜（∠1:100），不定义楔体整体尺寸组合。", "普通角度尺寸：楔体角β与高度、长度组合出现，多余项加括号；孤立角度只是普通角度。", "倒角：斜面很短，位于棱边，注C或长度＋角度。"]
related = ["DC-G4-011", "DC-G4-048", "DC-G4-009", "DC-G4-032", "DC-G5-082", "DC-G5-041"]
priority = "low"
