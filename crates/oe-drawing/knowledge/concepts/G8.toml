[[concepts]]
id = "DC-G8-025"
name = "明细栏"
aliases = ["明细栏栏目"]
group = "G8"
kind = "table"
meaning = "装配图中列出全部零部件的详细目录，画在标题栏正上方并与其同宽，序号自下而上填写；向上位置不够时可紧靠标题栏左边自下而上延续；不能放在标题栏上方时，作为装配图续页按A4幅面单独绘制，由上而下填写。"
components = ["表头行在最下面，紧贴标题栏上边：序号、代号、名称、数量、材料、质量（单件、总计）、备注，分区必要时写在备注中；旧版（GB/T 18229—2000图8）质量写作“重量”。", "格式（一）宽180 mm，各列约为 序号8、代号40、名称44、数量8、材料38、单件10、总计12、备注(20)；数据行高常为7 mm。", "格式（二）宽100 mm：序号8、代号30、名称38、数量8、备注(16)，不含材料和质量列。", "数据行从表头向上依次为1、2、3…；代号列中标准件填标准编号，非标准件填零件图样代号。", "位置不够时在标题栏左侧再起一段，同样表头在下、自下而上。", "线型按粗实线和细实线绘制，常见模板为竖向分隔线和外框用粗实线、行线用细实线。"]
variants = ["位于标题栏上方（由下而上填写）", "A4 续页（由上而下）", "格式（一）: 180 mm, full columns incl. material and mass", "格式（二）: 100 mm reduced columns (序号, 代号, 名称, 数量, 备注) beside a 更改区", "continuation to the left of the title block", "学生作业格式（图10-1）", "GB/T 10609.2 格式", "与标题栏连成一体（图10-26）", "A4 续页", "序号", "代号", "名称", "数量", "材料", "质量（单件/总计）", "分区", "备注"]
dxf_forms = ["exploded grid: LINE/LWPOLYLINE (vertical dividers often layer 01, row lines layer 02) + one TEXT per cell (layer 11)", "CAXA/GstarCAD 明细表: one INSERT per row with ATTRIBs (序号, 代号, 名称, 数量, 材料, 单件, 总计, 备注) plus a header block", "AutoCAD ACAD_TABLE entity, or AutoCAD Mechanical part list (AMPARTLIST) as proxy or anonymous block", "cell text with codes and standard numbers such as 'GB/T 5782-2000', '%%c', '×'"]
recognition = "以标题栏上边界为锚点向上查找：与标题栏同宽（或宽约100 mm靠右）、由等高行组成的表格（行高约为字高的2倍，常为7 mm乘出图比例），最下一行文字中含“序号”“名称”“数量”至少两项；数据行第一列为由下向上递增的整数（1在最下），第二列常含“GB/T”“JB/T”或图号。用序号集合与视图中的零件序号互相核对。表头在顶部、序号向下递增并在独立A4页上的，是明细栏续页。与标题栏的区别：标题栏含设计、审核、批准、比例、图样名称等字段；与参数表的区别：参数表在图框右上角，没有递增的序号列。"
confusions = ["标题栏：在明细栏下方，字段为签字、比例、图名、图号。", "齿轮参数表或表格图参数表：在右上角，没有序号列。", "更改记录表、图样目录：表头字段不同（标记、处数、文件号，或图号、张数）。", "焊接件明细栏：形式相同，但用于焊接件图，列出焊件组成。", "独立的物料清单文件：不在图纸上。"]
related = ["DC-G8-026", "DC-G9-028", "DC-G8-024", "DC-G8-013", "DC-G9-018"]
priority = "high"
text_forms = ["序号 代号 名称 数量 材料 单件 总计 备注", "GB/T 6170-2000 螺母M6", "ZDY70.01", "Q235", "HT200"]
