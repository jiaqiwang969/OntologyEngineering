meaning = "机构运动简图中表示槽轮（马氏轮）间歇机构：带径向槽的槽轮被带圆销的拨盘驱动作间歇转动，分外啮合和内啮合。"
components = ["一般符号：一个内画粗“×”的圆（槽轮，“×”代表径向槽）与另一个带点画线中心线的圆（拨盘）部分重叠。", "外啮合：槽轮画成由四条内凹圆弧围成的四角星形（粗线），紧邻拨盘圆；可用符号画出带径向槽的槽轮外形。", "内啮合：粗“×”交点附近有一个带中心线的小圆（拨盘位于槽轮内部）；可用符号为圆环内含十字槽形轮廓。", "1984 版 7.1 与 2013 版 10.1 图形相同。"]
variants = ["外啮合", "内啮合"]
dxf_forms = ["Thick LINEs forming a large × inside or beside a CIRCLE on layer 01, second CIRCLE with centre LINEs on layer 05", "Four-pointed star as four ARCs (concave) on layer 01", "INSERT of a library block"]
recognition = "锚点：两条等长交叉粗线组成的大“×”（长度约等于相邻圆的直径）或四内凹弧星形，旁边紧贴或重叠一个带十字点画线中心的圆。与“×”固连标记区分：固连“×”很小（与字高相当）且位于轮体矩形内；与棘轮机构区分：无实心点棘爪；与滚动轴承通用画法区分：后者是矩形框内正立的“十”字，不是斜交大“×”。"
confusions = ["棘轮机构符号：有一端为实心圆点的棘爪，轮为虚线圆。", "轮与轴固连的小“×”：位于轮体矩形内、尺寸很小。", "滚动轴承通用画法：矩形线框内正立十字。"]
