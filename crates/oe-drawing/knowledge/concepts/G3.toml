[[concepts]]
id = "DC-G3-225"
name = "滚动轴承代号标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "滚动轴承的规定标记，由“滚动轴承”、基本代号（类型、尺寸系列、内径代号）和标准编号组成，主要写在装配图明细栏中，以代替画出轴承细节。"
components = ["格式：滚动轴承 + 基本代号 + 标准编号，如滚动轴承 6208 GB/T 276—2013。", "类型代号（首位）：如6深沟球轴承、3圆锥滚子轴承、5推力球轴承。", "尺寸系列代号：宽（高）度系列与直径系列两位数字，部分0可省略（6208中的“2”即(0)2系列）。", "内径代号（末两位）：00、01、02、03分别为10、12、15、17 mm；04及以上乘5为内径（08→40 mm）。", "图上轴承位置按通用、特征或规定画法绘出，标记写在明细栏对应行。"]
variants = []
dxf_forms = ["TEXT/MTEXT in parts-list cells on layer 11: 名称 '滚动轴承 6208' and 代号 'GB/T 276—2013', or the whole designation in one cell", "ATTRIB values of a BOM row block INSERT; bearing graphics nearby often an INSERT from a bearing library block"]
recognition = "锚点为文字正则 滚动轴承\\s*[0-9]{1,2}[0-9]{3,4}\\S*\\s*(GB/?T\\s*\\d+(\\.\\d+)?)?，或明细栏中名称为“轴承/滚动轴承”的行内的4~5位纯数字代号。可解码：末两位×5得内径，用以与装配图中轴承所在轴径尺寸核对（相差应为0）。图中应能找到对应序号指引线指向的轴承画法（矩形框加十字或规定画法）。"
confusions = ["图样代号/零件号：明细栏代号栏的图号常含字母、点或短横分隔的层级编号，不以“滚动轴承”开头。", "螺纹或紧固件标记：含M、×与长度。", "普通数值尺寸：孤立的4位数字需结合所在明细栏行和名称判断。"]
related = ["DC-G3-032", "DC-G3-119", "DC-G3-121", "DC-G3-124", "DC-G3-103", "DC-G8-025"]
priority = "medium"
text_forms = ["滚动轴承 6208 GB/T 276—2013", "滚动轴承 51207 GB/T 301—1995", "6205", "30207"]
knowledge_units = ["K15", "K36"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "来自教材第284页；该页OCR把一个代号读成“1297”、把推力球读成“平底球”。前置/后置代号（如密封、游隙、公差等级后缀）不在来源范围，按一般知识可能出现在代号后。"
