aliases = ["加工纹理方向符号 R（放射状）"]
group = "G6"
kind = "surface_indication"
meaning = "纹理符号“R”：在纹理位置写大写字母R，表示纹理近似呈放射状，且与表面中心相关。"
components = ["B型直体大写字母R，字高h。", "2006版位置d；1993版写在符号右边；区域法位置e；ISO 21920-1草案在横线上方[t]位置。", "ISO 21920-1草案表2：R后加基准字母框，可使放射纹理相对于所注表面中心定向。"]
variants = ["GB/T 131-2006 position d (表2)", "GB/T 131-1993 written at the right of the symbol (3.11 图5, 表4)", "GB/T 33523.1 position e (表2)", "ISO 21920-1 draft position [t] above the line next to the process", "ISO 21920-1 draft 表2: 'R' with datum letter relates the radial lay to the indicated surface centre"]
