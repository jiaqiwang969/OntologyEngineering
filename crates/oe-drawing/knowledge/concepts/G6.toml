[[concepts]]
id = "DC-G6-009"
name = "上限、下限代号 U、L"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "参数代号前的大写字母U或L分别表示该要求为上限值或下限值；不带字母时默认是上限值。"
components = ["2006版：单向下限值在参数代号前加L并空一格（L Ra 0.32）；单向上限值不加字母。", "双向极限时上限行用U、下限行用L（见双向极限卡）；同一参数且无歧义时可省略。", "区域法（GB/T 33523.1）：U为隐式默认可省略；支承率和特征参数宜写明U或L，位于规范行最前。", "ISO 21920-1草案：公差类型[a]写在参数符号前，U为上限、L为下限，缺省为上限。", "GB/T 131-1993不用字母，以上下叠写数值或max/min表示。"]
variants = ["GB/T 131-2006 6.6.2", "GB/T 33523.1 6.1 and B.2 [限值] position", "ISO 21920-1 draft 7.5 tolerance type [a]", "GB/T 131-1993: no letters; upper/lower expressed by stacked values and 'max'/'min'"]
dxf_forms = ["TEXT/ATTRIB beginning with 'U ' or 'L ' followed by the code: 'L Ra 0.32'", "separate TEXT 'U' / 'L' left of the code TEXT on the same baseline", "MTEXT with two lines 'U Rz 0.8\\PL Ra 0.2'"]
recognition = "锚点：符号横线下方的文字行。词法：行首为U或L，后接空格和参数代号（R、W、P、S开头）。只有一行且以L开头为单向下限；两行分别以U、L开头为双向极限。区分F-操作拟合元素L（紧跟在LS后，如LSL）、纹理字母（位置d）、长度符号lr、ln（小写）、螺纹旋合长度代号L（在螺纹标记末尾，如M20-7H-L）。"
confusions = ["拟合元素L（线）：紧跟拟合方法LS或TLS之后，无空格", "纹理字母：位于V形右侧位置d", "长度符号lr、ln：小写，出现在说明中", "螺纹旋合长度L：在螺纹标记末尾"]
related = ["DC-G6-021", "DC-G6-046", "DC-G6-030", "DC-G6-059", "DC-G6-008", "DC-G6-020", "DC-G6-027"]
priority = "low"
