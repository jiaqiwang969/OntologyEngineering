[[concepts]]
id = "DC-G3-134"
name = "重复结构要素的简化画法"
aliases = ["重复结构简化画法"]
group = "G3"
kind = "simplified_representation"
meaning = "零件上按规律分布的相同结构（齿、槽、孔等）只画出一个或几个完整结构并反映分布情况，其余对称的用细点画线表示位置，不对称的用相连的细实线代替；零件图中必须注明结构总数。"
components = ["完整画出的一个或几个结构，通常位于分布的起始端或两端。", "对称的重复结构：其余各结构只画其对称中心线（细点画线），排在分布直线或分布圆上。", "不对称的重复结构（如齿条齿形）：其余部分用连接齿顶或槽口的细实线代替。", "圆周分布的槽：画几个完整槽，其余用细实线圆弧相连，并用指引线注出总数（如20个）。", "数量和类型按尺寸注法表示，如n×、EQS。"]
variants = ["symmetric repeated features: centre lines", "asymmetric: connecting thin solid lines", "count note (e.g. 'n个' on a leader)", "对称重复结构用细点画线定位", "不对称重复结构用细实线相连"]
dxf_forms = ["Complete features as LINE/ARC/CIRCLE on layer 01; position marks as short centre LINEs or radial LINEs on layer 05 (CENTER)", "Connecting line as thin LINE/ARC on layer 02 spanning the omitted features", "Count as TEXT/MTEXT such as '20个' on a leader (layer 09/11), or DIMENSION with override text like '6×%%c8 EQS'", "3D-model projections often draw every instance; the simplified form is typical of 2D drafting"]
recognition = "以1～3个完整的结构轮廓（槽、齿、孔）为锚点，沿同一直线或圆周以等间距出现同类型的细点画线位置标记，或有一条细实线连接其余位置；附近有含“×”“个”或EQS的数量文字。计算间距是否均匀、数量文字的n与“完整个数+位置标记数”是否一致，可确认。与成规律分布的相同孔区分：后者以中心线十字加一个孔圆为主；与装配图相同零件组区分：后者标记的是零件位置而非零件上的结构要素。"
confusions = ["成规律分布的相同孔：画一个孔圆，其余只画中心线十字，数量写成n×Ø。", "装配图相同零件组：细点画线表示零件（如螺栓）的位置，不是结构要素。", "单个结构：只有一个，不伴随位置标记和数量文字。", "齿轮的齿根线、齿顶线：按齿轮规定画法画出的整圆，不属于重复结构简化。"]
related = ["DC-G1-025", "DC-G1-057", "DC-G3-115", "DC-G4-043", "DC-G4-066", "DC-G8-021", "DC-G8-022", "DC-G3-034", "DC-G1-020"]
priority = "high"
text_forms = ["20个", "6×Ø8", "8×Ø6 EQS", "12×R3"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 4458.1-2002 5.6 区分对称（细点画线，标准中写旧编号 No.04.1）与不对称（相连细实线）；GB/T 16675.1-2012 表1 5.12 统一说其余用细实线连接并须注总数；教材 §7-4(2) 同 4458.1。DXF 形式与识别核对方法来自一般实践。"
