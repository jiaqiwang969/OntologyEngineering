[[concepts]]
id = "DC-G4-101"
name = "线性尺寸数字的注写位置"
aliases = []
group = "G4"
kind = "text_convention"
meaning = "线性尺寸的数字一般注写在尺寸线的上方，也允许注写在尺寸线的中断处；同一张图上通常统一一种位置。"
components = ["上方注写：数字底边平行于尺寸线，距尺寸线约一个小间隙，位于尺寸线中部", "中断处注写：尺寸线在中间断开，数字置于断口内", "数字不得被任何图线穿过，必要时把图线断开"]
variants = ["above dimension line", "in a break of the dimension line"]
dxf_forms = ["DIMENSION with DIMTAD=1 (text above line) — the usual GB style", "DIMENSION with DIMTAD=0 (text centred, line broken around text)", "exploded: TEXT parallel to LINE offset ~0.5–1 mm above it, or two collinear LINE pieces with TEXT in the gap"]
recognition = "锚点：尺寸文字。若文字基线与一条细实线平行且在其上方约0.2–0.5h处、文字中心投影落在线的中段，则为“上方”方式；若两段共线细线之间留有略大于文字宽度的间隙且文字中心在间隙中，则为“中断处”方式。将文字与其尺寸线配对时，优先选平行且最近、中心投影在线段内的那一条。与注释文字区分：注释文字不与带终端的尺寸线配对。"
confusions = ["注释或技术要求文字：不与带箭头的尺寸线配对", "公差值文字：小一号，紧随主数值右侧", "线段被断开的其他情况（图线避让文字）：断口内的文字可能属于其他尺寸"]
related = ["DC-G4-017", "DC-G4-102", "DC-G4-059", "DC-G4-001"]
