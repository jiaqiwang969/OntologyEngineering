[[concepts]]
id = "DC-G3-220"
name = "弹簧术语代号"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "弹簧图样及其机械性能图中使用的术语代号，如负荷F（扭矩T）、自由高度H0、工作高度H1…、有效圈数n、总圈数n1、中径D、线径d、节距t等，用于图上尺寸、性能图标注和技术要求。"
components = ["负荷类：工作负荷F1、F2…Fn（扭转弹簧用T），极限负荷Fj、试验负荷Fs、压并负荷Fb，初拉力F0，刚度F'或T'，压并应力τb。", "高度与变形类：自由高度H0、工作高度H1…Hn、极限高度Hj、试验负荷下高度Hs、压并高度Hb，变形量f，扭转角φ与自由角度Φ0。", "几何类：中径D、内径D1、外径D2、线径d、节距t、间距δ。", "圈数类：有效圈数n、总圈数n1、支承圈数nz；另有旋向一项（无代号）。", "使用位置：直接标在弹簧视图的尺寸上，或标在主视图上方粗实线机械性能图的坐标与线端，难以标注时写入技术要求。"]
variants = []
dxf_forms = ["TEXT/MTEXT labels on layer 11 near the thick LINE(s) of the force–deflection diagram above the main view; subscripts written plainly ('H0', 'F1') or via MTEXT height/offset changes", "DIMENSION entities with override text using the symbols, e.g. 'H0', '%%cD' or numbers, and MTEXT technical-requirement lines like '有效圈数 n=6'"]
recognition = "仅在弹簧图样上下文中解释：先确认图中有螺旋弹簧规定画法（等距斜交的粗实线簧圈轮廓或中间省略后的点画线），且主视图上方有粗实线性能直线；再把附近文字按正则 ^[FT](\\d+|j|s|b|0)?'?$、^H(\\d+|j|s|b)$、^n[1z]?$、^[φΦ](\\d+|j|s|0)$ 解释为弹簧代号。孤立的D、d、t需靠弹簧上下文判定。"
confusions = ["齿轮参数代号（m、z、α、x）：出现在齿轮参数表中。", "公差带代号H7等：H0、H1中的数字表示序号，出现在性能图或高度尺寸上，不跟在基本尺寸之后。", "几何公差框格或基准字母中的F、H等：位于方框内。"]
related = ["DC-G3-017", "DC-G3-018", "DC-G3-019", "DC-G3-101", "DC-G3-102", "DC-G3-221"]
priority = "low"
text_forms = ["H0", "F1", "F2", "Fj", "n=6", "n1=8.5", "D", "d", "t"]
knowledge_units = ["K13", "K38"]
recognition_cards = []
