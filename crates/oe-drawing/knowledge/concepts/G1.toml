[[concepts]]
id = "DC-G1-006"
name = "分度圆（线）"
aliases = []
group = "G1"
kind = "line"
meaning = "用细点画线画出齿轮、链轮等齿形零件的分度圆（端视图中的圆）或分度线（非圆视图中的直线），是齿轮几何的基准。"
components = ["细点画线（No.04.1.3）。端视图中为与齿顶圆、齿根圆同心的整圆。", "非圆视图（外形或剖视）中为平行于轴线的一条点画线，位于齿顶线与齿根线之间，两端略超出齿宽轮廓。", "两齿轮啮合时分度圆相切；非圆剖视中两条分度线重合为一条。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE with a dash-dot linetype (CENTER, CENTER2, DASHDOT, ACAD_ISO04W100 or e.g. 点画线/中心线), thin lineweight, layer 05 / 中心线 / CENTER, colour red (ACI 1)", "CENTER-type CIRCLE concentric with a thick CIRCLE (tip circle) and often a thin CIRCLE (root)", "CENTER-type LINE parallel to the axis inside the gear width", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为点画线圆，同心存在一个略大的粗实线圆（齿顶圆，直径差约2m），可能还有更小的细实线圆（齿根圆）；附近常有参数表（模数 m、齿数 z、压力角）。与孔系分布中心线区分：分度圆上没有孔心，孔系圆上有若干小圆的圆心并有径向点画线。"
confusions = ["齿顶圆：粗实线，最大的同心圆。", "齿根圆/线：细实线，可省略；剖视中齿根线为粗实线。", "孔系分布的中心线：点画线圆上落有孔心。"]
related = ["DC-G1-044", "DC-G1-062", "DC-G1-057", "DC-G1-020", "DC-G3-022", "DC-G3-211"]
priority = "medium"
