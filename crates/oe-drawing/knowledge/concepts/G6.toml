[[concepts]]
id = "DC-G6-029"
name = "旧版间距参数与轮廓支承长度率的注写"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "GB/T 131-1993图样上，间距参数S、Sm或轮廓支承长度率tp写在横线下方，数值写在代号后；tp须同时给出水平截距c（以Ry的百分数表示）。"
components = ["间距参数：单峰平均间距S或微观不平度平均间距Sm，单位mm，代号后写数值（上限值）。", "支承长度率tp：与截距c同时给出，例如c在Ry的50%处、tp为70%，作为下限值。", "可注最大值（Sm后加max）或最小值（tp后加min）（图2c、2d）。", "附录B B1：取样长度与tp同时标注时以斜线隔开。", "2006版改为Rsm、Rmr(c)代号（见附加参数卡）。"]
variants = ["GB/T 131-1993 3.8 图2 a-d (Sm upper limit, tp with c, Sm max, tp min)", "附录B B1: sampling length and tp together separated by a slash"]
dxf_forms = ["TEXT under the bar with code and value; the subscript of Sm/tp may be a separate smaller TEXT", "'%' sign in TEXT, possibly entered as '%%%' (AutoCAD escape for a single %)", "two TEXT lines when both a sampling length and tp are given"]
recognition = "仅在1993版图样上出现：横线下方文字含S、Sm（后接mm数值）或tp（后接百分数并伴有c和百分数）。tp通常为下限。区分取样长度（纯数字）、2006版Rmr(c)（R开头并带括号）以及注释中的百分数。"
confusions = ["取样长度：横线下方的纯数字", "2006版Rmr(c)代号：R开头并带括号", "注释中的百分数：不在符号横线下"]
related = ["DC-G6-028", "DC-G6-061", "DC-G6-031", "DC-G6-075", "DC-G6-025"]
priority = "rare"
