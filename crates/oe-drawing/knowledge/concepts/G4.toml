kind = "tolerance_indication"
meaning = "角度尺寸的规范修饰符：LC表示用最小区域准则拟合两直线后得到的两线角度尺寸（ISO缺省，通常不注）；LG表示用最小二乘准则拟合两直线得到的两线角度尺寸。"
components = ["符号：大写字母LC或LG置于长圆形框内，比例同GB/T 38762.1附录A", "位置：写在角度公差之后", "缺省：上、下限都为两线角度尺寸（LC）时无需标注"]
