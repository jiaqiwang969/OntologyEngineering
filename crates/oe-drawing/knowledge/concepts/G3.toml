[[concepts]]
id = "DC-G3-156"
name = "可控离合器符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示可由外部操纵接合或分离、连接两根同轴轴的离合器，分啮合式、摩擦式（单向/双向）、液压和电磁离合器。"
components = ["一般符号：两根同轴粗轴线在中间断开，一侧轴端为竖直短线（半体），另一侧为开口朝向对方并罩住它的“匚”形外壳，两半体之间留间隙。", "啮合式离合器：两半体间画凹凸“爪”形折线；单向式为一组，双向式在轴线两侧对称成组。", "摩擦离合器：两半体间画相互贴合的平行竖线（摩擦片）及指向它的短箭头；双向式两侧对称；可用符号把外壳画在轴线一侧。", "液压离合器：两半体间有一对括号状弧线；电磁离合器：外壳内上方有一排连续小半圆弧（线圈）。", "需要表明操纵方式时在符号右上方加字母 M（机动）、H（液动）、P（气动）、E（电动），如“具有气动开关启动的单向摩擦离合器”加 P；1984 版与 2013 版均有此附注。"]
variants = ["啮合式离合器（单向/双向）", "摩擦离合器（单向/双向）", "液压离合器", "电磁离合器", "1984：操纵方式字母M/H/P/E"]
dxf_forms = ["Exploded LINE/LWPOLYLINE strokes between two collinear thick shaft LINEs (or 2d-wide LWPOLYLINE), small arrows as SOLID triangles or LEADER", "Electromagnetic clutch coil as a row of small ARCs", "Single-letter TEXT M/H/P/E on layer 11 at the upper right of the clutch outline", "INSERT of a library block"]
recognition = "锚点：两根同轴粗轴线在一处断开，断口处由竖短线和罩形“匚”外壳组成的离合器轮廓，符号高度大于其宽度。再按内部标记细分：凹凸爪形→啮合式；贴合竖线加箭头→摩擦式；括号弧→液压；一排小半圆→电磁。旁有单个字母 M/H/P/E 时可确认是可控离合器或制动器。程序宜先判为“离合器族”，再用内部标记或图块名细分。与联轴器区分：联轴器一般符号仅两条对置短竖线，或细矩形框内的“×”、半圆、斜折线，没有罩形外壳；与自动离合器区分：自动离合器外壳上下有短竖凸头，内部为对向箭头（离心）、小圆（超越）或重叠半体（安全）。"
confusions = ["联轴器符号：两条对置短竖线或带框的“×”/半圆/斜折线，无罩形外壳和操纵标记。", "自动离合器符号：内部为对向箭头、小圆或安全元件，不加操纵字母的情况居多。", "制动器符号：只连一根轴，有竖直施力箭头。"]
related = ["DC-G3-190", "DC-G3-189", "DC-G3-149", "DC-G3-034"]
priority = "rare"
text_forms = ["M", "H", "P", "E"]
knowledge_units = ["K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The catalogue attributes the M/H/P/E letters to the 1984 edition; the 2013 page image carries the same note (for 11.2, 11.3 and 11.4). Inner marks were read from low-resolution page images and should be checked against the standard figure before exact stroke matching. DXF forms are general CAD practice."
