[package]
name = "oe-sw-worker"
default-run = "oe-sw-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
oe-wire.workspace = true
oe-contracts = { path = "../oe-contracts" }
oe-windows-controller.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(windows))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
