encodings = ["block", "loose"]
tests = ["rotated_texture_block_with_value_beside_it"]
[[cards.variants]]
id = "standing_on_feature"
title = "尖端立在轮廓、延长线、指引线或尺寸线上"
distinguishing = "尖端处那条线的作用"
encodings = ["block", "loose"]
tests = ["texture_tip_on_outline_and_extension_line", "texture_symbol_takes_the_extension_line_it_stands_on"]
[[cards.variants]]
id = "most_surfaces"
title = "大多数表面相同要求的统一注法"
distinguishing = "“其余”或位于标题栏附近；也可写在技术要求图块中（嵌套的符号子块带“其余”与数值）；旧版把“其余”二字写在符号前（同一图块内或单独文字），符号可不带数值（如不允许去除材料的符号）"
encodings = ["block", "text"]
tests = ["remaining_surfaces_texture_note", "requirement_block_with_general_roughness_is_partitioned", "most_surfaces_word_and_valueless_symbol_in_one_block", "most_surfaces_word_written_before_a_symbol_block"]
[[cards.variants]]
id = "symbol_only"
title = "不带数值的符号"
distinguishing = "只有符号"
encodings = ["block"]
tests = ["texture_symbol_without_value"]
[[cards.counter_examples]]
statement = "倒角两条线不是表面结构符号（夹角与长度比不符、旁无数值）"
test = "chamfer_lines_are_not_a_texture_symbol"
[[cards.parameters]]
