meaning = "剖面线端点到曲线的距离上限 = 该值 × 字高（手画剖面线常略短或略长）"

[[cards.parameters]]
name = "parallel_deg"
value = 3.0
meaning = "散线剖面线互相平行的角度容差（度）"

[[cards.parameters]]
name = "min_section_lines"
value = 2.0
meaning = "落在曲线上的平行剖面线最少条数"

[[cards.parameters]]
name = "end_on_outline"
value = 0.1
meaning = "波浪线端点落在轮廓（或放大圈）上、图线落在局部剖视范围内的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "end_near_region"
value = 0.75
meaning = "被局部剖视打断的轮廓端点到剖视范围的距离上限 = 该值 × 字高（虚线端点常停在波浪线前后一小段）"

[[cards.parameters]]
name = "end_near_region_share"
value = 0.25
meaning = "上述距离上限同时不超过该值 × 剖视范围的尺度（面积的平方根），小范围按自身大小收紧"

[[cards]]
id = "dimension_line_parts"
expression_kind = "dimension"
title = "尺寸线与尺寸界线的画法"
meaning = "尺寸界线从轮廓、轴线或对称中心线引出，一般超出尺寸线终端 2 mm 左右；一条线可以同时作两个尺寸的界线；画图时界线起头可能略画进轮廓。尺寸线可以越过终端延长，作为引线把数值写到外面。这些部分都属于相应的尺寸，不是另外的要素。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法 3.1、3.2、4.1",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法",
  "机械制图（第7版）§1 尺寸注法",
]
knowledge_units = ["K17", "K18"]
recognition = "以已识别尺寸的尺寸界线为锚：同一根线上未解释的短端段（不超过给定长度）——在尺寸线一侧为超出段，在轮廓一侧为画进轮廓的起头——并入该界线；较长的未解释段若有另一尺寸的终端箭头垂直落在其上，则为两尺寸共用的界线。尺寸线终端之外从箭尖起共线延伸的细线是尺寸线的延长，沿它找数值。"
markers = []
concepts = ["DC-G4-005", "DC-G4-019", "DC-G4-058", "DC-G4-059"]

[[cards.components]]
role = "extension_line"
primitives = ["LINE"]
requirement = "尺寸界线，含超出段与起头"

[[cards.components]]
role = "dimension_line"
primitives = ["LINE"]
requirement = "尺寸线及其越过终端的延长段"

[[cards.variants]]
id = "end_piece"
title = "界线端部的短段"
distinguishing = "同一根界线上未解释的短端段：超出尺寸线的部分，或起头画进轮廓的部分（界线常分段画或比原生尺寸的界线画得长）"
encodings = ["loose", "native"]
tests = ["extension_line_end_piece_joins_the_extension_line"]

[[cards.variants]]
id = "shared"
title = "两个尺寸共用一条界线"
distinguishing = "另一尺寸的终端箭头垂直落在界线的未解释段上"
encodings = ["loose"]
tests = ["one_line_is_extension_line_of_two_dimensions"]

[[cards.variants]]
id = "extended_to_outside_value"
title = "尺寸线越过终端延长到外面的数值"
distinguishing = "从箭尖起共线向外的细线，数值在其末端或引线台上"
encodings = ["loose"]
tests = ["dimension_line_continues_past_the_terminator_to_the_value", "boxed_value_on_extended_dimension_line_is_one_dimension"]

[[cards.counter_examples]]
statement = "界线上较长的未解释段若没有别的尺寸落在其上，不并入尺寸"
test = "long_free_piece_of_an_extension_line_is_not_absorbed"

[[cards.variants]]
id = "axis_as_extension_line"
title = "轴线、对称中心线兼作尺寸界线"
distinguishing = "点画线（或虚线、双点画线）被尺寸借作尺寸界线：线型属于这条线本身，它整条仍是中心线（或不可见轮廓），尺寸只借用它"
encodings = ["loose", "native"]
tests = ["centre_line_used_as_extension_line_stays_a_centre_line"]

[[cards.counter_examples]]
statement = "细实线画的尺寸界线不因与轴线共线而成为中心线：线型由这条线自己的图案决定"
test = "continuous_extension_line_on_an_axis_is_not_a_centre_line"

[[cards.variants]]
id = "split_extension_line"
title = "尺寸界线断成两段"
distinguishing = "未使用的细线与某尺寸的尺寸界线共线，两者之间只隔不超过给定倍数字高的缺口（为符号、引线或文字让位），是这条界线的另一段"
encodings = ["loose"]
tests = ["extension_line_split_for_a_symbol_is_one_extension_line"]

[[cards.variants]]
id = "drawn_twice"
title = "尺寸线、界线或终端画了两遍"
distinguishing = "一段线落在已认领的尺寸线或尺寸界线上并被它覆盖，或一个终端与已认领的终端同尖同向：同一部分画了两次（重合图线只画一次）；不打印层上的一份让位于打印的一份"
encodings = ["loose"]
tests = ["dimension_parts_drawn_twice_join_the_dimension"]

[[cards.counter_examples]]
statement = "与界线共线但隔得较远的细线不并入界线"
test = "collinear_line_far_from_an_extension_line_is_not_absorbed"

[[cards.variants]]
id = "own_origin_and_overshoot"
title = "每条界线从自己的起点画到尺寸线外一点"
distinguishing = "界线从各自的起点引到尺寸线并超出 2～3 mm；超出的方向按这条界线自己的起点定。尺寸线夹在两个起点之间时两条界线方向相反，各在自己一侧超出，不伸到尺寸线另一侧去"
encodings = ["native"]
tests = ["extension_lines_from_opposite_sides_each_stop_past_the_dimension_line"]

[[cards.variants]]
id = "outline_as_extension_line"
title = "轮廓线兼作尺寸界线；界线所接的被测轮廓"
distinguishing = "尺寸终端直接落在轮廓线上（原生尺寸不画界线）、原生界线画在轮廓线上，或界线在起点处接着同向的轮廓线：这条线是轮廓（粗线或已读为轮廓），尺寸只是借用或量到它；它在尺寸里是“界线所依轮廓”（共享），线型仍是它自己的，轮廓身份不变，每个尺寸里只记一次"
encodings = ["loose", "native"]
tests = ["outline_under_a_native_extension_line_is_lent_to_the_dimension", "outline_continuing_an_extension_line_is_the_measured_feature", "outline_the_terminators_stand_on_is_lent_to_the_dimension"]

[[cards.counter_examples]]
statement = "界线延长方向上隔着一段轮廓的另一段线不属于这个尺寸：共线的归并到第一段轮廓为止"
test = "collinear_growth_stops_at_the_first_outline_piece"
[[cards.counter_examples]]
statement = "细线画的界线即使画过了定义点（起头画进轮廓或定义点取在半途）仍是界线，不因此改成轮廓"
test = "thin_extension_line_drawn_past_its_origin_stays_an_extension_line"
[[cards.counter_examples]]
statement = "同一直线上只在起点之后（不接到起点）或只在尺寸线外侧的另一段轮廓不属于这个尺寸：它是别的要素"
test = "outline_behind_the_origin_or_beyond_the_dimension_line_is_not_lent"

[[cards.variants]]
id = "terminator_any_entity"
title = "尺寸线终端不论用什么实体存放"
distinguishing = "尺寸内的填充三角形——实心多边形（SOLID、TRACE）、图块、宽度渐变到零的多段线或实心填充的 HATCH——尖端落在本尺寸的尺寸线（直线或圆弧）上、轴线沿尺寸线：是这个尺寸的终端（箭头）；形状为细长三角形，长约为底宽的数倍"
encodings = ["native"]
tests = ["solid_hatch_triangle_in_a_dimension_block_is_its_terminator", "tapered_polyline_in_a_dimension_block_is_its_terminator"]

[[cards.counter_examples]]
statement = "尺寸块内轴线不沿尺寸线的填充三角形（如斜度、锥度符号）不是终端"
test = "filled_triangle_across_the_dimension_line_is_not_a_terminator"
[[cards.counter_examples]]
statement = "尺寸块内只画文字的图块是数值的一部分（分段写出的数值与公差），不是终端"
test = "block_drawing_only_text_in_a_dimension_is_part_of_its_value"

[[cards.parameters]]
name = "terminator_aspect_min"
value = 2.0
meaning = "终端三角形长度 ≥ 该值 × 底宽（GB/T 4458.4 图 9：箭头细长；CAD 常用 3:1～6:1）"

[[cards.parameters]]
name = "terminator_aspect_max"
value = 12.0
meaning = "终端三角形长度 ≤ 该值 × 底宽"

[[cards.parameters]]
name = "terminator_on_line"
value = 0.1
meaning = "终端尖端到尺寸线的距离容差 = 该值 × 终端长度"

[[cards.parameters]]
name = "terminator_axis_sin_max"
value = 0.1
meaning = "终端轴线与尺寸线（圆弧取切线）夹角正弦的绝对值上限"

[[cards.variants]]
id = "outline_extended_to_virtual_corner"
title = "光滑过渡处轮廓延长到交点的细线"
distinguishing = "在圆角、倒角处，两侧轮廓用细实线延长到相交，尺寸界线从这个交点引出：从轮廓线（端点或线上一点）沿它的方向延到某尺寸界线起点的细线是这个尺寸的作图线（尺寸界线），不是轮廓；几个尺寸都从这个交点引出时它为各尺寸共用；压在这段细线下面的轮廓短头是轮廓画过了过渡处，同样借给这些尺寸"
encodings = ["loose", "native"]
tests = ["thin_line_continuing_an_outline_to_an_extension_line_start_is_construction"]

[[cards.counter_examples]]
statement = "交点处没有尺寸界线引出时，把轮廓延长的细线不归入任何尺寸；不沿轮廓方向的细线（过渡线等）也不是这种作图线"
test = "thin_line_continuing_an_outline_without_a_dimension_is_no_construction"

[[cards.parameters]]
name = "virtual_corner_reach"
value = 3.0
meaning = "延到交点的作图细线长度上限 = 该值 × 字高"

[[cards.parameters]]
name = "overshoot_max"
value = 2.0
meaning = "界线超出尺寸线的长度上限 = 该值 × 箭头长（标准 2～3 mm，箭头长约 3～4 mm；按 2 倍箭头长留余量）"

[[cards.parameters]]
name = "split_gap_max"
value = 3.0
meaning = "界线两段之间缺口的上限 = 该值 × 字高"

[[cards.parameters]]
name = "coincident_tolerance"
value = 0.05
meaning = "两次画出的同一部分之间的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "end_piece_max"
value = 1.0
meaning = "可并入界线的端段长度上限 = 该值 × 字高"

[[cards.parameters]]
name = "terminator_on_line"
value = 0.05
meaning = "终端箭尖落在共用界线上的容差 = 该值 × 字高"

[[cards.parameters]]
name = "perpendicular_cos_max"
value = 0.1
meaning = "箭头方向与共用界线夹角余弦的绝对值上限"

[[cards]]
id = "view_arrangement"
expression_kind = "view"
title = "基本视图的配置与主视图"
meaning = "零件图的基本视图按第一角画法配置（我国优先采用）：主视图是布局中心，俯视图在它下方、仰视图在上方、左视图在右方、右视图在左方、后视图在左视图之右；它们与主视图长对正（上下）或高平齐（左右），按此配置时不注视图名称。向视图、局部放大图等带名称的视图可自由配置，不构成这种配置；剖视图配置在基本视图位置时仍是基本视图，盘盖类零件的主视图常取轴向全剖，这时注有“X—X”的剖视图也可以是布局中心。主视图由配置决定，而不是由图形大小决定。落在另一视图外框以内、本身没有名称的碎块（被尺寸或孔打断的轮廓、孔圆、台阶）是那个视图的一部分。"
sources = [
  "GB/T 14692-2008 技术制图 投影法 5.2.1 第一角画法（图4）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图 4.1 基本视图",
  "GB/T 13361-2012 技术制图 通用术语 5.11（第一角画法）",
  "机械制图（第7版）§7-1 一 基本视图（图7-1）、§9-2 零件图的视图选择（盘盖类常用全剖的主视图加一个表达外形与均布孔的视图）",
]
knowledge_units = ["K03", "K52", "K55", "K11"]
recognition = "在同一张图纸内比较各视图可见轮廓的外形范围：两视图在公共方向上外形范围的重合长度除以较长者不小于给定值，即为对齐（左右为高平齐，上下为长对正）。只有没有名称的视图作为对齐的邻视图；候选的布局中心是没有名称的视图和剖视名称“X—X”的视图；参与配置的视图须有给定片数的几何、外形不小于给定倍数的字高（符号笔画等碎块不参与）。左右两侧（或上下两侧）都有对齐邻视图的视图，或行与列上都有对齐邻视图的视图，是主视图；只有两个视图对齐时，取左边（行）或上边（列）的一个；都没有时退回最大的无名称视图。主视图确定后，与它对齐的无名称视图按第一角方位命名：右为左视图，再往右为后视图，左为右视图，下为俯视图，上为仰视图。第三角画法须有投影识别符号，本规则不读该符号，按第一角配置。外框落在另一视图外框以内（含余量）、没有名称也没有放大图边界的区块并入该视图。"
markers = []
concepts = ["DC-G2-073", "DC-G2-084"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC", "CIRCLE", "LWPOLYLINE"]
requirement = "各视图的可见轮廓，定出视图的外形范围"

[[cards.components]]
role = "view_title"
primitives = ["TEXT", "MTEXT"]
requirement = "视图名称：有名称的视图自由配置，不作为对齐的邻视图"

[[cards.variants]]
id = "flanked"
title = "左右（或上下）两侧都有对齐的无名称视图"
distinguishing = "同一行的左、右（或同一列的上、下）各有一个外形范围与它重合的无名称视图"
encodings = ["inferred"]
tests = ["principal_view_is_flanked_by_aligned_views"]

[[cards.variants]]
id = "row_and_column"
title = "行与列上都有对齐的无名称视图"
distinguishing = "右侧或左侧有高平齐的视图，上方或下方有长对正的视图"
encodings = ["inferred"]
tests = ["principal_view_aligned_in_row_and_column"]

[[cards.variants]]
id = "section_principal"
title = "注有“X—X”的轴向剖视图是布局中心"
distinguishing = "剖视图左右两侧是对齐的无名称端视图（盘盖类零件）"
encodings = ["inferred"]
tests = ["titled_axial_section_between_end_views_is_principal"]

[[cards.variants]]
id = "two_aligned_views"
title = "只有两个视图对齐"
distinguishing = "左视图在主视图右方、俯视图在主视图下方：取行中左边、列中上边的一个"
encodings = ["inferred"]
tests = ["two_aligned_views_principal_is_the_left_one"]

[[cards.variants]]
id = "basic_view_names"
title = "其余基本视图按方位命名"
distinguishing = "与主视图对齐的无名称视图：右为左视图（再右为后视图），左为右视图，下为俯视图，上为仰视图"
encodings = ["inferred"]
tests = ["principal_view_aligned_in_row_and_column", "principal_view_is_flanked_by_aligned_views"]

[[cards.variants]]
id = "contained_region"
title = "落在另一视图外框内的碎块并入该视图"
distinguishing = "无名称、无放大图边界，外框在另一区块外框以内"
encodings = ["inferred"]
tests = ["fragment_inside_a_view_box_joins_that_view"]

[[cards.counter_examples]]
statement = "带名称的向视图、剖视图不作为对齐的邻视图：一排对齐的移出剖视中间的那个不是主视图"
test = "titled_views_in_a_row_do_not_make_a_principal"

[[cards.counter_examples]]
statement = "外形范围不一致的视图不算对齐（只有部分重叠）"
test = "views_overlapping_only_in_part_are_not_aligned"

[[cards.counter_examples]]
statement = "有自己名称的视图即使落在另一视图的外框内也不并入"
test = "titled_view_inside_a_view_box_stays_a_view"

[[cards.parameters]]
name = "alignment_min"
value = 0.85
meaning = "对齐：两视图在公共方向上可见轮廓外形范围的重合长度 ÷ 较长者的下限"

[[cards.parameters]]
name = "min_pieces"
value = 3.0
meaning = "参与配置的视图最少的几何片数（更少的是碎块）"

[[cards.parameters]]
name = "containment_margin"
value = 1.2
meaning = "判断落在另一视图外框以内的余量 = 该值 × 字高（与视图聚类间距相同）"

[[cards.parameters]]
name = "min_extent"
value = 3.0
meaning = "参与配置的视图可见轮廓外形的最大边长下限 = 该值 × 字高（更小的是符号笔画等碎块）"

[[cards]]
id = "drawing_sheet"
expression_kind = "sheet_frame"
title = "一张图纸：图框与其中的标题栏"
meaning = "每张图样都有自己的图框，标题栏在图框右下角；一个模型空间可以并排放几张图纸。视图、视图编号、尺寸终端的配对都在一张图纸之内，不跨图纸。图号相同的两张图纸是同一图样的两个版本：标题栏日期较晚、并有同一日期的更改说明（常写在图框外）的一张是现行版本，取代日期较早的一张。"
sources = [
  "GB/T 14689-2008 技术制图 图纸幅面和格式 4 图框格式",
  "GB/T 10609.1-2008 技术制图 标题栏（标题栏位于图框右下角；签字区的年月日）",
  "机械制图（第7版）§1-1 图纸幅面、图框格式和标题栏",
]
knowledge_units = ["K03", "K61"]
recognition = "以图幅边框图块为锚（规则 sheet_size_rectangular_border 所读的图框）：其中有标题栏的图框是一张图纸。模型空间里有两张以上时，每个视图、每个图纸级表达归它所在的图纸，视图编号前加“sheet-n:”；只有一张时不加前缀。尺寸的两个终端不在同一张图纸时不配对。各图纸标题栏中的图号与日期（八位数字年月日，或以分隔符分开的年、月、日）相同图号时，日期较晚、且图框外有写同一日期的说明的图纸取代较早的图纸，记为图纸的依据。"
markers = []
concepts = ["DC-G1-085", "DC-G9-028"]

[[cards.components]]
role = "frame_border"
primitives = ["INSERT"]
requirement = "图幅边框（纸边与图框）图块"

[[cards.components]]
