[[concepts]]
id = "DC-G7-109"
name = "基准线（实线）"
aliases = ["基准线（虚线）"]
group = "G7"
kind = "weld_indication"
meaning = "焊缝符号的基准线：由一条细实线和一条与之平行的细虚线组成，与箭头线相连；焊缝符号画在实线侧表示焊缝在箭头侧，画在虚线侧表示在非箭头侧。基准线一般平行于图样底边（标题栏长边），必要时可垂直；实线与虚线的上下位置可互换。"
components = ["实线：细实线，一端连箭头线，长度容纳符号和尺寸。", "虚线：细虚线，与实线平行，相距约3d'，可在实线上方或下方。", "方向：一般水平，必要时竖直。", "省略虚线：对称焊缝、部分明确的双面焊缝，或非箭头侧无焊缝要求且不致误解时。", "版本差异：GB/T 12212-1990称“虚线”，2012版明确为“细虚线”。"]
variants = ["horizontal (normal)", "vertical (when needed)", "solid line above or below the dashed line (positions interchangeable)", "dashed line below the solid line", "dashed line above the solid line", "omitted (symmetric weld / double-sided weld / no other-side weld)"]
dxf_forms = ["reference line pair: thin continuous LINE plus a parallel LINE with dashed linetype (DASHED/HIDDEN/ACAD_ISO02W100) offset ≈ 3d' ≈ 0.3h, dashes ≈ 0.9h, gaps ≈ 0.3h (GB/T 12212 proportions)", "solid line often drawn as the horizontal leg of a LEADER/MLEADER or QLEADER (with 'landing'); dashed line as a separate LINE", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "layer: 09 (leader) or 08, or the drawing's annotation layer; in exploded CAXA output both lines may sit on the 细实线 layer with different linetypes"]
recognition = "锚点：一条细实线，其一端与另一条倾斜的带箭头细线相接（夹角通常30°～60°或经一次折弯），且平行偏移约0.3h处常有等长的细虚线。实线上下约1h内存在高约h的符号笔画或文字。判别细虚线：同一图层/线型为DASHED/HIDDEN的短线段，长度≈实线长度，两端大致对齐。区分普通注释引线的水平段：后者无平行虚线，横线上是说明文字而非焊缝符号。"
confusions = ["普通注释引线的水平段（GB/T 4457.2基准线）：横线上写说明文字。", "文字下划线：贴文字底部，无箭头线相连。", "平面补充符号（短横线）：长度约1h，不连箭头线。", "不可见轮廓（细虚线）：属于零件投影，长度和位置与轮廓对应。", "可能热处理区的粗虚线：粗线、贴零件轮廓。"]
related = ["DC-G7-136", "DC-G7-141", "DC-G7-131", "DC-G7-135", "DC-G7-036", "DC-G1-018", "DC-G1-045"]
priority = "high"
text_forms = []
knowledge_units = ["K43", "K40", "K41", "K24"]
