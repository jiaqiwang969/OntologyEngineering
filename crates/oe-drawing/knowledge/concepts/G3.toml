[[concepts]]
id = "DC-G3-126"
name = "管子的简化画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "管子可只在端部画出一小段管形，其余沿走向用细点画线画中心线；或整根用与中心线重合的单根粗实线表示；锅炉、化工设备装配图中的密集管子可用细点画线表示。"
components = ["端部画法：管子两端各画一小段双轮廓及管口，中间沿走向只画细点画线中心线，弯曲处中心线以圆弧过渡。", "单线画法：整根管子画成一条与其中心线重合的粗实线，弯头处用圆弧过渡，端部可加小的折断标记。", "密集管束：锅炉、化工设备装配图中大量管子只用细点画线示意位置。", "单线管路的尺寸按单线图注法注在线上。"]
variants = ["ends + centre line", "single thick line", "dense tubes as dash-dot lines (A.14)"]
dxf_forms = ["End pieces as short LINE pairs on layer 01 with ELLIPSE/ARC ends; path as LINE+ARC chain or LWPOLYLINE with bulges on layer 05 (CENTER linetype)", "Single-line pipe as LWPOLYLINE (often with global width equal to the thick-line width) or LINE/ARC chain on layer 01", "Dense tube bundle as many parallel LINEs on layer 05", "Piping add-ons may emit MLINE or blocks; plain GB templates use LINE/ARC"]
recognition = "单线形式以粗实线多段线为锚点：长宽比极大、两侧没有平行的轮廓线、拐弯处为圆弧过渡、端部连接到管接头、法兰或管口等可识别图形。端部形式以两段短双线管段为锚点，两者之间只有一条细点画线相连，且该点画线路径含圆弧拐弯，不对应任何回转体轮廓。轴的中心线两侧有贯穿全长的对称粗实线轮廓，可据此排除。"
confusions = ["轴、孔的中心线：两侧有对称粗实线轮廓，通常为直线不拐弯。", "钢筋、钢丝绳单线：多带弯钩，用于结构或吊挂，不连接管接头。", "带传动符号的粗线：两端连接带轮符号，出现在机构简图中。"]
