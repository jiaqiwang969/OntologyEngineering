components = ["在端视图齿顶圆与齿根圆之间画出一两个完整齿廓（粗实线）。", "或用局部放大图：在原视图中圈出部位，另画放大的齿形并注尺寸。", "其余齿仍按齿顶圆、分度圆、齿根圆的规定画法。"]
