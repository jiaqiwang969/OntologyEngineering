recognition = "锚点为钻孔：两条平行粗实线加中心线（剖视中两侧有剖面线）。检查孔口：若孔口所在的主轮廓为斜线或圆弧，而孔口处有一小段垂直于孔轴的粗实线（长度约为孔径的1.2–2倍），并与主轮廓形成外凸台阶（凸台）或内凹台阶（凹坑），判为钻孔端面结构。与沉孔/锪平区分：沉孔平底也垂直孔轴，但位于平面上并带沉孔深度尺寸；与一般凸台区分：一般凸台为支承面，不一定对应孔轴。"
