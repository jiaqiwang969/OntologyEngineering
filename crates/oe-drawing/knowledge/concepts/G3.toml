[[concepts]]
id = "DC-G3-078"
name = "齿轮啮合外形视图画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在平行于齿轮轴线的外形视图（不剖）中，啮合区内齿顶线不画，节线用粗实线画；其他处的节线仍为细点画线。适用于圆柱齿轮副和锥齿轮副。"
components = ["两齿轮各自外形：啮合区以外齿顶线为粗实线。", "啮合区：两齿轮齿顶线中断不画，相切节线为一段粗实线，长度等于齿宽。", "啮合区以外的节线为细点画线。", "斜齿时可另画三条细实线表示齿线。"]
variants = ["圆柱齿轮副", "锥齿轮副"]
dxf_forms = ["Thick LINE segment, length = face width, lying on the extension of the CENTER-linetype pitch lines, between the two gear outlines", "Gaps in the thick tip LINEs over the mesh zone (tip lines trimmed)", "CENTER-linetype pitch LINEs outside the mesh zone"]
recognition = "锚点为两个轴线平行（锥齿轮为相交）的齿轮外形视图之间的一段粗实线：它与两侧点画线分度线共线，长度约等于齿宽，两端与齿轮端面线相接；该处本应出现的齿顶线断开缺失，且整个视图无剖面线。与两零件接触轮廓线区分：接触线不与分度点画线共线，两侧也没有齿顶线缺口；与啮合区剖视区分：剖视中有虚线、齿根线和剖面线。"
confusions = ["两零件的接触轮廓线：不与分度线共线，无齿顶线缺口。", "啮合区剖视画法：有虚线、顶隙和剖面线。", "端视图啮合：圆视图中分度圆相切，啮合区齿顶圆画粗实线或省略。"]
