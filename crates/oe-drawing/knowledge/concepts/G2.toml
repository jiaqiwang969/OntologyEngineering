recognition = "以嵌套剖面区域为锚点：内区域完全位于外区域之内，两者剖面线角度和间距相同而相位不同；附近有指引线连到剖视名称文字。方向相反或间距不同是相邻零件；并排而非嵌套的错开属同一零件相邻剖切图。"
