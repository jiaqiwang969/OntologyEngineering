[[concepts]]
id = "DC-G4-116"
name = "区间符号（起止字母间）"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "区间符号：用两个大写字母标出尺寸要素上一段固定限定部分的起点和终点，两字母之间用双向箭头“←→”隔开，写在尺寸公差之后，表示要求只适用于该段。"
components = ["起止字母：两个大写字母，分别用细实线指引到要素上的起点和终点位置", "区间箭头：两字母之间一个双头箭头符号", "位置：写在尺寸公差及修饰符之后", "范围定位：起止点位置由理论正确尺寸确定"]
variants = []
dxf_forms = ["TEXT/MTEXT 'A' + double-arrow glyph (U+2194 or a font glyph) + 'B' after the tolerance", "double arrow drawn as a short LINE with two SOLID heads between letter TEXTs", "letters at the feature placed with leader LINEs ending on the outline"]
recognition = "锚点：尺寸公差之后出现“字母 ↔ 字母”的组合（或两个字母之间一条带双箭头的短线）。在图形上能找到同样两个字母，各自用指引线标在同一要素的两点，且两点间距由方框尺寸（TED）给出。与基准字母区分：基准字母在方框内并有三角；与剖视名称A—A区分：用长横线连接且在视图上方；与几何公差中的区间符号区分：后者在公差框格之上或之旁。"
confusions = ["基准字母：方框内，带基准三角", "剖视名称 A—A：两字母间为短横线，位于视图上方", "几何公差中的区间符号 ↔（G5）", "字母间的连字符：表示公共基准 A-B"]
