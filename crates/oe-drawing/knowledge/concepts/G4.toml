[[concepts]]
id = "DC-G4-002"
name = "轮毂键槽画法与尺寸注法"
aliases = []
group = "G4"
kind = "conventional_representation"
meaning = "齿轮、带轮等轮毂孔内的平键键槽：用通过孔轴线和槽对称面的全剖视图加孔与槽的局部视图表达，注槽宽 b、孔径 Ød，以及从孔的对侧母线量到槽底的 d+t2（t2 为轮毂槽深）。"
components = ["全剖视图：沿轮毂孔与键槽的对称面剖开，键槽为孔壁一侧的矩形凹入，槽底线贯通轮毂长度，槽内不画剖面线", "局部视图：在端视方向只画孔圆和孔顶部的矩形槽口轮廓", "尺寸：槽宽 b（常带公差带代号）、孔径 Ød（常带 H7 等）、d+t2（自槽底到孔圆对侧，数值大于孔径）", "槽宽、槽深的公差与表面结构按键标准查表注出（见键槽公差概念）"]
variants = []
dxf_forms = ["bore CIRCLE + slot rectangle as exploded LINE/ARC on layer 01; slot top edge at distance (d+t2) from the far side of the circle", "DIMENSION dimtype 0 for width b with override text such as '5JS9' or '<>' plus stacked deviation", "DIMENSION dimtype 0 for d+t2 in the local view: extension lines from the slot-bottom LINE and from the far quadrant point of the bore CIRCLE; text like '16.3{\\H0.7x;\\S+0.1^0;}'", "DIMENSION dimtype 0 with '%%c<>' or dimtype 3 for the bore, e.g. '%%c14H7'", "full section: HATCH ANSI31 on layer 10 covering the hub but not the slot or bore"]
recognition = "锚点为端视局部视图中的孔圆（CIRCLE，半径 r）与紧贴其外侧的矩形缺口：两条平行短线（间距 b，约0.25d~0.3d）自圆周向外，顶端被一条垂直线封闭，封闭边到圆心距离大于 r。尺寸上找一个线性尺寸，两界线分别过槽顶（底）边和孔圆对侧象限点，数值≈d+t2，大于孔径而小于约1.5d；另有宽度尺寸≈b。剖视图中孔为两条平行轮廓，槽底线离轴线更远，剖面线不进入孔和槽。与轴上键槽区分：轴槽是实心圆内的凹入，深度尺寸为 d−t1 且小于直径。"
confusions = ["轴上键槽：位于实心轴断面内，标 d−t1（小于轴径），常用移出断面表达", "花键孔：多个均布键槽并有花键代号", "孔内其他止转槽或油槽：尺寸不按键标准，没有 d+t2 关系"]
related = ["DC-G4-003", "DC-G4-036", "DC-G4-127", "DC-G3-072", "DC-G3-222", "DC-G2-076"]
priority = "medium"
text_forms = ["5JS9", "Ø14H7", "16.3 +0.1/0（d+t2）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K35", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Tolerance class examples (JS9) and positive deviation on d+t2 follow general keyway practice and the interchangeability book table cited under DC-G4-036; the textbook page gives only b=5, Ø14, d+t2=16.3."
[[concepts.sources]]
document = "机械制图（第7版）"
clause = "§8-3 一"
