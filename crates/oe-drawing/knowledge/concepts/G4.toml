[[concepts]]
id = "DC-G4-100"
name = "尺寸规范修饰符的排列顺序"
aliases = []
group = "G4"
kind = "text_convention"
meaning = "GPS尺寸规范中各修饰符的固定排列顺序：n×和UF在公称值之前；公差之后依次为尺寸特征修饰符、限定部分/截面修饰符、统计修饰符、SCS、区间、CT、Ⓕ、相交平面与方向要素框格、旗注。"
components = ["前置：n×（与公称值间留空格）、UF", "主体：Ø/SØ+公称值，公差（±、偏差、公差代号或极限值）", "特征类型修饰符：LP、LS、GG、GX、GN、GC、CC、CA、CV、Ⓔ等，前两类字母修饰符画在长圆框内", "限定部分与截面：/长度、ACS、ALS；统计修饰符 SX、SN、SA 等（在部分或截面修饰符之后）", "其后：SCS、区间符号、CT、Ⓕ、相交平面框格与方向要素框格、旗注", "文字间距：公称值与其后成分之间、偏差与其后成分之间留空格；规范可写一行或两行"]
variants = ["one-line", "two-line"]
dxf_forms = ["MTEXT with stacked deviations followed by modifier text, e.g. '%%c20 \\S+0.1^-0.2; GG ACS'", "modifier frames as small INSERT blocks or exploded LWPOLYLINE stadium shapes around TEXT", "DIMENSION override text containing the whole sequence (frames lost or drawn separately)"]
recognition = "用于解析而非定位：当尺寸文字后跟两字母大写代码（LP/LS/GG/GX/GN/GC/CC/CA/CV/SX/SN/SA/SM/SD/SR/SQ）或ACS/ALS/SCS/CT/UF时，按标准顺序切分成分。顺序不符时提示读数错误或非GPS用法。两字母修饰符在DXF中常与一个长圆形闭合多段线（宽约2.5h、高约1.6h）相伴，可据此与普通字母文字区分。"
confusions = ["几何公差框格内的修饰符（ACS、CZ、Ⓜ等）：属于几何规范", "表面结构参数代号（Ra、Rz）：在表面结构符号上", "统计修饰符SR与球半径SR：前者在公差之后并带框，后者在数值之前"]
related = ["DC-G4-106", "DC-G4-108", "DC-G4-112", "DC-G4-147", "DC-G4-140", "DC-G5-096"]
priority = "rare"
text_forms = ["UF 3×Ø10±0.1 GN", "2× 150±0.05 GG ACS SA CT", "25±0.1 GG /25 SA", "10±0.03 GN ALS"]
