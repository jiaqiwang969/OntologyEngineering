recognition = "锚点为一组尺寸（DIMENSION 或散线结构），其第一定义点坐标相同或位于同一条界线上，尺寸线互相平行，离轮廓的距离等差递增（差值约1.5~2倍字高），数值随距离递增。角度型：顶点相同、弧形尺寸线半径递增、共用起始边。与链式尺寸区分：链式尺寸线共线、首尾相接、数值为分段长；与坐标式（叠加）尺寸区分：后者只有一条尺寸线、数值沿各界线端注写。"
