[[concepts]]
id = "DC-G1-114"
name = "比例（标注形式）"
aliases = ["比例"]
group = "G1"
kind = "text_convention"
meaning = "图中图形与实物相应要素的线性尺寸之比，用冒号表示、图形尺寸在前：1:1为原值比例，大于1为放大比例，小于1为缩小比例；一般注在标题栏的比例栏内。"
components = ["写法：两数以冒号分隔，如1:1、1:2、2:1、1:500。", "优先系列：1:1；放大5:1、2:1、1×10ⁿ:1 及其×10ⁿ；缩小1:2、1:5、1:10 及其×10ⁿ。", "允许系列：放大4:1、2.5:1 及其×10ⁿ；缩小1:1.5、1:2.5、1:3、1:4、1:6 及其×10ⁿ（教材表中加括号为次选）。", "位置：标题栏比例栏；必要时在视图名称下方或右侧。"]
variants = ["原值比例 1:1", "放大比例", "缩小比例", "优先系列（表1）", "允许系列（表2）", "原值比例", "带括号的次选比例"]
dxf_forms = ["TEXT or ATTRIB in the title-block INSERT (tags like 比例, SCALE, BL)", "DIMLFAC (linear factor) and DIMSCALE in the dimstyle; viewport scale in paper-space layouts"]
recognition = "锚点为标题栏“比例”格中的文本，匹配 ^\\d+(\\.\\d+)?\\s*[:：]\\s*\\d+(\\.\\d+)?$。用于把几何长度换算为实物尺寸：模型空间按1:1绘制时图框被放大（缩小比例）或缩小；也可用“测得长度/尺寸数字”验证（DIMLFAC 可能已补偿）。与锥度、斜度区分：后者前有锥度或斜度符号、注在图形旁，比例在标题栏或视图名下。"
confusions = ["锥度 1:n：带锥度符号，注在圆锥处。", "斜度 1:n：带斜度符号。", "尺寸数字中的比值、传动比：技术参数，不是绘图比例。"]
related = ["DC-G1-115", "DC-G1-089", "DC-G1-105", "DC-G9-025", "DC-G4-057", "DC-G4-048"]
priority = "high"
text_forms = ["1:1", "1:2", "2:1", "1:2.5", "1:100"]
