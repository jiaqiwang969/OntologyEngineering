[[concepts]]
id = "DC-G3-229"
name = "螺纹紧固件标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "螺栓、螺钉、螺柱、螺母、垫圈等标准紧固件的规定标记，由名称、标准编号、螺纹规格（或规格×公称长度）及性能等级或硬度组成，写在明细栏或图上旁注，代替画出详细尺寸。"
components = ["接近完整的标记：名称 + 标准编号 + 空格 + 螺纹规格（或螺纹规格×公称长度）+“-”性能等级或硬度，如垫圈 GB/T 97.1 16-200HV。", "采用现行标准时可省略标准编号中的年号；标准编号后、规格前须空一格。", "性能等级或硬度为常用等级时可省略；名称也可省略，只写标准编号与规格（如GB/T 71 M12×40）。", "规格写法：螺栓、螺钉、螺柱为M×长度（M12×50），螺母为M规格（M16），垫圈为公称尺寸（16、20）。", "紧固件标记方法有完整标记与简化标记两种（GB/T 1237-2000），教材采用不同程度的简化标记。"]
variants = ["完整标记", "简化标记"]
dxf_forms = ["TEXT/MTEXT in parts-list cells on layer 11, typically 代号 'GB/T 5782-2000' and 名称 '螺栓 M12×50', with 数量 and 材料 in adjacent cells", "ATTRIB values of BOM row block INSERTs (CAXA/GstarCAD 明细表 exported as INSERT+ATTRIB or exploded LINE+TEXT)", "Leader TEXT on the view, e.g. '4×螺栓 GB/T 5782 M12×50', near the fastener drawn by simplified representation"]
recognition = "锚点为文字正则 (螺栓|螺钉|螺柱|螺母|垫圈)?\\s?GB/?T\\s?\\d+(\\.\\d+)?(\\s?[—-]\\s?\\d{4})?\\s+M?\\d+(\\.\\d+)?(\\s?[×xX]\\s?\\d+)?(\\s?-\\s?(\\d+(\\.\\d+)?|\\d+HV))?；常见紧固件标准号可建白名单（5782、5783、6170、97.1、93、65、67、70.1、71、899等）。位置：明细栏行内（与序号、数量同行），或装配图上指向紧固件的引线；明细栏规格中的M值应与图中螺纹标记或紧固件直径一致。"
confusions = ["螺纹标记（M12-6g）：无标准编号，带公差带代号。", "图样代号：明细栏代号栏中的本单位图号，不以GB/T开头。", "键、销标记：含“键”“销”字与GB/T 1096、119.1、117、91等编号。", "滚动轴承标记：以“滚动轴承”开头，代号为4~5位数字。"]
related = ["DC-G3-083", "DC-G3-060", "DC-G3-129", "DC-G3-223", "DC-G8-025", "DC-G8-014", "DC-G8-018"]
priority = "high"
text_forms = ["螺栓 GB/T 5782 M12×50", "螺钉 GB/T 70.1 M16×40", "螺柱 GB/T 899 M12×50", "螺母 GB/T 6170 M16", "垫圈 GB/T 97.1 16-200HV", "垫圈 GB/T 93 20", "GB/T 71 M12×40"]
knowledge_units = ["K13", "K34"]
