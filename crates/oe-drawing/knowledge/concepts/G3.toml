meaning = "密封特征画法中的T形（凸起）和U形（凹入）粗实线要素符号，两者组合使用表示非接触密封，例如迷宫式密封。"
components = ["T形：一条竖线顶端加一条横线，表示凸起的密封齿。", "U形：一条横线两端各连一条竖线，表示凹入的密封槽。", "两者在同一密封框内嵌套组合，不单独使用；2009版表1之3.2.6/3.2.7与1996版表1之1.5/1.6相同。"]
variants = ["T形（凸起）", "U形（凹入）"]
dxf_forms = ["LWPOLYLINE or LINE strokes on layer 01 forming T and U shapes inside a seal frame", "Rarely a library INSERT; usually drawn by hand"]
recognition = "在密封框内查找T形折线与U形折线配对出现、T的横梁处于U的开口内而不相交的组合。单独的T或U形线条（如焊缝坡口符号、槽轮廓）不作此解释，须同时满足位于轴与孔之间小框内且两者嵌套。"
confusions = ["焊缝符号（I形、U形坡口）：附在指引线基准线上。", "零件上的槽：属于零件轮廓且带剖面线。", "T形钢等型材符号：出现在文字标记中，不在密封框内。"]
