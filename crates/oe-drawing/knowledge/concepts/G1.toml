meaning = "CAD 图样中字高随图幅选用：A0、A1 上字母数字5 mm、汉字7 mm；A2~A4 上字母数字3.5 mm、汉字5 mm；并规定字距、行距及字与间隔线或基准线的最小距离。"
components = ["GB/T 14665-2012 表3：A0/A1 字母数字5、汉字7；A2/A3/A4 字母数字3.5、汉字5（mm）。", "最小距离（表4）：汉字字距1.5、行距2、与间隔线或基准线间距1；字母数字字距0.5、词距1.5、行距1、与基准线间距1（mm）；混用时按汉字规定。", "1998 版汉字为 A0/A1 5 mm、A2~A4 3.5 mm，2012 版各提高一号；GB/T 18229-2000 表4 也有对应规定。"]
variants = ["GB/T 14665-1998: Chinese 5 mm (A0/A1) and 3.5 mm (A2-A4), raised in 2012", "GB/T 18229-2000 表4 (values only partly legible in the OCR)"]
