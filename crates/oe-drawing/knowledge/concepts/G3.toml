[[concepts]]
id = "DC-G3-031"
name = "渐开线花键画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "渐开线花键（内、外）按矩形花键的规定画法绘制，唯一区别是分度圆和分度线用细点画线画出，表明齿形为渐开线。"
components = ["外花键：平行于轴线的视图中大径粗实线、小径细实线、分度线细点画线；工作长度终止端与尾部末端为垂直轴线的细实线，尾部为约30°斜细实线。", "外花键断面图中画出部分或全部渐开线齿形，分度圆为细点画线圆。", "内花键：平行于轴线的剖视中大径、小径均为粗实线，分度线细点画线；在局部视图中画出部分或全部齿形。", "尺寸注法与矩形花键相同，或用花键标记（INT/EXT、齿数z、模数m、压力角30等）注在由大径引出的指引线基准线上。"]
variants = ["外花键", "内花键"]
dxf_forms = ["pairs of LINE symmetric about the axis: thick (major), thin (minor), CENTER/ACAD_ISO04W100 linetype (pitch) — the pitch pair is a centre-linetype line NOT lying on the axis", "removed section: CIRCLE (tip, thick) + CIRCLE CENTER linetype (pitch) + involute flanks as SPLINE or chains of short ARC/LINE, or an INSERT from a spline/gear library (often exploded)", "HATCH ANSI31 inside the external-spline section; designation as MTEXT/TEXT on a leader landing (e.g. 'INT 24z×2.5m×30R×5H GB/T 3478.1'), graphic symbol as small block or font glyph", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一对关于轴线对称、线型为点画线但不在轴线上的直线（分度线），位于粗实线大径与细实线（外）或粗实线（内）小径之间；同一段内有细实线的终止端（垂直轴线）及约30°尾部斜线，断面图齿数多（常≥10）、齿高小（约等于模数，远小于直径）、齿侧为曲线。附近常有含INT/EXT、z、m的标记文字。与圆柱齿轮区分：齿轮的齿宽相对直径短、配有参数表、无30°尾部线，且多在端视图只画圆；与矩形花键区分：矩形花键无分度线、齿侧为直线且齿数少（6–10）；与外螺纹区分：螺纹无分度点画线、终止线为粗实线。"
confusions = ["圆柱齿轮/齿轮轴：线型组合相同（顶粗、分度点画、根细），但有齿轮参数表、齿宽短，无花键尾部30°线。", "矩形花键：没有分度线，断面齿侧平直、齿数少。", "外螺纹：大径粗小径细，但无分度点画线，长度终止为粗实线螺纹终止线。"]
