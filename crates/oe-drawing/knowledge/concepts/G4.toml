[[concepts]]
id = "DC-G4-108"
name = "任意横截面修饰符 ACS"
aliases = ["任意横截面 ACS"]
group = "G4"
kind = "tolerance_indication"
meaning = "ACS表示尺寸规范适用于任意横截面（垂直于轴线的平面）内的尺寸，即每个横截面分别满足要求；可注在视图或剖面图上，常与GG、GX等拟合修饰符和统计修饰符连用。"
components = ["符号：大写字母ACS，不加框，与前后成分以空格分开", "位置：在尺寸特征修饰符之后、统计修饰符之前（统计修饰符定义全局特征时位于ACS之后）", "可选附加：必要时后接相交平面框格；在限定部分上用粗点画线或区间符号指明范围", "与几何公差中的ACS同名，但在几何公差框格中出现时属几何规范"]
variants = ["同心度+ACS"]
dxf_forms = ["plain TEXT/MTEXT 'ACS' following the tolerance in a DIMENSION override text or leader MTEXT", "in GD&T frames: TEXT 'ACS' next to a TOLERANCE entity or frame lines (different concept)"]
recognition = "锚点：独立的大写词“ACS”（无框），出现在尺寸公差或两字母修饰符之后。若它位于尺寸线/尺寸文字串中→尺寸修饰符；若位于几何公差框格旁或框格上方→几何规范的ACS。与ALS区分：中间字母为L；与SCS区分：特定横截面需同时给出截面位置。"
confusions = ["ALS 任意纵向截面", "SCS 特定横截面", "几何公差中的ACS（同心度、圆跳动等）", "基准字母或零件代号中的ACS字样"]
related = ["DC-G4-109", "DC-G4-135", "DC-G4-110", "DC-G5-028", "DC-G4-100"]
priority = "rare"
text_forms = ["Ø150 ±0.2 GG ACS", "10±0.1 GX ACS", "12±0.05 GG ACS SX"]
