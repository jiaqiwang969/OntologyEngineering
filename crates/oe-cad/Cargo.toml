[package]
name = "oe-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Explicit local transport test support; excluded from default product builds.
nx-test-fixtures = []

[[bin]]
name = "nx-transport-test-fixture"
path = "tests/support/nx_transport_fixture.rs"
required-features = ["nx-test-fixtures"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
zip.workspace = true
chrono.workspace = true
oe-core.workspace = true
oe-browser.workspace = true
oe-wire.workspace = true
oe-nx-protocol.workspace = true
oe-nx-worker = { path = "../oe-nx-worker" }
oe-sw-worker.workspace = true
oe-contracts = { path = "../oe-contracts" }
shlex.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
