[[concepts]]
id = "DC-G2-006"
name = "接合件的剖面符号"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "由焊接、铆接、粘接等组成的接合件：在接合件自身的图样中，各组成件按相邻零件规则分别画剖面符号；在与其他零件的装配图中，若各组成件剖面符号相同，一般可作为一个整体画同一剖面线，不同则分别画出。"
components = ["接合件自身图样：各组成件剖面线方向相反或间距不同，接合处另有焊缝等表示。", "装配图中：接合件整体一组剖面线，跨过内部接合面方向和间距不变。", "材料不同：仍按各自剖面符号分别画出。"]
variants = ["components hatched separately", "unit hatched as one piece"]
dxf_forms = ["Separate HATCH entities per component with different angle (ANSI31 angle 0 vs 90) or scale in the weldment drawing", "One HATCH (single origin/angle/scale) spanning several loops in the assembly drawing", "Weld cross-sections as HATCH SOLID/SOLID fill near the joints"]
recognition = "以共享边界的多块剖面区域为锚点：内部边界两侧剖面线方向、间距相同且相位连续，边界附近有焊缝涂黑或焊缝符号，且明细栏中只对应一个序号，判为接合件整体画法；方向相反但同一序号或标注为焊接件图，判为分画法。需结合序号和明细栏确认是一个部件。"
confusions = ["单一零件：内部没有接合面线和焊缝。", "相邻独立零件：各有序号，剖面线必须区分。"]
related = ["DC-G2-009", "DC-G7-001", "DC-G7-035", "DC-G8-024"]
