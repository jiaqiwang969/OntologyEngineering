[[concepts]]
id = "DC-G7-072"
name = "辅助支承符号"
aliases = []
group = "G7"
kind = "symbol"
meaning = "机械加工工艺图中表示辅助支承的符号（细实线）：标在轮廓线上为小三角形内画波纹线，标在视图正面为圆内画波纹线；联合支承用连线相连。"
components = ["轮廓线上：封闭小三角形，顶点指向并触及被支承表面，内有竖向波纹线，尺寸同定位支承。", "视图正面：圆内画波纹线（圆直径约h）。", "联合支承：两个符号由连线相连，连线可折。", "波纹形状不作具体规定。"]
