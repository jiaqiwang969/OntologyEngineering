tests = ["cutting_letter_sites_cover_start_end_turn_and_complete", "cutting_letter_sites_do_not_invent_omitted_paths_or_resolve_conflicts"]
parameter_basis = "Ratios below are geometric association and placement tolerances relative to the source letter height, not numeric requirements of the standard. Loose planar strokes/TEXT only; nested occurrences and ambiguous names remain outside this automatic profile."
