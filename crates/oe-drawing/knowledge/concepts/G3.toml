[[concepts]]
id = "DC-G3-144"
name = "中心孔符号（要求保留）"
aliases = ["中心孔符号（可以保留）", "中心孔符号（不允许保留）"]
group = "G3"
kind = "symbol"
meaning = "画在轴类零件端面中心处的图形符号，表示完工零件上对标准中心孔的保留要求：要求保留、可以保留或不允许保留；与中心孔标记配合使用，中心孔本身不画出。"
components = ["要求保留：两条短粗线组成张角60°的开口折线（形如“<”），顶点落在轴端面轮廓线与轴线的交点，开口背向零件，中心孔标记紧接写在符号开口右侧。", "可以保留：不画任何符号，仅从端面与轴线交点处引出指引线，在基准线上写中心孔标记。", "不允许保留：在“<”的顶点处再加一条垂直于轴线的短竖线，整体形如字母“K”，标记同样写在右侧。", "比例：符号线宽约为尺寸数字字高h的1/10，符号总高H1约为1.4h（h=3.5时H1=5），标记文字与尺寸数字同字高，位于符号开口一侧的注写区内。", "中心孔的型式与尺寸由随后的标记（如B2.5/8）给出，两端相同时可只注一端并加数量（见中心孔简化表示法）。"]
variants = []
dxf_forms = ["Exploded LINE pair: two short strokes at ±30° to the axis (60° included), apex on the axis at the end-face line, on layer 01 (thick) or the dimension/symbol layer 08; the '不允许保留' form adds a short LINE perpendicular to the axis at the apex", "INSERT of a centre-hole symbol block from a CAXA/GstarCAD mechanical symbol library, often with ATTRIB or a following TEXT for the designation", "TEXT/MTEXT 'GB/T 4459.5-B2.5/8' on layer 11 placed just right of the symbol, or on a LEADER/MULTILEADER reference line from the end face (the only form for '可以保留')", "Older drawings: plain leader TEXT such as '中心孔B3.15 GB/T 145' with no symbol"]
recognition = "锚点为中心孔标记文字（见DC-G3-218的正则）或“中心孔”字样；向其左侧/引线终点回溯：若有两条长约1~1.4倍字高、夹角约60°、开口背向零件的线段，且顶点落在一条中心线（点画线）与零件端面粗实线交点附近（容差约0.5h），判为“要求保留”；顶点处另有一条垂直轴线、长度约等于符号高度的短线，判为“不允许保留”；只有指引线和基准线而无折线，判为“可以保留”。应位于轴类零件的轴向两端。与尺寸箭头区分：箭头为实心或闭合三角、顶点落在尺寸界线上且不跟中心孔标记；本符号为两条开放线段，张角固定60°。"
confusions = ["尺寸线/引线箭头：箭头是实心填充的小三角，长约3~4倍线宽，后面不跟R/A/B/C型中心孔标记；中心孔符号为两条开放线段且紧接中心孔标记。", "不允许保留符号：比要求保留符号多一条垂直于轴线的短竖线（呈K形），两者必须按有无竖线区分，否则语义相反。", "固定顶尖等定位夹紧符号（GB/T 24740）：属于工艺图上的定位、夹紧符号，有自身图形与数字，不跟GB/T 4459.5标记。", "字母K：作为文字时是TEXT实体；符号由LINE或块构成且顶点在轴端面与轴线交点处。", "普通引出注释：可以保留形式只有引线加文字，靠文字是否符合中心孔标记格式来区分。"]
related = ["DC-G3-218", "DC-G3-209", "DC-G3-003", "DC-G3-105", "DC-G5-001", "DC-G6-012"]
priority = "medium"
text_forms = ["GB/T 4459.5-B2.5/8", "GB/T 4459.5-A4/8.5", "GB/T 4459.5-A1.6/3.35", "2×R3.15/6.7"]
knowledge_units = ["K13", "K39"]
recognition_cards = ["center_hole_symbol"]
recognizer = "card"
seen_on_drawing = ["second"]
expert_checked = false
notes = "三种要求与符号形状、比例取自GB/T 4459.5-1999表1和附录B（已核对页面图像：可以保留一栏不画符号）。目录名为“要求保留”，别名并入了可以保留和不允许保留，本卡覆盖三种。图层、块和旧式“中心孔B3.15 GB/T 145”写法来自一般CAD/制图习惯。已有识别卡center_hole_symbol对应本概念。"
