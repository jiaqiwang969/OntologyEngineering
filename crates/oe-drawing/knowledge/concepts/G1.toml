[[concepts]]
id = "DC-G1-026"
name = "截交线"
aliases = []
group = "G1"
kind = "line"
meaning = "平面截切立体（切槽、开口、铣扁、切角）时在立体表面上产生的交线，是截平面与立体表面的共有线，按可见性画粗实线或细虚线。"
components = ["截平面平行于圆柱轴线时交线为两条平行直线，垂直时为圆（弧），倾斜时为椭圆（弧）；圆锥、球截切得圆、椭圆、抛物线等。", "可见部分画粗实线，不可见部分画细虚线；端点落在转向轮廓或其他交线上。", "曲面立体的截交线一般是闭合平面曲线，或由曲线与直线围成的平面图形。"]
variants = []
dxf_forms = ["LINE/ARC/ELLIPSE/SPLINE (or LWPOLYLINE approximating a curve) on the thick or hidden layer", "ELLIPSE entity for an oblique cut of a cylinder", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "截交线与其他轮廓同型，靠几何关系识别：回转体视图中出现与素线平行、间距小于直径的一组直线（铣扁、开槽），其端点与另一视图中截平面的积聚直线按投影对应；或 ELLIPSE/样条与圆柱、圆锥轮廓相接。与相贯线区分：截交线所在的截面在另一视图中积聚为直线。"
confusions = ["相贯线：两立体相交的交线。", "平面符号：细实线对角线，表示平面而非交线。", "过渡线：细实线，端部留隙。"]
related = ["DC-G1-035", "DC-G1-015", "DC-G1-054", "DC-G3-026"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "截交线是投影几何概念，不是单独线型；识别依赖多视图对应（通用实践）。"
