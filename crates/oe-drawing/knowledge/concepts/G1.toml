[[concepts]]
id = "DC-G1-048"
name = "螺纹牙底线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细实线画出螺纹牙底所在的线：外螺纹的小径线、内螺纹的大径线；在投影为圆的视图中画约3/4圈的细实线圆弧。"
components = ["细实线（No.01.1.8）。非圆视图中与牙顶线（粗实线）平行，作图时小径常近似取大径的0.85倍。", "外螺纹细线在粗实线（大径）内侧，内螺纹剖视中细线在粗实线（小径）外侧；外螺纹倒角部分也应画出牙底线。", "投影为圆的视图中牙底圆只画约3/4圈，倒角圆省略不画。", "不可见螺纹的牙底、牙顶线都画细虚线。"]
variants = []
dxf_forms = ["thin ARC with an included angle of about 270° concentric with a thick CIRCLE", "thin LINEs parallel to the thick crest lines over the threaded length", "thread blocks of mechanical add-ons (AutoCAD Mechanical, GstarCAD, CAXA) or their exploded strokes", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一条包角约270°的细实线圆弧，与一个粗实线整圆同心，半径比约0.85（外螺纹细弧在粗圆内，内螺纹细弧在粗圆外）。非圆视图中：一对细实线与一对粗实线平行、关于轴线对称，终止于一条垂直于轴线的粗实线（螺纹终止线）；附近有 M、G、Tr、Rc 等开头的螺纹标记。这是识别螺纹最强的几何特征。"
confusions = ["螺纹牙顶线：粗实线。", "不可见轮廓线：细虚线；不可见螺纹全为虚线。", "倒角圆、孔的同心圆：整圆而非3/4圆弧。"]
related = ["DC-G1-049", "DC-G1-043", "DC-G3-024", "DC-G3-005", "DC-G3-094", "DC-G3-088"]
priority = "high"
text_forms = ["M10-6g", "M24×1.5-6H"]
knowledge_units = ["K03", "K52", "K55", "K34"]
recognition_cards = []
recognizer = "none"
