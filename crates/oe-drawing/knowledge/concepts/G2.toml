[[concepts]]
id = "DC-G2-019"
name = "剖面区域的式样（CAD剖面符号）"
aliases = []
group = "G2"
kind = "section"
meaning = "CAD工程图中剖面区域按材料类别用规定式样填充：金属和普通砖为等距45°细线，非金属（普通砖除外）为交叉线，另有固体、液体、气体、混凝土、木质件和透明材料等式样；CAD中可按材料库建立剖面符号库自动生成。"
components = ["剖面区域边界：粗实线闭合轮廓。", "填充式样：按材料类别选择（单向斜线、交叉斜线、点、短横线等）。", "剖面线参数：细实线，通常与主要轮廓或对称线成45°，间距按区域大小选取且不小于平行线最小间距0.7 mm。", "图层：剖面符号单独放在第10层。"]
variants = ["金属材料/普通砖", "非金属材料（除普通砖外）", "固体材料", "液体材料", "气体材料", "混凝土", "木质件", "透明材料"]
dxf_forms = ["HATCH with pattern name: ANSI31 (single 45° lines, metal/general), ANSI37 (45° crosshatch, non-metal), AR-CONC (concrete), AR-SAND/DOTS (stipple), SOLID (black), NET (square grid), LINE/dashed (liquid) — AutoCAD names", "CAXA/GstarCAD GB templates: patterns such as ANSI31 or named 金属/非金属, layer '剖面线' or GB layer 10 (green, thin)", "After explode or in legacy files: groups of parallel LINE segments on the hatch layer"]
recognition = "以HATCH实体（读图案名、角度、比例、边界环）或成组平行细线（同层、同角度、等间距、端点落在同一闭合粗实线边界上）为锚点；按图案签名归类材料：单向等距斜线→金属/通用；两组正交斜线→非金属；三角+点→混凝土；随机细点→型砂、粉末冶金等。平面对角线只有两条细线，网格线跨越多个视图，滚花为粗实线且在外形视图上。"
confusions = ["表示平面的对角线：只有两条交叉细实线，不成组。", "网格线：跨越视图的坐标或分区网格。", "滚花：粗实线网纹，画在外形视图上。"]
