[[constraints]]
id="cad_correspondence_source_bound1"
requirement="req_engineering"
module="cad"
check="verify"
rust_path="crates/oe-cad/src/evidence/correspondence.rs"
statement="逐原件SHA/JSON指针恢复特征意图和变化声明；复用observe_part_bound核真实完成inspect任务及完整原输入/输出，再以select_v2原算法检查完整圆边候选。文件16MiB/集合64MiB、两端每端256绑定/256变化/每声明256依赖有界。先后重读，不接受任意native JSON或反序列化报告恢复Verified。Some occurrence、SW、split/merge未合格保留unresolved；零匹配不能自动认删除；新增/复制/删除在首版仅有来源声明，不自报谱系。"
severity="error"

[[constraints]]
id="cad_correspondence_current_consumer1"
requirement="req_engineering"
module="cad"
check="require_current_feature"
rust_path="crates/oe-cad/src/evidence/correspondence.rs"
statement="仅有源retained一一声明且两端完整唯一观察形成bounded_declared_correspondence；该profile不核创建任务到检查输入的creator谱系；当前消费者还要匹配精确ObjectIdentity、native-result SHA与唯一feature_id，仍执行原图纸/孔列检查，不继承旧工程采用。同文件SHA变化使旧绑定过时；区别设计值变化与来源重绑定；完全相同输入可no_delta。生产入口核Project/cad_focus、来源/依赖节点，调用原reconcile及old/currentimpact，原要求和失败保留。"
severity="error"

[[sources]]
id="cad_correspondence_declared_scope1"
identity="docs/CAD-CORRESPONDENCE.md；specs/modules/cad-engineering-binding.toml内oev2.cad-correspondence/1、oev2.cad-feature-intent/1、oev2.cad-feature-change/1"
role="本项目有限对应语义；crates/oe-cad/src/evidence/correspondence.rs::verify/require_current_feature/impact_seed_ids实现只读边界，不证明任意B-rep持久命名、creator谱系、物理配合或工程采用"
