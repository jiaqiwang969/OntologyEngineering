components = ["基准符号（方框字母+三角形）放在该表面上", "旁注文字：基准字母后接用逗号隔开的目标序号，如 A1,2,3", "各基准目标点、线或区域及其目标框（A1、A2、A3），目标间相互位置用 TED 给出", "简化：单一目标时基准三角形放在粗点画线（04.2）上，或参照线指向细双点画线围出的阴影区", "框格中可在字母后加 [CF]，表示由接触要素建立"]
