components = ["尺寸链：同一方向首尾衔接的一组尺寸及其总尺寸", "开口环：链中选出的不重要的一段，不标注（需要时只作括号参考尺寸）", "主要尺寸：配合尺寸、中心高、安装孔距等影响性能和装配的尺寸，直接注出", "工艺要求：尺寸注法宜符合加工顺序、便于测量"]
variants = []
dxf_forms = ["no dedicated entity; inferred from parallel DIMENSION entities whose extension-line defpoints chain along one axis", "reference dimension '(<>)' when the closing segment is still shown"]
recognition = "把同一方向的线性尺寸投影到该方向轴上，以尺寸界线定义点坐标为节点建立区间图：若某总长等于若干连续分段之和且各分段全部标注且无括号，则构成封闭链（违例，或其中一段应为参考尺寸）；正常图样应恰好有一段不注或带括号。用于检查和推断开口环，而不是识别某个符号。与漏注尺寸区分：开口环长度可由总长与其余分段唯一推出，漏注则推不出。"
confusions = ["漏标尺寸：所缺长度无法由其他尺寸推得", "参考尺寸：封闭链中的多余尺寸加括号后允许出现", "链式尺寸注法：首尾相接但不闭合"]
