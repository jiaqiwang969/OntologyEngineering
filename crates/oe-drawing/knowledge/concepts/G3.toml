recognition = "先识别通用画法框（矩形＋居中十字），再检查框内是否有与端面框边平行、间距很小（约为框宽的1/10～1/6）、长度接近框高的粗线：一侧有＝一面带防尘盖，两侧有＝两面带密封圈。与双线框边或画错的重复线区分：附加线与框线不重合、间距一致，且只出现在垂直于轴线的两边。可用明细栏轴承代号后缀佐证。"
