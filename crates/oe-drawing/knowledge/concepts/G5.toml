dxf_forms = ["LEADER or exploded LINE + SOLID arrowhead with tip on a contour LINE or on a thin extension LINE", "drawn extension LINE (layer 02/08) collinear with the contour, sometimes missing and only implied"]
recognition = "以框格指引线箭头尖为锚：落在可见轮廓上即为被测轮廓；不在轮廓上时，找经过尖端、与箭头方向垂直并与一段可见轮廓共线的细线作为延长线并入；图上没有延长线时按共线轮廓构造一条（记为推断）。箭头所在直线不应与尺寸线共线。"
confusions = ["中心要素时与尺寸线对齐的箭头", "普通尺寸线箭头", "零件序号指引线：末端为圆点或无终端"]
