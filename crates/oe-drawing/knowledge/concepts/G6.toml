[[concepts]]
id = "DC-G6-019"
name = "加工方法（加工工艺）的注法"
aliases = ["加工方法文字注写"]
group = "G6"
kind = "surface_indication"
meaning = "用文字在完整符号横线上方（位置c）写出获得该表面所要求的加工方法或工艺，如车、铣、磨、镀。"
components = ["2006版第7章：加工工艺写在横线上方，例如“车”在上、“Rz 3.2”在下；文本中写作MRR 车 Rz 3.2。", "1993版：加工方法写在横线上方；附录B还在横线上写注释性说明（如“两面”“周边剪切”、刮削接触点要求）；横线上空间不够时可用指引线引出说明。", "区域法写在位置d；ISO 21920-1草案写在[s]位置（横线上方，示例为英文ground、turned）。", "加工方法可与镀覆、表面处理说明同时出现（见镀覆卡）。"]
variants = ["GB/T 131-2006 第7章 图12", "GB/T 131-1993 3.9 图3: above the line; 附录B B4-B6 annotations such as '两面', '周边剪切', scraping contact-point requirement", "GB/T 131-1993 B10: when there is no room above the line, text given via a leader", "ISO 21920-1 draft position [s]", "GB/T 33523.1 position d", "铣", "车", "镀覆、涂覆、表面处理说明"]
dxf_forms = ["TEXT/MTEXT above the bar, left-aligned at the long leg; Chinese words (车/铣/磨/刨/镗/铰/研磨/抛光/刮) in a Chinese SHX big font (e.g. gbcbig.shx) or TrueType 仿宋", "ATTRIB at position c of template blocks", "long text moved away from the symbol with a LEADER (1993 B10)", "pre-2007 DXF: Chinese TEXT decoded via $DWGCODEPAGE"]
recognition = "锚点：完整符号横线；横线上方（符号坐标y在H2到H2+1.5h之间）、x在横线范围内的文字即位置c。常见词：车、铣、刨、磨、镗、铰、钻、拉、研磨、珩磨、抛光、刮、滚压、喷丸、镀，以及ground、turned等。区分技术要求文字（成段、带编号、不在横线上方）、视图标签（A-A、A向等大写字母）、零件名称（在标题栏内）；热处理文字（含HRC、渗碳）写在横线上时（1993图27、28）仍属工艺要求。"
confusions = ["技术要求文字：成段编号，不在符号横线上方", "视图标签A-A：大写字母，配剖切符号或投射箭头", "热处理注写：含HRC、渗碳等，写在横线上时视为工艺说明", "零件名称：在标题栏内"]
related = ["DC-G6-025", "DC-G6-060", "DC-G6-010", "DC-G6-069", "DC-G6-026", "DC-G9-002"]
priority = "medium"
text_forms = ["车", "铣", "磨", "刮", "两面", "周边剪切", "ground", "turned"]
knowledge_units = ["K31", "K32"]
