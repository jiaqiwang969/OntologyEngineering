[[concepts]]
id = "DC-G2-087"
name = "轴测图"
aliases = []
group = "G2"
kind = "view"
meaning = "把物体连同其直角坐标系，沿不平行于任一坐标面的方向用平行投影法投射到单一投影面上所得的富有立体感的图形；可见轮廓用粗实线，必要时用细虚线画不可见轮廓，轴测轴可画可不画。常用正等测、正二测、斜二测。"
components = ["轴测轴、轴间角和轴向伸缩系数：决定类型（正轴测或斜轴测；等测、二测、三测）。", "可见轮廓粗实线；一般不画不可见部分。", "圆投影为椭圆（斜二测正面除外）。", "派生：轴测剖视图、轴测装配图、轴测分解图。", "模型投影工程图推荐在合适位置附轴测图并注明类型。"]
variants = ["正轴测（投射线垂直于轴测投影面）", "斜轴测（投射线倾斜）", "正三轴测、斜等轴测、斜三轴测、水平斜轴测", "正等测", "正二测", "斜二测", "others allowed if needed", "轴测剖视图", "轴测装配图", "轴测分解图"]
dxf_forms = ["View cluster of LINEs along three dominant directions plus ELLIPSE/SPLINE curves; from 3D CAD often a block INSERT", "Optional TEXT naming the type, e.g. '正等测'"]
recognition = "以视图簇中线方向的统计为锚点：多数直线落在三个主方向上，且至少一个方向既非水平也非竖直；圆形特征以椭圆出现；该簇与其他视图无投影对齐关系，通常没有或只有少量尺寸。再按主方向角度与椭圆比判别具体类型。平行棱线汇聚于灭点的是透视图。"
confusions = ["透视图：平行棱线不平行。", "正投影视图。", "分解图：零件拉开排列。", "斜视图：正投影，只有一个倾斜方向。", "展开图：平面图形。"]
related = ["DC-G2-083", "DC-G2-082", "DC-G2-079", "DC-G2-030", "DC-G2-086", "DC-G2-088", "DC-G2-012", "DC-G4-033"]
priority = "low"
text_forms = ["正等测", "正二测", "斜二测"]
knowledge_units = ["K03", "K52", "K55", "K10"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
