[[concepts]]
id = "DC-G7-013"
name = "焊缝尺寸标注位置"
aliases = ["焊缝尺寸标注"]
group = "G7"
kind = "dimension_element"
meaning = "焊缝符号中尺寸数据相对基本符号的排列规则：横向（截面）尺寸注在左侧，纵向（长度方向）尺寸注在右侧，坡口角度、坡口面角度和根部间隙注在上侧或下侧，相同焊缝数量注在尾部；箭头线方向改变时规则不变。"
components = ["左侧：p（钝边）、H（坡口深度）、K（焊脚）、h（余高）、S（有效厚度）、R（根部半径）、c（焊缝宽度）、d（熔核直径/孔径）等截面尺寸。", "右侧：n×l(e)等长度方向尺寸。", "上侧或下侧（离基准线较远的一侧）：坡口角度α、坡口面角度β、根部间隙b。", "尾部：相同焊缝数量N等附加内容。", "字母前缀：尺寸较多不易分辨时，可在数据前加尺寸符号，如K5、S8。"]
variants = ["arrow-side values above solid line", "other-side values below dashed line", "letter-prefixed values when ambiguous"]
dxf_forms = ["several TEXT/MTEXT objects arranged around the symbol: left TEXT (cross-section size), right TEXT (n×l(e)), TEXT above/below the symbol (α, β, b), TEXT after the tail fork", "ATTRIB tags in a weld-symbol block (e.g. LEFT/RIGHT/TOP/TAIL)", "size values as TEXT/MTEXT (or ATTRIB) of the same height h as dimension text, left / right / above the symbol; angles as '60%%d' or '60°', × as Unicode U+00D7 or letter x/X"]
recognition = "先定位焊缝基准线和其上的基本符号的包围盒，再按相对位置分区读取文字：符号左侧且与基准线同侧→截面尺寸；符号右侧→长度尺寸；符号外侧（远离基准线）上方或下方→角度/间隙；尾部叉号之后→N、工艺代号等。箭头线位于左端或右端都不改变分区。坐标阈值宜用字高h（左右间隔<1h，上下<1.5h）。"
confusions = ["引出线附近的普通线性尺寸或注释：不以基本符号为中心排列。", "表面结构符号周围的a～e注写位置：锚点是√形符号而非焊缝基准线上的符号。", "零件尺寸：用尺寸线和尺寸界线标注在视图上。"]
related = ["DC-G7-017", "DC-G7-014", "DC-G7-009", "DC-G7-087", "DC-G7-115", "DC-G7-135", "DC-G6-025"]
priority = "high"
