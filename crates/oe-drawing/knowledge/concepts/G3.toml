[[concepts]]
id = "DC-G3-041"
name = "砂轮越程槽"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在需磨削的外圆、内孔或端面与台肩交接处预先车出的小槽，使砂轮能稍越过加工面而磨到根部，一般用局部放大图表达其形状和尺寸。"
components = ["磨外圆的越程槽位于轴肩根部，向圆柱面和台肩端面各切入一小段，侧面常为45°斜边，槽底带小圆弧r（r≤3h）。", "磨内圆的越程槽位于孔底台肩处，形状与外圆的相对应。", "主视图中只画出小凹口，常用局部放大图（如5:1、10:1）注槽宽b、槽深h和圆角r；尺寸按GB/T 6403.5选取。", "端面、平面、导轨等越程槽形式见相应标准。"]
variants = ["磨外圆", "磨内圆", "磨端面/平面/导轨（见标准）"]
dxf_forms = ["small notch of thick LINE/ARC strokes at the shoulder corner in the main view, often with a thin CIRCLE (detail callout) + Roman numeral TEXT", "detail view: scaled-up copy (thick LINE/ARC) with label MTEXT 'I' over '5:1' (or 'I 5:1'), DIMENSIONs for b, h, r, possibly an angular DIMENSION 45°", "in assemblies usually omitted", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为轴（或孔）的圆柱轮廓粗实线与台肩端面粗实线相交的内角处的小凹口：深度h通常只有0.1–1.2 mm（远小于直径，h/d一般<0.05），宽度b约0.6–10 mm，带45°斜边或小圆弧，附近有局部放大标示圈；放大图中可见b、h、r尺寸。与螺纹退刀槽区分：退刀槽在螺纹末端、槽底直径≈螺纹小径，深度明显大于越程槽，且相邻有螺纹线；与倒圆区分：倒圆是凸起实体的圆角，轮廓不凹入圆柱面以下。"
confusions = ["螺纹退刀槽：位于螺纹末端，槽底接近螺纹小径，较深。", "轴肩倒圆：圆弧过渡，不向圆柱面内凹入。", "普通环形槽（挡圈槽）：位于轴段中部而非台肩根部，常为矩形。"]
