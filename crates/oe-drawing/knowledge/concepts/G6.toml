[[concepts]]
id = "DC-G6-032"
name = "用指引线引出标注表面结构要求"
aliases = ["用指引线引出标注表面结构"]
group = "G6"
kind = "surface_indication"
meaning = "符号不便直接注在表面上时（空间小、方向不合适或为求清晰），用一端带箭头（指向轮廓）或黑点（落在表面内）的指引线引出，把完整符号注在指引线末端或水平段上。"
components = ["指引线起点：箭头止于轮廓线，或黑点落在表面区域内（如俯视图中的平面）。", "完整符号立在指引线水平段上（尖端接触水平段）或位于指引线末端，文字照常注写，可带加工方法。", "1993版：位置狭小或不便标注时引出标注（图11、图16）。", "ISO 21920-1草案图11：符号底部立在箭头指引线上或从右方读；发散指引线带两个箭头可同时指两处；俯视图用圆点指引线；指引线可与主体边缘线相交；三维模型用圆点指引线。"]
variants = ["GB/T 131-2006 图18 (arrow or dot)", "GB/T 131-1993 4.2 引出标注 (图11, 图16)", "ISO 21920-1 draft 图11 b)-f), i): symbol on its base or read from the right; divergent leaders with two arrows; dot leader in a top view; leader crossing the outline; l) dot leader in 3D models", "箭头端", "带加工方法文字"]
dxf_forms = ["LEADER or MULTILEADER (arrowhead or dot) whose block content is the roughness block", "LINE segments + SOLID (filled arrow) or DONUT/filled CIRCLE (dot) on layer 09, with a separate INSERT whose apex touches the leader's horizontal segment", "LWPOLYLINE with start width 0 → w as arrowhead", "proxy entity from mechanical add-ons where symbol and leader are one object"]
recognition = "锚点：表面结构符号，其尖端不在图形轮廓上，而在一条线段（通常为水平段）上；沿该线段追踪到斜线段，其末端为实心箭头（指向轮廓）或实心圆点（落在面内）。被注表面为箭头所触轮廓或圆点所在区域；发散指引线有多个箭头时，要求作用于各箭头所指表面。区分零件序号指引线（末端圆点、另一端为序号数字）、几何公差指引线（连框格）、注释指引线（水平段上为文字）和焊缝指引线（箭头线+基准线+焊缝符号）。"
confusions = ["零件序号指引线：末端圆点在零件内，另一端为横线或圆圈上的序号数字", "几何公差指引线：另一端连公差框格", "注释指引线：水平段上为文字而非V形符号", "焊缝符号指引线：箭头线+基准线（常有虚线）"]
related = ["DC-G6-047", "DC-G6-049", "DC-G6-053", "DC-G6-052", "DC-G6-019", "DC-G1-028", "DC-G1-095", "DC-G1-096", "DC-G8-009", "DC-G7-136"]
priority = "high"
text_forms = ["铣 / Rz 3.2（指引线末端）", "车 / Rz 3.2"]
