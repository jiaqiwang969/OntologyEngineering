values = ["此直径", "此尺寸", "此处"]
meaning = "说明句用以指代所写的尺寸，句子是以该尺寸为界的要求"

[[cards]]
id = "section_view_type"
expression_kind = "view"
title = "视图是怎样得到的：剖视图的种类与剖切面"
meaning = "一个视图有两件互不相干的事：它在配置中的位置（主视图、左视图、俯视图……）和它是怎样得到的——视图，还是全剖、半剖、局部剖视图；用单一剖切面，还是几个平行或几个相交的剖切面。注有“X—X”的剖视图放在主视图位置时既是主视图也是剖视图。几个相交的剖切平面剖得的图形旋转到同一投影平面上画出（旋转剖），其剖切符号在两平面的交线处转折成斜角；机件对称或接近对称时，可以对称中心线为界，一半画成剖视图、另一半画成视图（半剖视图）；剖切面完全剖开机件的是全剖视图。有的图样把剖视图按向视图的写法命名为“X向”，它仍是剖视图。"
sources = [
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图 5（剖切面的分类）、6.1 全剖视图、6.2 半剖视图、6.3 局部剖视图",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 5.3（几个平行的剖切平面）、5.4（几个相交的剖切平面，旋转到一个投影平面）、5.5（半剖视图）、5.6（局部剖视图以波浪线分界）、6.1（剖视图名称与剖切符号）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图 4.1 基本视图",
  "机械制图（第7版）§7-2 剖视图",
]
knowledge_units = ["K11", "K13"]
recognition = "视图的种类（kind）与名称不变，得到方式记为视图的依据。（1）名称为“X—X”的视图是剖切得到的视图（view_type:section，剖视图或断面图）；名称为“X向”、区域内有剖面线、且指向它的标注带剖切短画的视图，也是剖切得到的视图。（2）指向该视图的剖切符号在转折处成斜角：section_type:intersecting_planes；成直角：section_type:parallel_planes。（3）半剖：视图中有一条贯穿可见轮廓全长、把轮廓范围大致平分的点画线；不被波浪线围住的剖面线全部在它的一侧，沿它的方向占到轮廓长度的给定比例；两侧都有可见轮廓，两侧轮廓不成镜像；没有可见轮廓线沿这条点画线：section_type:half。波浪线或双折线贴着的剖面区域是局部剖视，不参与半剖的判断。只画剖切面的断面图与连同剖切面后结构一起画的剖视图本卡不区分，因此不判全剖。"
markers = []
concepts = ["DC-G2-020", "DC-G2-016"]

[[cards.components]]
role = "hatch_fill"
primitives = ["HATCH", "LINE"]
requirement = "剖面线：所在的一侧、是否被波浪线围住"

[[cards.components]]
role = "center_line"
primitives = ["LINE"]
requirement = "半剖视图中分开剖视与视图两半的对称中心线"

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC", "CIRCLE", "LWPOLYLINE"]
requirement = "视图的可见轮廓：定出范围，比较中心线两侧是否成镜像"

[[cards.components]]
role = "cutting_stroke"
primitives = ["LINE", "INSERT"]
requirement = "指向该视图的剖切符号的短画及其转折"

[[cards.variants]]
id = "section_named_by_its_title"
title = "名称为“X—X”的视图是剖视图，不论它在配置中的位置"
distinguishing = "视图名称为两个相同字母以横线相连；放在主视图位置时种类仍是主视图，另记 view_type:section"
encodings = ["inferred"]
tests = ["cutting_symbol_names_the_section_in_the_principal_position"]

[[cards.variants]]
id = "by_intersecting_planes"
title = "几个相交的剖切平面剖得、旋转到同一平面的剖视图"
distinguishing = "指向该视图的剖切符号在转折处两段短画成斜角"
encodings = ["inferred"]
tests = ["loose_cutting_path_with_an_oblique_turn_shows_intersecting_planes", "block_cutting_symbol_with_an_oblique_turn_types_the_view_it_names"]

[[cards.variants]]
id = "by_parallel_planes"
title = "几个平行的剖切平面剖得的剖视图"
distinguishing = "指向该视图的剖切符号在转折处两段短画成直角"
encodings = ["inferred"]
tests = ["cutting_path_with_a_right_angle_turn_shows_parallel_planes"]

[[cards.variants]]
id = "half_section"
title = "半剖视图"
distinguishing = "剖面线只在贯穿视图的对称中心线一侧，另一侧是外形；两侧轮廓不成镜像；中心线上没有粗实线，剖与不剖以中心线为界而没有波浪线"
encodings = ["inferred"]
tests = ["section_lines_on_one_side_of_the_centre_line_make_a_half_section"]

[[cards.variants]]
id = "section_named_as_direction_view"
title = "按向视图写法命名的剖视图"
distinguishing = "名称为“X向”，区域内有剖面线，指向它的字母标注带剖切短画：视图种类与名称不变，另记为剖视图"
encodings = ["inferred"]
tests = ["direction_view_with_section_lines_and_cutting_strokes_is_a_section"]

[[cards.counter_examples]]
statement = "中心线两侧都有剖面线的是全剖，不是半剖"
test = "section_lines_on_both_sides_of_the_centre_line_are_not_a_half_section"

[[cards.counter_examples]]
statement = "中心线一侧由波浪线围住的剖面线是局部剖视，不是半剖"
test = "local_section_beside_the_centre_line_is_not_a_half_section"

[[cards.counter_examples]]
statement = "中心线一侧只占很短一段的剖面线（局部结构、重合断面）不是半剖"
test = "short_hatch_beside_the_centre_line_is_not_a_half_section"

[[cards.counter_examples]]
statement = "只画出一半的视图（中心线另一侧没有轮廓）不是半剖"
test = "view_drawn_on_one_side_of_the_centre_line_is_not_a_half_section"

[[cards.counter_examples]]
statement = "没有剖面线的“X向”视图即使由带短画的标注指向，也不记为剖视图"
test = "direction_view_without_section_lines_is_not_stated_a_section"

[[cards.parameters]]
name = "axis_span_min"
value = 0.9
meaning = "半剖的中心线沿自身方向覆盖可见轮廓范围的比例下限"

[[cards.parameters]]
name = "symmetry_offset_max"
value = 0.1
meaning = "可见轮廓范围相对中心线的偏心上限 = 该值 × 轮廓在垂直方向的总宽（机件对称或接近对称）"

[[cards.parameters]]
name = "hatch_span_min"
value = 0.5
meaning = "一侧的剖面线沿中心线方向的范围 ÷ 轮廓范围的下限（半边被整个剖开）"

[[cards.parameters]]
name = "side_outline_min"
value = 0.2
meaning = "中心线每一侧的可见轮廓长度占全部轮廓长度的下限"

[[cards.parameters]]
name = "asymmetry_min"
value = 0.1
meaning = "按中心线镜像后在另一侧找不到对应的轮廓长度占全部轮廓长度的下限（两半不成镜像）"

[[cards.parameters]]
name = "on_axis_tolerance"
value = 0.05
meaning = "判断点在中心线上的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "mirror_tolerance"
value = 0.1
meaning = "镜像点与另一侧轮廓重合的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "break_line_reach"
value = 0.5
meaning = "波浪线到剖面区域的距离不超过该值 × 字高时，该剖面区域是局部剖视"

[[cards]]
id = "assembly_drawing"
expression_kind = "view"
title = "装配图：由明细栏、零件序号与相邻零件的剖面线认出"
meaning = "装配图表达一台机器或一个部件中各零件的装配关系：一组视图、必要的尺寸（含配合代号）、技术要求、零部件序号、明细栏和标题栏。装配图中一般应有明细栏，画在标题栏上方，序号列自下而上递增；所有零件都编序号，序号与明细栏的序号一致，指引线从所指零件的可见轮廓内引出、末端画圆点（薄件或涂黑断面用箭头）。剖视中相邻金属零件的剖面线方向相反，或方向一致而间隔不等；同一零件在各剖视中剖面线方向、间隔一致；紧固件、实心件纵向剖切时按不剖绘制；配合尺寸注孔轴配合代号（如 H7/g6）。只凭一项（例如只有一张表）不判定；焊接件图也有明细栏，但表示一个零件（焊缝符号本卡不读）；零件图上的参数表（表格图）没有序号。"
sources = [
  "GB/T 10609.2-2009 技术制图 明细栏 3.1（装配图中一般应有明细栏）、3.2.1、3.2.2（明细栏可作为装配图的续页按 A4 幅面单独给出）",
  "GB/T 4458.2-2003 机械制图 装配图中零、部件序号及其编排方法 3.1、3.3（序号与明细栏一致）、4.1、4.4（指引线自所指部分的可见轮廓内引出，末端画圆点）、4.5",
  "GB/T 4457.5-2013 机械制图 剖面区域的表示法 4.2（相邻辅助零件不画剖面符号）、4.7（相邻金属零件的剖面线方向相反或方向一致而间隔不等；同一零件的剖面线方向相同、间隔相等）、4.8（接合件）",
  "GB/T 17453-2005 技术制图 图样画法 剖面区域的表示法 5（相邻零件剖面线示例）",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 4.4（紧固件纵向剖切按不剖绘制）",
  "GB/T 4458.5-2003 机械制图 尺寸公差与配合注法 5.1（装配图中的配合代号）",
  "机械制图（第7版）§10-1 一 装配图的内容",
]
knowledge_units = ["K15"]
recognition = "按图纸读：E1 本张图纸上有明细栏；E2 视图中有零件序号，其序号都是明细栏的行号，被指到的行数不少于给定个数和给定比例；E3 同一视图中两个剖面区域共用一段边界线、方向或间隔不同（两个相邻零件）；E4 由序号和明细栏中的标准编号认出的不剖标准件；E5 尺寸中有孔、轴公差带代号用斜线隔开的配合代号。E1 与 E2 同时成立即判为装配图：图纸视图记 drawing_type:assembly、parts_list:<明细栏表达>、item_numbers:<被指到的行数>，名称后加“ · 装配图”；否则 E1 至 E5（没有明细栏时以序号代 E2）中有给定个数成立时记为候选（drawing_type_candidate:assembly）。逐个零件：序号圆点所在的剖面区域就是该序号的零件（序号记 names_region，剖面区域记 item）；圆点落在标准件内时序号记 names_part；同一视图中与它方向、间隔相同的剖面区域是同一零件（只由一个序号指到时才推及）；共用边界而剖面线不同的两个区域互记 different_part_from。"
markers = []
concepts = ["DC-G8-013", "DC-G2-009"]

[[cards.components]]
role = "table_line"
primitives = ["INSERT", "LINE"]
requirement = "明细栏（E1）：格线与文字成一个图块，表头在下，序号列连续递增"

[[cards.components]]
role = "note_text"
primitives = ["INSERT", "MTEXT", "TEXT"]
requirement = "零件序号（E2）：整数写在横线上或圆内，指引线末端圆点在零件内"

[[cards.components]]
role = "hatch_fill"
primitives = ["HATCH"]
requirement = "相邻零件的剖面区域（E3）：共用一段边界线，方向相反或间隔不等"

[[cards.components]]
role = "contour_segment"
primitives = ["INSERT"]
requirement = "按不剖绘制的标准件（E4）：只有结构线的图库图块"

[[cards.components]]
role = "dimension_text"
primitives = ["DIMENSION", "MTEXT", "TEXT"]
requirement = "配合代号（E5）：大写字母加等级的孔公差带、斜线、小写字母加等级的轴公差带"

[[cards.variants]]
id = "list_on_the_sheet"
title = "明细栏在本张图纸上，序号与它对应"
distinguishing = "E1 与 E2：本张图纸的明细栏，视图中的序号都是它的行号"
encodings = ["block"]
tests = ["parts_list_with_agreeing_item_numbers_makes_an_assembly_drawing"]

[[cards.variants]]
id = "list_on_a_separate_sheet"
title = "只有序号，明细栏在续页上"
distinguishing = "本张图纸没有明细栏（明细栏可单独给出），视图中有序号，再有另一项证据（相邻零件的剖面线不同、配合代号）：候选"
encodings = ["block", "hatch"]
tests = ["item_numbers_and_opposite_hatches_without_a_list_are_a_candidate"]

[[cards.variants]]
id = "machined_after_joining"
title = "接合件：装配后再加工，装配图上带零件图的内容"
distinguishing = "已判为装配图的图纸上又有表面结构要求或几何公差：几个零件接合后一起加工（如热套、骑缝螺钉固定后加工），装配图同时是加工图"
encodings = ["inferred"]
tests = ["assembly_with_part_drawing_content_is_machined_after_joining"]

[[cards.variants]]
id = "fit_designation"
title = "配合代号是装配图的一项证据"
distinguishing = "尺寸文字中孔的公差带代号（大写字母加等级）与轴的公差带代号（小写字母加等级）用斜线隔开，如 H7/g6；螺纹副的 6H/6g（数字在前）、极限偏差的“+0.02/0”不算"
encodings = ["text"]
tests = ["parts_list_and_a_fit_designation_are_a_candidate"]

[[cards.variants]]
id = "adjacent_parts_hatched_apart"
title = "共用边界、剖面线不同的两个剖面区域是两个相邻零件"
distinguishing = "同一视图中两个剖面区域共用一段边界线，剖面线方向相差不小于给定角度，或间隔之比不小于给定值"
encodings = ["hatch"]
tests = ["item_numbers_and_opposite_hatches_without_a_list_are_a_candidate", "parts_list_with_agreeing_item_numbers_makes_an_assembly_drawing"]

[[cards.variants]]
id = "part_by_item_dot"
title = "序号圆点所在的区域就是该序号的零件"
distinguishing = "指引线末端的圆点落在哪个剖面区域内，那个区域就是这个序号的零件；落在由该序号认出的标准件内，就是那个标准件"
encodings = ["block", "hatch"]
tests = ["item_dot_inside_a_hatch_names_its_part"]

[[cards.variants]]
id = "part_by_signature"
title = "同一视图中剖面线方向、间隔相同的区域是同一零件"
distinguishing = "同一零件的剖面线方向相同、间隔相等：与有序号圆点的区域方向、间隔相同的其他区域也是那个零件（这种剖面线只由一个序号指到时）"
encodings = ["hatch"]
tests = ["hatch_of_the_same_signature_is_the_same_part"]

[[cards.counter_examples]]
statement = "零件图上的参数表（表格图）不是明细栏，没有序号的零件图不是装配图"
test = "series_table_on_a_part_drawing_is_not_an_assembly"

[[cards.counter_examples]]
statement = "只有明细栏一项证据时不作判断（焊接件图、单独的明细表）"
test = "parts_list_alone_does_not_decide"

[[cards.counter_examples]]
statement = "序号不是明细栏的行号时不判定为装配图，最多是候选"
test = "item_numbers_that_disagree_with_the_list_do_not_decide"

[[cards.counter_examples]]
statement = "同一零件被分成两个剖面区域、方向与间隔相同，不是两个零件"
test = "one_part_hatched_in_two_regions_is_not_two_parts"

[[cards.counter_examples]]
statement = "一个区域中两组交叉的剖面线（非金属材料的剖面符号）不是两个零件"
test = "cross_hatched_region_is_not_two_parts"

[[cards.counter_examples]]
statement = "用细双点画线画出、不画剖面线的相邻辅助零件不使图样成为装配图"
test = "phantom_line_neighbour_does_not_make_an_assembly"

[[cards.counter_examples]]
statement = "方向、间隔相同的剖面线由两个不同序号指到时，不按剖面线推及其他区域"
test = "two_items_in_one_signature_do_not_spread"

[[cards.parameters]]
name = "direction_difference_min"
value = 30.0
meaning = "两个剖面区域算作剖面线方向不同的最小方向差（度；相邻零件一般相差 90°）"

[[cards.parameters]]
name = "spacing_ratio_min"
value = 1.3
meaning = "两个剖面区域算作间隔不等的最小间隔之比（大 ÷ 小）"

[[cards.parameters]]
name = "item_numbers_min"
value = 2.0
meaning = "作为证据的序号最少个数"

[[cards.parameters]]
name = "rows_named_min"
value = 0.5
meaning = "被序号指到的明细栏行数占全部行数的下限（一张图纸上可只画出部分零件）"

[[cards.parameters]]
name = "evidence_min"
value = 2.0
meaning = "没有与序号对应的明细栏时，构成候选所需的证据项数"


[[cards]]
id = "not_plotted_content"
expression_kind = "construction_reference"
title = "不打印层上的内容"
meaning = "CAD 用图层组织图线并控制显示与出图。有的层从不出图：定义点层（尺寸的定义点所在的层，任何情况下都不打印）、图层表里打印开关关闭的层、冻结或关闭的层。这些层上的内容在文件里有、图纸上没有：它不是图面表达的一部分，不能当作轮廓、不可见轮廓或中心线，也不能给打印出来的图线提供连接。读图时照样读出并标明“不打印”：没有被注写使用的图线是作图用的构造线；属于某个尺寸或注写的部分（数值、终端、界线）仍是该尺寸的组成部分，同时说明这一部分图纸上看不到。"
sources = [
  "GB/T 14665-2012 机械工程 CAD 制图规则 8、表 6：图层（按图线类型分层的标识）",
  "GB/T 18229-2000 CAD 工程制图规则 9.1、表 13：图层",
  "GB/T 15751-1995 技术产品文件 计算机辅助设计与制图 词汇：层（组织实体并控制其可见性的属性）",
]
knowledge_units = ["K03", "K52", "K55"]
recognition = "先读图层表：层名为定义点层（不分大小写）、打印开关为关、冻结或关闭的层是不打印层。来源实体在这种层上（或块内成员自己的层是这种层）的成员都记“不打印”。这种层上的曲线不进入轮廓、虚线轮廓、中心线的候选，不作结点对象；打印的图线若某一端只接在这种曲线上，这一端在图面上是自由端。没有注写使用的这种曲线读作构造线。成员全部不打印的表达记“不打印”；只有一部分不打印的，在未知项里写明是哪一部分。"
markers = []
concepts = ["DC-G1-101"]
parameters = []

[[cards.components]]
role = "native_member"
primitives = ["LINE", "ARC", "CIRCLE", "LWPOLYLINE", "POLYLINE", "SPLINE", "ELLIPSE"]
requirement = "不打印层上、未被注写使用的曲线：构造线"

[[cards.components]]
role = "definition_point"
primitives = ["POINT"]
requirement = "定义点层上的点"

[[cards.variants]]
id = "definition_point_layer"
title = "定义点层上的内容"
distinguishing = "层名为 CAD 的定义点层（不分大小写）；该层从不打印"
encodings = ["loose"]
tests = ["outline_drawn_on_the_definition_point_layer_is_construction", "definition_point_is_marked_not_plotted"]

[[cards.variants]]
id = "plot_switch_off"
title = "打印开关关闭的层上的内容"
distinguishing = "图层表中该层的打印开关为关"
encodings = ["loose"]
tests = ["line_on_a_layer_with_the_plot_switch_off_is_construction"]

[[cards.variants]]
id = "layer_off_or_frozen"
title = "冻结或关闭的层上的内容"
distinguishing = "图层表中该层被冻结，或颜色号为负（层关闭）"
encodings = ["loose"]
tests = ["line_on_a_switched_off_layer_is_construction", "hidden_line_on_a_frozen_layer_is_no_hidden_outline"]

[[cards.variants]]
id = "part_of_an_annotation"
title = "尺寸或注写的一部分在不打印层上"
distinguishing = "尺寸的数值、终端或界线在不打印层上，其余部分正常打印：仍是这个尺寸，未知项写明哪一部分图纸上没有"
encodings = ["loose", "native"]
tests = ["dimension_with_a_terminator_on_a_never_plotted_layer_stays_a_dimension"]

[[cards.variants]]
id = "free_end_at_unplotted_curve"
title = "打印的轮廓只接在不打印的线上"
distinguishing = "轮廓线的一端只与不打印层上的曲线相接：图面上这一端是自由端，不算结点"
encodings = ["loose"]
tests = ["outline_joined_only_through_a_never_plotted_line_is_not_admitted"]

[[cards.counter_examples]]
statement = "层名里只是含有定义点层名字样、本身可打印的层，其上的图线照常读出"
test = "layer_whose_name_only_contains_the_definition_point_name_plots"
[[cards.counter_examples]]
statement = "不打印层上的线不因两端接在轮廓上而成为轮廓（原有反例，见 line_width_evidence）"
test = "thin_colour_arc_on_a_layer_never_plotted_is_no_evidence"

[[cards.lexicon]]
concept = "DC-G1-101"
entry = "definition_point_layer"
values = ["Defpoints"]
meaning = "CAD 的定义点层：尺寸定义点所在的层，任何情况下都不打印；层名不分大小写"
