[[concepts]]
id = "DC-G8-006"
name = "沿零件结合面剖切"
aliases = ["沿结合面剖切画法"]
group = "G8"
kind = "conventional_representation"
meaning = "装配图中可假想沿某两个零件的结合面（如泵体与垫片、箱体与箱盖的分界面）剖切画出视图；结合面上不画剖面线，只有被横向切断的螺钉、销、轴等零件画剖面线。"
components = ["剖切位置在结合面上，用剖切符号和字母标注，视图上方注“B—B”等名称。", "剖切面前方的零件被移去，露出后方零件的结合面，结合面区域按外形画出，不画剖面线。", "穿过结合面的螺钉、销、齿轮轴等被横向切断，其小圆形或环形断面画剖面线。"]
variants = []
dxf_forms = ["section label TEXT such as 'B-B' (layer 11) plus cutting-plane marks of short thick LINE segments and arrows", "joint face drawn as outline LINE/ARC without HATCH; small circular HATCH regions only at the cut screws, pins or shafts"]
recognition = "以剖视名称（如“B—B”）和剖切符号为锚点，找到对应视图后看剖面线分布：若视图大部分是没有剖面线的零件轮廓（结合面），只有若干直径与螺钉、销规格相当、常呈均布的小圆形或环形区域有剖面线，判为沿结合面剖切。与全剖视的区别：全剖视中主体零件的切断面大面积画剖面线；与拆卸画法的区别：拆卸画法没有剖切符号，被拆零件的连接件也不出现断面。"
confusions = ["全剖视图：被剖零件的实体区域都画剖面线。", "外形视图：螺钉显示为头部外形（六角形或圆），不是带剖面线的断面。", "拆卸画法：没有剖切符号和断面剖面线，常以“拆去××”说明。"]
related = ["DC-G8-004", "DC-G2-013", "DC-G2-065", "DC-G8-003"]
priority = "low"
text_forms = ["B—B", "A—A"]
knowledge_units = ["K11", "K12", "K13", "K15"]
