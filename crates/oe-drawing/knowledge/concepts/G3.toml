[[concepts]]
id = "DC-G3-149"
name = "制动器符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示作用于轴上、使其减速或停止的制动器；标准只给一般符号，不规定制动器外观。"
components = ["一段粗轴线的端部接一个竖直短线及其上下端的短横线，构成开口背向轴的“]”形制动轮。", "制动轮上方有一条与轴平行的短线代表制动块，一个竖直箭头从上方指向它，表示制动力的作用。", "符号只连一根轴，另一侧不接第二根轴。", "需要表明操纵方式时，可在符号旁加字母 M（机动）、H（液动）、P（气动）、E（电动）；1984 版 8.4 与 2013 版 11.4 均适用此附注。"]
variants = ["一般符号"]
dxf_forms = ["Exploded LINE/LWPOLYLINE strokes on layer 01 (shaft as thick LINE or 2d-wide LWPOLYLINE), arrow as LINE plus SOLID triangle or a LEADER", "Optional single-letter TEXT M/H/P/E on layer 11 beside the symbol", "INSERT of a library block"]
recognition = "锚点：粗轴线末端的“]”形短段，加上方竖直向下的箭头和一条短横线（制动块）。符号只有一侧有轴；可伴有单个字母 M/H/P/E。与离合器、联轴器区分：后两者两侧各有一根同轴粗轴线；与摩擦轮/齿轮单线符号区分：轮符号的轮辐线与轴垂直相交并居中，没有指向它的力箭头。"
confusions = ["可控离合器、自动离合器、联轴器：两根轴在符号两侧对接；制动器只接一根轴并有施力箭头。", "摩擦轮符号：轮辐线跨轴、端部单侧短线，无力箭头。", "运动终止符号：箭头线末端的竖短线，不连接轴和制动块。"]
related = ["DC-G3-156", "DC-G3-190", "DC-G3-189", "DC-G3-171"]
