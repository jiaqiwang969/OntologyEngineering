[[concepts]]
id = "DC-G2-041"
name = "断开缩短画法"
aliases = []
group = "G2"
kind = "simplified_representation"
meaning = "较长的机件（轴、杆、型材、连杆等）沿长度方向形状一致或按规律变化时，可断开后缩短绘制，尺寸仍按实际长度标注；断裂处用波浪线、双折线或实心/空心圆柱的特殊断裂画法表示。"
components = ["两段视图：同一机件断开后靠拢画出，中间留空隙。", "断裂线：成对的细波浪线或双折线（双折线两端略超出轮廓）；实心、空心圆柱可用S形特殊断裂画法。", "尺寸：跨越断口的尺寸数字为实际长度，与图上量得的长度不符。"]
variants = ["波浪线断开", "双折线断开", "实心圆柱断裂特殊画法", "空心圆柱断裂特殊画法"]
dxf_forms = ["Paired thin SPLINE or zigzag LWPOLYLINE (layer 02) across the part with a gap; outlines (layer 01) stop at them", "Cylinder special break: SPLINE/ARC pairs forming S-curves at the cut ends", "Linear DIMENSION spanning the gap whose measured value (group 42) differs from the override text (group 1)"]
recognition = "以一对平行或近似平行的断裂线为锚点：二者夹一段空白，两侧轮廓线共线对齐；若有尺寸跨越断口且尺寸数值大于几何量测值，即确认缩短画法并可推出缩短量。只有一条断裂线且另一侧无图形的是局部视图或局部剖视的边界。"
confusions = ["局部视图、局部剖视的断裂边界：只有一条线。", "配置在视图中断处的移出断面：断口中有断面图。"]
related = ["DC-G3-117", "DC-G2-033", "DC-G2-076", "DC-G1-029", "DC-G1-011", "DC-G1-032"]
