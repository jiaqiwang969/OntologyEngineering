[[concepts]]
id = "DC-G5-113"
name = "零几何公差（0Ⓜ）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "第二格写 0（或 φ0）后接 Ⓜ，表示被测导出要素在最大实体状态下几何公差为零，全部允许量来自尺寸公差（实效边界等于最大实体边界）；同理 0Ⓛ 用于最小实体要求。旧称“零几何公差”。"
components = ["第二格：0Ⓜ 或 Ø0Ⓜ（也有 0Ⓛ）", "常见于有配合要求的关联孔、轴的垂直度或位置度", "被测要素必为尺寸要素的导出要素，指引线与尺寸线对齐"]
variants = ["Ø0Ⓜ 垂直度", "0Ⓛ 位置度（最小实体要求）"]
dxf_forms = ["TEXT/MTEXT in the second cell of the frame (TOLERANCE entity: value field after the first %%v) like '%%c0' followed by Ⓜ (Unicode, gdt 'm', or CIRCLE + TEXT 'M')", "INSERT of a plugin frame block whose value ATTRIB carries the string; or exploded LINE/LWPOLYLINE cells + TEXT"]
recognition = "以第二格中数值为 0 且后跟圆圈 M（或 L）为锚。单独的 0 后无圆圈字母、或圆度符号被 OCR 读成 0 时不判。"
confusions = ["漏填公差值或占位的 0", "数字 0 与圆度符号、字母 O 的混淆"]
related = ["DC-G5-065", "DC-G5-075", "DC-G5-107", "DC-G5-058", "DC-G5-041", "DC-G4-115"]
priority = "low"
text_forms = ["Ø0Ⓜ", "0Ⓜ", "0Ⓛ", "⊥ Ø0Ⓜ A"]
