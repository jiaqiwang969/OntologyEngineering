[[concepts]]
id = "DC-G3-163"
name = "带传动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构或传动简图中表示两轴间以带（皮带）传递运动，可另加标记指明带型；轴上的宝塔轮另有符号。"
components = ["端视形式：两个带十字细点画线中心线的带轮圆，以两条与两圆都相切的直线（外公切线）表示带。", "侧视形式：两根平行粗轴线上各画一个内含“×”的矩形带轮（“×”表示轮与轴固连），两带轮之间以两条平行线相连表示带；2013 版另增一种基本符号（带轮画在轴上、不画“×”）。", "指明带型时在带线上加小标记：三角带为倒三角，圆带为小圆，同步齿形带为齿形折线，平带为一段短粗线；例如三角带传动在切线上画一个小倒三角。", "轴上的宝塔轮：轴线上的多级阶梯形轮廓，内画“×”。", "1984 版称“皮带传动”，带型称三角皮带、圆皮带、同步齿形带、平皮带。"]
variants = ["一般符号（2013增加一种基本符号）", "三角带", "圆带", "同步齿形带", "平带", "轴上的宝塔轮", "1984称皮带传动"]
dxf_forms = ["Two CIRCLEs on layer 01 with centre LINEs on layer 05, plus two LINEs tangent to both circles for the belt", "Belt-type mark as a small closed LWPOLYLINE triangle, CIRCLE or short polyline sitting on a tangent LINE", "Side form: LWPOLYLINE rectangles on thick shaft LINEs, each with an × of two short LINEs, joined by two parallel LINEs", "INSERT of a transmission-diagram library block"]
recognition = "锚点：两个圆（直径通常不等）加两条同时与两圆相切的直线，圆心有点画线十字。切线上若有小倒三角、小圆、齿形折线或短粗线，则指明带型。侧视形式：两根平行轴上各一个带“×”的矩形，两矩形之间由两条平行线相连。与链传动区分：链传动端视相同，但侧视链轮画成内含“×”的菱形，链型标记为扁圆、双竖划或“V”形折线；与齿轮传动区分：齿轮为两节圆直接相切，没有公切线；与装配图中的带传动简化画法区分：后者画在实际视图中、带有真实轮廓与尺寸。"
confusions = ["链传动符号：侧视链轮为菱形，链型标记不同。", "齿轮传动符号：两轮节圆直接相切，无公切线。", "装配图中带传动、链传动的简化画法：画在实际投影视图中，有轮廓和尺寸。"]
related = ["DC-G3-201", "DC-G3-207", "DC-G8-016"]
priority = "low"
text_forms = []
knowledge_units = ["K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Shapes read from page images of both editions. The 2013 foreword states that one basic belt-drive symbol was added to match ISO 3952-4. DXF forms are general CAD practice."
