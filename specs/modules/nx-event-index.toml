schema="oev2.design-fragment/2"

[[constraints]]
id="nx_complete_event_index"
requirement="req_engineering"
module="nx_worker"
check="receive"
rust_path="crates/oe-nx-worker/src/event_index.rs"
statement="显式v3任务的超限readback采用oev2.nx-native-indexed-readback/1；全部原事件引用连续分页、摘要绑定、完整接收；大字段与大事件观察采用显式分块完整重组，UTF-8 JSON字节身份、字段名、块序号及偏移绑定；按累计剩余预算外置字段并预留验证16KiB生命周期；完整重组沿oe-wire严格JSON语义拒绝重复键并保留marker对象；不删减诊断、不放大原readback 2MiB与单记录4MiB限制；索引不代表原生成功。"
severity="error"

[[validations]]
id="event_index_preserves_large_failure_and_rejects_loss_or_tampering"
module="nx_worker"
constraint="nx_complete_event_index"
behavior="event_index_preserves_large_failure_and_rejects_loss_or_tampering"
rust_path="crates/oe-nx-worker/tests/event_index.rs"
oracle="4546项原引用完整往返，缺页/重复页/改字节/异任务/序列缺口/写入失败拒绝，无截断和假成功。"
scope="Rust索引及接收；Windows worker、真实失败持久化另验"

