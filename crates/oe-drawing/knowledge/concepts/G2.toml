[[concepts]]
id = "DC-G2-084"
name = "第一角画法视图配置"
aliases = []
group = "G2"
kind = "view"
meaning = "将物体置于第一分角内、使其处于观察者与投影面之间进行投射的多面正投影配置：以主视图为准，俯视图在下方，左视图在右方，右视图在左方，仰视图在上方，后视图在左视图之右；按此配置不注视图名称。我国优先采用。"
components = ["主视图：布局中心。", "方位：俯视在下，左视在右，右视在左，仰视在上，后视在最右。", "识别符号：必要时画第一角投影识别符号（标题栏投影符号栏）。"]
variants = []
dxf_forms = ["Layout property of view clusters; optional first-angle symbol (trapezoid with two concentric CIRCLEs to its right) as INSERT or loose LINE/CIRCLE near the title block"]
recognition = "先读投影识别符号（梯形在左、同心圆在右为第一角）或标题栏投影符号栏，缺省按第一角；再按视图簇方位检查：主视图下方且长对正的视图应为俯视图。若方位与内容矛盾（如下方视图显示的是底面特征），提示可能为第三角。"
confusions = ["第三角画法视图配置：方位相反。", "向视图自由配置：有字母。"]
