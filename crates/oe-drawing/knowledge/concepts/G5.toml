[[concepts]]
id = "DC-G5-077"
name = "线轮廓度"
aliases = ["线轮廓度符号"]
group = "G5"
kind = "symbol"
meaning = "线轮廓度：控制要素在给定截面内的轮廓线相对理论正确轮廓的变动。符号为一段开口半圆弧（无底边）；不带基准时为形状公差，带基准时为方向或位置公差；理论轮廓由带框理论正确尺寸或 CAD 模型确定。"
components = ["特征符号：第一格内一段上凸的半圆弧，两端敞开、下方无直线，宽约 0.6H", "第二格：公差值，可带 UZ、OZ、VA、SZ、CZ 等修饰；公差带为一系列直径为公差值的圆的两包络线", "基准格：可无（形状）或有（方向、位置）；加 >< 时只约束方向", "配套标注：理论轮廓的带框 TED（半径、坐标），常配相交平面框格指明截面方向，或在指引线转折处加全周符号"]
variants = ["form (no datum), orientation (with ><), or location (datum fixing position) depending on the datum part", "with OZ/VA/UZ/UF/CZ/SZ modifiers", "for derived lines", "无基准（形状公差）", "有基准（方向或位置公差）", "常与理论正确尺寸、全周符号同用"]
dxf_forms = ["TOLERANCE entity with glyph {\\Fgdt;k}", "exploded: one ARC (≈180°, opening downward) inside the first cell, no LINE across its chord", "TEXT/MTEXT with Unicode ⌒ U+2312 in the first cell", "INSERT of a plugin frame block whose value ATTRIB carries the string; or exploded LINE/LWPOLYLINE cells + TEXT"]
recognition = "以框格第一格为锚：格内只有一段圆弧（圆心角约 150°–200°，弦长约 0.5–0.7H、弧顶朝上），弦上没有直线。若弧下有一条连接两端点的直线则为面轮廓度。同一符号在尺寸数字上方、不在框格内时是弧长符号。再看基准格判断形状、方向或位置类型，看旁边带框 TED 定位理论轮廓。"
confusions = ["面轮廓度：半圆下有一条底边（封闭）", "弧长符号 ⌒：写在弧长尺寸数值上方，不在框格内", "圆度：完整圆", "圆跳动箭头：斜向带箭头的短线"]
related = ["DC-G5-082", "DC-G5-090", "DC-G5-043", "DC-G5-103", "DC-G5-033", "DC-G5-037", "DC-G5-038", "DC-G4-029", "DC-G4-047"]
priority = "medium"
text_forms = ["⌒ 0.05", "⌒ 0.1 A", "⌒ 0.04 A B"]
knowledge_units = ["K23", "K24", "K25", "K27"]
recognition_cards = ["gdt_characteristic"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 1184 gives no general value; the profile is controlled by the toleranced or general linear/angular dimensions. GB/T 1182-2018 A.3.5 lists the old 'boundary to boundary' reading as withdrawn; GB/T 17852 adds the default rules. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
