components = ["主视图：轴线常水平，簧丝轮廓为平行斜直线，常剖开显示簧丝截面，中间部分可省略。", "主视图上方：粗实线绘制的力—变形直线图（扭转弹簧可在左视图上方）。", "图上直接注出线径d、中径D或外径D2、自由高度H0、节距t等参数。", "技术要求：编号列出旋向、有效圈数、总圈数、工作极限应力、热处理和检验要求。", "标题栏：名称为某某弹簧，材料栏写簧丝材料。"]
