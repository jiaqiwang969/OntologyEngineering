recognition = "锚点为轴测图中的细波浪线（SPLINE或曲率交替的多段线），其围成的面域内均匀散布点（POINT或点状HATCH），而不是平行剖面线。先用轮廓方向（30°/150°/90°）确认为轴测图。与二维断开画法区分：二维断开在正投影图中，断口用波浪线或双折线，两段平移靠拢，断面无点；与点阵剖面区分：点阵剖面的边界是剖切平面产生的直线粗实线，断裂面边界是波浪线。"
