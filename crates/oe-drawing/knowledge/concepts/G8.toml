[[concepts]]
id = "DC-G8-007"
name = "运动件的变动和极限位置"
aliases = ["运动零件极限位置假想画法"]
group = "G8"
kind = "conventional_representation"
meaning = "装配图中用细双点画线画出运动零件（手柄、扳手、摆杆等）的变动位置或极限位置的轮廓，表示其运动范围；同一线型也用来画与本部件有关但不属于本部件的相邻零部件（假想画法）。"
components = ["运动件在主位置按粗实线正常画出，另一位置或极限位置只画外轮廓，用细双点画线。", "假想轮廓一般不画剖面线和内部结构，可附转角或极限尺寸（如90°）。", "相邻零部件（如安装本部件的安装板）也用细双点画线画外形，与极限位置使用同一线型。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE on layer 07 (细双点画线) with PHANTOM / ACAD_ISO05W100 type linetype, or BYLAYER", "angular DIMENSION between the solid and phantom positions (e.g. 90°)"]
recognition = "以细双点画线（PHANTOM类线型或07层）构成的闭合或半闭合轮廓为锚点：若它与图中某个粗实线零件形状相同，且可以绕某一铰点或轴线旋转（或平移）后重合，判为运动件的变动或极限位置；若双点画线轮廓在图中找不到对应的粗实线零件，并且只在安装面与本部件接触，则更可能是相邻零部件的假想画法。两位置之间的角度尺寸可作旁证。"
confusions = ["相邻零部件假想画法：形状在图中没有对应的粗实线件。", "零件图中的初始轮廓或成形前轮廓：出现在零件图，不在装配图。", "剖切平面前的结构：同为细双点画线，但位于剖视图中被假想移去的部分。", "运动轨迹或中心线：细点画线（单点），不是双点。"]
related = ["DC-G1-013", "DC-G1-042", "DC-G1-036", "DC-G3-038", "DC-G3-011"]
