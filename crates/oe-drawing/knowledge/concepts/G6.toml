[[concepts]]
id = "DC-G6-071"
name = "表面结构基本图形符号"
aliases = []
group = "G6"
kind = "symbol"
meaning = "由两条不等长、各与被注表面成60°的直线构成的√形符号，表示对表面结构有要求但未指定加工工艺；单独使用时只用于简化注法或附有说明的场合。"
components = ["两斜边在尖端相交，尖端接触被注表面或其延长线；短边在左、长边在右，各与表面成60°，两边夹角也为60°。", "短边竖高约1.4h，长边竖高约3h以上（h为数字字高），线宽约h/10。", "没有横线、短横、小圆和文字；需要注写要求时应在长边加横线成为完整符号。", "GB/T 131-1993同形，表示表面可用任何方法获得；不注参数值或说明时仅用于简化代号标注。", "区域法（GB/T 33523.1）在该符号上加一小菱形；ISO 21920-1草案不再单独定义基本、扩展符号，只用完整符号。"]
variants = ["GB/T 131-2006 基本图形符号: any process allowed; used alone only in simplified indications or with an explanatory note", "GB/T 131-1993 基本符号: same shape, surface may be obtained by any method", "GB/T 33523.1-2020 areal-method version carries an added diamond (see separate entry)", "ISO 21920-1 draft: basic/expanded symbols no longer defined separately; only complete symbols", "单独使用仅用于简化注法"]
dxf_forms = ["INSERT of a two-LINE block (or a 3-vertex LWPOLYLINE) — often the complete-symbol block with the bar omitted", "exploded: 2 LINEs sharing an endpoint, thin, on layer 08/11 (GB/T 14665) or on the layer of the nearby dimensions", "inside the majority note near the title block: bare INSERT between TEXT '(' and ')' or between two ARC strokes", "left side of an equation: bare INSERT + TEXT '=' + complete-symbol INSERT with value"]
recognition = "锚点：两条共端点的细直线，夹角60°、长度比约2:1（容差1.5–3），角平分线垂直于被注表面；长边上端无第三条线相连，V形开口内既无短横也无小圆，附近无属于它的文字。孤立出现时检查语境：位于标题栏附近括号内为多数表面简化注法；位于等号左侧为只用符号的简化注法；在视图轮廓上且图中无等式时，按1993版可理解为只规定获得方法不限、无粗糙度值。区分埋头孔符号⌵（两边等长、对称，作为尺寸文字前缀）、V形焊缝符号（两边等长，立在焊缝基准线上）、根号（在文本中）。"
confusions = ["去除材料扩展符号：V形开口被短横封闭成三角形", "不去除材料扩展符号：V形内有内切小圆", "埋头孔符号⌵：两边等长对称，作为孔尺寸文字前缀", "V形焊缝符号：两边等长，位于焊缝基准线上", "数学根号/对勾：位于文字中，短边带勾", "区域法基本符号：另带小菱形"]
related = ["DC-G6-069", "DC-G6-072", "DC-G6-063", "DC-G6-067", "DC-G6-003", "DC-G6-005", "DC-G6-006", "DC-G4-045", "DC-G7-093"]
priority = "high"
text_forms = []
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "The 1.5–3 length-ratio tolerance follows the project's existing detector; DXF forms are general CAD practice."
