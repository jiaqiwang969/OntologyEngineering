dxf_forms = ["TEXT/MTEXT items in the 技术要求 block (layer 11)"]
recognition = "以关键词“锻件”“锻透”“折叠”“白点”“锻压”为锚点；材料栏常为45、40Cr、42CrMo等钢号，图上可能有分模面或毛坯轮廓。与铸件注语（砂眼、清砂、时效）区分；“缩孔”两者都可能出现，需结合主语“锻件”或“铸件”判断。"
