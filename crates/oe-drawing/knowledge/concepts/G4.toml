[[concepts]]
id = "DC-G4-032"
name = "角度尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "标注两直线（或平面）之间夹角的大小：尺寸界线沿径向引出，尺寸线画成以角顶点为圆心的圆弧，角度数字一律水平书写，单位为度、分、秒。"
components = ["尺寸界线：沿角两边或其延长线径向引出的细实线，也可直接利用轮廓线。", "尺寸线：以角顶点为圆心的细实线圆弧，两端箭头指到尺寸界线；角度尺寸终端须用箭头。", "角度数字：一律水平书写，一般注在圆弧尺寸线的中断处；必要时注在圆弧外侧、上方或用指引线引出（图23）。", "数值形式：度分秒（30°、1°54′33″）或十进制度，可带角度公差。"]
variants = ["number in arc break (default)", "number outside / above / on leader (图23)", "degree-minute-second or decimal degree values"]
dxf_forms = ["DIMENSION dimtype 2 (2-line angular) or 5 (3-point angular); code 42 holds the angle in radians; text '<>' with DIMAUNIT or override '30%%d'", "exploded: ARC (dimension arc) + LINE extension lines + 2 SOLID/INSERT arrowheads + TEXT '30%%d' with rotation 0", "angle text on a LEADER/MULTILEADER when space is short", "DMS text with %%d plus ′ ″ (or ' \") characters; decimal degrees '7.5%%d'", "layer 08 or template dimension layer"]
recognition = "锚点为带°（%%d、\\U+00B0）的文字或DIMENSION类型2/5。几何：附近有细实线ARC（或尺寸块内ARC），其圆心与两条直线（轮廓或尺寸界线）的交点即角顶点重合，两箭头尖分别落在两条径向线上；文字旋转角≈0（水平），数值≈两线夹角。与弧长区分：弧长也用圆弧尺寸线，但数字前有⌒、单位是长度，圆心在被注圆弧的圆心而非两直线交点，尺寸界线平行于角平分线；与倒角“n×45°”区分：后者写在指引线上，无圆弧尺寸线；锥度的圆锥角常写作α/2=…在基准线上作参考。可联动已有识别卡angle_unit（角度单位）。"
confusions = ["弧长尺寸：圆弧尺寸线，但数字前有⌒、单位为长度，尺寸界线平行于角平分线或径向。", "半径尺寸线：从圆心到圆弧的直线，不是圆弧状尺寸线。", "倒角注法n×45°或C：写在指引线上，没有角度尺寸弧。", "锥度与圆锥角：锥度▷1:5写在基准线上，圆锥角α/2=…常作参考。", "轴测图角度：尺寸线为椭圆弧。"]
related = ["DC-G4-025", "DC-G4-047", "DC-G4-035", "DC-G4-152", "DC-G4-037", "DC-G4-058"]
priority = "high"
text_forms = ["30°", "45°", "1°54′33″", "60°±10′", "3×20°=60°", "30%%d"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["angle_unit", "dimension_text"]
recognizer = "card"
seen_on_drawing = ["development", "second"]
expert_checked = false
notes = "Rules from GB/T 4458.4-2003 4.1.5/4.2.4/4.3.3 and textbook 表1-5. Linked existing recognition card: angle_unit. Seen on both project drawings. DXF codes are general practice."
