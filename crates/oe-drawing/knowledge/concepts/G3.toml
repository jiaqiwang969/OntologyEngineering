[[concepts]]
id = "DC-G3-150"
name = "动态密封要素符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "密封特征画法中的长粗实线斜线，代表密封圈或防尘圈上起动态密封作用的唇（含防尘除尘结构），与静态密封要素组合使用，倾斜方向与工作介质流动方向相反。"
components = ["一条长粗实线，在矩形线框内从静态要素线的一端斜向对边角点：2009版为与轮廓线成对角形式，1996版规定与轮廓线成45°。", "必须与静态密封要素（平行于母线的长粗实线）组合使用，不单独出现。", "必要时在斜线端部加一个箭头表示密封方向。", "可再与成90°的短线（防尘副唇）组合，或两条斜线交叉表示双向密封。"]
variants = ["2009：与轮廓线成对角", "1996：与轮廓线成45°"]
dxf_forms = ["Single thick LINE on layer 01 starting at an end of the static LINE inside the seal frame; part of an exploded seal symbol or a library INSERT", "Optional arrowhead as a filled SOLID/HATCH triangle or a LEADER arrow at one end"]
recognition = "锚点为密封框内的粗斜线，其一端与紧贴长边的静态长线端点相接；2009版斜线大致连到对边远角（角度随框高宽比变化），1996版约45°。必须找到配对的静态线，这是与通用画法X（两斜线交叉、不与其他线相接）以及剖面线（多条等距细线）的区别；与轴承角接触斜线区分在于后者有正交短线穿过。"
confusions = ["通用画法对角线：成对交叉于框中心、四端不触框，无静态线。", "倾斜剖面线：多条等距细实线，充满区域。", "滚动轴承角接触特征画法的斜线：有正交短线穿过且不与其他线相接。"]
related = ["DC-G3-203", "DC-G3-202", "DC-G3-118", "DC-G3-168", "DC-G3-164"]
