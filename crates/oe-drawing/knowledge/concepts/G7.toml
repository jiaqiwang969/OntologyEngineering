[[concepts]]
id = "DC-G7-020"
name = "模样分型线与限制区域的线型"
aliases = []
group = "G7"
kind = "line"
meaning = "模制件图样中规定的线型用法：视图中的模样分型线用粗实线（01.2），剖视图中的模样分型线和限制区域界线用粗点画线（04.2），模样最初轮廓、成品中空部分轮廓和特定区域线用细双点画线（05.1）。"
components = ["01.2粗实线：视图中的模样分型线。", "04.2粗点画线：剖视图中的模样分型线；限制区域界线。", "05.1细双点画线：模样的最初轮廓线、成品中空部分轮廓线、特定区域线（如标识位置框）。", "分模面图形符号：放在分型线上、零件轮廓外侧，用来说明该线为分型线。"]
variants = ["parting line in view", "parting line in section", "restricted area boundary", "pattern initial contour"]
dxf_forms = ["parting line in view: LINE on layer 01 with CONTINUOUS linetype, crossing the part outline and extending beyond it to carry the parting symbol", "parting line in section / restricted-area boundary: thick LINE with CENTER/ACAD_ISO04W100 linetype on layer 06", "initial pattern contour / hollow outline / special area: thin LINE/LWPOLYLINE with PHANTOM/ACAD_ISO05W100 linetype on layer 07"]
recognition = "以分模面图形符号（菱形，可半涂黑）为锚点，其所在直线即分型线，再按该线线型与所在视图类型（视图或剖视）核对；粗点画线围成的区域若配“限制区域”等注释即为限制区域界线；细双点画线形状与主体轮廓相近但偏大则为模样最初轮廓。"
confusions = ["假想轮廓、相邻零件轮廓（细双点画线）：用于装配和运动位置，不配模制件符号。", "中心线（细点画线）：线宽细，穿过回转中心。", "热处理区域粗点画线：配热处理文字。"]
