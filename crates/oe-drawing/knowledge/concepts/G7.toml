[[concepts]]
id = "DC-G7-002"
name = "塞焊缝、槽焊缝、点焊缝和缝焊缝的视图画法"
aliases = []
group = "G7"
kind = "conventional_representation"
meaning = "在搭接件的平面视图和剖视图中，按规定图形示意塞焊、槽焊、点焊和缝焊：平面视图画出焊孔、焊槽或焊点轮廓（带中心线），剖视图在两板接合面处以小块涂黑表示焊缝或熔核，位置由定位尺寸L、间距e和边距确定。"
components = ["塞焊缝平面视图：孔中心线十字上的圆，圆内画向心的放射状细短线表示孔已焊满；剖视中孔位处两板间为涂黑矩形。", "槽焊缝平面视图：长圆形槽轮廓，槽内画横向细短线；剖视中沿槽长涂黑。", "点焊缝：中心线十字上的圆（偏离中心时圆内画放射线）；剖视中两板接合面上画涂黑的椭圆或矩形熔核。", "缝焊缝：沿焊缝长度的条带，宽度为c；剖视中接合面连续或断续涂黑。", "定位与间距：L定位首个孔/槽/焊点中心，e为相邻中心距，到板边距离另注，均为视图上的普通尺寸。"]
variants = ["plug weld", "slot weld", "spot weld centred / offset", "seam weld"]
dxf_forms = ["CIRCLE + centre-line cross (LINE, layer 05, CENTER/ACAD_ISO04W100) with many short radial LINEs inside (plug weld, offset spot weld)", "obround slot as 2 ARC + 2 LINE or a closed LWPOLYLINE with bulges, filled with short transverse LINEs (slot weld)", "section view: small HATCH SOLID ellipses or rectangles on the faying surface between two ANSI31 sheet sections", "linear DIMENSION entities for L and e repeated along the row"]
recognition = "锚点为薄板搭接区内沿一直线等距排列的小圆或长圆（带中心线十字），并有重复间距尺寸e和起始定位尺寸L。圆内放射短线（塞焊/偏心点焊）或长圆内横向短线（槽焊）是关键判据；配套剖视中两板接合面出现成列的小涂黑块；通常另有点焊○、塞焊⊓等焊缝符号的指引线指向该列。"
confusions = ["普通孔：圆内无放射短线，剖视中为通孔且剖面线在孔处断开，而非接合面涂黑。", "铆钉：按铆钉画法或装配符号表示，剖视中可见铆钉杆及头部的剖面。", "螺纹孔端视图：粗实线圆加约3/4圈细实线圆弧，无放射线。", "腰形孔：长圆轮廓内为空白，剖视中贯通。"]
related = ["DC-G7-130", "DC-G7-142", "DC-G7-111", "DC-G7-011", "DC-G7-008", "DC-G7-015", "DC-G7-012", "DC-G7-001"]
priority = "low"
text_forms = []
knowledge_units = ["K43", "K40", "K41", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
