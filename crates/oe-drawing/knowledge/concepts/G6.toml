[[concepts]]
id = "DC-G6-023"
name = "圆柱和棱柱表面的注法（只标注一次）"
aliases = ["圆柱和棱柱表面的表面结构注法"]
group = "G6"
kind = "surface_indication"
meaning = "圆柱或棱柱表面的表面结构要求只标注一次（通常注在圆柱轮廓或其延长线上），即作用于整个圆柱面；棱柱各面要求不同时各面分别标注。"
components = ["2006版图21：要求注在圆柱特征的延长线或轮廓线上，只注一次即覆盖整个圆柱面。", "图22：棱柱各表面要求不同时分别单独注出。", "1993版4.6：连续表面及重复要素（孔、槽、齿等）的代号只注一次（图16、17）。", "ISO 21920-1草案8.2：圆柱特征不受“远离尺寸线时只作用于延长线所指要素”规则的限制。"]
variants = ["GB/T 131-2006 11.2.6 图21 图22", "GB/T 131-1993 4.6: continuous surfaces and repeated elements (holes, slots, teeth) indicated once (图16, 图17)", "ISO 21920-1 draft 8.2: cylindrical features excepted from the 'away from dimension line' rule", "圆柱特征延长线", "棱柱各面分别标注"]
dxf_forms = ["one INSERT on a generator LINE of the cylinder (outline in a side view) or on its extension line", "INSERT on an extension line of the diameter DIMENSION (%%c)", "separate INSERTs on each face of a prism outline"]
recognition = "锚点：符号所在的轮廓线；若该轮廓属于回转体（视图有轴线、对侧有平行母线、同组尺寸带Ø），则把要求赋给整个圆柱面，而且同一圆柱的另一母线上不应再有代号。棱柱上的代号分别赋给各面。重复要素（均布孔、齿槽）只注一次即作用于全部同类要素。区分只作用于一个平面的代号；多个视图重复出现的代号通常指不同表面。"
confusions = ["单一平面上的代号：只作用于该平面", "多视图重复注写：通常指不同表面", "轮廓线注法：放置方式相同，但赋义范围不同"]
related = ["DC-G6-052", "DC-G6-053", "DC-G6-047", "DC-G6-024", "DC-G4-058"]
priority = "medium"
text_forms = ["Ra 1.6（注在Ø母线延长线上）"]
