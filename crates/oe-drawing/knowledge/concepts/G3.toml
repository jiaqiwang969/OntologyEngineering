[[concepts]]
id = "DC-G3-008"
name = "凹槽与凹腔"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在零件底面或安装面上铸出或加工出的凹槽或凹腔，用以减少加工面积和接触面，使安装面接触良好。"
components = ["凹槽：贯通底面中部的浅槽，把安装面分为两条接触带。", "凹腔：底面中间的封闭凹入空腔，四周留出一圈接触面。", "槽深较浅，转角处为铸造圆角。"]
variants = ["凹槽", "凹腔"]
dxf_forms = ["Thick LINE/ARC outline of a shallow notch in the base contour, with fillet ARCs at the corners", "Hidden LINEs (层04) outlining the recess in views where it is not visible; plan view as a rectangle or closed LWPOLYLINE"]
recognition = "锚点：零件底边（安装面）轮廓在中部断开为两段接触线，中间为向内的浅矩形凹口（深度远小于宽度），转角为小圆弧；仰视或俯视中对应矩形或封闭轮廓线框（可为虚线）。区分：退刀槽、越程槽位于回转面靠台阶处，窄而深，常有局部放大；键槽在轴或孔上并按键尺寸标注。"
confusions = ["退刀槽、越程槽：在轴/孔回转面上，与车削或磨削有关。", "键槽：在轴/孔上，宽度深度按键标准。"]
