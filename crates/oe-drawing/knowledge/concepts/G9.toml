[[concepts]]
id = "DC-G9-015"
name = "零件图视图选择"
aliases = []
group = "G9"
kind = "other"
meaning = "零件图视图选择的原则：主视图按零件的主要加工位置（轴、套、轮盘类轴线水平）或工作位置（支座、箱体类）安放，并选最能反映形状特征和各部分相对位置的投射方向；其他视图各有表达重点，在表达清楚的前提下数量尽量少。"
components = ["回转体类（轴、套、盘、盖）：主视图轴线水平；轴套类加断面图、局部放大图表达键槽、销孔、退刀槽；盘盖类常用全剖主视图加一个表达外形和均布孔的视图。", "非回转体类（叉架、箱体）：按工作位置或自然位置安放，一般需要2~3个或更多基本视图，再配局部视图、断面图等。", "同一零件可有多种表达方案，优先采用基本视图并在其上作剖视。"]
variants = ["轴套类", "盘盖类", "叉架类", "箱体类"]
dxf_forms = ["no specific entity: inferred from view layout, i.e. orientation of the main CENTER-type line (layer 05) and arrangement of view bounding boxes"]
recognition = "可作为视图分组后的先验：轴套类主视图的主中心线（细点画线）水平且贯穿全长，周围常有移出断面（带剖切符号）和局部放大图（罗马数字加比例）；盘盖类常为两个视图，其中一个是带均布孔中心圆的圆形视图；箱体类有三个以上视图和向视图。先验只用于排序和消歧，不作为判定依据。"
confusions = ["装配图的视图选择：按工作位置和主要装配干线确定，主视图常沿装配干线全剖。"]
