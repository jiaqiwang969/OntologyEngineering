[[concepts]]
id = "DC-G4-055"
name = "直径符号 Ø"
aliases = ["直径符号φ"]
group = "G4"
kind = "dimension_symbol"
meaning = "写在尺寸数字前、说明该尺寸是圆或圆柱（孔、轴等回转尺寸要素）直径的符号，符号与数值之间不留空格。"
components = ["符号本体：圆加一条斜穿的直线，高度与尺寸数字字高h相当，笔画宽约h/10（GB/T 4458.4 附录A）", "位置：紧贴尺寸数值左侧、无空格；其后可接公差带代号或极限偏差，如Ø18H7", "所依附的尺寸：圆视图中尺寸线过圆心、箭头触圆周；非圆视图中为普通线性尺寸；也可写在指引线基准线上（孔的旁注）", "组合：前加S为球直径SØ；前加n×表示重复要素数量，如4×Ø8", "GB/T 38762.1 规则：圆或圆柱面的公称值前注Ø且无空格；写成两行极限尺寸时，上下两行各自带Ø"]
variants = ["Ø prefix on dimension line", "in hole notes n×Ø", "old/hand-drawn form often OCR'd as ¢ or $", "φ与公差带代号连写 φ18H7"]
dxf_forms = ["TEXT/MTEXT control code %%c (AutoCAD/GstarCAD; rendered as Ø by gbenor.shx/gbeitc.shx)", "MTEXT Unicode \\U+2205 or \\U+00D8, or the literal characters Ø/ø; Chinese drawings often type Greek Φ (U+03A6) or φ (U+03C6)", "DIMENSION dimtype 3 (diameter) adds the prefix automatically; linear DIMENSION with code 1 override '%%c<>' or DIMPOST prefix '%%c'", "gdt.shx glyph: MTEXT {\\Fgdt;n}", "after EXPLODE: stand-alone TEXT such as '%%c30'; rarely a tiny CIRCLE + LINE symbol drawn by hand", "layer 08 or template dimension layer (DIM / 标注 / 尺寸线层)"]
recognition = "锚点是尺寸文字开头的直径编码：%%c/%%C、\\U+2205、\\U+00D8、Ø、ø、Φ、φ，以及OCR误读¢、$、中、少、+、0。确认为直径符号需同时满足：紧贴数字（无空格，可在n×或S之后）；所在文字属于DIMENSION，或位于尺寸线上方约0.3~1h处，或在指引线基准线上。DIMENSION类型3可直接取被测圆；线性尺寸时两尺寸界线应落在回转体两条转向轮廓线上并跨越点画线轴线。若出现在分格矩形框内的公差值前（如Ø0.02），则是圆形/圆柱形公差带而非尺寸。与字母O/数字0靠斜线笔画和上下文区分。"
confusions = ["字母O或数字0：无斜笔画；OCR常把Ø读成0、¢、$，需结合位置判断", "几何公差框格中公差值前的Ø：表示公差带为圆形或圆柱形，在分格框内，不是尺寸", "球直径SØ：前面多一个S，用于球面", "正方形符号□：同为数值前缀，表示方截面边长", "说明或材料文字中的φ字符：不与尺寸线或指引线关联"]
related = ["DC-G4-030", "DC-G4-054", "DC-G4-050", "DC-G4-094", "DC-G4-088", "DC-G4-077"]
priority = "high"
text_forms = ["Ø30", "%%c30", "Ø18H7", "4×Ø8", "Φ20", "SØ20", "Ø30 +0.021/0"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
