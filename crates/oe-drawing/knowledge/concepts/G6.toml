[[concepts]]
id = "DC-G6-070"
name = "工件轮廓各表面的图形符号（全周符号）"
aliases = ["周边各面相同要求符号", "封闭轮廓各表面相同要求符号"]
group = "G6"
kind = "symbol"
meaning = "在完整符号的长边与横线拐角处加一小圆并标在视图的封闭轮廓线上，表示该视图中构成封闭轮廓的各表面（不含前后面）有相同的表面结构要求。"
components = ["主体为三种完整符号之一，小圆画在长边上端与横线相交的拐角处。", "符号尖端落在封闭轮廓线上，或经指引线引到该轮廓上。", "作用范围为该视图封闭轮廓所代表的周边各面，不包括前后两面；可能引起歧义时应分别标注。", "GB/T 131-1993：在三种符号上加一小圆表示所有表面要求相同，也用于镀覆后不再加工的示例。", "区域法（GB/T 33523.1）有对应的“全方位”完整符号；ISO 21920-1草案为避免歧义不再定义此符号。"]
variants = ["GB/T 131-2006 4.5 (on the closed contour; indicate separately if ambiguous)", "GB/T 131-1993: a small circle added to any of the three symbols means all surfaces have the same roughness requirement (also used with coating in B11)", "GB/T 33523.1 表1 No.7 complete symbol with 'all-around' modifier for areal requirements", "ISO 21920-1 draft: no longer defined (removed to avoid ambiguity)"]
dxf_forms = ["INSERT of the complete-symbol block with an extra CIRCLE at the leg–bar corner", "exploded LINEs + CIRCLE, centre at or next to the upper end of the long leg, radius ≈0.3–0.5h", "proxy or anonymous block with an 'all around' flag from mechanical add-ons", "requirement text as ATTRIB/TEXT under the bar, as for an ordinary complete symbol"]
recognition = "锚点：完整符号；在长边上端与横线交点附近找CIRCLE，交点到圆心的距离约等于半径或交点即为圆心。尖端应落在一个闭合的轮廓环上（可经指引线）。区分不去除材料小圆（在V形内部、与两斜边相切）；区分几何公差全周符号（圆在指引线折弯处，另一端连框格）；区分周围焊缝符号（圆在箭头线与基准线交点，连焊缝符号）。"
confusions = ["不去除材料符号：小圆在V形内部", "几何公差全周符号：圆在指引线折弯处，连公差框格", "周围焊缝符号：圆在焊缝箭头线与基准线交点", "区域法全方位符号：另带小菱形"]
related = ["DC-G6-069", "DC-G6-063", "DC-G6-065", "DC-G6-025", "DC-G5-043", "DC-G7-106"]
priority = "medium"
text_forms = ["Ra 3.2（带全周小圆）", "Rz 1.6（带全周小圆）"]
knowledge_units = ["K31", "K32", "K39"]
