recognition = "本身与可见轮廓线相同，需借配对的细实线牙底线（3/4圆弧或平行细线）判定。外螺纹：粗线在外、细线在内；内螺纹：粗线（小径）在内、细线（大径）在外，剖视中剖面线画到粗实线为止。螺纹终止线垂直于轴线并连接两条牙顶线。"
