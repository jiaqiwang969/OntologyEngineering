meaning = "CAD 制图可选的第二种尺寸线终端：由两条短斜线组成的开口箭头，不填充，尖端触及尺寸界线。"
components = ["两条等长的短细实线，自尖端关于尺寸线对称地向尾部张开", "尖端落在尺寸界线上，中间为尺寸线", "选用顺序在实心箭头之后，同一图样一般只用一种终端"]
