components = ["三种：允许任何工艺（No.4）、去除材料（No.5）、不去除材料（No.6）。", "横线下方a、b写区域规范（S-L或S-F…/参数 数值），其余位置写评定区域相交平面（c）、加工工艺（d）、纹理（e）、纹理相交平面（f）、加工余量（g）。", "尺寸比例同GB/T 131-2006（字高h，短边约1.4h，长边至少约3h）。", "与ISO 21920-1草案轮廓法完整符号区分：后者多一条横杠、没有菱形。"]
