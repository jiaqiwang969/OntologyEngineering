components = ["符号写在V形右侧、横线下方的位置d，字高为h。", "=：纹理平行于视图所在投影面；⊥：垂直于投影面；X：两斜向交叉；M：多方向。", "C：近似同心圆；R：近似放射状；P：微粒、凸起、无方向（GB/T 131-2006表2）。", "符号不能清楚表达纹理时，在图样上加注文字说明；纹理符号不用于文本标注。"]
