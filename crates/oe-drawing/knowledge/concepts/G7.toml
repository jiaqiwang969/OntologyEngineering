[[concepts]]
id = "DC-G7-001"
name = "剖视图与断面图中焊缝涂黑"
aliases = ["焊缝断面涂黑"]
group = "G7"
kind = "conventional_representation"
meaning = "在垂直于焊缝的剖视图或断面图中，把焊缝金属熔焊区涂成实心黑色，直观表示焊缝截面的形状与位置；若还需表示坡口形状，可改为按端面视图的轮廓画法绘制熔焊区。"
components = ["被焊件截面：两块或多块母材按金属剖面符号（45°细实线）绘制，相邻零件剖面线方向或间距不同。", "熔焊区：位于母材接缝或交角处的小块实心涂黑区域，形状随焊缝类型为三角形（角焊）、V/X形楔块（对接坡口）等，区域内不画剖面线。", "替代画法：需同时表示坡口时，熔焊区用粗实线画外轮廓、细实线画焊前坡口，不涂黑。", "版本差异：GB/T 12212-1990称“剖面图”，2012版改称“断面图”，画法不变。"]
variants = ["solid fill", "outline with groove shape", "1990 edition: 剖面图 terminology"]
dxf_forms = ["HATCH with pattern SOLID (solid-fill flag 1) bounded by a small closed LWPOLYLINE/ARC loop at the joint between two ANSI31/ANSI37 hatched section areas", "2D SOLID entities or a wide LWPOLYLINE filling a small triangle (older drawings and some CAXA/GstarCAD exports)", "on layer 10 (剖面符号) together with the section hatch, or on the outline layer 01"]
recognition = "锚点为剖视/断面区域中的SOLID填充。条件：填充面积远小于相邻剖面线区域（通常边长≈焊脚K，几毫米）；边界与两个不同剖面线区域（两零件）的轮廓共边，位于接缝或内角处；形状为三角形或楔形。附近常有指向它的焊缝符号指引线。与薄件涂黑区分：薄件涂黑是整条细长截面（长宽比大、厚≤2 mm），焊缝涂黑只占两件交界处的小三角或楔块。"
confusions = ["狭小剖面（薄板、垫片、型材壁）涂黑：整段细长截面全部涂黑，不局限于两件交界处。", "粘接层：按GB/T 24746用接合符号标注，剖面中通常不是接缝处的实心三角。", "涂黑的基准三角形：位于基准字母方框的连线末端，孤立贴在轮廓外侧，尺寸约等于字高。", "相邻涂黑剖面之间的间隙：多个薄件涂黑并留白隙，属剖面规定画法，与熔焊区无关。"]
related = ["DC-G7-005", "DC-G7-006", "DC-G7-091", "DC-G7-035", "DC-G7-002", "DC-G2-057", "DC-G2-008", "DC-G1-010"]
priority = "medium"
text_forms = []
knowledge_units = ["K43", "K40", "K41"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "面积和形状判据为通用制图与CAD习惯，标准只规定“通常应涂黑”。"
[[concepts.sources]]
document = "GB/T 12212-2012"
clause = "4.3 图5 图6"
page = 4
