[[concepts]]
id = "DC-G1-055"
name = "重合图线的优先顺序"
aliases = []
group = "G1"
kind = "line"
meaning = "两种以上图线在同一位置重合时只画优先级最高的一种：可见轮廓和棱线 > 不可见轮廓和棱线 > 剖切线 > 轴线和对称中心线 > 假想轮廓线 > 尺寸界线和分界线。"
components = ["顺序（GB/T 14665）：(1)粗实线可见轮廓和棱线；(2)细虚线不可见轮廓和棱线；(3)细点画线剖切线；(4)细点画线轴线和对称中心线；(5)细双点画线假想轮廓；(6)细实线尺寸界线和分界线。", "教材补充：线宽相同时按习惯，细实线与细虚线或细点画线重叠画细实线，细虚线与细点画线重叠画细虚线。", "被盖住的中心线常只在轮廓两端露出一小段。"]
variants = []
dxf_forms = ["absence of the lower-priority entity at the shared location", "both entities present and exactly coincident in the file (common in CAD), or a short centre-type stub protruding beyond each end of an outline"]
recognition = "识别时反向使用：粗实线两端各伸出一小段点画线（约2~5 mm）时，推断其下“藏着”一条轴线或对称线；虚线落在对称面位置时也推断有对称线。DXF 中两实体完全重合时，取高优先级者为可见语义，低优先级者记为附加语义，不当作重复错误删除。"
confusions = ["缺失的中心线：可能被轮廓覆盖，而非遗漏。", "被遮挡未画出的虚线：按优先顺序省略，结构仍存在。"]
related = ["DC-G1-038", "DC-G1-045", "DC-G1-044", "DC-G1-042", "DC-G1-043", "DC-G1-033"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = ["development", "second"]
expert_checked = false
notes = "教材“细实线与细虚线、细点画线重叠画细实线”的习惯与 GB/T 14665 中细实线优先级最低的规定不一致，待专家确认。"
