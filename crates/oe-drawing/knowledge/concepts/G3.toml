recognition = "锚点为回转件剖视图端面处、关于轴线对称成对出现的矩形框，框内有连接对角的两条细实线且框内无HATCH，而相邻实体有剖面线；同时存在端视图（径向齿侧线，齿数可为奇数）和标有字母的向视/局部视图（齿形）。与动密封圈通用画法区分：密封圈的X不接触框线且位于轴与孔之间的配合间隙中；与表示平面的对角线区分：平面对角线画在外形视图的平面轮廓内而非剖视截面上；与滚动轴承通用画法区分：后者为正立十字。"
confusions = ["动密封圈通用画法：矩形框内对角线不与框线接触，位于轴孔之间。", "平面对角线符号：画在视图中的平面上，不在剖面区域内。", "滚动轴承通用画法：框内是正立十字而非对角线。", "按真实投影画齿：奇数齿时上下不对称，且齿截面会画剖面线。"]
