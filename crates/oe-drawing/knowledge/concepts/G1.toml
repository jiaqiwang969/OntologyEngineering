[[concepts]]
id = "DC-G1-025"
name = "成规律分布的相同要素连线"
aliases = []
group = "G1"
kind = "line"
meaning = "若干相同结构（齿、槽等）按规律分布而只画出其中几个时，用细实线把它们连起来，表示其余的按同样规律分布。"
components = ["细实线（No.01.1.18）。", "画出两端或少数几个完整结构，其余位置用细实线连接其顶部或底部轮廓。", "须注明结构的总数（如“n×…”）。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight 25 or 35 (or ByLayer) on a thin layer: GB/T 14665 layer 02, names such as 细实线/THIN; colour green (ACI 3)", "thin LINE/ARC collinear with the tips or roots of the drawn features", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一排等距的相同小结构只在两端或局部完整画出，中间被一条与结构顶/底共线的细实线连接；附近有“n×”数量标注。细线两端与完整结构的轮廓端点重合。"
confusions = ["中断线：细双点画线。", "孔系分布中心线：点画线，表示孔心位置。", "不连续同一表面连线：连接同一表面的几段轮廓。"]
related = ["DC-G1-043", "DC-G1-004", "DC-G1-003", "DC-G3-134", "DC-G3-115", "DC-G4-094"]
priority = "low"
text_forms = []
