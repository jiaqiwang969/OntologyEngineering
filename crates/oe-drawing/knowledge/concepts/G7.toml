[[concepts]]
id = "DC-G7-053"
name = "工具运动方向符号 TMD"
aliases = []
group = "G7"
kind = "symbol"
meaning = "模制件图上表示成型模具零件（型腔、铸心、滑块）运动方向的图形符号：一条双向箭头，上方注字母TMD；与之相连的参考线上可注运动零件类别字母（C运动铸心、M主要运动零件、S运动滑块）和运动方向角度（可带公差）。"
components = ["双向箭头：两端均有箭头，表示模具零件运动方向。", "字母TMD：写在箭头一侧。", "参考线（可选）：位置a注零件类别字母C、M或S，位置b注角度，如S 45°±10°。"]
