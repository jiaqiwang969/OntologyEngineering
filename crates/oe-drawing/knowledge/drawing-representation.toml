[[cards]]
id = "parts_list"
expression_kind = "parts_list"
title = "明细栏"
meaning = "装配图中列出全部零件、部件的表，画在标题栏上方并与之相接：表头行在最下面（序号、代号、名称、数量、材料、质量、备注等），序号自下而上填写；放不下时在标题栏左边延续，或作为续页由上而下填写（表头在上）。序号列是连续的整数，代号列填零件图号或标准件的标准编号。"
sources = [
  "GB/T 10609.2-2009 技术制图 明细栏 3.2、3.5、图A.1、图A.2",
  "GB/T 18229-2000 CAD工程制图规则 4.7",
  "GB/T 4458.2-2003 机械制图 装配图中零、部件序号及其编排方法 4.5（序号与明细栏一致）",
  "机械制图（第7版）§10-1 一、4",
]
knowledge_units = ["K03", "K55", "K15"]
recognition = "一个图块中由直线组成表格：同一行文字中至少两个是表头词；表头的竖线把表分成列；其余各行在序号列是连续整数，表头在下时自下而上递增，表头在上时自上而下递增。整张表读成一个明细栏，各行按列名记为行内容。区别：标题栏没有序号列和表头词行；表格图的行是尺寸系列，没有连续的序号列；技术要求没有格线。"
markers = []
concepts = ["DC-G8-025"]

[[cards.components]]
role = "table_line"
primitives = ["LINE", "LWPOLYLINE"]
requirement = "表格的横线与竖线"

[[cards.components]]
role = "table_text"
primitives = ["TEXT", "MTEXT", "ATTRIB"]
requirement = "表头词与各行内容"

[[cards.variants]]
id = "block_table"
title = "整块明细栏（格线与文字在一个图块中）"
distinguishing = "表头行有两个以上表头词，序号列连续递增"
encodings = ["block"]
tests = ["parts_list_block_rows_match_item_numbers"]

[[cards.counter_examples]]
statement = "没有连续序号列的格子（如标题栏、表格图）不是明细栏"
