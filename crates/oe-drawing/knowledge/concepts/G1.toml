[[concepts]]
id = "DC-G1-019"
name = "基本线型（No.01-No.15）"
aliases = []
group = "G1"
kind = "line"
meaning = "技术制图规定的十五种基本线型及其代码，是一切图线的基础；机械图样只用其中实线、虚线、点画线、双点画线等少数几种及其变形。"
components = ["01实线、02虚线、03间隔画线、04点画线、05双点画线、06三点画线、07点线。", "08长画短画线、09长画双短画线、10画点线、11双画单点线、12画双点线、13双画双点线、14画三点线、15双画三点线。", "可变形为规则波浪、规则螺旋、规则锯齿连续线及徒手波浪线；机械图中的波浪线、双折线即01型的变形。", "手工线素长度：点≤0.5d，短间隔3d，短画6d，画12d，长画24d，间隔18d。"]
variants = ["01 实线", "02 虚线", "03 间隔画线", "04 点画线（单点长画线）", "05 双点画线", "06 三点画线", "07 点线", "08 长画短画线", "09 长画双短画线", "10 画点线", "11 双画单点线", "12 画双点线", "13 双画双点线", "14 画三点线", "15 双画三点线", "规则波浪连续线", "规则螺旋连续线", "规则锯齿连续线", "波浪线（徒手连续线）"]
dxf_forms = ["LTYPE table entries: name (2), description (3), element lengths (49): positive = dash, negative = gap, 0 = dot — classify by pattern, not by name", "CONTINUOUS = 01; HIDDEN/DASHED/ACAD_ISO02W100 = 02; ACAD_ISO03W100 = 03; ACAD_ISO04W100/DASHDOT = 04; ACAD_ISO05W100/DIVIDE = 05; ACAD_ISO06W100 = 06; DOT/ACAD_ISO07W100 = 07", "AutoCAD CENTER (long + short dash) is nominally type 08 and PHANTOM (long + two short dashes) type 09, yet they are used for chain lines on Chinese mechanical drawings", "entity group 6 linetype name, group 48 linetype scale, header $LTSCALE"]
recognition = "按线型图案判别而不是按名称：读取 LTYPE 的画/间隔序列，换算为线宽 d 的倍数（ISO 线型按1 mm 线宽定义）后与线素长度比较。中国机械图普遍用 CENTER、PHANTOM 画点画线与双点画线，它们实际是“长画+短画”，识别时应归入04/05的用途。炸开的不连续线先按共线与周期重组，再判线型。"
confusions = ["机械图常用九种线型：细实线、波浪线、双折线、粗实线、细虚线、粗虚线、细点画线、粗点画线、细双点画线，用途见各线型条目。", "CENTER/PHANTOM 与 ISO 点画线：名义线型不同，机械图中用途相同。"]
related = ["DC-G1-038", "DC-G1-043", "DC-G1-044", "DC-G1-045", "DC-G1-042", "DC-G1-016", "DC-G1-017"]
priority = "medium"
