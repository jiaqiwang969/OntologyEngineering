[[concepts]]
id = "DC-G4-113"
name = "公差带代号与极限偏差同时注出"
aliases = ["公差带代号与极限偏差同注", "公差带代号加偏差注法"]
group = "G4"
kind = "tolerance_indication"
meaning = "公差带代号与极限偏差同时注出：在公称尺寸后先写公差带代号，再在圆括号内写出对应的上、下极限偏差；反之也可在偏差后用括号附注公差带代号，作为辅助信息。适用于生产批量或检测量具未定的零件图。"
components = ["公称尺寸：含Ø等前缀", "公差带代号：与公称尺寸同字高，紧随其后，如 H7、k6", "括号内极限偏差：上下叠写、小一号字，外加圆括号", "反向形式：先注偏差，括号内注公差带代号，如 32 +0.025/0 (H7)", "可再接Ⓔ：如 Ø55j6(+0.012/−0.007)Ⓔ"]
variants = ["class (deviations)", "deviations (class)", "代号+括号内偏差", "后加 Ⓔ 包容要求（如 Ø55j6(+0.012/−0.007)Ⓔ）"]
dxf_forms = ["MTEXT '%%c65H7(\\S+0.030^0;)' or '%%c65H7({\\H0.7x;\\S+0.030^0;})' as DIMENSION override text (code 1) or leader MTEXT", "DIMENSION with DIMPOST/override 'H7' plus DIMTOL deviations and literal brackets in the override string", "exploded TEXT pieces: nominal+class TEXT, '(' TEXT, two small deviation TEXTs, ')' TEXT"]
recognition = "锚点：尺寸文字中“公差带代号（大写或小写字母1–2个+数字）”后紧跟圆括号，括号内为上下叠放的两个偏差（或在MTEXT中为\\S…^…;）。检验偏差与代号一致（可查GB/T 1800.2表）。与参考尺寸括号区分：参考尺寸括号包住整个尺寸数值且无公差带代号；与配合代号区分：无分数线；与两件共用一图的括号尺寸区分：括号内是另一零件的公称值而非偏差。"
confusions = ["参考尺寸（圆括号）：括号包住公称尺寸本身", "仅注公差带代号：无括号偏差", "仅注极限偏差：无代号", "配合代号 H7/k6：分数形式，装配图上", "两件共用一图的括号尺寸"]
related = ["DC-G4-114", "DC-G4-132", "DC-G4-115", "DC-G4-009", "DC-G4-150"]
priority = "high"
text_forms = ["Ø65H7(+0.030/0)", "Ø14h7(0/-0.018)", "Ø70m6(+0.030/+0.011)", "32 +0.025/0 (H7)", "Ø30 F7(+0.041/+0.020) Ⓔ"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 4458.5-2003 4.1.3 图5/图6, GB/T 1800.1-2020 4.2.2 示例2, textbook 图9-37d, GB/T 38762.1 图12. Deviations written upper/lower with '/'. DXF encodings are general CAD practice."
