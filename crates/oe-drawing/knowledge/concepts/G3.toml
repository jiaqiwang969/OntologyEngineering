[[concepts]]
id = "DC-G3-052"
name = "螺旋齿轮副啮合画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "轴线交错（垂直或不垂直）的螺旋齿轮副在装配图中通常一个齿轮画成圆、另一个画成侧视；剖切平面不通过两齿轮轴线时，两齿轮都按不剖绘制。"
components = ["一个齿轮呈圆的视图：齿顶圆粗实线、分度圆点画线；另一个齿轮为侧视，画出三条与齿线方向一致的细实线表示螺旋齿。", "两齿轮的分度圆（线）在啮合处相切，轴线在空间交错，不在同一平面内。", "当剖切平面只通过其中一个齿轮轴线或不通过两轴线时，齿轮一律不剖。", "有轴线垂直交错（图19）和不垂直交错（图20）两种图例。"]
variants = ["轴线垂直交错", "轴线不垂直交错"]
dxf_forms = ["two CENTER-linetype axes that cross in projection (90° or other angle) belonging to different gears", "gear side view: thick LINE rectangle + three thin parallel inclined LINEs (helix marks) + CENTER-linetype pitch line", "circular view: thick CIRCLE (tip) + CENTER-linetype CIRCLE (pitch)", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
