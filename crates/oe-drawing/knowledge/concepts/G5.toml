[[concepts]]
id = "DC-G5-042"
name = "倾斜度"
aliases = ["倾斜度符号"]
group = "G5"
kind = "symbol"
meaning = "倾斜度：方向公差，限定被测线或面相对于基准成理论正确角度（0°、90° 以外）的方向变动；理论角度用方框角度尺寸给出。"
components = ["特征符号：一条水平底线和一条从其左端向右上倾斜的直线构成锐角（约 30°–45°），整体约 0.6H 宽", "第二格：公差值；被测为轴线且公差带为圆柱时前加 Ø", "基准格：至少一个基准；理论角度以方框角度 TED（如 45° 加框）标在图形上"]
variants = ["面对面", "线对面（Ø 公差带）及第二基准"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;a} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph two LINE sharing the left end point (one horizontal, one inclined up-right) in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ∠ (U+2220) (or MTEXT font switch {\\Fgdt;a}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内共端点的两条直线：一条水平、长约 0.5–0.6H，另一条从水平线左端向右上，夹角 25°–50°，两线都在格内。框格应有基准字母，并能在图形上找到加框的角度尺寸。斜度符号写在尺寸数值前、配引出线，不在框格第一格；角度尺寸是弧形尺寸线加数字。OCR 常把 ∠ 读成 L 或 Z。"
confusions = ["斜度符号 ∠（写在斜度数值前，DC-G4-048）", "角度尺寸（圆弧尺寸线加度数，DC-G4-032）", "沉孔/锪平、埋头孔符号（写在孔尺寸前，DC-G4-051）", "垂直度 ⊥（竖线立在底线中点）"]
related = ["DC-G5-090", "DC-G4-029", "DC-G4-048", "DC-G5-060", "DC-G5-058", "DC-G5-097"]
priority = "medium"
