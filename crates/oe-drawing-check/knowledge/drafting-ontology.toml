# 制图规定的本体与约束，第一批。两份 Turtle 文档放在这个 TOML 里，因为编译输入只捕获 crates/ 下的 .rs 和 .toml：
# 这样本体与程序绑定在一起，改动本体就要重新构建并重新冻结。
#
# ontology：图样对象的类和它们之间的关系属性。类由识别结果的成员角色赋予（识别层的身份），几何由源 DXF 字节
# 给出；关系属性由独立复核 crate 的通用几何谓词计算，不含任何单条规定的知识。
# shapes：每条制图规定一个 SHACL 形状，带规定编号、概念目录编号、标准条款、中文消息和严重度；由框架的 SHACL
# 引擎在源图、识别、呈现三层的事实上分别评估。规定命中是待复核的偏离，不改变识别结果。
#
# 规范 drawing-understanding.toml 的事实合同（MdDraftingObject.class 与 MdDraftingRelation.predicate 的允许值）
# 必须与这里声明的类和属性集合完全相同，由 oe-drawing-check 的测试双向核对。
schema = "oev2.drafting-ontology/1"
title = "制图规定的本体化约束 · 第一批（图线、视图与剖视、尺寸）与第二批（中心线、比例、剖面线一致、视图名称、尺寸界线、半径、数字方向、几何公差、粗糙度）"

[ontology]
format = "text/turtle"
text = '''
@prefix md:   <urn:oev2:drafting:> .
@prefix dc:   <urn:oev2:drafting:concept:> .
@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix owl:  <http://www.w3.org/2002/07/owl#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .

md: a owl:Ontology ;
    rdfs:label "机械制图图样对象与制图规定"@zh ;
    rdfs:comment "类是图样上的对象种类，属性是对象之间可由几何计算的关系；规定在 shapes 中。"@zh .

# ---- 注释属性（本体与形状的元数据，不是事实词汇）
md:concept a owl:AnnotationProperty ; rdfs:label "概念目录编号"@zh .
md:ruleId  a owl:AnnotationProperty ; rdfs:label "规定编号"@zh .
md:clause  a owl:AnnotationProperty ; rdfs:label "标准条款"@zh .
md:group   a owl:AnnotationProperty ; rdfs:label "概念组"@zh .
md:confidence a owl:AnnotationProperty ; rdfs:label "把握程度：certain 确定 / likely 很可能 / needs_expert 要问专家"@zh .
md:proposedCorrection a owl:AnnotationProperty ; rdfs:label "建议改法"@zh .

# ---- 图线
md:Line a owl:Class ; rdfs:label "图线"@zh ; rdfs:comment "线段、圆弧、圆、多段线或样条构成的一条图线。"@zh .
md:VisibleOutline a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "可见轮廓线与可见棱边线"@zh ; md:concept dc:DC-G1-015, dc:DC-G1-014 ; md:group "G1" .
md:HiddenOutline a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "不可见轮廓线与不可见棱边线"@zh ; md:concept dc:DC-G1-002, dc:DC-G1-001 ; md:group "G1" .
md:CentreLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "轴线与对称中心线"@zh ; md:concept dc:DC-G1-021, dc:DC-G1-044 ; md:group "G1" .
md:BreakBoundary a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "断裂处边界线"@zh ; md:concept dc:DC-G1-029 ; md:group "G1" .
md:WavyBreakBoundary a owl:Class ; rdfs:subClassOf md:BreakBoundary ; rdfs:label "波浪线"@zh ; md:concept dc:DC-G1-032 ; md:group "G1" .
md:HatchLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "剖面线"@zh ; md:concept dc:DC-G1-010 ; md:group "G1" .
md:SectionRegion a owl:Class ; rdfs:label "剖面区域（填充实体）"@zh ; md:concept dc:DC-G2-019 ; md:group "G2" .
md:DimensionLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "尺寸线"@zh ; md:concept dc:DC-G4-059 ; md:group "G4" .
md:ExtensionLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "尺寸界线"@zh ; md:concept dc:DC-G4-058 ; md:group "G4" .
md:Arrowhead a owl:Class ; rdfs:label "箭头"@zh ; md:concept dc:DC-G4-059 ; md:group "G4" .
md:LeaderLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "指引线"@zh ; md:concept dc:DC-G1-028 ; md:group "G1" .
md:ThreadLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "螺纹规定画法的线"@zh ; md:group "G3" .
md:DetailCircle a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "局部放大图的圈"@zh ; md:group "G2" .
md:SheetLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "图框与表格线"@zh ; md:group "G9" .
md:SymbolLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "符号笔画"@zh ; md:group "G5" .
md:InferredSpan a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "推断补全的线段"@zh ; rdfs:comment "呈现层按制图惯例补出的结构线段，源文件中没有。"@zh .
md:OtherLine a owl:Class ; rdfs:subClassOf md:Line ; rdfs:label "未解释的图线"@zh .
md:Construction a owl:Class ; rdfs:label "构造点与原生容器"@zh ; rdfs:comment "定义点、原生尺寸和块的容器记录；没有自己的图面几何。"@zh .

# ---- 第二批细分的类（由表达种类、成员角色和所在视图赋予）
md:LinearDimensionLine a owl:Class ; rdfs:subClassOf md:DimensionLine ; rdfs:label "线性尺寸的尺寸线"@zh ; md:concept dc:DC-G4-059, dc:DC-G4-102 ; md:group "G4" .
md:RadiusDimensionLine a owl:Class ; rdfs:subClassOf md:DimensionLine ; rdfs:label "半径尺寸的尺寸线"@zh ; md:concept dc:DC-G4-006 ; md:group "G4" .
md:LinearDimensionText a owl:Class ; rdfs:subClassOf md:DimensionText ; rdfs:label "线性尺寸数字"@zh ; md:concept dc:DC-G4-102, dc:DC-G4-017 ; md:group "G4" .
md:GeometricToleranceValue a owl:Class ; rdfs:subClassOf md:ToleranceText ; rdfs:label "公差框格第二格的公差值"@zh ; md:concept dc:DC-G5-091, dc:DC-G5-090 ; md:group "G5" .
md:RoughnessValue a owl:Class ; rdfs:subClassOf md:ToleranceText ; rdfs:label "表面粗糙度参数值"@zh ; md:concept dc:DC-G6-073 ; md:group "G6" .
md:ScaleText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "比例文字"@zh ; md:concept dc:DC-G1-114, dc:DC-G1-115 ; md:group "G1" .
md:ViewTitle a owl:Class ; rdfs:subClassOf md:ViewLabel ; rdfs:label "视图名称（图形上方的字母、X—X 或 X 向）"@zh ; md:concept dc:DC-G2-065, dc:DC-G2-072 ; md:group "G2" .
md:DetailViewTitle a owl:Class ; rdfs:subClassOf md:ViewTitle ; rdfs:label "局部放大图的名称"@zh ; md:concept dc:DC-G2-075 ; md:group "G2" .
md:CalloutLetter a owl:Class ; rdfs:subClassOf md:ViewLabel ; rdfs:label "索引字母（剖切符号、投射箭头或放大部位圈旁的字母）"@zh ; md:concept dc:DC-G2-043, dc:DC-G2-072, dc:DC-G2-075 ; md:group "G2" .
md:DatumIdentifierLetter a owl:Class ; rdfs:subClassOf md:DatumLetter ; rdfs:label "基准符号方框内的字母"@zh ; md:concept dc:DC-G5-009 ; md:group "G5" .
md:SymbolText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "符号内的文字（特征符号字形等）"@zh ; md:group "G5" .

# ---- 注写
md:Text a owl:Class ; rdfs:label "注写文字"@zh ; rdfs:comment "文字框由插入点、高度、旋转和估算宽度给出。"@zh .
md:DimensionText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "尺寸数字（含前缀符号与公差）"@zh ; md:concept dc:DC-G4-017 ; md:group "G4" .
md:AngularDimensionText a owl:Class ; rdfs:subClassOf md:DimensionText ; rdfs:label "角度尺寸数字"@zh ; md:concept dc:DC-G4-032 ; md:group "G4" .
md:ToleranceText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "公差数值文字"@zh ; md:group "G4" .
md:NoteText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "技术要求与说明文字"@zh ; md:group "G9" .
md:TableText a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "标题栏与表格文字"@zh ; md:group "G9" .
md:ViewLabel a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "视图名称与字母"@zh ; md:group "G2" .
md:DatumLetter a owl:Class ; rdfs:subClassOf md:Text ; rdfs:label "基准字母"@zh ; md:group "G5" .

# ---- 数据属性：对象自身的事实
md:layer a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "事实层"@zh ; rdfs:comment "source 源图如画、recognition 识别结果、presentation 页面所画。"@zh .
md:sourceHandle a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "源句柄"@zh .
md:memberId a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "成员编号"@zh .
md:expressionId a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "表达编号"@zh .
md:expressionKind a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "表达种类"@zh .
md:view a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "所在视图"@zh .
md:lineType a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "线型（识别）"@zh .
md:text a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "文字内容（去除格式码）"@zh .
md:rotationDeg a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "文字方向，度，归一到 [0,180)"@zh .
md:angleDeg a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "图线或图案方向，度，归一到 [0,180)"@zh .
md:endOnOutline a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "端点落在轮廓线或轴线上（start/end）"@zh ;
    rdfs:comment "断裂处边界线的端点距可见轮廓线或轴线不超过 0.5 单位；回转体的局部剖可以轴线为界（GB/T 4458.6-2002 5.6）。"@zh .
md:heightUnits a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "文字高度（图形单位）"@zh .
md:spacingUnits a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "剖面线间距（图形单位）"@zh ;
    rdfs:comment "HATCH 的图案行偏移在垂直方向的分量，或散画剖面线相邻间距的中位数。"@zh .
md:dxfLayer a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "DXF 图层"@zh ; rdfs:comment "来源记录所在的图层；块内随块的构件取容器的图层。"@zh .
md:colourIndex a owl:DatatypeProperty ; rdfs:range xsd:integer ; rdfs:label "颜色索引（自身颜色，否则随层）"@zh .
md:layerColourIndex a owl:DatatypeProperty ; rdfs:range xsd:integer ; rdfs:label "所在图层的颜色索引"@zh .
md:overshootUnits a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "中心线一端超出图形边缘的长度"@zh ;
    rdfs:comment "同一表达内共线的中心线段按整条量：与可见轮廓线或断裂边界线（局部视图、局部放大图的边缘）的所有交点中，最外侧交点到该端的距离；两端各一个值，记在到达该端的那一段上；不与图形边缘相交时无值。"@zh .
md:extensionBeyondUnits a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "尺寸界线超出尺寸线的长度"@zh ;
    rdfs:comment "同一表达内共线的尺寸界线段按整条量：越过所遇最外侧尺寸线之后的长度；原生尺寸把越过部分画成单独一段时取该段长度；尺寸界线未到本尺寸的尺寸线时为负。"@zh .
md:angleToDimensionLineDeg a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "尺寸界线与本尺寸尺寸线的夹角，度，[0,90]"@zh .
md:extentUnits a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "尺寸的跨距：尺寸线与本尺寸两条尺寸界线最外两交点的距离"@zh ;
    rdfs:comment "同一尺寸的尺寸线分成几段时按整条量，每段都带同一值。"@zh .

# ---- 对象属性：由通用几何谓词计算的关系
md:crossedBy a owl:ObjectProperty ; rdfs:domain [ owl:unionOf ( md:Text md:Line ) ] ; rdfs:range md:Line ;
    rdfs:label "被图线穿过"@zh ;
    rdfs:comment "文字：一条图线穿过文字框内部，框内弦长不小于 0.3 倍字高。图线：另一条图线与它在两者内部相交，不在端点。"@zh .
md:coincidentWith a owl:ObjectProperty ; rdfs:domain md:Line ; rdfs:range md:Line ;
    rdfs:label "与图线重合"@zh ;
    rdfs:comment "两条直线段方向相同、距离不超过 0.15 单位且重叠长度不小于 1 单位；曲线与直线：曲线上一半以上采样点落在该直线段上且走向平行。"@zh .
md:radialTo a owl:ObjectProperty ; rdfs:domain md:DimensionLine ; rdfs:range md:Line ;
    rdfs:label "沿径向指向圆弧"@zh ;
    rdfs:comment "尺寸线（同一表达内共线各段合为一条）所在直线经过圆弧的圆心（0.3 单位内），且一端到圆弧不超过箭头长度（6 单位，箭头画在弧外时线止于箭头尾）；折线注法的水平段随与之相接的径向段。"@zh .
md:onExtensionOf a owl:ObjectProperty ; rdfs:domain md:Line ; rdfs:range md:Line ;
    rdfs:label "位于图线的延长线上"@zh ;
    rdfs:comment "两条直线段共线（方向差 1.5° 内、偏距 0.15 单位内）、互不重叠、沿线间隔不超过 10 单位。"@zh .
md:alignedWith a owl:ObjectProperty ; rdfs:domain md:Text ; rdfs:range md:Line ;
    rdfs:label "文字方向与图线同向"@zh ;
    rdfs:comment "同一表达内，文字方向与直线方向之差不超过 1.5°。"@zh .
md:sameLetterAs a owl:ObjectProperty ; rdfs:domain md:Text ; rdfs:range md:Text ;
    rdfs:label "字母相同"@zh ;
    rdfs:comment "视图名称与索引字母去掉方向词、连接号与比例后的首组大写字母（含罗马数字）相同；名称分写成几个文字时，同一表达内各名称文字共用其中的字母。"@zh .
md:scaledBy a owl:ObjectProperty ; rdfs:domain md:Text ; rdfs:range md:Text ;
    rdfs:label "同一表达中的比例文字"@zh .
md:hatchDirectionDiffersFrom a owl:ObjectProperty ; rdfs:domain md:SectionRegion ; rdfs:range md:SectionRegion ;
    rdfs:label "剖面线方向与另一剖面区域不同"@zh ; rdfs:comment "两个剖面区域的方向差超过 3°。"@zh .
md:hatchSpacingDiffersFrom a owl:ObjectProperty ; rdfs:domain md:SectionRegion ; rdfs:range md:SectionRegion ;
    rdfs:label "剖面线间距与另一剖面区域不同"@zh ; rdfs:comment "两个剖面区域的间距之比超过 1.3。"@zh .
md:chainedWith a owl:ObjectProperty ; rdfs:domain md:DimensionLine ; rdfs:range md:DimensionLine ;
    rdfs:label "与相邻尺寸的尺寸线成链"@zh ;
    rdfs:comment "两条不同尺寸的尺寸线共线，且有一条尺寸界线同时与两者相交。"@zh .
md:terminatorOnCarrier a owl:ObjectProperty ; rdfs:domain md:Line ; rdfs:range md:Line ;
    rdfs:label "终端连接尺寸承载线"@zh ;
    rdfs:comment "源三角终端尖端或底边与本尺寸有限直线相接且共轴；承载对象是本尺寸的尺寸线或半径尺寸的指引线，由关系生成时核对承载身份。角度终端在本尺寸弧端且沿切向；半径内接终端另核同视图的有限轮廓或中心线圆弧，尺寸线、引线和剖面线不作支撑。要求同一已知视图、尺寸数值语境及唯一尺寸候选；不改变未知成员的身份。参数见constituents.parameters。"@zh .
md:boundedContinuationOf a owl:ObjectProperty ; rdfs:domain md:Line ; rdfs:range md:Line ;
    rdfs:label "尺寸线的有界接续"@zh ;
    rdfs:comment "源LINE剩余区间与同一尺寸的尺寸线或半径尺寸指引线共轴，并在自身终端尖端至底边的足迹内连接，或从本终端接至外置数值的有限承载段；止于另一终端或分支。承载身份由关系生成时核对；已归属的同源区间不重复报出；视图不足和多尺寸竞争保留未知。参数见constituents.parameters。"@zh .

# ---- 第三批：同一条线在一个剖面区域中的使用，不继承 Line，不重复激活旧图线规则。
md:SectionBoundarySpan a owl:Class ; rdfs:label "剖面外缘上由中心线承载的区间候选"@zh ; md:concept dc:DC-G2-028, dc:DC-G2-034 .
md:SectionInteriorUse a owl:Class ; rdfs:label "图线在一个切面实体内部的使用"@zh ; md:concept dc:DC-G2-018, dc:DC-G2-034 .
md:sectionRegion a owl:ObjectProperty ; rdfs:range md:SectionRegion ; rdfs:label "使用所属剖面区域"@zh .
md:sourceLine a owl:ObjectProperty ; rdfs:range md:Line ; rdfs:label "使用所依附的本层源线对象"@zh .
md:boundaryCarrier a owl:ObjectProperty ; rdfs:domain md:SectionBoundarySpan ; rdfs:range md:Line ; rdfs:label "完整覆盖此边界区间的承载线"@zh .
md:sectionOrigin a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "分区来源：pre_existing、cut_formed、suppressed、unknown"@zh .
md:boundaryIntervalStart a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "边界源参数起点，不舍入"@zh .
md:boundaryIntervalEnd a owl:DatatypeProperty ; rdfs:range xsd:double ; rdfs:label "边界源参数终点，不舍入"@zh .
md:boundaryParameter a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "参数域：source_line、source_arc、polyline_length"@zh .
md:crossSectionType a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "断面配置：superimposed、removed、unknown"@zh .
md:sectionExtent a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "范围：half、local、local_axis、cross_section、unknown"@zh ; rdfs:comment "local_axis 仅用于已知局部剖且原生外缘确实沿轴线的边界使用。未知不等于不适用。"@zh .
md:parentOutlineContinuation a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "该线连续伸至区域两侧：true、false；单独不证明母视图身份"@zh .
md:sectionGeometry a owl:DatatypeProperty ; rdfs:range xsd:string ; rdfs:label "原生边界可核程度：complete、partial、unavailable"@zh ; rdfs:comment "直边、圆弧和带凸度闭合路径；实体包含按偶奇规则保留孔洞。部分边界只支持实际可读边上的重合，不支持内部判定。"@zh .
md:CuttingLetterSite a owl:Class ; rdfs:label "已有明确命名剖切路径的端点或转折标记位置"@zh .
md:cutLetterCount a owl:DatatypeProperty ; rdfs:label "该位置附近同名剖切字母数"@zh .
'''

[shapes]
format = "text/turtle"
text = '''
@prefix md:   <urn:oev2:drafting:> .
@prefix dc:   <urn:oev2:drafting:concept:> .
@prefix rule: <urn:oev2:drafting:rule:> .
@prefix sh:   <http://www.w3.org/ns/shacl#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .

# ================= G1 图线 =================

rule:G1-032-wavy-ends-on-outline a sh:NodeShape ;
    sh:targetClass md:WavyBreakBoundary ;
    md:ruleId "G1-032-wavy-ends-on-outline" ; md:group "G1" ;
    md:concept dc:DC-G1-032, dc:DC-G1-029 ;
    md:clause "GB/T 4457.4-2002 表1 01.1.21；GB/T 17450-1998 表2" ;
    rdfs:label "波浪线应画到轮廓线为止（回转体的局部剖可以轴线为界）"@zh ;
    sh:property rule:G1-032-wavy-ends-on-outline-p1 .

rule:G1-032-wavy-ends-on-outline-p1 a sh:PropertyShape ;
    sh:path md:endOnOutline ; sh:minCount 2 ;
    sh:message "波浪线的两端应止于轮廓线，这条波浪线至少有一端没有落在轮廓线上"@zh .

rule:G1-032-wavy-not-crossed-by-outline a sh:NodeShape ;
    sh:targetClass md:WavyBreakBoundary ;
    md:ruleId "G1-032-wavy-not-crossed-by-outline" ; md:group "G1" ;
    md:concept dc:DC-G1-032, dc:DC-G2-023 ;
    md:clause "GB/T 4457.4-2002 表1 01.1.21；GB/T 4458.6-2002 5.6" ;
    rdfs:label "波浪线不得超出轮廓、不得与轮廓线相穿"@zh ;
    sh:property rule:G1-032-wavy-not-crossed-by-outline-p1 .

rule:G1-032-wavy-not-crossed-by-outline-p1 a sh:PropertyShape ;
    sh:path md:crossedBy ;
    sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ;
    sh:message "一条可见轮廓线从波浪线中间穿过：波浪线超出了轮廓，或轮廓线画进了剖开的范围"@zh .

rule:G1-055-centre-line-not-coincident-with-outline a sh:NodeShape ;
    sh:targetClass md:CentreLine ;
    md:ruleId "G1-055-centre-line-not-coincident-with-outline" ; md:group "G1" ;
    md:concept dc:DC-G1-055 ;
    md:clause "GB/T 14665-2012 4.3" ;
    rdfs:label "中心线与可见轮廓线重合时只画轮廓线"@zh ;
    sh:property rule:G1-055-centre-line-not-coincident-with-outline-p1 .

rule:G1-055-centre-line-not-coincident-with-outline-p1 a sh:PropertyShape ;
    sh:path md:coincidentWith ;
    sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ;
    sh:message "细点画线与可见轮廓线重合，按优先顺序这里只应画可见轮廓线"@zh .

rule:G1-055-hidden-line-not-coincident-with-outline a sh:NodeShape ;
    sh:targetClass md:HiddenOutline ;
    md:ruleId "G1-055-hidden-line-not-coincident-with-outline" ; md:group "G1" ;
    md:concept dc:DC-G1-055, dc:DC-G1-045 ;
    md:clause "GB/T 14665-2012 4.3" ;
    rdfs:label "虚线与可见轮廓线重合时只画轮廓线"@zh ;
    sh:property rule:G1-055-hidden-line-not-coincident-with-outline-p1 .

rule:G1-055-hidden-line-not-coincident-with-outline-p1 a sh:PropertyShape ;
    sh:path md:coincidentWith ;
    sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ;
    sh:message "细虚线与可见轮廓线重合，按优先顺序这里只应画可见轮廓线"@zh .

rule:G1-028-leader-not-crossing-text-or-leader a sh:NodeShape ;
    sh:targetClass md:LeaderLine ;
    md:ruleId "G1-028-leader-not-crossing-text-or-leader" ; md:group "G1" ;
    md:concept dc:DC-G1-028 ;
    md:clause "GB/T 4457.2-2003 3.1、4" ;
    rdfs:label "指引线不得穿过尺寸数字和其他指引线"@zh ;
    sh:property rule:G1-028-leader-not-crossing-text-or-leader-p1 ;
    sh:property rule:G1-028-leader-not-crossing-text-or-leader-p2 .

# ================= G2 视图与剖视 =================

rule:G1-028-leader-not-crossing-text-or-leader-p1 a sh:PropertyShape ;
    sh:path [ sh:inversePath md:crossedBy ] ;
    sh:qualifiedValueShape [ sh:class md:Text ] ; sh:qualifiedMaxCount 0 ;
    sh:message "指引线穿过了注写文字"@zh .
rule:G1-028-leader-not-crossing-text-or-leader-p2 a sh:PropertyShape ;
    sh:path md:crossedBy ;
    sh:qualifiedValueShape [ sh:class md:LeaderLine ] ; sh:qualifiedMaxCount 0 ;
    sh:message "指引线与另一条指引线相穿"@zh .

rule:G2-023-section-boundary-not-coincident a sh:NodeShape ;
    sh:targetClass md:BreakBoundary ;
    md:ruleId "G2-023-section-boundary-not-coincident" ; md:group "G2" ;
    md:concept dc:DC-G2-023, dc:DC-G1-032 ;
    md:clause "GB/T 4458.6-2002 5.6；GB/T 17452-1998 6.3" ;
    rdfs:label "局部剖视的分界线不应与其他图线重合"@zh ;
    sh:property rule:G2-023-section-boundary-not-coincident-p1 .

rule:G2-023-section-boundary-not-coincident-p1 a sh:PropertyShape ;
    sh:path md:coincidentWith ; sh:maxCount 0 ;
    sh:message "断裂处边界线与另一条图线重合"@zh .

rule:G2-019-hatch-angle-45 a sh:NodeShape ;
    sh:targetClass md:HatchLine, md:SectionRegion ;
    md:ruleId "G2-019-hatch-angle-45" ; md:group "G2" ;
    md:concept dc:DC-G2-019, dc:DC-G1-010 ;
    md:clause "GB/T 4457.4-2002 表1 01.1.5；GB/T 18229-2000 4.5" ;
    rdfs:label "剖面线与水平成 45°"@zh ;
    sh:property rule:G2-019-hatch-angle-45-p1 .

rule:G2-019-hatch-angle-45-p1 a sh:PropertyShape ;
    sh:path md:angleDeg ; sh:minCount 1 ;
    sh:or ( [ sh:minInclusive 40.0 ; sh:maxInclusive 50.0 ] [ sh:minInclusive 130.0 ; sh:maxInclusive 140.0 ] ) ;
    sh:message "剖面线方向不是 45°（允许 ±5°）"@zh .

rule:G2-019-section-hatch-crosses-outline a sh:NodeShape ;
    sh:targetClass md:HatchLine, md:SectionRegion ;
    md:ruleId "G2-019-section-hatch-crosses-outline" ; md:group "G2" ;
    md:concept dc:DC-G2-019, dc:DC-G2-028 ;
    md:clause "GB/T 17453-2005 第5章；GB/T 4457.5-2013 4.1、4.3、4.4" ;
    md:confidence "likely" ;
    md:proposedCorrection "将越过剖面边界的剖面线截回区域轮廓内，使剖面线与轮廓相接或保持在剖面区域内；保留原图并复核倒角、键槽和槽口的边界。"@zh ;
    rdfs:label "剖面线越出其边界轮廓"@zh ;
    sh:property rule:G2-019-section-hatch-crosses-outline-p1 .

rule:G2-019-section-hatch-crosses-outline-p1 a sh:PropertyShape ;
    sh:path md:crossedBy ;
    sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ;
    sh:message "剖面线穿过边界轮廓并越出剖面区域；请按 GB/T 17453-2005 第5章、GB/T 4457.5-2013 4.1条复核边界和剖面线。"@zh .

rule:G2-001-hatch-broken-at-text a sh:NodeShape ;
    sh:targetClass md:Text ;
    md:ruleId "G2-001-hatch-broken-at-text" ; md:group "G2" ;
    md:concept dc:DC-G2-001, dc:DC-G1-010 ;
    md:clause "GB/T 17453-1998 4.6 图6" ;
    rdfs:label "剖面区域内注写处剖面线断开"@zh ;
    sh:property rule:G2-001-hatch-broken-at-text-p1 .

# ================= G4 尺寸 =================

rule:G2-001-hatch-broken-at-text-p1 a sh:PropertyShape ;
    sh:path md:crossedBy ;
    sh:qualifiedValueShape [ sh:class md:HatchLine ] ; sh:qualifiedMaxCount 0 ;
    sh:message "剖面线穿过了注写文字，注写处的剖面线应断开留白"@zh .

rule:G4-001-dimension-text-not-crossed a sh:NodeShape ;
    sh:targetClass md:DimensionText ;
    md:ruleId "G4-001-dimension-text-not-crossed" ; md:group "G4" ;
    md:concept dc:DC-G4-001, dc:DC-G4-017, dc:DC-G4-101 ;
    md:clause "GB/T 4458.4-2003 4.3.4、图24" ;
    rdfs:label "尺寸数字不得被任何图线穿过"@zh ;
    sh:property rule:G4-001-dimension-text-not-crossed-p1 .

rule:G4-001-dimension-text-not-crossed-p1 a sh:PropertyShape ;
    sh:path md:crossedBy ; sh:maxCount 0 ;
    sh:message "图线穿过尺寸数字；中心线、剖面线或轮廓线经过数字时应在数字处断开"@zh .

rule:G4-032-angle-unit-written a sh:NodeShape ;
    sh:targetClass md:AngularDimensionText ;
    md:ruleId "G4-032-angle-unit-written" ; md:group "G4" ;
    md:concept dc:DC-G4-032 ;
    md:clause "GB/T 4458.4-2003 4.1.5、4.2.4" ;
    rdfs:label "角度数字须注写单位"@zh ;
    sh:property rule:G4-032-angle-unit-written-p1 .

rule:G4-032-angle-unit-written-p1 a sh:PropertyShape ;
    sh:path md:text ; sh:minCount 1 ; sh:pattern "[°′″]" ;
    sh:message "角度尺寸的数字没有单位（°、′、″）"@zh .

rule:G4-032-angle-text-horizontal a sh:NodeShape ;
    sh:targetClass md:AngularDimensionText ;
    md:ruleId "G4-032-angle-text-horizontal" ; md:group "G4" ;
    md:concept dc:DC-G4-032, dc:DC-G4-102 ;
    md:clause "GB/T 4458.4-2003 4.3.2、图21" ;
    rdfs:label "角度数字一律水平书写"@zh ;
    sh:property rule:G4-032-angle-text-horizontal-p1 .

rule:G4-032-angle-text-horizontal-p1 a sh:PropertyShape ;
    sh:path md:rotationDeg ; sh:minCount 1 ;
    sh:or ( [ sh:maxInclusive 1.0 ] [ sh:minInclusive 179.0 ] ) ;
    sh:message "角度尺寸的数字不是水平书写"@zh .

rule:G4-059-dimension-line-thin-continuous a sh:NodeShape ;
    sh:targetClass md:DimensionLine ;
    md:ruleId "G4-059-dimension-line-thin-continuous" ; md:group "G4" ;
    md:concept dc:DC-G4-059 ;
    md:clause "GB/T 4457.4-2002 表1 01.1.2；GB/T 4458.4-2003 4.2.1" ;
    rdfs:label "尺寸线用细实线"@zh ;
    sh:property rule:G4-059-dimension-line-thin-continuous-p1 .

rule:G4-059-dimension-line-thin-continuous-p1 a sh:PropertyShape ;
    sh:path md:lineType ; sh:minCount 1 ; sh:in ( "thin_continuous" "dimension" "continuous" ) ;
    sh:message "尺寸线不是细实线"@zh .

rule:G4-058-extension-line-thin-continuous a sh:NodeShape ;
    sh:targetClass md:ExtensionLine ;
    md:ruleId "G4-058-extension-line-thin-continuous" ; md:group "G4" ;
    md:concept dc:DC-G4-058 ;
    md:clause "GB/T 4457.4-2002 表1 01.1.3；GB/T 4458.4-2003 4.1.1" ;
    rdfs:label "尺寸界线用细实线；也可直接利用轮廓线、轴线或对称中心线作尺寸界线"@zh ;
    sh:message "尺寸界线不是细实线，也不是借用的轮廓线或轴线"@zh ;
    sh:or ( [ sh:class md:VisibleOutline ] [ sh:class md:CentreLine ] [ sh:property rule:G4-058-extension-line-thin-continuous-p1 ] ) .

rule:G4-058-extension-line-thin-continuous-p1 a sh:PropertyShape ;
    sh:path md:lineType ; sh:minCount 1 ; sh:in ( "thin_continuous" "dimension" "continuous" ) ;
    sh:message "尺寸界线不是细实线"@zh .

rule:G4-059-dimension-line-not-coincident a sh:NodeShape ;
    sh:targetClass md:DimensionLine ;
    sh:severity sh:Warning ;
    md:ruleId "G4-059-dimension-line-not-coincident" ; md:group "G4" ;
    md:concept dc:DC-G4-059, dc:DC-G4-016 ;
    md:clause "GB/T 4458.4-2003 4.2.2；GB/T 4458.4-2003 4.2.5 图15（小尺寸）" ;
    rdfs:label "尺寸线一般不与其他图线重合；相邻小尺寸箭头外置时，尺寸线越过尺寸界线而与相邻尺寸线相叠是规定允许的"@zh ;
    sh:message "尺寸线与另一条图线重合（箭头外置的相邻小尺寸成链的除外）"@zh ;
    sh:or ( [ sh:property rule:G4-059-dimension-line-not-coincident-p1 ]
            [ sh:property rule:G4-059-dimension-line-not-coincident-p2 ; sh:property rule:G4-059-dimension-line-not-coincident-p3 ;
              sh:or ( [ sh:property rule:G4-059-dimension-line-not-coincident-p4 ] [ sh:property rule:G4-059-dimension-line-not-coincident-p5 ] ) ] ) .
rule:G4-059-dimension-line-not-coincident-p1 a sh:PropertyShape ;
    sh:path md:coincidentWith ; sh:maxCount 0 ;
    sh:message "尺寸线与另一条图线重合"@zh .
# 例外的知识（DC-G4-016）：只与尺寸线重合；与之成链（共线且有一条尺寸界线同时穿过两者）；且本尺寸或成链的相邻尺寸是
# 小尺寸——尺寸界线间放不下两个箭头和数字，按跨距不超过 12 单位核（箭头约 3 单位，两位数字约 6 单位）。
rule:G4-059-dimension-line-not-coincident-p2 a sh:PropertyShape ;
    sh:path md:coincidentWith ; sh:class md:DimensionLine ;
    sh:message "尺寸线与非尺寸线的图线重合"@zh .
rule:G4-059-dimension-line-not-coincident-p3 a sh:PropertyShape ;
    sh:path md:chainedWith ; sh:minCount 1 ;
    sh:message "重合的尺寸线不是相邻的链式尺寸"@zh .
rule:G4-059-dimension-line-not-coincident-p4 a sh:PropertyShape ;
    sh:path md:extentUnits ; sh:minCount 1 ; sh:maxInclusive 12.0 ;
    sh:message "本尺寸不是小尺寸"@zh .
rule:G4-059-dimension-line-not-coincident-p5 a sh:PropertyShape ;
    sh:path md:chainedWith ; sh:qualifiedValueShape [ sh:property rule:G4-059-dimension-line-not-coincident-p6 ] ; sh:qualifiedMinCount 1 ;
    sh:message "成链的相邻尺寸也不是小尺寸"@zh .
rule:G4-059-dimension-line-not-coincident-p6 a sh:PropertyShape ;
    sh:path md:extentUnits ; sh:minCount 1 ; sh:maxInclusive 12.0 .

# ================= 第二批 =================

# ---- G1 图线
rule:G1-021-centre-line-beyond-outline a sh:NodeShape ;
    sh:targetClass md:CentreLine ;
    sh:severity sh:Warning ;
    md:ruleId "G1-021-centre-line-beyond-outline" ; md:group "G1" ;
    md:concept dc:DC-G1-021, dc:DC-G1-033, dc:DC-G1-044 ;
    md:clause "GB/T 4457.4-2002 表1 04.1.2；机械制图（第7版）§1-1 图线画法" ;
    rdfs:label "中心线两端超出轮廓约 2~5 mm"@zh ;
    sh:property rule:G1-021-centre-line-beyond-outline-p1 .
rule:G1-021-centre-line-beyond-outline-p1 a sh:PropertyShape ;
    sh:path md:overshootUnits ; sh:minInclusive 1.0 ; sh:maxInclusive 8.0 ;
    sh:message "中心线一端超出所遇轮廓线的长度不在 2~5 mm 左右（按 1~8 单位核）"@zh .

rule:G1-114-scale-in-standard-series a sh:NodeShape ;
    sh:targetClass md:ScaleText, md:TableText ;
    md:ruleId "G1-114-scale-in-standard-series" ; md:group "G1" ;
    md:concept dc:DC-G1-114, dc:DC-G1-115 ;
    md:clause "GB/T 14690-1993 4.1 表1、4.2 表2；GB/T 18229-2000 4.2" ;
    rdfs:label "比例取自标准的优先系列或允许系列"@zh ;
    sh:message "比例文字不在 GB/T 14690 的优先或允许系列中"@zh ;
    sh:or ( [ sh:property rule:G1-114-scale-in-standard-series-p1 ] [ sh:property rule:G1-114-scale-in-standard-series-p2 ] ) .
# p1：不是比例写法的文字不受约束；p2：是比例写法的文字须在系列中。
rule:G1-114-scale-in-standard-series-p1 a sh:PropertyShape ;
    sh:path md:text ; sh:not [ sh:pattern "^\\s*\\d+(\\.\\d+)?\\s*[:：]\\s*\\d+(\\.\\d+)?\\s*$" ] ;
    sh:message "文字是比例写法"@zh .
rule:G1-114-scale-in-standard-series-p2 a sh:PropertyShape ;
    sh:path md:text ;
    sh:pattern "^\\s*(1[:：]1|2[:：]1|5[:：]1|10[:：]1|20[:：]1|50[:：]1|100[:：]1|4[:：]1|2\\.5[:：]1|25[:：]1|40[:：]1|1[:：]2|1[:：]5|1[:：]10|1[:：]20|1[:：]50|1[:：]100|1[:：]200|1[:：]500|1[:：]1000|1[:：]2000|1[:：]5000|1[:：]10000|1[:：]1\\.5|1[:：]2\\.5|1[:：]3|1[:：]4|1[:：]6|1[:：]15|1[:：]25|1[:：]30|1[:：]40|1[:：]60|1[:：]150|1[:：]250|1[:：]300|1[:：]400|1[:：]600)\\s*$" ;
    sh:message "比例不在系列中（优先 1:1、2:1、5:1、10:1…、1:2、1:5、1:10…；允许 4:1、2.5:1、1:1.5、1:2.5、1:3、1:4、1:6 及其十进倍数）"@zh .

# ---- G2 视图与剖视
rule:G2-009-hatch-direction-consistent a sh:NodeShape ;
    sh:targetClass md:SectionRegion ;
    md:ruleId "G2-009-hatch-direction-consistent" ; md:group "G2" ;
    md:concept dc:DC-G1-010, dc:DC-G2-009 ;
    md:clause "GB/T 4457.5-2013 4.7；GB/T 17453-2005 5" ;
    rdfs:label "同一零件在各剖视、断面中剖面线方向一致"@zh ;
    sh:property rule:G2-009-hatch-direction-consistent-p1 .
rule:G2-009-hatch-direction-consistent-p1 a sh:PropertyShape ;
    sh:path md:hatchDirectionDiffersFrom ; sh:maxCount 0 ;
    sh:message "这个剖面区域的剖面线方向与同一张零件图上另一剖面区域不同"@zh .

rule:G2-009-hatch-spacing-consistent a sh:NodeShape ;
    sh:targetClass md:SectionRegion ;
    sh:severity sh:Warning ;
    md:ruleId "G2-009-hatch-spacing-consistent" ; md:group "G2" ;
    md:concept dc:DC-G1-010, dc:DC-G2-009, dc:DC-G2-019 ;
    md:clause "GB/T 4457.5-2013 4.7；GB/T 18229-2000 4.5" ;
    rdfs:label "同一零件在各剖视、断面中剖面线间距一致"@zh ;
    sh:property rule:G2-009-hatch-spacing-consistent-p1 .
rule:G2-009-hatch-spacing-consistent-p1 a sh:PropertyShape ;
    sh:path md:hatchSpacingDiffersFrom ; sh:maxCount 0 ;
    sh:message "这个剖面区域的剖面线间距与同一张零件图上另一剖面区域不同（之比超过 1.3）"@zh .

rule:G2-065-view-title-has-callout-letter a sh:NodeShape ;
    sh:targetClass md:ViewTitle ;
    md:ruleId "G2-065-view-title-has-callout-letter" ; md:group "G2" ;
    md:concept dc:DC-G2-065, dc:DC-G2-072, dc:DC-G2-075 ;
    md:clause "GB/T 4458.6-2002 6.1；GB/T 14692-2008 5.2.1.5；GB/T 4458.1-2002 5.7.2" ;
    rdfs:label "视图名称的字母与剖切符号、投射箭头或放大部位圈旁的字母对应"@zh ;
    sh:property rule:G2-065-view-title-has-callout-letter-p1 .
rule:G2-065-view-title-has-callout-letter-p1 a sh:PropertyShape ;
    sh:path md:sameLetterAs ; sh:qualifiedValueShape [ sh:class md:CalloutLetter ] ; sh:qualifiedMinCount 1 ;
    sh:message "图上没有与这个视图名称同字母的索引字母（剖切符号、投射箭头或放大部位圈旁）"@zh .

rule:G2-043-callout-letter-has-view-title a sh:NodeShape ;
    sh:targetClass md:CalloutLetter ;
    md:ruleId "G2-043-callout-letter-has-view-title" ; md:group "G2" ;
    md:concept dc:DC-G2-043, dc:DC-G2-072, dc:DC-G2-075 ;
    md:clause "GB/T 17452-1998 8.2；GB/T 4458.6-2002 6.1；GB/T 4458.1-2002 5.7.2" ;
    rdfs:label "剖切符号、投射箭头或放大部位圈旁的字母有同字母的视图名称"@zh ;
    sh:property rule:G2-043-callout-letter-has-view-title-p1 .
rule:G2-043-callout-letter-has-view-title-p1 a sh:PropertyShape ;
    sh:path md:sameLetterAs ; sh:qualifiedValueShape [ sh:class md:ViewTitle ] ; sh:qualifiedMinCount 1 ;
    sh:message "图上没有与这个索引字母同字母的视图名称"@zh .

rule:G2-075-detail-view-title-has-scale a sh:NodeShape ;
    sh:targetClass md:DetailViewTitle ;
    md:ruleId "G2-075-detail-view-title-has-scale" ; md:group "G2" ;
    md:concept dc:DC-G2-075, dc:DC-G1-115 ;
    md:clause "GB/T 4458.1-2002 5.7.2；GB/T 14690-1993 5.2" ;
    rdfs:label "局部放大图的名称处注出比例"@zh ;
    sh:message "局部放大图的名称旁没有比例"@zh ;
    sh:or ( [ sh:property rule:G2-075-detail-view-title-has-scale-p1 ] [ sh:property rule:G2-075-detail-view-title-has-scale-p2 ] ) .
rule:G2-075-detail-view-title-has-scale-p1 a sh:PropertyShape ;
    sh:path md:scaledBy ; sh:minCount 1 ;
    sh:message "局部放大图名称所在的表达里没有比例文字"@zh .
rule:G2-075-detail-view-title-has-scale-p2 a sh:PropertyShape ;
    sh:path md:text ; sh:pattern "\\d\\s*[:：]\\s*\\d" ;
    sh:message "名称文字本身不含比例"@zh .

# ---- G4 尺寸
# 两条尺寸界线规定只对线性与直径尺寸自己画的尺寸界线：借用的轮廓线或轴线没有"超出"（GB/T 4458.4-2003 4.1.1），
# 角度尺寸的尺寸界线是径向线、尺寸线是圆弧（4.2.4），都不受这两条约束。
rule:G4-058-extension-line-beyond-dimension-line a sh:NodeShape ;
    sh:targetClass md:ExtensionLine ;
    sh:severity sh:Warning ;
    md:ruleId "G4-058-extension-line-beyond-dimension-line" ; md:group "G4" ;
    md:concept dc:DC-G4-058 ;
    md:clause "GB/T 4458.4-2003 4.1.1 图1" ;
    rdfs:label "尺寸界线超出尺寸线终端约 2 mm（借用的轮廓线、轴线与角度尺寸除外）"@zh ;
    sh:message "尺寸界线超出尺寸线的长度不在约 2 mm（按 0.8~5 单位核）；为负表示尺寸界线没有画到尺寸线"@zh ;
    sh:or ( [ sh:class md:VisibleOutline ] [ sh:class md:CentreLine ]
            [ sh:property rule:G4-058-extension-line-beyond-dimension-line-p0 ]
            [ sh:property rule:G4-058-extension-line-beyond-dimension-line-p1 ] ) .
rule:G4-058-extension-line-beyond-dimension-line-p0 a sh:PropertyShape ;
    sh:path md:expressionKind ; sh:not [ sh:in ( "dimension_linear" "dimension_diameter" ) ] ;
    sh:message "线性或直径尺寸的尺寸界线"@zh .
rule:G4-058-extension-line-beyond-dimension-line-p1 a sh:PropertyShape ;
    sh:path md:extensionBeyondUnits ; sh:minInclusive 0.8 ; sh:maxInclusive 5.0 ;
    sh:message "尺寸界线超出尺寸线的长度不在约 2 mm（按 0.8~5 单位核）；为负表示尺寸界线没有画到尺寸线"@zh .

rule:G4-058-extension-line-perpendicular a sh:NodeShape ;
    sh:targetClass md:ExtensionLine ;
    sh:severity sh:Warning ;
    md:ruleId "G4-058-extension-line-perpendicular" ; md:group "G4" ;
    md:concept dc:DC-G4-058 ;
    md:clause "GB/T 4458.4-2003 4.1.1、4.1.3 图4" ;
    rdfs:label "尺寸界线一般与尺寸线垂直；贴近轮廓不清晰时允许倾斜，但成对平行（借用的轮廓线、轴线与角度尺寸除外）"@zh ;
    sh:message "尺寸界线与尺寸线不垂直（夹角小于 88°）"@zh ;
    sh:or ( [ sh:class md:VisibleOutline ] [ sh:class md:CentreLine ]
            [ sh:property rule:G4-058-extension-line-perpendicular-p0 ]
            [ sh:property rule:G4-058-extension-line-perpendicular-p1 ] ) .
rule:G4-058-extension-line-perpendicular-p0 a sh:PropertyShape ;
    sh:path md:expressionKind ; sh:not [ sh:in ( "dimension_linear" "dimension_diameter" ) ] ;
    sh:message "线性或直径尺寸的尺寸界线"@zh .
rule:G4-058-extension-line-perpendicular-p1 a sh:PropertyShape ;
    sh:path md:angleToDimensionLineDeg ; sh:minInclusive 88.0 ;
    sh:message "尺寸界线与尺寸线不垂直（夹角小于 88°）"@zh .

rule:G4-006-radius-dimension-line-through-centre a sh:NodeShape ;
    sh:targetClass md:RadiusDimensionLine ;
    md:ruleId "G4-006-radius-dimension-line-through-centre" ; md:group "G4" ;
    md:concept dc:DC-G4-006, dc:DC-G4-059 ;
    md:clause "GB/T 4458.4-2003 4.2.3 图12" ;
    rdfs:label "半径的尺寸线沿径向自圆心引出或其延长线通过圆心，箭头端落在圆弧上"@zh ;
    sh:property rule:G4-006-radius-dimension-line-through-centre-p1 .
rule:G4-006-radius-dimension-line-through-centre-p1 a sh:PropertyShape ;
    sh:path md:radialTo ; sh:minCount 1 ;
    sh:message "半径尺寸线所在直线不经过任何一段圆弧的圆心，或不止于该圆弧"@zh .

rule:G4-059-dimension-line-not-on-outline-extension a sh:NodeShape ;
    sh:targetClass md:DimensionLine ;
    sh:severity sh:Warning ;
    md:ruleId "G4-059-dimension-line-not-on-outline-extension" ; md:group "G4" ;
    md:concept dc:DC-G4-059 ;
    md:clause "GB/T 4458.4-2003 4.2.2" ;
    rdfs:label "尺寸线不画在轮廓线的延长线上"@zh ;
    sh:property rule:G4-059-dimension-line-not-on-outline-extension-p1 .
rule:G4-059-dimension-line-not-on-outline-extension-p1 a sh:PropertyShape ;
    sh:path md:onExtensionOf ; sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ;
    sh:message "尺寸线画在了可见轮廓线的延长线上"@zh .

rule:G4-102-linear-dimension-text-along-dimension-line a sh:NodeShape ;
    sh:targetClass md:LinearDimensionText ;
    sh:severity sh:Warning ;
    md:ruleId "G4-102-linear-dimension-text-along-dimension-line" ; md:group "G4" ;
    md:concept dc:DC-G4-102, dc:DC-G4-017 ;
    md:clause "GB/T 4458.4-2003 4.3.2 图18" ;
    rdfs:label "线性尺寸数字（方法1）随尺寸线方向书写"@zh ;
    sh:property rule:G4-102-linear-dimension-text-along-dimension-line-p1 .
rule:G4-102-linear-dimension-text-along-dimension-line-p1 a sh:PropertyShape ;
    sh:path md:alignedWith ; sh:qualifiedValueShape [ sh:class md:DimensionLine ] ; sh:qualifiedMinCount 1 ;
    sh:message "线性尺寸数字的方向与它的尺寸线不同（方法1 要求平行；方法2 的水平数字应写在尺寸线中断处）"@zh .

rule:G4-102-avoid-30-degree-zone a sh:NodeShape ;
    sh:targetClass md:LinearDimensionLine ;
    sh:severity sh:Info ;
    md:ruleId "G4-102-avoid-30-degree-zone" ; md:group "G4" ;
    md:concept dc:DC-G4-102, dc:DC-G4-017 ;
    md:clause "GB/T 4458.4-2003 4.3.2 图19" ;
    rdfs:label "尽量避免在竖直线左侧 30° 范围内注写线性尺寸"@zh ;
    sh:property rule:G4-102-avoid-30-degree-zone-p1 .
rule:G4-102-avoid-30-degree-zone-p1 a sh:PropertyShape ;
    sh:path md:angleDeg ; sh:or ( [ sh:maxInclusive 90.0 ] [ sh:minInclusive 120.0 ] ) ;
    sh:message "线性尺寸的尺寸线方向落在竖直线左侧 30° 区内（90°~120°）"@zh .

# ---- G5 几何公差
rule:G5-091-cylindrical-zone-for-axis-characteristics a sh:NodeShape ;
    sh:targetClass md:GeometricToleranceValue ;
    md:ruleId "G5-091-cylindrical-zone-for-axis-characteristics" ; md:group "G5" ;
    md:concept dc:DC-G5-091, dc:DC-G5-090 ;
    md:clause "GB/T 1182-2018 8.2.2 图13；GB/T 1182-2018 表2" ;
    rdfs:label "公差值前的 Ø 表示圆柱形公差带，只用于轴线类特征（位置度、同轴度、垂直度、平行度、倾斜度、直线度）"@zh ;
    sh:message "公差值前写了 Ø，但这个特征的公差带不是圆柱形"@zh ;
    sh:or ( [ sh:property rule:G5-091-cylindrical-zone-for-axis-characteristics-p1 ] [ sh:property rule:G5-091-cylindrical-zone-for-axis-characteristics-p2 ] ) .
rule:G5-091-cylindrical-zone-for-axis-characteristics-p1 a sh:PropertyShape ;
    sh:path md:text ; sh:not [ sh:pattern "^\\s*[ØΦφ⌀]" ] ;
    sh:message "公差值前写了 Ø"@zh .
rule:G5-091-cylindrical-zone-for-axis-characteristics-p2 a sh:PropertyShape ;
    sh:path md:expressionKind ; sh:in ( "gps_position" "gps_coaxiality" "gps_perpendicularity" "gps_parallelism" "gps_angularity" "gps_straightness" ) ;
    sh:message "这个特征的公差带不是圆柱形（不是位置度、同轴度、垂直度、平行度、倾斜度或直线度）"@zh .

rule:G5-009-datum-letter-horizontal a sh:NodeShape ;
    sh:targetClass md:DatumIdentifierLetter ;
    md:ruleId "G5-009-datum-letter-horizontal" ; md:group "G5" ;
    md:concept dc:DC-G5-009 ;
    md:clause "GB/T 17851-2022 7.2.1 图5" ;
    rdfs:label "基准符号方框内的字母无论符号朝向如何都水平书写"@zh ;
    sh:property rule:G5-009-datum-letter-horizontal-p1 .
rule:G5-009-datum-letter-horizontal-p1 a sh:PropertyShape ;
    sh:path md:rotationDeg ; sh:minCount 1 ;
    sh:or ( [ sh:maxInclusive 1.0 ] [ sh:minInclusive 179.0 ] ) ;
    sh:message "基准字母不是水平书写"@zh .

# ---- G6 表面结构
rule:G6-073-roughness-value-in-series a sh:NodeShape ;
    sh:targetClass md:RoughnessValue ;
    sh:severity sh:Warning ;
    md:ruleId "G6-073-roughness-value-in-series" ; md:group "G6" ;
    md:concept dc:DC-G6-073 ;
    md:clause "GB/T 1031-2009 表1、表2；GB/T 131-2006" ;
    rdfs:label "表面粗糙度 Ra、Rz 数值取自标准系列"@zh ;
    sh:property rule:G6-073-roughness-value-in-series-p1 .
rule:G6-073-roughness-value-in-series-p1 a sh:PropertyShape ;
    sh:path md:text ; sh:minCount 1 ;
    sh:pattern "^\\s*(Ra|Rz)?\\s*(0\\.012|0\\.025|0\\.05|0\\.1|0\\.2|0\\.4|0\\.8|1\\.6|3\\.2|6\\.3|12\\.5|25|50|100|200|400|800|1600)\\s*$" ;
    sh:message "粗糙度数值不在 Ra／Rz 的第一系列中"@zh .

# G4-059-unresolved-terminator-on-carrier: variants, counter-examples and ratio parameters below in constituents.
rule:G4-059-unresolved-terminator-on-carrier a sh:NodeShape ;
    sh:targetClass md:OtherLine ;
    md:ruleId "G4-059-unresolved-terminator-on-carrier" ; md:group "G4" ;
    md:concept dc:DC-G4-059, dc:DC-G4-006, dc:DC-G4-032 ;
    md:clause "GB/T 4458.4-2003 4.2.1、4.2.3图12、4.3.3图22/23" ;
    md:confidence "likely" ;
    md:proposedCorrection "核对候选尺寸，将该终端挂为其箭头成员；保留原图，不作图纸改写"@zh ;
    rdfs:label "尺寸终端不应在识别结果中遗漏"@zh ;
    # Relations are exported only for unresolved OtherLine candidates.
    # A qualified count selects the recognition-layer carrier and preserves
    # the named property finding, its authored message and related target.
    sh:property rule:G4-059-unresolved-terminator-on-carrier-p1 .
rule:G4-059-unresolved-terminator-on-carrier-p1 a sh:PropertyShape ;
    sh:path md:terminatorOnCarrier ;
    sh:qualifiedValueShape [ sh:class md:Line ;
        sh:property [ sh:path md:layer ; sh:hasValue "recognition" ] ] ;
    sh:qualifiedMaxCount 0 ;
    sh:message "识别偏离：未解释终端的尖端、方向和本尺寸承载几何吻合"@zh .

# G4-059-unresolved-dimension-continuation: variants, counter-examples and ratio parameters below in constituents.
rule:G4-059-unresolved-dimension-continuation a sh:NodeShape ;
    sh:targetClass md:OtherLine ;
    md:ruleId "G4-059-unresolved-dimension-continuation" ; md:group "G4" ;
    md:concept dc:DC-G4-059, dc:DC-G4-017 ;
    md:clause "GB/T 4458.4-2003 4.2.1、4.2.6图16、4.3.1" ;
    md:confidence "likely" ;
    md:proposedCorrection "核对候选尺寸，将该有限区间挂为其尺寸线成员；保留原图，不延长原线"@zh ;
    rdfs:label "尺寸线的有限组成区间不应在识别结果中遗漏"@zh ;
    # Relations are exported only for unresolved OtherLine candidates.
    # A qualified count selects the recognition-layer carrier and preserves
    # the named property finding, its authored message and related target.
    sh:property rule:G4-059-unresolved-dimension-continuation-p1 .
rule:G4-059-unresolved-dimension-continuation-p1 a sh:PropertyShape ;
    sh:path md:boundedContinuationOf ;
    sh:qualifiedValueShape [ sh:class md:Line ;
        sh:property [ sh:path md:layer ; sh:hasValue "recognition" ] ] ;
    sh:qualifiedMaxCount 0 ;
    sh:message "识别偏离：未解释区间在本尺寸终端足迹或外置数值承载范围内有界接续"@zh .

# ================= 第三批：断面（通用知识见 section_rule_knowledge） =================
# 已知半剖：GB/T 4458.6-2002 5.5；轴线分界局部剖：5.6；简化剖示例：GB/T 16675.1-2012 5.2。
# 只有完整剖面且明确的局部放大轴线边界才可归入 local_axis；范围未知的普通视图不据此豁免。
rule:section-boundary-permitted sh:or (
    [ sh:property [ sh:path md:boundaryCarrier ; sh:qualifiedValueShape [ sh:class md:CentreLine ] ; sh:qualifiedMaxCount 0 ] ]
    [ sh:property [ sh:path md:boundaryCarrier ; sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMinCount 1 ] ]
    [ sh:property [ sh:path md:sectionExtent ; sh:hasValue "half" ] ]
    [ sh:property [ sh:path md:sectionExtent ; sh:hasValue "local_axis" ] ]
) .
# 例外必须在形状中：螺纹细线（GB/T 4459.1-1995 3.5）；重合断面连续母视图轮廓（GB/T 4458.6-2002 7.8）。
rule:section-interior-permitted sh:or (
    [ sh:not [ sh:property [ sh:path md:sectionGeometry ; sh:hasValue "complete" ] ] ]
    [ sh:property [ sh:path md:sourceLine ; sh:qualifiedValueShape [ sh:class md:VisibleOutline ] ; sh:qualifiedMaxCount 0 ] ]
    [ sh:property [ sh:path md:sourceLine ; sh:qualifiedValueShape [ sh:class md:ThreadLine ; sh:property [ sh:path md:lineType ; sh:hasValue "thin_continuous" ] ] ; sh:qualifiedMinCount 1 ] ]
    [ sh:and (
        [ sh:property [ sh:path md:crossSectionType ; sh:hasValue "superimposed" ] ]
        [ sh:property [ sh:path md:parentOutlineContinuation ; sh:hasValue "true" ] ]
        [ sh:property [ sh:path md:sectionOrigin ; sh:hasValue "pre_existing" ] ]
    ) ]
) .

rule:G2-028-boundary-centre-only a sh:NodeShape ;
    sh:targetClass md:SectionBoundarySpan ; md:ruleId "G2-028-boundary-centre-only" ; md:group "G2" ;
    md:concept dc:DC-G2-028, dc:DC-G2-034 ; md:clause "GB/T 4458.6-2002 7.1、7.2、7.8；5.5、5.6；GB/T 16675.1-2012 5.2；GB/T 17452-1998 3.2" ;
    md:confidence "likely" ;
    md:proposedCorrection "确认剖切范围及断面类型后，沿该段补画断面轮廓线；线型随断面类型确定，保留其余点画线；半剖或轴线分界局部剖按其规定复核。"@zh ;
    rdfs:label "剖面外缘仅由中心线承担边界（前提已知）"@zh ;
    sh:message "剖面外缘仅由中心线承担边界；已有断面配置依据；请复核承载线和区域来源，不自动改图。"@zh ;
    sh:or ( rule:section-boundary-permitted [ sh:property [ sh:path md:sectionExtent ; sh:hasValue "unknown" ] ] ) .

rule:G2-028-boundary-centre-only-unknown a sh:NodeShape ;
    sh:targetClass md:SectionBoundarySpan ; md:ruleId "G2-028-boundary-centre-only-unknown" ; md:group "G2" ;
    md:concept dc:DC-G2-028, dc:DC-G2-034 ; md:clause "GB/T 4458.6-2002 7.1、7.2、7.8；5.5、5.6；GB/T 16675.1-2012 5.2；GB/T 17452-1998 3.2" ;
    md:confidence "needs_expert" ;
    md:proposedCorrection "确认剖切范围及断面类型后，沿该段补画断面轮廓线；线型随断面类型确定，保留其余点画线；半剖或轴线分界局部剖按其规定复核。"@zh ;
    rdfs:label "剖面外缘仅由中心线承担边界（前提未知）"@zh ;
    sh:message "剖面外缘仅由中心线承担边界；范围未知，尚未排除半剖或轴线分界局部剖，需专家复核。"@zh ;
    sh:or ( rule:section-boundary-permitted [ sh:not [ sh:property [ sh:path md:sectionExtent ; sh:hasValue "unknown" ] ] ] ) .

rule:G2-018-outline-in-cut-face a sh:NodeShape ;
    sh:targetClass md:SectionInteriorUse ; md:ruleId "G2-018-outline-in-cut-face" ; md:group "G2" ;
    md:concept dc:DC-G2-018, dc:DC-G2-028, dc:DC-G2-034, dc:DC-G3-056 ; md:clause "GB/T 17452-1998 3.1、3.2；GB/T 4459.1-1995 3.5；GB/T 4458.6-2002 7.8" ;
    md:confidence "likely" ;
    md:proposedCorrection "请专家确认断面配置、线的剖切来源及深度；保留螺纹细线和重合断面中连续的原视图轮廓，未确认前不删线、不自动改图。"@zh ;
    rdfs:label "可见轮廓穿过剖切面实体内部（前提已知）"@zh ;
    sh:message "可见轮廓穿过剖切面实体内部；已有断面配置依据；请复核承载线和区域来源，不自动改图。"@zh ;
    sh:or ( rule:section-interior-permitted [ sh:property [ sh:path md:crossSectionType ; sh:hasValue "unknown" ] ] ) .

rule:G2-018-outline-in-cut-face-unknown a sh:NodeShape ;
    sh:targetClass md:SectionInteriorUse ; md:ruleId "G2-018-outline-in-cut-face-unknown" ; md:group "G2" ;
    md:concept dc:DC-G2-018, dc:DC-G2-028, dc:DC-G2-034, dc:DC-G3-056 ; md:clause "GB/T 17452-1998 3.1、3.2；GB/T 4459.1-1995 3.5；GB/T 4458.6-2002 7.8" ;
    md:confidence "needs_expert" ;
    md:proposedCorrection "请专家确认断面配置、线的剖切来源及深度；保留螺纹细线和重合断面中连续的原视图轮廓，未确认前不删线、不自动改图。"@zh ;
    rdfs:label "可见轮廓穿过剖切面实体内部（前提未知）"@zh ;
    sh:message "可见轮廓穿过剖切面实体内部；断面类型未知，尚未排除重合断面的连续母视图轮廓，仅作专家复核线索。"@zh ;
    sh:or ( rule:section-interior-permitted [ sh:not [ sh:property [ sh:path md:crossSectionType ; sh:hasValue "unknown" ] ] ] ) .

# GB/T 4458.6 §6.2 only exempts arrows; §§6.3–6.4 allow a whole marking to be omitted in defined cases.
# Only an existing explicitly named path creates a CuttingLetterSite; an absent path is not guessed.
rule:G2-043-cutting-letter-required a sh:NodeShape ;
    sh:targetClass md:CuttingLetterSite ;
    md:ruleId "G2-043-cutting-letter-required" ; md:group "G2" ;
    md:concept dc:DC-G2-043 ;
    md:clause "GB/T 4458.6-2002 6.1；6.2–6.4 的省略条件；GB/T 17452-1998 8.2" ;
    md:confidence "certain" ;
    md:proposedCorrection "按同一剖切路径另一端字母的内容、字高、文字样式和方向，在该端或转折的外侧空白处补同名字母；找不到不碰线位置时保留待处理"@zh ;
    rdfs:label "已有明确命名的剖切路径各端和转折标记具有同名字母"@zh ;
    sh:property rule:G2-043-cutting-letter-required-p1 .
rule:G2-043-cutting-letter-required-p1 a sh:PropertyShape ;
    sh:path md:cutLetterCount ; sh:minCount 1 ; sh:minInclusive 1 ;
    sh:message "此明确命名剖切路径的端点或转折标记附近缺少同名字母；邻近投影配置省略箭头不等于省略字母"@zh .
'''


# Executed geometry ratios for the two third-batch constituent shapes only.
# Algorithmic incidence bounds, not tolerances required by a standard.
[constituents]
components = ["源终端的尖端、底边与轴向", "已有尺寸线与本尺寸数值", "同一明确视图与唯一尺寸归属", "剩余源区间及有界承载范围"]
limitations = "只处理明确三角SOLID或闭合直线多段线终端，以及LINE区间；无视图、无数值语境、无径向圆弧支撑、多尺寸竞争保留未知；只评价识别层，不改原图和关系图。"
[constituents.parameters]
incidence_arrow = 3e-2
direction_sine = 5e-2
base_min_arrow = 8e-2
base_max_arrow = 0.9
base_symmetry_arrow = 0.15
text_band_height = 0.3
# GB/T 14665-2012 5.7 表4 gives a 1 mm minimum gap to a reference/baseline;
# Table 3 gives 3.5 mm alphanumeric height on A2--A4.  Use that supported
# worst-case ratio (1 / 3.5 = 2/7), rather than the former unsupported 0.5.
text_carrier_gap_height = 0.285714
text_end_height = 0.5
text_gap_height = 3.0
arc_end_arrow = 1.2

[[constituents.variants]]
test = "straight_unresolved_terminal"
meaning = "直线尺寸三角终端；精确焦点与候选尺寸成员"

[[constituents.variants]]
test = "closed_polyline_terminal"
meaning = "闭合直线多段线终端"

[[constituents.variants]]
test = "radius_internal_terminal"
meaning = "半径内部终端且有轮廓圆弧支撑"

[[constituents.variants]]
test = "radius_hidden_outline_support_is_accepted"
