[[concepts]]
id = "DC-G3-009"
name = "分隔的相同元素制成件"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "由若干相同的分隔元素拼合成的制件，可以只在视图的局部用细实线画出元素之间的分隔，以表示其组合方式，不必全部画出。"
components = ["外轮廓：按整体用粗实线画出。", "分隔线：只在视图局部用细实线画出若干等距的元素分界线，其余部分留空。"]
variants = []
dxf_forms = ["Thick outline LINE/LWPOLYLINE plus a short run of parallel thin LINEs (层02) confined to one segment of the view", "Occasionally a HATCH with a USER line pattern clipped to a small boundary (general practice)"]
recognition = "锚点：粗实线外轮廓内仅局部存在的一组等距平行细实线（几条到十几条，间距等于元素厚度，两端止于轮廓），其余区域无线。区分：剖面线满布剖面区域且多为45°；叠片结构位置线用于叠片铁芯；重复结构要素简化是画出几个完整要素，其余以点画线或数量注明。"
