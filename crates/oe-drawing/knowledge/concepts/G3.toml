kind = "symbol"
meaning = "花键标记开头表示渐开线花键类型的图形符号，形如两侧带水平底脚的梯形尖峰，注在指引线的基准线上。"
components = ["两侧各有一段水平底脚，中间以两条斜边升起一个窄顶梯形峰，整体如“_/‾\\_”。", "符号高度等于标记中数字和大写字母的字高h，线宽为h的1/10；字高系列3.5～20 mm。", "符号后接标记：INT或EXT（内或外花键）、齿数Z、模数m、压力角R、公差等级与配合类别及标准号。", "标记写在从花键大径引出的指引线基准线上。"]
variants = ["随字高按比例"]
dxf_forms = ["LWPOLYLINE of six vertices with global width about h/10, placed just left of a TEXT on the leader reference line", "Special glyph of a GB symbol font inside TEXT (often lost on DWG→DXF without the font, showing '?' or another letter)", "INSERT of a spline-symbol block plus TEXT; leader as LEADER or LINE on layer 09"]
recognition = "以指引线基准线上的花键标记文字为锚点（含INT/EXT、“数字Z×数字m×30R”或标准号GB/T 3478.1）；其左侧约0.5h处有高度约h的小折线符号，两条斜边向上对称收拢——判为渐开线花键；若为矩形凸台形则为矩形花键。字体丢失时，仅凭文字模式也可判断类型。与字母A或Λ区分：符号有两侧水平底脚。"
confusions = ["矩形花键符号：方波形凸台，两侧边竖直。", "字母A或Λ：无底脚，属于普通文字。"]
