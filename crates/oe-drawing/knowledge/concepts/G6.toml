meaning = "ISO 21920-1草案中，同一表面经多道工序有不同要求时，在各要求行末尾加圆圈编号（①、②），并在标题栏附近或补充文件中说明各编号的含义（如①镀铬前、②镀铬后）。"
components = ["每行规范末尾写一个圆圈数字。", "横线上方可写工艺（如镀铬）。", "编号的含义定义在标题栏附近或补充文件中。", "草案表G.1说明：它取代ISO 1302（GB/T 131-2006）中用长虚线表示两种以上加工方法的做法。"]
variants = ["ISO 21920-1 draft 9.7 图24", "replaces the 2006 long-dashed-line method for several processes (表G.1)"]
dxf_forms = ["circled digits as Unicode TEXT (U+2460 ①, U+2461 ②) — may be lost with SHX fonts", "small CIRCLE (diameter ≈h) + TEXT digit at the end of each requirement line", "explanatory MTEXT near the title block listing ① and ② meanings"]
recognition = "锚点：符号横线下各行行末的圆圈数字（字符①②，或直径约h的小CIRCLE内含数字），再在标题栏附近找同编号的说明。属于草案写法，普通零件图上罕见。区分零件序号（装配图中较大圆圈或横线上的数字，有指引线到零件）、修订标记（修订区附近）和OR(n)引用（字母OR加括号）。"
confusions = ["零件序号：较大圆圈或横线上的数字，带指引线到零件", "修订标记：位于修订区或更改处", "OR(n)引用：字母OR加括号"]
