[[concepts]]
id = "DC-G3-038"
name = "相邻的辅助零件"
aliases = ["相邻零部件假想画法", "相邻辅助零件画法"]
group = "G3"
kind = "conventional_representation"
meaning = "为说明本零件或部件与周围零件的关系、安装位置，用细双点画线画出不属于本图表达对象的相邻零件轮廓（假想画法）。"
components = ["相邻辅助零件的轮廓全部用细双点画线。", "它可以被主体零件遮挡（被挡部分不画），但不能遮盖主体零件的轮廓。", "相邻辅助零件被剖切时，其断面不画剖面线（GB/T 4458.1-2002、GB/T 4457.5-2013）；旧版GB 4457.5-84规定一般不画，需要时按通用剖面线画。", "装配图中同样用于画出相邻部件（如安装板、机座），以示安装关系。"]
variants = ["phantom outline", "hatched only if really needed (old 1984 rule)"]
dxf_forms = ["LINE/ARC/LWPOLYLINE with PHANTOM / ACAD_ISO05W100 linetype, thin, layer 07 or named 双点画线/假想线 layer", "phantom segments trimmed where they pass behind the main part's thick outline; no HATCH whose boundary is phantom", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为细双点画线组成的轮廓链：至少有一段与主体粗实线轮廓重合或紧贴（接触面、安装面），其余部分在主体外部；双点画线遇到主体粗实线即中断，而粗实线连续；其所围区域无剖面线。与运动件极限位置区分：后者的双点画线形状与图中某粗实线零件全等，仅旋转或平移；与初始/毛坯轮廓区分：后两者与主体轮廓等距或包络，位于主体自身范围；与剖切平面前的结构区分：后者画在剖视图主体之内，表示已被移去的部分；与特定区域区分：后者为表面上的小闭合环并带文字。"
confusions = ["运动件的极限位置：双点画线与某个零件全等，仅位置不同。", "初始轮廓、毛坯轮廓：与主体轮廓等距或包络，属同一零件。", "剖切平面前的结构：位于剖视主体范围内。", "特定区域（铭牌）：主体表面内的闭合环并带文字。"]
