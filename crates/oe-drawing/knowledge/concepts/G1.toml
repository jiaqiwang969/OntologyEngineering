[[concepts]]
id = "DC-G1-024"
name = "成形前轮廓线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细双点画线画出零件在弯曲、冲压等成形之前的形状（如弯曲前的直板或展开状态），与成形后的粗实线形状对照。"
components = ["细双点画线（No.05.1.4）。", "与成形后零件共享未变形的部分，变形部分以伸直或展开状态画出。", "可配展开长度注语或尺寸。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE with a double-dot linetype (PHANTOM, PHANTOM2, DIVIDE, ACAD_ISO05W100 or e.g. 双点画线), thin lineweight, layer 07 / 双点画线, colour magenta/pink (ACI 6)", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "双点画线外形与粗实线零件共享一段轮廓，其余部分是粗实线弯曲段的伸直（长度≈中性层弧长）；多见于钣金件、弯管、弹簧钩。附近常有“展开长度”注语或细实线弯折线。"
confusions = ["毛坯图中制成品的轮廓线：在毛坯内部偏移。", "弯折线：细实线，标出折弯位置。", "可动零件的极限位置：与零件全等，经旋转/平移得到。"]
related = ["DC-G1-042", "DC-G1-031", "DC-G1-067", "DC-G2-011", "DC-G3-010"]
priority = "low"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
