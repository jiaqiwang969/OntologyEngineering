[[concepts]]
id = "DC-G4-042"
name = "厚度符号 t"
aliases = ["厚度符号t"]
group = "G4"
kind = "dimension_symbol"
meaning = "板状零件只用一个视图表达时，在厚度数值前加注小写字母t（如t2），注在指引线上或图形内，从而省去表示厚度的第二个视图。"
components = ["图形：板件的单一视图（平面形状），无反映厚度的视图。", "符号t：小写（标准中为斜体）字母t，紧接厚度数值前。", "注写位置：用指引线从板面引出写在基准线上，或直接写在图形内。"]
variants = ["t on leader to the plate face"]
dxf_forms = ["LEADER/MULTILEADER + MTEXT 't2' (leader may end on the plate face with a dot or no terminator)", "TEXT 't2' placed inside the outline", "layer 08/09 or text layer 11 depending on template"]
recognition = "锚点为匹配^t\\d+(\\.\\d+)?$的文字（小写t；OCR可能丢失t或识为“+”“1”）。该文字位于某封闭外轮廓内，或通过指引线指向该轮廓的面内；该零件只有一个视图，没有平行投影显示厚度。排除：几何公差示意中的公差值t出现于标准示意图或公式中；弹簧节距、楔体小端厚度t出现在参数表或尺寸组合中；明细栏中的材料规格如“δ=2”“t=2”在表格中。"
confusions = ["GPS示意中的公差带宽度t：只在标准说明或公式中，不用指引线指向板面。", "弹簧节距t、楔体小端厚度t：位于参数表或楔体尺寸组合中。", "明细栏或技术要求中的板厚说明：在表格或文字段落中。", "普通文字中的字母t。"]
related = ["DC-G4-094", "DC-G4-026", "DC-G4-004", "DC-G4-017"]
