[[concepts]]
id = "DC-G2-029"
name = "组合的剖切面获得的剖视图（复合剖）"
aliases = ["复合剖"]
group = "G2"
kind = "section"
meaning = "综合运用相交与平行等剖切面得到的剖视图（教材习惯称复合剖）：剖切路径有多处转折，部分转折为斜角，被倾斜平面剖开的部分旋转到投影面后画出，剖切符号每一转折处注同一字母。"
components = ["剖切符号：多段粗短画，含直角和斜角转折，起迄处带箭头，各转折处注同一字母。", "剖视图：按旋转（或展开）后画出，剖面线连续。", "名称：“X—X”或“X—X展开”。", "同一视图上还可另有局部剖视（如C—C 2:1）。"]
variants = ["intersecting + parallel planes", "with a detail section (C—C 2:1) from the same view"]
dxf_forms = ["Multi-segment thick cutting strokes (LINE/LWPOLYLINE) with two or more bends of mixed angles, letter TEXT at each bend", "Section view HATCH and label TEXT"]
recognition = "以剖切符号的转折数与角度为锚点：转折≥2处，且同时含90°和非90°转折，判为组合剖切；同字母剖视图中剖面线连续，长度与旋转或展开后的路径对应。"
confusions = ["旋转剖：只有相交平面。", "阶梯剖：只有直角转折。"]
related = ["DC-G2-015", "DC-G2-016", "DC-G2-024", "DC-G2-043"]
priority = "low"
text_forms = ["A—A", "A—A展开"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "“复合剖”为教材用语；GB/T 4458.6 只以图10～图12（旋转绘制的剖视图）示例，归为组合剖切面是对图例的解读。"
