[[concepts]]
id = "DC-G6-049"
name = "表面结构符号的注写和读取方向"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "规定表面结构符号及其文字应像尺寸数字一样从图纸下方或右方读取，且符号尖端从材料外指向被注表面。"
components = ["2006版：注写和读取方向与尺寸一致（按GB/T 4458.4）；在水平轮廓上方正置，在竖直轮廓旁随之旋转，文字从右方读。", "符号尖端必须从材料外指向并接触表面；无法正确放置时（如朝下的面、某些斜面）改用带箭头或圆点的指引线引出。", "每一表面一般只注一次，尽量注在标注其尺寸和公差的同一视图上。", "1993版：图7–图10规定了不同方向轮廓上的符号姿态和数字方向；带横线的符号落在规定的30°区域内时须用指引线引出。", "ISO 21920-1草案：符号从正向或右向读，CAD推荐图11 a)形式；远离尺寸线时只作用于延长线所指要素。"]
variants = ["GB/T 131-2006 11.1, 11.2.1 图16", "GB/T 131-1993 4.1 图7-图10: symbols around the outline in several orientations with digit directions as specified; symbols with a horizontal line follow 图9/图10 and use a leader inside the 30° zone", "ISO 21920-1 draft 8.2 图11 a)-l): symbol read from the front or the right; option a) preferred for CAD; away from the dimension line it applies only to the feature of the extension line"]
dxf_forms = ["INSERT rotation following the outline direction (typically 0° or 90°); text inside the block rotates with it", "TEXT rotation 0° or 90° (read from bottom or right); rotation near 180°/270° suggests an upside-down copy or wrong placement", "mirrored INSERT (negative X scale) after MIRROR with MIRRTEXT=0: text stays readable but the legs swap sides", "LEADER + upright symbol for downward-facing or steep surfaces"]
recognition = "用尖端位置和角平分线确定被注表面和材料外侧：尖端接触的线即被注轮廓，V形开口一侧为材料外。文字方向应为0°或90°；朝下的面上不会出现倒置符号，而是由指引线引出的正置符号，识别时须沿指引线回溯到被注表面。X比例为负的镜像块会使长短边左右互换，应先归一化再判断。区分尺寸数字方向（原则相同，但文字依附尺寸线）和焊缝符号的上下方位（表示箭头侧/非箭头侧，含义不同）。"
confusions = ["尺寸数字方向：原则相同，但文字依附尺寸线", "焊缝符号：上下方位表示箭头侧/非箭头侧", "镜像复制的符号：长短边左右互换，不是另一种符号"]
related = ["DC-G6-053", "DC-G6-032", "DC-G6-052", "DC-G6-047", "DC-G6-069", "DC-G4-102", "DC-G7-131"]
priority = "high"
text_forms = []
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "The 1993 30° zone geometry is only in the figures, not in the OCR. Rotation/mirroring behaviour of blocks is general CAD practice."
