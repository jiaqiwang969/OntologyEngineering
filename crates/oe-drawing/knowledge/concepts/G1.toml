components = ["圆圈字母 Ⓟ（专利）或 Ⓤ（实用新型）。", "后接 WIPO ST.3 两字母国家或组织代码，如 FR、US、CN。", "再接公开号或注册号，以及 WIPO ST.16 文献种类代码（如 A1、B）。", "无法排印圆圈字母时写出专利类型全称，例如“实用新型 CH 679439 B5”。"]
variants = ["圆圈 P（专利）", "圆圈 U（实用新型）", "文字全称"]
dxf_forms = ["TEXT/MTEXT with a Unicode circled letter (\\U+24C5 Ⓟ, \\U+24CA Ⓤ) or the letter inside a small CIRCLE", "usually in or near the title block, possibly as ATTRIB of the frame block"]
recognition = "文本模式：圆圈字母或圆内单字母 P/U，紧跟两位大写国家代码和数字串、末尾字母码，例如正则 (Ⓟ|Ⓤ|P|U)\\s*[A-Z]{2}\\s*[0-9 ,.]+\\s*[A-Z][0-9]?。圆内字母时，CIRCLE 直径约为字高的1.2~1.5倍。多在标题栏附近。与零件序号圆（内为数字、有指引线）区分。"
confusions = ["版权标识：圆圈内为 C。", "设计专利标识：圆圈内为 D。", "零件序号圆：圆内为数字，带指引线。"]
related = ["DC-G1-078", "DC-G1-075", "DC-G1-064"]
priority = "rare"
text_forms = ["Ⓟ FR 2775 254 A1", "Ⓤ US 5,927,354 B", "实用新型 CH 679439 B5"]
knowledge_units = ["K03", "K52", "K55"]
