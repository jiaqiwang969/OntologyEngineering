# Part 3（概念阶段）转述种子——来自第二卷 ch04 已验证的自然语言转述。
# 格式：条款号: {zh: 转述, keywords: [...], book: [...]}
"5.4.1":
  zh: 相关项的需求（功能、边界、模式、依赖等）须在概念阶段被整理并可用，作为后续危害分析的输入。
  keywords: [相关项定义, 边界, 输入]
  book: [ch04 §4.4.1]
"6.4.1.2":
  zh: 初始危害分析与风险评估不计入相关项内部拟实现的安全机制；不能先假设"反正有监控"再据此降低其自身的完整性要求。
  keywords: [HARA, 不计入内部机制]
  book: [ch04 §4.4.2]
"6.4.2.2":
  zh: 危害须被系统地识别（可用 HAZOP 引导词、FMEA 类方法等）；头脑风暴、检查表、质量履历与现场研究可以补网，但不能单独证明网外已空。
  keywords: [危害识别, 系统方法, HAZOP]
  book: [ch04 §4.4.2]
"6.4.2.4":
  zh: 电击、烟雾、火灾、毒性等危害只有当由相关项的电子电气失常引发时才进入本标准范围，否则按组织其他程序分流。
  keywords: [范围边界, 非失常危害]
  book: [ch04 §4.4.2]
"6.4.2.6":
  zh: 危害事件的后果须被识别；一个失常同时带走多个功能时须评估组合效应，不得拆行各自判完。
  keywords: [后果, 组合效应]
  book: [ch04 §4.4.2]
"6.4.2.7":
  zh: 不得为降低暴露概率而把一个运行情形切分成没有机理差异的子场景；有证据意义的区分（如干湿路面改变可控性）才允许。
  keywords: [运行情形, 切分纪律, 暴露概率]
  book: [ch04 §4.4.2]
"6.4.3.9":
  zh: 判为 C0（通常可控）的危害事件无须分配 ASIL；C0 判定须与假定的驾驶动作成对记录，不得凭空出档。
  keywords: [C0, 可控性, 出口]
  book: [ch04 §4.5.3]
"6.4.4.4":
  zh: 每个安全目标须分配 ASIL；多个危害事件导出同一安全目标时，取其中最高的 ASIL。
  keywords: [安全目标, ASIL 继承, 最高等级]
  book: [ch04 §4.6]
"6.4.5.1":
  zh: 卡客车（T&B）专用条款只适用于相应车型；乘用车判例不得代替其基本车型、配置与运营变体的边界。
  keywords: [卡客车, 适用边界]
  book: [ch04 §4.4.1, 附录B]
"7.4.2.3":
  zh: 功能安全需求须在适用时规定安全状态的转入条件与相关约束；功能安全概念把安全目标派生为可分配的功能安全需求。
  keywords: [功能安全概念, 安全状态, 派生]
  book: [ch04 §4.6, ch05]
