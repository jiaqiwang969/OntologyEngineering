[[concepts]]
id = "DC-G4-114"
name = "公差带代号注法（如 Ø65k6、Ø65H7）"
aliases = ["公差带代号注法", "公差带代号", "公差带代号的构成（基本偏差字母+标准公差等级）"]
group = "G4"
kind = "tolerance_indication"
meaning = "公差带代号注法：在公称尺寸右边紧接写出公差带代号，由基本偏差字母（孔用大写、轴用小写）和标准公差等级数字组成，如 Ø65H7、Ø65k6，字高与公称尺寸相同。"
components = ["公称尺寸：数值及Ø等前缀（2003版称基本尺寸，2020版称公称尺寸）", "基本偏差字母：孔为A…ZC（含CD、EF、FG、JS、ZA、ZB、ZC等双字母），轴为a…zc；不用I、L、O、Q、W", "公差等级数字：01、0、1…18，与字母连写；单独写等级时用IT7形式", "JS/js表示对称公差带，相当于±IT/2", "可附加Ⓔ或括号偏差"]
variants = ["hole class H7", "shaft class k6", "with Ⓔ appended", "terminology: 基本尺寸 (2003) vs 公称尺寸 (2020)", "孔：大写字母+等级数字（H8、F7、JS7）", "轴：小写字母+等级数字（h7、g6、js6）", "仅注代号（如图中 Ø120H7）", "IT grade alone written as IT7", "JS/js symmetric", "two-letter deviations CD, EF, FG, ZA, ZB, ZC"]
dxf_forms = ["DIMENSION with override text '%%c<>H7' / '<>k6' or DIMPOST suffix 'H7' (code 1 or XDATA DSTYLE)", "TEXT/MTEXT '%%c65H7' on a leader reference line", "exploded TEXT where class code may be a separate TEXT entity of the same height next to the value"]
recognition = "锚点：紧随尺寸数值之后、与之同字高的“1–2个字母+1–2位数字”串。字母大写→孔（内要素），小写→轴（外要素）；可用该信息核对被注要素是孔还是轴。与螺纹公差带区分：螺纹公差带数字在前（6H、5g6g）且前有M规格；与一般公差等级区分：f/m/c/v单字母无数字、写在技术要求或标题栏附近；与键槽代号区分：N9、JS9等在键槽宽度上，本身也属公差带代号；与配合代号区分：无分数线。"
confusions = ["螺纹公差带代号（6H、6g、5g6g）：数字在前，属螺纹标记", "配合代号 H7/g6：装配图分数形式", "一般公差等级 m、f、c、v：单字母，见技术要求", "未注几何公差等级 H、K、L", "圆锥角公差等级 AT7、表面结构等级"]
related = ["DC-G4-113", "DC-G4-132", "DC-G4-150", "DC-G4-105", "DC-G4-126", "DC-G3-232"]
priority = "high"
text_forms = ["Ø65H7", "Ø65k6", "Ø18H8", "Ø20h6Ⓔ", "165js10", "68H8", "IT7"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
