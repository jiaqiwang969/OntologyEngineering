[[concepts]]
id = "DC-G2-017"
name = "剖视中的剖视（剖面区域内再作局部剖）"
aliases = []
group = "G2"
kind = "section"
meaning = "在剖视图的剖面区域内再作一次局部剖视以表达区域内部结构；两层剖面线同方向、同间隔但互相错开，并用指引线标注内层剖视的名称。"
