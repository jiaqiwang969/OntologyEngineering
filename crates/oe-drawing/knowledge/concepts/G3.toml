[[concepts]]
id = "DC-G3-087"
name = "螺纹副标记标注"
aliases = ["螺纹副标记", "螺纹配合标记"]
group = "G3"
kind = "dimension_element"
meaning = "装配图中需要时标注内外螺纹旋合的螺纹副标记，内外螺纹的公差带用斜线分开（如M14×1.5-6H/6g）；注法与单个螺纹相同：米制螺纹注在大径尺寸线或其引出线上，管螺纹用由配合部分大径处引出的引出线，米制锥螺纹用引出线或基面处尺寸线。"
components = ["米制螺纹副：特征代号+尺寸代号+内螺纹公差带/外螺纹公差带（大写/小写），可加旋合长度代号与LH；注在大径尺寸线上或引出线上。", "管螺纹副：如Rc/R2、Rp/R1加尺寸代号，用引出线从配合段大径处引出。", "米制锥螺纹副：引出线或基面处的尺寸线。", "配合性质：H/h为零间隙，H/g、G/h为小间隙；镀层螺纹如6H/6e、6G/6e。"]
variants = ["米制螺纹副：大径尺寸线或引出线", "管螺纹副：引出线", "米制锥螺纹副：引出线或基面尺寸线", "H/h 零间隙", "H/g、G/h 小间隙", "镀层螺纹 6H/6e、6G/6e"]
dxf_forms = ["DIMENSION across the major diameter in the assembly view with override text \"M14×1.5-6H/6g\" replacing the measured value", "LEADER/MLEADER + TEXT for pipe thread pairs, e.g. \"Rc/R2 3/4\"", "Tolerance fraction usually inline with '/', occasionally stacked MTEXT (\\S6H/6g;)"]
recognition = "锚点为文本中“螺纹特征代号+…-数字大写字母/数字小写字母”：正则 (M|Tr|B)\\d+.*-\\d[A-H](\\d[A-H])?/\\d[a-h](\\d[a-h])?，或管螺纹 (Rc|Rp)/R[12]\\s?\\d。文本应在装配图（有明细栏、序号）中，并指向内外螺纹重叠的旋合段（旋合段按外螺纹画）。与孔轴配合代号区分：配合代号为H7/g6（字母在前、数字在后）且前接Ø直径，螺纹副公差带为6H/6g（数字在前）且前接M；与单个螺纹标记区分：单个螺纹无斜线分式；与花键副区分：花键副含键数×小径×大径×键宽或INT/EXT。"
confusions = ["孔轴配合代号（Ø30H7/g6）：字母在数字前，前缀Ø。", "单个螺纹标记（M14×1.5-6g）：无斜线分式。", "花键副标记：含N×d×D×B或INT/EXT。"]
related = ["DC-G3-088", "DC-G3-081", "DC-G3-082", "DC-G3-056", "DC-G3-223", "DC-G3-232", "DC-G4-150", "DC-G3-085"]
priority = "medium"
text_forms = ["M14×1.5-6H/6g", "M20-6H/5g6g", "M27×1.5-6H/6g", "Tr40×7-7H/7e", "Rc/R2 3/4", "Rp/R1 1/2", "M10-6H/6e"]
knowledge_units = ["K13", "K34", "K15", "K19"]
