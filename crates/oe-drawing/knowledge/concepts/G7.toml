[[concepts]]
id = "DC-G7-061"
name = "未定义形状边的基本符号"
aliases = []
group = "G7"
kind = "symbol"
meaning = "表示未定义形状边（毛刺、侧凹、过渡状态）要求的基本图形符号：带箭头的引线指向边（或其投影点、线），连接一个由竖线和横线组成的直角折线；边状态（+、−、±及尺寸）写在直角内侧a1处，方向相关尺寸写在a2（右侧）或a3（上方）；折点处可加小圆“O”表示适用于轮廓上所有边。"
components = ["引线：细实线，末端实心箭头指向边线或边的点投影，长度不小于1.5h，角度按需要。", "直角折线：一条竖线（高H≈1.4h）与一条横向参考线在折点相交，参考线可延长。", "a1：直角内侧，注边的形状元素（+、−、±）与尺寸。", "a2、a3：参考线右端外侧和竖线上方，注毛刺或侧凹方向相关尺寸。", "符号元素“O”（可选）：折点处小圆。", "比例：字高和线宽与尺寸标注一致，线距为2倍线宽。"]
variants = ["individual indication", "collective indication"]
dxf_forms = ["LEADER/LINE + SOLID arrowhead to the edge, joined to two LINEs forming a right angle (vertical ≈1.4h, horizontal reference)", "TEXT '+0.3', '-0.2', '±0.05' in the inner corner; optional small CIRCLE at the knee", "INSERT of an edge-symbol block (common in ISO-style templates)"]
recognition = "锚点为“带箭头的斜引线＋直角折线（竖线朝上、横线朝右）”结构，直角内侧有带+/−/±前缀的小数值。判别要点：数值必有符号前缀或为±；竖线高约1.4倍字高；箭头落在轮廓角点或边上。与表面结构√区分：√由两条不等长斜线组成；与普通注释引线区分：注释引线的横线上是文字而不是带符号小数。"
confusions = ["表面结构符号：两条斜线构成的√，参数为Ra等。", "带基准线的普通注释引线：横线上方是说明文字。", "旗形注释或基准目标框：有方框或圆分区。", "倒角C注写：数值前为字母C。"]
related = ["DC-G7-073", "DC-G7-074", "DC-G7-075", "DC-G7-076", "DC-G7-016", "DC-G7-064", "DC-G7-030", "DC-G9-010"]
priority = "low"
