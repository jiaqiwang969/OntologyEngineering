[[cards]]
id = "detail_view"
expression_kind = "view"
title = "局部放大图（名称、边界与视图本身）"
meaning = "局部放大图把机件的一部分放大画出：在原视图上用细实线圈出部位，放大图上方注同一编号与比例（罗马数字在上、比例在下，中间一条短横线；只有一处时可只注比例）；常见的写法还有大写字母编号（如“C 4:1”），Unicode 罗马数字（如 Ⅲ），全角冒号（如 3：1），以及旧版图样在旋转配置的放大图名称后写“旋转”二字（现行标准用旋转符号）。放大图的边界在 GB 中是波浪线；CAD 图上常画成细实线圆，或细实线圆弧加波浪线，名称可写在边界之内、图形之上。把机件上细小部位用大于原图的比例画出的图形。它重复被放大部位的结构（轮廓、轴线、剖面线照原样画出，剖面线方向与间隔同原图），边界在 GB 中用波浪线，CAD 常画成放大后的圆；上方注同一标号与比例。CAD 的局部放大对象常把整个放大图（原部位的缩放副本加边界圆）存成一个图块，图块中的线仍是机件的结构线，要按各自的线型读出并组成一个视图。"
sources = [
  "GB/T 4458.1-2002 机械制图 图样画法 视图 5.7 局部放大图",
  "GB/T 14690-1993 技术制图 比例 5.2（视图名称处的比例）",
  "GB/T 4458.6-2002 7.3（图28，旋转配置的标注用旋转符号）；机械制图（第7版）§7-1 四（旋转符号）；旋转配置时在名称后写“旋转”二字是旧版图样的写法",
  "机械制图（第7版）§7-4 一 局部放大图（图7-25、7-26）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图 5.7（局部放大图）",
  "GB/T 13361-2012 技术制图 通用术语 5.20",
  "GB/T 14690-1993 技术制图 比例 5.2",
  "机械制图（第7版）§7-4 一、图7-25",
]
knowledge_units = ["K11", "K13"]
recognition = "名称：上方文字为罗马数字（拉丁字母或 Unicode 写法）或一个大写字母，其后可接“旋转”，下方（中心竖距在给定倍数字高之间、横向偏差小于给定倍数字高）为比例，比例的冒号可为半角或全角；名称与比例也可写在一行。边界：细实线圆，或两端落在已识别波浪线上的细实线圆弧，圆内几何构成一个完整视图（与圆相交的几何几乎都在圆内，指示放大部位的圈则被视图轮廓穿过），并有放大图名称写在圆内上部或圆顶上方不远处；边界读为断裂与局部边界，与放大图几何同属一个视图，圆内的名称挂到这个视图。视图本身存成一个图块时：一个没有文字的图块：一个圆包住其余全部图线；其余图线按自身线型分类——点画线为轴线，虚线为不可见轮廓，连续线中线宽粗的一类为可见轮廓，细的、互相平行等距且倾斜的三条以上为剖面线。它必须与一个放大部位标号配对：边界圆半径 ÷ 标号圆半径 = 放大倍数 k ≥ 1，并且把块中可见轮廓线按 (p − 边界圆心)/k + 标号圆心 映回后，至少一半落在原图的直线上（放大图是原部位的副本）。测得的 k 记作证据；与标题比例 ÷ 图纸比例 不符时只报告，不否定配对。"
markers = ["旋转"]
concepts = ["DC-G2-075", "DC-G2-048"]

