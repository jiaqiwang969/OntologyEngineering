[[concepts]]
id = "DC-G3-194"
name = "螺栓或铆钉装配在孔内的符号（轴线平行于投影面）"
aliases = []
group = "G3"
kind = "symbol"
meaning = "紧固件轴线平行于投影面时，用穿过被连接板件的细实线加板外粗短竖线表示装在孔内的螺栓或铆钉，并以V形标记表示沉孔、双竖线表示指定螺帽位置、小旗表示在工程现场装配或钻孔。"
components = ["水平细实线沿紧固件轴线贯穿板件；在两侧板外各有一条与轴线垂直的粗短竖线，表示头部和尾部。", "有沉孔的一侧改画粗实线V形标记；一侧或两侧沉孔分别对应。", "指定螺帽位置的螺栓：在螺母一侧画两条平行粗短竖线。", "在工程现场装配：从轴线引斜线加一面小旗；钻孔、装配均在工程现场：加两面小旗；车间装配不加旗。"]
variants = ["车间装配", "工程现场装配", "钻孔、装配均在工程现场", "一侧/两侧有沉孔", "指定螺帽位置的螺栓"]
dxf_forms = ["LINE on layer 02 (thin) for the axis, short thick LINEs on layer 01 for head/tail bars and V marks; flags as small LWPOLYLINE triangles", "Steel-structure library INSERT repeated along the joint", "DIMENSION extension lines stop short of the symbol (gap) per the associated dimensioning rule"]
recognition = "锚点为穿过两层以上平行板件、垂直于板面的细实线，判断其两端板外是否有粗短竖线（长约为板厚到字高的1倍）：有则为螺栓/铆钉；某端为V形则为沉孔侧；某端为双竖线则为指定螺帽位置；附斜线小旗表示现场作业。无竖线、仅细线或V形则为孔符号。区分螺纹紧固件简化画法：后者画出头部和螺母外形轮廓。"
confusions = ["孔的符号表示：板外没有表示头部和尾部的粗短竖线。", "螺纹紧固件简化画法：画出螺栓头、螺母和垫圈的外形，不用符号。", "尺寸界线：细实线且与尺寸线相伴，并与符号之间留有间隙。"]
