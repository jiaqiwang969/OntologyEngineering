components = ["面轮廓度框格：指引箭头指向圆锥面，框格第一格为面轮廓度符号，第二格为公差值，可带基准字母", "理论正确尺寸：锥角、锥度、圆锥直径或轴向位置用方框数值表示", "变体：给定锥角、给定锥度、给定轴向位置、给定轴向位置公差、与基准有关", "相配合圆锥：两配合件的直径与位置TED均相对各自基准平面给出"]
