[[concepts]]
id = "DC-G4-102"
name = "线性尺寸数字的注写方向"
aliases = []
group = "G4"
kind = "text_convention"
meaning = "线性尺寸数字的方向有两种注写方法：方法1数字随尺寸线方向书写，从下方或右方读，并尽量避开竖直左侧30°区；方法2非水平尺寸的数字一律水平写在尺寸线的中断处。一张图尽量只用一种方法。"
components = ["方法1（默认）：文字方向与尺寸线平行，水平尺寸字头朝上，竖直尺寸字头朝左，倾斜尺寸字头保持向上方", "30°区：尺寸线处于竖直线左侧30°范围内时避免注写，无法避免时用引出水平注写", "方法2：非水平尺寸的数字保持水平，写在尺寸线中断处", "同图统一：同一张图样尽可能采用同一种方法"]
variants = ["方法1 aligned text", "30° zone text via leader (图19)", "方法2 unidirectional horizontal text in break (图20 图21)"]
dxf_forms = ["DIMENSION with DIMTIH=0, DIMTOH=0 (aligned text, method 1)", "DIMENSION with DIMTIH=1, DIMTOH=1 (horizontal text, method 2), usually with DIMTAD=0", "exploded TEXT rotation equal to the dimension-line angle (method 1) or 0° (method 2)", "leader-type TEXT placed horizontally for dimensions in the 30° zone"]
recognition = "计算尺寸线方向角θ与文字旋转角φ：φ≈θ（模180°，并使字头朝上或朝左）为方法1；θ非水平而φ≈0且文字位于断口为方法2。读数时须按φ还原文字方向，避免把倒置文字误读（如6/9、66/99）。若同图混用两法，按局部判定，不视为错误。与普通注释的水平文字区分：方法2文字位于尺寸线断口中。"
confusions = ["角度数字：一律水平书写，不属于线性尺寸方向规则", "注释文字：水平但不在尺寸线断口", "倒置文字：OCR需按旋转角还原"]
related = ["DC-G4-101", "DC-G4-017", "DC-G4-032", "DC-G4-059"]
priority = "high"
text_forms = ["30", "Ø20"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
