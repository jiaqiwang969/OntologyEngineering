[[concepts]]
id = "DC-G1-004"
name = "中断线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细双点画线画在图形被中断处，作为断开部分的边界或表示中间被省略的部分，例如较长件断开后、规律结构只画一部分时。"
components = ["细双点画线（No.05.1.11），横跨被中断的图形。", "两端超出轮廓约2~5 mm（教材对作为中断线的双点画线的要求）。", "常成对出现在断开的两侧，之间的轮廓不画；尺寸仍按实际长度标注。", "GB/T 4458.1 允许断裂边界用波浪线、双折线或细双点画线绘制。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE with a double-dot linetype (PHANTOM, PHANTOM2, DIVIDE, ACAD_ISO05W100 or e.g. 双点画线), thin lineweight, layer 07 / 双点画线, colour magenta/pink (ACI 6)", "two short PHANTOM LINEs perpendicular to the long direction of a part with the outline gap between them", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为双点画线直线段，垂直（或倾斜）穿过长件的两条平行轮廓，两端略超出轮廓。判据：成对出现、之间无轮廓线、跨越的距离对应的尺寸数字大于图上测得长度（断开缩短）。与相邻辅助零件、极限位置轮廓区分：后两者为闭合或成片的外形，不横切主零件的轮廓。"
confusions = ["波浪线/双折线断裂边界：细实线类，波浪线止于轮廓。", "成规律分布的相同要素连线：细实线，连接各结构的顶部或底部。", "相邻辅助零件的轮廓线：细双点画线围成另一零件的外形。"]
related = ["DC-G1-042", "DC-G1-029", "DC-G1-025", "DC-G1-011", "DC-G2-041", "DC-G3-117"]
priority = "low"
