components = ["两侧各有一段水平底脚，中间以两条竖边升起一个矩形凸台，整体如“_|‾|_”。", "符号高度等于标记字高h，线宽为h的1/10；字高系列3.5、5、7、10、14、20 mm。", "符号后接键数N×小径d×大径D×键宽B及各自公差带代号，再接标准号；花键副用分式写出内外公差带。", "标记写在从花键大径引出的指引线基准线上。"]
variants = ["随字高3.5～20 mm按比例"]
dxf_forms = ["LWPOLYLINE of six vertices with global width about h/10 left of a TEXT on the leader reference line", "Special glyph of a GB symbol font in TEXT (may show as '?' or a letter after conversion)", "INSERT of a spline-symbol block plus TEXT; leader as LEADER or LINE on layer 09"]
recognition = "以指引线基准线上形如“6×23H7×26H10×6H11”或“6×23f7×26a11×6d10”的文字为锚点（四个尺寸以×相连，后三个带公差带代号）；其左侧约0.5h处有高约h、两竖边的方波小符号。仅凭文字模式也可判为矩形花键。与渐开线花键符号区分：后者为斜边梯形峰；与零件上的矩形槽轮廓区分：后者尺寸随零件比例，不在文字前。"
confusions = ["渐开线花键符号：两边倾斜的梯形峰。", "矩形槽或键槽轮廓：属于视图图形，尺寸远大于字高。", "字母Π或方波形表格线：不带两侧底脚或不后接花键尺寸。"]
