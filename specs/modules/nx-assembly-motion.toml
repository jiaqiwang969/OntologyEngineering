[[constraints]]
id="nx_assembly_motion_plan"
requirement="req_engineering"
module="nx_worker"
check="validate_intent"
rust_path="crates/oe-nx-worker/src/assembly_motion.rs"
statement="独立源意图必须有限、路径唯一、时间递增、目标为正常刚体矩阵；依据当前绝对位置计算delta并按显示根单位转换。逐级路径核原型，父先子后；完整placed-body实体对不能被预算截断。SDK 1/2/3分别保留干涉/无干涉/接触，其他结果未知错误；此层不声称已调用NX、完整覆盖、连续无碰撞或工程采用。"
severity="error"
[[validations]]
id="nx_assembly_motion_plan_fixed_oracle"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="delta_uses_current_pose_and_native_units"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="Rz90+t(1,2,3)到I+t(4,5,6)，delta=Rz-90+t(2,6,3)，单位转换后重组仍到达目标；反射和非刚体拒绝"
scope="软件计算；当前原生位姿、override和干涉另验"

[[validations]]
id="motion_occurrence_paths_are_not_prototype_aliases"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="occurrence_paths_are_not_prototype_aliases"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="两个同原型引用A/B按全路径选择B；同名兄弟、重复目标及错原型拒绝"
scope="软件开发反例；原生调用和工程采用另验"

[[validations]]
id="motion_parents_are_planned_before_children_without_caching_child_delta"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="parents_are_planned_before_children_without_caching_child_delta"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="输入子后父倒序时，输出父先子后且仅保留绝对目标"
scope="软件开发反例；原生调用和工程采用另验"

[[validations]]
id="motion_all_placed_solids_contribute_pairs_without_budget_truncation"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="all_placed_solids_contribute_pairs_without_budget_truncation"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="根1实体+两引用各2实体=5实体，10对；3帧30查询，29预算拒绝，不漏重复原型"
scope="软件开发反例；原生调用和工程采用另验"

[[validations]]
id="motion_raw_interference_codes_preserve_touching_and_errors"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="raw_interference_codes_preserve_touching_and_errors"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="1、2、3各自映射，0/4/-1及查询错误不算无干涉"
scope="软件开发反例；原生调用和工程采用另验"

[[validations]]
id="motion_intent_rejects_time_source_and_identity_gaps"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="intent_rejects_time_source_and_identity_gaps"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="完整声明可解析；重复时间、非法来源摘要拒绝"
scope="软件开发反例；原生调用和工程采用另验"

[[validations]]
id="motion_expected_complete_tree"
module="nx_worker"
constraint="nx_assembly_motion_plan"
behavior="expected_tree_distinguishes_inherited_motion_explicit_children_and_unrelated_branches"
rust_path="crates/oe-nx-worker/tests/assembly_motion.rs"
oracle="A移动到x=4m，其未选子件L随动到4m，独立B保持原位；L显式目标9m时不叠加A的4m；输入库存子项在父项前也给出完整相同预期"
scope="完整树的软件预期，不是原生观察；实际更新后另核"

[[constraints]]
id="nx_motion_native_body_identity"
requirement="req_engineering"
module="nx_worker"
check="validate_binding"
rust_path="crates/oe-nx-worker/src/assembly_motion/binding.rs"
statement="原型实体不能作为装配位置实体重新标名；根实体保持根owner，occurrence实体须反查原型实体和确切part occurrence，重复原型的不同位置必须返回不同native body tag。原生入口只从本会话刚读取的私有根库存取tag，并核每个返回码、类型、solid类型及owner；不接受外部JSON native句柄。当前仅初始/1库存，override后观察和干涉派发仍另接。"
severity="error"

[[validations]]
id="motion_body_repeated_prototype_requires_distinct_native_placements"
module="nx_worker"
constraint="nx_motion_native_body_identity"
behavior="repeated_prototype_requires_distinct_native_placements"
rust_path="crates/oe-nx-worker/tests/motion_body_binding.rs"
oracle="同一原型在两个位置对应不同native实体；实际句柄复用或重复位置拒绝"
scope="软件身份反例；真实UF查询及完整原生作用另验"

[[validations]]
id="motion_body_prototype_and_containing_occurrence_are_both_required"
module="nx_worker"
constraint="nx_motion_native_body_identity"
behavior="prototype_and_containing_occurrence_are_both_required"
rust_path="crates/oe-nx-worker/tests/motion_body_binding.rs"
oracle="错误原型、错误part occurrence、空句柄、非occurrence或非solid均拒绝"
scope="软件身份反例；真实UF查询及完整原生作用另验"

[[validations]]
id="motion_body_root_body_stays_direct_and_owned_by_root"
module="nx_worker"
constraint="nx_motion_native_body_identity"
behavior="root_body_stays_direct_and_owned_by_root"
rust_path="crates/oe-nx-worker/tests/motion_body_binding.rs"
oracle="根实体保持非occurrence、根owner与原型实体本身；错owner或伪occurrence拒绝"
scope="软件身份反例；真实UF查询及完整原生作用另验"


