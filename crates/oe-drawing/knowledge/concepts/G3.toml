[[concepts]]
id = "DC-G3-082"
name = "米制锥螺纹标记标注"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "米制锥螺纹的标记一般注在由大径或对称中心引出的引出线上，也可直接注在从基面处画出的大径尺寸线上。"
components = ["引出线式：指引线从锥螺纹大径线或轴线引出，基准线上写标记。", "尺寸线式：在基面（规定大径所在的截面）处画垂直于轴线的大径尺寸线，标记写在该尺寸线上。", "螺纹轮廓按圆锥螺纹画法：牙顶、牙底线随锥度倾斜。"]
variants = ["引出线标注", "基面处尺寸线标注"]
dxf_forms = ["LEADER/MLEADER + TEXT on the landing, e.g. \"Mc12×1\"", "Linear DIMENSION across the major diameter at the gauge plane with override text replacing the measured value", "Thick crest LINEs and thin root LINEs slightly converging (1:16 taper on diameter)"]
recognition = "锚点为以米制锥螺纹特征代号（现行Mc/Mp，旧版ZM）开头、后跟“公称直径×螺距”的文本；位于引出线基准线上，或作为DIMENSION的替代文字且该尺寸线垂直于轴线、位于锥螺纹段内某一截面（基面）。几何上螺纹轮廓线相对轴线有约1.8°的倾斜（1:16锥度半角）。与管螺纹区分：管螺纹代号为G/R/Rc/Rp且尺寸为英寸分数；与锥度标注区分：锥度为锥度符号加1:n，无螺纹代号；与普通螺纹区分：普通螺纹为M、圆柱轮廓平行。"
confusions = ["管螺纹标注：特征代号与英寸尺寸代号不同，且只能用引出线。", "锥度标注（1:16）：只注锥度，不是螺纹标记。", "普通螺纹M标记：圆柱螺纹，轮廓平行。"]
related = ["DC-G3-081", "DC-G3-087", "DC-G3-226", "DC-G3-023", "DC-G1-059", "DC-G4-057"]
priority = "low"
text_forms = ["Mc12×1", "Mc20×1.5-S", "Mp/Mc20×1.5", "ZM10"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.1-1995 第4.4条（图22、23）只规定注写位置。特征代号Mc/Mp（GB/T 1415-2008）与旧代号ZM来自一般知识，未在本出处页核对。"
[[concepts.sources]]
document = "GB/T 4459.1-1995"
clause = "4.4 图22、图23"
page = 7

[[concepts]]
id = "DC-G3-083"
name = "紧固件规格及数量标注"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "在用符号表示孔、螺栓、铆钉的结构图样中，螺栓和铆钉规格按其标准标记用指引线注出；规格完全相同的一组在一处标注并把数量写在标记前；与中心线等距排列时用“数量×间距”标注。"
components = ["指引线指向孔或紧固件符号，基准线上写标记：孔写直径（如Ø13），螺栓写M12×50，铆钉写Ø12×50。", "一组相同的孔、螺栓或铆钉：数量写在标记前面，如5×…。", "等距排列：沿中心线注“n×间距”，如4×100。", "紧固件本身以十字形等符号表示（另见G3b符号卡）。"]
variants = ["孔Ø13", "螺栓M12×50", "铆钉Ø12×50", "数量前缀n×", "等距 n×间距"]
dxf_forms = ["LEADER/MLEADER (or LINE + landing) + TEXT/MTEXT such as \"5×M16×45\" or \"10×%%c13\"", "Linear DIMENSION with override text \"4×100\" spanning equally spaced fastener centres", "Fastener symbols as small INSERT blocks (cross, cross with countersink marks) or exploded thick LINEs on member centre lines"]
recognition = "锚点为文本正则：^\\d+\\s?[×xX]\\s?.*(M\\d+\\s?[×xX]\\s?\\d+|(%%c|Ø|φ)\\d+(\\s?[×xX]\\s?\\d+)?)，并有指引线指向一组相同符号之一；统计被标注符号数量与前缀n比对。等距标注：尺寸文本为n×p且n·p≈尺寸总长。与机械零件孔数量标注区分：本类对象为十字符号而非画出的孔圆，常出现在型材/钢结构图；与螺纹标记区分：M12×50中×后为长度（远大于螺距，螺距一般<6）。"
confusions = ["机械零件的孔数量注法（4×Ø10 EQS）：孔为真实画出的圆。", "螺纹标记M12×1.5：×后为螺距；紧固件标记M12×50中×后为长度。", "零件序号：圆圈或横线上的数字，不含规格。"]
related = ["DC-G3-084", "DC-G3-127", "DC-G3-193", "DC-G3-194", "DC-G3-160", "DC-G4-094", "DC-G4-091", "DC-G8-014", "DC-G3-229"]
priority = "low"
text_forms = ["Ø13", "M12×50", "Ø12×50", "5×M16×45", "4×100", "10×Ø13"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 24741.1-2009 第5.3～5.5条（图3～图5）及表1标记示例。该标准面向孔、螺栓、铆钉的符号表示（以钢结构为主）。"
[[concepts.sources]]
document = "GB/T 24741.1-2009"
clause = "5.3～5.5 图3～图5"
page = 6
