[[concepts]]
id = "DC-G9-007"
name = "配作与同钻铰注语"
aliases = ["配作"]
group = "G9"
kind = "note"
meaning = "要求某些孔或结构在与相配零件装配在一起后共同加工的注语，如“配作”“与××同钻铰”“与××零件协调制孔”“配制”；常用于定位销孔和需要对中的轴承孔，相配的两张零件图上都要注明。"
components = ["注在相应孔的尺寸后面或下方，如“2×锥销孔Ø3 配作”“2×Ø5 与泵体同钻铰”。", "也可作为技术要求的一条，说明哪些孔与相配件合在一起加工。", "相配的两个零件（如箱体与箱盖）的零件图对应部位有同样的注语。"]
variants = ["配作", "与××同钻铰"]
dxf_forms = ["DIMENSION or LEADER with attached/override text containing '配作' (e.g. '2×锥销孔%%c3\\P配作')", "two-line MTEXT label: hole specification above the reference line, '配作' or '与××同钻铰' below it"]
recognition = "以文字“配作”“同钻铰”“同钻”“协调制孔”“配制”为锚点：若它与孔尺寸（含%%c、n×、锥销孔）在同一指引线或尺寸文字中，或紧靠在同一基准线的下方，就关联到该孔。注意配作孔常只注基本尺寸，不应判为漏注公差。与普通旁注法孔标注（只有尺寸、深度、沉孔信息）和装配图上的整体装配要求区分。"
confusions = ["尺寸公差：配作孔可能只注基本尺寸，不是漏注公差。", "装配技术要求：在装配图上整体说明；配作注语在零件图具体孔旁。", "旁注法孔标注：只含孔的尺寸信息。"]
related = ["DC-G4-064", "DC-G9-002", "DC-G8-011"]
priority = "medium"
