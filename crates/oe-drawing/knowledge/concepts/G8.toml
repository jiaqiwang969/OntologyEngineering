[[concepts]]
id = "DC-G8-008"
name = "公共指引线"
aliases = []
group = "G8"
kind = "line"
meaning = "一组紧固件（如螺栓、垫圈、螺母）或装配关系清楚的零件组，可以共用一根指引线，在其末端集中注写这组零件的多个序号。"
components = ["一根细实线指引线，从组内某个零件的可见轮廓内以小圆点引出。", "末端形式一：多个序号竖向叠放，每个序号有自己的水平基准线；形式二：几个序号沿同一条水平基准线横排。", "形式三：多个细实线圆竖向叠放或横向并排，每个圆内一个序号；形式四：序号用短划连写，如“1-2-3”。", "组内序号的排列一般与零件由近及远的装配顺序（如螺栓—垫圈—螺母）一致。"]
variants = ["vertical stack of boxed numbers", "numbers along the horizontal line", "vertical stack of circles", "row of circles", "1-2-3 text"]
dxf_forms = ["one LEADER/MLEADER (arrowhead _DotSmall or _Dot) on layer 09 with several stacked TEXT numbers, each over a short horizontal LINE", "stacked or side-by-side CIRCLE + TEXT balloons attached to a single leader LINE (usually exploded, since one MLEADER holds one tag block)", "TEXT '1-2-3' or '-1-2-3' at the end of a single leader", "CAXA/GstarCAD balloons as one INSERT of a 序号 block per number, joined by one leader"]
recognition = "以一条指引线（起点有小圆点、细线、最多折一次）末端附近出现两个及以上序号为锚点：数字字高一致（比尺寸字高大一到两号），竖向叠放时每格间距约为字高的1.5~2倍，或沿同一水平线排列，或多个等大的圆相切叠放；也可能是一个匹配“^-?\\d+(-\\d+)+$”的文字。组内每个序号都应能在明细栏序号列中找到。与表格单元叠放的区别：表格有外框和竖线，公共指引线只在一侧连着一根斜线。"
confusions = ["明细栏或表格行：有完整格线、行数多，不连指引线。", "同一零件多处标注的多个序号：各自有独立的指引线。", "范围文字（如“1~3”或“件号8~13”）：用波浪号，出现在说明文字中，不在指引线末端。", "单个零件序号：末端只有一个数字。"]
