[[concepts]]
id = "DC-G3-146"
name = "凸轮从动杆符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示与凸轮轮廓接触、被凸轮推动的从动杆，按杆端形状分为尖顶、曲面、滚子、平底四种从动杆。"
components = ["从动杆本身为一条粗直线（杆），其一端抵在凸轮轮廓曲线上，另一端接其他构件或导路。", "尖顶从动杆：杆端为尖点朝向凸轮的小三角形，尖点落在轮廓曲线上。", "曲面从动杆：杆端为凸向凸轮的小半圆形头，与轮廓曲线相切。", "滚子从动杆：杆端为两个同心小圆（滚子及其销轴），外圆与轮廓曲线相切。", "平底从动杆：杆端为扁平小矩形，平贴在轮廓曲线顶部。", "在凸轮副中可把从动杆画成横置的杆，端头形状同上，杆的另一端以小圆（回转副）与下一构件相连。"]
variants = ["尖顶从动杆", "曲面从动杆", "滚子从动杆", "平底从动杆"]
dxf_forms = ["Exploded strokes: a thick LINE (or LWPOLYLINE with width 2d in 2013 style) for the rod, ending in a small closed LWPOLYLINE triangle, an ARC cap, two concentric CIRCLEs or a small rectangle, touching the cam outline ARC/SPLINE (layer 01)", "Small CIRCLE at the far end of a horizontal follower for the revolute pair to the next member (layer 01/02)", "INSERT of a kinematic-symbol library block (CAXA/GstarCAD mechanism libraries) containing the same strokes, often scaled"]
recognition = "锚点：机构简图中一条短粗直线（杆）的端点紧贴一条凸的曲线（凸轮轮廓 ARC/SPLINE，通常带点画线十字中心）。按端头判别：闭合小三角形尖点在曲线上→尖顶；小半圆弧凸向曲线→曲面；两同心圆且外圆与曲线相切→滚子；长宽比约3:1的扁矩形贴在曲线上→平底。端头大小与回转副小圆同一量级，远小于凸轮轮廓。上下文：同一视图由单线杆、小圆铰链和轮廓曲线组成，而非投影轮廓。与回转副区分：回转副小圆位于两杆交汇处且旁边没有凸轮曲线；与球与平面副区分：后者是圆落在直线上，没有同心内圆，也不顶在曲线上。"
confusions = ["回转副符号：小圆位于两杆交汇处，附近无凸轮轮廓；滚子从动杆是两同心圆且外圆切于凸轮曲线。", "球与平面副、球与圆柱副：球（圆）落在直线或槽形线上，无内同心圆，不与凸轮曲线接触。", "表面结构或基准三角形：附在尺寸界线、引线上并带文字；尖顶从动杆的三角形位于粗杆末端并顶在曲线上。"]
related = ["DC-G3-147", "DC-G3-158", "DC-G3-157", "DC-G3-155"]
