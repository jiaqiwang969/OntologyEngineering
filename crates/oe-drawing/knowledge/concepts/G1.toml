[[concepts]]
id = "DC-G1-045"
name = "细虚线"
aliases = []
group = "G1"
kind = "line"
meaning = "线宽为细线的虚线，用于不可见棱边线和不可见轮廓线。"
components = ["线型02，线宽约0.5d；画约12d、间隔约3d；手工常用画约3~6 mm、间隔约1 mm。", "CAD 画法使画数为整数、首尾为画；最小长度27d，过短时放大线素；也允许按定长12d 画线。", "与粗实线共线时粗实线画到分界点、虚线留间隙；与其他线相交应在画上。", "CAD 分层04层，屏幕显示黄色。"]
variants = ["线素：画 12d, 短间隔 3d"]
dxf_forms = ["LINE/ARC/CIRCLE with a dashed linetype (HIDDEN, HIDDEN2, DASHED, ACAD_ISO02W100 or a Chinese-named type such as 虚线), thin lineweight, layer 04 / 虚线 / HIDDEN, colour yellow (ACI 2)", "ACAD_ISO02W100 = 12, -3 (true ISO proportions); HIDDEN = 6.35, -3.175; HIDDEN2 = half of HIDDEN", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying", "visible dash length = LTYPE pattern × header $LTSCALE × entity linetype scale (group 48) (× $PSLTSCALE rules in paper space)", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "线型图案只有“画+间隔”交替、没有点，画长约为间隔的2~4倍。若线型丢失而被炸成线段：一串共线短 LINE，长度相等、间距相等（约12d、3d 乘以比例）。按线宽排除粗虚线；按图案排除点线（画极短）与间隔画线（间隔很长，约18d）。"
confusions = ["粗虚线：粗线宽。", "间隔画线：间隔约为画长的1.5倍，机械图不用。", "点线：由点组成。", "焊缝符号中的虚线基准线：与实线基准线平行，属焊接符号。"]
