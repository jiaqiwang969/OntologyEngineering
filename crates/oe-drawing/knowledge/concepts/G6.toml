[[concepts]]
id = "DC-G6-031"
name = "材料比（支承率）参数的注写"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "材料比（支承率）要求的写法：参数代号后用圆括号给出截面高度（必要时连同参考水平），再写百分数极限，如L Rmr(-0.5) 80%；通常作为下限值。"
components = ["括号内为相对参考水平的截面高度（μm，低于参考水平为负）；参考水平为材料比曲线最高点0%时不写。", "参考水平非0%时写在括号前项（以%计），如Rmr(5%, -0.2) 70%。", "ISO 21920-1草案：材料比参数无缺省设置，须另加/Scn或/-嵌套指数（如/Sc2、/-0.8）；逆参数Rdc(p,q)给出高度差。", "区域法（GB/T 33523.1 B.4）：Smr([参考值] 带符号c值) 数值%，如L S-F 0.008-RG2.5/Smr(5%,-0.2) 60%。", "GB/T 1031：Rmr(c)取值10%–90%，c用μm或Rz的百分数；1993版写作tp（另见卡）。"]
variants = ["ISO 21920-1 draft D.6-D.13 (Rmr, inverse Rdc(p,q))", "GB/T 33523.1 B.4 Smr([reference c] signed c) value %", "GB/T 1031: Rmr(c) values with section level c in µm or % of Rz", "GB/T 131-1993: tp form under the line (separate entry)"]
dxf_forms = ["TEXT 'L Rmr(-0.5) 80%/-0.8' under the bar", "'%' possibly entered as '%%%' in TEXT; parentheses as normal characters", "areal form in one long TEXT/MTEXT with 'S-L'/'S-F' prefix"]
recognition = "词法：Rmr、Smr或Rdc后紧跟圆括号，括号内为一个或两个以逗号分隔的数（可带%和正负号），括号后空格接带%的数值（Rdc后为μm数值）；常以L开头并以/Scn或/-数结尾。区分把括号内高度误读为公差、注释中的百分数和Rmr与Rmax。"
confusions = ["括号内截面高度：不是尺寸公差", "注释中的百分数：不在符号上", "Rmr与Rmax：前者带括号和百分数"]
related = ["DC-G6-061", "DC-G6-029", "DC-G6-055", "DC-G6-020", "DC-G6-075", "DC-G6-074", "DC-G6-073"]
priority = "rare"
text_forms = ["L Rmr(-0.5) 80% / -0.8", "L Rmr(5%, -0.2) 70% / Sc2", "L Rdc(60%) 1.8 / -2.5", "L S-L 0.008-2.5/Smr(-0.4) 70%"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Draft forms are from ISO 21920-1 draft annex D (not final)."
