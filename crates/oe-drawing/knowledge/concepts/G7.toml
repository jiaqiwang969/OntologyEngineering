[[concepts]]
id = "DC-G7-141"
name = "箭头线"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "焊缝符号的箭头线：一条细实线，一端带箭头直接指向接头（指向的一侧为“箭头侧”，相对的一侧为“非箭头侧”），另一端与基准线一端成角相连；可从基准线左端或右端引出，标注位置受限时允许折弯一次。"
components = ["箭头：实心箭头，落在焊缝或接头处。", "斜线：与基准线成一定角度（不与基准线共线）。", "连接端：基准线的左端或右端。", "折弯：最多一次。"]
variants = ["from the right end of the reference line", "from the left end of the reference line", "bent once (one kink)"]
dxf_forms = ["LEADER entity with arrowhead, 2–3 vertices (one bend allowed), last vertex on the reference line end", "LINE + SOLID/closed filled LWPOLYLINE arrowhead in exploded form", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes"]
recognition = "锚点为末端实心箭头落在零件轮廓（接缝、角点）上的细实线，另一端与焊缝基准线端点重合；折点不超过一个。由此确定箭头侧：箭头所触轮廓一侧的板/表面为箭头侧。区分尺寸线箭头（两端箭头、配尺寸界线）和其他注释引线（另一端接文字、√或框格）。"
confusions = ["尺寸线箭头。", "表面结构或注释引线：另一端接√或文字。", "装配图序号指引线：末端圆点（有时为箭头）并连序号。", "剖切方向箭头：配剖切符号与字母。"]
