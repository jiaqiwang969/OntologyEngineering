id = "fields_and_datums"
title = "各格内容与基准"
distinguishing = "读第二格与基准格"
encodings = ["block", "loose"]
tests = ["frame_fields_name_value_zone_and_datums"]
[[cards.variants]]
id = "outline_dividers"
title = "外框加竖线分格"
distinguishing = "一个闭合外框与贯通全高的竖线"
encodings = ["loose", "block"]
tests = ["frame_drawn_as_outline_with_dividers"]
[[cards.counter_examples]]
statement = "只有一个基准格的框格不是基准体系"
test = "single_datum_frame_is_not_a_datum_system"
[[cards.parameters]]
name = "outline_aspect_min"
value = 1.5
meaning = "外框宽高比下限（单格方框不再分格）"
[[cards.parameters]]
name = "divider_join"
value = 0.06
meaning = "分格竖线两端到外框上下边的容差 = 该值 × 框高"
[[cards.parameters]]
name = "dimension_alignment"
value = 0.3
meaning = "指引线箭头（或基准符号连线）与尺寸线对齐的横向容差 = 该值 × 字高：对齐时所指的是尺寸要素的导出要素，框格与基准符号随该尺寸所在视图（GB/T 1182 8.2）"
[[cards.lexicon]]
concept = "DC-G5-089"
entry = "prefix"
values = ["Ø", "SØ"]
meaning = "公差带形状符号"
[[cards.lexicon]]
