[[sources]]
id="nx2412_stepped_explicit_bodies"
identity="Installed NX2412 uf_modl.h dfc277d0e465de943e548c5ec4c435a1f36f716a91b5f5ca75c7a25d8869d8d4: UF_MODL_ask_feat_body, UF_MODL_unite_bodies, UF_MODL_ask_face_body, UF_MODL_ask_face_edges."
role="Vendor declarations for explicit feature/body/face/edge operations; native qualification separate"
applicability="NX2412 owned mm/+Z solids only; headers remain private"

[[constraints]]
id="nx_stepped_source_native_geometry"
requirement="req_engineering"
module="nx_worker"
check="check"
rust_path="crates/oe-nx-worker/src/geometry/stepped_shaft.rs"
statement="Explicit create/inspect stepped action schema; strict bounded actual intent bytes SHA before any native call. New body per segment, resolve feature body and explicitly unite only distinct owned solids. Complete single-body and face inventory, exact bounds, all 2*n full circles via existing complete edge owner/queries, face-to-edge links, n cylindrical regions, n+1 caps/shoulders, no extra/unassigned edges, actual volume and surface area. Save and reread, source stability and distinct-process reopen each retain original identities; no physical adoption."
severity="error"

[[validations]]
id="nx_stepped_shape_positive"
module="nx_worker"
constraint="nx_stepped_source_native_geometry"
behavior="stepped_complete_synthetic_shape_matches_frozen_intent"
rust_path="crates/oe-nx-worker/tests/stepped_shaft.rs"
oracle="Synthetic A fixture from preimplementation dimensions, hand-derived rim and face adjacency, area/pi1542 and volume21262.29907949572. Geometry match remains not_assessed for manufacturing."
scope="Local synthetic geometry only; not actual native output"

[[validations]]
id="nx_stepped_shape_negative"
module="nx_worker"
constraint="nx_stepped_source_native_geometry"
behavior="stepped_face_edge_corruption_cannot_hide_behind_correct_mass_and_bounds"
rust_path="crates/oe-nx-worker/tests/stepped_shaft.rs"
oracle="Wrong cylindrical or shoulder adjacency, false/partial face queries, foreign/duplicate tags, wrong axes/types, missing faces, mass identity and source errors refuse. Invalid source must fail before any native call."
scope="Software negative controls; Windows build and current native create/save/fresh-process reopen separate"

[[validations]]
id="nx_stepped_local_plan_source"
module="cad"
constraint="nx_stepped_source_native_geometry"
behavior="stepped_plan_binds_actual_source_and_rejects_prefixed_member"
rust_path="crates/oe-cad/tests/stepped_shaft.rs"
oracle="Local plan binds exact file bytes and unprefixed intent member into generated parameters; execution not_run, no network or CAD."
scope="Local source planning and CLI path; native qualification not inferred"
