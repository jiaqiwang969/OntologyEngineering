components = ["小径：Ø+公称值+公差带代号，外花键常加Ⓔ", "大径：Ø+公称值+H10（内）或a11（外）", "键（槽）宽：键数×宽度+公差带代号+EQS，如 6×7H11 EQS", "位置度：键宽对基准轴线的位置度框格（如 Ø0.015 A）", "表面结构：小径Ra0.8，键侧Ra3.2/0.8，大径Ra6.3/3.2等"]
