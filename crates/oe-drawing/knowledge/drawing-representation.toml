title = "视图与剖切标注"
meaning = "向视图在投射方向处画箭头并注字母，在视图上方注同一字母（旧版写“X向”）；剖视图、断面图用剖切符号（剖切位置处的粗短画、投射方向箭头和字母）表示剖切位置，在视图上方注“X—X”；局部放大图和不按原比例画的视图在名称下或旁注比例。"
sources = [
  "GB/T 4458.1-2002 机械制图 图样画法 视图 5.7",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 6、8",
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图 3.6、8",
  "GB/T 14690-1993 技术制图 比例 5.2",
  "机械制图（第7版）§7-1、§7-2",
]
knowledge_units = ["K11", "K13"]
recognition = "剖切符号：在已识别的“箭头+字母”投射方向标注的箭尾处，找一条与箭杆垂直、长约 1～4 倍字高的短线，即剖切位置的短画。剖视名称：一行文字为“字母—字母”（两字母相同），可再接比例。视图名称带比例时比例写在名称之下或之后。"
markers = ["—", "-", "向"]
concepts = ["DC-G2-043", "DC-G1-007", "DC-G2-072", "DC-G2-065", "DC-G2-068", "DC-G1-115", "DC-G2-015", "DC-G2-016"]

