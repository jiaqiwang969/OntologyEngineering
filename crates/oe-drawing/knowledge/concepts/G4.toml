recognition = "锚点：DIMENSION或尺寸文字的内容是单个或少数字母（非数值，且非R/Ø/C等前缀）。在图纸其他位置寻找一张表格，其表头包含这些相同字母；表格每行首列为变型代号，其余为数值。两者字母集合一致即判定为表格图。与明细栏区分：明细栏表头是序号、代号、名称、数量、材料；与标题栏区分：位于右下角固定格式；与参考尺寸或理论正确尺寸区分：后者为括号或方框中的数字。"
