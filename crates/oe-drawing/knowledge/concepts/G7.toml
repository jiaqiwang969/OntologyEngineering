[[concepts]]
id = "DC-G7-008"
name = "塞焊缝与槽焊缝尺寸"
aliases = []
group = "G7"
kind = "dimension_element"
meaning = "塞焊缝或槽焊缝符号两侧的尺寸：左侧注塞焊孔径d或槽焊槽宽c，右侧注塞焊的孔数×(间距) n×(e) 或槽焊的段数×槽长(间距) n×l(e)；孔或槽带斜边时注其底部尺寸。"
