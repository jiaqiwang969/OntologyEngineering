group = "G2"
kind = "view"
meaning = "把机件的部分结构用大于原图形的比例画出的图形；被放大部位在原视图上用细实线圈出，多处时用罗马数字依次标明，放大图上方注相应罗马数字和比例；只有一处时只注比例。"
components = ["放大部位圈：原视图上的细实线圆（或长圆），螺纹牙型、齿轮和链轮齿形除外；多处时用指引线引出罗马数字。", "放大图：可画成视图、剖视或断面，与原图表达方法无关，尽量配置在被放大部位附近，断裂边界用波浪线。", "名称：罗马数字在上、比例在下（中间横线），或只注比例。", "相同或对称部位只画一个；必要时一个部位可用几个图形表达。", "厚度或孔径≤2 mm等细小结构应按比例画，必要时用局部放大图表达。"]
variants = ["单个（只注比例）", "多个（罗马数字+比例）", "several enlargements: Roman numerals I, II, ...", "single enlargement: scale only", "drawn as view, section or cut irrespective of the original", "identical or symmetric regions: one enlargement only", "one region shown by several images", "I/4:1 罗马数字加比例", "单个放大部位只注比例", "多图表达一个放大结构"]
dxf_forms = ["Detail circle: CIRCLE (thin, layer 02 or 09) around the feature; outline LINEs crossing it are often broken at the circle", "Leader LINE/LEADER from the circle to Roman numeral TEXT ('I', 'II', or Unicode 'Ⅰ', 'Ⅱ')", "Detail label: stacked MTEXT ('\\SI^2:1;'), or TEXT 'I' over TEXT '2:1' with a short LINE, or TEXT '2:1' alone", "Detail view: scaled copy of geometry with a SPLINE wavy boundary and HATCH; add-on detail objects may export as blocks"]
recognition = "以细实线圆为锚点：圆内包含原视图的局部轮廓，圆心不在孔轴或螺栓分布圆心上（不是孔或分布圆），圆外有指引线连到罗马数字，或全图只有一处放大。再找罗马数字加比例（或单独比例）的视图名称，其视图簇几何与圈内几何在比例换算后相似（尺寸比≈标注比例/基本比例）。圈线会截断穿过它的轮廓线，截断后的片段仍属原轮廓，不应判为引线。"
confusions = ["孔的圆或螺栓分布圆：圆心在孔轴上，配中心线。", "向视图字母、剖视名称A—A：拉丁字母。", "分区代号：字母加数字。", "局部视图：比例与原图相同。", "螺纹、齿形：规定不圈出。"]
related = ["DC-G2-068", "DC-G2-076", "DC-G2-065", "DC-G1-115", "DC-G3-110", "DC-G7-091", "DC-G1-104"]
priority = "high"
text_forms = ["I", "II", "I 2:1", "II 4:1", "2:1"]
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = ["detail_circle_interruption", "detail_view", "view_representation_facts", "view_mark_targets", "view_member_relations", "view_section_components"]
recognizer = "partial"
seen_on_drawing = ["second"]
expert_checked = false
notes = "已有识别卡 detail_circle_interruption 对应本概念；圈线截断轮廓的现象来自第二张图的专家纠正（一般化表述）。罗马数字编码方式为一般实践。"
