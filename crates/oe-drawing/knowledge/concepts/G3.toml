seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.4-2003 第5.1、5.2条（图1）及教材图8-39；2 mm为图上尺寸界限。DXF存储形式与生成器输出为一般CAD实践。图层名在实际文件中常为命名层（粗实线/细实线/中心线/虚线/剖面线/尺寸线/文字，CAXA导出为0层、中心线层、虚线层、细实线层、尺寸线层、剖面线层），GB/T 14665编号层仅为参照；识别应以线型+线宽+几何为主。"
