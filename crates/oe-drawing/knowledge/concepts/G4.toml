[[concepts]]
id = "DC-G4-083"
name = "共用尺寸线的同心圆（台阶孔）直径注法"
aliases = []
group = "G4"
kind = "simplified_representation"
meaning = "一组同心圆或尺寸较多的台阶孔，其直径用一条共用的尺寸线和依次排列的箭头表示，数值按顺序写成 Ø60,Ø100,Ø120 之类的序列，代替逐个标注直径。"
components = ["共用尺寸线：细实线，在圆视图中沿一条径向/直径方向穿过各同心圆，在非圆视图中跨过各级台阶孔壁", "多个箭头：尺寸线与每个圆（或每级孔壁）相交处各画一个箭头，箭头数与数值个数相同", "数值序列：带Ø前缀的多个直径用逗号分隔，按箭头顺序注写在尺寸线一端的上方或引出段上", "简化前形式：每个圆或每级台阶单独一个直径尺寸"]
variants = []
dxf_forms = ["exploded LINE dimension line with several SOLID/arrow INSERT terminators on concentric CIRCLEs or stepped bore edges", "single TEXT/MTEXT with repeated %%c, e.g. '%%c60,%%c100,%%c120' (or Φ/φ typed as text)", "one diameter or linear DIMENSION with override text listing all values plus hand-drawn extra arrows", "layer 08 or the template dimension layer"]
recognition = "锚点：单个文字实体中出现两个及以上Ø（%%c、Φ、φ、\\U+2205、U+00D8）数值，并以逗号分隔。追踪相连细实线：在圆视图中它应通过同一圆心并依次与若干同心CIRCLE相交；在剖视中应依次跨过多级平行孔壁轮廓线。每个交点处有箭头，箭头数=数值个数，且从中心到交点距离×2（或孔壁间距）按比例与数值对应。与同心圆弧半径序列区分：前缀为R、尺寸线从圆心单向引出；与n×Ø区分：无乘号、数值互不相同。"
confusions = ["同心圆弧半径序列：前缀R，只单侧有箭头", "单个直径尺寸：一个数值、两端箭头", "n×Ø重复要素：同值多件，用乘号", "螺纹或孔的旁注文字：含M、↧、⌴等符号并在指引线基准线上"]
