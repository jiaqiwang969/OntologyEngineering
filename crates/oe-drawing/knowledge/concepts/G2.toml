meaning = "用剖切面局部地剖开机件所得的剖视图：剖开部分与未剖部分以波浪线或双折线分界；被剖结构为回转体时可用其轴线作分界；单一剖切平面位置明确时不必标注。"
components = ["局部剖面区域：只在视图的一部分画剖面线。", "分界线：细实线波浪线或双折线，不应与其他图线重合；波浪线只画在实体上，不穿过空腔或超出轮廓。", "回转体例外：以结构轴线（细点画线）为分界。", "标注：单一剖切平面且位置明显时省略，否则按剖视图标注。"]
