recognition = "锚点为尺寸线端点处的三角形填充（SOLID/实心 HATCH）：一边与尺寸线共线，第三个顶点只偏向尺寸线一侧（偏距约 d/2~d，长度≈6d）；完整实心箭头则关于尺寸线对称。也可能是从端点向一侧伸出、与尺寸线成小角度的一条短线。识别为单边箭头后按普通尺寸处理。与对称机件单箭头尺寸区分：后者一端是完整箭头、另一端无终端；与斜线终端区分：斜线成45°、长≈h、跨过尺寸线两侧。"
confusions = ["完整实心箭头：关于尺寸线对称的填充三角", "对称机件只画一个箭头：一端完整箭头，另一端越过中心线后无终端", "斜线终端：45°短斜线跨尺寸线两侧", "指引线折线端头：属于指引线而非尺寸线"]
