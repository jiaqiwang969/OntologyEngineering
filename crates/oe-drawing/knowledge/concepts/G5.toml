[[concepts]]
id = "DC-G5-003"
name = "单一基准"
aliases = []
group = "G5"
kind = "datum"
meaning = "由一个要素建立的基准：公差框格只有三格，第三格内写一个基准字母，表示公差带只相对这一个基准有方向或位置约束。"
components = ["三格框格：特征符号格、公差值格、基准格；基准格内一个大写字母，可后随 Ⓜ/Ⓛ/Ⓟ 或方括号修饰符", "图上同字母的基准符号（方框字母+三角形，旧图为圆圈字母+粗短横线）贴在基准要素上"]
variants = []
dxf_forms = ["TEXT/MTEXT single capital letter centred in the third cell (cell width ≈ letter width + 2 gaps)", "TOLERANCE entity string with exactly one datum field after the second %%v", "INSERT of a frame block with one datum ATTRIB; or exploded LINE/LWPOLYLINE cells + TEXT"]
recognition = "以已识别的公差框格为锚（见 DC-G5-090）：恰有三格，第三格只含一个字母（可后随修饰符），且图上存在同字母的基准符号。第二格里的字母（CZ、G、Ⓜ 等）是修饰符，不计为基准。"
confusions = ["公共基准：同一格内多个字母用连字符相连", "基准体系：框格有第四、第五格", "第二格中的修饰字母（CZ、SZ、G、N 等）不是基准", "两格框格（形状公差）没有基准"]
related = ["DC-G5-002", "DC-G5-004", "DC-G5-009", "DC-G5-090"]
priority = "high"
text_forms = ["A", "B", "AⓂ", "// 0.05 A"]
knowledge_units = ["K23", "K24", "K25"]
recognition_cards = ["gdt_frame_content"]
recognizer = "card"
