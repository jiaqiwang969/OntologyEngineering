variants = ["固体材料 (hatch; metal/common brick single hatch; non-metal crosshatch)", "液体材料 (horizontal dashes)", "气体材料 (rows of small circles)", "legend on the drawing", "CAD section-symbol library (GB/T 26099.4 7.4)", "线圈绕组元件", "叠钢片", "型砂/粉末冶金/砂轮/陶瓷/硬质合金刀片", "玻璃及透明材料", "木材纵剖面/横剖面", "木质胶合板", "混凝土", "钢筋混凝土", "砖", "格网", "液体", "基础周围的泥土"]
