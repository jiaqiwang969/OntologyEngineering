recognition = "锚点为只由单根粗实线组成的网络：端点处多线汇交（节点度≥3），构件线之间无平行双线，拓扑为三角形桁架或矩形框架；每段杆件旁有一个与杆件平行的数值（对齐尺寸或文本），常为整十/整百毫米，部分数值带括号表示封闭环。与机构运动简图区分：机构简图有运动副小圆、滑块方框和机架短斜线；与管路单线图区分：管路图有管件、阀门符号、流向箭头和管径标注；与钢筋单线图区分：钢筋带弯钩并位于混凝土轮廓内。"
