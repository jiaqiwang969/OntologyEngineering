    anchor_before: "## 3.6 "
    prompt: 俯视圆桌分成六个扇区，每个扇区一把椅子；桌外一条五档刻度尺环绕，从紧贴到远离；其中两把椅子间距过近，被琥珀色弧线标出。
    labels: [执行, 产证, 挑战, 评审, 担险, 授权]
  - id: fig-04-1
    number: 图 4-1
    title: 同一失常，两个情境
    file: ch04-concept-hara/chapter.md
    anchor: 恢复至 §4.2 原图槽位置（替换现存注释块）
    prompt: 左右对开两幅同构画面：同一辆车、同一处转向机构发出同样的波纹符号。左幅在高速道路上，车辆轨迹偏出车道并指向后续碰撞链；右幅在维修工位，车辆静止架起，只有方向盘旁一个旋转符号，无道路链。中缝一条竖直分隔线，两侧不变元素完全一致。波纹符号为琥珀色。
    labels: [高速行驶, 维修工位]
  - id: fig-05-1
    number: 图 5-1
    title: 一笔限时的预算账
    file: ch05-system-development/chapter.md
    anchor_before: "## 5.6 "
    prompt: 一条水平长条代表总时间窗口，内部分成三段（检测、反应、余量），段间有刻度门；下方第二条相同窗口里第一段被拉长、挤压末段越出窗口右缘，越界部分以琥珀色警示。
    labels: [窗口, 检测, 反应, 余量]
  - id: fig-06-1
    number: 图 6-1
    title: 四百个单位的去向
    file: ch06-hardware-development/chapter.md
    anchor_before: "## 6.6 "
    prompt: 一条粗流从左侧进入，向右分成四条宽窄悬殊的支流，各自流入四个容器；最细的一条支流通向的容器被放大镜聚焦，以琥珀色描边。类似桑基图的极简形态。
    labels: [安全侧, 已盯住, 残余, 潜伏]
  - id: fig-07-1
    number: 图 7-1
    title: 左边每一层承诺，右边一层证据对质
    file: ch07-software-development/chapter.md
    anchor_before: "## 7.2 "
    prompt: 一个 V 字形结构，左臂四级台阶下行，右臂四级台阶上行，同高度的左右台阶之间由水平细线两两相连；每条水平线中点一枚小徽章。最下方谷底一块基石。其中一条水平线的徽章为琥珀色。
    labels: 无文字
  - id: fig-08-1
    number: 图 8-1
    title: 两条通道，一棵电源树
    file: ch08-asil-decomposition-dfa/chapter.md
    anchor_before: "## 8.4 "
    prompt: 上方两条并行的功能通道各成一列模块；向下延伸的供电线逐级汇聚，最终汇于同一个电源模块；该模块另有一条细控制线回连到左侧通道，形成不对称。汇聚点与控制线为琥珀色。
    labels: [主通道, 监控通道, 同一上游]
  - id: fig-09-1
    number: 图 9-1
    title: 三层身份，一件一账
    file: ch09-production-operation/chapter.md
    anchor_before: "## 9.3 "
    prompt: 纵向三层：顶层一张图纸（单一）、中层三只料箱（批次）、底层多颗零件（单件），层间由细线扇形展开；底层其中一颗零件下方展开一条带节点的时间线。该零件与其时间线为琥珀色。
    labels: [设计定义, 批次, 单件]
  - id: fig-10-1
    number: 图 10-1
    title: 主张在上，证据在下，中间的论证没人写
    file: ch10-supporting-processes/chapter.md
    anchor_before: "## 10.3 "
    prompt: 三层金字塔式结构：顶层一块横幅（主张），底层一排整齐卡片（证据），中间层是一片明显的空缺，只有几条虚线试图连接上下。空缺层以琥珀色虚线框标出。
    labels: [主张, 论证, 证据]
  - id: fig-11-1
    number: 图 11-1
    title: 从一句话到三元组
    file: ch11-claim-ontology/chapter.md
    anchor_before: "## 11.3 "
    prompt: 左侧一张分成七格的卡片；右侧同样内容化作七条“点—线—点”的哑铃形结构，纵向排列整齐；一条从卡片格到哑铃的过渡箭头。其中一格与其对应哑铃为琥珀色。
    labels: 无文字
  - id: fig-12-1
    number: 图 12-1
    title: 三族对象，三种判据
    file: ch12-identity-ontology/chapter.md
    anchor_before: "## 12.3 "
    prompt: 三个并排的展台：左台一颗零件下方接一条环环相扣的履历链；中台一份文件下方接一枚指纹状纹样；右台一个组合方块下方接一组卡合的拼图。三种判据图形各不相同，互不通用。中台指纹为琥珀色。
    labels: [物理单件, 软件工件, 产品候选]
  - id: fig-13-1
    number: 图 13-1
    title: 距离量出来，授权带日期
    file: ch13-governance-ontology/chapter.md
    anchor_before: "## 13.5 "
    prompt: 左半部分：两个人形圆点之间的路径上叠着一把刻度尺；右半部分：一条连接人与印章的边上挂着一枚日历小牌。刻度尺短档与日历牌为琥珀色。
    labels: 无文字
  - id: fig-14-1
    number: 图 14-1
    title: 事件由两样东西组成，三把尺子各要各的证据
    file: ch14-context-hazard-ontology/chapter.md
    anchor_before: "## 14.3 "
    prompt: 中央一个菱形节点由左右两个圆节点合成（失常×情境）；菱形向下分出三条边，各自连着一把小尺子，每把尺子下再挂一种不同形状的证据图形（十字、曲线图、人形）。三把尺子中一把为琥珀色。
    labels: [失常, 情境, 事件]
  - id: fig-15-1
    number: 图 15-1
    title: 连线要带理由，分配要等确认
    file: ch15-requirements-ontology/chapter.md
    anchor_before: "## 15.4 "
    prompt: 两列节点之间的多条连线，每条连线中点都嵌着一枚小圆牌（理由对象）；其中一条连线的圆牌空缺，线呈虚线且下垂；另一条线末端有一枚未合上的搭扣（待确认）。空缺与搭扣为琥珀色。
    labels: 无文字
  - id: fig-16-1
    number: 图 16-1
    title: 分母不是一个数，是一份名单
    file: ch16-measurement-ontology/chapter.md
    anchor_before: "## 16.3 "
    prompt: 一条分数横线上方一个小方块（分子），下方不是数字而是一张展开的清单卷轴，卷轴上一排小图形逐项排列，末项旁有一枚核对印章。卷轴边缘为琥珀色。
    labels: 无文字
  - id: fig-17-1
    number: 图 17-1
    title: 每张“通过”交代自己的世界
    file: ch17-change-ontology/chapter.md
    anchor_before: "## 17.4 "
    prompt: 两组六边形蜂窝各代表一个快照（其中一格颜色不同），两组之间一条具名的桥形边；下方三张卡片各由细线锚定到某一组蜂窝，其中一张卡片的锚线断开并挂出一面小旗（过期待判）。小旗为琥珀色。
    labels: 无文字
  - id: fig-18-1
    number: 图 18-1
    title: 查过的缝是分母，排除押着事实
    file: ch18-dependency-ontology/chapter.md
    anchor_before: "## 18.4 "
    prompt: 一张由两列模块与多类连线构成的依赖图；图右侧一栏竖排六个小格代表“查过的缝”，其中几格盖了章、一格空白；一枚盖章格由细线拴着下方一块基石（押着的事实），基石出现裂纹。空白格与裂纹为琥珀色。
    labels: 无文字
  - id: fig-19-1
    number: 图 19-1
    title: 八行查询走过的路
    file: ch19-field-ontology/chapter.md
    anchor_before: "## 19.5 "
    prompt: 一条从左到右的追查路径：料箱→批次群→其中部分零件→装车→发运码头，路径上每一跳是一段实线箭头；起点料箱被聚光，未能接通的一跳以虚线加问号示意（未知批次）。聚光与问号为琥珀色。
    labels: 无文字
