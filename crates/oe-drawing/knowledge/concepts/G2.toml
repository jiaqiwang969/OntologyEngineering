[[concepts]]
id = "DC-G2-074"
name = "复斜面的斜视图（换面法两次投射）"
aliases = []
group = "G2"
kind = "view"
meaning = "机件上的复斜面（对各基本投影面都倾斜）或复斜线需连续两次换面：先用斜视图（或斜剖视、相交剖切面）把它变成单斜面或单斜线，再作第二个斜视图得到实形或实角；表示投射方向的箭头平行于所在视图的投影面。"
components = ["第一个斜视图或剖视图：把复斜面变为积聚成线的单斜面，带字母（如A）。", "第二个斜视图：垂直于该单斜面投射，显示实形或实角，带字母（如B）。", "箭头：画在前一视图上，方向平行于该视图的投影面。", "作图线：确定投射方向的作图线及投影线用细实线。", "用途：复斜面实形、两平面实角、轴线与平面实角、弯管相邻轴线实角。"]
variants = ["true shape of a compound inclined face (5.2, 5.3 via intersecting cutting planes)", "true angle between two planes (6.1-6.2)", "true angle between an axis and a plane (7.1-7.2)", "true angle between adjacent bent-tube axes, views C and D (8.1-8.2)"]
dxf_forms = ["Chained view clusters each with a single-letter TEXT label; arrows (LWPOLYLINE/SOLID) at oblique angles; thin construction LINEs (layer 02/08)"]
recognition = "以视图链为锚点：第二个斜视图的箭头位于第一个斜视图内，第一个斜视图的箭头位于基本视图上，两次箭头均倾斜；识别出链后，最终视图上的尺寸和角度按实形、实角对待。"
confusions = ["普通斜视图：一次换面。", "向视图：箭头平行于坐标轴。"]
related = ["DC-G2-080", "DC-G2-021", "DC-G2-072", "DC-G1-027"]
priority = "rare"
text_forms = ["A", "B", "C", "D"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "附录B（换面法）理论部分无独立画法。"
