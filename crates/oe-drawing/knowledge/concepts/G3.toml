[[concepts]]
id = "DC-G3-171"
name = "摩擦轮符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中单个摩擦轮的符号：用一条代表轮辐平面的直线加上代表摩擦表面的直线表示，分圆柱轮、圆锥轮、曲线轮、冕状轮和挠性轮。"
components = ["圆柱轮：粗轴线与一条垂直的轮辐线相交，轮辐线端部接一条只向一侧伸出、与轴平行的短线（摩擦面），形成拐角。", "圆锥轮：端部摩擦面短线倾斜；曲线轮：摩擦面画成圆弧；冕状轮：一条长横线（轮面）与其中部垂直的粗轴线组成 T 形。", "挠性轮：轮辐线中段带两个半圆凸起，两端再接摩擦面短线。", "可用符号：轮子画成矩形、梯形或弧边轮体，内画“×”表示与轴固连。", "绘制摩擦机构时，轮与轴固定连接的符号只需画在其中一个轮上；单线画轮时两轮接触处可留空隙。", "齿轮与摩擦轮的区别在于齿圈线或摩擦面线相对轮辐线的位置不同：摩擦轮的线只在一侧，齿轮的线跨在端部两侧。"]
variants = ["圆柱轮", "圆锥轮", "曲线轮", "冕状轮", "挠性轮"]
dxf_forms = ["Exploded LINE/ARC strokes on layer 01: wheel-plane LINE perpendicular to a thick shaft LINE, short friction LINE or ARC at its ends", "Alternative symbol: LWPOLYLINE rectangle/trapezoid/arc-sided outline with an × of two short LINEs", "INSERT of a library block"]
recognition = "锚点：与粗轴线垂直相交的轮辐线。检查轮辐线两端：端部短线只向一侧伸出（拐角）→摩擦轮；短线居中跨过端点（T 形）→齿轮；端部为圆弧→曲线轮；端部斜线→圆锥轮。端部短线长度明显短于轮辐线（约为其几分之一）。与“工”字形的工字钢符号区分：后者是文字标记中的独立小符号，后接尺寸，不被粗轴线贯穿。"
confusions = ["齿轮符号（不指明齿线）：端部短线居中跨在轮辐线两侧。", "带轮或宝塔轮可用符号：同为带“×”的轮体，但成对出现并有带线相连或呈阶梯轮廓。", "型钢图形符号（如工字钢、槽钢）：出现在材料标记文字中，不与轴线组合。"]
