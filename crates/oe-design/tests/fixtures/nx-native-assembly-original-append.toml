

# Exact parameter-preload failure recovery, separate from NX assembly qualification.
[[types]]
name = "NxNativeParameterGuardScope"
meaning = "旧单part参数预算准入失败的新增独立审查范围，非原生能力或第二事实库"
identity = "原root/job/dispatch/完整源码、文件ID、实际worker/supervisor退出及原unknown字节；/1-/2不扩权"
[[types.fields]]
name = "schema"
meaning = "参数准入审查类型版本"
rust_type = "String"
required = true
format = "typed"
unit = "非几何；精确身份和原程序错误"
precision = "原字节与无隐式scope映射"
write = "agent源绑定独立审查；Rust重核实际OS事实"
applicability = "精确旧import_step_bodies budget1..128的native前准入失败"
acceptance = "新scope只允许新任务写者准入，不改旧unknown或宣称原生/工程成功"
allowed_values = ["oev2.nx-native-parameter-guard-scope/1"]
[[types.fields]]
name = "review_schema"
meaning = "明确新增的/3审查版本"
