name = "纤维方向和轧制方向"
aliases = []
group = "G3"
kind = "symbol"
meaning = "材料的纤维方向和轧制方向一般不必示出，必要时用两端带箭头的细实线表示；轧制方向的双箭头画在由指引线引出的基准线处。"
components = ["纤维方向：在零件视图轮廓内画一条两端带箭头的短细实线，箭杆方向即纤维方向。", "轧制方向：用一端为圆点的指引线从零件表面引出，接一段短基准线，在基准线端部画一条两端带箭头的细实线表示方向。", "双箭头线上不注数字，两端也不抵住尺寸界线。"]
variants = ["纤维方向: double arrow on the surface", "轧制方向: double arrow on a leader"]
dxf_forms = ["LINE on layer 02 with arrowheads at both ends as SOLID or tapered LWPOLYLINE, or a LEADER-type object with two arrow ends", "Rolling direction: LEADER/MLEADER with dot terminator plus reference LINE and the double-arrow LINE, sometimes one block", "Optional TEXT such as 纤维方向 or 轧制方向 on layer 11"]
recognition = "以两端都有箭头、两端都不落在尺寸界线或轮廓线上、且线上无数字的孤立短细实线为锚点：位于零件轮廓内部判为纤维方向；与圆点终端指引线及短基准线相连判为轧制方向。与尺寸线区分：尺寸线两端箭头抵住尺寸界线或轮廓，中部或上方有数字；与运动方向箭头区分：后者在机构简图中多为单箭头或带停留符号。"
confusions = ["尺寸线：两端箭头抵住尺寸界线或轮廓，带尺寸数字。", "视图投射方向箭头：单箭头并配字母。", "运动方向或往复运动符号：出现在机构简图中，常带停留短线。"]
related = ["DC-G1-076", "DC-G1-095", "DC-G1-018", "DC-G3-199", "DC-G3-165"]
