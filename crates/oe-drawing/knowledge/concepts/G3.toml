[[concepts]]
id = "DC-G3-112"
name = "圆角省略（全部铸造圆角R×）"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "除确实需要表示的结构圆角外，零件图中其他圆角（铸造、锻造圆角或小圆角）可以不画，但必须注明尺寸或在技术要求中统一说明，如“全部铸造圆角R5”。"
components = ["视图：被省略的圆角处画成尖角，两轮廓线直接相交。", "尺寸方式：用指引线集中注出，如“2×R1”，或与倒角并列，如“C1 R1”。", "说明方式：在图上或技术要求中写“全部铸造圆角R5”“未注圆角R2”等。", "需要表示的圆角仍按圆弧画出并标注。"]
