[[concepts]]
id = "DC-G3-030"
name = "毛坯图与完工零件的相互表示"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在毛坯图（铸件、锻件图）上用细双点画线画出加工完成后的零件形状，或在完工零件图上用细双点画线画出毛坯形状，用来交代加工余量和加工部位。"
components = ["本图对象（毛坯或成品）的轮廓用粗实线，另一状态的轮廓用细双点画线叠画在同一视图上。", "两条轮廓大部分平行，间距为加工余量；不加工的表面处两轮廓重合（只见粗实线）。", "细双点画线围成的区域不画剖面线，一般不单独标注尺寸，必要时注参考尺寸。"]
variants = ["finished shape on blank drawing", "blank shape on finished-part drawing"]
dxf_forms = ["LINE/ARC/LWPOLYLINE with PHANTOM / ACAD_ISO05W100 (or CAXA 双点画线) linetype, thin lineweight, layer 07 细双点画线 or named 假想线/双点画线 layer", "phantom chain offset from the thick (layer 01) outline by the machining allowance; HATCH boundaries follow the thick outline only", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "以细双点画线轮廓链为锚点：它与同一视图的粗实线轮廓大段平行、等距（间距为加工余量，通常仅为零件尺寸的百分之几或数毫米），在非加工面处与粗实线重合或断开。双点画线在粗实线外侧包络＝完工零件图上的毛坯形状；在粗实线内侧＝毛坯图上的成品形状。双点画线区域内无HATCH。与相邻辅助零件区分：后者只在接触面贴靠主体、其余部分落在主体外且形状与主体无关；与运动件极限位置区分：后者与某个粗实线零件全等，只是平移或转动；与初始轮廓区分：后者是成形（弯折）前的形状，拓扑和角度与成品不同，而非等距偏移。"
confusions = ["初始轮廓（成形前轮廓）：表示弯曲、冲压前的形状，与成品轮廓不是等距偏移关系。", "相邻辅助零件：只在接触处与主体相邻，不包络也不内含于主体轮廓。", "运动件极限位置：双点画线形状与某零件全等，仅位置不同。", "剖切平面前的结构：落在剖视图中表示已被假想移去的结构，不与主体等距。"]
related = ["DC-G1-031", "DC-G1-042", "DC-G3-010", "DC-G3-038", "DC-G3-011", "DC-G1-013"]
priority = "low"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
