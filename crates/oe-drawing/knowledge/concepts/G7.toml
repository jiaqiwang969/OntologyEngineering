[[concepts]]
id = "DC-G7-046"
name = "分模面（分型线）图形符号"
aliases = []
group = "G7"
kind = "symbol"
meaning = "模制件图上表示两个模具之间分模面（分型线）的图形符号：在分型线上、零件轮廓外侧画一个菱形；一半涂黑一半空心时，实心一侧代表固定模具零件、空心一侧代表可动模具零件；左上角可加字母C、M、S说明分模面类型。"
components = ["菱形：骑在分型线上，位于零件轮廓之外。", "半涂黑变体：菱形一半实心（固定模）、一半空心（可动模）。", "类型字母：符号外左上角写C（芯骨处分模面）、M（主要分模面）、S（滑块分模面）。", "分型线：视图中为粗实线，剖视中为粗点画线。"]
variants = ["plain", "fixed/moving half-filled", "with type letter C/M/S", "special parting types (图3)"]
dxf_forms = ["closed LWPOLYLINE rhombus (4 vertices) centred on a LINE that extends beyond the part outline; half filled with HATCH SOLID or SOLID triangle", "single-letter TEXT 'M'/'C'/'S' at its upper-left", "INSERT of a parting-line symbol block"]
recognition = "锚点为位于零件轮廓外、被一条直线（分型线）穿过两对角的小菱形（对角线约1～1.5倍字高），可能半涂黑；向内延伸的同一直线即分型线。与剖切符号区分：剖切符号是短粗线段加箭头和字母，没有菱形；与基准三角形区分：基准为三角形连方框字母。"
confusions = ["剖切符号：粗短线、箭头和字母。", "基准符号：涂黑或空心三角加方框字母。", "焊缝符号：在带箭头指引线的基准线上，不骑在分型线上。", "装配中的菱形或方框标记：无分型线穿过。"]
