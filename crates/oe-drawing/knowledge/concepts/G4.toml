[[concepts]]
id = "DC-G4-058"
name = "尺寸界线"
aliases = []
group = "G4"
kind = "line"
meaning = "限定所注尺寸起止范围的细实线，从图形的轮廓线、轴线或对称中心线引出，尺寸线的终端落在其上。"
components = ["线型：细实线（GB/T 4457.4 代码01.1的用途之一），由轮廓线、轴线或对称中心线处引出", "方向与长度：一般与尺寸线垂直，并超出尺寸线终端约2mm；CAD中靠轮廓一端常留小间隙", "替代：可直接用轮廓线、轴线或对称中心线作尺寸界线", "倾斜：尺寸界线贴近轮廓不清晰时允许倾斜，但一对尺寸界线仍互相平行", "光滑过渡处：先用细实线把两轮廓延长到交点，再从交点引出尺寸界线", "曲线坐标：可把尺寸线或其延长线当作尺寸界线"]
variants = ["drawn from contour / axis / symmetry centre line", "contour or centre line used directly as extension line", "oblique extension lines when perpendicular ones would be crowded (4.1.3)", "倾斜的尺寸界线", "以轮廓线/轴线代尺寸界线"]
dxf_forms = ["inside the DIMENSION anonymous block (*Dn): two LINE entities from defpoints 13/14 to the dimension line, extended by DIMEXE (~2 mm) and offset by DIMEXO", "after EXPLODE: LINE entities on layer 08 or template dimension layer, thin lineweight (e.g. 0.18–0.25 mm or ByLayer)", "oblique extension lines: DIMENSION with oblique angle (code 52 / DIMOBLIQUE) or an exploded parallel LINE pair", "suppressed extension lines (DIMSE1/DIMSE2=1) where a contour or centre line serves directly"]
recognition = "DIMENSION中由定义点13/14直接得到。炸开图以尺寸线为锚：在尺寸线两端寻找细实线段，与尺寸线近似垂直（倾斜注法时两线互相平行而与尺寸线斜交），一端越过尺寸线终端约2mm（约0.5~0.7h），另一端止于轮廓/轴线附近、相接或留0~1mm间隙；线宽为细线（约d/2），通常在尺寸层。与可见轮廓线区分：线宽、图层，以及'只与一条尺寸线和一个要素相交且外端略越出终端'的拓扑；与中心线区分：中心线为点画线并穿过圆心；与指引线区分：指引线单条出现、端部有终端并接基准线文字。"
confusions = ["可见轮廓线：粗实线，构成封闭外形", "被借用作尺寸界线的轴线或对称中心线：线型仍是细点画线", "过渡线、投影连线：细实线但不与尺寸线成对出现", "指引线：单条，一端有箭头/圆点，另一端接基准线文字", "光滑过渡处的轮廓延长线：为求交点而画，与尺寸界线相接但不是同一条线"]
related = ["DC-G4-059", "DC-G4-005", "DC-G4-027", "DC-G1-043", "DC-G1-101", "DC-G1-021"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "rule"
seen_on_drawing = ["development", "second"]
expert_checked = false
notes = "超出终端约2mm取自教材；DIMEXE/DIMEXO/DIMSE1/DIMSE2/斜置角等变量为通用AutoCAD实践。"
