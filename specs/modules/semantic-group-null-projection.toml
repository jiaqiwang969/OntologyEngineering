id="source_variable_original"
identity="Pinned original RDFLib7.6/CPython3.13.11/Semantica observation; SOURCE-VARIABLE-ORIGINAL-01.json SHA256 04897e1b5d024b7ef47b07caebde42a9445bbca3b99120678ff2f8474cd324c1, frozen before production edits."
role="Independent constructors, 64 term pairs with six relations, 80 direct operators, seven Memory actions and 105 original wrapper actions."
applicability="development_replay. Typed value and source-graph receiving do not by themselves receive the entire UPDATE/runtime/snapshot sequence or establish method gain."

[[constraints]]
id="source_variable_value_owner"
requirement="req_semantic_platform"
module="semantic_evaluator"
rust_path="vendor/spareval/src/numeric/source_variable.rs"
check="construct_source_variable"
statement="Store a real source Variable in the existing raw value owner, distinct from an equally spelled RDF term or absent binding. The original constructor removes exactly one leading question mark; empty input raises the original plain Exception while a lone question mark constructs the empty stored name. Native RDF conversion is fallible, never an IRI surrogate. Preserve source identity, hash, object aliases, text and ordering, and every pre-existing RDF Eq/Hash behavior."
severity="error"

[[constraints]]
id="source_variable_transport_owner"
requirement="req_semantic_platform"
module="semantic_evaluator"
rust_path="vendor/spareval/src/dataset/nullable_numeric.rs"
check="externalize_raw"
statement="Read real source objects through the existing sealed backend/session. Verify owner, source identity, object identity and cache/metadata; retain native binding checks when a term has an RDF representation. Variable data must not be forged through an RDF-only backend or turn an actual source-read failure into a cached success. Explicit dataset storage may preserve source Variables; old RDF-only graph-role admission remains. Reject only reached unsupported conversion boundaries, not every query on such data. Default source-query scans use the retained default context; explicit scan_context(None) retains its original union meaning."
severity="error"

