[[concepts]]
id = "DC-G4-044"
name = "型材截面形状符号"
aliases = []
group = "G4"
kind = "dimension_symbol"
meaning = "型材（角钢、槽钢、工字钢等）截面形状用GB/T 4656规定的图形符号或大写字母代号表示，写在规格尺寸之前（如L100×6），用于金属结构图中对构件的简化标记。"
components = ["符号或代号：角钢L、T型钢T、工字钢I、H型钢H、槽钢［（代号U）、Z型钢Z等；棒料用圆、方、扁矩形、六角等图形符号。", "规格尺寸：紧随符号后，各尺寸以×分隔（L100×6、L90×56×7），必要时后接短画和切割长度（-500）。", "位置：靠近构件标注，与构件方向一致；也可填入明细栏。", "GB/T 4458.4图11中与斜线终端尺寸一同出现于结构图。"]
variants = ["angle L, channel, I-beam, tube etc. per GB/T 4656"]
dxf_forms = ["TEXT/MTEXT 'L100×6' or 'L100X6' aligned with the member line", "graphic symbol drawn as small LINE strokes or INSERT of a profile-symbol block before the size text (channel/I symbols are not in standard fonts)", "layer 11 (text) or template text/dimension layer"]
recognition = "锚点为匹配^(L|T|I|H|U|Z|［|\\[)\\s?\\d+([×xX]\\d+){1,2}(-\\d+)?$的文字，靠近单线表示的杆件或型材视图，文字方向与构件平行；所在图常用45°斜线作尺寸终端（结构图）。排除：长度变量L只出现在公式或参数表；螺纹以M开头并带螺距或公差；正方形符号□后只有一个边长数值。"
confusions = ["长度变量L、楔体或圆锥长度L：不跟×分隔的规格尺寸。", "45°倒角C、螺纹M等字母前缀：后接单个数值或螺纹规格。", "正方形符号□：后面只有一个边长。", "明细栏规格列：书写相同，但位于表格中。"]
related = ["DC-G3-098", "DC-G3-195", "DC-G3-180", "DC-G3-162", "DC-G4-021", "DC-G4-085"]
priority = "low"
