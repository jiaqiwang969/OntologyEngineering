recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 17851-2022 rule 1a). GB/T 1182-2018 Annex A.3.8 and A.4.2 list the ambiguous cylinder datum and the symbol attached directly to an axis as withdrawn. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
