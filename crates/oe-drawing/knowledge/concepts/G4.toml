[[concepts]]
id = "DC-G4-089"
name = "对称结构仅注一边的尺寸"
aliases = ["对称结构仅注一边"]
group = "G4"
kind = "simplified_representation"
meaning = "图形具有对称中心线时，对称分布在两侧的相同结构只在其中一侧标注定形尺寸（如 R64、12、R9、R5），另一侧按对称关系理解，不再重复标注。"
components = ["对称中心线：细点画线，贯穿图形", "一侧标注：对称结构之一完整注出其半径、宽度等定形尺寸", "另一侧：镜像结构不注尺寸", "定位尺寸：常以对称中心线为基准注出总距，或用对称机件单箭头形式"]
variants = []
dxf_forms = ["ordinary DIMENSION entities (radius dimtype 4, linear dimtype 0) present only on one side of a centre line", "centre line as LINE on layer 05 / CENTER linetype"]
recognition = "这是“省略”型表达，需推断：先找到贯穿图形的点画线（对称轴），将轴一侧的几何镜像后与另一侧比较（容差内重合）。若某结构在一侧有R或长度尺寸而其镜像结构没有，则判定为仅注一边，并把该尺寸关联到镜像结构。与漏注尺寸区分：镜像几何必须一致，不一致才可能是漏注；与对称机件单箭头尺寸区分：后者尺寸线越过中心线、只有一个箭头、数值为全长。"
confusions = ["漏注尺寸：镜像几何不一致或无对称中心线", "对称机件只画一个箭头的尺寸：尺寸线超过中心线，数值为全尺寸", "对称件注语或对称符号：以文字或两条平行短线明确表示只画一半"]
related = ["DC-G4-015", "DC-G1-021", "DC-G3-161", "DC-G2-036", "DC-G4-014"]
