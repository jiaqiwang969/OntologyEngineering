aliases = []
group = "G1"
kind = "line"
meaning = "用细双点画线画出与本零件相邻、仅为说明安装或工作关系而画出的其他零件的轮廓。"
components = ["细双点画线（No.05.1.1）。", "相邻辅助零件不覆盖主零件，但可被主零件遮挡（被遮部分不画）。", "相邻辅助零件的断面不画剖面线。"]
