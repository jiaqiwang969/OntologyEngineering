[[cards]]
id = "technical_note"
expression_kind = "note"
title = "技术要求注语"
meaning = "技术要求中的标准注语：一般公差（GB/T 1804）与未注几何公差（GB/T 1184）、未注倒角与圆角、铸造圆角、锐边与毛刺、热处理与硬度、其余表面粗糙度、铸件要求等。每条注语对未单独注出的要素统一给出要求。"
sources = [
  "GB/T 1804-2000 一般公差 未注公差的线性和角度尺寸的公差 5、6",
  "GB/T 1184-1996 形状和位置公差 未注公差值 6、附录A",
  "GB/T 24743-2009 技术产品文件 钢铁零件热处理表示法 4.3、4.4、6.7",
  "GB/T 24745-2009 技术产品文件 词汇 表5、表7",
  "GB/T 16675.2-2012 简化表示法 第2部分 4.2.1",
  "机械制图（第7版）§9-4、§9-5、图10-18、图10-22",
  "互换性与测量技术 1.5、3.7.2",
]
knowledge_units = ["K14", "K21", "K33", "K40", "K41"]
recognition = "以技术要求标题下的编号条目为锚，按本卡词表判断条目说的是哪类要求；硬度以“数值+硬度标尺”识别，硬化层深度以 CHD、CD 接数值识别；条目中出现的 C1、R4 等尺寸记号同时按尺寸注写文法命名。条目主题（材料热处理、防护、工艺）的词也来自本卡。"
markers = ["技术要求", "未注", "GB/T 1804", "GB/T 1184", "HRC", "HBW"]
concepts = ["DC-G9-002", "DC-G1-070", "DC-G9-003", "DC-G1-071", "DC-G9-004", "DC-G3-112", "DC-G4-068", "DC-G4-061", "DC-G4-070", "DC-G5-025", "DC-G5-026", "DC-G9-010", "DC-G7-025", "DC-G7-026", "DC-G7-089", "DC-G6-001", "DC-G9-009"]

