[[concepts]]
id = "DC-G4-106"
name = "两点尺寸修饰符 LP"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "LP表示两点尺寸，即在尺寸要素上两相对点之间测得的局部尺寸；它是ISO缺省尺寸特征，通常不注，只有当两极限之一用两点尺寸而另一个不用时才标出。"
components = ["符号：大写字母LP置于长圆形（两端半圆的跑道形）框内，框宽约25d、高约16d，字高10d", "位置：写在公差值、公差代号或对应极限值之后", "使用场合：上、下极限规范不同（如与GX、GN配对）或需明确时"]
variants = ["written only when needed (e.g. with Ⓔ split form or different limits)"]
dxf_forms = ["TEXT 'LP' with a surrounding closed LWPOLYLINE (two straight segments + two bulged arcs) or LINE+ARC strokes", "INSERT of a modifier block containing the stadium frame and attribute/TEXT letters", "MTEXT where the frame is lost and only 'LP' or '(LP)' remains"]
recognition = "锚点：两个大写字母“LP”，被一个闭合长圆框包围（框宽/高≈1.5，高≈1.6倍字高），位于尺寸公差文字右侧同一基线上。框可能是带凸度的LWPOLYLINE或两条LINE+两段ARC。与球面局部尺寸LS区分：字母不同；与注释中的普通“LP”字样区分：后者无框、不紧随公差。"
confusions = ["LS 球面局部尺寸：同框不同字母", "Ⓔ 包容要求：圆形单字母", "普通文字中的LP缩写：无框"]
related = ["DC-G4-137", "DC-G4-100", "DC-G4-104", "DC-G4-115", "DC-G4-136"]
priority = "rare"
