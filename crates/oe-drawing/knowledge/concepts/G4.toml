[[concepts]]
id = "DC-G4-026"
name = "指引线简化注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "简化注法的综合条目（教材对 GB/T 16675.2 表2 5.1~5.3 的归纳）：尺寸线终端可简化为单边箭头；标注尺寸时可用带箭头或不带箭头的指引线把尺寸引出。"
components = ["单边箭头：尺寸线端只画半个箭头", "带箭头指引线：箭头指在要素轮廓上，尺寸写在水平基准线上", "不带箭头指引线：指引线直接终止在轮廓上，尺寸写在基准线上", "尺寸文本：如 n×Ø、EQS 等"]
variants = ["带箭头指引线", "不带箭头指引线", "单边箭头"]
dxf_forms = ["LEADER / MULTILEADER with arrow or with arrow 'none', associated MTEXT", "DIMENSION with a custom half-arrow block", "exploded: LINE + SOLID (half or full triangle) + TEXT"]
recognition = "母概念：分别按子线索识别——单边箭头（单侧半三角填充）、带箭头指引线（斜线+箭头+水平基准线+尺寸文字）、不带箭头指引线（斜线端点直接落在轮廓上）。共同点是尺寸文字写在指引线的水平基准线上而非尺寸线上，且文字有尺寸语义（Ø、R、n×、EQS）。与零件序号指引线区分：序号指引线末端是零件面内的圆点，文字是序号；与注释指引线区分：文字是技术说明而非尺寸。"
confusions = ["零件序号指引线：末端圆点，文字是序号", "注释指引线（技术说明、表面处理）：文字不是尺寸", "几何公差指引线：连接公差框格"]
related = ["DC-G4-008", "DC-G4-023", "DC-G4-004", "DC-G1-028", "DC-G8-009"]
