[[concepts]]
id = "DC-G3-039"
name = "矩形内花键画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "带矩形花键的孔（内花键），在平行于轴线的剖视中大径和小径都画粗实线，并用局部视图画出部分或全部齿形。"
components = ["轴向剖视：孔的小径（键齿顶）与大径（键槽底）两对平行线都用粗实线，剖面线画到大径线，两径之间的齿区不画剖面线。", "孔口倒角处两径线以斜线相接。", "局部视图（端视）画出若干齿或全部齿，注出小径d、大径D、键宽b和齿数（如“6齿”）。", "也可不注各尺寸而用花键标记，由大径处引出指引线注写。"]
variants = ["剖视加局部视图"]
dxf_forms = ["two pairs of thick LINEs (major D outer, minor d inner) symmetric about the CENTER axis; HATCH ANSI31 bounded by the major-diameter line; band between D and d unhatched", "partial end view: thick LWPOLYLINE/LINE/ARC zig-zag of rectangular slots on circle arcs; TEXT '6齿' near width dimension b", "designation MTEXT on leader landing, e.g. symbol + '6×23H7×26H10×6H11 GB/T 1144'; symbol may be a font glyph, block or small LWPOLYLINE", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为剖视图中孔内的两对平行粗实线（间距差为(D−d)/2，约为直径的5%–10%），外侧一对为剖面线边界，内侧一对与外侧之间是无剖面线的窄带，孔口倒角以斜线连接两对线；配套的端视图中孔边呈矩形凹凸齿（齿数6–10），并有“n齿”文字。与内螺纹区分：内螺纹大径为细实线、剖面线画到小径粗实线；与带键槽的孔区分：键槽只在一侧有一处凹槽，端视图不呈周向均布齿。"
confusions = ["内螺纹：大径线为细实线，剖面线画到小径粗实线。", "带键槽的孔：只有一个槽，端视图不是均布齿。", "阶梯孔：两组直径线在轴向错开，不在同一段内平行共存。"]
related = ["DC-G3-040", "DC-G3-031", "DC-G3-047", "DC-G3-085", "DC-G3-086", "DC-G3-186", "DC-G4-139", "DC-G4-002"]
priority = "medium"
text_forms = ["6齿", "6×23H7×26H10×6H11 GB/T 1144", "⊓ 6×23H7×26H10×6H11"]
knowledge_units = ["K13", "K35"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 4459.3-2000 4.1.2 图2（已查看图例：剖面线止于大径线，两径间带不画剖面线）。花键图形符号在DXF中的形式为一般实践。"
