[[concepts]]
id = "DC-G3-055"
name = "螺纹牙型表示"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "螺纹按规定画法画出后看不出牙型，当需要表达牙型（如非标准螺纹或传动螺纹）时，用局部剖视或局部放大图画出几个牙的形状。"
components = ["局部剖视：在螺纹件上以波浪线为界作局部剖，剖开处画出若干个牙的真实轮廓。", "局部放大图：在原视图上用细实线圆圈出部位并标罗马数字，放大图按比例（如5:1）画出牙型并可注牙型尺寸。", "其余部分仍按螺纹规定画法（粗、细线）表示。"]
variants = ["局部剖视画出牙型", "局部放大图画出牙型"]
dxf_forms = ["zig-zag thick LINE/LWPOLYLINE (triangular, trapezoidal, square or sawtooth teeth) inside a broken-out region bounded by a wavy SPLINE (layer 02), with HATCH ANSI31", "detail view: thin CIRCLE callout + TEXT 'I'; enlarged profile with label MTEXT 'I 5:1' and DIMENSIONs of pitch/angle (%%d)", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为沿螺纹轴向周期重复的锯齿/梯形/矩形折线（重复周期为螺距，个数通常3–6个），位于局部剖视的波浪线边界内或局部放大图中，其上下包络与螺纹的大径粗线、小径细线一致。与滚花区分：滚花是视图中的网纹，不是轮廓折线；与齿轮齿形区分：齿形在端视方向画、齿廓为渐开线曲线，且配齿轮参数。"
confusions = ["滚花：表面网纹线，不改变轮廓。", "齿轮齿形表示：在端视图中画一两个渐开线齿。", "非标准螺纹标注：放大牙型并注全部牙型尺寸（DC-G3-090）。"]
