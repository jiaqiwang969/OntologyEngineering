group = "G1"
kind = "line"
meaning = "规定图线宽度的数系与粗细搭配：机械图样只用粗、细两种线宽，粗细比为2:1，按图样类型、尺寸、比例和缩微要求选用线宽组。"
components = ["线宽数系（公比约1:√2）：0.13、0.18、0.25、0.35、0.5、0.7、1、1.4、2 mm。", "机械图样线宽组（粗/细）：0.25/0.13、0.35/0.18、0.5/0.25、0.7/0.35、1/0.5、1.4/0.7，优先0.5/0.25和0.7/0.35。", "粗线类：粗实线、粗虚线、粗点画线；细线类：细实线、波浪线、双折线、细虚线、细点画线、细双点画线。", "CAD 五组（GB/T 14665）：2.0/1.0、1.4/0.7、1.0/0.5、0.7/0.35、0.5/0.25。", "旧版 GB/T 4457.4-1984 粗细比约3:1；GB/T 17450 通用比率粗:中粗:细=4:2:1；平行线最小间隙0.7 mm。"]
variants = ["GB/T 4457.4-1984 粗细比 3:1", "GB/T 14665 CAD 五组: 2.0/1.0, 1.4/0.7, 1.0/0.5, 0.7/0.35, 0.5/0.25", "GB/T 17450 粗:中粗:细 = 4:2:1"]
dxf_forms = ["entity group 370 lineweight in 1/100 mm (25, 35, 50, 70 …), or -1 ByLayer / -2 ByBlock / -3 Default", "LAYER table group 370 gives the per-layer lineweight", "plot style tables (CTB by colour) often carry the widths outside the DXF, e.g. colour 7 → 0.5 mm, other colours → 0.25 mm in many Chinese templates", "LWPOLYLINE constant width (group 43) used for thick frame lines or cutting strokes"]
recognition = "先统计全图线宽分布：若370有效，取出现最多的两档，比值应接近2:1（旧图约3:1），大者为粗线宽 d。若全为默认/ByLayer 且图层也无线宽，则改用图层名与颜色（白=粗；绿、黄、红、粉=细）或打印样式推断。线宽不是独立图形，而是所有图线分类的属性；同类图线线宽应一致，出现第三档宽度时多为多段线宽度画的框线或符号。"
confusions = ["中粗线：建筑等图样使用，机械图不用。", "屏幕线宽与打印线宽：DXF 内可能只存颜色，宽度在打印样式中。", "多段线全局宽度：不是370线宽，需分开读取。"]
related = ["DC-G1-038", "DC-G1-043", "DC-G1-019", "DC-G1-101", "DC-G1-079"]
priority = "high"
