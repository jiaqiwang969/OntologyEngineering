[[concepts]]
id = "DC-G3-227"
name = "自攻螺钉用螺纹标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "自攻螺钉用螺纹的标记，以标准编号加特征代号ST和公称直径表示；使用时须先制出螺纹底孔。自攻锁紧螺钉的螺纹则仍用M代号。"
components = ["格式：标准编号 + ST + 公称直径（mm），如GB 5280 ST3.5。", "被连接件上须预制底孔（预制孔），图上通常只画光孔并注底孔直径。", "自攻锁紧螺钉用螺纹按粗牙普通螺纹，用M表示，如GB 6559 M5×20，其中20是螺杆长度而非螺距。"]
variants = ["ST3.5"]
dxf_forms = ["TEXT/MTEXT on a LEADER (layers 09/11) at the screw or the pre-drilled hole", "Parts-list cell TEXT for the screw designation (e.g. a tapping-screw standard number followed by 'ST3.5×16')"]
recognition = "锚点为文字正则 \\bST\\s?\\d+(\\.\\d+)?([×xX]\\d+)?\\b；位于引线或明细栏中，附近孔为光孔（无螺纹细实线）。对 GB 6559 M5×20 一类标记，需按标准编号识别“×20”为长度而非细牙螺距。"
confusions = ["普通螺纹M：用M代号，被连接件孔中画出螺纹。", "自攻锁紧螺钉的M标记：其中“×”后为螺杆长度。", "其他含ST的英文缩写：需后接数字直径才认作自攻螺纹。"]
related = ["DC-G3-223", "DC-G3-229", "DC-G3-043"]
priority = "low"
text_forms = ["GB 5280 ST3.5", "ST4.2", "GB 6559 M5×20"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "来自GB/T 4459.1-1995附录A表A1续（参考件，引用GB 5280-85、GB 6559-86）。明细栏中“ST3.5×16”式螺钉规格来自一般经验。"
