id = "DC-G4-076"
name = "尺寸基准"
aliases = []
group = "G4"
kind = "other"
meaning = "标注尺寸的起点。长、宽、高每个方向有一个主要尺寸基准，并可有辅助基准；按用途分为设计基准和工艺基准，常选安装面、对称面、重要端面、轴肩或轴线。"
components = ["主要尺寸基准：每个方向一个，常同时是设计基准", "辅助基准：与主要基准有尺寸联系的另一起点，常为便于加工测量的工艺基准", "面基准：较大的加工面、结合面、对称平面、重要端面、轴肩", "线基准：轴线、孔轴线、对称中心线；回转件轴线是径向基准"]
