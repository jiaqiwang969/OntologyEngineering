meaning = "60°圆锥管螺纹（美制锥管螺纹）的标记，由特征代号NPT和英寸尺寸代号组成，左旋加LH；内外螺纹都只有一种公差带，不注公差。"
components = ["特征代号NPT在前，后接英寸尺寸代号（常为分数，如3/8、1/2）。", "左旋在其后加“-LH”，右旋不注；不注公差带代号。", "用指引线从螺纹大径或对称中心引出标注，与其他管螺纹一致。"]
variants = ["NPT3/8", "NPT3/8-LH"]
