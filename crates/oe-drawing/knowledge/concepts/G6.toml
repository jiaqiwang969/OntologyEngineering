[[concepts]]
id = "DC-G6-018"
name = "加工余量的注法"
aliases = ["加工余量标注"]
group = "G6"
kind = "surface_indication"
meaning = "在完整符号短边左侧（位置e）写一个以毫米计的数字，表示该表面应留的加工余量；常见于同时表示完工零件形状的铸件、锻件图。"
components = ["2006版第9章：数字写在位置e，可以是符号上唯一的要求，也可与加工方法和粗糙度要求同时标注。", "图15示例：全周符号加“车 / Ra 3.2”和余量3，表示所有表面均留3 mm余量；此方式不用于文本。", "1993版同样写在位置e；GB/T 33523.1区域法写在位置g。", "ISO 21920-1草案不再规定加工余量。"]
variants = ["GB/T 131-2006 第9章 图15 (often with the all-around symbol)", "GB/T 131-1993 position e", "GB/T 33523.1 position g", "ISO 21920-1 draft: machining allowance no longer specified (表G.1)"]
dxf_forms = ["TEXT number (e.g. '3') left of the short leg, height h, same rotation as the symbol", "ATTRIB at the e-position of a template block", "often combined with the all-around CIRCLE at the bar corner"]
recognition = "锚点：完整符号；在短边外侧左方（符号坐标x<0，y约0.3–1.2h）找无单位的纯数字TEXT，即加工余量。若图中同时画有毛坯与成品轮廓，或标题栏、技术要求提到铸件、锻件，可信度更高。区分1993版V形开口上方的Ra数值（在两边之间）、1993版取样长度（横线下方）和尺寸数字（属于尺寸线）。"
confusions = ["1993版Ra数值：在V形开口上方、两边之间", "1993版取样长度：在横线下方", "尺寸数字：属于尺寸线或DIMENSION", "参数值：在横线下方紧跟参数代号"]
related = ["DC-G6-025", "DC-G6-070", "DC-G6-069", "DC-G6-027", "DC-G9-009"]
priority = "low"
text_forms = ["3（位置e）", "3 + 车 / Ra 3.2"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The relative offsets are estimates from general practice."
