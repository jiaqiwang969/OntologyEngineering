[[concepts]]
id = "DC-G2-045"
name = "叠钢片剖面符号（转子、电枢、变压器和电抗器等）"
aliases = []
group = "G2"
kind = "symbol"
meaning = "转子、电枢、变压器和电抗器等叠钢片的剖面符号：一组与叠片方向一致的平行细线，靠两侧为长线，向中部逐渐变短，中部以短画和点收拢；线的方向应与束装中叠钢片的方向一致。"
