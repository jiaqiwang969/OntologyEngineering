[[concepts]]
id = "DC-G6-021"
name = "双向极限（双侧公差）的注法"
aliases = ["上限值/下限值标注（U、L，16%规则）"]
group = "G6"
kind = "surface_indication"
meaning = "同一表面同时给出上限值和下限值的注法：横线下方两行，上行为上限（U），下行为下限（L）；同一参数且无歧义时可省略U、L。"
components = ["2006版：上限行在上，以U开头；下限行在下，以L开头，如U Rz 0.8 / L Ra 0.2。", "上下限可用不同参数代号和不同传输带；同一参数双向极限且不会误解时可不写U、L。", "1993版：两个数值上下叠写，上为上限、下为下限；或“3.2max”叠“1.6min”表示最大值和最小值（表2、表3）。", "ISO 21920-1草案：可分两行；其余规范元素相同时也可在一行内参数后用方括号给出上下限（如Ra [0.5 … 2.5]，分隔符OCR不清）。"]
variants = ["GB/T 131-2006 图11 (two lines)", "GB/T 131-1993 表2/表3: two values stacked, upper above lower, or max over min", "ISO 21920-1 draft 9.6: two lines, or one line with both limits inside square brackets after the code (e.g. Ra [0.5 … 2.5], separator unclear in OCR) when all other elements are the same", "单个上限值（无前缀）", "U 与 L 双限", "无歧义时省略 U、L"]
dxf_forms = ["two TEXT entities stacked under the bar at ≈1.5–2h pitch: 'U Rz 0.8' / 'L Ra 0.2'", "MTEXT with \\P line break", "1993: two TEXT numbers in the V opening, or MTEXT stacking \\S3.2^1.6", "draft: single TEXT with square brackets 'Ra [0.5…2.5]'"]
recognition = "锚点：符号横线下方的两行文字。两行分别以U、L开头为双向极限；两行为同一参数代号且无U、L、上值大于下值时，也可判为双向极限；不同参数两行且无U、L时，是两个单向上限（位置a、b），不是双向极限。1993版在V形开口上方叠写两数值（上大下小）。区分尺寸上下偏差的叠写（在尺寸数字后、字号较小、带+、-号）和分数。"
confusions = ["位置a、b的两项独立要求：不同参数，均为上限", "尺寸上下偏差叠写：在尺寸数字后，带正负号", "分数：有分数线", "最大规则max/min：表示判断规则，不表示上下限", "螺纹旋合长度L：在螺纹标记中"]
related = ["DC-G6-009", "DC-G6-046", "DC-G6-030", "DC-G6-027", "DC-G6-025", "DC-G6-059"]
priority = "low"
text_forms = ["U Rz 0.8 / L Ra 0.2", "U Ra 3.2 / L Ra 1.6", "Rz 3.2 / Rz 1.6（省略U、L）", "3.2 / 1.6（1993叠写）", "3.2max / 1.6min（1993）", "Ra [0.5 … 2.5]（草案）"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The separator inside the draft's square brackets is unclear in the OCR."
