[[concepts]]
id = "DC-G9-012"
name = "读装配图与拆画零件图"
aliases = []
group = "G9"
kind = "other"
meaning = "从装配图了解部件的名称、用途、零件组成、装配关系和工作原理，再把某个零件从装配图中分离出来，补全形状，重新选择视图，注写尺寸和技术要求，得到零件图（拆图）的方法；也是读图程序组织装配图信息的顺序。"
components = ["概括了解：读标题栏、明细栏，得到部件名称及标准件与非标准件的种类、数量，按序号在视图中找到各零件。", "分析视图：明确视图投影关系、剖切位置和投射方向，弄清各视图的表达重点。", "装配关系与原理：沿装配干线分析配合代号、定位、连接、密封和运动关系。", "分离零件：依据同一零件剖面线方向和间隔一致、序号圆点所在区域，在各视图中划出零件范围，补全被遮挡和省略的结构。", "拆画：按零件图原则重选主视图，移注装配图上的尺寸并把配合代号转为偏差，相配零件的尺寸和“配作”要求两边一致。"]
variants = ["概括了解", "了解装配关系和工作原理", "分析零件", "拆画零件图"]
dxf_forms = ["no specific entity: uses parts-list TEXT, balloon leaders, HATCH patterns (angle and scale per part) and DIMENSION fit texts such as '%%c22H7/g6'"]
recognition = "程序实现要点：以“明细栏行→序号→指引线圆点→所在闭合区域”为链，把零件编号投到视图区域上；同一零件在各视图中的剖面线角度和间距相同（HATCH的图案角度和比例一致），相邻零件不同，据此按零件分割剖面区域；配合代号所在的尺寸指出两零件的配合面。装配图中省略的工艺结构不能当作零件“没有该结构”的证据。"
confusions = ["读零件图：对象是单个零件，不涉及明细栏、序号和配合关系分析。"]
related = ["DC-G9-013", "DC-G8-013", "DC-G8-025", "DC-G8-024", "DC-G2-009", "DC-G8-023"]
priority = "low"
text_forms = []
knowledge_units = ["K14", "K61", "K21", "K40"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "这是读图方法而不是图上的表达形式；用 HATCH 参数分割零件属一般 CAD 实践。"
