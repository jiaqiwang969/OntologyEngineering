recognition = "用作其他尺寸符号识别的尺度校准：先取相邻尺寸数字的字高h，再检验候选符号包围盒，□约h×h，⌴约2h×h，⌵和↧高约h，锥度三角形约2.5h×1.4h；允许约±25%偏差（模板差异）。符号与数字间距约0~0.3h，底边与数字基线大致对齐。候选图形尺寸远大于h（≥3h）时通常是零件轮廓或其他图形，不是尺寸符号。"
