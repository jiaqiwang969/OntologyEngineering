[[concepts]]
id = "DC-G7-115"
name = "尾部标注内容次序"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "尾部需注写多项内容时的排列次序：相同焊缝数量、焊接方法代号（GB/T 5185）、缺欠质量等级（GB/T 19418）、焊接位置（GB/T 16672）、焊接材料、其他，各项之间用斜线“/”分开。"
components = ["第1项：相同焊缝数量（如N=4或4条）。", "第2项：焊接方法数字代号（如111、12）。", "第3项：缺欠质量等级（如B、C）。", "第4项：焊接位置（如PA、PB）。", "第5项：焊接材料。", "分隔：斜线“/”。"]
variants = ["full sequence", "subset of items"]
dxf_forms = ["single TEXT after the tail fork such as '4/111/C/PB', or several TEXT pieces separated by '/'", "ATTRIB values in a weld-symbol block"]
recognition = "读取尾部叉号后的文字，按“/”分段，再按次序和样式归类：纯数字且为GB/T 5185代号→方法；单个大写字母→质量等级；P开头两字母→焊接位置；N=或“n条”→数量。段数不足时按已知样式匹配，不强行按位置。"
confusions = ["分数或比值：如1/2、1:2，不在焊缝尾部。", "日期或零件代号中的斜线。"]
