[[concepts]]
id = "DC-G5-098"
name = "局部区域被测要素（粗长点画线/阴影区域）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "被测要素只是表面的一部分时，用粗长点画线（04.2）画在该部分旁边，或用以这种线围出的阴影区域表示，并用带框 TED 给出其位置和大小；框格指引线终止在该区域上。"
components = ["粗长点画线：沿被测表面的一段平行画出，或围出一块区域", "阴影区：在围出的区域内画细实线斜线", "位置与大小：带框理论正确尺寸", "另一种：用大写字母和箭头指引线标出拐角点或边界线，框格上方写字母间的区间符号"]
variants = ["thick chain line along the surface", "hatched area", "corner points named by capital letters with arrow leaders and a between symbol"]
dxf_forms = ["LINE/LWPOLYLINE with a chain linetype (CENTER-type) and heavy lineweight on layer 06, parallel to and slightly off the contour", "HATCH inside a boundary drawn with that line", "framed TEDs as DIMENSION entities with boxed text; leader LINE + arrow ending on the area"]
recognition = "以粗线宽的点画线为锚：长度明显短于其所靠的轮廓，平行于轮廓且偏离约 0.5–1h（或闭合围出一块区），两端有带框 TED 定位；有公差框格的指引线终止在该线或区域上。"
confusions = ["表面处理、热处理范围的粗点画线：旁边是处理要求文字，不连公差框格", "基准目标区域：边界为细双点画线，连基准目标框", "剖面线：在剖视图中，由粗实线轮廓围住"]
