[[interfaces]]
name = "MdDraftingRulePort"
module = "drawing_understanding_check"
method = "check_rules"
input = "MdDraftingRuleRequest"
output = "MdDraftingRuleReport"
error = "FailureRecord"
effects = "Read the source bytes and the frozen graph; write one new report and three facts files; no classification"
rust_path = "crates/oe-drawing-check/src/drafting.rs"
implementation = "DraftingRuleChecker"

[[constraints]]
id = "md_drafting_rules"
requirement = "req_md_drawing_route"
module = "drawing_understanding_check"
check = "check_rules"
rust_path = "crates/oe-drawing-check/src/drafting.rs"
statement = "Drafting rules are evaluated only as SHACL shapes of the drafting ontology, by the framework's SHACL engine, over typed facts exported from the source bytes and the frozen graph without classifier code; the ontology declares exactly the classes and predicates the fact contract allows; every rule names its concepts of the catalogue, its standard clause and its message; the same shapes are evaluated on the source, recognition and presentation layers and every finding names its layer, focus and sources; a finding is a deviation to review and never changes the graph"
severity = "error"

[[validations]]
id = "md_drafting_rules_the_ontology_the_fact_contract_and_the_exporter_declare_t"
module = "drawing_understanding_check"
constraint = "md_drafting_rules"
behavior = "the_ontology_the_fact_contract_and_the_exporter_declare_the_same_vocabulary"
rust_path = "crates/oe-drawing-check/tests/drafting_rules.rs"
oracle = "Classes and properties read from the ontology document equal the allowed values of the fact contract and the constants of the exporter, in both directions; every class and property a shape references is declared"
scope = "Route, page and check behaviour on synthetic or original public input; real-drawing qualification is recorded separately"

[[validations]]
id = "md_drafting_rules_every_rule_has_a_violating_and_a_conforming_fixture"
module = "drawing_understanding_check"
constraint = "md_drafting_rules"
behavior = "every_rule_has_a_violating_and_a_conforming_fixture"
rust_path = "crates/oe-drawing-check/tests/drafting_rules.rs"
oracle = "Authored DXF and graph fixtures per rule: the violating fixture yields that rule and no other on its layer, the conforming fixture yields no finding"
scope = "Route, page and check behaviour on synthetic or original public input; real-drawing qualification is recorded separately"

[[validations]]
id = "md_drafting_rules_the_same_shapes_are_evaluated_on_the_three_layers"
module = "drawing_understanding_check"
constraint = "md_drafting_rules"
behavior = "the_same_shapes_are_evaluated_on_the_three_layers"
rust_path = "crates/oe-drawing-check/tests/drafting_rules.rs"
oracle = "One authored drawing whose fault is only in the presentation layer (an inferred span) and one whose fault is only in the source (a raw text) give findings on those layers alone"
scope = "Route, page and check behaviour on synthetic or original public input; real-drawing qualification is recorded separately"

[[validations]]
id = "md_drafting_rules_every_rule_names_concepts_of_the_catalogue_and_a_clause"
module = "drawing_understanding_check"
constraint = "md_drafting_rules"
behavior = "every_rule_names_concepts_of_the_catalogue_and_a_clause"
rust_path = "crates/oe-drawing/tests/drafting_rules.rs"
oracle = "Every rule shape carries a rule id, concept ids that exist in the concept catalogue, a clause, a label and a message; rule ids are distinct per shape family and at least twelve"
scope = "Route, page and check behaviour on synthetic or original public input; real-drawing qualification is recorded separately"

[[obligations]]
id = "ob_drawing_rules_from_ontology"
constraint = "md_drafting_rules"
statement = "Every route run evaluates the drafting rules of the ontology on the three fact layers and records the findings per layer; the rules are read from the compiled shapes, not from code"
gaps = ["First batch of rules only (lines, views and sections, dimensions); rules that need cavity, projection or part knowledge are not formalized"]

