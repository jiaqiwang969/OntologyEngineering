[[concepts]]
id = "DC-G6-028"
name = "旧版取样长度在横线下方的注写"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "GB/T 131-1993图样上，取样长度（mm）写在符号长边横线的下方；采用GB 10610规定的默认取样长度时省略不注。"
components = ["取样长度数字写在横线下方（1993图1，如0.8、2.5），Ra数值仍在V形开口上方。", "附录B：两个高度参数同时标注时，取样长度相同只写一个值，不同则以斜线隔开写两个值；与tp同时标注时tp前加斜线。", "附录C：表面波纹度最大高度也写在横线下方，数值写在代号后。", "2006版附录I：新图应避免在该旧位置标取样长度，改用“-0.8/Ra 1.6”形式。"]
variants = ["GB/T 131-1993 3.7 图1", "附录B B1-B3: sampling lengths of two height parameters under the line (one common value, or two values separated by a slash)", "附录C: waviness (W) under the line", "GB/T 131-2006 附录I: old position 'a' for sampling length to be avoided; replaced by '-0.8/Ra 1.6' form"]
dxf_forms = ["TEXT number under the bar of an old-style block while the Ra value TEXT sits in the V opening", "TEXT '0.8/2.5' for two sampling lengths", "ATTRIB at the old 'c' position (1993 numbering) in template blocks"]
recognition = "先判定图样为1993版写法（Ra数值在V形开口上方、横线下方无参数代号）；此时横线下方的纯数字若属于0.08、0.25、0.8、2.5、8、25系列，即为取样长度；带斜线的两个数分别对应两个参数。区分2006版位置b的第二项要求（含参数代号）、间距参数值（带S、Sm、tp代号）和2006版传输带（有连字号并接斜线和代号）。"
confusions = ["2006版位置b的第二项要求：含参数代号", "1993版间距参数值：带S、Sm或tp代号", "2006版传输带：带连字号并接“/代号”", "加工余量：在短边左侧"]
related = ["DC-G6-027", "DC-G6-029", "DC-G6-013", "DC-G6-025", "DC-G6-073"]
priority = "low"
text_forms = ["0.8（横线下）", "2.5", "0.8/2.5"]
knowledge_units = ["K31", "K32"]
