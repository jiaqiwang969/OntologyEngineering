iso_26262_boundary:
  normative_source: ISO_26262-1_2018
  informative_source: ISO_26262-10_2018
  retained_concepts:
    item:
      clause: 1-3.84
      category_use: analysis_boundary_for_system_or_system_combination_implementing_vehicle_level_function
    system:
      clause: 1-3.163
      category_use: related_components_or_subsystems_connecting_sensor_controller_actuator
    element:
      clause: 1-3.41
      category_use: umbrella_term_not_mandatory_intermediate_layer
    error:
      clause: 1-3.46
      category_use: discrepancy_against_true_specified_or_theoretical_reference
    failure:
      clause: 1-3.50
      category_use: termination_of_intended_behavior_after_fault_manifestation
    fault:
      clause: 1-3.54
      category_use: abnormal_condition_that_can_cause_failure
    safe_state:
      clause: 1-3.131
      category_use: operating_mode_of_item_in_failure_context
    FDTI:
      clause: 1-3.55
      category_use: fault_occurrence_to_detection
    FHTI:
      clause: 1-3.56
      category_use: mechanism_property_equal_to_FDTI_plus_FRTI
    FRTI:
      clause: 1-3.59
      category_use: detection_to_safe_state_or_emergency_operation
    FTTI:
      clause: 1-3.61
      category_use: item_level_minimum_fault_to_possible_hazardous_event_without_active_mechanism
  informative_examples:
    - ISO_26262-10_2018_4.2_item_system_element_relationship
    - ISO_26262-10_2018_4.3.1_fault_error_failure_progression
    - ISO_26262-10_2018_4.4_FHTI_mechanism_vs_FTTI_item
  prohibited_inferences:
    - element_is_fixed_layer_between_system_and_component
    - every_lower_level_failure_is_always_higher_level_fault
    - fault_error_failure_form_mandatory_subclass_or_causal_chain
    - same_numeric_duration_implies_same_time_concept
    - OFF_implies_safe_state_in_every_failure_context
    - generic_concept_is_created_by_removing_iso262_namespace_prefix

category_boundaries:
  entity_type:
    examples: [product_candidate, system, physical_individual, software_artifact]
    question: what_is_it_and_how_is_identity_preserved
  function:
    question: what_capability_is_required
  behavior:
    question: what_happens_under_input_state_time_and_environment
  concern:
    question: what_value_or_loss_dimension_is_being_evaluated
  measure:
    question: what_quantity_method_unit_window_model_and_uncertainty_are_used
  state:
    examples: [Candidate, Released, Degraded, SafeState]
    anti_rigidity_rule: can_change_without_changing_entity_identity
  role:
    examples: [DUT, ReferenceUnit, Reviewer]
    dependence_rule: exists_only_relative_to_declared_activity_or_relation

