[[concepts]]
id = "DC-G4-021"
name = "尺寸线终端—斜线（起止线）"
aliases = ["尺寸线终端—斜线", "尺寸线终端斜线"]
group = "G4"
kind = "dimension_element"
meaning = "以细实线短斜线作为尺寸线终端（GB/T 4457.4 称“尺寸线的起止线”）：斜线与尺寸线约成45°，长度约等于字高；只能在尺寸线与尺寸界线互相垂直时使用，多见于钢结构、型材图样，箭头位置不够时也可代替箭头。"
components = ["斜线：细实线，长约 h（字体高度），通过尺寸线与尺寸界线的交点，与尺寸线成45°（GB/T 4458.4 图10）", "使用条件：尺寸线与尺寸界线必须互相垂直；同一图样只用一种终端；直径、半径、角度仍用箭头", "线型：GB/T 4457.4 表1 01.1.9 规定起止线用细实线", "示例：型钢构件长度尺寸，配型材标记如 L100×6、L75×6（GB/T 4458.4 图11）", "CAD 选用顺序：实心箭头、开口箭头、空心箭头之后的第四种"]
variants = ["GB/T 4457.4 名称：尺寸线的起止线", "狭小处可代替箭头（GB/T 14665 图13）", "used mainly on structural / steel drawings (e.g. with profile marks L100×6)"]
dxf_forms = ["DIMENSION with DIMBLK = _OBLIQUE (thin tick); _ARCHTICK is the heavy architectural tick, not GB mechanical; DIMTSZ>0 also forces ticks", "exploded: one short LINE at 45° centred on the intersection of the dimension and extension LINEs, length ≈ text height", "layer 08 or template dimension layer, continuous thin linetype"]
recognition = "锚点为尺寸线端点处的一条短直线，长度≈字高 h，与尺寸线夹角45°±5°，中点在尺寸线与尺寸界线交点附近（容差≈d），且尺寸界线垂直于尺寸线。两端同向斜线、中间有数字→斜线终端尺寸。与剖面线区分：剖面线成组平行等距、充满闭合区域；与剖切符号区分：剖切符号是粗实线短画（长约5~10mm）、在视图外剖切位置；与配合代号“/”区分：后者是文字字符；与斜度符号区分：斜度符号是倾斜线配水平线，位于引线基准线上。"
confusions = ["剖面线：成组平行的45°细线，充满区域", "剖切符号的粗短画：粗实线，位于剖切位置", "配合代号中的“/”（如 H7/f6）：文字字符", "斜度符号：倾斜线与水平基准线组成，在引线上", "指引线斜线终端：位于指引线末端"]
related = ["DC-G4-019", "DC-G4-016", "DC-G4-018", "DC-G4-059", "DC-G4-044", "DC-G1-097", "DC-G1-010"]
