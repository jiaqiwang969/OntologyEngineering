meaning = "ALS表示尺寸规范适用于任意纵向截面（包含轴线的半平面）内的尺寸，即每个纵向截面分别满足要求；需要时其后接相交平面框格和方向要素框格以明确截面与测量方向。"
components = ["符号：大写字母ALS，不加框，与前后成分以空格分隔", "位置：在尺寸特征修饰符（如GN、GX）之后，统计修饰符视全局/局部含义在其前或后", "附加框格：可接相交平面框格（如∥A）和方向要素框格（如←∥A），位于规范末尾、旗注之前", "限定部分：若只用于要素的一段，用粗点画线或区间符号标出范围"]
