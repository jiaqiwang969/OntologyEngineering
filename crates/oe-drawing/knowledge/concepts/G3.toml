[[concepts]]
id = "DC-G3-202"
name = "防尘副唇符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "密封特征画法中与动态密封斜线成90°的短粗实线，代表有防尘、除尘功能的副唇，与动态密封要素组合使用。"
components = ["一条短粗实线，从动态长斜线上分出并与之成90°（2009版说明为与轮廓线成对角形式）。", "与动态斜线、静态长线一起出现在旋转轴唇形密封圈带副唇型的符号中，形成一个尖角朝向一侧的“<”形组合。", "1996版表1之1.3与2009版表1之3.2.3含义相同。"]
variants = []
dxf_forms = ["Short thick LINE on layer 01 meeting the dynamic diagonal at a right angle inside the seal frame", "Contained in seal library INSERTs of FB/FW/FZ type"]
recognition = "在已识别的密封框内（有静态长线和动态斜线），查找一端落在动态斜线上、与之成约90°、长度约为斜线1/3～1/2的短粗线；存在即为带副唇型。区分：轴承短线是穿过长线（两侧都伸出），副唇短线只从斜线一侧伸出；通用画法X的两条对角线等长并交于框中心。"
confusions = ["滚动轴承短的粗实线：穿过长线、两侧对称伸出。", "通用画法交叉对角线：两条等长线在框中心相交。", "双向密封的第二条长斜线：长度与第一条相当，并与静态线相接。"]
