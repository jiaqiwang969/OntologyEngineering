[[concepts]]
id = "DC-G1-043"
name = "细实线"
aliases = []
group = "G1"
kind = "line"
meaning = "线宽约为粗线一半（如0.25或0.35 mm）的连续线，用于尺寸线、尺寸界线、剖面线、指引线和基准线、过渡线、螺纹牙底线、重合断面轮廓、短中心线等大量辅助表达。"
components = ["线型01，线宽约0.5d。", "用途（01.1.1~01.1.20）：过渡线、尺寸线、尺寸界线、指引线和基准线、剖面线、重合断面轮廓、短中心线、螺纹牙底线、尺寸线起止线、平面对角线、成形前弯折线、范围线及分界线、重复要素线、锥形基面线、叠片线、辅助线、同一表面连线、相同要素连线、投影线、网格线。", "波浪线、双折线（01.1.21、01.1.22）也属细实线类。", "CAD 分层02层（细实线、波浪线、双折线），屏幕绿色；尺寸类细线归08层。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight 25 or 35 (or ByLayer) on a thin layer: GB/T 14665 layer 02, names such as 细实线/THIN; colour green (ACI 3)", "lines inside DIMENSION, HATCH and LEADER entities are thin by convention", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "连续线型且线宽约为粗线一半（或位于细实线、尺寸、剖面线等图层，颜色绿色等）。用途靠关系细分：成组等距平行且被闭合轮廓包围→剖面线；属于 DIMENSION 或与之关联→尺寸线/界线；一端终端一端文字→指引线；与粗圆同心的3/4圆弧→螺纹牙底；端部留隙的交线→过渡线；SPLINE→波浪线；Z形折→双折线。"
confusions = ["粗实线：线宽约为2倍。", "波浪线、双折线：同属细实线类，形状特殊。", "过渡线与轮廓线：过渡线细且端部留隙。", "重合断面轮廓：细实线闭合外形叠在视图上。"]
related = ["DC-G1-038", "DC-G1-010", "DC-G1-028", "DC-G1-054", "DC-G1-032", "DC-G1-011", "DC-G1-048", "DC-G1-056", "DC-G1-037"]
