[[constraints]]
id="memory_candidate_non_decisive"
requirement="req_project"
module="kernel"
check="verify"
rust_path="crates/oe-kernel/src/project/memory.rs"
statement="记忆召回只作待核候选：交接须声明未授予采用、不写 Project；经验摘要与每条原消息字节重读一致、Project 绑定未变才可登记；登记只加 memory-candidate 证据，不得作为 supported/refuted 决定的依据、关闭验收的证据或工具原始记录。"
severity="error"

[[validations]]
id="validate_memory_candidate_rules"
module="kernel"
constraint="memory_candidate_non_decisive"
behavior="memory_candidates_verified_registered_never_decisive"
rust_path="crates/oe-kernel/tests/memory_candidate.rs"
oracle="独立冻结：手写排序摘要的交接通过并只加一项证据；摘要、原字节、文字、采用声明、对象或条件变化均拒绝；以记忆证据支撑决定、关闭验收或充当工具记录均拒绝；反馈按 memory 合同绑定当前 Project"
scope="来源与绑定；不证明经验主张、适用性或收益"
