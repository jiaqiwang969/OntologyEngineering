group = "G3"
kind = "symbol"
meaning = "画在运动轨迹线上的运动特征标记，表示中间位置瞬时停顿、中间位置停留、极限位置停留、局部反向、停止和运动终止。"
components = ["中间位置瞬时停顿：直线或圆弧轨迹中部加一条垂直短横，呈十字。", "中间位置停留：轨迹折成台阶形（横—竖—横）。", "极限位置停留：轨迹在端部折成方括号形，竖线连接上下两条平行横线。", "局部反向运动：直线轨迹折成Z形回折，圆弧轨迹带一个Z形回钩。", "停止：轨迹线末端画一条垂直短线（⊣），不带箭头；运动终止：带箭头的轨迹末端抵在一条垂直短线上。2013版条号4.3～4.7、4.10，1984版1.3～1.7、1.8.10。"]
variants = ["中间位置的瞬时停顿", "中间位置的停留", "极限位置的停留", "局部反向运动", "停止", "运动终止"]
dxf_forms = ["Thin LINE/ARC path on layer 02 with short perpendicular LINE ticks for pauses and end bars", "Step, bracket and zigzag shapes as one LWPOLYLINE with right-angle or acute vertices", "Arrowheads (for motion end) as SOLID or tapered LWPOLYLINE", "INSERT of a motion-symbol block"]
recognition = "锚点为机构简图中构件旁的细轨迹线，在其上查找特征：中部垂直短横（长度约为线长的1/5~1/3）→瞬时停顿；直角台阶→停留；端部⊏形→极限停留；锐角Z折→局部反向；末端垂直短线无箭头→停止，有箭头→运动终止。与尺寸界线区分：尺寸界线成对出现、与尺寸线垂直并超出约2~3 mm，配有尺寸数值；与断裂线（双折线）区分：双折线是零件轮廓中断处的细实线折线，成对出现在投影图中。"
confusions = ["尺寸界线与尺寸线：成对、有尺寸数值，通常是DIMENSION实体。", "双折线/断裂线：位于零件投影的断开处，不在机构简图轨迹上。", "形位公差或焊缝符号中的短线：位于框格或基准线上。"]
related = ["DC-G3-153", "DC-G3-165", "DC-G3-199", "DC-G4-059", "DC-G1-029"]
priority = "rare"
text_forms = []
knowledge_units = ["K13"]
