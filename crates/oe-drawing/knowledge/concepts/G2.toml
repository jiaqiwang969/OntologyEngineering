[[concepts]]
id = "DC-G2-061"
name = "金属材料剖面符号"
aliases = ["金属材料剖面线"]
group = "G2"
kind = "symbol"
meaning = "金属材料（已有规定剖面符号者除外）的剖面符号：间隔相等、方向相同的平行细实线，一般与剖面区域的主要轮廓或对称线成45°；不需表示材料类别时也用作通用剖面线。"
components = ["剖面线：细实线，等距平行，两端落在剖面区域边界上。", "角度：2013年版为与主要轮廓或对称线成45°，必要时可取其他适当角度；1984年版为与水平成45°，主要轮廓与水平成45°时改用30°或60°。", "一致性：同一零件各剖视、断面中剖面线方向和间隔相同。", "复合材料（夹丝玻璃、复合钢板）用其主要材料的符号。"]
variants = ["1984 / 2013 same", "通用剖面线"]
dxf_forms = ["HATCH pattern ANSI31 (angle 0 → 45° lines, angle 90 → 135°), scale giving about 2–4 mm spacing on paper, on layer 10 / '剖面线' (green, thin)", "CAXA/GstarCAD GB hatch named ANSI31 or 金属, associative to the outline", "Exploded or legacy: parallel LINEs on the hatch layer, sometimes with a thick lineweight by mistake"]
recognition = "以剖面区域内单向等距平行细线（ANSI31图案或爆炸后的LINE组）为锚点，线端落在粗实线边界上，方向一般为45°/135°（或30°/60°、与主要轮廓成45°）。爆炸后的剖面线可能与轮廓同层甚至同线宽，判别依据是“成组平行等距、两端落在同一闭合边界上”；一条斜线若是剖面区域边界环的一部分、两侧没有同向等距的伙伴，则是轮廓而非剖面线。"
confusions = ["砖剖面符号：线成对排列。", "非金属剖面符号：双向交叉。", "滚花：粗实线，在外形视图上。", "相邻零件的反向剖面线：属于不同零件。", "剖面区域边界上的斜轮廓线：是边界环的一部分。"]
related = ["DC-G2-019", "DC-G2-009", "DC-G2-063", "DC-G2-059", "DC-G2-056", "DC-G1-010"]
