[[types.fields]]
name = "engineering_adoption"
meaning = "程序准入/恢复不是装配或工程采用"
rust_type = "String"
required = true
format = "typed"
unit = "非几何；精确身份和原程序错误"
precision = "原字节与无隐式scope映射"
write = "agent源绑定独立审查；Rust重核实际OS事实"
applicability = "精确旧import_step_bodies budget1..128的native前准入失败"
acceptance = "新scope只允许新任务写者准入，不改旧unknown或宣称原生/工程成功"
allowed_values = ["not_assessed"]

[[constraints]]
id = "nx_native_parameter_guard_recovery"
requirement = "req_engineering"
module = "nx_protocol"
check = "assess"
rust_path = "crates/oe-nx-protocol/src/writer_release.rs"
statement = "新增/3仅对明确旧import_step_bodies mm预算不在1..128、精确参数原件/源码/实际exit1/空out/无native事件及完整文件目录身份的独立审查放行新任务写者；此新事因只接受原实际退出后persisted诊断scope及同job/dispatch，旧初始receipt事因scope不放宽；/1-/2不接受新事因，原unknown和失败字节不改签，不重派旧任务；恢复不计NX装配成功"
severity = "error"
[[validations]]
id = "validate_nx_native_parameter_guard_recovery"
module = "nx_protocol"
constraint = "nx_native_parameter_guard_recovery"
behavior = "exact_parameter_budget_preload_failure_uses_new_review_without_changing_old_scope"
rust_path = "crates/oe-nx-protocol/tests/writer_release.rs"
oracle = "原dispatch参数budget100000的固定反例，合法128/missing/units漂移、/1-/2、活或不明进程、后续native事件、来源/目录/参数漂移及旧job再派拒绝；原unknown和预算128旧义务不变"
scope = "写者恢复合同；真实STEP装配、全部递归/原型/变换/单位/保存重开及同Project八验收仍各自执行"

[[validations]]
id = "validate_nx_parameter_guard_after_exit_receipt"
module = "nx_protocol"
constraint = "nx_native_parameter_guard_recovery"
behavior = "exact_parameter_guard_accepts_only_after_exit_bound_launch_receipt"
rust_path = "crates/oe-nx-protocol/tests/writer_release.rs"
oracle = "实际原launch记录固定退出后scope/job/dispatch正例；重新绑定SHA/snapshot的旧scope、错job/dispatch/schema/根因/PATHsha/NXBIN反例必须到指定因果判据拒绝；原state仍unknown"
scope = "新参数事因的原诊断时序和身份；只准入不同新任务，非SDK或装配资格"

