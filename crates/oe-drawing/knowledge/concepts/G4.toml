[[concepts]]
id = "DC-G4-103"
name = "零偏差的注写"
aliases = []
group = "G4"
kind = "text_convention"
meaning = "上极限偏差或下极限偏差为零时，用单个数字“0”标出，不加正负号，并与另一偏差小数点前的个位数对齐。"
components = ["零偏差：单独一个“0”，不写+、−号", "对齐：0与另一偏差的个位数（小数点前一位）上下对齐", "另一偏差：带符号，字高比公称尺寸小一号，如 Ø30 0/−0.021 或 Ø30 +0.033/0"]
variants = []
dxf_forms = ["MTEXT stacked tolerance '\\S+0.033^0;' or '\\S0^-0.021;' after the nominal value", "DIMENSION with DIMTOL=1 and DIMTP or DIMTM = 0 in XDATA DSTYLE overrides (CAD renders '0' automatically)", "two separate TEXT entities stacked at the right of the nominal value, one of them '0'", "AutoCAD may print '+0.000'/'0' depending on DIMTZIN; some templates leave a sign before 0"]
recognition = "锚点：公称尺寸右侧上下叠放的两个小字（字高约0.7h），其中一个是“0”。检验：0的位置应与另一偏差的个位数对齐，另一偏差带符号。若CAD输出“+0”“-0”或“0.000”，按零偏差理解。与字母O区分：在偏差位置且与数字叠放；与缺失偏差区分：只有一个偏差文字时需检查是否被拆成两个实体。"
confusions = ["字母O或基准字母：不在偏差叠放位置", "缺失的偏差：只有一个偏差数值而无0", "对称偏差±：只写一次数值，前有±"]
related = ["DC-G4-132", "DC-G4-126", "DC-G4-113", "DC-G1-108"]
priority = "high"
text_forms = ["Ø30 0/-0.021", "Ø30 +0.033/0", "150 0/-0.2"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 4458.5-2003 4.1.5 图8. In text_forms the stacked pair is written upper/lower with '/'. DXF encodings and DIMTZIN behaviour are general CAD practice."
