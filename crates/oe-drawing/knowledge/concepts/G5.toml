[[concepts]]
id = "DC-G5-094"
name = "多个被测要素标注（n×）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "写在框格上方（或基准符号旁）的“n×”，表示同一规范适用于 n 个被测要素，可附写这些要素的尺寸和公差，如“3×”“8×φ15H7”；成组时写成“n×m×”。"
components = ["数量：整数后跟乘号 ×，写在上方相邻区并与框格左对齐", "可附尺寸与公差带代号：如 8×φ15 H7", "成组：n×m×（n 组、每组 m 个）", "基准侧：公共基准简化注法中写在基准符号右侧，基准符号指到框格时写在框格上方"]
variants = ["n×", "n×m× (groups)", "with size and tolerance class", "n× placed by a datum indicator or above frame for a common datum (GB/T 17851)"]
dxf_forms = ["TEXT/MTEXT '3×' or '8×%%c15H7' left-aligned above the frame; × as U+00D7, sometimes letter 'X' or 'x'", "ATTRIB line of a frame block", "TEXT '6×' next to a datum symbol"]
recognition = "以框格上方相邻区（框格上边上方 0.3–1.5h、与框格左端对齐）中“整数+×”开头的文字为锚；把 n 记为被测要素数，并核对指引线所指要素（通常是均布孔组之一）。乘号可能写成字母 X 或 x。"
confusions = ["尺寸数量前缀（如 4×φ10 写在尺寸线上）：属于尺寸，不在框格上方", "拟合字母 X：在框格第二格内", "零件序号或件数"]
related = ["DC-G5-104", "DC-G5-030", "DC-G5-036", "DC-G5-096", "DC-G5-041", "DC-G4-094", "DC-G4-043"]
priority = "medium"
