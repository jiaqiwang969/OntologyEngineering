[[cards]]
id = "theoretically_exact_dimension"
expression_kind = "dimension"
title = "理论正确尺寸"
meaning = "确定被测要素理论正确位置、方向或轮廓的尺寸（TED），数值外加矩形方框，本身不带公差，由几何公差控制其变动；常见于位置度所用的孔分布圆直径和孔距。"
sources = [
  "GB/T 1182-2018 产品几何技术规范 几何公差 3.7、第 6 章（理论正确尺寸的方框）",
  "GB/T 4458.4-2003 机械制图 尺寸注法",
  "机械制图（第7版）§9-5",
]
knowledge_units = ["K17", "K23", "K26"]
recognition = "以尺寸数值为锚：数值上方有一条平行线，其两端各有一条垂直边下到数值下方；底边常就是数值所立的引线台或尺寸线。也可以是一个闭合的四顶点多段线，长边与数值方向平行（随数值旋转），框内只有这一个数值。方框内的数值即理论正确尺寸；方框的线是框，不是引出线。数值可写在尺寸线延长后的引线台上。"
markers = ["□"]
concepts = ["DC-G4-029"]

[[cards.components]]
role = "value"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "尺寸数值"

[[cards.components]]
role = "frame"
primitives = ["LINE", "LWPOLYLINE"]
requirement = "围住数值的矩形方框（上边、两侧边、底边），或一个闭合四顶点多段线（随数值转向）"

[[cards.variants]]
id = "native_value_box"
title = "原生尺寸的数值外加方框"
distinguishing = "方框由散线画在原生尺寸文字周围"
encodings = ["loose"]
tests = ["boxed_native_value_is_theoretically_exact"]

[[cards.variants]]
id = "line_box"
title = "散线尺寸或引出数值外的方框"
distinguishing = "方框由三到四条直线组成，底边可与引线台共用"
encodings = ["loose"]
tests = ["boxed_loose_value_is_theoretically_exact", "boxed_value_on_extended_dimension_line_is_one_dimension"]

[[cards.variants]]
id = "closed_polyline_box"
title = "闭合多段线方框"
distinguishing = "一个闭合的四顶点多段线围住尺寸数值，长边与数值方向平行（数值旋转时方框一起旋转），框内只有这一个数值"
encodings = ["loose"]
tests = ["closed_polyline_box_around_a_rotated_value_is_theoretically_exact"]

[[cards.counter_examples]]
statement = "公差框格的格子围住的公差值不是理论正确尺寸"
test = "frame_cell_value_is_not_a_theoretically_exact_dimension"

[[cards.counter_examples]]
statement = "闭合方框里除尺寸数值外还有别的文字（表格单格、栏目格），不是理论正确尺寸的方框"
test = "closed_box_holding_two_texts_is_not_a_ted_box"

[[cards.parameters]]
name = "top_offset_min"
value = 0.45
meaning = "上边到数值中心的距离下限 = 该值 × 字高"

[[cards.parameters]]
name = "top_offset_max"
value = 1.8
meaning = "上边到数值中心的距离上限 = 该值 × 字高"

[[cards.parameters]]
name = "corner_tolerance"
value = 0.25
meaning = "方框角点重合的容差 = 该值 × 字高"

[[cards.parameters]]
name = "box_width_extra"
value = 4.0
meaning = "上边长度上限 = 数值宽度 + 该值 × 字高"

[[cards]]
id = "local_section_boundary"
expression_kind = "break_line"
title = "局部剖视的波浪线"
meaning = "局部剖视中剖开部分与未剖部分的分界线，用细实线徒手画的波浪线表示；剖面线画在它与轮廓之间，可以是填充对象，也可以是一根根散线。细的徒手曲线只能是波浪线，不是可见轮廓（可见轮廓是粗实线）。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线（波浪线）",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图（局部剖视）",
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图",
  "用户 2026-11-06 截图核对：主视图 I 圈中围住散线剖面线的细徒手曲线被认成可见轮廓",
]
knowledge_units = ["K12", "K13"]
recognition = "以一条徒手曲线为锚（开口、无凸度、顶点不少于给定数、每处转角小而整体弯曲；不是粗实线层）：曲线的顶点落在剖面填充的边界上，或有两条以上互相平行的斜向细线（剖面线）一端落在曲线上或其附近，即为局部剖视的边界——判断靠上下文而不靠颜色，各图层颜色因图而异。以图纸自己的细线颜色画的徒手曲线即使连着轮廓也不归入可见轮廓。"
markers = []
concepts = ["DC-G1-032", "DC-G2-023"]

[[cards.components]]
role = "break_curve"
primitives = ["LWPOLYLINE", "POLYLINE", "SPLINE"]
requirement = "细实线徒手曲线"

[[cards.components]]
role = "section_lines"
primitives = ["HATCH", "LINE"]
requirement = "剖面填充或散线剖面线，落在曲线上"

[[cards.variants]]
id = "hatch_entity"
title = "围住剖面填充对象"
distinguishing = "曲线顶点在填充边界上"
encodings = ["loose"]
tests = ["local_section_boundary_around_a_hatch_entity"]

[[cards.variants]]
id = "loose_hatch_lines"
title = "围住散线剖面线"
distinguishing = "两条以上平行斜细线一端落在曲线上"
encodings = ["loose"]
tests = ["local_section_boundary_around_loose_section_lines"]

[[cards.counter_examples]]
