[[concepts]]
id = "DC-G9-008"
name = "重要特性与关键件注语"
aliases = []
group = "G9"
kind = "note"
meaning = "说明零件或其某些尺寸、要求属于关键或重要级别的注语，如“关键件”“重要件”“关键特性”“重要特性”“本图有重要特性×处”，提示制造和检验时重点控制。"
components = ["整图级注语：“本图有重要特性×处”，常在技术要求中或标题栏附近。", "零件级标识：“关键件”“重要件”，常写在标题栏附近或明细栏备注中。", "特性级标识：在重要尺寸或要求旁加专用标记（企业常用☆、★或带框字母等），并由注语说明标记的含义和数量。"]
