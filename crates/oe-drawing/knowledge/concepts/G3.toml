meaning = "准双曲面齿轮副、8字啮合锥齿轮副、轴线斜交的锥齿轮副以及轴线斜交的平面齿轮与锥齿轮啮合，各按标准给出的图例绘制，线型规则与一般锥齿轮啮合相同。"
components = ["每个齿轮按单个锥齿轮画法：齿顶线粗实线、分度线细点画线，剖视中轮齿不剖。", "两轴线按实际关系画出：斜交时夹角不等于90°；准双曲面副两轴线不相交而有偏置距。", "剖切平面通过两轴线时，啮合区一个齿轮的轮齿用粗实线，另一个被遮挡部分用细虚线或省略。", "平面齿轮的分度面为平面，其分度线与自身轴线垂直。"]
