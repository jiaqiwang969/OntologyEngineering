[[concepts]]
id = "DC-G2-071"
name = "剖视图和断面图的配置"
aliases = []
group = "G2"
kind = "view"
meaning = "剖视图和断面图可按基本视图的位置配置，也可按投射关系配置在与剖切符号相对应的位置，必要时允许配置在其他适当位置（此时须标注）。"
components = ["基本视图位置：与主视图按第一角规则对齐。", "剖切符号对应位置：沿投射方向配置在剖切符号一侧。", "其他位置：自由配置，须有“X—X”名称和剖切符号。"]
variants = ["basic-view position", "projection relation to cutting symbol", "elsewhere"]
dxf_forms = ["No entity; layout relation between view-cluster bounding boxes and cutting-symbol positions"]
recognition = "在视图布局层面判断：计算各视图簇外框，若剖视与主视图在水平或竖直方向对齐并位于基本视图规定方位→基本视图位置；若位于剖切符号箭头所指一侧并与剖切线对齐→投射关系配置；否则为自由配置，应有名称，没有则报缺标注。"
confusions = ["基本视图：没有剖面线。", "向视图：单字母名称。"]
related = ["DC-G2-066", "DC-G2-067", "DC-G2-073", "DC-G2-072", "DC-G2-084"]
priority = "medium"
