schema="oev2.design-fragment/2"

[[types]]
name="NxAssemblySceneMember"
contract_group="engineering"
identity="Source-bound scene intent, never native evidence"
meaning="独立实例及首次进入点；重复原型不合并实例"

[[types.fields]]
name="initial_pose"
rust_type="NxAssemblyPoseTarget"
required=true
format="typed"
meaning="初始或首次进入时的绝对SI姿态，已烘焙坐标不得重复应用"
unit="SI米/秒/无量纲旋转；身份无量纲"
precision="输入原值；原生回读和制造精度分别验收"
write="agent整理来源；Rust检查；ggen生成合同"
applicability="显式新场景版本，不改变已有motion /1执行"
acceptance="逐实例完整性、进入时序、父级顺序、预算、原生执行和工程采用分别核验"

[[types.fields]]
name="introduction_sample"
rust_type="Option<String>"
required=false
format="typed"
meaning="None为开始前已存在，否则为首次进入的唯一样本，此后保留"
unit="SI米/秒/无量纲旋转；身份无量纲"
precision="输入原值；原生回读和制造精度分别验收"
write="agent整理来源；Rust检查；ggen生成合同"
applicability="显式新场景版本，不改变已有motion /1执行"
acceptance="逐实例完整性、进入时序、父级顺序、预算、原生执行和工程采用分别核验"

[[types]]
name="NxAssemblySceneTimeline"
contract_group="engineering"
identity="Source-bound scene intent, never native evidence"
meaning="真实来源装配的场景成员与离散运动计划，非原生观测"

[[types.fields]]
name="schema"
rust_type="String"
required=true
format="typed"
meaning="显式oev2.nx-assembly-scene-timeline/1"
unit="SI米/秒/无量纲旋转；身份无量纲"
precision="输入原值；原生回读和制造精度分别验收"
write="agent整理来源；Rust检查；ggen生成合同"
applicability="显式新场景版本，不改变已有motion /1执行"
acceptance="逐实例完整性、进入时序、父级顺序、预算、原生执行和工程采用分别核验"

[[types.fields]]
name="members"
rust_type="Vec<NxAssemblySceneMember>"
required=true
format="typed"
meaning="完整场景逐实例清单，含静止对象和晚进入工具"
unit="SI米/秒/无量纲旋转；身份无量纲"
precision="输入原值；原生回读和制造精度分别验收"
write="agent整理来源；Rust检查；ggen生成合同"
applicability="显式新场景版本，不改变已有motion /1执行"
acceptance="逐实例完整性、进入时序、父级顺序、预算、原生执行和工程采用分别核验"

[[types.fields]]
name="samples"
rust_type="Vec<NxAssemblyMotionSample>"
required=true
format="typed"
meaning="单分支严格递增时间的完整样本；目标为绝对位置"
unit="SI米/秒/无量纲旋转；身份无量纲"
precision="输入原值；原生回读和制造精度分别验收"
write="agent整理来源；Rust检查；ggen生成合同"
applicability="显式新场景版本，不改变已有motion /1执行"
acceptance="逐实例完整性、进入时序、父级顺序、预算、原生执行和工程采用分别核验"

[[constraints]]
id="nx_scene_lifecycle"
requirement="req_engineering"
module="nx_worker"
check="plan"
rust_path="crates/oe-nx-worker/src/assembly_motion/scene.rs"
statement="完整场景按occurrence路径保留重复原型实例；初始及已引入对象不删除，父先于子，首次引入必须有相同绝对姿态，提前/缺失/错原型目标拒绝；线性成员/样本计划不冒称原生创建或碰撞通过。"
severity="error"

[[validations]]
id="scene_duplicate_prototypes_preserve_instances_and_staged_tools"
module="nx_worker"
constraint="nx_scene_lifecycle"
behavior="duplicate_prototypes_preserve_instances_and_staged_tools"
rust_path="crates/oe-nx-worker/tests/scene_lifecycle.rs"
oracle="同原型多个实例不合并，工具按样本加入并保留；初始坐标不重算"
scope="Rust场景计划；真实原生构建、依赖、保存重开及工程采用另验"

[[validations]]
id="scene_rejects_invalid_membership_and_introduction"
module="nx_worker"
constraint="nx_scene_lifecycle"
behavior="rejects_invalid_membership_and_introduction"
rust_path="crates/oe-nx-worker/tests/scene_lifecycle.rs"
oracle="重复路径、未知样本、提前目标、漏进入姿态、错原型、父缺失或晚到、预算、非刚性姿态拒绝"
scope="Rust场景计划；真实原生构建、依赖、保存重开及工程采用另验"

[[validations]]
id="scene_nested_additions_are_parent_first_and_samples_are_unique"
module="nx_worker"
constraint="nx_scene_lifecycle"
behavior="nested_additions_are_parent_first_and_samples_are_unique"
rust_path="crates/oe-nx-worker/tests/scene_lifecycle.rs"
oracle="倒序输入仍父先子后；重复样本或非递增时间拒绝"
scope="Rust场景计划；真实原生构建、依赖、保存重开及工程采用另验"
