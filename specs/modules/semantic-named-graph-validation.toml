[[interfaces]]
name="SemanticNamedGraphValidationPort"
module="semantic_runtime"
method="validate_named_graph"
input="SemanticNamedGraphValidationRequest"
output="SemanticNamedGraphValidationResult"
error="SemanticRuntimeFailure"
effects="One local default-resource source load for stateless request; immutable single-graph validation thereafter, no existing Project/Dataset/cache mutation or adoption"
rust_path="crates/semantica-runtime/src/runtime.rs"
implementation="RustSemanticRuntime"

[[constraints]]
id="semantic_explicit_named_graph_validation"
requirement="req_semantic_platform"
module="semantic_runtime"
check="validate_named_graph"
rust_path="crates/semantica-runtime/src/dataset.rs"
statement="Immutable DatasetSession borrows the complete source, enforces default100000-quads/16MiB before selection even for a larger context profile, selects exact NamedNode IRI and copies original s/p/o terms into a temporary default graph for the existing SHACL evaluator. Preserve blank identity, literals, shape preflight, constraint activation, all findings, absence/empty target semantics, revision/cache/package state. Never remove the old validate_dataset named-graph guard or implicitly flatten/default/union data. No snapshot/RDFC prerequisite adds a new blank-node rejection to validation."
severity="error"

[[constraints]]
id="semantic_named_graph_source_transport"
requirement="req_semantic_platform"
module="semantic_runtime"
check="execute_named_graph_validation"
rust_path="crates/semantica-runtime/src/runtime.rs"
statement="Generated request/result/port bind original complete data/shapes SHA, explicit trig/nquads and named IRI, full canonical request SHA and actual pre/post validation revision. Decoded data/shapes/selector each retain existing MAX_BYTES16MiB before cloning/hashing. New transport is bounded by 6*(data16MiB+shapes16MiB+selector16MiB)+4096 = 288MiB+4KiB, covering worst-case JSON escaping without narrowing either original file's capacity. This transport allowance does not raise RDF, full-Dataset, query or SHACL evaluation bounds. kernel validate-named uses the same strict JSON/private path/execution guard, outputs nonconformance with exit1, and leaves every old json_input/validate/BookRunner/promoted-review contract unchanged."
severity="error"

[[validations]]
id="verify_named_graph_source_cases_preserve_selection_and_request_identity"
module="semantic_runtime"
constraint="semantic_named_graph_source_transport"
behavior="named_graph_source_cases_preserve_selection_and_request_identity"
rust_path="crates/semantica-runtime/tests/named_graph.rs"
oracle="Source-derived exact good/bad/other/absent graph results and full findings; metadata/format/request/source hashes retained. Both original data and shapes at legal independent byte limits remain transportable."
scope="Independently source-derived single named-IRI graph profile and current Rust execution; original graph_name=None whole-Dataset backend behavior, full SHACL/13494 migration and engineering adoption remain open"

[[validations]]
id="verify_named_graph_validation_preserves_session_and_original_default_guard"
module="semantic_runtime"
constraint="semantic_explicit_named_graph_validation"
behavior="named_graph_validation_preserves_session_and_original_default_guard"
rust_path="crates/semantica-runtime/tests/named_graph.rs"
oracle="Actual same-session validation leaves complete quads, revision, caches and registered packages unchanged; old mixed-Dataset validate_dataset continues refusal."
scope="Independently source-derived single named-IRI graph profile and current Rust execution; original graph_name=None whole-Dataset backend behavior, full SHACL/13494 migration and engineering adoption remain open"

