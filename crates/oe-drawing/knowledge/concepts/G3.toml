meaning = "单个锥齿轮的规定画法：轴向剖视中齿顶线、齿根线向锥顶收敛，分度线为细点画线，轮齿按不剖处理；端视图中画大端和小端齿顶圆（粗实线）及大端分度圆（细点画线），齿根圆不画。"
