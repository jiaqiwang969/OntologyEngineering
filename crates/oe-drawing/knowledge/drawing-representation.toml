[[cards]]
id = "local_section_boundary"
expression_kind = "break_line"
title = "局部剖视的波浪线"
meaning = "局部剖视中剖开部分与未剖部分的分界线，用细实线徒手画的波浪线表示；剖面线画在它与轮廓之间，可以是填充对象，也可以是一根根散线。细的徒手曲线只能是波浪线，不是可见轮廓（可见轮廓是粗实线）。局部剖视的范围是波浪线（或折线、画成波浪线的短线串）与其两端之间的轮廓围成的区域：一条波浪线两端落在同一条轮廓线或圆上；两条波浪线横跨同一对轮廓，夹住其间的一段；或波浪线从轮廓画到局部放大圈，由圈限定。范围包括剖切面遇到空腔、未画剖面线的部分，所以不是剖面线的外接范围。区域内只因剖开才画出的图线是局部剖视专属的：被剖开而显露的不可见棱线（与在区域外止于同一点的虚线共线或同圆）、剖面的轮廓（围住剖面线、在区域外不以同一线型延续的粗线），连同剖面线和波浪线，完整结构中不画；区域外的轮廓、穿过区域线型不变的线、与区域外画法相同的要素（均布的孔、凸台的同一位置画法）不是。放大圈不围成局部剖视；以 X-X 命名的视图本身是剖视图，其中没有局部剖视；轮廓止于波浪线时，波浪线是断开处或局部视图的界线。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线（波浪线）",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 5.6（局部剖视图）",
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图 6.3（局部剖视图）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图（局部视图、局部放大图的边界）",
  "用户 2026-11-06 截图核对：主视图 I 圈中围住散线剖面线的细徒手曲线被认成可见轮廓",
]
knowledge_units = ["K12", "K13"]
recognition = "以一条徒手曲线为锚（开口、无凸度、顶点不少于给定数、每处转角小而整体弯曲；不是粗实线层）：曲线的顶点落在剖面填充的边界上，或有两条以上互相平行的斜向细线（剖面线）一端落在曲线上或其附近，即为局部剖视的边界——判断靠上下文而不靠颜色，各图层颜色因图而异。以图纸自己的细线颜色画的徒手曲线即使连着轮廓也不归入可见轮廓。范围：波浪线两端（容差为字高的给定比例）落在同一轮廓上时，与两端之间画出的那段轮廓围成；两条波浪线两端分别落在同一对轮廓上时，围住其间一段；波浪线一端在放大圈上、另一端在穿过圈的轮廓上时，由该轮廓与圈围成。围成的区域内要有剖面线，两端之间的轮廓要画出（从波浪线端点起沿边界延续、覆盖大部分），而且每个端点处的轮廓要越过波浪线向区域外延续（视图在波浪线外继续）。区域内整段落在其中、在区域外没有同线延续、也不是区域外相同要素的粗线是局部剖视专属的。"
markers = []
concepts = ["DC-G1-032", "DC-G2-023"]

