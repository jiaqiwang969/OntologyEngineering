meaning = "指引线与尺寸线对齐时被测的是导出要素，同一框格不再是组成要素的指引（GB/T 1182 8.2）"
[[cards.variants]]
id = "block_outline_dividers"
title = "整块框格：外框、分格竖线与嵌套的特征符号图块"
distinguishing = "一个图块中闭合外框被竖线分格；第一格的符号是子图块，箭头是闭合三角"
encodings = ["block"]
tests = ["frame_block_with_outline_dividers_and_nested_glyph"]
[[cards.variants]]
id = "line_outline_dividers"
title = "直线画的外框加竖线分格"
distinguishing = "外框四边是单独的直线，每边可由共线的几段拼成（相互重叠、相接或沿边错位），竖线贯通全高把外框分成格；公差值格按阅读顺序拼读：单独写的公差带符号 Ø 与其后的数值合为一个公差值，一个基准格内以空格分开的字母是几个基准"
encodings = ["loose"]
tests = ["frame_outline_drawn_in_staggered_line_pieces"]
[[cards.variants]]
id = "leader_pieces"
title = "分段画的指引线"
distinguishing = "指引线由几段直线画成：段与段共线而相互重叠，或在接头处留有很小的缝隙（相对框高）"
encodings = ["loose"]
tests = ["frame_leader_drawn_in_overlapping_pieces"]
[[cards.counter_examples]]
statement = "表格的一行（竖线越过这一行通到别的行）不是直线画的公差框格外框"
test = "table_rows_are_not_a_line_drawn_frame"
[[cards.parameters]]
name = "piece_offset_max"
value = 0.02
meaning = "同一边的共线段之间的横向偏差上限 = 该值 × 字高"
[[cards.parameters]]
name = "piece_gap_max"
value = 0.1
meaning = "同一边的共线段之间的缝隙上限 = 该值 × 字高（重叠不限）"
[[cards.parameters]]
name = "outline_height_min"
value = 0.8
meaning = "直线画的外框高度下限 = 该值 × 字高（框格高约为字高的两倍）"
[[cards.parameters]]
name = "outline_height_max"
value = 4.0
meaning = "直线画的外框高度上限 = 该值 × 字高"
[[cards.parameters]]
name = "leader_join"
value = 0.15
meaning = "指引线两段在接头处端点之间的缝隙上限 = 该值 × 框高"
[[cards.parameters]]
name = "leader_offset"
value = 0.04
meaning = "分段指引线的共线段之间的横向偏差上限 = 该值 × 框高"

[[cards]]
id = "surface_texture_symbol"
expression_kind = "surface_roughness"
title = "表面结构代号"
meaning = "GB/T 131 的表面结构图形符号：基本符号是两条不等长、夹角 60° 的细实线；加一短横封口表示要求去除材料，加内切小圆表示不允许去除材料；长边上加横线为完整符号，在其上下注写参数代号与极限值（如 Ra 3.2）及加工方法等补充要求。旧版（1993）只注数值、不写参数代号。符号尖端从材料外指向表面，可立在轮廓线、延长线或指引线上；符号与数值按从下或从右读的方向注写。大多数表面相同的要求可统一注在标题栏附近（“其余”）。"
sources = [
  "GB/T 131-2006 产品几何技术规范 技术产品文件中表面结构的表示法 4、5、11",
  "GB/T 131-1993 机械制图 表面粗糙度符号、代号及其注法 3.3–3.6、4.1",
  "GB/T 3505-2009 表面结构 轮廓法 术语、定义及表面结构参数 附录A",
  "机械制图（第7版）§9-4",
  "互换性与测量技术 4.3",
]
knowledge_units = ["K31", "K32"]
recognition = "以两条从同一点出发、夹角约 60°、长度比 1.5～3 的细线为锚：两臂间有横线封口为去除材料，内切小圆为不允许去除材料，长臂端有横线为完整符号。数值在符号内（图块属性）或开口一侧附近的文字；带 Ra、Rz 等代号为现行写法，只有数值为旧版写法。尖端所在的线的作用（轮廓、延长线、指引线、尺寸线）决定注在哪里；开口不朝上即按另一读图方向注写。"
markers = ["Ra", "Rz", "√", "其余"]
concepts = ["DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G6-069", "DC-G6-045", "DC-G6-046", "DC-G6-075", "DC-G6-027", "DC-G6-049", "DC-G6-053", "DC-G6-052", "DC-G6-032", "DC-G6-006", "DC-G6-051"]

[[cards.components]]
role = "roughness_symbol"
primitives = ["LINE", "LWPOLYLINE", "INSERT", "CIRCLE"]
requirement = "60° 折线及封口横线、小圆或长臂横线"
[[cards.components]]
role = "roughness_value"
primitives = ["TEXT", "MTEXT", "ATTRIB"]
requirement = "参数代号与数值"
[[cards.variants]]
id = "symbol_type"
title = "基本、去除材料、不去除材料、完整符号"
distinguishing = "封口横线、小圆、长臂横线"
encodings = ["block", "loose"]
tests = ["texture_symbol_types_name_their_concepts"]
[[cards.variants]]
id = "current_edition_value"
title = "现行写法：参数代号加数值"
distinguishing = "Ra 3.2"
encodings = ["text", "attribute"]
tests = ["texture_value_editions"]
[[cards.variants]]
id = "old_edition_value"
title = "旧版写法：只注数值"
distinguishing = "3.2"
encodings = ["text", "attribute"]
tests = ["texture_value_editions"]
[[cards.variants]]
id = "block_with_parameter_value"
title = "图块符号，块内写参数代号与数值"
distinguishing = "块内文字带 Ra、Rz 等代号"
encodings = ["block"]
tests = ["texture_value_editions"]
[[cards.variants]]
id = "block_value_apart"
title = "图块符号，数值写在旁边"
distinguishing = "图块内无文字，开口一侧附近有数值"
encodings = ["block"]
tests = ["rotated_texture_block_with_value_beside_it"]
[[cards.variants]]
id = "loose_strokes"
title = "散线画出的符号"
distinguishing = "两条细线成 60° 且旁有数值"
encodings = ["loose"]
tests = ["texture_symbol_drawn_with_loose_strokes"]
[[cards.variants]]
id = "reading_direction"
title = "旋转的符号（从右读）"
