[[concepts]]
id = "DC-G2-038"
name = "小圆角小倒角省略并注明"
aliases = []
group = "G2"
kind = "simplified_representation"
meaning = "在不致引起误解时，零件图中的小圆角、45°小倒角可以不画出，但必须注明尺寸或另加说明；尺寸也可简化标注，如两端相同倒角注“2×C1”。"
components = ["视图：棱边画成尖角，不画小圆角或倒角线。", "标注：用指引线注C或R尺寸（可带数量“n×”），或用文字说明（如“锐角倒圆R0.5”）。", "简化：顶边和底边相同的倒角只注一次，写成2×C1、2×C0.5。"]
variants = []
dxf_forms = ["LEADER/MLEADER or LINE + TEXT with content like 'C1', '2×C0.5' (× as U+00D7 or letter X)", "MTEXT note such as '锐角倒圆R0.5' near the view or in the technical requirements"]
recognition = "以文字“C数字”“R数字”及“锐角”“倒圆”“倒角”等词、带“n×”的倒角尺寸为锚点：若指引线所指棱角在几何上是尖角（没有45°短斜线或小圆弧），判为省略画出的小倒角/圆角，把尺寸挂到该棱边。几何上已有倒角线的属于普通倒角标注。"
confusions = ["真正的尖角：没有任何说明。", "未注圆角、未注倒角的统一说明：作用于全图未注处。", "已画出的倒角尺寸：几何上有倒角线。"]
