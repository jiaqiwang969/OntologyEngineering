[[concepts]]
id = "DC-G3-096"
name = "弹簧图样技术要求"
aliases = []
group = "G3"
kind = "note"
meaning = "弹簧零件图上以编号列表写出的技术要求，交代图形上不便标注的参数：旋向、有效圈数、总圈数、工作极限应力、热处理和检验要求等。"
components = ["“技术要求”标题加编号条目，通常位于视图右侧或下方、标题栏上方。", "压缩弹簧典型条目：旋向；有效圈数n；总圈数n1；工作极限应力；热处理要求；检验要求。", "拉伸弹簧加初拉力等；扭转弹簧加扭转角、扭矩等；板弹簧以总成刚度等要求为主。", "线径d、中径D或外径D2、自由高度H0、节距t等参数尽量直接注在图形上，困难时才写入技术要求。", "只要求刚度时不画机械性能图，在技术要求中写明刚度。"]
variants = ["压缩弹簧", "拉伸弹簧", "扭转弹簧", "板弹簧（总成刚度）"]
dxf_forms = ["MTEXT (or several TEXT lines) on text layer 11: heading '技术要求' followed by numbered lines", "Subscripted symbols (n1, τj, F0) written inline, as smaller-height TEXT, or with MTEXT height codes; Greek letters as Unicode or SHX font glyphs"]
recognition = "以“技术要求”文字块为锚点，若块中同时出现两项以上弹簧术语（有效圈数、总圈数、旋向、工作极限应力、支承圈、自由高度、刚度），且视图区有弹簧画法（等节距平行斜线或成排簧丝截面）和其上方的力—变形直线图，即判为弹簧图样技术要求。区分普通零件技术要求：不含弹簧术语；区分弹簧标记：标记是一行代号串（如YA…），通常在明细栏或标题栏材料/名称附近。"
confusions = ["一般零件技术要求：无弹簧术语。", "弹簧标记：单行代号串，而非编号列表。", "装配技术要求：在装配图上，针对装配调试。"]
related = ["DC-G3-102", "DC-G3-101", "DC-G3-097", "DC-G3-220", "DC-G3-221", "DC-G3-017", "DC-G9-002"]
