[[concepts]]
id = "DC-G4-051"
name = "沉孔或锪平符号 ⌴"
aliases = ["沉孔锪平符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "沉孔或锪平符号为开口向上的方槽形⌴，写在孔旁注中沉孔直径之前：后接深度符号和深度时表示圆柱形沉孔；不注深度时表示锪平，只刮出平面即可。"
components = ["符号：左右对称的U形，底边长2h，两侧竖边高h，线宽h/10。", "沉孔：旁注第二行写“⌴ØD↧h”，如8×Ø6.4与⌴Ø12↧4.5。", "锪平：只写“⌴ØD”而无深度，如4×Ø8.5与⌴Ø20（GB/T 16675.2-2012 5.18）。", "旁注可从剖视中孔的轴线引出，也可注在表示为圆的视图上。", "GB/T 16675.2-1996表1同样列有“沉孔或锪平”符号。"]
variants = ["counterbore ⌴Øxx↧yy", "spotface ⌴Øxx without depth (5.18)", "沉孔 ⌴φD↧h", "锪平 ⌴φD（无深度）"]
dxf_forms = ["MTEXT on LEADER/MULTILEADER: '8×%%c6.4\\P{\\Fgdt;v}%%c12{\\Fgdt;x}4.5' (gdt.shx 'v' = counterbore, 'x' = depth)", "MTEXT Unicode '\\U+2334' (⌴)", "exploded: three LINE strokes (U shape) before TEXT, or INSERT of a counterbore-symbol block", "hole-callout text produced by CAXA/GstarCAD hole tools (format uncertain)", "layer 08/09 or template dimension layer"]
recognition = "锚点为孔旁注第二行行首的U形符号：宽≈2h、高≈h、开口向上（gdt字符v、U+2334；OCR常读作“凵”“山”“⊥”）。其后为Ø值；若再跟↧和数值判为沉孔，否则判为锪平。几何佐证：剖视中孔口有台阶（较大直径的短圆柱），或圆视图中有同心大圆。排除：正方形□四边闭合；垂直度⊥在公差框格内；纹理符号⊥在表面结构符号旁。"
confusions = ["正方形符号□：四边闭合，写在边长前。", "垂直度符号⊥：位于公差框格首格。", "表面纹理符号⊥：位于表面结构符号旁。", "深度符号↧、埋头孔符号⌵：形状不同，常与本符号同在旁注中。", "OCR误识的“凵/山”字符。"]
related = ["DC-G4-088", "DC-G4-052", "DC-G4-045", "DC-G4-094", "DC-G4-077"]
