recognition = "锚点为挂在尺寸线上的文字（DIMENSION 或散线尺寸结构），去掉空格后匹配“(可选前缀 Ø/R/S/□ + 数值或角度)”，半角或全角括号均可，括号内无±、偏差或公差带代号。区分：极限偏差加括号的形式是“Ø30H7(+0.021 0)”，括号前已有数值和代号；两件共用一图时在同一位置并列两个值（一个带括号），并有说明指出括号值属于另一零件；镀涂前/后尺寸伴随“镀前”“镀后”字样；装配图重复序号加括号位于序号处；表面结构的 (√) 括号内是符号。"
