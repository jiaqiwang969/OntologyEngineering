recognition = "锚点为尺寸或指引线文字（常为R或Ø值）下方的粗短横线：与文字方向平行、长度≈文字宽、线宽≈d，距文字约0.2–0.5h。佐证：所指轮廓在本视图为椭圆或缩短的投影（例如折弯件斜翼上的圆角或孔），按图量得的尺寸与数值×比例不符。与不按比例的细下划线、注释下划线、删除线区分方法同上一卡。"
