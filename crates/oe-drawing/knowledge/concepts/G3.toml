components = ["图形符号为一条竖线与其底端向右的一条横线组成的直角，形如L。", "完整标记：符号、标准号、尺寸（两边宽×边厚）、切割长度，如“L GB/T 9787-50×50×4-1000”。", "简化标记可省去标准号，写成“L 90×56×7-500”，符号可用字母L代替。", "标记尽量靠近构件，方向与角钢位置一致。"]
