[[concepts]]
id = "DC-G8-026"
name = "明细栏续页"
aliases = []
group = "G8"
kind = "table"
meaning = "装配图上不能在标题栏上方配置明细栏时，把明细栏作为装配图的续页，按A4幅面单独绘制：表头在上，序号由上而下排列，可以连续加页，并在明细栏下方配置标题栏。"
components = ["A4图纸（竖放），图框内上部是表头行，下面是数据行，序号自上而下递增。", "格式（三）宽180 mm：序号10、代号46、名称70、数量10、备注(44)。", "格式（四）宽180 mm：列与装配图上的格式（一）相同，含材料和质量（单件、总计）。", "页面底部配置标题栏，张次栏注“共×张 第×张”。"]
variants = ["格式（三）: 序号/代号/名称/数量/备注", "格式（四）: full columns incl. material and mass"]
dxf_forms = ["separate layout or separate DWG with an A4 frame INSERT, table grid LINEs and cell TEXT", "ACAD_TABLE or row INSERTs with ATTRIBs, as for the on-drawing 明细栏"]
recognition = "以A4图框（内框约180×287）为锚点：图框内没有视图图形，主体是从顶部开始的一张表格，第一行含“序号、代号、名称、数量”，数据行序号自上而下递增，底部有标题栏，则判为明细栏续页。与装配图上明细栏的区别是方向相反（后者表头在下、序号向上）；与图样目录的区别：目录列为图号、名称、张数、幅面，没有数量和材料。"
confusions = ["独立的物料清单文件：通常没有图框和标题栏，或格式不同。", "图样目录或文件目录：列中有张数、幅面。", "装配图上的明细栏：表头在下、序号由下而上。"]
