acceptance = "预算内扩展到完整行；不足或超过读取器上限保留原游标与明确等待原因；经验核原件支持同一行限额；每包不超过 128 条可见原消息"
[[requirements]]
id = "single_rust_owner"
function = "所有入口共用 Rust 经验规则、Semantica 审查和任务生命周期"
condition = "TS 和 skill 只组织调用，程序独立于完整 v2 安装；模型提炼必须有显式提供方"
acceptance = "两个入口得到相同修订与拒绝；无提供方保留待整理任务；不把原文拼接当工程理解"

[[requirements]]
id = "fixed_large_history"
function = "大于整前缀核验预算的历史文件，先保存固定版本，再按有限窗口接续"
condition = "显式原件、独立私有归档目录和逻辑大小上限；当前支持 macOS 同文件系统原生克隆；日后原件变化属于另一捕获"
