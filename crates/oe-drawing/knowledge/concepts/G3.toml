[[concepts]]
id = "DC-G3-128"
name = "组合轴承的特征画法及规定画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "GB/T 4459.7表5给出滚针与推力圆柱滚子、滚针与推力球、滚针与角接触球等组合轴承的特征画法和规定画法：在一个（常为阶梯形）线框内同时画出径向与轴向（或角接触）的要素符号。"
components = ["线框为一个整体粗线框；含推力部分时外廓呈阶梯形（推力部分径向更高）。", "径向（滚针）部分为平行于轴线的长线加短线；推力部分为垂直于轴线的长线加短线；角接触部分为倾斜长线加短线，并与径向长线相接。", "部分型式有一条竖线伸到框边，表示套圈分体。", "规定画法：滚针为细长矩形、推力滚子为矩形、球为圆，冲压薄壁外圈呈U形；1998版另有图15示例组合轴承在装配图中的画法。"]
variants = ["滚针和推力圆柱滚子组合", "滚针和推力球组合", "滚针和角接触球组合", "向心滚针和保持架组件"]
dxf_forms = ["Exploded thick LINE strokes on layer 01 inside a stepped LWPOLYLINE frame; no HATCH", "Specified form: LWPOLYLINE rectangles/CIRCLEs for rolling elements, thin-wall cup profile, HATCH ANSI31 on rings", "INSERT of a combined-bearing library block (NKX/NKIA style) where available"]
recognition = "锚点为轴承位置的单一线框（可能为阶梯形外廓），框内同时含两种方向的长线（平行与垂直于轴线，或平行与倾斜），各有短线穿过。区分：两个相邻的独立轴承会有两个各自闭合的线框，且之间常有隔套或轴肩线；双列角接触为对称V形，不含平行轴线的滚针线。"
confusions = ["两个相邻的独立轴承：两个独立闭合线框，各自只有一种方向的符号。", "双列角接触轴承：两条斜线对称成V形或倒V形，无平行轴线的滚针线。"]
