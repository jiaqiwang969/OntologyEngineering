# Drafting concept catalogue, group G6: 表面结构.
# One card per representation concept; paraphrased from the cited sources (page = physical page of the library copy).
schema = "oev2.drawing-concept-catalogue/1"
group = "G6"
label = "表面结构"

[[concepts]]
id = "DC-G6-001"
name = "其余表面粗糙度注语"
aliases = []
group = "G6"
kind = "note"
meaning = "GB/T 24745规定的零件图图样注语之一：用“除标注外，其余加工处为（粗糙度符号）”一类文字，规定所有未单独标注的加工表面的粗糙度。"
components = ["注语文字（除标注外，其余加工处为……），通常写在技术要求中或标题栏附近。", "文字后接一个表面结构符号或代号（如√Ra 6.3），给出统一要求。", "只覆盖“加工处”，作用与多数表面简化注法（符号后加括号）相近。"]
variants = []
dxf_forms = ["MTEXT/TEXT in the technical-requirements block followed by an INSERT of the roughness symbol, or the symbol drawn inline with LINEs", "single MTEXT in which the symbol is imitated by a glyph from a symbol font (e.g. '√Ra6.3') — general practice", "numbered item inside the 技术要求 list (e.g. '3. 未注表面粗糙度…')"]
recognition = "锚点：含“其余”“除标注外”“未注”等词并含“粗糙度”或“加工”的文字；在该行末尾同一基线、右侧约2h以内寻找表面结构符号块或√字形，把其要求作为其余表面的统一要求。区分标题栏附近单独的“其余”符号：后者没有完整句子，符号后带括号或1993版只写“其余”二字。"
confusions = ["标题栏附近的“其余”符号（多数表面简化注法）：无完整句子，符号后带括号或旧版“其余”二字", "未注倒角/圆角注语：同为“未注…”句式，但讲倒角尺寸", "一般公差注语：讲GB/T 1804公差等级"]
related = ["DC-G6-006", "DC-G6-004", "DC-G9-002", "DC-G4-061", "DC-G1-070"]
priority = "medium"
text_forms = ["除标注外，其余加工处为√Ra 6.3", "其余加工面 Ra 12.5", "未注表面粗糙度为Ra 6.3"]
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = ["technical_note"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "Variants such as '未注表面粗糙度…' are general drafting practice, not from GB/T 24745 表5."
[[concepts.sources]]
document = "GB/T 24745-2009"
clause = "表5"
page = 7

[[concepts]]
id = "DC-G6-002"
name = "表面缺陷参数限值的文字注写"
aliases = []
group = "G6"
kind = "note"
meaning = "表面缺陷（SIM，加工、储存或使用中偶然生成的划痕、气孔、凹坑等）的允许程度用文字表达式给出，如缺陷数SIMn = 60或单位面积缺陷数SIMn/A = 10/50 mm²；它没有图形符号，表面结构代号也不包含缺陷。"
components = ["参数有缺陷长度、宽度、单一或混合深度、单一或混合高度、面积、总面积、缺陷数、单位面积缺陷数，均以SIM加下标表示。", "写法为“参数 = 极限值”，或“参数/A = 个数/评定面积”。", "GB/T 131-2006和GB/T 1031 6.5：表面粗糙度要求不适用于表面缺陷，评定时不计入缺陷，需要时单独规定。", "通常写在技术要求或检验文件中，而不是表面结构符号上。"]
variants = ["GB/T 15757-2002 第3章 (length, width, depth, height, area, number per area)", "GB/T 131-2006 第1章 and GB/T 1031 6.5: defects excluded from texture requirements, to be specified separately"]
dxf_forms = ["MTEXT/TEXT in the technical requirements, subscript written as smaller TEXT or MTEXT height change (\\H0.7x)", "'²' as Unicode U+00B2, '^2', or MTEXT stacking", "plain Chinese sentences about defects (e.g. 不允许有划痕) without SIM codes — general practice"]
recognition = "锚点：文字中的“SIM”字母组（后接小写下标，如n、l、w、a、t），以及“=”或“/A”结构；或“表面缺陷”字样。它不依附于表面结构符号。区分表面结构参数代号（R、W、P开头并在符号横线下方）和铸件技术要求中的缺陷描述（只有文字，无SIM代号，可关联但属于不同概念）。"
confusions = ["表面结构参数代号：R、W、P开头，位于符号横线下方", "铸件技术要求中的缺陷文字：无SIM代号，属技术要求", "单位面积写法与分数：SIMn/A后为“个数/面积”"]
related = ["DC-G6-075", "DC-G6-046", "DC-G9-002", "DC-G9-009"]
priority = "rare"
text_forms = ["SIMn = 60", "SIMn/A = 60/1 m²", "SIMn/A = 10/50 mm²"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Text form only; the sources define no drawn symbol for surface imperfections. Subscript letters are OCR-uncertain."
