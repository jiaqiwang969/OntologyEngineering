[[concepts]]
id = "DC-G8-017"
name = "焊接固定电子元器件用图形符号表示"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "仅以焊接固定、没有其他紧固工序的电子元器件，在装配图中可以用GB/T 4728规定的电气图形符号代替其外形画出。"
components = ["印制板或机械结构按正常画法画出。", "元器件位置画电气图形符号（如电阻的小矩形、电容的两条平行短线、二极管的三角形加短竖线），可附位号。", "焊点和引线不单独表示。"]
variants = []
dxf_forms = ["INSERT of electrical symbol blocks (GB/T 4728 library) or exploded small LINE/LWPOLYLINE symbols", "reference designators as TEXT such as 'R1', 'C3', 'VD1'"]
recognition = "在机械装配图的视图中出现电气符号形态（小矩形加两端引线、两条平行短线、三角形加短竖线等），并伴有字母加数字的位号（R、C、L、VD、VT、U等开头）时，判为本画法。与机构运动简图符号（GB/T 4460，表示运动副或传动）和焊缝符号（在指引线的基准线上）区分。"
confusions = ["机构运动简图符号：表示运动副或传动，不带电气位号。", "焊缝符号：位于焊缝指引线的基准线上。"]
