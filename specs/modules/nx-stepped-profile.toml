[[sources]]
id="stepped_profile_analytic_definition"
identity="Contiguous coaxial right circular cylinders: V=pi*sum(r_i^2*L_i); external A=pi*(sum(2*r_i*L_i)+r_first^2+r_last^2+sum(abs(r_i^2-r_previous^2)))."
role="Analytic software definition, separate from vendor topology observations and manufacturing tolerances"
applicability="mm/absolute +Z, 2..32 contiguous positive-length regions; no holes, fillets, tapers or native adoption"

[[constraints]]
id="nx_stepped_profile_axial_region_identity"
requirement="req_engineering"
module="nx_worker"
check="verify_axial_regions"
rust_path="crates/oe-nx-worker/src/geometry/stepped_profile.rs"
statement="Algorithm-local immutable numeric profile: finite mm/+Z origin bounded to 1e6mm, diameter and length 1e-4..1e5mm, total length <=1e5mm, all derived extents <=1e6mm; 2..32 ordered regions with adjacent radii differing by more than 2e-6mm. Unordered observations must match every distinct radius and axial span exactly once within 1e-6mm. Neither equal volume/area/bounds nor this local check establish complete native geometry, source binding, face ownership, saved bytes, independent reopen or engineering adoption. The analytic layer has no wire authority; source-bound intent/actions below are generated separately."
severity="error"

[[validations]]
id="nx_stepped_profile_frozen_numeric"
module="nx_worker"
constraint="nx_stepped_profile_axial_region_identity"
behavior="frozen_axial_profiles_match_independent_numeric_expectations"
rust_path="crates/oe-nx-worker/tests/stepped_profile.rs"
oracle="Preimplementation hand-derived A origin[11,-17,3], D/L16/12,30/20,20/15: V/pi6768,A/pi1542. B origin[-23,31,-9], D/L28/8,12/19,24/11: V/pi3836,A/pi1324. Fixed independent bounds and per-region endpoints; no native execution."
scope="Local Rust algorithm only; original frozen private fixture provenance retained separately"

[[validations]]
id="nx_stepped_profile_equal_volume_counterexample"
module="nx_worker"
constraint="nx_stepped_profile_axial_region_identity"
behavior="identical_volume_and_bounds_do_not_hide_wrong_axial_order"
rust_path="crates/oe-nx-worker/tests/stepped_profile.rs"
oracle="Reversing A segment order preserves volume, area and global bounds but must refuse axial-region agreement. Missing/extra/duplicate/nonfinite/invalid dimensions and out-of-tolerance observations also refuse in companion tests; repeated nonadjacent radius remains legal."
scope="Software negative controls; native API, complete topology and engineering design remain unverified"

