[[concepts]]
id = "DC-G4-043"
name = "均布缩写 EQS"
aliases = ["均布EQS", "均布符号 EQS"]
group = "G4"
kind = "dimension_symbol"
meaning = "EQS（均布）写在成组要素的尺寸后（如8×Ø6 EQS），表示这些孔、槽等等距分布，只需在一个要素上注出形状、大小、数量和定位；当成组要素的定位和分布在图中已明确时，可不注角度并省略EQS。"
components = ["组注：“n×尺寸”后接EQS，注在指引线基准线上或直径尺寸处。", "定位：通常同时注出分布圆直径（细点画线圆），必要时注一个定位角度。", "可省略：分布已明确（如四孔在对称正方位置）时，省略角度和EQS（GB/T 16675.2 A.2）。", "旧图纸：写汉字“均布”（如4×Ø8均布）或“n-Ød”。"]
variants = ["n×Ø… EQS", "EQS omitted when evident (A.2)", "Chinese text 均布 in older drawings"]
dxf_forms = ["MTEXT/TEXT '8×%%c6 EQS' on a LEADER/MULTILEADER shoulder", "DIMENSION dimtype 3 with override text '8×<> EQS' or '8X%%c6 EQS'", "old form TEXT '4-%%c8 均布'", "layer 08 or template dimension layer"]
recognition = "锚点为文字中的“EQS”（OCR变体E0S、EQ5、EOS）或“均布”。其前通常为“n×Ø..”或“n×M..”。几何验证：图中有n个同径CIRCLE（或螺孔符号）分布在一个细点画线分布圆上，相邻圆心夹角≈360°/n，或沿直线等距。排除：ACS、ALS等GPS修饰符是跟在公差后的其他缩写；技术要求段落中的“均布”不连指引线。"
confusions = ["只写数量的n×注法：未写EQS，分布由其他尺寸确定，不一定等距。", "GPS修饰符ACS、ALS等：大写缩写，含义不同，跟在尺寸公差之后。", "技术要求段落中的“均布”文字：不在指引线上。", "OCR误识E0S、EQ5：按上下文纠正。"]
related = ["DC-G4-066", "DC-G4-094", "DC-G4-088", "DC-G4-030", "DC-G1-044"]
priority = "medium"
text_forms = ["8×Ø6 EQS", "6×Ø7 EQS", "4×Ø8 EQS", "4×Ø8均布", "4-Ø8"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
