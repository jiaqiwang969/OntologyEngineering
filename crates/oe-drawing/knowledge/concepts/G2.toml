meaning = "视图、斜视图或断面图被旋转配置（不按投影方向摆放）时，在图名旁加注的半圆弧箭头：箭头方向表示旋转方向，名称字母靠近箭头端，必要时其后注旋转角度。"
components = ["半圆弧：半径等于字高的半圆。", "箭头：在半圆一端，指示图形的旋转方向。", "字母与角度：名称字母（或“X—X”）靠近箭头端，角度可写在字母之后，如“A45°”。", "笔画宽度：约为字高的1/10或1/14。"]
