meaning = "标注圆弧的展开长度：尺寸线是与被注圆弧同心的圆弧，尺寸界线平行于该弧所对圆心角的角平分线（弧度较大时可沿径向引出），数字左方加注弧长符号 ⌒。"
components = ["尺寸线：与被注圆弧同心的细实线圆弧，两端箭头", "尺寸界线：平行于圆心角的角平分线；弧度较大时沿径向", "弧长符号：以字高为半径的细实线半圆弧，GB/T 4458.4-2003 规定写在数字左方", "旧版（GB 4458.4-1984）习惯把弧线符号画在数字上方，读旧图时应兼顾"]
variants = ["extension lines parallel to angle bisector (图7)", "radial extension lines for large arcs (图8)"]
dxf_forms = ["ARC_DIMENSION entity (arc length dimension, AutoCAD 2006+); DIMARCSYM 0 = symbol before text, 1 = above, 2 = none", "older files: angular DIMENSION (dimtype 2/5) with override text '\\U+2312150' or '⌒150'", "exploded: ARC (dimension line) + 2 SOLID + 2 extension LINE + TEXT, with a small ARC of radius ≈ h drawn as the symbol or U+2312 in the text"]
recognition = "锚点为带两端箭头的圆弧尺寸线（ARC），其圆心与某轮廓 ARC/CIRCLE 的圆心重合（容差≈d），半径大于轮廓弧。文字前有弧长符号（字符 ⌒/U+2312，或文字左侧/上方一个半径≈h 的小半圆 ARC）。尺寸界线互相平行（平行于角平分线）或沿径向。数值≈R·θ×比例（mm，不带°）。与角度尺寸区分：角度数字带°、界线必沿径向并交于顶点、无 ⌒；与弦长区分：尺寸线是弧；与轮廓圆弧区分：轮廓弧无箭头无文字。"
confusions = ["角度尺寸：弧形尺寸线但单位为度，界线沿径向", "弦长尺寸：直线尺寸线，无 ⌒", "轮廓圆弧：没有箭头和文字"]
related = ["DC-G4-047", "DC-G4-024", "DC-G4-032", "DC-G4-058"]
