[[concepts]]
id = "DC-G3-058"
name = "螺钉连接画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "连接螺钉穿过一个零件的光孔（常带沉孔），直接旋入另一零件的螺孔，用于受力不大、不常拆卸的连接；装配图中螺钉按不剖绘制。"
components = ["剖切平面通过螺钉轴线时螺钉不剖；被连接件剖面线方向相反。", "螺钉头与沉孔之间、螺杆与通孔（约1.1d）之间是不接触面，画两条线；螺钉头支承面与零件接触，画一条线。", "螺钉旋入螺孔部分按螺纹旋合画法；螺钉的螺纹终止线应高于两零件结合面，螺孔深度大于旋入深度，下方仍画出钻孔。", "薄垫片宽度不大于2 mm时可涂黑。"]
variants = []
dxf_forms = ["INSERT of a screw block from the standard-part library (often exploded): head as thick LWPOLYLINE (cylindrical head with hexagon socket shown dashed, or countersunk 90° head)", "two HATCH ANSI31 regions with opposite angles; boundaries follow counterbore and clearance-hole LINEs above and thread major LINE in the engaged zone", "thin minor-diameter LINEs inside the screw, thick thread-end LINE above the joint face; blind tapped hole with 120° drill point below", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一根无剖面线的螺杆，上端有头部（圆柱头高约d、头径约1.5d，或90°沉头），头部落在上零件的沉孔中；螺杆在上零件内与孔壁有约0.05d的双线间隙，在下零件内进入螺纹旋合段，下方还有未旋满的螺孔和120°钻尖；上零件无螺纹。与螺栓连接区分：无螺母和垫圈、下零件有螺孔；与双头螺柱连接区分：螺柱无头部、上端有螺母；与紧定螺钉区分：紧定螺钉无头（或小头）、尖端顶在轴上。"
confusions = ["螺栓连接：有螺母、垫圈，两零件都是光孔。", "双头螺柱连接：无头部，上端有螺母。", "紧定螺钉：起固定作用，尖端顶入锥坑。"]
related = ["DC-G3-053", "DC-G3-014", "DC-G3-044", "DC-G3-043", "DC-G3-056", "DC-G3-060", "DC-G3-002", "DC-G3-129", "DC-G8-005", "DC-G2-057", "DC-G4-051"]
