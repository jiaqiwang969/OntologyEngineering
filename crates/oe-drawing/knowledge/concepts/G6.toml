meaning = "ISO 21920-1草案中，多个相同特征有相同表面结构要求时，在图形符号前写特征数量加“×”（如8×），类似重复尺寸的数量前缀。"
components = ["数量与“×”写在图形符号前方（左侧），同一基线。", "符号指向其中一个特征，要求作用于全部n个特征。", "草案示例与“8× Ø4±0.1”尺寸并用（图18）。", "GB/T 131-2006没有此写法，同类情况按“只注一次”的原则处理。"]
