recognition = "锚点为一根宽度明显大于同图粗实线（约2倍）的直线；在DXF中看LWPOLYLINE全局宽度或LINE的线宽值。若全图线宽未设置，则需靠语境：直线上穿有回转副、齿轮、带轮、联轴器等符号，而端点不是铰链小圆。与零件轮廓线区分：轮廓线成封闭投影图形并带尺寸；与中心线区分：中心线为细点画线。"
