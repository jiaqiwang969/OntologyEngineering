[[concepts]]
id = "DC-G3-068"
name = "链轮画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "链轮按齿轮规定画法绘制：齿顶圆粗实线、分度圆细点画线、齿根圆细实线或省略；剖视中轮齿按不剖处理，齿形可局部画出或用局部放大图表示。"
components = ["端视图：齿顶圆粗实线，分度圆细点画线，齿根圆细实线（可省略）。", "轴向剖视：轮齿不画剖面线，齿根线画粗实线；轮缘断面显示齿宽方向的倒角形状。", "齿形：在视图中画出一两个齿或用局部放大图。", "通常附链轮参数表（齿数、节距、滚子直径等）。"]
variants = ["视图加剖视"]
dxf_forms = ["Concentric CIRCLEs: thick tip circle, CENTER-linetype pitch circle (layer 05), thin or absent root circle", "Axial section: thick LINEs for tip and root, HATCH on hub/web only, tooth zone unhatched", "A few thick ARC/LINE tooth-gap profiles on a small sector, or a detail view with a scale label", "Parameter table as LINE grid + TEXT (齿数 z, 节距 p, 滚子直径)"]
recognition = "几何锚点与齿轮相同：一个粗实线圆加一个略小的点画线圆（同心）。区分链轮与齿轮主要靠文字：参数表出现“节距p”“滚子直径”“链号”，或标题栏名称含“链轮”；若画出齿形，链轮齿槽为大半径圆弧（滚子座），齿数较少，齿顶窄；齿轮为渐开线短齿并有“模数m”。与棘轮区分：棘轮为单向锯齿；与带轮区分：带轮无点画线分度圆，轮缘有V槽。"
