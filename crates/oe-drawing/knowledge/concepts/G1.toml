[[concepts]]
id = "DC-G1-102"
name = "A型与B型字体（字母与数字）"
aliases = ["数字与字母字体"]
group = "G1"
kind = "text_convention"
meaning = "图样中拉丁字母、希腊字母、阿拉伯数字和罗马数字的两种字形：A型笔画宽为字高的1/14，B型为1/10；同一图样只用一种，可写成斜体或直体。"
components = ["A型：笔画宽 h/14，小写字母高约10/14 h，字母间距约2/14 h，词间距约6/14 h。", "B型：笔画宽 h/10，小写字母高约7/10 h，字母间距约2/10 h，无发音符号时基准线最小间距约15/10 h，词间距约6/10 h。", "斜体字头向右倾斜，与水平基准线成75°；直体竖直。", "附录示例给出拉丁、希腊字母和阿拉伯、罗马数字。"]
variants = ["A型（d=h/14）", "B型（d=h/10）", "拉丁字母、希腊字母、阿拉伯数字、罗马数字示例（附录A）", "A型", "B型", "斜体", "直体", "罗马数字"]
dxf_forms = ["STYLE table entry: font file (3) such as gbenor.shx (upright) or gbeitc.shx (italic), isocp.shx; big font (4) gbcbig.shx; width factor (41); oblique angle (50) of 15° for italic", "TEXT/MTEXT height (40) of 2.5, 3.5, 5 …", "MTEXT inline font/oblique codes such as \\f…; and \\Q15;"]
recognition = "字形在 DXF 中不直接可见，可由文字样式推断：字体文件名、倾斜角（15°即75°斜体）、宽度因子。字母数字高度应落在1.8、2.5、3.5、5…系列上。DXF 文本可直接取字符串，1/l、0/O 等字形混淆只在光栅或矢量化来源中需要处理。"
confusions = ["CAD 字体 CA/CB 型：矢量字体规则，与 A/B 型对应。", "OCR 中斜体 1/l、0/O 混淆：只影响光栅来源。"]
