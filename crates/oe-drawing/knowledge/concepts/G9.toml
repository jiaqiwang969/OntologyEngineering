components = ["常见写法：“去毛刺、锐边”“去毛刺，锐角倒钝”“锐边倒钝”“去除毛刺飞边”。", "相反要求：“保持锐边”，常用于刃口、密封边等。", "一般不带尺寸；需要尺寸时改用倒角注语或GB/T 19096棱边状态符号。"]
