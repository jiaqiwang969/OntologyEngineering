components = ["指引线：细实线，倾斜，终端为实心箭头，指到要素轮廓（如圆周）上", "基准线：与指引线相连的水平细实线", "尺寸文本：数量×直径及 EQS 等缩写写在基准线上方", "GB/T 16675.2-1996 与 2012 表2 5.2 规定一致"]
variants = []
dxf_forms = ["LEADER entity (arrow flag 71=1) with associated MTEXT '16×%%c2.5 EQS'; QLEADER produces the same", "MULTILEADER with closed-filled arrow and MTEXT content", "DIMENSION dimtype 3 whose text is moved outside on a leader (DIMTMOVE=1); arrow touches the circle", "exploded: LINE(s) + SOLID arrow + TEXT on layer 09 (leader) or 08"]
recognition = "锚点为带尺寸语义的文字（Ø、R、n×、EQS、M）位于一条水平短线之上，水平线一端接斜线，斜线另一端有实心箭头且箭头尖落在圆/弧周（到圆心距离≈半径）或轮廓上。若文字中的数量 n 与图中同径圆的个数一致→该组孔的尺寸。与尺寸线区分：尺寸线两端有箭头并配尺寸界线；与零件序号指引线区分：序号指引线末端是圆点（在零件内），另一端是较大的序号字；与几何公差指引线区分：另一端连公差框格。"
confusions = ["尺寸线：两端箭头，配合尺寸界线", "零件序号指引线：末端圆点，序号字较大或在圆圈内", "几何公差指引线：连接公差框格", "表面结构、焊接符号的指引线：连接相应符号"]
