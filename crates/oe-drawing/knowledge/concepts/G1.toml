recognition = "锚点：斜指引线与水平基准线交点处的小圆（直径约2 mm）。与几何公差全周符号（另一端连公差框格）、表面结构全周符号（在表面结构符号长边与横线交点）、周围焊缝符号（在焊缝箭头线与基准线交点）区分：看基准线挂接的是普通文字、框格、表面结构符号还是焊缝符号。"
