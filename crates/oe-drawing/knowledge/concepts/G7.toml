meaning = "焊缝尺寸的字母符号：在尺寸较多、易混淆时写在数值前，以说明该数值的含义，如δ工件厚度、α坡口角度、β坡口面角度、b根部间隙、p钝边、R根部半径、H坡口深度、S有效厚度、c焊缝宽度、K焊脚、d熔核直径或孔径、n段数、l焊缝长度、e间距、N相同焊缝数量、h余高。"
components = ["截面类：δ、p、H、K、h、S、R、c、d，写在基本符号左侧。", "角度与间隙类：α、β、b，写在符号上侧或下侧。", "长度类：n、l、e，写在符号右侧，组成n×l(e)。", "数量类：N，写在尾部。"]
