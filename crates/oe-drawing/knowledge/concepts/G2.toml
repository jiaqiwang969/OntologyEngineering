[[concepts]]
id = "DC-G2-069"
name = "两个以上相同视图的表示"
aliases = ["相同视图只画一个"]
group = "G2"
kind = "view"
meaning = "一个零件上有两个或两个以上图形相同的视图时，可只画一个视图，并用带字母和数字的箭头表示各投射方向和位置（A1、A2……），所画视图上方注出全部名称（如“A1, A2”）。"
components = ["投射箭头：每个方向一个箭头，旁注字母加数字（A1、A2）。", "画出的视图：只画一个，上方注“A1, A2”。", "也用于相同的局部视图和斜视图。"]
variants = ["identical direction views", "identical local and oblique views (Fig 38)"]
dxf_forms = ["Arrow entities (LWPOLYLINE/SOLID/LEADER) with TEXT 'A1', 'A2'; one view label TEXT 'A1,A2' or 'A1, A2'"]
recognition = "以由逗号并列的“字母+数字”视图名称（如A1, A2）为锚点，在其他视图中找到对应的A1、A2箭头。单字母为向视图；X—X为剖视名称；图框边上的字母+数字为分区代号。"
confusions = ["向视图：单个字母。", "剖视名称：A—A。", "分区代号（如A1）：位于图框分区处。"]
related = ["DC-G2-072", "DC-G2-076", "DC-G2-080", "DC-G1-104"]
priority = "low"
text_forms = ["A1, A2", "A1", "A2"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
