meaning = "用细点画线画出一组孔（如法兰上的均布孔）的分布圆或分布直线，孔的圆心都在其上，表示孔的定位关系。"
components = ["细点画线圆（定位圆）或直线（直线排列的孔），通常与零件中心同心。", "每个孔另有径向点画线（或十字中心线）穿过孔心，与分布圆在孔心相交。", "常与“n×Ø… EQS”及定位圆直径尺寸配合。"]
variants = []
