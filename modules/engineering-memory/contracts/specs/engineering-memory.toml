[[requirements]]
id = "client_lifecycle"
function = "在真实 Codex/Claude 会话开始和提交任务时提供有限经验，在阶段结束时登记原件待接续"
condition = "已安装并由客户端实际触发；项目只来自 agent 显式激活的会话绑定，原件只能来自已配置目录"
acceptance = "遵守真实 hook 输入输出；不阻断用户、不启动模型、不从曝光推断实际使用；缺源/过期绑定可见"

[[modules]]
id = "memory_hooks"
kind = "adapter"
rust_path = "modules/engineering-memory/runtime"
purpose = "两类客户端事件的薄适配，复用 session 与 workflow 的同一 Rust owner"
realizes = ["client_lifecycle", "bounded_session_selection"]
platform = "Codex/Claude command hook stdin/stdout；本地 Rust"
effects = "写本次上下文与明确原件的接续请求；不写客户端配置、Project、skill 或代码"
failures = "未支持事件、无效输入、来源越界、项目变化与队列失败显式返回；用户会话可继续"
status = "source_only"
depends_on = ["memory_session", "memory_runtime"]

[[constraints]]
id = "hook_source_scope"
requirement = "client_lifecycle"
module = "memory_hooks"
check = "queue_hook_source"
rust_path = "modules/engineering-memory/runtime/src/hooks.rs"
statement = "只登记显式来源目录内当前客户端提供的普通 JSONL；目录别名须解析到已配置正本，文件链接和越界拒绝；不从 cwd 推断项目或把结束事件写成有益反馈"
severity = "error"

[[validations]]
id = "hook_lifecycle_counterexamples"
constraint = "hook_source_scope"
module = "memory_hooks"
behavior = "hook_context_and_intake_keep_project_and_feedback_separate"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "两个客户端共享核心；原件越界/会话身份冲突拒绝；结束事件只排待整理；上下文变化不复用旧采用"
scope = "真实 hook wire 合同与本机进程检查；安装可信状态和真实宿主触发须另核"

