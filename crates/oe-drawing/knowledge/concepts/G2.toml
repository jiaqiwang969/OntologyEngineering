[[concepts]]
id = "DC-G2-070"
name = "分解图"
aliases = []
group = "G2"
kind = "view"
meaning = "形象化表示法的一种：用轴测或透视投影把装配体各零件按相同比例画出，沿公共轴线按合适顺序拉开，表示零件之间的相互关系；同类还有假想局部透明以显示内部构造的X射线图。"
components = ["零件图形：轴测或透视画法，比例相同。", "分离方向：沿公共装配轴线依次排列，轴线常用细点画线。", "序号：可为各零件编号。"]
variants = ["X射线图（假想局部透明以显示内部构造的形象化图）"]
dxf_forms = ["Pictorial geometry (LINE/ELLIPSE/SPLINE) in separate clusters along dash-dot axis LINEs; balloons as CIRCLE + TEXT or INSERT"]
recognition = "以轴测风格几何（线方向集中于轴测轴、有椭圆）分成多个互不接触的零件团块、沿一条或几条细点画线排列为锚点，常带序号。装配图为正投影且零件相接；单件轴测图只有一个团块。"
confusions = ["装配图：正投影，零件相接。", "轴测图（单件）：只有一个零件。"]
related = ["DC-G2-086", "DC-G2-087", "DC-G2-088", "DC-G8-024"]
