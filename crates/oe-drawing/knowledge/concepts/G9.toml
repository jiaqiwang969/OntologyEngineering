[[concepts]]
id = "DC-G9-011"
name = "锻件技术要求注语"
aliases = []
group = "G9"
kind = "note"
meaning = "锻件零件图技术要求中对锻造质量的说明，如不允许有肉眼可见的裂纹、折叠，不允许有白点、内部裂纹和残余缩孔，非加工表面缺陷应清理并圆滑过渡，保证锻透，在能力足够的锻压设备上锻造等。"
components = ["外观缺陷：不得有肉眼可见的裂纹、折叠和影响使用的外观缺陷。", "内部缺陷：不得有白点、内部裂纹、残余缩孔和严重偏析。", "表面清理：非加工表面缺陷应清理干净并圆滑过渡，局部清理深度不超过加工余量的一定比例。", "工艺保证：保证充分锻透，在能力足够的锻压机上成形。"]
