[[concepts]]
id = "DC-G3-046"
name = "肋、轮辐及薄壁纵向剖切不画剖面符号"
aliases = ["肋轮辐纵剖不画剖面线"]
group = "G3"
kind = "conventional_representation"
meaning = "肋、轮辐和薄壁等结构被剖切平面沿纵向（沿其厚度中面）剖切时，截面不画剖面符号，并用粗实线把它与相邻的实体分开；横向剖切时仍正常画剖面线。"
components = ["纵向剖切的肋板、轮辐、薄壁区域不画剖面线，保留空白。", "空白区与相邻带剖面线的实体之间用粗实线分界，即使实际上两者是连续材料。", "横向（垂直于肋板）剖切时按普通断面打剖面线。", "回转件上均布的肋、轮辐、孔不在剖切平面上时，可旋转到剖切平面后按此规定画出。"]
variants = []
dxf_forms = ["HATCH ANSI31 (layer 10) whose boundary loops exclude the rib region", "thick LINE (layer 01) along the rib/body junction that has no counterpart edge in the other views", "rib outline itself thick LINEs; in removed sections across the rib the rib is hatched", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为剖视图中被剖面线包围或紧邻的一块无剖面线区域，四周均由粗实线围成，其中至少一条分界粗线在其他视图里没有对应的棱边（是人为的肋/本体分界线，常与相邻轮廓延长线共线）；该区域在俯视或左视中对应窄长的肋板厚度（厚度远小于其长度）或辐条。与空腔区分：空腔在其他视图中对应的是孔或凹槽，且其边界都是真实棱边；与漏画剖面线区分：漏画处不会有专门的分界粗线，且其他视图无肋板；与相邻辅助零件区分：后者为双点画线。"
confusions = ["空腔或孔：无剖面线但对应真实空间，边界均为真实棱边。", "漏画剖面线（绘图错误）：没有专门的分界粗实线，其他视图无对应肋板。", "实心件按不剖（装配图）：整个零件不剖，而非实体中的局部肋板。", "相邻辅助零件：轮廓为细双点画线。"]
