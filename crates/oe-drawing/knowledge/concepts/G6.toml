[[concepts]]
id = "DC-G6-013"
name = "传输带的注法"
aliases = ["传输带与取样长度标注"]
group = "G6"
kind = "surface_indication"
meaning = "在参数代号前以毫米写出滤波器截止波长（短波在前、长波在后，中间连字号），再用斜线与代号隔开，以规定非默认的传输带或取样长度。"
components = ["完整写法：短波值-长波值/代号 数值，如0.0025-0.8/Rz 3.2；文本写作MRR 0.0025-0.8/Rz 3.2。", "只给一个滤波器时保留连字号：“0.008-”表示短波，“-0.8/”表示长波（即取样长度），另一个取默认值。", "波纹度可写成相对于粗糙度默认λc的形式（λc-12×λc/Wz 125）；P轮廓标短波λs，必要时加长波（-25/Pz 225）。", "图形参数：写极限值并保留两条斜线，评定长度非默认时写在两斜线之间（0.008-0.5/16/R 10，0.0025-0.1//Rx 0.2）。", "1993版改为在横线下写取样长度（另见卡）；ISO 21920-1草案用滤波器类型字母加嵌套指数（S 0.0025 - RG 0.8）；区域法写S-L 0.008-2.5/。"]
variants = ["GB/T 131-2006 6.5 图9", "waviness band written relative to λc as λc-n×λc (e.g. λc-12×λc/Wz 125)", "P profile: only λs, optional long-wave (-25/Pz 225)", "motif parameters: limits A and B, slashes kept even when evaluation length is default", "ISO 21920-1 draft: filter type letters with nesting indices 'S 0.0025 - RG 0.8' (see filter entry)", "GB/T 33523.1 areal: 'S-L 0.008-2.5/' form", "GB/T 131-1993: sampling length below the horizontal line (separate entry)", "传输带 0.008-0.8/", "仅长波滤波 -0.8/"]
dxf_forms = ["single TEXT under the bar: '0.0025-0.8/Rz 3.2'", "TEXT '-0.8/Ra3 3.2' (long-wave only)", "Greek λ via a symbol font or Unicode U+03BB in 'λc-12×λc/Wz 125' — may be mis-decoded after conversion", "hyphen as '-', en dash or minus sign U+2212 depending on font; '×' as Unicode U+00D7 or %%c-like font substitutions"]
recognition = "锚点：符号横线下方文字中位于参数代号之前、以“/”结尾的片段。词法：“数-数/”、“数-/”或“-数/”，图形参数还可有第二段“数/”或“//”。数值应为常见截止波长（0.0025、0.008、0.025、0.08、0.25、0.8、2.5、8、25）。区分尺寸范围（35~40，无斜线和代号）、下偏差负号（-0.02，在尺寸后）、分数（Rc1/2等螺纹尺寸）、评定长度（两斜线之间的单个数）和几何公差局部范围（0.05/100，在框格内）。"
confusions = ["尺寸范围“a-b”或“a~b”：不跟斜线和参数代号", "下偏差负号：在尺寸数字后、字号较小", "分数：如螺纹尺寸代号1/2", "评定长度：两条斜线之间的单个数", "几何公差局部范围t/L：在公差框格内"]
