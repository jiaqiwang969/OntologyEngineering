[[concepts]]
id = "DC-G7-021"
name = "热处理区域（粗点画线）"
aliases = []
group = "G7"
kind = "line"
meaning = "零件上必须热处理的局部区域，用粗点画线（线型04.2）在零件外轮廓外侧、平行于轮廓画出，并用尺寸和公差标出其大小与位置；回转对称零件只需沿一条母线画出。"
components = ["粗点画线：紧靠并平行于需热处理表面的外轮廓画出，长度等于热处理区公称长度。", "尺寸与公差：标出区域长度及起点位置，如20±5。", "热处理文字块：文字前常画一小段同样的粗点画线作图例，后接处理条件、硬度、硬化深度。", "过渡区：热处理与非热处理之间的过渡区位于公称长度之外，不另画。"]
variants = ["full zone along outline", "one generatrix only for rotationally symmetric parts", "with location/length dimensions"]
dxf_forms = ["LINE/LWPOLYLINE with CENTER/DASHDOT/ACAD_ISO04W100 linetype, thick lineweight (0.5–0.7) on layer 06 (粗点画线), offset ≈1 mm outside the outline", "linear DIMENSION with tolerance text (e.g. '20±5' via %%p) bounding the stretch", "short sample LINE of the same linetype placed at the start of the heat-treatment MTEXT block"]
recognition = "锚点为与粗实线轮廓平行、偏距约1 mm、线宽为粗线的点画线段，两端有尺寸界线和尺寸。再在附近找热处理文字块（含淬火、表面硬化、渗碳、渗氮等词及HRC/HV/CHD等），文字块左上方常有同线型的一小段图例线。只有线而无热处理文字时，再考虑表面处理范围线或限定部分的粗点画线。"
confusions = ["细点画线中心线：线宽细，穿过对称面或回转中心。", "剖切线：只在剖切位置两端画短粗线段，有字母和箭头。", "局部表面处理/表面结构要求范围的粗点画线（GB/T 4458.1、GB/T 131）：配镀涂注语或表面结构符号。", "粗实线轮廓：无点和间隔。"]
related = ["DC-G7-019", "DC-G7-018", "DC-G7-026", "DC-G7-024", "DC-G1-039", "DC-G1-005", "DC-G4-060", "DC-G6-026"]
