[[cards]]
id = "coincident_redraw"
expression_kind = "any"
title = "重画的重合图线"
meaning = "同一对象在同一位置画了两遍：散线和文字与一个已读图块（标题栏、登记栏、图框、符号块）按插入变换后的内容逐条重合。重合的图线只表示一次，重画的一份是该图块表达的重合来源，不是另外的要素，也不另成表达。"
sources = [
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.3 重合图线的优先顺序",
  "GB/T 4457.4-2002 机械制图 图样画法 图线 4.1（图线重合时只画其中一种）",
]
knowledge_units = ["K03", "K61"]
recognition = "对每个已读出的图块，按插入变换算出块内直线与文字的位置：未被其他规则读出的散线，两端点与块内某条直线的两端点重合；未读出的文字，内容与块内文字相同、插入点重合；散线副本至少占块内直线的给定比例才算重画（偶然一条线重合不算）。副本作为该图块表达的重合来源。"
markers = []
concepts = ["DC-G1-055"]

[[cards.components]]
role = "coincident_source"
primitives = ["LINE", "TEXT", "MTEXT"]
requirement = "与已读图块的直线或文字逐条重合的散线或文字"

[[cards.variants]]
id = "block_redrawn_loose"
title = "图块内容用散线和文字原样重画"
distinguishing = "散线与文字逐条落在已读图块的直线与文字上（含按比例插入的图块）"
encodings = ["loose"]
tests = ["loose_copy_of_a_read_block_is_coincident"]

[[cards.counter_examples]]
statement = "只有个别散线碰巧与图块内的一条线重合（如零件轮廓与图框线相接），不是重画的副本"
test = "single_line_on_a_block_line_is_not_a_copy"

[[cards.parameters]]
name = "coincidence_tolerance"
value = 0.002
meaning = "端点或插入点重合的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "copy_share_min"
value = 0.5
meaning = "散线副本至少占块内直线条数的比例"

[[cards]]
id = "callout_rows"
expression_kind = "dimension"
title = "标注的附注行"
meaning = "尺寸和孔的旁注常写成两行：基准线（指引线的水平折线）上方一行写数量、要素和尺寸，下方一行写深度、贯通、分布或作用范围；没有基准线的尺寸，这些附注词写在数值正下方。附注词属于该尺寸，说明数量、分布和作用范围，不另成注写。沿数值方向紧挨着写、用“此直径”等指代该尺寸的说明句，是以该尺寸为界的要求；尺寸终端所落的同心短弧是这一要求的分界线（范围线）。"
sources = [
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 表1（孔的旁注法）、4.2（均布与 EQS）",
  "GB/T 4458.4-2003 机械制图 尺寸注法 4.1（尺寸数字的注写位置）",
  "GB/T 4457.4-2002 机械制图 图样画法 图线 表1 细实线（范围线及分界线）",
  "机械制图（第7版）§8-1 螺纹的标注、§9-1 零件图的尺寸注法（旁注法）",
]
knowledge_units = ["K17", "K39", "K55"]
recognition = "以尺寸的数值文字为锚：与之平行、字高相称的文字，在同一行内相邻（缝隙小于给定倍数字高），或在其正下方一到两行（行距按字高），并且全部由本卡词表中的词组成（数量 n-、n×、n处，要素、大小、分布、贯通、深度加数值、作用范围）时，并入该尺寸，标签按行序拼读；不全由词表词组成的文字不并入。数值后紧跟的一上一下两段较小的带符号数字是它的上下偏差（dimension_text 卡）。沿数值方向写在其下、含指代词的说明句，作为以该尺寸为界的要求另成一个表达并共享该尺寸的成员，尺寸终端落在其上的同心短弧是分界线。"
markers = ["均布", "两侧", "一周"]
concepts = ["DC-G1-111", "DC-G4-066", "DC-G4-043", "DC-G4-067", "DC-G1-047", "DC-G4-094", "DC-G4-088", "DC-G3-089"]

[[cards.components]]
role = "note_text"
primitives = ["TEXT", "MTEXT"]
requirement = "数值同一行或其下一到两行、全由附注词组成的文字；或含指代词的说明句"

[[cards.components]]
role = "tolerance_text"
primitives = ["TEXT", "MTEXT"]
requirement = "数值后一上一下两段较小的带符号数字（上下偏差）"

[[cards.components]]
role = "extension_line"
primitives = ["ARC"]
requirement = "尺寸终端所落、与零件同心的短弧（要求的分界线）"

[[cards.variants]]
id = "rows_on_reference_line"
title = "附注词写在基准线上下或数值正下方"
distinguishing = "同一行相邻的数量、要素词，下一行的深度、贯通、分布、范围词；数值与附注词也可写在同一段文字里（如框格上方的“数量-直径 均布”）"
encodings = ["text"]
tests = ["callout_words_under_the_value_join_the_dimension", "hole_callout_rows_on_and_under_the_reference_line", "value_and_callout_words_in_one_text_over_a_frame"]

[[cards.variants]]
id = "bounded_requirement"
title = "以尺寸为界的要求"
distinguishing = "沿数值方向写的说明句含“此直径”等指代词；尺寸终端落在一段同心短弧上"
encodings = ["text"]
tests = ["sentence_referring_to_a_diameter_is_a_bounded_requirement"]

[[cards.counter_examples]]
statement = "数值下方的文字不全由附注词组成（另一个尺寸的数值、一句技术要求）时不并入该尺寸"
test = "other_text_under_a_value_is_not_a_callout_row"

