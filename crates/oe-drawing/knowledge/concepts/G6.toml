recognition = "词法：T16%（T紧接16和%）位于数值之后、第一个“/”之前。属于草案写法，普通零件图上罕见，应结合整行其他草案元素验证。区分材料比百分数（如80%，紧跟在Rmr(...)之后，无T前缀）以及Tmax、Tmed。"
