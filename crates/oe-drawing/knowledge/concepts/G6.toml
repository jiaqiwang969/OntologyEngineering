[[concepts]]
id = "DC-G6-030"
name = "最大规则后缀“max”"
aliases = ["最大值/最小值标注（max、min）"]
group = "G6"
kind = "surface_indication"
meaning = "在参数代号后加“max”（如Ramax 0.8、Rz1max 3.2）表示采用最大规则：被检表面上任何测得值都不得超过规定值；不加max时默认采用16%规则。"
components = ["2006版：max紧接参数代号（及取样长度个数）之后，再空格写数值；文本中写作MRR Ramax 0.8; Rz1max 3.2。", "最大规则不适用于图形参数，图形参数只用16%规则。", "1993版：max或min写在数值后（3.2max、1.6min），表示最大值或最小值。", "教材表4.7也出现“Ramin 1.6”形式表示最小值。", "ISO 21920-1草案：不再定义后缀max，最大规则已为缺省，可另写Tmax。"]
variants = ["GB/T 131-2006 6.4 图8", "GB/T 131-1993: 'max'/'min' written after the numerical value (3.2max, 1.6min) for maximum/minimum", "GB/T 10610 5.3 (e.g. Rz1max)", "ISO 21920-1 draft: suffix 'max' no longer defined; max rule is the default, optionally 'Tmax'", "Ramax", "Ramin", "Rzmax"]
dxf_forms = ["TEXT 'Ramax 0.8' (no space) or 'Ra max 0.8' (with space)", "'max' written smaller/subscript-like as a separate TEXT", "1993: TEXT '3.2max' in the V opening"]
recognition = "词法：参数代号（可带取样长度个数）后紧跟或空格后接“max”或“min”，再空格接数值；1993版为数值后接max或min。确认它在表面结构符号横线下方（或1993的V形开口上方）。区分ISO 21920-2的独立参数Rmax（草案语境，max前只有R）、数值后的Tmax（草案接收规则）和注释中的“max”。"
confusions = ["ISO 21920-2参数Rmax：独立参数，仅出现在草案语境", "接收规则Tmax：写在数值之后", "注释中的max：不在符号上", "U、L上下限：表示极限类型而非判断规则"]
related = ["DC-G6-046", "DC-G6-015", "DC-G6-014", "DC-G6-027", "DC-G6-021", "DC-G6-075"]
priority = "low"
text_forms = ["Ramax 0.8", "Rz1max 3.2", "Rzmax 0.2", "Ra max 0.8", "Ramin 1.6（教材）", "3.2max（1993）", "1.6min（1993）"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "'Ramin' is a textbook form; GB/T 131-2006 itself shows only 'max'."
