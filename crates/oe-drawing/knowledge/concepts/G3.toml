[[concepts]]
id = "DC-G3-177"
name = "棘轮机构符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示由棘轮（或棘齿条）与铰接棘爪组成、实现单向间歇运动的棘轮机构，分外啮合、内啮合和棘齿条啮合。"
components = ["外啮合：棘轮画成带十字中心线的虚线圆，轮心为一个小菱形；棘爪为一条粗线，一端以实心圆点铰接，另一端带钩抵在轮缘外侧；旁有弧形箭头表示转向。", "内啮合：棘爪位于轮圆内部，钩向轮缘内侧。", "棘齿条啮合：开口矩形框内一条带台阶的齿条线，棘爪斜线一端为实心圆点，上方有双向箭头表示往复。", "可用符号（侧视）：粗轴线上一个带“×”的竖长矩形，上端嵌一小矩形表示棘爪，或画成单侧带斜角台阶的轮廓。", "1984 版 7.2 与 2013 版 10.2 的图形相同。"]
variants = ["外啮合", "内啮合", "棘齿条啮合"]
dxf_forms = ["CIRCLE with a dashed linetype (layer 04) and centre LINEs on layer 05; small rotated-square LWPOLYLINE at the centre", "Pawl as a thick LINE on layer 01 ending in a filled dot (DONUT, SOLID or HATCH SOLID circle)", "Rotation arrows as ARC plus SOLID arrowhead or LEADER", "INSERT of a library block"]
recognition = "锚点：带十字中心线的虚线大圆加圆心小菱形；一条粗短线一端为实心圆点、另一端伸到圆周（外侧或内侧）。附近常有弧形箭头。棘齿条形式：开口框内的台阶线加带实心点的斜杆和双向箭头。与槽轮机构区分：槽轮为大号粗“×”或四内凹弧星形与另一圆组合，没有实心点棘爪；与齿轮符号区分：齿轮无棘爪，且端视节圆为点画线。"
confusions = ["槽轮机构符号：粗“×”或四角星形与拨盘圆组合，无棘爪。", "齿轮或齿条传动：节圆/节线相切，无带实心点的棘爪。", "装配图中牙嵌式离合器齿等相同结构：属于投影视图中的结构画法，不是简图。"]
related = ["DC-G3-179", "DC-G3-153", "DC-G3-199", "DC-G3-205"]
priority = "rare"
