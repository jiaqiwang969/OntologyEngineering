[[concepts]]
id = "DC-G6-025"
name = "完整图形符号中补充要求的注写位置（a～e）"
aliases = ["表面结构代号注写位置（a、b、c、d、e）", "表面结构注写位置"]
group = "G6"
kind = "surface_indication"
meaning = "规定完整符号周围注写参数要求和各项补充要求的固定位置；读代号时按文字所在位置判断其含义。"
components = ["2006版：a在横线下方，写第一项要求（传输带或取样长度、参数代号、数值）；b在a下方写第二项，要求更多时符号竖向加长，a、b随之上移。", "c在横线上方写加工方法、表面处理、涂层等；d在V形右侧、横线下方写纹理方向符号；e在短边左侧写加工余量（mm）。", "1993版：a1/a2写高度参数代号和数值（V形开口上方），b在横线上方写加工要求或镀涂说明，c在横线下方写取样长度或波纹度，d为纹理，e为加工余量，f写间距参数或支承长度率。", "GB/T 33523.1区域法用a–g：a/b要求，c评定区域方向的相交平面，d加工工艺，e纹理，f纹理方向的相交平面，g加工余量。", "ISO 21920-1草案：加工工艺[s]和纹理[t]在横线上方，轮廓方向[u]在符号旁，一个参数的全部规范元素写在横线下同一行。"]
variants = ["GB/T 131-2006 图6 positions a-e", "GB/T 131-1993 图6: a1/a2 height parameter and value (in the V opening above the short leg), b process/coating/notes above the line, c sampling length or waviness below the line, d lay, e machining allowance, f spacing parameter or tp below the line", "GB/T 33523.1-2020 图2 positions a-g: a/b requirements, c intersection plane for evaluation area, d process, e lay, f intersection plane for lay, g machining allowance", "ISO 21920-1 draft 图7-图10: process [s] and lay [t] above the line, profile direction [u] beside the symbol, all specification elements of one parameter in one line below", "只填位置 a", "a+b 双要求", "全部位置", "位置a", "位置b", "位置c", "位置d", "位置e"]
dxf_forms = ["separate TEXT entities aligned to the bar: a = TEXT just below the bar, left-justified at the long leg; b = next TEXT ≈1.5h lower", "c = TEXT/MTEXT above the bar (often Chinese process words); d = single-letter TEXT or a small LINE glyph right of the V; e = number TEXT left of the short leg", "template blocks with ATTDEF/ATTRIB tags for the positions; unused attributes may remain empty in the INSERT", "MTEXT with \\P line break holding a and b in one entity", "1993 drawings: number TEXT placed in/above the V opening between the legs, not under the bar"]
recognition = "以符号自身为坐标系（尖端为原点、横线方向为x、离开表面方向为y，符号旋转时同步旋转）：a在横线正下方、x从长边起向右，y≈H2−1.2h；b在a下方约1.5h；c在横线上方；d在长边右侧、y约0.3–1h；e在短边左侧。1993版数值在V形开口上方（x位于两边之间，y在H1附近）。按落入的区域赋义后再做词法校验：a/b含参数代号或数值，c多为汉字或镀涂代号，d为=、⊥、X、M、C、R、P之一，e为纯数字。区分几何公差框格分格（矩形框线分隔）和焊缝符号基准线上下方的注写（以基准线为界、连箭头线）。"
confusions = ["几何公差框格各格：由矩形框线分隔", "焊缝符号基准线上下方的尺寸：以焊缝基准线（常带虚线）为界", "指引线旁普通注释：附近无60°V形", "1993版a1/a2与2006版a：1993数值在V形开口上方，2006在横线下方"]
related = ["DC-G6-069", "DC-G6-003", "DC-G6-019", "DC-G6-037", "DC-G6-018", "DC-G6-046", "DC-G6-027", "DC-G6-028", "DC-G6-029", "DC-G6-059", "DC-G6-066", "DC-G5-090"]
priority = "high"
text_forms = ["车 / Ra 1.6", "铣 / Ra 0.8 / Rz1 3.2 + ⊥", "3（位置e，加工余量）", "Ra 3.2（位置a）"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = ["second"]
expert_checked = false
notes = "Relative offsets are estimates from general practice; the positions themselves are from GB/T 131-2006 图6, GB/T 131-1993 图6 and GB/T 33523.1 图2. Already seen on a test drawing."
