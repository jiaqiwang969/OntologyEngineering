[[concepts]]
id = "DC-G3-053"
name = "螺栓连接画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "螺栓穿过两个被连接件上的光孔，套上垫圈后用螺母拧紧的连接，在装配图中按规定画法或比例画法绘出，常用省略倒角的简化画法。"
components = ["剖切平面通过螺栓轴线时，螺栓、螺母、垫圈都按不剖绘制，外形用粗实线。", "被连接件的通孔约1.1d，与螺杆之间为不接触面，画两条线；零件间接触面、垫圈与零件、螺母与垫圈接触面只画一条线。", "相邻两被连接件的剖面线方向相反（或间隔不同）；螺栓旋合段以外的螺纹仍按外螺纹画，螺纹终止线低于被连接件上表面。", "比例画法按d折算各部尺寸，螺栓伸出螺母约0.3d；简化画法省略螺栓头、螺母、垫圈的倒角及曲线。"]
variants = ["比例画法", "简化画法（省略倒角）"]
dxf_forms = ["INSERT of a fastener assembly/standard-part block (CAXA 图库, ACM/GstarCAD Mechanical 'screw connection'), may be anonymous or exploded", "exploded: thick LINE outlines of hex head/nut (three faces in front view with ARC chamfer curves or straight in simplified form), washer rectangle, bolt shank; thin LINE minor-diameter pair; thick thread end LINE", "two HATCH ANSI31 regions with opposite angles on the plates, boundaries stopping at the clearance-hole LINEs; no HATCH on bolt/nut/washer", "top view: hexagon LWPOLYLINE + CIRCLE + 3/4 thin ARC (thread) or simplified", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一根贯穿两块带剖面线零件的无剖面线杆件（螺栓），一端为六角头（宽约2d，高约0.7d），另一端依次有垫圈矩形（外径约2.2d、厚约0.15d）和六角螺母（高约0.8d），螺杆伸出螺母约0.3d；两被连接件剖面线方向相反，孔壁线与螺杆线相距约0.05d（两条线）。与螺柱连接区分：螺柱无头部，下端旋入较厚零件的螺孔；与螺钉连接区分：螺钉无螺母，旋入被连接件的螺孔且头部可在沉孔中。"
confusions = ["双头螺柱连接：无螺栓头，下半部旋入螺孔。", "螺钉连接：无螺母，螺钉直接旋入零件螺孔。", "销连接：无螺纹和螺母。"]
related = ["DC-G3-014", "DC-G3-058", "DC-G3-060", "DC-G3-043", "DC-G3-027", "DC-G3-129", "DC-G8-003", "DC-G8-005", "DC-G2-009", "DC-G3-229", "DC-G8-018"]
