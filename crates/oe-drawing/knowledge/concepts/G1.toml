[[concepts]]
id = "DC-G1-030"
name = "模样分型线"
aliases = []
group = "G1"
kind = "line"
meaning = "在铸件、模锻件图上用粗实线表示模样（或模具）的分型位置，图形两侧可画起模斜度符号。"
components = ["粗实线（No.01.2.9），沿分型面迹线，通常穿过视图并伸出外形。", "图形外左右两侧的符号为起模斜度符号，指示起模方向。", "可配分型面符号或文字说明。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight (group 370) 50 or 70 (0.5/0.7 mm) or ByLayer on a thick layer: GB/T 14665 layer 01, names such as 粗实线/轮廓线/OUTLINE, CAXA 0层; colour white/black (ACI 7)", "draft-angle symbols as small LINE/TEXT groups or INSERTs on both sides of the view", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一条粗实线横穿铸件视图并伸出到轮廓外，两侧附近有起模斜度符号或分型符号；它不与零件轮廓围成闭合外形。多见于铸件毛坯图或模具设计，普通零件图中罕见。"
confusions = ["可见棱边线：粗实线，但不伸出外形。", "剖切符号：只在视图外两端出现粗短画。", "分模面图形符号：工艺符号，另有专门形状。"]
related = ["DC-G1-038", "DC-G7-020", "DC-G7-046", "DC-G3-061"]
