module="kernel"
constraint="tool_result_provenance_handback"
behavior="six_registered_tools_real_results_register_into_one_project"
rust_path="crates/oe-kernel/tests/tool_result.rs"
oracle="六个已登记工具各一次真实结果核验并登记进同一 Project；比较先基线后候选"
scope="回交合同与有界比较；不证明工具结论或收益"

