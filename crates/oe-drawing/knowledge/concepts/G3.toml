components = ["骨架：每根构件用一条粗实线表示其系统线，在节点处相交，不画壁厚。", "尺寸：节点间距离沿对应杆件注写，另注总跨度、总高等。", "允许封闭尺寸链；考虑累积误差时标明哪一环为封闭环（如加括号）。", "构件型材可附棒料、型材标记。"]
