[[concepts]]
id = "DC-G2-080"
name = "斜视图"
aliases = []
group = "G2"
kind = "view"
meaning = "机件向不平行于基本投影面的平面投射所得的视图，用于表达倾斜结构的实形；通常只画倾斜部分并以波浪线或双折线断开，按向视图方式配置并注字母和垂直于倾斜面的箭头，必要时可旋转配置并加旋转符号。"
components = ["投射箭头：垂直于倾斜表面，旁注大写字母（字母水平书写）。", "斜视图：按投影关系配置时图形主轴倾斜；旋转配置时转正。", "断裂边界：波浪线或双折线。", "名称：上方“X”；旋转配置时为“旋转符号+X”，可加角度，字母靠近箭头端。", "版本：1984年版另有“旋转视图”，2002年版已删去。"]
variants = ["kept in projection relation", "moved elsewhere", "rotated upright with a rotation arrow by the letter (rule in GB/T 17451, not in collection)", "1984 edition also had a separate 旋转视图 (rotated view), deleted in 2002", "按向视图配置", "旋转配置（带旋转符号与角度）"]
dxf_forms = ["Arrow (LEADER or LINE + SOLID) at an oblique angle with TEXT letter", "View cluster rotated (LINEs at the same oblique angle) or upright with a 180° ARC rotation symbol beside the label TEXT"]
recognition = "以一支倾斜箭头（方向不平行于图纸X/Y轴）带字母、同字母视图名称为锚点；对应视图簇的主方向与箭头方向垂直，或视图已转正且名称旁有半圆弧旋转符号；视图无剖面线。斜剖结果带剖面线并用剖切符号；向视图箭头平行于坐标轴。"
confusions = ["向视图：箭头平行于坐标轴。", "局部视图：向基本投影面投射。", "斜剖视图：带剖面线。"]
related = ["DC-G2-072", "DC-G2-076", "DC-G2-074", "DC-G2-048", "DC-G2-021", "DC-G2-069"]
priority = "medium"
text_forms = ["A", "旋转符号+A", "旋转符号+A45°"]
