[[concepts]]
id = "DC-G7-133"
name = "焊缝基本符号"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "焊缝基本符号：画在焊缝基准线上、表示焊缝横截面基本形式或特征的图形，如I形、V形、单边V形、带钝边V/单边V/U/J形、封底、角焊、塞焊或槽焊、点焊、缝焊、陡边V/单V、端焊、堆焊、卷边，以及钎焊的平面、斜面和折叠连接。"
components = ["图形：高约字高h、笔画宽约h/10的简单几何笔画。", "位置：立在基准线实线侧（箭头侧）或虚线侧（非箭头侧），对称时跨线。", "数量：GB/T 324-2008表1共20种（比1988版增加7种）。", "组合：双面焊缝可上下组合使用。"]
variants = ["I形焊缝", "V形焊缝", "角焊缝", "点焊缝"]
dxf_forms = ["exploded strokes: LINE/ARC/LWPOLYLINE on the annotation layer (08 or 09 per GB/T 14665, or a user layer such as 焊接/WELD), thin lineweight or LWPOLYLINE width ≈ h/10 (symbol stroke d' = h/10)", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "AutoCAD Mechanical / GstarCAD Mechanical weld-symbol object saved in DXF as ACAD_PROXY_ENTITY; only its proxy graphics (lines, arcs, text) are readable without the vendor enabler"]
recognition = "以焊缝基准线（水平或竖直细实线，一端与带箭头的斜线相接，可伴约0.3h处的平行细虚线）为锚点，在其两侧约1倍字高h范围内找高约h、笔画宽约h/10的符号笔画，再按形状模板分类：两竖线→I；对称两斜线→V；一竖一斜→单边V；三角→角焊；三边矩形→塞/槽；圆→点焊；圆加两平行线→缝焊；半圆→封底；带竖杆的Y/弧杯→带钝边类；三竖线→端焊；双拱→堆焊；成对四分之一弧→卷边或喇叭形。符号在实线侧＝焊缝在箭头侧，在虚线侧＝非箭头侧，跨实线镜像对称＝双面/对称焊缝（此时常省略虚线）。"
confusions = ["坡口尺寸文字（α、b、p）：TEXT，不是符号。", "锥度、斜度符号：位于尺寸标注中。", "几何公差特征符号：位于公差框格内。", "表面结构符号√：不在焊缝基准线上。"]
related = ["DC-G7-134", "DC-G7-137", "DC-G7-135", "DC-G7-109", "DC-G7-131", "DC-G7-092", "DC-G7-093", "DC-G7-144", "DC-G7-130"]
