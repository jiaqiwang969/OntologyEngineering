[[concepts]]
id = "DC-G6-074"
name = "区域表面结构参数代号"
aliases = []
group = "G6"
kind = "text_convention"
meaning = "区域表面结构参数在图上写作以S开头（体积参数以V开头）的字母组，如Sa、Sq、Sz、Sdr、Smr(c)；公式中用带下标的符号，图样和文件中用这些缩略术语。"
components = ["高度参数：Sq、Ssk、Sku、Sp、Sv、Sz、Sa；空间参数：Sal、Str、Std、Ssw；混合参数：Sdq、Sdr。", "支承率参数：Smr(c)、Smc(p)、Sdc；复合加工表面参数：Sk、Spk、Spkx、Svk、Svkx、Smrk1、Smrk2、Sak1、Sak2；概率支承率参数Svq、Spq、Smq。", "体积参数：Vv(p)、Vvv、Vvc、Vm(p)、Vmp、Vmc；特征参数：Spd、Svd、Spc、Svc、S5p、S5v、S10z。", "GB/T 33523.2-2017对应ISO 25178-2:2012；2026版对应ISO 25178-2:2021，增加Spkx、Svkx、Sdc等。", "在图上与区域法符号和S-L/S-F规范一起出现，代号与数值之间双空格。"]
variants = ["GB/T 33523.2-2017 (ISO 25178-2:2012)", "GB/T 33523.2-2026 (ISO 25178-2:2021) 附录F summary tables, with added parameters such as Spkx, Svkx, Sdc"]
dxf_forms = ["TEXT 'Sq 0.7' / 'Sa 0.5' inside the areal specification line", "subscripted forms only in formulas, not on drawings", "parentheses in Smr(c), Vm(p) as ordinary characters"]
recognition = "词法：S后接1–3个小写字母或数字（Sa、Sdr、S10z、S5p），或V后接m、v等（Vmp、Vv(p)）；只有出现在区域规范行（S-L或S-F之后的“/”后）时才确认。普通零件图上罕见。区分轮廓参数R、W、P，1993旧间距参数S、Sm（在1993图横线下，无S-L前缀），样条滤波器字母S（后接空格和嵌套指数）和尺度限定表面类型S-L、S-F。"
confusions = ["轮廓参数R、W、P开头：轮廓法", "1993旧间距参数S、Sm：无S-L/S-F前缀", "样条滤波器字母S：后接空格和嵌套指数", "表面类型S-L、S-F：带连字号"]
related = ["DC-G6-075", "DC-G6-020", "DC-G6-066", "DC-G6-031", "DC-G6-029"]
priority = "rare"
text_forms = ["Sa", "Sq", "Sz", "Sdr", "Smr(c)", "Spk", "Vmp", "S10z"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Some subscript letters (e.g. Vv(p), Smrk1) are reconstructed from OCR-garbled tables."
