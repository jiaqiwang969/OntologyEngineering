[[concepts]]
id = "DC-G6-010"
name = "两种或多种工艺获得的同一表面的注法"
aliases = ["多种工艺获得同一表面的注法"]
group = "G6"
kind = "surface_indication"
meaning = "同一表面由几道工艺获得（如镀覆前后，或加工—镀铬—磨削），且需分别规定各阶段的表面结构要求时，在同一代号或相邻代号中同时给出各阶段要求。"
components = ["2006版图29：横线上方写镀覆代号（如Fe/Ep·Cr25b），横线下方分行写镀覆前、后的要求（如Ra 0.8、Rz 1.6），符号引到该表面。", "2006版C.8（教材图9-30b）：三道连续工序——先去除材料达Rz 1.6，再镀铬（Fe/Ep·Cr50，无粗糙度要求），最后只对长50 mm的一段磨削达Rz 6.3，局部范围用尺寸注出。", "1993版图4：只注镀覆后的要求时直接标注；注镀覆前的要求须另加“镀覆前”说明；前后都要求时在同一处分别注出。", "ISO 21920-1草案改用编号旗注①②区分各道工序（见编号旗注卡）。"]
variants = ["GB/T 131-2006 11.4 图29, C.8 (three consecutive operations)", "GB/T 131-1993 3.10 图4 a-c (after coating; before coating with the note 镀覆前; both)", "ISO 21920-1 draft 9.7: numbered flag notes (separate entry)"]
dxf_forms = ["roughness INSERT/LINEs with TEXT above the bar (coating code, e.g. 'Fe/Ep·Cr25b') and two or more TEXT lines below", "a long-dashed LINE (DASHED-type linetype) linking the stages may occur, since 表G.1 of the draft says ISO 1302 used a long-dashed line for several processes — verify on the scan", "DIMENSION (e.g. '50') limiting the partial requirement, plus LEADER or LINE to the surface", "TEXT '镀覆前' / '镀覆后' near the symbol (1993)", "middle dot of the coating code as Unicode U+00B7 (\\U+00B7), full-width '•' or '.' after conversion"]
recognition = "锚点：完整符号，横线上方有镀涂代号（含“/”及Ep、Cr、Ni等），横线下方有两行以上参数要求，或附近有“镀覆前/镀覆后”字样；同一表面附近另有代号带加工方法（如“磨”）并有尺寸限定局部长度。按文字顺序或说明字样把各行要求分配到各工艺阶段。区分同一阶段的两项独立要求（a、b两行，无镀涂代号或阶段说明）、上下限值对（U/L或叠写数值）和技术要求中的表面处理说明（不在符号上）。"
confusions = ["位置a、b的两项独立要求：同一阶段，无镀涂代号或阶段说明", "上下限值对：带U/L或上下叠写数值", "技术要求中的表面处理说明：不在符号横线上"]
related = ["DC-G6-060", "DC-G6-035", "DC-G6-021", "DC-G6-025", "DC-G6-019", "DC-G4-073", "DC-G9-005"]
priority = "low"
