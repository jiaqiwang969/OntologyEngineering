 {name="supersedes",meaning="明确被替代的本命题结果id或null",rust_type="Option<String>",required=false,format="text",unit="不适用",precision="显式字符串或null，字段不得缺省",write="新证据修订时指定",applicability="同一组织和命题",acceptance="只替代当前有效头，保留旧结果及下游失效关系"}
