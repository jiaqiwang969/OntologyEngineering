[[concepts]]
id = "DC-G3-056"
name = "螺纹连接画法"
aliases = ["螺纹旋合画法"]
group = "G3"
kind = "conventional_representation"
meaning = "用剖视图表示内、外螺纹旋合时，旋合部分按外螺纹的画法绘制，未旋合部分各自按内、外螺纹画法表示。"
components = ["旋合段：外螺纹件不剖，大径粗实线、小径细实线；内螺纹件的剖面线画到外螺纹的大径粗实线。", "旋合段以外：内螺纹仍是小径粗实线、大径细实线，剖面线画到小径粗实线。", "表示大、小径的粗实线和细实线在旋合段与非旋合段之间应分别对齐，与倒角大小无关。", "外螺纹终止线、内螺纹终止线、钻孔深度各自按规定位置画出；管螺纹连接同样适用。"]
variants = ["螺柱/螺钉旋入螺孔", "管螺纹连接"]
dxf_forms = ["collinear LINE chains: thick major LINE of the external part continuing as thin major LINE of the internal part beyond engagement; thin minor LINE of the external part continuing as thick minor LINE of the hole", "HATCH ANSI31 of the internal part with boundary switching from external major line (engaged zone) to hole minor line (non-engaged zone)", "thread designation or pair designation MTEXT, e.g. 'M16×1.5-6H/6g'", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一个螺杆伸入带剖面线零件的螺孔：在旋合段中剖面线边界贴着螺杆的粗实线大径，螺杆内侧有细实线小径；越过螺杆端部后，孔内线型翻转为小径粗实线、大径细实线，且两段的粗/细线分别共线对齐（大径线：粗→细，小径线：细→粗）。与光轴插入光孔区分：没有细实线小径，剖面线直接贴孔壁且只有一组线；与单独内螺纹区分：单独螺孔全段都是小径粗、大径细。"
confusions = ["光轴插入光孔：只有一组轮廓线，无粗细线翻转。", "单独的内螺纹画法：全段小径粗、大径细，无外螺纹件。", "花键联结：同样按外件画，但有花键尾部线和花键标记。"]
related = ["DC-G3-024", "DC-G3-005", "DC-G3-087", "DC-G3-014", "DC-G3-058", "DC-G3-060", "DC-G3-002", "DC-G3-047"]
