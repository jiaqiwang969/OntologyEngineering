[[concepts]]
id = "DC-G5-039"
name = "中心要素修饰符（Ⓐ）"
aliases = []
group = "G5"
kind = "symbol"
meaning = "写在公差框格第二格的带圈字母 A（中心要素修饰符）：几何规范不作用于箭头所指的回转体表面本身，而作用于其导出要素——圆柱取中心线，圆或球取中心点。有了它，指引线可不与尺寸线对齐。"
components = ["带圈 A：圆直径约 0.75H（≈1.5h），圈内大写 A，写在第二格公差值及偏置、拟合等修饰符之后（规范元素第 7 组）", "所在框格：直线度、位置度、同轴度等针对导出要素的规范；指引线终止在回转体组成表面上（箭头或圆点），与尺寸线错开", "只用于回转体（圆柱、圆、球）；两平行平面这类尺寸要素不用，因为导出要素含义会模糊"]
variants = []
dxf_forms = ["TEXT/MTEXT in the second cell with Ⓐ (U+24B6) right after the value, e.g. 'Ø0.02Ⓐ'", "exploded: TEXT 'A' (height h) centred in a CIRCLE of radius ≈0.75h inside the second cell", "TOLERANCE entity: gdt.shx has no Ⓐ glyph, so it is typed as Unicode in the value field or drawn afterwards as CIRCLE + letter"]
recognition = "锚点为第二格内圈着 A 的小圆（半径约 0.35–0.4H，圆心在框格水平中线上，位于公差值右侧）。成立时把被测要素改为所指回转体的中心线/中心点，即使指引线箭头落在轮廓上且未与尺寸线对齐。第三格以后的 A 是基准字母，不带圈；带圈 A 只在第二格出现。OCR/MinerU 常把它读成“④”。"
confusions = ["基准字母 A：写在第三格及以后、没有圆圈", "导出要素的常规标注——指引线箭头与尺寸线对齐（DC-G5-107）：含义相同，用 Ⓐ 时不要求对齐", "其他带圈字母 Ⓜ Ⓛ Ⓟ Ⓔ Ⓕ：只按圈内字母区分，位置都在第二格"]
related = ["DC-G5-091", "DC-G5-107", "DC-G5-109", "DC-G5-062", "DC-G5-090"]
