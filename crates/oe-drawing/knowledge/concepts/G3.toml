[[concepts]]
id = "DC-G3-132"
name = "较小斜度、锥度及较小结构的简化"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "机件上斜度、锥度等较小的结构，以及其他较小的结构，已在一个图形中表达清楚时，其他图形可按小端画出，或简化、省略。"
components = ["斜度或锥度较小的面在其他视图中只按小端位置画一条轮廓线，不画由大端产生的另一条线。", "圆柱端部被切出的小平面、小孔等较小结构，在其他视图中省略或简化其交线。", "已表达清楚的那个视图中通常标有斜度或锥度符号及数值。", "三维模型投影工程图（GB/T 26099.4）则要求孔径、薄片不大于2 mm及较小斜度、锥度严格按比例画出，不夸大，必要时用局部放大图。"]
variants = ["taper drawn by small end", "slope drawn by small end", "small feature omitted in other views"]
dxf_forms = ["No dedicated entity: a single outline LINE on layer 01 where the large-end edge would otherwise appear", "Slope or taper symbol with value as TEXT/MTEXT or leader-attached block in the view that shows the feature", "Projection views exported from 3D models usually keep exact small edges unless a small-feature suppression option is used"]
recognition = "这是一种省略式表达，无专属实体，需跨视图判断：先在某视图中找到带斜度∠或锥度符号的标注或可见斜线，再在投影对应的另一视图中检查，若只存在与小端位置对应的一条轮廓线、而无大端对应线，则判为按小端简化，不应报告为漏线。小结构同理：在一个视图中完整表达（常有局部放大图或尺寸），在其他视图中缺少其交线。"
