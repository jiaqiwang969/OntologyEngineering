[[concepts]]
id = "DC-G6-022"
name = "同一表面不同要求的分界线"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "同一表面不同部位有不同表面结构要求时，用细实线画出分界线，并分别注出各部分的代号和分界位置尺寸（GB/T 131-1993做法）。"
components = ["在同一连续表面上横画一条细实线作为分区界线。", "分界线两侧各注一个表面结构代号。", "用尺寸注出分界线的位置（各区长度）。", "ISO 21920-1草案改用限制要求（宽长点画线加理论正确尺寸）表示局部范围。"]
variants = ["GB/T 131-1993 4.7 图18", "ISO 21920-1 draft uses the restricted-area line instead (9.2)"]
dxf_forms = ["short thin LINE (layer 02) across the surface, perpendicular to it, ending on the outline(s)", "two roughness INSERTs on either side plus a DIMENSION locating the boundary"]
recognition = "锚点：一段横穿同一轮廓面的细实线，两端只落在该面的轮廓线上（如轴的上下母线之间）；附近有两个不同要求的代号和一个定位尺寸，且该线不对应几何棱边（两侧轮廓共线、直径不变）。区分真实棱边（粗实线，两侧几何改变）、螺纹终止线（粗实线，配螺纹细实线）和尺寸界线（细实线，伸出轮廓并连尺寸线）。"
confusions = ["可见棱边：粗实线，两侧几何改变", "螺纹终止线：粗实线，配螺纹牙底细线", "尺寸界线：伸出轮廓外并连尺寸线", "局部范围粗点画线：画在轮廓外侧且平行于轮廓"]
related = ["DC-G6-026", "DC-G6-034", "DC-G6-069", "DC-G4-058", "DC-G3-094"]
priority = "low"
