[[concepts]]
id = "DC-G3-043"
name = "紧固件通孔"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "供螺栓、螺钉穿过的光孔，孔径比螺纹大径略大（约1.1d），按精装配、中等装配、粗装配三档选用，可带沉孔或埋头座以容纳头部。"
components = ["通孔直径按紧固件规格d与装配精度选取（GB/T 5277），沉孔、沉头座尺寸按GB/T 152选取。", "零件图中按一般孔画出并注孔径，多个相同孔用数量前缀；沉孔用沉孔符号或旁注。", "装配图中螺杆与通孔之间是不接触面，画成两条线（孔壁线与螺杆大径线分开）。"]
