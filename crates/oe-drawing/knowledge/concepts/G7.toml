[[concepts]]
id = "DC-G7-087"
name = "焊缝尺寸省略的含义"
aliases = []
group = "G7"
kind = "text_convention"
meaning = "焊缝符号中未注尺寸也有含义：基本符号右侧无任何尺寸又无说明时，焊缝沿工件整个长度连续；左侧无尺寸又无说明时，对接焊缝应完全焊透；焊缝起止位置已由构件尺寸确定时，允许省略焊缝长度。"
components = ["右侧空白：连续焊缝，贯通整个长度。", "左侧空白（对接焊缝）：完全焊透。", "长度省略：起止由构件决定时可不注l。"]
variants = ["no right-side value: continuous weld", "no left-side value: complete penetration", "length omitted when determined by geometry (GB/T 12212 6.9)"]
dxf_forms = ["absence of TEXT on the left/right of the symbol inside the weld-symbol group (no entity to read; inferred from geometry)"]
recognition = "对识别出的每个焊缝符号，在符号左右各约1.5倍字高范围内检查是否有文字；右侧无文字→连续焊缝；左侧无文字且为对接类符号（I、V、Y、U、X、K等）→完全焊透。须先确认不是文字被拆散到其他位置或图层被关闭。"
confusions = ["漏注或文字丢失：DXF中文字可能在不同图层或因转换丢失，需排除。", "尺寸被统一写在技术要求中（如“全部焊缝为…”）。"]
