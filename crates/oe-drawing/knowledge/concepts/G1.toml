[[concepts]]
id = "DC-G1-033"
name = "点画线的伸出长度与最短长度"
aliases = []
group = "G1"
kind = "line"
meaning = "点画线（中心线、轴线、对称线）和双点画线应略超出所属轮廓；太短而画不出点画结构时用细实线代替或放大线素。"
components = ["伸出量：教材为超出轮廓2~5 mm；CAD 公式中点画线全长=轮廓内长度+24d，即每端约12d（d=0.25时约3 mm）。", "首末两端是长画而不是点；圆心应是长画的交点。", "点画线最小长度54.5d，短于此可画成细实线；双点画线最小长度58d，短于此按比例放大线素画出。", "中心线也不宜超出轮廓过长。"]
variants = []
dxf_forms = ["CENTER-type LINE whose endpoints lie 2–5 mm beyond the outline or circle", "short centre lines drawn as CONTINUOUS thin LINEs", "dimension variable DIMCEN: positive value = centre cross only, negative value = cross plus lines extending beyond the circle"]
recognition = "用于确认中心线：点画线与图形外形求交，交点外侧余量约2~5 mm（或约12d）；圆的中心线长度≈直径+4~10 mm。小圆（直径约小于8~12 mm）的中心线常为细实线十字、略长于直径，应按短中心线处理而非尺寸界线。中心线伸出很长（>10 mm）时可能兼作尺寸界线。"
confusions = ["短中心线：细实线，用于小圆。", "尺寸界线：细实线，越过尺寸线约2 mm，不成十字。"]
related = ["DC-G1-044", "DC-G1-037", "DC-G1-042", "DC-G1-061", "DC-G1-093"]
