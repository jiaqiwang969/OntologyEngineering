kind = "table"
meaning = "CAD 图样中按图线类型分层的标识号建议：01粗实线、02细实线/波浪线/双折线、03粗虚线、04细虚线、05细点画线、06粗点画线、07细双点画线、08尺寸、09参考圆与引出线、10剖面符号、11/12文本、13~15用户选用。"
components = ["GB/T 14665-2012 表6：08 为尺寸线、投影连线、尺寸终端与符号细实线及尺寸和公差；09 为参考圆（含引出线及其终端）；10 剖面符号；11 细实线文本；12 粗实线文本；13~15 用户选用。", "GB/T 18229-2000 表13：01 还含剖切面的粗剖切线；02 含细波浪线、细折断线；05 含剖切线；12 为尺寸值和公差；13 为粗文本；14~16 用户选用。", "层是 CAD 中组织实体、控制颜色、线型和可见性的属性。"]
variants = ["GB/T 18229-2000 表13: 01 also thick cutting-plane line, 02 thin wavy/break lines, 05 also cutting-plane line, 12 dimension values and tolerances, 13 thick text, 14-16 user", "GB/T 14665-2012 表6: dimension values and tolerances merged into 08, 13-15 user"]
dxf_forms = ["LAYER table: name (2), colour (62), linetype (6), lineweight (370), plot flag (290), frozen/off flags", "layer names may be the numbers 01…15, Chinese names (粗实线、细实线、虚线、中心线、剖面线、尺寸线、文字、双点画线), English names (OUTLINE, HIDDEN, CENTER, DIM, HATCH, TEXT), CAXA names (0层、中心线层、虚线层、细实线层、尺寸线层、剖面线层、隐藏层) or AutoCAD Mechanical names (AM_0, AM_3, AM_5, AM_7 …)", "Defpoints and frozen/off/non-plot layers"]
recognition = "先读 LAYER 表，建立“层名—颜色—线型—线宽”映射，再用层名关键字（数字编号、粗/细/虚/中心/点画/双点/剖面/尺寸/文字/标注）给出候选线类；以实体实际线型、颜色、线宽复核（实体可覆盖 ByLayer 设置）。许多图把内容都放在0层或随意分层，此时层不可作依据；关闭、冻结、不打印层（含 Defpoints）上的内容不属于图面表达。"
confusions = ["企业自定义层名：需结合颜色与线型重建映射。", "颜色号：颜色与层是两种属性，可能不一致。", "按线型而非层判断图线：层只是候选线索，线型与线宽才是图线本身。"]
