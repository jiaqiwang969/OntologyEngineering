[[concepts]]
id = "DC-G3-101"
name = "弹簧机械性能曲线"
aliases = []
group = "G3"
kind = "other"
meaning = "弹簧零件图上用图解方式表示负荷与变形（或扭矩与扭转角）关系的直线图，标出各工作负荷、极限负荷及相应高度或角度，作为弹簧特性要求。"
components = ["位置：压缩、拉伸弹簧画在主视图上方；扭转弹簧一般在左视图上方，也允许在主视图上方。", "图线：性能曲线画成直线，用粗实线；与弹簧视图端面对应的高度位置用细线连接。", "代号：负荷F1、F2、Fj（扭转弹簧T1、T2、Tj），对应高度H1、H2、Hj或扭转角φ1、φ2、φj，以及自由高度H0。", "只给定刚度要求时可以不画此图，改在技术要求中说明。"]
variants = ["压缩/拉伸弹簧画在主视图上方", "扭转弹簧画在左视图或主视图上方", "只要求刚度时不画，在技术要求中说明"]
dxf_forms = ["Thick LINE(s) (layer 01) inclined from a common origin, plus thin LINEs projecting down to the spring end faces", "TEXT symbols 'F1', 'F2', 'Fj', 'H0', 'H1', 'H2', 'Hj' (subscripts inline or smaller TEXT), sometimes in parentheses '(Fj)'", "Linear DIMENSIONs for H0/H1/H2 placed with the diagram"]
recognition = "以负荷代号（F1/F2/Fj或T1/T2/Tj）与高度/角度代号（H0/H1/H2/Hj或φ）组成的短文字群为锚点，位置在弹簧视图正上方（扭转弹簧可在左视图上方）；群内有一至两条从同一点出发的倾斜粗实线，以及若干与弹簧轴线垂直、对齐到弹簧端面位置的细线。区分尺寸线：尺寸线为带箭头细线，文字是数值；区分引出线：终止于零件轮廓且带基准线。"
confusions = ["尺寸线：带箭头的细线和数值文字。", "引出线：终止于零件轮廓。", "投影连线或辅助线：无F、H代号。", "运动轨迹线：机构图中，与弹簧无关。"]
related = ["DC-G3-102", "DC-G3-096", "DC-G3-017", "DC-G3-018", "DC-G3-019", "DC-G3-220", "DC-G1-053"]
