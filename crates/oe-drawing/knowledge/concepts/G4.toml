components = ["数量：整数，写在尺寸最前面，后跟乘号×（印刷体×，CAD中常为X或x）", "尺寸主体：Ø、R、M等前缀及数值，可再接公差与修饰符", "位置：标在其中一个要素上（尺寸线或指引线），在GPS规范中n×与公称值之间留空格", "旧式写法：数量与尺寸用短横连接，如 8-Ø8（标准中作为简化前形式）", "与CT连用：n×…CT 表示把n个要素视为一个公共被测尺寸要素"]
variants = ["n×Ø… on one of the features", "n×width×diameter for grooves (2012 explains 图1)", "GPS n× as first element of a size specification", "older hyphen form 8-Ø8 shown as the pre-simplification form", "尺寸前", "框格上方"]
dxf_forms = ["DIMENSION override text with count prefix, e.g. '8×%%c8' or '8X<>' (code 1)", "TEXT/MTEXT on a leader reference line: '4×%%c6.5'", "DIMPOST/prefix set in the dimension style override (XDATA DSTYLE) for repeated diameters", "multiplication sign stored as '×' (U+00D7), 'X', 'x' or '\\U+00D7'"]
recognition = "锚点：尺寸或旁注文字以“整数+乘号/字母X”开头（正则 ^\\d+\\s*[×xX]\\s*），其后紧跟Ø、R、M或数字。检验：图中与被注要素同尺寸（半径差<1%）的同类要素数量应等于n；被注要素是其中之一。与退刀槽“槽宽×直径”区分：前项为小数且指向单个窄槽；与螺纹M24×2区分：乘号在M规格之后；与等间隔链式 n×p(=L)区分：后者带等号括号总值；与正方形B×B区分：两项相等且无Ø。"
confusions = ["等间隔链式尺寸 n×p(=L)：带括号总值", "退刀槽 槽宽×直径/槽深：前项为宽度", "螺纹规格 M10×1：乘号表示螺距", "花键标记 N×d×D×B：多个乘号", "公共被测尺寸要素 CT：n×后另带CT，含义变为联合要求"]
