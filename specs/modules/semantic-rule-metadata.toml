[[constraints]]
id="semantic_forward_rule_metadata"
requirement="req_semantic_platform"
module="semantic_runtime"
check="forward_chain_values"
rust_path="crates/semantica-runtime/src/reasoner.rs"
statement="Original ForwardRuleDTO rule_id/text/confidence/priority normalize on the same textual engine as BookRunner. Mixed strings consume only their own rule_N counters; duplicate IDs and parsed semantics reject. Stable descending arbitrary integer priority determines first derivation identity/confidence, while later same-pass premises merge. The old MCP infer_facts profile and kernel unary-Horn rules remain unchanged, and original string assets retain their 10 exact oracles and explicit convergence probe. No second registry, RDF conversion or engineering authority is introduced."
severity="error"

[[constraints]]
id="semantic_reason_port_identity"
requirement="req_semantic_platform"
module="semantic_runtime"
check="execute_reason"
rust_path="crates/semantica-runtime/src/runtime.rs"
statement="Generated neutral request/result/port are the only new shared contract. Validate the explicit schema and complete ordered request byte budget before canonical SHA; preserve arbitrary integer priority and original arrays. Delegate normalization and execution to forward_chain_values, return structured failures without an empty-success fallback. Kernel reason uses this port under the existing compiled-execution guard; oe-semantic legacy Python execution stays retired."
severity="error"

[[validations]]
id="verify_semantic_forward_rule_metadata"
module="semantic_runtime"
constraint="semantic_forward_rule_metadata"
behavior="structured_rule_metadata_source_cases"
rust_path="crates/semantica-runtime/tests/reasoner_metadata.rs"
oracle="40 independent cases derived from pinned original source code, not original runtime observations: custom IDs/confidence, stable priority/ties, string-only numbering, first-rule identity with merged premises, defaults, invalid field types/ranges/IDs/duplicates, unbound variables and nonconvergence. Existing 8 high-level string and 10 runtime string-asset oracle results are separate unchanged regressions."
scope="Finite JSON projection and bounded Rust profile; native Python objects/custom handlers, Unicode variable identifiers, SWRL/OWL entailment and engineering adoption remain separate"

[[validations]]
id="verify_semantic_reason_port_identity"
module="semantic_runtime"
constraint="semantic_reason_port_identity"
behavior="metadata_port_preserves_request_identity_and_rejects_invalid_shape"
rust_path="crates/semantica-runtime/tests/reasoner_metadata.rs"
oracle="Actual generated request/result/port preserve full metadata and request hash; wrong schema, unknown top-level/rule fields and complete-input over-budget reject without fallback. Installed CLI replay is separately recorded under current compiled identity."
scope="Portable Rust source contract; platform/build/installed CLI proof requires actual current execution, not inherited old receipts"

[[validations]]
id="verify_semantic_reason_arbitrary_integer_priority"
module="semantic_runtime"
constraint="semantic_forward_rule_metadata"
behavior="priorities_preserve_arbitrary_integer_order_without_float_or_i64_coercion"
rust_path="crates/semantica-runtime/tests/reasoner_metadata.rs"
oracle="Independent large signed JSON integer priorities retain original numeric values and exact descending order through preserved generated fields; values differing below binary64 precision are not conflated. This is an additional test outside the 40 source-derived cases."
scope="Current finite JSON wire and bounded Rust execution; arbitrary Python objects and unbounded resource claims excluded"

[[validations]]
id="verify_semantic_reason_ordered_input_bounds"
module="semantic_runtime"
constraint="semantic_forward_rule_metadata"
behavior="ordered_fact_inputs_and_rule_budget_boundaries_reject_without_partial_closure"
rust_path="crates/semantica-runtime/tests/reasoner_metadata.rs"
oracle="One normalized fact per ordered-array item, original sorted/deduplicated facts, explicit multi-line/comment-only/nonstring/object rejections, 257-rule and over-1MiB values rejection, invalid 0/1001 iteration bounds; no incomplete success returned. Separate from original source-derived cases."
scope="Current API bounds and normalization; old BookRunner raw UTF-8 asset budget remains distinct from new full-request JSON budget"

