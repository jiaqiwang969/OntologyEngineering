[[concepts]]
id = "DC-G2-016"
name = "几个相交剖切面获得的剖视图（旋转剖）"
aliases = ["旋转剖"]
group = "G2"
kind = "section"
meaning = "用两个或多个相交剖切面（交线垂直于某基本投影面）剖开机件，把被倾斜剖切面剖开的结构及有关部分旋转到与选定投影面平行后再投射所得的剖视图（习惯称旋转剖）。"
components = ["剖切符号：在交线处（通常为回转中心）以斜角转折，起迄和转折处注同一字母，转折处字母可省略。", "剖视图：倾斜部分按旋转后位置画出，故沿该方向的长度大于原视图投影长度；剖面线连续。", "剖切平面后的其他结构（如油孔）一般仍按原位置投射。", "剖切后产生的不完整要素按不剖绘制。", "可用展开画法并标“X—X展开”；两组以上相交剖切平面时，剖切符号相交处注字母“O”。"]
variants = ["two intersecting planes", "developed form (see 展开)", "旋转剖展开画法", "多组相交剖切面（交点注 O）"]
dxf_forms = ["Cutting strokes (thick LINE/LWPOLYLINE) meeting at an oblique angle at the hub centre, with arrows and TEXT letters", "Section HATCH spanning the rotated web; label TEXT 'A-A' or 'A-A展开'"]
recognition = "以剖切符号转折点为锚点：转折处两段粗短画夹角不为90°，转折点与圆形视图的圆心（同心圆圆心或中心线交点）重合；对应剖视图中沿倾斜方向的结构长度等于真长，比按投影关系应有的长度长，可与圆形视图的半径比对确认。"
