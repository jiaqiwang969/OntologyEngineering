reader_problem: >-
  当同一术语或同一字符串 ID 出现在产品、系统、工件、物理单件、功能、行为、
  concern、measure、state 与 role 等不同范畴中时，如何判断记录是否真的指向
  同一对象、表达同一含义；当名称不同时，又如何在证据不足时保留 Unknown 而
  不静默合并或拆分？

natural_judgment:
  id: NaturalJudgment-02
  statement: >-
    只要所有系统使用同一个术语表和同一个 ID，记录就指向同一对象、表达同一含义，
    因而可以直接合并；名称不同的记录则属于不同对象。

failure_signature: >-
  字符串相同但候选对象的类型、边界、持续条件、配置或语义宿主不同；或者字符串不同
  但可能通过序列与履历桥接到同一物理单件。若仅按名称合并，会把属性、故障、证据和
  决定传播到错误对象；若仅按名称拆分，又会切断同一对象的数字线程。

