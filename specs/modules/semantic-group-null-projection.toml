oracle="Exact frozen original values, types, ordering, exception payloads and source object readbacks; separately named Rust boundary checks do not become original observations."
scope="Private default-off; preserves all old validations, fixtures, public1-4, all63 engineering requirements and pending complete UPDATE884+105 actions. New UCASE/LCASE positive execution admits ASCII only; general Unicode case remains required and pending, with an explicit unreceived boundary. No public5, formal installation, release or method benefit claim."

