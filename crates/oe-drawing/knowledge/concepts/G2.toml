recognition = "以剖面区域（HATCH或成组平行细线）为锚点，其边界由粗实线围成；同一视图簇中还有不带剖面线的粗实线轮廓（剖切面后的可见部分）。再找“X—X”名称及同字母剖切符号，或按投影关系对应的视图。只有剖面区域的是断面图，没有剖面区域的是外形视图。"
