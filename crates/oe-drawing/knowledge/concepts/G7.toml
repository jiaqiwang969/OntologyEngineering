components = ["框格：一行相连的矩形格，高度按表1推荐（7.5～42 mm），线宽为模数M的1/10。", "装入数量格：如“2×”，数量为1时可省略该格。", "工艺方法格：放置对应工艺的图形符号（机加、钣金、焊接或装配方法符号）。", "参数、资源、检验格：如“M=5 N·m”“力矩扳手”“δ≤0.1 mm”。", "工步序列号格：带圈数字①②，只有一个工步时省略。", "指引线：从框格引向模型特征。"]
variants = ["machining frame", "sheet-metal frame", "welding frame", "assembly frame", "with/without quantity cell", "with/without step-number cell"]
dxf_forms = ["row of adjoining rectangles (LWPOLYLINE/LINE) with TEXT in each cell and an INSERT or exploded strokes for the process pictogram in the second cell", "LEADER/MLEADER from the frame end to the feature", "possibly a single block INSERT with ATTRIBs per cell"]
recognition = "锚点为一行等高相接的矩形格（≥3格），其中一格为图形（非文字），首格为“n×”或该格缺省，末格可能为带圈数字。与几何公差框格区分：公差框格第一格是几何特征符号（如⊥、◎），其后为公差值和基准字母，格数一般2～5且第三格起为大写字母；工艺框格含中文资源名、扭矩等工艺参数。"
confusions = ["几何公差框格：第一格为特征符号，后为公差值和基准字母。", "标题栏或明细栏的行：位于图框右下角，格宽不一且有表头。", "带尾部的焊缝符号：基准线加尾部叉号，没有矩形格。"]
