[[concepts]]
id = "DC-G4-038"
name = "非实形图形上尺寸数值下的粗短画"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "线性尺寸和角度一般应注在反映实形、实角的图形上；当变形较小且不致误解时，允许注在不反映实形/实角的图形上，此时在尺寸数值下方加画一条粗短画，表明该值是真实值而非图上量得的长度。"
components = ["尺寸本身：普通线性或角度尺寸，注在倾斜结构的非实形投影上。", "粗短画：位于尺寸数字正下方的一段粗实线短横，长度与数字宽度相当，与数字方向平行。", "适用：机件倾斜部分变形较小时；变形较大时仍应采用斜视图等表示实形。"]
variants = []
dxf_forms = ["LWPOLYLINE with constant width ≈ d (thick-line width) or a LINE on the thick-line layer 01, placed just below the dimension text", "DIMENSION whose override text uses %%u underline (thin underline; a common CAD shortcut, not strictly a thick bar)", "MTEXT with \\L...\\l underline formatting", "exploded TEXT + separate short thick LINE"]
recognition = "锚点为尺寸文字；在其下方约0.2–0.5h处寻找一段与文字方向平行的短线，长度≈文字宽度，线宽≈粗实线d（LWPOLYLINE宽度、01层或粗线宽属性），且被注对象在本视图中为倾斜要素的非实形投影（如本应为圆的结构投影成椭圆，或线段长度与数值×比例明显不符）。与“不按比例”下划线区分：后者为细实线下划线（%%u），表示图形未按比例画；与注释文字下划线区分：注释不连尺寸线。"
confusions = ["不按比例尺寸的下划线：细实线下划线，表示该处图形未按比例绘制。", "技术要求等注释中的下划线：不属于尺寸。", "删除线或修改标记：线穿过数字中部，或配有更改符号。", "GB/T 16675.2的非真实大小投影注法：同一种表示，出自另一标准，含义一致。"]
related = ["DC-G4-039", "DC-G2-080", "DC-G3-107", "DC-G4-017"]
priority = "low"
text_forms = ["R9（数值下加粗短画）", "40（数值下加粗短画）"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 24739-2009 4.2 (example 图A.4 cited in the text, figure not read). Same visual device as DC-G4-039. The %%u shortcut and DXF forms are general practice; strictly the bar is a thick line."
