[[concepts]]
id = "DC-G4-052"
name = "深度符号 ↧"
aliases = ["深度符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "深度符号（短横线下接向下箭头的↧）写在深度数值之前，用于孔旁注中表示盲孔、螺孔或沉孔的深度，如4×Ø4↧10。"
components = ["符号：顶部横线长h，竖线长h，下端两斜线夹角60°、斜线高0.6h，左右对称，线宽h/10。", "盲孔：“n×Ød↧L”，L为圆柱部分深度（不含钻尖锥）。", "螺孔：螺纹深度与钻孔深度可分别用↧注出（如M6↧10，孔↧12）。", "沉孔：沉孔直径后接↧深度（⌴Ø12↧4.5）。", "GB/T 16675.2-1996表1中该符号的OCR呈“T”。"]
variants = ["in hole leader notes", "after counterbore ⌴Ø… ↧…"]
dxf_forms = ["MTEXT '4×%%c4{\\Fgdt;x}10' (gdt.shx 'x' = depth)", "MTEXT Unicode '\\U+21A7' (↧)", "exploded: LINE strokes (bar + stem + two arrow strokes) or INSERT of a depth-symbol block before TEXT", "layer 08/09 or template dimension layer"]
recognition = "锚点为孔旁注文字中Ø值或M规格之后的符号＋数值；符号几何为短横线（≈h）下接竖线和开口60°的箭头，或gdt字符x、U+21A7（OCR常读作“T”“丁”“了”“↓”）。数值为深度，应小于零件在该方向的厚度；剖视中盲孔圆柱段深度≈数值×比例。排除：垂直度⊥横线在下、无箭头且位于框格内；基准三角形连方框字母；字母T需看前后是否为孔规格和数值。"
confusions = ["字母T或汉字“丁”：OCR误识，需看前后是否为孔规格和数值。", "垂直度符号⊥：横线在下，位于公差框格内。", "基准要素三角形：涂黑或空心三角连方框字母。", "沉孔⌴、埋头孔⌵：同在旁注中但形状不同。", "旧图纸“深10”文字：含义相同，写法不同。"]
