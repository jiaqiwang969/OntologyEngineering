[[concepts]]
id = "DC-G3-189"
name = "联轴器符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构或传动简图中表示把两根同轴轴连接起来、一同转动的联轴器，有一般符号及固定、可移式、弹性联轴器。"
components = ["一般符号（不指明类型）：两根同轴粗轴线在中间断开，各自端部有一条竖直短线，两短线平行相对、留有间隙。", "固定联轴器：细线矩形框罩住两轴连接处，框内两轴端处各有一个小“×”形固连标记。", "可移式联轴器：框内一侧轴端为竖线，另一侧为开口朝向它的半圆。", "弹性联轴器：框内两半体竖线之间以一条斜折线相连。", "1984 版 8.1～8.1.3 与 2013 版 11.1～11.1.3 图形一致。"]
variants = ["一般符号", "固定联轴器", "可移式联轴器", "弹性联轴器"]
dxf_forms = ["Two collinear thick shaft LINEs (or 2d-wide LWPOLYLINE) with short vertical LINEs at the gap on layer 01", "Thin LWPOLYLINE rectangle around the junction with inner × marks, ARC (half circle) or zigzag polyline", "INSERT of a library block"]
recognition = "锚点：两根同轴粗轴线的断口。断口处只有两条对置短竖线→一般符号；有细矩形框时看框内：小“×”→固定；半圆→可移式；斜折线→弹性。与离合器区分：离合器有罩形“匚”外壳、凹凸爪、摩擦片、线圈或操纵字母；与制动器区分：制动器只连一根轴并有施力箭头；与电气图电容器符号（两条平行短线）区分：联轴器两侧是粗轴线并位于机构简图中。"
confusions = ["可控/自动离合器：有罩形外壳和内部标记，可带 M/H/P/E。", "制动器：单侧轴加施力箭头。", "电气图电容器符号：同为两条平行短线，但属于电气图，线宽和上下文不同。"]
related = ["DC-G3-156", "DC-G3-190", "DC-G3-149", "DC-G3-196", "DC-G3-176"]
