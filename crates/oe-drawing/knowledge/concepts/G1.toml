[[concepts]]
id = "DC-G1-064"
name = "保护声明（完全版）"
aliases = ["保护声明（简化版）"]
group = "G1"
kind = "note"
meaning = "写在文件（图样）上的限制使用声明：未经许可不得转让、复制、利用或公开其内容，违者承担赔偿责任，并保留专利、实用新型或外观设计注册的权利；不便时可用简化版“版权保护”。"
components = ["完全版：一段声明文字，可把“文档”换成准确术语（如“图样”）。", "简化版：仅写“版权保护”，应尽量少用。", "附录给出多种外文版本，外贸图样常见英文或德文版。", "常放在标题栏附近或图框内边缘。"]
variants = ["中文完全版", "英文等外文版（表A.1）"]
dxf_forms = ["MTEXT paragraph near the title block, often inside the frame/title-block INSERT", "ATTRIB/ATTDEF inside the frame or title-block INSERT when the note is part of a company template"]
recognition = "文本关键词匹配：中文“未经许可”“转让”“翻印/复制”“赔偿”“保留”；英文“reproduction”“distribution”“without express authorization”“prohibited”“damages”；德文“Weitergabe”“Vervielfältigung”。位置在图框内靠边或标题栏上方，字高小（常2.5~3.5 mm）。属管理信息，不是技术要求。"
confusions = ["技术要求注语：对零件的技术要求，带编号。", "保密等级标记：如“秘密”，属密级而非版权。", "版权标识：© 加所有者与年份。"]
related = ["DC-G1-075", "DC-G1-063", "DC-G9-028"]
priority = "low"
text_forms = ["版权保护", "未经许可不得转让及翻印", "… without express authorization is prohibited."]
