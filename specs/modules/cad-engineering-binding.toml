[[constraints]]
id="cad_native_assembly_construction_binding"
requirement="req_delivery"
module="cad"
check="verify"
rust_path="crates/oe-cad/src/evidence/correspondence/construction.rs"
statement="复用原receipt、event_index、source_assembly、assembly和当前实例owner；构造/保存/全部PRT闭包与独立回读精确连接。按原有序placement核native add发出顺序，诊断批按原persist_batch计量逐项原JSON字节和；倒序/错账、不同对象ID/revision/条件、相同进程、缺失/重复/部分add、错误源或save失败拒绝；声明通过不能恢复opaque能力。全16/63及19/19/22/13494范围保持。"
severity="error"

[[constraints]]
id="cad_native_assembly_construction_project_consumer"
requirement="req_delivery"
module="cli"
check="run"
rust_path="crates/oe-cli/src/cad/construction.rs"
statement="生产入口复用Project::cad_focus与impact，构造/检查job、两份native结果及构造意图须在同Project登记；完成前重读输入/Project/来源与实际执行身份，不写采用。"
severity="error"

[[validations]]
id="cad_construction_source_chain_positive"
module="cad"
constraint="cad_native_assembly_construction_binding"
behavior="assembly_construction_binds_creator_save_and_independent_reopen"
rust_path="crates/oe-cad/tests/assembly_construction.rs"
oracle="完整合成构造/保存/独立进程回读连接；完整实例与原型闭包；报告不建立工程采用或任意拓扑身份"
scope="软件合同控制；真实native另以当前源码和完整回执验收"
[[validations]]
id="cad_construction_original_emission_account"
module="cad"
constraint="cad_native_assembly_construction_binding"
behavior="assembly_construction_checks_native_emission_order_and_byte_accounting"
rust_path="crates/oe-cad/tests/assembly_construction.rs"
oracle="完整且端点合格的add记录倒序、或只改原诊断字节账后均须拒绝；原反例实际先失败再修复，预期保留"
scope="依据原source_assembly逐placement调用及persist_batch计量；不称工程/RRSI收益"
[[validations]]
id="cad_construction_context_process_refusal"
module="cad"
constraint="cad_native_assembly_construction_binding"
behavior="assembly_construction_rejects_context_or_process_substitution"
rust_path="crates/oe-cad/tests/assembly_construction.rs"
oracle="对象ID/revision/条件不符、相同进程或来源任务替换均拒绝"
scope="冻结反例；旧Project和原20/22验收继续保留"
[[validations]]
id="cad_construction_add_save_refusal"
module="cad"
constraint="cad_native_assembly_construction_binding"
behavior="assembly_construction_rejects_incomplete_add_or_save"
rust_path="crates/oe-cad/tests/assembly_construction.rs"
oracle="缺失/重复/部分add、父/原型/实例不符、失败保存和错误事件阶段/身份不得由合格端点自证"
scope="软件反例；不改变原私密文件、原生任务或几何判据"
[[validations]]
id="cad_construction_artifact_refusal"
module="cad"
constraint="cad_native_assembly_construction_binding"
behavior="assembly_construction_rejects_wrong_output_or_inventory"
rust_path="crates/oe-cad/tests/assembly_construction.rs"
oracle="构造输出与回读全部PRT字节、完整实例/原型和姿态覆盖不符时拒绝；不按形似或相同tag猜来源"
scope="独立预期；本合同不宣称连续运动或制造适用"
[[validations]]
id="cad_construction_project_cli"
module="cli"
constraint="cad_native_assembly_construction_project_consumer"
behavior="construction_cli_requires_current_project_sources_and_preserves_review"
rust_path="crates/oe-cli/tests/cad_construction.rs"
oracle="真实CLI重新执行来源链及同Project核验，缺源/陈旧上下文拒绝，原义务及unknown保留，报告不写Project或采用"
scope="当前源软件caller；历史native回放、当前平台/native与工程采用分别验收"

