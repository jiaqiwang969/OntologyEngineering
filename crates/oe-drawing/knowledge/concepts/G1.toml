[[concepts]]
id = "DC-G1-042"
name = "细双点画线"
aliases = []
group = "G1"
kind = "line"
meaning = "线宽为细线的长画双点画线，主要表示假想轮廓：相邻辅助零件、可动零件极限位置、成形前轮廓、剖切面前的结构、轨迹线、中断线等。"
components = ["线型05，线宽约0.5d；长画约24d，间隔约3d，两点各不大于0.5d。", "用途共11项（05.1.1~05.1.11），含重心线、毛坯图中的制成品轮廓、特定区域线、延伸公差带表示线、工艺用结构轮廓线。", "CAD 规定最小长度58d，过短时放大线素；画长画时允许改变方向。", "CAD 分层07层，屏幕显示粉红色。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE with a double-dot linetype (PHANTOM, PHANTOM2, DIVIDE, ACAD_ISO05W100 or e.g. 双点画线), thin lineweight, layer 07 / 双点画线, colour magenta/pink (ACI 6)", "AutoCAD PHANTOM is long dash + two short dashes; DIVIDE and ACAD_ISO05W100 contain true dots", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying", "visible dash length = LTYPE pattern × header $LTSCALE × entity linetype scale (group 48) (× $PSLTSCALE rules in paper space)", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "按线型图案判定：一个长画后跟两个点（或两个短画）。名称不可靠时数 LTYPE 序列：长画+3个间隔+2个点/短画为双点画线，长画+2个间隔+1个点为点画线。再按几何关系分用途：与主零件全等→极限位置；与主零件贴合而不同形→相邻零件；在毛坯外形内→制成品轮廓；单条曲线→轨迹；横切长件→中断线。"
