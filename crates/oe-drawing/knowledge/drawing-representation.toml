[[cards]]
id = "leader_note"
expression_kind = "leader_note"
title = "引出说明"
meaning = "用指引线从要素引出、写在基准线（水平参考线）上的说明或标记。指引线是细实线，一般一段或折一次，在要素一端画终端：落在轮廓或可见边上用箭头，落在面内用圆点，倒角注写可不画终端而沿倒角边延长引出；另一端接水平基准线，文字写在基准线上方。文字的文法决定它是什么：螺纹标记是螺纹标注，倒角“a×b°”是倒角尺寸，其他文字是引出说明。CAD 常把一条引出说明（引线、终端、基准线、文字）存成一个图块。用指引线从图形引出、写在基准线（水平折线）上的文字说明：文字站在基准线上方，第二行可写在其下方；指引线从基准线一端折出，末端用箭头指在轮廓或图线上，或不画终端（末端在面内、贴近所指的线）。它说明所指部位，不是尺寸，也不是技术要求条目。"
sources = [
  "GB/T 4457.2-2003 机械制图 图样画法 指引线和基准线的基本规定 3、4（指引线、基准线与终端）",
  "GB/T 4458.4-2003 机械制图 尺寸注法 4.1.5（尺寸数字可注在指引线引出的基准线上）",
  "GB/T 4459.1-1995 螺纹及螺纹紧固件表示法 4.6（螺纹标记注在大径的尺寸线或其引出线上）",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 4.2",
  "GB/T 4457.2-2003 技术制图 图样画法 指引线和基准线的基本规定 3、4",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法",
  "机械制图（第7版）§9-1 零件图的尺寸注法（引出说明）",
]
knowledge_units = ["K14", "K55"]
recognition = "一个图块中：文字立在一条水平基准线上方（文字中心在基准线以上、不超过约一个字高，横向在基准线范围内）；从基准线一端接出一到两段细线，末端有实心三角箭头、圆点或无终端；块中没有别的东西。文字按尺寸注写文法分类：螺纹标记→螺纹标注，倒角→倒角尺寸，直径、半径→相应尺寸，其余→引出说明。终端所在的轮廓或边线记为被指要素。散线画时：以含汉字的文字为锚：其下有一条尚未读出的细线，文字站在线上（基准线）；从基准线两端沿细线追踪（精确相接，或共线重叠、略有缝隙），其中要有一段与基准线成角折出；末端是箭头，或没有终端但末端贴近一条图线。基准线下方紧接的一行附注词（见 callout_rows 卡词表）一并归入。"
markers = []
concepts = ["DC-G1-028", "DC-G1-096", "DC-G1-098"]

