meaning = "徒手曲线最少顶点数"

[[cards.parameters]]
name = "free_curve_max_turn_deg"
value = 35.0
meaning = "徒手曲线每处转角上限（度）"

[[cards.parameters]]
name = "line_end_on_curve"
value = 0.35
meaning = "剖面线端点到曲线的距离上限 = 该值 × 字高（手画剖面线常略短或略长）"

[[cards.parameters]]
