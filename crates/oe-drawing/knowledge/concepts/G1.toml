[[concepts]]
id = "DC-G1-014"
name = "可见棱边线"
aliases = []
group = "G1"
kind = "line"
meaning = "用粗实线表示物体上两个面相交形成、在投射方向上看得见的棱边。"
components = ["粗实线（No.01.2.1），线宽 d（常用0.5或0.7 mm）。", "两端连接其他棱边或轮廓，构成面的边界；与另一视图中的面边界按投影对应。", "画法与可见轮廓线完全相同，仅含义不同（面—面交线而非转向轮廓）。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight (group 370) 50 or 70 (0.5/0.7 mm) or ByLayer on a thick layer: GB/T 14665 layer 01, names such as 粗实线/轮廓线/OUTLINE, CAXA 0层; colour white/black (ACI 7)", "thick strokes drawn as LWPOLYLINE with constant width (group 43 ≈ 0.5–0.7) when lineweights are not used", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为粗线（按线宽、图层或颜色判定）。二维上与可见轮廓线无法区分，可在三维重建时区分：若该线在相邻视图中对应两个面的交线（端点处有折向、另一视图出现面的积聚线），则为棱边；若对应曲面在投射方向的转向线（另一视图该处为圆的切点），则为转向轮廓。铸造圆角处的理论棱边画成细实线并在端部留隙（过渡线），不要误判为棱边缺失。"
confusions = ["可见轮廓线：同型，语义为外形或曲面转向轮廓。", "过渡线：细实线，端部与轮廓留有空隙。", "相贯线：粗实线，但为两个曲面立体的交线，多为曲线或简化圆弧。"]
related = ["DC-G1-015", "DC-G1-038", "DC-G1-054", "DC-G1-035", "DC-G1-001"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55", "K39"]
