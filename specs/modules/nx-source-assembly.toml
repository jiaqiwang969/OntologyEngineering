[[constraints]]
id="nx_real_source_assembly"
requirement="req_engineering"
module="nx_worker"
check="execute"
rust_path="crates/oe-nx-worker/src/geometry/source_assembly.rs"
statement="有源PRT私有副本创建新根；空根先保存再查真实文件命名空间，完整装配另行保存；逐实例加入保留重复原型；加载文件完整声明、原型必须叶节点，保存前后原型/实例/绝对姿态/几何一致；独立重开和工程采用另验。"
severity="error"

[[validations]]
id="source_assembly_real_source_parameters_and_inventory_preserve_shared_prototypes"
module="nx_worker"
constraint="nx_real_source_assembly"
behavior="real_source_parameters_and_inventory_preserve_shared_prototypes"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="真实源动作新版本可解析；共享原型不同实例必须完整；错位置或漏实例拒绝"
scope="软件合同与原生观测反例；Windows和真实NX执行另验"

[[validations]]
id="source_assembly_real_source_rejects_root_alias_missing_prototype_and_invalid_pose"
module="nx_worker"
constraint="nx_real_source_assembly"
behavior="real_source_rejects_root_alias_missing_prototype_and_invalid_pose"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="新根与源目录或文件冲突、未声明原型、嵌套目标、非刚体及超预算拒绝"
scope="软件合同与原生观测反例；Windows和真实NX执行另验"

[[validations]]
id="source_assembly_source_action_copies_adds_checks_and_saves_without_claiming_reopen"
module="nx_worker"
constraint="nx_real_source_assembly"
behavior="source_action_copies_adds_checks_and_saves_without_claiming_reopen"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="空根未保存时命名空间查询拒绝；修后同一原型加入两次，独立名称和mm/旋转意图一致，完整装配保存一次；重开仍未验"
scope="受控NativeApi编排与私有文件；实际NX/Windows另验"

[[validations]]
id="source_assembly_source_action_rejects_changed_source_uncovered_geometry_and_failed_save"
module="nx_worker"
constraint="nx_real_source_assembly"
behavior="source_action_rejects_changed_source_uncovered_geometry_and_failed_save"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="意图摘要变更不进入原生；文件变更、未声明加载、嵌套/漏实例不保存，保存后几何变化拒绝"
scope="受控NativeApi编排与私有文件；实际NX/Windows另验"

[[constraints]]
id="nx_assembly_diagnostic_stream"
requirement="req_engineering"
module="nx_worker"
check="persist_batch"
rust_path="crates/oe-nx-worker/src/load_diagnostics.rs"
statement="新来源装配动作逐步持久保存完整有序诊断批次，成功才清队列和计量，写失败保留原件；原native512KiB入队guard不放宽，原生失败仍保存诊断并返回失败；完整装配观测单独保存并返回摘要引用。"
severity="error"

[[validations]]
id="stream_complete_batches_exceed_legacy_total_without_growing_pending_queue"
module="nx_worker"
constraint="nx_assembly_diagnostic_stream"
behavior="complete_batches_exceed_legacy_total_without_growing_pending_queue"
rust_path="crates/oe-nx-worker/tests/load_diagnostics.rs"
oracle="3027批总量超过旧全会话预算但每次队列有界，原顺序和完整内容保留"
scope="平台无关队列/编排；真实Windows和NX规模执行另验"

[[validations]]
id="stream_failed_writer_retains_exact_batch_and_accounting_for_recovery"
module="nx_worker"
constraint="nx_assembly_diagnostic_stream"
behavior="failed_writer_retains_exact_batch_and_accounting_for_recovery"
rust_path="crates/oe-nx-worker/tests/load_diagnostics.rs"
oracle="写失败保持原值和计量，随后成功才释放；计量漂移不写"
scope="平台无关队列/编排；真实Windows和NX规模执行另验"

[[validations]]
id="stream_failed_native_add_persists_complete_diagnostics_before_returning_error"
module="nx_worker"
constraint="nx_assembly_diagnostic_stream"
behavior="failed_native_add_persists_complete_diagnostics_before_returning_error"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="原生错误19完整持久后仍返回失败，不进行完整保存"
scope="平台无关队列/编排；真实Windows和NX规模执行另验"

[[validations]]
id="stream_full_instance_action_streams_over_old_total_and_keeps_bound_observations"
module="nx_worker"
constraint="nx_assembly_diagnostic_stream"
behavior="full_instance_action_streams_over_old_total_and_keeps_bound_observations"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="实际候选动作受控执行1520实例，完整诊断总量超过512KiB，每批确认后释放，最终只返回绑定观测引用"
scope="受控API完整实例规模与失败编排，不是NX几何验证"

[[validations]]
id="stream_action_writer_failure_retains_unacknowledged_diagnostics_and_stops"
module="nx_worker"
constraint="nx_assembly_diagnostic_stream"
behavior="action_writer_failure_retains_unacknowledged_diagnostics_and_stops"
rust_path="crates/oe-nx-worker/tests/source_assembly.rs"
oracle="动作中收据写失败时保留未确认诊断，停止后续加入及完整保存"
scope="受控API完整实例规模与失败编排，不是NX几何验证"
