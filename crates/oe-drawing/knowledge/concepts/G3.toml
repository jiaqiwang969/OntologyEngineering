recognition = "以局部放大图标识为锚点（父视图中的细实线圆＋编号，与放大视图上方的“编号/比例”标签同号）。把放大图的几何按比例缩回父视图位置比较：父视图圈内的实体明显少于放大图（缺槽、缺圆角、缺牙型等）时，判为本简化，而不是父视图漏画。区分漏画：没有对应的局部放大图；区分小结构省略：小结构省略不需要放大图。"
