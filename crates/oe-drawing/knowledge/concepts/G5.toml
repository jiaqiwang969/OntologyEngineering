[[concepts]]
id = "DC-G5-076"
name = "直线度"
aliases = ["直线度符号"]
group = "G5"
kind = "symbol"
meaning = "直线度：形状公差，限定被测直线（素线、给定截面内的线或导出中心线）的变动；公差值前加 Ø 时表示轴线须在直径为公差值的圆柱内，不涉及基准。"
components = ["特征符号：一条水平短线，长约 0.6H，位于第一格竖直中线", "第二格：公差值；被测为中心线时前加 Ø（如 Ø0.006）；可写任意局部长度 0.05/100", "无基准格；被测为表面上的线素时宜在框格右侧加相交平面框格（素线直线度可省）"]
variants = ["applies to a line element in a stated intersection plane, to a generatrix, or (with φ before the value) to a derived median line", "old term: 形状和位置公差 (形位公差) item in GB/T 1184-1996", "素线直线度（两平行直线公差带）", "轴线直线度（前加 Ø）"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;u} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph a single horizontal LINE (≈0.6H) in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⏤ (U+23E4) or a plain '—' (or MTEXT font switch {\\Fgdt;u}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内唯一的一条水平 LINE：中点与格中心重合（≤0.1H），长约 0.5–0.7H，两端不碰格线，格内无其他笔画 → 直线度。三条为对称度。格外的短横是负号、连字符或尺寸线；滤波器后缀“-”在第二格数字后。第二格数值以 Ø 开头时被测为轴线。"
confusions = ["对称度（三条横线）", "负号、连字符、尺寸线", "滤波器长波通后缀“-”", "表面结构纹理符号 ="]
related = ["DC-G5-061", "DC-G5-056", "DC-G5-090", "DC-G5-088", "DC-G5-111", "DC-G5-086", "DC-G5-103"]
priority = "high"
text_forms = ["⏤ 0.02", "⏤ Ø0.006", "⏤ 0.05/100"]
