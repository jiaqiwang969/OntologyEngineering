kind = "tolerance_indication"
meaning = "延伸公差带的图示：把孔或螺柱的被测部分沿轴线向零件外“虚拟延伸”，延伸部分用细长双点画线（05.1）画出，其长度用前加 Ⓟ 的带框理论正确尺寸标注；框格第二格公差值后写 Ⓟ。"
