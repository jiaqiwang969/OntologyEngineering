candidate_chapter: functional-safety-book/ch04-concept-hara/chapter.md

reader_problem: >-
  当同一对象的同一偏差出现在不同情境中时，如何识别正在被评价的
  scenario、concern 与 consequence，并在不预支方案的情况下写出 objective？

natural_judgment:
  id: NaturalJudgment-04
  statement: >-
    从故障或失常清单出发，给每一行选一个等级和一项措施，就已经完成了
    “我们担心什么”与“要达到什么”的判断。

counterexample_eps: >-
  EPS 非预期助力在高速行驶与维修工位静止两种 context 中，后果链与
  HARA 出口不同；不得为失常名称直接分配一个固定 ASIL。

counterexample_env01: >-
  ENV-01 湿度测量漂移在仓储监测与校准台检查中支持不同的候选目标；
  这些目标不使用 S/E/C、ASIL 或 SafetyGoal。

missing_distinctions:
  - AnalysisSubject_vs_Deviation
  - Context_vs_Scenario
  - Concern_vs_Consequence
  - Objective_vs_Implementation
  - GenericObjective_vs_ISO26262SafetyGoal
  - ExplicitAssumption_vs_AcceptedFact

single_factor_variant: >-
  保持 AnalysisSubject 与 Deviation 不变，只更换受控情境的身份；读者必须重开
  consequence、concern、classification 和 objective 中受影响的部分，不得整行复制。

eps_projection:
  case_role: TeachingExample
  example_status: Synthetic
  analysis_subject: EPS 电动助力转向功能相关项
  deviation: 非预期助力转矩
  core_scenarios:
    - scenario: SCN_EPS_UnintendedAssist_Highway
      context: CTX_EPS_Highway
      consequence: CONSEQ_EPS_CollisionOrRoadDeparture
      concern: CONCERN_EPS_RoadUserSafety
      objective: OBJ_EPS_PreventUnintendedAssistLossOfControl
      objective_status: Candidate
      assumption: ASM_EPS_HighwayOperatingProfile
      assumption_status: Planned
    - scenario: SCN_EPS_UnintendedAssist_Workshop
      context: CTX_EPS_WorkshopStationary
      consequence: CONSEQ_EPS_UnexpectedWheelMovementDuringService
      concern: CONCERN_EPS_ServiceContinuity
      objective: OBJ_EPS_LimitUnexpectedWheelMovementDuringService
      objective_status: Candidate
      assumption: ASM_EPS_WorkshopStationaryNoPersonInEnvelope
      assumption_statement: >-
        车辆静止且无人位于方向盘或转向执行链的运动包络内。
      assumption_status: Planned
  iso_hara_adapter:
    adapter_scope: EPS_safety_concern_only
    mapping_requirement: >-
      ch14 必须显式说明 ISO event/SafetyGoal 与通用 scenario/objective 的关联并证明不等价；
      ch04 不预先规定属性名、方向或 RDF 表达。
    highway_event:
      hazardous_event: ISO_HE_EPS_UnintendedAssist_Highway
      related_core_scenario_id: SCN_EPS_UnintendedAssist_Highway
      severity: S3
      exposure: E4
      controllability: C3
      table_4_output: ASIL_D
      classification_status: Draft
      safety_goal: ISO_SG_EPS_NoUnintendedAssist
      safety_goal_statement: >-
        防止或限制 EPS 非预期助力导致车辆方向控制丧失。
      safety_goal_status: Draft
      safety_goal_asil: ASIL_D
      related_core_objective_id: OBJ_EPS_PreventUnintendedAssistLossOfControl
      ftti: Unknown
    workshop_event:
      hazardous_event: ISO_HE_EPS_UnintendedAssist_Workshop
      related_core_scenario_id: SCN_EPS_UnintendedAssist_Workshop
      severity: S0
      exposure: not_entered
      controllability: not_entered
      table_4_output: not_entered
      asil_assignment: none_required
      classification_status: Draft
      boundary_assumption_id: ASM_EPS_WorkshopStationaryNoPersonInEnvelope
  internal_safety_mechanism_credit: prohibited_in_initial_hara
  external_measure_credit: >-
    仅可在独立性、适用配置和证据均被明确论证时作为特定前提考虑
  downstream_fsc_boundary:
    target_chapter: ch05
    passes:
      - safety_goal_and_asil
      - hazardous_event_and_consequence_branch
      - assumptions_and_unknowns
      - acceptance_intent
    does_not_decide:
      - architecture
      - derivation
      - allocation
      - interfaces
      - implementation_selection
      - verification_or_validation_result

env01_projection:
  case_role: TeachingExample
  example_status: Synthetic
  analysis_subject: SUBJECT_ENV01
  deviation: DEV_ENV01_HumidityMeasurementDrift
  concern: CONCERN_ENV01_MeasurementStability
  scenarios:
    - scenario: SCN_ENV01_Drift_Warehouse
      context: CTX_ENV01_WarehouseMonitoring
      consequence: CONSEQ_ENV01_MisleadingOperationalTrend
      objective: OBJ_ENV01_BoundOrDetectDriftBeforeOperationalUse
      objective_statement: >-
        在数据进入运行判断前界定或检出漂移。
      objective_status: Candidate
      assumption: ASM_ENV01_DeclaredOperatingEnvelope
      assumption_status: Planned
    - scenario: SCN_ENV01_Drift_Calibration
      context: CTX_ENV01_CalibrationBench
      consequence: CONSEQ_ENV01_InvalidCalibrationExercise
      objective: OBJ_ENV01_RejectInvalidCalibrationExercise
      objective_statement: >-
        识别并拒绝无效的当次校准练习。
      objective_status: Candidate
      assumption: ASM_ENV01_ReferenceInstrumentAvailable
      assumption_status: Planned
  real_product_data:
    specification: Unknown
    calibration_records: Unknown
    drift_time_series: Unknown
    measurement_uncertainty: Unknown
    environmental_chamber_data: Unknown
    field_evidence: Unknown
  forbidden_iso_semantics:
    - HazardousEvent
    - Severity
    - Exposure
    - Controllability
    - Table4Classification
    - ASIL
    - SafetyGoal
  prohibited_inferences:
    - measurement_stability_implies_reliability
    - measurement_stability_implies_availability
    - synthetic_case_describes_real_SHT40_performance

non_transferable_iso_rules:
  - HARA_item_and_malfunctioning_behaviour_model
  - HazardousEvent_identity
  - S_E_C_evidence_model
  - Table4_mapping
  - ASIL
  - SafetyGoal
  - driver_and_other_persons_controllability_model

mirror_cq_drafts:
  - id: PTW-PC-04-CQ-01
    question: >-
      同一 deviation 在两个 context 中形成哪些不同 scenario 与 consequence？
      只替换情境身份后，哪些判断必须重开？
    required_answer_form:
      - scenario
      - context
      - consequence
      - reopened_judgments
  - id: PTW-PC-04-CQ-02
    question: >-
      每个 objective 精确回应哪个 scenario 与 concern？通用 scenario/objective
      如何与 ISO HazardousEvent/SafetyGoal 显式映射而不等价？
    required_answer_form:
      - scenario
      - concern
      - objective
      - adapter_resource
      - explicit_non_equivalence_evidence
  - id: PTW-PC-04-CQ-03
    question: >-
      EPS 投影能否返回精确 S/E/C/ASIL/SG，ENV-01 能否返回非 safety objective
      且无 ISO 分级泄漏；ASM_ENV01_DeclaredOperatingEnvelope 从 Planned 改为
      Rejected 时，哪些 scenario/objective 必须重开？
    required_answer_form:
      - eps_hara_projection
      - env01_non_safety_objectives
      - exact_empty_iso_leak_set
      - rejected_assumption_impact_set

answer_acceptance:
  - 能查出同一 deviation 在两个 context 中形成的两个 scenario 及各自 consequence
  - 能查出每个 objective 精确 addresses 的 scenario 与 concern
  - 能显式区分通用 scenario/objective 与 ISO HARA event/SafetyGoal 投影
  - 能对 EPS HARA 投影返回精确 S/E/C/ASIL/SafetyGoal 结果
  - 能对 ENV-01 返回非 safety objective，同时精确证明其没有 ISO 分级语义
  - ASM_ENV01_DeclaredOperatingEnvelope 被拒绝时，能定位需重开的 scenario/objective，不自动改成新事实

not_answered_by_ch04:
  - 唯一的类层次、IRI 或 OWL 公理写法
  - 现实 EPS 的 S/E/C/ASIL 或 Safety Goal 充分性
  - ENV-01 的真实漂移、准确度、稳定性或可靠性
  - 任何方案分配、实现、验证、评审或授权决定

figure_contract:
  id: ch04-fig01-context-changes-consequence
  chapter_contract_ref: PTW-PC-04
  status: planned
  figure_type: counterfactual
  taxonomy: scientific-educational
  cq_refs: [PTW-PC-04-CQ-01]
  visual_question: >-
    两幅画里哪些对象与偏差没变，只因哪个 context 改变，后果链就不再相同？
  semantic_baseline:
    invariant:
      - 同一辆车
      - 同一 EPS 分析对象
      - 同一非预期助力偏差
    changed:
      - 被选择的受控情境身份
    left_context: 高速道路行驶并存在道路运动后果链
    right_context: 车辆静止在维修工位且无人位于转向运动包络内
    must_not_claim:
      - 具体 S/E/C 或 ASIL
      - 事故必然发生
      - 任何安全措施有效
  pre_observation_ref: 4.2 图前观察任务
  post_consumption_ref: 4.2 ContextSplit-04 与图后结论
  caption: >-
    这幅对照图只能说明“同一对象的同一偏差进入不同 context 后，scenario 与
    consequence 必须重开”；它不能证明现实事故必然发生，不能证明所示因果链已有
    项目证据支持，也不能说明具体 S/E/C、ASIL 或任何措施有效。
  alt_text: >-
    左右为同一辆车和同一 EPS 非预期助力偏差。左侧高速道路上出现车辆偏移和道路
    使用者后果链；右侧静止维修情境中只有方向盘意外运动，没有该道路后果链。
  proposed_asset: handbook/figures-imagegen/ch04-fig01-context-changes-consequence-v01.png
  imagegen_status: not_run
  placement_status: not_done
  qc:
    semantic: pending
    visual: pending
    print: pending
    rights: pending
    reader: pending

