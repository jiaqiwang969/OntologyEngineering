[[concepts]]
id = "DC-G8-010"
name = "序号指引线末端箭头"
aliases = []
group = "G8"
kind = "line"
meaning = "所指零件很薄（如垫片）或是涂黑的剖面，无法在其轮廓内画圆点时，序号指引线的起点改画实心箭头，箭头指向该零件的轮廓。"
components = ["指引线起点为实心箭头，箭尖落在薄件或涂黑断面的轮廓线上，而不是在其内部。", "其余部分与普通序号指引线相同：细实线、最多折一次，终端为基准线、圆或序号。", "所指对象通常是出图宽度不到约1~2 mm的窄带或涂黑区域。"]
variants = ["arrowhead end"]
dxf_forms = ["LEADER/MLEADER with closed filled arrowhead (_ClosedFilled or default) on layer 09", "exploded: LINE + SOLID (triangle) or LWPOLYLINE segment with tapering width as the arrowhead"]
recognition = "以指引线一端的实心箭头为锚点：箭尖接触一个窄长的涂黑区域（HATCH SOLID，出图宽度约1.5 mm以下）或两条非常接近的平行轮廓线；另一端是单个整数序号，字高与同图其他序号一致。关键判据是它与同图圆点式序号属于同一编号体系（数字连续、字高相同、与明细栏对应）。若箭头指向普通轮廓而末端是文字说明，则是注释引线。"
confusions = ["注释指引线：末端为文字或标记，不是序号。", "焊缝指引线：接焊缝基准线和焊缝符号。", "几何公差指引线：箭头指向轮廓，另一端连公差框格。", "带箭头的尺寸线：中间或旁边有尺寸数字，常两端都有箭头。"]
related = ["DC-G8-009", "DC-G8-024", "DC-G1-096", "DC-G2-057"]
