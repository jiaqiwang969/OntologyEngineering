[[concepts]]
id = "DC-G3-125"
name = "相贯线、过渡线的简化画法（含模糊画法）"
aliases = ["相贯线简化与模糊画法"]
group = "G3"
kind = "simplified_representation"
meaning = "不致引起误解时，图形中的相贯线、过渡线可以简化，例如用圆弧或直线代替非圆曲线，也可采用不画准确交线的模糊画法表示相贯形体；简化会影响理解时不得使用。"
components = ["圆弧代替：两圆柱正交时，非圆视图中的相贯线画成一段过两轮廓交点、凸向大圆柱轴线的圆弧。", "直线代替：小孔、键槽或锥体与圆柱相贯时，相贯线可画成直线或V形折线，端点落在轮廓交点上。", "模糊画法：相贯处只示意形体的交接，不作出准确的相贯线，轮廓在交接处可不封闭。", "过渡线（铸锻件圆角处的理论交线）用细实线画，两端不与轮廓线相连。"]
variants = ["arc substitute", "straight-line substitute", "模糊画法", "圆弧/直线代替非圆曲线"]
dxf_forms = ["Arc substitute: a single ARC on layer 01 (or 04 when hidden) whose end points lie on two outline LINEs", "Straight substitute: one LINE or a V of two LINEs on layer 01 between outline intersection points", "Transition line: thin LINE/ARC on layer 02 with a small gap to the outlines at both ends", "Exact intersection curves from 3D model projection appear instead as SPLINE or LWPOLYLINE with many short segments"]
recognition = "以两组相交回转体轮廓线（两组平行粗实线互相垂直或斜交）的交点为锚点：若交点之间连接的是单个ARC（半径约等于较大圆柱的半径，凸向大圆柱轴线）或1～2条直线，而不是SPLINE或密集折线，则判为简化相贯线；端视图中小圆柱的圆与大圆柱轮廓相切或相交可用来确认两圆柱直径关系。过渡线为细线且两端与粗实线轮廓留有明显间隙（大于约1倍粗线宽）。模糊画法表现为交接处轮廓只画出一部分。三维投影出图通常带有精确SPLINE交线，按真实相贯线处理。"
confusions = ["真实相贯线：由投影精确求得，DXF中多为SPLINE或折线，形状不是单一圆弧。", "过渡线：细实线且端点不与轮廓相接；简化相贯线为粗实线并连到轮廓交点。", "截交线：平面与立体的交线，通常为直线、椭圆或圆，不是两回转体的交线。", "圆角轮廓圆弧：与两条直线相切，而简化相贯线圆弧连接在两轮廓的交点上。"]
related = ["DC-G1-035", "DC-G1-054", "DC-G3-067"]
priority = "high"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 16675.1-2012 表1 5.8、GB/T 4458.1-2002 图11/图12 及教材 §7-4(14) 一致；过渡线不与轮廓线相连出自 4458.1。圆弧半径取大圆柱半径、三维投影交线为 SPLINE 等为一般制图与 CAD 实践。"
