recognition = "以总注语为锚点：匹配“(全部|未注|其余)(铸造)?圆角R数值”（可带范围R3～R5）或“n×R数值”指向尖角的标注。确认后，对该图中铸件非加工面处的尖角交点（两轮廓线端点重合且无ARC）不判为缺陷，并给这些角赋予注语中的半径。区分画出的铸造圆角：那是真实ARC；区分未注倒角说明：文字以C开头；区分真正的尖角：加工面相交处通常为尖角或倒角，不受铸造圆角注语约束。"
