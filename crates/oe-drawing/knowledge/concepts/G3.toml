expert_checked = false
notes = "笔画依据GB/T 4460-2013与GB/T 4460-1984页面图像核对，OCR只识别出条号和名称。装配图上偶见表示转向或移动方向的箭头，因此定为low；其余运动特征符号定为rare。DXF存储形式、图层号与相对尺寸为一般CAD/制图实践的估计，并非标准规定。"
