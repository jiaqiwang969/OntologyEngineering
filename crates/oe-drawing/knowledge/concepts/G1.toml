[[concepts]]
id = "DC-G1-017"
name = "图线组合"
aliases = []
group = "G1"
kind = "line"
meaning = "把两条或多条基本线型平行、重叠或相邻地组合，或在实线上、实线间规则地布置图形要素，构成具有专门含义的组合图线，如“铁道”线。"
components = ["平行排列：两条以上图线相互平行。", "重叠排列：不同宽度的两条图线重叠，如实线与点线、实线与间隔画线。", "相邻排列：两条相邻间隔画线的外侧各邻接一条实线。", "在两条平行实线之间规则分布涂黑的圆或梯形；在实线上（连续或间断）规则分布几何图形。", "“铁道”线由实线（01）与间隔画线（03）组合，CAD 中按公式计算线段数。"]
variants = ["平行排列", "不同宽度重叠", "相邻排列", "实线间规则分布的图形要素", "实线上规则分布的几何要素", "“铁道”线"]
dxf_forms = ["complex LTYPE with embedded shapes or text elements", "two overlapping entities with different lineweights at the same coordinates", "MLINE entity for parallel lines", "exploded: repeated small SOLID/HATCH/CIRCLE glyphs at constant pitch along a path"]
recognition = "锚点：同一路径上有两个以上实体（坐标重合或等距平行），或沿一条线等间距重复的同尺寸小图形（涂黑圆、三角形、梯形）。判据：重复间距恒定、图形尺寸相同。机械零件图很少见，多出现在示意图、管线图、土建图中。注意 CAD 中常见的误重复绘制（完全重叠的同型实体）不是组合图线。"
confusions = ["双点画线：单一线型，不是组合。", "焊缝、管线示意线：属专业符号，按相应标准解读。", "重复绘制的重叠线：绘图错误，应去重。"]
related = ["DC-G1-019", "DC-G1-016"]
priority = "rare"
