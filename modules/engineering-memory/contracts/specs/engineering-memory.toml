[[requirements]]
id = "internal_method_task_organization"
function = "将宿主探索实测后的方法作为有范围内部记录，在每次任务中显式选择并组织外部Agent、程序和宿主的有限命题工作"
condition = "明确方法修订、实际输入工件、任务条件和无环命题依赖；宿主持有组织及验收职责"
acceptance = "方法不安装到全局skills；实际字节和逐命题包可复核，修订只替代同一命题当前头并使受影响下游失效；关闭重核必要命题和当前头。开发重放不冒称新模型执行，没有自动网络派发器；仅显式work-run可使用既有provider执行已准备的单项工作，执行与语义验收分开。"

[[modules]]
id = "memory_task_organization"
kind = "pipeline"
rust_path = "modules/engineering-memory/runtime"
purpose = "保留内部方法与每次任务的范围，在既有私有存储和事件机制上组织明确命题"
realizes = ["internal_method_task_organization"]
platform = "生成合同与Rust规则；主模型组织及审查，外部Agent和程序结果按实际证据登记"
effects = "登记不可变方法修订、组织计划、命题包、结果修订、关闭记录和事件"
failures = "原件或方法漂移、依赖环、越界角色或输入、旧包、错误替代及过期关闭拒绝；失败和unknown保留"
status = "source_only"
depends_on = []

[[constraints]]
id = "organization_scope_revision_and_acceptance"
requirement = "internal_method_task_organization"
module = "memory_task_organization"
check = "execution"
rust_path = "modules/engineering-memory/runtime/src/organization.rs"
statement = "内部方法仅为有范围数据；宿主委派和审查不变。工件摘要、任务内引用、冻结依赖、不可变修订与关闭头集合由Rust核验；实际模型能力、证据语义和工程采用不由文件状态推定。"
severity = "error"

[[validations]]
id = "organization_scope_revision_counterexamples"
constraint = "organization_scope_revision_and_acceptance"
module = "memory_task_organization"
behavior = "organization_rejects_scope_and_revision_drift"
rust_path = "modules/engineering-memory/runtime/src/organization.rs"
oracle = "冻结方法和输入后改变原件应拒绝；任务内重复id、未知依赖及环应拒绝；修订只替代本命题当前头，下游旧包失效；unknown、failed、contradicted不能完成必要命题；旧头摘要不能关闭；开发重放保持原模式。"
scope = "任务组织及不可变证据合同的软件行为检查；不是外部Agent准确率、独立盲测或自主规划验收"

