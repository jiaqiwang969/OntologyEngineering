[[concepts]]
id = "DC-G4-003"
name = "轴上键槽画法与尺寸注法"
aliases = []
group = "G4"
kind = "conventional_representation"
meaning = "轴上铣出的平键键槽：用主视图中的局部剖视、键槽处的移出断面以及键槽轮廓的局部视图表达；注键槽长度 L、宽度 b、沿轴向的定位尺寸和以 d−t1 表示的槽深。"
components = ["主视图局部剖视：波浪线围出槽处局部剖，显示与轴线平行的槽底线和槽两端", "移出断面：键槽处的实心圆断面，顶部有深 t1、宽 b 的矩形缺口，其余面积画剖面线", "局部视图：按俯视方向画出槽的长圆形轮廓（A型两端为半圆），书中示例按第三角画法配置", "尺寸：b（常带 N9 等公差带代号）、d−t1（槽底到轴的对侧母线，带负偏差）、L、槽的轴向定位尺寸"]
variants = []
dxf_forms = ["removed section: CIRCLE/ARC + LINE notch on layer 01, HATCH ANSI31 on layer 10 over the solid area", "slot outline in the local view: two parallel LINEs + two end ARCs (radius b/2), sometimes one closed obround LWPOLYLINE", "wavy line of the local section as SPLINE or LWPOLYLINE on layer 02", "DIMENSION dimtype 0 for d−t1 with text like '11{\\H0.7x;\\S0^-0.1;}', extension lines from the slot bottom and the opposite quadrant of the shaft circle", "DIMENSION for width with text such as '5N9' or stacked deviations"]
recognition = "锚点为移出断面中的圆（半径 r）带一个向内的矩形缺口：两侧边平行（间距 b，约0.25d~0.3d），缺口底边到对侧圆周的距离为 d−t1（约0.8d~0.9d），剖面线覆盖除缺口外的圆面。主视图或局部视图中找长圆形轮廓（两平行线+两端半圆，半径=b/2）或波浪线局部剖内一条平行于轴线的槽底线。尺寸：数值小于该段轴径、两界线分别接缺口底边和对侧象限点的线性尺寸→d−t1；宽度尺寸=b；长度尺寸=L 与长圆总长一致。与轮毂槽区分：缺口在实心圆内且尺寸小于直径；与平面符号区分：平面符号是矩形内的细实线对角交叉，不是缺口。"
confusions = ["轮毂键槽：在孔圆外侧凸出，标 d+t2，大于孔径", "平面符号（细实线对角线）：表示平面，没有槽宽槽深尺寸", "铣扁、削平：断面上是一条弦而不是矩形缺口", "半圆键槽：侧视槽底为圆弧，按半圆键标注"]
related = ["DC-G4-002", "DC-G4-036", "DC-G4-127", "DC-G2-028", "DC-G2-023", "DC-G3-026", "DC-G3-222"]
priority = "medium"
text_forms = ["5N9", "11 0/-0.1（d−t1）", "10（键槽长）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K35", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Tolerance class N9 and negative deviation on d−t1 are general keyway practice; the textbook example gives d−t1=14−3=11, b=5, L=10."
