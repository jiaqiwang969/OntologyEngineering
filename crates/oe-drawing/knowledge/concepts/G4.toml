[[concepts]]
id = "DC-G4-138"
name = "相配合圆锥的公差注法"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "相配合圆锥的公差注法：两个相配圆锥标注相同的锥度或锥角，标注公差的圆锥直径取同一公称位置；确定直径或轴向位置的理论正确尺寸都以各自装配件的基准平面为起点，并给出轴向位置公差（如 Lx±0.2）。"
components = ["相同锥度：内、外圆锥都注同一锥度（如 1:5）或锥角", "基准平面：两件各自的装配基准端面，作为TED的起点", "按直径（图16）：在距基准面方框距离处给出给定截面直径Ødx（方框）", "按位置（图17）：以方框直径确定截面，再注轴向位置 Lx±0.2", "表面控制：配合面一般再用面轮廓度等几何公差控制"]
variants = ["by diameter (图16)", "by position (图17)"]
dxf_forms = ["taper symbol block/TEXT '1:5' on a leader for each cone", "TED values as DIMENSIONs with DIMGAP<0 (boxed) or exploded rectangle + TEXT", "linear DIMENSION 'Lx%%p0.2' from the datum face", "geometric tolerance frames (TOLERANCE or exploded)"]
recognition = "在装配图（或成对零件图）中：两个相互套合的圆锥（一内一外）各有相同的锥度标注；两者都有从各自端面量起的方框尺寸，并有一个带±的轴向位置尺寸。判定时先找锥度文字相同的两个圆锥，再核对TED起点是否在各自基准端面上。与单个圆锥公差区分：只涉及一个零件且无配合位置尺寸。"
confusions = ["单个圆锥的公差注法", "锥度符号与莫氏锥度号标注", "普通轴孔配合代号"]
related = ["DC-G4-123", "DC-G4-011", "DC-G4-057", "DC-G4-029", "DC-G4-122"]
priority = "rare"
