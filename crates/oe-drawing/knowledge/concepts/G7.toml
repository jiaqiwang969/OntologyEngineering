components = ["箭头：细实线，指向被夹紧面；手动夹紧尾端为小圆点。", "动力源方框：位于箭头尾部，内写大写汉语拼音字母Y、Q或D。", "视图正面画法：箭头先水平后折向下（折线箭头）。", "联合夹紧：两个或多个箭头由一条横向连线相连，连线可画成折线。"]
