# Drafting concept catalogue, group G2: 视图、剖视与断面.
# One card per representation concept; paraphrased from the cited sources (page = physical page of the library copy).
schema = "oev2.drawing-concept-catalogue/1"
group = "G2"
label = "视图、剖视与断面"

[[concepts]]
id = "DC-G2-001"
name = "剖面区域内注写处剖面线断开"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "剖面区域内需要注写尺寸数字、字母等时，剖面线（或点阵、涂色）在注写处断开留白，使文字清晰可读；留白不代表结构变化。"
components = ["剖面区域：由粗实线轮廓围成并填充剖面线、点阵或涂色的区域。", "注写内容：位于剖面区域内的尺寸数字、字母或符号。", "留白区：围绕文字外框的矩形（或近似矩形）空白，剖面线在其边缘中断，留白略大于文字外框，边缘不画线。"]
variants = []
dxf_forms = ["HATCH whose boundary set treats the TEXT/MTEXT/DIMENSION text as an island (outer/normal island detection), so pattern lines stop around the text box", "Exploded hatch: LINE segments on the hatch layer (GB/T 14665 layer 10) ending on an invisible rectangle around the text", "TEXT/MTEXT (layer 11) or DIMENSION text (layer 08) placed inside the hatch boundary; MTEXT background mask (group 90 fill flag) or WIPEOUT used instead of a real gap"]
recognition = "以位于剖面区域内的文字（TEXT/MTEXT 或尺寸文字）为锚点；检查同一剖面区域的剖面线在文字外框外扩约0.3～1倍字高处成组中断，中断边界上没有任何可见图线，缺口两侧剖面线方向、间距和相位不变。缺口若由粗实线围成则是孔或空腔；没有文字而剖面线缺失，应按剖面符号省略或漏画另行判断。"
confusions = ["剖面线缺失（漏画或省略剖面符号）：缺口处没有文字。", "内部孔、槽的边界：缺口由粗实线围成，形状与文字框无关。", "尺寸数字处其他图线断开：断开的是轮廓线或中心线，不是剖面线。"]
related = ["DC-G2-019", "DC-G2-055", "DC-G2-061", "DC-G2-035", "DC-G4-001", "DC-G1-010"]
priority = "medium"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = ["annotation_mask"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "17453-1998 §4.6 规定注写处剖面线必须断开；17453-2005 只说剖面内可标注尺寸（图5）。孤岛检测、WIPEOUT、背景遮罩属一般 CAD 实践，非标准内容。"
[[concepts.sources]]
document = "GB/T 17453-1998"
clause = "4.6 图6"
page = 5
[[concepts.sources]]
document = "GB/T 17453-2005"
clause = "图5"
page = 8

[[concepts]]
id = "DC-G2-002"
name = "加粗轮廓线表示剖面区域"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "用加粗的实线勾出剖面区域的边界来突出被剖切部分，区域内可不画剖面线；这是剖面线的一种替代表示。"
components = ["剖面区域边界：线宽明显大于图中普通粗实线的闭合实线轮廓。", "区域内部：不画剖面线或点阵，可为空白。", "其余轮廓：按正常线宽绘制，与加粗边界有明显的线宽级差。"]
variants = []
dxf_forms = ["Closed LWPOLYLINE with constant (global) width, or LINE/ARC with a lineweight one step above the normal thick line (e.g. 1.0 mm vs 0.5/0.7 mm)", "Entities on layer 01 or a user layer with heavier LWEIGHT; no HATCH inside the loop"]
recognition = "以闭合环的线宽为锚点：同一视图中某闭合环的线宽（多段线全局宽度或实体线宽）约为其他可见轮廓的1.5～2倍，环内无剖面线；再用同图的剖切符号或“X—X”名称确认其为剖视或断面。内部实心填充者属狭小剖面涂黑；线宽与其余轮廓一致且无剖切标注者为外形视图。"
confusions = ["未剖切外形视图的粗实线：线宽与其余轮廓相同，没有剖切标注。", "狭小剖面涂黑：区域内部是实心填充。", "焊缝加粗线：沿焊缝成段加粗，不围成剖面区域。"]
related = ["DC-G2-057", "DC-G2-019", "DC-G2-018", "DC-G1-038", "DC-G7-132"]
priority = "rare"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "17453-1998 §6、2005 §7 均允许；线宽比例为一般实践。"
[[concepts.sources]]
document = "GB/T 17453-1998"
clause = "6 图8"
page = 6
[[concepts.sources]]
document = "GB/T 17453-2005"
clause = "7 图7"
page = 9

[[concepts]]
id = "DC-G2-003"
name = "同一零件相邻剖切图的剖面线错开"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "同一零件在两个平行剖切面上的剖切图紧靠画在一起时，剖面线方向和间距相同，但可沿分界线把两侧剖面线互相错开，以显出两剖切面的分界。"
components = ["两块相邻剖面区域：属于同一零件，以一条分界线（剖切面转折位置）相接。", "剖面线：两侧方向、间距相同。", "错开：分界线两侧剖面线的位置相互偏移（约半个间距），不连成同一条线。"]
variants = []
dxf_forms = ["Two HATCH entities with identical pattern, angle and scale but different pattern origin (base point), sharing a boundary edge", "Exploded hatch LINE families on layer 10, parallel and equally spaced, offset across a common edge"]
recognition = "以共享边界的两块剖面区域为锚点，比较两侧剖面线：角度相同、间距相同、但沿法向的相位偏移约0.3～0.7倍间距，即判为同一零件的错开剖面线；角度相反或间距不同判为相邻零件；相位连续则为同一区域。可再用阶梯剖的剖切符号确认。"
confusions = ["相邻零件剖面线：方向相反或间距不同。", "剖视中的剖视：两层剖面线也错开，但内层嵌在外层之中并用指引线标名称。", "同一剖面区域：无分界线，相位连续。"]
related = ["DC-G2-009", "DC-G2-017", "DC-G2-015", "DC-G1-010"]
priority = "rare"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "17453-1998 §4.4 与 2005 图3 规则相同。"
