[[concepts]]
id = "DC-G7-004"
name = "标识和标记的位置（细双点画线框）"
aliases = []
group = "G7"
kind = "conventional_representation"
meaning = "在模制件（铸件、注塑件等）图样上，用细双点画线框出一个区域，指定型腔号、识别码、回收标志、制造识别标志等标识与标记的放置位置；该位置不应在被加工表面上。"
components = ["细双点画线框：通常为小矩形，线型05.1，画在零件表面视图上的指定位置。", "说明：用指引线注明这是标识位置或写出标记内容。", "定位尺寸（可选）：确定框的位置。"]
variants = []
dxf_forms = ["closed LWPOLYLINE rectangle with PHANTOM/DIVIDE/ACAD_ISO05W100 linetype on layer 07 (细双点画线), thin lineweight", "LEADER/MLEADER or LINE leader with TEXT/MTEXT note"]
recognition = "锚点为零件轮廓内部表面上孤立的小型闭合细双点画线矩形（边长为几个字高，不与其他轮廓相接），附近有指引线和文字说明；图上常同时出现分模面符号、起模斜度等模制件标注作为上下文。与假想轮廓区分：假想轮廓表示相邻零件外形或运动位置，形状复杂并多在主轮廓外或与之相接。"
confusions = ["相邻辅助零件或运动极限位置的细双点画线轮廓：形状为零件外形，不是小矩形区。", "延伸公差带的细双点画线：沿轴线延伸，并有Ⓟ和长度。", "文字注写框：细实线框。"]
related = ["DC-G7-020", "DC-G7-046", "DC-G7-082", "DC-G1-042", "DC-G1-036"]
