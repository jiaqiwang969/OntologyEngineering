meaning = "用粗实线表示物体在投射方向上可见的外形轮廓，包括圆柱、圆锥、球等曲面的转向轮廓线，是图样中最主要的图线。"
components = ["粗实线（No.01.2.2）。", "构成视图外形和可见的内部结构边界；曲面在非圆视图中的转向轮廓为直线素线，在端视图中为圆。", "剖视图中剖面区域的边界同样为粗实线。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight (group 370) 50 or 70 (0.5/0.7 mm) or ByLayer on a thick layer: GB/T 14665 layer 01, names such as 粗实线/轮廓线/OUTLINE, CAXA 0层; colour white/black (ACI 7)", "CIRCLE/ARC for round outlines, closed LWPOLYLINE for whole outlines", "thick strokes drawn as LWPOLYLINE with constant width (group 43 ≈ 0.5–0.7) when lineweights are not used", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "粗线集合中构成闭合或近闭合外形的部分即为可见轮廓。线宽缺失时依图层（01/粗实线/轮廓线）和颜色（白，ACI 7）判断，并以“视图中最外层的闭合环”“HATCH 的边界”作佐证。与移出断面轮廓（同为粗实线）靠位置区分（在剖切线延长线上或另有标题）；与重合断面轮廓（细实线、叠在视图上）靠线宽区分；与图框（纸边内的大矩形）靠尺寸和位置区分。"
confusions = ["可见棱边线：同型，语义为面—面交线。", "重合断面的轮廓线：细实线，叠画在视图内。", "图框：粗实线大矩形，与纸边相距 e 或 a/c。", "剖切符号：视图外的孤立粗短画。"]
