recognition = "锚点：形如“N×B+公差带代号+EQS”的文字（N为键数，B为键宽），附近端面视图中有N个均布的矩形齿/槽。同一零件上还有两个同轴直径，一个带H7/f7（小径）、一个带H10/a11（大径）。与孔组“n×Ø EQS”区分：本形式无Ø、指向矩形齿宽；与花键标记（N×d×D×B 带标准号）区分：标记为一整串规格，常在指引线上并含GB/T 1144。"
