[[concepts]]
id = "DC-G4-086"
name = "同一基准出发尺寸的简化注法（坐标式/叠加尺寸）"
aliases = []
group = "G4"
kind = "simplified_representation"
meaning = "从同一基准出发的多个尺寸沿一条共用尺寸线叠加标注：基准处画小圆并注0，每个被注点只画一个箭头并在其旁写出到基准的距离；绕中心分布的角度也可同样注出（0°、30°、60°…）。"
components = ["起点标记：基准处一个细实线小圆圈，旁注“0”（角度型为“0°”）", "共用尺寸线：自起点出发的一条直线（角度型为以分布圆中心为圆心的圆弧），连续或分段穿过各尺寸界线", "单箭头：每条尺寸界线处一个箭头，方向背离起点", "累计数值：写在各箭头附近、尺寸界线旁，为该点到起点的距离或角度，沿尺寸线单调递增", "简化前形式：基准式并联的多条尺寸线（见基准式尺寸）"]
variants = ["linear superimposed running dimensions", "angular running dimensions (e.g. 15°, 60°, 75°)"]
dxf_forms = ["exploded: one LINE (or ARC) + small CIRCLE at the origin + SOLID/arrow INSERT at each station + TEXT values", "ordinate DIMENSION entities (dimtype 6, +64 for X) in some CAD templates as an alternative running style", "TEXT '0' / '0%%d' beside a small CIRCLE whose radius is about 0.3–0.5 of text height", "layer 08 or the template dimension layer"]
recognition = "锚点：文字“0”或“0°”紧靠一个小CIRCLE（半径约0.3–0.5h），小圆位于一条细实线或圆弧的端点。沿该线依次找到同向的箭头，各箭头尖落在一条尺寸界线上，箭头旁有数值；数值应随到起点距离（按比例）单调增加且一致。角度型的尺寸线为圆弧，数值带°。与链式尺寸区分：链式每段两端都有终端、数值为相邻间距且无“0”起点；与基准式并联尺寸区分：后者为多条平行尺寸线。"
confusions = ["链式尺寸：每段为相邻间距，两端均有箭头", "基准式（并联）尺寸：多条平行尺寸线叠放", "等间隔链式简化 n×p(=L)：只有一个组合文字", "指引线终端圆点或零件序号圆点：圆点为实心且无“0”文字"]
