# One card per representation concept; paraphrased from the cited sources (page = physical page of the library copy).
schema = "oev2.drawing-concept-catalogue/1"
group = "G4"
label = "尺寸与尺寸公差"

[[concepts]]
id = "DC-G4-001"
name = "尺寸数字处图线断开"
aliases = []
group = "G4"
kind = "conventional_representation"
meaning = "尺寸数字（连同其前缀符号和公差）在图上不得被任何图线穿过；中心线、剖面线、轮廓线等若不可避免地经过数字，须在数字处断开留空，保证读数清楚。"
components = ["被断开的图线：细点画线中心线、剖面线、轮廓线或其他尺寸线，在数字外框两侧中断，断开后的两段仍共线、同线型", "尺寸数字（含 Ø、R、螺纹标记如 3×M6-6H 等）位于断口内，断口略大于文字外框", "剖面区域内：剖面线在文字矩形范围内留白，四周剖面线照常绘制"]
variants = ["broken centre lines", "hatching left blank around text"]
dxf_forms = ["centre line / contour split into two collinear LINE segments whose inner endpoints bracket the TEXT/MTEXT bounding box", "HATCH whose boundary contains an island path with boundary-path type flag 8 (textbox) around the text, so hatch lines stop at the text rectangle", "HATCH stored unbroken over the text when the CAD program computes the gap only at display time — no geometric gap in DXF (uncertain, depends on exporter)", "exploded hatch: many short LINE segments on layer 10 terminating at the text rectangle", "layers: 05 centre line, 01 contour, 10 hatch, 08 dimension text (GB/T 14665 or template names)"]
recognition = "锚点为尺寸文字（DIMENSION 内文字或独立 TEXT/MTEXT）。把文字外框外扩约0.3h~0.5h，检查同方向、同图层（05点画线、01粗实线、02细实线、10剖面线）的两段共线线段是否端点分别落在外框两侧，间隙≈文字宽度或高度；剖面线则看多条平行短线是否在文字矩形边界上统一截断。满足即判为“为数字断开”，应把两段合并回同一条图线，不能当作两个要素或轮廓缺口。与真实轮廓缺口区分：缺口内无文字、端点接其他轮廓；与断裂边界区分：断口有波浪线或双折线；与漏画区分：缺口位置与任何文字外框不重合。"
confusions = ["轮廓上的真实缺口或开口：缺口内没有文字，端点通常连接其他轮廓线", "断裂或折断边界：断口处画有波浪线或双折线", "漏画缺线（绘图错误）：缺口与任何文字外框都不对应", "剖面区域内注写文字时剖面线断开：同一规则的剖面线情形，见剖视概念"]
related = ["DC-G2-001", "DC-G4-017", "DC-G1-044", "DC-G1-010", "DC-G1-021"]
priority = "medium"
text_forms = ["3×M6-6H"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "HATCH textbox island flag and display-time gaps are general CAD practice, not from the sources. Merging the two collinear pieces is a recognition recommendation."
