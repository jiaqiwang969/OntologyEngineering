components = ["整体螺母：螺杆以一条波浪线（正弦状）表示，螺母为罩住波浪线一段的矩形，螺杆轴线从矩形两侧伸出；可用符号为波浪线上加一小段弧形螺母标记。", "开合螺母：矩形螺母罩住波浪线，上下各有一个向外的竖直箭头，表示螺母可分开；可用符号为波浪线上的分开弧段加双向竖箭头。", "滚珠螺母：仅有可用符号，两条波浪线之间夹一排小圆（滚珠）。", "1984 版 A.4 与 2013 版 12.4 图形一致。"]
variants = ["整体螺母", "开合螺母", "滚珠螺母"]
dxf_forms = ["Wave as a SPLINE or chained ARCs on layer 01, nut as LWPOLYLINE rectangle, shaft LINE extending on both sides", "Split-nut arrows as LINE plus SOLID arrowheads; balls as small CIRCLEs", "INSERT of a library block"]
recognition = "锚点：一段连续圆滑的波浪线（正弦状，3 个以上波峰）。若被矩形罩住且两侧有轴线伸出→整体螺母；矩形上下有对向外的竖箭头→开合螺母；两条波浪线夹一排小圆→滚珠螺母。与螺旋副区分：螺旋副的矩形较扁，并在矩形上接一根斜杆，接点有实心小三角；与弹簧符号区分：弹簧为尖角锯齿折线，两端有竖直端线或钩环。"
confusions = ["螺旋副符号：扁矩形内波浪线，并接有带实心三角的斜杆。", "弹簧符号：尖角锯齿折线，非圆滑波浪。", "波浪线断裂边界：单条不规则曲线，不配螺母矩形。"]
