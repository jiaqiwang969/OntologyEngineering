[[concepts]]
id = "DC-G5-095"
name = "多层公差标注"
aliases = ["多项几何公差框格上下叠放"]
group = "G5"
kind = "tolerance_indication"
meaning = "同一要素有几项几何公差要求时，把几个框格上下紧贴叠放，共用一条指引线；推荐公差值自上而下递减。"
components = ["两个或多个框格上下叠放，左端对齐，相邻框格共用水平边", "参照线连在整叠框格左侧或右侧的中点（而非某一个框格的中线延长）", "每个框格各有自己的特征符号、公差值和基准"]
variants = ["两框格叠放", "叠放框格共用一条指引线"]
dxf_forms = ["two TOLERANCE rows in one entity (second row after ^J) or two TOLERANCE entities stacked", "exploded: stacked rectangles sharing horizontal LINEs + separate glyphs and TEXT per row", "INSERT of a two-row frame block"]
recognition = "以两个以上已识别框格为锚：它们左端对齐（偏差≤0.2h）、上下边重合或间隙≤0.2h，只有一条指引线从叠放组侧边引出；把同一被测要素赋给每个框格。若只有第二格分成两行而特征符号格只有一个，则是整体加局部的组合注法（DC-G5-086）。"
confusions = ["第二格分两行的组合注法：特征符号格只有一个", "互相独立的两个框格：各有自己的指引线", "多行表格或参数表：第一格无特征符号"]
related = ["DC-G5-090", "DC-G5-086", "DC-G5-112", "DC-G5-056", "DC-G5-055"]
priority = "medium"
text_forms = ["↗ 0.03 A-B（上）", "⌭ 0.01（下）"]
knowledge_units = ["K23", "K24", "K25"]
