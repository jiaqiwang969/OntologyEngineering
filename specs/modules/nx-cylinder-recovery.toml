[[constraints]]
id="nx_cylinder_worker_role_guard_recovery"
requirement="req_engineering"
module="nx_protocol"
check="assess"
rust_path="crates/oe-nx-protocol/src/writer_release.rs"
statement="Explicit review/v5 alone accepts CylinderWorkerRoleIdentityGuardBeforeNativeLoad: original oe-nx-rotating-part vs required oe-nx-native-acceptance, MSVC worker/oe-nx-worker.exe, create_cylinder_solid and rotating-params/1. Preserve original failed PE/source, exact stderr/stdout/termination/post-exit launch, complete pinned empty-out snapshot and fresh actual OS process identities. All match branches/receipt inventories enforce the same scope. Never change original UNKNOWN state, re-run that job or grant native/engineering qualification; v1-4 retain old behavior and cannot recognize this failure, v5 cannot reinterpret their failures."
severity="error"
[[validations]]
id="validate_nx_cylinder_worker_role_guard_recovery"
module="nx_protocol"
constraint="nx_cylinder_worker_role_guard_recovery"
behavior="cylinder_role_v5_exact_scope_preserves_unknown_and_rejects_cross_scope"
rust_path="crates/oe-nx-protocol/tests/cylinder_writer_release.rs"
oracle="Independent synthetic complete records: original-role/cause positive under v5; old schema/crossassembly/wrong role/action/target/path/params, coherent tampered launch/exit/raw, live/uncertain/imprecisePID, native/event/out/snapshot changes and original targets refuse. Source04 real failure is separate private original evidence, not a new producer observation."
scope="Finite local protocol tests; current Windows-controller fresh OS review and four new-job native executions independently required"
[[constraints]]
id="nx_current_declared_worker_role_preflight"
requirement="req_engineering"
module="cad"
check="verify_current_worker_role"
rust_path="crates/oe-cad/src/nx/mod.rs"
statement="New explicit verify-current-role reuses the native identity owner's fixed role/path and supported declared Windows targets offline, without Mac COMPILED_TARGET.None or pretending PE/runtime authenticity. Old worker verify keeps package completeness meaning for historical/fixture roles. New cylinder prepare and stage check this declared identity before transport; Windows execution still independently binds its compiled target."
severity="error"
[[validations]]
id="validate_nx_declared_worker_identity"
module="nx_worker"
constraint="nx_current_declared_worker_role_preflight"
behavior="offline_role_path_target_and_native_target_semantics_remain_separate"
rust_path="crates/oe-nx-worker/tests/declared_identity.rs"
oracle="Same-role/path GNU/MSVC declarations match offline on Mac; foreign role/path/unsupported target refused; native compiled target check keeps its original behavior. No executable or SDK is run."
scope="macOS local declaration checks; Windows compiled worker identity remains independently verified"
[[validations]]
id="validate_nx_current_worker_role_cli_owner"
module="cad"
constraint="nx_current_declared_worker_role_preflight"
behavior="complete_wrong_role_package_is_only_complete_and_cylinder_prepare_stage_refuse_before_transport"
rust_path="crates/oe-cad/tests/nx_worker_role.rs"
oracle="Source-complete synthetic wrong-role package still passes old generic verify, fails explicit new role preflight and cylinder prepare/stage before transport/new output; corrected manifest role/path returns declaration-matched with native/engineering unevaluated. Full fixture file/SHA and old non-cylinder paths keep their original guards."
scope="Local package/CLI owner tests, not build/runtime/native or engineering qualification"
