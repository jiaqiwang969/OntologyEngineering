[[constraints]]
id="code_scope_association_same_owner"
requirement="req_engineering"
module="engineering"
check="associate"
rust_path="crates/oe-engineering/src/code_qualification.rs"
statement="The explicit association entry mechanically shares the original qualification executor and exact guard order. Missing context preserves not_connected; a full-scope context is required before dispatch. A fresh completed independently fixed witness is mandatory for an index. All original current source, tool, policy, selected context, protocol, retained report and raw-stream guards run before final association receipt publication; failed or later-rejected artifacts never become acceptance."
severity="error"

[[constraints]]
id="code_scope_association_candidate_root"
requirement="req_engineering"
module="engineering"
check="capture"
rust_path="crates/oe-engineering/src/code_qualification/association.rs"
statement="Original scope and mapping audit is applied to the actual candidate.source_root after the complete public manifest matches the source artifact. Candidate declarations resolve only in that manifest; missing files are recorded and no driver/owner/private fallback is used. Repeat actual capture after execution and before receipt. Relative request/context/witness references are owner-rooted; witness process references retain the original driver-root role. Known historical manifest domains remain exact: original seven-key manifest from pinned code_identity.rs SHA2563510950c87d452b07d44761efa5de1adb45ed16dd0398a920e4a18cf8da7ce0b and nine-key derived-model-resource/2 retain whole-sources exclusion. New captures use the explicit ten-key public_sources=[sources/README.md] domain, binding only that public source entry. Legacy allfiles16MiB and both derived canonical generated/model.ttl32MiB limits are actually enforced in shared scans and fingerprints; total256MiB/count10000 remain. Complete artifacts compare the full declared domain; digest-only binary refs may re-observe only these three fixed domains. Unknown/hybrid metadata, caller budgets and actual byte/mode/member drift reject; original digests are never rewritten. Other current native lifecycle protocols remain unchanged."
severity="error"

[[constraints]]
id="code_scope_association_total_unknown"
requirement="req_engineering"
module="engineering"
check="assemble"
rust_path="crates/oe-engineering/src/code_qualification/association.rs"
statement="All original 13494 IDs are retained exactly once with unknown behavioral status. Only the existing permitted finite matched-case observations are reused; approved abstract declarations, source matches, generated shape validity and passed JSON do not establish behavior or release eligibility. Canonical ordering and a readable 16MiB retained index bound apply; unsupported whole-code use/feedback/recovery remain unchanged."
severity="error"

