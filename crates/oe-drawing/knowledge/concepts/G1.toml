[[concepts]]
id = "DC-G1-062"
name = "齿顶圆（线）"
aliases = []
group = "G1"
kind = "line"
meaning = "用粗实线画出齿轮（齿条、链轮等）的齿顶圆（端视图）或齿顶线（非圆视图）。"
components = ["粗实线（No.01.2.6），端视图中为最大的齿轮圆，与分度圆（细点画线）、齿根圆（细实线）同心。", "非圆视图中为齿宽范围的外轮廓线；啮合区剖视中一个齿轮的齿顶线画粗实线，另一个被遮挡的齿顶线画细虚线或省略。", "轮齿齿形一般不画出。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight (group 370) 50 or 70 (0.5/0.7 mm) or ByLayer on a thick layer: GB/T 14665 layer 01, names such as 粗实线/轮廓线/OUTLINE, CAXA 0层; colour white/black (ACI 7)", "thick CIRCLE concentric with a CENTER-type CIRCLE", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：粗实线圆与同心点画线圆（半径略小，直径差约2m）；若再有更小的同心细实线圆即构成齿轮三圆。附近参数表含 m、z、α。外形上不画齿形，这是与真实外形轮廓区分的线索。"
confusions = ["分度圆：细点画线。", "齿根线：细实线。"]
related = ["DC-G1-006", "DC-G1-057", "DC-G3-022", "DC-G3-211"]
