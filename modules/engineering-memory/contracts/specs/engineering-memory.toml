fields = [
 {name="schema",meaning="超长行回执版本",rust_type="String",required=true,format="status",allowed_values=["engineering-memory.history-index-oversized-line/1"],unit="不适用",precision="版本1",write="跳过前一次写入",applicability="history-index/oversized",acceptance="同一位置内容不同即拒绝覆盖"},
 {name="source_path",meaning="原件路径",rust_type="String",required=true,format="text",unit="不适用",precision="规范化绝对路径",write="跳过时",applicability="回查",acceptance="与清单一致"},
 {name="byte_start",meaning="该行起点",rust_type="u64",required=true,format="integer",unit="byte",precision="记录边界",write="跳过时",applicability="回查",acceptance="等于跳过前游标"},
 {name="byte_end",meaning="该行末尾含换行",rust_type="u64",required=true,format="integer",unit="byte",precision="换行之后",write="跳过时",applicability="回查",acceptance="大于起点16 MiB以上"},
 {name="sha256",meaning="整行字节SHA256",rust_type="String",required=true,format="sha256",unit="不适用",precision="64位小写十六进制",write="流式计算",applicability="身份核对",acceptance="原件变化时随前缀重建"},
 {name="reason",meaning="跳过依据",rust_type="String",required=true,format="status",allowed_values=["invalid_json","not_visible_message"],unit="不适用",precision="明确枚举",write="跳过时",applicability="与读窗规则一致",acceptance="可能为消息的行不得写入本回执"},
 {name="record_type",meaning="顶层type字符串",rust_type="Option<String>",required=false,format="text",unit="不适用",precision="非字符串或缺失为null",write="跳过时",applicability="分类依据",acceptance="只作说明"},
 {name="body_type",meaning="Codex payload.type字符串",rust_type="Option<String>",required=false,format="text",unit="不适用",precision="非字符串或缺失为null",write="跳过时",applicability="分类依据",acceptance="只作说明"},
 {name="body_role",meaning="消息体role字符串",rust_type="Option<String>",required=false,format="text",unit="不适用",precision="非字符串或缺失为null",write="跳过时",applicability="分类依据",acceptance="只作说明"}
]

