[[concepts]]
id = "DC-G2-010"
name = "轴测管路示意图"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "用轴测投影画出的管路系统示意图：管道一律以粗实线单线表示，空间倾斜管段加画平行于轴测轴的细实线指明所在平面，交叉处被遮挡的管道断开，管件和阀门用轴测示意符号并列表说明。"
components = ["管线：粗实线单线，沿轴测轴方向或在某坐标面内倾斜。", "倾斜管段的平面示意：在水平面内倾斜的加若干平行Y轴的细实线，在铅垂面内倾斜的加平行Z轴的细实线。", "交叉处：被遮管线在交点两侧断开。", "管件、阀门：轴测示意符号，另列名称与符号对照表。", "版本：1984版为附录A（参考件）；2013版改按GB/T 6567.5绘制。"]
variants = ["1984 Annex A (reference)", "2013: per GB/T 6567.5"]
dxf_forms = ["Thick LWPOLYLINE/LINE runs on layer 01 along isometric directions (30°/90°/150°)", "Short thin LINEs (layer 02) parallel to the Y or Z axis between a sloped pipe and its projection, forming a small shaded triangle", "INSERT blocks for valves/fittings; legend as LINE grid + TEXT or TABLE"]
recognition = "以粗实线单线网络为锚点：线段方向集中于轴测轴方向，端点相接成树状；倾斜管段旁有一组平行细短线构成三角阴影；交叉点处一条粗线留出约2～3倍线宽的断口；附近有符号说明表。"
confusions = ["轴中心线：细点画线，不是粗实线。", "焊缝线或焊缝栅线：沿零件边缘，栅线垂直于焊缝。", "普通轴测图的棱线：围成面，不是单线网络。"]
