[[concepts]]
id = "DC-G3-133"
name = "迷宫式密封特征画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "用矩形线框内一个T形（凸起）粗线符号与一个U形（凹入）粗线符号相互嵌套组合，表示迷宫式等非接触密封。"
components = ["矩形粗实线框，大小按密封部位剖面，可画在轴的两侧，框内不画剖面线。", "U形粗线（凹入）从框的一条长边一侧形成开口槽，T形粗线（凸起）从对边伸入并插在U形开口内，两者不接触，表示迂回间隙。", "2009版表4（3.3.3.1）给出两种朝向的组合；1996版表4（4.1）同样以T、U组合表示。", "对应规定画法画出迷宫齿槽的真实剖面并画剖面线。"]
variants = []
