dxf_forms = ["TEXT/MTEXT with 'ⓂⓇ' or 'ⓁⓇ' (U+24C2/U+24C1 + U+24C7) after the value", "exploded: two adjacent CIRCLE each with TEXT letter (M or L, then R)", "TOLERANCE entity: gdt.shx has m/l but no R glyph, so Ⓡ is typed as Unicode or drawn as CIRCLE + 'R'"]
recognition = "第二格内两个相邻带圈字母，前一个为 M 或 L、后一个为 R → 可逆要求，给对应的实体要求加“可逆”限定。只有 Ⓡ 而前面没有 Ⓜ/Ⓛ 时不成立（多为误读）。半径符号 R 写在尺寸数值前、不带圈。"
