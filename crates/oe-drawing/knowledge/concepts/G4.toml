[[concepts]]
id = "DC-G4-154"
name = "轴颈和外壳孔的零件图公差标注"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "与滚动轴承配合的轴颈和外壳孔在零件图上的公差标注：配合直径注公差带代号（常同时注偏差，可加Ⓔ），并按轴承标准推荐给出圆柱度、轴肩端面跳动等几何公差和Ra值。"
components = ["配合直径：轴颈如 Ø50k6、外壳孔如 Ø80J7，可带括号偏差和Ⓔ", "圆柱度：对轴颈或孔表面的圆柱度框格", "端面跳动：轴肩或孔肩端面对基准轴线的圆跳动框格", "表面结构：轴颈、孔及端面的Ra值（如Ra0.8、Ra1.6、Ra3.2）", "基准：由两轴颈或孔轴线建立公共基准"]
variants = ["轴颈", "外壳孔"]
dxf_forms = ["diameter DIMENSION override '%%c80J7' or '%%c50k6(\\S+0.018^+0.002;)' plus circled E", "TOLERANCE entities or exploded frames for cylindricity and circular run-out with datum letters", "surface texture symbol INSERTs with Ra values"]
recognition = "锚点：一个带公差带代号的直径尺寸，同一表面上还有圆柱度框格，相邻轴肩端面有跳动框格，且代号为轴承配合常用值（轴：j5、j6、js6、k5、k6、m5、m6、n6等；孔：G7、H7、J6、J7、K7、M7、N7、P7）。与一般圆柱配合面区分：后者通常不同时出现圆柱度+端面跳动这一组合；最终可结合装配图中的轴承位置确认。"
confusions = ["一般圆柱配合面的公差标注", "装配图上与标准件配合仅注单侧代号", "键槽、螺纹等其他轴上结构公差"]
related = ["DC-G4-105", "DC-G4-114", "DC-G4-113", "DC-G5-056", "DC-G5-057", "DC-G4-115"]
priority = "medium"
text_forms = ["Ø80J7", "Ø50k6Ⓔ", "Ø70m6(+0.030/+0.011)", "Ra 0.8"]
