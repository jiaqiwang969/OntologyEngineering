[[concepts]]
id = "DC-G7-144"
name = "角焊缝符号"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "角焊缝的基本符号：立在基准线上的直角三角形，竖直直角边在左，斜边向右下落到基准线。"
components = ["直角三角形：竖直边高约10d'（≈h），底边约9～10d'，斜边自竖边顶端向右下。", "位置：绘在实线侧（箭头侧）或虚线侧（非箭头侧），在虚线侧时上下镜像；对称角焊缝上下镜像。", "尺寸：左侧焊脚K（或K5），断续时右侧n×l(e)。", "方向：竖边总在左侧，不随箭头线方向改变。"]
variants = ["drawn above the reference line (arrow side)", "drawn below / on dashed side (other side, mirrored)"]
dxf_forms = ["closed 3-vertex LWPOLYLINE (or 3 LINEs) right triangle with its base on the reference line and its vertical leg on the left, ≈h tall", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "AutoCAD Mechanical / GstarCAD Mechanical weld-symbol object saved in DXF as ACAD_PROXY_ENTITY; only its proxy graphics (lines, arcs, text) are readable without the vendor enabler"]
recognition = "以焊缝基准线（水平或竖直细实线，一端与带箭头的斜线相接，可伴约0.3h处的平行细虚线）为锚点，在其两侧约1倍字高h范围内找高约h、笔画宽约h/10的符号笔画：底边落在基准线上、竖边在左、斜边向右下的封闭直角三角形，内部不填充。左侧紧邻数值即焊脚。区分基准三角形（涂黑或空心，贴在零件轮廓上并连方框字母）、测试点三角（顶点朝下带竖线）、单边V（缺斜边封口）、锥度/斜度符号（位于尺寸文字前）。"
confusions = ["基准三角形（GB/T 1182）：贴在零件轮廓或尺寸线上。", "斜度、锥度符号：在尺寸文字中。", "热处理测试点符号：倒三角带竖线。", "单边V形焊缝：无封口斜边。"]
