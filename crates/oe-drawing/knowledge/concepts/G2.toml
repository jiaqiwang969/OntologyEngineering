[[concepts]]
id = "DC-G2-067"
name = "断面图的标注及其省略"
aliases = []
group = "G2"
kind = "text_convention"
meaning = "移出断面一般标注“X—X”名称并在视图上用剖切符号、箭头和字母表示；按对称性和配置位置可省略：不对称断面在剖切符号延长线上时省字母，对称断面不在延长线上或按投影关系配置时省箭头，对称断面在剖切线延长线上、对称重合断面和视图中断处的对称断面不标注，不对称重合断面可省略标注。"
components = ["完全标注：剖切符号+箭头+字母，断面上方“X—X”。", "省字母：不对称断面配置在剖切符号延长线上，只画剖切符号和箭头。", "省箭头：对称断面不在延长线上，或按投影关系配置，只有字母。", "全省：对称断面在剖切线延长线上（只画细点画线剖切线）、对称重合断面、中断处对称断面。"]
variants = ["full label", "letters omitted", "arrows omitted", "no label"]
dxf_forms = ["Combinations of thick strokes, arrows, dash-dot cutting LINE and label TEXT depending on the case"]
recognition = "以移出断面为锚点：先判断断面图形是否关于剖切线方向对称、是否位于剖切线或剖切符号延长线上、是否按投影关系配置，再核对标注组合是否符合对应省略规则；据此关联断面与剖切位置（无字母时依靠延长线几何关系），并发现缺失的字母或箭头。"
confusions = ["剖视图的标注省略：条件不同（看对称面与投影关系）。"]
related = ["DC-G2-028", "DC-G2-034", "DC-G2-033", "DC-G2-043", "DC-G2-065", "DC-G2-066"]
priority = "high"
text_forms = ["A—A"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
