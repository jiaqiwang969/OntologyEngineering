[[concepts]]
id = "DC-G3-060"
name = "装配图中螺纹紧固件画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "装配图中剖切平面通过螺纹紧固件轴线时，螺栓、螺柱、螺钉、螺母、垫圈均按未剖切画（不画剖面线），其倒角、退刀槽、缩颈、凸肩等工艺结构可省略。"
components = ["被连接件被剖开并画剖面线，相邻两件剖面线方向相反或间隔不同；紧固件保持外形视图，形成无剖面线的轴对称“岛”。", "螺杆按外螺纹画：大径粗实线、小径细实线，旋合段按外螺纹画法。", "螺母、垫圈画外形；六角头/螺母在主视图通常显示三个棱面，可省略倒角形成的曲线。", "装配图中不穿通的螺孔可不画钻孔深度，只按有效螺纹深度画出。", "紧固件上的倒角、退刀槽、缩颈、凸肩等工艺结构允许省略。"]
variants = ["螺栓连接", "螺柱连接", "螺钉连接"]
dxf_forms = ["Exploded LINE/ARC strokes of the fastener on the thick layer (01) inside a sectioned assembly; the HATCH boundaries of the clamped parts stop at the fastener outline, leaving the fastener as an unhatched island", "INSERT of a standard-part block (CAXA 图库, GstarCAD Mechanical or AutoCAD Mechanical standard parts: bolt, nut, washer), sometimes with ATTRIB values carrying the designation; may arrive as an anonymous block or proxy entity after conversion", "Thin LINE (layer 02) for the minor diameter of the screwed shank next to thick LINEs for the major diameter and the thread end line", "Centre LINE (CENTER linetype, layer 05) along the fastener axis projecting a few mm beyond the outline"]
recognition = "锚点为装配剖视图中沿某条细点画线对称的一组粗实线外形：螺杆两条平行粗线（间距d）内侧伴两条细线（间距≈0.85d），头部或螺母为宽≈1.5–2d、高≈0.7–0.8d的矩形外形（三棱面竖线），该区域内无HATCH；两侧被连接件的HATCH画到孔壁（光孔径≈1.1d，孔壁与螺杆之间为双线间隙）或画到螺纹大径（旋合段）。若轴线处区域有剖面线则是普通被剖零件。与实心轴、销、键的不剖规则同类，区分依据是螺纹细线和六角头/螺母外形。"
confusions = ["实心轴、销、键按不剖画：同样无剖面线，但没有大小径双线、没有六角头和螺母外形。", "被剖切的普通零件：剖面线覆盖整个断面；紧固件区域是无填充的轴对称岛。", "整体外形视图：整个视图都无剖面线，此时“无剖面线岛”不能作为证据，需先判断视图是否为剖视。"]
