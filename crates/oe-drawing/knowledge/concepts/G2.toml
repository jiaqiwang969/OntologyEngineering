dxf_forms = ["Thin SPLINE (or LWPOLYLINE with bulges/many short segments) on layer 02 (green, continuous) forming one edge of a HATCH region", "Double-break line as LWPOLYLINE with Z-shaped vertices on layer 02", "HATCH boundary uses the wavy curve as an edge; exploded hatch LINEs end on the curve"]
recognition = "以细实线波浪线（SPLINE或密集短折线，端点落在粗实线轮廓上）或双折线为锚点：其一侧为剖面区域（剖面线端点落在该线上），另一侧为外形；剖面区域不覆盖整个视图。另一侧没有剖面线且是视图截止边的是局部视图边界；同一视图中两条断裂线夹一段空隙的是断开画法。"
