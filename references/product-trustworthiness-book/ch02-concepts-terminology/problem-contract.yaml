mirror_cq_drafts:
  - id: PTW-PC-02-CQ-01
    question: >-
      给定来自 PLM、ERP、测试和现场系统的一组名称，候选对象类型、身份判据、
      来源与桥接证据分别是什么；每一对记录应返回 Same、Different 还是 Unknown？
    required_answer_form:
      - source_record
      - candidate_entity
      - entity_type
      - identity_criterion
      - bridge_evidence
      - conflict_status
      - identity_decision
      - decision_reason
  - id: PTW-PC-02-CQ-02
    question: >-
      给定一句“对象 X 可靠”，它绑定的对象/配置、要求功能、行为边界、concern、
      measure、条件、时间、判据和证据是什么；哪些字段仍含混或发生范畴错误？
    required_answer_form:
      - subject
      - identity_and_configuration
      - required_function
      - behavior_boundary
      - concern
      - measure_and_model
      - context_and_time
      - acceptance_criterion
      - evidence_and_uncertainty
      - ambiguity_or_category_error_set
  - id: PTW-PC-02-CQ-03
    question: >-
      给定 EPS 与 ENV-01 的术语和记录，哪些是产品、系统、元素、工件、实例、功能、
      行为、fault、error、failure、concern、measure、state 或 role；存在哪些错误继承、
      跨层强等同或 ISO 语义泄漏？
    required_answer_form:
      - record_or_concept
      - assigned_category
      - observation_or_task_boundary
      - typed_relation
      - category_error
      - iso_adapter_leakage

answer_acceptance:
  - 类与个体必须分开，产品、工件和物理单件使用与其类型相容的身份判据
  - 功能、行为、状态和角色必须通过有类型关系连接，不得以错误继承压成一棵类树
  - 同名不得自动 Same，异名不得自动 Different；证据不足必须返回 Unknown
  - 强同一关系必须绑定来源、桥接证据、冲突处置、范围和身份裁决
  - item、system、element、fault、error、failure、safe state 与时间概念必须保留精确 ISO 边界
  - 通用概念不得通过删除 iso262 命名空间前缀生成；ISO 语义必须隔离在局部 adapter
  - ENV-01 必须使用独立个体，并分别回答准确度、漂移稳定性、可靠性、可用性、可维护性和数据完整性
  - 校准与网络单因变式必须返回 concern 级影响，不得使用 affects_all 或 affects_none 默认值
  - ch12 package 必须拥有独立 namespace、TBox、ABox、CQ、约束、正反例和 runner，不依赖其他回答章业务资产

