components = ["铸件沿起模方向的侧壁带微小斜度（约1:20）。", "零件图通常仍把侧壁画成与起模方向平行，不画斜度。", "需要说明时在技术要求中写出起模斜度，或在必要处画出并以斜度方式注出。"]
