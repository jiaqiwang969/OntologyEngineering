[[concepts]]
id = "DC-G3-143"
name = "两自由度运动副符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示具有两个自由度的运动副：圆柱副（构件可同时绕轴转动并沿轴移动）和球销副（球面副中用销限制一个转动）。"
components = ["圆柱副基本符号：一根长粗线表示轴，轴的上下各有一条较短的平行线表示套，构件粗线斜接在上方短线上并带实心楔；旁边可配端视图：带中心点的小圆，圆上方引出构件短线。", "圆柱副可用符号：轴线穿过一个狭长的横置矩形（套筒），矩形两侧没有竖短线。", "球销副：小圆（球）外有同心弧（球窝），一根短销线沿径向立在球上，两侧各接一根构件粗线并带实心楔。", "2013版条号5.2.1、5.2.2，1984版2.2.1、2.2.2，图形一致。"]
variants = ["圆柱副", "球销副"]
dxf_forms = ["LINE axis on layer 01 with two shorter parallel LINEs (sleeve) and an inclined LINE link; joint wedge as SOLID or HATCH SOLID", "End view: CIRCLE with a tiny filled dot (SOLID, DONUT or very small CIRCLE) at its centre and a short radial LINE", "Alternative: LINE passing through a closed LWPOLYLINE rectangle with aspect ratio well above 2:1", "INSERT of a cylindrical-pair or spherical-pin-pair library block"]
recognition = "圆柱副以长粗线及其上下等长的平行短线为锚点，构件斜线以实心楔接在上方短线上；如有端视图，则是圆心有实心点的小圆。可用符号为一条线穿过长宽比明显大于2的横置矩形，矩形两侧无竖短线——借此与回转副可用符号（竖立矩形、两侧轴线上有竖短线）及棱柱副可用符号（矩形内有叉线）区分。球销副为球面副图形加一根径向销线。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。"
confusions = ["回转副：可用符号为竖立矩形且两侧轴线上有竖短线；空间回转副的轴承小框两端也有竖短线。", "球面副：没有销线，自由度为三。", "棱柱副可用符号：滑块矩形内画叉线，或导路画成梯形框。", "零件图上的同心圆与中心点：零件图圆带十字中心线和尺寸，不接单线构件。"]
related = ["DC-G3-141", "DC-G3-158", "DC-G3-178", "DC-G3-152"]
