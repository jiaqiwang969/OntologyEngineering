[[concepts]]
id = "DC-G3-232"
name = "螺纹公差带代号（中径、顶径）"
aliases = []
group = "G3"
kind = "tolerance_indication"
meaning = "螺纹标记中的公差带代号，由公差等级数字在前、基本偏差字母在后组成，先写中径公差带、后写顶径公差带，大写表示内螺纹、小写表示外螺纹。"
components = ["单个公差带代号=等级数字+基本偏差字母，如6H、5g、7e。", "中径公差带在前、顶径公差带在后（5g6g）；两者相同时只写一个（6H、6g）。", "内螺纹基本偏差为G、H（大写），外螺纹为e、f、g、h（小写）；外螺纹中径等级3~9级，顶径（大径）等级4、6、8级。", "写在尺寸代号之后，用“-”隔开；螺纹副用斜线分开内外，如6H/6g。", "公差带与旋合长度组合决定精密、中等、粗糙三种精度，一般用途选中等（如6H/6g）；梯形、锯齿形螺纹只注中径公差带。"]
variants = ["内螺纹 G/H", "外螺纹 e/f/g/h", "两组代号如 5g6g", "单组代号如 6H"]
dxf_forms = ["Part of the DIMENSION override text or leader TEXT of the thread marking, e.g. 'M10-5g6g', 'M20×2-6H/6g'", "Rarely stacked; plain characters on layer 08/11"]
recognition = "只在螺纹标记上下文中解析：在M/Tr/B/S特征代号与尺寸代号之后的第一个“-”之后，匹配 (\\d[a-hA-H])(\\d[a-hA-H])?(/\\d[a-h](\\d[a-h])?)?，位于旋合长度和LH之前。字母大小写判内外螺纹，可与图形核对（内螺纹在孔上、外螺纹在轴上）。与光滑尺寸公差带区分：后者字母在前数字在后（H7、g6、k6），且跟在Ø尺寸后。"
confusions = ["光滑圆柱公差带（H7、Ø40H7）：字母在前，不出现在螺纹标记中。", "小螺纹公差（4H5）：末位5只是顶径公差等级，无字母。", "装配配合代号（H7/g6）：斜线两侧为字母在前的公差带，用于光滑配合。"]
related = ["DC-G3-223", "DC-G3-087", "DC-G3-088", "DC-G3-224", "DC-G3-231", "DC-G3-219", "DC-G4-114", "DC-G4-150"]
priority = "high"
text_forms = ["6H", "6g", "5g6g", "7H", "6H/6g", "7e", "4H5"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K34"]
recognition_cards = ["dimension_text"]
