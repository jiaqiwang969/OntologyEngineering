[[interfaces]]
name = "MdDrawingRoutePort"
module = "drawing_understanding"
method = "run_route"
input = "MdDrawingRouteRequest"
output = "MdDrawingRouteReceipt"
error = "FailureRecord"
effects = "Run the pinned converter and the isolated worker; write only into a new output directory inside the project home; never change the source, Project, HEAD or models"
rust_path = "crates/oe-drawing/src/route.rs"
implementation = "DrawingRoute"

[[interfaces]]
name = "MdReviewPagePort"
module = "drawing_understanding"
method = "render_page"
input = "MdReviewPageRequest"
output = "MdReviewPage"
error = "FailureRecord"
effects = "Write one new page from a frozen graph and its rendering; no classification"
rust_path = "crates/oe-drawing/src/page.rs"
implementation = "ReviewPageRenderer"

[[interfaces]]
name = "MdExpressionGraphCheckPort"
module = "drawing_understanding_check"
method = "check_graph"
input = "MdExpressionGraphCheckRequest"
output = "MdExpressionGraphCheck"
error = "FailureRecord"
effects = "Read the source bytes, graph and review; write one new report; no classification"
rust_path = "crates/oe-drawing-check/src/graph.rs"
implementation = "ExpressionGraphChecker"

[[interfaces]]
name = "MdReviewPageCheckPort"
module = "drawing_understanding_check"
method = "check_page"
input = "MdReviewPageCheckRequest"
output = "MdReviewPageCheck"
error = "FailureRecord"
effects = "Run headless Chrome on the local page with a fresh profile; write the browser result and a screenshot into a new directory"
rust_path = "crates/oe-drawing-check/src/browser.rs"
implementation = "ReviewPageChecker"

[[constraints]]
id = "md_drawing_route"
requirement = "req_md_drawing_route"
module = "drawing_understanding"
check = "route"
rust_path = "crates/oe-drawing/src/route.rs"
statement = "The route runs its fixed steps in order and stops at the first failure, recording every later step as not run; the converter must report the locked version and match its local record in digest, repository and commit before it runs, and converts without fonts; the worker receives only the DXF bytes under the deny-default sandbox, verified by probes; the drawing is unchanged at the end; outputs are written only into a new directory inside the project home"
severity = "error"

[[constraints]]
id = "md_review_page"
requirement = "req_md_drawing_route"
module = "drawing_understanding"
check = "render"
rust_path = "crates/oe-drawing/src/page.rs"
statement = "The page embeds the frozen graph and the neutral rendering unchanged; every rendered identity is a source root of the graph; a rendering with scripts, foreign objects, images, event attributes or links is refused; partial intervals are shown only on qualified LINE sources"
severity = "error"

[[constraints]]
id = "md_expression_graph_check"
requirement = "req_md_drawing_route"
module = "drawing_understanding_check"
check = "check"
rust_path = "crates/oe-drawing-check/src/graph.rs"
statement = "Re-derived from the source bytes without classifier code: every model-space graphic root kept with type, layer and owner; native members present and distinct; line patterns from LTYPE elements; exact LINE end points; member intervals covering each source domain; expression families, member lists and views; no invented part target; structure ends, inferred spans and structural lines on their sources; rendered identities; the worker identity and sandbox profile; pinned files unchanged"
severity = "error"

[[constraints]]
id = "md_review_page_check"
requirement = "req_md_drawing_route"
module = "drawing_understanding_check"
check = "check_page"
rust_path = "crates/oe-drawing-check/src/browser.rs"
statement = "Every browser expectation is computed from the graph embedded in the page; no answers are injected; a check that needs an element the drawing lacks is listed as not applicable instead of failing; the browser runs headless with a fresh profile under a time limit"
severity = "error"

