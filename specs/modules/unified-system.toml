[[constraints]]
id="unified_installation_identity"
requirement="req_delivery"
module="cli"
check="execute"
rust_path="crates/oe-cli/src/installation.rs"
statement="统一安装绑定同一源码根的八程序，memory只从同目录派发，缺件不搜索其他skill；已有安装身份变化必须重新安装，不覆盖旧回执。"
severity="error"

[[validations]]
id="unified_installation_missing_or_changed_program"
module="cli"
constraint="unified_installation_identity"
behavior="unified_installation_missing_or_changed_program"
rust_path="crates/oe-cli/src/installation.rs"
oracle="缺少程序或篡改现有安装时拒绝；完整新目录保存实际八程序摘要。"
scope="本机源码构建安装；不证明原生CAD与工程采用"

