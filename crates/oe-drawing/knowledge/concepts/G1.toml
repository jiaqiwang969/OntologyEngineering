[[concepts]]
id = "DC-G1-054"
name = "过渡线"
aliases = []
group = "G1"
kind = "line"
meaning = "铸件、锻件表面以圆角光滑过渡时，原有理论交线已不存在，用细实线画出其大致位置（过渡线），表示面与面的分界。"
components = ["细实线（No.01.1.1），画法同相贯线或截交线，但两端不与轮廓线相连，留有空隙。", "板与圆柱相切处没有过渡线，相交处才画。", "GB/T 4458.1-2002 起假想交线由粗实线改用细实线；此前的图样中可见过渡线可能为粗实线。"]
variants = ["2002: thin solid (01.1)", "per 2002 foreword the 假想交线 were thick solid before 2002"]
dxf_forms = ["thin ARC/LINE/SPLINE whose endpoints stop short of the thick outline", "tangent edges generated by 3D-to-2D projection in CAD (often a separate layer or linetype)", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一条细实线曲线或直线，形状像相贯线或截交线，端点与邻近粗实线轮廓之间留有约1~2 mm 的间隙；零件为铸/锻件（材料如 HT、ZG，技术要求有“未注铸造圆角”）。旧图中可能用粗实线画出。与相贯线区分：相贯线为粗实线且端点与轮廓相接。"
confusions = ["可见棱边线：粗实线，端点与轮廓相接。", "相贯线：粗实线，无端部空隙。", "尺寸界线：从轮廓引出，越过尺寸线。", "CAD 自动生成的相切边：三维出图时可能出现，应按模板设置判断是否为过渡线。"]
related = ["DC-G1-035", "DC-G1-014", "DC-G1-071", "DC-G3-125", "DC-G3-067"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "端部空隙的数值源中未给出，1~2 mm 为一般实践；“假想交线”是否完全等同过渡线存疑（见目录说明）。"
