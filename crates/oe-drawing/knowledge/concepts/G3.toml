[[concepts]]
id = "DC-G3-170"
name = "摩擦传动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示两摩擦轮靠接触面摩擦传递运动的传动，有圆柱轮、圆锥轮、双曲面轮、可调圆锥轮和可调冕状轮等形式。"
components = ["圆柱轮传动：侧视为两根平行粗轴线，各接一条与轴垂直的轮辐线，两轮的摩擦面短线相互贴合，上方常有竖直箭头表示压紧力；端视为两个相切的圆，带十字点画线中心线。", "圆锥轮传动：两轴线相交，轮辐线与摩擦面线斜置并在锥面处贴合，并有压紧力箭头。", "双曲面轮：仅有可用符号，交错两轴上的两个细腰形轮体相交，带回转箭头。", "可调圆锥轮、可调冕状轮：在轮线旁加斜向双箭头或平行箭头表示轮位可调；附注另给带中间体、可调圆环、可调球面轮等示例。", "可用符号把两轮画成相接的矩形或梯形轮体，内画“×”。", "若用单线画轮子，两轮接触处允许留出空隙。"]
variants = ["圆柱轮", "圆锥轮", "双曲面轮", "可调圆锥轮", "可调冕状轮"]
dxf_forms = ["Exploded LINE strokes on layer 01: thick shaft LINEs (or 2d-wide LWPOLYLINE), wheel-plane LINEs and short friction-surface LINEs; force arrows as LINE plus SOLID or LEADER", "End view: two tangent CIRCLEs with centre LINEs on layer 05", "Alternative symbols: LWPOLYLINE rectangles/trapezoids with an × of two short LINEs", "INSERT of a library block"]
recognition = "锚点：两个摩擦轮符号的轮缘线相接（或留小隙），每个轮符号由与粗轴线垂直的轮辐线和其端部只向一侧伸出的短线组成（拐角形）；或端视两圆相切。附近常有指向接触处的压紧力箭头，可调型另有双箭头。与齿轮传动区分：齿轮的齿圈短线跨在轮辐线端部两侧（T 形）；与带传动区分：带传动有两条公切线，两轮不直接接触。"
confusions = ["齿轮传动符号：端部短线居中跨在轮辐线两侧，无压紧力箭头。", "带传动、链传动：两轮之间有公切线，不直接相接。", "机构简图中的移动副或导路：由滑块矩形和导路线组成，不是两轮相接。"]
