meaning = "对称度：位置公差，限定被测中心面（或中心线）相对于基准中心面/轴线的对称偏离，典型用于键槽、凸台两侧面的中心面对轴线。"
components = ["特征符号：三条等距水平线，中间一条最长（约 0.6H），上下两条较短（约 0.4H），竖直居中", "第二格：公差值（不加 Ø）", "基准格：基准中心平面或轴线，常为公共基准 A-B", "被测为导出要素：指引线箭头与槽宽或厚度的尺寸线对齐"]
variants = ["对基准中心平面", "键槽对称度（键槽两侧对轴线）"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;i} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph three horizontal LINE, middle one longest in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⌯ (U+232F) (or MTEXT font switch {\\Fgdt;i}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内三条水平 LINE：中点竖直对齐，间距约 0.15–0.2H，中间一条明显较长 → 对称度。三条等长为全等号“≡”文字；只有一条为直线度。相交平面框格第一格的“≡”表示“对称（包含）”，在主框格右侧附加框中，不是对称度。框格必有基准，指引线应与被测槽宽/厚度尺寸线对齐。"
confusions = ["全等号 ≡ 与等号（文字或表面纹理符号）", "直线度（单线）", "相交平面框格中的对称（包含）符号"]
related = ["DC-G5-090", "DC-G5-107", "DC-G5-002", "DC-G5-103", "DC-G4-127"]
priority = "high"
text_forms = ["⌯ 0.03 A", "⌯ 0.05 A-B"]
