[[concepts]]
id = "DC-G5-102"
name = "滤波器规范元素（滤波器类型与嵌套指数）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "第二格中规定被测要素滤波的元素：滤波器类型字母后不留空格紧跟嵌套指数；指数后加“-”为长波通，指数前加“-”为短波通，两个指数用“-”连接为带通，两个方向的滤波器用“×”分开。"
