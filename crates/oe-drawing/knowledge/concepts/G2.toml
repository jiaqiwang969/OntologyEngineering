[[concepts]]
id = "DC-G2-008"
name = "相邻涂黑剖面之间的间隙"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "两个都涂黑表示的狭小剖面相邻时，其间留出不小于0.7 mm的空隙以分清边界；这样成组涂黑的图形不表示实际几何形状。"
components = ["相邻涂黑剖面：如叠放的垫片、薄板。", "间隙：相邻涂黑区之间按图纸尺寸留≥0.7 mm空白。", "涂黑区宽度：装配图中一般≤2 mm。"]
variants = []
dxf_forms = ["Two HATCH SOLID fills (or SOLID/TRACE, or wide LWPOLYLINE) separated by an empty strip ≥0.7 mm at plot scale", "The gap itself is not drawn by any entity"]
recognition = "以相邻的两个实心填充区为锚点：二者为平行长条、按出图比例换算宽度≤2 mm，相隔约0.7～1 mm且间隙中无实体，判为成组涂黑剖面；间隙中有轮廓线或间隔远大于填充宽度时，可能是两零件间的真实间隙。"
confusions = ["两零件间的真实装配间隙：间隙与尺寸一致，常有轮廓线。", "粗实线中的白线：没有实心填充。", "焊缝涂黑：位于焊接接头处，多为三角形。"]
