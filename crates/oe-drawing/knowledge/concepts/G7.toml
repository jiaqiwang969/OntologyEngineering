recognition = "在焊缝符号分区文字中检测前缀字母：左侧以K、S、p、H、h、R、c、d开头的数值，上下侧以α、β、b开头的数值，尾部以N=开头。字体为希腊字母SHX时原始字符串可能是拉丁字母，需结合文字样式判断。"
