dxf_forms = ["token 'EP' or 'ES' after the last '/' in the specification TEXT", "MTEXT one-line specification"]
recognition = "词法：最后一个“/”之后的EP或ES两字母大写记号，可后接OR(n)。属于草案/区域法写法，普通零件图上罕见。区分EQS（均布缩写，三个字母，跟在尺寸后）及其他缩写。"
