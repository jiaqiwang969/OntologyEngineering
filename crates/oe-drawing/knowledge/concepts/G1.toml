[[concepts]]
id = "DC-G1-034"
name = "特定区域线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细双点画线围出具有特殊含义的区域，例如铭牌、标签位置，或轮廓无法明确绘制的特定封闭区域。"
components = ["细双点画线（No.05.1.8），通常为闭合矩形或外形。", "区域内或旁边有说明文字（如“铭牌”）。", "GB/T 4458.1：轮廓线无法明确绘制时，其特定封闭区域用细双点画线画出。"]
variants = []
dxf_forms = ["closed LWPOLYLINE with a PHANTOM-type linetype plus TEXT inside or beside it", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "闭合的双点画线矩形或外形，位于零件表面范围内，内部或旁边有说明文字；与零件其他图线无投影对应。与局部放大的细实线圆圈、限定范围的粗点画线（沿表面的开口线）区分。"
confusions = ["范围线及分界线：细实线。", "限定范围表示线：粗点画线，沿表面平行。", "局部放大图的圈注：细实线圆。"]
