id = "DC-G4-121"
name = "圆锥公差—公差锥度法注法"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "圆锥公差的公差锥度法：同时直接给出圆锥直径公差（最大直径T_D或给定截面直径T_DS）和圆锥角公差（如 25°±30′ 或 25°±AT8/2），两项各自独立满足，不构成两极限圆锥，按独立原则解释。"
components = ["直径公差：在最大圆锥直径或给定截面直径上注±偏差（如 ØD±T_D/2、Ødx±T_DS/2）", "给定截面位置：用理论正确尺寸或长度尺寸确定截面", "圆锥角公差：角度值加±偏差，或用AT等级表示", "可附加：素线直线度等形状公差"]
variants = ["T_D + AT", "T_DS + AT"]
dxf_forms = ["diameter DIMENSION (linear, dimtype 0 with %%c) carrying %%p deviation", "angular DIMENSION (dimtype 2) with override '25%%d%%p30''' or '25%%d%%pAT8/2'", "optional TOLERANCE entity / exploded frame for straightness"]
recognition = "锚点：同一圆锥（两条对称收敛的轮廓线）上同时存在带±的直径尺寸和带±（或AT）的角度尺寸。若角度为公称值而另有面轮廓度框格，则为面轮廓度法；若只有直径公差和基本锥度（无角度公差），则为基本锥度法。与一般角度公差区分：一般公差不在图上注出。"
confusions = ["基本锥度法：只给直径公差和基本锥度/锥角", "面轮廓度法：锥角/锥度为理论正确尺寸，配面轮廓度框格", "未注角度公差：由技术要求统一规定"]
