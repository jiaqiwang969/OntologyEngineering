# Drafting concept catalogue, group G3: 规定画法与简化画法.
# One card per representation concept; paraphrased from the cited sources (page = physical page of the library copy).
schema = "oev2.drawing-concept-catalogue/1"
group = "G3"
label = "规定画法与简化画法"

[[concepts]]
id = "DC-G3-001"
name = "不可见螺纹画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "螺纹被遮挡而不可见时（如未剖开的螺孔、被其他结构挡住的螺纹），其牙顶线、牙底线和螺纹终止线等全部图线一律改画细虚线。"
components = ["牙顶线与牙底线：轴线两侧各两条平行虚线；内螺纹外侧一对为大径（牙底），内侧一对为小径（牙顶），间距比约1:0.85。", "螺纹终止线：垂直于轴线的一段虚线，位于有效螺纹终点，横跨大径。", "不通孔时小径虚线（即钻孔直径）继续延伸到钻孔深度，并以约120°锥顶虚线收尾。", "可见与不可见的粗细区别在虚线状态下不再体现：两组线同为虚线。"]
variants = ["不可见内螺纹", "不可见外螺纹"]
dxf_forms = ["Parallel LINE pairs on the hidden layer (GB/T 14665 层04 细虚线; named 虚线) with linetype HIDDEN/DASHED/ACAD_ISO02W100 and thin lineweight", "Perpendicular short dashed LINE for the thread end; two dashed LINEs at ±60° to the axis for the drill-point cone of a blind hole", "Axis as a CENTER-linetype LINE (层05) through the middle of both pairs", "From mechanical add-ons (CAXA/GstarCAD Mechanical hole features) possibly an INSERT whose block holds the dashed strokes"]
recognition = "锚点：一条细点画线轴线，两侧对称各有两条平行细虚线。外对间距=大径d，内对间距≈0.85d（直径比≈1.18）；外对止于一条横跨的虚线（终止线），内对可继续延伸并以120°锥顶结束（盲孔）。附近通常有以M开头的螺纹标记（引出线或尺寸线）。区分：隐藏光孔只有一对虚线；隐藏阶梯孔/沉孔两对虚线直径比一般≥1.5，且台阶端线只连接两直径之间而不被内对线穿过。"
confusions = ["普通不可见光孔：只有一对虚线，无0.85d的第二对线和终止线。", "不可见阶梯孔、沉孔：直径比大（≥1.5），台阶线与内对线相接而非被穿过。", "其他隐藏轮廓线：不成对或不关于点画线对称。"]
related = ["DC-G3-005", "DC-G3-024", "DC-G3-002", "DC-G3-094", "DC-G3-088", "DC-G1-045", "DC-G1-002", "DC-G1-048", "DC-G1-049"]
priority = "medium"
text_forms = ["M10-6H", "M8-6H↧12"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "End views of hidden threads are not detailed in the cited clause; in practice drafters avoid them by sectioning. Layer numbers follow GB/T 14665-2012 Table 6; real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线) or CAXA layer names, so recognition should rely on linetype, lineweight and geometry rather than layer names (general practice)."
[[concepts.sources]]
document = "GB/T 4459.1-1995"
clause = "3.4 图6"
page = 4
[[concepts.sources]]
document = "机械制图（第7版）"
clause = "图8-9"
page = 262

[[concepts]]
id = "DC-G3-002"
name = "不穿通螺孔画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "不穿通的螺孔（盲螺孔）一般要把钻孔深度和螺纹深度分别画出：钻孔底部为约120°锥顶，螺纹终止线位于螺纹深度处；装配图中可不画钻孔超出部分，只画有效螺纹深度。"
components = ["钻孔部分：直径约等于螺纹小径（≈0.85d）的一对粗实线（剖视），底部两条斜线成约120°锥顶，锥顶不计入孔深。", "螺纹部分：大径为一对细实线，止于粗实线的螺纹终止线；终止线到孔口的距离即螺纹深度，钻孔通常再深约0.5d（教材比例画法）。", "剖面线越过细实线一直画到小径粗实线。", "端视图：小径为粗实线整圆，大径为约3/4圈细实线圆弧，孔口倒角圆不画。", "装配图简化：可只画到有效螺纹深度，不画钻孔余量及锥顶。"]
variants = ["零件图：钻孔深度与螺纹深度分别画出", "装配图：仅画有效螺纹深度，不画钻孔深度", "详细画法", "装配图简化画法"]
dxf_forms = ["Exploded strokes: thick LINE pair at the minor diameter (层01), thin LINE pair at the major diameter (层02) ending on a thick perpendicular end LINE, two thick LINEs forming the 120° cone", "HATCH ANSI31 at 45° (层10 / 剖面线) whose boundary follows the thick minor-diameter lines, so the thin major-diameter lines lie inside the hatched area", "End view: thick CIRCLE (minor) + thin ARC of about 270° (major), concentric", "Callout as leader + MTEXT or DIMENSION override text, e.g. 'M10-6H↧16' with '孔↧20'; the depth glyph may be a special-font character or the word 深", "CAXA/GstarCAD Mechanical threaded-hole feature may arrive as an INSERT of a hole block"]
recognition = "锚点：孔轴线（点画线）两侧的一对粗实线（小径），在其外侧约0.075d处各有一条细实线（大径），细线止于横跨大径的粗实线终止线，粗实线继续延伸并以两条与轴线成60°的斜线汇成120°锥顶。剖面线止于粗实线、穿过细实线区域。标注中出现 M…-…H 与深度。区分：光孔盲孔没有细实线和终止线；沉孔的大直径段在孔口、为粗实线且直径比≥1.5；中心孔为60°锥、位于轴端且很浅。"
confusions = ["光孔盲孔：只有粗实线与120°锥顶，无细实线大径和终止线。", "沉孔/锪平孔：大直径段在孔口并为粗实线。", "中心孔：60°锥面在轴端，常只用中心孔符号与标记表示。", "紧定螺钉的90°锥坑：锥角90°且无圆柱段。"]
related = ["DC-G3-005", "DC-G3-001", "DC-G3-037", "DC-G3-094", "DC-G3-089", "DC-G3-056", "DC-G3-058", "DC-G3-088", "DC-G4-052", "DC-G4-088"]
priority = "high"
text_forms = ["M10-6H", "M8-6H↧12 孔↧15", "4×M6-7H↧10", "M12-6H 深18"]
knowledge_units = ["K13", "K39"]
recognition_cards = ["thread_representation"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "The 0.5d extra drill depth and 0.075d radial offset are textbook proportional-drawing values, not standard requirements. Layer numbers follow GB/T 14665-2012 Table 6; real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线) or CAXA layer names, so recognition should rely on linetype, lineweight and geometry rather than layer names (general practice)."
