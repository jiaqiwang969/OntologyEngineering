[[concepts]]
id = "DC-G3-190"
name = "自动离合器符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示依靠自身作用（转速、转向或过载）自动接合或分离的离合器，有一般符号及离心摩擦、超越和安全离合器。"
components = ["一般符号：两根同轴粗轴线之间为两个相对的半体，外侧半体上下端各有一段短竖凸头，与可控离合器的一般符号相近。", "离心摩擦离合器：两半体之间画一对上下相对的箭头（表示离心力作用）。", "超越离合器：两半体之间画一个小圆（滚子）。", "安全离合器：带易损元件时两半体重叠并有一条粗线贯穿；无易损元件时有一个箭头从侧面指入半体（弹性元件）。", "1984 版 8.3 与 2013 版 11.3 的图形一致；需要表明操纵方式时可加 M/H/P/E 字母（附注同时涵盖 11.3）。"]
variants = ["一般符号", "离心摩擦离合器", "超越离合器", "安全离合器（带/无易损元件）"]
dxf_forms = ["Exploded LINE/LWPOLYLINE strokes between two collinear thick shaft LINEs on layer 01", "Inner marks: small CIRCLE (overrunning), opposed arrows as LINE plus SOLID (centrifugal)", "INSERT of a library block"]
