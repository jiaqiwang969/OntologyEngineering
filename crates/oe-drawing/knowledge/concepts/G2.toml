recognition = "以实心填充为锚点：区域窄（按出图比例宽度≤2 mm、长宽比大），位于两零件之间或零件薄壁处；以宽多段线表示时读取其全局宽度作为厚度。加粗轮廓线内部为空；焊缝涂黑位于接头处、多为三角形；粗实线只是边线。"
