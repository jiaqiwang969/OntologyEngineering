[[concepts]]
id = "DC-G7-057"
name = "心轴类装置符号"
aliases = []
group = "G7"
kind = "symbol"
meaning = "机械加工工艺图中表示心轴类定位夹紧装置的符号（细实线）：圆柱心轴、锥度心轴、螺纹心轴（花键心轴共用）和弹性心轴（含塑料心轴）。"
components = ["圆柱心轴：圆，右侧引出带箭头的水平线。", "锥度心轴：圆内画一个小三角（锥形），右侧水平箭头。", "螺纹心轴：圆内画一段螺旋弧，右侧水平箭头。", "弹性心轴：圆内画折线，右侧水平箭头（与弹簧夹头同符号）。"]
variants = ["圆柱心轴", "锥度心轴", "螺纹心轴", "弹性心轴"]
dxf_forms = ["exploded thin LINE/ARC/CIRCLE strokes (layer 02 or a process-annotation layer) drawn at height ≈1–1.5× the digit height of the process drawing", "INSERT of a fixture-symbol block from a process-planning (工艺/CAPP) template; block names often carry the symbol name in Chinese or pinyin"]
