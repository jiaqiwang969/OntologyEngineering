[[concepts]]
id = "DC-G8-016"
name = "带传动和链传动的简化画法"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "在装配图中，带传动的带可用一条粗实线表示，链传动的链可用细点画线表示；必要时在粗实线或细点画线上加画表示带或链类型的符号（见GB/T 4460）。"
components = ["带轮、链轮按简化轮廓或节圆画出。", "带：两轮之间的公切粗实线（开口式或交叉式），代表带的运行路线。", "链：沿两链轮节圆的公切线和节圆弧形成闭合环的细点画线。", "可选：在线上加画平带、V带、圆带或链的类型符号。"]
variants = ["belt: thick line", "chain: thin dash-dot line", "with type symbol"]
dxf_forms = ["belt: LINE tangent segments (layer 01) between two pulley ARC/CIRCLE entities, sometimes a closed LWPOLYLINE loop", "chain: LINE/ARC loop with CENTER-type linetype on layer 05 following the sprocket pitch circles", "type symbol as a small INSERT or exploded LINE/CIRCLE strokes on the line"]
recognition = "以两个或多个分离的带轮或链轮圆为锚点，查找同时与两圆相切（或与两节圆相切）的成对线段：切线为粗实线（01层或线宽≥0.5）且与轮外缘相切的，判为带；切线为细点画线并沿节圆形成闭环的，判为链。与节圆的区别：节圆是单个细点画线圆，不连接到另一轮；与普通轮廓的区别：零件轮廓不会只用公切线连接两个分离的回转体。"
confusions = ["齿轮节圆（分度圆）：独立的细点画线圆，啮合时两节圆相切而不是用公切线连接。", "外形轮廓线：闭合包围实体，不是两圆之间的公切线。", "机构运动简图中的带、链符号：属于示意图，常为独立符号。"]
related = ["DC-G3-163", "DC-G3-201", "DC-G3-068", "DC-G1-044"]
