recognition = "锚点：文字匹配“整数 [×xX] 数值[°] (=数值[°])”的模式。检验：n×p 等于括号内总值；所在尺寸线跨度按比例≈总值；附近有n+1条等间距的尺寸界线或要素中心线。与参考尺寸括号区分：括号内以“=”开头且前面是乘式；与n×Ø重复要素区分：无Ø，括号内为总和；与退刀槽“槽宽×直径”区分：无括号等式。"
