[[concepts]]
id = "DC-G3-208"
name = "齿轮符号（不指明齿线）"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中单个齿轮的符号（不指明齿线）：以轮辐平面线和居中跨在其端部的齿圈短线表示，分圆柱齿轮、圆锥齿轮和挠性齿轮。"
components = ["圆柱齿轮：一条与粗轴线垂直的轮辐线，两端各有一条与轴平行、居中跨越线端的短线，形成“工”字形端头；内齿轮画成“[”形，齿圈短线位于横向延伸段的末端。", "圆锥齿轮：轮辐线两端的齿圈短线倾斜，方向与锥面一致。", "挠性齿轮：轮辐线中段有两个半圆凸起（柔性薄壁），两端经横向延伸后再接齿圈短线。", "可用符号：圆柱齿轮画成带“×”的矩形，圆锥齿轮画成带“×”的梯形，轴线穿过“×”。", "与摩擦轮的区别：齿轮的齿圈线跨在轮辐线端部两侧，摩擦轮的摩擦面线只向一侧伸出（2013 版 8.4 图 2，1984 版第 5 章说明）。"]
variants = ["圆柱齿轮", "圆锥齿轮", "挠性齿轮"]
dxf_forms = ["Exploded LINE strokes on layer 01: wheel-plane LINE perpendicular to a thick shaft LINE, short centred tick LINEs at its ends", "Alternative: LWPOLYLINE rectangle or trapezoid with an × of two short LINEs", "INSERT of a library block"]
recognition = "锚点：与粗轴线垂直相交的轮辐线，两端各有居中的短横（T/工 形端头），短横长度约为轮辐线的几分之一。端头斜置→圆锥齿轮；中段两半圆凸起→挠性齿轮；“[”形→内齿轮。与摩擦轮区分：摩擦轮端部短线只在一侧；与工字钢符号区分：工字钢符号是材料标记中的独立小符号，后接规格尺寸，不被粗轴线贯穿；与零件图齿轮画法区分：后者为真实轮廓视图，有齿顶线、分度线和尺寸。"
confusions = ["摩擦轮符号：端部短线只向一侧伸出。", "工字钢、H 钢图形符号：出现在型材标记文字中，后接尺寸。", "零件图圆柱齿轮画法：真实外形或剖视，分度圆点画线，有尺寸和参数表。"]
related = ["DC-G3-207", "DC-G3-206", "DC-G3-171", "DC-G3-022", "DC-G3-162"]
