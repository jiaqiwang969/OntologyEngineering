[[concepts]]
id = "DC-G4-006"
name = "半径尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "对小于或等于半圆的圆弧注半径：尺寸线沿径向自圆心引出（或其延长线通过圆心），只在指向圆弧的一端画箭头，数字前加 R，并注在反映圆弧实形的视图上。"
components = ["尺寸线：细实线，沿半径方向，通过或延长通过圆心", "箭头：只有一个，尖端与圆弧接触；小半径时可从弧外指向圆心", "数字：R+数值，写在尺寸线上，或水平写在引出的折线上", "圆心：通常有中心线交点；半径过大时见折线注法", "大于半圆的圆弧一般注直径而不注半径（教材说明）"]
variants = ["dimension line from centre", "arrow from outside for small radii"]
dxf_forms = ["DIMENSION dimtype 4 (radius): code 10 = arc centre, code 15 = point on arc, text '<>' with prefix 'R' from DIMPOST or override", "exploded: one radial LINE + one SOLID arrowhead touching the ARC + TEXT 'R20'", "LEADER/MULTILEADER from outside pointing at small arcs, text 'R5'", "LARGE_RADIAL_DIMENSION for jogged large radii (see DC-G4-013)", "layer 08 or template dimension layer; text style on gbenor.shx/gbeitc.shx"]
recognition = "锚点为以 R 开头的尺寸文字（排除 SR）。DIMENSION 类型4直接给出圆心与弧上点；散线时找一条一端带填充三角的线段：三角尖到某 ARC/CIRCLE 圆周的距离≤0.5d，线段延长线经过该弧圆心（方向偏差<1°），另一端在圆心或在弧外（小半径外置）。数值×比例≈弧半径，可校核比例。与直径区分：只有一个箭头、无 Ø；与球半径区分：无 S 前缀；与对称机件单箭头尺寸区分：后者数字无 R，尺寸线越过对称中心线而非指向圆心。"
confusions = ["直径尺寸：前缀 Ø，尺寸线过圆心，常两端箭头", "球半径 SR：多一个 S，用于球面", "对称机件单箭头尺寸：只一端箭头但无 R，尺寸线越过对称线", "技术要求中的“未注圆角R2”：文字段落，不连尺寸线"]
related = ["DC-G4-041", "DC-G4-007", "DC-G4-013", "DC-G4-053", "DC-G4-030", "DC-G4-082", "DC-G4-068"]
priority = "high"
text_forms = ["R20", "R5", "R1.5", "R8±0.1"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
