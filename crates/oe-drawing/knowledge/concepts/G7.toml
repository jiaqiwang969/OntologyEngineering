[[concepts]]
id = "DC-G7-003"
name = "指定长度的边状态（粗点画线）"
aliases = []
group = "G7"
kind = "conventional_representation"
meaning = "当边的状态（未定义形状边的毛刺、侧凹要求）只针对一条边的某一段时，用与该边平行的粗点画线标出这一段并注出其长度，边状态要求只对这段有效；未注尺寸则该限定无效。"
components = ["粗点画线：沿轮廓边外侧、紧靠且平行于该边的一段粗点画线（GB/T 17450线型04的粗线），长度等于要求范围。", "尺寸：标注该段长度及其起点位置的普通尺寸。", "边状态符号：指向该边的未定义形状边符号，直角折线内注写+、−或±及数值。"]
variants = []
dxf_forms = ["LINE/LWPOLYLINE with dash-dot linetype (CENTER/DASHDOT/ACAD_ISO04W100) and thick lineweight (0.5–0.7 mm) on layer 06 (粗点画线), offset ~1 mm parallel to an outline edge", "linear DIMENSION entities giving the length and position of the dash-dot stretch", "edge-state symbol nearby: LEADER/LINE + right-angle knee + TEXT such as '+0.3' or '-0.2'"]
recognition = "锚点为与粗实线轮廓平行、偏距很小（约一个线宽到1 mm）、长度短于整条边的粗点画线段，两端有尺寸界线；同时在该边附近存在未定义形状边符号（直角折线，角内为带符号数值）。依靠配套标注区分：边状态符号→本概念；热处理文字或硬度→热处理区域；表面处理注语或表面结构符号→局部表面要求范围。"
confusions = ["热处理区域粗点画线：配有“淬火硬化”等文字和硬度、硬化深度值。", "局部表面处理或表面结构要求范围的粗点画线：配表面处理注语或表面结构符号。", "剖切线/剖切符号：剖切符号为短粗实线段加箭头和字母，不沿轮廓平行延伸。"]
related = ["DC-G7-061", "DC-G7-016", "DC-G7-021", "DC-G1-039", "DC-G4-060", "DC-G6-026", "DC-G1-005"]
priority = "rare"
