[[cards]]
id = "series_table"
expression_kind = "series_table"
title = "表格图"
meaning = "对结构相同、尺寸不同的一系列零件只画一组图形，变化的尺寸用字母代号代替数值，另附表格列出各变型的代号和对应尺寸。表格中的字母与图上尺寸的字母一一对应。"
sources = [
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 表2 5.16",
  "GB/T 13361-2012 技术制图 通用术语 6.5",
  "GB/T 24745-2009 技术产品文件 词汇 表4",
]
knowledge_units = ["K17", "K55"]
recognition = "找一张由细实线组成、至少两行两列的表格：表头的字母代号（一到两个字母，可带数字下标）与图上某些尺寸的字母标注相同（图上字母后可再注偏差，如 L 0/-0.5，也可加括号作参考尺寸），或表头有代号、型号、规格等词且下面各行是数值。表格的格线与文字成为一个表格图表达，并与这些尺寸相连。与标题栏区分：标题栏有栏目名词表；与公差框格区分：框格高度约为字高的两倍且第一格是特征符号。"
markers = ["代号", "型号", "规格"]
concepts = ["DC-G4-098"]

[[cards.components]]
role = "table_line"
primitives = ["LINE", "LWPOLYLINE"]
requirement = "表格的横线与竖线"

[[cards.components]]
role = "table_header"
primitives = ["TEXT", "MTEXT"]
requirement = "表头：代号词和尺寸字母"

[[cards.components]]
role = "table_value"
primitives = ["TEXT", "MTEXT"]
requirement = "各变型的代号与尺寸值"

[[cards.variants]]
id = "variables_named_by_dimensions"
title = "表头字母与图上尺寸字母相同"
distinguishing = "图上有以表头字母标注的尺寸"
encodings = ["loose"]
tests = ["series_table_links_its_variables_to_dimensions"]

[[cards.variants]]
id = "header_words_and_numeric_rows"
title = "表头有代号等词且各行为数值"
distinguishing = "图上未找到相同字母的尺寸"
encodings = ["loose"]
tests = ["series_table_with_header_words_and_values"]

[[cards.counter_examples]]
statement = "标题栏的格子不是表格图"
test = "title_block_grid_is_not_a_series_table"

[[cards.counter_examples]]
statement = "没有数值行的格子不是表格图"
test = "grid_without_values_is_not_a_series_table"

[[cards.parameters]]
name = "min_rows"
value = 2.0
meaning = "表头与数值行合计至少行数"

[[cards.parameters]]
name = "min_columns"
value = 2.0
meaning = "至少列数"

[[cards.parameters]]
name = "join_tolerance"
value = 0.05
meaning = "格线端点对齐的容差 = 该值 × 字高"

