[[concepts]]
id = "DC-G3-085"
name = "花键标记注法"
aliases = ["矩形花键标记"]
group = "G3"
kind = "dimension_element"
meaning = "花键采用标准标记时，标记注写在从大径引出的指引线基准线上，标记前为花键类型图形符号：矩形花键写键数×小径×大径×键宽及公差带代号和标准号，渐开线花键写INT/EXT、齿数、模数、齿形角与公差等级；花键副用分数形式表示内外花键公差带。"
components = ["指引线从花键大径处引出，末端基准线上写标记。", "图形符号：矩形花键或渐开线花键符号，位于标记最前。", "矩形花键：N×d×D×B，内花键公差带大写（如H7、H10、H11），外花键小写（如f7、a11、d10），后接标准号。", "渐开线花键：INT（内）或EXT（外）+齿数z+模数m+齿形角/齿根类型（30P、30R、45）+公差等级与配合类别+标准号。", "花键副：公差带写成内/外分数（如H7/f7、5H/5h、INT/EXT）；标记不能满足要求时用表格补充。"]
variants = ["矩形外/内花键", "渐开线外花键EXT", "渐开线内花键INT", "花键副INT/EXT", "标记不足时列表补充", "花键规格 N×d×D×B", "花键副：各尺寸写成内/外花键代号分数", "内花键（大写）", "外花键（小写）"]
dxf_forms = ["LEADER/MLEADER from the major-diameter line + TEXT/MTEXT on the landing", "The spline graphic symbol before the text as a small INSERT block, exploded LINEs, or a font glyph that may be lost in conversion (leaving a blank or '?')", "Fractions inline with '/' or stacked in MTEXT (\\SH7/f7;)", "Parameter table (LINE grid + TEXT) when the designation is incomplete"]
recognition = "锚点为指引线基准线上的文本：矩形花键匹配 ^\\d+\\s?[×xX]\\s?\\d+\\s?[A-Za-z]\\d+(/[a-z]\\d+)?\\s?[×xX]\\s?\\d+.*[×xX]\\s?\\d+（四项乘积，第一项为小整数键数6/8/10/16/20），常以GB/T 1144结尾；渐开线花键含INT或EXT并含z与m。文本前方常有小图形符号；指引线端点落在花键大径粗实线上，附近有大径粗、小径细（外花键）或大小径均粗（内花键）的线对。与螺纹标记区分：螺纹以M、Tr、G等开头；与平键标记区分：键标记含“键”且为三项尺寸；与孔轴配合代号区分：配合代号前只有一个Ø公称尺寸。"
confusions = ["螺纹标记：以特征代号M、Tr、G等开头。", "普通平键标记（键 8×7×28）：三项尺寸，含“键”字。", "孔轴配合代号（Ø30H7/f6）：单一公称尺寸加分数。", "渐开线与矩形花键标记互混：渐开线含INT/EXT与模数m。"]
related = ["DC-G3-039", "DC-G3-040", "DC-G3-031", "DC-G3-047", "DC-G3-086", "DC-G3-181", "DC-G3-186", "DC-G4-139", "DC-G3-222", "DC-G4-150"]
priority = "medium"
text_forms = ["6×23f7×26a11×6d10 GB/T 1144", "6×23H7×26H10×6H11 GB/T 1144", "6×23H7/f7×26H10/a11×6H11/d10 GB/T 1144", "INT 24z×2.5m×30R×5H GB/T 3478.1", "EXT 24z×2.5m×30P×5h", "INT/EXT 24z×2.5m×30R×5H/5h"]
knowledge_units = ["K13", "K35"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.3-2000 第6.2条（图13～图16，示例标准号为GB/T 1144-1987）；互换性教材6.2.2。渐开线花键标记格式按GB/T 3478.1的一般知识给出；花键副分数形式主要出现在装配图。"
