kind = "conventional_representation"
meaning = "回转零件上均匀分布的肋、轮辐、孔等结构不在剖切平面上时，可假想把它们旋转到剖切平面上画出，使剖视图对称，不加旋转标注。"
components = ["剖切平面：通过回转轴线的单一平面，剖切符号按单一剖切面标注或省略。", "旋转后的结构：在剖视中按真实大小画在剖切平面位置，如三个均布孔在轴线两侧各画一个。", "纵向剖到的肋和轮辐不画剖面线，用粗实线与相邻部分分开。", "另一视图中这些结构仍按真实角位置画出。"]
variants = []
dxf_forms = ["Section view LINE/HATCH geometry symmetric about the axis while the end-view CIRCLE centres are not symmetric about the cutting line", "No rotation arrow and no bent cutting-plane symbol (unlike an aligned section)"]
recognition = "锚点：回转件剖视图与端视图对照。端视图中均布要素（圆心在分布圆上、等角间隔、个数常为奇数如3、5）不落在剖切线上，而剖视中轴线两侧却对称地各出现一个该要素的剖面；剖切符号为一条直线、无转折。区分：旋转剖的剖切符号有转折并标注字母与箭头；真实投影时奇数分布要素在剖视中不对称或被缩短。"
confusions = ["旋转剖（几个相交剖切面）：剖切线有转折并标注。", "真实投影：要素按实际角位置投影，可能不对称或缩短。"]
