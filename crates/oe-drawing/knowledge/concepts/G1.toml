# Drafting concept catalogue, group G1: 图纸、图线与通用注写.
# One card per representation concept; paraphrased from the cited sources (page = physical page of the library copy).
schema = "oev2.drawing-concept-catalogue/1"
group = "G1"
label = "图纸、图线与通用注写"

[[concepts]]
id = "DC-G1-001"
name = "不可见棱边线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细虚线表示在该投射方向上被遮挡、看不见的棱边（两个面相交形成的边），用来交代背面或内部结构。"
components = ["线型为细虚线（No.02.1），线宽约为粗线的一半；画长约12d、间隔约3d，首尾以画开始和结束。", "位置与另一视图中对应的面交线按投影关系对齐，常表示孔底、内台阶、背面凸台的棱边。", "虚线为粗实线的延长时，粗实线画到分界点、虚线一侧留间隙；与其他线相交时在画上相交。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE with a dashed linetype (HIDDEN, HIDDEN2, DASHED, ACAD_ISO02W100 or a Chinese-named type such as 虚线), thin lineweight, layer 04 / 虚线 / HIDDEN, colour yellow (ACI 2)", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring", "visible dash length = LTYPE pattern × header $LTSCALE × entity linetype scale (group 48) (× $PSLTSCALE rules in paper space)"]
recognition = "锚点为虚线型实体（线型名含 HIDDEN/DASHED/ISO02/虚线，或在04层、黄色）。按线宽与粗虚线区分（细≈粗的1/2）。判为“棱边”的线索：虚线多为直线段，端点与其他棱边或轮廓相接成折线，在相邻视图中对应两个面的交线（另一视图该处为面的积聚线或折点）。二维上与不可见轮廓线同型，可先统一记为隐藏线，再借多视图对应判定是棱边还是曲面转向轮廓。同一位置若有粗实线或点画线，按重合优先顺序隐藏线会被省略，不能据缺失否定结构。"
confusions = ["不可见轮廓线：线型相同，区别在语义——棱边是两面交线，轮廓线是曲面在投射方向的转向线。", "粗虚线：线宽为粗线，平行贴近表面，表示允许表面处理的范围，不代表几何边。", "细点画线：带点（或短画）且长画约为虚线画长的2倍，表示轴线或对称线。"]
related = ["DC-G1-002", "DC-G1-045", "DC-G1-014", "DC-G1-055", "DC-G1-061"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55", "K39"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "线型与用途见 GB/T 4457.4 表1 02.1.1、GB/T 15751“隐线”；DXF 表示与识别线索为通用 CAD 实践。"
