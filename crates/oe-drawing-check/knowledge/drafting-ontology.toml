[cutting_identifiers]
concepts = ["DC-G2-043"]
source = "GB/T 4458.6-2002 6.1–6.4; GB/T 17452-1998 8.2"
composition = ["existing named cutting path", "end strokes and turn strokes", "same-letter TEXT near each position"]
variants = ["missing start", "missing end", "missing turn", "arrows omitted but letters required"]
