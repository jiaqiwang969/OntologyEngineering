recognition = "锚点为一个线性或对齐尺寸，两个定义点恰为同一 ARC 的两个端点（容差≈d），尺寸线平行于两端点连线，尺寸界线垂直于弦（即平行于过弧心的弦垂直平分线）。数值≈2R·sin(θ/2)×比例。与弧长尺寸区分：尺寸线为直线、无 ⌒、数值小于弧长；与普通线性尺寸区分：定义点在同一圆弧的两个端点上。"
