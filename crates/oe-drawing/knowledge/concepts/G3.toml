[[concepts]]
id = "DC-G3-091"
name = "倒角（C）"
aliases = ["倒角与倒圆"]
group = "G3"
kind = "dimension_symbol"
meaning = "零件棱边（轴端、孔口、台阶边）被切去的小斜面，用于去毛刺和便于装配。图上画成截去棱角的短斜线；45°倒角注成“C＋倒角宽度”，30°或60°等其他角度注长度和角度。"
components = ["视图：轮廓的直角被一条短斜线代替，斜线两端分别落在相邻两条轮廓线上；回转件在平行于轴线的视图中，倒角端点处另有一条垂直于轴线的粗实线。", "端视图：倒角在孔口或轴端形成同心的倒角圆（粗实线）；螺纹件的端视图中倒角圆省略。", "45°倒角：注“C”后接倒角宽度（如C1、C2），用指引线或尺寸线标注；数值按GB/T 6403.4系列（0.1～25）。", "非45°倒角：分别注出轴向长度与角度（如2×30°）。", "省略形式：小倒角可不画，在图上注C值或在技术要求中写“未注倒角C0.5”等；内外角配合时尺寸关系见装配型式。"]
variants = ["45°倒角：C+尺寸", "30°/60°倒角：长度×角度", "外角倒角", "内角倒角", "45°倒角", "30°/60°倒角", "倒圆", "装配型式（内外角配合）"]
dxf_forms = ["Short thick LINE (layer 01) cutting the corner at 45° (or 30°/60°); on a revolved part a thick LINE perpendicular to the axis at the chamfer end", "End view: thick CIRCLE concentric with the shaft/bore circles at diameter d±2C", "Leader + reference line with TEXT/MTEXT 'C1' (LEADER/QLEADER/MLEADER or LINE+TEXT); the leader is usually drawn along the 45° chamfer direction", "Linear DIMENSION with override 'C1', or length DIMENSION plus angular DIMENSION ('30%%d') for non-45° chamfers", "General note in the 技术要求 MTEXT: '未注倒角C0.5' / '全部倒角C1'", "CAXA/GstarCAD chamfer annotation objects exported as anonymous INSERT/DIMENSION blocks containing LINE + TEXT"]
recognition = "以文字为锚点：匹配C后接系列数值（C0.5、C1、C1.5…，可带n×前缀）的TEXT或尺寸覆盖文字；其指引线终点或尺寸界线应落在一条短斜线上，斜线长度约为√2×C（按图样比例），与两条相邻正交轮廓各成45°，两端点分别位于这两条轮廓线上；回转件中斜线端点处常伴一条垂直轴线、长度为(d−2C)的粗实线。非45°倒角以角度尺寸（30%%d/60%%d）配长度尺寸识别。区分倒圆：倒圆是与两轮廓相切的ARC，文字以R开头；区分锥面：斜面长度远大于C系列值并注锥度或角度；区分螺纹末端倒角：牙底细实线延伸进该倒角；字母C也可能是剖视名称C—C或C型中心孔标记，必须用几何关系确认。"
confusions = ["倒圆R：轮廓为相切圆弧，标注以R开头。", "锥面或锥度：斜面较长，注锥度符号或角度。", "螺纹末端倒角：牙底细实线穿入倒角，属螺纹画法的一部分。", "铸造圆角：非加工处的小圆弧。", "剖视名称C—C、C型中心孔标记中的字母C：无45°短斜线对应。"]
related = ["DC-G3-080", "DC-G3-004", "DC-G3-054", "DC-G3-210", "DC-G4-040", "DC-G4-037", "DC-G4-081", "DC-G4-068", "DC-G1-070", "DC-G9-003"]
priority = "high"
text_forms = ["C1", "C0.5", "2×C1", "1.5×30°", "1×45°", "未注倒角C0.5", "全部倒角C1"]
knowledge_units = ["K13", "K39"]
recognition_cards = ["dimension_text"]
recognizer = "card"
