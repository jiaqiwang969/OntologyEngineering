[[concepts]]
id = "DC-G6-033"
name = "纹理方向与评定方向的相交平面指示符"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "附在表面结构符号上的小框格，内含方向符号和基准字母（同GB/T 1182的相交平面框格），用来相对于工件某要素（而非投影面）确定纹理方向和/或评定方向，主要用于三维标注。"
components = ["区域法（GB/T 33523.1）：位置c放评定区域方向的相交平面指示符，位置f放纹理方向的相交平面指示符。", "附录D三种情况：只有指示符（定评定区域方向）；纹理符号加一个指示符（同时定两者）；纹理符号加两个指示符（上方定纹理、下方定评定区域，可用不同基准）。", "ISO 21920-1草案：9.4.3相对工件特征的纹理方向，9.5.3相对工件特征的轮廓方向，同样用相交平面框加基准字母。", "框格左格为方向符号（如平行、垂直），右格为基准字母，形式同GB/T 1182。"]
