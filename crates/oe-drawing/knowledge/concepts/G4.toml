recognition = "锚点：纯数字TEXT，其旋转角与邻近某条LINE方向一致（差<5°），文字中心到该线的垂距约0.5–1h，且位于线段长度的中部；周围找不到尺寸线、尺寸界线和箭头。检验数值≈线段长度/比例。角度数值位于两相交线之间的扇区内靠近交点，数值≈两线夹角。与管线编号、构件代号区分：后者通常含字母、在圆圈或方框内，且与线长不成比例。"
confusions = ["管线编号、构件代号：含字母或带圈，与线长无比例关系", "线性尺寸：有尺寸线、尺寸界线和箭头", "焊缝或钢筋标注中的数量文字：带乘号或符号"]
