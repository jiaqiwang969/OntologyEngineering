[[concepts]]
id = "DC-G4-136"
name = "独立原则（不加符号）"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "独立原则：图上给出的尺寸公差与几何公差各自独立、分别满足，是两者关系的基本原则；图上不加任何相关要求符号（无Ⓔ、Ⓜ、Ⓛ、Ⓡ）即表示按独立原则解释。"
components = ["尺寸公差：照常以偏差、公差带代号或±注出，后面不带Ⓔ", "几何公差框格：单独注出，公差值后不带Ⓜ、Ⓛ等", "含义：局部尺寸只受尺寸公差控制，形状/位置误差只受几何公差控制", "未注公差：未注尺寸公差与未注几何公差也按独立原则"]
variants = ["尺寸偏差+单独几何公差框格"]
dxf_forms = ["no dedicated entity; recognised from the absence of Ⓔ/Ⓜ/Ⓛ/Ⓡ in DIMENSION texts and TOLERANCE frames", "ordinary DIMENSION with deviations + separate TOLERANCE entity or exploded frame"]
recognition = "这是解释规则而非图形对象。对每个带公差的尺寸，检查其文字及相关几何公差框格中是否含Ⓔ（圈E）、Ⓜ、Ⓛ、Ⓡ（含Unicode带圈字母、小圆+字母组合或gdt字体字母）；均无则标注为独立原则。注意旧图可能按2009版默认泰勒原则理解，需结合图纸年代与技术要求中的说明（如“遵守包容要求”）判断。"
confusions = ["包容要求：尺寸后有Ⓔ，或技术要求中整体声明", "最大实体要求Ⓜ、最小实体要求Ⓛ：在几何公差值或基准字母后", "旧习惯：GB/T 1800.1-2009以前公差带代号默认包容（泰勒原则），图上同样无符号"]
related = ["DC-G4-115", "DC-G5-065", "DC-G5-075", "DC-G4-070", "DC-G5-025"]
priority = "medium"
text_forms = ["Ø20 0/-0.03 与 —Ø0.02 直线度框格（无Ⓔ、Ⓜ）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K28"]
recognition_cards = []
recognizer = "none"
