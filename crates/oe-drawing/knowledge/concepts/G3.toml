name = "小螺纹标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "小螺纹（公称直径很小的精密螺纹）的标记，以特征代号S加公称直径，后接中径公差带和顶径公差等级，必要时注左旋。"
components = ["特征代号S后接公称直径（毫米，小于1.4 mm，如0.8、1.2）。", "公差段：中径公差带（等级数字+偏差字母）与顶径公差等级（仅数字）连写，与直径之间空一格，如内螺纹4H5、外螺纹5h3。", "左旋LH写在直径之后、公差之前，如S1.2 LH5h3。", "螺纹副用斜线分隔内外，如S0.9 4H5/5h3。"]
variants = ["内螺纹4H5", "外螺纹5h3"]
dxf_forms = ["DIMENSION override text on the major-diameter dimension, or TEXT on a LEADER (layers 08/09/11)", "Very small text near a magnified detail view, since the feature itself is tiny"]
recognition = "锚点为文字正则 ^S\\s?\\d?\\.\\d+\\s?(LH)?\\s?\\d[A-Za-z]\\d(/\\d[a-z]\\d)?$；直径值应小于1.4，公差段为“数字+字母+数字”三字符。位于大径尺寸线或引线上。若S出现在M螺纹标记末尾的“-”之后，则是旋合长度代号而非小螺纹。"
confusions = ["普通螺纹旋合长度代号S：在M标记末尾“-S”，不在开头。", "球面符号SØ、SR：S后紧跟Ø或R。", "普通螺纹公差带：小螺纹顶径只有等级数字（4H5中的5），普通螺纹顶径为完整公差带（5g6g）。"]
