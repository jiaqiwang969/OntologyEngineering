[[concepts]]
id = "DC-G1-031"
name = "毛坯图中制成品的轮廓线"
aliases = []
group = "G1"
kind = "line"
meaning = "在毛坯（铸件、锻件）图上用细双点画线画出加工完成后零件的轮廓，显示加工余量的分布。"
components = ["细双点画线（No.05.1.7），画在毛坯粗实线轮廓的内侧。", "两轮廓之间的距离即加工余量，可注余量尺寸。", "反之，零件图中也可用细双点画线表示毛坯外形。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE with a double-dot linetype (PHANTOM, PHANTOM2, DIVIDE, ACAD_ISO05W100 or e.g. 双点画线), thin lineweight, layer 07 / 双点画线, colour magenta/pink (ACI 6)", "PHANTOM outline offset inward from the thick blank outline by the machining allowance", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：在粗实线闭合外形内部，有一组与之大部分平行、偏移量小且近似恒定（如1~5 mm）的双点画线外形；图名或标题栏常含“毛坯”“锻件图”“铸件图”。"
