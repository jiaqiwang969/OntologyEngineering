[[concepts]]
id = "DC-G4-019"
name = "尺寸线终端—实心箭头"
aliases = ["尺寸线终端—箭头", "尺寸线终端箭头"]
group = "G4"
kind = "dimension_element"
meaning = "机械图样最常用的尺寸线终端：瘦长的实心闭合三角形，尖端与尺寸界线接触；圆的直径、圆弧半径和角度尺寸的终端必须用箭头。在 CAD 制图中是首选终端，同一图样一般只用一种终端形式。"
components = ["形状：瘦长三角形并填满，长度≥6d（d 为粗实线宽度），尾宽约 d（GB/T 4458.4 图9）", "位置：尖端恰好触到尺寸界线，不超出也不留缝；通常在界线内侧，空间不足时外置", "适用：各类图样；直径、半径、角度尺寸必须用箭头", "CAD 标准：GB/T 14665-2012 与 GB/T 18229-2000 均把实心箭头列为首选"]
variants = ["filled closed arrow (mechanical default)", "single-sided half arrow (simplified, see 单边箭头)", "单边箭头（简化注法）", "小圆点代替箭头（小尺寸）"]
dxf_forms = ["inside the DIMENSION block *Dn: SOLID (3–4 vertices) — default closed-filled arrow (DIMBLK empty or _CLOSEDFILLED), size DIMASZ (typ. 3–4 mm × scale)", "exploded: SOLID on layer 08, or LWPOLYLINE segment with start width ≈ arrow width and end width 0, or HATCH SOLID in a closed triangle", "LEADER/MULTILEADER arrows use the same shape but belong to the leader (layer 09)", "CAXA exports: arrows frequently exploded into SOLID or tapered LWPOLYLINE (uncertain)"]
recognition = "锚点为填充三角形（SOLID、渐变宽度多段线或实心 HATCH）：长约 2.5~4mm×比例（≥6d），宽约长度的1/3~1/4，轴线与一条细实线（尺寸线）共线，尖端落在另一条近似垂直的细实线（尺寸界线）或轮廓、圆弧上，尾端接尺寸线。两个箭头尖对尖分处同一尺寸线两端、中间有数字→线性尺寸。与指引线箭头区分：指引线另一端接水平基准线和注释，没有配对箭头；与视图/剖切方向箭头区分：后者明显更大、旁有大写字母；与基准三角形区分：基准三角宽底、底边贴在要素上并连字母方框；与开口、空心箭头区分：有无填充。"
confusions = ["开口箭头：两条短斜线，不填充", "空心箭头：闭合三角形但不填充", "指引线箭头：连接基准线和注释", "斜线终端：45°短斜线", "视图方向或剖切方向箭头：更大，旁注字母", "基准三角形：宽底三角，连基准字母方框"]
related = ["DC-G4-020", "DC-G4-022", "DC-G4-021", "DC-G4-018", "DC-G4-008", "DC-G4-059", "DC-G1-096"]
priority = "high"
