expert_checked = false
notes = "笔画依据GB/T 4460-2013与GB/T 4460-1984页面图像核对，OCR只识别出条号和名称。2013版将往复运动独立为4.9，单向运动保留在4.8。DXF存储形式、图层号与相对尺寸为一般CAD/制图实践的估计，并非标准规定。"
