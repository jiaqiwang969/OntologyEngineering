[[concepts]]
id = "DC-G4-037"
name = "非45°倒角的注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "非45°的倒角不能用C简注，应分别注出倒角的轴向长度（线性尺寸）和倒角斜面与轴线或轮廓的夹角（角度尺寸），如1.6与30°。"
components = ["倒角图形：轴端或孔口的一段短斜线（粗实线），与相邻轮廓成非45°角，另有一条表示倒角边界的直线。", "长度尺寸：倒角轴向长度的线性尺寸，空间小时箭头外置、数字外移（图32中的1.6）。", "角度尺寸：斜面与轴向轮廓之间的角度，用圆弧尺寸线注出，数字水平（图32中的30°）。", "两个尺寸共同确定一个倒角，不出现字母C。"]
variants = ["length + angle dimensions"]
dxf_forms = ["DIMENSION dimtype 0 (linear) for the chamfer length, arrows placed outside", "DIMENSION dimtype 2/5 (angular) for the chamfer angle, text '30%%d'", "exploded LINE/ARC/SOLID/TEXT pieces", "layer 08 or template dimension layer"]
recognition = "锚点为短斜线轮廓：长度远小于相邻轮廓（常小于2–3h），两端分别在端面线与外圆/孔轮廓上，与轴线夹角不等于45°（如30°、60°、15°）。在其附近匹配一个小线性尺寸（两界线落在斜线两端点的轴向位置）和一个角度尺寸（顶点在斜线与轮廓线的交点）。若角度为45°通常改用C注法；若斜段较长并带∠或▷符号则为斜度或锥度。"
confusions = ["45°倒角C注法：只写Cn，无角度尺寸。", "旧写法n×45°：角度固定为45°，写在一条指引线上。", "小锥度/斜度：斜面较长，标▷1:x或∠1:x。", "埋头孔锥面：用⌵ØD×90°旁注，不分开注长度。"]
related = ["DC-G4-040", "DC-G4-032", "DC-G4-081", "DC-G3-091", "DC-G4-016"]
priority = "medium"
text_forms = ["1.6", "30°", "15°"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 4458.4-2003 5.9 图32 (page image shows 1.6 with 30° on a hole and on a shaft end). DXF forms are general practice."
