[[concepts]]
id = "DC-G7-036"
name = "焊缝图形符号的比例与位置"
aliases = []
group = "G7"
kind = "other"
meaning = "焊缝图形符号的作图比例与定位规则：以符号笔画宽度d'（=字高h的1/10）为单位，从基准点O沿X轴（定向线）在基准线实线上绘制，符号高约10d'，虚线在实线下方约3d'处；焊缝符号的线宽和字体应与同图其他符号（尺寸、表面结构、几何公差）一致，符号与基准线线宽接近时允许加粗符号。"
components = ["单位：d'＝焊缝图形符号的线宽和字体笔画宽度＝h/10；b'为细实线线宽。", "非对称符号（图12）：符号立在实线上，虚线距实线约3d'，虚线划长约9d'、间隔约3d'。", "对称符号（图13）：符号跨基准线上下对称，不画虚线。", "符号高度：约10d'，即约等于字高h。", "加粗：符号线宽与基准线接近时允许加粗符号。"]
variants = ["asymmetric symbol on double reference line (图12)", "symmetric symbol on single line (图13)", "thickened symbol stroke"]
dxf_forms = ["symbol strokes as LWPOLYLINE with constant width = h/10 (or lineweight) while reference lines use the thin lineweight", "dashed reference LINE with linetype scale tuned so dash ≈ 0.9h and gap ≈ 0.3h", "in user blocks the block is often defined at h = 1 or h = 3.5 and scaled by INSERT scale factors"]
recognition = "用于从几何反推字高和校验符号：测量基准线上符号高度H，估计h≈H；虚线与实线间距≈0.3h、符号笔画宽≈0.1h；同图尺寸数字高度应≈h。若某疑似焊缝符号的高度与同图尺寸字高相差超过一倍，应降低置信度。"
