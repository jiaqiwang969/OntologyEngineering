[[concepts]]
id = "DC-G9-014"
name = "零件图的组成"
aliases = []
group = "G9"
kind = "other"
meaning = "一张完整的零件图包含四项内容：一组视图（视图、剖视、断面、局部放大图等）完整清晰地表达零件结构；完整的尺寸；技术要求（符号、代号、标记和简要文字）；填写完整的标题栏。"
components = ["一组视图：主视图加必要的其他视图、剖视图、断面图和局部放大图。", "完整的尺寸：制造和检验需要的全部尺寸，正确、完整、清晰、合理。", "技术要求：表面结构、尺寸公差、几何公差、热处理、表面处理等，一部分用符号注在图上，一部分写在“技术要求”文字中。", "标题栏：单位名称、图名、材料、质量、比例、图号及签名和日期。"]
variants = []
dxf_forms = ["composite: view geometry on layers 01/02/04/05/10, DIMENSION entities, tolerance and roughness symbol INSERTs, 技术要求 MTEXT, frame and title-block INSERT"]
recognition = "判定零件图：标题栏材料栏填有材料牌号；图上没有明细栏和带圆点指引线的零件序号；尺寸以单个零件的定形、定位尺寸为主，公差带代号是单个的（如Ø14c11），而不是孔轴配合形式（H7/g6）。四项内容可作为完整性检查；没有技术要求文字块不一定是缺陷（要求可能全用符号表达）。"
confusions = ["装配图的组成：有明细栏和序号，尺寸只注必要的几类。", "表格图或系列零件图：零件图加参数表，多个变型共用一张图。"]
