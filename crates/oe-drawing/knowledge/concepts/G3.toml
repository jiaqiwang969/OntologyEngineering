[[concepts]]
id = "DC-G3-003"
name = "中心孔规定表示法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "对已有标准规定的中心孔，图上不画其详细结构，只在轴端面与轴线相交处画出表示保留要求的符号，并用引出线注出中心孔标记；需要时标准编号可另起一行写在基准线下方。"
components = ["要求符号：画在轴端面轴线处，分要求保留、可以保留（不画符号）、不允许保留三种，形状见中心孔符号卡。", "引出线与基准线：由端面轴线处引出的细实线，水平基准线上写标记，如 GB/T 4459.5-B2.5/8。", "标准编号另行注写：标记中的型式与尺寸写在基准线上方，标准编号写在下方（5.1.2）。", "可在同一引出线上加注中心孔工作面的表面粗糙度及基准代号。"]
variants = ["标记写在基准线上", "标准编号另起一行（图1、图2）"]
dxf_forms = ["Leader (LEADER/MLEADER or LINE + short horizontal LINE) on layer 09/引出线 starting at the axis on the end face", "TEXT/MTEXT on the reference line: 'GB/T 4459.5-A4/8.5' or 'B2.5/8' above and 'GB/T 4459.5' below", "Requirement symbol as small exploded LINE strokes or an INSERT of a symbol block at the leader start", "Often combined with a surface-texture symbol INSERT and datum letter on the same leader"]
recognition = "锚点：以轴端面与轴线交点为起点的引出线，其文字匹配正则 (GB/T\\s*4459\\.5-)?[RABC]\\d+(\\.\\d+)?/\\d+(\\.\\d+)? 或 CM\\d+L\\d+/…；起点附近可有小的V形/叉形要求符号（尺寸约为字高h的1–1.5倍）。端面处不画60°锥孔轮廓。区分：倒角C标注写在倒角斜线引出线上且文字为C+数字；孔的完整画法会出现锥面与小圆柱孔轮廓线。"
confusions = ["中心孔完整画法：画出60°锥面和导向孔轮廓，不用标记。", "倒角注法：引出线指向倒角斜线，文字为C1等。", "孔的旁注：Ø+深度符号，而非R/A/B型标记。"]
related = ["DC-G3-105", "DC-G3-144", "DC-G3-218", "DC-G3-209", "DC-G1-028", "DC-G1-018"]
priority = "medium"
text_forms = ["GB/T 4459.5-B2.5/8", "GB/T 4459.5-A4/8.5", "GB/T 4459.5-R3.15/6.7", "GB/T 4459.5-CM10L30/16.3", "B3.15/10"]
knowledge_units = ["K13", "K39"]
recognition_cards = ["center_hole_symbol"]
recognizer = "partial"
seen_on_drawing = ["second"]
expert_checked = false
notes = "An existing recognition card (center_hole_symbol) is linked; seen on the second drawing. Symbol glyph shapes are described in the centre-hole symbol card of G3b."
[[concepts.sources]]
document = "GB/T 4459.5-1999"
clause = "5.1.1、5.1.2"
page = 6

[[concepts]]
id = "DC-G3-004"
name = "内外角倒圆倒角装配型式"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "轴肩等相配处，一个零件的内角（凹角）与相配零件的外角（凸角）分别做倒圆或倒角，并按规定关系取值，使两者不干涉、端面能贴紧。"
components = ["内角：轴肩根部的凹角，倒圆R或45°倒角C，偏差取负。", "外角：相配孔口或另一零件边缘的凸角，倒圆R1或倒角C1，偏差取正。", "四种组合关系：内倒圆外倒角 C1>R；内外均倒圆 R1>R；内倒角外倒圆 C<0.58R1；内外均倒角 C1>C。", "装配图中两零件端面贴合为一条粗实线，转角处内外角轮廓不相交，留出小空隙。"]
variants = ["内角倒圆、外角倒角", "内角倒圆、外角倒圆", "内角倒角、外角倒圆", "内角倒角、外角倒角"]
dxf_forms = ["Tangent ARC (fillet) or short 45° LINE (chamfer) on the thick layer at the shoulder root of one part and at the mating hole edge of the other", "Size by leader TEXT/MTEXT 'R1' / 'C1' or a radial DIMENSION; frequently only given in 技术要求 as an unspecified-chamfer note", "In assembly drawings these small corners are often omitted (simplified), leaving only the contact LINE"]
recognition = "锚点：装配视图中两零件端面重合的粗实线（接触面单线）；在其靠近轴线一端的转角处，一侧为凹角圆弧/斜线（内角），另一侧为凸角圆弧/斜线（外角），两轮廓之间留有三角或月牙形空隙。可用 C1>R、R1>R、C<0.58R1、C1>C 核对外角是否足够大。区分：退刀槽是深入轴径的矩形或圆角槽；零件间隙为沿整个面延伸的两条平行线。"
confusions = ["退刀槽、越程槽：在轴径上切出有宽度和深度的槽，而非转角处的小圆角。", "非接触面双线（零件间隙）：沿整段配合面平行延伸。", "单个零件上的倒角/倒圆：没有相配的另一零件角部。"]
related = ["DC-G3-080", "DC-G3-091", "DC-G3-210", "DC-G4-040", "DC-G4-041", "DC-G8-005", "DC-G3-057", "DC-G3-041"]
priority = "medium"
text_forms = ["R1", "C1", "R0.5", "C1.5"]
knowledge_units = ["K13", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Catalogue component text says the outer fillet is smaller than the inner fillet; the standard page (GB/T 6403.4-2008 §5.2, subscript 1 = outer corner per §4) reads R1>R, i.e. the outer fillet must be larger. The card follows the standard. 0.58 matches the geometry 0.707C<0.414R1. Subscripts are read from OCR and should be checked against figure 2."
[[concepts.sources]]
document = "GB/T 6403.4-2008"
clause = "4、5 图2"
page = 4

[[concepts]]
id = "DC-G3-005"
name = "内螺纹画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "螺孔（内螺纹）在平行于轴线的剖视中牙顶（小径）画粗实线、牙底（大径）画细实线，剖面线画到粗实线；在端视图中小径为粗实线圆，大径为约3/4圈的细实线圆，倒角圆不画。"
components = ["小径线：剖视中轴线两侧的一对粗实线，即孔的可见轮廓。", "大径线：小径外侧约0.075d处的一对细实线（小径≈0.85d）。", "螺纹终止线：粗实线，垂直于轴线并横跨到大径；盲孔时位于螺纹深度处。", "剖面线：越过细实线区域一直画到小径粗实线。", "端视图：小径粗实线整圆，大径约3/4圈细实线圆弧（缺口位置不限），孔口倒角圆省略；不可见时全部改为虚线。"]
variants = ["剖视（常用）", "端视图大径约3/4圈细实线", "通孔螺孔", "不可见时全部虚线"]
dxf_forms = ["Section: thick LINE pair (minor diameter, 层01), thin LINE pair (major diameter, 层02), thick perpendicular LINE for the thread end", "HATCH ANSI31 45° (层10) bounded by the thick minor-diameter LINEs; the thin major LINEs lie inside the hatch area", "End view: thick CIRCLE + concentric thin ARC with included angle ≈270° (start angle arbitrary), thin arc outside the thick circle", "Thread designation as DIMENSION (diameter/linear) with override text 'M10-6H' or leader + MTEXT", "Mechanical add-on hole/thread objects may come as an INSERT or exploded grouped strokes; the 3/4 arc may also be a LWPOLYLINE with a bulge segment"]
recognition = "端视图锚点：同心的粗实线整圆加细实线圆弧（圆心角约250°–290°），且细弧半径≈粗圆半径/0.85（细弧在外）→内螺纹。剖视锚点：孔轴线两侧粗实线对之外约0.075d各有一条平行细实线，剖面线越过细线止于粗线；若有横跨的粗实线终止线和120°锥顶即为不穿通螺孔。区分：外螺纹端视图细弧在内；光孔加倒角为两个粗实线整圆；矩形内花键大小径都是粗实线。"
confusions = ["外螺纹端视图：粗圆在外、3/4细弧在内。", "光孔加倒角：同心两整圆，外圆为粗实线倒角圆。", "矩形内花键：大径与小径都画粗实线，并有齿形局部视图。", "光孔：没有细实线大径。"]
related = ["DC-G3-024", "DC-G3-001", "DC-G3-002", "DC-G3-094", "DC-G3-056", "DC-G3-088", "DC-G3-039", "DC-G3-051", "DC-G1-048", "DC-G1-049", "DC-G2-061"]
priority = "high"
text_forms = ["M10-6H", "M16×1.5-6H", "2×M8-6H", "M12-7H-LH"]
knowledge_units = ["K13", "K34"]
recognition_cards = ["thread_representation"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "The 0.85d minor diameter is the usual drawing proportion, not an exact thread value. Layer numbers follow GB/T 14665-2012 Table 6; real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线) or CAXA layer names, so recognition should rely on linetype, lineweight and geometry rather than layer names (general practice)."
