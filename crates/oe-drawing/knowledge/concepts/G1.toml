[[concepts]]
id = "DC-G1-029"
name = "断裂处边界线（视图与剖视图的分界线）"
aliases = []
group = "G1"
kind = "line"
meaning = "机件断开（断裂画法、断开缩短）处的边界线，或局部剖视中剖开部分与未剖部分的分界线，用波浪线或双折线绘制。"
components = ["波浪线：徒手连续曲线，画到轮廓线为止，只画在实体上，不穿过孔、槽等中空处，不超出轮廓。", "双折线：带Z形折的细实线，两端略超出轮廓，适合较长的直线边界。", "同一张图样一般只用其中一种；GB/T 4458.1 还允许断裂边界用细双点画线。", "断开缩短画法中尺寸仍按实际长度标注。"]
variants = ["波浪线", "双折线"]
dxf_forms = ["SPLINE (fit or control points) or LWPOLYLINE with many short segments/bulges for the freehand wavy line", "LWPOLYLINE zigzag for the double-break line; thin layer 02, green", "in local sections the wavy line often doubles as an edge of the HATCH boundary path", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：细实线中“非规则”的曲线（SPLINE 或多段折线，无明显直线/圆弧结构）或Z形折线。判据：两端落在同一零件的轮廓线上（波浪线）或略超出（双折线）；一侧有 HATCH（局部剖），或两条成对、之间轮廓缺失（断开缩短）；常与 HATCH 边界共享几何。与相贯线（粗实线、端点在两立体轮廓交点、形状规则）区分。"
confusions = ["折断线与轮廓线相交处：断裂线应止于轮廓，不应与轮廓重合或画在其延长线上。", "相贯线：粗实线规则曲线。", "中断线：细双点画线。"]
related = ["DC-G1-032", "DC-G1-011", "DC-G1-004", "DC-G2-023", "DC-G2-041", "DC-G3-117"]
priority = "high"
