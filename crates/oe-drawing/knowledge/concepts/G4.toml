[[concepts]]
id = "DC-G4-060"
name = "限定部分的粗点画线"
aliases = []
group = "G4"
kind = "line"
meaning = "在尺寸要素旁画粗点画线，指出该尺寸规范只适用于要素的某一固定限定部分，其起止位置和长度由理论正确尺寸确定（GB/T 38762.1 7.2）。"
components = ["粗点画线：宽而长的点画线，平行并靠近被限定的表面轮廓，长度等于限定部分", "尺寸：在限定部分上标注尺寸线及尺寸规范，如Ø20±0.1", "定位：用方框理论正确尺寸给出粗点画线的起点和长度", "等效写法：在公差后用两个字母和区间符号'←→'表示同一限定部分（如A↔B）"]
variants = []
dxf_forms = ["LINE or LWPOLYLINE with a long-dash-dot linetype (CENTER / ACAD_ISO04W100) and thick lineweight, on layer 06 (粗点画线) or a template layer", "LWPOLYLINE with constant width approximating the wide line", "boxed TED dimensions: DIMENSION with DIMGAP<0 (text frame) or TEXT + rectangle LWPOLYLINE"]
recognition = "锚点为线型为点画线、线宽约等于粗实线d的短线段，与某轮廓线平行、相距约1~2倍线宽，长度短于该轮廓；其端点或长度由方框尺寸（TED）定位，旁边的尺寸线落在该段范围内。与中心线区分：中心线是细点画线、沿对称轴贯穿；与表面结构或热处理范围的粗点画线区分：后者附近为Ra值、热处理文字（HRC、淬火等），而此处附近是尺寸公差和TED；与剖切符号区分：剖切符号为粗短画加箭头和字母。"
confusions = ["细点画线中心线：线细，沿轴线贯穿", "表面结构或热处理限定范围的粗点画线：所附注写是Ra或热处理要求", "剖切符号：粗短画+箭头+字母", "区间符号'←→'：用文字方式表达同一限定部分"]
related = ["DC-G1-039", "DC-G4-116", "DC-G4-029", "DC-G4-110", "DC-G6-026", "DC-G7-021"]
priority = "rare"
text_forms = ["Ø20±0.1 A↔B"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
