[[concepts]]
id = "DC-G4-029"
name = "理论正确尺寸（方框）"
aliases = ["理论正确尺寸（TED）", "理论正确尺寸"]
group = "G4"
kind = "dimension_element"
meaning = "理论正确尺寸（TED）是确定要素或公差带的理论正确位置、方向或轮廓的线性或角度尺寸；数值用矩形方框框住，本身不带公差，也不受一般公差约束，实际变动由相应的几何公差（位置度、轮廓度、倾斜度等）控制。"
components = ["尺寸线、尺寸界线和终端与普通尺寸相同（细实线、箭头）。", "数值外加细实线矩形框，框内只有公称值（线性如30、40，或角度如60°），不得带偏差或公差带代号。", "缺省TED可不注：点/线要素在基准轴线或基准平面上时的0 mm，成组要素及公差带与基准间的0°、90°；圆锥公差标准2025版还列出180°、270°。", "通常与公差框格及基准字母同时出现；2025版圆锥标准允许把部分圆锥尺寸定义为TED。", "可在标题栏附近注明TED取自CAD公称模型；延伸公差带的延伸长度也作为TED并冠以Ⓟ。"]
variants = ["boxed linear value", "boxed angle", "implied TEDs 0 mm / 0° / 90° omitted", "linear TED", "angular TED", "with Ⓟ prefix for projected length", "线性理论正确尺寸", "理论正确角度"]
dxf_forms = ["DIMENSION entity with DIMGAP < 0 (dimension style or DSTYLE override in XDATA 'ACAD') so the text is drawn inside a box; the *Dn block then holds 4 LINE or a closed polyline around the MTEXT", "exploded: TEXT/MTEXT number enclosed by a closed LWPOLYLINE (4 vertices) or 4 LINE, frame height ≈1.5–2h, no tolerance text", "angular DIMENSION (dimtype 2/5) with boxed text '60%%d'", "CAXA/GstarCAD 'basic dimension' option exported as DIMENSION with negative DIMGAP or as text+frame block (uncertain)", "layer 08 or template dimension layer"]
recognition = "锚点为尺寸文字（DIMENSION测量值或纯数字/角度TEXT）。检查其包围盒外是否有闭合矩形：DIMGAP<0，或四条细线/闭合多段线与文字包围盒四边间距约0.2–0.5h，且框只含一格。框内只能有单一数值（可带°，可前置Ⓟ），不能有±、上下偏差或公差带代号。上下文佐证：同一视图通常有多格公差框格（位置度、轮廓度等）和基准符号。排除：公差框格是多格且首格为几何特征符号；基准要素标识方框内是单个大写字母并连三角形；正方形符号□边长≈h、位于数字左侧而不包围数字；参考尺寸用圆括号。"
confusions = ["公差框格：多格矩形，内含几何特征符号、公差值和基准字母；TED框只有一格且只框数值。", "基准要素标识：方框内是单个大写字母，并用细线连到三角形。", "正方形符号□：小方块位于数字左侧，不包围数字。", "参考尺寸：数值加圆括号，同样不带公差，但只作参考，不定义公差带位置。", "检验尺寸（框两端为半圆）：框端形状不同，表示需检验的尺寸。", "基准目标框：分成上下两半的圆，内为目标尺寸和编号。", "普通尺寸：无框，受一般公差或自带偏差。"]
related = ["DC-G5-090", "DC-G5-041", "DC-G5-082", "DC-G5-021", "DC-G5-062", "DC-G4-009", "DC-G4-061"]
priority = "medium"
text_forms = ["30（矩形框内）", "40（矩形框内）", "60°（矩形框内）", "Ⓟ 25（延伸长度框注）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = ["second"]
expert_checked = false
notes = "OCR loses the frames; framed form per GB/T 1182-2018 第10章 and its figures. Default TEDs 0 mm/0°/90° from GB/T 1182 B.3; 180°/270° from GB/T 15754-2025 第6章; GB/T 1804 excludes boxed values from general tolerances. DIMGAP<0 and exploded-frame cues are general AutoCAD practice; the Ⓟ form is from the catalogue record, not re-checked against a figure. Seen on one project drawing."
