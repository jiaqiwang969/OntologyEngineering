[[concepts]]
id = "DC-G1-117"
name = "长仿宋体汉字"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "图样中的汉字应写成长仿宋体，采用国家正式推行的简化字，高度不小于3.5 mm，字宽约 h/√2；CAD 图中标注、标题栏、明细栏用长仿宋体，大标题、封面等可用其他字体。"
components = ["字形：长仿宋体，简化字，宽高比约0.7（h/√2）。", "字高不小于3.5 mm，常用10、7、5、3.5号。", "CAD（GB/T 18229 表6）：长仿宋体用于图中标注及说明、标题栏、明细栏；单线宋体、宋体、仿宋体、楷体、黑体用于大标题、小标题、封面、目录、单位名称、图样名称等。"]
variants = ["长仿宋体（图中标注、标题栏、明细栏）", "单线宋体/宋体/仿宋体/楷体/黑体（大标题、封面、单位名称）", "10号、7号、5号、3.5号字"]
dxf_forms = ["STYLE with big font gbcbig.shx (plus gbenor/gbeitc), or TrueType 仿宋_GB2312 / 仿宋 / FangSong with width factor (41) about 0.7", "legacy font files named HZCF (长仿宋), HZDX, HZST, HZFS, HZKT, HZHT (GB/T 18229 表6)", "MTEXT inline font codes such as \\f仿宋_GB2312|b0|i0|c134|p49;"]
recognition = "文字样式宽度因子约0.7、字体为仿宋或 gbcbig 等可判为长仿宋体；字形本身对 DXF 识别不重要，重要的是汉字内容与字高。汉字高度不小于3.5 mm，可帮助区分汉字说明与小号的字母数字（如偏差）。"
confusions = ["非标准字体：宋体正文、手写体等，不符合规定但内容可读。", "其他字体的说明文字：大标题、单位名称可用宋体、黑体等。"]
related = ["DC-G1-106", "DC-G1-103", "DC-G1-102", "DC-G1-107"]
