[[concepts]]
id = "DC-G3-047"
name = "花键联结画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "装配图中用剖视表示花键联结时，内外花键相互配合的部分按外花键的画法绘制。"
components = ["联结段：花键轴不剖，大径粗实线、小径细实线，与外花键画法相同；轮毂剖面线画到花键轴的大径线。", "联结段以外，轴与轮毂各自按自己的画法表示。", "横断面（如A-A）中内外花键齿相互嵌合，两零件剖面线方向相反。", "矩形花键联结见图9，渐开线花键联结见图10（另有分度线细点画线）；联结处常注花键副标记（分式）。"]
variants = ["矩形花键联结（图9）", "渐开线花键联结（图10）"]
dxf_forms = ["shaft: thick LINE pair (major) + thin LINE pair (minor) running through the hub zone; hub HATCH ANSI31 bounded by the shaft major-diameter LINE", "cross-section: interlocking tooth outlines (thick LWPOLYLINE/LINE/ARC) with two HATCHes at opposite angles (e.g. 45° and 135°)", "pair designation MTEXT on leader with a slash/fraction (e.g. 'INT/EXT …', '6×23H7/f7×26H10/a11×6H11/d10')", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为装配剖视中穿过轮毂剖面区的轴：在轮毂段内轴上仍有一对细实线（小径）位于粗实线（大径）内侧，轮毂剖面线止于大径线；对应横断面里两零件的齿互相嵌合、剖面线方向相反。与螺纹连接区分：螺纹旋合段同样按外螺纹画，但小径约0.85d、末端有粗实线终止线并注M标记；与平键联结区分：键联结在轴上只有一个键槽、键截面为矩形，不是周向均布齿。"
confusions = ["螺纹连接：旋合段也按外螺纹画，但有螺纹终止线与M标记。", "平键联结：断面只有一个矩形键和键槽。"]
related = ["DC-G3-039", "DC-G3-040", "DC-G3-031", "DC-G3-085", "DC-G3-056", "DC-G3-072", "DC-G2-009"]
