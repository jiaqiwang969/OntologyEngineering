[[concepts]]
id = "DC-G5-001"
name = "以中心孔轴线为基准的标注"
aliases = []
group = "G5"
kind = "datum"
meaning = "以轴端中心孔的轴线作为基准时，把基准代号直接挂在中心孔标记的参照线（或引出线）上，表示基准要素是中心孔工作锥面所确定的轴线，而不是轴的某段外圆。常见于以两端中心孔为公共基准的轴类零件跳动、同轴度要求。"
components = ["中心孔符号与标记：轴端面处画开口向外的 60° 折线（或不画），从锥面引出细实线到一条水平参照线，线上写中心孔标记，如 GB/T 4459.5-B2.5/8；两端相同只标一端并在标记前写“2×”", "基准代号：挂在中心孔标记参照线上或其下方；GB/T 4459.5-1999 图例用旧式圆圈字母+连线+贴在参照线上的粗短横线，现行图样用方框字母+基准三角形", "同一引出线上常同时注出中心孔工作表面的表面粗糙度符号", "公差框格引用该字母；两端中心孔分别为 A、B 时写成公共基准 A-B"]
variants = ["单端", "两端（2×）"]
dxf_forms = ["loose LINE leader from the cone + horizontal LINE reference line + TEXT designation (e.g. 'GB/T 4459.5-B2.5/8', '2×…') on layer 08/09", "datum symbol as INSERT (square/circle + ATTRIB letter + connector + triangle/bar) or exploded LWPOLYLINE/CIRCLE + TEXT + LINE + SOLID or short thick LINE whose terminal lies on the designation reference line", "centre-hole symbol: two short LINEs forming a 60° V at the axis end, sometimes in the same block as the designation", "surface texture symbol (INSERT or LINE strokes) placed on the same leader"]
recognition = "以中心孔标记文字为锚（含“4459.5”“GB/T 145”或“中心孔”，以及型式字母 A/B/C/R 与 d/D 尺寸）。在其参照线上或紧邻处找基准符号：终端（三角形或粗短横线）中点落在参照线上（距离≤0.2h），连线垂直于参照线，方框或圆圈内为单个大写字母。参照线经引出线通到轴端、轴端附近有中心线。满足时该字母的基准要素记为“中心孔轴线”。与普通轴线基准的区别：后者的基准三角形与外圆直径尺寸线对齐，而本概念的符号不与任何尺寸线对齐、只挂在中心孔标记上。"
confusions = ["普通轴线基准：基准三角形与直径尺寸线对齐，基准是该圆柱面的轴线；本概念挂在中心孔标记参照线上，基准是中心孔轴线", "表面粗糙度符号：同一引出线上的 √ 形符号不是基准终端", "中心孔 60° 折线符号本身不是基准三角形，也不是可见轮廓"]
related = ["DC-G5-009", "DC-G5-002", "DC-G5-057", "DC-G5-045", "DC-G5-054", "DC-G3-003", "DC-G3-218", "DC-G3-144", "DC-G3-105", "DC-G6-012"]
priority = "medium"
text_forms = ["2×GB/T 4459.5-B2/6.3", "GB/T 4459.5-B1/3.15", "A-B"]
knowledge_units = ["K13", "K39", "K24"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 4459.5-1999 图3/图4 show the older circle-letter datum symbol whose short thick bar sits on the designation reference line; read it with the same meaning as the current square+triangle form. Related skill recognition cards: center_hole_symbol and datum_feature_symbol. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
[[concepts.sources]]
document = "GB/T 4459.5-1999"
clause = "5.1.3 图3、图4"
page = 6

[[concepts]]
id = "DC-G5-002"
name = "公共基准（A-B）"
aliases = ["公共基准", "公共基准（组合基准）"]
group = "G5"
kind = "datum"
meaning = "由两个或多个要素同时建立的一个基准（如两段轴颈的公共轴线），在公差框格的同一格内用连字符把各基准字母连写（A-B），字母顺序无先后。"
components = ["图上每个参与要素各有一个基准符号（字母不同）；简化时只标一个基准符号并在其右侧写“n×”，框格中把同一字母写两次（A-A）", "公差框格：公共基准占一个格子，格内字母之间用连字符“-”分开；可单独作第一基准，也可作为基准体系中的某一格", "修饰符：补充修饰符作用于全部组成要素时字母串加圆括号，如 (A-B)[CF]；只作用于其中一个时写在该字母后，如 A[SL]-B；要素间距离可变时在后面加 [DV]", "旧注法：把一组要素建立的公共基准当作单一基准标注，GB/T 17851-2022 附录 D.3 列为废止"]
variants = ["A-B", "one letter repeated A-A with n× near the indicator", "(A-B)[CF]", "A[SL]-B", "obsolete: common datum from a feature group indicated as single datum (GB/T 17851 D.3)", "A-B 公共轴线", "C-D"]
dxf_forms = ["TEXT/MTEXT 'A-B' centred in one datum cell; the hyphen may be ASCII '-', en dash, '—' or full-width '－' depending on font", "TOLERANCE entity (AcDbFcf): one datum field 'A-B' between %%v separators", "INSERT of a frame block with datum ATTRIB value 'A-B'", "separate datum symbols (INSERT or exploded square/triangle) on each datum feature, typically aligned with the diameter dimension lines of the journals"]
recognition = "以公差框格第三格及以后某一格内的文字为锚。格内文字形如“字母(修饰符)-字母(修饰符)”（可整体加括号或后随 [DV]）即为公共基准；同一格只有一个字母为单一基准；字母分在相邻格中为基准体系。再在图上找与各字母对应的基准符号（或一个带“n×”的基准符号）。OCR 或字体替换会把连字符显示为“一”“—”“－”，不要读作减号或数值。"
confusions = ["基准体系 A｜B｜C：字母分在不同格中且有先后顺序；公共基准在同一格内、无顺序", "区间符号 J↔K：两字母间是双向箭头，写在框格上方或旁边，不在基准格内", "数值范围或负偏差：A-B 两侧都是字母、不含数字", "剖视名称 A-A：写在视图上方、无框格并配剖切符号；公共基准的简化写法 A-A 只出现在框格基准格内"]
related = ["DC-G5-003", "DC-G5-004", "DC-G5-009", "DC-G5-017", "DC-G5-016", "DC-G5-090", "DC-G5-054", "DC-G5-057", "DC-G5-047", "DC-G2-043"]
priority = "high"
text_forms = ["A-B", "C-D", "A-A", "(A-B)[CF]", "A[SL]-B", "A-B[DV]", "◎ Ø0.02 A-B", "↗ 0.03 A-B"]
knowledge_units = ["K23", "K24", "K25"]
recognition_cards = ["gdt_frame_content"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "The textbook calls it 组合基准 and shows it on two bearing journals. GB/T 17851-2022 Annex D.3 lists the single-datum indication of a feature group as obsolete. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
