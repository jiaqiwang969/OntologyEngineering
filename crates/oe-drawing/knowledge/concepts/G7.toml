meaning = "粘接、弯折、挤压接合的标注方式：细实线指引线一端带箭头指向接合处，另一端连细实线基准线，接合符号写在基准线上且与之相距至少2d；符号左侧注接合截面尺寸，右侧注粘接剂牌号等其他特性，需要时在基准线末端分叉处写说明。"
components = ["指引线：细实线，末端实心箭头指向接合处。", "基准线：细实线，与指引线相连。", "接合符号：表面粘接、倾斜面粘接、弯折或挤压符号，距基准线至少2d（d为符号线宽，d=0.1h）。", "左侧尺寸：接合截面尺寸（宽、高、直径、深度等）。", "右侧信息：粘接剂牌号等。", "分叉尾部：基准线末端可分叉，叉后写附加说明。"]
