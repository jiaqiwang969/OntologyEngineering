  "GB/T 24745-2009 技术产品文件 词汇 表5、表7",
  "GB/T 16675.2-2012 简化表示法 第2部分 4.2.1",
  "机械制图（第7版）§9-4、§9-5、图10-18、图10-22",
  "互换性与测量技术 1.5、3.7.2",
]
knowledge_units = ["K14", "K21", "K33", "K40", "K41"]
