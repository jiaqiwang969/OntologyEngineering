[[concepts]]
id = "DC-G8-019"
name = "装配剖视中螺旋弹簧仅画端面"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "在装配图的剖视图中，螺旋弹簧可只画出其端部，被弹簧挡住的结构一般不画出（GB/T 16675.1—2012新增的简化画法）。"
components = ["只画弹簧两端的端部簧圈（端面或其簧丝断面），簧丝断面小时可涂黑。", "中间各圈不画。", "弹簧后面被挡住的零件轮廓不画，在弹簧外轮廓或簧丝中心线处断开。"]
variants = []
dxf_forms = ["small CIRCLE pairs or HATCH SOLID filled circles at the spring ends (layers 01/10)", "optional CENTER-type LINE through the wire centres (layer 05)"]
recognition = "以剖视图中成对出现、直径相同的小圆或涂黑小圆为锚点：它们分布在一根轴线两侧，只在轴向两端各有一组，两组之间没有其他簧丝断面；后方零件的轮廓线在弹簧外径包络处中断。与完整弹簧画法的区别：完整画法中间有连续的簧丝断面或斜线。"
confusions = ["完整螺旋弹簧画法（GB/T 4459.4）：中间各圈截面连续出现或以斜线表示。", "弹簧中间部分省略画法：两端各画1~2圈后用细点画线连接，仍画出若干圈。", "O形密封圈断面：单个小圆，位于沟槽中，常涂黑。"]
related = ["DC-G3-059", "DC-G3-130", "DC-G3-017", "DC-G3-113"]
