[[concepts]]
id = "DC-G3-165"
name = "往复运动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示构件沿直线或绕轴来回运动的符号，可表示在一个或两个极限位置停留，或在中间位置停留。"
components = ["直线或回转往复运动：直线或圆弧轨迹线两端各带一个箭头。", "在一个极限位置停留：去程线与回程线平行，在一端用一条垂直短线相连（呈⊐形），两线各带一个指向运动方向的箭头；回转时用两段同心圆弧。", "在两个极限位置停留：去、回两线两端都相连，形成闭合的矩形（或扇环形）回路，线上带方向箭头。", "在中间位置停留：轨迹中部折成台阶，两端各带箭头。", "2013版条号4.9.1～4.9.4（前言说明往复运动改编为4.9）；1984版为1.8.5～1.8.8。"]
variants = ["直线或回转往复", "一个极限位置停留", "两个极限位置停留", "中间位置停留"]
dxf_forms = ["Thin LINE or ARC on layer 02 with SOLID or tapered-LWPOLYLINE arrowheads at both ends", "Dwell forms as one LWPOLYLINE (or LINE/ARC chain) folded into ⊐ or closed-loop shape with arrowhead segments", "INSERT of a motion-symbol block; rarely a DIMENSION-like two-arrow line drawn without text"]
recognition = "锚点为两端都带实心箭头的细线（直线或圆弧），或由两条平行去回线及端部垂直连接线构成的⊐形/闭合回路，回路上的箭头方向相反。与尺寸线区分：尺寸线箭头抵在尺寸界线上、带尺寸数值且多为DIMENSION实体，往复运动符号无尺寸界线和数字，位于机构简图的构件旁。与单向运动区分：单向运动只有一个箭头。"
confusions = ["双箭头尺寸线：箭头抵在尺寸界线或轮廓上，中间有尺寸数值。", "单向运动符号：只有一端带箭头。", "运动终止符号：箭头抵在一条垂直短线上。"]
related = ["DC-G3-153", "DC-G3-198", "DC-G3-199", "DC-G4-059", "DC-G4-019"]
