# knowledge-incad-library

# Source-library projections are derived records, never a second Project authority.
[[constraints]]
id="incad_archive_only_preserves_strict_intake"
requirement="req_knowledge"
module="knowledge"
check="verify_archive"
rust_path="crates/oe-knowledge/src/incad.rs"
statement="Factor the fixed source/projection closure from task intake. Archive-only verification requires the original CN case, fixed manifest digest, all nine projections, original HTML and case record, existing closed specification shape/text hashes and before/after source snapshots. Existing IncadIntakeRequest additionally retains every original task equality, authority, exposure, budget and four-role check; no generated task or Project is invented for a source library."
severity="error"

[[constraints]]
id="incad_library_source_graph"
requirement="req_knowledge"
module="knowledge"
check="build"
rust_path="crates/oe-knowledge/src/incad/library.rs"
statement="Read explicit sources/misumi archive and publish a new sources/.indexes/incad directory or child directory only. Discovery rows supply fixed locations, never trusted embedded claims. Generate deterministic case/revision/source-bound nodes, edges and named N-Quads from verified source projections: supplier function/condition/reference statements, exact BOM rows/header semantics/model designations and declared CAD archive/member identities. New consumers validate reference BOM/CAD equality to the case record and inventory relationships; preserve exact title/purpose text including empty strings with missing status, missing sections, errors, development_replay and unknown BOM-CAD correspondence. Do not infer physical causality, units, native geometry, universal engineering facts or adoption. Omitted browser capture/private assets are not required or claimed verified. Source, prior indexes and historical Project receipts remain unchanged."
severity="error"

[[constraints]]
id="incad_library_rebuilds_claims_and_portable_paths"
requirement="req_knowledge"
module="knowledge"
check="verify"
rust_path="crates/oe-knowledge/src/incad/library.rs"
statement="Persist only portable root/archive-relative paths and exact original/projection digests. Verification and retrieval reconstruct case graphs from fixed source closures and compare JSON values and N-Quads bytes, so re-signing a modified derived graph is insufficient. No changed root implies fresh engineering evidence. A new library snapshot preserves earlier snapshots and unchanged case graph identities. No automatic current Project binding. Existing index/source mismatches and unsafe paths fail before an output is published."
severity="error"

[[constraints]]
id="incad_library_bounded_reads_and_retrieval"
requirement="req_knowledge"
module="knowledge"
check="search"
rust_path="crates/oe-knowledge/src/incad/library.rs"
statement="At most1024 cases,8192 selected files per case,262144 selected files overall,1GiB per streamed member,2GiB selected bytes per case and128GiB conservative hash charges including final rechecks and64KiB growth headroom per read. Archive metadata separately retains16MiB/file and64MiB/case plus one recheck, bounded across1024 cases. Derived JSON and RDF are16MiB each per case and2GiB output total. Search is bounded lexical source retrieval,1..20 results and at most1000 query characters; reconstruct all selected case declarations and rehash returned case source closures. Explicit search coverage marks nonreturned CAD byte revalidation not_run. Full verify rehashes all selected closures. Recheck returned/full original closures, read derived records and manifest snapshots before completion; no network, browser, Poppler, CAD execution or Project mutation."
severity="error"

