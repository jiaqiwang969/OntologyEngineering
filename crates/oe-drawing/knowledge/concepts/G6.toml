recognition = "锚点：完整符号；在长边右侧靠近底部（符号坐标x略大于长边在该高度的位置，y约0–1.4h）找单个字符或小图形，字高≈h，属于{=, ⊥, X, M, C, R, P}之一即为纹理符号。区分几何公差垂直度、平行度（在框格内）、简化注法的等号（在两个符号之间）和其他字母（倒角C、半径R、螺纹M等不在位置d）。"
confusions = ["垂直度符号⊥：位于几何公差框格内", "简化注法的等号：位于两个符号之间", "其他字母C、R、M：不在符号位置d"]
