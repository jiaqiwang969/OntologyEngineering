[[concepts]]
id = "DC-G3-062"
name = "轴测剖视中肋和薄壁的表示"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "轴测剖视图中，剖切平面沿肋或薄壁的纵向对称面剖切时，肋不画剖面符号，用粗实线与邻接部分分开；不够清晰时可在被剖的肋或薄壁上画细点表示剖切部分。"
components = ["轴测剖视的剖面区域按所在坐标面的轴测方向画剖面线（各面方向不同）。", "被纵向剖切的肋或薄壁面留白，与相邻已画剖面线的实体之间用粗实线分界。", "可选做法：在被剖的肋或薄壁面内画细点代替留白，以示其被剖切。", "2013版第5.4条与1984版第2.4条规定一致。"]
variants = ["thick separating line", "fine dots on the cut rib"]
dxf_forms = ["HATCH (ANSI31 rotated to the axonometric plane direction, e.g. 60°/120°/vertical families in isometric) on the cut faces of the body, with the rib face excluded from the boundary", "Thick LINE (layer 01) separating the unhatched rib face from the hatched body", "Dot fill on the rib face: HATCH with a dot pattern (DOTS or user-defined) or many POINT/DONUT entities"]
recognition = "先确认视图为轴测图：主要轮廓方向集中在30°/150°/90°（正等测）或0°/45°/90°（斜二测）。锚点为轴测剖面线区域；在其间找一个由粗实线围成、无填充（或点状填充）的狭长平面域，其至少一边与剖面线区域共用粗实线，长宽比大，形状为肋或壁。与空腔区分：空腔内能看到后方结构线，且不与被剖面共边；与点阵剖面区分：点阵剖面整片代替剖面线，本规定的点只出现在肋上，其余剖面仍为剖面线。"
confusions = ["点阵或涂色剖面：整个剖面区域用点；本规定的点只用于被纵剖的肋/薄壁。", "未填充的空腔：腔内可见后方轮廓，边界不是剖切形成的平面。", "二维视图中的肋纵剖不剖：规则相同但在正投影图上，剖面线为45°。"]
