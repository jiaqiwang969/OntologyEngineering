[[concepts]]
id = "DC-G3-103"
name = "滚动轴承画法尺寸比例"
aliases = []
group = "G3"
kind = "other"
meaning = "规定滚动轴承通用、特征、规定三种画法中线框、符号和滚动体的尺寸比例，以轴承宽度B、外径D、内径d及A=(D−d)/2为基准取分数，使装配图中的轴承大小与实际外形一致。"
components = ["外框：矩形线框或外形轮廓按轴承实际外形尺寸、与图样同一比例绘制。", "通用画法：线框中央正立十字的大小与位置取B、A的分数确定，十字不碰线框。", "特征画法：长粗实线、短粗实线（或圆弧）等要素符号的位置和长度取B、A的分数（如B/2、2B/3）。", "规定画法：滚动体中心约在线框中心（A/2、B/2处），滚动体大小、接触角线（如60°、15°）等按比例画出。", "版本：1998版为附录B（其中规定画法比例取自旧GB 4458.1—84附录B，只作过渡参考）；2017版改为附录A。"]
variants = ["1998 附录B", "2017 附录A"]
dxf_forms = ["No DXF form of its own: governs the proportions of the bearing LINE/CIRCLE/HATCH group or of a library INSERT", "Bearing library blocks (CAXA, GstarCAD/AutoCAD Mechanical) are parametric in D, d, B; after export they are anonymous INSERTs or exploded strokes following these ratios"]
recognition = "作为识别轴承画法的比例约束：以轴承矩形线框为锚点（沿轴线的边长为B，径向边长为A=(D−d)/2，内边贴轴外圆、外边贴座孔），检查内部十字、要素符号或滚动体圆是否位于线框中心附近，符号长度是否为B或A的固定分数，规定画法中滚动体是否不画剖面线、套圈剖面线同向同距。比例吻合并且线框成对出现在轴线两侧时，可提高判为轴承画法的置信度。区分一般矩形零件：不满足上述比例，也不成对贴合轴肩与座孔台阶。"
confusions = ["一般矩形零件（隔套、垫圈）：没有中心符号或滚动体。", "机构简图轴承符号：单线简图，不按实际外形尺寸绘制。"]
related = ["DC-G3-032", "DC-G3-119", "DC-G3-121", "DC-G3-124", "DC-G3-123", "DC-G3-128", "DC-G3-116", "DC-G3-174"]
