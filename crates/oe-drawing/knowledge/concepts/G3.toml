meaning = "梯形螺纹（传递双向动力的丝杠螺纹）的标记，由特征代号Tr、公称直径×螺距（多线为导程加括号螺距）、旋向、中径公差带和旋合长度组成。"
components = ["尺寸代号：单线为Tr+公称直径×螺距（Tr40×7）；多线为公称直径×导程(P螺距)（Tr40×14(P7)）。", "左旋LH紧跟尺寸代号之后，右旋不注。", "公差带只注中径公差带（如7H、7e、8e），用“-”与尺寸代号隔开。", "旋合长度只分N和L两组，N不注，L写在公差带之后（-L）。", "螺纹副：Tr36×6-7H/7e；注在大径尺寸线上，与米制螺纹相同。"]
