[[concepts]]
id = "DC-G6-051"
name = "表面结构要求标注在尺寸线上"
aliases = ["表面结构注在尺寸线或尺寸界线上"]
group = "G6"
kind = "surface_indication"
meaning = "在不致引起误解时，可把表面结构符号直接注在标注该特征尺寸的尺寸线上，使同一尺寸线同时给出尺寸和表面要求。"
components = ["符号尖端落在尺寸线上（通常在尺寸数字旁），如Ø120 H7孔和Ø120 h6轴分别带Rz 12.5和Rz 6.3。", "要求作用于该尺寸所标注的表面（孔或轴的配合面）。", "2006版C.5：表面结构和尺寸可注在同一尺寸线上（键槽示例）；教材也有注在尺寸界线上的写法。", "ISO 21920-1草案图11 g)：只在没有误读风险时使用。"]
variants = ["GB/T 131-2006 11.2.3 图19, C.5 (keyway)", "ISO 21920-1 draft 图11 g)", "尺寸线上", "尺寸界线上"]
dxf_forms = ["DIMENSION entity (linear or diameter) with text '%%c120 H7' and a roughness INSERT whose apex sits on the dimension line", "exploded dimension (LINE + SOLID arrows + TEXT) with the symbol LINEs touching the dimension LINE", "rarely, the symbol embedded in the dimension block geometry"]
recognition = "锚点：表面结构符号，其尖端落在一条两端带尺寸终端（箭头或斜线）的尺寸线上而不是轮廓；尺寸文字常含Ø和公差带代号。被注表面取该尺寸的被测特征（孔或轴面），即尺寸界线所连的轮廓。区分尺寸公差文字（数值或偏差）和注在尺寸界线上的符号（尖端在尺寸界线上，作用于该界线所引轮廓）。"
confusions = ["尺寸公差或偏差文字：无V形", "延长线（尺寸界线）上的符号：作用于界线所引的轮廓", "尺寸数字旁的附注：文字说明"]
