meaning = "在滚动轴承通用画法（也适用于特征画法）上附加表示轴承自带的防尘盖或密封圈：一面带防尘盖时在框内一个端面侧加一条线，两面带密封圈时两个端面侧都加。"
components = ["底图为通用画法：粗实线矩形框加居中正立十字。", "一面带防尘盖：在框内紧靠一个端面（垂直于轴线的框边）处加一条与之平行的粗实线，形成一个窄条。", "两面带密封圈：在两个端面内侧各加一条平行线，左右对称。", "附加线不画剖面线，十字保持不触框；2017版5.4与1998版5.1.4规定相同。"]
