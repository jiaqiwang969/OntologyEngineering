[[concepts]]
id = "DC-G3-215"
name = "55°密封管螺纹标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "55°用螺纹密封的管螺纹（圆锥管螺纹及与其配合的圆柱内螺纹）的标记，由特征代号与英寸制尺寸代号组成，内外螺纹均只有一种公差带，因此不注公差带。"
components = ["特征代号：1995版附录A（依据当时的GB 7306-87）为R圆锥外螺纹、Rc圆锥内螺纹、Rp圆柱内螺纹；教材按现行标准把外螺纹细分为R1（配Rp）和R2（配Rc）。", "尺寸代号为英寸制代号（如1/8、1/2、3/4、1½、2），紧跟特征代号书写，不加“×”或“Ø”，数值不是毫米直径。", "左旋在尺寸代号后加LH（附录A写作R1/2-LH，教材写作Rc3/4LH）；右旋不注。", "螺纹副按内螺纹/外螺纹用斜线分隔，如Rc1½/R1½、Rp1½/R1½。", "标注位置：用指引线从螺纹大径轮廓或对称中心引出，标记写在基准线上，不写在尺寸线上。"]
variants = ["R圆锥外螺纹", "Rc圆锥内螺纹", "Rp圆柱内螺纹", "Rc/R、Rp/R螺纹副"]
dxf_forms = ["TEXT/MTEXT on a LEADER/MULTILEADER (layers 09/11) whose arrow or end point touches the major-diameter line or the axis of the threaded feature", "Fractions as plain '1/2', '1-1/2', the character '½', or MTEXT stacking '1\\S1/2;'; subscripts in R1/R2 written as plain 'R1'/'R2' or with smaller MTEXT height", "Occasionally (non-compliant) as DIMENSION override text"]
recognition = "锚点为文字正则 ^(Rc|Rp|R[12]?)\\s?\\d+(\\s?\\d/\\d|/\\d+|½|¼|¾)?(\\s?-?LH)?(/R[12]?\\s?[\\d/½¼¾]+)?(-?LH)?$；R后的数值须是英寸尺寸代号集合中的值（1/16~6），常含分数。位置关系：处在指引线基准线上，引线终点落在螺纹大径线、管端或轴线上，附近有螺纹规定画法（粗实线大径、细实线小径；锥螺纹可能画出1:16锥度）。与半径R区分：半径的R后为毫米值，从圆弧引出的半径尺寸线指向圆弧；管螺纹R后多为分数，引线指向螺纹。"
confusions = ["半径符号R：R后跟毫米数值，尺寸线指向圆弧且过圆心方向；管螺纹R后为英寸尺寸代号（1/2、3/4、1½等）。", "55°非密封管螺纹G：特征代号为G，外螺纹带A/B级。", "60°圆锥管螺纹NPT：美制代号NPT，同样用分数尺寸。", "表面结构参数Rz/Ra：出现在表面结构符号上并跟微米值，OCR把Rc误读为Rz时需按所处位置区分。"]
related = ["DC-G3-216", "DC-G3-217", "DC-G3-081", "DC-G3-087", "DC-G3-023"]
priority = "medium"
text_forms = ["R1/2-LH", "Rc1½", "Rp1/2", "Rc1½/R1½", "Rp1½/R1½", "R₂3", "Rc3/4LH"]
knowledge_units = ["K13", "K34", "K36"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 4459.1-1995附录A为参考件，引用的是当时有效的GB 7306-87；R1/R2写法取自教材（对应其后修订的GB/T 7306.1/7306.2）。教材OCR的下标模糊，R₂3示例按标准逻辑复原。分数编码与引线实体形式属一般CAD习惯。"
[[concepts.sources]]
document = "GB/T 4459.1-1995"
clause = "附录A 表A1"
page = 15

[[concepts]]
id = "DC-G3-216"
name = "55°非密封管螺纹标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "55°非密封（1995版称“非螺纹密封的”）圆柱管螺纹的标记，由特征代号G和英寸制尺寸代号组成，外螺纹另注公差等级A或B，内螺纹只有一种等级不注。"
components = ["特征代号G，内外螺纹相同，后接英寸尺寸代号（如1/2、1½、2）。", "外螺纹在尺寸代号后加公差等级A或B（G1/2A、G1½A）；内螺纹不注等级（G2）。", "左旋加LH：附录A示例为G1/2-LH；教材把等级写在尺寸代号与LH之间，如G4B-LH。", "螺纹副为内螺纹/外螺纹，如G1½/G1½A。", "用指引线从大径轮廓或对称中心引出，写在基准线上。"]
variants = ["外螺纹A级/B级", "内螺纹不注等级", "左旋LH"]
dxf_forms = ["TEXT/MTEXT on a LEADER/MULTILEADER (layers 09/11) from the major-diameter line or axis", "Fractions as '1/2', '1-1/2', '½' or MTEXT stacking '1\\S1/2;'"]
recognition = "锚点为文字正则 ^G\\s?\\d*(\\s?\\d/\\d|/\\d+|½|¼|¾)?\\s?[AB]?(\\s?-?LH)?(/G.*)?$ 且G位于字符串开头；G后紧跟英寸尺寸代号，不跟“B/T”（排除GB/T）。位于指引线基准线上，引线终点在螺纹大径线或轴线上，附近有螺纹规定画法。外螺纹多带A/B尾字母，内螺纹无。"
confusions = ["55°密封管螺纹R/Rc/Rp：特征代号不同，无A/B等级。", "螺纹公差带基本偏差G（如6G）：G在数字之后，且属于M螺纹标记的公差段。", "标准编号前缀GB：G后紧接B/T或B与数字。", "基准字母G：位于基准方框中，与基准三角相连，不跟尺寸代号。"]
related = ["DC-G3-215", "DC-G3-217", "DC-G3-081", "DC-G3-087", "DC-G3-024", "DC-G3-005"]
priority = "medium"
text_forms = ["G1/2", "G1/2A", "G1½A", "G1/2-LH", "G4B-LH", "G2", "G1½/G1½A"]
knowledge_units = ["K13", "K34", "K36"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "附录A（参考件）引用当时的GB 7307-87；名称由“非螺纹密封的管螺纹”改为“55°非密封管螺纹”见教材。LH位置两种写法并存。"
[[concepts.sources]]
document = "GB/T 4459.1-1995"
clause = "附录A 表A1"
page = 15

[[concepts]]
id = "DC-G3-217"
