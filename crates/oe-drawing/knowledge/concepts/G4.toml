components = ["尺寸线：细实线", "半箭头：只画在尺寸线一侧的半个三角（或一条与尺寸线成小角度的短斜线），尖端触及尺寸界线", "尺寸数字照常注写", "GB/T 16675.2-1996 与 2012 表2 5.1 规定一致"]
