dxf_forms = ["LINE/LWPOLYLINE with CENTER/ACAD_ISO04W100 linetype, thin lineweight, layer 05 (细点画线), offset slightly from an outline", "may share layer 05 with true centre lines — distinguish by geometry, not layer"]
recognition = "锚点为热处理文字或粗点画线热处理区；在其范围内寻找与轮廓平行、紧靠轮廓外侧的细点画线段（不经过任何圆心或对称面）。中心线的特征是穿过圆心、孔轴或对称面并伸出轮廓2～5 mm；本线贴着轮廓走且与热处理标注同时出现。"
