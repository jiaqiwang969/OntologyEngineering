[[concepts]]
id = "DC-G9-013"
name = "读零件图"
aliases = []
group = "G9"
kind = "other"
meaning = "识读零件图的一般步骤：先从标题栏了解名称、材料、比例、质量；再分析视图和结构形状；然后分析尺寸基准、定形定位尺寸、公差、表面粗糙度和技术要求；最后综合归纳，形成对零件的完整认识。"
components = ["概括了解：由名称判断零件类别（轴套、盘盖、叉架、箱体），由材料推断加工方法（铸、锻、棒料切削），由比例估计实际大小。", "分析视图：弄清各视图的投影关系，先整体后局部，用形体分析和线面分析想象形状。", "分析尺寸和技术要求：找出长、宽、高三向尺寸基准和定形、定位尺寸；带公差代号或偏差的尺寸表示有配合关系，配合面粗糙度要求较严。", "综合归纳：把视图、尺寸和技术要求联系起来理解。"]
variants = ["概括了解", "分析视图和结构形状", "分析尺寸和技术要求", "综合归纳"]
dxf_forms = ["no specific entity: reading order over title-block ATTRIB/TEXT, view geometry, DIMENSION entities, tolerance and roughness symbols, and 技术要求 MTEXT"]
recognition = "作为读图程序的组织顺序：先定位图框和标题栏，读取名称、材料和比例（比例用于把DXF中的几何换算为实际尺寸，或核对DIMENSION实测值与标注值之比）；再按视图对几何分组；然后把尺寸、公差、粗糙度、几何公差挂到对应要素上；最后读技术要求文字，补充全局规则（未注倒角、未注公差等）。尺寸基准可由多个尺寸共用的尺寸界线起点推断。"
confusions = ["读装配图：需要明细栏、序号和配合关系分析，零件图没有这些。"]
related = ["DC-G9-014", "DC-G9-012", "DC-G9-028", "DC-G9-002", "DC-G9-015"]
