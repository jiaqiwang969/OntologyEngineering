dxf_forms = ["short thin LINEs between frame and sheet edge plus single-character TEXT centred in each zone", "usually part of a frame/title-block INSERT (block names like A3, A4-H, TK, 图框, GB_A3; CAXA 图幅 exported as a BLOCK) or drawn in a paper-space layout; may be scaled by the drawing scale in model space"]
