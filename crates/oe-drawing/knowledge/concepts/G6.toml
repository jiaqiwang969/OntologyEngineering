dxf_forms = ["TEXT '8×' (× as U+00D7, or typed 'x'/'X') immediately left of the roughness INSERT", "MLEADER text content containing '8×' with the symbol block", "combined LEADER shared with the dimension '8×%%c4'"]
recognition = "锚点：表面结构符号；其左侧同一基线紧邻处有“数字+×（或x）”的文字。属于草案写法，普通零件图上罕见。区分纹理符号X（在符号右侧纹理位置、前面无数字）和尺寸数量前缀“8×Ø4”（后接尺寸数字）。"
