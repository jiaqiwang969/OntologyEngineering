statement="显式params/2才产生capture/2。复用原validate_binding/validate_unique_bindings；记录实际API参数/值及真实状态码，直接返回值API不得伪造状态码。acquired记录原型类型/solid/owner/非occurrence、实例part occurrence/prototype及find_occurrence；before_query/after_cleanup记录当前body类型/solid/owner/occurrence及条件适用的prototype/containing查询。root直接身份的推导在接收端明确区分，不能伪造查询。非零occurrence owner不强制等于prototype owner。未采集必需事实为unknown，错误事实拒绝；不升级旧流。"
