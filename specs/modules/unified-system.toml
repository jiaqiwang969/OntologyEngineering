[[types]]
name="WorkspaceCommitRequest"
contract_group="engineering"
identity="WorkspaceCommitRequest"
meaning="Complete proposed state with explicit parent; /1 permits 256 checked paths and /2 permits 1024, both with 16 MiB per source and 64 MiB raw aggregate. Explicit /3 retains 1024 paths and 16 MiB per source, charges a 64 MiB lossless operation-cache payload instead of raw aggregate, and preserves all original bytes, hashes and historical obligations. Logical source bytes for /3 are bounded by 1024 times 16 MiB. Explicit /4 uses 2048 paths and 128 MiB retained payload, with the same 16 MiB per file and exact original identities (maximum 32 GiB logical). Explicit /5 uses 4096 paths and 256 MiB retained payload, with the same 16 MiB per file and exact original identities (maximum 64 GiB logical). No profile is a total process memory guarantee. Explicit /6 keeps the /5 source profile and bounds the complete history read from the head on every resume and commit by 1024 commits, 256 MiB of commit bytes and 256 MiB of archived Project/review bytes; /1 through /5 keep 1024 commits and 64 MiB. A commit is refused before writing when its own head would exceed its profile history budget."

