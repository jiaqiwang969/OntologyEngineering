recognition = "锚点：一个小实心三角形（SOLID、HATCH 或变宽多段线），尖端落在粗实线轮廓或其他图线上，底边中点连出一条细实线至文字或符号。与尺寸线箭头区分：尺寸箭头成对、尖端顶在尺寸界线上、箭杆与尺寸界线垂直；几何公差指引箭头的另一端接公差框格。"
