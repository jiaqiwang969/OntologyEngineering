components = ["CB-V（优先）、CB-S、CA-V、CA-S 四种型式。", "CA型字宽为CB型的1/√2，相当于手写体A型。", "每个字符在字符框内按栅格构建，字符框高与基线间距均约19/10 h；每个字符有对正点。", "等宽间隔（T）与比例间隔（P）。"]
