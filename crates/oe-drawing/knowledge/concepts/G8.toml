[[concepts]]
id = "DC-G8-012"
name = "序号的排列"
aliases = []
group = "G8"
kind = "other"
meaning = "装配图中各零部件序号应沿水平或竖直方向排列整齐，按顺时针或逆时针方向依次编排；整张图上无法连续时可只在每一水平行或竖直列内顺次排列；也可按明细栏中的序号顺序排列。"
components = ["同一水平行上的序号（含基准线或圆）纵坐标一致，同一竖直列上的序号横坐标一致。", "绕视图一周，序号数值按顺时针或逆时针方向单调递增。", "每一行或每一列内部按顺序排列，间距尽量均匀。", "同一张装配图中序号的形式（横线式、圆圈式、无框式）一致。"]
variants = ["clockwise", "counter-clockwise", "parts-list order per row"]
dxf_forms = ["no dedicated entity: derived from the insertion points of balloon TEXT/INSERT/MLEADER entities"]
recognition = "把已识别的零件序号（整数、同字高、带指引线）按插入点聚类：纵坐标相差小于约0.5倍字高的归为一行，横坐标相差小于约0.5倍字高的归为一列；行列内按坐标排序检查数值是否单调。再以视图群的形心为中心计算各序号的方位角，若序号值随方位角单调变化，判为顺时针或逆时针排列。这一规律可用来发现漏识别的序号（缺号位置），并排除与序号字高相同的其他数字。"
confusions = ["随意分布的注释编号：不成行列，没有递增规律。", "尺寸数字：沿尺寸线方向，字高较小，连有尺寸线。"]
related = ["DC-G8-024", "DC-G8-025", "DC-G8-008"]
