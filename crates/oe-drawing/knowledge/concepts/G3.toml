[[concepts]]
id = "DC-G3-152"
name = "单副元素构件符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示只带一个运动副元素的构件，即本构件是某个运动副（回转、棱柱、圆柱或球面副）的一部分，或机架是回转副的一部分；低副机构图中细实线所画为相邻构件。"
components = ["构件是回转副的一部分：平面机构为粗线构件终止于铰链小圆，从小圆另引一根细线表示相邻构件；空间机构为带竖短线的轴承小框加构件。", "机架是回转副的一部分：平面机构为铰链小圆坐在小三角支座上，支座底边下画机架短斜线；空间机构为一侧带短斜线的轴承框；可用符号为四等分圆，对角两象限涂黑。", "构件是棱柱副的一部分：滑块矩形套在细导路线上，构件粗线带实心楔接在滑块上；可用符号把导路线画粗。", "构件是圆柱副或球面副的一部分：沿用圆柱副、球面副符号，仅本构件画粗线、相邻构件画细线。", "2013版条号7.1附注及7.2.1～7.2.5，1984版4.1及4.2.1～4.2.5，图形一致。"]
variants = ["构件是回转副的一部分（平面/空间）", "机架是回转副的一部分", "构件是棱柱副的一部分", "构件是圆柱副的一部分", "构件是球面副的一部分"]
dxf_forms = ["Member as LINE on layer 01 (wide lineweight), adjacent member as LINE on layer 02; lineweight or layer is the only discriminator", "Pivot as CIRCLE; fixed support as a small triangle (3 LINEs or closed LWPOLYLINE) over a base LINE with short 45° LINE strokes or a narrow HATCH ANSI31 strip", "Quadrant ground-pivot alternative: CIRCLE + two diameter LINEs + two opposite quarter HATCH SOLID regions", "INSERT of library blocks for fixed pivot, slider and bearing box"]
recognition = "锚点为铰链小圆或滑块矩形，判断与其相接的两根线是否一粗一细（线宽或图层不同）：粗线为本构件，细线为相邻构件。固定铰链：小圆下有等腰小三角形，三角底边下有一排短斜线；四象限对角涂黑的圆为固定铰链可用符号。与回转副本身区分：回转副两侧构件同粗。若DXF线宽均为ByLayer且未分层，则仅凭几何无法区分本构件与相邻构件，应标为不确定。"
confusions = ["回转副符号：两侧构件线同粗，不区分本构件与相邻构件。", "重心/质心标记（四象限对角涂黑的圆）：在总图或零件图上表示重心；在运动简图中与支座、构件相接时才是固定铰链。", "滚动轴承通用画法：矩形框内为正立十字，框外无构件斜线和实心楔。"]
related = ["DC-G3-158", "DC-G3-178", "DC-G3-143", "DC-G3-141", "DC-G3-175", "DC-G3-155", "DC-G1-043"]
