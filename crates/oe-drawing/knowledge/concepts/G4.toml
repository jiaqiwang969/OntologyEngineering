[[concepts]]
id = "DC-G4-027"
name = "曲线轮廓的坐标尺寸注法"
aliases = ["曲线轮廓坐标注法"]
group = "G4"
kind = "dimension_element"
meaning = "表示曲线轮廓上各点的位置时，用坐标尺寸逐点标注，并可把某个尺寸线或其延长线兼作另一个尺寸的尺寸界线，由一组纵横坐标值确定曲线。"
components = ["曲线：非圆曲线轮廓（样条或多段圆弧）", "坐标尺寸：沿两个方向分别注出曲线上各点到基准的距离，常一个方向等间距", "尺寸线兼作界线：一个方向的尺寸线或其延长线作为另一方向尺寸的尺寸界线", "图3变体：与半径（如 R15）、角度和等距写法（如 7×10=70、3×20°=60°）组合"]
variants = ["rectangular coordinates of curve points", "combined with radius and angle values (图3)"]
dxf_forms = ["SPLINE or LWPOLYLINE/ARC chain for the curve on layer 01", "many DIMENSION dimtype 0 entities whose dimension-line points are reused as extension origins of perpendicular dimensions", "exploded: grid of thin LINEs (dimension lines prolonged as extension lines) with SOLID arrows ending on the curve + TEXT values", "alternative in practice: point table (TEXT/TABLE) with numbered points"]
recognition = "锚点为一条非圆曲线（SPLINE、短弧链或多段线），曲线上多个点同时被一个水平尺寸和一个竖直尺寸的端点命中（箭头尖或界线终点，容差≈d）。特征：某尺寸的尺寸线端点或其延长线与另一正交尺寸的界线共线，形成网格；数值序列单调，常一个方向等距（n×间距=总长）。与同一基准坐标式尺寸区分：后者是一维的、对象是直边特征；与印制板坐标网格法区分：后者以网格线和网格号定位、不注尺寸；与链式、基线尺寸区分：本概念被注点在曲线上，两个方向成对出现。"
confusions = ["同一基准坐标式（叠加）尺寸：一维，针对直边特征", "印制板类坐标网格法：用网格线定位", "链式、基线尺寸：只沿一个方向", "弯管坐标表：坐标值列在表格中"]
related = ["DC-G4-086", "DC-G4-087", "DC-G4-010", "DC-G4-096", "DC-G4-058", "DC-G4-084"]
