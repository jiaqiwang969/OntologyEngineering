[[concepts]]
id = "DC-G5-005"
name = "基准目标区域"
aliases = []
group = "G5"
kind = "datum"
meaning = "只用表面上的一块限定区域作基准目标时，用细双点画线围出该区域并在其内画剖面线，再经指引线连到基准目标框；区域大小写在目标框上半部或用理论正确尺寸给出。"
components = ["区域边界：细双点画线（线型 05.1）闭合轮廓，常为圆、方形或矩形", "区域内部：细实线剖面线（多为 45° 斜线）", "指引线：细实线，在区域内以实心圆点终止；表面不可见时指引线为虚线并以空心圆终止", "基准目标框上半写区域尺寸（如 φ4、□10），下半写字母和序号；尺寸放不下时引到框外，非圆非方区域直接用 TED 标注", "区域位置用带框理论正确尺寸确定"]
variants = ["round/square size in frame", "rectangle \"30×20\" outside frame or by TEDs"]
dxf_forms = ["HATCH (ANSI31 or user lines) inside a small closed LWPOLYLINE/CIRCLE boundary drawn with a PHANTOM-type (double-dash) linetype, boundary on layer 07, hatch on layer 10", "leader LINE ending in a filled dot (closed LWPOLYLINE with width, or solid HATCH circle); hidden case: dashed LINE + small CIRCLE", "datum target frame as INSERT, or exploded CIRCLE + diameter LINE + two TEXT", "location TEDs as DIMENSION entities with framed text"]
recognition = "以被细双点画线闭合边界围住的小块剖面线区为锚：区域面积远小于周围零件轮廓，边界线型为双点画线而非粗实线，多出现在外表面视图而非剖视图中；并且有一条指引线从区域内部（圆点终端）通到一个被水平直径分成两半的圆（直径≈4h）。缺少基准目标框时不判为基准目标区域。"
confusions = ["剖面线区域：由粗实线轮廓围住、出现在剖视图或断面图中，不连基准目标框", "局部区域被测要素：边界为粗长点画线（04.2），指引线来自公差框格而不是目标框", "表面处理或热处理区域：粗点画线标出，旁注处理要求文字"]
related = ["DC-G5-006", "DC-G5-007", "DC-G5-008", "DC-G5-011", "DC-G5-098", "DC-G1-010", "DC-G1-042", "DC-G1-095", "DC-G4-029"]
