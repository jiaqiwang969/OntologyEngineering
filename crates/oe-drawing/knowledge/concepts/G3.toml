[[concepts]]
id = "DC-G3-209"
name = "中心孔尺寸值表"
aliases = []
group = "G3"
kind = "table"
meaning = "中心孔表示法标准附录中的数值表，按导向孔直径D给出各型中心孔在图样上需要标注的锥孔端面直径D1（或C型的D2）及参考深度t，是核对中心孔标记数值的依据，一般不画在图上。"
components = ["表A1：首列为导向孔公称直径D（0.5~10 mm，括号内为非优先值），按R、A、B三种型式分列D1公称尺寸，A、B型另列参考尺寸t。", "表A2：C型（带螺纹）中心孔按螺纹规格M3~M24列出锥孔端面直径D2，例如M10对应16.3。", "典型数值对：R型D=3.15对D1=6.7；A型D=4对D1=8.5；B型D=2.5对D1=8，用于验证标记中“D/D1”的配对。", "中心孔其他尺寸（如锥角、长度）引自中心孔标准GB/T 145，本表只覆盖图样标注所需项目。"]
variants = ["表A1（R、A、B型）", "表A2（C型）"]
dxf_forms = ["Normally absent from the DXF: reference data used to validate centre-hole designations read from TEXT", "If reproduced on a drawing or process sheet: LINE grid (outer layer 01, inner layer 02) with TEXT cells on layer 11, or an ACAD_TABLE entity"]
recognition = "不作为独立图元识别，而作为校验知识：解析中心孔标记得到型式与D、D1（或M、L、D2），查表核对D1是否为该型式在该D下的标称值；匹配则提高标记识别置信度，不匹配提示OCR/录入错误或非标准中心孔。经验比例：R、A型D1/D约2.1，B型约2.8~3.2。若图上确实出现此类表格，其表头含D、D1、R/A/B或M3…M24，数值列单调递增。"
confusions = ["倒圆倒角尺寸系列值表：同为数值表，但表头是R、C或直径段，没有按R/A/B型式分栏的D/D1。", "中心孔标记本身：标记是图上的文字，本表只是校验其数值的知识来源。"]
related = ["DC-G3-144", "DC-G3-218", "DC-G3-003", "DC-G3-105"]
priority = "rare"
text_forms = []
knowledge_units = ["K13", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "数据来自GB/T 4459.5-1999附录A（提示的附录），此处只举例不转录全表。作为图面元素极少出现，优先级按出现频率标为rare；作为标记校验数据仍有用。比值范围由表中数值推算。"
