[[concepts]]
id = "DC-G4-061"
name = "一般公差的图样注法（GB/T 1804-m）"
aliases = ["未注公差说明", "线性尺寸一般公差（未注公差）注写"]
group = "G4"
kind = "note"
meaning = "图上未单独注公差的线性和角度尺寸（含倒圆半径、倒角高度）按GB/T 1804选定等级的一般公差控制，图样只需在标题栏附近或技术要求中写出标准号与等级代号。"
components = ["注写内容：标准号+连字符+等级字母，如GB/T 1804-m；等级为f精密、m中等、c粗糙、v最粗", "位置：标题栏附近、技术要求条目中，或企业标准等技术文件中", "适用：未注公差的线性尺寸、角度尺寸及机加工组装件尺寸；不适用于括号内参考尺寸和方框内理论正确尺寸", "等效写法：ISO 2768-m；教材零件图示例写成'线性尺寸的未注公差按GB/T 1804-2000…'的句式", "旧标准：本标准代替GB/T 1804-1992与GB/T 11335-1989，旧图上可能出现这些编号"]
variants = ["GB/T 1804-m in title block area", "in technical requirements", "ISO 2768-m form", "for angles GB/T 1804-f", "f 精密级", "m 中等级", "c 粗糙级", "v 最粗级", "同一注写覆盖倒圆半径与倒角高度（表1.19）", "旧标准 GB/T 1804—1992 及 GB/T 11335—1989（书中只提名称，未给旧注写式样）"]
dxf_forms = ["TEXT/MTEXT line in the 技术要求 block or near the title block: 'GB/T 1804-m' / '未注尺寸公差按GB/T 1804-m'", "ATTRIB of a title-block INSERT (template field for general tolerance)", "numbered MTEXT paragraph '2. 线性尺寸的未注公差按GB/T 1804-m' on layer 11 or template text layer"]
recognition = "锚点为文字中的'1804'（或'2768'）后接'-'和单个字母f/m/c/v；OCR可能把'-'读成'—'或'－'，把GB/T读成5B/T、GB T。位置多在图框右下标题栏上方或'技术要求'标题下的编号条目中，字高同技术要求正文。解析出等级后，绑定到所有既无偏差、又不带括号、也无方框的尺寸。与未注几何公差注写区分：后者引用GB/T 1184且等级为大写H/K/L；与公差带代号区分：公差带代号紧跟具体尺寸（如Ø20f7），字母后有数字。"
confusions = ["未注几何公差 GB/T 1184-H/K/L：标准号不同，等级为大写字母", "公差带代号（h7、f6等）：写在具体尺寸后，含等级数字", "材料牌号或热处理代号中的字母：不与1804/2768连用", "GB/T 45683 一般尺寸规范：以'线性尺寸：±0.25'形式列出数值"]
related = ["DC-G4-070", "DC-G4-062", "DC-G4-078", "DC-G5-026", "DC-G9-002", "DC-G4-009"]
priority = "high"
text_forms = ["GB/T 1804-m", "GB/T 1804-f", "未注尺寸公差按GB/T 1804-m", "线性尺寸的未注公差按GB/T 1804-m", "ISO 2768-m", "ISO 2768-mK"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K29"]
recognition_cards = ["technical_note"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "注写方法见GB/T 1804-2000第6章；'ISO 2768-mK'（与几何一般公差合写）为通用实践，不在本目录来源中。"
