[[concepts]]
id = "DC-G5-004"
name = "基准体系（第一、第二、第三基准）"
aliases = ["基准体系（多基准）", "多基准体系"]
group = "G5"
kind = "datum"
meaning = "两到三个基准按优先顺序共同确定公差带的方向和位置：第一、第二、第三基准分别写在框格第三、四、五格，自左向右即为优先顺序。"
components = ["四格或五格框格：第三格第一基准、第四格第二基准、第五格第三基准", "每格可以是单一基准或公共基准（如 A-B），也可带修饰符（Ⓜ、[PL]、>< 等）", "基准之间以及公差带相对基准的距离、角度由理论正确尺寸（方框）给出，0、90° 等可隐含不注", "旧注法：基准字母不分先后（GB/T 1182-2018 附录 A.4.3）或从框格直接画线连到基准要素（A.4.4），已废止"]
variants = ["two or three datums", "single and common datum mixed", "obsolete: letters without order (GB/T 1182 A.4.3)", "obsolete: leader drawn from frame directly to datum feature (A.4.4)", "两基准 A B", "三基准 A B C"]
dxf_forms = ["TOLERANCE entity (AcDbFcf) with two or three datum fields separated by %%v", "INSERT of a frame block with several datum ATTRIBs", "exploded: LWPOLYLINE/LINE outer rectangle with vertical LINE separators + one TEXT per datum cell", "boxed TEDs nearby as DIMENSION entities with framed text or TEXT inside small rectangles"]
recognition = "以公差框格为锚：第二格之后还有两到三个等高相邻格，每格内是基准字母串（单字母、带连字符的公共基准或带修饰符）。格数≥4 即为基准体系，按格序记录第一、第二、第三基准。位置度、倾斜度常伴随基准体系和带框 TED。"
confusions = ["公共基准：多个字母在同一格内用连字符连接，无先后之分", "多层公差标注：上下叠放的几个框格，每个框格各有自己的基准", "框格右侧的相交平面、定向平面、方向要素、组合平面框格也含基准字母，但带尖端、箭头或圆圈，第一格是方向符号"]
