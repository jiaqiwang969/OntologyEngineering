kind = "symbol"
meaning = "垂直度：方向公差，限定被测线或面相对于基准线/面成 90° 的方向变动。"
components = ["特征符号：倒 T 形——一条竖线立在水平底线中点上，竖线与底线都约 0.6H 长", "第二格：公差值；被测为轴线、对基准平面时常加 Ø（圆柱形带），也可写 Ø0Ⓜ", "基准格：至少一个基准"]
variants = ["面对线、线对面（Ø 公差带）"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;b} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph a horizontal LINE plus a vertical LINE standing on its midpoint in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⊥ (U+22A5) (or MTEXT font switch {\\Fgdt;b}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内一条水平 LINE 与一条竖直 LINE：竖线下端落在水平线中点附近（≤0.1H），向上伸出，两线约 0.5–0.65H 长。框格必有基准。辅助平面框格（相交、定向、方向要素）第一格中的 ⊥ 在主框格右侧附加框内，只说明方向；表面纹理方向符号 ⊥ 写在表面结构符号旁。OCR 常把 ⊥ 读成“上”“L”“T”。"
confusions = ["表面结构纹理方向符号 ⊥", "相交/定向/方向要素框格中的 ⊥", "汉字“上”、字母 T（OCR 混读）", "尺寸界线与尺寸线相接形成的 T 形"]
related = ["DC-G5-060", "DC-G5-042", "DC-G5-090", "DC-G5-103", "DC-G5-097", "DC-G5-113"]
