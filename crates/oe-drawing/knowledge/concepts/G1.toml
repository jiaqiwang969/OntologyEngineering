[[concepts]]
id = "DC-G1-038"
name = "粗实线"
aliases = []
group = "G1"
kind = "line"
meaning = "线宽为 d（常用0.5或0.7 mm）的连续线，是机械图样的主线，用于可见轮廓、可见棱边、相贯线、螺纹牙顶线、螺纹终止线、齿顶圆、剖切符号等。"
components = ["线型01，线宽 d，同一图样中宽度一致。", "用途：可见棱边线、可见轮廓线、相贯线、螺纹牙顶线、螺纹长度终止线、齿顶圆（线）、表格图和流程图主要表示线、系统结构线、模样分型线、剖切符号用线。", "图框也用粗实线画出。CAD 分层01层，屏幕显示白色。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight (group 370) 50 or 70 (0.5/0.7 mm) or ByLayer on a thick layer: GB/T 14665 layer 01, names such as 粗实线/轮廓线/OUTLINE, CAXA 0层; colour white/black (ACI 7)", "thick strokes drawn as LWPOLYLINE with constant width (group 43 ≈ 0.5–0.7) when lineweights are not used", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "判据优先级：(1) 370线宽明显大于其他图线（约2倍）；(2) 图层名或编号（01、粗实线、轮廓线）；(3) 颜色白/黑（ACI 7）且线型连续；(4) 打印样式按颜色映射。再按位置细分用途：闭合外形→轮廓；视图外孤立短画→剖切符号；纸边内大矩形→图框；与3/4细圆同心的粗圆→螺纹；与点画线圆同心的粗圆→齿顶圆。"
confusions = ["粗虚线：粗线宽的虚线，表示允许表面处理。", "粗点画线：粗线宽的点画线，表示限定范围。", "剖切符号：粗短画，位于视图外。", "小比例输出时的细实线：打印后线宽差异变小，应以 DXF 属性为准。", "可见焊缝的加粗线、螺钉头一字槽的加粗线：专业规定画法。"]
related = ["DC-G1-015", "DC-G1-014", "DC-G1-016", "DC-G1-101", "DC-G1-079", "DC-G1-007", "DC-G1-085"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "CAXA 默认“0层”为粗实线层是通用实践，需按实际模板核对。"
