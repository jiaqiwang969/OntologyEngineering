title = "视图与剖切标注"
meaning = "向视图在投射方向处画箭头并注字母，在视图上方注同一字母（旧版写“X向”）；剖视图、断面图用剖切符号（剖切位置处的粗短画、投射方向箭头和字母）表示剖切位置，在视图上方注“X—X”；局部放大图和不按原比例画的视图在名称下或旁注比例。"
sources = [
  "GB/T 4458.1-2002 机械制图 图样画法 视图 5.7",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 6、8",
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图 3.6、8",
  "GB/T 14690-1993 技术制图 比例 5.2",
  "机械制图（第7版）§7-1、§7-2",
]
knowledge_units = ["K11", "K13"]
recognition = "剖切符号：在已识别的“箭头+字母”投射方向标注的箭尾处，找一条与箭杆垂直、长约 1～4 倍字高的短线，即剖切位置的短画。剖视名称：一行文字为“字母—字母”（两字母相同），可再接比例。视图名称带比例时比例写在名称之下或之后。"
markers = ["—", "-", "向"]
concepts = ["DC-G2-043", "DC-G1-007", "DC-G2-072", "DC-G2-065", "DC-G2-068", "DC-G1-115"]

[[cards.components]]
role = "cutting_stroke"
primitives = ["LINE", "LWPOLYLINE"]
requirement = "剖切位置的短画"

[[cards.components]]
role = "view_arrow"
primitives = ["LINE", "LWPOLYLINE", "SOLID"]
requirement = "投射方向箭头"

[[cards.components]]
role = "view_letter"
primitives = ["TEXT", "MTEXT"]
requirement = "字母"

[[cards.components]]
role = "view_title"
primitives = ["TEXT", "MTEXT"]
requirement = "视图名称"

[[cards.variants]]
id = "cutting_plane_stroke"
title = "剖切符号：短画 + 箭头 + 字母"
distinguishing = "箭尾处垂直于箭杆的短线"
encodings = ["loose"]
tests = ["cutting_plane_stroke_joins_the_arrow_and_letter"]

[[cards.variants]]
id = "section_name"
title = "剖视、断面名称 X—X（可带比例）"
distinguishing = "两字母相同，以横线相连"
encodings = ["text"]
tests = ["section_name_titles_a_section_view"]

[[cards.variants]]
id = "direction_view_name"
title = "向视图的箭头字母与名称"
distinguishing = "箭头加字母、或“X向”"
encodings = ["loose", "text"]
tests = ["direction_view_names_are_tagged"]

[[cards.variants]]
id = "name_with_scale"
title = "视图名称与比例组合"
distinguishing = "名称下方或旁边的比例"
encodings = ["text"]
tests = ["section_name_titles_a_section_view"]

[[cards.counter_examples]]
statement = "远离箭尾的短线不并入剖切符号"
test = "stroke_far_from_arrow_stays_apart"

[[cards.parameters]]
name = "stroke_min"
value = 0.8
meaning = "短画长度下限 = 该值 × 字高"

[[cards.parameters]]
name = "stroke_max"
value = 4.0
meaning = "短画长度上限 = 该值 × 字高"

[[cards.parameters]]
name = "stroke_reach"
value = 0.6
meaning = "短画到箭尾的距离上限 = 该值 × 字高"

[[cards.lexicon]]
concept = "DC-G2-065"
entry = "separator"
values = ["—", "–", "-", "－"]
meaning = "剖视名称中两字母之间的横线"

[[cards.variants]]
id = "arrow_block"
title = "视向箭头做成一个图块"
distinguishing = "图块中一条箭杆、一个实心（闭合）箭头、旁边一个大写字母（可在子图块中）"
encodings = ["block"]
tests = ["view_arrow_drawn_as_one_block"]

[[cards.counter_examples]]
statement = "图块中只有箭杆和箭头而没有字母，不作为视向箭头"
test = "arrow_block_without_letter_is_not_a_view_arrow"

[[cards.parameters]]
name = "letter_reach"
value = 3.0
meaning = "字母到箭杆的距离上限 = 该值 × 字高"

[[cards]]
id = "theoretically_exact_dimension"
expression_kind = "dimension"
title = "理论正确尺寸"
meaning = "确定被测要素理论正确位置、方向或轮廓的尺寸（TED），数值外加矩形方框，本身不带公差，由几何公差控制其变动；常见于位置度所用的孔分布圆直径和孔距。"
sources = [
  "GB/T 1182-2018 产品几何技术规范 几何公差 3.7、第 6 章（理论正确尺寸的方框）",
  "GB/T 4458.4-2003 机械制图 尺寸注法",
  "机械制图（第7版）§9-5",
]
knowledge_units = ["K17", "K23", "K26"]
recognition = "以尺寸数值为锚：数值上方有一条平行线，其两端各有一条垂直边下到数值下方；底边常就是数值所立的引线台或尺寸线。方框内的数值即理论正确尺寸；方框的线是框，不是引出线。数值可写在尺寸线延长后的引线台上。"
markers = ["□"]
concepts = ["DC-G4-029"]

[[cards.components]]
role = "value"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "尺寸数值"

[[cards.components]]
role = "frame"
primitives = ["LINE"]
requirement = "围住数值的矩形方框（上边、两侧边、底边）"

[[cards.variants]]
id = "native_value_box"
title = "原生尺寸的数值外加方框"
distinguishing = "方框由散线画在原生尺寸文字周围"
encodings = ["loose"]
tests = ["boxed_native_value_is_theoretically_exact"]

[[cards.variants]]
id = "line_box"
title = "散线尺寸或引出数值外的方框"
distinguishing = "方框由三到四条直线组成，底边可与引线台共用"
encodings = ["loose"]
tests = ["boxed_loose_value_is_theoretically_exact", "boxed_value_on_extended_dimension_line_is_one_dimension"]

[[cards.counter_examples]]
statement = "公差框格的格子围住的公差值不是理论正确尺寸"
test = "frame_cell_value_is_not_a_theoretically_exact_dimension"

[[cards.parameters]]
name = "top_offset_min"
value = 0.45
meaning = "上边到数值中心的距离下限 = 该值 × 字高"

[[cards.parameters]]
name = "top_offset_max"
value = 1.8
meaning = "上边到数值中心的距离上限 = 该值 × 字高"

[[cards.parameters]]
name = "corner_tolerance"
value = 0.25
meaning = "方框角点重合的容差 = 该值 × 字高"

[[cards.parameters]]
name = "box_width_extra"
value = 4.0
meaning = "上边长度上限 = 数值宽度 + 该值 × 字高"

[[cards]]
id = "local_section_boundary"
expression_kind = "break_line"
title = "局部剖视的波浪线"
meaning = "局部剖视中剖开部分与未剖部分的分界线，用细实线徒手画的波浪线表示；剖面线画在它与轮廓之间，可以是填充对象，也可以是一根根散线。细的徒手曲线只能是波浪线，不是可见轮廓（可见轮廓是粗实线）。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线（波浪线）",
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图（局部剖视）",
  "GB/T 17452-1998 技术制图 图样画法 剖视图和断面图",
  "用户 2026-11-06 截图核对：主视图 I 圈中围住散线剖面线的细徒手曲线被认成可见轮廓",
]
knowledge_units = ["K12", "K13"]
recognition = "以一条徒手曲线为锚（开口、无凸度、顶点不少于给定数、每处转角小而整体弯曲；不是粗实线层）：曲线的顶点落在剖面填充的边界上，或有两条以上互相平行的斜向细线（剖面线）一端落在曲线上或其附近，即为局部剖视的边界——判断靠上下文而不靠颜色，各图层颜色因图而异。以图纸自己的细线颜色画的徒手曲线即使连着轮廓也不归入可见轮廓。"
markers = []
concepts = ["DC-G1-032", "DC-G2-023"]

[[cards.components]]
role = "break_curve"
primitives = ["LWPOLYLINE", "POLYLINE", "SPLINE"]
requirement = "细实线徒手曲线"

[[cards.components]]
role = "section_lines"
primitives = ["HATCH", "LINE"]
requirement = "剖面填充或散线剖面线，落在曲线上"

[[cards.variants]]
id = "hatch_entity"
title = "围住剖面填充对象"
distinguishing = "曲线顶点在填充边界上"
encodings = ["loose"]
tests = ["local_section_boundary_around_a_hatch_entity"]

[[cards.variants]]
id = "loose_hatch_lines"
title = "围住散线剖面线"
distinguishing = "两条以上平行斜细线一端落在曲线上"
encodings = ["loose"]
tests = ["local_section_boundary_around_loose_section_lines"]

[[cards.counter_examples]]
statement = "没有剖面线的细徒手曲线也不作为可见轮廓"
test = "thin_free_curve_without_section_lines_is_not_an_outline"

[[cards.variants]]
id = "line_chain"
title = "用一串短直线画的局部剖视边界"
distinguishing = "几段未使用的直线首尾相接、开口，每处转角在给定上限内且整体弯曲，两端落在轮廓上（或略越过），与轮廓一起围住一块剖面区域；可跨图层"
encodings = ["loose"]
tests = ["chain_of_short_lines_around_a_section_is_a_local_section_boundary"]

[[cards.counter_examples]]
statement = "一串首尾相接的短直线不围住剖面区域时（如细线画的台阶），不作局部剖视边界"
test = "chain_of_lines_without_a_section_is_not_a_boundary"

[[cards.parameters]]
name = "line_chain_max_turn_deg"
value = 50.0
meaning = "直线串画的边界每处转角上限（度；段少时转角大于徒手曲线）"

[[cards.parameters]]
name = "line_chain_min_lines"
value = 3.0
meaning = "直线串画的边界最少段数"

[[cards.parameters]]
name = "free_curve_min_vertices"
value = 5.0
meaning = "徒手曲线最少顶点数"

[[cards.parameters]]
name = "free_curve_max_turn_deg"
value = 35.0
meaning = "徒手曲线每处转角上限（度）"

[[cards.parameters]]
name = "line_end_on_curve"
value = 0.35
meaning = "剖面线端点到曲线的距离上限 = 该值 × 字高（手画剖面线常略短或略长）"

[[cards.parameters]]
name = "parallel_deg"
value = 3.0
meaning = "散线剖面线互相平行的角度容差（度）"

[[cards.parameters]]
name = "min_section_lines"
value = 2.0
meaning = "落在曲线上的平行剖面线最少条数"

[[cards]]
id = "dimension_line_parts"
expression_kind = "dimension"
title = "尺寸线与尺寸界线的画法"
meaning = "尺寸界线从轮廓、轴线或对称中心线引出，一般超出尺寸线终端 2 mm 左右；一条线可以同时作两个尺寸的界线；画图时界线起头可能略画进轮廓。尺寸线可以越过终端延长，作为引线把数值写到外面。这些部分都属于相应的尺寸，不是另外的要素。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法 3.1、3.2、4.1",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法",
  "机械制图（第7版）§1 尺寸注法",
]
knowledge_units = ["K17", "K18"]
recognition = "以已识别尺寸的尺寸界线为锚：同一根线上未解释的短端段（不超过给定长度）——在尺寸线一侧为超出段，在轮廓一侧为画进轮廓的起头——并入该界线；较长的未解释段若有另一尺寸的终端箭头垂直落在其上，则为两尺寸共用的界线。尺寸线终端之外从箭尖起共线延伸的细线是尺寸线的延长，沿它找数值。"
markers = []
concepts = ["DC-G4-058", "DC-G4-059"]

[[cards.components]]
role = "extension_line"
primitives = ["LINE"]
requirement = "尺寸界线，含超出段与起头"

[[cards.components]]
role = "dimension_line"
primitives = ["LINE"]
requirement = "尺寸线及其越过终端的延长段"

[[cards.variants]]
id = "end_piece"
title = "界线端部的短段"
distinguishing = "同一根界线上未解释的短端段：超出尺寸线的部分，或起头画进轮廓的部分（界线常分段画或比原生尺寸的界线画得长）"
encodings = ["loose", "native"]
tests = ["extension_line_end_piece_joins_the_extension_line"]

[[cards.variants]]
id = "shared"
title = "两个尺寸共用一条界线"
distinguishing = "另一尺寸的终端箭头垂直落在界线的未解释段上"
encodings = ["loose"]
tests = ["one_line_is_extension_line_of_two_dimensions"]

[[cards.variants]]
id = "extended_to_outside_value"
title = "尺寸线越过终端延长到外面的数值"
distinguishing = "从箭尖起共线向外的细线，数值在其末端或引线台上"
encodings = ["loose"]
tests = ["dimension_line_continues_past_the_terminator_to_the_value", "boxed_value_on_extended_dimension_line_is_one_dimension"]

[[cards.counter_examples]]
statement = "界线上较长的未解释段若没有别的尺寸落在其上，不并入尺寸"
test = "long_free_piece_of_an_extension_line_is_not_absorbed"

[[cards.variants]]
id = "axis_as_extension_line"
title = "轴线、对称中心线兼作尺寸界线"
distinguishing = "点画线（或虚线、双点画线）被尺寸借作尺寸界线：线型属于这条线本身，它整条仍是中心线（或不可见轮廓），尺寸只借用它"
encodings = ["loose", "native"]
tests = ["centre_line_used_as_extension_line_stays_a_centre_line"]

[[cards.counter_examples]]
statement = "细实线画的尺寸界线不因与轴线共线而成为中心线：线型由这条线自己的图案决定"
test = "continuous_extension_line_on_an_axis_is_not_a_centre_line"

[[cards.variants]]
id = "split_extension_line"
title = "尺寸界线断成两段"
distinguishing = "未使用的细线与某尺寸的尺寸界线共线，两者之间只隔不超过给定倍数字高的缺口（为符号、引线或文字让位），是这条界线的另一段"
encodings = ["loose"]
tests = ["extension_line_split_for_a_symbol_is_one_extension_line"]

[[cards.variants]]
id = "drawn_twice"
title = "尺寸线、界线或终端画了两遍"
distinguishing = "一段线落在已认领的尺寸线或尺寸界线上并被它覆盖，或一个终端与已认领的终端同尖同向：同一部分画了两次（重合图线只画一次）；不打印层上的一份让位于打印的一份"
encodings = ["loose"]
tests = ["dimension_parts_drawn_twice_join_the_dimension"]

[[cards.counter_examples]]
statement = "与界线共线但隔得较远的细线不并入界线"
test = "collinear_line_far_from_an_extension_line_is_not_absorbed"

[[cards.parameters]]
name = "split_gap_max"
value = 3.0
meaning = "界线两段之间缺口的上限 = 该值 × 字高"

[[cards.parameters]]
name = "coincident_tolerance"
value = 0.05
meaning = "两次画出的同一部分之间的距离容差 = 该值 × 字高"

[[cards.parameters]]
name = "end_piece_max"
value = 1.0
meaning = "可并入界线的端段长度上限 = 该值 × 字高"

[[cards.parameters]]
name = "terminator_on_line"
value = 0.05
meaning = "终端箭尖落在共用界线上的容差 = 该值 × 字高"

[[cards.parameters]]
name = "perpendicular_cos_max"
value = 0.1
meaning = "箭头方向与共用界线夹角余弦的绝对值上限"
