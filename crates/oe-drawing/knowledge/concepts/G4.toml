[[concepts]]
id = "DC-G4-057"
name = "锥度符号 ▷ 及锥度标注"
aliases = ["锥度符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "用等腰三角形图形符号加锥度值（如1:5）表示圆锥的锥度C=(D−d)/L，符号尖端指向与圆锥方向一致；属于标准锥度系列时可用系列号（如莫氏锥度号）代替数值。"
components = ["图形符号：等腰三角形，GB/T 15754-1995 图5给出长2.5h、高1.4h、斜边与轴线约15°，线宽h/10", "基准线：平行于圆锥轴线的细实线，1995版符号配置在基准线上，2025版以基准线为中心对称；锥度值写在符号之后的基准线上方", "指引线：从基准线一端折出连到圆锥轮廓素线；1995版示例端部直接触线，2025版图8端部为箭头", "方向：三角形尖端朝向圆锥小端；一般不同时注锥角，需要时可另注α/2或α", "沿革：GB 4458.4-84 图31b的旧锥度符号被GB/T 15754-1995取代；GB/T 16675.2-1996表1未列锥度，2012版表1列入"]
variants = ["GB/T 15754-1995: symbol placed on the reference line", "GB/T 15754-2025: symbol centred on the reference line", "earlier GB 4458.4-84 taper symbol (图31b) replaced by GB/T 15754-1995", "symbol + standard series name instead of value (see 标准锥度系列号)", "listed in GB/T 16675.2-2012 表1, absent from 1996 表1"]
dxf_forms = ["INSERT of a taper-symbol block (closed isosceles triangle) on a leader reference line + TEXT/MTEXT '1:5'", "exploded closed LWPOLYLINE or 3 LINE triangle + reference LINE + leader LINE (with or without SOLID arrow) + TEXT", "gdt.shx glyph for conical taper: MTEXT {\\Fgdt;y}1:5", "MULTILEADER with block content and MTEXT '1:20'", "layer 08 or template dimension layer"]
recognition = "锚点为'1:n'形式的比值文字（冒号可能被OCR读成'：'或'.'），其左侧紧邻长约2.5h、高约1.4h的封闭等腰三角形，三角形中线与平行于圆锥轴线的基准线重合或贴近；基准线由一段折线指引线连到圆锥的斜素线。验证：三角形尖端方向应与所指圆锥直径变小方向一致，且D、d、L若注出应满足(D−d)/L≈1/n。与斜度符号∠区分：斜度为两笔开口锐角、一边水平，用于平面；与起模倾斜符号区分：后者是直角三角形且后跟角度；与基准三角形区分：基准三角形贴在要素上并连方框字母；与投影识别符号区分：后者是梯形加同心圆、在标题栏附近。"
confusions = ["斜度符号∠：开口锐角形，用于平面斜度，后接1:n", "起模倾斜符号：直角三角形+角度值", "指引线箭头或几何公差基准三角形", "倒角或角度尺寸：锥度不带°，以比值给出", "第一/第三角画法投影识别符号：截锥梯形+圆，位于标题栏"]
related = ["DC-G4-048", "DC-G4-049", "DC-G4-011", "DC-G4-121", "DC-G4-122", "DC-G2-039"]
priority = "medium"
text_forms = ["1:5", "1:10", "1:20", "1:50", "莫氏锥度 No.3", "Morse No.3"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "符号比例取自 GB/T 15754-1995 图5（2.5h、1.4h、15°、d=h/10）；2025版改为以基准线为中心、尺寸按 GB/T 16901.1。gdt.shx 字母映射与DXF存储形式为通用CAD实践。"
