components = ["默认：不加字样的尺寸是镀涂后尺寸", "镀前标记：在尺寸数字（含公差）右侧加'镀前'或'涂前'", "同时标注：同一要素给两个尺寸，一个加'镀前'，另一个加'镀后'，可上下两行共用一条尺寸线", "省略：装饰性、防腐性的自由表面尺寸，以及镀层不影响配合的配合尺寸，可视为镀前尺寸并省略字样"]
