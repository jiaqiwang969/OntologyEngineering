dxf_forms = ["CENTER-linetype CIRCLE (gear pitch circle) tangent to a CENTER-linetype LINE (rack pitch line)", "Thick tip CIRCLE and thick rack tip LINE overlapping in the mesh zone", "Section view: HIDDEN-linetype LINE in the mesh zone as in DC-G3-077"]
recognition = "锚点为一个点画线圆与一条点画线直线相切（直线到圆心距离等于圆半径，相对误差<1%）；圆外有同心粗实线齿顶圆，直线两侧有粗实线齿顶线和细/粗齿根线，并可见等距梯形齿。与两圆柱齿轮啮合区分：一侧为直线而非圆；与齿轮与平板接触区分：平板无分度点画线和齿形；与带传动区分：带为与带轮相切的粗实线，无点画线分度线。"
confusions = ["齿轮与平板、导轨接触：无齿条分度线与齿形。", "圆柱齿轮啮合：两分度圆相切。", "带与带轮：带的轮廓为粗实线切线，无分度点画线。"]
