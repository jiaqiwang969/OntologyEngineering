[[concepts]]
id = "DC-G5-091"
name = "公差框格第二格（公差带、要素与特征部分）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "公差框格第二格是一串按固定顺序排列的规范元素：公差带形状（φ/Sφ）、宽度与范围、组合/独立（CZ/SZ）、偏置（UZ）、约束（OZ/VA/><）、滤波器、拟合被测要素、导出要素（Ⓐ/Ⓟ）、评定拟合、参数、实体状态（Ⓜ/Ⓛ/Ⓡ）、自由状态（Ⓕ）；只有公差值是必需的。"
components = ["分组顺序（GB/T 1182-2018 图13）：1a 形状、1b 宽度与范围、2 组合、3 偏置、4 约束、5a 滤波类型、5b 嵌套指数、6 拟合被测要素、7 导出要素、8 评定拟合、9 参数、10 实体状态、11 状态", "间隔：不同编号的组之间留空格；同组内以及 1a 与 1b、5a 与 5b 之间不留空格；圆圈字母组（6、7、10、11）连续书写", "区分：拟合参照（第 8 组）和参数（第 9 组）只用不带数字的字母，滤波器（第 5 组）字母后紧跟数字"]
variants = ["elements in numbered groups separated by spaces; circled-letter groups written without gaps"]
dxf_forms = ["TEXT/MTEXT in the second cell of the frame (TOLERANCE entity: value field after the first %%v); tokens separated by spaces, circled letters as Unicode or CIRCLE+TEXT", "exploded: several TEXT entities on one baseline inside the second cell, circled letters as separate CIRCLE + TEXT", "INSERT of a plugin frame block whose value ATTRIB carries the string; or exploded LINE/LWPOLYLINE cells + TEXT"]
recognition = "以框格第二格为锚，把文字按空格切成记号再按组顺序解析：开头 φ/Sφ→形状；数值、t1-t2、t/L、t/a×b→宽度与范围；CZ/SZ/CZR→组合；UZ±x→偏置；OZ/VA/><→约束；字母+数字（G0.8-）→滤波器；圈 C/G/N/T/X→拟合被测要素；Ⓐ/Ⓟ→导出要素；C/CE/CI/G/GE/GI/N/X→评定拟合；P/V/T/Q→参数；Ⓜ/Ⓛ/Ⓡ→实体状态；Ⓕ→自由状态。顺序不合时记为可疑。"
confusions = ["尺寸公差（±0.1、+0.02/-0.01）：写在尺寸数值后，不在框格内", "表面结构参数串（Ra 1.6、-0.8/Rz 3.2）：写在表面结构符号上"]
related = ["DC-G5-090", "DC-G5-088", "DC-G5-087", "DC-G5-030", "DC-G5-037", "DC-G5-033", "DC-G5-038", "DC-G5-040", "DC-G5-102", "DC-G5-065", "DC-G5-062", "DC-G5-039"]
