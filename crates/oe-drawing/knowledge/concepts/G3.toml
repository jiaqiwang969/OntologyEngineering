[[concepts]]
id = "DC-G3-223"
name = "普通螺纹标记"
aliases = ["螺纹旋合长度代号 S、N、L", "螺纹旋向代号 LH"]
group = "G3"
kind = "text_convention"
meaning = "普通（米制）螺纹的规定标记，依次为特征代号M与尺寸代号、公差带代号、旋合长度代号和旋向代号，直接注在螺纹大径尺寸线或引线上，代替画出牙型。"
components = ["尺寸代号：M+公称直径；粗牙省略螺距，细牙写“×螺距”，多线写“×Ph导程P螺距”，可在其后括注线数（如two starts）。", "公差带代号：中径在前、顶径在后（如5g6g），相同只写一个（6H、6g）；现行标准中中等精度常用公差带（如6H、6g）可省略不注。", "旋合长度：S短、L长，中等N不注；也可直接写旋合长度数值。", "旋向：左旋注LH，右旋不注。1995版附录A把LH紧跟尺寸代号（M20×2LH-6H），现行标准写在最后（M14×Ph6P2-7H-L-LH）。", "螺纹副：内外公差带用斜线分开，如M20×2LH-6H/6g。各部分用“-”分隔。"]
variants = ["粗牙不注螺距", "细牙注螺距", "左旋LH", "旋合长度S/L", "螺纹副6H/6g", "粗牙（省略螺距）", "细牙", "多线 Ph…P…", "粗牙省略螺距", "细牙注螺距 M24×2", "多线：Ph…P… 及 (two starts)", "中等旋合长度省略 N", "右旋省略旋向", "S", "L", "N（省略）", "或写具体旋合长度数值"]
dxf_forms = ["DIMENSION (linear or diameter) on layer 08 whose text is overridden with the marking, e.g. 'M10-6g', or keeps the measured value with prefix 'M<>' plus suffix '-6H'", "TEXT/MTEXT on a LEADER for tapped holes, often with count and depth, e.g. '2×M8-6H' plus '深16' or the depth symbol", "Mark sits on the major diameter: thick line for external threads, thin line / 3/4 thin arc for internal threads (see thread conventions)"]
recognition = "锚点为文字正则 (\\d+\\s?[×xX]\\s?)?\\bM\\d+(\\.\\d+)?(\\s?[×xX]\\s?(Ph\\d+(\\.\\d+)?P\\d+(\\.\\d+)?|\\d+(\\.\\d+)?))?(\\(\\w+ starts\\))?(\\s?LH)?(-\\d[a-hA-H](\\d[a-hA-H])?(/\\d[a-h](\\d[a-h])?)?)?(-[SLN]|-\\d+)?(-LH)?。几何关系：所属DIMENSION的测量值或尺寸线两端距离应约等于公称直径，外螺纹尺寸界线引自粗实线大径，内螺纹引自细实线大径；引线终点应落在螺孔圆、3/4细圆弧或螺纹段上。M前的“n×”为个数，旋合长度S/L只在末尾“-”之后。"
confusions = ["小螺纹S：特征代号S在开头，直径小于1.4。", "光滑孔轴公差带（H7、g6、Ø65k6）：字母在前数字在后；螺纹公差带数字在前（6H、5g6g）。", "齿轮模数m：小写，出现在参数表，不跟“-6g”。", "表面结构下限L、最小实体Ⓛ、最小外接N等：位于表面结构符号或公差框格中，不跟在螺纹标记的“-”之后。", "花键标记：以花键图形符号开头，含N×d×D×B等。"]
related = ["DC-G3-232", "DC-G3-088", "DC-G3-087", "DC-G3-089", "DC-G3-024", "DC-G3-005", "DC-G3-083", "DC-G3-219", "DC-G3-224", "DC-G3-231", "DC-G4-088"]
priority = "high"
