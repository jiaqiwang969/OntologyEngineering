[[concepts]]
id = "DC-G3-121"
name = "滚动轴承通用画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在剖视图中不需确切表示滚动轴承外形、载荷特性和结构特征时，用与轴承剖面同大的矩形线框加框中央正立的十字符号表示滚动轴承，通常画在轴的两侧，不画剖面线。"
components = ["矩形线框：粗实线，宽为轴承宽度B、高为(D−d)/2，位于轴外径与座孔之间。", "正立十字：两条互相垂直的粗实线，一条平行于轴线、一条垂直于轴线，交点在框中心，四个端点都不与框线接触。", "画在轴的两侧（上下镜像各一个）；采用规定画法时，规定画法只画在一侧，另一侧用此通用画法。", "变体：需表示外形时画出真实剖面轮廓，十字仍居中且不触轮廓；配套附件（如紧定套）只画外形轮廓；为说明安装方法可画出轴承某一零件。", "同一图样中通用画法和特征画法一般只采用一种。"]
variants = ["矩形线框+正立十字", "画出外形轮廓的通用画法", "附件按外形轮廓绘制", "绘出某一零件的通用画法"]
dxf_forms = ["Closed LWPOLYLINE (or 4 LINEs) plus 2 LINEs forming the cross, all on layer 01 / thick lineweight; no HATCH inside the frame", "INSERT of a library block (GstarCAD/CAXA 图库 滚动轴承 通用画法, AutoCAD Mechanical bearing) placed on both sides of the shaft, sometimes as one block holding both frames", "Mixed block: specified form on one side (HATCH ANSI31 on rings, CIRCLE/rectangle rolling element) and general form on the other"]
recognition = "锚点为轴外径线与孔壁线之间的粗线矩形，内部恰有两条正交粗线段，其交点与矩形中心重合（偏差小于框短边的5%），两臂分别平行和垂直于轴线，四个端点距框线留有间隙（约为对应边长的1/6～1/4）；轴线另一侧有镜像同尺寸框或一个带剖面线的规定画法。区分：动密封圈通用画法是对角X；四点接触轴承特征画法的竖线伸到框边；紧固件十字线无外框且常成阵列；中心线交叉为细点画线并伸出轮廓；平面符号为细实线对角线。"
confusions = ["动密封圈通用画法：框中为对角交叉X而非正立十字。", "四点接触球轴承特征画法：十字的竖线伸到框边（触框），不是通用画法。", "紧固件十字线（轴线垂直于投影面）：独立粗十字，无外框，常按孔位成行成列。", "中心线交叉：细点画线，伸出轮廓之外，不在矩形框中居中。", "平面符号（细实线对角线）与非金属剖面符号（细网格）：均为细线。"]
related = ["DC-G3-119", "DC-G3-122", "DC-G3-183", "DC-G3-124", "DC-G3-032", "DC-G3-103", "DC-G3-127", "DC-G3-109", "DC-G3-026", "DC-G3-225"]
