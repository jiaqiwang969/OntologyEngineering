[[concepts]]
id = "DC-G1-113"
name = "斜体与直体"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "字母和数字可写成斜体（字头向右倾斜，与水平基准线成75°）或直体；CAD 机械图中数字和字母一般以正体输出，表示变量的字母除外，汉字用正体。"
components = ["斜体：字头右倾，与基准线成75°（即倾斜15°）。", "直体（正体）：竖直。", "GB/T 14665-1998 要求数字、字母以斜体输出，2012 版改为正体；手工图和教材示例常用斜体。", "表示变量的字母（如 d、h、L）可用斜体。"]
variants = ["斜体（75°）", "直体/正体", "GB/T 14665-1998 required slanted output; 2012 changed to upright"]
dxf_forms = ["STYLE oblique angle (50) = 15 for italic, or italic font files such as gbeitc.shx vs gbenor.shx", "TEXT group 51 oblique angle per entity; MTEXT inline \\Q15;"]
recognition = "读 TEXT 的倾斜角（51组码）、样式倾斜角或字体文件名（含 itc/italic）。斜体与否不改变文字含义，但能提示图样年代或模板（较老的图多为斜体）。倾斜的尺寸数字（随尺寸线方向旋转，由旋转角50组码表示）不是斜体。"
confusions = ["倾斜的尺寸数字：整体旋转，不是字形倾斜。"]
related = ["DC-G1-102", "DC-G1-103"]
