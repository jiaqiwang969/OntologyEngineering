[[constraints]]
id="nx_cylinder_source_and_geometry"
requirement="req_engineering"
module="nx_worker"
check="execute"
rust_path="crates/oe-nx-worker/src/geometry.rs"
statement="New create_cylinder_solid and inspect_cylinder_solid use actual Job inputs intent bytes/hash before part mutation. Finite128KiB strict intent, mm, exact+Z and bounded positive dimensions/origin, explicit source object/feature ID. UF_NULLSIGN via SDK ABI creates a new body; no negated negative sign or journal. Existing source/controlled representation/complete ownbody, exact bound recomputation, cylinder+two plane topology and original model_edges unique full-circle checks stay mandatory. Native save/input bytes and distinct-process reopen remain separate; no physical/machining/reference-part adoption inferred."
severity="error"

[[validations]]
id="nx_cylinder_software_boundaries"
module="nx_worker"
constraint="nx_cylinder_source_and_geometry"
behavior="source_bound_cylinder_intent_and_independent_geometry_controls"
rust_path="crates/oe-nx-worker/tests/rotating_part.rs"
oracle="Independent nonzero-origin/+Z dimensional intent; invalid unit/axis/dimension/schema/source digest and missing intent refuse with zero part mutation. Wrong radius/length/axis/face/topology/circle membership/owner/partial codes fail, not bbox-only. Existing fixture callbacks remain synthetic and no native PASS is fabricated."
scope="macOS local software tests; current Windows/vendor ABI/build/create-save/freshprocess only from separate actual records"

[[validations]]
id="nx_cylinder_local_cli_bound_input"
module="cad"
constraint="nx_cylinder_source_and_geometry"
behavior="cylinder_plan_uses_actual_source_bytes_and_existing_nx_prepare_coordinate_boundary"
rust_path="crates/oe-cad/tests/rotating_part.rs"
oracle="Intent byteSHA read from actual bounded regular file, exact worker input member mapping, raw source preserved; no connection/CAD/API during local plan. Unknown target/native/engineering qualification retained."
scope="local software source/parameter planning, no remote write"

[[validations]]
id="nx_cylinder_independent_complete_observation"
module="nx_worker"
constraint="nx_cylinder_source_and_geometry"
behavior="independent_frozen_cylinder_shape_and_negative_controls"
rust_path="crates/oe-nx-worker/tests/rotating_part_observation.rs"
oracle="Independent author frozen A/B source values and twelve complete observation controls: old circle owner/catalog/code semantics, fullface unique u32 tags, 1e-9 directions, ExactBounds recomputation, controlled representation, actual mass summary/raw47/unit/body and independent max1e-5mm3/1e-6rel volume predicate. Synthetic inputs are not native execution or physical adoption."
scope="Finite local software oracle; current Windows/native A/B and distinct-process reopen separately verified"
