[[concepts]]
id = "DC-G1-099"
name = "第一角画法投影识别符号"
aliases = []
group = "G1"
kind = "symbol"
meaning = "表示图样采用第一角画法的识别符号：一个圆台的两个视图（等腰梯形和两个同心圆），同心圆在梯形右侧；我国默认第一角画法，必要时画出，一般放在标题栏名称及代号区的下方。"
components = ["等腰梯形（圆台主视图）与两同心圆（左视图）共用一条水平细点画线中心线；第一角画法中同心圆在梯形右侧。", "比例：小圆直径约等于图中尺寸字高 h；大圆直径、梯形长底边及两底边距离均为2h，梯形短底边等于小圆直径；轮廓粗实线不小于0.5 mm。", "两种符号中梯形朝向相同，只是圆的位置不同。", "GB/T 14689-1993 无此条款，2008 版增加；GB/T 18229 称为说明符号。"]
variants = ["GB/T 14692 图6 gives proportions in terms of lettering height h", "CAD form in GB/T 14665 表5", "GB/T 18229 '说明符号'", "not in GB/T 14689-1993; projection-symbol clause 6.4 added in 2008"]
dxf_forms = ["INSERT of a projection-symbol block nested in the title-block block", "exploded: 4 LINEs (trapezoid) + 2 concentric CIRCLEs + CENTER-type LINEs", "located in the 投影符号 cell of the title block"]
recognition = "锚点：一对同心圆（半径比2:1），其水平中心线延长穿过一个等腰梯形（两平行边竖直，高度约等于大圆直径）。判断圆心相对梯形的位置：在右侧→第一角，在左侧→第三角。通常位于标题栏投影符号格内，尺寸很小（大圆直径约5~10 mm）。与锥度符号（单个三角形、无圆）和同心圆孔的端视图（尺寸大、无梯形）区分。"
confusions = ["第三角画法投影识别符号：同心圆在梯形左侧。", "锥度符号：等腰三角形，注在锥度数值前。", "同心圆孔的端视图：真实结构，尺寸大。"]
related = ["DC-G1-100", "DC-G2-084", "DC-G9-021"]
