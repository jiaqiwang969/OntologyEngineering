meaning = "全跳动：跳动公差，工件绕基准轴线连续回转、指示表沿整个被测表面移动时的总读数变动；指向圆柱面为径向全跳动，指向端面为轴向全跳动。"
components = ["特征符号：两支平行斜向箭头（向右上，开口箭头或实心箭头），两箭杆下端由一条水平短线相连", "第二格：公差值（不加 Ø）", "基准格：基准轴线，常为公共基准 A-B", "指引线落点决定类别：圆柱面轮廓为径向，端面为轴向（旧称端面全跳动）"]
variants = ["径向全跳动", "轴向全跳动"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;t} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph two parallel inclined LINE shafts with short LINE (or SOLID) arrowheads and a base LINE joining the tails in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⌰ (U+2330) (or MTEXT font switch {\\Fgdt;t}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内两条平行斜线（与水平约 60°–75°），各自上端有箭头、下端由一条水平短线相连；只有一支箭头则为圆跳动，无箭头无底线则为平行度。框格必有基准。指引线箭头落在平行于基准轴线的轮廓上读径向，落在垂直于轴线的端面线上读轴向。"
confusions = ["圆跳动（单支箭头、无底线）", "平行度 //（扫描件或低分辨率时箭头不清易混）", "指引线/尺寸线箭头（在框格外）"]
related = ["DC-G5-057", "DC-G5-090", "DC-G5-002", "DC-G5-108", "DC-G5-100"]
priority = "high"
text_forms = ["⌰ 0.03 A-B", "⌰ 0.05 A"]
knowledge_units = ["K23", "K24", "K25"]
