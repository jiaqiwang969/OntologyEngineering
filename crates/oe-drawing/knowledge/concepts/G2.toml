[[concepts]]
id = "DC-G2-068"
name = "视图比例与视图名称组合标注"
aliases = []
group = "G2"
kind = "text_convention"
meaning = "图样的基本比例填写在标题栏比例栏中；某视图采用与基本比例不同的比例时，在该视图上方与视图名称组合标出比例（如“I 4:1”“A 2:1”）。"
components = ["视图名称：字母、X—X或罗马数字。", "比例：在名称下方（以短横线隔开，呈分数形式）或右侧。", "基本比例：在标题栏比例栏，只有不同时才在视图处注出。"]
variants = []
dxf_forms = ["MTEXT stacked fraction ('\\SI^4:1;', '\\SA-A/2:1;') or two TEXT entities (name above, scale below) with a short LINE between", "Single TEXT 'A 2:1' / 'I 4:1' with spaces"]
recognition = "以比例文字（数字:数字）为锚点：它位于视图名称正下方（中间可有水平短线）或右侧约一个字宽以内，即作为该视图的局部比例，量测换算时使用。标题栏格内的比例为基本比例；锥度、斜度的“1:20”前有锥度/斜度符号或位于尺寸处。"
confusions = ["尺寸文字及锥度、斜度比值。", "单独的剖视名称。", "标题栏比例栏中的比例。"]
related = ["DC-G1-115", "DC-G1-114", "DC-G2-075", "DC-G2-065", "DC-G9-025"]
priority = "high"
text_forms = ["I 4:1", "A 2:1", "A—A 2:1", "2:1"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = ["view_callout"]
recognizer = "partial"
