[[concepts]]
id = "DC-G1-093"
name = "圆心符号"
aliases = []
group = "G1"
kind = "symbol"
meaning = "绘制圆时可在圆心处画出圆心符号（小十字），两条中心线以长画相交于圆心。"
components = ["圆心处的小十字，由两条正交短画构成，交点即圆心。", "两条中心线在长画处相交；CAD 中可用圆心标记命令生成。"]
variants = ["中心线交叉", "CAD 圆心标记（短十字）"]
dxf_forms = ["DIMCEN centre mark: two short LINEs forming a cross (positive value) plus extension lines (negative value), produced with radius/diameter dimensions or the centre-mark command", "AutoCAD 2017+ CENTERMARK objects, typically stored as an anonymous BLOCK of LINEs", "plain cross of two LINEs about 2–4 mm long"]
recognition = "锚点为 CIRCLE/ARC 的圆心；该处有两条正交短线（长度远小于直径，常约2~4 mm），交点与圆心重合（距离<0.1 mm）。十字为点画线且超出圆周时属于中心线；为细实线短十字且不超出圆周时属于圆心符号。与冲点标记区分要看是否有对应的圆。"
confusions = ["短中心线：细实线十字超出圆周。", "定位点/冲点：可能无对应圆。", "孔系分布中心：点画线圆与径向线。"]
