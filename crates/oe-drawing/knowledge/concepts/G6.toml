[[concepts]]
id = "DC-G6-058"
name = "轮廓方向符号（垂直于主要纹理方向）"
aliases = ["轮廓方向符号（平行于主要纹理方向）", "轮廓方向符号（圆周方向）", "轮廓方向符号（与主要方向成一定角度）"]
group = "G6"
kind = "surface_indication"
meaning = "ISO 21920-1草案中放在符号旁位置[u]的图形符号，规定测量轮廓相对于表面主要纹理方向的取向：垂直于主要方向、平行于主要方向、以表面中心为基准的圆周方向，或与主要方向成一定角度；缺省为垂直于纹理，不写。"
components = ["位置[u]：符号旁，与横线上方的纹理[t]和工艺[s]位置不同。", "四种符号（草案表3）：垂直于主要方向、平行于主要方向、圆周方向、与主要方向成角度（附角度值，0°<n≤90°，如45°）。", "相对于工件特征的轮廓方向改用相交平面指示符加基准字母（9.5.3）。", "GB/T 131-1993用“测量方向”箭头加文字表达类似要求。"]
variants = ["ISO 21920-1 draft 9.5.2 表3, placed at position [u] beside the symbol", "default (not written): profile perpendicular to the lay"]
dxf_forms = ["small glyph block or LINE/ARC strokes beside the roughness symbol", "angle TEXT '45°' ('45%%d') for the angled variant", "possibly gdt.shx-like glyphs; exact strokes unverified"]
recognition = "锚点：草案完整符号；在位置[u]（符号旁，不在横线上方）找小图形符号或角度值。字形在OCR中不可辨，须对照扫描件建立模板。属于草案写法，普通零件图上罕见。区分纹理符号（草案中位于横线上方[t]）、几何公差垂直度、平行度、同轴度（在框格内）、全周小圆和角度尺寸。"
confusions = ["纹理符号⊥、=：草案中位于横线上方", "几何公差垂直度、平行度、同轴度：位于框格内", "全周小圆：在长边与横线拐角处", "角度尺寸：附着于角度尺寸线"]
related = ["DC-G6-044", "DC-G6-038", "DC-G6-039", "DC-G6-036", "DC-G6-033", "DC-G6-059", "DC-G5-058"]
priority = "rare"
