[[concepts]]
id = "DC-G4-030"
name = "直径尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "表示圆柱孔、轴等回转要素或大于半圆的圆弧的直径大小：数字前加注Ø，尺寸线通过圆心或其延长线通过圆心，终端用箭头。是零件图上最常见的尺寸之一。"
components = ["圆视图：细实线尺寸线沿直径方向通过圆心，两端箭头尖落在圆周上，Ø和数字写在尺寸线上方或中断处。", "非圆视图：从回转体两条转向轮廓线引出尺寸界线，尺寸线垂直于轴线，数字前仍加Ø。", "小圆：箭头可画在圆外由外指向圆周，数字可外移或用带箭头的指引线引出。", "半视图/半剖视：尺寸线略过中心线，只在一端画箭头，数值仍为全直径。", "终端必须用箭头；同径多孔在一个孔上注“n×Ød”。"]
variants = ["full dimension line across the circle", "half dimension line on half-views (one arrow, see 对称机件)", "leader to small hole"]
dxf_forms = ["DIMENSION dimtype 3 (diameter) on a CIRCLE/ARC; code 1 '<>' with a DIMPOST/style prefix, or explicit '%%c<>'", "DIMENSION dimtype 0/1 (linear) in the non-circular view with override text '%%c<>' or '%%c30H7'", "exploded: LINE (dimension line through centre) + 2 SOLID or INSERT arrowheads + TEXT/MTEXT '%%c30'", "MTEXT with '\\U+2205' or '\\U+00D8', gdt.shx {\\Fgdt;n}, or Chinese 'Φ'/'φ' typed as plain text", "small holes: LEADER/MULTILEADER with text 'n×%%cd'", "layer 08 or template dimension layer"]
recognition = "锚点为前缀为Ø的尺寸文字（%%c、\\U+2205、\\U+00D8、ø、Φ、φ；OCR常误作“¢”“$”“中”“0”）。圆视图：尺寸线或其延长线通过某CIRCLE/ARC圆心，箭头尖距圆周≈0，两尖点间距≈数值×视图比例。非圆视图：两条尺寸界线落在一对平行粗实线（回转体转向轮廓）上，其间常有居中的细点画线轴线。DIMENSION类型3可直接关联圆。排除：R前缀且单箭头起于圆心为半径；SØ为球；□为方截面；只有一端箭头但越过中心线的Ø仍是全直径。"
confusions = ["半径尺寸：前缀R，只有一个指向圆弧的箭头，尺寸线起于圆心。", "球直径SØ：Ø前多一个S，对应球面。", "正方形尺寸□或B×B：两平行线为方截面对边，无回转轴线。", "对边距或普通线性尺寸：无Ø前缀，即便两线间有中心线也不是直径。", "对称机件单箭头直径：只有一端箭头，但为全直径，不能当半径。", "螺纹规格：以M等开头（M20），不用Ø。"]
related = ["DC-G4-055", "DC-G4-006", "DC-G4-015", "DC-G4-016", "DC-G4-054", "DC-G4-094", "DC-G4-083"]
priority = "high"
text_forms = ["Ø30", "%%c30", "Ø30H7", "Ø25k6", "4×Ø8", "Ø20±0.02", "Φ50"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = ["second"]
expert_checked = false
notes = "Rules from GB/T 4458.4-2003 4.2.3/5.2 and textbook 表1-5 (diameter for arcs larger than a semicircle). DXF codes and OCR variants are general CAD practice. Seen on one project drawing."
