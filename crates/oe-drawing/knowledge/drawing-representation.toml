distinguishing = "序号圆点在块内，明细栏该行有标准编号"
encodings = ["block"]
tests = ["parts_list_block_rows_match_item_numbers"]

[[cards.counter_examples]]
statement = "没有序号指着、或明细栏该行没有标准编号的结构线图块不当作标准件"
test = "structure_block_without_a_standard_row_is_not_a_standard_part"

[[cards.parameters]]
