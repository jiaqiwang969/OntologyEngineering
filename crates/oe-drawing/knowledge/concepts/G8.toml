[[concepts]]
id = "DC-G8-014"
name = "标准件直接标注规格"
aliases = []
group = "G8"
kind = "sheet_element"
meaning = "部件中的标准件可以不编写序号，而用指引线把它的数量、名称、规格和标准编号直接标注在图上，如“2×螺钉M4×16 GB/T 67—2000”；这种情况下明细栏中不再单列该标准件。"
components = ["一根指引线（起点圆点或箭头）指向图中的标准件。", "指引线末端的水平基准线上方写“数量×名称规格”，下方或同行写标准编号。", "同一张图中其他零件仍用序号标注，两种方式可以并存。"]
variants = []
dxf_forms = ["LEADER/MLEADER + two-line MTEXT: '2×螺钉M4×16' over 'GB/T 67-2000' (× often typed as 'x' or 'X')", "exploded: LINE leader + horizontal LINE + two TEXT entities on layers 09/11"]
recognition = "以成对的两行文字为锚点：一行匹配“^\\d+\\s*[×xX]\\s*[\\u4e00-\\u9fa5]+.*\\d”（数量×名称规格），另一行匹配“(GB|JB)/T\\s*\\d+(\\.\\d+)?[-—]\\d{4}”（标准编号），两行左对齐、分别位于一条水平基准线上下，并连一根指引线指向某紧固件（螺钉、销、垫圈）的投影；该紧固件附近没有整数序号。可进一步核对规格与图上投影尺寸是否相符（如M4的螺纹大径按比例换算约为4）。与零件序号的区别：末端是名称加规格而不是单一整数；与螺纹标记的区别：螺纹标记只含螺纹代号，不含零件名称和标准号。"
confusions = ["零件序号：末端为单一整数。", "螺纹标记或尺寸：只含螺纹代号，无零件名与标准号，通常在尺寸线上。", "明细栏中的紧固件标记：在明细栏名称、代号列中，不在视图上。"]
