[[concepts]]
id = "DC-G3-201"
name = "链传动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构或传动简图中表示两轴间以链条传递运动的链传动，可另加标记指明环形链、滚子链或无声链。"
components = ["端视形式：两个带十字点画线中心线的链轮圆，以两条与两圆都相切的直线表示链条，与带传动端视形式相同。", "侧视形式：两根平行粗轴线上各有一个内画“×”的菱形链轮。", "指明链型时在链线上加小标记：环形链为扁圆，滚子链为两条短竖划穿过链线（形如“#”），无声链为“V”形折线；例如无声链传动在切线上画该折线。", "1984 版 A.3 与 2013 版 12.3 图形一致。"]
variants = ["一般符号", "环形链", "滚子链", "无声链"]
dxf_forms = ["Two CIRCLEs on layer 01 with centre LINEs on layer 05 plus two tangent LINEs", "Side form: rhombus LWPOLYLINEs on thick shaft LINEs, each with an × of two short LINEs", "Chain-type mark as small ELLIPSE, two short LINEs or a V polyline sitting on the tangent LINE", "INSERT of a library block"]
recognition = "锚点：两个圆加两条公切线（同带传动）。判为链传动的依据：侧视轮体为菱形（而非矩形），或切线上有扁圆、双竖划、“V”形折线等链型标记。无标记的端视形式与带传动无法区分时，应结合侧视、明细或文字判断。与齿轮传动区分：无公切线、两节圆直接相切。"
confusions = ["带传动符号：侧视带轮为矩形，带型标记为倒三角、小圆、齿形折线或短粗线。", "齿轮传动：节圆相切，无公切线。", "装配图中链传动简化画法：画在实际视图中，链用点画线等表示并有尺寸。"]
related = ["DC-G3-163", "DC-G3-207", "DC-G3-068", "DC-G8-016"]
priority = "low"
