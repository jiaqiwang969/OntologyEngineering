[[concepts]]
id = "DC-G5-107"
name = "被测导出要素的指引线（与尺寸线对齐）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "被测要素是导出要素（中心线、中心面、中心点）时，框格指引线的箭头终止在该尺寸要素的尺寸线延长线上，即与尺寸线箭头对齐；也可在框格内加 Ⓐ，此时指引线不必对齐、可终止在表面上。"
components = ["指引线箭头位于尺寸线的延长线上、与尺寸线共线，可代替尺寸线一端的箭头", "或：第二格加 Ⓐ（仅限回转体），指引线与尺寸线错开，终止于组成要素（圆点或箭头）", "旧注法（ISO 1101:1983）：箭头直接指向轴线、中心面或公共轴线（GB/T 1182-2018 A.4.1 已废止）", "旧注法：用指引线箭头方向表示导出要素只在一个方向的测量方向（A.3.6 已废止）"]
variants = ["alternative: Ⓐ in the frame with a non-aligned leader ending on the surface", "obsolete (ISO 1101:1983): leader arrow pointing directly at the axis or median plane, also common axis (GB/T 1182 A.4.1)", "obsolete: leader arrow direction used to give the measuring direction of a derived feature (A.3.6)"]
dxf_forms = ["LEADER/exploded LINE + SOLID arrowhead whose shaft is collinear with a DIMENSION's dimension line and whose tip touches an extension line", "DIMENSION entity drawn with one arrow suppressed (DIMSAH/DIMSE) so that the frame leader arrow takes its place", "old drawings: leader arrow tip on a centre LINE (CENTER-type linetype, layer 05)"]
recognition = "以框格指引线末端箭头为锚：若箭头所在直线与某直径或宽度尺寸线共线（夹角≤3°、偏差≤0.3h），箭头尖落在该尺寸的尺寸界线上，则被测要素为该尺寸要素的导出要素（轴线或中心面）；箭头尖直接落在中心线上时按旧注法读为该轴线。框格有 Ⓐ 时，即使箭头在表面上也读为导出要素。"
confusions = ["组成要素指引线：箭头在轮廓或延长线上，与尺寸线明显错开", "尺寸线本身的箭头：属于尺寸，两端都有", "基准三角形：近等边，属于基准符号"]
