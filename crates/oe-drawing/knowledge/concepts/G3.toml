[[concepts]]
id = "DC-G3-075"
name = "齿条画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "齿条按齿轮规定画法：齿顶线粗实线、分度线细点画线、齿根线细实线；在一个视图中画出齿形，需注齿条长度时在画齿形的图中注出，并在另一视图中用粗实线画出齿部范围线。"
components = ["画齿形的视图：齿顶线、分度线、齿根线三条平行线，沿长度画出若干梯形齿。", "齿部长度注在画齿形的视图上。", "另一视图中用横跨齿宽的粗实线标出齿部起止范围。", "剖视中轮齿不画剖面线。"]
variants = ["画出齿形的视图", "另一视图粗实线范围线"]
dxf_forms = ["Three parallel LINEs: thick tip, CENTER-linetype pitch (layer 05), thin root; a row of trapezoidal tooth profiles (thick LINE/LWPOLYLINE) along part or all of the length", "Range lines: thick LINEs perpendicular to the rack length in the other view", "Linear DIMENSION of the toothed length; parameter table TEXT (模数 m, 齿数 z)"]
recognition = "锚点为一条长细点画线（分度线），其两侧各有一条平行线：外侧粗实线（齿顶线，距分度线≈m）、内侧细实线（齿根线，距≈1.25m）；沿此方向有等距（齿距≈πm）排列的梯形齿廓，齿侧与法线约成20°。另一视图出现两条垂直于长度方向的粗实线范围线。与花键轴、齿轮轴区分：后者为回转体、有轴线对称；与防滑锯齿表面区分：无点画线分度线和参数表，齿距不按πm。"
confusions = ["花键轴、齿轮轴：回转零件，轮廓关于轴线对称。", "锯齿形或防滑表面：无分度点画线，无模数参数。", "普通台阶面：无齿形与分度线。"]
related = ["DC-G3-079", "DC-G3-074", "DC-G3-022", "DC-G3-205", "DC-G1-047"]
priority = "low"
text_forms = []
knowledge_units = ["K13", "K37"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.2-2003 第3.6条及图4。齿高比例m/1.25m、20°齿形角为标准齿制的一般知识。"
