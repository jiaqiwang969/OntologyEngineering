recognition = "锚点：点画线圆（或圆弧），其上有≥2个小圆（孔）的圆心与之距离小于孔半径的0.1倍；均布时相邻孔角距相等。附近常有该圆的 Ø 尺寸和“n×Ø”文字。与分度圆区分：分度圆上无孔，且有同心的粗实线齿顶圆。"
