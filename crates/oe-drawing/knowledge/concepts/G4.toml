[[concepts]]
id = "DC-G4-056"
name = "起模斜度的倾斜符号注法"
aliases = []
group = "G4"
kind = "dimension_symbol"
meaning = "模制件（铸件、注塑件等）上需起模的表面，用倾斜符号加起模角度标注，说明该面相对起模方向的斜度和方向；视图本身可仍按无斜度画出。"
components = ["单方向倾斜符号：小直角三角形（一条竖边、一条水平边和斜边），放在指引线基准线上，后接起模角度如2°；三角形朝向表示斜度方向", "指引线：从基准线折出，以箭头指向需起模的表面或其轮廓边", "组合倾斜符号与整体一周符号：用于围绕轴线的起模特征，一周符号标在分模线上、位于特征轮廓与组合倾斜符号之间（规则19、20）", "标注规则：回转体只在一侧标注；非回转体每个面分别标注或延伸起模面；在剖视图上标注时起模延伸到整个特征平面", "可同时用尺寸线和指引线箭头标出起模的准确位置或部分（规则6）"]
variants = ["single-direction inclination symbol", "combined inclination symbol", "all-around (一周) marking", "draft in section view"]
dxf_forms = ["INSERT of a draft-symbol block (small right triangle) with angle ATTRIB/TEXT, attached to a leader — typical of mould/casting templates", "exploded: 3 LINE (triangle) + TEXT '2%%d' on a reference LINE; LEADER/MULTILEADER or LINE + SOLID arrow to the face", "MULTILEADER with block content (triangle) and MTEXT angle", "layer 08/09 or template dimension / leader layer"]
recognition = "锚点为指引线基准线上的小角度文字（数字+%%d或°，常见0.5°~3°），其左侧紧邻一个高约h的封闭小直角三角形（3条LINE或块）。指引线箭头落在轮廓边上，而该轮廓在视图中往往仍是竖直/水平直线（未画出斜度）。附近常有分模面符号、铸件技术要求或线性公差。与斜度符号∠区分：斜度符号为开口锐角形，后跟1:n比值；与锥度符号区分：锥度为等腰三角形、对称于基准线、后跟1:n；与角度尺寸区分：角度尺寸有以顶点为圆心的圆弧尺寸线和两条尺寸界线。"
confusions = ["斜度符号∠（GB/T 4458.4）：开口锐角形，后接比值1:n，用于一般零件斜面", "锥度符号：等腰三角形，后接1:n", "角度尺寸：圆弧尺寸线+两条径向尺寸界线", "几何公差基准三角形：贴在要素上并连接方框字母"]
related = ["DC-G3-061", "DC-G4-048", "DC-G4-057", "DC-G4-134", "DC-G7-046", "DC-G4-155"]
priority = "low"
text_forms = ["2°", "1°30'", "△2°（倾斜符号+角度）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 24744 中定义符号的6.7.1–6.7.4条扫描缺失；单方向符号的直角三角形外形取自图63–65和图79的示例，组合倾斜符号和一周符号的具体外形未核实。DXF形式为通用实践推断。"
