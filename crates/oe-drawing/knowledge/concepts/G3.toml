[[concepts]]
id = "DC-G3-182"
name = "滑块与导杆符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示带两个运动副元素、其中至少一个为棱柱副的构件：连接两个棱柱副的构件（含滑块），以及连接回转副与棱柱副的构件（含导杆、滑块）。"
components = ["连接两个棱柱副的通用情况：一根粗线构件两端各接一个滑块矩形，两个矩形方向可不同，接点带实心楔。", "连接两个棱柱副的滑块：L形粗线构件的两臂各套一个滑块矩形，矩形分别在两条导路上，两导路夹角标θ（1984版注明θ可为任意值）；可用符号把一臂画成长圆形导槽。", "连接回转副与棱柱副的通用情况：滑块矩形套在导路线上，一根构件从滑块引到铰链小圆。", "导杆：一根长杆一端铰接在固定铰链（三角支座加机架斜线）上，滑块矩形套在杆上滑动；可用符号把导杆画成长圆形导槽。滑块：矩形内含铰链小圆，坐在带机架斜线的导路上。", "2013版条号7.3.2～7.3.3.3，1984版4.3.2～4.3.3.3，图形一致。"]
variants = ["连接两个棱柱副：通用情况、滑块", "连接回转副与棱柱副：通用情况、导杆、滑块"]
dxf_forms = ["Rectangles as closed LWPOLYLINE (often rotated to follow the guide) on layer 01, links as LINE with SOLID wedges", "Slotted guide bar alternative as LWPOLYLINE with two arc ends (obround) or two LINEs + two ARCs", "Fixed pivot = CIRCLE + triangle + short 45° strokes; angle θ as TEXT/MTEXT (Greek theta) with a small ARC", "INSERT of slider / guide-bar library blocks"]
recognition = "锚点为滑块矩形，判断其长边方向是否与一根贯穿或相接的直线（导路或导杆）平行。导杆：该直线一端终止于带三角支座的固定铰链；滑块（两棱柱副）：有两个矩形在不同导路上，由L形或直线构件连接，可能附θ角标。长圆形（两端半圆）细长框套在铰链上→导槽可用符号。与棱柱副符号区分：棱柱副只表示一对副，本概念是带两对副的构件整体。"
confusions = ["棱柱副（移动副）符号：只有一个滑块与导路，不表示构件两端的另一副。", "长圆孔（腰形孔）投影：零件图上带中心线和尺寸，不与单线构件和固定铰链相接。", "凸轮从动杆：杆端与凸轮轮廓接触，不在杆上套滑块。"]
related = ["DC-G3-178", "DC-G3-155", "DC-G3-152", "DC-G3-175", "DC-G3-158"]
priority = "rare"
text_forms = ["θ"]
knowledge_units = ["K13"]
recognition_cards = []
recognizer = "none"
