[[concepts]]
id = "DC-G5-043"
name = "全周符号"
aliases = []
group = "G5"
kind = "symbol"
meaning = "全周符号：在指引线与参照线的转折处画一个小圆，表示规范适用于组合平面所截出的封闭轮廓上的每一个要素，而不只是箭头所指的一处；现行标准要求同时给出 SZ、CZ 或 UF。"
components = ["小圆：细实线圆，直径约等于字高 h（约 0.4–0.5H），圆心在指引线与水平参照线的交点", "指引线与参照线：参照线连公差框格左/右中点，指引线以箭头指在封闭轮廓之一上", "组合平面框格：二维中宜在框格右侧加一个左侧带圆的组合平面框格（DC-G5-105）；不加者为不推荐写法", "公差框格第二格应有 SZ、CZ 或 UF 之一（基准已锁定全部自由度时除外）；多见于线、面轮廓度"]
variants = ["2D with collection plane indicator (recommended)", "deprecated 2D form without collection plane indicator (GB/T 1182 A.2.3)", "withdrawn readings without SZ/CZ/UF (A.3.4; GB/T 17852 C.3/C.4)", "用于线轮廓度/面轮廓度"]
dxf_forms = ["exploded: CIRCLE (r≈0.4–0.6h) centred on the vertex where the leader LINE meets the horizontal reference LINE", "LEADER/MLEADER plus a separate CIRCLE at its bend point; some GB plugin leader blocks contain the circle", "custom leader objects of mechanical add-ons with an 'all around' flag, saved as block or proxy graphics (uncertain)"]
recognition = "锚点为小圆：圆心与一条折线（框格参照线 + 指引线）的转折点重合（≤0.1 倍圆半径），参照线另一端接公差框格边线中点，指引线末端是落在轮廓上的箭头。圆半径约 0.4–0.6h。圆心不在折点、或折线另一端接的是表面结构符号/焊缝基准线，则不是几何公差全周。两个同心圆是全表面。"
confusions = ["表面结构的全周符号：小圆在表面结构符号长边与横线交点处（DC-G6-070）", "焊接周围焊缝符号：小圆在焊缝指引线与基准线交点处（DC-G7-106）", "圆度符号（在框格第一格内）与全表面符号（两同心圆）", "指引线终端圆点（实心、在线的末端而不在转折处）"]
related = ["DC-G5-105", "DC-G5-044", "DC-G5-077", "DC-G5-082", "DC-G5-030", "DC-G5-035", "DC-G5-036", "DC-G6-070", "DC-G7-106", "DC-G1-094"]
priority = "medium"
text_forms = []
knowledge_units = ["K23", "K24", "K25"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 1182-2018 Annex A: omitting the collection plane indicator in 2D is deprecated (A.2.3); reading all-around as one common zone without CZ is withdrawn (A.3.4), same in GB/T 17852 C.3/C.4. Older drawings (textbook form) show only the circle; read them by the edition in force. General CAD practice, not from the sources: TOLERANCE entity, gdt.shx letter codes, Unicode code points, block/explode forms and layer use."
