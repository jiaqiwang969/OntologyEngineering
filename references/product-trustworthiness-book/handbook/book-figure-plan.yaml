# 全书图谱计划（《产品可信工程》20 章版）
# 对标《工程本体论》deck_plan.json：每章一张章首导读图（视觉隐喻，不编号）
# + 正文编号图（图 N-M，章内递增）。本文件是批量生成的机器正本；
# 各章 chapter.md 中的“【待生成】”占位块与本文件一一对应。
# 生成后：图片替换占位块，占位块中的提示词回收进本文件的 generated 记录。

style: >-
  Consistent flat vector textbook illustration system across all pages:
  muted slate blue and teal palette with one warm amber accent, clean white
  background, thin precise line work, generous negative space, calm
  professional academic mood. Absolutely no text or lettering of any kind,
  no watermark. 统一风格串，拼接在每条提示词之后使用。

numbering:
  chapter_art: 不编号（章首导读图，置于章标题与导读框之间）
  in_text: 图 N-M（N=章号，M=章内递增；当前每章规划 1 张，即 图 N-1）
  labels_policy: 图内默认无文字；确需受控中文标签的图逐条列出 labels，
    生成后由确定性叠加层校对（沿用 ch01-fig01 先例）

chapter_art:
  - id: art-preface
    file: front-matter/preface.md
    metaphor: 黑板闭环——部门箭头围成一圈，中心空白，一只手正在补画中心
    prompt: 一块深色黑板，粉笔画出六个方框围成一个环，箭头首尾相连；环的中心是一块醒目的空白，一只手持粉笔正要在中心落笔，粉笔灰微扬。琥珀色点缀在中心位置。
  - id: art-ch01
    file: ch01-introduction/chapter.md
    metaphor: 六盏绿灯照着一张没人签字的放行单
    prompt: 六盏悬挂的绿色指示灯从上方照亮一张摊开的文件，文件末尾的签名线空着，一支钢笔搁在旁边未动。灯光是冷绿色，签名线区域用琥珀色微光强调。
  - id: art-ch02
    file: ch02-concepts-terminology/chapter.md
    metaphor: 纷乱的话语汇入一卷立起的词典，词典成为承重柱
    prompt: 画面左侧许多大小不一、相互重叠的空白对话气泡，向右逐渐排列整齐，汇入一卷竖立的厚书；厚书像建筑立柱一样撑住上方的一道横梁。柱身一处琥珀色书签。
  - id: art-ch03
    file: ch03-safety-management/chapter.md
    metaphor: 一张桌子六把椅子各归其位，一支笔悬在签字线上方
    prompt: 俯视一张长桌，六把椅子分列，每个座位前有一块空白名牌；桌面尽头一份文件与一支悬停的钢笔，笔尖下的签名线以琥珀色强调。
  - id: art-ch04
    file: ch04-concept-hara/chapter.md
    metaphor: 画满装置的白板上，唯一空着的是一个问号形的留白
    prompt: 一块画满机械装置草图与连线的白板，密而有序；白板中央留出一块问号形状的空白区域，以琥珀色描边，一只手指向这块空白。
  - id: art-ch05
    file: ch05-system-development/chapter.md
    metaphor: 目标如水从高塔沿渠道分流，沿途有闸门与量杯
    prompt: 一座高处的水塔沿两条渠道向下分流到两个水池，渠道沿途设有小闸门和量杯；每个闸门处水流清晰可见。其中一个量杯以琥珀色强调。
  - id: art-ch06
    file: ch06-hardware-development/chapter.md
    metaphor: 放大镜下的一个数字长出根系，扎进一摞文件
    prompt: 一枚大号放大镜悬在画面中央，镜片下一个抽象的数字符号向下长出树根般的细线，扎入下方一摞整齐的纸页；一条根须以琥珀色发光。
  - id: art-ch07
    file: ch07-software-development/chapter.md
    metaphor: V 形山谷两侧的阶梯对望，中间一座挂着沙漏的桥
    prompt: 一道 V 字形山谷，两侧各有一列下行与上行的阶梯彼此相对；谷顶两侧由一座轻巧的绳桥相连，桥中央挂着一只小沙漏，沙漏为琥珀色。
  - id: art-ch08
    file: ch08-asil-decomposition-dfa/chapter.md
    metaphor: 两条并行管道在地下汇入同一根总管
    prompt: 地面上两条整齐平行的管道各自独立延伸；剖面视角显示地面之下两条管道悄然汇入同一根粗总管。汇合点以琥珀色标示。
  - id: art-ch09
    file: ch09-production-operation/chapter.md
    metaphor: 一张图纸走进厂门，投影成一排各有差异的零件
    prompt: 左侧一张竖立的蓝图纸样剪影，穿过一道工厂大门形状的门框，右侧投影出一排相似但细节各异的零件轮廓，每个零件脚下拖着一条短短的时间线。其中一个零件以琥珀色描边。
  - id: art-ch10
    file: ch10-supporting-processes/chapter.md
    metaphor: 长桌上的文件塔，塔顶一页悬空未连接
    prompt: 一张长会议桌上，纸页层层叠成一座稳固的塔；塔顶上方悬浮着一页纸，与塔身之间留有一段明显的空隙，空隙处以琥珀色虚线示意未连接。
  - id: art-ch11
    file: ch11-claim-ontology/chapter.md
    metaphor: 一句话被拆成七块积木，逐一放进卡槽
    prompt: 一条长横幅般的纸带正在被拆解成七块形状各异的积木，右侧一块底板上有七个对应形状的卡槽，部分积木已入槽，一块悬在半空。空槽之一以琥珀色强调。
  - id: art-ch12
    file: ch12-identity-ontology/chapter.md
    metaphor: 三张吊牌对着一台天平，链环逐节相扣
    prompt: 三张系着细绳的空白吊牌悬在上方，下方一台精致的天平；连接吊牌与天平的是一条逐节相扣的锁链，其中一节以琥珀色发光，另有一节尚未闭合。
  - id: art-ch13
    file: ch13-governance-ontology/chapter.md
    metaphor: 组织关系图上，一条过短的边亮了红灯
    prompt: 一张由圆点与连线构成的组织关系图，结构清晰；其中两点之间一条明显过短的连线以琥珀色高亮，旁边一只小圆形指示灯亮起。
  - id: art-ch14
    file: ch14-context-hazard-ontology/chapter.md
    metaphor: 表格纸飞散，重组成一张星座图
    prompt: 左下角一张表格纸的一角正在碎裂，格子化作点点纸片向右上方飞散，逐渐连成一张点线相连的星座图；星座中一颗星为琥珀色。
  - id: art-ch15
    file: ch15-requirements-ontology/chapter.md
    metaphor: 一条河从源头分汊，每个分汊口都立着闸门与铭牌
    prompt: 俯视一条从上方源头流下的河，向下多级分汊；每个分汊口都有一座小闸门与一块空白铭牌立在岸边。一条支流末端以琥珀色微光收尾。
  - id: art-ch16
    file: ch16-measurement-ontology/chapter.md
    metaphor: 一枚数字佩戴六边形徽章出行
    prompt: 一个抽象数字符号位于中央，胸前佩戴一枚六边形徽章，徽章六条边各自延伸出一条细线连向周围六个小图标形状（圆、方、三角等抽象形）；徽章为琥珀色。
  - id: art-ch17
    file: ch17-change-ontology/chapter.md
    metaphor: 两座快照岛之间一座具名的桥，桥上挂着标签灯
    prompt: 两座平顶小岛各承载一组整齐的方块（一组略有差异），两岛之间一座清晰的桥；桥中央挂一盏小灯与一块空白名牌，灯为琥珀色。
  - id: art-ch18
    file: ch18-dependency-ontology/chapter.md
    metaphor: X 光下，两条独立通道显出共享的骨骼
    prompt: 画面上半部分是两条完全平行、彼此独立的通道外观；下半部分同一场景的透视版本，显出两条通道内部共享同一根脊柱状结构。共享结构以琥珀色显示。
  - id: art-ch19
    file: ch19-field-ontology/chapter.md
    metaphor: 一颗零件拖着自己的时间线尾迹走过工厂
    prompt: 一颗六角螺栓般的零件在画面中前行，身后拖着一条由小节点串成的发光尾迹，尾迹节点形状各异（方、圆、菱形），背景是简约的厂房轮廓。尾迹为琥珀色渐隐。
  - id: art-ch20
    file: ch20-assurance-ontology/chapter.md
    metaphor: 有脉搏的案卷，最后一页留给一只手签名
    prompt: 一册摊开的厚案卷，页面上一条心电图般的脉搏线贯穿始终仍在延伸；最末页空白处，一只手持笔正要落笔。脉搏线为琥珀色。

in_text_figures:
  - id: fig-01-1
    number: 图 1-1
    title: 六张绿卡与一句没有合拢的主张
    file: ch01-introduction/chapter.md
