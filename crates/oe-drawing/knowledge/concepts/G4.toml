dxf_forms = ["plain TEXT/MTEXT 'ALS' within a dimension override text or a leader MTEXT after the tolerance", "intersection-plane / direction-feature indicators as small frames: LWPOLYLINE/LINE boxes with a pointed end plus TEXT symbol and datum letter, or INSERT blocks", "GD&T-related frames may also come as TOLERANCE entities when drawn with the AutoCAD GD&T tool"]
recognition = "锚点：独立的大写词“ALS”，紧跟在尺寸公差或带框两字母修饰符（GN、GX等）之后。其右侧常有一个一端尖头的小框（相交平面/方向要素框格），框内有∥、⊥、≡等符号和基准字母。与ACS区分：中间字母；与SCS区分：SCS需截面标识与TED定位；与几何公差框格区分：框格是多格矩形并以指引箭头指向要素，而ALS随尺寸文字出现。"
confusions = ["ACS 任意横截面", "SCS 特定横截面", "几何规范中的［ALS］：出现在几何公差框格附近", "基准字母组合：在方框和基准三角中"]
related = ["DC-G4-108", "DC-G4-135", "DC-G4-100", "DC-G5-015", "DC-G5-103", "DC-G5-100"]
priority = "rare"
