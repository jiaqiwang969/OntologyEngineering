components = ["分区线为细实线，画在图框与纸边之间的周边内并沿图框线排列。", "每边分区数为偶数，每区长25~75 mm，按图样复杂程度确定。", "编号：竖直方向用大写拉丁字母自上而下，水平方向用阿拉伯数字自左而右，尽量靠近图框线；字母不够时用双字母 AA、BB、CC…。", "CAD 复杂装配图一般应设置分区。"]
