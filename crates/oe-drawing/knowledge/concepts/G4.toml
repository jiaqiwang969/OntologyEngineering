[[concepts]]
id = "DC-G4-005"
name = "光滑过渡处的尺寸界线（轮廓延长线交点引出）"
aliases = ["光滑过渡处的尺寸界线"]
group = "G4"
kind = "dimension_element"
meaning = "在圆角等光滑过渡处标注尺寸时，用细实线把相邻两轮廓线延长到相交，从该假想交点引出尺寸界线；尺寸指的是理论尖角的位置。必要时尺寸界线可与尺寸线斜交。"
components = ["延长线：细实线，沿两轮廓线方向延长，越过圆角相交于一点", "假想交点：理论尖角，延长线到此为止或略出头", "尺寸界线：从交点引出，一般垂直于尺寸线，必要时允许倾斜（GB/T 4458.4 图4）", "尺寸线与数字：普通线性或直径尺寸"]
variants = ["perpendicular or oblique extension line from the intersection"]
dxf_forms = ["two short LINE segments on layer 02/08 collinear with the contour LINEs, starting at the tangent points of the fillet ARC and meeting outside the material", "DIMENSION dimtype 0/1 whose defpoint (code 13/14) is at that virtual intersection rather than at a contour endpoint", "oblique extension lines: DIMENSION with oblique angle (code 52, set by DIMEDIT Oblique)", "exploded dimension: extension LINE starting at the virtual intersection"]
recognition = "锚点为尺寸定义点（DIMENSION 的13/14组码或散线尺寸界线起点）不落在任何轮廓端点上。检查附近是否有圆角 ARC：把与该弧相切的两条轮廓直线延长，若交点与定义点重合（容差≈d），并有细实线段沿延长方向画到该点，则判为光滑过渡处的尺寸界线，尺寸对象应关联到假想尖角而不是圆角。若界线不垂直于尺寸线，读取倾斜角。与遗留作图线区分：延长线止于交点且被尺寸使用；与真实尖角区分：交点处轮廓不转折而有圆角弧；与过渡线、相贯线区分：它们是表面交线的投影，不与尺寸界线连接。"
confusions = ["遗留的作图辅助线：不被任何尺寸引用，或伸出很长", "真实尖角：交点处轮廓本身转折，没有圆角弧", "过渡线：细实线表示光滑过渡的表面交线，两端止于切点附近，不与尺寸界线相连", "相贯线：两立体表面的交线投影，多为曲线"]
related = ["DC-G4-058", "DC-G1-054", "DC-G1-035", "DC-G4-006", "DC-G1-043"]
priority = "medium"
text_forms = ["Ø45"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Code 52 oblique angle and matching tolerance are general CAD practice; the oblique extension example Ø45 is from GB/T 4458.4 图4 OCR."
