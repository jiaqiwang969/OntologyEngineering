recognition = "锚点：一个尺寸数字或基本尺寸文本，右侧紧邻上下两个较小文字（字高约为主文字的0.7倍或小一号），上者以 + 或0 开头、下者以 − 或0 开头，两者左对齐；或 MTEXT 中的 \\S…^…; 叠写码、DIMENSION 的 DIMTOL/DIMTP/DIMTM 设置。用相对字高和位置把分离的 TEXT 合并为“尺寸+偏差”。"
