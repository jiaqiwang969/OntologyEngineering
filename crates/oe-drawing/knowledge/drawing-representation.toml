[[cards]]
id = "thread_representation"
expression_kind = "thread_convention"
title = "螺纹的规定画法"
meaning = "螺纹按规定画法表示，不画真实牙型。内螺纹（螺孔）在投影为圆的视图中，小径画粗实线整圆，大径画约 3/4 圈的细实线圆弧；作图时小径常取大径的约 0.85 倍，但图上画得小些、比例在 0.55～0.70 之间的也很常见，细的约 3/4 圆弧与同心粗圆在制图中没有别的含义。横跨孔的螺纹标注是旁证；横跨孔的是普通直径尺寸时则是光孔。在平行于轴线的剖视中，小径是一对粗实线（孔的轮廓），大径是其外侧一对细实线，剖面线画到粗实线为止；有效螺纹的终点画粗实线的螺纹终止线，横跨大径。不穿通的螺孔另画钻孔：粗实线比螺纹更深，以钻孔底线和约 120° 的锥顶结束。终止线若用点画线类线型画、长度又短于出图时的第一划，打印出来就是实线。"
sources = [
  "GB/T 4459.1-1995 机械制图 螺纹及螺纹紧固件表示法 4.1、4.2",
  "机械制图（第7版）螺纹的规定画法：小径近似取大径的 0.85 倍",
]
knowledge_units = ["K13", "K34"]
recognition = "端视图：一段细实线圆弧，包角在给定范围内（约 3/4 圈），与一个整圆同心；两者半径比在常用窗口内时直接读出（现有规则）；比值低于常用窗口而不低于宽窗口下限时，弧须按本图证据为细线，且没有横跨该孔的普通直径尺寸；横跨该孔、写有螺纹标记的标注记作旁证。整圆按螺纹约定为粗实线轮廓，不论图层与颜色。剖视：一对按本图证据为细线的平行线，其内侧一对粗线关于同一中线对称、沿中线互相重叠，粗细间距比在给定范围内；中线上有孔的轴线、或细线对的一端有横跨大径的粗终止线、或剖面线边界沿粗线，三者有一即读出。粗线对比细线对更深时，为不穿通螺孔，钻孔底线与锥顶线并入。"
markers = []
concepts = ["DC-G3-005", "DC-G3-002", "DC-G3-094", "DC-G1-048", "DC-G1-049"]

[[cards.components]]
role = "thread_line"
primitives = ["ARC"]
requirement = "细实线圆弧，包角约 3/4 圈（大径，内螺纹）"

[[cards.components]]
role = "contour_segment"
primitives = ["CIRCLE"]
requirement = "同心的粗实线整圆（小径，内螺纹）"

[[cards.variants]]
id = "end_view_wide_ratio"
title = "端视图小径画得偏小"
distinguishing = "整圆与 3/4 细弧的半径比低于常用窗口、不低于宽窗口下限"
encodings = ["loose"]
tests = ["thread_end_view_drawn_with_a_small_minor_circle"]

[[cards.counter_examples]]
statement = "横跨该孔的是普通直径尺寸（光孔）时，比值低于常用窗口的同心弧与圆不读成螺纹"
test = "end_view_with_a_plain_diameter_across_it_is_not_a_thread"

[[cards.components]]
role = "thread_line"
primitives = ["LINE"]
requirement = "剖视中大径的一对细实线（内螺纹）"

[[cards.variants]]
id = "internal_thread_in_section"
title = "剖视中的内螺纹"
distinguishing = "细线对在外、粗线对在内，关于同一中线对称，沿中线重叠；有轴线、终止线或剖面线边界佐证"
encodings = ["loose"]
tests = ["internal_thread_in_section_is_a_thread"]

[[cards.variants]]
id = "blind_tapped_hole_in_section"
title = "剖视中的不穿通螺孔"
distinguishing = "粗线对比细线对更深，以钻孔底线和锥顶线结束"
encodings = ["loose"]
tests = ["blind_tapped_hole_in_section_with_drill_point"]

[[cards.variants]]
id = "thread_end_line_printed_solid"
title = "用点画线类线型画、短于第一划的螺纹终止线"
distinguishing = "横跨大径的短线，线长短于线型第一划乘线型比例，出图为实线"
encodings = ["loose"]
tests = ["blind_tapped_hole_in_section_with_drill_point"]

[[cards.counter_examples]]
statement = "同为粗实线的两对平行线（阶梯孔、沉孔）不是螺纹"
test = "two_thick_pairs_are_a_stepped_hole_not_a_thread"

