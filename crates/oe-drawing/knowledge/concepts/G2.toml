[[concepts]]
id = "DC-G2-020"
name = "半剖视图"
aliases = []
group = "G2"
kind = "section"
meaning = "机件有对称平面时，在垂直于对称平面的投影面上以对称中心线为界，一半画成剖视、一半画成外形视图；机件接近对称且不对称部分已另有图形表达清楚时也可采用。"
components = ["分界线：细点画线（对称中心线），不能画成粗实线。", "剖视的一半：剖面区域画剖面线，表达内形。", "外形的一半：内形已在剖视半边表达清楚的不再画细虚线；未表达清楚的仍画细虚线。", "标注：与剖视图相同；剖切面为对称面且按投影关系配置时可省略，否则标“X—X”，按投影关系配置时可省箭头。", "对称结构尺寸：尺寸线一端画箭头，另一端略超过对称中心线不画箭头。"]
variants = ["symmetric part", "nearly symmetric part whose asymmetry is shown elsewhere (5.5)", "近似对称机件亦可"]
dxf_forms = ["Centre LINE (layer 05, CENTER linetype, red) dividing the view; HATCH on one side only", "Half-dimensions: DIMENSION entities with one extension line and arrow suppressed (DIMSE1/DIMSE2, DIMSD1/DIMSD2), dimension line just crossing the centre line"]
recognition = "以视图的对称中心线（细点画线）为锚点：中心线一侧有剖面区域，剖面区域边界在中心线处截止，另一侧对应位置为不带剖面线的外形轮廓；两侧外轮廓关于中心线对称；中心线处没有粗实线或波浪线分界。常伴有单边箭头的直径尺寸。"
confusions = ["以轴线为界的局部剖视：只剖开局部区域，其余部分有波浪线分界。", "合成图形的剖视图：两半来自不同剖切面，旁边各注名称。", "对称符号画一半：中心线两端有两条平行细短线，另一半不画。", "全剖视图：整个视图剖开。"]
related = ["DC-G2-018", "DC-G2-013", "DC-G2-023", "DC-G2-022", "DC-G3-161", "DC-G4-015", "DC-G1-021"]
