[[concepts]]
id = "DC-G6-020"
name = "区域表面结构规范的注写（S-L / S-F 控制元素）"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "区域法表面结构要求在横线下的写法：可选U/L、尺度限定表面类型S-L或S-F、S滤波器嵌套指数、连字号、L滤波器或F运算符、斜线、区域参数代号与数值（双空格）、可选单位、斜线、选项ES和OR(n)，如S-L 0.008-2.5/Sq 0.7。"
components = ["第一段：[U/L] S-L <S滤波器>-<L滤波器>[F运算符]，或[U/L] S-F <S滤波器>-<F运算符>；默认高斯滤波器G和默认单位mm不写。", "第二段：区域参数代号与数值，中间双空格；非默认单位时写单位（默认μm）。", "第三段：[ES]光学表面选项、[OR(n)]其他要求。", "S-F且F运算符不是滤波器时，须给出嵌套指数替代值即方形评定区域边长（S-F 0.008-8/Sa 0.5）；滤波器作F运算符时如S-F 0.008-RG2.5/Sa 0.5。", "评定区域方向由符号在图上的位置确定，必要时加相交平面指示符；加工方法写在横线上方（附录C）。"]
variants = ["S-L surface (B.2)", "S-F surface (B.3, e.g. 'S-F 0.008-RG2.5/Sa 0.5')", "Smr form (B.4)", "examples with process text above the line (附录C)"]
dxf_forms = ["single TEXT/MTEXT under the bar of the areal (diamond) symbol: 'S-L 0.008-2.5/Sq 0.7'", "the double space between code and value may collapse to one — do not rely on it", "decimal comma ('0,025') in ISO-style drawings", "process TEXT above the bar, e.g. 'ground and honed' with lay letter"]
recognition = "锚点：带菱形的区域法符号；词法：可选“U ”或“L ”，然后S-L或S-F，数值-（滤波器字母）数值，“/”，S或V开头的区域参数代号，数值，可选“/ES”“OR(n)”。即使菱形未识别，S-L/S-F前缀也是强证据。这类写法普通零件图上罕见，匹配后应验证整行。区分轮廓法传输带（无S-L/S-F，参数R/W/P开头）、尺寸范围，以及S-L后面作滤波器类型的字母S（如S 0.025）。"
confusions = ["轮廓法传输带：无S-L/S-F前缀，参数R、W、P开头", "尺寸范围：无斜线和参数代号", "样条滤波器字母S：后接空格和嵌套指数"]
related = ["DC-G6-066", "DC-G6-074", "DC-G6-048", "DC-G6-013", "DC-G6-031", "DC-G6-057", "DC-G6-017", "DC-G6-033"]
priority = "rare"
text_forms = ["S-L 0.008-2.5/Sq 0.7", "S-L 0.025-0.8/Sz 6.8", "S-F 0.008-RG2.5/Sa 0.5", "S-F 0.008-8/Sa 0.5", "L S-F 0.025-RG8/Smr(5%,-0.2) 60%/ES"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
