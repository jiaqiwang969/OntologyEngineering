meaning = "位置度：限定点、线或面相对于基准体系（或成组要素相互之间）理论正确位置的变动；理论位置由方框中的理论正确尺寸确定，常用于孔组、销孔和螺纹孔。"
components = ["特征符号：圆加十字——小圆直径约 0.4H，两条正交直线过圆心并伸出圆外，总长约 0.7H，居第一格中央", "第二格：公差值；被测为点时前加 SØ（球形带），为线时常加 Ø（圆柱带），为面时不加；可跟 Ⓜ/Ⓛ、Ⓟ、CZ 等", "基准格：通常 A、B、C 三基准；无基准时用于成组要素之间的相互位置", "配套：被测要素的理论位置用方框理论正确尺寸标出，孔组常带 n×、EQS"]
variants = ["with or without datums (pattern use with CZ)", "zone φ (cylinder), Sφ (sphere) or two parallel planes", "点的位置度 SØ", "线的位置度 Ø（基准 A、B、C）", "面的位置度", "无基准的位置度", "常与 EQS、n× 孔组同用"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;j} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph CIRCLE (r≈0.2H) + two LINE crossing at its centre and running ≈0.35H each way in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⌖ (U+2316) (or MTEXT font switch {\\Fgdt;j}) inside a hand-drawn first cell"]
recognition = "锚点为第一格（H×H，H≈2h）内的小圆：圆心与格中心重合、半径约 0.15–0.25H，两条正交直线都过圆心且两端越出圆周、仍在格内。满足即读为位置度（图块或散线相同）。再读第二格：Ø 前缀为圆柱带、SØ 为球形带；读基准格；附近带方框的尺寸是它的理论正确尺寸。孔的中心线十字是点画线、远长于字高、不在框格内；基准目标点是 45° 叉、无圆。"
confusions = ["孔的中心线十字：细点画线，伸出孔轮廓，不在框格里", "基准目标点 ×：两短线成 45° 交叉、没有圆，落在零件轮廓上（DC-G5-007）", "同轴度 ◎（两同心圆、无十字）与圆柱度（圆加两斜切线）", "被测为中心面时对称度也能表达对称位置，但其符号是三条横线"]
related = ["DC-G5-090", "DC-G5-088", "DC-G5-087", "DC-G5-004", "DC-G5-065", "DC-G5-094", "DC-G4-029", "DC-G4-043", "DC-G5-030"]
priority = "high"
text_forms = ["⌖ Ø0.05 A B C", "⌖ Ø0.1Ⓜ A B", "⌖ SØ0.3 A B C", "6×Ø8 EQS"]
knowledge_units = ["K23", "K24", "K25", "K26"]
recognition_cards = ["gdt_characteristic"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "Linked recognition card gdt_frame_symbol (position = circle + cross, read the same whether block or loose strokes; a frame drawn with loose lines must still be read as a frame). GB/T 1184 gives no general value for position, only a number series (表B5); datum optional per the textbook table. General CAD practice, not from the sources: TOLERANCE entity, gdt.shx letter codes, Unicode code points, block/explode forms and layer use."
