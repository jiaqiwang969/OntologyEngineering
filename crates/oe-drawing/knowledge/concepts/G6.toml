[[concepts]]
id = "DC-G6-060"
name = "镀覆和表面处理要求的注法"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "镀覆或化学处理要求按GB/T 13911的代号写在完整符号横线上方，粗糙度要求写在横线下方；镀涂与后续加工按工艺顺序用斜线分隔。"
components = ["横线上方为镀覆代号：基体材料/处理方法·镀层及厚度等，如Fe/Ep·Ni15pCr0.3r、Fe/Ep·Cr25b。", "横线下方为镀覆后表面的粗糙度要求（如Rz 0.8）。", "1993版：可注在横线上方，也可写在技术要求中；镀层与独立加工方法、化学处理与涂覆都按工艺顺序用斜线隔开（如镀硬铬后机械抛光）。", "1993版B11：镀涂后不再加工的表面按图例标注，全部表面要求相同时可在符号上加小圆。", "2006版C.4、C.5：钢件镀镍铬，要求可作用于封闭轮廓的所有表面。"]
variants = ["GB/T 131-2006 图13, C.4, C.5", "GB/T 131-1993 3.10 图4, B7 (coating then polishing), B8 (chemical treatment then paint), B11 (coated surface not machined further)", "may alternatively be stated in the technical requirements"]
dxf_forms = ["TEXT above the bar such as 'Fe/Ep·Ni15pCr0.3r'; the middle dot may be Unicode U+00B7 (\\U+00B7), a full-width '•', or '.' after conversion", "ATTRIB at position c holding the coating code", "MTEXT on two lines when the code is long", "alternative: MTEXT in the technical requirements (e.g. '表面镀铬 Fe/Ep·Cr25b')"]
recognition = "锚点：完整符号横线上方文字；词法以基体材料代号（Fe、Cu、Al、Zn等）开头，接“/”，再接处理方法代号（如Ep电镀、Ct化学处理）与“·”及镀层元素和厚度（Ni15、Cr0.3等），后续工艺以“/”继续。区分材料牌号（如45、HT200，在标题栏中）、螺纹标记（M、Tr开头并含×和公差带）和配合代号（H7/g6分式）。"
confusions = ["材料牌号：在标题栏或明细栏中，无“/Ep”", "螺纹标记：M、Tr开头并含×和公差带", "配合代号H7/g6：分式，在尺寸后", "技术要求中的镀涂说明：不在符号横线上"]
related = ["DC-G6-010", "DC-G6-019", "DC-G6-025", "DC-G6-070", "DC-G6-026", "DC-G4-073", "DC-G9-005"]
priority = "medium"
text_forms = ["Fe/Ep·Ni15pCr0.3r", "Fe/Ep·Cr25b", "Fe/Ep·Cr50", "Cu/Ep·Ni5bCr0.3r", "Fe/Ep·Cr60hd/MP"]
knowledge_units = ["K31", "K32", "K33"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The coating-code grammar is summarised from the GB/T 13911 examples shown in the sources, not the full code system."
