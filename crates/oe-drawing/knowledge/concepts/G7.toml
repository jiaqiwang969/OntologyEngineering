[[concepts]]
id = "DC-G7-005"
name = "焊缝端面视图"
aliases = []
group = "G7"
kind = "conventional_representation"
meaning = "在能看到焊缝端面的视图中，用粗实线画出焊缝的外轮廓以表示焊缝截面外形；必要时可在轮廓内用细实线画出焊前的坡口形状。"
components = ["焊缝外轮廓：粗实线，在两块母材交角或接缝处围出焊缝截面（角焊为三角形或带凸、凹斜边的形状，对接为坡口加余高）。", "坡口线（可选）：细实线，位于焊缝轮廓内，表示焊前坡口边。", "母材轮廓：粗实线，与焊缝轮廓相接；端面视图中不画剖面线。"]
variants = ["outline only", "outline + thin-line groove preparation"]
dxf_forms = ["LINE/ARC/LWPOLYLINE on layer 01 (thick) forming a small closed triangle or bead outline in the corner between two plate outlines, without hatch", "thin LINE on layer 02 inside the bead outline for the groove preparation"]
recognition = "锚点为两块板轮廓交角处附加的小型闭合粗实线轮廓（三角形或弓形），本身不填充、无剖面线，与两板轮廓共边，尺寸约等于焊脚K；轮廓内可能有细实线坡口线。与倒角、圆角区分：倒角或圆角使单个零件轮廓内缩，焊缝轮廓在两件夹角内向外附加材料。"
confusions = ["零件倒角或铸造圆角：属于同一零件的切角，不跨两个零件。", "独立的小零件端面（如三角筋板）：有自身尺寸和序号，尺寸明显大于焊脚。"]
related = ["DC-G7-001", "DC-G7-006", "DC-G7-091", "DC-G7-014", "DC-G1-015"]
priority = "low"
text_forms = []
knowledge_units = ["K43", "K40", "K41"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
