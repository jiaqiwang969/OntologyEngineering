[[concepts]]
id = "DC-G6-047"
name = "表面结构在图样中的标注位置"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "汇总表面结构符号在图上可放的位置：轮廓线或其延长线、带箭头或圆点的指引线、尺寸线、几何公差框格上方、圆柱特征的轮廓或延长线；读取方向与尺寸一致。"
components = ["每一表面一般只注一次，尽量注在标注该表面尺寸和公差的视图上。", "直接注在可见轮廓线或其延长线上，尖端从材料外指向表面。", "用指引线引出（箭头指轮廓或圆点落在面内）；不致误解时注在尺寸线上；或立在几何公差框格上方。", "圆柱和棱柱表面只注一次，注在圆柱轮廓或其延长线上。", "注写和读取方向与尺寸数字一致（从下方或右方读）。"]
variants = ["轮廓线上", "指引线引出", "尺寸线上", "几何公差框格上方", "圆柱特征上"]
dxf_forms = ["INSERT whose apex lies on an outline LINE/ARC (layer 01) or on its collinear thin extension LINE", "INSERT at the end of a LEADER (layer 09)", "INSERT on a DIMENSION's dimension line or extension line", "INSERT sitting on the top edge of a TOLERANCE entity or an LWPOLYLINE frame"]
recognition = "符号定位后按尖端接触对象分类：粗实线轮廓→轮廓注法；与轮廓共线的细实线→延长线注法；带箭头或圆点的指引线→引出注法；两端带终端的尺寸线→尺寸线注法；公差框格上边→框格上方注法。再由接触对象回溯被注表面：轮廓本身、延长线所属轮廓、箭头所指轮廓、尺寸所标特征、框格所指被测要素。区分焊缝符号（箭头线+基准线）和几何公差指引线（连框格、无V形）。"
confusions = ["焊缝符号：箭头线+基准线，标在焊缝处", "几何公差指引线：连公差框格，不带V形符号", "基准三角形：贴轮廓，连字母方框"]
related = ["DC-G6-053", "DC-G6-052", "DC-G6-032", "DC-G6-051", "DC-G6-050", "DC-G6-023", "DC-G6-049"]
priority = "high"
