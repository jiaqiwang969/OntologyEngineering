[[concepts]]
id = "DC-G6-059"
name = "轮廓法表面结构最简标注与完整标注（规范元素排列顺序）"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "ISO 21920-1草案规定的规范元素排列：最简标注为符号+参数代号+公差限（无缺省的参数另加“/Scn”或“/-嵌套指数”）；完整标注把一个参数的全部元素按固定顺序写在横线下一行，加工工艺和纹理写在横线上方。"
components = ["最简标注：缺省已定义的参数（Rz、Ra、Rp、Rv、Rq、Rmax、Rt、Pt）只写如Ra 1.6，所有元素取缺省，元素之间用一个空格隔开。", "无缺省的参数：如Rk 0.6/-0.8或Rk 0.6/Sc3。", "完整顺序：[公差类型] 参数 公差限 [接收规则] / [S滤波器类型与指数] - [L滤波器类型与指数] ([评定长度]或[截断长度×截断数]) [F操作] / [提取方法] [OR(n)]。", "横线上方为加工工艺[s]和纹理[t]，符号旁为轮廓方向[u]。", "示例：L Ra 2 T16% / S 0.0015 - RG 0.6 (15) LSC 25 / EP OR(1)；L Rz 5 Tmed / S 0.002 - RG 0.5 (1.5×10) LSP2 / EP OR(2)。"]
variants = ["minimal indication with defined defaults (Rz, Ra, Rp, Rv, Rq, Rmax, Rt, Pt) 图5", "minimal indication without defaults 图6", "complete forms: evaluation-length R parameters 图7, section-length R parameters 图8, evaluation-length P/W 图9, section-length P/W 图10"]
dxf_forms = ["one long TEXT/MTEXT line under the bar holding all elements", "decimal comma ('0,002') in draft-style drawings", "the line may be split into several TEXT entities at the '/' separators"]
recognition = "解析时按“/”把行分为三段：第一段为公差类型、代号、限值、接收规则；第二段为滤波器、长度和F操作；第三段为提取方法和OR(n)。第一段后即结束为最简标注。出现T16%、Tmed、RG、LSC、EP、OR(n)、“(数)”或“(数×数)”中任一项即可判定为草案格式。普通零件图上罕见。区分GB/T 131-2006写法（传输带在代号之前）、区域法S-L/S-F写法和带斜线的尺寸文字。"
confusions = ["GB/T 131-2006传输带写法：传输带在参数代号之前", "区域法写法：以S-L或S-F开头", "带斜线的尺寸文字：不在符号横线下"]
related = ["DC-G6-008", "DC-G6-014", "DC-G6-016", "DC-G6-017", "DC-G6-048", "DC-G6-055", "DC-G6-057", "DC-G6-058", "DC-G6-025", "DC-G6-046"]
priority = "rare"
text_forms = ["Ra 1.6", "Rk 0.6/Sc3", "L Ra 2 T16% / S 0.0015 - RG 0.6 (15) LSC 25 / EP OR(1)", "L Rz 5 Tmed / S 0.002 - RG 0.5 (1.5×10) LSP2 / EP OR(2)"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "The part 1 draft lists Rmax among parameters with defaults, the part 3 draft Rzx instead; drafts not final."
