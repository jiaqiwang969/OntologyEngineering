recognition = "零件图中以孔的CIRCLE为锚点，孔径与可能配用的螺纹规格之比约1.05–1.2（如Ø9、Ø11、Ø13.5对M8、M10、M12），常成组均布并带n×前缀。装配图中以螺杆轴线为锚点：螺杆大径线外侧有一对平行的孔壁线，间隙约0.05d，被连接件的剖面线止于孔壁线。与螺孔区分：螺孔有细实线大径（或3/4圈细圆）和螺纹标记；与配合孔区分：配合孔注公差带代号（如H7）。"
confusions = ["螺孔：有螺纹线（细实线大径或3/4圈细圆）和M标记。", "配合孔：孔径带公差带代号或偏差，与轴配合，装配图中为单线接触。"]
