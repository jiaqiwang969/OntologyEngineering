kind = "symbol"
meaning = "同心度：位置公差，在任意横截面内限定被测圆的中心点相对于同一截面内基准点的偏离；符号与同轴度相同，靠框格上方的 ACS 区分。"
components = ["特征符号：两同心圆（外径约 0.7H，内径约 0.4H），与同轴度是同一字形", "ACS：写在框格上方相邻区，表示被测要素是每个横截面内的中心点", "第二格：公差值前加 Ø（圆形公差带）；基准格：基准点（同一截面的基准圆心）"]
variants = ["与 ACS 合用", "基准点"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;r} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph two concentric CIRCLE in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ◎ (U+25CE) (or MTEXT font switch {\\Fgdt;r}) inside a hand-drawn first cell", "TEXT 'ACS' placed above the frame (separate TEXT entity or part of the frame block)"]
recognition = "第一格内两同心圆（同轴度字形）且框格上方相邻区有 “ACS” → 同心度；没有 ACS 则读同轴度。被测为点，圆形公差带，基准也在同一截面内。"
confusions = ["同轴度（同一符号，无 ACS）", "圆度（单圆）", "全表面符号（两同心圆在指引线折点）"]
related = ["DC-G5-054", "DC-G5-028", "DC-G5-090", "DC-G5-104"]
