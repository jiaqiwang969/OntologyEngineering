[[concepts]]
id = "DC-G3-033"
name = "片弹簧画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "由薄带材制成的片弹簧，视图一般按其自由（不受载）状态的形状画出；在装配图中板厚很小时可用示意画法或涂黑表示。"
components = ["零件图：按自由状态画出带材的弯折或弓形外形，厚度方向用两条等距粗实线（间距为板厚），并表示安装孔、折弯等结构。", "装配图：板厚在图形上不大于约2 mm时，允许用单根粗实线示意；被剖切时截面可涂黑。", "弹性要求（如力、变形、硬度）通常写在技术要求或图上参数中。"]
variants = ["自由状态视图", "装配图示意画法"]
dxf_forms = ["two offset thick LWPOLYLINE/LINE/ARC chains (offset = strip thickness) closed at the ends, layer 01", "assembly schematic: single thick LWPOLYLINE; cut thin section as HATCH SOLID or SOLID entities (涂黑)", "hole centre marks as short CENTER-linetype LINEs; technical requirements as MTEXT", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一对等距的粗实线曲线或折线，间距t远小于长度（t/L一般<0.05），两端以短线封闭，整体呈弓形、Z形或悬臂形；常伴有安装孔中心线和含材料（如弹簧钢带）、热处理、硬度的技术要求。装配图中则是一根粗线或一条涂黑窄条，与相邻零件一端固定、另一端接触。与钣金件区分：钣金件有展开尺寸、折弯注语，无弹性性能要求；与薄垫片涂黑区分：垫片为平直窄条且夹在两零件结合面之间。"
confusions = ["钣金件：外形相似，但有展开长度或折弯注语，没有弹性要求。", "薄垫片或薄件涂黑断面：平直、位于结合面之间，不呈自由弯曲形。", "碟形弹簧示意图：为成组的倾斜短线，不是单片弓形。"]
