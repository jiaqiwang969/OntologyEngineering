[[concepts]]
id = "DC-G8-015"
name = "重复序号加括号"
aliases = []
group = "G8"
kind = "sheet_element"
meaning = "相同的零件一般只标注一个序号；为了便于看图在另一处再次标注时，重复的序号加圆括号，如“(9)”，明细栏中该序号的数量按全部件数填写。"
components = ["首次出现的序号按常规形式标注，不加括号。", "重复标注处同样有指引线和基准线或圆，序号写成“(9)”的形式。", "明细栏中该序号只占一行，数量为全部件数（例中为2）。"]
variants = []
dxf_forms = ["TEXT '(9)' on a balloon reference line or inside a circle, same height as the other item numbers", "MLEADER/LEADER whose text content is '(9)'"]
recognition = "以内容匹配“^[(（]\\d+[)）]$”、字高与其他序号一致、连有圆点指引线的文字为锚点；同一数值必须另有一个不带括号的序号，并且明细栏中该序号的数量不少于2。与参考尺寸的区别：参考尺寸的括号数字在尺寸线上，带尺寸界线，字高为尺寸字高，比序号小。"
confusions = ["参考尺寸（圆括号尺寸）：在尺寸线上，字高为尺寸字高。", "明细栏备注中的括号：在表格内。", "括号中的分区代号或视图代号：如(A)、(B3)，含字母。"]
