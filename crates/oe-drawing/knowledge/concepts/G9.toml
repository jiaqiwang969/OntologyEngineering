[[concepts]]
id = "DC-G9-004"
name = "未注铸造圆角注语"
aliases = []
group = "G9"
kind = "note"
meaning = "铸件零件图技术要求中对未单独标注的铸造圆角统一规定半径的说明，如“未注铸造圆角R1~R3”“未注铸造圆角R5”。"
components = ["典型写法：“未注铸造圆角R×”“未注铸造圆角R1~R3”；简化表示法中也可写“全部铸造圆角R5”。", "图上铸件非加工面的转角画成小圆弧或不画，不逐个标注半径。", "常与“铸件应经时效处理”等铸件要求同列。"]
variants = []
dxf_forms = ["TEXT/MTEXT item in the 技术要求 block (layer 11)", "the unspecified fillets themselves as small ARC entities between LINE outlines, without radius DIMENSION"]
recognition = "以匹配“(未注|全部)铸造圆角\\s*R\\s*\\d+(\\.\\d+)?(\\s*[~～-]\\s*R?\\d+(\\.\\d+)?)?”的文字为锚点；图中应有未注半径的小圆弧过渡，其半径约为注语值乘比例。标题栏材料为铸造材料（HT、QT、ZG、ZL等）可作旁证。与半径尺寸R×（有尺寸线指向某个圆弧）和一般“未注圆角R×”（没有“铸造”二字，可用于机加工件）区分。"
confusions = ["半径尺寸R：针对单个圆弧的标注。", "未注倒角注语：给的是C而不是R。", "一般未注圆角说明：没有“铸造”二字。"]
related = ["DC-G3-067", "DC-G3-112", "DC-G1-071", "DC-G9-009", "DC-G9-002"]
priority = "medium"
text_forms = ["未注铸造圆角R1~R3", "未注铸造圆角R2", "全部铸造圆角R5"]
knowledge_units = ["K03", "K52", "K55", "K39", "K29", "K44"]
