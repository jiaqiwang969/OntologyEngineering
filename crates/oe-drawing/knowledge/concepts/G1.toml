meaning = "用作指数、分数、极限偏差、注脚等的数字和字母，一般比正文小一号，例如尺寸后面上下叠写的极限偏差。"
components = ["指数（如10³）、分数（如3/5）、极限偏差（如Ø20 后的 +0.010/−0.023）、注脚，用小一号字（正文3.5 时用2.5）。", "极限偏差上下叠写，上偏差在上、下偏差在下，紧跟在基本尺寸之后。"]
