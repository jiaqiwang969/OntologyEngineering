[[concepts]]
id = "DC-G1-007"
name = "剖切符号用线"
aliases = []
group = "G1"
kind = "line"
meaning = "用粗短画在视图外标出剖切面的起、迄和转折位置，并配箭头（投射方向）和字母，说明剖视图或断面图从哪里剖切、向哪里投射。"
components = ["粗实线短画（No.01.2.10），尽量不与图形轮廓相交，长度一般约5~10 mm。", "起、迄处短画外端画箭头，箭头垂直于短画，表示投射方向；转折处画直角形短画。", "起、迄和转折处注同一大写字母，剖视图上方注“X—X”；转折处位置有限时可省字母。", "短画之间可用细点画线（剖切线）相连，也可省略。"]
variants = []
dxf_forms = ["short thick LINE/LWPOLYLINE strokes (lineweight 50–70 or polyline width) on layer 01 or a dedicated section layer; GB/T 18229 layer 01 also lists the thick cutting-plane line", "arrowheads as SOLID/HATCH triangles, LWPOLYLINE with tapering width, or LEADER/QLEADER with closed filled arrow", "single capital-letter TEXT next to each stroke", "mechanical add-ons (CAXA, GstarCAD/AutoCAD Mechanical) store the whole symbol as one object that exports as an anonymous INSERT or exploded strokes+text", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点是视图轮廓外侧的孤立粗短线段（长度约为字高的1.5~3倍），其延长线穿过视图；通常成对且共线，或经直角转折相连；短画外端有箭头或旁边有大写字母，且图中另有同字母的“X—X”标题。字母与剖视标题的匹配是最强证据。与对中符号区分：后者在图纸边中点、从纸边伸入图框约5 mm；与螺纹终止线区分：后者在螺纹区内、两端接到牙顶/牙底线。"
confusions = ["对中符号：粗短线，但位于图纸各边中点。", "螺纹长度终止线：粗实线，垂直于螺纹轴线、两端连接螺纹线。", "剖切线：细点画线，只表示剖切面迹线。", "移出断面的轮廓：粗实线闭合外形，而非孤立短画。"]
related = ["DC-G1-008", "DC-G1-038", "DC-G2-043", "DC-G2-065", "DC-G2-066"]
priority = "high"
text_forms = ["A", "A—A", "B-B"]
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "短画长度与箭头画法细节为一般实践，源中只规定线型及组合。"
