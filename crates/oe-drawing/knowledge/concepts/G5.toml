expert_checked = false
notes = "GB/T 17851-2022 advises not to use I, O, Q, X as datum letters; the textbook additionally avoids E, I, J, M, O, P, L, R, F because they coincide with modifier symbols. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
