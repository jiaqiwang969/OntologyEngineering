dxf_forms = ["two parallel LINEs (or width-d' LWPOLYLINEs) ≈h long, ≈0.7h apart, perpendicular to and touching the reference line", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "AutoCAD Mechanical / GstarCAD Mechanical weld-symbol object saved in DXF as ACAD_PROXY_ENTITY; only its proxy graphics (lines, arcs, text) are readable without the vendor enabler"]
