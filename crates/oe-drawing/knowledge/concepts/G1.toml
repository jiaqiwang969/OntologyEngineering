[[concepts]]
id = "DC-G1-005"
name = "允许表面处理的表示线"
aliases = []
group = "G1"
kind = "line"
meaning = "用粗虚线沿零件表面平行画出，指明在该范围内允许（而非必须）进行某种表面处理，例如允许局部热处理或镀覆的区域。"
components = ["粗虚线（No.02.2.1），线宽与粗实线相同。", "画在相关表面轮廓外侧、与之平行并靠近，起止点界定范围。", "常配尺寸限定范围或用指引线注出处理要求。"]
variants = []
dxf_forms = ["LINE/ARC with a dashed linetype and thick lineweight (50/70), GB/T 14665 layer 03 (粗虚线), colour white", "offset copy of a stretch of the outline", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying"]
recognition = "锚点为线宽为粗线的虚线，与某段粗实线轮廓平行，偏距约1~3 mm，长度只覆盖轮廓的一部分；附近有限定起止的尺寸或文字。与粗点画线（要求处理的限定范围）区分：粗虚线只有画和间隔，没有点。与细虚线区分靠线宽约2:1；线宽缺失时依图层03与白色（细虚线为04层黄色）。"
confusions = ["限定范围表示线：粗点画线，表示要求处理的范围。", "细虚线：不可见轮廓，具有几何意义。", "可能热处理区域（工艺符号中的粗虚线）：同属允许范围的表达，按热处理标准解读。"]
related = ["DC-G1-040", "DC-G1-060", "DC-G1-039", "DC-G7-019", "DC-G7-021"]
priority = "rare"
text_forms = []
knowledge_units = ["K03", "K52", "K55", "K33"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "粗虚线自 GB/T 4457.4-2002 起才有，1984 版图样不会出现。"
