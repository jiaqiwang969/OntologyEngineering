components = ["线宽：尺寸符号笔画宽h/10（GB/T 4458.4 附录A）", "正方形□：边长h的正方形", "深度↧：宽h的横杠下接夹角60°的V形，整体高约h", "沉孔或锪平⌴：宽2h、高h的开口槽形", "埋头孔⌵：夹角90°的V形，高h", "锥度符号：长2.5h、高1.4h的等腰三角形（GB/T 15754-1995 图5）；弧长⌒：以字高为半径的半圆弧（教材）"]
