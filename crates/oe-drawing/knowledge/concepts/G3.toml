[[concepts]]
id = "DC-G3-079"
name = "齿轮齿条啮合画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "齿轮与齿条啮合时，齿轮分度圆与齿条分度线相切；啮合区的齿顶线以及剖视中被遮挡部分按圆柱齿轮啮合的规定画法处理。"
components = ["齿轮圆视图：分度圆（点画线）与齿条分度线（点画线）相切。", "啮合区的齿轮齿顶圆和齿条齿顶线按圆柱齿轮啮合规则画粗实线或省略。", "剖视（过齿轮轴线）：一件轮齿粗实线，另一件被挡部分画虚线或不画。", "齿条另一视图中齿部范围用粗实线表示。"]
