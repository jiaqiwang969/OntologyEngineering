[[concepts]]
id = "DC-G3-183"
name = "滚动轴承无挡边表示"
aliases = []
group = "G3"
kind = "symbol"
meaning = "在滚动轴承通用画法（也适用于特征画法）的十字符号上附加一粗实线短画，表示内圈或外圈无挡边及其无挡边的方向。"
components = ["底图为通用画法：粗实线矩形框加居中正立十字。", "外圈无挡边：在十字竖臂靠外圈一端加一条与轴线平行、对称的短画，整体近似“干”字形。", "内圈一侧无挡边：在竖臂靠内圈一端加一条只向一侧伸出的短画，整体近似“七”字形，短画所指一侧即无挡边的方向。", "2017版把两图称为“外圈无挡边”和“内圈右侧无挡边”，1998版同一图形称为“外圈无挡边”和“内圈有单挡边”。"]
variants = ["2017：外圈无挡边、内圈右侧无挡边", "1998：外圈无挡边、内圈有单挡边"]
dxf_forms = ["Extra short LINE on layer 01 attached to an end of the cross arm inside the bearing frame", "Part of a library INSERT for cylindrical roller bearings of N/NU/NJ type"]
recognition = "先识别通用画法框和居中十字，再检查十字竖臂（垂直于轴线的臂）端点处是否有附加短画：两侧对称的横短画（长约为十字横臂的1/2）位于外圈一端＝外圈无挡边；只向一侧伸出的短画位于内圈一端＝该侧内圈无挡边。附加短画与十字相接而不触框，以此区别于框线或防尘盖附加线。"
confusions = ["防尘盖/密封圈附加线：平行于端面框边，不与十字相接。", "动密封圈密封方向箭头：带实心箭头，位于对角X上。", "四点接触轴承特征画法：竖线伸到框边，不是附加短画。"]
related = ["DC-G3-121", "DC-G3-122", "DC-G3-119", "DC-G3-124"]
