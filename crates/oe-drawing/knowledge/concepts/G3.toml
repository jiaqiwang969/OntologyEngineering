[[concepts]]
id = "DC-G3-140"
name = "三副元素与多副元素构件符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示同时带有三个或更多运动副元素的刚性构件（如三角形连杆、多孔摇板），用粗实线把各副元素连成一个刚体，最常见的是三个顶点各带一个回转副小圆的三角形。"
components = ["三副元素构件基本符号：三根粗实线围成三角形，三个顶点各有一个回转副小圆，角内用涂黑小楔形表示各边固接成一体。", "可用符号：三角形内部画斜线（剖面线式）填充，表示整块为同一构件，顶点铰链小圆保留。", "附注变体：三个副元素排在一条直线上时，用粗实线串联三个小圆，中间可带分支、半圆凸起或棱柱副滑块。", "从顶点小圆引出的细实线是相邻构件，不属于本构件。", "多副元素构件（四个及以上副元素）按双副、三副元素构件的画法类推，画成多边形或多分支构件；2013版条号7.4、7.5，1984版4.4、4.5，1984版另有4.6组合示例。"]
variants = ["三副元素构件", "多副元素构件"]
dxf_forms = ["Exploded LINE strokes on layer 01 (often lineweight about 2d) forming a closed triangle or polygon, with equal-radius CIRCLE pivots at the vertices", "Filled corner wedges as SOLID or HATCH with SOLID pattern inside the angles; the alternative form is a HATCH ANSI31 (layer 10) over the whole triangle", "Adjacent members as thin LINE entities on layer 02 leaving the vertex circles", "INSERT of a mechanism-symbol library block when drawn from a symbol library; otherwise exploded geometry"]
recognition = "锚点为闭合的粗实线三角形/多边形（或带斜线填充的多边形）。条件：每个顶点处有一个与全图其他铰链同径的小圆，边线端点落在小圆圆周上；角内可有实心楔；从小圆引出细线。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。与剖面区域区分：剖面区域边界是零件投影轮廓，顶点没有铰链小圆，周围有尺寸和中心线；与机架区分：机架只是直线一侧的一排短斜线，不封闭也不带铰链圆。"
confusions = ["机架符号：直线一侧的短斜线，不封闭，顶点无铰链小圆。", "剖面区域（零件断面的剖面线）：边界为投影轮廓，有尺寸、中心线，剖面线覆盖整个断面而非单线构件围成的三角形。", "双副元素构件（连杆）：只有一根粗线和两个铰链圆，不构成封闭多边形。"]
related = ["DC-G3-155", "DC-G3-152", "DC-G3-158", "DC-G3-175", "DC-G3-182", "DC-G1-010"]
