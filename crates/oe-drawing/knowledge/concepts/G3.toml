[[concepts]]
id = "DC-G3-129"
name = "螺纹紧固件简化画法"
aliases = ["螺钉头部一字槽简化画法"]
group = "G3"
kind = "simplified_representation"
meaning = "装配图中常用螺栓、螺钉的头部和螺母可采用简化画法：不画倒角及由倒角产生的曲线，头部用简单轮廓表示，端视图中一字槽、十字槽、内六角等用规定的简单线条表示。"
components = ["主视图中头部与螺母画成不带倒角弧线的矩形或简单外形，六角头只画棱线；螺杆末端倒角也可不画。", "一字槽：在投影为圆的视图中画成一条与水平成45°的加粗线，在另一视图中以一条粗线表示槽。", "十字槽：端视图中头部圆内画两条交叉成X形的粗线。", "内六角：端视图中头部圆内画三条交叉的粗线形成六射线星形，主视图头部内画出槽深线。", "螺母、方头、法兰面、蝶形等端视图分别画六边形、斜置正方形、带外圆的六边形或两翼，中心以圆表示螺孔。", "螺纹部分仍按螺纹规定画法：牙底细实线，终止线粗实线，轴线细点画线。"]
variants = ["六角头螺栓", "方头螺栓", "圆柱头内六角螺钉", "无头内六角螺钉", "无头开槽螺钉", "沉头开槽螺钉", "半沉头开槽螺钉", "圆柱头开槽螺钉", "盘头开槽螺钉", "沉头开槽自攻螺钉", "六角螺母", "方头螺母", "六角开槽螺母", "六角法兰面螺母", "蝶形螺母", "沉头十字槽螺钉", "半沉头十字槽螺钉", "盘头十字槽螺钉", "六角法兰面螺栓", "圆头十字槽木螺钉"]
dxf_forms = ["INSERT of a fastener block from a standard-part library (GstarCAD/CAXA parametric parts, often anonymous or GB-named blocks), sometimes exploded to LINE/CIRCLE/ARC", "Slot as one thick LINE on layer 01 (or LWPOLYLINE with global width about 1.5-2 times the thick-line width) at 45 degrees in the end view", "Hexagon/square head or nut end view as closed LWPOLYLINE of 6 or 4 vertices on layer 01 with CIRCLE for the hole; thread root as thin 3/4 ARC on layer 02", "Axis as LINE on layer 05; thread root lines in the side view as thin LINE on layer 02"]
recognition = "以装配图中螺纹轴线（细点画线）上的头部或螺母轮廓为锚点：侧视为与螺杆同轴的短矩形，宽约为公称直径d的1.5～2倍、高约0.6～0.8d，矩形内没有倒角形成的圆弧（有圆弧则为真实或比例画法）；投影对应的端视图为正六边形、正方形或圆，内部有一条45°粗线（一字槽）、X形两线（十字槽）或三线星形（内六角）。若为图块，块名或属性中常含螺栓、螺钉、螺母或GB标准号，可作辅助证据。"
confusions = ["真实或比例画法的螺栓头：六角棱面上画有倒角圆弧，端视图有倒角圆。", "机构简图符号：单线符号，不带螺纹细线和头部轮廓。", "GB/T 24741 紧固件十字线：只有一个粗十字，不画头部和螺杆轮廓。", "焊缝加粗线：沿接缝延伸的粗线，不在头部圆内。"]
related = ["DC-G3-060", "DC-G3-053", "DC-G3-058", "DC-G3-056", "DC-G3-044", "DC-G3-127", "DC-G3-229", "DC-G8-018", "DC-G8-003"]
priority = "high"
text_forms = ["螺栓 GB/T 5782 M12×50", "螺钉 GB/T 70.1 M8×25", "螺母 GB/T 6170 M12"]
knowledge_units = ["K13", "K34", "K15", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "依据 GB/T 4459.1-1995 6.3 与表1（20种形式，图形由页面图像核对）及教材图8-15。表1中内六角在端视图是三线星形而非六边形，与目录描述不同，按图像描述。头部尺寸比例、图块命名、DXF 形式来自一般 CAD 与比例画法实践；text_forms 为常见明细栏写法。"
