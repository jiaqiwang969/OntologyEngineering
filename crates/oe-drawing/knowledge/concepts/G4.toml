kind = "tolerance_indication"
meaning = "模制件（铸件、锻件、注塑件）跨分模面特征的线性尺寸，缺省为垂直于起模锥面轴线的横截面上的两点尺寸，并计入表面错移；尺寸按起模角使材料增加（TP）或减少（TM）修正；非特征尺寸宜改用几何公差控制。"
components = ["特征尺寸：跨分模面的外部或内部、回转或非回转特征的线性尺寸", "起模修正：按起模角W和高度X对尺寸加或减 tan(W)×X 项，方向由材料增加TP或减少TM决定", "倾斜符号：用起模斜度倾斜符号指明修正方向", "非特征尺寸：推荐用几何公差而不是线性尺寸及公差"]
