components = ["单线：构件或管子以一条线表示其轴线", "长度数值：沿线段方向平行注写在线段一侧中部，无尺寸线、尺寸界线和终端", "角度数值：写在两线段所夹角区内靠近交点处", "对称图形：只在一侧注出数值"]
