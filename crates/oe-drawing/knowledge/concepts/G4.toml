[[concepts]]
id = "DC-G4-046"
name = "展开长符号"
aliases = []
group = "G4"
kind = "dimension_symbol"
meaning = "展开长符号（小圆后接向右箭头）用于钣金、弯曲件，写在尺寸数字前表示该尺寸为弯曲前坯料的展开长度；也可标在展开图视图名称字母之后（如A-A加符号），表示该视图为展开图。"
components = ["符号形状：一个小圆，右下方引出一条水平向右的带箭头短线，整体高度与字高相当。", "注在尺寸前：如“○→200”，表示展开长度200。", "注在视图名后：单独画出的展开图，在名称字母后加注该符号。", "例外：坯料轮廓叠加在成形后视图上画出时，视图上方不注符号，但展开尺寸仍写成“○→尺寸值”。"]
variants = ["before value on developed dimension", "after view label of development view (2012 note)", "symbol not marked when blank outline is superimposed on the formed view"]
dxf_forms = ["INSERT of a small symbol block (CIRCLE + LINE + SOLID arrow) placed before the dimension text or after the view label", "exploded CIRCLE (radius ≈ h/2) + LINE + small SOLID arrowhead next to a TEXT/MTEXT number", "text glyph from a custom symbol font (no standard Unicode character; uncertain)", "layer 08 or template dimension layer"]
recognition = "锚点为尺寸文字或视图名称文字（如A-A），在其左侧（尺寸）或右侧（视图名）紧邻处有一个小圆（直径约0.5–1h）并带一水平向右的短箭头（长约h）。所在视图常为钣金展开图，或含细双点画线表示的坯料轮廓。排除：弧长符号为半圆弧、无箭头；旋转符号为弧形箭头且配在视图名称旁表示图形旋转；剖切/投射方向箭头较大并配字母。"
confusions = ["弧长符号⌒：半圆弧，无圆、无箭头。", "旋转符号：弧形箭头，表示视图旋转后画出。", "剖切或投射方向箭头：箭头较大，与剖切符号或字母配合。", "展开长度注语：用汉字说明，而非符号。"]
related = ["DC-G2-077", "DC-G1-067", "DC-G2-024", "DC-G2-048", "DC-G4-047"]
priority = "rare"
text_forms = ["○→200", "A-A○→"]
