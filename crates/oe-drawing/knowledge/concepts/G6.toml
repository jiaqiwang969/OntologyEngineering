[[concepts]]
id = "DC-G6-011"
name = "中心孔、键槽工作面、倒角、圆角的简化注法"
aliases = ["键槽、圆角和倒角的表面结构注法"]
group = "G6"
kind = "surface_indication"
meaning = "中心孔工作表面、键槽工作面、倒角和圆角这类小结构的表面结构代号，可注在其尺寸线、尺寸界线或引出线上，而不必注在很小的轮廓本身上。"
components = ["1993版4.8图19：中心孔、键槽工作面、倒角、圆角的代号可随其尺寸或引出线简化注出。", "2006版C.6：键槽侧壁的要求（如Ra 6.3）与键槽尺寸一起注出，倒角的要求（如Ra 3.2）随倒角标注注出。", "教材图4.15、4.16：键槽侧壁代号注在键槽宽度尺寸线或其延长线上，圆角、倒角代号注在其引出线或尺寸上。", "代号本身与普通代号相同，只是附着对象为小结构的尺寸或引出线。"]
variants = ["GB/T 131-1993 4.8 图19", "GB/T 131-2006 C.6 keyway side walls and chamfer (表C.1)", "键槽", "圆角", "倒角"]
dxf_forms = ["roughness INSERT placed on a DIMENSION line or extension line of the keyway-width or chamfer dimension", "LEADER with chamfer TEXT 'C2' or '2×45°' (2%%d… / 2×45%%d) and the roughness INSERT on the same leader shoulder", "exploded LINE + TEXT groups next to the small feature", "centre-hole designation TEXT on a leader with the roughness symbol attached"]
recognition = "锚点：表面结构符号；其尖端或所在指引线落在小结构的尺寸对象上（键槽宽度尺寸、倒角C或×45°标注、圆角R标注、中心孔标记引出线），而不是长轮廓。把要求赋给该尺寸所指的小结构（键槽两侧面、倒角面、圆角面、中心孔锥面）。区分倒角标注文字本身（C2，无V形）、中心孔标记文字和尺寸公差。"
confusions = ["倒角尺寸C2或2×45°：只是尺寸文字，无60°V形", "中心孔标记：文字如B2.5/8，配中心孔符号", "普通轮廓上的代号：作用于整个表面"]
related = ["DC-G6-012", "DC-G6-051", "DC-G6-052", "DC-G6-032", "DC-G3-091", "DC-G4-040", "DC-G3-144", "DC-G3-218"]
