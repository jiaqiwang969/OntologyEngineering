recognition = "锚点：一个几何公差框格，其特征符号为面轮廓度（半圆弧下有一横线的形状），指引箭头终止在一对收敛轮廓线（圆锥）上。同一圆锥的锥角或直径尺寸带方框。与基本锥度法、公差锥度法区分：本法以框格控制、尺寸为TED无偏差；与普通面轮廓度用于曲面区分：被注要素为圆锥。"
confusions = ["基本锥度法：直径带偏差", "公差锥度法：直径和角度都带±", "线轮廓度框格：符号无底部横线", "GB/T 15754-2025 的GPS注法：用VA等修饰符"]
