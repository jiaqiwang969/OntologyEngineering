[[concepts]]
id = "DC-G1-115"
name = "视图名称处的比例标注"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "某个视图（如局部放大图、剖视图）采用与标题栏不同的比例时，在该视图名称的下方或右侧注写其比例。"
components = ["名称下方：如罗马数字“Ⅰ”之下写“2:1”，或“B—B”之下写“2.5:1”。", "名称右侧：如“平面图 1:100”。", "上下叠写时名称与比例中心对齐。"]
variants = ["写在图名下方", "写在图名右侧"]
dxf_forms = ["two TEXT entities stacked and centred (label above, scale below) or one MTEXT with \\P", "MTEXT stacking such as \\SⅠ^2:1;"]
recognition = "锚点：视图标题（罗马数字Ⅰ、Ⅱ，大写字母或 X—X）正下方或右方的比例文本，两者中心对齐、间距小于字高。识别后该视图的几何按此比例换算，而不用标题栏比例；局部放大图还应在原视图中找到细实线圆圈和同一罗马数字。"
confusions = ["分区代号写在图名之后：字母+数字，不含冒号。", "剖切字母：只有字母。", "局部放大图编号：罗马数字本身，比例在其下方。"]
related = ["DC-G1-114", "DC-G2-068", "DC-G2-075", "DC-G2-065"]
priority = "medium"
text_forms = ["Ⅰ/2:1", "B—B/2.5:1", "平面图 1:100"]
