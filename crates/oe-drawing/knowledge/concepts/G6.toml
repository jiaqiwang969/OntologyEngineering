[[concepts]]
id = "DC-G6-006"
name = "大多数表面有相同要求的简化注法"
aliases = ["多数表面相同要求的简化注法", "多数表面相同要求的简化注法（其余）"]
group = "G6"
kind = "simplified_representation"
meaning = "工件多数表面要求相同时，把该要求统一注在标题栏附近，并在其后用圆括号给出光的基本符号或列出图中其他不同要求；不同要求仍直接注在视图上。"
components = ["2006版：统一代号（如√Ra 3.2）标在标题栏附近，其后圆括号内为不带标注的基本符号。", "另一种写法：圆括号内列出图中已注出的其他不同代号。", "不同于统一要求的表面仍在视图上逐一标注。", "1993版：把使用最多的一种符号代号注在图样右上角，并加“其余”二字，大小为一般代号的1.4倍。", "ISO 21920-1草案称“一般公差”：在标题栏附近，后接括号内的图形符号或其他明确注出的要求。"]
variants = ["GB/T 131-2006 11.3.1 图23 (basic symbol in parentheses), 图24 (differing requirements in parentheses)", "GB/T 131-1993 4.4: most-used symbol placed in the upper right corner of the sheet with the words '其余', drawn 1.4 times the normal size", "ISO 21920-1 draft 9.1.2 '一般公差': near the title block, followed by the symbol or the other explicit requirements in parentheses (图12, 图13)", "（√）形式", "括号内列出其他代号形式", "括号内基本符号", "括号内列出例外要求"]
dxf_forms = ["INSERT (complete symbol + value) + TEXT '(' + bare basic-symbol INSERT + TEXT ')' near the title block; parentheses sometimes drawn as two ARCs", "INSERT + '(' + several small INSERTs with values + ')' for the listed-exceptions form", "1993: TEXT '其余' + INSERT scaled ≈1.4 in the upper-right corner inside the frame", "one composite block holding the whole note"]
recognition = "锚点：视图外、标题栏附近（或1993版右上角）的表面结构符号；其右侧同一基线有括号（TEXT“(”“)”或两段ARC），括号内为光基本符号或若干带值符号——即2006版多数表面注法，括号外的要求作用于所有未单独标注的表面。符号左侧有“其余”二字且尺寸约1.4倍时为1993版。区分全部表面统一标注（无括号、无“其余”）、参考尺寸括号（括住尺寸数字）、GB/T 1804一般公差注语（文字“未注公差…”）。"
confusions = ["全部表面统一标注：无括号，也无“其余”", "参考尺寸括号：括住的是尺寸数字", "一般公差注语：文字说明GB/T 1804公差等级", "图框角部的其他标记：无V形符号"]
related = ["DC-G6-004", "DC-G6-001", "DC-G6-005", "DC-G6-007", "DC-G6-071", "DC-G4-009", "DC-G4-061", "DC-G9-028"]
