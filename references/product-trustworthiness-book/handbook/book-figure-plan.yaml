    number: 图 2-1
    title: 一条链上的三个位置，每个箭头都站着“可能”
    file: ch02-concepts-terminology/chapter.md
    anchor_before: "## 2.4 "
    prompt: 三个串联的站点由两段箭头相连，箭头中段各有一个可开合的小闸门（示意“可能，而非必然”）；第一站内一道细小裂纹图形，第二站一个偏离刻度的表盘，第三站一个熄灭的输出灯。每站下方分出一条旁路（被拦截/被修正/未激活）。闸门为琥珀色。
