recognition = "颜色是线宽缺失时最可靠的辅助线索：取实体颜色（ByLayer 时取图层颜色），按上表映射为候选线类，再用线型图案复核（红色+点画图案→细点画线）。企业模板常改色（如尺寸线青色、文字黄色），应先统计“颜色—线型—线宽”的共现表找出主映射再使用；颜色单独不足以判定。"
