recognition = "以“展开”字样或展开长度注语为锚点，在所属视图（粗实线闭合轮廓、无剖面线）中找两端恰好落在轮廓边上的细实线直线，多条时相互平行或与轮廓成固定角；不带箭头、不连尺寸数字。尺寸界线会伸出轮廓，过渡线两端与轮廓留有间隙。"
