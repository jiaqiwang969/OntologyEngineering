components = ["带圈 M：圆直径约 0.75H，写在第二格公差值及其他修饰符之后（第 10 组）", "基准格中：写在基准字母之后（仅当基准是尺寸要素）；公共基准整体适用时字母加括号，如 (A-B)Ⓜ", "可紧接 Ⓡ 构成可逆要求；数值为 0 时即零几何公差（DC-G5-113）", "被测为尺寸要素的中心线/中心面：箭头与尺寸线对齐"]
