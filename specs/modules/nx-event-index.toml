constraint="nx_complete_event_index"
behavior="aggregate_small_fields_and_final_lifecycle_keep_the_original_limit"
rust_path="crates/oe-nx-worker/tests/event_index.rs"
oracle="10×230KiB字段与原2MiB临界读回均完整外置至累计预算；生命周期预留及最终上限重新验证。"
scope="Rust结果容量；Windows原生另验"

