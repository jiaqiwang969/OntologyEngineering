[[concepts]]
id = "DC-G3-207"
name = "齿轮传动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示两齿轮（或蜗杆蜗轮）啮合传动、不指明齿线的符号，包括圆柱、非圆、圆锥、准双曲面、蜗轮与圆柱蜗杆、蜗轮与球面蜗杆、交错轴斜齿轮和扇形齿轮传动。"
components = ["侧视（轴线在图面内）：每个齿轮为与粗轴线垂直的轮辐线、端部带居中短横，两轮端部相接表示啮合；内啮合大轮画成开口朝内的“[”形。", "端视（轴线垂直于图面）：两齿轮画成相切的圆，带十字点画线中心线；非圆齿轮为两相切的椭圆形节曲线。", "圆锥齿轮、准双曲面齿轮：两轮辐线互相垂直（轴线相交），端部短线斜置；准双曲面另用虚线表示轴线偏置。", "蜗杆蜗轮：蜗轮为大圆，蜗杆画成与之相切、带“×”的小矩形（圆柱蜗杆）或两端外张的凹腰形（球面蜗杆），两轴交错垂直。", "可用符号：齿轮画成带“×”的矩形或梯形轮体，两轮体相接；交错轴斜齿轮画成两交叉轮体。", "1984 版称交错轴斜齿轮为“螺旋齿轮”，扇形齿轮传动在 1984 版为 5.2.5、2013 版为 8.2.5。"]
variants = ["圆柱齿轮", "非圆齿轮", "圆锥齿轮", "准双曲面齿轮", "蜗轮与圆柱蜗杆", "蜗轮与球面蜗杆", "交错轴斜齿轮（1984称螺旋齿轮）", "扇形齿轮传动"]
dxf_forms = ["Exploded LINE strokes on layer 01 for wheel lines and thick shafts (2d-wide LWPOLYLINE in 2013 style)", "End view: tangent CIRCLEs or ELLIPSEs with centre LINEs on layer 05", "Alternative symbols: LWPOLYLINE rectangles/trapezoids each with an × of two short LINEs", "INSERT of a transmission-diagram library block"]
recognition = "锚点：两个齿轮符号相接——两条与各自粗轴线垂直的轮辐线，其端部短横居中（T 形）且相互接触；或两个圆相切（端视）。按两轴关系分：两轴平行→圆柱；两轴相交成直角→圆锥；有虚线偏置→准双曲面；大圆与带“×”小矩形交错相切→蜗杆蜗轮；椭圆对→非圆；扇形与圆相切→扇形齿轮。与摩擦传动区分：摩擦轮端部短线只向一侧、常有压紧力箭头；与带/链传动区分：带/链有公切线。"
confusions = ["摩擦传动：端部短线只在一侧，有压紧力箭头。", "带传动、链传动：两轮之间有公切线。", "零件图/装配图中的齿轮啮合画法：真实轮廓，齿顶圆粗实线、分度圆点画线、啮合区画法，有尺寸。"]
related = ["DC-G3-208", "DC-G3-206", "DC-G3-205", "DC-G3-170", "DC-G3-163", "DC-G3-021", "DC-G3-049", "DC-G3-070", "DC-G3-052"]
priority = "low"
