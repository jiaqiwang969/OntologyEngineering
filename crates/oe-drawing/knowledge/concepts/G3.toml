[[concepts]]
id = "DC-G3-120"
name = "滚动轴承轴线垂直于投影面的特征画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在垂直于滚动轴承轴线的投影面上（端视图），不论滚动体是球、滚子还是滚针，都按统一的特征画法画成同心圆加一个代表滚动体的小圆。"
components = ["外圈外径和内圈孔径用两个粗实线同心圆表示，圆心处有十字细点画线中心线。", "两粗圆之间画一个细点画线圆，表示滚动体中心所在的圆。", "只在该点画线圆上画一个小圆代表滚动体，小圆内画相交的短线（一条沿径向），其余滚动体不画。", "滚动体的实际形状和尺寸不影响此画法；2017版6.2与1998版5.2.2规定一致。"]
variants = []
dxf_forms = ["Two CIRCLEs on layer 01 (outer D, bore d) sharing a centre; one CIRCLE on layer 05 with CENTER/ACAD_ISO04W100 linetype for the pitch circle", "One small CIRCLE on the pitch circle plus 1–2 short LINEs through its centre", "Part of an end-view bearing library INSERT, or exploded from it"]
recognition = "锚点为一组同心圆：两粗圆之间夹一细点画线圆，且该点画线圆上恰好只有一个小圆（半径约为两粗圆半径差的1/4～1/3），小圆内有短线交叉。只出现一个小圆是关键：法兰均布孔在点画线圆上有多个等距小圆，齿轮端视图点画线圆上没有小圆。再用与主视图的投影关系核对该处在剖视中是否为滚动轴承框。"
