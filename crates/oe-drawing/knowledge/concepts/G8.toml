[[concepts]]
id = "DC-G8-024"
name = "零部件序号（横线式）"
aliases = ["零部件序号（圆圈式）", "零部件序号（无框式）", "零件序号"]
group = "G8"
kind = "symbol"
meaning = "装配图中给每种零件或部件编的号，用来与明细栏对应。三种注写形式：写在指引线末端的水平细实线基准上、写在细实线圆内、或直接写在指引线非零件端附近；序号字高比同图尺寸数字大一号或两号；同一张图的形式要一致。"
components = ["序号数字：整数，字高比尺寸数字大一号（如3.5→5）或两号（如3.5→7）；GB/T 4458.2 图1a为大一号，图1b、1c为大一号或两号。", "横线式：数字写在指引线末端的水平细实线上方，横线略长于数字宽度。", "圆圈式：数字居中写在细实线圆内，圆的大小随字号加大。", "无框式：数字直接写在指引线末端附近。", "指引线：从零件可见轮廓内的小圆点引出（薄件或涂黑断面用箭头），最多折一次，互不相交。", "编号规则：每种零件一个序号，标准化组件（油杯、滚动轴承、电动机）整体一个序号，与明细栏一致；需要时可重复标注。"]
variants = ["one size larger (图1a)", "one or two sizes larger (图1b)", "small circle (图1a)", "larger circle with bigger figures (图1b)", "plain figure at leader end", "水平线上注写", "圆内注写", "指引线末端箭头（薄件、涂黑断面）", "折一次的指引线"]
dxf_forms = ["MULTILEADER (MLEADER) with block content _TagCircle (circle style) or MTEXT content with a horizontal landing (underline style), arrowhead _DotSmall, layer 09", "LEADER (from QLEADER) + TEXT/MTEXT number + LINE reference line or CIRCLE on layers 09/11", "INSERT of a balloon block (CAXA/GstarCAD 序号 block) with an ATTRIB holding the number", "AutoCAD Mechanical balloons (AMBALLOON) as ACAD_PROXY_ENTITY or anonymous *U blocks in exported DXF", "exploded: TEXT digits + LINE/CIRCLE + LINE leader + DONUT or HATCH SOLID dot"]
recognition = "以“整数文字＋与之相连的细线指引线＋指引线另一端位于某零件闭合区域内的实心圆点（或箭头）”三者为锚点。同图所有序号字高一致，约为尺寸字高的1.4倍（大一号）或2倍（大两号）。横线式：文字下方有长度约为文字宽度1~1.5倍的水平线，指引线接在横线一端；圆圈式：文字中心与细实线圆圆心重合（偏差小于0.2倍字高），圆半径约为字高的0.8~1倍。全图序号集合应与明细栏序号一一对应，并排成整齐的行列、按顺时针或逆时针递增。区别：局部放大图是细实线圆圈住被放大部位、旁注罗马数字；基准目标是被水平线分成上下两半的圆；热处理分区序号是零件区域内的带圈数字；周围焊符号是指引线转折处的小圆；尺寸数字连有尺寸线且字高较小。"
confusions = ["带文字的注释指引线：末端是说明文字或标记。", "焊缝基准线：基准线上有焊缝符号，常配虚线基准线。", "指引线上的尺寸（旁注法孔尺寸等）：含%%c、×、深度符号，字高为尺寸字高。", "点焊或周围焊小圆：在指引线转折点，内无数字。", "基准目标圆：圆被水平线分成两半，内含字母加数字。", "局部放大图编号：罗马数字，对应放大图上方的“I/2:1”。", "热处理分区序号①：带圈数字在零件区域内部，而不在指引线末端。", "尺寸数字：字高小一到两号，与尺寸线相连。", "技术要求条目编号：在文字块行首，后跟点号。"]
related = ["DC-G8-009", "DC-G8-010", "DC-G8-008", "DC-G8-012", "DC-G8-015", "DC-G8-025", "DC-G1-094", "DC-G1-095", "DC-G1-018", "DC-G2-075", "DC-G7-024"]
