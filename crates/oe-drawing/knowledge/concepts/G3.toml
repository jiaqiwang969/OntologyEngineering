[[concepts]]
id = "DC-G3-108"
name = "剖切平面后不需表达部分的省略"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在不致引起误解时，剖视图中位于剖切平面后面、无需表达的部分允许省略不画，只保留剖面区域和必要的轮廓。"
components = ["剖面区域：照常画剖面线，用粗实线围成。", "剖切平面后方的可见轮廓：不需表达的部分省去，使图形接近断面图。", "剖切符号和剖视名称仍按剖视图标注。"]
variants = []
dxf_forms = ["HATCH region with a closed boundary of thick LINE/ARC, with fewer background outline entities than a full section", "Section label TEXT 'A—A' above the view and cutting-plane symbols (short thick LINEs + arrows + letter TEXT) in the parent view"]
recognition = "以剖视名称“X—X”及其剖面区域HATCH为锚点；根据父视图中剖切位置与投射方向，推算剖切面后方本应可见的轮廓（孔、台阶边线等）。若这些轮廓缺失而剖面区域完整，判为本省略。区分断面图：断面图本来只画剖面，常放在剖切线延长线上或标为移出断面；当剖面区域外仍保留部分后方轮廓时为本省略。两者几何相似，本概念主要用于“后方轮廓缺失不报错”。"
