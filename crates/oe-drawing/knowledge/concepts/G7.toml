dxf_forms = ["Z-shaped LWPOLYLINE (top LINE, diagonal, bottom LINE) ≈2.5h high crossing the reference line, between TEXT 'n×l' and '(e)'", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "AutoCAD Mechanical / GstarCAD Mechanical weld-symbol object saved in DXF as ACAD_PROXY_ENTITY; only its proxy graphics (lines, arcs, text) are readable without the vendor enabler"]
recognition = "在焊缝基准线右侧尺寸区找一个跨越基准线、高约2.5倍字高的Z形折线，其左侧为“n×l”或“l”，右侧为“(e)”；同时基准线两侧通常有镜像的角焊缝三角。区分文字Z：文字Z为TEXT且高度≈h，不跨越基准线。"
confusions = ["文字字母Z：TEXT字符，高度约等于字高。", "断裂线（双折线）：在视图轮廓断开处，带锯齿。", "链式尺寸标记：在尺寸线上。"]
