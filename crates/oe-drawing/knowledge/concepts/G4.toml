[[concepts]]
id = "DC-G4-048"
name = "斜度符号 ∠"
aliases = ["斜度符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "斜度符号用于标注一个平面相对另一平面的倾斜程度（1:n）：符号写在由指引线连到斜面的基准线上，后接斜度比值；符号斜边的倾斜方向应与被注斜面的方向一致。"
components = ["符号：一条水平底线和一条与之成锐角的斜线组成的∠形，高约h，线宽h/10。", "注法：从斜面引出指引线，接水平基准线，在基准线上写“∠1:100”。", "方向：符号斜边方向随斜面方向而定，因此会出现∠或其镜像（GB/T 4458.4表1中的1:100、1:15、1:5各例）。", "版本：GB/T 16675.2-2012表1列入此符号，1996版表1未列。"]
variants = ["symbol + ratio on reference line with leader", "listed in GB/T 16675.2-2012 表1, absent from 1996 表1"]
dxf_forms = ["LEADER/MULTILEADER + MTEXT '{\\Fgdt;z}1:100' (gdt.shx 'z' = slope)", "exploded: two short LINE strokes (base + sloped stroke) before TEXT '1:100' on a horizontal reference LINE", "TEXT with a substitute glyph such as '∠' (U+2220) typed by the user", "INSERT of a slope-symbol block", "layer 08/09 or template dimension layer"]
recognition = "锚点为“1:数字”比值文字，位于水平基准线上，该基准线经指引线连到一条直线轮廓（斜面），文字前有小锐角符号（两线夹角约30°、高≈h；或gdt字符z、U+2220）。几何佐证：被指斜面与相邻基准面成小角度，tan≈1/n。排除：锥度▷为闭合三角形，所指为关于轴线对称的圆锥轮廓；倾斜度∠位于公差框格首格并后接公差值和基准字母；斜线终端是尺寸线端部45°短斜线、无比值。"
confusions = ["倾斜度公差符号∠：位于公差框格内，后接公差值和基准，不跟1:n。", "锥度符号▷：闭合等腰三角形，用于有轴线的圆锥。", "起模斜度倾斜符号：模制件专用，表示拔模方向和数值。", "尺寸线终端斜线：位于尺寸线端部，无比值文字。", "角度尺寸：用°表示，有圆弧尺寸线。"]
related = ["DC-G4-057", "DC-G4-028", "DC-G4-056", "DC-G5-042", "DC-G1-018", "DC-G3-132"]
priority = "medium"
