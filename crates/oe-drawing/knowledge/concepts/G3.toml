[[concepts]]
id = "DC-G3-090"
name = "非标准螺纹标注"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "牙型或参数不符合标准（如矩形螺纹）的螺纹没有标准标记可用，必须画出牙型并注出全部所需尺寸及有关要求。"
components = ["螺纹区仍按螺纹规定画法表示（牙顶、牙底线及终止线）。", "用局部剖视或局部放大图（细圆圈出、编号加比例）画出若干个牙的实际牙型。", "牙型上注全尺寸：大径、小径、螺距、牙宽或槽宽、牙型角、圆角等及其公差。", "需要时另以文字注明线数、旋向等要求。"]
variants = ["局部放大牙型加尺寸"]
dxf_forms = ["Detail view: thin CIRCLE on the parent view + numeral TEXT, and an enlarged copy of a few teeth as LINE/ARC/LWPOLYLINE on the thick layer with its own DIMENSIONs (DIMLFAC scaled so values show true size)", "Broken-out section bounded by a thin SPLINE wavy line (layer 02) with ANSI31 HATCH on the cut teeth", "Profile dimensions: linear DIMENSIONs for pitch and tooth width, angular DIMENSION with '%%d' for the flank angle"]
recognition = "以螺纹区（成对平行的粗/细线及终止线）为锚点，在其上或附近局部放大图中寻找由至少两个等节距凸起组成的齿廓（矩形、梯形或其他非60°/30°标准形），并带有螺距、牙宽等尺寸；同时整张图上找不到与该螺纹对应的标准标记串（M、Tr、B、G、R等开头）。若既有标准标记又有牙型放大图，应归为螺纹牙型表示而非本概念。区分齿条或花键：齿条齿廓在非回转件的直线上并有齿条参数表，花键齿在垂直轴线的断面图中沿圆周分布。"
confusions = ["标准螺纹的牙型表示：同时有标准螺纹标记。", "齿条齿形：非回转件，配有模数、齿数参数表。", "滚花：网纹线，不是齿廓。", "花键断面：齿沿圆周分布在断面图中。"]
related = ["DC-G3-055", "DC-G3-024", "DC-G3-005", "DC-G3-088", "DC-G3-224", "DC-G2-075", "DC-G2-023"]
priority = "low"
text_forms = ["矩形螺纹", "P=6", "I 4:1"]
