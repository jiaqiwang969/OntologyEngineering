[[concepts]]
id = "DC-G4-062"
name = "一般尺寸规范（GB/T 45683）"
aliases = []
group = "G4"
kind = "note"
meaning = "按GB/T 45683（ISO 22081）在标题栏内或附近给出的一般尺寸规范，为所有未单独注公差、非理论正确尺寸、非参考尺寸的线性和角度尺寸规定统一公差。"
components = ["标题行：'一般公差 GB/T 45683'，其下可先列一般几何规范（面轮廓度框格及基准）", "线性尺寸行：'线性尺寸：±t'或'+t/−t'，或ISO 286公差代号如JS13/js13，可附Ⓔ等修饰符", "角度尺寸行：'角度尺寸：±t°'或'+t°/−t°'", "可变数值：可写'见文件××××中表格n'，从表格取值", "适用规则：只用于未单独注公差、不是TED、不是参考尺寸的尺寸，也包括由CAD属性定义公称值的尺寸要素"]
variants = ["± values", "JS/js tolerance class", "reference to a value table"]
dxf_forms = ["multi-line MTEXT near the title block: '一般公差 GB/T 45683\\P线性尺寸：%%p0.25 Ⓔ\\P角度尺寸：%%p0.5%%d'", "stacked TEXT entities, one per line; Ⓔ as a circled-letter character, CIRCLE + TEXT 'E', or a small block", "TOLERANCE entity (or exploded frame) for the accompanying general profile specification"]
recognition = "锚点为含'45683'（或ISO 22081）的文字，其下或旁有以'线性尺寸'、'角度尺寸'开头的行，后接%%p/±数值或JS/js加数字；常与一个面轮廓度框格相邻，位于标题栏附近。与GB/T 1804注写区分：后者只写标准号和等级字母、不列数值；与单个尺寸的±公差区分：此处有标准号和'线性尺寸/角度尺寸'标签，不依附尺寸线。"
confusions = ["GB/T 1804-m 一般公差注写：只写等级代号", "单个尺寸后的±公差：紧随具体尺寸数值", "同一注写块内的一般几何规范（面轮廓度框格）：属几何公差"]
related = ["DC-G5-022", "DC-G4-061", "DC-G4-115", "DC-G4-029", "DC-G4-009", "DC-G5-021"]
priority = "rare"
