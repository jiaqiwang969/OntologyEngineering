[[cards]]
id = "surface_texture_symbol"
expression_kind = "surface_roughness"
title = "表面结构代号"
meaning = "GB/T 131 的表面结构图形符号：基本符号是两条不等长、夹角 60° 的细实线；加一短横封口表示要求去除材料，加内切小圆表示不允许去除材料；长边上加横线为完整符号，在其上下注写参数代号与极限值（如 Ra 3.2）及加工方法等补充要求。旧版（1993）只注数值、不写参数代号。符号尖端从材料外指向表面，可立在轮廓线、延长线或指引线上；符号与数值按从下或从右读的方向注写。大多数表面相同的要求可统一注在标题栏附近（“其余”）。"
sources = [
  "GB/T 131-2006 产品几何技术规范 技术产品文件中表面结构的表示法 4、5、11",
  "GB/T 131-1993 机械制图 表面粗糙度符号、代号及其注法 3.3–3.6、4.1",
  "GB/T 3505-2009 表面结构 轮廓法 术语、定义及表面结构参数 附录A",
  "机械制图（第7版）§9-4",
  "互换性与测量技术 4.3",
]
knowledge_units = ["K31", "K32"]
recognition = "以两条从同一点出发、夹角约 60°、长度比 1.5～3 的细线为锚：两臂间有横线封口为去除材料，内切小圆为不允许去除材料，长臂端有横线为完整符号。数值在符号内（图块属性）或开口一侧附近的文字；带 Ra、Rz 等代号为现行写法，只有数值为旧版写法。尖端所在的线的作用（轮廓、延长线、指引线、尺寸线）决定注在哪里；开口不朝上即按另一读图方向注写。"
markers = ["Ra", "Rz", "√", "其余"]
concepts = ["DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G6-069", "DC-G6-045", "DC-G6-046", "DC-G6-075", "DC-G6-027", "DC-G6-049", "DC-G6-053", "DC-G6-052", "DC-G6-032", "DC-G6-006", "DC-G6-051"]

