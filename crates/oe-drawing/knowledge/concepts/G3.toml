[[concepts]]
id = "DC-G3-226"
name = "米制锥螺纹标记"
aliases = []
group = "G3"
kind = "text_convention"
meaning = "米制锥螺纹的标记，以特征代号ZM加公称直径表示圆锥外（内）螺纹，与之配合的圆柱内螺纹写成普通螺纹代号加标准编号，短基距加S。"
components = ["圆锥螺纹：ZM+公称直径（如ZM10）；短基距在后加“-S”，标准基距不注。", "与圆锥外螺纹配合的圆柱内螺纹：写普通螺纹规格并注明标准编号，如M10×1·GB1415。", "螺纹副：圆锥内/外螺纹配合写ZM10/ZM10；圆柱内与圆锥外配合写M10×1·GB1415/ZM10-S。", "标注位置：通常用引线从大径或中心引出，也可写在从基面处引出的尺寸线上（见米制锥螺纹标记标注）。"]
variants = ["圆锥内/外螺纹配合ZM/ZM", "圆柱内螺纹与圆锥外螺纹配合", "短基距S"]
dxf_forms = ["TEXT/MTEXT on a LEADER (layers 09/11) or DIMENSION override text measured from the gauge plane", "The middle dot '·' as a Unicode character or replaced by '.' in older fonts"]
recognition = "锚点为文字正则 \\bZM\\s?\\d+(\\.\\d+)?(-S)?(/ZM\\d+.*)?，或 M\\d+[×xX]\\d+(\\.\\d+)?\\s?[·.]\\s?GB\\s?1415；位置在锥形螺纹段（可能画出锥度）的引线或尺寸线上。ZM前缀是与普通螺纹的唯一区别，M…·GB1415形式需看标准号后缀。"
confusions = ["普通螺纹M：无ZM前缀，也不带GB1415后缀。", "55°密封管螺纹R/Rc/Rp：同为锥螺纹，但用英寸尺寸代号。", "短基距S与旋合长度S：位置相同（末尾“-S”），需依前缀ZM判断含义。"]
related = ["DC-G3-082", "DC-G3-223", "DC-G3-215", "DC-G3-023"]
priority = "rare"
text_forms = ["ZM10", "ZM10-S", "ZM10/ZM10", "M10×1·GB1415/ZM10-S"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "仅见GB/T 4459.1-1995附录A（参考件，引用GB/T 1415-92）。据一般知识，其后修订的米制密封螺纹标准改用Mc/Mp代号，新图上可能出现“Mc12×1”一类写法，需另行核对。"
