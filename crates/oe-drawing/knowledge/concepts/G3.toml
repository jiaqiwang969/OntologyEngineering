[[concepts]]
id = "DC-G3-147"
name = "凸轮符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示以轮廓曲线推动从动杆的凸轮，包括盘形凸轮、移动凸轮、与杆固接的凸轮以及圆柱、圆锥、双曲面等空间凸轮。"
components = ["盘形凸轮：一条闭合的非圆光滑轮廓（如桃形），内部以两条正交细点画线标出转动中心；沟槽盘形凸轮画成几条嵌套的闭合曲线。", "移动凸轮：底边为直线、顶面带斜坡或曲线台阶的条形轮廓，作直线往复移动。", "与杆固接的凸轮：盘形轮廓中心画小圆或实心点，从中心引一条斜杆穿出轮廓并在固接处加实心小三角；可调连接另有专门示例。", "空间凸轮：沿粗轴线画成矩形、梯形或双曲边的鼓形轮体，内画小“×”（与轴固连），并画折线或斜线表示沟槽/曲面；可用符号把轮体分成两段、中间以斜分界线表示。", "1984 版 6.1～6.4 与 2013 版 9.1～9.4 的图形一致。"]
variants = ["盘形凸轮（含沟槽盘形凸轮）", "移动凸轮", "与杆固接的凸轮（含可调连接）", "圆柱凸轮", "圆锥凸轮", "双曲面凸轮"]
dxf_forms = ["Disc cam: closed SPLINE or LWPOLYLINE with ARC segments on layer 01, plus two centre LINEs on layer 05 crossing at the rotation centre", "Grooved disc cam: nested closed curves (CIRCLE plus offset SPLINE) around one centre", "Spatial cams: LWPOLYLINE drum/trapezoid outline with an inner groove polyline, an × of two short LINEs, and thick shaft LINEs or 2d-wide LWPOLYLINE on both sides", "INSERT of a kinematic-symbol library block"]
recognition = "锚点：机构简图中一条闭合非圆光滑曲线（SPLINE 或多段弧多段线），其内部有一对正交细点画线的交点（转动中心），且有从动杆端头贴靠在曲线上。移动凸轮：一端带斜坡/曲线台阶的条形轮廓，常配往复运动箭头和从动杆。空间凸轮：粗轴线上的鼓形或梯形轮体，内含小“×”与斜向或折线沟槽线。与偏心轮区分：偏心轮轮廓是正圆、铰链小圆偏离圆心；与非圆齿轮区分：非圆齿轮成对出现、两椭圆形节曲线相切且多用点画线。"
confusions = ["偏心轮（双副元素构件）：轮廓为正圆，转动中心偏离圆心；凸轮轮廓为非圆曲线。", "非圆齿轮传动：两个椭圆形节曲线成对相切；凸轮为单个轮廓并配从动杆。", "零件图中的凸轮零件视图：有尺寸、剖面线、公差等，不是单线简图；其展开图尺寸见尺寸注法相关概念。"]
related = ["DC-G3-146", "DC-G3-155", "DC-G3-176", "DC-G3-207", "DC-G4-084"]
