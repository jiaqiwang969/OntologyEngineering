aliases = []
group = "G1"
kind = "sheet_element"
meaning = "用细实线画出的图纸裁切边界（纸边），即幅面的实际大小；粗实线图框在其内侧，距离为 e 或 a/c。"
components = ["细实线矩形，尺寸等于幅面 B×L。", "图框位于其内：无装订边四边距 e；有装订边左 a=25 mm，其余 c。", "对中符号、剪切符号、图幅分区都以纸边为基准布置。"]
variants = []
