recognition = "以字高大小、顶部带小圆点的倒T形笔画为锚点，右侧紧接型号或尺寸串。与垂直度符号⊥区分：⊥无顶部圆点，位于几何公差框格内；与工字钢符号区分：工字钢上下翼缘对称且无圆点。"
confusions = ["垂直度符号⊥：在公差框格内，顶部无圆点。", "工字钢符号：上下对称翼缘。"]
related = ["DC-G3-098", "DC-G3-162", "DC-G3-138"]
