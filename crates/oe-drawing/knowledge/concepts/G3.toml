kind = "conventional_representation"
meaning = "蜗杆蜗轮副在装配图中按啮合画法绘制：蜗杆分度线与蜗轮分度圆相切，啮合区内蜗杆在前、蜗轮被遮挡部分不画。"
components = ["蜗轮呈圆的视图中，蜗杆以侧视矩形画在前方，其分度线与蜗轮分度圆相切；蜗轮被蜗杆挡住的齿顶圆、外圆部分不画。", "蜗杆呈圆的视图中，蜗杆的齿顶圆和分度圆完整画出，蜗轮以喉部圆弧侧视图表示，被蜗杆挡住部分不画。", "剖视中（剖切平面通过蜗杆轴线）啮合区蜗杆齿可见，蜗轮轮齿被遮挡部分省略或画虚线；有圆柱蜗杆副（一）（二）和环面蜗杆副三种图例。"]
variants = ["圆柱蜗杆副（一）（二）", "环面蜗杆副"]
dxf_forms = ["two CENTER-linetype axes crossing at 90° without intersecting (skew), drawn in two orthogonal views", "worm-wheel CIRCLE/ARC set (outer, tip, pitch with CENTER linetype) trimmed where the worm rectangle lies in front", "worm side view: thick LINE rectangle with CENTER-linetype pitch line tangent to the wheel pitch circle; sections with HATCH ANSI31 on worm core and wheel rim", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一个大圆组（蜗轮：外圆、齿顶圆粗实线，分度圆点画线），其下方或侧方有一个矩形的蜗杆侧视图，蜗杆的点画线分度线与蜗轮分度圆相切，蜗轮圆在矩形内被截断不画；另一视图中蜗杆为小圆组，蜗轮为带喉部凹弧的窄条。两轴线空间交错垂直（不相交）。与螺旋齿轮副区分：螺旋齿轮副两者都是圆柱齿轮，侧视中画三条斜齿线、无喉部凹弧；与圆柱齿轮外啮合区分：后者两轴平行、两节圆在同一视图中相切。"
confusions = ["螺旋齿轮副：无蜗轮喉部凹弧，侧视有斜齿线。", "圆柱齿轮啮合：两轴线平行，两节圆在同一视图相切。"]
related = ["DC-G3-048", "DC-G3-050", "DC-G3-052", "DC-G3-077", "DC-G3-212", "DC-G3-213"]
