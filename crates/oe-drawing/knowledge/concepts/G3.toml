[[concepts]]
id = "DC-G3-070"
name = "锥齿轮副啮合画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "两轴线相交（通常正交）的锥齿轮副，两分度圆锥共顶点画出；剖视中啮合区一个齿轮的轮齿画粗实线，另一个被遮挡部分画虚线或省略；外形视图中啮合区节线画粗实线。"
components = ["两齿轮轴线（细点画线）相交于一点，两分度圆锥母线（点画线）自此点发出，在啮合区重合。", "剖视（过两轴线）：啮合区一齿轮齿顶线粗实线，另一齿轮被挡齿顶线画虚线或不画；轮齿不画剖面线。", "外形视图：啮合区齿顶线不画，公共节线画粗实线，其余节线仍为点画线。", "端视图可只画一个齿轮的大、小端齿顶圆和大端分度圆。"]
variants = ["剖视（一）", "外形视图（二）"]
dxf_forms = ["Two CENTER-linetype axis LINEs meeting at the cone apex at the shaft angle (usually 90°), plus CENTER-linetype pitch-cone LINEs radiating from that apex", "Thick LINE tip and root lines converging toward the apex; in the mesh zone one thick tip LINE and one HIDDEN-linetype tip LINE (layer 04) or none", "HATCH on hubs/webs only; tooth regions unhatched", "Outside view: thick LINE lying on the common pitch line over the face width"]
recognition = "锚点为两条相交的细点画线（轴线）和由交点辐射出的点画线（分度锥母线）；每个齿轮的齿顶线、齿根线为延长后经过锥顶的收敛直线。啮合区内两组线位于公共母线两侧：剖视时一侧为粗实线、另一侧为虚线或空缺；外形视图时公共母线在齿宽范围内由点画线变为粗实线。与锥形摩擦轮区分：摩擦轮无分度点画线和齿根线；与圆柱齿轮副区分：圆柱齿轮副两轴线平行。"
confusions = ["锥形摩擦轮：两锥面直接接触，无节线点画线和齿根线。", "圆柱齿轮副啮合：两轴线平行，分度线平行相切。", "特殊锥齿轮副（准双曲面、斜交等）：轴线不相交或非正交。"]
related = ["DC-G3-071", "DC-G3-077", "DC-G3-078", "DC-G3-036", "DC-G3-214", "DC-G3-207"]
