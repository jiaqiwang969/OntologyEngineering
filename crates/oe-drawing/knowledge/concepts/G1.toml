[[concepts]]
id = "DC-G1-008"
name = "剖切线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细点画线表示剖切面在视图上的位置（剖切面迹线），画在剖切符号的粗短画之间；剖切线可以省略不画。"
components = ["细点画线（No.04.1.5），沿剖切面迹线，与粗短画共线或首尾相接。", "移出断面配置在剖切线延长线上时，剖切线是断面定位的依据；对称且配置在剖切线延长线上的移出断面可不标字母和箭头。", "部分结构剖切时，可用细点画线把分散的剖切符号连起来。", "GB/T 4457.4 未采用 ISO 128-24 中用粗点画线表示的剖切平面位置线。"]
variants = ["ISO 128-24 04.2.2 thick chain cutting-plane position line was not adopted (GB/T 4457.4 前言)", "drawn", "omitted"]
dxf_forms = ["LINE/ARC/CIRCLE with a dash-dot linetype (CENTER, CENTER2, DASHDOT, ACAD_ISO04W100 or e.g. 点画线/中心线), thin lineweight, layer 05 / 中心线 / CENTER, colour red (ACI 1)", "CENTER-type LINE collinear with thick cutting strokes; GB/T 18229 layer 05 includes the cutting-plane line", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：与剖切符号粗短画共线的点画线，或一端附近有移出断面图形（断面在其延长线上）的点画线。与轴线、对称中心线区分：后两者沿零件的对称面或回转轴，两端只略超出轮廓（2~5 mm）且不连粗短画；剖切线可能偏离对称面，并可外伸到断面图处。剖切面恰过对称面时两线重合只画一条，此时只能靠剖切符号判断。"
confusions = ["轴线、对称中心线：同为细点画线，但不与粗短画相连。", "剖切符号：粗短画，表示起迄与转折。", "ISO 粗点画线位置线：国标未采用，旧国外图样中可能出现。"]
related = ["DC-G1-007", "DC-G1-044", "DC-G1-021", "DC-G2-043", "DC-G2-032", "DC-G2-028"]
