[[concepts]]
id = "DC-G6-003"
name = "表面结构图形符号的比例和尺寸"
aliases = []
group = "G6"
kind = "other"
meaning = "规定表面结构符号各部分与图上字高h的比例关系；它是按尺寸识别符号、判断哪些文字属于该符号的基础。"
components = ["符号线宽d′与字母笔画宽均为h/10（如h=3.5 mm时为0.35 mm）。", "2006版：短边竖高H1约1.4h（h=3.5时5 mm），长边竖高H2最小约3h（h=3.5时10.5 mm），注写行数增多时H2加长。", "1993版附录A比例相同，但小字号的H2略大（h=2.5、3.5时分别为8、11 mm），并另给出纹理符号的比例。", "位置a、b、d、e的字母高为h；c区可写大小写字母或汉字，高度可大于h；纹理和修饰字母用GB/T 14691 B型直体大写。", "横线长度取决于其上下注写内容；区域法尺寸表同2006版；ISO 21920-1草案表A.1另给出附加横杠高度和简化长度（数值OCR可读性差）。"]
variants = ["GB/T 131-2006 附录A 表A.1", "GB/T 131-1993 附录A 表A1 (also gives the lay-symbol proportions)", "GB/T 33523.1 附录A", "ISO 21920-1 draft 附录A (adds heights for the extra bar and simplified length)"]
dxf_forms = ["block geometry: short-leg LINE length ≈1.4h/sin60° ≈1.6h, long-leg length ≈3h/sin60° ≈3.5h, measured in block units × INSERT scale", "TEXT height h attached to the symbol, typically 2.5 / 3.5 / 5 mm (3.5 most common on A3/A4)", "thin lineweight ≈0.25–0.35 mm, or ByLayer on the thin-line/symbol layer", "INSERT with uniform xscale = yscale ≠ 1 when one block is reused for different text heights"]
recognition = "用于所有表面结构符号的尺寸校验：以符号所属文字字高h为基准，短边竖高≈1.4h，长边竖高≥3h（下方两行文字时约4–5h），两边长度比≈2.1（容差1.5–3），1993版图样比值略大（约2.2–2.3）。没有所属文字时，用全图尺寸数字字高作h。符号明显大于1.4h比例（约1.4倍）且位于右上角或标题栏附近时，多为1993版统一标注或简化说明。"
confusions = ["尺寸箭头和尺寸文字的大小规则：不含60°不等长两边", "基准三角形尺寸：等腰三角形，随基准方框字高", "焊缝符号比例：以焊缝基准线为参照"]
related = ["DC-G6-071", "DC-G6-069", "DC-G6-025", "DC-G6-004", "DC-G1-106", "DC-G1-102", "DC-G1-016"]
priority = "high"
text_forms = []
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Leg-length conversions (÷sin60°) are derived. Values from GB/T 131-2006 表A.1 and GB/T 131-1993 表A1; the textbook says H1 equals the next larger character height."
