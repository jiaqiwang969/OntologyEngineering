components = ["基本符号：一条直线，其一侧画一排等距、同向的短斜线。", "与构件组合：竖直线一侧画短斜线表示机架壁，构件从其上引出。", "与回转副组合：铰链圆外侧局部画短斜线，表示轴承固定在机架上；与导路组合：双平行导轨线一侧画短斜线。", "2013版条号6.1（表3），1984版3.1，图形一致。"]
