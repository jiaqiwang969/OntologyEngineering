[[concepts]]
id = "DC-G4-104"
name = "上、下极限采用不同规范操作集的方括号注法"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "上、下极限尺寸采用不同规范操作集时，各在自己的极限偏差（或极限尺寸、公差代号）之后写一组修饰符；也可写成一行：[上极限及其修饰符] - [下极限及其修饰符]，两段用方括号括起并以带空格的连字符分隔。"
components = ["两行式：上偏差后接其修饰符，下偏差后接其修饰符", "一行式：方括号包住上极限规范，空格+连字符+空格，再用方括号包住下极限规范", "修饰符：即使其中一组是缺省（如LP），也要写出", "包容要求Ⓔ等价于孔：上限LP、下限GX；轴：上限GN、下限LP"]
variants = ["per-limit modifiers on two lines", "one-line bracket form"]
dxf_forms = ["MTEXT one line such as '[%%c120 \\S+0.2^0; (E)] - [%%c120 \\S+0.1^0; (E) 25]'", "two-line MTEXT on a leader reference line with modifiers after each deviation", "modifier frames as INSERT blocks or LWPOLYLINE around letter TEXT"]
recognition = "锚点：同一尺寸文字中出现成对方括号“[…] - […]”，且每对括号内各含一个极限值或偏差及修饰符。也可检测两行偏差各自后面跟着不同的两字母框（LP/GX/GN等）。与可选尺寸、坐标向量写法区分：本形式在尺寸线或指引线基准线上且括号内是尺寸+修饰符。"
confusions = ["坐标或向量写法 [x, y]：无尺寸线关联", "两件共用一图的括号尺寸：圆括号且为另一零件的数值", "参考尺寸：圆括号"]
related = ["DC-G4-100", "DC-G4-106", "DC-G4-115", "DC-G4-132", "DC-G4-133"]
priority = "rare"
text_forms = ["[Ø120 +0.2/0 Ⓔ] - [Ø120 +0.1/0 Ⓔ /25]", "150 [+0.1 LP] - [-0.1 LP]"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 38762.1-2020 6.2.2 and 图18/图19 (figure checked). Deviations in text_forms written upper/lower with '/'. DXF forms are general practice."
