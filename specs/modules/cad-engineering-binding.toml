[[constraints]]
id="cad_motion_current_job_reception"
requirement="req_engineering"
module="cad"
check="receive"
rust_path="crates/oe-cad/src/motion/native_receiving.rs"
statement="接收请求重读当前Project/context/object、实际job/params/state/dispatch/process/worker/runtime、取回快照全树及所有源/输出字节；不从结果自身构造expected envelope。复用原索引readback恢复，不接受错页/覆盖。完整success与失败/未知诊断各有显式范围；旧drawing成功receipt判据不放宽；unknown版本拒绝，旧scope遇新capture拒绝。接收结果不改Project，不删旧决定、来源、失败、依赖和验收；后续使用原Project/work/Harness owner重新审查。"
severity="error"

[[constraints]]
id="cad_motion_saved_position_reopen_reception"
requirement="req_engineering"
module="cad"
check="receive_reopen"
rust_path="crates/oe-cad/src/motion/native_receiving/reopen.rs"
statement="重读原motion请求并核实际保存闭包和最后位置；新job的source文件与原保存产物按完整路径逐件对应且字节精确相同，不能使用旧pre-save字节。通过原ProcessIdentity比较host/pid/creation_time识别独立记录进程，PID复用但creation不同合法；worker/runtime仍须当前合格且匹配。新动作必须只读inspect_assembly_positions，按原persistence::compare核完整名称路径、重数、definition、override与有限几何，tag/枚举可变；不新增干涉查询或全BRep/工程通过。"
severity="error"

[[validations]]
id="cad_motion_receive_source_scope_oracle"
module="cad"
constraint="cad_motion_current_job_reception"
behavior="independently_frozen_motion_outer_cases"
rust_path="crates/oe-kernel/tests/motion_reception.rs"
oracle="冻结E01–E07、J01–J02和S07–S08：实际原件/Project当前绑定，旧scope仅有限接收，未来版本拒绝；全树/索引完整性与部分失败分别报告；原要求依赖/反驳不得删除。"
scope="冻结软件预期；新增实现/真实ggen/当前源码编译/Windows采集/原生和Project接收另验；不据规范声明已通过"

[[validations]]
id="cad_motion_receive_reopen_oracle"
module="cad"
constraint="cad_motion_saved_position_reopen_reception"
behavior="independently_frozen_motion_outer_cases"
rust_path="crates/oe-kernel/tests/motion_reception.rs"
oracle="冻结R01–R10、P10：保存字节可合法改变；重开必须使用实际新字节及独立记录进程；同PID新creation可通过，完整路径/重数/override/definition必要，范围外主张unknown；不以外框或tag代替持久比较。"
scope="冻结软件预期；新增实现/真实ggen/当前源码编译/Windows采集/原生和Project接收另验；不据规范声明已通过"

[[sources]]
id="cad_motion_receiving_existing_owners"
identity="Current v2 NX job/state/large_fetch/event_index and CAD/Project/persistence Rust owners"
role="Independent envelope, actual fetched bytes, optional failure diagnostics and saved-position process/byte lineage"
applicability="Proposed receive/1 and receive-reopen/1; source implementation, software receipt, platform/native and engineering adoption distinct"

[[constraints]]
id="cad_motion_recorded_native_bindings"
requirement="req_engineering"
module="nx_protocol"
check="validate_recorded_binding"
rust_path="crates/oe-nx-protocol/src/state.rs"
statement="只读接收核已记录Job/Dispatch/Process/Runtime与取回字节的一致性。复用原NativeResult规则，原实时validate_binding仍额外核独立observed.process和observed.runtime。不得将job.required_runtime或结果自身复制成新观测；recorded方法不声称重新测得OS退出、DLL加载或原生事实。原complete/failed/unknown状态及unknown不自动重发保持。"
severity="error"
[[validations]]
id="cad_motion_recorded_native_binding_controls"
module="nx_protocol"
constraint="cad_motion_recorded_native_bindings"
behavior="recorded_receiving_does_not_replace_live_runtime_or_process_observations"
rust_path="crates/oe-nx-protocol/tests/protocol.rs"
oracle="记录一致可以接收；实际observed runtime或process不符仍被原live入口拒绝；错dispatch、缺payload、错output和success带unknown均拒绝。"
scope="Rust synthetic protocol checks only; native/OS/engineering evidence separate"


