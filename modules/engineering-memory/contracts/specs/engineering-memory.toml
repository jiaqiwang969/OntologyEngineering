 {name="invalid_json",meaning="读窗报告为非法JSON的行数",rust_type="u64",required=true,format="integer",unit="行",precision="整数",write="每次提交",applicability="原件质量说明",acceptance="不产生锚点"},
 {name="identity_missing",meaning="缺会话身份而无法成锚的消息数",rust_type="u64",required=true,format="integer",unit="条",precision="整数",write="每次提交",applicability="Codex文件头缺session_meta等",acceptance="不猜测会话身份"},
 {name="blocked_at",meaning="停住该文件的超长行起点",rust_type="Option<u64>",required=false,format="integer",unit="byte",precision="显式null表示未阻塞",write="遇到可能为消息的超长行时",applicability="该文件之后内容不进入目录",acceptance="从不猜测跳过可能的消息"},
 {name="blocked_reason",meaning="阻塞原因",rust_type="Option<String>",required=false,format="text",unit="不适用",precision="显式null表示未阻塞；Rust只写oversized_line_unclassifiable或oversized_visible_message",write="与blocked_at一起",applicability="状态报告",acceptance="与blocked_at同时存在或同时为null"},
 {name="indexed_at",meaning="本次提交时间",rust_type="String",required=true,format="text",unit="不适用",precision="RFC3339",write="每次提交",applicability="状态报告",acceptance="不是原件时间"}
]

[[types]]
name = "HistoryIndexOversizedLine"
