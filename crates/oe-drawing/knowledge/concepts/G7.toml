[[concepts]]
id = "DC-G7-026"
name = "热处理要求标注"
aliases = []
group = "G7"
kind = "note"
meaning = "GB/T 24743规定的热处理要求标注：在视图附近写一个文字块，第一行用文字写热处理条件（如“淬火硬化和回火”），有局部区域时前面加一小段区域线型作图例，下面各行写带公差的硬度值和带公差的硬化深度，必要时按区域编号分行。"
components = ["图例线（可选）：标有局部热处理区时，文字前画一小段粗点画线（或粗虚线）。", "热处理条件：用文字表示，多个要求依次写出，如淬火硬化、淬火硬化和回火、表面硬化和回火、渗碳、渗氮、碳氮共渗、淬火熔合硬化、退火（消除应力、软化退火、球化退火、标准退火）。", "硬度行：(名义值+上/下偏差)加硬度标尺，如(60+4/0)HRC。", "硬化深度行：SHD、CHD、FHD、NHD、CD、CLT等后接“=”数值及上偏差。", "附加：区域编号①②、整体渗碳允许说明、引用HTO/HTS/FTS。"]
variants = ["淬火硬化", "淬火硬化和回火", "表面硬化和回火", "渗碳", "渗氮 / 碳氮共渗", "淬火熔合硬化", "零件整体硬化和回火", "允许零件整体渗碳", "退火 (消除应力 / 软化退火 / 球化退火 / 标准退火)"]
dxf_forms = ["MTEXT block of 2–5 lines; tolerances stacked with \\S (e.g. '(60\\S+4^0;)HRC', 'CHD=0.8\\S+0.4^0;')", "separate TEXT entities per line with small-height TEXT for stacked deviations", "short LINE with ACAD_ISO04W100 (or ACAD_ISO02W100) thick linetype placed left of the first text line as legend"]
recognition = "锚点为含热处理条件词的文字行（淬火硬化|回火|表面硬化|渗碳|渗氮|碳氮共渗|熔合硬化|退火）。其下方1～4行内出现硬度式（括号数值后接HRC/HV/HBW）或硬化深度式（SHD|CHD|FHD|NHD|CD|CLT后接=）即构成热处理要求块；块左侧同高处若有短段粗点画线，则与图上同线型的区域线相关联。"
confusions = ["一般技术要求注语：编号列表中的普通要求，不含硬度/深度结构化行。", "材料标注：标题栏材料栏或“材料：40Cr”。", "镀涂、发黑等表面处理注语：属于表面处理。"]
related = ["DC-G7-025", "DC-G7-089", "DC-G7-021", "DC-G7-024", "DC-G7-083", "DC-G7-090", "DC-G7-027", "DC-G7-040"]
priority = "medium"
text_forms = ["淬火硬化 (60+4/0)HRC", "淬火硬化和回火 (59+4/0)HRC", "表面硬化和回火 (700+100/0)HV30 CHD=0.8+0.4", "渗碳 CD0.35=1.2+0.5", "退火（消除应力）"]
knowledge_units = ["K43", "K40", "K41"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "偏差在原图中为上下叠写，此处用“+上/下”转写。"
