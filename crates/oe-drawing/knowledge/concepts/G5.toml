components = ["特征符号：小圆（直径约 0.35–0.4H）两侧各一条平行斜线与之相切，斜线与水平约 60°–70°、长约 0.8H", "第二格只有公差值；无基准格", "常与圆度框格上下叠放于同一被测面"]
variants = ["单项", "与圆度叠放"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;g} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph a small CIRCLE plus two parallel inclined LINE tangent to it on opposite sides in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ⌭ (U+232D) (or MTEXT font switch {\\Fgdt;g}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内的小 CIRCLE 加两条平行斜 LINE：两线到圆心距离都约等于圆半径（相切），分居圆的两侧，向上下伸出圆外。直径符号 Ø 只有一条斜线穿过圆心、写在数值前；平行度只有两斜线没有圆。OCR 常把它读成“A/”“¢”。"
confusions = ["直径符号 Ø（一条斜线穿过圆，写在数值前，DC-G4-055）", "圆度（单圆）与平行度（两斜线）"]
related = ["DC-G5-055", "DC-G5-076", "DC-G5-060", "DC-G5-090", "DC-G5-095", "DC-G4-055"]
priority = "high"
