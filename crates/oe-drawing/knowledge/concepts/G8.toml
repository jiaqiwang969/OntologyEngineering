[[concepts]]
id = "DC-G8-023"
name = "装配图中零件细节的省略"
aliases = ["装配图中工艺结构省略"]
group = "G8"
kind = "simplified_representation"
meaning = "装配图中零件的工艺结构和细节，如倒角、圆角、退刀槽、肋、滚花、拔模斜度，以及剖面线等，允许省略不画；根据装配图拆画零件图时必须补全。"
components = ["轴端、孔口的倒角和小圆角不画，转角画成尖角。", "退刀槽、越程槽不画，轴肩画成直角台阶。", "拔模斜度不画，铸件侧壁画成直线。", "滚花可在轮廓附近用粗实线局部画出，也可省略。", "零件的剖面线也可省略；大面积剖面可只沿周边画出一部分。"]
variants = []
dxf_forms = ["absence of chamfer LINEs and small fillet ARCs at corners of LINE outlines on layer 01", "partial HATCH along the boundary for large section areas"]
recognition = "这是一种“省略”表达，只能通过比较识别：同一零件在装配图中是尖角或直角台阶，而零件图、技术要求（如“未注倒角C1”）或尺寸中表明存在倒角、退刀槽等结构。程序在装配图上不应把尖角当作“没有倒角”的事实，也不应因为缺少倒角线而报错。与零件图漏画的区别：零件图中应画的结构缺失属于错误或需由注语说明。"
confusions = ["零件图中的省略或漏画：零件图必须画出或用注语说明。", "真正的尖角：零件图注“保持锐边”时才确认是尖角。", "外形视图不画剖面线：外形视图本来就不画剖面线。"]
