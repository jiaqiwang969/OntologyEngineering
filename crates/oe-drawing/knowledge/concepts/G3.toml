recognition = "以标题栏名称含“弹簧”或技术要求含“有效圈数”为锚点；再验证视图区存在弹簧画法（两排等距、半径相同的簧丝截面圆，或一组等节距的平行斜线对）及其上方的性能直线图。区分齿轮零件图：右上角为参数表而非性能图；区分螺纹件：螺纹的平行线是两对平行于轴线的直线，而不是斜线。"
confusions = ["齿轮零件图：右上角为参数表。", "普通轴类零件图：无簧丝截面和性能图。", "螺纹画法：平行于轴线的粗细线，而非斜线。"]
