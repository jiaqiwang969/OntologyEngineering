module="semantic_numeric"
check="compare_numeric"
rust_path="crates/semantica-numeric/src/compare.rs"
statement="Comparison returns both Result<bool,NumericFault> and every signal reached before that result. After existing context/input admission, Decimal/Binary64 equality records FloatOperation but ignores its trap; ordered relations may trap FloatOperation before exact conversion and NaN handling. Quiet Decimal NaN equality emits no InvalidOperation; signaling NaN equality and Decimal NaN ordering do. Pure Binary64 NaN does not acquire Decimal signals. A later conversion resource refusal retains already reached FloatOperation; no original Python resource-policy parity is claimed."
severity="error"

