honesty_statement: >-
  本合同只冻结 ch01 要提出的 EPS/ENV-01 合成问题、全书十问十答的映射边界、
  四层绿色边界与 ch11 的回答验收输入。前言中的雨刷企业缘起由独立作者来源记录约束，
  不属于 ch01 合成案例。合同不证明任何真实产品安全、可靠、稳定、可用或可放行，
  不证明任一工程活动已执行，也不授予 Agent、作者或读者任何决定权限。
