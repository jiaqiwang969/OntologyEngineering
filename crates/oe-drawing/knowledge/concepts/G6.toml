[[concepts]]
id = "DC-G6-052"
name = "表面结构要求标注在延长线上"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "表面结构符号可注在轮廓的延长线或尺寸界线上，或注在从延长线引出的带箭头指引线上；尺寸和表面结构也可一起注在延长线上。"
components = ["符号尖端接触轮廓的延长细实线或尺寸界线，作用于该延长线所属的表面。", "也可用带箭头的指引线从延长线引出。", "2006版C.7：尺寸和表面结构一起注在延长线上，或分别注在轮廓线和尺寸界线上。", "1993版：可注在可见轮廓线、尺寸界线、引出线或它们的延长线上。", "ISO 21920-1草案图11 h)、i)：只作用于延长线所指要素，不作用于尺寸线另一端的要素。"]
variants = ["GB/T 131-2006 11.2.5 图21, C.7", "GB/T 131-1993 4.1: on visible outline, extension line, leader or their extensions", "ISO 21920-1 draft 图11 h), i): applies only to the feature identified by the extension line, not to the opposite side of the dimension"]
dxf_forms = ["thin LINE collinear with an outline (its extension) with the roughness INSERT apex on it", "DIMENSION extension line (inside the dimension's anonymous block) with the INSERT apex on it — contact must be tested against the dimension block geometry", "LEADER starting with an arrow on the extension line"]
recognition = "锚点：表面结构符号，其尖端落在一条细实线上，该线与某粗实线轮廓共线（轮廓延长），或为从轮廓引出、垂直于尺寸线的尺寸界线；被注表面为该线所延长的轮廓代表的面。用于圆柱时，延长线常为母线延长或直径尺寸界线，作用于整个圆柱面。区分尺寸线上注法（尖端在两端带终端的尺寸线上）和轮廓线上注法（尖端在粗实线上）。"
confusions = ["尺寸线上注法：尖端在两端带终端的尺寸线上", "轮廓线上注法：尖端在粗实线轮廓上", "注在尺寸界线旁的尺寸文字：只是尺寸"]
related = ["DC-G6-047", "DC-G6-053", "DC-G6-051", "DC-G6-023", "DC-G6-032", "DC-G4-058"]
