[[concepts]]
id = "DC-G4-018"
name = "尺寸线终端—圆点"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "GB/T 14665-2012 新增的第五种尺寸线终端：在尺寸线端部画一个实心小圆点。另外在箭头位置不够（如连续小尺寸）时，允许用圆点代替箭头。"
components = ["实心圆点：圆心位于尺寸线与尺寸界线的交点，大小与箭头相称", "选用顺序（2012版）：实心箭头、开口箭头、空心箭头、斜线、圆点；同一图样一般只用一种终端", "代替用法：相邻小尺寸共用界线处用圆点代替两个箭头（GB/T 4458.4 图16、GB/T 14665 图13、GB/T 18229 图13）", "版本差别：1998版 GB/T 14665 只列四种终端，2012版增加圆点"]
variants = ["独立终端形式", "狭小处代替箭头", "dot", "oblique stroke as alternative small-space terminator"]
dxf_forms = ["DIMENSION with DIMBLK / DIMBLK1 / DIMBLK2 = _DOT or _DOTSMALL (a donut block)", "exploded: DONUT = closed LWPOLYLINE of two semicircular bulge segments with constant width; or small CIRCLE filled by HATCH SOLID", "layer 08 or template dimension layer"]
recognition = "锚点为尺寸线端点上的实心小圆（宽度多段线圆环、实心 HATCH 圆或 _DOT 块），圆心与尺寸线和尺寸界线交点重合（容差≈d），直径约 d~2d，远小于字高。若全图尺寸终端都是圆点→全图终端形式；若只在连续小尺寸共享界线处→代替箭头的小尺寸用法。与指引线圆点区分：指引线圆点在面域内部，接倾斜指引线和基准线；与点焊缝符号区分：焊缝符号在焊接基准线上；与圆心或顶点标记区分：不在尺寸线上；与小数点区分：小数点是文字字符。"
confusions = ["指引线终端圆点：在零件面内，指引线连注释或序号", "点焊缝符号：圆形符号配在焊缝基准线上", "圆心点、顶点标记：不与尺寸线相连", "文字中的小数点：属于 TEXT 字符"]
related = ["DC-G4-016", "DC-G4-019", "DC-G4-021", "DC-G1-095", "DC-G7-130", "DC-G4-059"]
priority = "low"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Dot diameter not legible in the OCR (proportions refer to GB/T 4458.4); d~2d is general practice. Whether GB/T 18229-2000 图12 shows a dot as an independent terminator could not be read."
