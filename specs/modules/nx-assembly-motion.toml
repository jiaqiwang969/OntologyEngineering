[[constraints]]
id="nx_position_override_observation"
requirement="req_engineering"
module="nx_worker"
check="validate_position_observation"
rust_path="crates/oe-nx-worker/src/assembly_position.rs"
statement="v2原生位置与definition分开；每个occurrence恰好一个SDK类型/父节点记录。无覆盖保留原始definition相等检查，有覆盖须可加载且最高覆盖父为严格祖先；原v1绝不豁免。软件验收不替代原生读取、保存或独立重开。"
severity="error"
[[validations]]
id="nx_position_versioned_override_oracle"
module="nx_worker"
constraint="nx_position_override_observation"
behavior="override_is_explicitly_versioned_and_ancestor_bound"
rust_path="crates/oe-nx-worker/tests/assembly_position.rs"
oracle="原1拒绝局部位置差异；新2仅在完整本会话祖先覆盖记录成立时接受；错身份、缺失、重复、未知及无覆盖豁免均拒绝"
scope="固定软件反例；SDK执行另验"

[[constraints]]
id="nx_motion_execution_lifecycle"
requirement="req_engineering"
module="nx_worker"
check="check_pair"
rust_path="crates/oe-nx-worker/src/assembly_motion/execution.rs"
statement="每次发出的干涉查询均执行UF更新清理，失败和未知原码保留；持久记录失败不得继续查询。v2位置规划及移动后全树检查保留未选中分支，原生移动按当前姿态重算delta并明确建立覆盖；完整实体对预算先核，实际NX、保存重开和工程采用另验。"
severity="error"
[[validations]]
id="nx_motion_query_cleanup_oracle"
module="nx_worker"
constraint="nx_motion_execution_lifecycle"
behavior="issued_queries_always_cleanup_and_preserve_original_codes"
rust_path="crates/oe-nx-worker/tests/motion_execution.rs"
oracle="1/2/3及查询错误、未知结果、更新失败七组分别保留pending-returned及query-cleanup次序；接触不判清空"
scope="可控软件替身，非真实NX执行"
[[validations]]
id="nx_motion_record_failure_oracle"
module="nx_worker"
constraint="nx_motion_execution_lifecycle"
behavior="durable_record_failure_stops_work_but_never_skips_owed_cleanup"
rust_path="crates/oe-nx-worker/tests/motion_execution.rs"
oracle="pending写失败时零原生查询；returned写失败前查询已完成清理，结果仍为失败"
scope="可控软件替身，持久sink集成另验"
[[validations]]
id="nx_position_nested_override_oracle"
module="nx_worker"
constraint="nx_position_override_observation"
behavior="parent_override_does_not_exempt_unoverridden_child"
rust_path="crates/oe-nx-worker/tests/assembly_position.rs"
oracle="父移动后子继承运动正确；子独立偏移无自身覆盖时拒绝，有覆盖仍须拒绝未声明的子运动"
scope="固定软件反例；原生全树读取和保存重开另验"


