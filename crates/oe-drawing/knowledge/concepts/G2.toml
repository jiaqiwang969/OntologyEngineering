recognition = "以剖面区域的图案签名（线族数、角度、间距、点/三角/圆等元素）为锚点，对照材料符号表分类；图上若有图例框（样例+文字），优先采用图例的定义；材料名称和牌号到标题栏或明细栏查找。"
confusions = ["通用剖面线（不表示材料时）：与金属符号同形。", "点阵代替剖面线。", "金属剖面线、非金属剖面符号：属于本类中的具体符号。"]
related = ["DC-G2-019", "DC-G2-061", "DC-G2-063", "DC-G2-045", "DC-G2-046", "DC-G2-054", "DC-G2-058", "DC-G2-044"]
