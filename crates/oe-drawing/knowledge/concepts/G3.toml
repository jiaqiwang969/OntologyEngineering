[[concepts]]
id = "DC-G3-024"
name = "外螺纹画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "外螺纹在平行于轴线的视图中，牙顶（大径）画粗实线、牙底（小径）画细实线并画入倒角部分；在端视图中大径为粗实线圆，小径为约3/4圈的细实线圆，倒角圆不画。"
components = ["大径线：螺杆外轮廓的粗实线。", "小径线：大径内侧约0.075d处的细实线（小径≈0.85d），在倒角或倒圆部分也要画出。", "螺纹终止线：垂直于轴线的粗实线，横跨两条大径线之间。", "端视图：大径粗实线整圆，小径约3/4圈细实线圆弧（缺口位置不限），倒角圆省略；只表示部分螺纹时细弧再空出一段。", "局部剖视时剖面线画到大径粗实线。"]
variants = ["视图（不剖）", "局部剖视：剖面线画到大径粗实线", "端视图牙底圆约3/4圈细实线（缺口位置不限）", "只表示部分螺纹时端视图牙底圆再空出一段（图4）"]
dxf_forms = ["LINE (thick, 层01) for the crest + LINE (thin, 层02) for the root, parallel to the axis at ≈0.075d inward; the thin line runs through the chamfer toward the end face", "Thick LINE perpendicular to the axis spanning the major diameter (thread end)", "End view: thick CIRCLE + concentric thin ARC of about 270°, no chamfer circle", "Diameter DIMENSION with override text such as 'M20×1.5-6g' (the M prefix replaces %%c)", "Thread features from GstarCAD/AutoCAD Mechanical may come as an INSERT or a proxy entity; exploded they give the LINE/ARC set above (general practice)"]
recognition = "锚点一（端视图）：同心'粗整圆+细3/4圆弧'（圆心角≈250°–290°），细弧半径≈0.85×粗圆半径（细在内）→外螺纹。锚点二（非圆视图）：轴外轮廓粗实线内侧约0.075d处有平行细实线，从端部（倒角内）延伸到一条横跨大径的粗实线终止线；附近有 M/Tr/B/G 开头的标注。区分：台阶轴的双线都是粗实线且间距大；外花键线型相同，但有断面齿形、花键标记及尾部30°细线；滚花为斜交网纹；内螺纹端视图细弧在外。"
confusions = ["外花键：大径粗、小径细，靠花键标记和断面齿形区分。", "台阶轴、退刀槽的双轮廓线：两线均为粗实线。", "滚花：成片网纹。", "内螺纹端视图：粗圆在内、细弧在外。"]
related = ["DC-G3-005", "DC-G3-094", "DC-G3-093", "DC-G3-054", "DC-G3-057", "DC-G3-088", "DC-G3-089", "DC-G3-040", "DC-G3-223", "DC-G1-048", "DC-G1-049"]
priority = "high"
text_forms = ["M20-6g", "M24×1.5-6g", "M10×1-6g-LH", "Tr32×6-7e", "M16×1.5-5g6g-S"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "0.85d minor diameter is the usual drawing proportion. Layer numbers follow GB/T 14665-2012 Table 6; real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线) or CAXA layer names, so recognition should rely on linetype, lineweight and geometry rather than layer names (general practice)."
