[[concepts]]
id = "DC-G3-013"
name = "动密封圈规定画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "接近真实截面形状地画出动密封圈的唇口、弹簧和骨架等结构，主要用于产品图样、产品样本和说明书；可画在轴两侧，或一侧用规定画法、另一侧用通用画法。"
components = ["唇形截面轮廓：粗实线，表示主唇、副唇等。", "紧箍弹簧：唇口背部的小圆（弹簧截面）。", "骨架：L形或环形金属嵌件，画剖面线或涂黑；橡胶基体不画剖面线。", "配置：轴两侧对称画出，或一侧规定画法、另一侧为矩形加对角线的通用画法。"]
variants = ["轴两侧均画", "一侧规定画法另一侧通用画法"]
dxf_forms = ["Closed thick LWPOLYLINE / LINE+ARC outline of the lip profile; small CIRCLE(s) for the garter spring", "HATCH ANSI31 or SOLID fill only inside the metal case outline", "Often an INSERT from a seal library (CAXA standard parts, GstarCAD Mechanical), possibly exploded"]
recognition = "锚点：轴孔间沟槽内的唇形截面封闭轮廓，内部含一小圆（弹簧，直径约为截面宽的1/5–1/3）和一条L形窄带（骨架，有剖面线或实心填充），基体无剖面线；轴另一侧可能是同尺寸矩形加对角线。区分：普通橡胶件整截面画材料剖面符号且无弹簧小圆；滚动轴承规定画法有滚动体圆或矩形，内外圈画剖面线。"
confusions = ["普通橡胶件或垫片的剖视。", "动密封圈通用画法、特征画法。", "滚动轴承规定画法。"]
related = ["DC-G3-012", "DC-G3-109", "DC-G3-114", "DC-G3-118", "DC-G3-032"]
