recognition = "以某视图中的CIRCLE/ARC为锚点，查其对应结构在相邻视图中的投影：若该结构所在平面在相邻视图中积聚为一条与投影面成θ角（0<θ≤30°）的斜线，则真实投影应为短轴=直径×cosθ的椭圆，而图上为圆，判为本简化；若θ>30°或图中已是ELLIPSE实体，则不属本概念。区分平行于投影面的真圆：其平面在相邻视图中垂直于投射方向（θ=0）。"
