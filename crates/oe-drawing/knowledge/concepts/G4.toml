recognition = "锚点为'锥度'后紧跟+、−、±（或%%p）的短文字，位于铸件/模制件图的起模面附近，附近有'CT/2'字样。与锥度比值标注区分：此处没有锥度符号和1:n；与对称偏差±区分：±前是'锥度'二字而不是数值。"
