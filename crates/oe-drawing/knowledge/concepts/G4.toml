[[concepts]]
id = "DC-G4-099"
name = "尺寸单位的注写约定"
aliases = []
group = "G4"
kind = "text_convention"
meaning = "尺寸单位约定：线性尺寸以毫米为缺省单位时不注单位符号，采用其他单位必须注明；角度尺寸的公称值和公差必须带单位（度分秒或十进制度）；非缺省单位应在标题栏内或附近说明。"
components = ["线性尺寸：数值后不写mm，图样（含技术要求）中毫米为默认", "其他单位：数值后写出单位符号，如 cm、m、in", "角度：数值必须带 °、′、″ 或用十进制度表示", "非缺省单位说明：写在标题栏内或其附近"]
variants = ["mm without unit", "other unit with unit sign", "angles with °′″ or decimal degree"]
dxf_forms = ["DIMENSION measurement in code 42 with no unit suffix; DIMPOST may add a suffix if a non-mm unit is used", "angular DIMENSION text ending with '%%d' or the degree glyph; minutes/seconds as ' and \"", "TEXT in or near the title block such as '单位：mm' or '单位为英寸'", "$INSUNITS / $MEASUREMENT header variables indicate drawing units but are not the drawing statement"]
recognition = "全图级约定：默认把无单位的线性数值按毫米解读；检查标题栏及附近文字是否声明了其他单位，若有则全图换算。角度文字若缺少°（如被SHX字体或OCR丢失），需结合角度尺寸实体类型（dimtype 2/5）补回。DXF头变量$INSUNITS只能辅助判断，以图上声明为准。"
confusions = ["无注明单位却按英寸绘制的图：需查标题栏说明", "角度数值缺少°时被误读为长度", "比例（如1:2）不是单位"]
related = ["DC-G4-017", "DC-G4-032", "DC-G1-116", "DC-G9-028"]
priority = "high"
text_forms = ["30", "45°", "30°15′", "12.5°", "单位：mm"]
