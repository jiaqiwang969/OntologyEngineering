[[concepts]]
id = "DC-G6-063"
name = "不允许去除材料的扩展图形符号"
aliases = ["不去除材料扩展图形符号", "不去除材料表面符号"]
group = "G6"
kind = "symbol"
meaning = "在基本符号的V形内加一内切小圆的符号，表示该表面用不去除材料的方法（铸、锻、冲压、轧制、粉末冶金等）获得，或保持原供应状态/上道工序形成的状态。"
components = ["两斜边与基本符号相同，V形开口内画一个与两斜边相切的小圆。", "小圆约为短边高度处三角形的内切圆，直径约为短边竖高的2/3（≈0.9h）。", "加横线后成为完整符号（文本写NMR）；单独使用时可表示保持上道工序形成的表面，不论其是否经过去除材料。", "GB/T 131-1993：基本符号加一小圆，含义相同，也包括保持原供应状况的表面。", "区域法版本另加小菱形；ISO 21920-1草案只以完整符号“不允许去除材料”的形式出现。"]
variants = ["GB/T 131-2006 扩展图形符号 (text form NMR)", "GB/T 131-1993 基本符号加一小圆", "areal version with diamond (GB/T 33523.1)", "ISO 21920-1 draft: only as complete symbol c) 不允许去除材料"]
dxf_forms = ["INSERT of a block: 2 LINEs (+ bar) + CIRCLE tangent to both legs", "exploded LINEs + CIRCLE (radius ≈0.45h), centre on the symbol bisector above the apex", "common in the majority note near the title block of cast/forged parts: INSERT + parentheses TEXT", "proxy or anonymous block (NMR type) from mechanical add-ons"]
recognition = "锚点：基本符号两斜边；在两斜边之间找一个CIRCLE，圆心在角平分线上，圆心到两边距离≈半径（与两边相切），直径约为短边竖高的2/3。区分全周符号：全周小圆在长边上端与横线的拐角处，而非V形内部；区分几何公差全周符号（圆在指引线折弯处）和周围焊缝符号（圆在箭头线与基准线交点）；区分度数°、直径Ø等文字字符（不与60°斜边相切）。"
confusions = ["全周符号（工件轮廓各表面）：小圆在长边与横线的拐角处", "去除材料符号：开口为短横", "周围焊缝符号：圆在焊缝箭头线与基准线交点", "几何公差全周符号：圆在指引线折弯处", "度数°、直径Ø：属于文字字符"]
related = ["DC-G6-071", "DC-G6-072", "DC-G6-069", "DC-G6-070", "DC-G6-064", "DC-G6-006", "DC-G5-043", "DC-G7-106"]
priority = "medium"
text_forms = ["NMR Ra 0.8（文本中）"]
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "The circle size is derived from the symbol geometry (inscribed at short-leg height), not stated numerically in the sources."
