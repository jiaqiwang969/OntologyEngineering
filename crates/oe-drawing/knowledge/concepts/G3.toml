[[concepts]]
id = "DC-G3-158"
name = "回转副符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示一个自由度的转动副（铰链）：平面机构中以构件交点处的空心小圆表示，空间机构中以轴线穿过带竖短线的轴承小框表示。"
components = ["平面机构：两根构件粗线交于一个空心小圆（铰链），呈人字形。", "空间机构：轴线（粗线）穿过一个小横置矩形，矩形两端外侧轴线上各有一条竖短线，另一构件斜线带实心楔接在矩形上方。", "可用符号：轴线中间为一个竖立矩形（轴承座），矩形两侧的轴线上各有一条竖短线。", "2013版条号5.1.1（表2），1984版2.1.1，图形一致。"]
variants = ["平面机构", "空间机构", "可用符号"]
dxf_forms = ["Small CIRCLE on layer 01 (all pivots of one diagram share the same radius) with two LINE links ending on its circumference", "Spatial form: LINE axis + small rectangle (closed LWPOLYLINE or 4 LINEs) + two short perpendicular LINEs + SOLID wedge for the attached link", "INSERT of a revolute-pair / hinge block from a mechanism-symbol library"]
recognition = "平面回转副：锚点为空心小CIRCLE，圆周上有两根或以上直线端点（端点到圆心距离≈半径），无十字中心线，全图同类小圆半径相同。空间回转副：锚点为被粗线穿过的小矩形，矩形两端外侧有对称竖短线。与零件图中的孔区分：孔有点画线十字中心线和尺寸，周围是投影轮廓；与固定铰链区分：固定铰链小圆下有三角支座和机架斜线；与滚子从动杆区分：滚子只接一根杆并与凸轮轮廓相切。"
confusions = ["零件上的小孔或销孔投影：带十字中心线和尺寸，不与单线构件端点相接。", "滚子从动杆：滚子圆一侧接从动杆，另一侧与凸轮轮廓相切。", "滚动轴承通用画法：矩形框内为正立十字，框外无竖短线和构件斜线。", "圆柱副可用符号：横置长矩形两侧无竖短线。"]
