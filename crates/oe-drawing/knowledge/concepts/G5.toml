[[concepts]]
id = "DC-G5-057"
name = "圆跳动"
aliases = ["圆跳动符号"]
group = "G5"
kind = "symbol"
meaning = "圆跳动：跳动公差，被测回转表面绕基准轴线回转一周时，在任一测量截面上的读数变动量；按测量方向分径向、轴向、斜向和给定方向。"
components = ["特征符号：单支斜向箭头，箭杆与水平约 60°–75°，箭头在上端指向右上（开口两短线，块库中也见实心头）", "第二格：公差值（不加 Ø）；基准格：基准轴线，常为公共基准 A-B", "测量方向由指引线落点决定：圆柱面为径向；端面为轴向（GB/T 1184-1996 称端面圆跳动）；圆锥或曲面为斜向（沿法向）；另给方向时加方向要素框格"]
variants = ["径向圆跳动", "轴向圆跳动 (older name 端面圆跳动 in GB/T 1184-1996)", "斜向圆跳动", "给定方向的圆跳动 (with direction feature indicator)", "轴向圆跳动", "斜向圆跳动（测量方向沿法向）"]
dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;h} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph one inclined LINE with two short LINE (or a SOLID) arrowhead at its upper end in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ↗ (U+2197) (or MTEXT font switch {\\Fgdt;h}) inside a hand-drawn first cell"]
recognition = "锚点为第一格内一条斜线及其上端的箭头（两短线或实心三角），没有第二支箭头和底线 → 圆跳动；双箭头加底线为全跳动。框格有基准字母。指引线落点所在轮廓平行于基准轴线读径向，垂直于轴线读轴向，倾斜读斜向。指引线、尺寸线箭头和方向要素框格前的水平箭头都在框格外。"
confusions = ["全跳动（双箭头加底线）", "指引线、尺寸线箭头", "方向要素框格左侧的水平箭头（DC-G5-100）"]
related = ["DC-G5-045", "DC-G5-002", "DC-G5-100", "DC-G5-090", "DC-G5-108", "DC-G5-110"]
priority = "high"
text_forms = ["↗ 0.03 A-B", "↗ 0.02 A", "↗ 0.05 C"]
