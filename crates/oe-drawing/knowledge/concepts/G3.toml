related = ["DC-G3-215", "DC-G3-216", "DC-G3-081", "DC-G3-023"]
priority = "low"
text_forms = ["NPT3/8", "NPT3/8-LH", "NPT1/2"]
knowledge_units = ["K13", "K34"]
