# Drawing representation knowledge (图形表达知识).
#
# One card per drafting concept: what it means, which parts it is drawn with, the ways it is
# drawn (standard editions, block or loose entities, written inside a text or apart), the
# geometric relations between the parts, what it must not be confused with, and where the
# knowledge comes from. Recognition reads these cards when it runs (oe-drawing
# `representation` module); every expression a card produces names the card. Parameters are
# drawing-domain ratios (to a text height, a circle radius or an arm length), never product
# tolerances. Expert corrections named here are the source of the knowledge, not an input of
# recognition: no handle, coordinate or label of a real drawing appears in this file.
schema = "oev2.drawing-representation-knowledge/1"
profile = "dxf-expression-rules/2"

[[cards]]
id = "datum_feature_symbol"
expression_kind = "datum_symbol"
title = "基准要素符号"
meaning = "指认基准要素的符号：基准字母写在圆圈（旧版）或方框（现行）中，细实线连线把它接到贴在被测要素轮廓、其延长线或尺寸线上的终端。终端在旧版是粗短横线，在现行标准是涂黑或空白的基准三角形。符号表示“这里是基准要素”，字母本身不是基准。"
sources = [
  "GB/T 1182-2018 表4 基准要素标识（方框字母与基准三角形），引 GB/T 17851",
  "GB/T 17851-2022 基准和基准体系",
  "专家纠正 E-2026-11-06-2：旧版基准符号由粗短横线、连线、圆圈与字母构成，粗短横线不是可见轮廓",
  "专家纠正 E-2026-11-06-10：需要理解构成基准符号的要素",
]
knowledge_units = ["K24", "K25"]
recognition = "以单个大写字母为锚：字母居中于一个大小与字高相称的圆圈或方框（闭合多段线或四条直线）；一条细线一端落在边框上、向外伸出；另一端是终端——旧版为与连线垂直、连线落在其中部的粗短横线，现行为三角形。四部分齐全才成立；图块与散线同样处理。字母后带一到两位序号（如 A1）时，只有某个公差框格的基准格写着同一基准才作为基准符号。"
markers = []
concepts = ["DC-G5-009"]

[[cards.components]]
role = "datum_letter"
primitives = ["TEXT", "MTEXT"]
requirement = "一个大写拉丁字母；带一到两位序号（字母加数字）时须有公差框格的基准格写同一基准"
[[cards.components]]
role = "datum_frame"
primitives = ["CIRCLE", "LWPOLYLINE", "LINE"]
requirement = "圆圈（旧版）或方框（现行，闭合多段线或四条直线），字母中心在边框中心附近"
[[cards.components]]
role = "leader_line"
primitives = ["LINE"]
requirement = "细实线连线，一端在边框上，沿离开字母的方向伸出"
[[cards.components]]
role = "datum_terminal"
primitives = ["LINE", "LWPOLYLINE", "SOLID"]
requirement = "旧版：粗短横线，垂直于连线，连线端点在其中部；现行：基准三角形，连线端点在其顶点或底边中点"
[[cards.variants]]
id = "old_circle_bar"
title = "旧版：圆圈字母 + 连线 + 粗短横线"
distinguishing = "边框是圆，终端是与连线垂直的短线（常画在粗实线层）"
encodings = ["loose", "block"]
tests = ["datum_old_circle_bar_loose_is_one_symbol", "datum_old_circle_bar_block_is_one_symbol"]
[[cards.variants]]
id = "new_square_triangle"
title = "现行：方框字母 + 连线 + 基准三角形"
distinguishing = "边框是方框，终端是三角形"
encodings = ["loose"]
tests = ["datum_new_square_triangle_loose_is_one_symbol"]
[[cards.variants]]
id = "aligned_with_dimension_line"
title = "连线与尺寸线对齐：基准是该尺寸要素的导出要素"
distinguishing = "连线在一条尺寸线的延长线上（容差见 gdt_frame_content 的 dimension_alignment）；符号随该尺寸所在视图，而不是最近的视图"
encodings = ["block"]
tests = ["datum_block_aligned_with_a_dimension_line_takes_its_view"]
[[cards.counter_examples]]
statement = "圆圈里的字母没有连线和终端，不是基准符号（可能是视图或放大标识）"
test = "circled_letter_without_connector_is_not_a_datum"
[[cards.counter_examples]]
statement = "几何公差框格中写基准字母的格子与框格指引线箭头不是基准符号"
test = "datum_letter_cell_of_a_frame_is_not_a_datum_symbol"
[[cards.counter_examples]]
statement = "单独的粗短横线不接到带字母的边框时，不是基准终端，仍按轮廓等其他规则判断"
test = "short_thick_line_without_datum_letter_stays_outline"
[[cards.parameters]]
name = "letter_offset_max"
value = 0.75
meaning = "字母中心到边框中心的距离 ≤ 该值 × 边框半径（方框取半边长）"
[[cards.parameters]]
name = "boundary_to_text_height_min"
value = 0.6
meaning = "边框半径（半边长）≥ 该值 × 字高"
[[cards.parameters]]
name = "boundary_to_text_height_max"
value = 1.8
meaning = "边框半径（半边长）≤ 该值 × 字高"
[[cards.parameters]]
name = "connector_on_boundary"
value = 0.12
meaning = "连线端点到边框的距离 ≤ 该值 × 边框半径"
[[cards.parameters]]
name = "connector_length_max"
value = 6.0
meaning = "连线长度 ≤ 该值 × 边框半径"
[[cards.parameters]]
name = "terminal_length_min"
value = 0.9
meaning = "粗短横线长度 ≥ 该值 × 边框半径"
[[cards.parameters]]
name = "terminal_length_max"
value = 3.5
meaning = "粗短横线长度 ≤ 该值 × 边框半径"
[[cards.parameters]]
name = "terminal_mid_offset"
value = 0.25
meaning = "连线端点到粗短横线中点的距离 ≤ 该值 × 横线长度"
[[cards.parameters]]
name = "perpendicular_cos_max"
value = 0.08
meaning = "粗短横线与连线夹角余弦的绝对值上限"
[[cards.parameters]]
name = "triangle_touch"
value = 0.25
meaning = "连线端点到三角形顶点或底边中点的距离 ≤ 该值 × 边框半径"
[[cards.parameters]]
name = "triangle_aspect_max"
value = 1.6
meaning = "基准三角形最长边与最短边之比上限（细长的箭头不是基准三角形）"
[[cards.variants]]
id = "numbered_letter"
title = "带序号的基准字母（字母加一到两位数字）"
distinguishing = "边框里的字母后跟序号；同一名称写在某个公差框格的基准格里（单独、公共基准或基准体系），以框格为独立旁证"
encodings = ["loose"]
tests = ["numbered_datum_named_by_a_frame_is_a_datum"]
[[cards.variants]]
id = "line_square"
title = "方框由四条直线画成"
distinguishing = "边框是四条单独的直线围成的近似正方形，不与其他格共边"
encodings = ["loose"]
tests = ["datum_square_of_four_lines_is_one_symbol"]
[[cards.counter_examples]]
statement = "带序号的字母没有任何框格把它当基准时不作基准（基准目标的标注、分区代号也写成字母加数字）"
test = "numbered_letter_without_a_frame_is_not_a_datum"

[[cards]]
id = "center_hole_symbol"
expression_kind = "center_hole"
title = "中心孔符号与标记"
meaning = "在不需要画出中心孔形状时，用符号表示完工零件上是否保留中心孔，并用标记写出型式与尺寸（如 GB/T 4459.5-B2.5/8，旧图写作“中心孔 B4 GB145-85”，“2-”表示两端）。要求保留：在轴线端部画开口向外的 60° 折线（<）；不允许保留：折线顶点处加一短竖线；可以保留：不画符号，只引出标记。符号线不是零件轮廓。"
sources = [
  "GB/T 4459.5-1999 机械制图 中心孔表示法 第3章与表1（符号）、第4章（标记）",
  "GB/T 145 中心孔",
  "专家纠正 E-2026-11-06-3：中心孔符号被当成可见轮廓线",
]
knowledge_units = ["K39"]
recognition = "两条短直线共一个顶点，夹角约 60°；顶点在端面线与一条中心线的交点上，角平分线与中心线重合；开口朝向零件以外。附近沿轴线的细线上下写有中心孔标记时一并归入。"
markers = ["中心孔", "4459.5", "GB145", "GB/T145", "GB/T 145"]
concepts = ["DC-G3-144", "DC-G3-218", "DC-G3-003"]

[[cards.components]]
role = "symbol_glyph"
primitives = ["LINE"]
requirement = "两条等长短线组成 60° 折线，顶点在轴线与端面的交点"
[[cards.components]]
role = "note_text"
primitives = ["TEXT", "MTEXT"]
requirement = "中心孔标记：标准编号或“中心孔”字样，型式 R/A/B/C 与尺寸"
[[cards.components]]
role = "leader_line"
primitives = ["LINE"]
requirement = "沿轴线引出的细线，标记文字写在其上下"

[[cards.variants]]
id = "keep"
title = "要求保留中心孔：开口向外的 60° 折线"
distinguishing = "只有折线"
encodings = ["loose"]
tests = ["center_hole_keep_symbol_with_designation"]
[[cards.variants]]
id = "not_allowed"
title = "不允许保留中心孔：折线加顶点处短竖线"
distinguishing = "顶点外侧另有一条垂直于轴线的短线"
encodings = ["loose"]
tests = ["center_hole_not_allowed_symbol"]

[[cards.counter_examples]]
statement = "两线夹角约 60° 但顶点不在中心线上（如倒角线、锥面线），不是中心孔符号"
test = "v_lines_off_axis_are_not_a_center_hole"
[[cards.counter_examples]]
statement = "开口朝向零件内部的 60° 折线（如剖视中的钻尖锥面）不是中心孔符号"
test = "v_lines_opening_into_the_part_are_not_a_center_hole"

[[cards.parameters]]
name = "included_angle_deg"
value = 60.0
meaning = "折线两臂夹角"
[[cards.parameters]]
name = "angle_tolerance_deg"
value = 12.0
meaning = "夹角允许偏差"
[[cards.parameters]]
name = "arm_length_min"
value = 0.6
meaning = "臂长 ≥ 该值 × 图中常用字高"
[[cards.parameters]]
name = "arm_length_max"
value = 4.0
meaning = "臂长 ≤ 该值 × 图中常用字高"
[[cards.parameters]]
name = "arm_ratio_max"
value = 1.5
meaning = "两臂长度之比上限"
[[cards.parameters]]
name = "apex_tolerance"
value = 0.05
meaning = "顶点重合、顶点在中心线或端面上的距离容差 × 字高"
[[cards.parameters]]
name = "axis_cross_max"
value = 0.06
meaning = "角平分线与中心线方向叉积绝对值上限"
[[cards.parameters]]
name = "note_reach"
value = 4.0
meaning = "引出细线近端到折线远端的距离 ≤ 该值 × 臂长"
[[cards.parameters]]
name = "note_offset_max"
value = 1.8
meaning = "标记文字中心到引出细线的距离 ≤ 该值 × 字高"

[[cards]]
id = "gdt_frame_symbol"
expression_kind = "geometric_tolerance"
title = "几何公差框格与特征符号"
meaning = "几何公差写在矩形框格中：第一格是几何特征符号，第二格是公差值（可带公差带形状符号），其后各格是基准字母；框格用指引线连到被测要素。框格与符号可以是图块，也可以是炸开后的直线、圆与文字；特征符号由其笔画构成决定（如位置度＝圆加十字）。"
sources = [
  "GB/T 1182-2018 第5章符号（表2 几何特征符号）与第8章几何公差规范标注",
  "专家纠正 E-2026-11-06-7：位置度框格用散线画出时须按框格读出",
]
knowledge_units = ["K23", "K25", "K26"]
recognition = "一串等高相邻的矩形格（各格单独画出，或一个外框被贯通全高的竖线分格；外框可用多段线，也可用直线，每边可由共线的几段拼成）；第一格内只有组成特征符号的笔画（块内或散线，含实心三角形箭头），由笔画构成判定特征；第二格文字为公差值，其后为基准字母；从框格边线伸出的细线为指引线，可分几段画、段间共线重叠或略有缝隙。"
markers = []
concepts = ["DC-G5-090"]

[[cards.components]]
role = "symbol_glyph"
primitives = ["INSERT", "LINE", "CIRCLE", "LWPOLYLINE"]
requirement = "第一格内的特征符号笔画"
[[cards.components]]
role = "frame_cell"
primitives = ["LWPOLYLINE", "LINE", "INSERT"]
requirement = "等高相邻矩形格"
[[cards.components]]
role = "tolerance_value"
primitives = ["TEXT", "MTEXT"]
requirement = "第二格文字"
[[cards.components]]
role = "datum_reference"
primitives = ["TEXT", "MTEXT"]
requirement = "第三格起的基准字母"
[[cards.variants]]
id = "block_glyph"
title = "符号为图块"
distinguishing = "第一格内是一个符号图块"
encodings = ["block"]
tests = ["frame_with_block_glyph_is_read"]
[[cards.variants]]
id = "loose_glyph"
title = "符号为散线（圆、直线）"
distinguishing = "第一格内是若干未归属的直线与圆，按笔画构成判定特征"
encodings = ["loose"]
tests = ["frame_with_loose_position_glyph_is_read"]
[[cards.variants]]
id = "line_grid_font_glyph"
title = "格线为单独直线、特征符号为 GD&T 字体字母（整块框格）"
distinguishing = "一个图块中框格由共边的细直线画出（列线可贯通叠放的几行），第一格是一个字符，其字体（文字样式或行内 \\f 字体切换）名含 GD&T 字体词；字符按 gdt_characteristic 的字体字母表对应特征"
encodings = ["block"]
tests = ["frame_block_with_line_grid_and_font_glyph"]
[[cards.variants]]
id = "stacked_rows"
title = "上下叠放的几行框格"
distinguishing = "几行框格共用左右边线（GB/T 1182 允许），每行是一个完整的公差（特征、公差值、基准），各行共用框格的指引线"
encodings = ["block"]
tests = ["stacked_frame_rows_are_two_tolerances"]
[[cards.variants]]
id = "multiple_leaders"
title = "一个框格的几条指引线"
distinguishing = "指引线从框格侧边（行中线或叠放框格的行分界处）引出，可以是另一个只有指引线和箭头的图块；同一要求适用于每个被指的要素"
encodings = ["block"]
tests = ["stacked_frame_rows_are_two_tolerances"]
[[cards.counter_examples]]
statement = "一排相邻方格第一格内没有特征符号笔画（如表格、理论正确尺寸框）不是几何公差框格"
test = "cells_without_a_glyph_are_not_a_frame"
[[cards.counter_examples]]
statement = "非 GD&T 字体中的字母（如普通字体的 g）只是字母，不是特征符号；字体是必要条件"
test = "font_letter_in_an_ordinary_font_is_not_a_glyph"
[[cards.parameters]]
name = "cell_inset"
value = 0.06
meaning = "判定笔画在第一格内时向内收缩的距离 × 格高"
[[cards.parameters]]
name = "glyph_cell_aspect_max"
value = 1.4
meaning = "第一格（特征符号格）长边与短边之比上限：符号格近于正方形"
[[cards.parameters]]
name = "leader_on_border"
value = 0.12
meaning = "指引线起点到框格边线的距离上限 = 该值 × 行高"

[[cards]]
id = "tolerance_zone_modifier"
expression_kind = "geometric_tolerance"
title = "公差带形状符号 φ / Sφ"
meaning = "几何公差框格第二格中公差值前的 φ 表示公差带为圆柱形或圆形，Sφ 表示球形。它修饰公差带，不是直径尺寸里的直径符号；框格内的 φ 值不得读成直径尺寸。"
sources = [
  "GB/T 1182-2018 7.4 圆柱形或球形公差带：公差值前有“φ”则公差带为圆柱形或圆形，有“Sφ”则为球形",
  "专家纠正 E-2026-11-06-7：同轴度（位置度）里的“Φ”代表公差带是圆柱形的，不要识别成直径尺寸",
]
knowledge_units = ["K25"]
recognition = "公差值文字以 φ/Φ/Ø/⌀ 开头时给框格加“公差带：圆柱或圆形”限定；以 Sφ 开头时为球形。该文字只作框格成员。"
markers = ["Ø", "ø", "φ", "Φ", "⌀"]
concepts = ["DC-G5-088", "DC-G5-087"]
parameters = []

[[cards.components]]
role = "tolerance_value"
primitives = ["TEXT", "MTEXT"]
requirement = "以公差带形状符号开头的公差值"

[[cards.variants]]
id = "cylindrical"
title = "φ：圆柱形或圆形公差带"
distinguishing = "公差值前为 φ"
encodings = ["text"]
tests = ["phi_in_frame_value_is_a_cylindrical_zone"]
[[cards.variants]]
id = "spherical"
title = "Sφ：球形公差带"
distinguishing = "公差值前为 Sφ"
encodings = ["text"]
tests = ["sphi_in_frame_value_is_a_spherical_zone"]

[[cards.counter_examples]]
statement = "框格以外、带尺寸线和终端的 φ 文字仍是直径尺寸"
test = "phi_text_with_dimension_lines_stays_a_diameter"

[[cards]]
id = "special_characteristic_mark"
expression_kind = "dimension"
title = "尺寸前的特殊标记（☆ 等）"
meaning = "写在尺寸数值前的特殊标记（如 ☆、★）按企业规定表示关键或重要特性，属于该尺寸，须随尺寸保留。它可以写在尺寸文字里，也可以作为单独文字放在数值前方、与数值同一方向。"
sources = [
  "专家纠正 E-2026-11-06-5：线性尺寸前的特殊标记应保留",
  "专家纠正 E-2026-11-06-6：直径尺寸前的特殊标记未保留",
  "标记含义由企业标准或技术要求规定；本卡只保留标记与尺寸的归属，不判定含义",
]
knowledge_units = ["K17"]
recognition = "只含标记字符的文字，若与某个尺寸的数值文字同方向，位于其数值起点之前约一个字宽以内、且在同一行，即为该尺寸的成员；尺寸加“关键特性”限定，标签前加标记。"
markers = ["☆", "★"]
concepts = ["DC-G9-008"]

[[cards.components]]
role = "special_mark"
primitives = ["TEXT", "MTEXT"]
requirement = "只含标记字符，紧靠尺寸数值起点"

[[cards.variants]]
id = "inline"
title = "标记写在尺寸文字里"
distinguishing = "尺寸文字以标记开头"
encodings = ["text"]
tests = ["star_inside_dimension_text_is_kept"]
[[cards.variants]]
id = "standalone"
title = "标记为单独文字，放在数值前"
distinguishing = "单独文字，方向与尺寸数值相同，在数值起点前"
encodings = ["loose"]
tests = ["standalone_star_before_linear_dimension_joins_it", "standalone_star_before_rotated_diameter_text_joins_it"]

[[cards.counter_examples]]
statement = "远离任何尺寸数值或方向不一致的标记不并入尺寸"
test = "star_far_from_any_dimension_is_not_attached"

[[cards.parameters]]
name = "before_max"
value = 2.2
meaning = "标记中心到数值起点（沿阅读方向向前）的距离 ≤ 该值 × 标记字高"
[[cards.parameters]]
name = "after_max"
value = 0.6
meaning = "标记中心越过数值起点的距离 ≤ 该值 × 标记字高"
[[cards.parameters]]
name = "line_offset_max"
value = 0.8
meaning = "标记中心到数值所在行的距离 ≤ 该值 × 标记字高"
[[cards.parameters]]
name = "direction_cos_min"
value = 0.98
meaning = "标记方向与数值方向夹角余弦下限"

[[cards]]
id = "angle_unit"
expression_kind = "dimension_angle"
title = "角度数值的单位"
meaning = "角度尺寸的数值必须注写单位（°、′、″）。图上角度尺寸只写了数字时，识别后在数值后补“°”，并记录这是补写的单位、保留原文。"
sources = [
  "GB/T 4458.4-2003 尺寸注法：角度数字注写单位",
  "专家纠正 E-2026-11-06-8：任何图纸识别角度后，数值后面未加角度符号“°”时补充“°”",
]
knowledge_units = ["K17", "K20"]
recognition = "类别为角度尺寸、标签是纯数字且不含 °′″ 时，标签补“°”，限定“单位为补写”，证据保留原文。带公差或其他文字的角度不自动改写。"
markers = ["°", "′", "″"]
concepts = ["DC-G4-032"]
parameters = []

[[cards.components]]
role = "dimension_text"
primitives = ["DIMENSION", "TEXT", "MTEXT"]
requirement = "角度尺寸的数值"

[[cards.variants]]
id = "unit_missing"
title = "只写数字：补 °"
distinguishing = "纯数字"
encodings = ["text"]
tests = ["angle_without_unit_gets_a_degree_sign"]
[[cards.variants]]
id = "unit_present"
title = "已写单位：不变"
distinguishing = "含 °、′ 或 ″"
encodings = ["text"]
tests = ["angle_with_unit_is_unchanged"]

[[cards.counter_examples]]
statement = "线性尺寸的纯数字不补角度单位"
test = "linear_number_gets_no_degree_sign"

[[cards]]
id = "gdt_leader_extension"
expression_kind = "geometric_tolerance"
title = "几何公差指引线指向轮廓或其延长线"
meaning = "被测要素是组成要素时，指引线终止在要素的轮廓上或轮廓的延长线上（与尺寸线明显错开），以箭头终止。指引线不直接落在轮廓上时，箭头所在的那条细线是被测轮廓的延长线；图上没有画出延长线时，须按被测轮廓构造延长线，使指引线指向它。"
sources = [
  "GB/T 1182-2018 第6章 被测要素：二维标注中指引线终止在要素的轮廓上或轮廓的延长线上",
  "专家纠正 E-2026-11-06-9：任何几何公差的指引线不能指向被测轮廓线时，需构造被测轮廓线的延长线",
]
knowledge_units = ["K23", "K25"]
recognition = "框格指引线箭头尖端不在轮廓上时：找经过尖端、与箭头方向垂直、并与一段可见轮廓共线的细线，作为延长线并入框格；找不到画出的细线但有共线轮廓时，构造从尖端到轮廓端点的延长线并记为推断。"
markers = []
concepts = ["DC-G5-110"]

[[cards.components]]
role = "extension_line"
primitives = ["LINE"]
requirement = "经过箭头尖端、与被测轮廓共线的细线"

[[cards.variants]]
id = "drawn"
title = "延长线已画出"
distinguishing = "尖端在一条与轮廓共线的细线上"
encodings = ["loose"]
tests = ["frame_leader_to_a_drawn_extension_line"]
[[cards.variants]]
id = "constructed"
title = "未画延长线：构造"
distinguishing = "尖端落在轮廓的延长方向上，中间无线"
encodings = ["inferred"]
tests = ["frame_leader_without_extension_gets_a_constructed_one"]

[[cards.counter_examples]]
statement = "箭头直接落在轮廓上时不另加延长线"
test = "frame_leader_on_the_outline_needs_no_extension"

[[cards.parameters]]
name = "tip_tolerance"
value = 0.1
meaning = "尖端到细线端点或轮廓所在直线的距离 ≤ 该值 × 字高"
[[cards.parameters]]
name = "perpendicular_cos_max"
value = 0.1
meaning = "箭头方向与延长线夹角余弦的绝对值上限"
[[cards.parameters]]
name = "outline_gap_max"
value = 3.0
meaning = "延长线远端到轮廓端点的距离 ≤ 该值 × 字高"
[[cards.parameters]]
name = "constructed_reach_max"
value = 15.0
meaning = "构造延长线长度 ≤ 该值 × 字高"

[[cards]]
id = "section_line_region"
expression_kind = "section_hatch"
title = "剖面区域内的剖面线"
meaning = "剖面线是画在剖面区域内的等距平行细实线（通常 45°），两端止于区域边界。区域内部、与剖面线方向平行、两端落在区域边界上的直线是剖面线，即使绘图者用了粗线或轮廓图层；轮廓线是区域的边界，不在区域内部穿过。"
sources = [
  "专家纠正 E-2026-11-06-1（2026-11-06 经用户确认）：放大图中与剖面线近乎平行、从端面画到轴线的单根粗线是手画的剖面线，填充边界是沿它选出的",
  "GB/T 4457.5-2013 剖面区域的表示法",
  "GB/T 4457.5-2013 4.1（同一金属零件的剖面线间隔相等、方向相同）",
  "GB/T 17453-2005 技术制图 图样画法 剖面区域的表示法（剖面线的角度与间距）",
  "GB/T 4457.4-2002 图线（剖面线为细实线）",
  "专家纠正 E-2026-11-06-1：剖面线跟可见轮廓线识别不清，需要增加对两者区分度的理解",
]
knowledge_units = ["K12", "K03"]
recognition = "对每个填充区域取其边界与图案角度；区域内部、与图案方向平行、两端在边界上、且不沿边界的直线并入该剖面。"
markers = []
concepts = ["DC-G1-010", "DC-G2-061"]

[[cards.components]]
role = "hatch_fill"
primitives = ["HATCH", "LINE"]
requirement = "填充区域或区域内平行于图案方向的直线"

[[cards.variants]]
id = "drawn_as_line"
title = "剖面线单独画成直线（线宽不论）"
distinguishing = "在填充区域内、平行于图案方向"
encodings = ["loose"]
tests = ["thick_line_inside_hatch_parallel_to_pattern_is_a_section_line"]

[[cards.counter_examples]]
statement = "沿填充区域边界的粗线是轮廓，不是剖面线"
test = "thick_line_on_the_hatch_boundary_stays_outline"
[[cards.counter_examples]]
statement = "区域内与图案方向不平行的线不按剖面线并入"
test = "line_inside_hatch_not_parallel_to_pattern_is_not_a_section_line"

[[cards.parameters]]
name = "angle_tolerance_deg"
value = 6.0
meaning = "与图案方向的夹角容差"
[[cards.parameters]]
name = "boundary_tolerance"
value = 0.05
meaning = "端点在边界上的距离容差 × 字高"

[[cards.variants]]
id = "boundary_along_drawn_line"
title = "手画剖面线，填充边界沿它选出"
distinguishing = "线本身是填充边界、与剖面图案平行；两端处真实轮廓或轴线径直穿过（真正的结构棱线会在端点处转折）"
encodings = ["loose"]
tests = ["section_line_drawn_by_hand_on_the_hatch_boundary"]

[[cards.counter_examples]]
statement = "填充边界上与图案平行的倒角线：两端处轮廓在此转折，是可见轮廓，不是剖面线"
test = "chamfer_edge_on_the_hatch_boundary_stays_outline"

[[cards.variants]]
id = "loose_lines_by_own_spacing"
title = "一根根画出的剖面线，按自身间距成组"
distinguishing = "同一方向的细斜线，横向偏移按同一间距递进（一根剖面线可被孔或空腔截成几段），至少三档，相邻两根沿线方向互相重叠；间距与长度取自这组线本身，不按字高（放大图里间距随之放大）"
encodings = ["loose"]
tests = ["section_lines_with_enlarged_spacing_are_one_hatch", "section_lines_on_one_lattice_across_a_void_are_one_hatch"]

[[cards.variants]]
id = "remnant_stroke"
title = "剖面区域内沿图案方向的残段"
distinguishing = "填充区域内部、与图案方向平行的短线（不超过给定长度），两端都在区域内"
encodings = ["loose"]
tests = ["short_stroke_inside_a_hatch_along_its_pattern_joins_it"]

[[cards.counter_examples]]
statement = "间距不均匀的平行细斜线不按剖面线成组"
test = "parallel_lines_with_uneven_spacing_are_not_section_lines"

[[cards.counter_examples]]
statement = "填充区域内连接两段轮廓、两端都是轮廓角点的单根斜线是倒角棱线，不是剖面线（填充边界未沿倒角选取）"
test = "corner_line_inside_a_hatch_is_a_chamfer_edge"

[[cards.parameters]]
name = "parallel_deg"
value = 1.0
meaning = "散画剖面线互相平行的角度容差（度）"

[[cards.parameters]]
name = "spacing_tolerance"
value = 0.05
meaning = "相邻剖面线横向偏移之差与间距的相对容差"

[[cards.parameters]]
name = "min_lines"
value = 3.0
meaning = "按间距成组的剖面线最少档数"

[[cards.parameters]]
name = "remnant_length_max"
value = 0.5
meaning = "剖面区域内残段长度上限 = 该值 × 字高"

[[cards.parameters]]
name = "lattice_gap_max"
value = 10.0
meaning = "同一零件被孔或空腔隔开的几组散画剖面线，在同一间距网格上、彼此相距不超过该值 × 间距时合为一处剖面线"

[[cards.variants]]
id = "pattern_signature"
title = "剖面线的方向与间隔是剖面区域的特征，也是它的名称"
distinguishing = "同一金属零件的剖面线间隔相等、方向相同（GB/T 4457.5-2013 4.1；GB/T 17453-2005）：填充对象取图案定义中各线的方向与相邻线的垂直距离，一根根画出的剖面线取线本身的方向与横向偏移的中位步距；表达的名称为“视图 · 剖面线 方向° 间距 值”，CAD 存的图案名（如“用户定义”一类的厂商用词）不是名称，只留作依据；涂黑的剖面区域没有方向与间隔"
encodings = ["hatch", "loose", "block"]
tests = ["hatch_states_the_direction_and_spacing_of_its_pattern", "loose_section_lines_state_their_own_direction_and_spacing"]

[[cards.variants]]
id = "shared_boundary"
title = "两个剖面区域共用一段边界线"
distinguishing = "同一视图中两个填充区域的边界有一段重合（共线并重叠，长度不小于一个间隔）：互相记为相邻；相邻两区域是两个零件还是一个零件，按装配图知识由方向与间隔判断"
encodings = ["hatch"]
tests = ["hatch_regions_sharing_a_boundary_name_each_other"]

[[cards.counter_examples]]
statement = "同一视图中互不相接的两个剖面区域不记为相邻"
test = "separate_hatch_regions_are_not_neighbours"

[[cards.counter_examples]]
statement = "实心填充（涂黑）的剖面区域不报方向与间隔"
test = "solid_filled_section_states_no_direction"

[[cards.parameters]]
name = "shared_edge_min"
value = 1.0
meaning = "两个剖面区域共用边界的最小长度 = 该值 × 剖面线间隔（两者中较小的）"

[[cards.parameters]]
name = "shared_edge_tolerance"
value = 0.02
meaning = "判断两段边界重合的横向容差 = 该值 × 剖面线间隔"

[[cards]]
id = "detail_circle_interruption"
expression_kind = "visible_contour"
title = "被局部放大圈打断的结构线"
meaning = "局部放大图的细实线圈只标出被放大的部位，不改变零件结构。绘图者在圈处把轮廓线剪断时，圈两侧共线的两段仍是同一条结构线，按完整结构连起来；补出的部分是推断，不是来源线。"
sources = [
  "GB/T 4458.1-2002 局部放大图：用细实线圈出被放大的部位",
  "专家纠正 E-2026-11-06-4：局部放大图的细实线圈和尺寸轮廓线遮挡，造成可见轮廓线缺失（开发图上曾有同类纠正，被遮挡段补全当时延后）",
]
knowledge_units = ["K13", "K11"]
recognition = "一段轮廓的端点落在放大圈上，另一段共线轮廓在圈的另一处交点开始，两端之间的间隙在圈内：原因记为“放大圈打断”，按推断连成一条结构线。"
markers = []
concepts = ["DC-G2-075"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE"]
requirement = "圈两侧共线的轮廓段"
[[cards.components]]
role = "detail_circle"
primitives = ["CIRCLE"]
requirement = "带罗马数字的细实线圈"

[[cards.variants]]
id = "cut_at_circle"
title = "轮廓在圈处剪断"
distinguishing = "两段间隙的两端都在同一圈上"
encodings = ["loose"]
tests = ["outline_cut_by_a_detail_circle_is_one_line"]

[[cards.counter_examples]]
statement = "间隙端点不都在同一放大圈上时不按此原因连接"
test = "pieces_ending_on_different_circles_are_not_joined"

[[cards.parameters]]
name = "on_circle_tolerance"
value = 0.02
meaning = "端点到圈的距离容差 × 字高"

[[cards]]
id = "visible_edge_line"
expression_kind = "visible_contour"
title = "可见棱边线（如倒角棱线）"
meaning = "两表面的可见交线（棱边）用粗实线画出，如轴端倒角与圆柱面的交线在主视图中是连接两侧倒角角点、横跨零件的直线。它的两端都是轮廓的角点、整段在零件内；绘图者误用细线颜色或图层时，几何关系优先于颜色。被放大圈剪断的棱线按两段合起来判断。"
sources = [
  "GB/T 4457.4-2002 图线：粗实线用于可见棱边线、可见轮廓线",
  "专家纠正 E-2026-11-06-4：放大圈处可见轮廓线缺失（端面倒角棱线被当作引出线和未解释线）",
]
knowledge_units = ["K03", "K09"]
recognition = "实线（不论颜色）或其被放大圈剪断的共线几段，合起来的两个端点都是两条以上轮廓线相交的角点，且不与已有轮廓重叠：按可见轮廓读出。尺寸界线只有一端在轮廓上，不满足。"
markers = []
concepts = ["DC-G1-014", "DC-G1-015"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE"]
requirement = "两端为轮廓角点的直线（或其被放大圈剪断的几段）"

[[cards.variants]]
id = "edge_in_annotation_colour"
title = "棱线用了细线颜色"
distinguishing = "两端为轮廓角点"
encodings = ["loose"]
tests = ["chamfer_edge_line_in_thin_colour_is_visible_outline"]

[[cards.counter_examples]]
statement = "从倒角角点引出、另一端不在轮廓角点上的细线（尺寸界线）不是棱线"
test = "extension_line_from_a_chamfer_corner_stays_annotation"

[[cards.parameters]]
name = "vertex_tolerance"
value = 0.02
meaning = "端点与轮廓角点重合的距离容差 × 字高"
[[cards.parameters]]
name = "min_length"
value = 0.8
meaning = "棱线长度 ≥ 该值 × 字高"

[[cards]]
id = "line_width_evidence"
expression_kind = "visible_contour"
title = "图线粗细的本图证据"
meaning = "机械图样只用粗、细两种线宽，粗细约为 2:1。哪条线是粗线，先看本图自己的证据：实体或图层声明的线宽分成两档、粗档约为细档 2 倍时按线宽；没有线宽而按颜色出图时，与粗实线层同色的线出图为粗线，与细实线层同色的线为细线；图层约定（GB/T 14665 表 6）只在与这些证据一致时采用，各图的分层与颜色因图而异。画在表 6 细线层上却用粗线颜色的连续线，或画在粗线层上却显式改成细线颜色的连续线，由它与轮廓的连接决定：两端都接到轮廓（角点、T 形交点、相切连接）的是可见轮廓，按粗实线读；只有一端在轮廓上、另一端越过尺寸线伸出的是尺寸界线，仍是细线。按线宽为细线的连续线不作可见轮廓的候选，两端接在轮廓上时是细实线结构线。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线 4.1：机械图样采用粗、细两种线宽，比例 2:1",
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.2 图线宽度、表 2 图线颜色、表 6 图层标识",
  "GB/T 17450-1998 技术制图 图线：线宽数系",
  "GB/T 14665-2012 4.3：重合图线只画一次，可见轮廓优先于尺寸界线",
]
knowledge_units = ["K03", "K09"]
recognition = "先读线宽：实体线宽，随层时取图层线宽；有效值分成细档与不小于其给定倍数的粗档，且点画线、虚线大多在细档时，粗档的连续线是粗线（不需要结点即为轮廓），细档的连续线是细线。没有线宽时，若图层约定已核对且按颜色出图，以粗实线层的颜色为粗线颜色（不得与细实线层、点画线层同色）。细线层上的粗线颜色连续线、粗线层上的细线颜色连续线进入候选，按连接关系确认：两端都接到轮廓或已确认的此类线（未被注写使用时也可是任意两处结点）才是可见轮廓；被尺寸用作界线的线必须两端都接到轮廓。图层名和颜色本身不决定。"
markers = []
concepts = ["DC-G1-007", "DC-G1-016", "DC-G1-038", "DC-G1-043", "DC-G1-079"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC", "LWPOLYLINE", "POLYLINE"]
requirement = "连续线；粗细按本图线宽或颜色，或按两端与轮廓的连接确认"

[[cards.variants]]
id = "lineweight_classes"
title = "线宽分成粗细两档"
distinguishing = "图层或实体线宽有两档，粗档不小于细档的给定倍数；粗档连续线是轮廓线，细档连续线不是"
encodings = ["loose"]
tests = ["thick_lineweight_arc_is_outline_without_junctions", "thin_lineweight_line_is_not_a_thick_outline"]

[[cards.variants]]
id = "outline_colour_on_thin_layer"
title = "细线层上用粗线颜色画的轮廓"
distinguishing = "表 6 的 08–12 层上、颜色与粗实线层相同的连续线，两端接在轮廓上"
encodings = ["loose"]
tests = ["outline_colour_line_on_a_thin_layer_joined_at_both_ends_is_outline"]

[[cards.variants]]
id = "outline_in_thin_colour"
title = "粗线层上改成细线颜色的轮廓"
distinguishing = "粗实线层或未约定的层上显式改成细线颜色的连续线，两端接在轮廓上"
encodings = ["loose"]
tests = ["thin_colour_outline_joined_at_both_ends_is_outline"]

[[cards.variants]]
id = "thin_line_joined_at_both_ends"
title = "细线层上两端接轮廓的细实线"
distinguishing = "按约定或线宽为细实线、未被注写使用、两端都接在轮廓上（过渡线、牙底线等结构细线），不限于 02 层"
encodings = ["loose"]
tests = ["thin_layer_line_between_outline_ends_is_a_thin_structural_line"]

[[cards.variants]]
id = "default_colour_at_sheet_level"
title = "颜色为“随块”的根图线按默认颜色看待"
distinguishing = "图线不在任何图块内而颜色属性为“随块”（线型是它自己的）：没有块可随，“随块”不是一种颜色，按默认颜色显示和出图；默认颜色与粗线颜色相同时，按细线层上粗线颜色的线同样的连接条件确认是否为轮廓。全图按线宽分档时由它的线宽决定"
encodings = ["loose"]
tests = ["byblock_colour_line_joined_at_both_ends_is_outline"]

[[cards.variants]]
id = "colour_before_layer"
title = "按颜色出图时，颜色先于图层决定粗细"
distinguishing = "全图没有线宽、按颜色出图：图线自己的颜色（随层时为图层颜色，随块时为默认颜色）与粗实线层同色即为粗线，与细实线层同色即为细线，不论它画在哪一层；线型表和成员线型都按此报告"
encodings = ["loose"]
tests = ["thin_colour_line_on_the_thick_layer_is_reported_thin", "thick_colour_line_on_a_thin_layer_is_reported_thick"]

[[cards.variants]]
id = "text_layer_is_no_line_width"
title = "文本层说的是文字笔画，不是图线宽度"
distinguishing = "表 6 的文本层（细实线文本、粗实线文本）指文字的笔画：画在这些层上的图线，粗细只由本图的颜色、线宽证据或它在表达中的角色决定"
encodings = ["loose"]
tests = ["extension_line_on_the_thick_text_layer_is_thin"]

[[cards.variants]]
id = "annotation_roles_thin"
title = "尺寸线、界线、引出线等注写图线为细实线"
distinguishing = "尺寸线、尺寸界线、引出线、框格线、表格线、投射方向箭头、放大圈和螺纹细线报告为细实线；只有本图自己的线宽或出图颜色说明它画成了粗线时才报告为粗线，图层名本身不改变它"
encodings = ["loose", "native"]
tests = ["dimension_line_on_the_thick_layer_without_colour_evidence_is_thin", "dimension_line_drawn_with_the_thick_lineweight_is_reported_thick"]

[[cards.variants]]
id = "cutting_stroke_by_outline_evidence"
title = "剖切符号的短画按轮廓的证据为粗线"
distinguishing = "剖切符号的起、迄、转折短画用粗实线：按轮廓所用的同样证据（线宽分档、出图颜色、粗实线层）确认，画在细线层上而用粗线颜色的短画也报告为粗实线"
encodings = ["loose"]
tests = ["cutting_stroke_in_the_outline_colour_on_a_thin_layer_is_thick"]

[[cards.variants]]
id = "grounded_by_view_limit"
title = "两端止于视图断裂边界的轮廓"
distinguishing = "细线层上用粗线颜色画的线两端都止于视图的断裂边界（波浪线、双折线），而这条断裂边界已有确认的轮廓接在上面：视图在那里截止，这条线是被截断的轮廓，与接到轮廓上一样确认"
encodings = ["loose"]
tests = ["outline_colour_line_between_two_view_limits_is_outline"]

[[cards.counter_examples]]
statement = "细线层上用粗线颜色画的线只有一端止于断裂边界、另一端自由，不作轮廓"
test = "outline_colour_line_from_a_view_limit_to_a_free_end_is_not_outline"

[[cards.counter_examples]]
statement = "不按颜色出图（命名打印样式）时颜色不说明粗细：粗线层上的细线颜色线在线型表里仍按图层报告"
test = "colour_is_no_width_evidence_with_named_plot_styles"

[[cards.counter_examples]]
statement = "颜色随块的线只有一端接在轮廓上、另一端越过尺寸线伸出（尺寸界线），不是轮廓"
test = "byblock_colour_extension_line_stays_annotation"
[[cards.counter_examples]]
statement = "线型也是随块、颜色显式改成细线颜色的散线（炸开的标注件）仍是注写，不进入轮廓候选"
test = "exploded_piece_with_byblock_linetype_is_not_outline"

[[cards.counter_examples]]
statement = "粗线层上改成细线颜色的尺寸界线：一端在轮廓上，另一端越过尺寸线伸出，不是轮廓"
test = "thin_colour_extension_line_stays_annotation"
[[cards.counter_examples]]
statement = "细线层上用粗线颜色画的线只有一端接在轮廓上（引线、界线），不作轮廓"
test = "outline_colour_line_on_a_thin_layer_with_a_free_end_is_not_outline"
[[cards.counter_examples]]
statement = "全图线宽只有一档时，线宽不作粗细证据"
test = "one_lineweight_class_does_not_decide"

[[cards.counter_examples]]
statement = "永不打印的层上的线不属于图面表达，即使两端接在轮廓上也不按细线颜色的轮廓读出"
test = "thin_colour_arc_on_a_layer_never_plotted_is_no_evidence"

[[cards.lexicon]]
concept = "DC-G1-043"
entry = "thin_roles"
values = ["dimension_line", "extension_line", "leader_line", "frame_cell", "table_line", "view_arrow", "detail_circle", "thread_line"]
meaning = "细实线画的成员角色（GB/T 4457.4 表 1：尺寸线、尺寸界线、指引线、框格、螺纹牙底线等）：本图自己的证据不说明画成粗线时报告为细实线"

[[cards.lexicon]]
concept = "DC-G1-007"
entry = "thick_roles"
values = ["cutting_stroke"]
meaning = "粗实线画的注写成员（GB/T 4457.4 表 1 01.2：剖切符号用线）：按轮廓所用的同样证据报告为粗实线"

[[cards.parameters]]
name = "weight_ratio_min"
value = 1.5
meaning = "粗档线宽 ≥ 该值 × 细档线宽（标准粗细比 2:1，旧图约 3:1）"

[[cards]]
id = "outline_joins"
expression_kind = "visible_contour"
title = "轮廓的连接与绘图缝隙"
meaning = "可见轮廓由首尾相接的直线和圆弧组成，在角点、T 形交点和相切处连接。CAD 作图时相接两段的端点常差一点，相切连接的两段圆弧尤其如此；差距只有字高的一小部分时，出图后小于线宽，看不出缝隙，仍是连接。轮廓线止于螺孔端视图的 3/4 细实线圆弧时，是被孔打断，这一端也是连接（不是断口，也不是绘图缝隙）。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线：粗线宽度 0.5～0.7 mm，两平行线最小间隙 0.7 mm",
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.2 图线宽度",
  "GB/T 4459.1-1995 机械制图 螺纹及螺纹紧固件表示法：螺孔端视图中大径用约 3/4 圈细实线圆弧",
]
knowledge_units = ["K03", "K09"]
recognition = "轮廓候选的端点不在别的轮廓上时，在绘图缝隙（字高的给定比例）内找另一轮廓候选：直线、圆弧的任一处都可；圆弧端点同样适用，包括相切相接的两段圆弧。端点落在已识别的螺纹 3/4 细圆弧上时，按被孔打断计为结点。"
markers = []
concepts = ["DC-G1-015"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC"]
requirement = "相接的轮廓段，端点间差距不超过绘图缝隙"

[[cards.variants]]
id = "arc_to_arc_gap"
title = "相切相接的两段圆弧端点差一点"
distinguishing = "圆弧端点到另一轮廓圆弧的距离在绘图缝隙内"
encodings = ["loose"]
tests = ["arcs_meeting_within_the_drafting_gap_are_joined"]

[[cards.variants]]
id = "end_on_thread_circle"
title = "轮廓止于螺孔的 3/4 细圆"
distinguishing = "端点落在螺纹端视图的 3/4 细实线圆弧上"
encodings = ["loose"]
tests = ["outline_arc_ending_on_a_thread_circle_is_joined"]

[[cards.variants]]
id = "overshoot_past_view_limit"
title = "画过视图断裂边界一点的轮廓尾巴"
distinguishing = "轮廓线在视图断裂边界（波浪线、双折线）处被截断，却画过了边界一点：多出的尾巴不超过绘图缝隙、末端自由（出图后看不出），是同一段轮廓的绘图误差，不另作未解释段"
encodings = ["loose"]
tests = ["short_free_tail_past_a_view_limit_is_the_same_outline"]

[[cards.counter_examples]]
statement = "端点间差距超过绘图缝隙的两段不按连接处理"
test = "arcs_apart_beyond_the_drafting_gap_are_not_joined"
[[cards.counter_examples]]
statement = "画过轮廓角点的短头、长于绘图缝隙的自由短段、末端接在别的线上的尾段，都不按画过头处理"
test = "stub_past_a_corner_or_longer_tail_is_no_overshoot"

[[cards.parameters]]
name = "join_gap"
value = 0.04
meaning = "绘图缝隙 = 该值 × 字高（3.5 号字时约 0.14 mm，小于粗线宽度的一半）"

[[cards]]
id = "annotation_break"
expression_kind = "visible_contour"
title = "图线在注写处断开"
meaning = "尺寸数字、符号不得被图线穿过；轮廓线、中心线经过数字或符号（表面结构符号、基准符号、框格等）时在该处断开。尺寸线和终端（箭头）处同样让开：轮廓在尺寸线或箭头穿过处留一个小缺口，缺口两端都离穿越处不过一个箭头长。断开处两侧共线的两段仍是同一条图线，按完整结构连起来；补出的部分是推断，不是来源线。圆或圆弧被断开时沿其圆补出，但只补小缺口：缺口不大于该圆上已画出的部分、不超过约四分之一圈，且两侧都是自由端；圆角弧（与两直线相切）不补成整圆，一段圆弧也不与自己的另一端相接（只断一处的圆保留缺口，断口原因照常记明）。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法：尺寸数字不可被任何图线所通过，否则应将该图线断开",
  "GB/T 131-2006 产品几何技术规范 表面结构的表示法：符号注在轮廓线上或其延长线上",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法",
]
knowledge_units = ["K13", "K17"]
recognition = "一段轮廓的自由端与另一段共线轮廓的自由端隔一个缺口相对；缺口被注写文字（及其尺寸线、终端）覆盖，或被一个以图块画出的注写符号的笔画横穿、缺口不长于符号尺寸的给定倍数，或只被已识别尺寸的尺寸线或终端横穿（没有轮廓穿过，缺口两端到最外侧穿越处都不超过箭头长的给定倍数）时，两段是同一条线，原因记为“为注写断开”，按推断连成一条结构线。圆弧的自由端沿圆找对面另一段圆弧的自由端：缺口不超过给定圆心角、也不超过该圆已画出的圆心角之和时才连接；面对的是自己的另一端时不连接。"
markers = []
concepts = ["DC-G4-001"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC"]
requirement = "缺口两侧共线（或同圆）的同类轮廓段，相对的两端都是自由端"

[[cards.components]]
role = "dimension_line"
primitives = ["LINE", "SOLID", "DIMENSION"]
requirement = "横穿缺口的尺寸线或终端（箭头），属于已识别的尺寸"

[[cards.variants]]
id = "broken_for_symbol"
title = "轮廓在表面结构符号等处断开"
distinguishing = "缺口被图块符号的笔画横穿，缺口长度不超过符号尺寸的给定倍数"
encodings = ["block"]
tests = ["outline_broken_for_a_texture_symbol_is_one_line"]

[[cards.counter_examples]]
statement = "缺口处没有注写符号或文字时，两段不按断开连起来"
test = "gap_without_annotation_is_not_bridged"

[[cards.variants]]
id = "broken_for_dimension_line"
title = "轮廓在尺寸线、箭头穿过处断开"
distinguishing = "缺口只被已识别尺寸的尺寸线或终端横穿，两端到穿越处都不超过约一个箭头长"
encodings = ["loose", "block"]
tests = ["outline_broken_for_a_dimension_line_is_one_line"]

[[cards.variants]]
id = "circle_broken_for_text"
title = "圆在注写处断开"
distinguishing = "同圆两段圆弧的自由端隔一个被文字覆盖的小缺口相对（缺口不大于已画部分、不超过约四分之一圈）"
encodings = ["loose"]
tests = ["circle_broken_twice_for_numbers_is_one_circle"]

[[cards.counter_examples]]
statement = "被尺寸线穿过的槽口：缺口两端接在槽壁上，不是自由端，不连"
test = "slot_crossed_by_its_dimension_is_not_bridged"

[[cards.counter_examples]]
statement = "一段圆弧不与自己的另一端相接：只断一处的圆保留缺口，断口原因照常记明"
test = "arc_broken_once_keeps_its_gap"

[[cards.counter_examples]]
statement = "同圆两段圆弧之间的缺口大于已画部分或超过约四分之一圈时不补"
test = "arcs_facing_across_a_large_gap_are_not_joined"

[[cards.counter_examples]]
statement = "圆角弧（与两直线相切）有一端自由时不补成整圆"
test = "fillet_with_one_free_end_never_closes_into_a_circle"

[[cards.parameters]]
name = "gap_to_symbol_max"
value = 1.5
meaning = "缺口长度 ≤ 该值 × 符号外框对角线"

[[cards.parameters]]
name = "gap_end_to_crossing_max"
value = 1.0
meaning = "为尺寸线、终端让位的缺口：缺口每一端到最外侧穿越处的距离 ≤ 该值 × 箭头长度"

[[cards.parameters]]
name = "arc_gap_sweep_max_deg"
value = 90.0
meaning = "圆弧沿圆补出的缺口圆心角上限（度，约四分之一圈）"

[[cards.parameters]]
name = "arc_gap_to_drawn_sweep_max"
value = 1.0
meaning = "圆弧沿圆补出的缺口圆心角 ≤ 该值 × 该圆上已画出的圆心角之和"

[[cards]]
id = "hole_pattern"
expression_kind = "visible_contour"
title = "均布孔组"
meaning = "法兰、端盖等零件上均匀分布的一组相同孔，在投影为圆的视图中画成分布圆上等角距排列的等径粗实线圆，用“n×Øx”（旧式“n-Øx”，常加“均布”）注出孔数与孔径，尺寸线或指引线落在其中一个孔上。被这样的标注指到的等径圆就是孔的可见轮廓，不论画在哪个图层；同一组孔在另一圆形视图中按同样的分布再画一次时，那一组也是这些孔。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法：相同要素的尺寸注法（数量×尺寸）",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 表2（n×Ø，旧式 n-Ø）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图：圆柱形法兰上均布孔的画法",
]
knowledge_units = ["K17", "K19"]
recognition = "以“数量 + 分隔符 + Ø + 直径”的标注为锚：它的两个终端在一个直径等于标注值的圆上、位于圆心两侧，这个圆被它横跨。取该圆与离它最近的另外 n−1 个等径圆，圆心等距分布在一个分布圆上、相邻角距相等时，这 n 个圆都是孔；其余等径圆中按同一分布圆半径与角距再组成 n 个的一组，也是这些孔（另一圆形视图）。凑不成均布的一组时只认被横跨的那个圆。"
markers = []
concepts = ["DC-G3-111"]

[[cards.components]]
role = "contour_segment"
primitives = ["CIRCLE"]
requirement = "直径等于标注值的圆，被标注横跨或与被横跨的圆均布在同一分布圆上"

[[cards.variants]]
id = "count_diameter_callout"
title = "数量×孔径标注横跨的均布孔"
distinguishing = "标注的两个终端在一个等径圆上、在圆心两侧；与它均布在同一分布圆上的另外 n−1 个等径圆"
encodings = ["loose"]
tests = ["circles_named_by_a_count_diameter_callout_are_holes"]

[[cards.variants]]
id = "same_pattern_in_another_view"
title = "同一组孔在另一圆形视图中"
distinguishing = "另一处 n 个等径圆按同一分布圆半径、相同角距排列"
encodings = ["loose"]
tests = ["circles_named_by_a_count_diameter_callout_are_holes"]

[[cards.counter_examples]]
statement = "直径与标注值不等的圆不是被标注的孔"
test = "circle_of_another_diameter_is_not_a_named_hole"

[[cards.parameters]]
name = "diameter_tolerance"
value = 0.01
meaning = "圆半径与标注直径一半的相对差上限"

[[cards.parameters]]
name = "pitch_tolerance"
value = 0.01
meaning = "各孔心到分布圆圆心的距离相对差上限"

[[cards.parameters]]
name = "spacing_tolerance_deg"
value = 1.0
meaning = "相邻孔角距与 360°/n 之差上限（度）"

[[cards.parameters]]
name = "terminator_on_circle"
value = 0.05
meaning = "终端尖到圆周的距离容差 = 该值 × 字高"

[[cards]]
id = "thread_representation"
expression_kind = "thread_convention"
title = "螺纹的规定画法"
meaning = "螺纹按规定画法表示，不画真实牙型。内螺纹（螺孔）在投影为圆的视图中，小径画粗实线整圆，大径画约 3/4 圈的细实线圆弧；作图时小径常取大径的约 0.85 倍，但图上画得小些、比例在 0.55～0.70 之间的也很常见，细的约 3/4 圆弧与同心粗圆在制图中没有别的含义。横跨孔的螺纹标注是旁证；横跨孔的是普通直径尺寸时则是光孔。在平行于轴线的剖视中，小径是一对粗实线（孔的轮廓），大径是其外侧一对细实线，剖面线画到粗实线为止；有效螺纹的终点画粗实线的螺纹终止线，横跨大径。不穿通的螺孔另画钻孔：粗实线比螺纹更深，以钻孔底线和约 120° 的锥顶结束。终止线若用点画线类线型画、长度又短于出图时的第一划，打印出来就是实线。"
sources = [
  "GB/T 4459.1-1995 机械制图 螺纹及螺纹紧固件表示法 4.1、4.2",
  "机械制图（第7版）螺纹的规定画法：小径近似取大径的 0.85 倍",
]
knowledge_units = ["K13", "K34"]
recognition = "端视图：一段细实线圆弧，包角在给定范围内（约 3/4 圈），与一个整圆同心；两者半径比在常用窗口内时直接读出（现有规则）；比值低于常用窗口而不低于宽窗口下限时，弧须按本图证据为细线，且没有横跨该孔的普通直径尺寸；横跨该孔、写有螺纹标记的标注记作旁证。整圆按螺纹约定为粗实线轮廓，不论图层与颜色。剖视：一对按本图证据为细线的平行线，其内侧一对粗线关于同一中线对称、沿中线互相重叠，粗细间距比在给定范围内；中线上有孔的轴线、或细线对的一端有横跨大径的粗终止线、或剖面线边界沿粗线，三者有一即读出。粗线对比细线对更深时，为不穿通螺孔，钻孔底线与锥顶线并入。"
markers = []
concepts = ["DC-G3-005", "DC-G3-002", "DC-G3-094", "DC-G1-048", "DC-G1-049", "DC-G3-024", "DC-G3-056"]

[[cards.components]]
role = "thread_line"
primitives = ["ARC"]
requirement = "细实线圆弧，包角约 3/4 圈（大径，内螺纹）"

[[cards.components]]
role = "contour_segment"
primitives = ["CIRCLE"]
requirement = "同心的粗实线整圆（小径，内螺纹）"

[[cards.variants]]
id = "end_view_wide_ratio"
title = "端视图小径画得偏小"
distinguishing = "整圆与 3/4 细弧的半径比低于常用窗口、不低于宽窗口下限"
encodings = ["loose"]
tests = ["thread_end_view_drawn_with_a_small_minor_circle"]

[[cards.counter_examples]]
statement = "横跨该孔的是普通直径尺寸（光孔）时，比值低于常用窗口的同心弧与圆不读成螺纹"
test = "end_view_with_a_plain_diameter_across_it_is_not_a_thread"

[[cards.components]]
role = "thread_line"
primitives = ["LINE"]
requirement = "剖视中大径的一对细实线（内螺纹）"

[[cards.variants]]
id = "internal_thread_in_section"
title = "剖视中的内螺纹"
distinguishing = "细线对在外、粗线对在内，关于同一中线对称，沿中线重叠；有轴线、终止线或剖面线边界佐证"
encodings = ["loose"]
tests = ["internal_thread_in_section_is_a_thread"]

[[cards.variants]]
id = "blind_tapped_hole_in_section"
title = "剖视中的不穿通螺孔"
distinguishing = "粗线对比细线对更深，以钻孔底线和锥顶线结束"
encodings = ["loose"]
tests = ["blind_tapped_hole_in_section_with_drill_point"]

[[cards.variants]]
id = "thread_end_line_printed_solid"
title = "用点画线类线型画、短于第一划的螺纹终止线"
distinguishing = "横跨大径的短线，线长短于线型第一划乘线型比例，出图为实线"
encodings = ["loose"]
tests = ["blind_tapped_hole_in_section_with_drill_point"]

[[cards.counter_examples]]
statement = "同为粗实线的两对平行线（阶梯孔、沉孔）不是螺纹"
test = "two_thick_pairs_are_a_stepped_hole_not_a_thread"

[[cards.parameters]]
name = "end_view_ratio_min"
value = 0.70
meaning = "常用窗口下限：整圆半径 / 细弧半径（内螺纹）"

[[cards.parameters]]
name = "end_view_ratio_wide_min"
value = 0.55
meaning = "宽窗口下限：整圆半径 / 细弧半径（内螺纹）"

[[cards.parameters]]
name = "section_ratio_min"
value = 0.55
meaning = "剖视中粗线对间距 / 细线对间距（小径 / 大径）下限"

[[cards.parameters]]
name = "section_ratio_max"
value = 0.97
meaning = "剖视中粗线对间距 / 细线对间距（小径 / 大径）上限"

[[cards.parameters]]
name = "drill_point_cos_min"
value = 0.3
meaning = "钻孔锥顶线与轴线夹角余弦的下限（锥顶角约 145°）"

[[cards.parameters]]
name = "drill_point_cos_max"
value = 0.7
meaning = "钻孔锥顶线与轴线夹角余弦的上限（锥顶角约 90°；标准约 118°～120°，余弦约 0.5）"

[[cards.variants]]
id = "internal_thread_end_view"
title = "端视图：细实线 3/4 圆在粗实线圆之外是内螺纹"
distinguishing = "牙底用细实线表示（GB/T 4459.1-1995 3.1）：约 3/4 圈的细实线圆弧半径大于同心的粗实线整圆时，细弧是大径（牙底）、粗圆是小径（牙顶），即内螺纹（螺孔）；只带内螺纹画法的概念"
encodings = ["loose"]
tests = ["thread_end_view_with_the_thin_arc_outside_is_internal"]

[[cards.variants]]
id = "external_thread_end_view"
title = "端视图：细实线 3/4 圆在粗实线圆之内是外螺纹"
distinguishing = "约 3/4 圈的细实线圆弧半径小于同心的粗实线整圆时，粗圆是大径（牙顶）、细弧是小径（牙底），即外螺纹；只带外螺纹画法的概念。同一视图中内、外螺纹的端视图各自成组"
encodings = ["loose"]
tests = ["thread_end_view_with_the_thin_arc_inside_is_external"]

[[cards.variants]]
id = "thread_named_by_form"
title = "螺纹表达的名称写它是什么"
distinguishing = "名称由所在视图、内螺纹或外螺纹、端视或剖视、大径与小径组成；剖视再写通孔（大径细线两端都止于端面、没有终止线）或盲孔与螺纹深度（大径细线的长度）；图元句柄不是名称"
encodings = ["loose"]
tests = ["thread_in_section_is_named_by_form_and_sizes", "thread_end_view_with_the_thin_arc_outside_is_internal"]

[[cards.variants]]
id = "same_thread_in_two_views"
title = "同一螺纹的端视图与剖视"
distinguishing = "同一张图纸的两个视图中，端视图细实线圆弧的直径与剖视中细实线对的间距（大径）相同，且端视图圆心落在剖视螺纹的轴线上（两视图按投影关系配置），或落在指向该剖视图的剖切符号的剖切线上：两处是同一螺纹，互相记为依据。小径是约定画法（约 0.85 倍大径），两处画得不同不妨碍"
encodings = ["inferred"]
tests = ["thread_end_view_on_the_axis_of_its_section_is_the_same_thread", "thread_end_view_on_the_cutting_line_of_its_section_is_the_same_thread"]

[[cards.counter_examples]]
statement = "轴线上另一直径的螺纹端视图不是这处剖视螺纹"
test = "thread_end_view_of_another_diameter_is_not_the_same_thread"

[[cards.variants]]
id = "external_thread_in_view"
title = "图库零件上的外螺纹：粗实线大径内侧的一对细实线是牙底"
distinguishing = "牙顶（大径）画粗实线、牙底（小径）画细实线（GB/T 4459.1-1995 3.1）：标准件图块中关于它的轴线对称的一对细线在一对粗线内侧，比值在给定窗口内并沿轴线重叠，这对细线是外螺纹的牙底线；明细栏名称写有“M d×l”时核对大径与长度"
encodings = ["block"]
tests = ["screw_block_root_lines_are_thread_lines"]

[[cards.variants]]
id = "assembled_threads"
title = "旋合的内外螺纹：螺孔中的螺钉"
distinguishing = "以剖视表示内外螺纹连接时，旋合部分按外螺纹画（GB/T 4459.1-1995 3.9）：剖视中内螺纹的大径细线与标准件外螺纹的大径粗线共线、同一轴线，两者沿轴线重叠的长度是旋合长度，两处互记为旋合"
encodings = ["block", "loose"]
tests = ["screw_in_a_tapped_hole_is_engaged"]

[[cards.counter_examples]]
statement = "图块中两对都是粗线（台阶轴、销）时没有外螺纹"
test = "block_with_two_thick_pairs_has_no_external_thread"

[[cards.counter_examples]]
statement = "螺钉穿过光孔（孔是一对粗线，没有内螺纹）时不记旋合"
test = "screw_in_a_clearance_hole_is_not_engaged"

[[cards.variants]]
id = "root_inside_hatch"
title = "图上没有线宽时由剖面线认出剖视中的内螺纹"
distinguishing = "剖视中剖面线画到粗实线为止（GB/T 4459.1-1995 3.5）：关于同一中线对称、沿中线重叠的两对平行线，中线上有点画线；外侧一对两边都在同一剖面线区域内（剖面线穿过它），是牙底（大径）；内侧一对外边有剖面线、朝中线一边没有（孔），是牙顶（小径）。只在图上没有线宽证据（没有线宽分级、图层约定未经核验）时使用"
encodings = ["loose"]
tests = ["thread_in_section_without_widths_is_read_from_the_hatch"]

[[cards.counter_examples]]
statement = "外侧一对也是剖面线的边界（只一边有剖面线）的两对平行线是阶梯孔或沉孔，不是螺纹"
test = "stepped_hole_without_widths_is_not_a_thread"

[[cards.counter_examples]]
statement = "两对线之间的带状区域用另一剖面线（方向或间隔不同）或不画剖面线时是衬套、套筒等另一零件，不是螺纹"
test = "bush_hatched_apart_without_widths_is_not_a_thread"

[[cards.parameters]]
name = "hatch_probe"
value = 0.25
meaning = "判断线两侧有无剖面线的探点离线的距离 = 该值 × 牙底线与牙顶线的间距"

[[cards.parameters]]
name = "same_thread_tolerance"
value = 0.02
meaning = "同一螺纹的端视图与剖视：大径之差、圆心到轴线（或剖切线）距离的上限 = 该值 × 大径"

[[cards]]
id = "dimension_text"
expression_kind = "dimension"
title = "尺寸注写文法"
meaning = "尺寸值的书写形式：尺寸数字前后可带尺寸符号（Ø、R、C、SØ、SR）、重复要素数量（n× 或旧式 n-）、公差带代号（如 H7、k6）、极限偏差（上下叠写、±对称、零偏差）、螺纹标记（M、Tr、B 等及其公差带代号、旋向、旋合长度）、孔的旁注符号（深度 ↧、沉孔 ⌴、埋头 ⌵）和角度单位。文法说明数值是什么尺寸、带什么公差，不决定被测要素。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法 3.2、4.1.5、4.2.3、4.2.4",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 4.2.1、4.2.2、表1、表2",
  "GB/T 4458.5-2003 机械制图 尺寸公差与配合注法 4.1.1–4.1.4",
  "GB/T 1800.1-2020 公差带代号与标准公差等级 4.1.2、4.2",
  "GB/T 4459.1-1995 螺纹及螺纹紧固件表示法 4.6、附录A",
  "GB/T 197-2018 普通螺纹 公差（螺纹标记与公差带代号）",
  "机械制图（第7版）§1 尺寸数字、§7-4、§8-1、§9-5",
  "互换性与测量技术 1.3.3 公差带代号",
]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K34", "K39"]
recognition = "以尺寸表达或文字的显示文本为锚（解码 %%c、%%d、%%p 与 \\S 叠写）：开头的数字后紧跟 × 或旧式 - 再接尺寸符号或数值为数量；Ø/R/C 等前缀定尺寸类型；数值后紧跟“基本偏差字母 + 标准公差等级”为公差带代号；“上/下”成对且带符号或为 0 的为极限偏差；M、Tr、B 等前缀接直径的为螺纹标记，其后“等级数字 + 位置字母”为螺纹公差带；° ′ ″ 为角度单位。哪些符号、字母和词属于哪个概念从本卡词表读取。"
markers = ["Ø", "R", "C", "×", "±", "°", "M", "↧", "⌴", "⌵"]
concepts = ["DC-G4-017", "DC-G4-030", "DC-G4-055", "DC-G4-006", "DC-G4-041", "DC-G4-032", "DC-G4-099", "DC-G4-040", "DC-G3-091", "DC-G3-080", "DC-G4-094", "DC-G4-088", "DC-G4-114", "DC-G4-132", "DC-G4-126", "DC-G4-103", "DC-G4-113", "DC-G3-088", "DC-G3-223", "DC-G3-232", "DC-G3-089"]

[[cards.components]]
role = "size_value"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "尺寸数字，可带尺寸符号前缀"

[[cards.components]]
role = "count_prefix"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "重复要素数量 n×（旧式 n-），写在尺寸符号或数值之前"

[[cards.components]]
role = "tolerance"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "公差带代号、极限偏差（叠写或括号内）、±对称偏差"

[[cards.components]]
role = "thread_designation"
primitives = ["TEXT", "MTEXT", "DIMENSION"]
requirement = "螺纹标记：牙型代号、公称直径×螺距、公差带代号、旋合长度、旋向"

[[cards.variants]]
id = "size_symbols"
title = "尺寸符号 Ø、R、C 与倒角 a×b°"
distinguishing = "前缀决定直径、半径、倒角"
encodings = ["text", "native_dimension"]
tests = ["dimension_text_size_symbols_name_their_concepts", "native_diameter_dimension_names_its_text_concepts"]

[[cards.variants]]
id = "count_prefix"
title = "重复要素数量 n× 与旧式 n-"
distinguishing = "数量写在尺寸符号或数值之前"
encodings = ["text"]
tests = ["dimension_text_counts_old_and_new"]

[[cards.variants]]
id = "tolerance_class"
title = "公差带代号"
distinguishing = "基本偏差字母紧跟标准公差等级"
encodings = ["text"]
tests = ["dimension_text_tolerance_classes"]

[[cards.variants]]
id = "deviations"
title = "极限偏差：叠写、±、零偏差、代号加括号偏差"
distinguishing = "成对的带符号数值或 ±；也可写成数值后一上一下两段较小的单独文字"
encodings = ["text", "stacked_mtext", "separate_texts"]
tests = ["dimension_text_deviations_stacked_symmetric_and_zero", "stacked_mtext_deviation_dimension_names_deviation_concepts", "deviations_written_as_two_small_texts_join_the_value"]

[[cards.variants]]
id = "thread_designation"
title = "螺纹标记及螺纹公差带"
distinguishing = "牙型代号接直径，等级数字在前、位置字母在后；统一螺纹也写作英寸尺寸加每英寸牙数"
encodings = ["text"]
tests = ["dimension_text_thread_designations", "inch_thread_designation_is_a_thread"]

[[cards.variants]]
id = "hole_callout"
title = "孔的旁注：深度、沉孔、埋头"
distinguishing = "尺寸后接 ↧、⌴、⌵ 或“深”"
encodings = ["text"]
tests = ["dimension_text_hole_callouts"]

[[cards.variants]]
id = "angle_units"
title = "角度与单位"
distinguishing = "° ′ ″ 必须写出；线性尺寸缺省为毫米"
encodings = ["text"]
tests = ["dimension_text_angles_and_units"]

[[cards.variants]]
id = "fragments_in_reading_order"
title = "分段写出的数值按阅读顺序拼接"
distinguishing = "尺寸的数值分几段文字写出时，按阅读顺序拼接：先上行后下行，行内沿文字方向从前到后，不按文件里存放的先后；单独成段的尺寸符号（Ø、R、S、□ 等）是其后数字的前缀，紧接不空格"
encodings = ["native_dimension"]
tests = ["value_fragments_join_in_reading_order"]

[[cards.counter_examples]]
statement = "数字后面单独成段的单位或符号（如 °）仍在数字之后，不移到前面"
test = "unit_fragment_after_the_number_stays_after_it"

[[cards.counter_examples]]
statement = "中心孔标记 B4（无 × 螺距）不是锯齿形螺纹"
test = "center_hole_mark_is_not_a_buttress_thread"

[[cards.counter_examples]]
statement = "一般公差标准号 GB/T 1804-m 中的 m 不是公差带代号"
test = "general_tolerance_reference_is_not_a_tolerance_class"

[[cards.counter_examples]]
statement = "表面结构参数 Ra 不是半径 R"
test = "roughness_parameter_is_not_a_radius"

