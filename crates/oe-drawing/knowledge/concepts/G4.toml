[[concepts]]
id = "DC-G4-156"
name = "量规工作尺寸按工艺尺寸标注"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "光滑极限量规工作图上的工作尺寸按工艺尺寸标注：塞规以其上极限尺寸为基本值、只注负的单向偏差，卡规以其下极限尺寸为基本值、只注正的单向偏差（偏差均为量规制造公差，偏向材料内）。"
components = ["塞规（通规/止规）：最大极限尺寸 + 0/−T 偏差，如 Ø30.0067 0/−0.0034", "卡规（通规/止规）：最小极限尺寸 + (+T)/0 偏差，如 29.9733 +0.0034/0", "图名或说明：常注被检尺寸及公差带（如 检验Ø30H8Ⓔ孔）", "量规代号T（通）、Z（止）等是名称，不是图形符号"]
variants = ["塞规：最大极限尺寸+负偏差", "卡规：最小极限尺寸+正偏差"]
dxf_forms = ["DIMENSION override with four-decimal value and one-sided stacked deviation, e.g. '%%c30.0067\\S0^-0.0034;'", "TEXT labels '通端'/'止端' or 'T'/'Z' near each measuring end"]
recognition = "锚点：带4位小数的尺寸值，配单向偏差（一侧为0），且偏差量级为几微米（0.001–0.01）；图名或标题中有“量规”“塞规”“卡规”。塞规为外圆柱测量面、偏差为负；卡规为两平行测量面、偏差为正。与普通极限偏差区分：普通零件尺寸很少用4位小数和单向微米级偏差。"
confusions = ["普通极限偏差注法", "公差带代号与偏差同注", "量规名称代号T、Z（非尺寸）"]
related = ["DC-G4-132", "DC-G4-103", "DC-G4-113"]
priority = "rare"
text_forms = ["Ø30.0067 0/-0.0034", "Ø30.033 0/-0.0034", "29.9733 +0.0034/0", "29.947 +0.0034/0"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From the interchangeability book 例5.1 (5)(6), 图5.7/图5.8; values read from OCR. Deviations written upper/lower with '/'. DXF forms are general practice."
