name = "预先印制图纸的旋转使用"
aliases = []
group = "G1"
kind = "sheet_element"
meaning = "为利用预先印制的图纸，允许把 X 型图纸短边水平（竖放）或把 Y 型图纸长边水平（横放）使用；此时标题栏位于右上角，并在下边对中符号处画方向符号。"
components = ["X 型图纸竖放，或 Y 型图纸横放。", "标题栏随之位于图纸右上角。", "下边对中符号处画方向符号，指明看图方向。", "预先印制图纸一般具有图框、标题栏和对中符号三项；剪切符号、分区、参考分度等按需。"]
variants = ["X形图纸竖放（图6）", "Y形图纸横放（图7）", "pre-printed sheets carry at least frame, title block and centring marks; other marks optional"]
dxf_forms = ["frame block with the title block rotated 90° (INSERT rotation 90/270 or vertical title-block text)", "usually part of a frame/title-block INSERT (block names like A3, A4-H, TK, 图框, GB_A3; CAXA 图幅 exported as a BLOCK) or drawn in a paper-space layout; may be scaled by the drawing scale in model space"]
