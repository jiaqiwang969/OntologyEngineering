[[concepts]]
id = "DC-G3-174"
name = "机构简图轴承符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示轴承的符号：向心轴承（滑动、滚动）、推力轴承（单向、双向、滚动）和向心推力轴承（单向、双向、滚动），必要时可注明轴承型号。"
components = ["向心滑动轴承：粗轴线一侧上下各有一个开口朝向轴线的“凵/冂”形短框，夹住轴线。", "推力滑动轴承：一条竖线横跨轴线，其一侧（单向）或两侧（双向）贴靠拐角形短框，表示承受轴向力。", "向心推力滑动轴承：竖线与“凵/冂”框组合在轴线的拐角处，单向一侧、双向两侧。", "滚动轴承：轴线穿过一个竖长小矩形，矩形内上下各有短线；短线平行于轴为向心、垂直于轴为推力、倾斜为向心推力。", "可用符号（滚动）：在轴线旁画带保持框的小圆（滚珠），排列方向同样区分向心、推力和向心推力。", "1984 版把滑动轴承称为“普通轴承”；2013 版 12.8 与 1984 版 A.8 图形一致。"]
variants = ["向心轴承：滑动（1984称普通轴承）、滚动", "推力轴承：单向、双向、滚动", "向心推力轴承：单向、双向、滚动"]
dxf_forms = ["Exploded LINE/LWPOLYLINE strokes on layer 01 around a thick shaft LINE (2d-wide LWPOLYLINE in 2013 style)", "Rolling form: small LWPOLYLINE rectangle crossed by the shaft with short inner LINEs; alternative small CIRCLEs with bracket strokes", "Optional TEXT of the bearing designation on layer 11 beside the symbol", "INSERT of a transmission-diagram library block"]
recognition = "锚点：单线粗轴线上贴着的成对小“凵/冂”框，或被轴线贯穿的竖长小矩形，其高度约为轴线两侧各一个框的宽度。矩形内短线方向判别载荷方向：平行轴线→向心；垂直轴线→推力；倾斜→向心推力。旁边若有 6208、30207 等数字代号即为轴承型号。与装配图滚动轴承通用画法区分：后者按轴承实际截面尺寸画矩形线框并在轴的两侧对称、内画正立十字，且周围是真实零件轮廓；与回转副区分：回转副是两杆交汇处的小圆或穿轴的矩形加短竖线，不夹在轴线两侧成对出现。"
confusions = ["滚动轴承通用画法、特征画法（装配图）：按实际尺寸画在轴截面两侧，周围有壳体和轴的投影轮廓。", "回转副符号：两杆交汇处的小圆，或空间机构中带短竖线的矩形。", "联轴器符号：两条对置短竖线位于两根同轴轴线之间，而非夹住一根轴。"]
related = ["DC-G3-121", "DC-G3-119", "DC-G3-188", "DC-G3-158", "DC-G3-225"]
priority = "low"
