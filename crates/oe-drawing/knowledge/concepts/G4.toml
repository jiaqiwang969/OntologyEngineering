[[concepts]]
id = "DC-G4-049"
name = "标准锥度系列号标注（莫氏锥度）"
aliases = []
group = "G4"
kind = "dimension_symbol"
meaning = "当圆锥锥度属于标准系列（尤其是莫氏锥度或米制/公制锥度）时，不写锥度比值，而在锥度符号后的基准线上写标准系列名称和编号（如Morse No.3、莫氏锥度No.1），代表相应的标准锥度。"
components = ["锥度符号▷：配置在基准线上，方向与圆锥方向一致。", "系列标记：符号后写系列名与编号，替代比值（例如1:20.047可写作莫氏锥度No.1）。", "基准线与指引线：基准线平行于圆锥轴线，用指引线连到圆锥轮廓素线。", "版本：GB/T 15754-1995图10（引用工具柄圆锥标准）与GB/T 15754-2025图9（引用锥度与锥角系列标准）规则一致。"]
variants = ["Morse", "metric taper"]
dxf_forms = ["LEADER/MULTILEADER + MTEXT '{\\Fgdt;y}Morse No.3' (gdt.shx 'y' = conical taper) or a taper-symbol INSERT followed by text", "exploded: closed triangle (3 LINE or closed LWPOLYLINE) + TEXT '莫氏锥度No.3' on a reference LINE parallel to the cone axis", "layer 08/09 or template dimension layer"]
recognition = "锚点为文字匹配“Morse|莫氏|Metric|米制|公制”加“No.数字”，位于与圆锥轴线平行的基准线上，前有锥度三角符号；指引线落在关于一条细点画线对称的两条收敛直线（锥形轮廓）上。排除：螺纹标记以M、Tr、G、Rc等开头并带螺距或公差；零件编号/图号位于明细栏、标题栏或序号旁。"
confusions = ["螺纹标记：以M、Tr、G、Rc等开头，后有螺距或公差带，不带No.。", "零件号或图号：在明细栏/标题栏中，不在锥形轮廓旁。", "锥度比值注法：▷1:20等直接给出数值。"]
related = ["DC-G4-057", "DC-G4-011", "DC-G1-018", "DC-G1-059"]
priority = "low"
text_forms = ["Morse No.3", "莫氏锥度 No.1", "莫氏No.4", "Metric No.80"]
