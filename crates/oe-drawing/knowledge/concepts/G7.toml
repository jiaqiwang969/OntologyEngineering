components = ["边状态符号：不指向具体边，独立放在视图旁或标题栏附近。", "外部边/内部边限定：引线末端连一个表示外角（凸角）或内角（凹角）的小折线图示。", "附加边状态：右侧可用圆括号列出图中其他位置使用的边状态。"]
