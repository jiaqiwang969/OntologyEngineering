[[concepts]]
id = "DC-G6-045"
name = "表面结构代号"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "在完整符号上注写参数代号、数值和必要补充要求后形成的整体称为表面结构代号，是图上表达某一表面质量要求的完整单元。"
components = ["符号部分：三种完整符号之一，决定工艺类别（任意、去除材料、不去除材料）。", "要求部分：横线下方的参数代号与极限值（如Ra 3.2），可带传输带、取样长度个数、max、U/L。", "补充部分：横线上方的加工方法，V形旁的纹理符号和加工余量等。", "常见例：Ra 0.8（不去除材料）、Rzmax 0.2、0.008-0.8/Ra 3.2、-0.8/Ra3 3.2、U Ramax 3.2与L Ra 0.8两行。"]
variants = []
dxf_forms = ["INSERT (symbol block) + ATTRIB value(s) = one code", "INSERT or exploded LINEs + nearby TEXT entities that must be grouped by position relative to the bar", "proxy entity from a mechanical add-on carrying all fields in its proxy graphics", "codes repeated near the title block in simplified notes (INSERT + TEXT '(' ')')"]
recognition = "先识别符号（见基本、完整符号卡），再收集横线下方、上方及V形左右的文字，按位置合成一个代号对象。文字应符合表面结构词法：R/W/P开头的参数代号+空格+数值，或1993版单独数值；数值应在GB/T 1031系列内（Ra 0.012–100，Rz 0.025–1600 μm）。区分尺寸数字（属于尺寸线或DIMENSION，附近无V形符号）和几何公差值（在框格内）。"
confusions = ["尺寸数字：附着于尺寸线，常带Ø、R、公差", "几何公差值：位于框格内，常带Ø和基准字母", "半径尺寸R0.8：R后无小写字母，属于尺寸"]
related = ["DC-G6-069", "DC-G6-046", "DC-G6-075", "DC-G6-025", "DC-G6-013", "DC-G6-030", "DC-G6-021", "DC-G6-073", "DC-G4-017"]
priority = "high"
text_forms = ["Ra 3.2", "Rz 6.3", "Rzmax 0.2", "0.008-0.8/Ra 3.2", "-0.8/Ra3 3.2", "U Ramax 3.2 / L Ra 0.8"]
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
