knowledge_units = ["K13", "K37"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Shapes read from page images of both editions; the 2013 OCR garbles item g) and lists 扇形齿轮传动 under 8.2.5. Whether end-view circles are thick or dash-dot differs between items in the figures; recognition should accept both. DXF forms are general CAD practice."
