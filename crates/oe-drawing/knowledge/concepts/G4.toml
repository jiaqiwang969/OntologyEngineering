[[concepts]]
id = "DC-G4-011"
name = "圆锥尺寸注法（特征参数组合）"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "圆锥按功能要求（连接、定心、密封等）从特征参数中选一组必要尺寸组合标注：锥度 C 或圆锥角 α、大端直径 D、小端直径 d、给定截面直径、圆锥长度 L、总长 L′、截面定位长度 Lx；多余尺寸只作参考加括号。"
components = ["锥度 C：优先写成 1:5 或 1/5，可选 0.2:1 或 20%，与锥度图形符号一起标在平行于轴线的基准线上", "圆锥角 α：优先 35°，可选 0.6 rad；α/2 等附加尺寸可按参考尺寸加括号", "直径与长度：D、d、给定截面直径（1995版记 dx，2025版记 Dx）注在非圆视图；L、L′、Lx 为轴向线性尺寸", "典型组合：1995版图1–图4、2025版图4–图7各给出常用组合（如 D+L+C、Dx+Lx+C 等）", "2025版：某些圆锥尺寸可定义为理论正确尺寸（加框），用于建立几何规范"]
variants = ["taper as 1:5 (preferred), 1/5, 0.2:1, 20%", "angle as 35° or 0.6 rad", "typical combinations 1–4", "2025: some dimensions as TEDs"]
dxf_forms = ["DIMENSION dimtype 0 with '%%c<>' across the cone generators for D / d / Dx; DIMENSION dimtype 2 or 5 for α between the two generator LINEs", "taper indication: LEADER/MULTILEADER + horizontal reference line parallel to the axis + taper symbol (block, exploded LINE/SOLID, or gdt.shx 'y') + TEXT '1:5'", "auxiliary values as TEXT '(…)' in parentheses", "2025 edition: DIMENSION with DIMGAP<0 (boxed TED) for selected cone dimensions"]
recognition = "锚点为一对关于中心线（05层点画线）对称、互不平行的轮廓直线（圆锥的转向轮廓），其夹角即圆锥角。围绕它收集：两端或给定截面处的 Ø 尺寸、轴向长度尺寸、跨两母线的角度尺寸、锥度标注（引线+平行轴线的基准线+符号+比值）。用 C=(D−d)/L 与 α=2·atan(C/2) 校核数值是否自洽，判定哪些是必要尺寸、哪些是括号参考尺寸。与楔体区分：楔体不是回转体（无中心线对称、无 Ø），用楔体比率或斜度；与倒角区分：倒角锥段很短，用 C 或长度+角度标注。"
confusions = ["楔体尺寸：非回转，用楔体比率、楔体角或斜度，无直径符号", "倒角：很短的锥段，用 C 或长度×角度标注", "锥螺纹：有螺纹线和螺纹标记", "中心孔：有中心孔标记，锥角固定"]
related = ["DC-G4-057", "DC-G4-049", "DC-G4-028", "DC-G4-009", "DC-G4-029", "DC-G4-121", "DC-G4-065"]
priority = "medium"
text_forms = ["1:5", "1/5", "0.2:1", "20%", "35°", "0.6 rad", "Ø30 / L=40 / 1:5（组合）"]
