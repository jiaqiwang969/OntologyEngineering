meaning = "用一个剖切平面剖开机件后分别向两个相反方向投射，得到两个剖视图；剖切符号两端画方向相反的箭头并各注不同字母，对应两个名称（如A—A、B—B）。"
components = ["剖切位置：一条直线，两端粗短画共线。", "两组箭头：方向相反，各配一个字母。", "两个剖视图：分别标“A—A”“B—B”，剖面区域轮廓互为镜像，所见剖切面后结构不同。"]
