dxf_forms = ["View geometry simply missing for the inclined portion; boundary often a thin SPLINE wavy line on layer 02", "Auxiliary view elsewhere: projection arrow (LEADER or SOLID arrowhead + LINE) with letter TEXT, and the same letter TEXT above the auxiliary view"]
recognition = "以斜视图标注为锚点（带字母的投射箭头，方向垂直于某斜面，另有同字母的视图名称）。回到原基本视图检查该斜面区域：若对应结构只画了一部分、以波浪线收边或完全缺失，而斜视图中有完整实形及尺寸，即判为本省略，不应报漏线。区分漏画：没有斜视图或其他视图表达该实形；区分局部视图：局部视图本身就是部分视图，本概念指基本视图中省去倾斜部分。"
confusions = ["漏线或图形不完整：缺少另行表达实形的视图。", "局部视图：本身只画局部。", "断开画法：用于长件缩短，断口两侧形状连续。"]
