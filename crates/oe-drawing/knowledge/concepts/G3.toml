recognition = "锚点为密封位置的矩形粗线框，框内有一条从一边伸出、末端带横梁的T形折线，和一条U形开口折线，T的横梁位于U的开口内而不相交。区分：花键/齿形是沿长度或圆周多次重复的齿廓且有剖面线；焊缝符号附在指引线基准线上；零件上的环槽是零件轮廓的一部分，不在独立小框内。"
confusions = ["齿形、花键：多次重复的齿廓，不在小矩形框内。", "焊缝符号（I/U形坡口）：附在指引线基准线上，不在密封框中。", "零件环槽：属于零件轮廓并带剖面线。"]
related = ["DC-G3-204", "DC-G3-109", "DC-G3-118", "DC-G3-013"]
