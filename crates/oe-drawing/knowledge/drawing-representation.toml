[[cards.parameters]]
name = "perpendicular_cos_max"
value = 0.1
meaning = "箭头方向与延长线夹角余弦的绝对值上限"
[[cards.parameters]]
name = "outline_gap_max"
value = 3.0
meaning = "延长线远端到轮廓端点的距离 ≤ 该值 × 字高"
[[cards.parameters]]
name = "constructed_reach_max"
value = 15.0
meaning = "构造延长线长度 ≤ 该值 × 字高"

[[cards]]
id = "section_line_region"
expression_kind = "section_hatch"
title = "剖面区域内的剖面线"
meaning = "剖面线是画在剖面区域内的等距平行细实线（通常 45°），两端止于区域边界。区域内部、与剖面线方向平行、两端落在区域边界上的直线是剖面线，即使绘图者用了粗线或轮廓图层；轮廓线是区域的边界，不在区域内部穿过。"
sources = [
  "专家纠正 E-2026-11-06-1（2026-11-06 经用户确认）：放大图中与剖面线近乎平行、从端面画到轴线的单根粗线是手画的剖面线，填充边界是沿它选出的",
  "GB/T 4457.5-2013 剖面区域的表示法",
  "GB/T 4457.4-2002 图线（剖面线为细实线）",
  "专家纠正 E-2026-11-06-1：剖面线跟可见轮廓线识别不清，需要增加对两者区分度的理解",
]
knowledge_units = ["K12", "K03"]
recognition = "对每个填充区域取其边界与图案角度；区域内部、与图案方向平行、两端在边界上、且不沿边界的直线并入该剖面。"
markers = []
concepts = ["DC-G1-010", "DC-G2-061"]

[[cards.components]]
role = "hatch_fill"
primitives = ["HATCH", "LINE"]
requirement = "填充区域或区域内平行于图案方向的直线"

[[cards.variants]]
id = "drawn_as_line"
title = "剖面线单独画成直线（线宽不论）"
distinguishing = "在填充区域内、平行于图案方向"
encodings = ["loose"]
tests = ["thick_line_inside_hatch_parallel_to_pattern_is_a_section_line"]

[[cards.counter_examples]]
statement = "沿填充区域边界的粗线是轮廓，不是剖面线"
test = "thick_line_on_the_hatch_boundary_stays_outline"
[[cards.counter_examples]]
statement = "区域内与图案方向不平行的线不按剖面线并入"
test = "line_inside_hatch_not_parallel_to_pattern_is_not_a_section_line"

[[cards.parameters]]
name = "angle_tolerance_deg"
value = 6.0
meaning = "与图案方向的夹角容差"
[[cards.parameters]]
name = "boundary_tolerance"
value = 0.05
meaning = "端点在边界上的距离容差 × 字高"

[[cards.variants]]
id = "boundary_along_drawn_line"
title = "手画剖面线，填充边界沿它选出"
distinguishing = "线本身是填充边界、与剖面图案平行；两端处真实轮廓或轴线径直穿过（真正的结构棱线会在端点处转折）"
encodings = ["loose"]
tests = ["section_line_drawn_by_hand_on_the_hatch_boundary"]

[[cards.counter_examples]]
statement = "填充边界上与图案平行的倒角线：两端处轮廓在此转折，是可见轮廓，不是剖面线"
test = "chamfer_edge_on_the_hatch_boundary_stays_outline"

[[cards.variants]]
id = "loose_lines_by_own_spacing"
title = "一根根画出的剖面线，按自身间距成组"
distinguishing = "同一方向的细斜线，横向偏移按同一间距递进（一根剖面线可被孔或空腔截成几段），至少三档，相邻两根沿线方向互相重叠；间距与长度取自这组线本身，不按字高（放大图里间距随之放大）"
encodings = ["loose"]
tests = ["section_lines_with_enlarged_spacing_are_one_hatch"]

[[cards.variants]]
id = "remnant_stroke"
title = "剖面区域内沿图案方向的残段"
distinguishing = "填充区域内部、与图案方向平行的短线（不超过给定长度），两端都在区域内"
encodings = ["loose"]
tests = ["short_stroke_inside_a_hatch_along_its_pattern_joins_it"]

[[cards.counter_examples]]
statement = "间距不均匀的平行细斜线不按剖面线成组"
test = "parallel_lines_with_uneven_spacing_are_not_section_lines"

[[cards.counter_examples]]
statement = "填充区域内连接两段轮廓、两端都是轮廓角点的单根斜线是倒角棱线，不是剖面线（填充边界未沿倒角选取）"
test = "corner_line_inside_a_hatch_is_a_chamfer_edge"

[[cards.parameters]]
name = "parallel_deg"
value = 1.0
meaning = "散画剖面线互相平行的角度容差（度）"

[[cards.parameters]]
name = "spacing_tolerance"
value = 0.05
meaning = "相邻剖面线横向偏移之差与间距的相对容差"

[[cards.parameters]]
name = "min_lines"
value = 3.0
meaning = "按间距成组的剖面线最少档数"

[[cards.parameters]]
name = "remnant_length_max"
value = 0.5
meaning = "剖面区域内残段长度上限 = 该值 × 字高"

[[cards]]
id = "detail_circle_interruption"
expression_kind = "visible_contour"
title = "被局部放大圈打断的结构线"
meaning = "局部放大图的细实线圈只标出被放大的部位，不改变零件结构。绘图者在圈处把轮廓线剪断时，圈两侧共线的两段仍是同一条结构线，按完整结构连起来；补出的部分是推断，不是来源线。"
sources = [
  "GB/T 4458.1-2002 局部放大图：用细实线圈出被放大的部位",
  "专家纠正 E-2026-11-06-4：局部放大图的细实线圈和尺寸轮廓线遮挡，造成可见轮廓线缺失（开发图上曾有同类纠正，被遮挡段补全当时延后）",
]
knowledge_units = ["K13", "K11"]
recognition = "一段轮廓的端点落在放大圈上，另一段共线轮廓在圈的另一处交点开始，两端之间的间隙在圈内：原因记为“放大圈打断”，按推断连成一条结构线。"
markers = []
concepts = ["DC-G2-075"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE"]
requirement = "圈两侧共线的轮廓段"
[[cards.components]]
role = "detail_circle"
primitives = ["CIRCLE"]
requirement = "带罗马数字的细实线圈"

[[cards.variants]]
id = "cut_at_circle"
title = "轮廓在圈处剪断"
distinguishing = "两段间隙的两端都在同一圈上"
encodings = ["loose"]
tests = ["outline_cut_by_a_detail_circle_is_one_line"]

[[cards.counter_examples]]
statement = "间隙端点不都在同一放大圈上时不按此原因连接"
test = "pieces_ending_on_different_circles_are_not_joined"

[[cards.parameters]]
name = "on_circle_tolerance"
value = 0.02
meaning = "端点到圈的距离容差 × 字高"

[[cards]]
id = "visible_edge_line"
expression_kind = "visible_contour"
title = "可见棱边线（如倒角棱线）"
meaning = "两表面的可见交线（棱边）用粗实线画出，如轴端倒角与圆柱面的交线在主视图中是连接两侧倒角角点、横跨零件的直线。它的两端都是轮廓的角点、整段在零件内；绘图者误用细线颜色或图层时，几何关系优先于颜色。被放大圈剪断的棱线按两段合起来判断。"
sources = [
  "GB/T 4457.4-2002 图线：粗实线用于可见棱边线、可见轮廓线",
  "专家纠正 E-2026-11-06-4：放大圈处可见轮廓线缺失（端面倒角棱线被当作引出线和未解释线）",
]
knowledge_units = ["K03", "K09"]
recognition = "实线（不论颜色）或其被放大圈剪断的共线几段，合起来的两个端点都是两条以上轮廓线相交的角点，且不与已有轮廓重叠：按可见轮廓读出。尺寸界线只有一端在轮廓上，不满足。"
markers = []
concepts = ["DC-G1-014", "DC-G1-015"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE"]
requirement = "两端为轮廓角点的直线（或其被放大圈剪断的几段）"

[[cards.variants]]
id = "edge_in_annotation_colour"
title = "棱线用了细线颜色"
distinguishing = "两端为轮廓角点"
encodings = ["loose"]
tests = ["chamfer_edge_line_in_thin_colour_is_visible_outline"]

[[cards.counter_examples]]
statement = "从倒角角点引出、另一端不在轮廓角点上的细线（尺寸界线）不是棱线"
test = "extension_line_from_a_chamfer_corner_stays_annotation"

[[cards.parameters]]
name = "vertex_tolerance"
value = 0.02
meaning = "端点与轮廓角点重合的距离容差 × 字高"
[[cards.parameters]]
name = "min_length"
value = 0.8
meaning = "棱线长度 ≥ 该值 × 字高"

[[cards]]
id = "line_width_evidence"
expression_kind = "visible_contour"
title = "图线粗细的本图证据"
meaning = "机械图样只用粗、细两种线宽，粗细约为 2:1。哪条线是粗线，先看本图自己的证据：实体或图层声明的线宽分成两档、粗档约为细档 2 倍时按线宽；没有线宽而按颜色出图时，与粗实线层同色的线出图为粗线，与细实线层同色的线为细线；图层约定（GB/T 14665 表 6）只在与这些证据一致时采用，各图的分层与颜色因图而异。画在表 6 细线层上却用粗线颜色的连续线，或画在粗线层上却显式改成细线颜色的连续线，由它与轮廓的连接决定：两端都接到轮廓（角点、T 形交点、相切连接）的是可见轮廓，按粗实线读；只有一端在轮廓上、另一端越过尺寸线伸出的是尺寸界线，仍是细线。按线宽为细线的连续线不作可见轮廓的候选，两端接在轮廓上时是细实线结构线。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线 4.1：机械图样采用粗、细两种线宽，比例 2:1",
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.2 图线宽度、表 2 图线颜色、表 6 图层标识",
  "GB/T 17450-1998 技术制图 图线：线宽数系",
  "GB/T 14665-2012 4.3：重合图线只画一次，可见轮廓优先于尺寸界线",
]
knowledge_units = ["K03", "K09"]
recognition = "先读线宽：实体线宽，随层时取图层线宽；有效值分成细档与不小于其给定倍数的粗档，且点画线、虚线大多在细档时，粗档的连续线是粗线（不需要结点即为轮廓），细档的连续线是细线。没有线宽时，若图层约定已核对且按颜色出图，以粗实线层的颜色为粗线颜色（不得与细实线层、点画线层同色）。细线层上的粗线颜色连续线、粗线层上的细线颜色连续线进入候选，按连接关系确认：两端都接到轮廓或已确认的此类线（未被注写使用时也可是任意两处结点）才是可见轮廓；被尺寸用作界线的线必须两端都接到轮廓。图层名和颜色本身不决定。"
markers = []
concepts = ["DC-G1-016", "DC-G1-038", "DC-G1-079"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC", "LWPOLYLINE", "POLYLINE"]
requirement = "连续线；粗细按本图线宽或颜色，或按两端与轮廓的连接确认"

[[cards.variants]]
id = "lineweight_classes"
title = "线宽分成粗细两档"
distinguishing = "图层或实体线宽有两档，粗档不小于细档的给定倍数；粗档连续线是轮廓线，细档连续线不是"
encodings = ["loose"]
tests = ["thick_lineweight_arc_is_outline_without_junctions", "thin_lineweight_line_is_not_a_thick_outline"]

[[cards.variants]]
id = "outline_colour_on_thin_layer"
title = "细线层上用粗线颜色画的轮廓"
distinguishing = "表 6 的 08–12 层上、颜色与粗实线层相同的连续线，两端接在轮廓上"
encodings = ["loose"]
tests = ["outline_colour_line_on_a_thin_layer_joined_at_both_ends_is_outline"]

[[cards.variants]]
id = "outline_in_thin_colour"
title = "粗线层上改成细线颜色的轮廓"
distinguishing = "粗实线层或未约定的层上显式改成细线颜色的连续线，两端接在轮廓上"
encodings = ["loose"]
tests = ["thin_colour_outline_joined_at_both_ends_is_outline"]

[[cards.variants]]
id = "thin_line_joined_at_both_ends"
title = "细线层上两端接轮廓的细实线"
distinguishing = "按约定或线宽为细实线、未被注写使用、两端都接在轮廓上（过渡线、牙底线等结构细线），不限于 02 层"
encodings = ["loose"]
tests = ["thin_layer_line_between_outline_ends_is_a_thin_structural_line"]

[[cards.counter_examples]]
statement = "粗线层上改成细线颜色的尺寸界线：一端在轮廓上，另一端越过尺寸线伸出，不是轮廓"
