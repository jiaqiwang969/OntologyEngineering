[[concepts]]
id = "DC-G3-127"
name = "紧固件十字线表示（轴线垂直于投影面）"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在紧固组合的简化表示中，当孔、螺栓或铆钉的轴线垂直于投影面时，不画圆和头部，只在其中心位置画一个粗实线十字表示。"
components = ["十字由两条等长、互相垂直的粗实线组成，交点即孔或紧固件的轴心位置。", "通常按孔群位置成行成列出现（如钢结构节点板上的螺栓群），孔径或紧固件规格用指引线标注在某一符号附近。", "需要表示沉孔、现场钻孔或现场装配时，在十字上附加斜线或小旗（见螺栓或铆钉与孔装配符号）。"]
variants = ["孔", "螺栓", "铆钉"]
dxf_forms = ["Two crossing LINEs on layer 01 (thick), or a small cross INSERT block repeated at each fastener position (ARRAY/MINSERT)", "Leader with TEXT/MTEXT for the size (e.g. %%c13, M12×50) placed near one symbol of the group", "Steel-structure CAD libraries may store it as a block with attributes (bolt grade, diameter)"]
recognition = "锚点为粗实线短十字（两臂等长，长度约为字高h的1～2倍或接近孔径），无外框、不带圆；常以相同尺寸、等间距成组出现在板件轮廓内部，附近有一个指引线注写孔径或规格。区分：孔中心线交叉为细点画线且伴有圆；滚动轴承通用画法十字位于矩形框中央；带斜线或小旗的十字转入螺栓/铆钉装配符号卡。"
confusions = ["孔的中心线：细点画线，伸出圆外，并伴有孔的圆轮廓。", "滚动轴承通用画法十字：位于粗线矩形框中央，不触框。", "其他符号中的十字：有框格、文字或指引线伴随，不成阵列。"]
related = ["DC-G3-193", "DC-G3-194", "DC-G3-160", "DC-G3-084", "DC-G3-083", "DC-G3-121", "DC-G1-020"]
priority = "low"
