dxf_forms = ["no dedicated entity; inferred from extension-line defpoints (groups 13/14) shared by many DIMENSION entities", "ordinate DIMENSION (dimtype 6) origin, or baseline DIMENSION groups sharing their first extension line"]
recognition = "按方向统计尺寸界线起点：被多个尺寸共享的轮廓线、端面或中心线（尤其对称中心线和轴线）是该方向主要基准的候选；与之有尺寸相连、又派生出多个尺寸的另一面是辅助基准。直径尺寸以轴线为径向基准。不要与几何公差的基准符号（方框字母+三角形）混同：后者是显式符号，位置可与尺寸基准重合但概念不同。"
