[[concepts]]
id = "DC-G3-032"
name = "滚动轴承规定画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在剖视中较接近真实结构地画出滚动轴承的内外圈和滚动体，用于产品图样、样本、使用说明书及需要较详细表达的装配图；一般只画在轴的一侧，另一侧用通用画法。"
components = ["外廓尺寸（外径D、内径d、宽度B）与实际轴承一致，并按所在图样同一比例绘制，所有轮廓为粗实线。", "内外圈截面画方向、间隔相同的剖面线；滚动体（球画圆、滚子画矩形或梯形）不画剖面线；不致误解时套圈剖面线也可省略。", "装配图中保持架和倒角可省略不画；规定画法画在轴线一侧，另一侧用通用画法（矩形框加正十字）表示。", "与轴承配套的紧定套、挡圈等附件剖面线与套圈取不同方向或不同间隔，不致误解时也可省略。", "新版GB/T 4459.7-2017与1998版规则一致；1984版GB 4458.1附录B的简化画法仅作过渡参考。"]
variants = ["一侧规定画法、另一侧通用画法", "套圈剖面线可省略（不致误解时）", "附件剖面线方向或间隔不同", "旧版GB 4458.1—84附录B的简化画法（过渡参考）"]
dxf_forms = ["INSERT of a bearing library block (AutoCAD Mechanical / GstarCAD Mechanical / CAXA 图库), block name often encodes the series (e.g. contains 6208 or GB/T 276); may be anonymous or exploded", "exploded form: thick LINE/ARC ring outlines (layer 01) + thick CIRCLE for each ball + HATCH ANSI31 (layer 10) on the two ring regions with the ball circle as an island (unhatched)", "other side of shaft: closed LWPOLYLINE rectangle B×(D−d)/2 with two thick LINEs forming an upright cross (通用画法)", "designation normally only in BOM/明细栏 TEXT, e.g. '滚动轴承 6208 GB/T 276'", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为轴线（细点画线）与孔壁之间、宽为B、径向高约(D−d)/2的矩形区域，内部有一个粗实线圆（球）或小矩形（滚子）位于高度中部，圆被上下两块带同向剖面线的套圈截面夹住而自身无剖面线。轴线另一侧对称位置常为同尺寸的矩形框内正十字（通用画法）或特征画法符号。与通用/特征画法区分：后两者框内无剖面线；与普通衬套剖视区分：衬套截面整块有剖面线、无未剖切的圆；与动密封圈通用画法区分：密封圈框内为不接触边框的对角线X。尺寸比例见附录A（概念DC-G3-103）。"
confusions = ["滚动轴承通用画法：矩形框中央正立十字，无剖面线。", "滚动轴承特征画法：框内为长、短粗实线结构要素符号，无剖面线。", "衬套或隔套剖视：整块截面打剖面线，没有夹在中间的未剖圆。", "动密封圈通用画法：框内为对角线X，不是正十字，也无球形圆。"]
related = ["DC-G3-103", "DC-G3-116", "DC-G3-121", "DC-G3-119", "DC-G3-124", "DC-G3-123", "DC-G3-128", "DC-G3-122", "DC-G3-225", "DC-G2-009", "DC-G4-105"]
