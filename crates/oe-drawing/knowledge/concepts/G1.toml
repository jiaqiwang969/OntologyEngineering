[[concepts]]
id = "DC-G1-112"
name = "文字对正点"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "每个字符、每行和每段文字都有一个对正点，按“顶、中、底”与“左、中、右”组合编号1~9；十进制数字以小数点对正；段落可左对正、中对正或右对正。"
components = ["对正点九种：竖直方向顶/中/底与水平方向左/中/右的组合，标识码1~9。", "十进制数字以小数点对齐。", "段落文字可左、中、右对正，整个段落区域有一个对正点。"]
variants = ["左/中/右对正", "以小数点对正"]
dxf_forms = ["TEXT: first point (10) and alignment point (11) with group 72 (0 left, 1 centre, 2 right, 3 aligned, 4 middle, 5 fit) and group 73 (0 baseline, 1 bottom, 2 middle, 3 top)", "MTEXT attachment point (71): 1 TL, 2 TC, 3 TR, 4 ML, 5 MC, 6 MR, 7 BL, 8 BC, 9 BR"]
recognition = "计算文字实际包围盒时必须先按对正方式换算：TEXT 非左基线对正时以11组码为准，MTEXT 按71组码。对正方式可帮助判断归属（右对正的一列数字属于表格列，中对正的标题对准格中线）。GB/T 18594 的1~9编号顺序可能与 DXF MTEXT 71组码顺序不同，不可直接等同。"
confusions = ["文字插入点与几何对齐：插入点不一定是文字左下角。"]
related = ["DC-G1-103", "DC-G1-109", "DC-G1-111"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "DXF 组码为通用实践；标准表2编号与 DXF 的对应关系未核对。"
