[[concepts]]
id = "DC-G1-116"
name = "量和单位符号的书写"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "图样中的数学符号、物理量符号、计量单位符号和其他符号代号应按有关法令和标准书写，如460r/min、220V、5MΩ、380kPa；公差代号、螺纹标记等组合书写也遵循字体规定。"
components = ["单位符号写在数值之后，如 r/min、V、MΩ、kPa、m/kg。", "组合示例：10Js5(±0.003)、M24-6h、Ø25H6/m5、R8、5%、5:1。", "图样中以 mm 为单位的尺寸不注单位，其他单位须注明。"]
variants = ["单位符号", "公差代号/螺纹标记等组合示例"]
dxf_forms = ["TEXT/MTEXT with special codes %%c (Ø), %%d (°), %%p (±) and Unicode escapes such as \\U+2126 (Ω)"]
recognition = "先解析 %%c、%%d、%%p 和 Unicode 转义，再用单位词典（mm、m、kg、N、N·m、MPa、kPa、r/min、V、Ω、℃、%）识别“数值+单位”的物理量；带非长度单位的数值不是长度尺寸。螺纹、公差等组合代号按各自规则解析。"
confusions = ["尺寸数字：默认单位 mm，不写单位。", "代号与变量：如 d、m、z 等参数符号。"]
related = ["DC-G1-102", "DC-G1-108", "DC-G4-099"]
priority = "medium"
