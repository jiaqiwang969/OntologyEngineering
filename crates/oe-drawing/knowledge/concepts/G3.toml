meaning = "钻孔的入口和出口端面应与钻头轴线垂直，以免钻头偏斜或折断；在斜面或曲面上钻孔时，在孔口处设凸台、凹坑或加工出垂直于孔轴的小平面。"
components = ["钻孔轴线与孔口端面垂直。", "凸台式：孔口处外凸一小台，台面垂直于孔轴。", "凹坑式：孔口处锪出浅坑，坑底垂直于孔轴。", "斜面式：在斜面上加工出一小段与孔轴垂直的平面作为孔口。"]
