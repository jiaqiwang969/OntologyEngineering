[[concepts]]
id = "DC-G3-040"
name = "矩形外花键画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "轴上的矩形花键（外花键），在平行于轴线的视图中大径粗实线、小径细实线，并用断面图画出部分或全部齿形。"
components = ["平行轴线视图：大径为粗实线，小径为细实线；轴端倒角处小径细线随倒角延伸。", "工作长度终止端和尾部末端为垂直轴线的细实线，尾部为与轴线约成30°的细实线斜线。", "移出断面或局部断面中画出部分或全部齿形，注小径d、大径D、键宽b及齿数（如“6齿”），断面打剖面线。", "也允许用局部剖视表示（图3）及按图4画出垂直于轴线的视图；花键长度注工作长度，或工作长度加尾部长度/全长。"]
variants = ["视图加断面图（部分或全部齿形）", "局部剖视（图3）", "垂直于轴线的视图（图4）"]
dxf_forms = ["thick LINE pair at major D + thin LINE pair at minor d symmetric about the CENTER axis; thin LINEs ⟂ axis at working-length end and tail end; thin LINEs at ~30° to the axis forming the tail", "removed section: thick LWPOLYLINE/LINE/ARC teeth outline + HATCH ANSI31 + section label TEXT 'A-A' and cutting-plane symbols", "dimensions: DIMENSION linear L (working length); designation MTEXT on leader landing from the major diameter", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为轴段上关于轴线对称的粗实线（大径）与其内侧细实线（小径）组成的线对，细线到粗线的径向距约为(D−d)/2；该段末端有垂直于轴线的细实线以及与轴线约30°的细斜线（尾部），附近有剖切符号指向一个画有均布矩形齿（6–10齿）并带剖面线的断面。与外螺纹区分：螺纹小径≈0.85d、末端为粗实线螺纹终止线且无30°尾线（除非画螺尾，但螺尾在终止线外侧），也不配齿形断面；与齿轮轴区分：齿轮在视图中有分度点画线且齿宽段短、配参数表。"
confusions = ["外螺纹：粗大径+细小径相同，但终止线为粗实线，常有螺纹标记M…。", "齿轮轴：有分度点画线和齿轮参数表。", "轴上滚花：网纹线覆盖表面，无小径细线。"]
