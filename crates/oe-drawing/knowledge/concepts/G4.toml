[[concepts]]
id = "DC-G4-112"
name = "公共被测尺寸要素修饰符 CT"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "CT为公共被测尺寸要素修饰符：与前置的“n×”配合使用，表示把n个相互独立的尺寸要素视为一个尺寸要素共同满足同一要求；线性和角度尺寸均可使用。"
components = ["前置 n×：数量与乘号，作为规范的第一组成部分，与公称值间留空格", "尺寸与公差：公称值、公差及其他修饰符", "CT：大写字母，不加框，写在统计修饰符之后、Ⓕ之前", "角度用法：如 2×45°±2° CT"]
variants = ["linear", "angular (2×45°±2° CT)"]
dxf_forms = ["TEXT/MTEXT ending with 'CT' in a leader or dimension override text, e.g. '2×%%c150 %%p0.05 GN CT'", "modifier frames around GN etc. as separate LWPOLYLINE/INSERT, CT as plain text"]
recognition = "锚点：尺寸文字以“n×”开头且同一文字串中出现独立的大写词“CT”。只有两者同时出现才判为公共被测尺寸要素；只有n×无CT则为独立重复要求。与UF区分：UF写在n×之前，表示联合尺寸要素；与几何公差的CZ区分：CZ在公差框格内。"
confusions = ["仅有 n×：要求分别独立适用于每个要素", "UF 联合尺寸要素：位于规范最前", "几何公差中的CZ（组合公差带）：在框格内", "CT字样作为其他缩写（如计算机断层扫描）"]
related = ["DC-G4-094", "DC-G4-147", "DC-G4-100", "DC-G5-030"]
priority = "rare"
text_forms = ["2×Ø150 ±0.05 GN CT", "2× 10±0.1 Ⓔ CT", "2×45°±2° CT", "2× 150±0.05 GG ACS SA CT"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
