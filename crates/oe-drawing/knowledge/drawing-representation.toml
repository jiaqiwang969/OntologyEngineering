test = "outline_colour_line_on_a_thin_layer_with_a_free_end_is_not_outline"
[[cards.counter_examples]]
statement = "全图线宽只有一档时，线宽不作粗细证据"
test = "one_lineweight_class_does_not_decide"

[[cards.parameters]]
name = "weight_ratio_min"
value = 1.5
meaning = "粗档线宽 ≥ 该值 × 细档线宽（标准粗细比 2:1，旧图约 3:1）"

[[cards]]
id = "outline_joins"
expression_kind = "visible_contour"
title = "轮廓的连接与绘图缝隙"
meaning = "可见轮廓由首尾相接的直线和圆弧组成，在角点、T 形交点和相切处连接。CAD 作图时相接两段的端点常差一点，相切连接的两段圆弧尤其如此；差距只有字高的一小部分时，出图后小于线宽，看不出缝隙，仍是连接。轮廓线止于螺孔端视图的 3/4 细实线圆弧时，是被孔打断，这一端也是连接。"
sources = [
  "GB/T 4457.4-2002 机械制图 图样画法 图线：粗线宽度 0.5～0.7 mm，两平行线最小间隙 0.7 mm",
  "GB/T 14665-2012 机械工程 CAD 制图规则 4.2 图线宽度",
  "GB/T 4459.1-1995 机械制图 螺纹及螺纹紧固件表示法：螺孔端视图中大径用约 3/4 圈细实线圆弧",
]
knowledge_units = ["K03", "K09"]
recognition = "轮廓候选的端点不在别的轮廓上时，在绘图缝隙（字高的给定比例）内找另一轮廓候选：直线、圆弧的任一处都可；圆弧端点同样适用，包括相切相接的两段圆弧。端点落在已识别的螺纹 3/4 细圆弧上时，按被孔打断计为结点。"
markers = []
concepts = ["DC-G1-015"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC"]
requirement = "相接的轮廓段，端点间差距不超过绘图缝隙"

[[cards.variants]]
id = "arc_to_arc_gap"
title = "相切相接的两段圆弧端点差一点"
distinguishing = "圆弧端点到另一轮廓圆弧的距离在绘图缝隙内"
encodings = ["loose"]
tests = ["arcs_meeting_within_the_drafting_gap_are_joined"]

[[cards.variants]]
id = "end_on_thread_circle"
title = "轮廓止于螺孔的 3/4 细圆"
distinguishing = "端点落在螺纹端视图的 3/4 细实线圆弧上"
encodings = ["loose"]
tests = ["outline_arc_ending_on_a_thread_circle_is_joined"]

[[cards.counter_examples]]
statement = "端点间差距超过绘图缝隙的两段不按连接处理"
test = "arcs_apart_beyond_the_drafting_gap_are_not_joined"

[[cards.parameters]]
name = "join_gap"
value = 0.04
meaning = "绘图缝隙 = 该值 × 字高（3.5 号字时约 0.14 mm，小于粗线宽度的一半）"

[[cards]]
id = "annotation_break"
expression_kind = "visible_contour"
title = "图线在注写处断开"
meaning = "尺寸数字、符号不得被图线穿过；轮廓线、中心线经过数字或符号（表面结构符号、基准符号、框格等）时在该处断开。断开处两侧共线的两段仍是同一条图线，按完整结构连起来；补出的部分是推断，不是来源线。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法：尺寸数字不可被任何图线所通过，否则应将该图线断开",
  "GB/T 131-2006 产品几何技术规范 表面结构的表示法：符号注在轮廓线上或其延长线上",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法",
]
knowledge_units = ["K13", "K17"]
recognition = "一段轮廓的自由端与另一段共线轮廓的自由端隔一个缺口相对；缺口被注写文字（及其尺寸线、终端）覆盖，或被一个以图块画出的注写符号的笔画横穿、缺口不长于符号尺寸的给定倍数时，两段是同一条线，原因记为“为注写断开”，按推断连成一条结构线。"
markers = []
concepts = ["DC-G4-001"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE"]
requirement = "缺口两侧共线的同类轮廓段，相对的两端都是自由端"

[[cards.variants]]
id = "broken_for_symbol"
title = "轮廓在表面结构符号等处断开"
distinguishing = "缺口被图块符号的笔画横穿，缺口长度不超过符号尺寸的给定倍数"
encodings = ["block"]
tests = ["outline_broken_for_a_texture_symbol_is_one_line"]

[[cards.counter_examples]]
statement = "缺口处没有注写符号或文字时，两段不按断开连起来"
test = "gap_without_annotation_is_not_bridged"

[[cards.parameters]]
name = "gap_to_symbol_max"
value = 1.5
meaning = "缺口长度 ≤ 该值 × 符号外框对角线"

[[cards]]
id = "hole_pattern"
expression_kind = "visible_contour"
title = "均布孔组"
meaning = "法兰、端盖等零件上均匀分布的一组相同孔，在投影为圆的视图中画成分布圆上等角距排列的等径粗实线圆，用“n×Øx”（旧式“n-Øx”，常加“均布”）注出孔数与孔径，尺寸线或指引线落在其中一个孔上。被这样的标注指到的等径圆就是孔的可见轮廓，不论画在哪个图层；同一组孔在另一圆形视图中按同样的分布再画一次时，那一组也是这些孔。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法：相同要素的尺寸注法（数量×尺寸）",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 表2（n×Ø，旧式 n-Ø）",
  "GB/T 4458.1-2002 机械制图 图样画法 视图：圆柱形法兰上均布孔的画法",
]
knowledge_units = ["K17", "K19"]
recognition = "以“数量 + 分隔符 + Ø + 直径”的标注为锚：它的两个终端在一个直径等于标注值的圆上、位于圆心两侧，这个圆被它横跨。取该圆与离它最近的另外 n−1 个等径圆，圆心等距分布在一个分布圆上、相邻角距相等时，这 n 个圆都是孔；其余等径圆中按同一分布圆半径与角距再组成 n 个的一组，也是这些孔（另一圆形视图）。凑不成均布的一组时只认被横跨的那个圆。"
markers = []
concepts = ["DC-G3-111"]

[[cards.components]]
role = "contour_segment"
primitives = ["CIRCLE"]
requirement = "直径等于标注值的圆，被标注横跨或与被横跨的圆均布在同一分布圆上"

[[cards.variants]]
id = "count_diameter_callout"
title = "数量×孔径标注横跨的均布孔"
distinguishing = "标注的两个终端在一个等径圆上、在圆心两侧；与它均布在同一分布圆上的另外 n−1 个等径圆"
encodings = ["loose"]
tests = ["circles_named_by_a_count_diameter_callout_are_holes"]

[[cards.variants]]
id = "same_pattern_in_another_view"
title = "同一组孔在另一圆形视图中"
distinguishing = "另一处 n 个等径圆按同一分布圆半径、相同角距排列"
encodings = ["loose"]
tests = ["circles_named_by_a_count_diameter_callout_are_holes"]

[[cards.counter_examples]]
statement = "直径与标注值不等的圆不是被标注的孔"
test = "circle_of_another_diameter_is_not_a_named_hole"

[[cards.parameters]]
name = "diameter_tolerance"
value = 0.01
meaning = "圆半径与标注直径一半的相对差上限"

[[cards.parameters]]
name = "pitch_tolerance"
value = 0.01
meaning = "各孔心到分布圆圆心的距离相对差上限"

[[cards.parameters]]
