[[concepts]]
id = "DC-G9-003"
name = "未注倒角注语"
aliases = []
group = "G9"
kind = "note"
meaning = "技术要求中对图上未单独标注的倒角统一规定尺寸的说明，如“未注倒角C1”；所有倒角都相同时写“全部倒角为C×”。这时图上的倒角可以不画或画出但不逐个标注。"
components = ["典型写法：“未注倒角C1”“未注倒角为C0.5”“全部倒角为C2”。", "C表示45°倒角，后面的数字是倒角的轴向长度（mm）。", "图上对应的倒角可按简化画法省略不画，或画出而不注尺寸。"]
variants = ["未注倒角为 C×", "全部倒角为 C×"]
dxf_forms = ["TEXT/MTEXT item inside the 技术要求 block; sometimes placed alone near the title block"]
recognition = "以匹配“(未注|全部)倒角(为)?\\s*C\\s*\\d+(\\.\\d+)?”的文字为锚点。识别后，可把图中没有尺寸的45°小斜边（两端点在轮廓转角处，长度约等于C值乘比例）解释为由该注语规定的倒角。与图上倒角尺寸“C1”的区别：后者有指引线或尺寸线指向具体倒角；与“锐角倒钝”的区别：后者不给尺寸。"
confusions = ["倒角尺寸C×：在视图上单独标注。", "锐角倒钝、去毛刺：不规定尺寸。", "未注圆角说明：给的是R而不是C。"]
related = ["DC-G1-070", "DC-G4-068", "DC-G4-081", "DC-G3-091", "DC-G4-040", "DC-G9-010", "DC-G9-002"]
priority = "high"
text_forms = ["未注倒角C1", "未注倒角为C0.5", "全部倒角为C2"]
knowledge_units = ["K03", "K52", "K55", "K39", "K29"]
