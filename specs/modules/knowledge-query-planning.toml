[[constraints]]
id="exploration_host_continuation"
requirement="req_engineering"
module="engineering"
check="advance"
rust_path="crates/oe-engineering/src/workflow/exploration/host.rs"
statement="当前会话提交原工具结果，Rust重建冻结动作/前态/结果分支；未执行保持待办，失败/部分/来源变化不能跳步、丢历史或获得工程采用。原Project/work/计算/Harness owner不变。"
severity="error"

[[validations]]
id="verify_host_exploration_protocol"
module="engineering"
constraint="exploration_host_continuation"
behavior="host_chain_keeps_pending_results_history_and_original_guards"
rust_path="crates/oe-engineering/tests/exploration.rs"
oracle="独立冻结两步与分支；缺结果pending；来源陈述只支持来源范围；真实计算回读触发原判据；跳步、旧来源变化、篡改结果和删历史拒绝。原所有假设/条件/单位与采用反例保留。"
scope="development_replay；无API，不认证原生/物理或泛化收益"

[[validations]]
id="verify_host_exploration_actual_cli"
module="engineering"
constraint="exploration_host_continuation"
behavior="default_local_work_keeps_calculation_conditions_and_source_drift_checks_without_a_key"
rust_path="crates/oe-cli/tests/host_agent.rs"
oracle="实际空PATH且无密钥CLI按freeze→advance→work→advance执行，1/60mm结果改变限定模型决定；无结果不完成、改为1mm被拒；来源或载荷变化保持原检查。"
scope="本机构建候选真实CLI；独立接收及物理验证另验"

