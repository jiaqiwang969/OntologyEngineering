[[concepts]]
id = "DC-G3-199"
name = "运动轨迹与运动指向符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示某一点的运动轨迹（细直线或曲线）以及沿轨迹运动方向（轨迹上的箭头）的基本运动符号。"
components = ["运动轨迹：一条细直线表示直线运动，一段圆弧或曲线表示曲线运动。", "运动指向：在轨迹线上加箭头，表示点沿轨迹的运动方向，直线和回转运动均适用。", "其他运动特征符号（停顿、停留、反向、往复）都在此轨迹线上叠加。", "2013版条号4.1、4.2（表1），1984版1.1、1.2，图形一致。"]
variants = ["直线运动", "曲线运动/回转运动"]
dxf_forms = ["Thin LINE / ARC / SPLINE on layer 02 (sometimes layer 05 or 07 when drawn as a path)", "Arrowhead as SOLID triangle, tapered LWPOLYLINE segment, or a reused LEADER without text", "INSERT of an arrow block"]
recognition = "锚点为终止于实心箭头的细直线或圆弧，箭头前端不抵尺寸界线、不指向零件表面上的标注、旁边无字母或数值；通常从构件端点或铰链附近起画。与尺寸线箭头区分：尺寸线成对箭头并有数值；与向视方向箭头区分：后者旁注大写字母；与指引线区分：指引线另一端有文字、基准线或符号。"
confusions = ["尺寸线箭头：两端箭头抵尺寸界线，带数值。", "向视图投射方向箭头：旁注大写字母。", "指引线：箭头指向要素，另一端接文字或基准线。", "纤维/轧制方向：两端带箭头的细线，画在零件视图上。"]
related = ["DC-G3-153", "DC-G3-165", "DC-G3-198", "DC-G3-187", "DC-G4-019", "DC-G2-072", "DC-G1-096"]
priority = "low"
