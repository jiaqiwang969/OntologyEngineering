[[concepts]]
id = "DC-G3-178"
name = "棱柱副（移动副）符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示一个自由度的移动副（棱柱副）：滑块沿导路相对移动，常用矩形滑块套在导路线上表示。"
components = ["基本符号：横置矩形表示滑块，导路线从两侧接到矩形边上，构件粗线带实心楔斜接在矩形一侧。", "可用符号之一：滑块矩形内画两条对角线（叉线），其余同基本符号。", "可用符号之二：导路画成两条平行线加竖短线的梯形框（一端可为半圆头），表示滑块在导槽内移动。", "可用符号之三：构件粗线带实心楔接在一条短横线上，短横线位于长导路线上方并带竖短线，长线下方另有一条短平行线。", "2013版条号5.1.2，1984版2.1.2，图形一致。"]
variants = ["基本符号", "可用符号（含叉线滑块）"]
dxf_forms = ["Closed LWPOLYLINE (or 4 LINEs) rectangle on layer 01 with guide LINEs touching its short sides and an inclined LINE link with SOLID wedge", "Alternative: two diagonal LINEs inside the rectangle; or ladder-like guide of parallel LINEs with perpendicular rungs and an ARC end", "INSERT of a slider / prismatic-pair library block"]
recognition = "锚点为横置小矩形，其两条短边各与一根共线的导路线相接（导路线在矩形内中断或贯穿），并有一根构件线以实心楔接在矩形长边上。矩形内有叉线→可用符号。与滚动轴承通用画法区分：轴承框内为不触框的正立十字，框两侧是轴线而不是带构件斜线；与凸轮从动杆导路区分：从动杆为竖直杆端接触凸轮轮廓。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。"
confusions = ["滚动轴承通用画法矩形框：框内正立十字不触框，成对画在轴线两侧，无构件斜线和实心楔。", "凸轮从动杆：杆端为尖顶、滚子或平底并与凸轮轮廓接触。", "圆柱副可用符号：横置长矩形中轴线贯穿、无叉线、无构件斜线。"]
related = ["DC-G3-182", "DC-G3-152", "DC-G3-158", "DC-G3-143", "DC-G3-146", "DC-G3-121"]
priority = "rare"
