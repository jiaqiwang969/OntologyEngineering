recognition = "锚点：双点画线组成的外形，与主零件粗实线轮廓接触或相邻（共边或贴合）；在被主零件遮挡处中断，内部没有 HATCH。形状与主零件任何部分都不全等（据此与可动零件极限位置区分）。"
