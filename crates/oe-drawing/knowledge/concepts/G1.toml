[[concepts]]
id = "DC-G1-011"
name = "双折线"
aliases = []
group = "G1"
kind = "line"
meaning = "断裂处边界线的一种：带一个或几个Z形折的细实线，表示机件在此断开（断开缩短或局部断裂），也可作视图与剖视的分界，较适合长的直线断裂边界。"
components = ["细实线（No.01.1.22），中间有尖角Z形折，折形等距分布。", "CAD 画法：全长为被断开宽度加10d（两端各超出轮廓约5d），每个Z形沿线约占7.5d；线短时只放一个Z形。", "较长时可画两个双折符号。", "同一张图样上一般只用波浪线或双折线中的一种。"]
variants = ["两个双折符号（较长时）"]
dxf_forms = ["LWPOLYLINE (or chained LINEs) with zigzag vertices on thin layer 02, colour green", "a break-line symbol INSERT (e.g. the AutoCAD express-tool break-line block) or its exploded strokes", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为主体是直线、中间夹有Z形尖折的细实线折线（每个折约3~4个顶点、折段长为线宽的数倍）。整线穿过机件轮廓且两端略超出轮廓（波浪线则止于轮廓）；在断开缩短处常成对出现、之间无图线。与焊缝符号的小折线（附着于焊缝基准线）及整条规则锯齿线区分。"
confusions = ["波浪线：徒手不规则曲线，止于轮廓。", "规则锯齿连续线：整条线连续锯齿。", "折线状轮廓：粗实线，构成零件外形。", "折线指引线：只折一次，端部有箭头或接文字。"]
related = ["DC-G1-029", "DC-G1-032", "DC-G1-043", "DC-G2-041", "DC-G3-117"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "partial"
