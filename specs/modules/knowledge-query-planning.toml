# Explicit packet maintenance diagnostics remain separate from verification.

[[constraints]]
id="packet_source_audit_separates_structure_originals_and_registration"
requirement="req_knowledge"
module="knowledge"
check="audit_sources"
rust_path="crates/oe-knowledge/src/packet/source_audit.rs"
statement="An explicit packet-source audit first validates the complete packet's intrinsic context identity, candidate uniqueness, native-text hashes, exact spans, review declarations, local locator declarations and binding digest/cross-identities without requiring old original availability. Structural corruption and lexical path escapes remain errors, including later candidates after an unavailable original. Then independently observe original bytes and compare explicitly bound local-PDF registrations using the same declaration checks as strict verification. Original missing/changed does not erase other candidates or imply registration removed; registration current does not establish original integrity. No Poppler, native-page content validation, source-pack/relocation validation or current Project verification is performed by this diagnostic."
severity="error"

[[constraints]]
id="packet_source_audit_bounded_read_only_observation"
requirement="req_knowledge"
module="knowledge"
check="audit_sources"
rust_path="crates/oe-knowledge/src/packet/source_audit.rs"
statement="Observe at most 96 distinct original paths and at most 4 GiB total original-byte reads including final rechecks. Deduplicate paths, do not follow symlinks or block on special files, and report budget/IO/race limitations as unavailable rather than current or missing. Recheck observed originals and verified registration snapshots before return; identity changes remain explicit. Preserve packet, original, index and historical feedback bytes. Audited means the diagnostic completed; full_verification remains not_run and this report is never an input substitute for strict verify or feedback. Existing strict make/verify/feedback and historical feedback loading retain all original integrity checks and reject unusable evidence."
severity="error"

[[constraints]]
id="knowledge_cli_packet_source_audit"
requirement="req_knowledge"
module="cli"
check="knowledge_execute"
rust_path="crates/oe-cli/src/main.rs"
statement="knowledge audit-packet accepts one explicit rooted packet and optional new private output directory, requires neither current context nor native tools, and emits only a source-audit.json diagnostic with status audited. Malformed input remains blocked with no output artifact. Normal and require-current-registration verify/feedback semantics and errors remain unchanged; no automatic history scan, repair, source write or engineering adoption."
severity="error"

[[validations]]
id="packet_source_audit_separates_old_original_failure_from_current_registration"
