[[concepts]]
id = "DC-G4-004"
name = "不带箭头的指引线标注尺寸"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "简化注法：用一条不带箭头的指引线把尺寸引出，指引线一端直接终止在被注要素的轮廓上（如圆周），尺寸数值写在指引线相连的水平基准线上。"
components = ["指引线：细实线，通常倾斜，起点落在圆周或轮廓线上，无箭头、无圆点", "基准线：与指引线相连的水平细实线段", "尺寸文本：如 Ø100，写在基准线上方", "两版 GB/T 16675.2（1996、2012）表2 5.3 规定相同"]
variants = []
dxf_forms = ["LEADER entity with arrowhead flag 71=0 (no arrow) or arrow block '_NONE', with an associated MTEXT", "MULTILEADER with arrowhead 'none' or size 0, MTEXT content such as '%%c100'", "exploded: oblique LINE + horizontal LINE on layer 09 (leader) or 08, TEXT '%%c100' sitting on the horizontal line", "DIMENSION dimtype 3 with text moved outside on a leader and arrow block _NONE (less common)"]
recognition = "锚点为带尺寸语义的文字（Ø、R、n×、数值），下方有一条长度≈文字宽度的水平细线，水平线一端接一条斜线；斜线另一端点恰好落在某圆/弧上（到圆心距离≈半径，容差≈0.5d）或轮廓线上，且端点处没有填充三角或圆点。与带箭头指引线区分：终端无三角；与指向面内的圆点终端指引线区分：终端在轮廓线上而非区域内部、无圆点；与尺寸界线区分：尺寸界线成对出现、垂直于尺寸线、不接水平基准线。"
confusions = ["带圆点的指引线：圆点落在区域内部，多用于注释或序号", "尺寸界线：成对出现并与尺寸线垂直，不连接水平基准线", "零件序号指引线：末端为圆点，另一端是序号", "带箭头的指引线标注尺寸：终端有箭头"]
related = ["DC-G4-023", "DC-G4-026", "DC-G1-028", "DC-G1-018", "DC-G1-098", "DC-G8-009"]
priority = "medium"
text_forms = ["Ø100", "Ø120"]
