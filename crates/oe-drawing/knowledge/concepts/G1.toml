[[concepts]]
id = "DC-G1-111"
name = "指引线注释说明的位置"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "与指引线相关的注释说明优先写在基准线上方，与基准线相距约两倍线宽，不得写在线内或与之接触；也可写在指引线或基准线后方并以字中对齐，或写在相关图形符号的旁边、内部或后方。"
components = ["优先：基准线上方，距线约两倍线宽，不接触。", "其次：指引线或基准线的后方，文字中部与线对齐。", "或：相关图形符号（框格、焊缝符号等）的旁边、内部或后面。"]
variants = ["基准线上方", "指引线/基准线后方（字中对齐）", "图形符号旁、内或后"]
dxf_forms = ["MLEADER text attachment above the landing (bottom of text on the landing) or middle-of-text attachment for after-line placement", "exploded: TEXT whose bottom sits just above a short horizontal LINE"]
recognition = "用于把文字归属到指引线：(1) 文字底边在某水平线上方且距离不大于字高的0.5倍、文字水平范围覆盖该线段→归该基准线；(2) 文字竖直中心与指引线或基准线端点同高、文字起点距端点不大于一个字宽→归该线。MLEADER 中文字已显式关联。"
confusions = ["尺寸数字位置：写在尺寸线上方或中断处，属尺寸注法。"]
related = ["DC-G1-018", "DC-G1-028", "DC-G1-107"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
