[[concepts]]
id = "DC-G4-040"
name = "45°倒角符号 C"
aliases = ["倒角尺寸 C", "倒角符号C"]
group = "G4"
kind = "dimension_symbol"
meaning = "45°倒角用大写字母C后接倒角的轴向（直角边）长度表示，如C2即2×45°；注在指引线基准线上或尺寸线上。全部或大多数倒角相同时，可在图样空白处统一说明（如“全部倒角C1.6”）。"
components = ["倒角图形：轮廓端部的45°短斜线，及倒角边界线（轴端常见一条与端面平行的直线）。", "注法一：指引线从倒角斜面引出（可不带箭头），在基准线上写Cn（图31左、右）。", "注法二：用线性尺寸线注倒角轴向长度，数字写成Cn（图31中）。", "数量：两端相同倒角可写2×C1、2×C0.5；倒角省略不画时仍须注尺寸或说明。", "旧写法n×45°（如1×45°）新旧图纸均会出现；非45°倒角改用长度＋角度。", "总说明：技术要求中写“全部倒角C1.6”“未注倒角C0.5”等。"]
variants = ["Cn on leader", "general note form 全部倒角C1.6", "n×45° form seen in examples (older practice)", "C1", "1×45°（旧写法）", "长度+角度（非45°）", "2×C0.5"]
dxf_forms = ["LEADER/MULTILEADER (often without arrowhead) with MTEXT 'C2' on a horizontal shoulder", "DIMENSION dimtype 0 with override text 'C1' replacing the measured value", "exploded: LINE (leader + shoulder) + TEXT 'C1'", "old form TEXT '1×45%%d' or '1X45%%d'", "general note MTEXT '全部倒角C1.6' in the technical requirements", "layer 08/09 or template dimension/leader layer"]
recognition = "锚点为匹配^(\\d+[×xX])?C\\d+(\\.\\d+)?$的文字，或旧式“数×45°”。几何验证：文字所在指引线末端或尺寸界线落在一段约45°的短斜线上（斜线长≈数值×√2×比例），该斜线位于轴端、孔口或棱边，两端点分别在端面线和外圆/孔轮廓上；字高与周围尺寸数字相同。排除：锥度在图上写为▷1:x而不是C加数；表面纹理C位于表面结构符号旁；最小区域C在公差框格内；基准字母C在方框中并连三角形；圆角为R并对应圆弧。"
confusions = ["锥度：图上写▷1:5，字母C只在公式或参数表中出现。", "表面纹理方向符号C：位于表面结构符号的右下方。", "最小区域拟合符号C：位于几何公差框格内。", "基准字母C：方框内单字母并连三角形。", "圆角R：前缀R，对应圆弧而非45°斜线。", "模制件型芯、刀具等字母代号C：出现在模具/模制件代号中，不配数值或带其他编号。"]
related = ["DC-G4-037", "DC-G4-081", "DC-G4-068", "DC-G3-091", "DC-G9-003", "DC-G1-070"]
priority = "high"
text_forms = ["C1", "C2", "2×C0.5", "C1.6", "1×45°", "全部倒角C1.6"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K39"]
