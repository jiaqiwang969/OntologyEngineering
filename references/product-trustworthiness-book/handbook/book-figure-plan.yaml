    existing_asset_candidate: handbook/figures-imagegen/ch01-fig01-green-without-claim-v04.png
    prompt: 上方一辆完整乘用车底盘，仅转向路径高亮；同一套转向机构从前桥位置抽出放大。六张结果卡由左右两条无箭头母线整理，两条母线都在中央主张边界前停止，数段括片没有闭合成环。
    labels: [概念边界, 硬件分析, 软件回归, 系统台架, 冲击振动, 生产写入]
