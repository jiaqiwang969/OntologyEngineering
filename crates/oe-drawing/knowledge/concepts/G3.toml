[[concepts]]
id = "DC-G3-067"
name = "铸造圆角"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "铸件毛坯各表面相交处都有铸造圆角（便于起模、防止冲砂、裂纹和缩孔）；图上画出小圆角但一般不逐个标注，统一写在技术要求中；经机加工的表面相交处为尖角。"
components = ["未加工表面相交处：小圆弧过渡。", "加工面与其他面相交处：圆角被切去，画成尖角。", "圆角半径通常在技术要求中统一注写。", "圆角使原交线消失，相应位置按过渡线画法表示。"]
variants = []
dxf_forms = ["Many small ARC entities tangent to adjacent outline LINEs on layer 01, mostly of one small radius, without individual radius DIMENSIONs", "TEXT/MTEXT in 技术要求, e.g. 未注铸造圆角R3~R5", "Transition lines: short LINE/ARC ending short of the outline where a fillet removes the edge"]
recognition = "锚点为轮廓拐角处的小半径ARC，与两条相邻轮廓线相切；同一零件上大量出现、半径相同或相近（远小于零件尺寸），且不单独标注半径，同时技术要求含“铸造圆角”。结合加工面判断：带加工粗糙度要求或配合尺寸的面在拐角处为尖角。与机加工倒圆区分：倒圆有单独的R尺寸，多在轴肩处；与过渡线区分：过渡线是圆角处的假想交线，端部不与轮廓相接；与圆角省略简化区分：省略时圆角不画，只写注语。"
confusions = ["机加工倒圆（R标注）：单独标注半径，常见于轴类零件轴肩。", "过渡线：圆角处的假想交线，不与轮廓闭合。", "圆角省略（全部铸造圆角R×）：圆角不画、只写注语。"]
