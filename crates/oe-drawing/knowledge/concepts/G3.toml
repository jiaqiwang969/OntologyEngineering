[[concepts]]
id = "DC-G3-093"
name = "螺尾"
aliases = []
group = "G3"
kind = "line"
meaning = "螺尾是螺纹末端牙型逐渐不完整的收尾部分。一般不画；需要表示时，在螺纹终止线外侧用与轴线成30°的细实线画出。"
components = ["常规：不画螺尾，螺纹画到终止线为止。", "需要表示时：牙底细实线越过终止线后以30°斜线收向牙顶线（外螺纹收向大径粗线，内螺纹收向大径细线）。", "螺纹长度尺寸默认不含螺尾部分。"]
variants = ["不画（常规）", "30°细实线（需要时）"]
dxf_forms = ["Short thin LINE (layer 02) at 30° to the axis, starting at the thread end line and running from the root line to the crest line; one on each side of the axis as a mirrored pair", "Library-generated or exploded threads usually omit runout entirely"]
recognition = "以螺纹终止线（垂直轴线的粗实线）为锚点，在其非螺纹一侧寻找一对关于轴线对称、与轴线成约30°（容差约±5°）的细实线，起点位于牙底细线的延长处、终点落在牙顶线上，斜线长约为牙高的两倍（约0.15d）。区分倒角线：倒角是粗实线、在螺纹起始端（轴端）、一般45°；区分花键尾部：花键尾部斜线外还有一条垂直细线（尾部末端），且GB图中花键终止端为细实线；区分退刀槽：退刀槽为粗实线的矩形凹槽。"
