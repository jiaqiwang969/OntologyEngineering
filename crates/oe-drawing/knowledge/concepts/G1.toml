[[concepts]]
id = "DC-G1-028"
name = "指引线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细实线把图形上的要素与说明文字或符号（技术要求、序号、标注）连接起来，建立明确对应关系的线。"
components = ["细实线；与相邻图线成大于15°的角，不得与剖面线平行。", "可弯折一次成锐角；多条指引线可共用一个起点；不得穿过其他指引线、基准线、图形符号或尺寸数字。", "终端：止于轮廓线用实心箭头，止于轮廓内用圆点，止于另一条线（尺寸线、对称线）不加终端，指向多条平行线可用斜线。", "文字一端接基准线（6 mm 或与文字同长），或在指引线后直接注写。"]
variants = ["单条", "折弯一次（锐角）", "共用起点的多条指引线"]
dxf_forms = ["LEADER entity (71 arrowhead flag, 72 path type, 76 vertex count, 340 link to annotation) with MTEXT/TOLERANCE/INSERT annotation", "MULTILEADER (MLEADER) with arrow block _CLOSEDFILLED, _DOT, _NONE or _OBLIQUE and a landing", "exploded: LINE(s) + SOLID/HATCH triangle or small filled dot (DONUT-like LWPOLYLINE) at the end", "layer 09 (参考圆含引出线及终端) or 08/细实线 per GB/T 14665"]
recognition = "锚点为一端带终端（箭头/圆点/斜线，或无终端）、另一端接文字、基准线或符号的细实线折线。判据：末端落在轮廓线上（箭头）或轮廓内部（圆点）；另一端距某文字插入点小于一个字高；与邻近图线夹角大于15°；不成对、不连尺寸界线（区别于尺寸线）。另一端连接的对象决定其用途：序号、几何公差框格、焊缝符号等。"
confusions = ["尺寸线：两端有终端，与尺寸界线垂直相接。", "剖面线：成组等距平行。", "尺寸界线：从轮廓引出，越过尺寸线。", "焊缝箭头线：指向接头，另一端接焊缝基准线。"]
related = ["DC-G1-018", "DC-G1-095", "DC-G1-096", "DC-G1-097", "DC-G1-098", "DC-G1-111", "DC-G1-080", "DC-G8-009", "DC-G4-026", "DC-G7-141"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = ["second"]
expert_checked = false
