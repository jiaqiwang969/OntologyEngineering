[[concepts]]
id = "DC-G4-033"
name = "轴测图圆和圆弧的尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "轴测图中标注圆的直径时，尺寸线和尺寸界线分别平行于圆所在平面内的两根轴测轴；标注圆弧半径或较小圆的直径时，尺寸线可从圆心引出或通过圆心，但注写数字的横线必须平行于某一轴测轴。"
components = ["被注圆在轴测图中投影为椭圆；直径尺寸线平行于该坐标面内一根轴测轴，尺寸界线平行于另一根轴测轴并与椭圆相切。", "半径或小直径：尺寸线从椭圆中心引出或穿过中心，箭头指向椭圆。", "引出注写：数字写在一段平行于轴测轴的横线上，前缀Ø或R。", "GB 4458.3-84第3.2条与GB/T 4458.3-2013第6.2条规定相同。"]
variants = []
dxf_forms = ["ELLIPSE entity (or polyline/spline approximation) for the pictorial circle; dimension as DIMENSION dimtype 1 (aligned) with oblique extension lines (oblique angle in code 52)", "exploded LINE + SOLID arrows + TEXT '%%c20' whose rotation/oblique angle follows the axis (e.g. 30°/150°)", "leader from the ellipse centre: LINE + LINE shoulder parallel to an axonometric axis + TEXT 'R10' or '%%c8'", "layer 08 or template dimension layer"]
recognition = "先判定为轴测图：主要棱线沿三个方向（正等测约30°、90°、150°），圆以ELLIPSE或近似曲线出现。锚点为带Ø或R的文字，其尺寸线方向平行于某一轴测轴而非水平/竖直，尺寸界线也沿轴测轴并与椭圆相切；引出式注写的横线同样沿轴测轴，文字常带倾斜角。与二维直径尺寸区分：二维目标是CIRCLE、尺寸线通过圆心且界线与尺寸线垂直；与普通指引线区分：普通引线的注写横线水平。"
confusions = ["二维正投影直径尺寸：目标为正圆，界线与尺寸线垂直；轴测图中目标为椭圆，界线与尺寸线斜交。", "普通指引线注释：横线水平，不平行于轴测轴。", "椭圆轮廓本身：粗实线、无箭头和数字。"]
related = ["DC-G4-034", "DC-G4-035", "DC-G4-030", "DC-G2-087", "DC-G2-083"]
