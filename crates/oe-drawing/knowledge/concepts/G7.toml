meaning = "在整体硬化区或粗点画线标出的热处理区域内，允许不经热处理的部位用细点画线（线型04.1）标出。"
components = ["细点画线：沿允许不热处理部位的外部轮廓、紧靠轮廓画出。", "所处范围：位于整体硬化零件或粗点画线热处理区之内。", "尺寸（可选）：标出该部位范围。"]
