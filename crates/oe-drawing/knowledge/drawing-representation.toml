[[cards.parameters]]
name = "arm_ratio_max"
value = 3.0
meaning = "长臂与短臂之比上限"
[[cards.parameters]]
name = "value_reach"
value = 1.6
meaning = "数值文字中心到开口点的距离上限 = 该值 × 长臂长"
[[cards.parameters]]
name = "arm_min"
value = 0.8
