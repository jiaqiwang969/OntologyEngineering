[[concepts]]
id = "DC-G3-193"
name = "螺栓或铆钉与孔装配符号（轴线垂直于投影面）"
aliases = []
group = "G3"
kind = "symbol"
meaning = "紧固件轴线垂直于投影面时，在表示孔、螺栓或铆钉的粗十字上附加斜线和小旗，表示近侧/远侧/两侧沉孔以及在车间或使用现场钻孔与装配。"
components = ["基本形为粗实线十字（无沉孔、在车间钻孔及装配）。", "近侧有沉孔：在十字上半部附加两条斜线；远侧有沉孔：在下半部附加两条斜线；两侧有沉孔：附加四条斜线成米字形。", "车间钻孔后在现场装配：从中心沿一条斜向引出的线端加一面小旗；钻孔和装配均在使用现场：加两面小旗。", "孔径或规格用指引线注在符号附近，如Ø13、M12×50、Ø12×50。"]
variants = ["无沉孔", "近侧有沉孔", "远侧有沉孔", "两侧有沉孔", "车间钻孔及装配", "车间钻孔后现场装配", "钻孔和装配均在使用现场"]
dxf_forms = ["Thick LINEs on layer 01: cross plus oblique strokes; flags as small closed LWPOLYLINE triangles on an oblique LINE", "Steel-structure library INSERT (often with attributes) repeated by ARRAY", "Leader with TEXT/MTEXT for hole or fastener size"]
recognition = "锚点为粗十字，统计其交点处附加的斜线：上半两条＝近侧沉孔，下半两条＝远侧沉孔，八臂米字＝两侧沉孔；从中心沿约45°引出、末端带三角小旗的斜线表示现场作业，旗数1或2区分仅现场装配或钻孔装配均在现场。与焊缝现场符号区分：后者小旗在焊缝指引线基准线折点上，并伴有焊缝基本符号。"
confusions = ["星形或米字形装饰标记、表面纹理符号：不在孔位阵列中，无配套规格注写。", "现场焊缝符号（小旗）：位于焊缝指引线与基准线交点，伴有焊缝符号。", "孔中心线交叉：细点画线，伴有圆。"]
related = ["DC-G3-127", "DC-G3-194", "DC-G3-160", "DC-G7-138", "DC-G3-084"]
