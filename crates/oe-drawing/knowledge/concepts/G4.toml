expert_checked = false
notes = "Ø的位置和无空格规则来自 GB/T 4458.4 5.2 与 GB/T 38762.1 6.1.2；1996/2012 两版 GB/T 16675.2 表1均列直径符号。DXF 控制码、gdt.shx 字母映射与OCR变体为通用CAD实践。"
