[[constraints]]
id="semantic_numeric_exact_integer"
requirement="req_semantics"
module="semantic_numeric"
check="apply_integer"
rust_path="crates/semantica-numeric/src/lib.rs"
statement="BigInt add/subtract/multiply/unary operations remain exact within explicit resource budgets. They do not acquire Decimal precision rounding or an implicit per-operation integer text limit. This primitive multiplication is not a claim that RDFLib multiplicative chains use integer arithmetic."
severity="error"

[[constraints]]
id="semantic_numeric_representation"
requirement="req_semantic_platform"
module="semantic_numeric"
check="parse_decimal_exact"
rust_path="crates/semantica-numeric/src/lexical.rs"
statement="Finite Decimal retains independent sign, BigUint coefficient and BigInt exponent; zero sign and coefficient trailing zeros are observable. Construction is exact without context rounding. Saved arithmetic results are passed as numeric values, never fixed-formatted and reparsed to recover state; this core transport is not an RDF per-cell cache implementation."
severity="error"

[[constraints]]
id="semantic_numeric_decimal_rounding"
requirement="req_semantics"
module="semantic_numeric"
check="apply"
rust_path="crates/semantica-numeric/src/decimal.rs"
statement="Each Decimal add/subtract/multiply/divide/unary operation uses the explicit HALF_EVEN context and the single finish owner. Precision and Etiny apply in one rounding, including carry, scale, signed underflow zero and subnormal-to-normal rounding. Division preserves the preferred exponent and nonterminating results; no f64 intermediate, reassociation or final-only rounding substitutes for per-step behavior."
severity="error"

[[constraints]]
id="semantic_numeric_signals_and_traps"
requirement="req_semantics"
module="semantic_numeric"
check="outcome"
rust_path="crates/semantica-numeric/src/lib.rs"
statement="Per-operation signals remain explicit and separate from numeric values. Untrapped outcomes preserve complete expected signal sets; configured traps return primary signal and no value. Complete trapped flags are a declared core contract, not observed C-backend parity. Invalid lexical input is mapped by context parse to InvalidOperation while resource failures remain resource failures. Exact explicit Binary64 conversion emits no signal; the separate constructor boundary emits FloatOperation before value conversion after context admission. Neither path supplies mixed arithmetic or persistent context flags."
severity="error"

[[constraints]]
id="semantic_numeric_nonfinite"
requirement="req_semantics"
module="semantic_numeric"
check="nan_result"
rust_path="crates/semantica-numeric/src/decimal.rs"
statement="Infinity sign and NaN sign/signaling/payload are retained. Signaling NaN precedes quiet NaN, left precedence is stable, and payload truncation follows context. Invalid operations, ordinary division by zero, Infinity/zero and finite/Infinity retain their distinct results and signals; specials are not narrowed to a finite-integer approximation."
severity="error"

[[constraints]]
id="semantic_numeric_decimal_lexical"
requirement="req_semantic_platform"
module="semantic_numeric"
check="parse_decimal_exact"
rust_path="crates/semantica-numeric/src/lexical.rs"
statement="Decimal syntax follows the pinned pure-Python constructor: Python strip precedes removal of all underscores, full input is consumed, Unicode decimal digits reuse semantic_json, and the reference Unicode case-insensitive Inf/NaN grammar is explicit. Scale, exponent and negative zero survive construction. C-backend constructor limits and process integer conversion settings are separate qualification boundaries."
severity="error"

[[constraints]]
id="semantic_numeric_integer_lexical"
requirement="req_semantic_platform"
module="semantic_numeric"
check="parse_integer"
rust_path="crates/semantica-numeric/src/lexical.rs"
statement="Base-ten integer grammar is distinct from Decimal: underscores occur singly between digits, ASCII control whitespace U+001C through U+001F is refused, Unicode digits reuse the common table, and signs/underscores do not count toward the explicit text limit while leading zeros do. None or zero disables that text limit without disabling resource budgets."
severity="error"

[[constraints]]
id="semantic_numeric_fixed_format"
requirement="req_semantics"
module="semantic_numeric"
check="format_decimal_fixed"
rust_path="crates/semantica-numeric/src/lexical.rs"
statement="Fixed Decimal formatting introduces no new rounding, preserves fractional scale and negative zero, and prints a positive-exponent zero as0 or-0 without expansion. Infinity/NaN spelling preserves their state. Integer formatting retains arbitrary-precision digits. The legacy duration scientific/fixed display policy is a separate adapter and must not be replaced by this formatter."
severity="error"

[[constraints]]
id="semantic_numeric_resource_boundary"
requirement="req_semantic_platform"
module="semantic_numeric"
check="power10"
rust_path="crates/semantica-numeric/src/lib.rs"
statement="Input codepoints, coefficient size, output characters and materialized powers of ten have explicit budgets. Power-of-ten/output expansion is checked before requested expansion; huge underflow and distant addends use compact decisions. Arithmetic permits bounded two-input temporaries; check_digits uses a four-bits-per-digit precheck before exact text-length rejection, not an exact pre-allocation digit bound. Binary64 conversion has its own fixed finite temporary bound and then checks the resulting representation; the power-of-ten budget is not a power-of-five budget. Resource faults never become numeric traps or successful missing values."
severity="error"

[[constraints]]
id="semantic_numeric_duration_consumer"
requirement="req_semantics"
module="semantic_temporal"
check="normalize_months"
rust_path="crates/semantica-temporal/src/calendar.rs"
statement="The existing duration consumer delegates Decimal arithmetic to semantic_numeric while retaining its legacy Dec representation, display, split12 and failure propagation. Month division rounds HALF_EVEN to28 significant digits before exact floor; zero-sign projection and10000-byte input policy remain explicit. This migration does not connect the core to nullable query arithmetic or replace DatasetSession ownership."
severity="error"

[[constraints]]
id="semantic_numeric_compiled_source_owner"
requirement="req_semantic_platform"
module="design"
check="binding"
rust_path="crates/oe-design/src/provenance.rs"
statement="The same compiled source authority captures numeric Rust/manifest, retained source/license provenance, frozen-case adapter and public frozen fixture. The composed semantic_numeric owner depends on semantic_json, runtime depends on the numeric owner, and actual functions/tests map through real ggen inspection. Source-derived constants, current execution and engineering adoption remain different evidence."
severity="error"

