components = ["细双点画线（No.05.1.2），外形与实际位置的零件（粗实线）相同或简化。", "与实线零件绕同一转轴转过某角度，或沿导轨平移一段距离。", "常配角度或行程尺寸及轨迹线。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE with a double-dot linetype (PHANTOM, PHANTOM2, DIVIDE, ACAD_ISO05W100 or e.g. 双点画线), thin lineweight, layer 07 / 双点画线, colour magenta/pink (ACI 6)", "a rotated/moved copy of the part outline, or a second INSERT of the same block with a different rotation on the phantom layer", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一组双点画线围成的外形，与图中某粗实线零件外形全等或近似全等（经旋转/平移可重合）；变换的转动中心落在某孔或销的圆心上，常有角度尺寸。这是与相邻辅助零件（形状不同）区分的关键。"
