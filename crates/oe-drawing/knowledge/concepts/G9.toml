recognition = "以同一行（纵坐标相同）出现“标记”“处数”“分区”“更改文件号”中至少三项的文字为锚点，其上方几行即更改记录；行内若有标记字母、处数、文件号和日期，说明图样曾经更改。与签字区（设计、审核、工艺、批准）和明细栏表头（序号、代号、名称）区分。"
