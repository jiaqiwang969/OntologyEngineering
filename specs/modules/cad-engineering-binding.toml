[[constraints]]
id="cad_engineering_exact_binding2"
requirement="req_delivery"
module="engineering"
check="record"
rust_path="crates/oe-engineering/src/design_attempt/cad_binding.rs"
statement="显式record2先重读完整Project/work3和原CAD packet，复用workflow::verify_project_binding及CAD source校验；object/context/condition正文与全部有序acceptance精确一致。reference_only/development_replay/intent unknown必保留，不改旧/1独立intent或合法IRI。缺件/漂移/同rev修改/重排/伪focus/伪独立资格拒绝；未核nativeadapter与正式review保持not_run。文件16MiB/集合64MiB、原source streaming预算及新focus8KiB载荷独立有界。"
severity="error"

[[constraints]]
id="cad_engineering_reversible_focus2"
requirement="req_delivery"
module="kernel"
check="bind_cad_focus"
rust_path="crates/oe-kernel/src/project/cad_focus.rs"
statement="kernel唯一构造ValidatedCadFocus（无Deserialize/公开构造字段），对完整原Project字节、原ObjectIdentity及原ProjectReviewContext重核；oev2.cad-engineering-focus-context/2 canonical JSON全部UTF8以小写hex附urn:oev2:cad-engineering-focus:2:，不截断hash、不归一化ID。严格decode再canonical全字段比较；condition链接声明核验与物理/正式审查分开。record2实际消费该值并在终态前重新核当前原件。"
severity="error"

[[validations]]
id="verify_cad_engineering_binding2_sources"
module="engineering"
constraint="cad_engineering_exact_binding2"
behavior="cad_engineering_record2_preserves_all_requirements_and_refuses_source_mismatch"
rust_path="crates/oe-engineering/tests/cad_engineering_binding.rs"
oracle="冻结实际参考件完整8验收及原Project/work/native packet；任意Project同rev决策/adopted或condition正文改动、另对象scope、完整要求缺失重排改字、源SHA/原pointer错误和参考伪装独立都拒绝。原unknown保留，关联完成不授予native/review/采用，原1不变。"
scope="有限本地软件关联，完整native证据adapter、正式semantic review和工程条件仍开放"

[[validations]]
id="verify_cad_engineering_focus2_reversal"
module="kernel"
constraint="cad_engineering_reversible_focus2"
behavior="cad_engineering_focus2_raw_ids_are_lossless_and_current_bound"
rust_path="crates/oe-kernel/tests/cad_engineering_focus.rs"
oracle="独立冻结UTF8 canonical映射；plain及Unicode/control原ID不改写且decode同值；所有context/Project原SHA变更产生不同focus，uppercase/非canonical/错误prefix/超8KiB拒绝。原/1合法IRI/current-condition行为原样运行。"
scope="有源声明身份与condition文本关联，不认证物理法则或CAD工程通过"


# Publication continuation after independently reproduced source-record defects.
# The same owner reconstructs exact required file bytes and full terminal; a
# resigned inventory cannot omit saved Project/work/artifact/declaration files
# or change unknown/false/not_run statements. Supplied CLI identity records
# prove only recorded consistency; real CLI checks its actual execution owner.
# A bounded pretty-JSON writer meters selected borrowed claim envelopes before
# subtree copies. Every proposed core file and completed.json is bounded16MiB
# per-file/64MiB collection before directory creation. CLI /2 adds the complete
# four existing outer files to this same preflight and retains terminal-last
# source/executable checks; original /1 publication semantics remain.
# Revalidation requires exact core inventory and bytes, either no outer files
# or all four valid source-bound CLI records; unexpected/missing/nonregular
# files fail. u64 indices use checked usize conversion, no32bit truncation.


# Bounded CAD correspondence /1 continues the same CAD/Project source owner.
# Merged from the separately frozen initial fragment to retain the original
# design-composition limit of 32 total files, including its root.
# Source-bound correspondence; original CAD/evidence/Project contracts remain.

