[[concepts]]
id = "DC-G5-112"
name = "被测要素指引"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "制图教材的总则：框格指引线以箭头连接被测要素；被测要素为轮廓线或表面时箭头指在轮廓线或延长线上并与尺寸线明显错开，也可指在由表面引出的引出线水平线上；为中心线、中心面或中心点时箭头位于相应尺寸线的延长线上。"
components = ["指引线可从框格任意一侧引出，终端为箭头", "轮廓要素：箭头在轮廓或延长线上，错开尺寸线；或在引出线的水平线上", "中心要素：箭头与尺寸线对齐（如螺纹 M8×1 轴线的同轴度）"]
variants = ["轮廓要素（与尺寸线错开）", "中心要素（与尺寸线对齐）", "引出线水平线"]
dxf_forms = ["LEADER/QLEADER with TOLERANCE annotation", "exploded LINE + SOLID arrowhead", "MLEADER with frame block content"]
recognition = "按箭头尖位置分类：在轮廓或其延长线上、与尺寸线错开→组成要素（DC-G5-108/110）；与尺寸线共线→导出要素（DC-G5-107/109）；在一条水平引出线上→沿该引出线回到其所引自的表面。"
confusions = ["尺寸线终端箭头", "表面结构符号的指引线：末端连接表面结构符号而非框格"]
