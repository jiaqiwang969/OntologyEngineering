[[concepts]]
id = "DC-G9-006"
name = "试验注语"
aliases = []
group = "G9"
kind = "note"
meaning = "技术要求中规定试验和检验的注语，如压力试验（在×MPa压力下保持×min不得渗漏）、焊缝气密性检查、装配后按某标准进行性能、寿命或可靠性试验、空载试验等。"
components = ["试验对象：零件、焊缝、密封处或整个部件。", "试验条件：压力值（MPa）、保压时间（min）、试验介质，或引用的试验标准号。", "合格判据：不渗漏、不漏气、运行平稳、响声均匀等。"]
variants = ["压力试验", "气密性检查", "性能/寿命/可靠性试验"]
dxf_forms = ["TEXT/MTEXT item in the 技术要求 block (layer 11); pressure written as '0.6MPa' or '0.6 MPa'"]
recognition = "以“试验”“气密性”“压力下”“保压”“渗漏”“漏气”“漏油”或“按GB/T…进行…试验”为锚点，常与数值加“MPa”“min”同时出现。与材料性能要求（HRC、HBW、抗拉强度）区分，后者属于热处理或材料项。"
confusions = ["材料性能或硬度要求：HRC、HBW、N/mm²，属于材料或热处理。", "焊接工艺要求：焊接方法、焊条牌号等。"]
