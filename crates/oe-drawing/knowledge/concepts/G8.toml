[[concepts]]
id = "DC-G8-022"
name = "装配图中相同零、部件组的简化画法"
aliases = ["相同零件组简化画法"]
group = "G8"
kind = "simplified_representation"
meaning = "装配图中若干规格相同的零部件组（如多组螺钉连接），可只详细画出一组，其余各组只用细点画线表示其装配位置，并注出零部件组的总数，如“共3组”。"
components = ["一组按完整画法画出（螺栓、垫圈、螺母等）。", "其余位置只画细点画线中心线（轴线或十字中心线）表示装配位置。", "在详细画出的一组附近或其指引线上注总数，如“共3组”。"]
variants = []
dxf_forms = ["one full group of LINE/ARC/HATCH (or fastener INSERTs) plus CENTER-type LINEs (layer 05) at the other positions", "TEXT '共3组' near the detailed group or its leader"]
recognition = "以细点画线中心线群为锚点：若干等距或对称分布的中心线位置中，只有一个位置画有完整的零件组，其余位置只有中心线，且方向和长度与完整位置的中心线一致；附近有“共n组”文字，n等于位置数。缺少“共n组”时，可用位置数与明细栏数量（每组件数×n）互相印证。与零件图重复结构要素的区别：后者是同一零件内的孔、槽，用“n×”尺寸标注，不涉及多个零件。"
confusions = ["零件图中重复结构要素的简化：在同一零件内部，用n×尺寸。", "紧固件省略画法：所有位置都不画紧固件。", "空孔中心线或空白区域：没有完整画出的一组可对照。"]
related = ["DC-G8-018", "DC-G8-021", "DC-G3-134", "DC-G4-094", "DC-G1-044"]
