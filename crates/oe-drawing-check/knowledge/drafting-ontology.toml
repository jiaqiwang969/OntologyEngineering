[section_parameters]
# Algorithm ratios, not tolerances prescribed by the cited standards. Text height is the median;
# hatch spacing is a scale fallback, and absent scale leaves coverage unavailable.
coincidence_text_height = 0.015
sagitta_text_height = 0.003
interior_chord_text_height = 0.3
section_cutoff_area_ratio_max = 0.20
# A contour with no explicit DXF width uses the drawing text height as the nominal thick stroke
# witness.  The companion arrow rule is six arrow lengths per thick stroke, per the cited standard.
section_nominal_thick_stroke_text_height_ratio = 0.142857
section_arrow_length_in_thick_strokes = 6.0
# The visible continuation must expose at least half the contour stroke width.
section_visible_overrun_stroke_ratio = 0.50

