[package]
name = "oe-dist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
zip.workspace = true
toml = { version = "=1.0.6", default-features = false, features = ["parse", "serde", "std"] }
oe-core.workspace = true
oe-contracts = { path = "../oe-contracts" }
oe-wire.workspace = true
oe-semantic.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(windows))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(windows)'.dependencies]
oe-windows-controller.workspace = true
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
