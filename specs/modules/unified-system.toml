requirement="req_delivery"
module="engineering"
check="commit"
rust_path="crates/oe-engineering/src/project_workspace/mod.rs"
statement="Explicit request/commit /6 keeps the /5 source profile and bounds the complete history read from the head on every resume and commit by 1024 commits, 256 MiB of commit bytes and 256 MiB of archived Project/review bytes; /1 through /5 keep 1024 commits and 64 MiB. Resume uses the head's own profile; commit validates the parent chain under the new request's profile, so a smaller profile cannot carry a larger history, and refuses before writing any file when the new head would exceed its budget. History budget failures are reported by name. Every commit, request, correction, source and obligation is preserved; nothing is compacted or rewritten."
severity="error"

