kind = "dimension_element"
meaning = "在不反映真实大小的投影上直接注出要素的真实尺寸时，在尺寸数值下方加画一条粗实线短画，提示该值不是从此投影量得的长度；属于简化注法，可省去另画斜视图。"
components = ["被注要素：在本视图中因倾斜而变形的结构，如折弯件斜翼上孔的半径或斜面上的长度。", "尺寸：用普通尺寸线或指引线注出真实值（如R9）。", "粗短画：粗实线，画在数字正下方，长度约等于数字宽度。", "GB/T 16675.2-1996与2012版表2第5.10条内容相同。"]
