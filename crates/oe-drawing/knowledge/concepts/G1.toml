[[concepts]]
id = "DC-G1-032"
name = "波浪线"
aliases = []
group = "G1"
kind = "line"
meaning = "徒手画出的细实线连续曲线（01型实线的变形），用作断裂处边界线以及视图与局部剖视的分界线。"
components = ["线宽同细实线，形状为不规则的平缓波浪。", "应画到轮廓线为止，只能画在表示实体的图形上，不得超出轮廓，也不得穿越孔、槽等中空处。", "不应与轮廓线重合，也不应画在轮廓线的延长线上。", "CAD 分层归02层（与细实线、双折线同层），屏幕显示为绿色。"]
variants = []
dxf_forms = ["SPLINE entity (often degree 3 with fit points)", "LWPOLYLINE with bulges or many small segments", "thin lineweight on layer 02, colour green", "an edge of a HATCH boundary path (spline or polyline edge type) in local sections", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为 SPLINE 或曲率不规则的细线多段线，端点落在粗实线轮廓上（距离小于线宽的数倍）。判据：曲线不对称、无确定圆心（拟合圆弧残差大）、波幅约1~3 mm；一侧有 HATCH 时为局部剖分界线，成对且之间轮廓缺失时为断开边界。与规则波浪线（等幅等距）、相贯线（粗实线规则曲线）和细实线曲线轮廓（如重合断面）区分。"
confusions = ["双折线：带Z形折的直线。", "规则波浪连续线：等幅等周期，属其他专业用线。", "手绘相贯线：粗实线，端点在两立体轮廓交点。", "曲线轮廓：粗实线，构成零件外形。", "普通细实线：直线或规则曲线。"]
related = ["DC-G1-029", "DC-G1-011", "DC-G1-043", "DC-G2-023", "DC-G2-041"]
