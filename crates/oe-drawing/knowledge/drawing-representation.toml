[[cards]]
id = "gdt_characteristic"
expression_kind = "geometric_tolerance"
title = "几何特征符号"
meaning = "GB/T 1182-2018 表1 的十四个几何特征符号：形状公差（直线度、平面度、圆度、圆柱度、线轮廓度、面轮廓度）、方向公差（平行度、垂直度、倾斜度）、位置公差（位置度、同轴度、对称度）和跳动公差（圆跳动、全跳动）。符号写在公差框格第一格，决定公差的种类。"
sources = [
  "GB/T 1182-2018 产品几何技术规范 几何公差 表1、第17章",
  "GB/T 1184-1996 形状和位置公差 未注公差值 5",
  "机械制图（第7版）表9-9",
  "互换性与测量技术 表3.1",
]
knowledge_units = ["K23", "K24", "K25"]
recognition = "在框格第一格中按笔画特征识别（先认闭合箭头：多段线、实心三角形或三条首尾相接的直线画的箭头，其边不算笔画）：一条横线为直线度，平行四边形为平面度，一个圆为圆度，圆加两条平行切线为圆柱度，开口圆弧为线轮廓度，圆弧加弦为面轮廓度，两条平行斜线为平行度，竖线立在横线中点为垂直度，横线与斜线成锐角为倾斜度，圆加十字为位置度，两个同心圆为同轴度，三条平行线中间最长为对称度，一支斜箭头为圆跳动，两支斜箭头立在底线上为全跳动。也可写成 Unicode 字符或 GD&T 字体字母（字体对应为通用 CAD 实践）。笔画特征与种类的对应从本卡读取。"
markers = ["⏤", "⏥", "○", "⌭", "⌒", "⌓", "∥", "⊥", "∠", "⌖", "◎", "⌯", "↗", "⌰"]
concepts = ["DC-G5-076", "DC-G5-061", "DC-G5-055", "DC-G5-056", "DC-G5-077", "DC-G5-082", "DC-G5-060", "DC-G5-058", "DC-G5-042", "DC-G5-041", "DC-G5-054", "DC-G5-059", "DC-G5-057", "DC-G5-045"]

[[cards.components]]
role = "glyph"
primitives = ["LINE", "CIRCLE", "ARC", "LWPOLYLINE", "INSERT", "TEXT"]
requirement = "框格第一格中的特征符号"

[[cards.variants]]
id = "characteristic_symbol"
title = "笔画画出的特征符号（图块或散线）"
distinguishing = "按笔画特征"
encodings = ["block", "loose"]
tests = ["every_characteristic_stroke_signature_gives_its_kind", "flatness_frame_with_stroke_glyph_block"]

[[cards.variants]]
id = "text_glyph"
title = "文字写出的特征符号"
distinguishing = "Unicode 字符或 GD&T 字体字母"
encodings = ["text"]
tests = ["characteristic_written_as_text_glyph"]

[[cards.variants]]
id = "drawn_arrow_head"
title = "箭头画成三条直线或实心三角形"
distinguishing = "斜线一端的闭合箭头由三条首尾相接的直线或一个实心三角形（SOLID）画成；箭头的三条边不算笔画，先认箭头再判别：带箭头的一条斜线是圆跳动，不是直线度"
encodings = ["loose", "block"]
tests = ["runout_glyph_with_a_head_of_three_lines", "runout_glyph_with_a_filled_head_in_a_line_frame"]

[[cards.counter_examples]]
statement = "直角矩形不是平面度的平行四边形"
test = "right_angle_rectangle_is_not_flatness"

[[cards.counter_examples]]
statement = "表面结构符号的 60° 折线不是倾斜度"
test = "roughness_v_is_not_angularity"

[[cards.counter_examples]]
statement = "框格第一格中没有闭合箭头的一条斜线不是圆跳动（三条线不首尾相接时不是箭头）"
test = "oblique_stroke_without_a_head_is_not_runout"

