meaning = "在不致引起误解时，视图中不反映实形和实角的倾斜结构部分可以省略不画，其实形另用斜视图等表达。"
components = ["基本视图中倾斜部分的投影被省去，只保留反映实形的部分。", "倾斜结构的实形用斜视图（带字母的投射箭头和同名视图）或局部视图表达，并在其上标尺寸。", "省略处常以波浪线或断裂边界线收边。"]
