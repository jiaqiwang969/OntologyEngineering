kind = "dimension_element"
meaning = "断续焊缝的纵向尺寸，写在基本符号右侧：焊缝段数n×每段长度l，再在圆括号内写相邻焊缝间距e，如4×50(30)；段数无严格要求时可省略n，写成l(e)。"
components = ["n×：焊缝段数加乘号。", "l：每段焊缝长度。", "(e)：相邻两段焊缝的间距，写在圆括号内。", "位置：基本符号右侧，与左侧横向尺寸（如焊脚K）同在符号所在一侧；对称断续焊缝可两侧各注或只注一次。", "省略：段数无严格要求时可省去n（GB/T 12212 6.4）。"]
variants = ["n×l(e)", "l(e) with n omitted", "symmetric intermittent with values both sides"]
dxf_forms = ["TEXT/MTEXT such as '4×50(30)' or '4x50(30)' placed right of the basic symbol, baseline 0.5–1 mm from the reference line", "ATTRIB in a weld-symbol block, sometimes split into separate TEXT for 'n×l' and '(e)'"]
recognition = "锚点为焊缝基准线上的基本符号；其右侧紧邻文字匹配“数字×数字(数字)”或“数字(数字)”（×可为x/X）。只有与基准线平行、距离小于1倍字高时才判为断续焊缝尺寸；远离基准线的同型文字可能是孔组或链式尺寸。交错断续时n×l与(e)之间夹有Z形符号。"
confusions = ["螺纹、链式或孔组的n×P、n×L、n×Ød：不依附焊缝基准线，且常含Ø。", "点焊或塞焊的n×(e)：没有段长l，符号为圆或⊓。", "焊缝定位尺寸L：是视图上的DIMENSION实体，不在符号右侧。"]
