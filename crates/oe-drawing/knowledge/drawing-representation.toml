[[cards.variants]]
id = "cutting_plane_group"
title = "剖切符号整组：粗短画、垂直箭头与相同字母（含转折）"
distinguishing = "两条以上粗短画（线宽明显大于箭杆）在同一剖切路径上（共线，或在转折处共一端点）；起讫短画外端各有一支垂直于短画的箭头；各端（及转折处）注同一大写字母。转折成直角为几个平行剖切面（阶梯剖），在视图中心转成斜角为几个相交剖切面（旋转剖）。可以是一个图块，箭头可为实心三角或填充"
encodings = ["block"]
tests = ["cutting_plane_symbol_block_names_its_section", "aligned_cutting_plane_block_with_a_turn"]

[[cards.variants]]
id = "detail_indicator"
title = "局部放大部位的细实线圈与标号"
distinguishing = "一个细实线圆圈住被放大的部位，从圆上引出的指引线（可带水平基准线）末端注罗马数字或大写字母；同一标号再出现在局部放大图的名称中"
