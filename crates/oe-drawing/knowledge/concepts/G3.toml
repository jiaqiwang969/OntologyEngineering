[[concepts]]
id = "DC-G3-092"
name = "花键工作长度终止端与尾部画法"
aliases = []
group = "G3"
kind = "line"
meaning = "外花键平行于轴线的视图中，用与轴线垂直的细实线分别标出工作长度的终止端和尾部长度的末端，尾部画成与轴线约成30°的斜线。GB/T 4459.3—2000规定两端均用细实线，而ISO 6413的工作长度终止端用粗实线。"
components = ["工作长度终止端：一条垂直于轴线、跨越大径的细实线。", "尾部末端：另一条垂直于轴线的细实线，位于终止端外侧。", "尾部：小径细实线在终止端之后以约30°斜线收向大径，必要时按实际形状画。", "版本差别：GB/T 4459.3—2000两端都为细实线；ISO 6413及按ISO绘制的图纸中工作长度终止端为粗实线。"]
variants = ["GB/T 4459.3—2000：终止端与尾部末端均用细实线", "ISO 6413：工作长度终止端用粗实线"]
dxf_forms = ["Two short LINEs perpendicular to the axis on thin layer 02, length ≈ major diameter, at the end of the spline zone", "Inclined thin LINEs at ~30° to the axis, mirrored about the axis, joining the minor-diameter thin line to the tail-end line", "ISO-style drawings: the working-length end LINE on thick layer 01"]
recognition = "以外花键区为锚点：一对大径粗实线内侧有一对小径细实线（小径/大径约0.8～0.9），附近有显示齿形的断面图或花键标记（矩形花键或渐开线花键图形符号、EXT/INT字样）。沿小径细线走到花键末端，依次应出现：垂直轴线的细实线（终止端）→约30°细斜线→第二条垂直轴线的细实线（尾部末端）。区分螺纹：螺纹终止线为粗实线，螺尾30°细线之后没有第二条垂直线，且螺纹无断面齿形图；区分退刀槽：退刀槽边为粗实线台阶，轮廓下凹。"
confusions = ["螺纹终止线：粗实线，且其后螺尾无第二条垂直线。", "螺尾30°细实线：属螺纹，没有尾部末端线。", "退刀槽边界或轴肩：粗实线且轮廓直径发生变化。"]
related = ["DC-G3-040", "DC-G3-086", "DC-G3-093", "DC-G3-094", "DC-G3-031", "DC-G3-186", "DC-G3-181", "DC-G4-139"]
