[[concepts]]
id = "DC-G9-009"
name = "铸件技术要求注语"
aliases = []
group = "G9"
kind = "note"
meaning = "铸件零件图技术要求中对铸造质量和铸后处理的说明，如不得有砂眼、缩孔、裂纹，铸件尺寸公差按某标准，起模斜度，非加工面粗糙度与涂漆，精加工前人工时效，清砂，铸出的文字和标志应清晰等。"
components = ["缺陷要求：铸件不得有砂眼、缩孔、裂纹等缺陷。", "公差与斜度：铸件尺寸公差按××，铸件起模斜度不大于××。", "处理：铸件应经时效处理、精加工前进行人工时效、清砂处理、热处理后喷砂。", "非加工面：涂××底漆、复涂××磁漆，粗糙度、褶皱深度要求；铸字和标志应清晰。", "常与“未注铸造圆角R×”一起出现，材料多为HT、QT、ZG、ZL等铸造牌号。"]
variants = ["起模斜度", "铸件尺寸公差按 ×", "非加工表面涂底漆/磁漆", "人工时效"]
dxf_forms = ["TEXT/MTEXT items in the 技术要求 block (layer 11)"]
recognition = "以关键词“铸件”“铸造”“砂眼”“缩孔”“时效”“起模斜度”“清砂”为锚点；标题栏材料栏中的铸造牌号（HT200、QT450-10、ZG230-450、ZAlSi12等）作旁证。与锻件要求（锻件、锻透、折叠、白点）区分。注意“时效处理”也属热处理，在铸件图中通常与铸件条目同列。"
confusions = ["锻件技术要求注语：主语是锻件。", "热处理注语：时效也是热处理，需看主语和材料判断。"]
