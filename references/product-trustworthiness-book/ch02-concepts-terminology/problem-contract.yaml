identity_decision_boundary:
  allowed_outcomes:
    - Same
    - Different
    - Unknown
  same_requires:
    - compatible_entity_type
    - compatible_identity_criterion
    - declared_scope_and_time
    - source_and_bridge_evidence
    - conflict_disposition
  different_requires:
    - declared_mutually_exclusive_entity_types_with_incompatible_identity_criteria
    - or_positive_distinguishing_evidence
  unknown_when:
    - entity_type_missing
    - boundary_or_persistence_condition_missing
    - bridge_evidence_missing
    - source_conflict_unresolved
  prohibited_defaults:
    - same_string_implies_same_entity
    - different_string_implies_different_entity
    - high_similarity_implies_strong_identity
    - missing_identity_link_implies_false

