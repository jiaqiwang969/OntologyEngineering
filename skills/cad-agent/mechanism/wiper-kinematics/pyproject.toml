[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiper-kinematics-validation"
version = "0.1.0"
description = "Private validation port of archived MATLAB wiper-linkage kinematics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
wiper-kinematics-validate = "wiper_kinematics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wiper_kinematics*"]

