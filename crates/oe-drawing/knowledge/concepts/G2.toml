[[concepts]]
id = "DC-G2-025"
name = "按剖视图绘制的移出断面"
aliases = []
group = "G2"
kind = "section"
meaning = "剖切平面通过回转形成的孔或凹坑的轴线时，或通过非圆孔会使断面完全分离时，这些结构在移出断面中按剖视图要求画出，即把孔、坑在剖切面后的轮廓也画出。"
components = ["移出断面轮廓：粗实线。", "孔或凹坑处：按剖视画出孔壁、锥坑底等剖切面后的可见轮廓（不画剖面线）。", "剖面线：只画在实体切口区。", "标注：与移出断面相同。"]
variants = ["through hole or recess axis", "through non-circular hole"]
