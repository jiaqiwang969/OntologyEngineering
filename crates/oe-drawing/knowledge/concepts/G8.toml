[[concepts]]
id = "DC-G8-001"
name = "化工设备管口旋转画法"
aliases = []
group = "G8"
kind = "conventional_representation"
meaning = "化工设备、锅炉等装配图中，接管口等结构的方位已在其他图形（俯视图或管口方位图）中表达清楚时，可把它们分别旋转到与投影面平行后再投影，使管口的高度位置和伸出长度在主视图中按真实大小画出，但圆周方位不再是真实投影；必须加标注。"
components = ["主视图中被旋转画出的接管、法兰轮廓（粗实线），伸出长度与法兰按真实尺寸，圆周方位不是真实投影位置。", "每个管口在主视图和表示方位的视图中注同一个小写字母（a、b、c…），用字母对应作为该画法的标注。", "表示方位的视图（俯视图或管口方位图）按真实角度画出各管口位置并注相同字母。", "同一条文还允许用细点画线表示锅炉、化工设备中密集的管子。"]
variants = []
dxf_forms = ["nozzle and flange outlines as exploded LINE/ARC/LWPOLYLINE on layer 01 (thick)", "nozzle letters as single lowercase TEXT/MTEXT (a, b, c…) near each nozzle in both views, usually layer 11", "dense tubes as LINE with CENTER-type linetype on layer 05"]
recognition = "以成对出现的小写字母为锚点：同一字母在主视图管口旁和另一视图（俯视/方位图）管口旁各出现一次，字高与尺寸字高相近；再检查主视图中管口位置与方位视图的真实角度是否不符（如方位图中管口在45°方向而主视图画在正侧面）。没有成对字母时按普通投影处理。与旋转剖的区别：旋转剖有剖切符号、箭头、“X—X”名称和剖面线，而本画法不需要剖切，只靠字母对应。"
confusions = ["真实投影：管口位置与方位视图保持投影关系，且没有成对的管口字母。", "旋转剖（几个相交剖切面）：有剖切符号与X—X名称，表达零件内部结构；管口旋转画法是外部结构的方位转换。", "管口表中的字母：在表格单元格内，不在视图上。"]
related = ["DC-G2-016", "DC-G3-126", "DC-G1-044"]
priority = "rare"
text_forms = ["a", "b", "c"]
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "图A.16 页 OCR 几乎无文字，字母对应的标注细节读自页面图像；“管口方位图”的称呼来自化工设备制图的一般惯例。"
