[[concepts]]
id = "DC-G3-057"
name = "螺纹退刀槽"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "车削螺纹时为便于退刀、避免螺尾而在螺纹末端预先车出的环形槽；外螺纹在螺纹根部台肩处，内螺纹在螺纹终了的孔内。"
components = ["外螺纹退刀槽：位于螺纹终止处靠台肩一侧，槽底直径略小于螺纹小径，槽宽约2–3倍螺距，槽侧可带30°/45°/60°斜边和圆角。", "内螺纹退刀槽：位于螺孔末端，槽底直径略大于螺纹大径。", "主视图中画成轮廓上的小台阶或凹槽，常用局部放大图表示；尺寸注“槽宽×直径”或“槽宽×槽深”，尺寸按GB/T 3选取。", "装配图中退刀槽可省略不画。"]
variants = ["外螺纹退刀槽", "内螺纹退刀槽"]
dxf_forms = ["rectangular notch of thick LINEs in the outline next to the thread end (external) or beyond it (internal); may include short chamfer LINE and fillet ARC", "DIMENSION with override text such as '2×%%c8' or '2×1' (width×diameter / width×depth), or detail view with label 'I 5:1'", "in sections HATCH follows the groove outline", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为螺纹段（大径粗线+小径细线）末端紧接的一个环形凹槽：外螺纹槽底线低于小径细实线（槽底径约d−1.5P～d−2P），槽宽约2–3个螺距，槽另一侧为台肩；常带“b×Ø”或“b×h”格式的文字。螺纹的粗实线终止线通常与槽的起始边重合或紧邻。与砂轮越程槽区分：越程槽很浅（h≤约1 mm）、在磨削面与台肩的内角、不与螺纹相邻；与普通轴肩台阶区分：台阶只降一级不回升，槽两侧都回到较大直径。"
confusions = ["砂轮越程槽：浅、在磨削面根部，不在螺纹旁。", "轴肩台阶：只有一级直径变化，没有回升的另一侧。", "挡圈槽：位于光轴段，槽宽小且有挡圈规格。"]
related = ["DC-G3-041", "DC-G3-094", "DC-G3-093", "DC-G3-054", "DC-G4-093", "DC-G8-023", "DC-G2-075"]
priority = "high"
