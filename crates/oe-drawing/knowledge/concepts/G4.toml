[[concepts]]
id = "DC-G4-045"
name = "埋头孔符号 ⌵"
aliases = ["埋头孔符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "埋头孔（锥形沉头孔）符号为左右对称、两边夹角90°的开口V形⌵，写在孔旁注中锥口直径之前，后接“×锥角”（如⌵Ø10×90°），表示孔口加工成锥形沉头座。"
components = ["符号：两条对称斜线组成的V形，夹角90°，高约h，线宽h/10。", "旁注结构：指引线从孔的轴线与端面交点（或圆视图的圆）引出，基准线上第一行写“n×Ød”，第二行写“⌵ØD×90°”。", "简化前的注法：在剖视图中分别注出锥口直径和90°角。", "GB/T 16675.2-1996与2012版表1均列此符号；2012版表2 5.17给出旁注示例。"]
variants = ["⌵Ø×angle in hole note"]
dxf_forms = ["MTEXT two lines on a LEADER/MULTILEADER: '6×%%c6.5\\P{\\Fgdt;w}%%c10×90%%d' (gdt.shx 'w' = countersink)", "TEXT in a gdt.shx-based style using character 'w'", "MTEXT Unicode '\\U+2335' (⌵) with a font that has the glyph", "exploded: two short LINE strokes forming a 90° V before the TEXT, or INSERT of a countersink-symbol block", "layer 08/09 or template dimension layer"]
recognition = "锚点为孔旁注：指引线＋水平基准线＋一或两行文字，首行含n×Ø。在第二行行首找V形符号：gdt字体字符w、U+2335，或两条等长细线成90°的V（高≈h，底点在文字基线），OCR常读作“V”“√”“八”。其后跟Ø值和“×90°”（或其他锥角）。几何佐证：剖视中孔口为锥形扩口，或圆视图中有同心的较大圆。排除：表面结构符号√一长一短且附Ra值；倾斜度∠位于公差框格首格；锥度▷为闭合三角形。"
confusions = ["表面结构符号√：两边不等长、夹角60°，附Ra/Rz数值，不在孔旁注中。", "字母V：文字中的V无90°几何、不在Ø前。", "倾斜度∠：位于几何公差框格首格。", "锥度符号▷：闭合三角形，用于圆锥。", "深度符号↧、沉孔符号⌴：形状不同，常与本符号同在旁注中。"]
related = ["DC-G4-088", "DC-G4-051", "DC-G4-052", "DC-G4-094", "DC-G4-077"]
priority = "medium"
text_forms = ["6×Ø6.5 ⌵Ø10×90°", "⌵Ø12.8×90°", "4×Ø5.5 ⌵Ø10×90°"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Proportions (90°, height h, line width h/10) from the GB/T 4458.4-2003 图A.1 page image and textbook 表1-6; OCR renders the symbol as √/V/八 and 埋头 as 堙头. gdt.shx and Unicode mappings are general practice."
