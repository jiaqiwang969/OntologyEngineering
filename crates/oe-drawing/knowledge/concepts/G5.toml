[[concepts]]
id = "DC-G5-110"
name = "被测要素为轮廓要素时的指引线与指示箭头"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "教材的说法：被测要素为轮廓线或轮廓面时，从框格一端（或任意边）引出的指引线以箭头直接指向该要素的轮廓或其延长线，并与尺寸线明显错开。"
components = ["指引线一般从框格一端的中部引出，也可从框格任意位置水平或垂直引出", "箭头落在轮廓线上或其延长线上", "箭头与该要素的尺寸线明显错开"]
