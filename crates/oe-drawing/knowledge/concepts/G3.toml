[[concepts]]
id = "DC-G3-054"
name = "螺纹末端倒角与倒圆"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "螺纹起始端为便于装配和保护首扣而加工的倒角或倒圆，画在螺纹件轮廓上；外螺纹的牙底细实线要延伸画入倒角或倒圆部分。"
components = ["外螺纹端部倒角：通常45°（也有30°/60°），倒到略小于螺纹小径；倒圆为端部圆弧过渡。", "外螺纹牙底（小径）细实线一直画到端面，穿过倒角区。", "内螺纹孔口倒角：常为120°或90°锥面（埋头式），剖视中可见。", "垂直于轴线的端视图中倒角圆省略不画。"]
variants = ["外螺纹倒角", "外螺纹倒圆", "内螺纹倒角"]
dxf_forms = ["short thick LINEs at 45° (or 30°/60°) cutting the corners at the shaft end; thin minor-diameter LINE running through to the end face", "internal: two thick LINEs forming a 90° or 120° countersink at the hole mouth in section", "chamfer dimension via leader MTEXT 'C1' / DIMENSION override, or angular+linear dimensions", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为螺纹段端部的短斜粗实线（与轴线成45°等），斜线内端落在小径附近；同一端有一条细实线（牙底线）平行轴线并延伸到端面、与斜线相交。端视图中只有粗实线大径圆和约3/4圈细实线小径圆，没有倒角圆。与普通倒角区分：普通轴端倒角没有穿过倒角区的细实线；与螺纹终止线区分：终止线垂直于轴线且在螺纹另一端。"
confusions = ["非螺纹轴端的倒角C：没有牙底细实线穿过。", "螺纹终止线：垂直轴线的粗实线，在完整螺纹的结束处。", "螺尾30°细斜线：在螺纹终止线外侧，是细线而非粗线。"]
related = ["DC-G3-024", "DC-G3-005", "DC-G3-091", "DC-G3-093", "DC-G3-094", "DC-G3-057", "DC-G4-040"]
priority = "high"
