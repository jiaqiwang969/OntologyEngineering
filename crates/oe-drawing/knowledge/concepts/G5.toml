[[concepts]]
id = "DC-G5-097"
name = "定向平面框格"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "画在公差框格右侧的两格辅助框格，左右两端都呈尖角；第一格写平行度、垂直度或倾斜度符号，第二格写基准字母，用来规定导出要素公差带构成平面（或圆柱公差带轴线）的方向，也用于说明矩形局部区域的方向。"
components = ["外形：两格等高矩形，左右两端各加一个三角形尖端（整体呈扁六边形）", "第一格：∥、⊥ 或 ∠；倾斜时须用 TED 给出夹角", "第二格：基准字母", "位置：紧贴框格右侧；有相交平面框格时排在其后，与方向要素框格不同时使用", "旧注法：二维图中省略定向平面框格、依靠尺寸线方向确定公差带方向（GB/T 1182-2018 A.2.4 不推荐）"]
variants = ["deprecated: omitted, direction taken from dimension line (GB/T 1182 A.2.4)"]
dxf_forms = ["exploded: LINE/LWPOLYLINE outline of the two cells (with the distinctive end shape) + LINE separator + glyph strokes (LINE) + TEXT datum letter, on the same layer as the frame (08 or a company annotation layer)", "INSERT of an indicator block placed flush against the right side of the frame (or of the previous indicator)", "rarely: Unicode glyph (∥ ⊥ ∠ ≡) in TEXT inside a drawn outline; the AutoCAD TOLERANCE entity has no native field for these indicators"]
recognition = "以框格右侧紧贴的两格小框为锚：其外轮廓左右两端都向外收成尖角（尖端到格边距离约 0.4–0.5H），第一格内是 ∥、⊥ 或 ∠ 笔画，第二格是字母。只有左端尖的是相交平面框格；左侧伸出箭头的是方向要素框格；左侧有圆的是组合平面框格。"
confusions = ["相交平面框格：只有左端是尖角", "仅方向修饰符 ><：写在第二格或基准字母后的文字", "基准格：普通矩形格，无尖端"]
related = ["DC-G5-103", "DC-G5-100", "DC-G5-105", "DC-G5-090", "DC-G5-085"]
priority = "rare"
text_forms = ["⊥ B", "∥ B"]
knowledge_units = ["K23", "K24", "K25"]
