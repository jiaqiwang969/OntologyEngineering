[[concepts]]
id = "DC-G3-064"
name = "透明件和网状物后的零件"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "透明材料做的零件按不透明画；装配图中通过供观察的透明件可见的零件及刻度、字体、指针、液面等按可见轮廓画；被网状物挡住的部分按不可见轮廓画。"
components = ["透明件本身：按普通不透明零件画出轮廓，其后方零件视为被遮挡。", "供观察用的透明件（视窗、液位计玻璃）后面的零件、刻度、字符、指针、液面：用粗实线可见轮廓画出。", "网状物（护网、筛网）后面的部分：用细虚线画出。", "透明件被剖切时可配合玻璃类剖面符号。"]
variants = ["transparent part as opaque", "parts behind inspection glass as visible", "parts behind a mesh as hidden"]
dxf_forms = ["Normal visible entities (thick LINE/ARC, TEXT) for scale ticks, pointer, liquid level and parts inside a window outline", "HIDDEN-linetype LINEs (layer 04) for parts behind a mesh, the mesh drawn as a grid of thin LINEs or a grid HATCH", "Glass section symbol HATCH (groups of short thin parallel strokes) on the transparent part when it is cut"]
recognition = "先识别遮挡体：透明件靠玻璃剖面符号、明细栏材料（有机玻璃、玻璃、PMMA、PC）或文字“视窗/观察窗/液位计”；网状物靠网格剖面或细实线网格。透明件轮廓内若有粗实线的等距刻度短线、指针、液面线或文字，判为“观察窗后按可见画”；透明件后方结构缺失或为虚线，判为“透明件按不透明画”；网格覆盖区内的后方零件用HIDDEN线型，判为“网后按不可见画”。没有透明件或网状物证据时，普通虚线不归入本概念。"
confusions = ["玻璃剖面符号：只表示透明材料被剖切，不涉及后方零件可见性。", "其他不透明零件造成的普通虚线：遮挡体不是透明件或网状物。", "格网剖面符号/网格线：网格本身是剖面符号或参考网格，不等于网后零件的画法。"]
