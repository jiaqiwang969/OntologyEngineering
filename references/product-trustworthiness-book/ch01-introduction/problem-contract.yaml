mirror_cq_drafts:
  - id: PTW-PC-01-CQ-01
    question: >-
      给定一条候选产品主张，它绑定哪些 subject、configuration、concern、context、
      time、assumption 与 decision scope；哪些必填区分仍然缺失？
    required_answer_form:
      - claim
      - subject
      - configuration
      - concern
      - context
      - time
      - assumptions
      - decision_scope
      - explicit_missing_set
  - id: PTW-PC-01-CQ-02
    question: >-
      给定一组证据，每一项与候选主张的关系是支持、反驳、超出范围还是未知；
      配置或情境不匹配的理由是什么？
    required_answer_form:
      - evidence
      - relation_to_claim
      - applicability_scope
      - mismatch_reason
      - provenance
  - id: PTW-PC-01-CQ-03
    question: >-
      只把软件从 SW1.8.3 改为 SW1.8.4 后，哪些主张、证据适用性和决定必须重开，
      哪些证据可经明确的无影响或差异理由继续适用？
    required_answer_form:
      - changed_configuration_dimension
      - reopened_claims
      - reopened_evidence_applicability
      - reopened_decisions
      - retained_evidence_with_reason

answer_acceptance:
  - 一条主张不能缺失 subject、configuration、concern、context、time、assumption 或 decision scope 而静默通过
  - 每项证据必须显式分类为 support、refute、out_of_scope 或 unknown，且绑定来源与适用边界
  - 文件存在、PASS 字符串和结构合规均不能自动产生 supports 关系
  - 软件单因变式必须精确返回重开集合，并允许有证据的保留而拒绝默认 keep_all 或 invalidate_all
  - ENV-01 必须使用独立个体且没有 ASIL、SafetyGoal 或 EPS 业务语义泄漏
  - 缺记录默认不得推断为 false；只有声明局部完整性边界后才可判定必填 Gap
  - 决定必须绑定授权角色、决定范围、时间和重开条件

not_answered_by_ch01:
  - ch11 的类层次、IRI、OWL 公理、SHACL、SPARQL、manifest 或 runner 实现
  - EPS-RC17 或 ENV-01 的任何真实产品事实
  - 任一 PASS 报告的真实技术充分性
  - 产品放行、风险接受、标准符合性或认证决定
  - 身份本体、治理本体或变化本体的实现

