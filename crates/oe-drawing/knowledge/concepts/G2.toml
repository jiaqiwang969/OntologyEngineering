[[concepts]]
id = "DC-G2-072"
name = "向视图（向视配置法）"
aliases = ["向视图"]
group = "G2"
kind = "view"
meaning = "可自由配置的视图：在视图上方用大写字母标出名称，在相应视图附近用箭头指明投射方向并注同一字母；也可在视图下方标出图名识别；旧图常写作“A向”。"
components = ["投射箭头：细实线带实心箭头，指向被视表面，旁注大写字母。", "视图名称：视图上方单个大写字母，与箭头字母相同。", "另一方式：每个视图下方标注图名（多见于建筑图）。", "旧注法：“A向”“B向”或“零件名+B向”。"]
variants = ["箭头+字母（如 A）", "视图下方标注图名", "current label: single capital letter, e.g. A", "older label form 'A向' / '零件名+B向' still seen (e.g. 泵盖B向 in GB/T 16675.1 Fig A.12)"]
dxf_forms = ["Arrow as LEADER/QLEADER without text, or LINE/LWPOLYLINE + SOLID head on layer 08/09; letter TEXT nearby", "View name TEXT, single capital letter (optionally with scale), on layer 11 above the view", "Older drawings: TEXT 'A向' or 'A 向'"]
recognition = "以位于某视图簇正上方的单个大写字母为锚点，全图另有同字母文字紧挨一支孤立的细箭头（箭头不连粗短画、不连尺寸线）；该视图不在基本视图规定位置或与主视图不对齐。箭头接在粗短画外端的是剖切符号；箭头倾斜于基本投影面且图形为倾斜结构的是斜视图。"
confusions = ["剖切符号与剖视名称A—A。", "斜视图：投射方向倾斜。", "按向视图配置的局部视图：标注方式相同，但只画局部。"]
related = ["DC-G2-073", "DC-G2-076", "DC-G2-080", "DC-G2-043", "DC-G2-065", "DC-G2-069", "DC-G2-071"]
priority = "high"
text_forms = ["A", "B", "A向", "泵盖B向"]
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = ["annotation_constituents", "view_callout", "view_mark_targets"]
recognizer = "partial"
seen_on_drawing = ["second"]
expert_checked = false
notes = "已在第二张图上出现。"
