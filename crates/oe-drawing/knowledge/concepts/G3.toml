[[concepts]]
id = "DC-G3-051"
name = "螺套画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "钢丝螺套和整体式螺套（嵌入螺孔、提供耐磨内螺纹的衬件）按一般螺纹件规则画出，可画在通孔或盲孔中，在不致误解时可简化为只表示螺纹并注INS。"
components = ["钢丝螺套：螺孔内画出螺套所形成的内螺纹（公称尺寸）及其与基体螺孔的关系，按螺纹规定画法用粗、细线表示。", "整体式螺套：画成带外螺纹和内螺纹的套筒，外螺纹与基体螺孔旋合部分按外螺纹画。", "简化表示：只画出最终的内螺纹，注螺纹代号加“INS”，如M30×1.5 INS；不需说明规格时也可只注INS。", "通孔和盲孔两种安装情况都有图例，装配前后均可表示。"]
variants = ["钢丝螺套画法", "整体式螺套画法", "螺套的简化表示法", "通孔中/盲孔中"]
dxf_forms = ["thread lines as for internal threads (thick minor, thin major LINEs / thin 3/4 ARC) inside a larger tapped hole outline", "designation MTEXT on leader or dimension override: 'M30×1.5 INS' or 'INS'", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "以含“INS”的文字为最强锚点；几何上为一个螺孔内再嵌套一层螺纹线（两组大小径线同心，外层为基体螺孔、内层为工作螺纹），或孔中有套筒截面带剖面线且其内外均有螺纹线。与普通内螺纹区分：普通螺孔只有一组粗细线，标记无INS；与衬套区分：衬套内外为光滑圆柱，无螺纹细线。"
confusions = ["普通内螺纹：单组粗细线，无INS。", "衬套：内外无螺纹线，常注配合公差。"]
related = ["DC-G3-005", "DC-G3-056", "DC-G3-228", "DC-G3-088"]
