recognition = "锚点：一条绕中心半径单调增大的平面螺旋曲线（SPLINE或多弧多段线，圈数≥3，圈距大致相等），内端连到小圆（芯轴），外端有钩或销孔。区分：阿基米德螺线凸轮只有单圈闭合轮廓并带轮毂孔；盘管为双线管且不连芯轴。"
