[[constraints]]
id="incad_source_bundle_preserves_selected_source_identity"
requirement="req_knowledge"
module="knowledge"
check="verify"
rust_path="crates/oe-knowledge/src/incad/bundle.rs"
statement="A separate inCAD source-bundle/v1 binds bounded shard JSON bytes, each tar.xz identity and every selected relative member SHA256/length. Root and descriptor JSON objects reject duplicate, unknown and missing keys. Explicit scope excludes browser captures, captures/jobs/runtime and private Projects; case browser-capture.json and runtime navigation paths cannot enter the restored layout. Original upstream manifests may retain entries absent from this selected delivery and are never rewritten. Verified means transport bytes and path inventory only; source closure, ontology, native CAD and engineering adoption remain unverified. It does not replace the two-catalog PDF source-pack or create a Project."
severity="error"

[[constraints]]
id="incad_source_bundle_bounded_safe_archive_recovery"
requirement="req_knowledge"
module="knowledge"
check="import"
rust_path="crates/oe-knowledge/src/incad/bundle.rs"
statement="Preflight all descriptors and global member paths before an import stage: root JSON at most 1 MiB, each descriptor at most 16 MiB and descriptor total at most 128 MiB; at most 256 shards, 16384 members per shard and 262144 total, each member at most 256 MiB, each compressed or expanded shard at most 4 GiB, compressed and expanded totals each at most 64 GiB. Reject lexical escapes, duplicate paths and file/directory prefix collisions. Shared bounded XZ/tar streaming checks every member identity, regular-file kind, inventory completeness, footer, trailing data and unchanged archive identity; it does not extract archive-supplied links or trust member names as destinations. Verify may use cleaned temporary staging but creates no restored library."
severity="error"

[[constraints]]
id="incad_source_bundle_publishes_only_complete_new_tree"
requirement="req_knowledge"
module="knowledge"
check="import"
rust_path="crates/oe-knowledge/src/incad/bundle.rs"
statement="Import requires an explicit new real directory below this skill's sources/misumi. Do not replace an existing destination. Copy verified members into one private stage, validate all shards before publication, recheck the staged bytes and input descriptor/archive identities, then publish the entire tree with the shared exclusive directory rename. Late malformed or changed input leaves no partial target and temporary staged files are cleaned. Current originals, old receipts, configuration and Projects are not modified; no symlink fallback, download, browser or model execution."
severity="error"

[[validations]]
id="incad_bundle_selected_transport_round_trip"
module="knowledge"
constraint="incad_source_bundle_preserves_selected_source_identity"
behavior="bundle_restores_exact_selected_files_without_rewriting_upstream"
rust_path="crates/oe-knowledge/src/incad/bundle.rs"
oracle="Verify two synthetic shards without creating a target; import restores exact selected pointer/CAD/upstream-manifest bytes, including the old path declaration inside the original manifest. Omitted browser capture remains absent; repeat import refuses overwrite; source bundle bytes stay unchanged and report retains source-closure not_run/engineering not_granted."
scope="Synthetic transport fixture; no real CAD, source graph, Project or platform-wide qualification"

[[validations]]
id="incad_bundle_cross_shard_path_preflight"
module="knowledge"
constraint="incad_source_bundle_bounded_safe_archive_recovery"
behavior="bundle_rejects_cross_shard_duplicates_and_file_directory_conflicts_before_staging"
rust_path="crates/oe-knowledge/src/incad/bundle.rs"
oracle="A duplicate member across shards and a child member below another declared file are rejected before creating an import stage or target."
scope="Synthetic adversarial inventories"

[[validations]]
