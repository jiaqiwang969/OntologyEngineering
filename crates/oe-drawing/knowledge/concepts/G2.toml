[[concepts]]
id = "DC-G2-021"
name = "单一剖切面获得的剖视图（含斜剖）"
aliases = ["斜剖"]
group = "G2"
kind = "section"
meaning = "用一个剖切面剖开机件所得的剖视图：最常用的是平行于某基本投影面的平面；剖切平面也可不平行于任何基本投影面（习惯称斜剖），这时剖视图按斜视图方式配置并标注。"
components = ["剖切符号：同一直线上的两段粗短画加箭头和字母；剖切面过对称面且按投影关系配置时可省略。", "斜剖：剖切符号倾斜于视图主方向；剖视图可按投影关系配置在箭头方向，也可平移，不致误解时可旋转并在名称旁加旋转符号。", "剖视结果：可为全剖、半剖或局部剖。"]
variants = ["plane parallel to a basic plane", "inclined single plane"]
dxf_forms = ["Two collinear thick strokes (LINE/LWPOLYLINE layer 01) with arrows and TEXT letters", "Inclined case: strokes at an oblique angle; section geometry and HATCH rotated by the same angle, or upright with a rotation symbol (180° ARC + arrowhead) beside the label TEXT"]
recognition = "以剖切符号为锚点：两段粗短画共线、无转折；斜剖时其方向与视图主方向不平行，对应剖视图的主方向与剖切线垂直（按投影关系配置），或视图已转正并在名称旁带旋转符号。结果带剖面区域，这一点区别于斜视图。"
confusions = ["斜视图：没有剖面线，用箭头加字母而不是剖切符号。", "阶梯剖：剖切符号有直角转折。"]
