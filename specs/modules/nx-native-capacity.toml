schema="oev2.design-fragment/2"
[[types]]
name="NxNativeTaskBudget"
contract_group="engineering"
identity="Explicit native job v3 input/output capacity bound into job digest"
meaning="完整原生任务的输入、输出、文件数与单段容量分别声明"

[[types.fields]]
name="max_input_bytes"
rust_type="u64"
required=true
format="typed"
meaning="输入闭包总量最多64GiB"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_input_file_bytes"
rust_type="u64"
required=true
format="typed"
meaning="输入单文件最多8GiB"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_output_bytes"
rust_type="u64"
required=true
format="typed"
meaning="输出总量最多64GiB"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_output_file_bytes"
rust_type="u64"
required=true
format="typed"
meaning="输出单文件最多8GiB"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_input_files"
rust_type="u64"
required=true
format="typed"
meaning="输入闭包文件数最多10000"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_output_files"
rust_type="u64"
required=true
format="typed"
meaning="输出文件数最多10000"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[types.fields]]
name="max_segment_bytes"
rust_type="u64"
required=true
format="typed"
meaning="单段最多100MiB，不扩大原帧限制"
unit="字节或计数"
precision="精确整数，禁止溢出与截断"
write="显式声明，绑定任务摘要"
applicability="显式原生任务v3；旧v2保持原限制"
acceptance="完整闭包、每文件上限、路径冲突和版本边界分别检查"

[[constraints]]
id="nx_native_capacity_versions"
requirement="req_engineering"
module="nx_protocol"
check="validate"
rust_path="crates/oe-nx-protocol/src/native_capacity.rs"
statement="显式任务v3必须有完整容量合同，输入与输出分别核总量、单文件和数量；任务摘要绑定预算。原v2不得带新预算，旧archive stage不接受v3，发布资格不替代原生准入。"
severity="error"

[[validations]]
id="native_capacity_preserves_legacy_and_binds_versions"
module="nx_protocol"
constraint="nx_native_capacity_versions"
behavior="native_capacity_preserves_legacy_and_binds_versions"
rust_path="crates/oe-nx-protocol/tests/native_capacity.rs"
oracle="旧v2超量拒绝、新v3有界接受、预算变动改变身份、缺预算与越版本拒绝"
scope="任务容量与旧准入边界；新准入、流式原生执行及NX另验"

[[validations]]
id="native_capacity_rejects_overflow_aliases_and_output_excess"
module="nx_protocol"
constraint="nx_native_capacity_versions"
behavior="native_capacity_rejects_overflow_aliases_and_output_excess"
rust_path="crates/oe-nx-protocol/tests/native_capacity.rs"
oracle="溢出、文件与目录别名、单文件/文件数/输出越界拒绝"
scope="任务容量与旧准入边界；新准入、流式原生执行及NX另验"

[[validations]]
id="native_capacity_blocks_legacy_archive_admission"
module="nx_protocol"
constraint="nx_native_capacity_versions"
behavior="native_capacity_blocks_legacy_archive_admission"
rust_path="crates/oe-nx-protocol/tests/native_capacity.rs"
oracle="新v3不能通过原archive stage或Package，即使文件很小"
scope="任务容量与旧准入边界；新准入、流式原生执行及NX另验"

[[constraints]]
id="nx_native_published_input_copy"
requirement="req_engineering"
module="windows_controller"
check="prepare"
rust_path="crates/oe-windows-controller/src/native_input_copy.rs"
statement="完整发布来源精确映射到v3任务inputs，绑定源发布/计划/目录与目标根；持有来源pins流式独占复制，校验逐段上限、全文件SHA、独立回读和完整输出集合。失败保留部分现场不覆盖，成功也不是完整stage或NX执行。"
severity="error"

[[validations]]
id="native_inputs_copy_binds_whole_job_and_preserves_failures"
module="windows_controller"
constraint="nx_native_published_input_copy"
behavior="native_inputs_copy_binds_whole_job_and_preserves_failures"
rust_path="crates/oe-windows-controller/tests/native_input_copy.rs"
oracle="全部输入映射、源变动、目标短写与重复目标拒绝"
scope="输入准备；完整程序参数入库、调度、结果取回与原生另验"

[[validations]]
id="windows_native_inputs_copy_keeps_sources_pinned"
module="windows_controller"
constraint="nx_native_published_input_copy"
behavior="windows_native_inputs_copy_keeps_sources_pinned"
rust_path="crates/oe-windows-controller/tests/native_input_copy.rs"
oracle="真实Windows双根输入复制、空文件和Unicode、拒绝并发改源及重试"
scope="输入准备；完整程序参数入库、调度、结果取回与原生另验"

[[constraints]]
id="nx_native_complete_payload"
requirement="req_engineering"
module="windows_controller"
check="prepare"
rust_path="crates/oe-windows-controller/src/native_payload_copy.rs"
statement="完整v3载荷由最多16个已发布来源精确映射，必须含全部worker/源码/构建/参数/输入且无额外或重叠；写前读取并验证实际参数。先保存任务与来源意图，再流式复制全部文件、独立回读并核命名空间，失败保留不覆盖。完整准备不等于原子stage或原生执行。"
severity="error"

[[validations]]
id="complete_payload_includes_worker_parameters_and_inputs"
module="windows_controller"
constraint="nx_native_complete_payload"
behavior="complete_payload_includes_worker_parameters_and_inputs"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="多来源完整程序/构建/参数/输入与意图原件，准备不提升stage"
scope="完整载荷准备；原子stage、执行与输出取回另验"

[[validations]]
id="complete_payload_rejects_mappings_and_bad_parameters_before_write"
module="windows_controller"
constraint="nx_native_complete_payload"
behavior="complete_payload_rejects_mappings_and_bad_parameters_before_write"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="缺文件、重叠、错发布绑定与实际参数不符在目标写入前拒绝"
scope="完整载荷准备；原子stage、执行与输出取回另验"

[[validations]]
id="complete_payload_preserves_partial_tree_and_rejects_source_change"
module="windows_controller"
constraint="nx_native_complete_payload"
behavior="complete_payload_preserves_partial_tree_and_rejects_source_change"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="中断/复制后来源变化保留完整意图与部分数据，重复请求不覆盖"
scope="完整载荷准备；原子stage、执行与输出取回另验"

[[validations]]
id="windows_complete_payload_uses_two_published_trees"
module="windows_controller"
constraint="nx_native_complete_payload"
behavior="windows_complete_payload_uses_two_published_trees"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="实际Windows两个发布树组成程序/参数/输入完整载荷，独立目标写入回读和重复拒绝"
scope="受控原件完整准备；当前工程全量、原子stage和native另验"

[[constraints]]
id="nx_native_published_state_binding"
requirement="req_engineering"
module="nx_protocol"
check="validate_published_stage"
rust_path="crates/oe-nx-protocol/src/published_state.rs"
statement="显式状态v3在stage后绑定source-plan摘要、准备回执摘要、完整载荷摘要与实际目录身份；v2保持原序列化与旧合同。v3启动必须重新核当前来源计划、回执和目录，旧启动方法拒绝v3；状态后续转换保留来源绑定和拒绝历史。状态/形状验证不替代实际文件与持久写入。"
severity="error"

[[validations]]
id="published_state_requires_explicit_origin_and_dispatch_review"
module="nx_protocol"
constraint="nx_native_published_state_binding"
behavior="published_state_requires_explicit_origin_and_dispatch_review"
rust_path="crates/oe-windows-controller/tests/published_state.rs"
oracle="新状态缺来源拒绝、旧方法拒绝v3，显式复核后只可启动一次"
scope="协议状态与Windows持久化原语；完整载荷入库owner、当前执行及工程采用另验"

[[validations]]
id="published_state_rejects_swapped_origins_directories_and_versions"
module="nx_protocol"
constraint="nx_native_published_state_binding"
behavior="published_state_rejects_swapped_origins_directories_and_versions"
rust_path="crates/oe-windows-controller/tests/published_state.rs"
oracle="同字节不同来源、替换目录、预算版本或回执变化均拒绝"
scope="协议状态与Windows持久化原语；完整载荷入库owner、当前执行及工程采用另验"

[[validations]]
id="published_state_status_preserves_unknown_and_legacy_bytes"
module="nx_protocol"
constraint="nx_native_published_state_binding"
behavior="published_state_status_preserves_unknown_and_legacy_bytes"
rust_path="crates/oe-windows-controller/tests/published_state.rs"
oracle="v3状态查询/hold保留未知，旧v2字节不增加字段"
scope="协议状态与Windows持久化原语；完整载荷入库owner、当前执行及工程采用另验"

[[validations]]
id="windows_published_state_atomic_checkpoints_remain_held"
module="nx_protocol"
constraint="nx_native_published_state_binding"
behavior="windows_published_state_atomic_checkpoints_remain_held"
rust_path="crates/oe-windows-controller/tests/published_state.rs"
oracle="实际Windows原子写入检查点中断保持pending hold，显式恢复保持来源绑定"
scope="协议状态与Windows持久化原语；完整载荷入库owner、当前执行及工程采用另验"

[[constraints]]
id="nx_native_atomic_stage"
requirement="req_engineering"
module="windows_controller"
check="stage"
rust_path="crates/oe-windows-controller/src/native_stage.rs"
statement="实际完整载荷、参数、任务与来源计划复核后才原子提交v3状态；commit/inspect/recover分别处理。pending及未完成回执须显式恢复，坏字节/缺项/异物不覆盖。完整孤立临时状态通过独占句柄核字节后不覆盖重命名保存历史，消除未决临时名；最多64控制记录，保持文件pins到提交后复核。"
severity="error"

[[validations]]
id="windows_stage_commits_only_actual_complete_payload"
module="windows_controller"
constraint="nx_native_atomic_stage"
behavior="windows_stage_commits_only_actual_complete_payload"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="实际完整文件复核、参数/目录/命名空间反例、重复commit无写入"
scope="实际受控载荷原子stage；远程准入、当前完整工程任务及NX另验"

[[validations]]
id="windows_stage_recovers_all_checkpoints_without_losing_originals"
module="windows_controller"
constraint="nx_native_atomic_stage"
behavior="windows_stage_recovers_all_checkpoints_without_losing_originals"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="回执、pending、temp、替换回读和历史重命名中断均显式恢复，原件保留且根hold解除"
scope="实际受控载荷原子stage；远程准入、当前完整工程任务及NX另验"

[[validations]]
id="windows_stage_rejects_partial_records_and_archive_collisions"
module="windows_controller"
constraint="nx_native_atomic_stage"
behavior="windows_stage_rejects_partial_records_and_archive_collisions"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="部分回执、缺程序文件和历史名冲突均保留现场并拒绝覆盖或提交"
scope="实际受控载荷原子stage；远程准入、当前完整工程任务及NX另验"

[[constraints]]
id="nx_native_execution_inventory_origin"
requirement="req_engineering"
module="windows_controller"
check="inventory_job_tree"
rust_path="crates/oe-windows-controller/src/adapter.rs"
statement="控制器和worker按同一显式任务输入/输出预算逐文件流式清点；旧v2保持原边界。v3读取实际来源计划与准备回执，固定记录句柄并复核状态来源绑定及实际目录，worker每次RUNNING观察同时核来源。此审查不单独开放派发，远程v3入口与大结果取回另验。"
severity="error"

[[validations]]
id="inventory_bounds_preserve_versions_and_direction"
module="nx_protocol"
constraint="nx_native_execution_inventory_origin"
behavior="inventory_bounds_preserve_versions_and_direction"
rust_path="crates/oe-nx-protocol/tests/native_capacity.rs"
oracle="旧上限保留、输入输出分别取预算，错版本与非法预算拒绝"
scope="软件及实际Windows文件检查；不是原生NX资格或完整远程v3接通"

[[validations]]
id="windows_published_origin_pins_records_and_rechecks_state"
module="windows_controller"
constraint="nx_native_execution_inventory_origin"
behavior="windows_published_origin_pins_records_and_rechecks_state"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="实际记录固定拒绝并发改写、状态来源变化、目录替换、合法JSON来源替换及残缺记录"
scope="软件及实际Windows文件检查；不是原生NX资格或完整远程v3接通"

[[validations]]
id="windows_job_inventory_streams_over_legacy_limit_and_enforces_each_bound"
module="windows_controller"
constraint="nx_native_execution_inventory_origin"
behavior="windows_job_inventory_streams_over_legacy_limit_and_enforces_each_bound"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="实际超过100MiB文件流式哈希正确，旧接口仍拒绝，总量/单文件/数量/输出预算独立拒绝"
scope="软件及实际Windows文件检查；不是原生NX资格或完整远程v3接通"

[[constraints]]
id="nx_published_stage_endpoint"
requirement="req_engineering"
module="windows_controller"
check="execute"
rust_path="crates/oe-windows-controller/src/published_stage_endpoint.rs"
statement="显式远程prepare/inspect/recover绑定完整任务、发布来源与实际根；源根非阻塞固定，当前发布树复核后复制完整程序/参数/输入，原子提交来源绑定状态。恢复只豁免目标自身hold，其他未决任务仍阻止写入；所有入口不派发NX，不自动重试，状态答复绑定完整请求。"
severity="error"

[[validations]]
id="published_stage_wire_binds_operation_origin_and_no_execution"
module="windows_controller"
constraint="nx_published_stage_endpoint"
behavior="published_stage_wire_binds_operation_origin_and_no_execution"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="请求操作/来源/根与响应绑定，拒绝非法源路径、载荷、数量及执行声明"
scope="真实控制器进程+受控完整发布载荷；完整项目当前任务及原生派发另验"

[[validations]]
id="windows_remote_published_stage_roundtrip_and_recovery"
module="windows_controller"
constraint="nx_published_stage_endpoint"
behavior="windows_remote_published_stage_roundtrip_and_recovery"
rust_path="crates/oe-windows-controller/tests/published_stage_endpoint.rs"
oracle="实际controller独立进程完整prepare/重复/inspect/恢复，其他根hold和来源篡改拒绝，未启动NX"
scope="真实控制器进程+受控完整发布载荷；完整项目当前任务及原生派发另验"

[[constraints]]
id="nx_large_byte_fetch"
requirement="req_engineering"
module="windows_controller"
check="snapshot"
rust_path="crates/oe-windows-controller/src/large_fetch.rs"
statement="完整任务字节快照绑定任务根/目录、实际job与state字节、输入/输出/辅助文件及空目录；元数据作为有界payload传输，不放宽4MiB控制记录。每批最多512范围且不超过100MiB与任务分段预算，固定物理文件身份和大小后读取。块哈希不证明完整文件，接收端须核重建文件哈希、完整命名空间及最终源端快照；不因此判原生执行或工程采用通过。旧ZIP行为保留。"
severity="error"

[[validations]]
id="large_fetch_batches_bind_ranges_and_reject_false_complete_claims"
module="windows_controller"
constraint="nx_large_byte_fetch"
behavior="large_fetch_batches_bind_ranges_and_reject_false_complete_claims"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="范围溢出、别名、目录缺失及把块回执冒充完整文件证明均拒绝"
scope="完整字节观测与实际进程范围读取；原生执行及工程采用另验"

[[validations]]
id="large_fetch_snapshot_exceeds_record_limit_without_relaxing_frame_limits"
module="windows_controller"
constraint="nx_large_byte_fetch"
behavior="large_fetch_snapshot_exceeds_record_limit_without_relaxing_frame_limits"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="超过4MiB快照经有界payload传输，原控制记录上限保持，批次合并小文件"
scope="完整字节观测与实际进程范围读取；原生执行及工程采用另验"

[[validations]]
id="windows_large_fetch_batches_and_mutation_checks"
module="windows_controller"
constraint="nx_large_byte_fetch"
behavior="windows_large_fetch_batches_and_mutation_checks"
rust_path="crates/oe-windows-controller/tests/published_stage_endpoint.rs"
oracle="真实控制器进程分两批取回超过100MiB文件，核完整哈希，目录/状态/文件替换与同尺寸修改反例"
scope="完整字节观测与实际进程范围读取；原生执行及工程采用另验"

[[constraints]]
id="nx_recovered_history_execution_review"
requirement="req_engineering"
module="windows_controller"
check="observe"
rust_path="crates/oe-windows-controller/src/published_origin.rs"
statement="v3执行来源审查逐个固定恢复历史文件，仅接纳由当前job、plan、prepared和实际目录重建的原始Staged字节；严格文件名和数量上限，记录句柄保持到执行结束，worker在进入原生前重核历史集合。历史不替代当前状态，不开放v3派发，不覆盖旧unknown；v2不接纳历史。"
severity="error"

[[validations]]
id="windows_recovered_history_is_pinned_original_staged_state"
module="windows_controller"
constraint="nx_recovered_history_execution_review"
behavior="windows_recovered_history_is_pinned_original_staged_state"
rust_path="crates/oe-windows-controller/tests/native_stage.rs"
oracle="实际中断恢复生成的历史被固定，写入被拒，后加历史/错误状态字节/非法名称被拒，原件保留且没有dispatch"
scope="Windows真实文件与恢复状态的软件验证；v3派发及完整NX任务另验"

[[constraints]]
id="nx_published_dispatch"
requirement="req_engineering"
module="windows_controller"
check="begin_dispatch"
rust_path="crates/oe-windows-controller/src/published_origin.rs"
