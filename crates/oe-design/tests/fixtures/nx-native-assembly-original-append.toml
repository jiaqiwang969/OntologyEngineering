[[constraints]]
id = "nxopen_entire_assembly_lifecycle"
requirement = "req_engineering"
module = "nx_worker"
check = "check_nxopen_add"
rust_path = "crates/oe-nx-worker/src/assembly.rs"
statement = "显式/v2 nxopen_loaded_part_entire只调用一次固定BasePart重载AddComponent；先已核本任务原型/单位/fullyloaded/work/display。临时builder只读vendor默认引用集后Destroy不Commit，成功组件以SetEntirePartRefset固定entire并回读；异常不读取或释放未知status指针，不UF fallback。不凭component tag放行：正常返回、完整有界status拷贝并释放、unloaded0、entire精确相等、instance/prototype/directparent均必需。原完整树/几何/文件闭包/save及新PID重开与冻结oracle全部保持；原UF非法3/201和全部unknown不改签。"
severity = "error"
[[validations]]
id = "validate_nxopen_entire_contract"
module = "nx_worker"
constraint = "nxopen_entire_assembly_lifecycle"
behavior = "nxopen_add_requires_complete_owned_status_and_exact_binding"
rust_path = "crates/oe-nx-worker/tests/assembly.rs"
oracle = "正常返回但missing/未copy/未释放/部分load/错误parent或prototype/非entire/仅tag均拒；normal0代表软件条件。原独立4原型7展开实例/毫米英寸/非交换旋转与原tol未改。"
scope = "软件合同/installedSDK ABI；实际原生/create-save-独立reopen分别验收，物理采用未知"

[[validations]]
id = "validate_assembly_cycle_body_boundary"
module = "nx_worker"
constraint = "nx_full_native_assembly"
behavior = "cycle_body_boundary_separates_known_subobjects_and_unknowns"
rust_path = "crates/oe-nx-worker/tests/assembly.rs"
oracle = "installed UF_solid_type70/body subtype0分别核；known1–6、occurrence及foreign-owner不进入prototype body path；失败查询/负值/未知值/invalidlogical拒，真实body875032仍失败。旧06未留offendingtag不可反填，原tol/完整树/save/reopen保持。"
scope = "受控软件分类与当前SDK compile ABI；native实际tag/type须新任务实观测，旧FAILED不改签"
