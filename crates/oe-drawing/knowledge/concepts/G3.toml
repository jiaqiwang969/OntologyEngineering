[[concepts]]
id = "DC-G3-205"
name = "齿条传动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示齿轮（或蜗杆）与齿条啮合、把转动变为直线移动的齿条传动，有一般表示、蜗线齿条与蜗杆、齿条与蜗杆三种形式。"
components = ["一般表示：齿轮画成带十字中心线的点画线节圆，与一条点画线节线相切；节线下方为齿条，只在一端画出两三个梯形齿廓示意。", "可用符号中齿轮可画成实线圆，齿条同样以局部齿廓表示。", "蜗线齿条与蜗杆：仅有可用符号，齿条为长矩形，蜗杆以穿入的竖线和短横线表示。", "齿条与蜗杆：两条平行线表示齿条，中间的蜗杆画成带“×”的小矩形穿在其轴线上；也可画成蜗杆轴线与齿条斜交、矩形内画“+”。", "1984 版 5.2.4 与 2013 版 8.2.4 图形一致。"]
variants = ["一般表示", "蜗线齿条与蜗杆", "齿条与蜗杆"]
dxf_forms = ["Pitch CIRCLE and pitch LINE on layer 05 (CENTER linetype) tangent to each other; tooth profile as a short LWPOLYLINE of 2–3 trapezoids on layer 01", "Worm forms: LWPOLYLINE rectangle with × or + marks between parallel LINEs", "INSERT of a library block"]
recognition = "锚点：点画线圆与一条点画线直线相切；直线附近有一小段 2～3 个梯形齿的折线。蜗杆形式：两条平行长线之间夹一个带“×”或“+”的小矩形。与零件图齿条画法、齿轮齿条啮合画法区分：后者有齿顶线、齿根线、剖面线和尺寸；与移动副区分：移动副为导路线上的滑块矩形，无齿形。"
confusions = ["齿轮齿条啮合画法（装配图/零件图）：真实轮廓，粗实线齿顶、点画线分度线，有尺寸。", "棱柱副（移动副）符号：滑块矩形在导路线上，无齿廓。", "齿轮传动：两节圆相切，没有直节线。"]
related = ["DC-G3-207", "DC-G3-208", "DC-G3-079", "DC-G3-075", "DC-G3-178"]
