group = "G6"
kind = "surface_indication"
meaning = "评定长度内所含取样长度个数不等于默认值5时，在参数代号后紧接写出个数（如Rz3、Ra3）；图形参数的非默认评定长度写在两条斜线之间。"
components = ["2006版：R轮廓参数个数不为5时紧接代号写出（Rp3、Rz3、Ra3、Rk8）；W参数总要写个数（如Wz3、Wa3）。", "P参数取样长度等于评定长度，不写个数；默认5个时不作标记（GB/T 10610 4.1.2）。", "图形参数：评定长度与默认16 mm不同时，把值写在两斜线之间（0.008-0.5/12/R 10）。", "ISO 21920-1草案：评定长度写在圆括号中（(15)），截断长度参数写成截断长度×截断数（(1.5×10)）。", "1993版不用此法，而在横线下写取样长度。"]
variants = ["GB/T 131-2006 6.3", "GB/T 10610 4.1.2: no mark for the default 5 sampling lengths", "ISO 21920-1 draft: evaluation length in parentheses '(15)', or section length × number of sections '(1.5×10)', inside the specification line", "GB/T 131-1993: not used (sampling length written under the line instead)", "Ra3", "Rz3"]
dxf_forms = ["TEXT 'Rz3 6.3' — digit attached to the code, space before the value", "digit as smaller or lowered TEXT next to the code", "draft: '(15)' or '(1.5×10)' inside the one-line specification TEXT"]
recognition = "词法：参数代号字母后紧接1–2位整数，再空格接数值（Rz3 6.3、Ra3 3.2、Rz1 3.2）；关键是代号与个数之间无空格、个数与数值之间有空格。空格丢失时（Rz36.3）按GB/T 1031数值系列切分（6.3属于系列）。区分数值本身、传输带片段（带连字号和斜线）和乘号n×。"
confusions = ["参数数值：在空格之后", "传输带：带连字号并以斜线结尾", "评定长度（图形参数）：两条斜线之间的单个数", "数量前缀n×：在符号前方"]
related = ["DC-G6-046", "DC-G6-013", "DC-G6-030", "DC-G6-059", "DC-G6-075", "DC-G6-073"]
priority = "low"
text_forms = ["Ra3 3.2", "Rz3 6.3", "Rz1 3.2", "0.8-25/Wz3 10", "Rk8", "0.008-0.5/12/R 10", "(15)（草案）", "(1.5×10)（草案）"]
