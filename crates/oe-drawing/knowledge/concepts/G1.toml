[[concepts]]
id = "DC-G1-027"
name = "投影线"
aliases = []
group = "G1"
kind = "line"
meaning = "细实线画的投影连线，表示点或结构在两个视图（或视图与辅助视图）之间的投影对应关系，多见于作图过程、展开图和特殊图样。"
components = ["细实线（No.01.1.19），连接不同视图中的对应点，方向垂直于投影轴或沿投射方向。", "正式零件图中一般不保留，仅在需要说明投影关系时画出。", "CAD 分层中投影连线与尺寸线同归08层。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight 25 or 35 (or ByLayer) on a thin layer: GB/T 14665 layer 02, names such as 细实线/THIN; colour green (ACI 3); GB/T 14665 layer 08 (尺寸线、投影连线)", "XLINE/RAY construction lines left in the file, often on a non-plotting layer"]
recognition = "细实线两端分别落在两个视图中的对应点（端点处有轮廓顶点），方向严格水平或竖直（基本视图之间）或垂直于斜视图投射方向；无箭头与数字。XLINE/RAY 或位于 Defpoints、不打印层的线多为作图辅助，应排除在图面内容之外。"
confusions = ["尺寸界线：只从一个视图伸出，越过尺寸线约2 mm。", "辅助线：延长轮廓求交点。"]
related = ["DC-G1-043", "DC-G1-053", "DC-G1-101"]
priority = "low"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
