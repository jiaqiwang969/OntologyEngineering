[[concepts]]
id = "DC-G4-115"
name = "包容要求符号 Ⓔ"
aliases = ["包容要求（Ⓔ）"]
group = "G4"
kind = "tolerance_indication"
meaning = "包容要求Ⓔ：写在尺寸公差之后的带圈大写E，要求要素不得超越其最大实体边界，同时局部尺寸不超出最小实体尺寸；对孔相当于上限LP、下限GX，对轴相当于上限GN、下限LP。"
components = ["符号：圆圈内大写E，圆直径约1.6倍字高，线宽同字体笔画", "位置：紧跟在极限偏差、公差带代号或“代号(偏差)”之后", "整图缺省：可在标题栏附近写“GB/T 38762 Ⓔ”使全图尺寸默认适用", "历史：GB/T 1800.1-2009 以前公差带代号默认按泰勒原则（相当于包容），2020版废止该默认，需明确标注Ⓔ", "教材中旧称“包容原则”"]
variants = ["after tolerance class", "after deviations", "as drawing-wide default 'GB/T 38762 Ⓔ'", "pre-2020 practice: envelope implied by ISO codes per Taylor principle (abolished)", "偏差后加 Ⓔ", "公差带代号后加 Ⓔ", "公差带代号+括号偏差后加 Ⓔ", "教材图注中仍用旧称 '包容原则'", "used in GB/T 45683 general size lines, e.g. \"±0.25 Ⓔ\""]
dxf_forms = ["TEXT 'E' with a CIRCLE around it (exploded) placed after the tolerance", "INSERT of a circled-letter block", "Unicode circled letter Ⓔ (U+24BA) in TEXT/MTEXT, or '(E)' typed as a fallback", "MTEXT using a GD&T font where a circled E glyph exists (font-dependent)"]
recognition = "锚点：一个小CIRCLE（半径约0.8h）中心处有字母E，且整体位于尺寸公差文字右侧同一基线附近；或文字中出现U+24BA。检验其左侧是尺寸值/公差。与Ⓕ区分：圈内字母为F；与Ⓜ、Ⓛ区分：后者通常在几何公差框格内；与基准字母E区分：基准字母在方框内（且标准不推荐用E作基准字母）。"
confusions = ["Ⓕ 自由状态", "Ⓜ 最大实体要求、Ⓛ 最小实体要求：在几何公差框格内", "基准字母E：在方框中并连基准三角", "技术要求中“遵守包容要求”的文字说明"]
related = ["DC-G4-148", "DC-G4-136", "DC-G4-106", "DC-G4-131", "DC-G4-128", "DC-G5-065"]
priority = "low"
text_forms = ["Ø20h6Ⓔ", "10±0.1 Ⓔ", "Ø30 F7(+0.041/+0.020) Ⓔ", "Ø55j6(+0.012/-0.007)Ⓔ", "GB/T 38762 Ⓔ"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K28", "K23", "K24", "K25"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 4458.5-2003 4.2.3, GB/T 1800.1-2020 4.1.1 and 附录A, GB/T 38762.1 表2 and 6.2.2 图19, GB/T 1182-2018 表4. Circle size is general drafting practice consistent with GB/T 38762.1 附录A 图A.2."
