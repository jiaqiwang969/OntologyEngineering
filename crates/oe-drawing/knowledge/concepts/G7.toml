confusions = ["沉孔/锪平标注（⌴Ø… ↧…）：用于孔的引出注法，含Ø和深度符号。", "孔组标注n×Ød：数字含Ø，没有焊缝符号。", "断续角焊缝尺寸：左侧为焊脚K，符号为三角形。"]
