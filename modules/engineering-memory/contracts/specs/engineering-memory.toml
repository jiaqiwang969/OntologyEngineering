schema = "oev2.design/1"
version = "2.0.0-rc.6"
problem = "共享会话检索没有保留工程经验的来源、变化、适用条件与真实使用结果"
purpose = "将 engineering-memory 建成工程本体 v2 的正式记忆模块；由本规范定义含义，复用 CASS 和 CM 的实现能力"

[[requirements]]
id = "focused_recall"
function = "让目的与方法直接相关的经验优先于只在长历史偶然提到关键词的材料"
condition = "仅对实际文字作词法排序；原件、项目及条件审查独立；不针对某记录 ID 或个人词汇加权"
acceptance = "固定字段权重及不同词数归一化；重复同一文字不加分；正文独有的相关词仍可被找到；旧五问全部原判据保留，不能更改问法掩盖漏召回"

[[constraints]]
id = "recall_field_relevance"
requirement = "focused_recall"
module = "memory_retrieval"
check = "lexical_candidates"
rust_path = "modules/engineering-memory/runtime/src/retrieval.rs"
statement = "目的权重6，方法目的4/机制3/验证2，条件2，过程与原因各1，未知0.5；每字段按不同词数平方根归一化，重复词不累加；完整查询小额加分必须先有词重叠。排序不是证据强度或采用资格。"
severity = "error"

[[validations]]
id = "focused_vs_incidental"
constraint = "recall_field_relevance"
module = "memory_retrieval"
behavior = "recall_prioritizes_subject_over_incidental_history"
rust_path = "modules/engineering-memory/runtime/tests/runtime.rs"
oracle = "直接说明目标的短记录优先于同词偶现的长过程；重复三十次不改变分数；正文独有词仍召回。旧实际五问原预期另作新旧同源比较。"
scope = "词法排序与重复边界，不是独立泛化精度或使用收益"

[[requirements]]
id = "bounded_session_selection"
function = "在完整背景预算内继续选择后续合适经验，并让简短接续词沿用已激活任务"
condition = "每次最多核前50候选；完整候选保留；只有明确短接续语可沿用此前已激活的任务及查询"
acceptance = "超预算候选整项留排除理由，继续填入能放下的条目；仍限请求个数；扫描截断明示；新实质请求或否定不被旧任务替代；不从 cwd 猜项目"

[[constraints]]
id = "whole_candidate_admission"
requirement = "bounded_session_selection"
module = "memory_session"
check = "session_prepare"
rust_path = "modules/engineering-memory/runtime/src/session.rs"
statement = "先在固定50候选上限内核源，再按整个候选占用决定纳入；前面放不下不成为停止检索原因，不裁掉纠正或未知来凑预算。"
severity = "error"

[[validations]]
id = "session_backfill_after_exclusion"
constraint = "whole_candidate_admission"
module = "memory_session"
behavior = "session_skips_whole_oversized_candidates_and_fills_from_later_records"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "前两条过大、后两条完整可放入时，max_candidates=2 返回后两条，保留前两条排除理由、原件和字节上限。"
scope = "完整背景选择，不证明最相关的全库语义检索"

[[constraints]]
id = "continuation_task_identity"
requirement = "bounded_session_selection"
module = "memory_hooks"
check = "client_hook"
rust_path = "modules/engineering-memory/runtime/src/hooks.rs"
statement = "已有激活任务时，严格匹配的好/继续等短确认，以及继续优化、好的继续优化、好继续优化、可以继续优化、继续优化吧、好的可以继续优化六种短句沿用 task/query；包含其他实质内容、否定、对象或预算变化的请求保留新原句。未激活任务时保留原句且不从 cwd 推断项目；沿用背景不是新增执行授权。"
severity = "error"

[[validations]]
id = "hook_continuation_and_new_task"
constraint = "continuation_task_identity"
module = "memory_hooks"
behavior = "continuation_hook_keeps_active_task_but_new_requests_take_precedence"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "中英文明确接续及六种继续优化短句保留已绑定的 task/query；含继续的新具体任务、否定及预算变化保留新原句；Project 来源、条件和已有 hook 政策预算不变；未激活会话保留原句且 Project 为 null。"
scope = "有界宿主背景接续，不替用户解析开放式新目标"

[[requirements]]
id = "shared_source_scan_owner"
function = "同一原件的多个兼容入口沿用同一扫描进度，同时保留来源身份和历史记录"
condition = "同一规范路径、provider、项目、条件与起始范围；profile 是入口身份；固定副本及不同路径不自动合并"
acceptance = "新重复登记自动关联；已有未扫描重复入口可显式关联；重复入口已有扫描或不同含义时拒绝；原件前缀核验；旧文件、包及经验不删除；扫描和整理进度不相加"

[[constraints]]
id = "source_alias_preserves_progress"
requirement = "shared_source_scan_owner"
module = "memory_runtime"
check = "alias_source"
rust_path = "modules/engineering-memory/runtime/src/workflow.rs"
statement = "来源关联只改变调度归属。保留原登记和原 profile；不得将已有包或游标当作相加后已完成的覆盖。关联目标必须是直接扫描来源，禁止链和环；关联文件和退休登记内容变化拒绝。"
severity = "error"

[[validations]]
id = "shared_source_registration"
constraint = "source_alias_preserves_progress"
module = "memory_runtime"
behavior = "source_alias_keeps_one_cursor_and_preserves_history"
rust_path = "modules/engineering-memory/runtime/tests/runtime.rs"
oracle = "两个 profile 登记同一合成原件后只扫描一次；追加消息接续同一游标；迁移实际未扫描重复入口保留原字节；已有扫描、不同条件、前缀改写、关联篡改和链均拒绝"
scope = "通过真实 Store/CLI 核同一原件调度；不同路径副本、已有各自扫描成果和不同条件的合并另验"

[[types]]
name = "SourceAliasRequest"
meaning = "将已登记且未开始扫描的重复入口明确关联到同一原件的既有扫描来源"
identity = "alias_id 和 source_id；重复请求重核来源但不改旧关联"
fields = [
 {name="schema",meaning="来源关联协议",rust_type="String",required=true,format="status",allowed_values=["engineering-memory.source-alias-request/1"],unit="不适用",precision="精确版本",write="agent 选择",applicability="已有重复登记",acceptance="未知拒绝"},
 {name="alias_id",meaning="保留但不再独立扫描的登记 ID",rust_type="String",required=true,format="text",unit="不适用",precision="安全 ID",write="来自当前来源清单",applicability="未扫描的重复入口",acceptance="不删除原登记或既有成果"},
 {name="source_id",meaning="沿用扫描进度的登记 ID",rust_type="String",required=true,format="text",unit="不适用",precision="直接来源 ID",write="来自同一原件的既有来源",applicability="含义相容且未被关联",acceptance="链、环和不同原件拒绝"},
 {name="max_verify_bytes",meaning="本次前缀核验累计预算",rust_type="u64",required=true,format="integer",unit="byte",precision="实际累计哈希字节",write="agent 按原件规模设置",applicability="目标及退休原件前缀，变化时复核",acceptance="预算不足保留原状态"}
]

[[requirements]]
id = "optional_native_receiver"
function = "自动准备 v2 原生来源及项目候选，并在接收方维护当前 Project 后统一核验两侧来源"
condition = "显式 v2 根与程序 SHA；原生入口可用；助手维护 Project 的工程含义，记忆程序不代写或采用"
acceptance = "实际运行 knowledge intake、task-view /2、verify-task-view；完整经验绑定一致；原件/Project/程序/原生资料漂移拒绝；不调模型或自动写有益反馈；无 v2 时其他记忆命令继续独立运行"

[[modules]]
id = "memory_receiver"
kind = "pipeline"
rust_path = "modules/engineering-memory/runtime"
purpose = "在显式预算内调用实际 v2，保留准备、候选、当前核验及失败回执"
realizes = ["optional_native_receiver"]
platform = "本机 Rust CLI；仅显式调用时需要已登记的 v2"
effects = "在私有记忆库与 v2 var 下新增来源材料、候选和核验产物；不写 Project 正本、skill、代码或采用"
failures = "准备意图重跑幂等；中断保存原尝试并另开有界尝试；核验每次重做；时间/输出超限终止子进程并保留失败；未知和旧成功不改签"
status = "source_only"
depends_on = ["memory_exchange", "memory_session"]

[[constraints]]
id = "native_receiver_current_binding"
requirement = "optional_native_receiver"
module = "memory_receiver"
check = "v2_verify"
rust_path = "modules/engineering-memory/runtime/src/receiver.rs"
statement = "同一次经验的全部来源、修订与捕获映射进入真实原生入口；接收后当前 Project 中的方法事实须保留完整经验、原文与未知，不能将名称相同的另一事实冒充本次经验。来源、程序、完整当前 Project 在调用前后核验；success 只支持选定消息来源，不授予方法适用或收益。"
severity = "error"

[[validations]]
id = "native_receiver_roundtrip"
constraint = "native_receiver_current_binding"
module = "memory_receiver"
behavior = "native_receiver_keeps_both_provenance_sides_current"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "实际登记 v2 对 Codex/Claude 原消息生成 intake 与 task-view；Project 增加候选前拒绝，加入完整候选后通过；原文、intake、事实内容、Project、接收程序改动均拒绝；重复与失败保留历史；程序只写规定私有材料。原生测试需显式本机根，不以 mock 代替。"
scope = "当前会话的原生来源接收和重核；自动实际工程采用、长期模型提炼与 RRSI 收益另验"

[[types]]
name = "V2Receiver"
meaning = "显式可选的 v2 正式根与已选程序身份"
identity = "root 与 cli_sha256 共同绑定，不沿历史文本发现命令"
fields = [
 {name="root",meaning="v2 正式根",rust_type="String",required=true,format="text",unit="不适用",precision="规范绝对路径",write="agent 据实际安装选定",applicability="可选接收",acceptance="读取登记的 current_cli.default，不猜构建目录"},
 {name="cli_sha256",meaning="预期实际接收程序摘要",rust_type="String",required=true,format="sha256",unit="不适用",precision="SHA256",write="据安装回执核对",applicability="调用前后",acceptance="登记值与程序内容均须匹配"}
]

[[types]]
name = "V2Artifact"
meaning = "由当前任务明确选择的 v2 原生输入文件"
identity = "root 相对路径与完整原字节摘要"
fields = [
 {name="path",meaning="v2 根内相对位置",rust_type="String",required=true,format="text",unit="不适用",precision="安全相对路径",write="按真实输入提供",applicability="前版 Project、当前 work 或额外来源",acceptance="父目录穿越和符号链接拒绝"},
 {name="sha256",meaning="完整输入摘要",rust_type="String",required=true,format="sha256",unit="不适用",precision="SHA256",write="从原件计算",applicability="原生任务合同",acceptance="漂移由原生入口再次核验"}
]

[[types]]
name = "V2PrepareRequest"
meaning = "自动整理完整经验的原生来源与项目候选，不提交 Project"
identity = "id 对应不可改变的准备意图"
fields = [
 {name="schema",meaning="准备协议",rust_type="String",required=true,format="status",allowed_values=["engineering-memory.v2-prepare-request/1"],unit="不适用",precision="精确版本",write="agent 选择",applicability="CLI/RPC",acceptance="未知拒绝"},
 {name="id",meaning="准备身份",rust_type="String",required=true,format="text",unit="不适用",precision="安全 ID",write="agent 分配",applicability="恢复同一意图",acceptance="冲突拒绝"},
 {name="export",meaning="已有会话中完整经验的导出请求",rust_type="SessionExportRequest",required=true,format="object",unit="字段各自声明",precision="准确背景及修订",write="据实际 prepare 结果填写",applicability="当前 Project",acceptance="未提供或过期拒绝"},
 {name="receiver",meaning="明确的可选接收方",rust_type="V2Receiver",required=true,format="object",unit="不适用",precision="根与程序摘要",write="据实际安装",applicability="原生调用",acceptance="不可用不调用替代程序"},
 {name="fact_property",meaning="接收 Project 中的方法事实名",rust_type="String",required=true,format="text",unit="不适用",precision="稳定唯一名",write="agent 按工程含义命名",applicability="operation_method_instance 候选",acceptance="同名不同经验不能混用"},
 {name="object_source_sha256",meaning="当前工程对象的来源摘要",rust_type="String",required=true,format="sha256",unit="不适用",precision="SHA256",write="引用真实 Project 已登记证据",applicability="v2 ObjectReference",acceptance="不得凭空补造"},
 {name="max_seconds",meaning="本轮所有原生调用共同的时间预算",rust_type="u64",required=true,format="integer",unit="s",precision="1 至 120",write="agent 明确设置",applicability="包含子进程与准备阶段",acceptance="超时保留失败，不返回旧成功"}
]

[[types]]
name = "V2VerifyRequest"
meaning = "接收方维护 Project 后，按新的当前会话统一重核记忆原件和 v2 方法来源"
identity = "id 绑定核验意图，每次调用追加一次当前运行"
fields = [
 {name="schema",meaning="核验协议",rust_type="String",required=true,format="status",allowed_values=["engineering-memory.v2-verify-request/1"],unit="不适用",precision="精确版本",write="agent 选择",applicability="CLI/RPC",acceptance="未知拒绝"},
 {name="id",meaning="核验意图身份",rust_type="String",required=true,format="text",unit="不适用",precision="安全 ID",write="agent 分配",applicability="每次重核而非缓存成功",acceptance="同 ID 不同请求拒绝"},
 {name="preparation_id",meaning="已经完成的原生来源准备",rust_type="String",required=true,format="text",unit="不适用",precision="准确 ID",write="引用真实准备回执",applicability="完整同一经验",acceptance="缺失或内容漂移拒绝"},
 {name="export",meaning="接收后当前 Project 下的新导出请求",rust_type="SessionExportRequest",required=true,format="object",unit="字段各自声明",precision="当前精确背景",write="Project 更新后重新准备会话",applicability="同一经验及工程对象",acceptance="旧背景拒绝"},
 {name="previous",meaning="明确选择的前版 Project 或未知",rust_type="Option<V2Artifact>",required=false,format="object",unit="不适用",precision="显式版本",write="有前版时引用",applicability="原生完整 task-view /1",acceptance="不静默改写前版"},
 {name="work",meaning="当前 work 原生输入或尚未建立",rust_type="Option<V2Artifact>",required=false,format="object",unit="不适用",precision="准确字节",write="有当前 work 时绑定",applicability="原生完整任务核验",acceptance="不省略已提供 work 的检查"},
 {name="sources",meaning="当前任务额外来源",rust_type="Vec<V2Artifact>",required=true,format="list",unit="条",precision="明确原生资料",write="agent 按当前任务选择",applicability="与准备的全部 intake 合并",acceptance="原生核验不删减"},
 {name="max_seconds",meaning="本轮共享时间预算",rust_type="u64",required=true,format="integer",unit="s",precision="1 至 120",write="agent 明确设置",applicability="导出、原生派发和结尾重核",acceptance="超时不得签 matched"}
]

[[requirements]]
id = "source_bound_exchange"
function = "将本次会话已经提供的完整经验及其选定原消息，交给有界 v2 来源接收器"
condition = "准确会话、Project、经验修订及最新纠正已核；大原件只读取明确来源范围；接收方继续独立验证"
acceptance = "每条原消息逐字节导出，Codex 身份头取自原件；原位置与导出位置分别记录；保留全部来源、时间线与未知；预算不足整项拒绝；重试幂等，漂移拒绝；不写 Project 或 skill"

[[modules]]
id = "memory_exchange"
kind = "adapter"
rust_path = "modules/engineering-memory/runtime"
purpose = "把本次经验交接整理为可由 v2 原生 intake 读取的有源私有文件"
realizes = ["source_bound_exchange"]
platform = "Rust 本地普通文件；无需安装 v2 即可导出"
effects = "仅在私有记忆库保存交接意图、逐消息原字节档案和位置映射；不写来源、Project、skill 或代码"
failures = "来源、Project、经验纠正或导出物漂移拒绝；中断恢复同一意图；缺失、超限或未结束消息不截断或伪造"
status = "source_only"
depends_on = ["memory_session", "memory_runtime", "memory_snapshot"]

[[constraints]]
id = "exact_exchange_provenance"
requirement = "source_bound_exchange"
module = "memory_exchange"
check = "session_export_verify"
rust_path = "modules/engineering-memory/runtime/src/exchange.rs"
statement = "原来源与导出档案逐字节核对；Codex 会话头保留原位置与摘要；一个经验全部来源同时导出，不丢纠正或未知。复用须重新核当前会话/Project/最新经验及固定副本身份；v2 对导出档案 matched 不能代替原件映射重核或工程采用。"
severity = "error"

[[validations]]
id = "exact_exchange_counterexamples"
constraint = "exact_exchange_provenance"
module = "memory_exchange"
behavior = "export_preserves_original_bytes_and_rejects_drift"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "独立核对原字节与两套位置；超大稀疏源只导出选定原消息；Codex 原身份头不重造；Claude 多文本块保持；超限/未结束记录/源或副本改写/Project 漂移/新纠正均拒绝；中断重跑不覆盖已有不同内容；实际 v2 intake 与 task-view 按本机回执另验"
scope = "选定消息来源交换；不证明完整会话、原因解释、方法适用、自动工程采用或 RRSI 收益"

[[types]]
name = "SessionExportRequest"
meaning = "本次会话已提供经验的完整有源导出请求，接收方再核当前工程"
identity = "id 绑定一次不可覆盖的导出意图；项目或经验变化须重新准备会话及新导出"
fields = [
 {name="schema",meaning="有源会话导出合同版本",rust_type="String",required=true,format="status",allowed_values=["engineering-memory.session-export-request/1"],unit="不适用",precision="精确版本",write="agent 明确选择",applicability="CLI/RPC",acceptance="未知拒绝"},
 {name="id",meaning="本次导出身份",rust_type="String",required=true,format="text",unit="不适用",precision="唯一标识",write="agent 指定",applicability="共享私有库",acceptance="同 ID 不同请求拒绝"},
 {name="context_id",meaning="已经准备的会话背景身份",rust_type="String",required=true,format="text",unit="不适用",precision="准确 ID",write="采用 prepare 回执",applicability="当前任务及真实 Project",acceptance="缺失拒绝"},
 {name="context_sha256",meaning="完整会话背景摘要",rust_type="String",required=true,format="sha256",unit="不适用",precision="SHA256",write="采用 prepare 回执",applicability="本次明确提供的候选",acceptance="不允许更换背景"},
 {name="record_id",meaning="本次提供的经验身份",rust_type="String",required=true,format="text",unit="不适用",precision="准确 ID",write="引用候选",applicability="全部来源与完整经验",acceptance="未提供者拒绝"},
 {name="revision",meaning="经验准确修订",rust_type="u64",required=true,format="integer",unit="修订",precision="正整数",write="引用候选",applicability="当前最新纠正",acceptance="过期拒绝"},
