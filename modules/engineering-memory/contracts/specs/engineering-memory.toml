[[requirements]]
id = "session_project_exchange"
function = "在独立会话/任务中召回经验，并向当前实际 Project 交接和收取使用反馈"
condition = "Project 身份、内容、对象和条件显式绑定；未安装 v2 仍可独立召回；普通调用不修改 skill 或代码"
acceptance = "跨项目误用、同修订内容变化、经验纠正后的旧交接与未曝光经验反馈均拒绝；预算缺口明确保留；重跑幂等"

[[modules]]
id = "memory_session"
kind = "pipeline"
rust_path = "modules/engineering-memory/runtime"
purpose = "同一 Rust 核心中的任务上下文、当前项目绑定、限定召回及准确修订反馈"
realizes = ["session_project_exchange", "bounded_session_selection"]
platform = "独立 Rust CLI / JSON RPC；无需完整 v2 安装"
effects = "只读显式 Project 与原件；写私有会话上下文、反馈意图和回执；不写 Project 或软件"
failures = "来源漂移、当前对象/条件变化、预算缺口、未提供的经验与摘要冲突分别报告"
status = "source_only"
depends_on = ["memory_runtime"]

[[constraints]]
id = "session_binding"
requirement = "session_project_exchange"
module = "memory_session"
check = "verify_project_binding"
rust_path = "modules/engineering-memory/runtime/src/session.rs"
statement = "每次当前交接重读 Project 完整字节和已提供经验；历史反馈保留当时准确修订，不能授予工程采用"
severity = "error"

[[validations]]
id = "session_binding_counterexamples"
constraint = "session_binding"
module = "memory_session"
behavior = "project_drift_and_experience_correction_invalidate_handoff"
rust_path = "modules/engineering-memory/runtime/tests/session.rs"
oracle = "同 revision 改 Project 字节、对象版本或条件以及经验后来纠正均阻止旧交接；原 Project 和代码字节不变"
scope = "会话与 Project 精确绑定；不替代 v2 正式审查、模型质量或实际收益验证"

[[types]]
name = "SessionObject"
meaning = "本次任务使用的当前 Project 对象版本及条件内容"
