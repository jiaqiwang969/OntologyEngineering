[[concepts]]
id = "DC-G6-007"
name = "带字母的完整符号的简化注法"
aliases = ["带字母的表面结构等式简化注法", "等式形式的简化注法"]
group = "G6"
kind = "simplified_representation"
meaning = "视图上用只带一个小写字母（如x、y、z）的完整符号代替冗长的代号，再在图形或标题栏附近用等式说明“字母符号 = 完整要求”。"
components = ["视图上：完整符号横线处只写一个小写字母。", "说明处：等式左边为同一字母符号，右边为完整代号，可多行（如U Rz 1.6 / L Ra 0.8）。", "用于多个表面要求相同或图上空间有限时；ISO 21920-1草案也用它表示含大量非缺省元素的长规范。", "1993版称简化代号，同样须在标题栏附近说明其意义。"]
variants = ["GB/T 131-2006 11.3.2.2 图25, 表B.4", "GB/T 131-1993 4.5 图13 simplified codes explained near the title block", "ISO 21920-1 draft 9.1.3 图14/图15 (letters also for long non-default specifications)", "字母符号 = 完整代号", "空间有限时使用"]
dxf_forms = ["INSERT of the complete-symbol block whose ATTRIB/TEXT holds a single lowercase letter", "equation near the title block: lettered INSERT + TEXT '=' + complete-code INSERT on one baseline", "letter TEXT height = h, same as the values"]
recognition = "符号横线处唯一的文字为单个小写拉丁字母时视为引用；在标题栏附近或图形旁找到同一字母的等式，取等号右侧要求。区分基准字母（大写，在方框内并连三角形）、视图/剖视字母（大写，配箭头或在视图名称处）、零件序号（数字，在圆圈或横线上）、纹理符号（=、⊥、X、M、C、R、P，在位置d）。"
