kind = "tolerance_indication"
meaning = "“/长度”修饰符表示尺寸要求适用于要素上任意一段指定长度的限定部分（该长度视为理论正确尺寸）；/0 等同于ACS。角度尺寸可用 /线性距离 或 /角度距离。"
components = ["符号：斜线“/”后紧跟长度数值，如 /10、/25，写在尺寸特征修饰符之后", "含义：每一段该长度的任意部分都应满足规范，长度不另注公差", "/0：限定长度为零，等价于ACS，标准建议直接用ACS", "角度尺寸：/15 可为沿轴向的线性距离或绕回转方向的角度距离", "固定限定部分：再用粗点画线或区间符号标明取样范围"]
