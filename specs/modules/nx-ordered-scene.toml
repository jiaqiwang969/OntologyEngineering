[[constraints]]
id="nx_ordered_scene"
requirement="req_engineering"
module="nx_worker"
check="plan_ordered"
rust_path="crates/oe-nx-worker/src/assembly_motion/scene.rs"
statement="几何采样序号从零连续，唯一来源样本身份；不伪造物理时间，保留原完整成员/进入/父级/姿态/预算校验。"
severity="error"

[[validations]]
id="ordered_scene_preserves_geometry_without_fabricated_time"
module="nx_worker"
constraint="nx_ordered_scene"
behavior="ordered_scene_preserves_geometry_without_fabricated_time"
rust_path="crates/oe-nx-worker/tests/scene_lifecycle.rs"
oracle="无时间的场景保留同一成员与工具进入计划，序号乱序/缺口和提前进入被拒绝，原定时合同拒绝等时样本。"
scope="Rust来源计划；不表示原生/连续运动/物理动力学验证"
