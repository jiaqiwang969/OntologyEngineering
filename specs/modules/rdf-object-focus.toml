[[constraints]]
id="tool_result_provenance_handback"
requirement="req_project"
module="kernel"
check="verify"
rust_path="crates/oe-kernel/src/project/tool_result.rs"
statement="结果须绑定同一 Project 的对象修订、条件与来源；工具身份与登记表及程序字节一致；原始记录与输入可重读核摘要；观察引记录、推断引记录或结论，覆盖非空；登记只写新副本并加证据与依赖，不改结论或采用。比较只收两份已登记、同工具/指标/单位/环境/输入集、基线在先且行为通过的结果。"
severity="error"

[[validations]]
id="validate_tool_result_counterexamples"
module="kernel"
constraint="tool_result_provenance_handback"
behavior="registry_binding_records_findings_and_comparison_classify_correctly"
rust_path="crates/oe-kernel/tests/tool_result.rs"
oracle="独立冻结：完整结果 accepted，登记产生新副本与依赖；工具未登记/版本不符/程序变化、对象或条件变化、记录篡改、观察无依据、覆盖空、时间倒置、ID 重复、决定不存在均拒绝；比较在基线在后、环境或输入集不同、行为失败、样本不足、未登记时为 invalid/inconclusive"
scope="回交合同与有界比较；不证明工具结论或收益"

[[validations]]
