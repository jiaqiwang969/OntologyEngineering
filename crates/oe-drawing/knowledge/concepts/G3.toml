recognition = "锚点：两个细点画线圆外切（圆心距=半径和，相对误差<1%），各有一个同心粗实线圆，半径比分度圆约大一个模数m；两粗实线圆在切点附近交叠（交叠深度约2m）。交叠区齿顶圆被打断成圆弧→省略画法。区分：普通相交圆没有同心点画线分度圆；带传动的带轮外圆不交叠，由切线（带）相连；链传动由链节点画线相连。"
