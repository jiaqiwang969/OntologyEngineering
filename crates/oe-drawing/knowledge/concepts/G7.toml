dxf_forms = ["closed triangle LWPOLYLINE + zigzag LINEs/SPLINE inside, thin lineweight", "CIRCLE + inner zigzag; connecting LINE for joint supports", "INSERT of a fixture-symbol block from a process-planning (工艺/CAPP) template; block names often carry the symbol name in Chinese or pinyin"]
recognition = "锚点为顶点触及工件轮廓的封闭小三角或视图正面的圆，内有波纹线；对比定位支承：定位支承在轮廓上是带脚的开口“∧”，视图正面是圆加中心点；活动式定位支承的“∧”内也有波纹，但不封闭成三角。"
