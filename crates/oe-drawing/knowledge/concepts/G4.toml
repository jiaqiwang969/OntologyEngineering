[[concepts]]
id = "DC-G4-041"
name = "半径符号 R"
aliases = ["半径符号R"]
group = "G4"
kind = "dimension_symbol"
meaning = "R是半径符号，写在半径尺寸数字前，用于小于或等于半圆的圆弧；尺寸线从圆心或沿径向画出，一端箭头指到圆弧。也用于“其余圆角R4”等总说明；只注R不注数值表示半径由其他尺寸确定。"
components = ["字母R：大写，与数字同高，紧接在数值前（R20）。", "尺寸线：通过或指向圆心的径向细实线，箭头只在圆弧一端。", "圆心过远：用折线尺寸线指向假想圆心，或尺寸线不画到圆心。", "特例：只注R不注数值（由其他尺寸确定）；SR为球半径；总说明“其余圆角R4”。"]
variants = ["R before value", "R without value (radius fixed by other dimensions, see entry)", "general note 其余圆角R4", "大半径折线尺寸线", "只注 R 不注数值"]
dxf_forms = ["DIMENSION dimtype 4 (radius) with style prefix 'R' or override text 'R<>'", "LARGE_RADIAL_DIMENSION (jogged radius) for large arcs", "exploded: LINE (radial) + 1 SOLID/INSERT arrowhead + TEXT 'R20'", "TEXT/MTEXT in notes, e.g. '其余圆角R4'", "layer 08 or template dimension layer"]
recognition = "锚点为以R开头后接数字（或只有R）的文字，排除紧前为S（球半径）以及Ra、Rz等粗糙度参数。几何：文字所在尺寸线为直线，其延长线通过某ARC/CIRCLE圆心，唯一箭头尖落在该圆弧上，数值≈弧半径×比例；尺寸线有Z形折弯时为大半径折线注法。排除：粗糙度Ra/Rz后接数值且位于√形符号上；视图名、基准字母R单独出现于方框或视图名称处，无尺寸线。"
confusions = ["表面粗糙度Ra/Rz：R后紧跟小写字母，位于表面结构符号上。", "球半径SR：R前有S，对应球面。", "直径Ø：圆和大于半圆的弧注直径，R用于不大于半圆的弧。", "视图/基准字母R：单字母，在方框或视图名称处，无尺寸线。", "表面纹理符号R（放射状）：位于表面结构符号旁。"]
related = ["DC-G4-006", "DC-G4-007", "DC-G4-013", "DC-G4-053", "DC-G4-068", "DC-G4-082"]
priority = "high"
text_forms = ["R20", "R0.5", "R", "其余圆角R4"]
