[[concepts]]
id = "DC-G1-085"
name = "图框"
aliases = []
group = "G1"
kind = "sheet_element"
meaning = "图纸上用粗实线画出的限定绘图区域的线框；分不留装订边和留装订边两种格式，同一产品的图样只能用一种。"
components = ["粗实线矩形，位于纸边界线内侧。", "不留装订边：四边距纸边均为 e（A0、A1 为20 mm，A2~A4 为10 mm）。", "留装订边：左边 a=25 mm，其余三边为 c（A0~A2 为10 mm，A3、A4 为5 mm）。", "加长幅面按大一号基本幅面取 e、a、c；标题栏在图框右下角，对中符号从纸边伸入图框约5 mm。"]
variants = ["不留装订边（四边均为 e）", "留有装订边（左边 a=25, 其余 c）", "X型/Y型", "加长幅面按大一号基本幅面取图框尺寸", "one product's drawings use only one frame format", "不留装订边（周边宽 e）", "留装订边（装订边 a，其余 c）", "X型（标题栏长边平行图纸长边）", "Y型（标题栏长边垂直图纸长边）"]
dxf_forms = ["closed LWPOLYLINE rectangle with thick lineweight (0.5–0.7) or constant width", "usually part of a frame/title-block INSERT (block names like A3, A4-H, TK, 图框, GB_A3; CAXA 图幅 exported as a BLOCK) or drawn in a paper-space layout; may be scaled by the drawing scale in model space", "CAXA 图幅/图框 objects export as a BLOCK containing frame, title block and centring marks"]
recognition = "锚点：图中最大的两个嵌套矩形——外层细线（纸边界）与内层粗线（图框）。判据：外层尺寸除以比例因子后匹配基本或加长幅面；四边间距相等（e）或左25、其余 c；右下角内接标题栏。常作为一个 INSERT 整体出现，按块名和尺寸判定幅面与比例因子。注意 840×594 的外框既可能是 A1 按1:1，也可能是 A3 在模型空间按1:2 放大2倍，须结合标题栏字高与比例栏判断。"
confusions = ["纸边界线：细实线，图框外侧。", "标题栏外框、明细栏外框：粗实线，但在图框内右下角。", "视图外的粗实线矩形零件轮廓：属于零件。", "表格或视图分区框：在图框内部。"]
related = ["DC-G1-091", "DC-G1-086", "DC-G1-083", "DC-G1-081", "DC-G1-087", "DC-G9-028"]
