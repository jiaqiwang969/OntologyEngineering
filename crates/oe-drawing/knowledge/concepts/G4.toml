[[concepts]]
id = "DC-G4-015"
name = "对称机件只画一个箭头的尺寸注法"
aliases = ["对称机件的单箭头尺寸"]
group = "G4"
kind = "dimension_element"
meaning = "对称机件只画一半或略多于一半（半视图、半剖视、断开画法）时，尺寸线略超过对称中心线或断裂边界，只在画出的一端画箭头；数字仍是完整尺寸（全宽或全直径）。"
components = ["尺寸线：从画出部分的尺寸界线起，越过对称中心线或断裂边界少许后终止，此端不画箭头", "单个箭头：在画出的一端，触及尺寸界线", "数字：完整尺寸，如 Ø32、76，常带 Ø", "对称符号：半视图时对称中心线两端各画两条垂直于它的短平行细实线", "半剖视图中内孔直径、钻孔锥顶角等一端未画全的尺寸同样处理"]
variants = ["across centre line of half-view", "across break line"]
dxf_forms = ["DIMENSION dimtype 0 with one side suppressed: DIMSD1/DIMSD2=1 and DIMSE1/DIMSE2=1, or DIMBLK1/DIMBLK2 = _NONE", "exploded: LINE with a single SOLID arrow at one end, the free end lying a short distance past a centre LINE on layer 05", "TEXT '%%c32' near the dimension line, often off-centre"]
recognition = "锚点为只有一端有箭头的尺寸线，另一端为自由端，自由端越过一条点画线（05层中心线）或波浪线/双折线一小段（约1~3倍箭头长）。数值≈箭头端到对称线距离的2倍×比例，是强证据；数字无 R，常含 Ø。与半径尺寸区分：半径尺寸线沿径向指向圆弧并有 R；与单边箭头区分：单边箭头是半个三角且两端都有终端；与漏画箭头区分：自由端必须越过对称线或断裂边界。"
confusions = ["半径尺寸：单箭头但有 R，尺寸线通过圆心", "单边箭头（简化）：两端都有半箭头", "尺寸线被误截断：自由端未越过中心线", "坐标式尺寸：基准处是原点小圆而非对称中心线"]
related = ["DC-G4-030", "DC-G4-006", "DC-G4-008", "DC-G4-089", "DC-G3-161", "DC-G2-020", "DC-G1-021"]
priority = "medium"
text_forms = ["Ø32", "Ø20", "76", "120°"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "Examples read from GB/T 4458.4 图14/15 OCR and the textbook half-section example; overshoot length ratio is general practice."
