[[concepts]]
id = "DC-G3-117"
name = "断开画法（较长机件断开缩短）"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "沿长度方向形状一致或按一定规律变化的较长机件（轴、杆、型材、连杆等）可截去中间一段后缩短绘制；断开处画断裂边界线，长度尺寸仍按未缩短的实际长度标注。"
components = ["两段保留的图形沿长度方向排列在同一轴线上，中间留出一段空白间隙。", "间隙两侧各画一条断裂边界线：细波浪线最常用，也可用双折线或细双点画线；两条边界线大致平行，横跨整个截面轮廓。", "实心和空心圆柱的断开处，教材另给出带回弯曲线的特殊断裂画法，也可统一用波浪线或双折线。", "跨过断开处的长度尺寸连续画出，尺寸数字为实际长度，因此大于图上两端点的几何距离。", "轴线或对称中心线（细点画线）通常穿过间隙连续画出。"]
variants = ["wavy-line break", "double-break (zigzag) line", "thin double-dash line"]
dxf_forms = ["Wavy break boundary as SPLINE or LWPOLYLINE with bulges on layer 02 (thin), one curve on each side of the gap", "Double-break (zigzag) boundary as LWPOLYLINE or LINE strokes on layer 02 with a small Z-jog in the middle", "Thin double-dash boundary as LINE with a PHANTOM-type linetype on layer 07", "Outline LINEs on layer 01 stopping at the break curves; DIMENSION spanning the gap whose text is overridden or whose measurement is scaled (DIMLFAC / broken associativity) to the true length", "Special S-break of round bars as paired ARC/SPLINE loops, sometimes with a small HATCH ANSI31 inside one loop"]
recognition = "以细线层上的波浪线（SPLINE/带凸度多段线）或双折线为锚点：在同一视图中成对出现、彼此近似平行、间距通常小于截面高度的1～2倍，两条曲线的两端都落在同一组平行粗实线轮廓上，这些轮廓线在两条曲线之间中断并在另一侧共线延续；两曲线之间无剖面线、无图形。若有线性尺寸跨越该间隙，其数值明显大于两尺寸界线间的几何距离，可作为确认证据。细双点画线形式要求短、横跨截面且两侧轮廓共线延续，以区别于假想轮廓。局部视图和局部剖视的波浪线只有一条，不成对。"
confusions = ["局部视图的断裂边界：只有一条波浪线，图形到此终止，另一侧不再延续。", "局部剖视的分界波浪线：单条，一侧有剖面线、另一侧为外形视图。", "配置在视图中断处的移出断面：断开间隙内画有断面图形及剖面线。", "细双点画线假想轮廓：表示相邻件或运动极限位置，不成对夹住中断的轮廓。"]
related = ["DC-G2-041", "DC-G1-032", "DC-G1-011", "DC-G1-042", "DC-G1-029", "DC-G2-033", "DC-G2-076", "DC-G2-023", "DC-G3-063"]
priority = "high"
text_forms = []
knowledge_units = ["K11", "K12", "K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "GB/T 4458.1-2002 5.5 写的是旧线型编号（细实线 No.01.1、细双点画线 No.05.1）；GB/T 16675.1-2012 A.4 与教材 §7-4(7) 同意，教材补充尺寸按实际长度标注及圆柱的特殊断裂画法。中心线连续穿过间隙、DXF 中尺寸覆盖或比例因子、成对间距等识别要点来自一般 CAD 制图实践。DC-G2-041 是 G2 中的同一规则。"
