recognition = "锚点为一排等长、等距、同向的短斜线（长度约为间距的1.5~3倍），其一端全部落在同一条直线上，另一端自由。与剖面线区分：剖面线填满一个封闭的零件断面区域，两端都抵在轮廓上；机架斜线只在一条线的一侧形成窄带。与焊缝符号区分：焊缝符号在指引线的基准线上，附带焊缝尺寸文字。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。"
confusions = ["剖面线：充满封闭断面区域，两端都抵轮廓线。", "焊缝符号、断续焊缝标记：位于指引线基准线上，配有尺寸文字。", "地面/基础剖面符号（泥土）：属零件图或建筑图的材料剖面，由短斜线与轮廓组合但不与机构构件相接。"]
related = ["DC-G3-152", "DC-G3-155", "DC-G3-158", "DC-G1-010", "DC-G2-047"]
