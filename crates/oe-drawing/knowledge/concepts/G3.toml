meaning = "型材标记中表示钢轨的图形符号，为顶部小圆头、细竖腰和底部横脚组成的轨形；该型材没有字母代号。"
components = ["图形符号顶部为一个小圆点（轨头），向下一条竖线（轨腰），底端一条短横线（轨底）。", "符号后接特征尺寸或型号，必要时接切割长度。"]
variants = []
