[[cards]]
id = "standard_part"
expression_kind = "standard_part"
title = "标准件的简化画法（库零件图块）"
meaning = "装配图中的螺钉、螺母、销等标准件按 GB 规定的简化画法画出，剖切平面通过其轴线时按不剖绘制（不画剖面线）；CAD 常从图库插入一个图块，块中只有结构线：粗实线轮廓、细实线（如螺纹小径）、点画线轴线、虚线（如内六角）。它的身份由所指的零件序号和明细栏中该行的标准编号给出；常有一个与其外形相同的遮罩挡住后面的线。"
sources = [
  "GB/T 4458.6-2002 机械制图 图样画法 剖视图和断面图 4.4（紧固件按不剖绘制）",
  "GB/T 16675.1-2012 技术制图 简化表示法 第1部分：图样画法 A.7",
  "GB/T 4459.1-1995 螺纹及螺纹紧固件表示法 6.1",
  "GB/T 4458.2-2003 机械制图 装配图中零、部件序号及其编排方法 4.1",
]
knowledge_units = ["K34", "K13", "K15"]
recognition = "一个没有文字、只有直线和圆弧的图块；一个零件序号的圆点落在它的范围内，而明细栏中这个序号的行在代号（或名称）中写有标准编号（本卡词表）。块中各线按自身线型读：点画线为轴线，虚线为不可见轮廓，连续线中粗的一类为轮廓。没有序号和明细栏对应时不当作标准件（重复要素的图块同样只有结构线）。"
markers = []
concepts = ["DC-G8-003", "DC-G3-060"]

[[cards.components]]
role = "contour_segment"
primitives = ["LINE", "ARC"]
requirement = "粗实线轮廓"

[[cards.components]]
role = "center_line"
primitives = ["LINE"]
requirement = "点画线轴线"

[[cards.components]]
role = "hidden_segment"
primitives = ["LINE", "ARC"]
requirement = "虚线（不可见结构）"

[[cards.variants]]
id = "library_block"
title = "图库插入的标准件图块"
distinguishing = "序号圆点在块内，明细栏该行有标准编号"
encodings = ["block"]
tests = ["parts_list_block_rows_match_item_numbers"]

[[cards.counter_examples]]
statement = "没有序号指着、或明细栏该行没有标准编号的结构线图块不当作标准件"
test = "structure_block_without_a_standard_row_is_not_a_standard_part"

[[cards.parameters]]
