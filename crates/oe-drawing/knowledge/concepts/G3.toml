[[concepts]]
id = "DC-G3-076"
name = "齿线表示"
aliases = ["斜齿人字齿齿线表示"]
group = "G3"
kind = "conventional_representation"
meaning = "在齿轮的非圆视图上，用三条与齿线方向一致的细实线表示斜齿、人字齿或弧齿等齿线特征；直齿不需表示。"
components = ["三条等距平行细实线，画在非圆视图的齿部区域中央，倾角与螺旋角β一致（斜齿）。", "人字齿：三条V形折线，折点在齿宽中部。", "弧齿或圆弧齿：三条同向弧线。", "半剖或局部剖时画在未剖的一侧。"]
variants = ["斜齿（平行斜线）", "人字齿（V形线）", "弧齿/圆弧齿"]
dxf_forms = ["Three thin LINEs (layer 02) parallel to each other, inclined to the gear axis direction by the helix angle, inside the tooth band of the non-circular view", "Herringbone: three thin V-shaped LWPOLYLINEs or LINE pairs", "Curved teeth: three thin ARCs"]
recognition = "锚点为齿轮非圆视图中的齿部带（两条粗实线齿顶线之间，中间夹分度点画线）；在带内找恰好约3条等距细实线，彼此平行且与轴线方向成β角（常见8°–30°），线端在齿顶线附近截止；人字齿为三条V形线。与剖面线区分：剖面线为45°、条数多、间距小且只在被剖区域；与滚花区分：滚花为粗实线、密集网纹或斜纹，位于圆柱外表面；与机构简图齿线符号区分：后者画在简化的齿轮矩形符号中。"
confusions = ["剖面线：45°、多条密排、只在剖面区域。", "滚花网状结构：粗实线、密集、常交叉成网。", "机构简图的齿线符号：在简图符号内，不在零件视图上。"]
related = ["DC-G3-022", "DC-G3-206", "DC-G3-045", "DC-G1-010", "DC-G1-043"]
priority = "medium"
text_forms = ["螺旋角 β=15°", "旋向 右"]
