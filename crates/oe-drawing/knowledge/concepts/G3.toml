[[concepts]]
id = "DC-G3-164"
name = "往复运动动态密封要素符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "往复运动密封圈特征画法中，由矩形线框中心画出、与相应轮廓线成30°的短粗实线，代表往复运动的动态密封唇。"
components = ["短粗实线一端在线框中心，另一端斜向（与相应轮廓线成30°）伸向动密封表面一侧，不触框。", "与往复运动静态要素（由中心画出、平行于轮廓线并伸到框边的短线）在中心相接，组合成“>—”、Y形或单折线形。", "双唇型为两条30°短线成“<”形；多层V形组合密封可画成两个并列的“>>”形。", "必要时在斜线端加箭头表示密封方向。"]
variants = []
dxf_forms = ["Short thick LINEs on layer 01 radiating from the frame centre, part of an exploded seal symbol", "INSERT of a hydraulic seal library block (O/Y/V-ring style) where available"]
recognition = "锚点为密封框中心点，从该点发出一条伸到框边的平行短线（静态）和一条或两条与轮廓线约成30°的短斜线（动态），线长约为框半宽到框宽的0.6倍。多出现在活塞、活塞杆、缸盖等往复运动部位。注意与三点接触轴承特征画法的Y形区分：后者位于旋转轴的轴承座处、框尺寸符合轴承比例，并应结合明细栏中“Y形圈/密封圈”或“轴承”文字判断。"
confusions = ["防尘副唇符号：与长动态斜线成90°的短线，用于旋转轴唇形密封。", "三点接触球轴承特征画法（Y形）：位于轴承位置，由明细栏和位置区分。", "旋转轴唇形密封的长斜线：从静态长线端点出发，长度接近框对角线。"]
related = ["DC-G3-166", "DC-G3-114", "DC-G3-150", "DC-G3-202", "DC-G3-124"]
priority = "rare"
