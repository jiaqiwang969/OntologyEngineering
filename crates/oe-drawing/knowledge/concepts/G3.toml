meaning = "装配图中的软管接头可按标准给出的简化形式绘制：以接头外形轮廓和软管段为主，不画内部多层结构、扣压细节和剖面线。"
components = ["接头螺母、六角体和接头体画成沿同一轴线依次相接的矩形外形。", "扣压套画成矩形外形，内部的软管层、扣压齿等不画。", "软管段以两条平行轮廓线从扣压套伸出，端部可断开。", "内部孔道和螺纹只以少量细线示意，不画剖面线。"]
