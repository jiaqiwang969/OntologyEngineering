[[concepts]]
id = "DC-G7-136"
name = "焊缝符号指引线"
aliases = ["焊缝指引线"]
group = "G7"
kind = "weld_indication"
meaning = "焊缝符号的指引线：由细实线箭头线（箭头指向接头）和与之相连的基准线（一条细实线及一条平行细虚线）组成，焊缝符号和数据写在基准线上；基准线一般平行于标题栏长边，必要时垂直。"
components = ["箭头线：倾斜细实线，末端实心箭头落在接头上，可从基准线左端或右端引出，受限时可折弯一次。", "基准线实线：与箭头线相接。", "基准线虚线：与实线平行。", "名称差异：GB/T 324称整体为“指引线”、斜线为“箭头线”；GB/T 12212-2012图11把斜线称“指引线”（1990版称箭头线）。"]
variants = ["reference line parallel to the sheet bottom / title block long side (normal)", "reference line perpendicular to it when needed", "arrow line leaving from the right or the left end of the reference line"]
dxf_forms = ["LEADER entity (group 71 arrowhead flag = 1) whose last vertex starts the reference line, or MLEADER with landing", "LINE + SOLID (filled arrowhead) + horizontal LINE + parallel dashed LINE in exploded form", "reference line pair: thin continuous LINE plus a parallel LINE with dashed linetype (DASHED/HIDDEN/ACAD_ISO02W100) offset ≈ 3d' ≈ 0.3h, dashes ≈ 0.9h, gaps ≈ 0.3h (GB/T 12212 proportions)", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes"]
recognition = "锚点为“实心箭头斜线＋与之端点相接的水平（或竖直）细实线”，且该细实线附近有平行细虚线或基本符号笔画。箭头尖必须落在零件轮廓（接缝）上；基准线长度通常为3～8倍字高。区分零件序号指引线（末端圆点、横线上为数字）和几何公差指引线（另一端接框格）。"
confusions = ["GB/T 4457.2普通指引线加基准线：横线上为说明文字。", "装配图零件序号指引线：末端圆点。", "尺寸线：两端箭头并有尺寸界线。", "几何公差指引线：连公差框格。"]
