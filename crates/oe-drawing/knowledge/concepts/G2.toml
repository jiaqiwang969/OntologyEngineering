dxf_forms = ["180° ARC with radius ≈ text height plus a small SOLID or tapered LWPOLYLINE arrowhead, next to the view-name TEXT", "Block INSERT of a rotation-symbol block, or a glyph from a special SHX/TrueType font"]
recognition = "以视图名称文字为锚点：其左侧或右侧约一个字高范围内有一段180°圆弧，半径为字高的0.8～1.2倍，一端带箭头；之后可能有角度数字。弧长符号位于尺寸数字上方且无箭头；运动方向箭头在机构简图中且尺寸较大。"
confusions = ["弧长符号：在尺寸数字上方或前面，无箭头。", "运动方向、旋向箭头：在机构或弹簧图中，不在图名旁。", "旋向标记LH：是文字。"]
