[[concepts]]
id = "DC-G5-013"
name = "非尺寸要素基准的标识放置"
aliases = ["基准要素为轮廓要素时的基准符号位置"]
group = "G5"
kind = "datum"
meaning = "基准要素是一个表面而非尺寸要素时，基准三角形放在该面的轮廓线或延长线上并与尺寸线明显错开，也可放在指向该面的公差框格上，或放在由该面引出的参照线上；表示基准是这个组成要素本身。"
components = ["三角形底边贴在轮廓线或其延长线上，与任何尺寸线明显错开", "放在公差框格上：三角形贴在一个其指引线指向该表面（轮廓、延长线或参照线）的框格边上", "放在参照线上：参照线经指引线连到表面，指引线在可见表面内以实心圆点终止；表面不可见时指引线为虚线、终端为空心圆"]
