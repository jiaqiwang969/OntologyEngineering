[[constraints]]
id="source_session_storage_ordered"
requirement="req_semantic_platform"
module="semantic_runtime"
rust_path="crates/semantica-runtime/src/dataset/source_session.rs"
check="execute2"
statement="Explicit /2 actions use the same sole execution loop and DatasetSession as /1. Serialize delegates existing source NT/NQ owner with text and warnings; diff delegates existing source snapshot integrity/algorithm owner. Endpoints name strictly earlier actual completed full snapshot results, not caller snapshots, expected outputs or revision-only inference. Original context/cache effects remain. Read observations continue after action errors, mutation tail is skipped, capture exhaustion stops all later actions. All result bytes use unchanged aggregate capture limits. /1 request/result/schema/old five action semantics remain unchanged. Host save/reload requires actual file bytes and fresh source binding; worker has no path or network authority. Original49 and old two entropy failures remain separate obligations."
severity="error"

