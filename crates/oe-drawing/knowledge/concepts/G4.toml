[[concepts]]
id = "DC-G4-031"
name = "装配图尺寸类别"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "装配图只注必要尺寸，按作用分为性能（规格）尺寸、装配尺寸（配合与相对位置）、安装尺寸、外形尺寸及其他重要尺寸；同一尺寸可兼有多种作用，一张装配图不一定五类俱全。"
components = ["性能（规格）尺寸：表征机器或部件规格、设计时已定的尺寸，如阀的公称通径、减速器齿轮中心距。", "装配尺寸：零件间配合尺寸（如Ø50H11/h11）、保证相对位置的尺寸及装配时加工的尺寸。", "安装尺寸：部件安装到基础或其他部件所需的尺寸，如安装孔距、连接螺纹规格。", "外形尺寸：总长、总宽、总高，为包装、运输和安装占位提供数据。", "其他重要尺寸：设计确定又不属上述各类的尺寸，如运动件的极限位置尺寸。"]
variants = ["性能（规格）尺寸", "装配尺寸", "安装尺寸", "外形尺寸", "其他重要尺寸"]
dxf_forms = ["ordinary DIMENSION entities (linear/aligned/diameter) on the assembly drawing; the category itself is not stored in DXF", "fit sizes as override text '%%c50H11/h11' or MTEXT stacked '\\SH7/g6;'", "thread or size text such as 'M36×2-6g' as DIMENSION override or TEXT", "layer 08 or template dimension layer"]
recognition = "无独立图形，是对装配图尺寸的功能分类，需推理：先确认图纸为装配图（有零件序号和明细栏）。再给每个尺寸打标签：文字含孔/轴配合代号（大写/小写公差带以斜线或叠写分隔）为装配尺寸；三个方向上跨越整体包络的最大尺寸为外形尺寸；底座/法兰安装孔间距、安装面定位尺寸及连接螺纹规格为安装尺寸；与产品型号相关的通径、中心距为性能尺寸；其余与运动极限、中心高相关的为其他重要尺寸。允许一个尺寸多标签，不要求五类齐全。"
confusions = ["零件图尺寸：零件图须完整注出定形、定位、总体尺寸；装配图只注少量必要尺寸，不能据此拆画全部零件尺寸。", "零件图的定形/定位/总体分类：是零件图的分类方式，与装配图五类不同。", "零件图公差带代号：零件图单注孔或轴的公差带，装配图以配合代号同时注出两者。"]
related = ["DC-G4-014", "DC-G4-150", "DC-G4-151", "DC-G8-013", "DC-G8-014"]
priority = "medium"
text_forms = ["Ø50H11/h11", "Ø32H7/h6", "M36×2-6g", "115±1.1", "70±0.03"]
knowledge_units = ["K15"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Semantic classification from textbook §10-2 and §10-5; no separate drawn form. The automatic labelling heuristics are general practice, not from the sources."
