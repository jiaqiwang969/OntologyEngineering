recognition = "统计全图文字高度（计入块缩放与比例因子），应集中在系列值或其比例倍数上（如1:2 模型空间中出现7、10）。以最常见的字高推断尺寸字高 h，用来估算其他符号的大小（箭头、表面结构符号、投影符号）。偏离系列的字高多来自缩放的块或非标准模板。"
confusions = ["线宽数系：同为公比√2的数系，但用于图线。"]
