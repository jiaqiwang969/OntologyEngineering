    prohibited_relations:
      - automatic_merge_of_all_green_results_into_the_central_claim
      - any_visual_claim_that_the_product_is_released_or_trustworthy
      - any_visual_claim_that_a_report_is_false
      - ASIL_or_SafetyGoal_semantics
      - unrelated_devices_masquerading_as_six_snapshots
      - mechanically_implausible_direct_steering_wheel_to_motor_assembly
      - software_represented_as_a_second_unrelated_circuit_board
      - either_side_rail_crossing_the_open_gap_or_becoming_product_approval
      - environmental_chamber_or_complete_EPS_inside_shock_vibration_card
      - microphone_or_NVH_interpretation_inside_shock_vibration_card
    generated_text_policy: >-
      只允许六张牌及两个对象标签使用受控中文；最终出版文字必须由确定性叠加层校对，
      不允许任何额外文字、伪字、数字、Logo 或水印。
  pre_observation_ref: deferred_until_rebuilt_figure_has_a_reader_location
  post_consumption_ref: deferred_until_rebuilt_figure_has_a_reader_location
  caption: >-
    多份局部 PASS 可以分别真实；在对象、配置、concern、情境、时段与决定范围没有
    对齐以前，它们不会仅靠数量合成可签署的产品可信主张。该图是教学概念图，
    不是 EPS 项目证据，也不表示任何报告已被接受。
  alt_text: >-
    上方是一副完整汽车底盘，只有从方向盘经转向柱、ECU 和助力电机到前桥齿条与两侧前轮的
    转向路径被高亮；同一套 EPS 从底盘前桥位置向下抽出放大。六张结果牌由左右两条无箭头母线整理，
    分别标有“概念边界、硬件分析、软件回归、系统台架、冲击振动、生产写入”。
    “冲击振动”牌只包含 ECU、连接器与安装支架局部总成、振动台夹具和测点，不包含环境箱或整套 EPS。
    两条母线都在中央主张边界前停止，数段琥珀色括片也没有闭合成产品主张。
