components = ["写在公差限值之后，以空格分隔，如L Ra 2 T16% / …。", "只作用于T16%所在行的参数；同一行为双侧公差时，上下限各允许16%超差。", "检验程序见草案附录E。", "GB/T 131-2006中16%规则是缺省规则，不加任何标记。"]
