# ---------------------------------------------------------------- route, review page and independent checks

[[requirements]]
id = "req_md_drawing_route"
function = "Read one drawing end to end with one receipt: convert the DWG with a pinned converter, classify the DXF bytes in the isolated worker under the current Project, re-derive source conservation and output contracts independently from the same bytes, and render a review page that is checked offline in a browser"
condition = "A converter executable built from the locked fork commit and recorded locally with its digest; the macOS sandbox for the worker; a browser for the page checks; drawing, Project and object given explicitly; no reference answers, regions, feedback or paired models"
acceptance = "The first failing step stops the run and later steps are recorded as not run; a converter whose version, digest or commit does not match is refused before it runs; the independent checks pass; the page passes its browser checks in every mode; passing is not engineering acceptance of the classification"

[[modules]]
id = "drawing_understanding_check"
kind = "calculation"
rust_path = "crates/oe-drawing-check"
purpose = "独立复核读图结果：只从源 DXF 字节重新推导源对象、原生成员、线型节奏、端点、区间覆盖、表达族、视图与结构线并逐项核对；检查页在离线浏览器中按页面内嵌的关系图计算期望逐项检查；不调用分类程序代码，不产生分类"
realizes = ["req_md_drawing_route"]
depends_on = ["core", "contracts"]
platform = "Rust 1.95；页面检查运行调用方给出的 Chrome（无头、独立用户目录、只读本地页面）"
effects = "只读源字节、关系图、复核与页面；在新位置写检查报告、浏览器结果与截图"
failures = "首个不符即停并给出该项名称；浏览器超时或失败如实记录；通过只说明源守恒与输出合同一致，不说明工程正确"
status = "source_only"
source_refs = ["drawing_understanding_method", "drafting_ontology"]

