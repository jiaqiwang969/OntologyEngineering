[[concepts]]
id = "DC-G3-173"
name = "机构简图弹簧符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中弹簧的简化图形符号（压缩、拉伸、扭转、碟形、截锥涡卷、涡卷、板状弹簧）；弹簧的详细表示按弹簧表示法标准。"
components = ["压缩弹簧：两端竖直端线之间的一串锯齿折线，沿点画线轴线排列；可用引线注明簧丝截面为圆或方。", "拉伸弹簧：锯齿折线两端各连一个带中心线的小圆（钩环）；扭转弹簧：锯齿折线旁配一个带切向伸臂的小圆（端视）。", "碟形弹簧：侧视为梯形轮廓，叠合时画成多条平行斜线。", "截锥涡卷弹簧：多级阶梯状的嵌套折线；涡卷弹簧：平面螺旋线，外端带钩。", "板状弹簧：中间有矩形夹箍的弓形（月牙形）轮廓，过夹箍有点画线。", "1984 版附录 A.9 与 2013 版 12.9 包含同样的七种。"]
variants = ["压缩弹簧", "拉伸弹簧", "扭转弹簧", "碟形弹簧", "截锥涡卷弹簧", "涡卷弹簧", "板状弹簧"]
dxf_forms = ["Zigzag LWPOLYLINE (or exploded LINEs) on layer 01 between two short end LINEs, axis LINE on layer 05", "End loops and torsion arms as CIRCLE/ARC plus LINE; spiral spring as a SPLINE or chained ARCs", "Optional leader (LEADER/MLEADER) with a Ø or □ mark for the wire section", "INSERT of a library block"]
recognition = "锚点：沿一条点画线轴线等节距重复的锯齿折线（齿数通常 6 个以上），两端有竖直端线或小圆钩环。再按附件细分：两端小圆→拉伸；伴小圆加伸臂→扭转；梯形或平行斜线叠→碟形；阶梯嵌套折线→截锥涡卷；平面螺旋→涡卷；弓形加中间方块→板状。与零件图/装配图中的弹簧示意画法区分：后者画在真实视图中、与簧丝直径和节距成比例，或剖面涂黑；与螺旋副/螺杆传动区分：后者波浪线位于矩形内或配螺母；与双折线区分：双折线只有一两个 Z 形折点。"
confusions = ["装配图中小截面弹簧示意画法：单线按实际尺寸画在视图中，不是简图符号。", "螺旋副、螺杆传动符号：波浪线位于矩形框内或配螺母标记。", "双折线（断裂线）：只有一两个尖折，不重复成串。"]
related = ["DC-G3-130", "DC-G3-017", "DC-G3-019", "DC-G3-018", "DC-G3-042", "DC-G3-028", "DC-G3-025", "DC-G3-029", "DC-G3-191", "DC-G1-011"]
