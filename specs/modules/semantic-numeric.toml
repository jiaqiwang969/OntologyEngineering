statement="The shared compiled evaluator has an explicit startup Result channel. Source Project/Slice/Order/Union start eagerly, whereas source generator nodes Filter/Extend/Distinct and SourceGroup defer child startup to first poll as required by original evaluation. Direct LIMIT0 can reach ORDER; DISTINCT LIMIT0 can shield it; OFFSET can cause polling even with LIMIT0. Union collects left then right before outer ORDER keys, while Group update and per-group finish retain their demand boundaries."
severity="error"

