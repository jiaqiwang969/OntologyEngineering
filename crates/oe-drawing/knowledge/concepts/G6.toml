[[concepts]]
id = "DC-G6-027"
name = "旧版Ra数值省略参数代号的注法"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "按GB/T 131-1993（及1983）绘制的图样上，在符号V形开口上方只写一个微米数值即表示Ra上限值；数值带max/min或上下叠写两个数值，分别表示最大/最小值或上下限值。"
components = ["数值写在短边上方、V形开口上方（2006版附录I称为“x”位置），不写参数代号Ra。", "单个数值为Ra上限值（16%规则）；数值后接max为Ra最大值。", "两个数值上下叠写：上为上限值，下为下限值；“3.2max”叠“1.6min”为最大值和最小值。", "其他高度参数须写代号，如Ry3.2、Rz200。", "2006版要求新图避免该位置，并总是写出参数代号，要求写在横线下方（Ra 3.2）。"]
variants = ["GB/T 131-1993 表2 (e.g. 3.2, 3.2max, 3.2 over 1.6, 3.2max over 1.6min)", "GB 131-1983 likewise (only Ra and 16% rule)", "GB/T 131-2006 附录I: this old position 'x' is to be avoided in new drawings; the code is always written"]
dxf_forms = ["INSERT of an old-style block (2 or 3 LINEs, often without a bar) with ATTRIB or TEXT number placed between/above the legs", "exploded LINEs + TEXT '3.2' / '6.3' / '12.5' near the V opening; text often rotated with the symbol", "stacked limits as two TEXT entities or MTEXT stacking (\\S3.2^1.6); '3.2max' as one TEXT", "often together with an enlarged '其余' symbol in the upper-right corner of the sheet"]
recognition = "锚点：基本、去除材料或不去除材料符号（常无横线）；数值文字中心位于两斜边之间偏上（约在短边竖高处或其上方），字头朝向开口方向并随符号旋转，字高≈h。数值无字母前缀且属于GB/T 1031 Ra系列（如0.8、1.6、3.2、6.3、12.5、25、50）。同一图上若出现横线下方的“Ra 3.2”，说明为2006版写法；两种并存时各按位置解释。区分加工余量（短边左侧位置e，mm）、1993版取样长度（横线下方）和附近尺寸数字（属尺寸线，有箭头和尺寸界线）。"
confusions = ["加工余量：写在短边左侧（位置e），单位mm", "1993版取样长度：写在横线下方，如0.8、2.5", "附近尺寸数字：属于尺寸线或DIMENSION，不在V形开口处", "2006版“Ra 3.2”：有代号，位于横线下方"]
related = ["DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G6-046", "DC-G6-030", "DC-G6-021", "DC-G6-028", "DC-G6-073", "DC-G6-006", "DC-G6-049"]
priority = "high"
text_forms = ["3.2", "6.3", "12.5", "3.2max", "3.2 / 1.6（上下叠写）", "3.2max / 1.6min", "Ry3.2", "Rz200"]
knowledge_units = ["K31", "K32"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "Figures are not in the OCR; placement from GB/T 131-1993 图6 (a1 above the short leg) and GB/T 131-2006 附录I (position 'x'). High priority is a practice judgement: many drawings in service still use this style."
