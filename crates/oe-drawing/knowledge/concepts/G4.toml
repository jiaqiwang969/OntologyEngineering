recognition = "锚点：一组半径相近（相差不超过约20%）的CIRCLE，可按“有/无实心填充或记号”或“相邻字母TEXT”分成两类以上；每类附近有一个n×Ø文字，n应等于该类圆的数量。与基准字母区分：基准字母在方框内并连基准三角；与视图/剖视字母区分：视图字母配箭头或以“A—A”形式出现在视图上方；与表面处理区域标记区分：后者是粗点画线范围。"
confusions = ["基准字母：方框加涂黑或空白三角", "视图、剖视名称字母：与投射箭头、剖切符号配对", "表面处理/热处理区域：粗点画线标出范围", "剖面涂黑（窄截面）：填充的是剖面区域而非孔"]
