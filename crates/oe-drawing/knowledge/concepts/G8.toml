[[concepts]]
id = "DC-G8-005"
name = "接触面单线非接触面双线"
aliases = []
group = "G8"
kind = "conventional_representation"
meaning = "装配图中相邻两零件的接触面和配合面（如轴与轴承孔的配合面）只画一条线；不接触、不配合的表面（如螺钉与光孔）即使间隙很小也必须画成两条线。"
components = ["接触面或配合面：两零件共用一条粗实线，两侧剖面线方向相反或间隔不同。", "非接触面：两条平行或同心的粗实线，间距可以夸大，中间不画剖面线。", "典型例子：注配合代号（如Ø50H11/h11）的面为单线；螺栓杆与光孔（孔径约1.1d）之间为双线。"]
variants = []
dxf_forms = ["single shared LINE/ARC on layer 01 between two HATCH regions of different angle (e.g. ANSI31 at 0° and 90° pattern rotation)", "two parallel LINE entities on layer 01 with a small blank gap between hatched regions", "in exploded drawings the shared contact edge may be duplicated as two coincident LINEs"]
recognition = "以两个剖面线区域之间的公共边界为锚点：若两个方向或间距不同的剖面线区域之间只有一条粗实线（两区边界共用此线），判为接触面或配合面；若两区域之间有两条平行粗实线，间距很小（出图后约0.5~2 mm）且间隙内无剖面线，判为非接触面。配合代号（H7/g6等）所指的面应为单线，螺纹紧固件穿过的光孔应为双线，可互相印证。DXF中两条完全重合的线（重线）不能算双线，双线必须间距大于零。"
confusions = ["重线（两条重合的线）：间距为零，是同一接触面的重复图元，仍按单线理解。", "薄件或窄缝：薄垫片两条边线之间是零件材料（常涂黑或有剖面线），不是间隙。", "同一零件的轮廓与内孔：同一零件剖面线方向和间隔一致，区分零件要看剖面线。"]
related = ["DC-G8-002", "DC-G2-009", "DC-G3-053", "DC-G3-058", "DC-G4-150"]
priority = "medium"
text_forms = []
knowledge_units = ["K15"]
