[[concepts]]
id = "DC-G7-006"
name = "焊缝视图画法（细实线段）"
aliases = ["焊缝视图画法（加粗线）", "焊缝栅线画法"]
group = "G7"
kind = "conventional_representation"
meaning = "在视图中示意焊缝的位置和长度：沿接缝画一系列细实线短段（栅线），或改用加粗线（宽2d～3d）表示；同一图样只允许用一种画法，用图示法画出焊缝时通常还要同时标注焊缝符号。"
components = ["栅线：沿接缝排列的等长、等距细实线短段，通常与接缝垂直；环形焊缝则沿圆周径向排列；允许示意（徒手）绘制。", "断续焊缝：栅线成组出现，组长对应焊缝段长l，组间距对应间距e；交错断续时两侧组相互错开。", "加粗线画法：沿接缝画一条宽为粗实线2～3倍的线，断续焊缝画成分段加粗线。", "版本差异：1990版称“徒手绘制”“粗线（2b～3b）”，2012版改为“示意画法”“加粗线（2d～3d）”。"]
variants = ["continuous row", "intermittent groups", "staggered groups on two edges", "radial strokes around a ring weld", "1990 edition: 徒手绘制 (freehand)", "continuous thick line", "segmented thick line for intermittent welds", "1990 edition: 粗线 2b–3b"]
dxf_forms = ["many short LINE entities (thin, layer 02) of equal length ≈1–3 mm at equal spacing along the joint line, often produced by ARRAY", "narrow HATCH strip with a user/ANSI line pattern oriented across the joint, used as a quick stroke row", "LWPOLYLINE with constant width 2–3× the thick-line width along the joint (加粗线画法), split into segments for intermittent welds"]
recognition = "锚点为两零件接缝的轮廓线。沿其一侧或两侧出现大量等长等距平行细短线（多与接缝垂直，长约1～3 mm），构成窄带，带长即焊缝长度；或沿接缝有一条明显宽于粗实线的宽多段线。判别：栅线只占接缝附近窄带，两端无剖面边界，方向通常不是45°；附近有焊缝符号指引线，且断续组的长度与间距可与符号中n×l(e)对应。"
confusions = ["剖面线：45°成片填满封闭剖面区域，而栅线只沿接缝成窄带。", "滚花网纹/直纹：覆盖回转面大片区域，并配“滚花”注写。", "齿轮、花键画法或断裂处波浪线：有节圆点画线或断裂边界等上下文。", "粗实线可见轮廓：加粗线比粗实线宽2～3倍并与接缝重合。", "热处理区域粗点画线：有点和间隔，平行偏移于轮廓。"]
related = ["DC-G7-132", "DC-G7-001", "DC-G7-009", "DC-G7-135", "DC-G7-007", "DC-G1-010", "DC-G2-042"]
priority = "medium"
text_forms = ["4×50(30)"]
knowledge_units = ["K43", "K40", "K41"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "同一图样只能用栅线或加粗线中的一种；用图示法画焊缝时一般同时标焊缝符号（GB/T 12212 4.6）。栅线长度和间距数值为通用习惯。"
