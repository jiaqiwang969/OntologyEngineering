[[constraints]]
id="semantic_snapshot_checksum"
requirement="req_semantic_platform"
module="semantic_runtime"
check="snapshot_checksum"
rust_path="crates/semantica-runtime/src/snapshot_checksum.rs"
statement="Preserve original compute_checksum compact sorted-key ensure_ascii JSON with SHA256, NaN/Infinity text, lone-surrogate escaping, numeric/bool dictionary identity and original CPython sort schedule. verify_checksum requires root.get, preserves missing/falsey early return, removes only root checksum, retains exact case-sensitive digest comparison and original exception order. Existing provenance canonical checksum is unchanged."
severity="error"

[[constraints]]
id="semantic_snapshot_checksum_entry"
requirement="req_semantic_platform"
module="kernel"
check="execute_local_snapshot_checksum"
rust_path="crates/oe-kernel/src/rules.rs"
statement="Existing formal semantic permission; explicit schema/operation/representation; full request16MiB and complete pretty result16MiB including newline. Native admission:65536nodes,131072links,4MiB scalar storage,128depth; integer carriers share scalar/wire bounds. Codec:16777216visits,128depth,65536digit numeric-comparison workspace and5second cooperative visit deadline, excluding ingress,IO,request identity and result handling. Original4300digit textual failure is distinct from admission and comparison; plain JSON retains original ingress. Preserve falsey-checksum short circuit without serializing unused values. Never truncate, normalize, fill failures or claim engineering validity."
severity="error"

[[constraints]]
id="semantic_version_storage_codec"
requirement="req_semantic_platform"
module="semantic_runtime"
check="compute"
rust_path="crates/semantica-runtime/src/version_storage_codec.rs"
statement="Shared codec composes existing native values, exact numeric comparison, original source sort and float text. The same dependency-free index sorter is available with default features; nullable query/source-session execution keeps its original opt-in gates. Storage serialization retains original spaces and key order; decoder identity/persistence use separate state owners. Existing native transport cannot represent cycles; raw-arena internal codec preserves cycle error, but no new cyclic public carrier is claimed."
severity="error"

