[[cards]]
id = "gdt_frame_content"
expression_kind = "geometric_tolerance"
title = "公差框格内容"
meaning = "公差框格从左到右依次为特征符号、公差值格（公差带形状符号 Ø/SØ、公差值及修饰符）和基准格。一个基准字母为单一基准，用短横连接的两个字母为公共基准，多格依次为第一、第二、第三基准组成的基准体系。框格用指引线连到被测要素：与尺寸线对齐时被测的是导出要素，箭头落在轮廓或其延长线上时被测的是组成要素。框格也常画成一个外框再用竖线分格。"
sources = [
  "GB/T 1182-2018 产品几何技术规范 几何公差 8.1、8.2、17.14",
  "GB/T 17851-2022 基准和基准体系 7.3、7.4",
  "机械制图（第7版）§9-5 三、图9-44",
  "互换性与测量技术 3.1.3",
]
knowledge_units = ["K23", "K24", "K25"]
recognition = "对已识别的框格读各格内容：第二格以 Ø 或 SØ 开头时公差带为圆柱或球；基准格中单个字母为单一基准，“A-B”为公共基准，两格以上为基准体系；框格指引线与尺寸线对齐为导出要素，箭头落在轮廓或延长线为组成要素。外框加竖线分格的框格按竖线把外框切成格再识别。"
markers = ["|", "Ø", "-"]
concepts = ["DC-G5-090", "DC-G5-091", "DC-G5-089", "DC-G5-002", "DC-G5-003", "DC-G5-004", "DC-G5-107", "DC-G5-108"]

[[cards.components]]
role = "frame_cell"
primitives = ["LINE", "LWPOLYLINE", "INSERT"]
requirement = "框格的格"
[[cards.components]]
role = "tolerance_value"
primitives = ["TEXT", "MTEXT"]
requirement = "公差值格"
[[cards.components]]
role = "datum_reference"
primitives = ["TEXT", "MTEXT"]
requirement = "基准格"
[[cards.components]]
