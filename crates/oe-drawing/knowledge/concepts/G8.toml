clause = "图A.16"
page = 31

[[concepts]]
id = "DC-G8-002"
name = "夸大画法"
aliases = []
group = "G8"
kind = "conventional_representation"
meaning = "装配图中对薄片零件、细丝弹簧、微小间隙和小斜度等，按实际尺寸难以画出或难以看清时，可不按比例而适当放大画出，使其清晰可见；所注尺寸仍为真实值。"
components = ["薄垫片、调整垫等的厚度被放大成可见的窄带，窄带可涂黑或画剖面线。", "微小间隙（如螺钉与通孔之间）被放大成明显分开的两条线。", "细丝弹簧的线径、小锥度、小斜度（如箱体油池底面的排油斜面）被适当放大。", "被夸大部位的尺寸数字仍按真实值注写，因此图上量取值与标注值不一致。"]
variants = []
dxf_forms = ["no dedicated entity: ordinary LINE/LWPOLYLINE outlines on layer 01 with exaggerated spacing", "thin gasket section as a narrow closed LWPOLYLINE filled by HATCH SOLID (涂黑) or ANSI31 on layer 10", "DIMENSION entity whose measured value differs from its displayed override text at the exaggerated feature"]
recognition = "没有专用标记，只能用“图上量取值与标注值不符”且发生在薄、小、细结构上来判断：如垫片标注厚度0.5，而按出图比例换算后图上宽度≥1 mm；螺钉与通孔的双线间距远大于孔径与螺纹大径之差。窄带涂黑区的出图宽度常不到2 mm。与非接触面双线的关系：双线规则只要求有两条线，夸大画法是把间距放大，两者常同时出现。大尺寸结构的量取不符应视为未按比例或错误，不归入此画法。"
confusions = ["尺寸不符或绘图错误：夸大画法只用于薄、小、细结构，目的在于可见。", "非接触面双线：属于拓扑规定（必须两条线），夸大是几何放大。", "狭小剖面涂黑：是断面的表示方式，常与夸大画法同时用于垫片。"]
related = ["DC-G8-005", "DC-G2-057", "DC-G3-130", "DC-G8-023"]
priority = "low"
text_forms = []
knowledge_units = ["K15"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "用 DIMENSION 实测值与覆盖文字比较作为线索属一般 CAD 实践。"
