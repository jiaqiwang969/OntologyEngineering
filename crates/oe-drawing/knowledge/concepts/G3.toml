[[concepts]]
id = "DC-G3-203"
name = "静态密封要素符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "密封特征画法中平行于密封表面母线的长粗实线，代表密封圈或防尘圈上起静态密封作用的部分（与座孔或轴静止配合的一面）。"
components = ["一条长粗实线，在矩形线框内紧贴一条长边并与之平行，长度接近框宽，两端不触两侧框边。", "轴用唇形密封的静态线在座孔一侧，孔用的在轴一侧。", "与动态斜线组合使用，斜线从其一端出发；2009版表1之3.2.1与1996版表1之1.1含义相同。"]
variants = ["2009 表1 3.2.1", "1996 表1 1.1"]
dxf_forms = ["Thick LINE on layer 01 parallel to the shaft axis, offset slightly inside a long side of the seal frame", "Contained in seal library INSERTs"]
recognition = "在轴与孔之间的小矩形框内，查找与轴线平行、与某一长边距离很小（约为框高的1/8～1/5）、长度接近框宽的粗线，并确认有斜线从其端点出发。区分：滚动轴承长线位于框高中部并有短线穿过；框线自身与之重合时说明是双线描边而非要素。"
confusions = ["滚动轴承长的粗实线（滚动轴线）：居中、被短线正交穿过。", "往复运动静态要素：由框中心出发的短线。", "防尘盖附加线：垂直于轴线、平行于端面框边。"]
related = ["DC-G3-150", "DC-G3-202", "DC-G3-118", "DC-G3-166"]
