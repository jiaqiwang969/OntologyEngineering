# Recognition coverage of the drafting concept catalogue (audited).
#
# Every rule the recognizer emits (expression builder calls in oe-drawing; line-piece rules are kept as rule evidence of the
# grouped expression), the expression kinds it produces and the catalogue concepts its expressions are instances of; the
# drawing-wide conventions applied to members and line styles; and a verdict per concept: full when its ordinary drawing
# forms are recognised, partial with what is missing. A concept status in concepts/G*.toml follows from this table and the
# recognition cards (card / rule / partial / none) and is checked by a test.
