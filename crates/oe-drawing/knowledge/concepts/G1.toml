dxf_forms = ["LEADER/MLEADER arrowhead block _DOT, _DOTSMALL or _DOTBLANK", "DONUT-like closed LWPOLYLINE of two bulged segments with width, or a solid-filled HATCH/CIRCLE", "mechanical add-ons export the balloon leader as LINE + filled dot + CIRCLE/TEXT"]
