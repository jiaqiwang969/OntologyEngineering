[[concepts]]
id = "DC-G2-037"
name = "小倾角圆投影简化"
aliases = []
group = "G2"
kind = "simplified_representation"
meaning = "与投影面倾斜角度小于或等于30°的圆或圆弧，手工绘图时其投影可用圆或圆弧代替椭圆。"
components = ["倾斜圆的投影：画成圆或圆弧而不是椭圆。", "倾角条件：圆所在平面与投影面夹角不超过30°。"]
variants = []
dxf_forms = ["CIRCLE/ARC where a true projection would need an ELLIPSE; drawings projected from 3D models normally emit ELLIPSE instead"]
recognition = "难以单独识别。以另一视图中倾斜≤30°的平面上的圆形结构为锚点：若对应视图中画的是圆或圆弧而不是椭圆，且由倾角推算的椭圆短长轴比≥cos30°≈0.87，判为此简化，用于解释投影不严格对应，不报错。"
confusions = ["真实椭圆投影：ELLIPSE实体，轴比与倾角一致。", "本来平行于投影面的圆。"]
