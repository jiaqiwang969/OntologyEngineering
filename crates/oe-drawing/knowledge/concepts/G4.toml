recognition = "锚点：尺寸公差文字串中，在两字母修饰符（GG、GX、GN、GC、CV等）或公差之后出现“/数值”。检验：斜线左侧不是公差带代号字母+数字（否则可能是配合代号H7/f6），右侧为单个数值而非公差带。与几何公差中的“0.02/100”区分：后者位于公差框格内；与配合代号区分：配合代号两侧均为“字母+数字”。"
confusions = ["配合代号 H7/f6：分子分母都是公差带代号", "几何公差每单位长度 0.02/100：在公差框格内", "日期或分数数值", "旗注编号"]
