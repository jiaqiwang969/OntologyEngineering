meaning = "螺栓或螺柱连接中的标准型弹簧垫圈，在装配图中按被螺母压平后的状态画出，其开口（斜口）方向应与螺纹旋向相反，一般右旋螺纹时斜口相当于左旋方向。"
components = ["垫圈截面：压平后的薄矩形，厚度与外径按螺纹规格d的比例折算。", "斜口：在主视图中用短斜线表示开口，倾斜方向与螺杆螺纹旋向相反。", "俯视图中为带开口的圆环。"]
variants = []
dxf_forms = ["Thin rectangle of thick LINEs between nut and part, crossed by one or two short oblique LINEs (the split)", "Standard-part library INSERT (GB/T 93 / GB/T 859); in plan view two CIRCLEs with a radial gap", "Parts-list TEXT such as '垫圈 GB/T 93 10'"]
recognition = "锚点：螺母与被连接件之间的薄矩形（宽约等于螺母宽，厚约为螺母高的1/3或更小），其上有一两条短斜线横贯；明细栏中出现 GB/T 93 或 GB/T 859。区分：平垫圈矩形内没有斜线；剖面线成片且只在剖切区域内；薄件涂黑为实心填充。"
confusions = ["平垫圈：矩形内无斜口线。", "剖面线：成组平行斜线。", "狭小剖面涂黑。"]
