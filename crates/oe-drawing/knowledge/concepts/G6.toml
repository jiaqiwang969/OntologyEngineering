[[concepts]]
id = "DC-G6-075"
name = "表面结构参数代号"
aliases = []
group = "G6"
kind = "text_convention"
meaning = "图上使用的表面结构参数代号，由表示轮廓类型的大写字母（R粗糙度、W波纹度、P原始轮廓）与表示特征的小写字母写在同一基线上组成，如Ra、Rz、RSm。"
components = ["轮廓参数：Ra、Rq、Rz、Rt、Rp、Rv、Rc、Rsk、Rku、RSm、RΔq、Rmr(c)、Rδc等，W、P轮廓同理（Wa、Wz、Pt等）。", "图形参数：R、AR、Rx（粗糙度图形），W、AW、Wx、Wte（波纹度图形）；支承率曲线参数：Rk、Rpk、Rvk、Mr1、Mr2及Rpq、Rvq、Rmq。", "旧代号（GB/T 131-1993、GB/T 3505-1983）第二字母写成下标：Ra、Rz（十点高度）、Ry（最大高度）、S、Sm、tp；新Rz采用旧Ry的定义，旧十点高度Rz已废止。", "计算机等效写法：RΔq写作Rdq、λs写作Ls、λc写作Lc。", "ISO 21920-2草案新增Rzx、Rmax、Rdc、Rmr(p,d)等，公式中用下标、图上用小写后缀；区域参数（S开头）另见区域参数卡。"]
variants = ["GB/T 131-2006 附录E tables E.1-E.9", "old codes in GB/T 131-1993 / GB/T 3505-1983: second letter as subscript (Ra, Rz ten-point height, Ry maximum height, S, Sm, tp); new Rz takes the definition of old Ry and old Rz is withdrawn", "computer-equivalent spellings in GB/T 3505 附录A (RΔq→Rdq, λs→Ls, λc→Lc)", "ISO 21920-2 draft codes: Rzx, Rmax, Rdc, Rmr(p,d), Ral, Rsw, Rdt, Rdr, Pzx, Wzx etc. (subscript only in formulas, plain suffix on drawings)", "areal S-codes (separate entry)"]
dxf_forms = ["TEXT with the code in the same font and height as the value: 'Ra', 'Rz', 'RSm'", "old drawings: 'R' + smaller TEXT 'a'/'y'/'z' shifted down as subscript, or MTEXT with \\H0.7x height change", "Greek letters (Δ, δ, λ) via SHX symbol fonts or Unicode — may become mojibake after conversion; computer equivalents 'Rdq', 'Rdc', 'Lc'", "code inside ATTRIB together with the value, or fixed TEXT in the block definition"]
recognition = "词法：首字母为R、W、P（或AR、AW、Mr1、Mr2），后接1–3个字母或数字，可接取样长度个数和max，再空格接数值；只有与表面结构符号（横线下方）关联才确认。注意版本差：1993/1983图上的Rz为十点高度、Ry为最大高度，2006图上Rz为最大高度；可由是否只注数值、是否有“Ra 3.2”式横线下注写判断图样版本。区分半径R、管螺纹R/Rc/Rp；区分区域参数Sa、Sq（双空格、常带S-L/S-F前缀）与旧间距参数S、Sm（1993在横线下方）。"
confusions = ["旧Rz（十点高度）与新Rz（最大高度）：按图样所依版本解释", "旧Ry与新Rz：同一定义、不同代号", "ISO 21920参数Rmax与后缀max：Rmax是独立参数，后缀max接在其他代号后（Ramax）", "图形参数R与半径R：图形参数R在符号横线下，前有“…/…/”", "区域参数Sa、Sq与旧间距参数S、Sm"]
