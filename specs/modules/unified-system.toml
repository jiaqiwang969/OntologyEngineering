{name="conclusion",meaning="Expected diagnosis",rust_type="String",required=true,format="status",unit="Status",precision="Exact",write="Freeze before comparison",applicability="Evaluation/4",acceptance="Preserve native unknown/violated",allowed_values=["pass","unknown","violated"]}
