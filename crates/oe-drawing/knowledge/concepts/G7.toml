name = "局部运动方向符号 PRD"
aliases = []
group = "G7"
kind = "symbol"
meaning = "铸件（模制件）上表示局部流动（运动）方向的图形符号：一条单向箭头，上方注字母PRD，箭头指向左或右；可在与符号相连的参考线上注角度（可带公差）。"
components = ["单向箭头：水平或倾斜，指向局部流动方向。", "字母PRD：写在箭头上方。", "参考线（可选）：与箭头相连，上面注角度，如45°±10°。"]
variants = ["to left", "to right", "with angle"]
dxf_forms = ["LINE with one arrowhead (SOLID or LEADER) and TEXT 'PRD' above it", "short reference LINE with TEXT angle such as '45%%d%%p10%%d'"]
recognition = "锚点为文字“PRD”，其下方或旁边紧贴一条单箭头线；若箭头两端都有箭头则应为TMD。PRD只出现在模制件图上。"
confusions = ["TMD工具运动方向符号：双向箭头，字母TMD。", "向视图箭头：旁边是单个大写字母视图名。"]
related = ["DC-G7-053", "DC-G7-082", "DC-G7-046"]
priority = "rare"
text_forms = ["PRD", "PRD 45°±10°"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "表1称“局部流动方向”，6.9称“局部运动方向”；形状读自图89～图92。"
