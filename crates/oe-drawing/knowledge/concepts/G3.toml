meaning = "蜗杆零件图右上角的参数表，列出蜗杆类型、模数、头数、齿形角、导程、导程角、旋向、法向齿厚、精度等级及配对蜗轮和检验项目，供加工与检验使用。"
components = ["位置与格式同圆柱齿轮参数表：图框右上角，“名称|代号|数值”三列格栅，技术要求在右下角。", "主要行：蜗杆类型、模数m、齿数（头数）z1、齿形角α、齿顶高系数ha1*、导程pz、导程角γ、螺旋方向、法向齿厚sn1、精度等级。", "下部：配对蜗轮的图号与齿数、公差组（2003版示例）以及检验项目代号与公差或极限偏差值。"]
variants = ["阿基米德蜗杆等类型"]
dxf_forms = ["LINE grid (outer layer 01, inner layer 02) with TEXT/MTEXT cells on layer 11, or template block INSERT with ATTRIB", "ACAD_TABLE in newer templates; Greek γ, α as Unicode, angles with '%%d' and minutes/seconds characters"]
recognition = "与圆柱齿轮参数表相同的右上角格栅锚点；关键词中出现“蜗杆类型”“导程”“导程角”“头数”之一即判为蜗杆参数表。同图主视图通常是轴类外形，齿部按螺纹式规定画法（齿顶线粗实线、分度线细点画线），常有齿形局部放大图。"
confusions = ["圆柱齿轮参数表：没有蜗杆类型、导程、导程角行。", "蜗轮参数表：含分度圆直径、分度圆齿厚和配对蜗杆行。", "梯形螺纹丝杠：用Tr标记写在大径尺寸线上，一般不配参数表。"]
