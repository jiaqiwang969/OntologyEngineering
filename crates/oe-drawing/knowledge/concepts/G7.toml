[[concepts]]
id = "DC-G7-028"
name = "焊接技术要求注语"
aliases = []
group = "G7"
kind = "note"
meaning = "零件图或装配图技术要求中有关焊接的文字注语：焊接方法和焊条牌号、焊缝高度、焊后修整或去应力时效、焊缝气密性检验、补焊前清理与预热、允许焊接、点焊补点等；装配图上如“除已注的外，其余均采用手工电弧焊”。"
components = ["焊接方法与材料：如“焊接采用××焊，焊条牌号为××”。", "焊后处理：修整焊疤、焊后人工时效去应力、焊后喷砂等。", "检验要求：如“焊缝在××MPa表压下不漏气”“所有焊缝不准有未焊透等缺陷”。", "补焊与预热：补焊区清理、预热温度。", "装配图条目：其余焊缝采用的方法、点焊处补点等。"]
variants = ["焊接方法与焊条", "焊后修整/时效", "焊缝气密试验", "点焊处理"]
dxf_forms = ["MTEXT technical-requirement block (技术要求 + numbered lines) on text layer 11", "TEXT lines; welding process may appear as words (焊条电弧焊/手工电弧焊) or numeric codes (111)"]
recognition = "在技术要求文字中匹配焊接词汇（焊|焊缝|焊条|焊后|补焊|点焊|气密）；若图上同时有焊缝符号或焊缝栅线，可确认图样为焊接图。“全部焊缝采用…”“其余焊缝均采用…”句式另归焊缝统一技术要求说明。"
confusions = ["焊缝符号标注：图形化的基准线加符号，而不是条目文字。", "铸件补焊之外的铸造注语：属铸件技术要求。"]
related = ["DC-G7-029", "DC-G7-035", "DC-G7-116", "DC-G9-002", "DC-G8-011"]
priority = "medium"
text_forms = ["焊接采用××焊，焊条牌号为××", "焊后人工时效，去应力", "焊缝在0.05MPa表压下不漏气", "所有焊缝不准有未焊透、咬边等缺陷", "允许焊接，焊后修整"]
