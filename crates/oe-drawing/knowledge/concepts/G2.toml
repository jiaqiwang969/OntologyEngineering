id = "DC-G2-078"
name = "按第三角画法配置的局部视图"
aliases = []
group = "G2"
kind = "view"
meaning = "在第一角画法的图样中，局部视图可按第三角画法配置在需表达的局部结构附近（上、下或旁边），并用细点画线将两者相连，不需箭头和字母。"
components = ["局部视图：只画局部结构（如轴上键槽的形状），位于该结构的观察者一侧。", "连线：细点画线从被表达结构（通常为其对称中心线）延伸到局部视图的中心线。", "无标注：无箭头、无字母。"]
variants = ["above, beside or below the feature (Figs 3-6)"]
dxf_forms = ["Small closed outline (layer 01) with its own centre LINE collinear with, and joined to, a centre LINE of the main view (layer 05)"]
recognition = "以一个小视图簇为锚点：其细点画线中心线与主视图上某结构的中心线共线并连续相连（中间穿过空白），视图位于该结构的观察者一侧（第三角方位）；小视图内无剖面线、无字母。典型为轴的键槽上方或旁边画出的键槽形状。同样以点画线相连但带剖面线、位于剖切线延长线上的是移出断面。"
confusions = ["局部放大图：比例不同，有罗马数字。", "移出断面：同样以点画线相连，但带剖面线。", "普通贯穿的中心线：不连接独立小视图。", "按向视图配置的局部视图：带字母和箭头。"]
