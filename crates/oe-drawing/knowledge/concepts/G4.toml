[[concepts]]
id = "DC-G4-034"
name = "轴测图线性尺寸注法"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "轴测图中的线性尺寸一般沿轴测轴方向标注，数值为零件的公称（基本）尺寸而非轴测缩短后的长度；数字按相应轴测图形注写在尺寸线上方，出现字头向下时改用引出并水平书写。"
components = ["尺寸线：细实线，必须与被注线段平行（即沿某一轴测轴）。", "尺寸界线：一般平行于另一轴测轴，因而与尺寸线不垂直。", "尺寸数字：公称尺寸，写在尺寸线上方，字形随所在轴测平面倾斜。", "字头向下的情况：用指引线引出，数字水平书写。", "版本：GB 4458.3-84第3.1条用“基本尺寸”，GB/T 4458.3-2013第6.1条用“公称尺寸”，规则相同。"]
variants = []
dxf_forms = ["DIMENSION dimtype 1 (aligned) with oblique extension lines (oblique angle in code 52) and text rotated to the pictorial plane", "exploded: LINE dimension line + LINE extension lines + SOLID arrows + TEXT with rotation 30°/150° and oblique angle ±30° (TEXT code 51)", "text style with an oblique angle (STYLE code 50) used for isometric lettering", "LEADER/MULTILEADER + horizontal TEXT where the figure would read upside down", "layer 08 or template dimension layer"]
recognition = "锚点为既不水平也不竖直、沿约30°/150°（或其他轴测轴）方向的尺寸线，且两条尺寸界线彼此平行、与尺寸线斜交（夹角约60°或120°）；尺寸文字带倾斜角（TEXT组码51非零）或旋转角与轴测轴一致。数值等于公称尺寸，常与图上线段实长不成视图比例（正等测轴向变形系数约0.82，用简化系数1时则相等）。与二维对齐尺寸区分：二维界线垂直于尺寸线、文字不倾斜；与斜视图尺寸区分：斜视图仍是正投影，界线垂直于尺寸线。"
confusions = ["二维线性/对齐尺寸：尺寸界线垂直于尺寸线，数字直立或沿尺寸线。", "引出注释：轴测图中仅在字头向下时改为引出水平注写，仍是尺寸而非文字说明。", "斜视图上的尺寸：正投影，界线与尺寸线垂直。"]
related = ["DC-G4-033", "DC-G4-035", "DC-G2-087", "DC-G2-083", "DC-G2-079"]
priority = "rare"
text_forms = ["30", "60", "15"]
knowledge_units = ["K11", "K12", "K13", "K10"]
