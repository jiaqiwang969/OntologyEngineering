dxf_forms = ["arrays of parallel LINEs (or a HATCH with a user-defined grid pattern) on a thin-line layer", "TEXT coordinate values evenly spaced along two perpendicular edges", "CIRCLEs of holes centred on grid intersections"]
recognition = "锚点：两组沿正交方向等差排列的数字TEXT，各自靠近一组等间距平行细线的端部；两组平行线互相垂直构成网格，网格间距与数值差按比例一致。图中圆心多落在网格交点上。与土建网格式尺寸区分：后者以“n×间距(=总长)”文字表达；与坐标表（弯管）区分：坐标表为表格；与图框分区刻度区分：分区刻度在图框边上且为字母/数字区号。"
