[[concepts]]
id = "DC-G1-010"
name = "剖面线"
aliases = ["通用剖面线"]
group = "G1"
kind = "line"
meaning = "在剖视图、断面图的剖面区域内画的一组等距平行细实线，表示被剖切到的实体材料；机械图中通用剖面线同时就是金属材料的剖面符号。"
components = ["细实线（No.01.1.5）平行线组，间距相等，间距按剖面区域大小选取并大于最小间隙。", "一般与主要轮廓或剖面区域的对称线成45°；同一零件在各剖视、断面中方向和间距一致，相邻零件方向相反或间距不同。", "剖面区域内有文字或尺寸数字时，剖面线在该处断开。", "1984 版：与水平成45°，主要轮廓本身为45°时改画30°或60°；1998/2005/2013 版：与主要轮廓或对称线成45°，必要时取其他角度。"]
variants = ["1984: 45° to the horizontal; 30° or 60° when the main outline is at 45°", "1998/2005/2013: 45° to main outline or symmetry line, another angle if needed", "spacing chosen by area size, above the minimum gap"]
dxf_forms = ["HATCH entity: pattern ANSI31 (45°, scale sets spacing) or user-defined pattern (U) at 45°/135° with spacing ~2–4 mm; boundary loops follow the section outline; GB/T 14665 layer 10 (剖面符号) or 剖面线/HATCH", "ANSI31 rotated 90° gives the opposite direction used for an adjacent part", "exploded HATCH: many parallel thin LINEs clipped to the outline, often grouped in an anonymous block", "CAXA and other GB add-ons export hatches as HATCH or as LINE bundles", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为 HATCH 实体（读取图案名、角度、比例/间距）或一组≥3条相互平行、等距、端点都落在同一闭合轮廓上的细实线。判据：间距恒定（常2~4 mm，约为字高的0.5~1倍），角度约45°/135°（或30°/60°），被粗实线闭合轮廓包围。同一零件在各视图中角度和间距相同，可据此把剖面区域归属到零件；相邻区域方向相反或间距不同表示不同零件。文字处剖面线断开是正常现象，不应把断开处当作边界。"
confusions = ["网格线：两组正交线、不被零件轮廓裁剪。", "表示平面的对角线：只有两条交叉细线。", "螺纹牙底线：细实线平行于轴线，不成等距斜线组。", "非金属材料剖面符号：交叉网格线；其他材料另有专用符号。", "滚花简化画法：只画在外表面局部的直纹或网纹。"]
related = ["DC-G1-043", "DC-G1-101", "DC-G2-061", "DC-G2-019", "DC-G2-009", "DC-G2-003", "DC-G2-001"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55", "K11", "K12", "K13"]
recognition_cards = ["section_line_region"]
recognizer = "card"
seen_on_drawing = ["second"]
expert_checked = false
notes = "ANSI31 等图案名与常用间距为 CAD 通用实践；源只规定45°等距细实线及同零件一致。"
