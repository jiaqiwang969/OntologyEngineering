[[concepts]]
id = "DC-G3-141"
name = "三自由度运动副符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示具有三个自由度的运动副：球面副（球与球窝）和平面副（两构件以平面接触）。"
components = ["球面副：小圆表示球，外侧一段同心而略大的圆弧表示球窝，两根构件粗线分别接在球和球窝上，接头处画涂黑小楔。", "平面副：两条平行短线表示相互接触的平面，上下两侧各有一根倾斜构件粗线接在其中一条平行线上，接点画涂黑小楔。", "2013版条号5.3.1、5.3.2，1984版2.3.1、2.3.2，两版图形一致。"]
variants = ["球面副", "平面副"]
dxf_forms = ["Exploded CIRCLE (ball) + concentric ARC of slightly larger radius (socket) + LINE links on layer 01", "Filled joint wedges as SOLID / HATCH SOLID, or LWPOLYLINE with tapering width at the link ends", "Planar pair: two short parallel LINE entities with one inclined LINE link touching each from opposite sides", "INSERT of a spherical-pair or planar-pair library block"]
recognition = "球面副锚点为一个小CIRCLE加一段同心、半径稍大的开口ARC，两条直线构件分别终止于圆和弧上，接点有实心楔。平面副锚点为一对平行短线（间距约为线宽的数倍），两侧各有一条倾斜构件线终止于其中一条线上。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。与球销副区分：球销副在球上多一根沿径向的短销线；与球与圆柱副、球与平面副区分：后者只有一根构件，球落在弧槽或直线上，而不是被弧包住。"
confusions = ["球销副：图形与球面副相同但多一根穿向球心的销线，只有两个自由度。", "球与圆柱副（四自由度）：球下方是开口向上的弧槽加直线，只有一根构件。", "圆柱副：构件只从一侧接在长轴线上，另有端视圆点图；平面副两侧都有构件，且两条平行线等长。"]
