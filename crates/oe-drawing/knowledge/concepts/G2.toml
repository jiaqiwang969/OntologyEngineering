[[concepts]]
id = "DC-G2-013"
name = "全剖视图"
aliases = []
group = "G2"
kind = "section"
meaning = "用剖切面把机件完全剖开后得到的剖视图：剖切面前的部分假想移去，剖面区域画剖面符号，剖切面后的可见轮廓全部画出；适合外形简单、内形复杂的机件。"
components = ["整个视图都处于剖切状态，外轮廓即剖切后的轮廓。", "剖面区域：剖切面与实体的接触部分，画剖面线。", "剖切面后的可见部分：粗实线画出，不画剖面线；一般不画细虚线。", "标注：上方“X—X”，相应视图上画剖切符号并注同一字母；剖切面过对称面且按投影关系配置、中间无隔开时全部省略。", "剖切面可为单一、几个平行或几个相交的剖切面。"]
variants = ["single plane", "parallel planes", "intersecting planes"]
dxf_forms = ["View cluster of LINE/ARC/CIRCLE on layer 01 plus HATCH (layer 10) covering every cut region", "Label TEXT/MTEXT 'A-A' / 'A—A' (layer 11) above the view, matching cutting-symbol letters elsewhere", "Cutting-symbol strokes on layer 01; optional cutting line on layer 05"]
recognition = "以视图簇中的剖面区域为锚点：剖面区域沿外轮廓的大部分边分布，视图内没有波浪线或双折线分界，也没有以对称中心线划分的“半外形”；除剖面区域外还有不带剖面线的粗实线结构（剖切面后的孔壁、台阶投影线）。再与同字母剖切符号或按投影关系的视图配对。"
confusions = ["断面图：只画切口，没有剖切面后的轮廓。", "半剖视图：以细点画线为界一半外形、一半剖视。", "局部剖视图：有波浪线或双折线分界。", "外形视图：没有剖面区域。"]
