[[concepts]]
id = "DC-G3-105"
name = "中心孔简化表示法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "中心孔标记在不致误解时可省去标准编号，只写型式和尺寸；轴两端中心孔相同时，只在一端标注并注出数量。"
components = ["要求符号：仍画在轴端面的轴线处，与规定表示法相同（要求保留、可以保留、不允许保留三种）。", "简化标记：省去“GB/T 4459.5-”前缀，只写型式字母和尺寸，如R3.15/6.7、B2.5/8。", "两端相同：只在一端用指引线标注，标记前加数量“2×”。", "同一引出线上还可附基准代号和中心孔工作表面粗糙度（规定表示法内容）。"]
variants = ["省略标准编号", "两端相同只注一端加数量2×"]
dxf_forms = ["LEADER/QLEADER (or LINE + reference LINE) starting at the shaft end face on the axis, with TEXT/MTEXT '2×B2.5/8' on the reference line (layer 09/08)", "Centre-hole requirement symbol drawn as a few short thick LINEs (V shape, or V with a crossing stroke) at the leader start, or as an INSERT block", "Mechanical add-on centre-hole annotations may arrive as anonymous blocks or proxy entities"]
recognition = "以文字为锚点：匹配可带“n×”前缀、以A、B、R型字母开头的“D/D1”形式（C型为CM10L30/16.3式）且不含“GB/T 4459.5”的字符串。几何验证：指引线起点在轴端面（粗实线）与轴线（细点画线）交点附近，起点旁可能有V形要求符号。若带“2×”前缀，另一端不应再有同类标注。区分孔数量标注：含直径符号Ø；区分倒角C：没有斜线分隔的两个数值；区分半径：R3.15/6.7中的R是中心孔型式，不是圆角半径（后面有“/”和第二个数）。"
confusions = ["孔数量标注（2×Ø6）：含直径符号。", "倒角标注（C1）：单个数值，无“/”。", "圆角半径R：R型中心孔标记中R后有“/D1”。", "带标准编号的规定表示法：含GB/T 4459.5前缀。"]
