[[concepts]]
id = "DC-G1-104"
name = "分区代号"
aliases = []
group = "G1"
kind = "text_convention"
meaning = "在采用图幅分区的图样中，用“字母+数字”并排书写的代号（如 B3、C5）指明某个位置所在的分区；与图形名称同时标注时，写在名称之后，中间空一个字母宽。"
components = ["字母在前、数字在后，并排书写，如 B3、C5。", "与视图或剖视名称同时标注时，名称后空一个字母宽再写分区代号。", "多见于大型装配图、更改记录和引用说明。"]
variants = ["单独书写（B3）", "与图形名称同时标注（名称后空一字宽）"]
dxf_forms = ["short TEXT/MTEXT strings, alone or appended to a view label"]
