[[concepts]]
id = "DC-G3-148"
name = "分度头符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示分度头（使工件按等分角度转位的部件），符号旁注写分度数 n。"
components = ["基本符号：一个被横竖两条线分成四瓣的圆形，左右两侧带缺口，形似夹持的卡爪；圆的上方有一个尖朝下的小三角形指针及其竖线。", "可用符号（2013 版新增）：一条横线与一条竖线组成的十字，竖线上端接尖朝下的小三角形指针。", "指针三角形旁注写字母 n（或具体整数），n 表示分度数。", "1984 版附录 A.7 只有基本符号，2013 版 12.7 增加了可用符号以与 ISO 3952-4 一致。"]
variants = ["2013增加可用符号"]
dxf_forms = ["Exploded ARC/LINE strokes: four arc-bounded lobes with side notches split by two orthogonal LINEs, plus a small closed triangle (LWPOLYLINE or SOLID) on a short vertical LINE", "TEXT 'n' or the numeric division count on layer 11 beside the pointer triangle", "INSERT of a library block, possibly with an ATTRIB for n"]
recognition = "锚点：尖朝下的小三角形指针加紧邻的文字 n 或整数。基本符号中三角形下方是被十字分成四瓣、左右有缺口的圆；可用符号中三角形下面只有竖线与横线组成的十字。三角形高度与旁注文字高 h 相近。与基准三角形、表面结构符号区分：它们接在引线或尺寸界线上并带字母或参数；分度头三角形与四瓣圆或十字线组合，旁边只有 n。"
confusions = ["尖顶凸轮从动杆：三角形尖点顶在凸轮曲线上，而不是位于四瓣圆或十字上方。", "基准符号、表面结构符号的三角形：附在要素或引线上并带字母/数值；分度头只注 n。"]
related = []
priority = "rare"
text_forms = ["n", "24"]
knowledge_units = ["K13"]
