[[concepts]]
id = "DC-G7-054"
name = "工艺图形符号框格"
aliases = []
group = "G7"
kind = "symbol"
meaning = "三维工艺设计中放置工艺图形符号的框格：机加工工艺方法符号放在正方形框内，其他工艺信息符号放在宽度随内容而定的长方形框内；框线宽为网格模数M的1/10，高度优先取7.5、10.5、15、21、30、42 mm；说明文字可放在框格上方或下方中间。"
components = ["框格：正方形（机加工方法符号）或长方形，线宽d=M/10。", "符号与框距：符号边界距框格不小于2倍线宽。", "高度系列：H=7.5、10.5、15、21、30、42 mm，对应字高2.5～14 mm。", "附加文字：位于框格上部或底部中间，距框不小于2d。"]
variants = ["square", "rectangle", "with text above", "with text below"]
dxf_forms = ["closed LWPOLYLINE square/rectangle with a pictogram (LINE/ARC/HATCH) inside, or an INSERT of a process-symbol block", "TEXT centred above or below the frame"]
recognition = "锚点为内含图形符号（非文字）的独立正方形或长方形框，高度接近表中系列值；位于工艺信息框格中或单独出现。与几何公差框格、理论正确尺寸框区分：后者框内是公差符号与数值或单个尺寸数字。"
confusions = ["几何公差框格：多格，首格为几何特征符号，含数值和基准字母。", "理论正确尺寸方框：框内是尺寸数字。"]
related = ["DC-G7-033", "DC-G7-063", "DC-G7-067", "DC-G7-071", "DC-G7-077", "DC-G4-029", "DC-G5-090"]
priority = "rare"
