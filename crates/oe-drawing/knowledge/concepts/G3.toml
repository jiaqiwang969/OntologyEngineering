[[concepts]]
id = "DC-G3-045"
name = "网状结构（滚花等）"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "零件表面的滚花、槽沟等网状结构，用网纹线在视图上全部或部分地表示出来；也可省略不画，装配图中一般不画。"
components = ["现行GB/T 4458.1-2002：网纹用粗实线画出；1984版规定用细实线。", "可在整个滚花面上画出，也可只在靠近轮廓的一小块区域画出示意。", "网纹形式分直纹（平行线）和网纹（菱形交叉线）。", "滚花规格（直纹/网纹、模数m）常用指引线注写，或写在技术要求中；网纹也可完全省略只注规格。"]
variants = ["2002 onward: thick solid (01.2)", "1984 edition: thin solid", "full or partial patch", "straight or diamond pattern", "omitted"]
dxf_forms = ["HATCH with a user/ANSI cross pattern (e.g. ANSI37 or NET at 30°/45°) or straight pattern (ANSI31 rotated / LINE pattern) on the knurled cylindrical face — but on a VIEW, not a section", "or exploded short LINEs (thick per 2002, thin per 1984 practice) clipped to the face outline or a small patch near the edge", "MTEXT on leader: '网纹 m0.3 GB/T 6403.3' / '直纹 m0.4'", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为外形视图（非剖视）中位于圆柱面轮廓内的平行或菱形交叉线族，线距小（约为直径的2%–5%），区域边界由轮廓线和该面端线截止；附近常有含“滚花”“网纹”“直纹”和模数m的文字。与金属剖面线区分：剖面线位于剖视的剖面区域（有剖切符号或被剖切实体），单向45°；与非金属剖面符号区分：后者也为交叉线，但在剖面区域内；与线圈绕组网格区分：后者在电气元件截面内。线宽在2002版后为粗、旧图为细，不能单凭线宽判断。"
confusions = ["金属材料剖面线：在剖面区域内、45°单向。", "非金属材料剖面符号：交叉网格，但在剖面区域内。", "线圈绕组剖面符号：网格位于剖面内。"]
related = ["DC-G2-042", "DC-G1-074", "DC-G4-071", "DC-G1-046", "DC-G2-063", "DC-G1-010"]
