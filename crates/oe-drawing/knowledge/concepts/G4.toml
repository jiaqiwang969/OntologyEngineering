[[concepts]]
id = "DC-G4-010"
name = "同一基准出发的尺寸"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "从同一尺寸基准出发的一组尺寸的简化注法：由基准出发的第一段尺寸线必须画全，其后各段尺寸线可连续成一条，也可不连续；每个数值都表示到基准的距离。"
components = ["尺寸基准：公共的一条尺寸界线（端面或中心线），起点处可画小圆表示原点", "第一段尺寸线：自基准画到第一条尺寸界线，完整带箭头", "后续尺寸线：沿同一直线延续或分段，箭头指到各尺寸界线", "数字：每个值写在对应尺寸界线附近，都从基准起算；角度可同样从0°起注"]
variants = []
dxf_forms = ["DIMENSION dimtype 6 (ordinate) entities sharing one origin (code 10), values at extension-line ends — when drafted with ordinate tools", "several DIMENSION dimtype 0 with the same first defpoint (code 13) and collinear dimension lines (baseline with zero spacing) — lines overlap", "exploded: one long LINE carrying several SOLID arrows + small CIRCLE at the datum + TEXT values aligned with the extension lines"]
recognition = "锚点为一组平行尺寸界线，配对文字数值单调递增，且每个数值≈该界线到同一基准界线的距离×比例（不是相邻间距）。尺寸线共线或只少量断开，基准处常有直径约1h的小圆。与链式尺寸区分：链式各值≈相邻界线间距，总和才等于总长；与并联基准尺寸区分：并联式尺寸线逐层平行错开；与封闭尺寸链区分：本概念只从一端基准出发、不闭合。"
confusions = ["链式（连续）尺寸：每段数值是相邻两界线间距", "并联（基准式）尺寸：各尺寸线分层平行排列", "封闭尺寸链：首尾相接并含总长", "坐标表：数值列在表格而非沿尺寸线"]
related = ["DC-G4-012", "DC-G4-086", "DC-G4-076", "DC-G4-075", "DC-G4-091", "DC-G4-026"]
priority = "low"
