[[concepts]]
id = "DC-G3-042"
name = "碟形弹簧画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "碟形弹簧是呈浅锥形的碟片，视图按梯形外形、剖视按倾斜的条形截面、示意图按单线画出；成组叠合在装配图中可省略中间部分。"
components = ["视图：每片呈浅锥的梯形轮廓（粗实线），多片按对合或叠合方式排列。", "剖视图：每片截面为倾斜的窄矩形条，打剖面线；示意图：每片用一条倾斜粗实线表示。", "装配图中四片（束）以上叠合时，中间部分可省略，用细实线画出省略段的外廓范围。", "截面在图形上不大于约2 mm时可用示意图或涂黑表示。"]
variants = ["视图", "剖视图", "示意图", "四片以上叠合中间省略"]
dxf_forms = ["thick LINEs forming shallow trapezoids per disc; in section thin inclined quadrilaterals (LWPOLYLINE) each filled with HATCH ANSI31 or SOLID", "schematic: groups of thick inclined LINEs in a V/Λ pattern", "omitted middle: thin LINE (layer 02) envelope rectangle between the drawn end discs", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一组沿同一轴线排列的倾斜窄条（剖视）或倾斜短线（示意），相邻两片倾斜方向相反（对合）呈V/Λ交替，或方向相同（叠合）；每片的锥角小（相对垂直轴线倾斜约5°–15°），内外径之比约0.5。与锥形垫圈区分：垫圈单片、无交替排列；与锥面区分：锥面是实体零件轮廓的一部分，不成组重复。"
confusions = ["锥形垫圈：单片，不交替叠放。", "零件上的锥面：连续实体轮廓，不是独立薄片组。", "截锥涡卷弹簧：带材卷绕成阶梯状截面，不是独立碟片。"]
related = ["DC-G3-130", "DC-G3-113", "DC-G3-033", "DC-G3-173", "DC-G2-057"]
