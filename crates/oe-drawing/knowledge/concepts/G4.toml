[[concepts]]
id = "DC-G4-082"
name = "共用尺寸线的同心圆弧半径注法"
aliases = ["共用尺寸线的系列尺寸"]
group = "G4"
kind = "simplified_representation"
meaning = "一组同心圆弧（或圆心位于同一直线上的多个圆弧）的半径，用一条共用的尺寸线和依次排列的箭头表示，数值按箭头顺序集中写成一串，如 R14,R20,R30,R40，属简化注法。"
components = ["共用尺寸线：细实线，从公共圆心一侧（或沿圆心所在直线方向）引出，可呈阶梯折线，依次穿过各圆弧", "多个箭头：尺寸线每到一条圆弧处画一个箭头，箭头尖落在该圆弧上，箭头数与数值个数相同", "数值串：带R前缀的多个半径值用逗号分隔，按箭头先后顺序写在尺寸线上方或其水平延伸段上", "简化前形式：每段圆弧各自一条单箭头半径尺寸线和一个R值"]
variants = []
dxf_forms = ["exploded LINE/LWPOLYLINE (often stepped) dimension line with several SOLID triangles or arrow-block INSERTs touching successive ARCs", "single TEXT/MTEXT such as 'R14,R20,R30,R40' on layer 08 or the template dimension layer", "occasionally one radial DIMENSION (dimtype 4) whose override text (code 1) lists all values, with extra arrows drawn by hand", "LEADER/MULTILEADER whose MTEXT carries the value list (less common)"]
recognition = "锚点：一个含两个及以上R数值、以逗号/顿号分隔的TEXT/MTEXT。沿与文字相邻的细实线追踪，线应依次与若干同心（或圆心共线）的ARC/CIRCLE相交，每个交点处有一个箭头（实心三角长约6d，或箭头块）。检验：箭头数=数值个数；各交点所在圆弧半径按比例换算后与数值顺序一一对应。与单个半径尺寸区分：后者只有一个R值、一个箭头；与直径序列区分：前缀为Ø且尺寸线经过圆心两侧；与n×R区分：无乘号、各值不同。"
confusions = ["单个半径尺寸：只有一个R值和一个箭头", "共用尺寸线的同心圆直径注法：前缀Ø，尺寸线穿越圆心", "重复要素 n×R：同一数值用乘号表示数量，不是不同数值的序列", "倒角或直径的数值列表：前缀为C或Ø"]
related = ["DC-G4-083", "DC-G4-006", "DC-G4-041", "DC-G4-094", "DC-G4-026"]
priority = "low"
text_forms = ["R14,R20,R30,R40", "R12,R22,R30", "R135,R85,R60"]
