components = ["Z形折线：上横线、斜线、下横线，总高约25d'，宽约10d'，跨越基准线上下。", "位置：基本符号右侧的长度数据中，n×l在其左，(e)在其右。", "尺寸：左侧焊脚K，可只在一侧注一次；段数n可省略。"]
