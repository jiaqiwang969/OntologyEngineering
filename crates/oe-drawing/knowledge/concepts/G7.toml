recognition = "锚点为箭头线与基准线交点；若交点上方有竖线且顶端连三角形旗（实心或空心），即为现场焊缝。区分修订三角或旗形注释：后者独立放置、内有数字；区分基准三角形：贴在零件轮廓上。"
