name: corroboration

# 佐证回归：两卷书检索 + Semantica 内建包执行 + 零旁路 + 隐私门禁。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engineering-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install and verify the pinned runtime
        run: |
          bash runtime/setup_runtime.sh
          echo "$GITHUB_WORKSPACE/runtime/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify the single semantic backend
        run: python scripts/check_semantica_backend_policy.py --mode strict

      - name: Verify repository contracts and Jev integration
        run: python -m pytest -q tests

      - name: Check privacy and build both portable packages
        run: |
          python scripts/check_public_privacy.py
          python scripts/package_skill.py --output "$RUNNER_TEMP/ontology-engineering-full.zip"
          python scripts/build_shareable_core.py --output "$RUNNER_TEMP/ontology-engineering-core.zip"

  cad-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the guarded CAD adapter and evidence validator
        run: bash skills/cad-agent/setup.sh

      - name: Verify general CAD evidence and manufacturing handoff
        run: |
          skills/cad-agent/.venv/bin/python skills/cad-agent/scripts/test_cad_evidence.py
          skills/cad-agent/.venv/bin/python skills/cad-agent/scripts/test_cad_process_handoff.py
          skills/cad-agent/.venv/bin/python skills/cad-agent/scripts/test_remote_assembly_mechanism.py
          skills/cad-agent/.venv/bin/python skills/manufacturing-process-cost/scripts/test_cad_handoff_to_q21.py

  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install runtime (pinned)
        run: |
          bash runtime/setup_runtime.sh
          echo "$GITHUB_WORKSPACE/runtime/.venv/bin" >> "$GITHUB_PATH"

      - name: Semantica unique-runtime gate (zero exceptions)
        run: python scripts/check_semantica_backend_policy.py --mode strict

      - name: Validate Semantica's authoritative 29-chapter registry
        run: python scripts/validate_chapter_contracts.py

      - name: Verify both books, guides, and TeX snapshots against Semantica
        run: semantica package verify-books --book-root . --json

      - name: Verify maintained book-source factories
        run: |
          python references/ontology-engineering-book/handbook/build_handbook.py
          git diff --exit-code -- \
            references/ontology-engineering-book/handbook/fragments
          PYTHONPATH=references/product-trustworthiness-book \
            python -m pytest -q \
              references/product-trustworthiness-book/handbook/test_build_handbook.py

      - name: Run all corroboration demos
        env:
          SEMANTICA_DISABLE_PROGRESS: "1"
        run: |
          fails=0
          for d in demos/*.py; do
            case "$d" in */_common.py) continue;; esac
            echo "==== $d"
            if python "$d"; then echo "PASS $d"; else echo "FAIL $d"; fails=$((fails+1)); fi
          done
          echo "failed demos: $fails"
          exit $fails

      - name: SkillOpt retrieval gates
        run: |
          python scripts/eval_ontology_skill.py
          python scripts/eval_ontology_skill.py --split test

      - name: Privacy gate
        run: python scripts/check_public_privacy.py
