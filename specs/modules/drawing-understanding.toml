schema = "oev2.design-fragment/4"

# Reading an existing engineering drawing (the reverse side of the CAD route): every source entity kept with its
# native members; nonexclusive source uses with bounded intervals; complete expressions classified on four
# independent axes (discipline kind, line type, native primitive, view); structure topology and structural lines;
# part feature targets stay unknown. Derived only from the drawing bytes in an isolated worker. Ported from the
# independent aixcam contribution (feature/dxf-engineering-expression, 98ccb13); private drawing content removed.

[[requirements]]
id="req_md_engineering_expression"
function="Compose complete mechanical drawing expressions (dimensions with all members, tolerance frames, surface and datum symbols, view callouts, technical notes and line-type geometry) from source members and bounded intervals, and bind each expression to a drawing view"
condition="Original DXF bytes in an isolated worker, a fixed generic profile, standard drafting conventions checked for consistency with the source, and synthetic validation"
acceptance="Kind follows display text and construction rather than the native enum; exploded members are reassembled; shared sources keep bounded intervals; every source domain covered; unknown views and targets explicit; evaluation against independent references only"

[[sources]]
id="md_engineering_expression_basis"
identity="GB/T 14665-2012 4.3 overlapping-line precedence, 6 dimension terminators and Table 6 layer identifiers; GB/T 4457.4 lines; GB/T 4458.4 dimensioning; GB/T 4459.1 thread representation; GB/T 1182 tolerance frames, leaders aligned with the dimension line of a feature of size and boxed theoretically exact dimensions; Autodesk DXF DIMENSION and LTYPE group codes"
role="Generic drafting conventions used as evidence only after their consistency with the source drawing is checked"
applicability="Mechanical drawing expression candidates; not automatic engineering adoption"

[[sources]]
id = "drawing_understanding_method"
identity = "docs/DRAWING-UNDERSTANDING.md"
role = "Method of record for the reverse drawing route: source conservation, isolated source-only discovery, converter fidelity, independent re-derivation and evaluation references kept out of the input"
applicability = "Two-dimensional DXF read from a DWG through a pinned converter; thresholds and view heuristics calibrated on development drawings remain to be evaluated on others"

[[sources]]
id = "drawing_concept_catalogue"
identity = "crates/oe-drawing/knowledge/concepts/G1.toml ... G9.toml; national drafting standards (GB/T 4457, 4458, 4459, 1182, 17851, 131, 324, 14689-14692, 14665, 16675, 10609 and others) and two textbooks, cited per card by clause and page"
role = "Catalogue of every drafting representation concept with paraphrased meaning, parts, variants, DXF forms, recognition cues, confusions, relations, frequency, sources and coverage status; recognition cards link to it"
applicability = "Planning and driving recognition of two-dimensional DXF drawings; knowledge candidates until reviewed by an expert"

[[sources]]
id = "drawing_representation_knowledge"
identity = "crates/oe-drawing/knowledge/drawing-representation.toml; GB/T 1182-2018 chapters 5-8 (symbols, toleranced feature leaders on the outline or its extension, 7.4 cylindrical and spherical zones); GB/T 17851-2022; GB/T 4459.5-1999 table 1; GB/T 4457.4-2002; GB/T 4457.5-2013; GB/T 4458.1-2002; GB/T 4458.4-2003; expert corrections cited per card"
role = "Drafting representation knowledge read by recognition at run time: one card per concept with meaning, components, drawing variants, geometric relations as parameters, counter-examples and sources; each card names the tests of its variants and counter-examples"
applicability = "Recognition of the listed concepts in two-dimensional DXF drawings; expert corrections are knowledge sources only and never recognition input"

[[modules]]
id = "drawing_understanding"
kind = "pipeline"
rust_path = "crates/oe-drawing"
purpose = "读懂已有工程图纸：源对象守恒、带区间的非排他用途、完整工程表达（学科类别、几何线型、源图元、视图四个独立维度）、结构拓扑与结构线；只从源字节推导，零件目标保持未知；独立复核、检查页与逐次回执"
realizes = ["req_md_engineering_expression", "req_md_drawing_route"]
depends_on = ["core", "contracts", "kernel", "engineering", "drawing_understanding_check"]
platform = "Rust 1.95；只收源字节的隔离 worker 依赖 macOS sandbox-exec，其他平台的发现命令明确拒绝；DWG 转换经固定 CADCraft 提交"
effects = "只读源字节与 Project；在新输出目录写关系图、复核、检查页与回执；不改源图、模型、Project 或 HEAD"
failures = "第一步失败即停，后续步骤记为未运行；保留失败、未知与部分结果；结构校验不等于工程采用"
status = "source_only"
source_refs = ["md_engineering_expression_basis", "drawing_understanding_method", "drawing_representation_knowledge", "drawing_concept_catalogue"]

