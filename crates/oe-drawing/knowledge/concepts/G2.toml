[[concepts]]
id = "DC-G2-030"
name = "轴测剖视图"
aliases = []
group = "G2"
kind = "section"
meaning = "在轴测图上假想用平行于坐标面的剖切平面剖去机件一部分以显示内部形状；各剖面上剖面线方向按该坐标面确定；轴测装配图中相邻零件用方向相反或间隔不同的剖面线区分，实心件沿轴线剖切时按不剖画。"
components = ["轴测图主体：粗实线可见轮廓，方向符合正等测、斜二测等轴测轴。", "剖切缺口：常沿两个坐标面剖去四分之一。", "剖面线：每个切面上的剖面线平行于该坐标面内两轴单位长度端点的连线。", "肋、薄壁纵剖不画剖面线，用粗实线分开，必要时以细点表示被剖部分。", "装配：相邻零件剖面线反向或不同间隔；轴、销、螺栓等实心件不剖。"]
variants = ["part section", "assembly section"]
dxf_forms = ["Separate HATCH per cut face with different angles (isometric: horizontal and ±60° directions) on layer 10", "Outlines along 30°/90°/150°; circles as ELLIPSE or polyline approximations"]
recognition = "以轴测图（线方向集中于轴测轴、圆为椭圆）中的剖面区域为锚点：同一零件不同切面上的剖面线方向各不相同，且与该面边线有固定关系（正等测中为水平和±60°）。正交视图中的剖面线方向统一；明暗润饰线不受剖切边界约束。"
confusions = ["二维全剖视图：正投影，剖面线方向统一。", "表面润饰阴影线：没有剖切边界。"]
related = ["DC-G2-087", "DC-G2-083", "DC-G2-079", "DC-G3-062", "DC-G3-063", "DC-G2-009"]
priority = "low"
