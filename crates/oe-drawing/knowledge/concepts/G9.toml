[[concepts]]
id = "DC-G9-029"
name = "齿厚或公法线长度极限偏差注写"
aliases = []
group = "G9"
kind = "tolerance_indication"
meaning = "齿轮零件图中，按GB/T 6443的规定，把齿厚（或公法线长度）及其上、下极限偏差数值写在图样右上角的齿轮参数表中，而不在视图上标注，用来控制齿侧间隙。"
components = ["参数表中的行：名称为“公法线长度及其极限偏差”或“齿厚及其极限偏差”，符号为W_k或s。", "数值：公称值后跟上、下极限偏差（通常都为负值），如W_k=32.341，偏差−0.089/−0.137。", "同一表中还有模数、齿数、齿形角、变位系数、精度等级以及各项公差等行。"]
variants = ["齿厚 S 及偏差", "公法线长度 Wk 及偏差"]
dxf_forms = ["TEXT/MTEXT inside the gear parameter table (LINE grid at the top-right of the frame); deviations as MTEXT stacking '\\S-0.089^-0.137;' or two small TEXT entities", "subscript k written as plain 'Wk' or with MTEXT height override"]
recognition = "以图框右上角的参数表为锚点（表中有“模数”“齿数”“齿形角”等行），查找名称含“公法线”或“齿厚”的行，取同行的公称值及其右侧上下叠写的两个小字号偏差（字高约为数值的0.7倍，通常都带负号）。与一般尺寸偏差的区别：一般尺寸偏差附在视图中的尺寸上。"
confusions = ["一般尺寸偏差：附在视图中的DIMENSION上。", "齿顶圆直径公差：作为尺寸注在视图上（如Ø102±0.15）。"]
related = ["DC-G3-211", "DC-G3-099", "DC-G4-132"]
priority = "low"
text_forms = ["Wk=32.341 -0.089/-0.137", "公法线长度及其极限偏差", "\\S-0.089^-0.137;"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "偏差数值按目录记录（页面 OCR 不清晰）；MTEXT 叠写形式属一般 CAD 实践。"
