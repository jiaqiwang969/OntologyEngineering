dxf_forms = ["TOLERANCE entity (AcDbFcf): code-1 string starts with {\\Fgdt;f} then %%v-separated cells (value, datum letters); attached to a LEADER (code 340) or MLEADER", "INSERT of a GD&T frame block (GB mechanical plugin, often anonymous *U block) whose definition holds the glyph strokes; value and datum letters as ATTRIB or TEXT", "exploded on layer 08 (尺寸和公差) or a company annotation layer: frame LINE/LWPOLYLINE cells (height H≈2h) + glyph two parallel inclined LINE of equal length in the first cell + TEXT/MTEXT value and datum letters", "TEXT/MTEXT holding the Unicode glyph ∥ (U+2225) or the two characters '//' (or MTEXT font switch {\\Fgdt;f}) inside a hand-drawn first cell"]
