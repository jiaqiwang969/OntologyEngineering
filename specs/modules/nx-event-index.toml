constraint="nx_complete_event_index"
behavior="reconstructed_json_preserves_marker_objects_and_refuses_duplicate_keys"
rust_path="crates/oe-nx-worker/tests/event_index.rs"
oracle="真实私有数字marker对象保留对象含义；摘要长度正确但含重复键的重组JSON仍拒绝。"
scope="oe-wire严格JSON重组；不扩大原协议记录限制"

[[validations]]
id="complete_receiver_restores_fields_and_checks_original_events"
