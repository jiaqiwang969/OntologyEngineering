[[concepts]]
id = "DC-G6-069"
name = "完整图形符号"
aliases = ["表面结构完整图形符号（长边加横线）"]
group = "G6"
kind = "symbol"
meaning = "在基本符号或扩展符号的长边上端加一条水平横线而成的符号，用来承载表面结构参数、数值和各项补充要求；它是零件图上表面结构要求的标准载体。"
components = ["主体为基本符号或去除材料/不去除材料扩展符号，尖端接触被注表面，长边在右。", "长边上端接一条水平横线，向背离短边的方向延伸，长度随其上下注写内容的长短而定。", "横线下方注写参数要求（位置a、b），横线上方注写加工方法（c），V形右侧注纹理（d），短边左侧注加工余量（e）。", "三种形式分别对应允许任何工艺、去除材料、不去除材料，报告和合同文本中分别写作APA、MRR、NMR。", "GB/T 131-1993同样在三种符号长边加横线以注写参数和说明；ISO 21920-1草案（轮廓法）只保留完整符号，并多加一条横杠以区别于ISO 1302和区域法符号，几何细节OCR不可辨。"]
variants = ["a) 允许任何工艺 (APA)", "b) 去除材料 (MRR)", "c) 不去除材料 (NMR)", "GB/T 131-1993: 在三个符号的长边上加一横线, used for parameters and notes", "ISO 21920-1 draft (profile method): complete symbols only, with one additional horizontal bar to distinguish them from ISO 1302 and areal symbols (exact geometry not legible in OCR)", "GB/T 33523.1 areal complete symbols with diamond (separate entry)", "基本+横线", "去除材料+横线", "不去除材料+横线"]
dxf_forms = ["INSERT of a user/template roughness block: 3 LINEs (short leg, long leg, bar), plus a closing LINE for MRR or a CIRCLE for NMR; value as ATTRIB (ATTDEF in the block) or as a separate TEXT under the bar", "exploded strokes: LINE pieces or one LWPOLYLINE short leg → apex → long leg → bar, plus TEXT such as 'Ra 3.2'; thin line, usually on the symbol/dimension layer (GB/T 14665 layer 08) or text layer 11", "mechanical add-on objects (AutoCAD Mechanical surface texture symbol, GstarCAD/CAXA 粗糙度 object): after DWG→DXF they arrive as a named or anonymous block INSERT, or as ACAD_PROXY_ENTITY whose proxy graphics must be exploded to LINE/TEXT", "bar drawn as a separate LINE outside the block when its length is stretched to the text width", "attached to a leader: LEADER/MULTILEADER, or LINE + SOLID arrowhead / DONUT dot, on layer 09 with the symbol at the leader end or shoulder"]
recognition = "锚点：两条共端点的细直线，夹角60°、角平分线垂直于被注表面，长短边长度比约2.1（容差1.5–3），短边竖高≈1.4h、长边竖高≥3h（h为相邻数值字高）；长边上端再连一条与被注表面平行的线，向远离短边方向延伸，长度与其下方文字宽度相当。横线下方左端紧靠长边处有字高≈h的文字（Ra/Rz代号或数值）。尖端应落在轮廓线、延长线、尺寸线或指引线端点上，从材料外侧指向表面；整个符号可随被注边旋转。与指引线水平段区分：后者起点为箭头或圆点的斜线，无60°不等长两边；与焊缝符号区分：焊缝有箭头线+实线基准线（常带虚线基准线和焊缝基本符号）；与根号区分：根号在文字中且不接触图形轮廓。"
confusions = ["带水平段的注释指引线：无60°不等长V形，起点为箭头或圆点，文字在水平段上方", "焊缝符号（箭头线+基准线）：基准线由箭头线连到焊缝，常有虚线基准线和焊缝基本符号，无短边", "数学根号/对勾：只出现在公式或注释文字中，不与轮廓接触", "几何公差指引线：终端为箭头，另一端连公差框格", "文字下划线：只有一条横线，没有斜边"]
related = ["DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G6-070", "DC-G6-025", "DC-G6-045", "DC-G6-003", "DC-G6-076", "DC-G6-066", "DC-G1-028", "DC-G7-135"]
priority = "high"
text_forms = ["Ra 3.2", "Rz 6.3", "Ra 0.8 / Rz 3.2（两行）", "车 / Ra 1.6（横线上为工艺）"]
knowledge_units = ["K31", "K32", "K39"]
recognition_cards = ["surface_texture_symbol"]
recognizer = "card"
seen_on_drawing = ["second"]
expert_checked = false
notes = "Block/proxy forms and the separately drawn bar are general CAD practice, not from the sources. The ISO 21920-1 extra bar geometry is not legible in OCR. Already seen on a test drawing."
