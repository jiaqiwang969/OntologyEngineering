recognition = "锚点：中心孔标记文字（A、B、R型字母加尺寸，如B2.5/8、A4/8.5，可带标准号和数量前缀）及其引出线；在引出线水平段上或末端找表面结构符号，作为中心孔工作面的要求。区分一般表面上的代号：它们不与中心孔标记共用引出线。"
