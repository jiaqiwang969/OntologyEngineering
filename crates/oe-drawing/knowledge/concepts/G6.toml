[[concepts]]
id = "DC-G6-005"
name = "只用表面结构符号的简化注法"
aliases = ["仅用符号的表面结构等式简化注法", "只用符号的简化注法"]
group = "G6"
kind = "simplified_representation"
meaning = "视图上只标不带任何参数的基本、去除材料或不去除材料符号，再在图上用等式“光符号 = 带要求的代号”统一说明其含义。"
components = ["视图上：三种光符号之一注在各表面，不带文字。", "说明处：等式左边为同一光符号，等号右边为带参数的完整代号（如√ = √Ra 3.2），放在标题栏附近或图形附近。", "三种符号可分别对应不同要求（未指定工艺、去除材料、不去除材料）。", "1993版称省略注法（图14、15），也须在标题栏附近说明这些简化符号代号的意义；1993版不带值的符号另有“仅要求获得方法”的含义。"]
variants = ["GB/T 131-2006 11.3.2.3 图26-图28", "GB/T 131-1993 4.5 省略的注法 图14 图15 with explanation near the title block", "基本符号", "去除材料符号", "不去除材料符号"]
dxf_forms = ["on the views: INSERT of a 2/3-LINE block or CIRCLE variant without ATTRIB/TEXT", "near the title block: bare INSERT + TEXT '=' + complete-symbol INSERT + TEXT 'Ra 3.2' on one baseline", "the whole equation as one block, or exploded LINE/TEXT"]
recognition = "先在视图上找到无文字的符号；再在标题栏附近找“光符号 + ‘=’ + 带代号的完整符号”同一基线的组合，按左侧符号类型（√、带短横、带小圆）与视图上的光符号配对，把右侧要求赋给它们。没有等式时，光符号按版本解释（2006版须有注释才可单独使用；1993版表示只要求获得方法）。区分多数表面注法括号内的光符号（在括号内而非等式左边）和带字母的等式（左边符号带字母）。"
confusions = ["多数表面注法括号内的基本符号：在括号中，不是等式左边", "带字母的等式简化注法：左边符号带小写字母", "1993版不注数值的符号：仅表示获得方法", "单独使用的基本符号：须附注释"]
related = ["DC-G6-007", "DC-G6-006", "DC-G6-071", "DC-G6-072", "DC-G6-063", "DC-G9-028"]
priority = "medium"
text_forms = ["√ = √Ra 3.2", "去除材料符号 = 去除材料符号 + Ra 3.2（图上为图形）"]
