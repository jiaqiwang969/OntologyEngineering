[[concepts]]
id = "DC-G3-130"
name = "装配图中小截面弹簧示意与涂黑"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "装配图中弹簧丝或片材的截面在图形上直径或厚度不大于2 mm时，螺旋弹簧、碟形弹簧、片弹簧可用示意图表示；被剖切时截面也可涂黑；截面小且弹簧内有零件时可用规定的示意形式。"
components = ["示意画法：螺旋弹簧画成沿其轴线往复的单条折线（锯齿线），两端接支承面。", "涂黑画法：被剖切的小截面簧丝或片材断面画成实心涂黑的小圆或小条。", "弹簧内部有零件时，可按标准图3的示意形式画出簧圈范围，以便同时表达内部零件。", "判断尺寸以图形上的尺寸为准（随比例变化），而非实物尺寸。"]
variants = ["示意图（单线）", "剖面涂黑", "弹簧内部有零件时的示意画法（图3）"]
dxf_forms = ["Schematic helical spring as one LWPOLYLINE zigzag on layer 01, vertices alternating between two parallel envelope lines", "Blacked wire sections as HATCH SOLID in small CIRCLEs, or closed LWPOLYLINE with width (donut), on layer 10 or 01", "INSERT of a spring block from a CAD mechanical library, often exploded to LINE/ARC"]
recognition = "以装配图中两支承面之间的单条锯齿折线为锚点：顶点交替落在两条平行包络线上、节距近似相等、折线方向与弹簧轴线一致，一般与相邻零件的孔或杆同轴。涂黑形式以一列等间距、直径不大于图上约2 mm的SOLID填充小圆为锚点，成两列关于弹簧轴线对称排列。与狭小剖面涂黑区分：后者是连续长条，不成等距点列；与螺旋副符号区分：后者锯齿线位于矩形内并在机构简图中。"
confusions = ["狭小剖面涂黑（垫片、薄板）：连续长条涂黑，不是等距排列的小圆。", "机构简图弹簧符号：独立符号，与杆件、运动副符号相连，不在装配剖视中。", "焊缝涂黑：位于两零件接缝处，呈三角或条形。", "螺纹牙型或滚花：锯齿在零件轮廓上，而不是独立夹在两支承面之间。"]
