[[cards]]
id = "dimension_text"
expression_kind = "dimension"
title = "尺寸注写文法"
meaning = "尺寸值的书写形式：尺寸数字前后可带尺寸符号（Ø、R、C、SØ、SR）、重复要素数量（n× 或旧式 n-）、公差带代号（如 H7、k6）、极限偏差（上下叠写、±对称、零偏差）、螺纹标记（M、Tr、B 等及其公差带代号、旋向、旋合长度）、孔的旁注符号（深度 ↧、沉孔 ⌴、埋头 ⌵）和角度单位。文法说明数值是什么尺寸、带什么公差，不决定被测要素。"
sources = [
  "GB/T 4458.4-2003 机械制图 尺寸注法 3.2、4.1.5、4.2.3、4.2.4",
  "GB/T 16675.2-2012 技术制图 简化表示法 第2部分：尺寸注法 4.2.1、4.2.2、表1、表2",
  "GB/T 4458.5-2003 机械制图 尺寸公差与配合注法 4.1.1–4.1.4",
  "GB/T 1800.1-2020 公差带代号与标准公差等级 4.1.2、4.2",
  "GB/T 4459.1-1995 螺纹及螺纹紧固件表示法 4.6、附录A",
  "GB/T 197-2018 普通螺纹 公差（螺纹标记与公差带代号）",
  "机械制图（第7版）§1 尺寸数字、§7-4、§8-1、§9-5",
  "互换性与测量技术 1.3.3 公差带代号",
]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K34", "K39"]
recognition = "以尺寸表达或文字的显示文本为锚（解码 %%c、%%d、%%p 与 \\S 叠写）：开头的数字后紧跟 × 或旧式 - 再接尺寸符号或数值为数量；Ø/R/C 等前缀定尺寸类型；数值后紧跟“基本偏差字母 + 标准公差等级”为公差带代号；“上/下”成对且带符号或为 0 的为极限偏差；M、Tr、B 等前缀接直径的为螺纹标记，其后“等级数字 + 位置字母”为螺纹公差带；° ′ ″ 为角度单位。哪些符号、字母和词属于哪个概念从本卡词表读取。"
markers = ["Ø", "R", "C", "×", "±", "°", "M", "↧", "⌴", "⌵"]
parameters = []
concepts = ["DC-G4-017", "DC-G4-030", "DC-G4-055", "DC-G4-006", "DC-G4-041", "DC-G4-032", "DC-G4-099", "DC-G4-040", "DC-G3-091", "DC-G3-080", "DC-G4-094", "DC-G4-088", "DC-G4-114", "DC-G4-132", "DC-G4-126", "DC-G4-103", "DC-G4-113", "DC-G3-088", "DC-G3-223", "DC-G3-232", "DC-G3-089"]

