dxf_forms = ["Third-angle symbol as INSERT or LINE/CIRCLE: two concentric CIRCLEs to the left of a trapezoid on a common centre line, often in the title-block projection cell", "Text such as 'THIRD ANGLE PROJECTION' on foreign drawings"]
recognition = "以第三角投影识别符号（同心圆在左、梯形在右）或标题栏中的标注为锚点；没有符号时依据视图内容推断（主视图上方的视图显示顶面特征且长对正）。识别后翻转视图方位映射。"
