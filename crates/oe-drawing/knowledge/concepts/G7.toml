dxf_forms = ["LINE with arrowheads at both ends (two SOLIDs or DIMENSION-like arrows) and TEXT 'TMD'", "reference LINE with TEXT such as 'S 45%%d%%p10%%d'"]
recognition = "锚点为文字“TMD”，与之贴近的双箭头直线即符号；参考线上的单字母C/M/S与角度一起读取。若为单向箭头且文字为PRD，归局部运动方向。"
confusions = ["PRD局部运动方向：单向箭头。", "重力或视图方向箭头：无TMD文字。", "双箭头尺寸线：两端有尺寸界线，中间有尺寸数字。"]
