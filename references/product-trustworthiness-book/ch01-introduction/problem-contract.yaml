reader_problem: >-
  当多份工程结果分别为 PASS 时，如何判断它们是否真的指向同一产品或工件快照、
  同一 concern、相容的情境与时段，并足以支持一条有明确决定范围的可反驳主张；
  这一断裂又如何沿对象、术语、责任、场景、目标、数据、版本、依赖、生命周期和发布基线，
  展开为前十章问题，并由后十章的独立工程本体逐一回答？

natural_judgment:
  id: NaturalJudgment-01
  statement: >-
    只要每个专业的检查都通过，而且当前没有发现问题，所有局部绿色结果相加，
    就足以证明产品可信并允许放行。

failure_signature: >-
  每一份报告都可能真实且在自己的局部边界内正确，但其 subject、configuration、
  concern、context、time 或 decision scope 不一致；将 PASS 数量汇总不能生成一条
  关于同一候选产品快照的可签主张。

missing_distinctions:
  - ProductOrArtifact_vs_ConfigurationSnapshot
  - Concern_vs_CompositeTrustScore
  - Claim_vs_Report
  - EvidenceArtifact_vs_EvidenceSupportRelation
  - SupportEvidence_vs_CounterEvidence
  - Unknown_vs_False
  - EngineeringActivity_vs_AuthorizedDecision
  - Assessor_vs_DecisionAuthority
  - LocalPass_vs_ProductRelease

working_trustworthiness_definition: >-
  产品可信不是产品自带的永久徽章，而是有权决策者针对明确产品或工件快照，
  在声明的 concern、情境、时段、假设和决定范围内，依据可追溯的支持证据、
  反证与未知项，对一组可反驳主张作出的可复查、可撤销接受。

