[[concepts]]
id = "DC-G5-009"
name = "基准要素标识（基准符号）"
aliases = ["基准符号", "基准符号（基准代号）"]
group = "G5"
kind = "datum"
meaning = "指认基准要素的符号：方框内写基准字母，细实线连到贴在基准要素上的基准三角形（涂黑或空白含义相同）。字母与公差框格基准格中的字母对应，符号只说明“此要素是基准要素”。"
components = ["基准方框：细实线正方形，边长约等于框格高 H（≈2h），内写一个大写字母（字母用完时可重复为 AA、BBB），无论符号朝向如何字母都水平书写", "连线：细实线，从方框一边中点引出，垂直于基准要素，长度约 1～2h", "基准三角形：近等边三角形，底边贴在轮廓线、延长线、尺寸线延长线、参照线或公差框格边上，涂黑或空白同义", "旧版（GB/T 1182-1996 及以前）：圆圈内写字母，连线另一端为贴在要素上、与连线垂直的粗短横线；读旧图时与现行形式同义"]
variants = ["filled triangle", "open triangle", "double/triple letters (AA, BBB) when letters run out", "old GB form (pre-ISO) - circle with letter joined to a short thick bar; GB/T 17773-1999 preface notes national datum symbol replaced ISO one (uncertain shape, not drawn in these OCR texts)", "涂黑三角形", "空白三角形", "放在轮廓线上", "放在尺寸线延长线上", "代替尺寸箭头", "字母方框与连线任意方向"]
dxf_forms = ["INSERT of a datum block (square or circle + ATTRIB letter + connector + triangle or bar), often anonymous or plugin-named", "exploded: closed LWPOLYLINE or 4 LINE square + TEXT letter + LINE connector + SOLID or solid HATCH triangle (open triangle: 3 LINE / closed LWPOLYLINE)", "old form exploded: CIRCLE + TEXT + LINE + short thick LINE/LWPOLYLINE (global width) often on layer 01", "AutoCAD: TOLERANCE entity holding only a datum identifier plus LEADER/QLEADER with arrowhead block _DatumFilled or _DatumBlank"]
recognition = "以单个大写字母为锚：字母居中于边长约 H（半边长 0.6–1.8h）的方框或旧版圆圈；方框一边中点伸出一条细线（长约 1–3 个方框边长），另一端是基准三角形（近等边，最长边/最短边≤1.6，涂黑或空白）或旧版粗短横线（与连线垂直、连线落在其中点）。终端落在轮廓线、延长线、尺寸线延长线、参照线或框格边上。四部分齐全才成立，图块与散线同样处理。终端与尺寸线对齐时转 DC-G5-010，错开时转 DC-G5-013。"
confusions = ["理论正确尺寸方框：框内是数值，没有连线和三角形", "剖切位置或视图名称字母：旁边是剖切符号或投射箭头，没有三角形终端", "尺寸或指引线箭头：细长（长宽比约 3 以上），基准三角形近等边", "公差框格的基准格：只是框格中的一格，不带连线和三角形", "正方形符号 □、零件序号圆圈（数字）、表面结构符号"]
related = ["DC-G5-010", "DC-G5-013", "DC-G5-003", "DC-G5-002", "DC-G5-001", "DC-G5-090", "DC-G4-029", "DC-G4-050"]
priority = "high"
text_forms = ["A", "B", "AA"]
knowledge_units = ["K23", "K24", "K25"]
recognition_cards = ["datum_feature_symbol"]
recognizer = "card"
seen_on_drawing = ["second"]
expert_checked = false
notes = "Linked recognition card datum_feature_symbol (old circle+bar and current square+triangle variants). GB/T 17851-2022 advises against I, O, Q, X; the textbook lists E, I, J, M, O, P, L, R, F as unused. GB/T 39645 图58 gives the proportions. DXF forms are general CAD practice (AutoCAD/GstarCAD/CAXA with GB templates), not from the cited sources."
