notes = "GB/T 1182-2018 Annex A.3.2: the former 'from…to' sign is withdrawn and replaced by this symbol. General CAD practice, not from the sources: TOLERANCE entity, gdt.shx letter codes, Unicode code points, block/explode forms and layer use."
