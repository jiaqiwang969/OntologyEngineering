[[concepts]]
id = "DC-G4-105"
name = "与标准件配合时仅注零件公差带代号"
aliases = ["与标准件配合处只注一方公差带", "装配图上滚动轴承配合的标注"]
group = "G4"
kind = "tolerance_indication"
meaning = "零件与标准件或外购件（如滚动轴承）配合时，在装配图上该配合尺寸只注出非标准零件（轴颈或外壳孔）的公差带代号，标准件的公差不注。"
components = ["公称尺寸：配合处的直径，如 Ø80", "单侧代号：只写轴颈代号（j6、k6、m6…）或外壳孔代号（G7、H7、J7、K7、M7…）", "不写分数式：不出现孔/轴分数形式的配合代号", "例外：同一孔中与端盖等非标准件配合仍按分数注，如 M7/f7"]
variants = ["外壳孔代号（G7、H7、J7、K7、M7…）", "轴颈代号（j6、k6、m6…）", "同一孔中与端盖组成非基准制配合 M7/f7"]
dxf_forms = ["diameter or linear DIMENSION whose override text is '%%c<>k6' or '%%c80J7' (single class code)", "TEXT next to a bearing outline in an assembly view", "bearing drawn as an INSERT block (often with cross or simplified symbol) adjacent to the dimension"]
recognition = "锚点：装配图中的直径尺寸文字后只有一个公差带代号（大写字母+数字或小写字母+数字），无分数线。检验：尺寸界线或箭头落在滚动轴承内圈孔或外圈外径上（轴承符号/图块：矩形内交叉线或滚动体圆）。大写代号→外壳孔、小写→轴颈。与零件图上的公差带代号区分：零件图不画配合件；与配合代号区分：后者为“孔/轴”分数形式。"
confusions = ["配合代号（分数形式 H7/k6）：两侧都注", "零件图上的公差带代号：单个零件图中的同样写法", "不完整的配合代号：并非遗漏，而是标准件公差另有标准"]
related = ["DC-G4-150", "DC-G4-114", "DC-G4-154", "DC-G3-032", "DC-G3-225"]
priority = "medium"
text_forms = ["Ø80J7", "Ø40k6", "Ø62H7", "Ø35j6"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K15", "K36"]
