[[concepts]]
id = "DC-G5-046"
name = "公共公差带 CZ"
aliases = []
group = "G5"
kind = "symbol"
meaning = "教材写法的公共公差带：公差值后写 CZ，表示同一框格控制的几个分离要素共用一个公差带（如几个共面表面合在一起控制平面度）。现行标准称“组合公差带”。"
components = ["字母 CZ：写在第二格公差值后，中间留空格", "被测要素：从同一框格引出多根带箭头的指引线，或在框格上方写 n×（二者不同时用）", "名称沿革：GB/T 1182-2008 及教材称“公共公差带”，GB/T 1182-2018 改称“组合公差带”"]
variants = ["与多箭头指引线合用"]
dxf_forms = ["TEXT/MTEXT value 't CZ' in the second cell of an exploded frame", "TOLERANCE entity: 'CZ' typed after the value in the first %%v cell", "INSERT of a frame block with the value attribute ending in 'CZ'"]
recognition = "第二格文字在公差值后出现独立词元“CZ”，且同一框格有两根以上指引线或上方有 n× → 公共（组合）公差带，把这些被测要素归为一组。A-B 在基准格且用连字符，是公共基准；CZR 末尾多 R；SZ 表示独立公差带。"
confusions = ["公共基准 A-B（基准格中，用连字符）", "独立公差带 SZ；有多根指引线但未写 CZ 时默认各自独立", "CZR（仅约束转动）"]
