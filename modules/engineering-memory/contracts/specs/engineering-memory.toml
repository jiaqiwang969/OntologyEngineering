identity = "原件锚点身份与本次查询分数"
fields = [
 {name="score",meaning="与recall同式的词项相关分数",rust_type="u64",required=true,format="integer",unit="不适用",precision="正整数，乘10000后取整",write="检索时计算",applicability="排序提示",acceptance="分数不是证据"},
 {name="anchor",meaning="目录中保存的原件锚点",rust_type="SourceAnchor",required=true,format="object",unit="锚点",precision="与read_window同范围输出逐字段一致",write="构建时保存",applicability="引用前须重新read_window复核",acceptance="原件变化后不得直接引用"}
]

[[requirements]]
id = "history_conversation_anchor_catalog"
function = "为全部历史会话建立只含用户与助手可见消息的对话锚点目录，并按文字检索返回可直接核对引用的原件锚点"
condition = "宿主显式根目录与有界构建请求；会话原件为追加写入的Codex或Claude JSONL；锚点只由evidence::read_window产生"
acceptance = "目录条目逐字段等于read_window对同一字节范围的SourceAnchor；每个文件保存游标、大小、修改时间、inode与已索引前缀的流式SHA256，追加只索引新尾部，前缀不符、截断或替换时旧分片与清单移入superseded后从0重建，不混合新旧内容。超过16 MiB的行只在流式解析证明不是可见消息或为非法JSON时留下不可变回执并跳过，可能是消息则记录blocked_at并停止该文件。构建互斥、可续跑、幂等，遵守文件数、时长与最小剩余空间并只提交完整行；不跟随符号链接，跳过凭据路径与含凭据标记的消息。状态与检索只读、内存有界，只读已提交分片，结果引用前须用read_window复核；不调用模型，不写正式经验，不授予工程采用。"

[[modules]]
id = "memory_history_anchor_catalog"
kind = "pipeline"
rust_path = "modules/engineering-memory/runtime"
purpose = "以原件读窗器建立低占用的全历史可见对话目录，替代复制全部原件的内容接入"
realizes = ["history_conversation_anchor_catalog"]
platform = "Rust原生流式读取、分片JSONL与单文件清单；检索复用recall的归一化、词项与打分"
effects = "只写history-index下的清单、分片、超长行回执、构建回执与被替换的旧分片；不写records、sources、packets或会话原件"
failures = "非法请求、根目录无效、构建锁占用、来源读取中变化及磁盘余量不足均显式报告；单文件失败不改变其他文件已提交状态"
status = "source_only"
depends_on = ["cass_evidence", "memory_runtime"]

[[constraints]]
id = "history_index_prefix_integrity"
requirement = "history_conversation_anchor_catalog"
module = "memory_history_anchor_catalog"
check = "verify_prefix_then_extend"
rust_path = "modules/engineering-memory/runtime/src/history_index.rs"
statement = "续扫前以64 KiB块重算[0,cursor)的SHA256并与清单比较，同时核对设备、inode与大小不小于游标；任何不符都把旧分片、清单与该文件超长行回执移入superseded后从0重建。每个读窗终点对齐到完整行，锚点直接取自read_window，游标只前进到已处理的完整记录；分片先追加并同步，清单后原子提交，未提交尾部在续扫前截去。"
severity = "error"

[[constraints]]
id = "history_index_oversized_line_boundary"
requirement = "history_conversation_anchor_catalog"
module = "memory_history_anchor_catalog"
check = "classify_oversized_line"
rust_path = "modules/engineering-memory/runtime/src/history_index.rs"
statement = "超过16 MiB的完整行用流式解析只读取顶层type、payload或message的type、role、channel、phase及内容块类型，规则与读窗的可见消息判定一致；重复关键键或无法判定视为可能的消息。只有非法JSON或可证明非可见消息才写不可变回执并前进；可能的消息记录blocked_at与原因并停止该文件；没有换行的末尾行视为仍在写入而等待。"
severity = "error"

[[constraints]]
id = "history_search_readonly_bounded"
requirement = "history_conversation_anchor_catalog"
module = "memory_history_anchor_catalog"
check = "search_committed_shards"
rust_path = "modules/engineering-memory/runtime/src/history_index.rs"
statement = "状态与检索不创建目录、不取构建锁、不写任何文件；检索按清单只读取已提交分片字节，逐行解析锚点，按provider、profile、会话与时间过滤，用recall同一归一化与词项公式打分，每个线程只保留前k个结果；空查询、越界上限、非法时间拒绝。"
severity = "error"

[[validations]]
id = "history_index_anchor_equality"
constraint = "history_index_prefix_integrity"
module = "memory_history_anchor_catalog"
behavior = "history_index_builds_codex_and_claude_anchors_equal_to_read_window"
rust_path = "modules/engineering-memory/runtime/tests/history_index.rs"
oracle = "合成Codex与Claude原件构建后分片锚点逐字段等于read_window全范围输出，开发者、推理、工具与事件记录不进入目录，含凭据标记的消息被计数排除。"
scope = "读窗一致性与可见消息边界；不评价检索质量"

[[validations]]
id = "history_index_incremental_and_rewrite"
constraint = "history_index_prefix_integrity"
module = "memory_history_anchor_catalog"
behavior = "history_index_appends_scan_only_tail_and_rewrites_supersede"
rust_path = "modules/engineering-memory/runtime/tests/history_index.rs"
oracle = "追加后只索引新增字节且锚点无重复；中段改写或截断后旧分片与清单出现在superseded，新分片等于新原件读窗；未换行的末尾行等换行出现后才索引；模拟提交前中断后不重复锚点。"
scope = "本地追加写入原件的增量与重建；不提供签名或防同权限篡改"

[[validations]]
id = "history_index_oversized_lines"
constraint = "history_index_oversized_line_boundary"
module = "memory_history_anchor_catalog"
behavior = "history_index_skips_oversized_non_messages_and_blocks_messages"
rust_path = "modules/engineering-memory/runtime/tests/history_index.rs"
oracle = "超长Codex事件行与Claude工具结果行留下回执并继续索引后续消息；超长可见用户消息使文件停在该行并报告原因，之前的消息保留、之后不进入。"
scope = "超长行分类边界；不改变读窗16 MiB上限"

[[validations]]
id = "history_index_bounded_resumable_build"
constraint = "history_index_prefix_integrity"
module = "memory_history_anchor_catalog"
behavior = "history_index_build_is_bounded_resumable_and_exclusive"
rust_path = "modules/engineering-memory/runtime/tests/history_index.rs"
oracle = "max_files停在文件边界并报告待处理，重复构建最终完成且结果相同；持有构建锁时第二次构建拒绝；min_free_bytes不足时不写分片；符号链接与凭据路径不被索引。"
scope = "构建控制与资源边界"

[[validations]]
id = "history_search_readonly_ranking"
constraint = "history_search_readonly_bounded"
module = "memory_history_anchor_catalog"
behavior = "history_search_ranks_filters_and_is_read_only"
rust_path = "modules/engineering-memory/runtime/tests/history_index.rs"
oracle = "中文与英文查询按recall同式排序，provider、profile、会话与时间过滤生效，空查询与越界上限拒绝；状态与检索前后目录逐字节不变，缺失目录时不创建。"
scope = "只读检索行为；不证明语义相关性"

# --- track B: authorized curation ---

