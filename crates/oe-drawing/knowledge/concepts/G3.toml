[[concepts]]
id = "DC-G3-119"
name = "滚动轴承特征画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在剖视图中用矩形线框加框内结构要素符号（长粗实线或长粗圆弧线与短粗实线的组合）较形象地表示滚动轴承的套圈数、列数、是否调心及径向/轴向/径向与轴向承载特性；画在轴的两侧，不画剖面线。"
components = ["矩形线框：粗实线，尺寸取轴承剖面外廓（宽B×径向高(D−d)/2），位于轴外径与座孔之间，在轴线两侧镜像各画一个；标准图例中框的两条端面线向下延伸到轴线处。", "长的粗实线表示非调心（1998版称不可调心）轴承滚动体的滚动轴线：径向承载时平行于轴线，轴向承载时垂直于轴线，径向和轴向联合承载时倾斜画出。", "长的粗圆弧线表示调心（1998版称可调心）轴承的调心表面或滚动轴线的包络线。", "短的粗实线与长线（或圆弧）成90°（或沿法线）相交并通过每个滚动体中心，根数即列数；三个套圈的轴承用两条平行长线、长线加圆弧，或带一条伸到框边的竖线（Y形、T形）表示。", "同一图样中一般只采用通用画法或特征画法中的一种；附件只画外形、可画出轴承某一零件等规定也适用于特征画法。"]
variants = ["两个套圈/三个套圈", "单列/双列", "径向/轴向/径向和轴向承载", "调心/非调心", "深沟球轴承", "圆锥滚子轴承", "推力球轴承"]
dxf_forms = ["Exploded thick LINE/ARC strokes on layer 01 inside a rectangular LWPOLYLINE/4-LINE frame; no HATCH; mirrored pair about the shaft centre line (layer 05)", "INSERT of a parametric bearing block from GstarCAD/CAXA 图库 or AutoCAD Mechanical (block name often carries the bearing code such as 6208 or 30208), sometimes nested with the frame and shaft-side legs", "Frame drawn with the end-face lines extended to the shaft as in the GB figures, so it may appear as an open U/П shape rather than a closed rectangle", "Bearing designation separately as TEXT/MTEXT in the parts list (明细栏), linked by a balloon leader"]
recognition = "锚点为夹在轴外径线与座孔线之间的粗实线矩形框（宽≈B，高≈(D−d)/2），在轴线另一侧有同尺寸镜像框。框内粗线段一般不触框：一条长线（约为框宽或框高的1/2～2/3）被1～2条短线（约为长线的1/4～1/3）正交穿过，或一条长圆弧被短线沿法向穿过。长线方向判定承载：平行轴线＝径向，垂直＝轴向，倾斜或成V/Y形＝角接触/圆锥滚子；短线根数＝列数；双长线或竖线触框＝三个套圈。区分：通用画法只有居中正立十字、两臂均不触框；密封符号的斜线从静态长线端点出发；剖面线为多条等距细线。"
confusions = ["滚动轴承通用画法：只有居中正立十字，四端不触框，不表示承载方向和列数。", "动密封圈特征画法：斜线与紧贴长边的静态长线相接，没有正交短线穿过。", "滚动轴承规定画法：画出套圈剖面（带剖面线）和球/滚子的真实轮廓，一般只画在轴的一侧。", "推力轴承特征画法：属同一画法的轴向承载情形，长线垂直于轴线。"]
related = ["DC-G3-121", "DC-G3-188", "DC-G3-124", "DC-G3-123", "DC-G3-128", "DC-G3-116", "DC-G3-120", "DC-G3-032", "DC-G3-103", "DC-G3-183", "DC-G3-122", "DC-G3-225"]
priority = "medium"
text_forms = ["滚动轴承 6208 GB/T 276", "滚动轴承 30208 GB/T 297"]
knowledge_units = ["K13", "K36"]
recognition_cards = []
recognizer = "none"
