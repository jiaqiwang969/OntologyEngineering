[[concepts]]
id = "DC-G5-010"
name = "尺寸要素基准的标识放置（与尺寸线对齐）"
aliases = ["基准为轴线、中心平面或中心点时的基准符号位置", "基准代号标注在几何公差框格下面"]
group = "G5"
kind = "datum"
meaning = "基准要素是尺寸要素（圆柱、两平行平面、球）时，基准三角形与该要素的尺寸线对齐放置，表示基准是它的导出要素（轴线、中心平面或中心点）。"
components = ["放在尺寸线的延长线上：三角形底边贴在尺寸界线上，与尺寸线共线；两端箭头放不下时三角形可代替尺寸线一端的箭头", "放在指向该尺寸线延长线的公差框格上，或放在该尺寸的引出参照线上", "螺纹、齿轮等作基准时默认取中径或节圆；取大径或小径时在基准符号附近注 [MD] 或 [LD]", "基准本身采用最大/最小实体要求时也同样与尺寸线对齐，框格中在字母后加 Ⓜ/Ⓛ", "旧注法：基准符号直接连到轴线或中心平面（GB/T 1182-2018 附录 A.4.2），以及圆柱上不与尺寸线对齐的含糊注法（A.3.8），均已废止"]
variants = ["on dimension line extension", "on tolerance frame", "on reference line of a dimension", "[MD]/[LD] for threads/gears", "obsolete: datum symbol connected directly to an axis or median plane (GB/T 1182 A.4.2)", "ambiguous cylinder datum indications (A.3.8)", "三角形代替尺寸线一端箭头", "基准本身不采用 MMR/LMR 时也注在尺寸线处", "基准本身采用最大实体要求", "基准本身采用最小实体要求"]
dxf_forms = ["datum triangle (SOLID/HATCH) whose axis is collinear with the dimension line of a DIMENSION entity, triangle base on its extension line", "DIMENSION entity whose one arrowhead is the _DatumFilled/_DatumBlank block (DIMBLK1/DIMBLK2 override), datum box as separate INSERT or TEXT", "exploded dimension: LINE dimension line + SOLID arrow at one end + datum triangle at the other end", "datum block INSERT attached to the bottom or top edge of a frame block"]
recognition = "以已识别的基准符号为锚（见 DC-G5-009）：若其连线方向与某个直径或宽度尺寸线共线（夹角≤3°，横向偏差≤0.3h），三角形底边落在该尺寸的尺寸界线上，则基准为该尺寸要素的导出要素（轴线、中心面）；三角形代替箭头时该尺寸线这一端没有普通箭头。若三角形贴在轮廓或与尺寸线错开≥1h，则按非尺寸要素基准处理（DC-G5-013）。"
confusions = ["非尺寸要素基准：三角形在轮廓上或延长线上，与尺寸线明显错开", "尺寸线箭头：细长实心箭头，不是近等边三角形", "被测导出要素指引线：与尺寸线对齐的是公差框格指引线的箭头，不是基准三角形", "叠放框格上的基准符号：贴在框格边上而非尺寸线上，仍按框格所指的要素判断"]
related = ["DC-G5-009", "DC-G5-013", "DC-G5-107", "DC-G5-109", "DC-G5-078", "DC-G5-065", "DC-G5-075", "DC-G4-055"]
priority = "high"
text_forms = ["[MD]", "[LD]", "[PD]"]
knowledge_units = ["K23", "K24", "K25"]
