[[concepts]]
id = "DC-G3-084"
name = "紧固组合尺寸注法"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "在符号表示的紧固件图中，孔、螺栓、铆钉轴线平行于投影面时，尺寸界线与紧固件符号断开（留出空隙）；孔的直径用指引线注在孔符号附近。"
components = ["尺寸界线：沿符号中心线方向引出，但起点与符号之间留明显空隙，不与符号相接。", "尺寸线及终端按一般尺寸注法。", "孔径：用指引线在孔符号近旁注直径。"]
variants = ["尺寸界线与符号断开", "孔径用指引线标注"]
dxf_forms = ["DIMENSION entities with a large extension-line offset (DIMEXO) or exploded LINE extension lines starting a gap away from the fastener symbol", "Fastener/hole symbol (thick strokes with a thin horizontal LINE for the axis-parallel case) as INSERT or LINEs", "LEADER + TEXT \"%%c13\" placed next to the hole symbol"]
recognition = "锚点为轴线平行于投影面的紧固件符号（粗实线符号加细实线水平线）；检查附近尺寸界线：其延长线通过符号中心线，但端点与符号最近点之间有可见空隙（约为字高的0.5–1倍）。孔径文本（Ø+数值）由指引线指向邻近的孔符号。与普通尺寸界线区分：普通尺寸界线从真实轮廓或中心线引出，起点几乎与轮廓相接；与孔的旁注法区分：旁注针对真实孔并含深度、沉孔符号。"
confusions = ["普通尺寸界线：从轮廓直接引出，起点与轮廓相接或仅留很小间隙。", "孔的旁注法：针对机械零件上画出的真实孔，含深度、沉孔等信息。"]
related = ["DC-G3-083", "DC-G3-194", "DC-G3-160", "DC-G4-058", "DC-G4-059", "DC-G4-088"]
priority = "low"
text_forms = ["Ø13"]
knowledge_units = ["K13", "K34"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 24741.1-2009 第5.1、5.2条（图2、图3）。间隙大小未见标准数值，所给比例为估计。"
