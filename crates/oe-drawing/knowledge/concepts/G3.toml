[[concepts]]
id = "DC-G3-010"
name = "初始轮廓"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "需要表示零件成形（如弯曲、压制）之前的初始形状时，用细双点画线把初始轮廓画在完工形状上。"
components = ["完工轮廓：粗实线。", "初始轮廓：细双点画线，与完工轮廓在未变形部分重合或相接，在变形处分开（如弯曲前的直板）。"]
variants = []
dxf_forms = ["LINE/ARC/LWPOLYLINE on layer 07 (细双点画线; linetype PHANTOM / ACAD_ISO05W100), thin lineweight, sharing endpoints with the thick finished outline"]
recognition = "锚点：与粗实线零件轮廓共享端点或部分重叠的细双点画线轮廓，它属于同一零件（不与别的零件接触），形状是该零件变形前的状态，例如直板对应弯板，长度约等于弯板中性层展开长。区分：相邻辅助零件是另一零件，只与主零件接触；运动件极限位置是全等形状平移或绕铰点转动后的轮廓；毛坯轮廓包在完工轮廓外并留有加工余量。"
confusions = ["相邻辅助零件：别的零件，不共用轮廓。", "运动件极限位置：同形轮廓的位移。", "毛坯图与完工零件的相互表示：毛坯轮廓包络完工轮廓。"]
