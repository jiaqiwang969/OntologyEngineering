[[concepts]]
id = "DC-G3-113"
name = "弹簧中间部分省略画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "有效圈数在四圈以上的螺旋弹簧，中间部分可以省略，只画两端各一两圈；圆柱螺旋弹簧省略后允许适当缩短图形长度，截锥涡卷弹簧省略后用细实线相连。"
components = ["两端：按规定画出支承圈和靠近端部的一两圈（视图为斜直线轮廓，剖视为簧丝截面）。", "中间：省略不画；圆柱螺旋弹簧常用通过簧丝截面中心的细点画线连接两端。", "长度：省略后可缩短图形，但自由高度H0仍注实际数值。", "截锥涡卷弹簧：中间省略后用细实线相连。"]
variants = ["圆柱螺旋弹簧", "截锥涡卷弹簧（细实线相连）"]
dxf_forms = ["Two groups of wire-section CIRCLEs (often HATCHed or solid-filled) or inclined LINE pairs at each end, with a gap between", "Thin CENTER-linetype LINEs (layer 05) along the wire-centre rows bridging the gap; for volute springs thin continuous LINEs (layer 02)", "Linear DIMENSION H0 whose measured length is smaller than its override text (shortened picture)"]
recognition = "以弹簧剖视中两排半径相等、节距相等的小圆（簧丝截面）为锚点，检查每排中间是否有断开区；断开区内有两条平行于弹簧轴线、分别穿过上下两排圆心的点画线，即判为中间省略。若H0尺寸的测量值小于标注值，说明图形已缩短。区分断开画法：断开画法有波浪线、双折线等断裂边界，弹簧省略没有断裂线；区分链条或滚子排：连续排列，无点画线桥接。"
confusions = ["断开缩短画法：有断裂边界线。", "长件缩短画法：用于轴、杆等，非簧丝截面。", "链条：连续排列的链节，无点画线连接。"]
related = ["DC-G3-017", "DC-G3-018", "DC-G3-019", "DC-G3-028", "DC-G3-102", "DC-G3-117", "DC-G2-041", "DC-G8-019"]
