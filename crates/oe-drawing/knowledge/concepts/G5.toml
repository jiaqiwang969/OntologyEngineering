recognition = "以第二格中连续两个成组修饰符（SZ、CZ、CZR 的组合）为锚，并在上方相邻区找“n×m×”；按顺序把修饰符分配到组间和组内。"
confusions = ["单个 CZ：只有一层组合", "基准格中的字母"]
related = ["DC-G5-030", "DC-G5-035", "DC-G5-029", "DC-G5-094", "DC-G5-041"]
