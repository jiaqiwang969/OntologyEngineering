id = "DC-G3-034"
name = "牙嵌式离合器齿等相同结构的剖视画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "对端面上均布的牙嵌式离合器齿这类相同结构，在剖视图中不按逐齿真实投影画，而是用简化的方式表示齿所在区域，齿的形状另用一个视图表达。"
components = ["剖视图中轮齿所占的截面区域画成矩形框，框内画两条对角细实线（X），不画剖面线；其余实体部分正常画剖面线。", "端视图中以从中心发出的径向线表示各齿的齿侧，显示齿数与分布。", "齿的实际形状用按箭头方向投射的局部（向）视图表达，必要时加旋转符号或展开表示。"]
