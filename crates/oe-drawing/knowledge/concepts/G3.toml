[[concepts]]
id = "DC-G3-124"
name = "球轴承和滚子轴承的特征画法及规定画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "GB/T 4459.7表3列出向心球轴承和滚子轴承（深沟球、调心球、角接触球、三点/四点接触球、圆柱滚子、调心滚子、圆锥滚子及其双列型）的特征画法与对应的规定画法，供装配图按轴承类型选用。"
components = ["特征画法3.1～3.5：深沟球/圆柱滚子为平行轴线长线加一短线，双列加两短线；调心型为长圆弧加短线；角接触球/圆锥滚子为倾斜长线加短线。", "特征画法3.6～3.10：三点接触为Y形且竖线伸到框边；四点接触为十字但竖线伸到框边；双列角接触/双列圆锥为V形或倒V形两段斜线各带短线，带竖线触框者表示有分体套圈。", "规定画法：球画成圆、圆柱滚子为宽矩形、圆锥滚子为倾斜的矩形/梯形，套圈画成带圆角的剖面轮廓；装配图中套圈画同向同距剖面线，滚动体不画剖面线，保持架和倒角可省略，一般只画在轴的一侧。", "2017版修改了3.6（三点接触）的图形；1998版表3在各型下注出对应产品标准号。"]
variants = ["深沟球轴承", "调心球轴承", "角接触球轴承", "三点接触/四点接触球轴承", "双列角接触球轴承", "圆柱滚子轴承", "双列圆柱滚子轴承", "调心滚子轴承", "圆锥滚子轴承", "双列圆锥滚子轴承"]
dxf_forms = ["Characteristic form: exploded thick LINE/ARC strokes on layer 01 inside the bearing frame, no HATCH", "Specified form: ring outlines as LWPOLYLINE with bulged corners, CIRCLE for balls, rotated LWPOLYLINE rectangles for tapered rollers, HATCH ANSI31 at 45° with equal spacing on both rings (layer 10)", "INSERT of a parametric bearing block from GstarCAD/CAXA 图库 (GB/T 276 深沟球轴承, GB/T 297 圆锥滚子轴承) whose definition often holds the specified half and the general half"]
recognition = "先按滚动轴承框定位（轴外径与孔壁间、轴线两侧对称），再读框内符号：长线方向（平行/倾斜/V形）、是否为圆弧、短线根数、是否有竖线触及框边，据此对照表3确定类型。规定画法一侧：框内一个圆（直径约为框高的1/2～2/3）为球轴承，矩形为滚子，倾斜梯形为圆锥滚子；套圈有同向剖面线而滚动体无剖面线。十字竖臂触框为四点接触，不能当作通用画法。"
confusions = ["通用画法十字：四端均不触框；四点接触特征画法的竖线伸到框边。", "推力轴承：长线垂直于轴线（见推力轴承卡）。", "滚针轴承：框扁平，规定画法中滚动体为细长矩形。", "实心零件剖面中的圆孔：周围为同一零件的剖面线，不成轴线两侧镜像的轴承框。"]
related = ["DC-G3-119", "DC-G3-121", "DC-G3-188", "DC-G3-123", "DC-G3-128", "DC-G3-116", "DC-G3-032", "DC-G3-103", "DC-G3-225"]
