[[constraints]]
id="nx_motion_capture2_save_attempt_boundary"
requirement="req_engineering"
module="nx_worker"
check="execute"
rust_path="crates/oe-nx-worker/src/geometry/motion_task/save_capture2.rs"
statement="显式motion/2用NxMotionSaveObservation2及NxMotionSaveFileError2保留前置检查、原返回header和有界数组事实。preflight_refused要求preflight_status=rejected、call_entered/call_returned均false，return_code/file_error_count_raw为null、storage/capture为not_observed、file_errors为空；call_pending要求passed、完整原库存且1<=loaded_part_count_raw<=4096、路径数等于原count、call_entered/call_returned均null，返回header为null且数组not_observed；call_returned要求同一passed完整库存、call_entered/call_returned均true、两个原返回整数为实际i32、storage是实际NULL形状。header count在0..4096且正数时两个数组均非NULL才可沿已核SDK ABI读取；非法count或正count缺指针用invalid_shape且不解引用，不伪造complete空数组。count=0允许原任意NULL形状，complete且空数组；正count的complete要求原序连续全部项，partial只保留实际连续前缀且显式采集原因，不能补零或把count改为前缀长。诊断最多16项，每项ASCII标识1..96字节；所有路径/数组仍受原事件、总字节/段及接收预算，超限无完整成功。实际返回非0或count非0或非complete不得成为保存通过；code0/count0/complete只支持保存调用，完整闭包/位置/独立重开另验。先持久化已取得raw再分类；旧save_owned_assembly/save_all_owned_assembly对copy/delete/source/fixture的原Ok=保存成功及Err保持。原70预期及/1不改，静态缺口不宣称已原生复现；异常C指针长度本身不能由非NULL证明。"
severity="error"

[[validations]]
id="motion_capture2_save_failure_raw_oracle"
module="nx_worker"
constraint="nx_motion_capture2_save_attempt_boundary"
behavior="private_frozen_save_capture_cases"
