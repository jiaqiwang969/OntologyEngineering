group = "G7"
kind = "note"
meaning = "零件图技术要求中用文字说明热处理和硬度要求的注语，如“调质处理220～250HBW”“表面高频淬火50～55HRC”“表面渗碳，渗碳深度××”“表面硬化和回火”“零件整体硬化和回火”“应经时效处理，以消除内应力”。"
components = ["处理名称：调质、淬火（含高频/表面淬火）、回火、正火、退火、渗碳、渗氮、时效等。", "硬度要求：数值范围或值加硬度标尺，如220～250HBW、50～55HRC、58～62HRC。", "附加参数：渗碳/硬化层深度、处理部位（表面、齿面、局部）。", "位置：技术要求条目中，常编号排列；也可在视图旁配合区域线写出。"]
variants = ["调质", "渗碳", "表面硬化+回火", "整体硬化+回火", "时效/人工时效", "淬火 HRC", "调质 HBW", "时效处理"]
dxf_forms = ["MTEXT technical-requirement block (heading 技术要求 + numbered lines) on text layer 11, e.g. '1.调质处理220~250HBW。'", "single TEXT lines per requirement; '~' may appear as '～' (U+FF5E) or '~'", "HRC/HBW/HV written as plain text; ranges sometimes as '50-55HRC'"]
recognition = "在“技术要求”标题下的文字行或标题栏附近的文字中，用词典匹配热处理名称（调质|淬火|回火|正火|退火|渗碳|渗氮|碳氮共渗|时效|高频|感应|表面硬化）并配合硬度正则（\\d+\\s*[~～-]\\s*\\d+\\s*(HRC|HBW|HB|HV\\d*)）。同时出现处理名称与硬度时判为热处理注语；仅有“时效”可单独成立。"
confusions = ["热处理代号（如5151）：数字代号，旧习惯，多在工艺文件中。", "热处理区域粗点画线：是图线而非文字，但两者常配合。", "表面处理注语（镀铬、发黑、阳极氧化）：属表面处理，不是热处理。", "材料牌号（40Cr、45）：在标题栏材料栏。"]
related = ["DC-G7-026", "DC-G7-089", "DC-G7-021", "DC-G7-083", "DC-G7-090", "DC-G9-002", "DC-G9-005"]
priority = "high"
