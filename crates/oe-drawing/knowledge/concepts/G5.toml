meaning = "可逆要求 Ⓡ：紧接在 Ⓜ 或 Ⓛ 之后的带圈 R，表示几何误差未用满时可反过来放宽尺寸公差，尺寸与几何公差相互补偿；只用于被测要素。"
components = ["带圈 R：圆直径约 0.75H，紧接 Ⓜ 或 Ⓛ 之后、不留空格（第 10 组）", "所在：第二格公差值之后；被测要素是尺寸要素的导出要素（中心线、中心面）", "不写在基准字母之后"]
