[[concepts]]
id = "DC-G2-004"
name = "均布结构转到剖切平面画出"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "回转零件上均匀分布的肋、孔等结构不在剖切平面上时，可假想把它们旋转到剖切平面上按剖开画出；旋转后两侧相同的孔可只画一个，另一侧只画轴线。"
components = ["回转零件的剖视图（全剖或半剖），以零件轴线为对称。", "旋转画出的结构：肋按纵向剖切不画剖面线，用粗实线与邻接部分分开；孔按剖开画出。", "简化：两侧相同的孔一侧画全，另一侧只画细点画线轴线。", "对应端视图：显示结构的真实均布位置（例如三孔不在同一直径上），剖切符号仍为一条直线，无转折。"]
variants = []
dxf_forms = ["No special entity: section geometry (LINE/ARC on layer 01) and HATCH (layer 10) are symmetric about the axis although the end view shows non-diametral features", "A lone centre LINE (layer 05, CENTER linetype) standing for the simplified second hole"]
recognition = "以回转体剖视图与其圆形端视图的配对为锚点：端视图中均布孔或肋数量为奇数，或不在剖切直线上，而剖视图两侧对称地出现孔或肋的剖形，即为此画法；剖切符号为单一直线，与旋转剖的折线剖切符号不同。剖视图一侧只有一条穿过壁厚的细点画线时，按被简化的孔处理。"
confusions = ["旋转剖：剖切符号在回转中心处成角度转折并标字母。", "真实对称结构：端视图中结构本来就在剖切直径上。"]
related = ["DC-G3-015", "DC-G3-046", "DC-G3-111", "DC-G2-016", "DC-G2-020", "DC-G3-134"]
priority = "medium"
text_forms = []
knowledge_units = ["K13"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "与 DC-G3-015 为同一规则（GB/T 4458.6 §5.7、教材 §7-4(4)）。"
[[concepts.sources]]
document = "机械制图（第7版）"
clause = "§7-4 （4）"
page = 247

[[concepts]]
id = "DC-G2-005"
name = "大面积剖面区域只沿周边画剖面符号"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "剖面区域较大时，允许只在轮廓内侧沿周边画一圈带状剖面线（或点阵、涂色），中部留空，仍表示整块均为被剖实体。"
components = ["剖面区域外轮廓：粗实线闭合边界。", "周边带：沿轮廓内侧、宽度大致均匀的剖面线带，各线段近似等长。", "中部空白：带内侧的大面积未填充区，与周边带之间没有轮廓线分隔。"]
variants = []
dxf_forms = ["HATCH whose boundary is a band: outer loop = section outline, inner loop = an offset curve not drawn as a visible line", "Exploded hatch: LINE segments of nearly equal length whose inner ends lie on an offset of the outline", "Assembly drawings: band of solid colour (HATCH SOLID/gradient) along the outline (GB/T 16675.1 A.12)"]
recognition = "以剖面线端点为锚点：一组平行等距剖面线的一端落在粗实线轮廓上，另一端落在与轮廓等距的隐含曲线上，该曲线没有可见图线；中部无剖面线，也没有粗实线围成的空腔。若空白区由粗实线围成，则是孔或空腔，不是此画法。"
confusions = ["未剖切的空腔或孔：空白区边界有粗实线。", "真实薄壁：带的内侧有轮廓线，壁厚就是带宽。", "无断裂边界线时剖面线整齐：整齐边是图形的截止边，不是中间留空。"]
related = ["DC-G2-019", "DC-G2-055", "DC-G2-007", "DC-G2-061"]
priority = "low"
text_forms = []
knowledge_units = ["K11", "K12", "K13", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "4457.5-1984 §2.3、2013 §4.3、17453 两版规则相同；16675.1 A.12 允许在装配图中沿周边画或沿周边涂色。带宽数值为一般实践。"
