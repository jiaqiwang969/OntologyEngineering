[[concepts]]
id = "DC-G5-047"
name = "区间符号（↔）"
aliases = []
group = "G5"
kind = "symbol"
meaning = "区间符号“↔”：写在两个大写字母之间（如 J↔K），表示规范只适用于这两个字母所标起止点（或线）之间的连续要素；也用于给变宽度公差带、变偏置量标出两端位置。"
components = ["区间符号：一段细实线两端各一个实心箭头，总长约 2–3h，写在两字母之间", "起止字母：大写字母，各用一条端头为箭头的指引线指到被测要素上的起点/终点（或界线）；不在要素边界上时用 TED 定位", "位置：框格上方相邻区（适用于所有指引线）或水平相邻区；同组多段相同时前加 n×", "旧写法：单向“从…到”箭头符号，已废止，由区间符号代替"]
variants = ["n× J↔K for several identical portions", "feature limit forms: sharp edge, tangent, offset by TED, GB/T 19096 edge (图62)", "obsolete \"from … to\" sign (GB/T 1182 A.3.2)"]
dxf_forms = ["TEXT/MTEXT 'J↔K' using ↔ (U+2194) above or beside the frame", "exploded: LINE with two SOLID arrowheads between two TEXT letters", "the letters on the view: TEXT letter + LEADER/LINE with arrowhead to the outline point", "block INSERT from a GB plugin for the between symbol"]
recognition = "锚点为框格上方或旁边、夹在两个大写字母之间的两端实心箭头短线（长约 2–3h）。成立还需：两个字母在视图上各出现一次，并各有一条带箭头的指引线指到轮廓上。尺寸线两端箭头抵在尺寸界线上、中间有数字；剖视名称 A-A 和公共基准 A-B 用的是连字符。"
confusions = ["带双箭头的尺寸线", "剖视/断面名称 A-A（连字符）与公共基准 A-B", "尺寸规范中的区间符号（同一字形，写在尺寸后，DC-G4-116）"]
related = ["DC-G5-092", "DC-G5-037", "DC-G5-104", "DC-G5-098", "DC-G4-116", "DC-G5-090"]
priority = "low"
text_forms = ["J↔K", "2× J↔K", "A↔B"]
knowledge_units = ["K23", "K24", "K25"]
