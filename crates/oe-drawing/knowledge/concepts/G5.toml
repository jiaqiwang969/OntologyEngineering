recognition = "以框格右侧紧贴的两格小框为锚：左侧有一条短线向左伸出、末端为实心箭头（含箭头长约 H），第一格为方向符号或跳动箭头笔画，第二格为字母。区别于指引线：指引线从框格引出到被测要素，箭头落在轮廓上；本箭头紧贴辅助框、很短、指向框格本身方向。"
