[[concepts]]
id = "DC-G4-017"
name = "尺寸数字"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "尺寸数字给出机件的真实大小，是最后完工尺寸，以毫米为单位时不注单位；线性尺寸数字写在尺寸线上方或中断处，按规定方向书写，不得被任何图线穿过。"
components = ["位置：线性尺寸数字一般写在尺寸线上方，也允许写在尺寸线中断处", "方向（方法1）：水平尺寸字头朝上，竖直尺寸字头朝左，倾斜尺寸保持向上趋势；尽量避免在规定的30°范围内注尺寸，无法避免时引出或改写", "方向（方法2）：非水平尺寸的数字可水平写在尺寸线中断处；同一图样尽量统一一种方法", "内容：可带前缀符号（Ø、R、S、□、t、C、n×）和后缀公差；角度数字一律水平", "字体：按 GB/T 14691/14665 的字体，常用字高3.5mm或5mm"]
variants = []
dxf_forms = ["DIMENSION text: code 1 '<>' (measured) or override string; text middle point code 11; MTEXT inside the *D block", "exploded: TEXT (rotation code 50 aligned with the dimension line, alignment codes 72/73) or MTEXT on layer 08 / 11 or template dimension layer", "text style on gbenor.shx / gbeitc.shx + gbcbig.shx, height 3.5 or 5 mm × plot scale, width factor about 0.7", "special codes %%c, %%d, %%p, %%u and MTEXT \\S stacking for deviations"]
recognition = "锚点为可解析成数值（可带前后缀符号与公差）的 TEXT/MTEXT/DIMENSION 文字。位置关系：文字基线平行于某条尺寸线、距离约0.2h~0.5h（上方），或文字中心落在尺寸线断口中；旋转角等于尺寸线方向（方法1）或为0（方法2、角度）。DIMENSION 实体可比较覆盖文字与组码42实测值×比例，不符说明是覆盖值或图形未按比例。与零件序号区分：序号字号更大、带圆圈或下划线并接圆点指引线；与极限偏差区分：偏差是小一号字、叠写在数字右侧；与参考尺寸区分：外加括号。"
confusions = ["零件序号：字高大于尺寸数字，带圆圈或下划线和圆点指引线", "极限偏差或公差值：小一号字，上下叠写在尺寸数字右侧", "参考尺寸：数字外加圆括号", "技术要求、标题栏中的数字：不与尺寸线关联"]
related = ["DC-G4-101", "DC-G4-102", "DC-G4-001", "DC-G4-099", "DC-G4-009", "DC-G1-106", "DC-G1-108"]
priority = "high"
text_forms = ["58", "Ø30", "R15", "30°", "M30-6H"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "Text style names and height/width factors are GB-template practice in AutoCAD/GstarCAD, not from the sources."
