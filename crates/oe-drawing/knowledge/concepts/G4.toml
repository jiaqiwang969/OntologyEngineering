confusions = ["GG/GC 全局角度尺寸：同框不同字母", "LP 线性两点尺寸：用于线性尺寸", "无框LC字样：可能是其他缩写"]
related = ["DC-G4-152", "DC-G4-032", "DC-G4-106", "DC-G4-129", "DC-G4-130"]
