[[concepts]]
id = "DC-G4-155"
name = "配合锥度 TF 标注"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "配合锥度TF：模制件上一个特征的起模锥度取决于另一尺寸或特定分模位置时，在该面的起模斜度符号旁写TF代替具体角度，并须同时用SMI给出最大允许表面错移。"
components = ["起模斜度符号：直角三角形的倾斜符号，置于指引线基准线上", "TF：写在倾斜符号之后，代替角度值", "指引线：箭头指向需配合起模的表面", "必须配套：同图分模面处注出 SMI 及数值"]
variants = ["inclined parting surface", "stepped parting surface", "depending on draft position"]
dxf_forms = ["LEADER/MULTILEADER or LINE + SOLID arrow to the surface, reference LINE carrying a small triangle (INSERT or 3 LINEs) and TEXT 'TF'", "TEXT 'SMI%%p0.1' near a parting-line symbol elsewhere on the view"]
recognition = "锚点：指引线基准线上“直角三角形小符号+TF”的组合（同类符号后通常是角度如2°，此处为TF）。检验同一视图内存在分模面符号及SMI注写。与普通起模斜度区分：后者为具体角度；与锥度符号区分：锥度符号为等腰三角形并配比值1:n。"
confusions = ["普通起模斜度注法（符号+角度）", "锥度符号 ▷ 配比值", "斜度符号 ∠ 配比值"]
related = ["DC-G4-149", "DC-G4-056", "DC-G4-134", "DC-G3-061", "DC-G7-046"]
priority = "rare"
text_forms = ["TF", "SMI±0.1"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
