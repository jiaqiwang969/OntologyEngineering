[[concepts]]
id = "DC-G6-008"
name = "F-操作拟合方法与拟合元素符号"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "ISO 21920-1草案中，在规范行内用拟合方法字母（LS最小二乘、TLS总体最小二乘）紧接拟合元素字母（L线、C圆、Pn为n阶多项式）表示从轮廓去除形状的F-操作，必要时后接嵌套指数，如LSC 25表示去除半径25 mm的圆。"
components = ["拟合方法：LS（最小二乘）、TLS（总体最小二乘，缺省时不写）。", "拟合元素：L线、C圆、Pn多项式；元素字母紧接方法字母，不留空格（LSL、LSC、LSP2）。", "嵌套指数：部分F-操作有，空格后写数值（mm），如LSC 25；有些F-操作没有嵌套指数。", "在完整标注中位于评定长度括号之后、第二个斜线之前，如…(15) LSC 25 / EP OR(1)。", "区域法（GB/T 33523.1表E.3）用非滤波关联符号：G全局最小二乘（缺省不写）、P2二阶多项式、P32等；滤波器也可作F运算符（如RS 8）。"]
variants = ["ISO 21920-1 draft 7.14, 7.15, 附录C", "GB/T 33523.1 F-operator symbols (G global least squares, P2, P32 ...) 表E.3"]
dxf_forms = ["token inside the one-line specification TEXT/MTEXT under the bar: '… (15) LSC 25 / EP OR(1)'", "areal: F-operator after the hyphen of the S-F segment, e.g. 'S-F 0.008-RG2.5/'", "decimal comma ('0,6') may appear in draft-style drawings"]
recognition = "词法：(T?LS)(L|C|P\\d+)，可后接空格和数值；必须位于规范行中滤波段之后、第二个“/”之前。只有在草案语境下（规范行很长，并含T16%、Tmed、RG、EP、OR(n)等）才考虑。这类写法来自草案和区域法标准，普通国内零件图上罕见，匹配后应与整行其余元素一起验证。区分纹理符号C、P（独立字母，位于纹理位置）以及螺纹或材料代号。"
confusions = ["纹理符号C：独立字母，位于纹理位置", "纹理符号P与多项式Pn：Pn紧跟LS且带阶数", "螺纹或材料代号：不在符号规范行中"]
related = ["DC-G6-059", "DC-G6-048", "DC-G6-020", "DC-G6-039", "DC-G6-041", "DC-G6-057"]
priority = "rare"
text_forms = ["LSC 25", "LSP2", "LSL", "P2（区域法）"]
knowledge_units = ["K31", "K32"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "ISO 21920-1 is a Chinese draft, not final."
