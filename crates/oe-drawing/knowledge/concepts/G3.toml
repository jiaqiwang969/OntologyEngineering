[[concepts]]
id = "DC-G3-044"
name = "紧定螺钉连接画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "紧定螺钉拧入轮毂的螺孔，其90°锥端顶入轴上预制的90°锥坑，用来固定轴上零件的周向或轴向位置。"
components = ["轮毂上有径向螺孔，紧定螺钉旋入其中，按螺纹旋合画法（旋合部分按外螺纹画）。", "轴上对应位置有90°锥坑，螺钉锥端与锥坑贴合，接触面画一条线。", "剖切平面通过螺钉轴线时螺钉按不剖处理；轴常作局部剖以显示锥坑。"]
variants = []
dxf_forms = ["set-screw outline (thick LINEs) with a 90° V tip; cone recess on the shaft as two LINEs at 45° to the screw axis", "local section on the shaft bounded by a wavy SPLINE (layer 02) with HATCH ANSI31; hub HATCH in opposite direction", "possibly INSERT of a standard-part block (CAXA/ACM library), exploded or not", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为一个短螺钉（长度约1.5–3倍直径），其轴线垂直于轴的轴线并穿过轴心，末端为90°尖锥，锥尖伸入轴表面下的90°V形凹坑。周围轮毂有螺纹旋合画法（粗、细线对齐）。与螺钉连接区分：连接螺钉有头部，穿过光孔把两零件压紧；与销连接区分：销两端无螺纹、穿通两零件。"
confusions = ["螺钉连接：有螺钉头和通孔，起连接压紧作用。", "销连接：无螺纹，常配“配作”注语。", "不穿通螺孔的120°钻尖：锥角120°，是孔底而非与另一零件的贴合面。"]
