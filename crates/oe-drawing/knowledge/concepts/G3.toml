aliases = ["剖切平面前结构的假想轮廓"]
group = "G3"
kind = "conventional_representation"
meaning = "剖视图中，位于剖切平面之前（即被假想移去部分）的结构如仍需表示，可用细双点画线假想地画在剖视图上。"
