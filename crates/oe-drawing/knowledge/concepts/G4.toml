[[concepts]]
id = "DC-G4-050"
name = "正方形符号 □"
aliases = ["正方形符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "正方形符号用于剖面为正方形的结构：在边长数字前加注“□”（如□14），或写成“B×B”（如14×14，B为对边距离）；可与公差带代号连写（如□25f5）。"
components = ["符号：边长等于字高h的细实线正方形，线宽h/10，位于边长数字左侧。", "注法：在一个视图上注“□边长”，免注两个边长或免画第二视图。", "替代写法：B×B，如14×14。", "常与平面符号（两条交叉细实线对角线）同时出现，表示该处为平面（方头）。", "可带公差：如□25f5（GB/T 16675.2表2 5.12）。"]
variants = ["□ before side length", "B×B form", "□ with tolerance class, e.g. □25f5 (16675.2 5.12)", "□14", "14×14"]
dxf_forms = ["DIMENSION with override text '{\\Fgdt;o}<>' (gdt.shx 'o' = square) or '\\U+25A1<>'", "TEXT/MTEXT '□14' using a font glyph (U+25A1) or the Chinese character '口' typed as a substitute", "exploded: small closed LWPOLYLINE or 4 LINE square (side ≈ h) before a TEXT number", "layer 08 or template dimension layer"]
recognition = "锚点为尺寸文字，数字左侧紧邻一个边长≈h的小正方形（四条细线、闭合多段线，或字符□、口、gdt字符o），正方形不包围数字。被注几何为两条平行轮廓线（方截面对边），同一区域常见两条交叉细实线（平面符号）。或者文字为两个相等数字以×相连（14×14）。排除：TED框包围整个数字；基准符号方框内为字母；汉字“口”可能是OCR结果，需结合尺寸线判断。"
confusions = ["理论正确尺寸框：矩形框包围整个数字，而非位于数字前。", "基准要素方框、基准目标框：框内为字母或编号，并连三角形或分格圆。", "n×重复注法：×前为数量；只有B×B两数相等且对应方截面时才表示正方形。", "平面符号：两条交叉细实线，是图形符号而非尺寸符号。", "OCR把□识为“口”。"]
related = ["DC-G4-029", "DC-G4-077", "DC-G3-026", "DC-G3-172", "DC-G4-114"]
