[[concepts]]
id = "DC-G3-048"
name = "蜗杆画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "蜗杆按圆柱齿轮的规定画法绘制（齿顶线粗实线、分度线细点画线、齿根线细实线或省略），其轴向齿形用局部剖视或局部放大图表示。"
components = ["平行轴线的视图：齿顶线粗实线，分度线细点画线，齿根线细实线或省略；蜗杆螺旋部分长度一般为直径的数倍。", "用局部剖视画出几个轴向齿廓（梯形），剖视中齿根线为粗实线；也可用局部放大图画出齿形并注尺寸。", "通常只画一个主视图，配蜗杆参数表（模数、头数、导程角、旋向等）。"]
variants = ["局部剖视画出齿形", "局部放大图"]
dxf_forms = ["thick LINE pair (tip), CENTER-linetype LINE pair (pitch, off-axis), thin LINE pair (root) along the worm section of a shaft", "broken-out section: wavy SPLINE boundary (layer 02) + trapezoidal tooth LWPOLYLINEs + HATCH ANSI31 on the core only", "parameter table as LINE grid + TEXT, or TABLE/INSERT block near the title block", "layer per GB/T 14665 表6 (01 粗实线, 02 细实线, 04 细虚线, 05 细点画线, 07 细双点画线, 08 尺寸, 10 剖面符号, 11 文本); real files often use named layers (粗实线/细实线/中心线/虚线/剖面线/尺寸线 or CAXA 0层/中心线层/虚线层/细实线层/剖面线层)"]
recognition = "锚点为轴上一段（长度通常为直径的2–5倍）同时具有粗实线顶线、偏离轴线的点画线分度线和细实线根线的区段；局部剖视中可见梯形齿廓（齿形角约20°），图上有蜗杆参数表（含“头数”“导程角”或z1）。与梯形螺纹区分：梯形螺纹没有分度点画线，按螺纹画法只画大径粗线、小径细线，并注Tr标记；与齿轮轴区分：齿轮段短、端视图画齿顶圆与分度圆，参数表为齿轮参数。"
confusions = ["梯形螺纹：无分度点画线，注Tr…标记。", "齿轮轴：齿宽段短，参数表为齿数、模数而无头数/导程角。"]
