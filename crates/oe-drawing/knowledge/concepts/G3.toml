id = "DC-G3-021"
name = "圆柱齿轮啮合画法（端视图）"
aliases = ["圆柱齿轮啮合画法"]
group = "G3"
kind = "conventional_representation"
meaning = "在垂直于齿轮轴线的视图中，两齿轮分度圆（细点画线）相切，啮合区内两个齿顶圆都画粗实线；省略画法时啮合区内的齿顶圆可不画。"
components = ["两组同心圆：各自的粗实线齿顶圆、细点画线分度圆、细实线齿根圆（可省略）。", "两分度圆相切于连心线上，中心距等于两分度圆半径之和。", "啮合区：两齿顶圆在连心线附近交叠，规定画法中交叠部分均画粗实线；省略画法中交叠区内的齿顶圆弧断开不画。", "配合的非圆视图为剖视或外形视图。"]
variants = ["啮合区齿顶圆均画粗实线", "省略画法：啮合区齿顶圆不画", "规定画法", "省略画法", "外形视图（直齿/斜齿）"]
