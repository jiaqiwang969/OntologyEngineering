[[concepts]]
id = "DC-G3-081"
name = "管螺纹标记标注"
aliases = ["管螺纹标记"]
group = "G3"
kind = "dimension_element"
meaning = "管螺纹（55°非密封G、55°密封R1/R2/Rc/Rp及60°圆锥管螺纹等）的标记一律注在引出线上，引出线从螺纹大径处或对称中心处引出，不注在尺寸线上；标记中的尺寸代号是英寸制代号而非直径毫米值。"
components = ["指引线：一端指在螺纹大径线上，或从对称中心（轴线）处引出。", "基准线（水平细实线）上写标记：特征代号+尺寸代号（分数或带分数）+公差等级（G外螺纹A/B级）+旋向（左旋LH）。", "55°非密封：外螺纹如G1/2A，内螺纹如G1/2；55°密封：圆锥内螺纹Rc、圆柱内螺纹Rp，与Rp配合的圆锥外螺纹R1，与Rc配合的圆锥外螺纹R2。", "配合副在装配图中可写成Rc/R2、Rp/R1等形式。"]
variants = ["引出线由大径处引出", "引出线由对称中心处引出", "G", "Rc", "Rp", "R1", "R2"]
dxf_forms = ["LEADER or MLEADER (or LINE + short horizontal LINE) on the leader layer (09) with TEXT/MTEXT on the landing, e.g. \"G1/2A\", \"Rc3/4\"", "Fractions as plain text \"1/2\", as stacked MTEXT (\\S1/2;), or as the Unicode characters ½ ¾ / mixed number \"1 1/2\"", "Occasionally a DIMENSION entity with override text \"G1/2\" — non-conforming but seen in practice", "Thread geometry nearby: thick crest LINEs + thin root LINEs (see DC-G3-024/DC-G3-005)"]
recognition = "锚点为文本正则：^(G|R1|R2|Rc|Rp|NPT)\\s?\\d*\\s?\\d/\\d{1,2}\\s?[AB]?(\\s?-?LH)?$ 或整数尺寸代号（G1、Rc2）；文本必须位于指引线基准线上，指引线端点落在螺纹大径线或轴线上，附近存在螺纹粗细线对。不能把1/2、3/4解释为毫米直径（G1/2的大径约20.96 mm）。R1、R2管螺纹与半径R1、R2区分：管螺纹后跟英寸分数且指向螺纹段，半径后跟数值并指向圆弧；与表面粗糙度区分：Ra/Rz写在粗糙度符号上。与普通螺纹区分：普通螺纹以M开头，可直接注在大径尺寸线上。"
confusions = ["米制螺纹标记（M20×1.5）：可直接注在大径尺寸线上，数值为毫米。", "把英寸尺寸代号当直径：尺寸代号只是名义规格，不等于任何直径。", "半径R1、R2：指向圆弧，无螺纹线。", "表面粗糙度Ra/Rz：写在粗糙度符号上，不在引出线基准线上。"]
related = ["DC-G3-087", "DC-G3-082", "DC-G3-088", "DC-G3-215", "DC-G3-216", "DC-G3-217", "DC-G3-023", "DC-G1-028", "DC-G1-018"]
priority = "medium"
text_forms = ["G1/2A", "G3/4", "G1/2A-LH", "Rc1/2", "Rp3/4", "R2 3/4", "R1 1/2", "Rc/R2 3/4", "NPT 1/2"]
