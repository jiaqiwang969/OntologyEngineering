[[concepts]]
id = "DC-G4-111"
name = "体积直径修饰符 CV"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "CV为体积直径修饰符：尺寸取与实际要素体积相等的理想圆柱的直径（计算尺寸），写在公差之后并画在长圆框内。"
components = ["符号：大写字母CV，外加长圆形（跑道形）框，框宽约25d、高约16d，字高10d", "位置：写在公差值、公差代号或极限值之后，按修饰符顺序排列", "可与 /长度 连用表示部分要素的体积直径（如 CV/20）"]
variants = []
dxf_forms = ["TEXT 'CV' with a closed LWPOLYLINE stadium frame (two lines + two bulged arcs) placed after the tolerance", "INSERT of a modifier block with the frame and letters", "MTEXT where the frame is missing and only 'CV' remains"]
recognition = "锚点：紧随尺寸公差的带长圆框的两字母“CV”。框高约1.6倍字高、宽高比约1.5。与CC、CA区分：第二个字母不同；与普通文字CV（如型号）区分：无框且不紧随公差。"
confusions = ["CC 周长直径", "CA 面积直径", "产品型号或代号中的CV字样"]
related = ["DC-G4-120", "DC-G4-157", "DC-G4-100", "DC-G4-110"]
priority = "rare"
text_forms = ["Ø20±0.1 CV", "CV/20"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 38762.1-2020 表1 and the size-characteristic table; frame proportions from 附录A 图A.1. Text examples illustrative. DXF forms are general practice."
