[[concepts]]
id = "DC-G1-003"
name = "不连续同一表面连线"
aliases = []
group = "G1"
kind = "line"
meaning = "用细实线把被其他结构隔断、但实际属于同一几何表面的几段轮廓连接起来，说明它们是同一个面，便于只注一次尺寸或表面要求。"
components = ["细实线（No.01.1.17）。", "连线跨过中间的槽、缺口等结构，与两侧轮廓共线，或沿同一圆弧、曲面延伸。", "常与该表面只注一次的表面结构要求或尺寸配合使用。"]
variants = []
dxf_forms = ["LINE/ARC/CIRCLE/LWPOLYLINE with linetype CONTINUOUS and lineweight 25 or 35 (or ByLayer) on a thin layer: GB/T 14665 layer 02, names such as 细实线/THIN; colour green (ACI 3)", "a single thin LINE/ARC collinear with two thick outline pieces and bridging the gap between them", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：一条细实线，两端与两段共线（或同圆心同半径）的粗实线轮廓端点重合或很接近，中间跨越被其他轮廓占据的区域。判据：方向与两段粗线一致、无终端符号；其上或附近有一次性注出的表面结构符号或尺寸。与辅助线区分：辅助线是为求理论交点而延长，终点落在交点而不是另一段轮廓上。"
confusions = ["可见轮廓线：粗实线，是实体真实边界。", "辅助线：细实线延长到理论交点，供引出尺寸界线。", "尺寸界线：从轮廓引出、与尺寸线垂直并超出约2 mm。"]
related = ["DC-G1-043", "DC-G1-053", "DC-G6-034", "DC-G4-079"]
priority = "low"
