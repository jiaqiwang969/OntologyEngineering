[[concepts]]
id = "DC-G2-076"
name = "局部视图"
aliases = []
group = "G2"
kind = "view"
meaning = "将机件某一部分向基本投影面投射所得的视图；断裂边界用波浪线或双折线，所示结构外轮廓封闭时不画断裂线；可按基本视图配置（中间无隔开时不标注）、按向视图配置（注字母和箭头），或在第一角图样中按第三角画法配置。"
components = ["局部图形：只画需要表达的部分。", "断裂边界：细实线波浪线或双折线（双折线两端超出轮廓少许，波浪线只画在实体上）；外轮廓封闭时省略。", "标注：上方字母并在相应视图上画箭头注同字母；按基本视图配置且无隔开时不注。", "第三角配置：画在结构附近，用细点画线相连。"]
variants = ["in basic-view position (no label)", "laid out as a direction view (letter above + lettered arrow)", "closed outline, no break line", "按基本视图配置", "按向视图配置", "按第三角画法配置"]
dxf_forms = ["Small view cluster (layer 01) bounded on its open side by a thin SPLINE/zigzag LWPOLYLINE (layer 02), no HATCH", "Label TEXT single letter and arrow (LEADER/SOLID) when laid out as a direction view"]
recognition = "以不完整的视图簇为锚点：轮廓在一侧以细波浪线或双折线截止，或整簇是一个封闭小结构；区域内没有剖面线；与其他视图对齐（基本视图配置）或带单字母名称。断裂线一侧有剖面线的是局部剖视；比例不同且有罗马数字的是局部放大图；成对断裂线夹空隙的是断开画法。"
confusions = ["局部剖视图：有剖面线。", "断开画法：成对断裂线。", "局部放大图：比例不同。", "斜视图：投射方向倾斜。"]
related = ["DC-G2-072", "DC-G2-078", "DC-G2-080", "DC-G2-023", "DC-G2-041", "DC-G2-075", "DC-G1-029"]
