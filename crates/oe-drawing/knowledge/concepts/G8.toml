[[concepts]]
id = "DC-G8-020"
name = "装配图中仅画外形或简化轮廓"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "已在一个视图中表达清楚的产品组成部分（如电动机、外购部件），在其他视图中可只画外形轮廓；在能清楚表达产品特征和装配关系的条件下，整个装配图也可只画出简化后的轮廓。"
components = ["已表达清楚的组成部分在其他视图中只画外轮廓（粗实线），无内部线、剖面线和细节。", "简化轮廓用较少的直线和圆弧概括外形，省去小台阶、圆角、紧固件等。", "其余部分仍按正常画法，与该外形轮廓相接。"]
variants = ["component outline only (5.23)", "simplified overall contour (5.24)"]
dxf_forms = ["closed LWPOLYLINE or a few LINE/ARC outlines on layer 01 with no internal entities or HATCH", "purchased units sometimes as an INSERT of a simplified outline block"]
recognition = "在装配图某视图中，若某区域只是一个简单的闭合轮廓（顶点少，内部除中心线外没有其他图元，无剖面线），而同一组成部分在另一视图中有详细结构（可用明细栏同一序号在两个视图中出现来确认），判为仅画外形。与相邻辅助零件的区别：外形轮廓是粗实线且属于本产品（有序号），相邻件是细双点画线且没有序号。"
confusions = ["未画完的图：未画完的轮廓常不闭合，或在其他视图找不到对应。", "相邻辅助零件：细双点画线，不属于本产品。", "局部视图：有波浪线边界和视图名称。"]
related = ["DC-G8-023", "DC-G3-038", "DC-G1-036"]
