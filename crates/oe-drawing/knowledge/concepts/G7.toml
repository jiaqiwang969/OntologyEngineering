[[concepts]]
id = "DC-G7-029"
name = "焊缝统一技术要求说明"
aliases = []
group = "G7"
kind = "note"
meaning = "在技术要求或其他技术文件中对全图焊缝作统一说明的文字，如“全部焊缝采用……焊”（此时焊缝符号尾部可省略焊接方法代号）、“除图样中注明的焊接方法外，其余焊缝均采用……焊”，或“全部焊缝为”后接一个焊缝符号。"
components = ["统一方法句：全部焊缝采用（均采用）……焊。", "例外句：除图样中注明的焊接方法外，其余焊缝均采用……焊。", "符号统一句：全部（部分）焊缝为＋一个焊缝符号（含焊脚等尺寸），剩余焊缝仍须在图中标注。"]
variants = ["全部焊缝采用…焊", "除图样中注明的焊接方法外，其余焊缝均采用…焊", "全部焊缝为 + symbol"]
dxf_forms = ["TEXT/MTEXT line in the technical-requirement block", "TEXT followed by a small weld-symbol INSERT or exploded strokes placed inline after '全部焊缝为'"]
recognition = "在技术要求中匹配“全部焊缝|焊缝均采用|其余焊缝”句式；若句末紧跟一个无箭头线的小型焊缝符号图形（三角、V等），把该符号视为对全图焊缝的统一要求。识别到“全部焊缝采用X焊”后，可把图中尾部无方法代号的焊缝视为X焊。"
confusions = ["一般焊接技术要求（检验、修整等）：不规定统一方法或统一焊缝。"]
related = ["DC-G7-028", "DC-G7-116", "DC-G7-117", "DC-G7-135", "DC-G9-002"]
priority = "medium"
