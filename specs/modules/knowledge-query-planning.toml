[[constraints]]
id="local_pdf_explicit_incremental_registration"
requirement="req_knowledge"
module="knowledge"
check="register"
rust_path="crates/oe-knowledge/src/registration.rs"
statement="Create and replace retain previous full-catalog semantics; explicit merge upserts supplied stable IDs and retains omitted sources. Merge and replace conflict. In merge, reuse native text only for the same source ID, resolved original path and SHA256 after verifying current original bytes and prior registration/index bindings. Changed title, edition description or chapter navigation remains updated and rebuilds page navigation and FTS from verified old native text, preserving the original extraction observations. Verify old rows against old declarations before constructing new rows; validate new chapter bounds against the verified old page count, including preview. New IDs, changed path or SHA256 and replace require extraction. A fully reusable plan is not unchanged when declarations changed. Rebuild fresh owned SQLite tables with bounded rows; no arbitrary previous SQLite write triggers. No-op verifies current inputs and leaves index bytes unchanged. Dry-run returns differences without native extraction or publication, and never authorizes a later apply. Existing source/page/chapter/text budgets apply to the merged whole. Before publishing, recheck original manifests, source bytes and the exact previous snapshot; errors and races preserve previous files."
severity="error"

[[constraints]]
id="source_delivery_precise_paths_and_guard"
requirement="req_knowledge"
module="knowledge"
check="register_with_options"
rust_path="crates/oe-knowledge/src/source_library.rs"
statement="Full nested source paths distinguish equal filenames; verified destinations and independent fetch IDs need no basename uniqueness. Preflight actual selected local import paths and reject shared flat fallback before any publication. Original delivery manifest bytes are checked again inside registration before final publication, including replacement rollback. Source delivery selection with merge keeps other registered books; preview/unchanged are explicit statuses. No implicit network, OCR, adoption or source role extension."
severity="error"

[[constraints]]
id="supplier_default_index_matches_reader"
requirement="req_knowledge"
module="cli"
check="knowledge_execute"
rust_path="crates/oe-cli/src/main.rs"
statement="Default build-index writes sources/.indexes/misumi, same as the supplier reader and Rust BuildOptions. Explicit custom targets retain meaning. Legacy misumi-native is never silently selected, moved or overwritten."
severity="error"

