[[concepts]]
id = "DC-G2-012"
name = "模型投影工程图"
aliases = []
group = "G2"
kind = "other"
meaning = "由三维模型投影生成并与模型保持关联的工程图：视图全部来自模型投影，图幅、图框、标题栏、字体、线型和比例由工程图模板统一，尺寸、表面结构、焊接符号等标注锚定在视图对象上。"
components = ["工程图模板：预设图幅、图框、标题栏（属性取自模型参数）、字体字高、线型线宽和比例。", "投影视图：基本视图、剖视、局部放大、轴测图等由模型生成，尽量不用虚线。", "关联标注：尺寸、表面结构、焊接符号定位在视图几何上，模型修改时随之更新。", "例外：只有示意图、原理图允许在工程图环境中直接绘制。", "同一零部件的多页图样推荐放在一个文件中；仅用工程图定义时图样须完整。"]
variants = ["single-file multi-sheet drawing", "drawing as sole definition (must be complete)"]
dxf_forms = ["Each view exported as a block INSERT (or a group) per view; layers named by view or by line type", "Silhouette curves as SPLINE or many short LINE/ARC segments; circles at angles as ELLIPSE", "DIMENSION entities with override text, associativity lost after export; GD&T and surface symbols as INSERT or exploded LINE+TEXT", "Title block as INSERT with ATTRIB values filled from model properties"]
recognition = "这是图纸来源特征而非局部符号。线索：视图封装为块或有视图名、曲线大量为SPLINE或细分折线、视图间投影对齐精确到多位小数、标题栏为带属性的块、轴测图与正交视图共存且几乎无虚线。只用于调整其他识别（例如接受SPLINE轮廓、以覆盖文字为准），不能单凭它判定工程含义。"
confusions = ["手工二维绘制的图：图层随意，曲线多为ARC/LINE，常有手工修补。", "三维标注模型（MBD）：标注在三维模型上，本身没有二维视图。"]
