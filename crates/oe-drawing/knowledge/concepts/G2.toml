[[concepts]]
id = "DC-G2-028"
name = "移出断面图"
aliases = []
group = "G2"
kind = "section"
meaning = "画在视图之外的断面图：只画剖切面与机件接触部分的形状，轮廓用粗实线并画剖面符号；通常配置在剖切线或剖切符号的延长线上，也可配置在其他适当位置并标注名称。"
components = ["断面图形：粗实线闭合轮廓加剖面线，不画剖切面后的结构（孔、坑或分离断面例外）。", "配置：剖切线（细点画线）延长线上；按投影关系；视图中断处；其他位置（可旋转，加旋转符号）。", "标注：“X—X”名称与剖切符号、字母；按对称性和配置位置可省字母、箭头或全部省略。", "相交平面剖得的移出断面中间断开。", "术语：1984年版标准称“移出剖面”“剖面图”，2002年版起称“断面图”。"]
variants = ["on cutting-line extension", "elsewhere with name X—X", "in projection relation", "old term 移出剖面 (1984 editions, e.g. GB/T 4457.5-1984 剖面图)", "配置在剖切线延长线上", "画在视图中断处", "按投影关系配置", "旋转配置", "相交平面剖得（中间断开）"]
dxf_forms = ["Small isolated closed outline (LINE/ARC/CIRCLE on layer 01) filled by HATCH (layer 10), outside the main view's bounding box", "Dash-dot cutting LINE (layer 05) across the view extended toward the section centre, or thick cutting strokes with arrows", "Label TEXT 'A-A' above, or none per the omission rules"]
recognition = "以视图外的小型闭合剖面区域为锚点（面积远小于主视图、孤立、整片带剖面线）：检查其中心是否落在穿过主视图的细点画线剖切线或剖切符号连线的延长线上，或附近有“X—X”名称；轴类常见为带键槽缺口的圆。画在视图内且轮廓为细实线的是重合断面；带罗马数字和比例的是局部放大图。"
confusions = ["重合断面：画在视图内，细实线轮廓。", "全剖视图：含剖切面后的轮廓。", "局部放大图：有罗马数字和比例。", "剖视图：显示剖切面后的可见轮廓。"]
