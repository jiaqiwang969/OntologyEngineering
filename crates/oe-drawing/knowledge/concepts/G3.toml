recognition = "锚点为文字正则 (\\bM\\d+(\\.\\d+)?([×xX]\\d+(\\.\\d+)?)?\\s+)?\\bINS\\b，INS须为独立大写词；引线终点在螺孔（3/4细圆或孔内螺纹线）处。与螺纹标记后缀区分：INS与螺纹代号之间有空格，且不在“-”之后。"
