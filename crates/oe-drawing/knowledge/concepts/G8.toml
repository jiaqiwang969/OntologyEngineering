[[concepts]]
id = "DC-G8-013"
name = "装配图的组成"
aliases = []
group = "G8"
kind = "other"
meaning = "装配图（总装配图或部件装配图）由一组视图、必要的尺寸、技术要求、零部件序号、明细栏和标题栏组成，用来表达机器或部件的工作原理、装配关系、主要零件的结构形状和装配检验要求。"
components = ["一组视图：主视图常沿主要装配干线全剖，另配其他视图、局部剖视和拆卸画法等。", "必要的尺寸：性能（规格）尺寸、装配尺寸（配合代号如Ø50H11/h11）、安装尺寸、外形尺寸和其他重要尺寸，不注全部零件尺寸。", "技术要求：装配、安装、调试、检验、使用方面的文字或符号说明。", "零部件序号和明细栏：每种零件一个序号，与明细栏的行对应，明细栏在标题栏上方。", "标题栏：部件名称、图号（教材例中以00结尾）、比例和签名等，材料栏一般不填。"]
variants = []
dxf_forms = ["composite of entities: view geometry (layers 01/02/05/10), DIMENSION entities with fit texts such as '%%c50H11/h11', 技术要求 MTEXT, balloon leaders, parts-list and title-block grids or INSERTs"]
recognition = "判定一张图是装配图：标题栏正上方有与之同宽、表头含“序号、代号、名称、数量”的明细栏；视图中有带圆点指引线的整数序号，且序号集合与明细栏一致；尺寸中出现孔轴配合代号（用“/”分隔的两个公差带，如H7/g6）；剖视中有多个方向不同的剖面线区域。满足其中两项即可判为装配图，否则按零件图的组成检查。"
confusions = ["零件图的组成：没有明细栏和序号，尺寸完整，标题栏材料栏填有牌号。", "焊接件图：也有明细栏，但表示一个焊接件的组成，有焊缝符号。", "表格图或系列零件图：有参数表但没有零件序号。"]
related = ["DC-G9-014", "DC-G8-024", "DC-G8-025", "DC-G9-028", "DC-G8-011", "DC-G4-150"]
priority = "medium"
text_forms = ["%%c50H11/h11", "M36×2-6g"]
