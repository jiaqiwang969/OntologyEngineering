[[concepts]]
id = "DC-G7-135"
name = "焊缝符号"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "焊缝符号：在图样上表示焊缝或接头要求的组合标注，由指引线（箭头线加实线和虚线组成的基准线）、基本符号以及必要时的补充符号、尺寸和尾部信息组成；为简化，图上通常只标基本符号和指引线，其余内容在焊接工艺规程等文件中给出。"
components = ["指引线：箭头线（箭头指向接头）＋基准线（细实线及平行细虚线）。", "基本符号：表示焊缝截面形式，立在基准线上。", "补充符号：表面形状、衬垫、三面、周围、现场、尾部、交错断续等。", "尺寸数据：按左横向、右纵向、上下角度间隙的规则排列。", "尾部：焊接方法、数量等附加信息。", "比例：按GB/T 12212，与同图尺寸、表面结构、几何公差符号线宽和字高一致。"]
variants = ["simplified form: basic symbol + leader only", "full form: basic + supplementary symbols + sizes + tail", "graphical weld drawing combined with the symbol"]
dxf_forms = ["INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes", "AutoCAD Mechanical / GstarCAD Mechanical weld-symbol object saved in DXF as ACAD_PROXY_ENTITY; only its proxy graphics (lines, arcs, text) are readable without the vendor enabler", "exploded group: LEADER/LINE+SOLID arrow, reference LINE pair, symbol strokes (LINE/ARC/CIRCLE/LWPOLYLINE), TEXT for sizes and tail, usually on one annotation layer", "MLEADER whose content is a weld-symbol block (newer AutoCAD templates)"]
recognition = "以带箭头斜线与一条细实线基准线的连接点为种子，收集基准线两侧约1.5h带内的所有笔画和文字，组成一个焊缝符号对象：(1) 识别基本符号和补充符号；(2) 按位置读尺寸；(3) 判断实线/虚线侧；(4) 读尾部。与表面结构、几何公差和普通注释引线区分：后者的基准线上是√形符号、矩形框格或说明文字，且无平行虚线。"
confusions = ["表面结构符号的引出标注：√形符号。", "几何公差框格的指引线：连矩形框格。", "普通注释引线：横线上为说明文字。", "零件序号指引线：末端圆点，横线上为序号数字。"]
related = ["DC-G7-136", "DC-G7-109", "DC-G7-141", "DC-G7-133", "DC-G7-137", "DC-G7-013", "DC-G7-117", "DC-G7-036", "DC-G7-035"]
priority = "high"
text_forms = ["5▷", "K▷n×l(e)", "111", "4条"]
knowledge_units = ["K43", "K40", "K41"]
