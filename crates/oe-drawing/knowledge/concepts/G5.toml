components = ["基准目标框：被水平直径分成两半的圆", "两条切线：分别与圆相切，在圆外交于一点，形成尖角", "中分线：沿尖角平分线的直线，可为框内分隔线的延长，也可是从圆周到尖点的短线；方向可水平、竖直或倾斜", "移动方向与其他要素的夹角可用角度 TED 标注；指引线方向与移动方向无关"]
