components = ["标记：在某一组要素上涂色（涂黑/填充）或加其他统一记号，另一组不加或用另一种记号", "字母：在各要素旁注写A、B、C等字母，相同字母表示同一组", "尺寸与数量：每组在图上注出一次，如 3×Ø8、2×Ø8 加各自偏差，或以字母说明各组尺寸"]
variants = ["colour/fill marks", "letter labels"]
