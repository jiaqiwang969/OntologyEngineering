[[concepts]]
id = "DC-G1-061"
name = "非连续线的相交与连接"
aliases = ["图线画法规则"]
group = "G1"
kind = "line"
meaning = "虚线、点画线等不连续线相交、连接或转弯时，应在画（长画、短画）处相交或相连，不应在间隔或点处；点线则应在点上相交。"
components = ["两条中心线在圆心处以长画相交；点画线、双点画线首末两端是长画。", "虚线与虚线、虚线与实线相交应在画上；虚线是粗实线的延长线时，粗实线画到分界点，虚线留间隙。", "虚线圆弧与虚线直线相切时，圆弧的画画到切点，直线一侧留间隙。", "平行线最小间隙0.7 mm；绘两条平行线时推荐第二条画在第一条的右下侧。"]
variants = []
dxf_forms = ["the rule is visible only after the linetype is rendered: DXF stores continuous geometry plus a linetype", "AutoCAD centres the pattern on each segment; LWPOLYLINE flag 128 (PLINEGEN) makes the pattern run continuously through vertices", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying"]
recognition = "DXF 中不连续线以连续几何加线型存储，相交规则只在渲染后体现，对几何识别影响小。对炸开的短线段，重组时应容忍交点落在间隔中，以共线和等周期为准，不因相交处无画而判为断开。可用作质量检查：圆心处无长画交点、端部为点等提示线型比例不当。"
confusions = ["图线断开或间隙造成的误判：间隙是线型的一部分，不是结构的断开。"]
related = ["DC-G1-044", "DC-G1-045", "DC-G1-042", "DC-G1-093", "DC-G1-033", "DC-G1-055"]
priority = "medium"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "DXF 渲染与 PLINEGEN 为通用 CAD 实践。"
