meaning = "在指引线与基准线的连接处画一个小圆（直径约为指引线宽的8倍），表示注释说明一次性适用于该零件相关联的所有侧表面或轮廓。"
components = ["小圆，直径约8倍指引线宽（线宽0.25 mm 时约2 mm），圆心在指引线与基准线的连接点。", "注释说明写在基准线上。", "不得使用的情况：可能引起误解时；涉及零件所有表面或转角时。"]
