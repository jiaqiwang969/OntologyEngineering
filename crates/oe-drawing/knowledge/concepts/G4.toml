[[concepts]]
id = "DC-G4-132"
name = "极限偏差注法（上下偏差叠写）"
aliases = ["极限偏差注法", "极限偏差数值标注"]
group = "G4"
kind = "tolerance_indication"
meaning = "极限偏差注法：上极限偏差注在公称尺寸的右上方，下极限偏差与公称尺寸注在同一底线上，两者字号比公称尺寸小一号，小数点对齐，非零偏差前加+或−号。"
components = ["公称尺寸：正常字高，含Ø等前缀", "上偏差：右上方，小一号字，带符号", "下偏差：与公称尺寸同一底线，小一号字，带符号", "对齐规则：上下小数点对齐，尾部0一般省略，为使位数相同可补0", "零偏差：只写0并与另一偏差个位对齐；绝对值相同改用±", "GPS两行规则：下行含公称值和下偏差（空格分隔），上行只含上偏差"]
variants = ["two-line stacked deviations", "GPS two-line rule: lower line carries nominal + lower deviation", "上下偏差", "对称偏差 ±", "单侧零偏差", "双向偏差（如 Ø30 +0.041/+0.020，即 Ø30F7）", "单向偏差，一侧为 0（如 Ø50 +0.039/0）", "零件图常用形式"]
dxf_forms = ["DIMENSION with DIMTOL=1, DIMTP/DIMTM in XDATA DSTYLE, DIMTFAC≈0.7 (CAD stacks the deviations automatically)", "MTEXT stacking in override text: '<>\\S+0.021^-0.008;' or '{\\H0.7x;\\S+0.021^-0.008;}'", "exploded: nominal TEXT plus two smaller TEXT entities (height ≈0.7h) at its right, upper one raised", "CAXA exports may keep deviations as separate TEXT entities or as MTEXT stacks"]
recognition = "锚点：公称尺寸文字右侧紧邻两段上下叠放的较小文字（字高约0.6–0.75h），上段基线高于下段，二者左端对齐、小数点对齐，至少一段带+或−（或为0）。MTEXT中表现为\\S上^下;。检验：上偏差≥下偏差。与极限尺寸两行写法区分：极限尺寸两行字高相同且都是完整尺寸；与上标注释或指数区分：注释上标通常单个、无符号；与配合代号分式区分：分式为字母+数字。"
confusions = ["极限尺寸（上、下极限尺寸两行）：字高相同、数值接近公称值", "公差带代号与偏差同注：代号后括号内偏差", "配合代号分式 H7/f6", "上标说明或指数文字", "尺寸链计算式的上下标"]
related = ["DC-G4-103", "DC-G4-126", "DC-G4-113", "DC-G4-133", "DC-G4-114", "DC-G1-108"]
priority = "high"
text_forms = ["Ø30 +0.041/+0.020", "Ø50 +0.039/0", "150 0/-0.2", "Ø18 +0.018/0", "%%c30{\\H0.7x;\\S+0.021^-0.008;}"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 4458.5-2003 4.1.2/4.1.4 图7, GB/T 38762.1-2020 6.1.2, textbook §9-5 图9-37c. Stacked deviations written upper/lower with '/'. DIMSTYLE variables and MTEXT stacking codes are general CAD practice."
