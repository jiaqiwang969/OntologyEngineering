[[concepts]]
id = "DC-G3-014"
name = "双头螺柱连接画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "被连接件之一较厚时采用双头螺柱：旋入端全部旋入厚件螺孔，紧固端穿过薄件通孔后套垫圈并用螺母拧紧；画法上半部像螺栓连接，下半部像螺钉连接。"
components = ["旋入端：长度bm按厚件材料取d（钢、青铜）、1.25d或1.5d（铸铁）、2d（铝）；其螺纹终止线与两零件结合面平齐，表示全部旋入。", "螺孔：螺纹深约bm+0.5d，钻孔再深约0.5d，底部120°锥顶；旋合段按外螺纹画。", "紧固端：螺纹长约2d，穿过约1.1d的通孔（孔壁与螺柱之间画两条线留间隙），伸出螺母约0.3d。", "垫圈与螺母：平垫圈或弹簧垫圈，六角螺母按比例画法；剖切面通过轴线时螺柱、垫圈、螺母按不剖绘制。", "相邻两零件的剖面线方向相反或间隔不同。"]
variants = []
dxf_forms = ["Exploded thick/thin LINEs: stud crest thick + root thin; the lower thread-end LINE coincides with the joint-face LINE", "Nut and washer as INSERTs of standard-part blocks (CAXA/GstarCAD Mechanical libraries) or exploded LINE/ARC with the hexagon chamfer arcs", "Two HATCH regions (ANSI31) at opposite angles (45°/135°) or different spacing for the clamped parts; the tapped part's hatch stops at the stud's crest lines inside the engagement", "Balloons and parts-list rows such as '螺柱 GB/T 898 M10×25', '螺母 GB/T 6170 M10', '垫圈 GB/T 93 10'"]
recognition = "锚点：一根两端都有螺纹（两段细实线牙底）的不剖杆件。下段螺纹落在有剖面线的厚件内，其终止线与两零件接触线重合；上段穿过薄件中间隔≈1.1d的两条孔壁线（与杆之间有间隙），其上依次是垫圈（矩形，厚约0.15–0.25d）和六角螺母（高约0.8d，带倒角弧）。区分：螺栓连接有螺栓头且两件均为通孔；螺钉连接无螺母，头部压在薄件上。"
confusions = ["螺栓连接：两件都是通孔，一端为螺栓头。", "螺钉连接：无螺母，螺钉头在上。", "单纯螺纹旋合画法。"]
related = ["DC-G3-053", "DC-G3-058", "DC-G3-056", "DC-G3-060", "DC-G3-027", "DC-G3-043", "DC-G3-002", "DC-G3-229", "DC-G8-003", "DC-G2-009"]
priority = "high"
text_forms = ["螺柱 GB/T 898 M10×25", "螺母 GB/T 6170 M10", "垫圈 GB/T 93 10", "垫圈 GB/T 97.1 10"]
knowledge_units = ["K15"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Proportions (1.1d hole, 2d thread, 0.3d protrusion, bm by material) are textbook proportional-drawing values. Washer and nut thickness ratios are general practice."
