[[concepts]]
id = "DC-G7-007"
name = "焊缝轴测图画法"
aliases = []
group = "G7"
kind = "conventional_representation"
meaning = "在轴测图上示意地画出焊缝（沿接缝的成排短线或焊道外形），用于直观说明接头形式与焊缝的空间位置。"
components = ["轴测投影的接头：板件按正等测或斜二测绘制。", "焊缝示意：在两板交线处画焊道外形线或成排短线；角焊缝位于T形接头内角，塞焊和槽焊在孔、槽处表示为填满。"]
