[[concepts]]
id = "DC-G3-072"
name = "键联结装配画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "装配图中轴与轮毂用键联结时，沿键长方向剖切的键按不剖画；键的底面和两侧面与槽接触画一条线，键顶面与轮毂槽底有间隙画两条线；轴上用局部剖视表示键槽。"
components = ["纵剖（沿轴线）：键为不剖的矩形，轴在键处作局部剖视（波浪线界定），轮毂全剖。", "横剖（垂直轴线）：键的矩形断面画剖面线，两侧与轴槽、轮毂槽侧壁接触为单线。", "键底与轴槽底接触画一条线；键顶与轮毂槽底不接触画两条线（间隙）。", "普通平键端部有圆头（A型）、平头（B型）、单圆头（C型）。"]
variants = []
dxf_forms = ["Thick LINE rectangle (key) inside the shaft outline: bottom edge coincident with the shaft slot bottom, top edge parallel to and a small gap below the hub slot bottom", "Thin SPLINE wavy line bounding the local section of the shaft around the key", "HATCH ANSI31 of shaft and hub in opposite directions; key unhatched in the longitudinal section, hatched in the cross section", "Designation TEXT in the parts list or by leader, e.g. GB/T 1096 键 8×7×28"]
recognition = "锚点为轴（点画线轴线两侧对称的粗实线）与轮毂（剖面线方向不同）之间的小矩形：其下边与轴局部剖视的槽底重合，上边与轮毂槽底之间有一条平行的近距线（间隙，约为键高的5%–15%），两侧边与槽壁重合。纵向视图中键内无剖面线，并伴有轴上的波浪线局部剖。与销连接区分：销跨越结合面且无间隙；与花键联结区分：花键是圆周均布的多齿；与零件图键槽区分：零件图只有槽和断面尺寸，无键。"
confusions = ["销连接：销与孔无间隙，横跨两零件结合面。", "花键联结：多齿沿圆周均布，按外花键画。", "零件图上的键槽：只有槽、断面图和深度尺寸（d−t1、d+t2）。", "半圆键、钩头型楔键：外形为半圆或带钩头。"]
