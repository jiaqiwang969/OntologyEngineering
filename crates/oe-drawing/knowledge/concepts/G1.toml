meaning = "图样上写在括号中的数值或表述只是资料性的，不属于规范或要求，例如参考尺寸“(50)”。"
components = ["圆括号括起的尺寸数字或说明，如“(50)”“(Ø30)”。", "不施加公差，不作为检验依据。", "一般尺寸规范不适用于参考尺寸（GB/T 45683 规则）。"]
