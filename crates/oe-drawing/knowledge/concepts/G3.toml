[[concepts]]
id = "DC-G3-154"
name = "原动机符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图或传动系统图中表示动力来源（原动机、电动机）的符号；只见于 1984 版附录 A，2013 版表中未收录。"
components = ["通用符号（不指明类型）：侧视为矩形机身，一端伸出粗轴线（轴伸）；端视为上半圆、下部平直的拱形轮廓，内有十字中心线。", "电动机一般符号：侧视为矩形机身两端各加半圆形端盖，一端伸出粗轴线；端视为带十字中心线的圆，外加一对斜向弧形外廓。", "装在支架上的电动机：在电动机符号下方加水平双线表示底座，端视圆下加小三角形支座及底线。", "原动机符号通常位于传动链起点，其出轴连接联轴器、带轮或齿轮。"]
variants = ["通用符号（不指明类型）", "电动机一般符号", "装在支架上的电动机"]
dxf_forms = ["Exploded LINE/ARC/CIRCLE strokes on layer 01 with centre LINEs on layer 05", "INSERT of a motor block from a transmission-diagram library", "Nearby TEXT/MTEXT giving motor type, power and speed (general practice)"]
recognition = "锚点：传动链起点的矩形机身＋单侧伸出的粗轴线；电动机两端有半圆端盖；端视为带十字中心线的圆或拱形。旁边常有功率、转速文字（经验做法）。与联轴器区分：联轴器两侧都有轴线；与轴上飞轮区分：飞轮被轴线贯穿、轮体内有竖向分格线与“×”。与电气图中的电动机符号（圆内字母 M）区分：后者属于电气简图用图形符号，不在机构简图内。"
confusions = ["联轴器：两侧各有一根同轴粗轴线；原动机只有一侧出轴。", "轴上飞轮：轴线穿过轮体，轮体有竖向分格线和“×”。", "电气图电动机符号：圆内写 M，按电气图形符号标准，不属于机构简图。"]
related = ["DC-G3-189", "DC-G3-197", "DC-G3-196"]
