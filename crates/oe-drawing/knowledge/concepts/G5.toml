[[concepts]]
id = "DC-G5-111"
name = "被测要素任意局部范围的公差（t/L）"
aliases = []
group = "G5"
kind = "tolerance_indication"
meaning = "教材的说法：对被测要素任意局部范围的要求，在公差值后用斜线隔开写出局部范围的大小，如 0.05/100（任意 100 mm 长度）、0.01/□100（任意边长 100 mm 的正方形）。"
components = ["第二格：公差值 / 长度，或公差值 / □边长", "例：直线度 0.05/100；平面度 0.01/□100；平行度 0.08/100 加基准"]
variants = ["任意长度 t/100", "任意正方形范围 t/□100", "方向公差的任意长度 //0.08/100"]
dxf_forms = ["TEXT/MTEXT in the second cell of the frame (TOLERANCE entity: value field after the first %%v) like '0.05/100' or '0.01/□100' (□ may be a drawn small square or Unicode U+25A1)", "INSERT of a plugin frame block whose value ATTRIB carries the string; or exploded LINE/LWPOLYLINE cells + TEXT"]
recognition = "以第二格中“数值/数值”或“数值/□数值”为锚；□ 可能是单独画出的小方框、Unicode 字符或丢失后只剩数字，要结合斜杠判断。"
confusions = ["平行度符号 //：在第一格", "分数形式的配合代号：含字母"]
related = ["DC-G5-086", "DC-G5-085", "DC-G5-076", "DC-G5-061", "DC-G5-060", "DC-G4-050"]
priority = "medium"
text_forms = ["0.05/100", "0.01/□100", "// 0.08/100 A"]
