rust_path="crates/oe-engineering/src/reviewed_reconciliation.rs"
statement="At most32 reviews,256 unique source paths,16MiB per artifact and64MiB total current evidence. Complete current evidence digest coverage, actual source bytes and all inputs checked before and after. Original reconcile unchanged. Review requires exact decision object/version/scope/source, current Project context, complete current engineering checks and explicit nonempty shape; saved pass alone never clears pending. Real replay must match saved binding/evidence/coverage/check results and executor. Pending affected prerequisites propagate to downstream; unknown conclusions remain pending. No engineering adoption, approval policy write or canonical Project write."
severity="error"

[[validations]]
id="verify_reviewed_reconciliation_success"
module="engineering"
constraint="reviewed_reconciliation_current_sources"
behavior="fresh_review_replays_and_preserves_legacy_impact"
rust_path="crates/oe-engineering/tests/reviewed_reconciliation.rs"
oracle="Independent synthetic two-decision prerequisite chain: original impact remains stale; current actual Rust review satisfies both; Project and private authority bytes remain unchanged."
scope="Current Rust software scope; no empirical truth, independent approval or unseen business benefit"

[[validations]]
id="verify_reviewed_reconciliation_rejections"
module="engineering"
constraint="reviewed_reconciliation_current_sources"
behavior="stale_forged_missing_and_partial_reviews_remain_pending"
rust_path="crates/oe-engineering/tests/reviewed_reconciliation.rs"
oracle="Missing or modified evidence, duplicate paths/reviews, unknown decisions, old context, forged saved pass, altered executor, missing checks and shape, changed metadata and failed replay never produce current review; absent upstream keeps downstream pending; restoring bytes restores valid evidence."
scope="Current generated contract and actual kernel replay on Mac; original adoption authority requirements unchanged"

