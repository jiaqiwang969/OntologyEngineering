[[concepts]]
id = "DC-G8-018"
name = "紧固件的省略画法（细点画线和公共指引线）"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "装配图中可以省略螺栓、螺母、销等紧固件的投影，只用细点画线画出它们的位置，并用公共指引线指明这组紧固件；指引线按连接类型从被连接件的一端引出：螺钉、螺柱、销连接从装入端引出，螺栓连接从装螺母的一端引出。"
components = ["紧固件位置只画细点画线（轴线或十字中心线），不画紧固件外形和螺纹。", "公共指引线从被连接件的装入端或螺母端外表面引出，末端注一组序号（如“-1-2-3”）。", "被连接零件本身仍按正常剖视或外形画出。"]
variants = []
dxf_forms = ["LINE with CENTER-type linetype (layer 05) crossing the joint of two parts, with no fastener outline", "LEADER/LINE on layer 09 starting at the outer face of one part, ending with TEXT '-1-2-3' or stacked numbers"]
recognition = "以穿过两零件结合面的细点画线为锚点：它垂直于结合面，两端略伸出零件外轮廓（出图约2~5 mm），该处没有紧固件外形；附近有一根公共指引线从其中一端零件的外表面引出，末端为多个序号。指引线所在一端可说明连接类型（螺母端为螺栓连接，装入端为螺钉、螺柱或销连接）。若同一结构在别处有完整画出的紧固件可作旁证。与空孔中心线的区别：空孔有孔的轮廓线。"
confusions = ["空孔的中心线：有孔轮廓线，无指引线。", "普通序号指引线：起点圆点在零件轮廓内，只指一个零件。", "相同零部件组简化画法：其余位置也用细点画线，但另有一组完整画出。"]
related = ["DC-G8-008", "DC-G8-022", "DC-G3-127", "DC-G3-129", "DC-G1-044"]
