components = ["叠写偏差：如 60°10′ 后上下叠写 +0°5′ / 0°", "对称偏差：如 30°±0°5′ 或 35°±1°", "单向极限：如 20′ max、45° max.、32° min.", "一般公差：只写公称角度，在标题栏内或附近注 GB/T 1804-f 等", "单位：度、分、秒或十进制度，偏差亦须带单位"]
variants = ["stacked deviations", "±", "max/min", "general tolerance GB/T 1804-f for angles"]
dxf_forms = ["angular DIMENSION (dimtype 2 or 5) with DIMTOL deviations or override text '35%%d%%p1%%d'", "MTEXT stacking '60%%d10''\\S+0%%d5''^0%%d;'", "exploded ARC dimension line + SOLID arrows + TEXT"]
recognition = "锚点：角度尺寸（圆弧尺寸线、尺寸界线自顶点径向引出、文字水平）中带±、叠写偏差或max/min的文字。检验偏差带角度单位（°、′、″）；若偏差缺单位，可能被OCR丢失，按角度补全。与圆锥角AT等级区分：含AT；与倾斜度公差区分：后者在框格中。"
confusions = ["圆锥角公差 AT 等级", "倾斜度公差框格", "倒角注 n×45°（非公差）", "角度一般公差（不在尺寸上）"]
