[[concepts]]
id = "DC-G3-211"
name = "渐开线圆柱齿轮参数表"
aliases = ["齿轮参数表"]
group = "G3"
kind = "table"
meaning = "渐开线圆柱齿轮零件图右上角的参数表，列出制造和检验该齿轮所需的模数、齿数、齿形角、变位、精度等级、配对齿轮及检验项目公差等数据；齿形本身按规定画法简化，参数靠此表传递。"
components = ["位置：一般放在图框内右上角，技术要求放在右下角标题栏上方；表格通常与图框内框的上边和右边相接。", "主体为“名称|代号|数值”三列格栅，逐行列出法向模数mn、齿数z、齿形角α、齿顶高系数ha*、螺旋角β、螺旋方向、径向变位系数x、齿厚（或公法线长度及偏差、跨齿数）、精度等级。", "下部为配对齿轮（图号、齿数）、齿轮副中心距及其极限偏差，以及检验项目代号与公差或极限偏差值。", "版本差异：2003版标准示例按旧精度标准列“公差组”；教材示例有旧式“7FL”和Fr、Fw、fpb等，也有按GB/T 10095—2008列Fp、Fα、Fβ、Fr。", "项目按需增减：直齿轮无螺旋角、螺旋方向行；检验项目按功能要求确定。"]
variants = ["直齿", "斜齿", "含检验项目公差", "含公法线长度及偏差"]
dxf_forms = ["LINE grid (outer border thick layer 01, inner rules thin layer 02) with single-line TEXT or MTEXT in each cell on layer 11", "INSERT of a template block (gear parameter table) with ATTRIB values, or an exploded CAXA gear-table object; newer templates may use an ACAD_TABLE entity", "Cell text uses Greek letters as Unicode (α, β) or font substitutions, '%%d' for degrees ('20%%d'), and MTEXT stacking '\\S+0.011^-0.112;' for deviations"]
recognition = "锚点为图框右上角内的表格格栅：若干共享端点的水平线等间距排列（行高约1.5~2倍字高，常为7~8 mm），整体贴靠图框内框右上角。表内文字至少命中3个关键词（模数、齿数、齿形角、精度等级、变位系数、螺旋角、配对齿轮、公法线），并含20°一类数值，即判为圆柱齿轮参数表。读取时按行把名称格与同行数值格配对，代号列（m、z、α、x、β）用于消歧。同图应有齿轮规定画法（分度线为细点画线、齿根线细实线或省略）。按位置和关键词与标题栏、明细栏区分。"
confusions = ["标题栏：位于右下角，关键词是图样名称、材料、比例、设计/审核等，不含模数、齿数。", "明细栏：位于标题栏上方或单独成页，列头为序号、代号、名称、数量、材料，序号逐行递增。", "蜗杆/蜗轮/锥齿轮参数表：位置与格式相同，按特有关键词区分（蜗杆类型、导程角；分度圆齿厚、配对蜗杆；分锥角、接触斑点、轴交角）。", "技术要求：右下角编号的文字段落，不是格栅。", "检验记录表等工艺表格：多在工艺文件而非零件图上，表头为测量值、检验员等。"]
