[[concepts]]
id = "DC-G3-155"
name = "双副元素构件符号（连杆、曲柄、偏心轮）"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示带两个运动副元素的构件，最常见的是连接两个回转副的连杆、一端铰接在机架上的曲柄（或摇杆），以及转轴偏离几何中心的偏心轮。"
components = ["连杆（平面机构）：一根粗实线两端各有一个铰链小圆，小圆外再引出细线表示相邻构件。", "连杆（空间机构）：折线形粗实线，两端各接一个带竖短线的轴承小框（空间回转副）并带实心楔。", "曲柄或摇杆：粗实线一端接固定铰链（小圆坐在三角支座上，下有机架短斜线），另一端接活动铰链小圆；空间机构为一端接带机架斜线的轴承框。", "偏心轮：大圆表示轮，圆内偏离圆心处有一个坐在机架上的小铰链圆，轮心用小十字标出，轮缘引出相邻构件细线。", "2013版条号7.3.1～7.3.1.3，1984版4.3.1～4.3.1.3，图形一致。"]
variants = ["连杆（平面/空间）", "曲柄或摇杆（平面/空间）", "偏心轮"]
dxf_forms = ["LINE on layer 01 (wide lineweight) between two equal-radius CIRCLE pivots; adjacent members as thin LINEs on layer 02", "Fixed pivot as small CIRCLE + isosceles triangle (LINE×3 or closed LWPOLYLINE) + base LINE with short 45° strokes", "Eccentric: large CIRCLE (sometimes doubled) + small off-centre pivot CIRCLE + short cross LINEs at the wheel centre", "INSERT of crank / link / fixed-pivot blocks from a mechanism-symbol library"]
recognition = "锚点为一根粗线段，其两端点各落在一个等径小圆的圆周上。一端小圆下有三角支座和机架短斜线→曲柄/摇杆；两端均为活动铰链→连杆。偏心轮：大圆内含一个不在圆心的小铰链圆，大圆圆心另有十字标记。上下文：整个视图由单线构件、铰链小圆、机架短斜线组成（机构运动简图），而不是零件投影轮廓。与零件图中心线、轴线区分：后者为点画线或位于零件轮廓之中，端点无铰链小圆。"
confusions = ["轴、杆符号：单根粗线，端点不以铰链小圆终止。", "凸轮：外廓为非圆封闭曲线；偏心轮外廓为正圆，只是转轴偏置。", "零件图中带中心线的孔：小圆带十字中心线和尺寸，不由粗线连接。"]
related = ["DC-G3-158", "DC-G3-152", "DC-G3-140", "DC-G3-196", "DC-G3-147", "DC-G3-175", "DC-G3-182"]
