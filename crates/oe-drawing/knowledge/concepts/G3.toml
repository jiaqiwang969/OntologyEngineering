recognition = "以点画线分布圆上等角距排列的一组相同小圆为锚点（≥3个，半径相等，圆心到中心距离相等，相邻角距相等）；所在视图朝向法兰端面（与主视图的轴线方向一致），视图通常只包含法兰外圆和孔，不含零件其他结构。区分普通端视图：普通左/右视图包含零件全部可见轮廓；区分向视图：向视图有字母箭头标注。本概念的几何与端视图相同，主要用于解释为何只画法兰部分。"
