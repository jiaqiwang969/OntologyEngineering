[[concepts]]
id = "DC-G3-094"
name = "螺纹终止线"
aliases = ["螺纹长度终止线"]
group = "G3"
kind = "line"
meaning = "螺纹终止线是表示有效（完整）螺纹结束位置的粗实线，与轴线垂直。"
components = ["外螺纹视图：螺纹结束处一条垂直轴线的粗实线，两端接上下牙顶线，跨越整个大径。", "外螺纹剖开处：终止线只在牙顶与牙底之间画出一小段（牙高范围）。", "内螺纹剖视：终止线为粗实线，横跨两侧大径细实线之间。", "不可见螺纹：终止线与其他螺纹线一起画成虚线。", "终止线外侧如需表示螺尾，接30°细实线。"]
variants = ["外螺纹终止线", "内螺纹终止线（剖视）", "不可见时用虚线"]
dxf_forms = ["Thick LINE (layer 01 / 粗实线, lineweight 0.5–0.7) perpendicular to the axis; external: endpoints on the two crest lines; internal section: endpoints on the two thin major-diameter lines", "Hidden thread: the same LINE on dashed layer 04 with HIDDEN/DASHED linetype", "Often part of a thread INSERT from a mechanical library, or exploded LINEs after export"]
recognition = "以螺纹区为锚点（两对平行线，外层与内层间距比约1:0.85，一对粗一对细）；在螺纹区一端找垂直于轴线的粗实线：外螺纹其长度等于外层粗线间距（大径d），内螺纹剖视其长度等于外层细线间距（大径D），外螺纹剖视中只有牙高的一小段。判别要点：该线两侧的外轮廓（牙顶线）连续、直径不变，只有牙底细线在此终止。区分轴肩或台阶轮廓线：台阶两侧直径不同；区分花键工作长度终止端：GB图中为细实线；区分退刀槽边线：退刀槽处轮廓下凹；区分倒角端线：倒角端线一侧轮廓是斜线。"
confusions = ["轴肩、台阶轮廓线：两侧直径不同。", "花键工作长度终止端：细实线（ISO图为粗实线，但有花键断面图）。", "退刀槽边线：轮廓下凹成槽。", "倒角端线：一侧为倒角斜线。", "一般可见棱边线：两侧没有牙底细线的起止关系。"]
