name = "弯折接合处符号"
aliases = []
group = "G7"
kind = "symbol"
meaning = "表示弯折（咬口、卷边折叠）接合处的图形符号：一个粗笔画的S形钩，两条带料互相卷绕，画在接合标注的基准线上。"
components = ["S形钩符号：上部为向左折回的钩，下部为向右弯的半圆，整体像“ᘐ”或倒置的“S”，线宽d=0.1h。", "基准线和指引线：按接合标注规则表示。", "其余表示：弯折接合本身按图线和指引线一般规定表示。"]
variants = []
dxf_forms = ["LWPOLYLINE with arc segments (bulges) and constant width ≈0.1h forming a hooked S, or ARC + LINE strokes", "part of a joint-symbol INSERT on a reference line"]
