[[validations]]
id="external_readback_fields_roundtrip_and_reject_incomplete_or_forged_records"
module="nx_worker"
constraint="nx_complete_event_index"
behavior="external_readback_fields_roundtrip_and_reject_incomplete_or_forged_records"
rust_path="crates/oe-nx-worker/tests/event_index.rs"
oracle="超过2MiB的UTF-8装配字段完整往返；缺块、重复块、改字节、错字段、错任务、错序号、错偏移、摘要/长度伪造、原事件schema/sequence伪造及预算越界均拒绝。"
scope="Rust分块与接收；Windows worker与完整项目原生重开另验"

[[validations]]
id="aggregate_small_fields_and_final_lifecycle_keep_the_original_limit"
