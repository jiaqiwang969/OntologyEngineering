[[concepts]]
id = "DC-G3-157"
name = "四、五自由度运动副符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "表示点接触的高副：球与圆柱副（四个自由度，球落在槽中）和球与平面副（五个自由度，球落在平面上）。"
components = ["球与圆柱副：小圆表示球，一根构件粗线带实心楔斜接在球上；球下方有与球同心、开口向上的弧槽，弧槽下为一条水平直线。", "球与平面副：同样的球与构件，球直接落在一条水平直线上（直线与小圆相切）。", "2013版条号5.4.1、5.5.1；2013版文本中5.5.1名称印作“球与圆柱副”，但图形与1984版2.5.1“球与平面副”一致，应按球与平面副理解。"]
variants = ["球与圆柱副（四个自由度）", "球与平面副（五个自由度）"]
dxf_forms = ["CIRCLE (ball) + one inclined LINE link with a SOLID wedge, on layer 01", "Ball-in-cylinder: concentric ARC open upward below the ball plus a straight LINE; ball-on-plane: LINE tangent to the CIRCLE", "INSERT of a library block for the higher pair"]
recognition = "锚点为一个小圆，只有一根构件线以实心楔接在圆上，圆的另一侧与一条直线相切：圆与直线之间还有同心弧槽→球与圆柱副；圆直接与直线相切→球与平面副。与滚子从动杆区分：滚子接触的是凸轮的非圆轮廓曲线，从动杆常有导路；与球面副区分：球面副的弧在球的外侧包住球，并且有两根构件。"
confusions = ["滚子从动杆：滚子圆与凸轮外廓曲线相切，而不是与孤立直线或弧槽相切。", "球面副：外弧包住球，两根构件。", "平面回转副：小圆上接两根构件，下方没有直线或弧槽。"]
related = ["DC-G3-141", "DC-G3-146", "DC-G3-143"]
priority = "rare"
