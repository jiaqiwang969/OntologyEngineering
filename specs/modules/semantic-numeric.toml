[[modules]]
id="semantic_numeric"
contract_group="semantic"
kind="calculation"
rust_path="crates/semantica-numeric"
purpose="One shared Rust owner for exact BigInt and Decimal coefficient/exponent primitives, exact Binary64-to-Decimal construction, bounded reverse conversion, scalar Binary64 operations, two-float source sum, exact integer ratio division and exact numeric relations with reached signals, explicit HALF_EVEN context operations, numeric signals, lexical conversion and bounded formatting; consumers retain their own RDF, duration and expression policies"
realizes=["req_semantic_platform", "req_semantics"]
depends_on=["semantic_json"]
platform="Rust1.95; locked num-bigint0.4.8, num-integer0.1.47 and num-traits0.2.19; Python reference adaptation with retained PSF license; platform execution requires its own receipt"
effects="Pure in-memory numeric operations with explicit context and resource budgets; no Dataset, AST interpreter, process-global Decimal context, Project decision or engineering adoption"
failures="Invalid operands/context/lexical form, integer text limits, resource faults and configured Decimal traps are distinct; Integer/Decimal and explicit mixed Binary64 query policies belong to consumers; arbitrary query integration, cross-platform float environment and public nullable /5 remain unqualified"
status="source_only"
source_refs=["semantic_numeric_pydecimal_reference", "semantic_numeric_frozen_expectations", "semantic_numeric_rdflib_cache_boundary", "semantic_numeric_duration_baseline", "semantic_numeric_binary64_reference", "semantic_numeric_binary64_frozen_expectations", "semantic_query_numeric_original_source", "semantic_query_numeric_frozen_expectations", "semantic_numeric_mixed_binary64_source", "semantic_numeric_mixed_binary64_frozen", "semantic_query_numeric_mixed_signal_source", "semantic_query_numeric_unicode_private_source", "semantic_numeric_source_aggregate_reference", "semantic_query_numeric_source_aggregate_frozen", "semantic_query_numeric_source_group_demand", "semantic_query_numeric_literal_identity_source", "semantic_query_numeric_literal_identity_frozen", "semantic_query_numeric_literal_language_source", "semantic_query_numeric_literal_values_representative_source", "semantic_query_numeric_group_concat_source", "semantic_query_numeric_group_concat_python_text", "semantic_query_numeric_group_concat_frozen", "semantic_query_numeric_group_concat_limits_supplement", "semantic_numeric_comparison_reference", "semantic_query_numeric_extrema_reference", "semantic_query_numeric_extrema_frozen", "semantic_source_order_frozen", "semantic_source_order_sort_adaptation"]

