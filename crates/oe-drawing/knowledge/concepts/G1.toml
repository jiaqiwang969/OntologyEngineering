aliases = []
group = "G1"
kind = "line"
meaning = "线宽为粗线的点画线，平行且靠近表面画出，用来限定某项特殊要求（如热处理、测量）所适用的有限范围。"
components = ["线型04，线宽 d；机械图中唯一用途是限定范围表示线（04.2.1）。", "画在表面轮廓外侧并与之平行，起止位置常由尺寸确定。", "CAD 分层06层，屏幕显示棕色。"]
variants = []
dxf_forms = ["LINE/ARC with a dash-dot linetype and thick lineweight on layer 06, brown colour (no basic ACI index; templates use an index colour or true colour)", "offset copy of a stretch of the outline", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying"]
recognition = "锚点为线宽为粗线的点画线；与某段粗实线轮廓平行、间距小（约1~3 mm），只覆盖轮廓的一段；附近有限定起止的线性尺寸和文字或符号。与细点画线靠线宽和颜色区分；与粗虚线靠图案中有无点区分。"
