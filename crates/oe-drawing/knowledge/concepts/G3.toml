[[concepts]]
id = "DC-G3-017"
name = "圆柱螺旋压缩弹簧画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "在平行于轴线的视图中，螺旋压缩弹簧各圈轮廓画成直线；要求两端并紧磨平时，不论实际支承圈数多少，都按支承圈2.5圈的标准形式画出；可画视图、剖视图或示意图。"
components = ["视图：各圈外轮廓画成相互平行的斜直线，两端并紧磨平的圈画成贴紧并带平端面。", "剖视图：簧丝截面为两列小圆（画剖面线或涂黑），两侧沿轴向错开半个节距，用直线与对侧相连。", "示意图：用单根线画成锯齿形折线。", "有效圈数多于4圈时中间可省略，用通过簧丝中心的细点画线相连，并允许缩短图形长度。", "一律可画成右旋，左旋等必须保证的旋向在技术要求中注明；截锥螺旋压缩弹簧的外形为截锥。"]
variants = ["视图", "剖视图", "示意图", "截锥螺旋压缩弹簧"]
dxf_forms = ["View: series of parallel inclined thick LINEs (coil outlines) between two envelope LINEs, end coils flattened", "Section: two columns of small CIRCLEs (wire diameter) with HATCH ANSI31 or SOLID fill, plus inclined tangent LINEs", "Omitted middle: two CENTER-linetype LINEs (层05) through the wire centres bridging the gap", "Schematic: single LWPOLYLINE zigzag", "Spring generators (CAXA/GstarCAD) give an INSERT of a (possibly anonymous) block, sometimes exploded"]
recognition = "锚点：沿两条平行包络线（外径）排列的一串等径小圆（簧丝截面），两侧小圆沿轴向错开半个节距，圆间有斜切线；或视图中的一组等距平行斜线。两端圈并紧（小圆相切）并有平端线；圆串中断且有点画线相连→中间省略。配有机械性能曲线与技术要求中的圈数。区分：螺纹为平行粗细直线，无截面小圆；波纹管为连续波形轮廓；机构简图弹簧符号很小且单线。"
confusions = ["螺纹、滚花：无簧丝截面圆列。", "波纹管：连续弯曲轮廓。", "机构简图弹簧符号：单线、尺寸小。", "断开缩短画法：用波浪线断开，而弹簧省略是用点画线连接簧丝中心。"]
