[[constraints]]
id="decision_update_from_registered_evidence"
requirement="req_project"
module="kernel"
check="decide"
rust_path="crates/oe-kernel/src/project/decide.rs"
statement="决定只由已登记且重核通过的工具结果更新：supported/refuted 须有针对该决定、对象与条件一致、带观察结论的结果并引用其观察或推断结论；决定改绑到结果的对象修订与来源；已采用的决定不在此改；只写新副本。"
severity="error"

[[constraints]]
id="route_acceptance_evidence_closure"
requirement="req_project"
module="kernel"
check="audit2"
rust_path="crates/oe-kernel/src/project/route.rs"
statement="/2 验收项声称关闭时，所列决定须为 supported、依据已登记、绑定当前对象修订且来源仍在，记忆证据不计；否则 invalid。输出可交付、继续、不一致三栏。"
severity="error"

[[validations]]
id="validate_decision_update_rules"
module="kernel"
constraint="decision_update_from_registered_evidence"
behavior="registered_observed_evidence_required_for_supported_or_refuted"
rust_path="crates/oe-kernel/tests/decide.rs"
oracle="独立冻结：有效更新只改该决定并改绑当前修订与来源；未登记、不针对该决定、对象或条件不一致、绑定冲突、无观察结论、引用不存在、已采用、修订未变均拒绝；unknown 可只写理由"
scope="声明与登记证据；不证明采用或收益"

[[validations]]
id="validate_route_anchor2_delivery"
module="kernel"
constraint="route_acceptance_evidence_closure"
behavior="closed_acceptance_requires_supported_decisions_and_evidence"
rust_path="crates/oe-kernel/tests/route_anchor.rs"
oracle="关闭项决定均 supported、依据已登记且绑定当前修订时可交付；过期、来源缺失、记忆证据或依据不足时 invalid 并列入不一致；open/partial 列入继续"
scope="声明与登记证据；不证明采用或收益"

