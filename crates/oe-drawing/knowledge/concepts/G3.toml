[[concepts]]
id = "DC-G3-012"
name = "动密封圈剖面符号规定"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "剖视中用简化画法（通用画法、特征画法）绘制的动密封圈一律不画剖面符号；用规定画法时只在金属骨架等嵌入元件上画剖面线或涂黑，橡胶等基体不画。"
components = ["简化画法线框：粗实线矩形或外形轮廓，框内无剖面线，只有对角线或要素符号。", "规定画法：橡胶主体为空白轮廓，骨架等金属嵌入件画剖面线或涂黑。", "两版规定一致：1996版（GB/T 4459.6）与2009版（GB/T 4459.8/4459.9）均如此。"]
variants = ["嵌入元件画剖面线", "嵌入元件涂黑"]
dxf_forms = ["Thick rectangle (LWPOLYLINE or four LINEs) with no HATCH inside for simplified forms", "Specified form: closed seal-body outline without HATCH plus a small HATCH (ANSI31) or SOLID-filled HATCH for the metal case", "Seal library output as INSERT; the case hatch then sits inside the block definition"]
recognition = "锚点：装配剖视中位于轴与孔沟槽之间、周围零件都有剖面线而自身无剖面线的封闭区域。框内若有对角线或短斜线要素符号→简化画法；若为唇形轮廓且仅有一个L形窄条被剖面线或涂黑→规定画法（骨架）。区分：普通零件整截面画剖面线；薄件涂黑是整个窄截面填黑，不区分基体与骨架。"
confusions = ["普通零件剖面线：整个剖面满画。", "狭小剖面涂黑：整个截面填黑。", "非金属材料剖面符号：按材料画网格，而密封圈按本规定不画。"]
related = ["DC-G3-013", "DC-G3-109", "DC-G3-114", "DC-G3-118", "DC-G2-057", "DC-G2-063", "DC-G2-035"]
