acceptance = "原字节 SHA256 可重读核对；选定窗口及会话头复读一致时允许窗口外尾部追加；超大行、截断、替换和原字节变化不得报告完整"
[[requirements]]
id = "conditioned_experience"
function = "保留经验的时间线、纠正、因果证据层级与适用范围"
condition = "只有原文可追溯且结构检查通过的候选可以入库；工程采用仍由当前 Project 决定"
acceptance = "纠正追加新修订，旧修订可读；跨项目和条件不全只作待核线索"
[[requirements]]
id = "use_feedback"
function = "把实际使用结果与经验的精确修订连接，支持方法比较和后续 RRSI"
condition = "反馈记录使用、拒绝、无变化及未知成本；历史检索排名不证明收益"
acceptance = "不存在的修订被拒绝；未使用不能计有益；方法比较保留不可迁移部分"
[[requirements]]
id = "continuous_history"
function = "分别补旧历史和接新增内容，持久保存读取进度、待整理任务和实际完成状态"
condition = "显式来源与有限预算；同一条消息跨 profile 保留来源别名，分叉不混为同一内容"
acceptance = "重复运行幂等；尾部半条消息等待；旧字节变化拒绝续接；读取不等于整理"
[[requirements]]
id = "large_message_continuity"
function = "带图片的完整原消息可越过普通 2 MiB 读窗，后续纠正与讨论继续接续"
