recognition = "在已识别的标题栏内：栏目名按本卡词表定区（签字区、更改区、其他区）；所填文字按左侧同行或正上方的栏目名定栏，无栏目名的按值的形式定栏——比例为“数:数”，材料为牌号（两位数字碳钢、数字加合金元素、HT/QT/ZG/Q 等前缀），图样代号为字母数字加分隔符，单位名称含公司、厂等词，图样名称为不带栏目名的短中文。图框角上与图样代号相同的倒写文字是重复的代号；代号中的“~”与“-”同表示序号范围（企业常用写法，非标准条文）。"
