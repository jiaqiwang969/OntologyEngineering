[[concepts]]
id = "DC-G3-077"
name = "齿轮啮合区剖视画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "剖切平面通过两啮合齿轮轴线的剖视中，啮合区内一个齿轮的轮齿用粗实线画，另一个齿轮被遮挡的部分画虚线，也可省略不画。"
components = ["啮合区内两齿轮分度线（点画线）重合为一条。", "可见齿轮：齿顶线、齿根线为粗实线。", "被遮挡齿轮：齿顶线画虚线或不画，齿根线为粗实线。", "一齿轮齿顶线与另一齿轮齿根线之间留有径向间隙。", "适用于圆柱齿轮外、内啮合，齿轮齿条啮合和锥齿轮剖视。"]
variants = ["被遮挡部分画虚线", "被遮挡部分省略不画"]
dxf_forms = ["In the mesh zone: one CENTER-linetype pitch LINE shared by both gears, one HIDDEN-linetype tip LINE (layer 04) or none, and thick LINEs for the other tip line and both root lines", "Short parallel thick LINEs, length = face width, separated by the tip clearance on each side of the pitch line", "HATCH on gear bodies outside the tooth zone; tooth zone unhatched"]
recognition = "锚点为两齿轮轴线之间的公共分度线（点画线）；在其两侧齿宽范围内应有一组平行短线，依次为：齿根线（粗）、齿顶线（粗）、分度线（点画）、齿顶线（虚线或无）、齿根线（粗），相邻间距由齿顶高≈m和顶隙≈0.25m组成。长度等于齿宽的一条虚线短段位于分度线一侧是强证据。与普通隐藏轮廓区分：该虚线紧贴分度线且长度等于齿宽；与两零件接触面区分：接触面为单线、无点画线。"
confusions = ["普通虚线隐藏轮廓：位置与分度线无关，长度与齿宽无关。", "两零件接触面：单条粗实线，无节线与顶隙。", "啮合外形视图画法：不剖时啮合区齿顶线不画、节线改粗实线。"]
related = ["DC-G3-078", "DC-G3-021", "DC-G3-020", "DC-G3-079", "DC-G3-070", "DC-G3-022", "DC-G1-045"]
priority = "medium"
text_forms = []
knowledge_units = ["K13", "K37"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "出处：GB/T 4459.2-2003 第4.3条（图9、11、16、18画虚线；图12、13、17省略）。顶隙0.25m为标准齿制一般知识。"
