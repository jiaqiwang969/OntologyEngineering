recognition = "以由L或直角笔画开头、后接“数字×数字×数字（-长度）”的文字为锚点；也可带“GB/T 9787”或“GB/T 706”等型钢标准号。与普通螺纹长旋合长度代号L、表面结构下限L区分：后者位于螺纹标记末尾或表面结构符号内；与角度标注区分：角度为数字加°。"
