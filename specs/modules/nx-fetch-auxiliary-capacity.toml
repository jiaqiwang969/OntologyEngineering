schema="oev2.design-fragment/2"

[[types]]
name="NxNativeAuxiliaryBudget"
contract_group="engineering"
identity="Explicit optional native job v3 auxiliary transport budget"
meaning="新v3任务显式声明辅助回执与控制记录容量；缺省保持旧边界及任务字节"

[[types.fields]]
name="max_total_bytes"
rust_type="u64"
required=true
format="typed"
meaning="辅助记录总量，最多原512MiB"
unit="字节"
precision="精确整数，禁止溢出与截断"
write="新v3任务显式声明，绑定任务摘要"
applicability="旧v2不接纳；旧v3缺省保持原边界"
acceptance="完整辅助集合总量不超过声明；不代表原生或工程通过"

[[types.fields]]
name="max_file_bytes"
rust_type="u64"
required=true
format="typed"
meaning="单辅助文件最多原64MiB且不超过声明总量；控制记录仍最多4MiB"
unit="字节"
precision="精确整数，禁止溢出与截断"
write="新v3任务显式声明，绑定任务摘要"
applicability="旧v2不接纳；旧v3缺省保持原边界"
acceptance="每个辅助文件不超过声明；不代表原生或工程通过"

[[types.fields]]
name="max_files"
rust_type="u64"
required=true
format="typed"
meaning="辅助文件总数最多65536；声明之外不自动扩容"
unit="文件数"
precision="精确整数，禁止溢出与截断"
write="新v3任务显式声明，绑定任务摘要"
applicability="旧v2不接纳；旧v3缺省保持原1088"
acceptance="控制器和接收端按同一声明检查完整辅助集合，缺页/块不得删去以满足预算"

[[constraints]]
id="nx_explicit_auxiliary_fetch_capacity"
requirement="req_engineering"
module="nx_protocol"
check="validate"
rust_path="crates/oe-nx-protocol/src/large_fetch.rs"
statement="只有v3任务显式auxiliary_capacity才改变原1088辅助文件数量边界；省略字段的v2/v3序列化与摘要不增加null，保持原512MiB总量/64MiB单文件/1088数量。新预算绑定job摘要，控制器实际清点、范围读取与接收快照共用总量/每文件/数量边界；控制记录4MiB、原分段和65536范围总数均保持。旧unknown/原件不修改。"
severity="error"

[[validations]]
id="auxiliary_capacity_is_explicit_versioned_and_identity_bound"
module="nx_protocol"
constraint="nx_explicit_auxiliary_fetch_capacity"
behavior="auxiliary_capacity_is_explicit_versioned_and_identity_bound"
rust_path="crates/oe-nx-protocol/tests/native_capacity.rs"
oracle="旧v2/v3缺省字节不添字段；新v3预算改动改变身份，旧v2携带新预算、零/越界预算拒绝"
scope="纯Rust身份与准入；实际Windows字节取回另验"

[[validations]]
id="large_fetch_preserves_all_explicit_v3_auxiliary_records"
module="windows_controller"
constraint="nx_explicit_auxiliary_fetch_capacity"
behavior="large_fetch_preserves_all_explicit_v3_auxiliary_records"
rust_path="crates/oe-windows-controller/tests/native_payload_copy.rs"
oracle="4555原回执及18页/20块完整入快照和分批，原1088仍拒绝，声明数量/总量/单文件超限分别拒绝"
scope="完整字节运输的软件检查；不证明NX执行或重开"

[[validations]]
id="windows_large_fetch_uses_explicit_auxiliary_capacity"
module="windows_controller"
constraint="nx_explicit_auxiliary_fetch_capacity"
behavior="windows_large_fetch_uses_explicit_auxiliary_capacity"
rust_path="crates/oe-windows-controller/tests/published_stage_endpoint.rs"
oracle="实际Windows目录超过1088回执由显式v3快照和批次完整取回；同数据缺预算和多一文件拒绝，未启动NX"
scope="Windows独立controller进程字节运输；原生保存和重开另验"
