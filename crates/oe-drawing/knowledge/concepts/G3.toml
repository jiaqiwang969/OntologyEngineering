[[concepts]]
id = "DC-G3-114"
name = "往复运动密封圈特征画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在装配剖视中，用矩形线框内的往复运动动态、静态密封要素符号（及防尘唇等符号）组合，形象地表示Y形、U形、V形、J形等往复运动橡胶密封圈和防尘圈；每种组合对应一种规定画法。2009版称为详细的简化表示法，1996版称为特征画法。"
components = ["矩形线框：粗实线，与密封圈外形尺寸一致，框内不画剖面线。", "动态密封要素：从线框中心画出、与相应轮廓线成30°的短粗实线，指向运动表面（活塞杆或缸孔）。", "静态密封要素：从线框中心画出、与相应轮廓线平行的短粗实线，指向静止配合面。", "附加符号：防尘唇等按标准组合，对应Y形、U形、蕾形、V形组合、J形、高低唇Y形、防尘圈A/B/C形、鼓形、山形、Vd形等。", "版本：1996版特征画法应画在轴的两侧；2009版以表3列出各详细的简化表示法与规定画法对应关系。"]
variants = ["Y形、U形、蕾形", "V形组合", "J形", "高低唇Y形（孔用/轴用）", "防尘圈A/B/C形", "鼓形、山形", "Vd形"]
dxf_forms = ["Thick rectangle (LWPOLYLINE or 4 LINEs) adjacent to the rod or bore outline, no HATCH", "Short thick LINEs starting at the rectangle centre: one at ~30° towards the dynamic surface, one parallel to the static side; combinations of 2–4 strokes", "Optional INSERT of a seal symbol block; optional arrowhead (SOLID) for sealing direction"]
recognition = "以紧贴活塞杆或缸孔轮廓、内部无剖面线的粗实线小矩形为锚点；框内有从中心出发的2～4条短粗线，其中一条与贴合运动面的框边成约30°（动态要素），另一条与另一框边平行（静态要素），短线长度不超过框短边的一半左右。区分旋转轴唇形密封圈特征画法：其要素是跨越大半个框的长粗实线（对角形式），多见于轴承盖油封处；区分通用画法：通用画法为不接触线框的X形对角线。"
confusions = ["旋转轴唇形密封圈特征画法：要素为长粗实线，成对角形式。", "动密封圈通用画法：X形对角线符号。", "迷宫式密封：T形、U形凸凹符号。", "滚动轴承特征画法：长粗实线与短粗实线成90°交叉。"]
related = ["DC-G3-109", "DC-G3-118", "DC-G3-164", "DC-G3-166", "DC-G3-202", "DC-G3-168", "DC-G3-013", "DC-G3-012"]
