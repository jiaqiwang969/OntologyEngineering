[[concepts]]
id = "DC-G1-037"
name = "短中心线"
aliases = []
group = "G1"
kind = "line"
meaning = "尺寸很小的圆或结构的中心线（短的轴线、对称线），用细实线画出，以代替难以表现线素的点画线。"
components = ["细实线（No.01.1.7），常为小圆上的十字线，略超出圆周。", "依据：点画线长度不足以表现长画和点（CAD 规定短于54.5d）时允许用细实线。"]
variants = []
dxf_forms = ["two thin CONTINUOUS LINEs crossing at a small CIRCLE centre", "DIMCEN/centre-mark crosses on small circles", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点为小圆（直径通常小于8~12 mm，或中心线长度小于54.5d），圆心处有两条正交细实线，长度约为直径+2~6 mm，交点与圆心重合。与尺寸界线区分：尺寸界线一端连轮廓、另一端越过尺寸线，不成十字；与圆心符号区分：圆心符号的十字更短，可不超出圆周。"
confusions = ["细点画线中心线：用于一般大小的圆。", "尺寸界线：不成十字。", "圆心符号：短十字，只标圆心。"]
