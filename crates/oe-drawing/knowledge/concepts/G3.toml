[[concepts]]
id = "DC-G3-006"
name = "凸台"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "铸件上局部凸起的小平台，顶面为加工面，用作螺栓、螺母或其他零件的接触支承面，以减少加工面积并保证接触良好。"
components = ["凸起轮廓：铸件外表面上高出不大的台阶状粗实线轮廓，平面视图中多为圆形或长圆形。", "顶面：加工面，常注表面结构要求，顶面棱角为尖角或小倒角。", "根部：与毛坯面相接处有铸造圆角。", "常与通孔或螺孔同心，构成螺栓座。"]
variants = []
dxf_forms = ["Thick LINE/ARC outline forming a low step on the casting contour; in plan view a thick CIRCLE concentric with a hole CIRCLE", "Small fillet ARCs at the pad root (casting rounds), sharp corners at the machined top", "Surface-texture symbol (INSERT or exploded strokes + TEXT like 'Ra 6.3') on the pad top"]
recognition = "锚点：铸件轮廓上一段短的外凸台阶（两条短侧边加一条顶边，高度明显小于宽度，常小于宽度的0.3倍），根部有小圆弧、顶边为尖角，顶边常带表面结构符号；在相邻视图中对应一个与孔同心的圆。区分：凹坑为向内凹入；法兰为整圈凸缘且有均布孔；回转件上的普通台阶没有铸造圆角。"
confusions = ["凹坑/锪平：轮廓向内凹入，常用锪平符号标注。", "法兰：整圈凸缘，尺寸大并有均布孔。", "普通台阶：回转件上的尺寸变化，非局部凸起。"]
related = ["DC-G3-007", "DC-G3-066", "DC-G3-067", "DC-G3-008", "DC-G3-043"]
priority = "medium"
text_forms = []
knowledge_units = ["K13", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Height-to-width ratio is general practice, not from the source."
