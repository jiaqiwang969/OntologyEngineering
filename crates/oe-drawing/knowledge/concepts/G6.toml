id = "DC-G6-053"
name = "表面结构要求标注在轮廓线上"
aliases = ["表面结构注在轮廓线或其延长线上"]
group = "G6"
kind = "surface_indication"
meaning = "表面结构符号直接立在被注表面的可见轮廓线上，尖端从材料外侧指向并接触轮廓。"
components = ["尖端接触粗实线轮廓（或其延长线），V形开口一侧为材料外。", "符号方向按读取方向规则：水平轮廓上方正置，竖直轮廓旁旋转90°。", "2006版图17；1993版4.1注在可见轮廓线上；ISO 21920-1草案图11 a)。", "朝下或不便正置的表面改用指引线引出。"]
variants = ["GB/T 131-2006 11.2.2 图17", "GB/T 131-1993 4.1 (visible outline)", "ISO 21920-1 draft 图11 a)", "直接在轮廓线上", "在延长线上"]
dxf_forms = ["INSERT whose apex (insertion point in most blocks) lies on an outline LINE/ARC (layer 01, thick) — test point-on-segment with tolerance ≈0.1h", "exploded symbol LINEs whose shared endpoint lies on the outline", "INSERT rotated 90° along vertical outlines"]
recognition = "锚点：符号尖端；判断尖端是否在粗实线轮廓或其直线延长上（容差约0.1h），符号角平分线应垂直于该轮廓，开口一侧不应有材料（剖面线或实体在另一侧）。确认后把要求赋给该轮廓所代表的表面（回转体为整个圆柱面）。区分焊缝箭头（连基准线）、基准三角形（贴轮廓的等腰三角形、常涂黑）和引出注法（尖端在指引线上）。"
confusions = ["焊缝符号箭头：箭头线连基准线", "基准三角形：贴轮廓的等腰三角形，连字母方框", "指引线引出注法：尖端在指引线水平段上"]
related = ["DC-G6-047", "DC-G6-052", "DC-G6-049", "DC-G6-032", "DC-G6-023", "DC-G5-009"]
priority = "high"
