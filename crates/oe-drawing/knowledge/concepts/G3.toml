[[concepts]]
id = "DC-G3-026"
name = "平面的对角线画法"
aliases = ["表示平面的对角线", "平面符号"]
group = "G3"
kind = "conventional_representation"
meaning = "轴或其他回转体上的小平面（如铣扁、方头）在视图中不易表达时，在该平面的投影轮廓内画两条相交的细实线对角线来表示它是平面，可省去一个视图或断面。"
components = ["平面轮廓：粗实线围成的矩形（圆柱上的平面）或梯形（圆锥上的平面）。", "对角线：两条细实线连接轮廓对角，交于中心。", "常与方头的□尺寸或对边宽度尺寸一起出现；四方轴端同样适用。"]
variants = ["rectangular flat on a shaft", "flat on a conical portion (diagonals in a trapezoid)", "square end of a shaft"]
dxf_forms = ["Two thin LINEs (层02) joining opposite corners of a thick-bounded rectangle or trapezoid; their endpoints coincide with the outline corners", "Accompanying DIMENSION with '□12' or a width-across-flats value"]
recognition = "锚点：位于回转体投影内（有点画线轴线）的封闭粗实线四边形（矩形或等腰梯形），其内恰有两条细实线，端点精确落在四个角点上并交于形心。区分：剖面线是成组平行线；中心标记'+'为点画线、水平竖直且不连接角点；轴承、密封圈通用画法中的十字或对角线为粗实线且不接触线框；钢结构图中的洞口叉号位于板件上。"
confusions = ["剖面线、网格线。", "中心标记'+'与中心线。", "动密封圈通用画法的粗实线对角线（不接触框线）。", "钢结构/钣金图中表示开口的叉号。"]
related = ["DC-G3-109", "DC-G1-043", "DC-G4-050", "DC-G3-115", "DC-G1-093"]
priority = "medium"
text_forms = ["□12"]
knowledge_units = ["K11", "K12", "K13", "K03", "K52", "K55"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Kept as medium: flats on shafts are frequent on the project's shaft drawings but not on every part."
