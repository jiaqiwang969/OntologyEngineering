[[concepts]]
id = "DC-G4-059"
name = "尺寸线"
aliases = []
group = "G4"
kind = "line"
meaning = "表示所注尺寸方向和范围的细实线，两端以箭头或斜线终止于尺寸界线，尺寸数字沿其注写。"
components = ["线型：细实线（GB/T 4457.4 代码01.1的用途之一）；不能用其他图线代替，一般不与其他图线重合或画在其延长线上", "线性尺寸：直线段，平行于被注线段；多条平行尺寸线时小尺寸在内、大尺寸在外，教材建议距轮廓5~7mm", "角度尺寸：以角顶点为圆心的圆弧；弧长尺寸：与被注圆弧同心的圆弧", "直径、半径：尺寸线通过圆心或其延长线通过圆心", "终端：箭头（机械图一般采用）或45°细斜线；用斜线时尺寸线与尺寸界线必须垂直"]
variants = ["linear: straight, parallel to the feature", "angular: circular arc centred on the angle vertex", "arc length: arc concentric with the dimensioned arc"]
dxf_forms = ["DIMENSION entity: the dimension line is the LINE (ARC for angular/arc-length) inside the *Dn block; its position is defpoint group 10", "after EXPLODE: LINE/ARC on layer 08 or template dimension layer + SOLID or INSERT arrowheads at both ends + TEXT/MTEXT value", "dimension line split into two LINE segments when the value sits in a break", "angular DIMENSION (dimtype 2 or 5) or ARC_DIMENSION give arc-shaped dimension lines"]
recognition = "以尺寸文字为锚：在文字下方约0.3~1h（或文字所处中断的两侧）寻找与文字基线平行的细直线段（角度尺寸为同心圆弧），两端各带终端（长约6d的箭头或长约h的45°斜线），端点落在两条相互平行、与它近似垂直的尺寸界线或轮廓上；线长×绘图比例应约等于数值（直径、半径、坐标式另行验证）。与轮廓线区分：线细、两端有终端、与数字绑定；与剖面线区分：剖面线为成组等距平行线且局限于封闭区域；与指引线区分：指引线只有一端有终端，另一端折为水平基准线。"
confusions = ["尺寸界线：与尺寸线垂直、成对出现，端部越出终端", "指引线：单端终端，另一端折成基准线", "剖面线：成组等距细线，位于剖面区域", "轮廓线或中心线：粗实线或点画线，不能代替尺寸线"]
related = ["DC-G4-058", "DC-G4-019", "DC-G4-021", "DC-G4-017", "DC-G4-101", "DC-G1-043"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = []
recognizer = "rule"
seen_on_drawing = ["development", "second"]
expert_checked = false
notes = "5~7mm间距为教材建议；DXF结构为通用AutoCAD实践。"
