[[concepts]]
id = "DC-G3-016"
name = "圆弧齿轮画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "圆弧齿轮（齿廓为圆弧的斜齿圆柱齿轮）按一般齿轮规定画法绘制，用三条细实线表示齿线，需要时用粗实线或局部放大图画出圆弧齿形；其啮合按圆柱齿轮副画法。"
components = ["三圆三线：齿顶圆/线粗实线，分度圆/线细点画线，齿根圆/线细实线或省略。", "齿线：非圆视图中三条与螺旋方向一致的细实线。", "齿形：画出一两个圆弧齿廓，或用局部放大图表示。", "圆弧齿轮副：按圆柱齿轮啮合规则绘制（标准图24）。"]
