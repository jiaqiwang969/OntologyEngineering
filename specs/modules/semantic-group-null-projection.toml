statement="A prepared source UPDATE retains the original missing lazy/_vars analysis: Unanalyzed is not upgraded to a QUERY-analyzed scope. LeftJoin reuses the existing source_optional_evaluator with absent left_scope, matching original evalLeftJoin when p1._vars is None; no invented isolated-scope retry. Only the sealed frontend TrueFilter absence, physically lowered to native true, is unconditional; user-authored expressions that survive the original translation retain source evaluation. The original translateGroupGraphPattern truth guard may omit a lone false Literal before OPTIONAL receives TrueFilter; this is not permission to make retained false expressions unconditional. Union delegates to the existing source-aware ordered materializing compiler, preserving both branches, duplicates and either branch failure. A surrounding Unanalyzed non-lazy Join separately materializes its right side as a set and may deduplicate equal Union solutions before UPDATE templates. Templates consume the actual resulting rows; branch failure is not filtered into success or partial current-WHERE application. No new AST interpreter, engine or value downgrade."
severity="error"

