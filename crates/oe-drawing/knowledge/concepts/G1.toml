[[concepts]]
id = "DC-G1-035"
name = "相贯线"
aliases = []
group = "G1"
kind = "line"
meaning = "两个立体（如两圆柱、圆柱与圆锥、球）相交时表面上的交线；可见部分用粗实线、不可见部分用细虚线画出，常可用圆弧或直线简化。"
components = ["可见相贯线为粗实线（No.01.2.3），不可见为细虚线。", "两回转体的相贯线一般为闭合空间曲线，特殊情况为平面曲线或直线（如等径正交圆柱为两条相交直线）。", "简化画法：用圆弧或直线代替非圆曲线，也可用模糊画法，但不得影响理解。", "转向轮廓线只画到相贯线上的点为止，不穿入另一立体。"]
variants = ["visible: thick solid", "hidden: thin dashed"]
dxf_forms = ["ARC (simplified; radius usually that of the larger cylinder), SPLINE or LWPOLYLINE on the thick layer", "pair of crossing LINEs for equal-diameter cylinders", "dashed ARC/SPLINE for a hidden intersection", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "锚点：两组回转体轮廓（两对平行素线互相垂直或斜交）之间的一条曲线（ARC/SPLINE），两端恰在两立体转向轮廓的交点处。简化圆弧的半径约等于较大圆柱的半径，凸向较大圆柱的轴线；等径正交时为两条交叉直线。粗实线、端点与轮廓相接为相贯线；细实线且端部留隙为过渡线。"
confusions = ["过渡线：细实线，端部留空隙，用于圆角过渡处。", "可见棱边线：平面交线，多为直线。", "截交线：平面与立体的交线。", "普通轮廓：不位于两立体交界。"]
related = ["DC-G1-054", "DC-G1-026", "DC-G1-014", "DC-G3-125"]
