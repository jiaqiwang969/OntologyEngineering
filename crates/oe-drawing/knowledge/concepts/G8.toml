[[concepts]]
id = "DC-G8-004"
name = "拆卸画法（拆去××等）"
aliases = ["拆卸画法"]
group = "G8"
kind = "conventional_representation"
meaning = "装配图中当某些零件遮住了需要表达的结构或装配关系时，可假想把这些零件拆去后再画该视图；需要说明时在该视图上方注写“拆去××等”。"
components = ["视图中不画被拆去的零件（如扳手、轴承盖），原来被它挡住的零件按可见轮廓画出。", "视图上方注写说明文字，如“拆去扳手13”“拆去轴承盖等”“拆去件号8~13”，字高与视图名称相当。", "被拆零件在其他视图中仍正常画出并编有序号。"]
variants = []
dxf_forms = ["TEXT/MTEXT '拆去…等' placed above the view (layer 11), sometimes on the same line as the view name", "remaining parts as ordinary LINE/ARC/HATCH geometry; no geometry for the removed parts"]
recognition = "以内容以“拆去”开头的文字为锚点：它位于某一视图包络框的上方（间距约1~3倍字高），可带件号或零件名，末尾常有“等”。把它关联到其下方最近的视图，再在明细栏中查出被拆零件，确认它在其他视图中出现。与视图名称的区别：视图名称为“A”“A—A”“B向”等字母形式，没有“拆去”二字。"
confusions = ["视图名称或向视图标注：只有字母和“向”字。", "沿结合面剖切：可与拆卸画法同时出现，但有剖切符号和剖面线断面。", "局部视图：只画一部分，有波浪线边界；拆卸画法视图是完整视图但缺件。", "未画完的装配图：没有“拆去”说明且明细栏零件在各视图都找不到时才怀疑不完整。"]
related = ["DC-G8-006", "DC-G2-065", "DC-G2-076", "DC-G8-025"]
priority = "medium"
text_forms = ["拆去扳手13", "拆去轴承盖等", "拆去件号8~13", "拆去××等"]
knowledge_units = ["K11", "K12", "K13"]
