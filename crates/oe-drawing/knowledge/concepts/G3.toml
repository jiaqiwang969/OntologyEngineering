kind = "symbol"
meaning = "在紧固组合简化表示中，当孔的轴线平行于投影面时，用一条贯穿被连接板件的细实线表示孔，并以粗实线V形标记表示沉孔、以斜线小旗表示在工程现场钻孔。"
components = ["一条细实线沿孔轴线贯穿各层板件，两端伸出板外表面少许。", "一侧有沉孔时，在该侧板面处画一个粗实线V形（开口朝外的箭头状）标记；两侧有沉孔时两侧都画。", "在工程现场钻孔时，从轴线引一条斜线，末端加小旗；车间钻孔不加旗。", "孔符号在板外不画表示头部和尾部的粗短竖线，以此区别于螺栓或铆钉装配符号。"]
variants = ["无沉孔", "一侧有沉孔", "两侧有沉孔", "车间钻孔", "在工程现场钻孔"]
dxf_forms = ["LINE on layer 02 (thin) for the hole axis; thick LINE pairs on layer 01 for V countersink marks; flag as small LWPOLYLINE/triangle on an oblique LINE", "INSERT from a steel-structure symbol library, repeated along a joint"]
recognition = "锚点为一条与板面垂直、穿过两层以上平行板件轮廓的短细实线（长度略大于板总厚）。若在板面处有一对粗短斜线构成“<”或“>”则为沉孔；附有斜线小旗为现场钻孔；若板外两端还有粗短竖线则为螺栓/铆钉装配符号而非孔。区分中心线：孔中心线为细点画线且两侧伴有孔壁轮廓线（虚线或粗线）。"
confusions = ["孔的中心线：细点画线，两侧有孔壁轮廓线。", "现场焊缝符号的小旗：位于焊缝指引线与基准线的交点处，不在孔轴线的斜引线上。", "螺栓或铆钉装配符号：板外两端有粗短竖线表示头部和尾部。"]
related = ["DC-G3-193", "DC-G3-194", "DC-G3-127", "DC-G7-138", "DC-G3-084", "DC-G4-045"]
