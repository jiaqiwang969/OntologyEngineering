recognition = "以文字为主锚点：在技术要求中匹配“起模斜度|拔模斜度|脱模斜度”及“1:\\d+”或“\\d+(%%d|°)”。几何证据为辅：标题栏材料为铸造材料（HT、QT、ZG、ZL等）时，侧壁两条轮廓线有约1:10–1:50的微小不平行，且方向与分型面垂直。与锥度区分：锥度是回转面关于轴线对称收缩，用锥度符号注出；与功能斜度区分：功能斜面必须画出并用斜度符号标注；没有文字支持的轻微不平行不判为起模斜度。"
