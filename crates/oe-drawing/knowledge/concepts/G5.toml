recognition = "锚点为第二格中圈内为 P 的带圈符号（圆半径约 0.35–0.4H），位于公差值之后；紧跟数字时为间接长度。再沿被测孔轴线向实体外找细双点画线（07 层/双点画线线型）及带 Ⓟ 前缀的方框尺寸，作为延伸部分。不带圈的 P 是峰高参数；PD 是节径说明。"
confusions = ["参数 P（峰高，无圈）", "螺纹/齿轮的 PD", "自由状态 Ⓕ 及其他带圈字母", "表面结构的 P 参数"]
