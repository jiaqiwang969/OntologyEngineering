recognition = "以基准符号附近（≤3h）一段“字母+数字(,数字)*”的文字为锚，且图上存在同字母、对应序号的基准目标框；或基准三角形贴在一段粗点画线上、或其参照线指向双点画线围出的阴影小区时，判为由基准目标建立的基准。"
