recognition = "两级锚点：（1）文字含“重要特性”“关键特性”“关键件”“重要件”；若写有“×处”，用数字核对标记数量。（2）尺寸文字中或尺寸数字旁出现的专用标记字符（☆、★、△或带框字母），字高与尺寸字高相当，数量应与“×处”一致。与标题栏更改区的“标记”列（更改标记字母）和阶段标记区分。"
confusions = ["标题栏更改区“标记”列：更改标记，在标题栏内。", "阶段标记：标题栏中的阶段字母。", "理论正确尺寸的方框、参考尺寸的括号：是尺寸性质，不是重要程度。"]
related = ["DC-G9-002", "DC-G9-023", "DC-G9-027", "DC-G4-009"]
