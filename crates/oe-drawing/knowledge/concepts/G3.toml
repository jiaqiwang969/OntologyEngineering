[[concepts]]
id = "DC-G3-188"
name = "结构要素符号（长的粗实线）"
aliases = ["结构要素符号（长的粗圆弧线）", "结构要素符号（滚动体）"]
group = "G3"
kind = "symbol"
meaning = "滚动轴承特征画法使用的结构要素符号：长的粗实线表示非调心轴承滚动体的滚动轴线，长的粗圆弧线表示调心表面或滚动轴线包络线，短的粗实线（或圆、宽矩形、长矩形）表示滚动体的列数和位置。"
components = ["长的粗实线：表示非调心（1998版称不可调心）轴承滚动体的滚动轴线，可按轴承类型倾斜画出。", "长的粗圆弧线：表示调心（1998版称可调心）轴承的调心表面或滚动体滚动轴线的包络线，也可倾斜画出。", "短的粗实线：与长线或圆弧成90°（或沿法线）相交，并通过每个滚动体中心，表示滚动体的列数和位置。", "可供选择的替代符号：圆表示球，宽矩形表示圆柱滚子，长矩形表示长圆柱滚子或滚针；2017版注明可替代短线，1998版注明用于规定画法中。"]
variants = ["2017称非调心", "1998称不可调心", "倾斜画出（角接触、圆锥）", "2017称调心", "1998称可调心", "短的粗实线", "圆（球）", "宽矩形（圆柱滚子）", "长矩形（长圆柱滚子、滚针）"]
dxf_forms = ["LINE (long and short) and ARC entities on layer 01 with thick lineweight, inside the bearing frame", "Small CIRCLE or LWPOLYLINE rectangle replacing the short line in some library blocks", "Usually nested in a bearing INSERT; exploded drawings keep them as loose strokes"]
recognition = "只在已识别的滚动轴承框内解释：长线或长圆弧（长度为框宽或框高的1/2～2/3）与短线（约为长线的1/4～1/3）正交相交、均不触框；圆或矩形位于长线上时代替短线。长线方向和是否为圆弧决定承载与调心属性，短线数决定列数。框外的同类线条不作此解释。"
confusions = ["静态密封要素：贴靠长边的长线，没有正交短线穿过。", "防尘副唇短线：与斜线成90°且从斜线上分出，不穿过长线。", "一般圆弧轮廓或剖面中的圆孔：不在轴承框内居中，无短线配合。"]
related = ["DC-G3-119", "DC-G3-124", "DC-G3-123", "DC-G3-128", "DC-G3-116", "DC-G3-103"]
