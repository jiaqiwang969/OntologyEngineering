[[concepts]]
id = "DC-G4-007"
name = "半径由其他尺寸确定的注法（R无数值）"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "当圆弧半径由其他已注尺寸（如槽宽、两切线位置）决定时，仍画半径尺寸线并写符号 R，但不写数值，表示半径需由其他尺寸推出、不单独控制。"
components = ["半径尺寸线：沿径向，一端箭头指向圆弧", "符号 R：单独一个字母，后面不跟数字", "确定该弧的其他尺寸：如两平行边的间距（全圆头槽宽）或圆弧两端的定位尺寸"]
variants = []
dxf_forms = ["DIMENSION dimtype 4 with override text 'R' (code 1 = 'R'); code 42 still holds the measured radius", "exploded: radial LINE + SOLID arrow + TEXT 'R'", "LEADER/MULTILEADER with text 'R'"]
recognition = "锚点为内容恰好为“R”（去空格后无数字）的文字，并与一条径向尺寸线和落在圆弧上的箭头关联。再检查该弧两端是否与两条平行直线相切，且有一个线性尺寸注出这两条直线的间距（≈2×弧半径），或弧被其他定位尺寸完全确定→判为“半径由其他尺寸确定”。DIMENSION 类型4的覆盖文字为“R”时可直接识别；组码42的实测值只作参考，不是要求值。与漏写数值区分：本概念是有意写出的单独 R，漏写通常是空文字；与技术要求中的 R 区分：后者后面有数值且无尺寸线。"
