meaning = "按GB/T 4459.5的中心孔规定表示法，中心孔工作表面的粗糙度要求写在中心孔标记的引出线上。"
components = ["轴端面画出对中心孔要求的符号，随后用引出线注出中心孔标记。", "表面结构代号附在同一引出线上，作用于中心孔工作锥面。", "同一轴两端中心孔相同时可只在一端标出并注数量，代号同样只注一次。"]
