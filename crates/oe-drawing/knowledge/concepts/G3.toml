components = ["图形按对称件处理（如画成对称图形或只画一半），对称中心线为细点画线，只画一半时两端加对称符号。", "说明文字：靠近不对称结构或用指引线注出，如“仅左侧有二孔”。", "尺寸可按对称件注法标注。"]
