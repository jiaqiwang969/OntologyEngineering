[[concepts]]
id = "DC-G8-009"
name = "序号指引线"
aliases = []
group = "G8"
kind = "line"
meaning = "装配图中把零部件与其序号连接起来的细实线引线：从所指零件的可见轮廓内引出，起点画一个实心小圆点，另一端接序号的水平基准线或圆，或直接在端部附近写序号。"
components = ["起点：在零件可见轮廓区域内部画实心小圆点（出图后直径约1 mm）。", "线身：细实线，一般为斜线；可以画成折线，但只能折一次。", "各指引线互不相交；穿过剖面线区域时不得与剖面线平行，以免混淆。", "终端：接水平细实线基准线或细实线圆，或不画基准而直接在附近注写序号。"]
variants = ["dot end (normal)", "single kink"]
dxf_forms = ["LEADER entity with arrowhead block _DotSmall or _Dot (DIMLDRBLK) on layer 09 or 02", "MULTILEADER (MLEADER) with arrowhead _DotSmall and block content _TagCircle or text content", "exploded: LINE (or two-segment LWPOLYLINE) + DONUT (closed LWPOLYLINE of two arcs with constant width) or a small CIRCLE filled by HATCH SOLID", "AutoCAD Mechanical / GstarCAD Mechanical balloons as proxy entities or anonymous *U blocks containing the leader"]
recognition = "以实心小圆点为锚点：直径约为序号字高的0.2~0.3倍的实心点（DONUT、填充小圆或_DotSmall箭头块）位于某个闭合轮廓（零件区域）内部；从它出发的细线不超过两段（折一次），终点在零件外部，附近有一个整数文字（字高大于尺寸字高）及短水平线或细实线圆。再检查：线段与所穿过区域的剖面线方向不平行，与其他同类指引线不相交。与尺寸界线的区别：尺寸界线从轮廓端点成对引出、垂直于尺寸线、无圆点；与焊缝指引线的区别：焊缝箭头线接带焊缝符号的基准线；与注释引线的区别：注释引线多为箭头终端、末端为说明文字。"
confusions = ["尺寸界线：从轮廓或其延长线成对引出，没有起点圆点。", "焊缝指引线：箭头终端，基准线上有焊缝符号，常配虚线基准线。", "带箭头的注释指引线：末端是说明文字或标记（表面处理、螺纹标记等），不是单个整数。", "局部放大图的标注：细实线圆圈住被放大部位，旁注罗马数字。"]
related = ["DC-G8-024", "DC-G8-010", "DC-G8-008", "DC-G1-095", "DC-G1-028", "DC-G1-018"]
priority = "high"
text_forms = []
knowledge_units = ["K15"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "圆点大小比例与 _DotSmall、DONUT 等存储形式来自一般 CAD 实践。"
