statement="Equal/Less/Greater relations compare Integer, Decimal and Binary64 numeric values exactly within admitted input budgets. Integer/Binary64 comparison uses the actual integer and binary significand; Decimal comparison uses sign, coefficient and exponent without context arithmetic rounding, exponent-sized powers or an intermediate rounded subtraction. Scale and signed zero do not become unequal numeric values. Representation equality and RDF ordering remain different owners."
severity="error"

[[constraints]]
id="semantic_numeric_comparison_signals"
