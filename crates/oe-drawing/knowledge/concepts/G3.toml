[[concepts]]
id = "DC-G3-059"
name = "装配图中弹簧遮挡画法"
aliases = ["装配图中弹簧画法"]
group = "G3"
kind = "conventional_representation"
meaning = "装配图中螺旋弹簧后面被挡住的零件结构一般不画，可见部分的轮廓从弹簧外轮廓线或从簧丝剖面的中心线处开始画，避免轮廓线穿过弹簧。"
components = ["弹簧（多为剖视）：两侧成排的簧丝断面（小圆或涂黑），按节距等距排列，两排关于弹簧轴线对称，外轮廓为断面的公切线。", "被挡零件的粗实线轮廓在弹簧外轮廓线处或簧丝断面中心连线处截止，不进入弹簧区域。", "簧丝断面在图上直径不大于2 mm时，可改用单线示意画法，被剖切时也可将断面涂黑。", "中间圈省略时，两端之间用通过簧丝断面中心的细点画线相连。"]
variants = ["从弹簧外轮廓线画起", "从钢丝剖面中心线画起", "不画挡住部分", "簧丝示意画法", "簧丝断面涂黑"]
dxf_forms = ["CIRCLE (or small closed LWPOLYLINE) wire sections in two rows symmetric about the spring axis, on the thick-line layer (GB/T 14665 layer 01), filled by HATCH ANSI31 or SOLID (black fill when the wire is ≤2 mm on paper)", "LINE tangents between successive wire sections forming the spring envelope (thick); schematic form: one thick zigzag LWPOLYLINE", "LINE/ARC outlines of the hidden-behind parts on layer 01 whose endpoints are trimmed exactly onto the spring envelope or onto the wire-centre chain line", "Thin chain LINE (CENTER/ACAD_ISO04W100 linetype, layer 05) through the wire centres where middle coils are omitted", "Spring from a CAXA/GstarCAD Mechanical spring generator as INSERT of a block, often exploded into the strokes above on export"]
recognition = "锚点为成排等距的簧丝断面：直径d的小圆（或涂黑圆）、中心距为节距t，两排关于弹簧轴线对称，排间距为弹簧中径D。在该矩形包络（宽≈D+d）内检查其他零件的粗实线：本画法下其端点恰好落在簧丝外公切线（距断面中心d/2）或簧丝中心连线上，不进入包络内部；若被挡轮廓穿过弹簧或用虚线画出，则不属本规定。涂黑小断面需呈等节距成排且两侧对称才判为弹簧，单个细长涂黑条是薄件涂黑。"
confusions = ["普通可见性规则：一般被遮挡轮廓可画虚线；弹簧后面的结构直接不画，轮廓在弹簧包络或簧丝中心线处截止。", "薄件（垫片）断面涂黑：为细长条；簧丝涂黑断面为按节距成排、两侧对称的小圆点。", "链条或滚子排列：链节为板件轮廓交替连接，没有贯通两排断面的公切线和弹簧轴线。"]
related = ["DC-G3-017", "DC-G3-113", "DC-G3-130", "DC-G8-019", "DC-G2-057", "DC-G1-044"]
priority = "medium"
text_forms = []
knowledge_units = ["K13", "K38", "K15"]
