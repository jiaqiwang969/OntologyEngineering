components = ["特征符号：两条平行斜线“//”，与水平约 60°–70°，长约 0.6–0.7H", "第二格：公差值；被测为轴线时可加 Ø（圆柱带）；可带局部长度如 0.08/100", "被测为面上的线素时在框格右侧加相交平面框格", "基准格：至少一个基准"]
