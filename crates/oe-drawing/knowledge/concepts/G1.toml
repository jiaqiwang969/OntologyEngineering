[[concepts]]
id = "DC-G1-044"
name = "细点画线"
aliases = []
group = "G1"
kind = "line"
meaning = "线宽为细线的长画点画线（单点长画线），用于轴线、对称中心线、分度圆（线）、孔系分布的中心线和剖切线。"
components = ["线型04，线宽约0.5d；线素长画约24d、短间隔约3d、点不大于0.5d；手工常用长画约15~20 mm、间隔约3 mm。", "首末两端为长画，相交处在长画上；超出轮廓约2~5 mm；过短时用细实线代替。", "CAD 分层05层，屏幕显示红色。"]
variants = ["线素：长画 24d, 短间隔 3d, 点 ≤0.5d"]
dxf_forms = ["LINE/ARC/CIRCLE with a dash-dot linetype (CENTER, CENTER2, DASHDOT, ACAD_ISO04W100 or e.g. 点画线/中心线), thin lineweight, layer 05 / 中心线 / CENTER, colour red (ACI 1)", "AutoCAD CENTER/CENTER2 are long dash + short dash (render like dash-dot); ACAD_ISO04W100 is 24, -3, 0, -3 with a true dot", "DIMCEN with a negative value draws centre lines beyond circles", "exploded form: a run of collinear (or concentric) short LINE/ARC pieces with a regular dash–gap period, typical of PDF→DWG conversion or exploded linetypes; rejoin by collinearity and period before classifying", "visible dash length = LTYPE pattern × header $LTSCALE × entity linetype scale (group 48) (× $PSLTSCALE rules in paper space)", "the same entities nested in an INSERT (view, symbol or frame block); apply the INSERT transform (scale, rotation, mirror) before measuring"]
recognition = "由线型图案（长画+间隔+点或短画+间隔）或图层、颜色判定；长画约为虚线画长的2倍。几何用途：直线位于回转体两侧对称轮廓的中线→轴线；两正交线交于圆心→圆中心线；点画线圆上有孔心→孔系中心线；点画线圆与粗实线圆同心且无孔→分度圆；端部连粗短画→剖切线。"
confusions = ["细双点画线：两个点或两个短画。", "长画短画线：CENTER 线型名义上属此型，机械图中当点画线用。", "细虚线：无长画，画长较短。", "粗点画线：粗线宽，表示限定范围。"]
related = ["DC-G1-052", "DC-G1-021", "DC-G1-006", "DC-G1-020", "DC-G1-008", "DC-G1-033", "DC-G1-061"]
