[[concepts]]
id = "DC-G3-069"
name = "销连接画法"
aliases = []
group = "G3"
kind = "conventional_representation"
meaning = "装配图中剖切平面通过销的轴线时，销按不剖画（不画剖面线）；用于定位的销孔通常在装配时与相配零件一起加工，零件图上注“配作”。"
components = ["销画外形：圆柱销为矩形（两端可带小倒角或倒圆），圆锥销为1:50锥度的窄梯形。", "销与孔为配合，孔壁与销轮廓重合，画单线。", "被连接两零件剖面线方向相反，画到销轮廓为止。", "零件图上的销孔常注“配作”或“与件×配作”。"]
variants = []
dxf_forms = ["Small rectangle or slender trapezoid (LINE×4 or closed LWPOLYLINE, thick) crossing the joint line, with a CENTER-linetype axis LINE, no HATCH inside", "HATCH ANSI31 of the two joined parts in opposite directions bordering the pin outline", "TEXT/MTEXT near the pin hole on part drawings: 配作 / 与件2配作 / leader note with hole size", "INSERT of a standard pin block (CAXA/ACM library), often exploded"]
recognition = "锚点为装配剖视中横跨两零件结合面（单条粗实线）的小矩形或窄梯形“岛”：长宽比约3–10，内部无剖面线，两侧剖面线方向相反且止于岛边；岛边与孔壁重合为单线（无间隙双线）。两长边微收敛（约1:50）判为圆锥销。与螺钉区分：无螺纹细线、无头部；与键区分：键位于轴槽内，顶面与轮毂槽底有间隙双线；与实心轴区分：销短小且只跨越结合面。零件图上以“配作”文字在销孔附近作辅证。"
confusions = ["实心轴不剖：轴长、带台阶、贯穿多个零件。", "键联结：键顶与轮毂槽底有间隙（双线），销与孔无间隙。", "螺钉连接：有大小径双线和头部。"]
