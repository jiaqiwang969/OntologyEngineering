meaning = "手工绘图时，与投影面倾斜角度不大于30°的圆或圆弧，其投影本应为椭圆，可以简化画成圆或圆弧。"
components = ["适用条件：圆所在平面与投影面的夹角不大于30°，且为手工绘图。", "画法：用圆或圆弧代替椭圆。", "其余图线照常按投影画出。"]
