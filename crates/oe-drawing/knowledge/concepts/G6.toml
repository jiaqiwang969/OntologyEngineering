recognition = "锚点：完整符号位置d的单个大写R，后面不接数字或小写字母。区分半径R（后接数值，属尺寸）、R轮廓参数代号（R后接小写字母，在横线下方）、圆锥外螺纹R（后接尺寸代号）、可逆要求Ⓡ（带圆圈，在框格内）。"
confusions = ["半径R：后接数值，属于尺寸", "R轮廓参数Ra、Rz：后接小写字母，在横线下方", "管螺纹R：后接尺寸代号", "可逆要求Ⓡ：带圆圈，位于公差框格内"]
