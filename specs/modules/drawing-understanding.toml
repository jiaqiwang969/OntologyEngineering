# ---------------------------------------------------------------- drafting rules of the ontology

[[sources]]
id = "drafting_ontology"
identity = "crates/oe-drawing-check/knowledge/drafting-ontology.toml (ontology and SHACL shapes of the first and second batches of drafting rules); GB/T 14665-2012 4.3 overlapping-line precedence; GB/T 4458.4-2003 4.1.1, 4.1.3, 4.1.5, 4.2.1, 4.2.2, 4.2.3, 4.2.5, 4.3.2, 4.3.4 and 图1, 图12, 图15, 图18, 图19, 图24 dimensioning; GB/T 4457.4-2002 表1 line types 01.1.2, 01.1.3, 01.1.5, 01.1.21, 04.1.2; GB/T 4458.6-2002 5.6, 6.1 and GB/T 17452-1998 6.3, 8.2 local sections and section names; GB/T 17453-1998 4.6 hatching broken at text; GB/T 4457.5-2013 4.7 and GB/T 17453-2005 5 hatching of one part; GB/T 18229-2000 4.2, 4.5 CAD scale and hatching; GB/T 4457.2-2003 3.1 leaders; GB/T 14690-1993 4.1, 4.2, 5.2 scales; GB/T 14692-2008 5.2.1.5 and GB/T 4458.1-2002 5.7.2 view names; GB/T 1182-2018 8.2.2 tolerance zone shape; GB/T 17851-2022 7.2.1 datum letters; GB/T 1031-2009 表1, 表2 roughness series"
role = "Drafting rules as ontology constraints: each shape names the concepts of the catalogue and the clause it formalizes; evaluated by the framework's SHACL engine on exported facts, never used as recognition input"
applicability = "The classes and predicates of the fact contract; findings are deviations to review on the named layer"

