[[concepts]]
id = "DC-G8-021"
name = "装配图中相同单元的简化画法"
aliases = []
group = "G8"
kind = "simplified_representation"
meaning = "装配图中有若干相同的单元（如相同的组件、模块）时，可以只详细画出一个单元，其余单元只画出外框，并在框内注写表示与第一个单元相同的标记，如“2=1”“3=1”。"
components = ["第一个单元详细画出，作为单元1。", "其余单元只画外框（单元边界），框内空白。", "空框内注写等同标记，如“2=1”表示第2个单元同第1个单元。"]
variants = []
dxf_forms = ["rectangles as closed LWPOLYLINE on layer 01/02 with a TEXT like '2=1' at the centre"]
recognition = "以内容匹配“^\\d+\\s*=\\s*\\d+$”的文字为锚点：它的外面有一个与某个详细画出的单元外框尺寸相同的空矩形或空轮廓，框内除该文字外没有其他图元；几个框尺寸相同、排列规则。与表格的区别：表格有行列格线和多个单元格文字。"
confusions = ["空白框或预留区：没有“n=1”这类等同标记。", "表格：格线多、文字多。", "公式或尺寸关系文字：不位于空框中心。"]
