[[concepts]]
id = "DC-G4-036"
name = "键槽深度尺寸（d−t1、d+t2）标注"
aliases = []
group = "G4"
kind = "dimension_element"
meaning = "平键键槽的深度不直接注槽深t，而注便于测量的组合尺寸：轴槽注d−t1（槽底到轴对侧轮廓），其极限偏差取t1的偏差但改为负号；轮毂槽注d+t2（槽底到孔对侧轮廓），偏差取t2的正偏差。"
components = ["轴槽：在键槽处的移出断面中，用线性尺寸从槽底到轴的对侧轮廓注出d−t1，例如Ø70轴注62.5，偏差为上0、下−0.2。", "轮毂槽：在轮毂孔的局部视图或剖视中，从槽底到孔对侧轮廓注出d+t2，例如74.9，偏差为上+0.2、下0。", "同时注槽宽b及其公差带代号（如20N9、20JS9），并常附键槽对轴线的对称度公差。", "偏差取自键槽标准中t1、t2的偏差：轴槽组合尺寸只有负偏差，轮毂槽组合尺寸只有正偏差。"]
variants = ["轴槽 d−t1", "轮毂槽 d+t2"]
dxf_forms = ["DIMENSION dimtype 0 (linear) in a removed section, from the keyway-bottom LINE to the opposite quadrant of the circle; deviations via DIMTOL/DIMTP/DIMTM overrides", "override text with stacked deviations, e.g. '<>{\\H0.7x;\\S0^-0.2;}' or MTEXT '62.5\\S0^-0.2;' / '74.9\\S+0.2^0;'", "exploded: LINE + SOLID arrowheads + TEXT/MTEXT with separate small TEXT for the deviations", "layer 08 or template dimension layer"]
recognition = "锚点为键槽断面：圆（轴断面）上有一矩形缺口，或孔圆一侧有矩形凸出槽。寻找一条线性尺寸，其一条尺寸界线在槽底直线上、另一条在圆的对侧切点（象限点）；数值≈直径−t1（小于圆直径）或≈直径+t2（大于孔径），偏差为单向（只有负值且上偏差0，或只有正值且下偏差0）。附近通常还有槽宽尺寸（等于键宽b，带N9/JS9/P9/D10等）和该圆的Ø尺寸。与直径区分：无Ø前缀，数值不等于圆直径，一端在槽底；与直接注槽深区分：槽深数值小，两界线都在槽口与槽底之间。"
confusions = ["直接注槽深t（t1、t2）：数值小，尺寸界线在槽口与槽底之间；组合尺寸跨越整个断面。", "直径尺寸：带Ø，两界线在圆的对边；组合尺寸无Ø且一端在槽底。", "槽宽b：方向与深度垂直，带键槽公差带代号。"]
related = ["DC-G4-003", "DC-G4-002", "DC-G4-127", "DC-G4-132", "DC-G3-072"]
priority = "medium"
text_forms = ["62.5（上偏差0，下偏差−0.2）", "74.9（上偏差+0.2，下偏差0）", "(d−t1)", "(d+t2)", "20N9"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21", "K35", "K39"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Example values from the interchangeability textbook 图6.10 and the note to 表6.10 (combined-size deviations taken from t1/t2, negative for d−t1). DXF details are general practice."
