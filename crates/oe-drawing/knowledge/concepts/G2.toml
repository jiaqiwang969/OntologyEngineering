id = "DC-G2-015"
name = "几个平行剖切平面获得的剖视图（阶梯剖）"
aliases = ["阶梯剖"]
group = "G2"
kind = "section"
meaning = "用几个互相平行的剖切平面剖开机件所得的剖视图（习惯称阶梯剖）：剖切符号在转折处成直角，剖视图中不画转折处的界线，图形内不应出现不完整要素。"
components = ["剖切符号：起、迄处粗短画加箭头和字母，转折处画直角形粗短画并注同一字母（位置有限且不致误解时可省略转折处字母）。", "剖切平面：相互平行，转折段与之垂直；转折位置不应与轮廓线重合。", "剖视图：如同由一个平面剖得，不画转折界线，剖面线连续一致。", "例外：两个要素有公共对称中心线或轴线时可各画一半，以该中心线为界。"]
