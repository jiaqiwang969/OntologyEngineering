[[concepts]]
id = "DC-G3-161"
name = "对称符号（对称机件只画一半或四分之一）"
aliases = ["对称符号"]
group = "G3"
kind = "symbol"
meaning = "对称机件在不致引起误解时可只画一半或四分之一，并在对称中心线的两端各画两条与之垂直的平行细实线，作为对称符号。"
components = ["对称中心线（细点画线）作为所画图形的边界，图形轮廓终止于此。", "中心线两端各画两条短的平行细实线，与中心线垂直，中点落在中心线上。", "只画一半时一条中心线带符号；只画四分之一时两条互相垂直的中心线均带符号。", "对称尺寸的尺寸线略超过对称中心线，只在一端画箭头。"]
variants = ["half view", "quarter view"]
dxf_forms = ["Two short parallel LINEs on layer 02 (or 08) at each end of a centre LINE on layer 05", "INSERT of a symmetry-mark block from GB templates or the CAD symmetry command", "Half-view outline LINE/ARC ending exactly on the centre line; one-sided DIMENSION with suppressed second arrow/extension (DIMSD2/DIMSE2)"]
recognition = "以细点画线中心线的端点附近成对出现的两条短细实线为锚点：两线互相平行、都垂直于中心线、中点在中心线上、彼此间距约为线长的1/4～1/3，位于图形轮廓之外的中心线伸出段上；同时图形轮廓终止于该中心线而不越过。若有尺寸只画一个箭头且尺寸线越过中心线，可确认。与双折线、波浪线区分：后者为曲折线且横跨轮廓；与半剖视区分：半剖视两半均画出。"
confusions = ["双折线、波浪线断裂边界：曲折的细线，横跨图形轮廓，不在中心线端。", "半剖视图：中心线两侧都画出，一半剖视一半外形，没有对称符号。", "平面符号：矩形内两条相交细实线对角线。", "剪切符号或等号形短线：不与点画线中心线垂直相交。"]
related = ["DC-G1-021", "DC-G4-015", "DC-G4-089", "DC-G2-020", "DC-G2-036", "DC-G3-095", "DC-G3-136"]
priority = "high"
