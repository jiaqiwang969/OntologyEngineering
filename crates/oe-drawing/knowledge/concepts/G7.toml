[[concepts]]
id = "DC-G7-134"
name = "焊缝基本符号组合"
aliases = []
group = "G7"
kind = "weld_indication"
meaning = "标注双面焊缝或接头时把两个基本符号分别画在基准线两侧组合使用，如双面V形（X）、双面单V形（K）、带钝边双面V形、带钝边双面单V形、双面U形，以及对称角焊缝、双面I形、带钝边双面J形等。"
components = ["上下两个基本符号：通常关于基准线镜像，也可不同（如上V下U）。", "虚线：对称时省略；不对称时保留以区分两侧。", "尺寸：可分别标在两侧。"]
variants = ["X焊缝", "K焊缝", "带钝边双面V形", "带钝边双面单V形", "双面U形"]
dxf_forms = ["strokes crossing the reference line (exploded LINE/ARC) or a single block INSERT containing both halves", "INSERT of a weld-symbol block (user block named e.g. 焊缝/HJ/WELD, or CAXA/GstarCAD anonymous block *U…) that bundles arrow line, reference line, symbol strokes and size TEXT/ATTRIB; explode or walk the block definition to read strokes"]
recognition = "在基准线两侧都检测到基本符号笔画且共享同一横坐标（竖向对齐）时，组合为双面焊缝；两侧符号相同且基准线无虚线→对称焊缝。分别识别上、下两个符号的类型，再查组合名称表（X、K、双Y等）。"
confusions = ["单个基本符号（只在一侧）。", "文字X、K：TEXT字符，高约h且不跨线。"]
