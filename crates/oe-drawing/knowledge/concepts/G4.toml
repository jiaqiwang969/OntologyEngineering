[[concepts]]
id = "DC-G4-016"
name = "小尺寸的注法"
aliases = ["小尺寸注法"]
group = "G4"
kind = "dimension_element"
meaning = "尺寸界线间距太小、无法在内部画箭头或写数字时，箭头可画在界线外侧向内指，数字写在外面或引出标注；连续的小尺寸之间可用圆点或斜线代替相邻的箭头。圆和圆弧的小尺寸也可把箭头和数字放在外面。"
components = ["外置箭头：箭头位于两尺寸界线外侧，尖端指向界线，尺寸线向外延长", "外置数字：数字写在尺寸线延长段上方，或用指引线引到空处", "连续小尺寸：共用界线处以小圆点或斜线代替两个箭头，最外两端仍为箭头", "小圆和小圆弧：直径、半径的箭头和数字放在圆外或引出"]
variants = ["arrows outside, number outside", "number led out by leader", "chain of small dimensions with dots"]
dxf_forms = ["single DIMENSION with arrows flipped outside and text moved (DIMATFIT, DIMTIX=0, DIMSOXD, DIMTMOVE=1/2)", "exploded: short LINE pieces outside the extension lines + SOLID arrows pointing inwards + offset TEXT", "chain of small dimensions: DIMBLK1/DIMBLK2 = _DOT/_DOTSMALL or _OBLIQUE at the shared extension line; exploded as small filled circle (LWPOLYLINE donut) or short 45° LINE"]
recognition = "锚点为界线间距小于约2个箭头长（<12d）或小于文字宽度的线性尺寸。特征：箭头三角尖指向界线但三角主体位于界线外侧，或文字中心不在两界线之间；连续链中共享界线处有直径约 d~2d 的实心小圆或长≈h 的45°短斜线。外置箭头所在线段必须与本尺寸线共线。与其他尺寸的箭头区分：不共线；与零件序号圆点区分：序号圆点在零件区域内并接序号指引线；与全图斜线终端区分：此处斜线或圆点只在小尺寸共享界线处出现，其余仍是箭头。"
confusions = ["相邻其他尺寸的箭头：不与本尺寸线共线", "注释指引线：末端是文字说明而非尺寸数字", "零件序号的圆点：位于零件内部，连接序号", "全图采用斜线终端：所有尺寸都用斜线，不限于小尺寸"]
related = ["DC-G4-018", "DC-G4-021", "DC-G4-019", "DC-G4-023", "DC-G4-059", "DC-G4-101"]
priority = "high"
text_forms = []
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "Size thresholds are recognition heuristics, not from the sources."
