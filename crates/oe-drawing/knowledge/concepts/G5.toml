name = "基准目标线"
aliases = []
group = "G5"
kind = "datum"
meaning = "基准目标为一条线时，用细双点画线画出该线（直线、圆或任意形状）；非封闭的目标线两端各画一个十字叉，封闭的不加端点符号；指引线把它连到基准目标框。"
components = ["目标线：细双点画线（05.1），起止位置为理论正确位置，用 TED 给定", "端点：非封闭时两端各一个十字叉；封闭时无端点符号", "指引线与基准目标框（字母+序号）", "旧注法：两个十字叉之间用细实线连接（GB/T 17851-2022 附录 D.2 列为废止）"]
