[[concepts]]
id = "DC-G3-088"
name = "螺纹标记标注（米制螺纹）"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "公称直径以毫米计的螺纹（普通、梯形、锯齿形等）不注单纯直径值，而把标准规定的螺纹标记直接注在大径尺寸线上或螺纹的引出线上，一次说明螺纹种类、规格、公差带、旋合长度和旋向。"
components = ["标记串：特征代号（M、Tr、B等）＋公称直径×螺距（粗牙普通螺纹不写螺距；多线写导程和螺距）＋公差带代号（中径、顶径）＋旋合长度代号（N省略，S/L写出）＋旋向（右旋不写，左旋写LH）。", "载体一：大径的线性尺寸线，两端箭头落在大径线上（外螺纹为牙顶粗实线，内螺纹为牙底细实线），标记取代尺寸数值，前面不加Ø。", "载体二：从螺纹大径处引出的指引线加水平基准线，标记写在基准线上，多用于小螺纹和螺孔。", "螺孔还可按孔的旁注法把螺纹标记与螺纹深度、钻孔深度连写在一个引出标注里。"]
variants = ["注在大径尺寸线上", "注在引出线上"]
dxf_forms = ["DIMENSION (linear/rotated) across the major diameter with override text such as 'M16×1.5-5g6g' (no %%c prefix), on dimension layer 08 / named 尺寸线 layer", "DIMENSION keeping the measured value with prefix/suffix override, e.g. 'M<>-6g' or 'M<>×1.5-6H', so the measurement equals the major diameter", "LEADER/QLEADER/MLEADER, or exploded LINE (leader) + LINE (reference line) + TEXT/MTEXT on the reference line (layer 09/08)", "Exploded or CAXA-exported dimension: LINE dimension line + SOLID or wide LWPOLYLINE arrowheads + TEXT; anonymous dimension blocks *D… referenced by the DIMENSION", "MTEXT may wrap the string in format codes (\\f font, \\H height, \\W width); '×' may be the character × or the letters x/X; LH may sit after the pitch (older form) or at the end (GB/T 197-2003 onward)"]
recognition = "以文字为锚点：匹配以M、Tr、B等特征代号开头、后接直径数值（可带×螺距、Ph/P、括号导程、LH）、再以短横线连接公差带（如6g、5g6g、7H）及S/N/L/LH段的字符串。再核对载体：若为尺寸实体，测量值应约等于标记中的公称直径d，两个界线点落在一对平行线上，且其内侧（外螺纹）或外侧（内螺纹）约0.85d处还有一对平行线（另一直径），粗细关系符合螺纹画法；若为引出标注，引线起点应落在大径线或螺孔圆（3/4细圆弧）上。区分：普通直径尺寸以Ø/%%c开头；孔轴公差带代号紧跟直径且为单一字母加数字（Ø20H7），螺纹公差带以短横线隔开、可成对（5g6g）；管螺纹以G、R、Rc、Rp开头且一律用引出线；带斜线的6H/6g为螺纹副标记。"
confusions = ["直径尺寸：以Ø开头的纯数值，不含螺纹特征代号。", "孔、轴公差带代号（Ø20H7、Ø20g6）：字母紧随直径、无短横线；螺纹公差带用短横线连接且可写中径顶径两组。", "管螺纹标记（G1/2A、Rc3/4）：尺寸代号不是直径，且只能注在引出线上。", "螺纹副标记（M20-6H/6g）：带斜线，出现在装配图。", "表面粗糙度、材料牌号中的字母M（如Mn）或序号文字：没有直径数值与短横线公差段。"]
related = ["DC-G3-223", "DC-G3-224", "DC-G3-231", "DC-G3-232", "DC-G3-219", "DC-G3-024", "DC-G3-005", "DC-G3-081", "DC-G3-087", "DC-G3-089", "DC-G4-059", "DC-G4-088", "DC-G4-114"]
priority = "high"
text_forms = ["M10-6g", "M16×1.5-5g6g", "M20×2-6H-LH", "M24×2LH-6H", "M12-7H", "Tr32×6-7e", "Tr40×14(P7)LH-7e", "B40×7-7A", "M14×Ph6P2-7H-L-LH"]
knowledge_units = ["K13", "K34"]
recognition_cards = ["dimension_text"]
recognizer = "card"
seen_on_drawing = []
expert_checked = false
notes = "0.85d内径比例为教材比例画法的一般经验；LH位置随GB/T 197版本变化（旧版写在螺距后，2003版起写在末尾），来自一般实践而非本条出处。孔的旁注法规则在G4。"
