[[concepts]]
id = "DC-G4-117"
name = "单向极限尺寸 max / min"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "单向极限尺寸：只需限制一个方向的极限时，在该极限尺寸右边注写max（上极限）或min（下极限），如 R5 max、30 min；角度也适用。"
components = ["极限值：直接写允许的最大值或最小值，含R、Ø等前缀", "单向标记：max 或 min（GPS 写法 max.、min.），写在数值右边", "GPS规范：其他修饰符写在max./min.之后"]
variants = ["linear", "angular (e.g. 20′ max)", "GPS: modifier placed after max./min."]
dxf_forms = ["DIMENSION override text '<> max' / 'R<> min' or DIMPOST suffix ' max'", "TEXT/MTEXT like 'R0.5 max' on a leader", "variants 'MAX', 'max.', 'MIN', or Chinese '最大'/'最小' in notes"]
recognition = "锚点：尺寸文字以“max”或“min”（不区分大小写，可带点）结尾，前面是一个数值（可带R、Ø、°）。与统计修饰符SX/SN区分：后者为带框两字母；与技术要求中“最大”“最小”说明区分：本形式紧随尺寸数值并与尺寸线/指引线关联。"
