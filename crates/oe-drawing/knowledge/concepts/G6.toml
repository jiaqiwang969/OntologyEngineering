[[concepts]]
id = "DC-G6-062"
name = "齿轮、花键、螺纹工作表面的注法"
aliases = ["螺纹工作表面的表面结构注法"]
group = "G6"
kind = "surface_indication"
meaning = "齿轮、渐开线花键、螺纹等未画出齿（牙）形时，其工作表面的表面结构代号可注在分度线上，或注在螺纹尺寸线或标记处。"
components = ["齿轮和渐开线花键：代号注在分度圆（分度线，细点画线）上，作用于齿面。", "螺纹：代号注在螺纹大径尺寸线或螺纹标记（如M8×1-6h、Rc1/2）的引出处，作用于螺纹工作面。", "外螺纹与内螺纹分别按其标记注出（1993图23–25；教材为M24×2-6h、M24×2-6H）。", "依据GB/T 131-1993 4.9及图20–25。"]
variants = ["GB/T 131-1993 4.9 图20-图25", "外螺纹", "内螺纹"]
dxf_forms = ["roughness INSERT with apex on the pitch LINE/ARC (dash-dot linetype, layer 05)", "INSERT on the DIMENSION line carrying a thread designation (text 'M8×1-6h')", "LEADER from the thread with TEXT 'Rc1/2' and the symbol on the leader shoulder"]
recognition = "锚点：表面结构符号；若尖端落在细点画线的齿轮或花键分度线上，或所在尺寸线的文字为螺纹标记（M、Tr、G、Rc、Rp、R等开头），则把要求赋给齿面或螺纹牙侧工作面，而不是外轮廓。分度线与齿顶线平行并位于齿顶线和齿根线之间，可借此与轴线区分。区分螺纹标记文字本身和普通轮廓上的代号（作用于外表面）。"
confusions = ["螺纹标记文字：只是规格代号", "轴线/中心线：细点画线位于对称中心，不在齿顶与齿根之间", "普通轮廓上的代号：作用于外表面"]
related = ["DC-G6-023", "DC-G6-051", "DC-G6-047", "DC-G3-022", "DC-G3-031", "DC-G3-223", "DC-G3-215"]
priority = "medium"
text_forms = ["M8×1-6h + Ra 3.2", "M24×2-6H", "Rc1/2"]
