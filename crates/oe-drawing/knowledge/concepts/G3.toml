[[concepts]]
id = "DC-G3-089"
name = "螺纹长度标注"
aliases = []
group = "G3"
kind = "dimension_element"
meaning = "图上注出的螺纹长度默认是不含螺尾的有效（完整）螺纹长度，量到螺纹终止线为止；若长度包含螺尾，必须另加说明或按实际需要标注。"
components = ["外螺纹：长度尺寸从螺纹起始端面（可含倒角）量到螺纹终止线（粗实线）。", "内螺纹（螺孔）：螺纹深度从孔口端面量到螺纹终止线，钻孔深度另行标注（量到钻尖锥顶之前的圆柱部分）。", "需包含螺尾时：尺寸界线从螺尾末端引出，或用文字/技术要求注明长度含螺尾。"]
variants = ["有效螺纹长度（默认）", "含螺尾时另行说明或标注"]
dxf_forms = ["Linear DIMENSION parallel to the thread axis; one definition point on the end face, the other on the thread end line (thick LINE perpendicular to the axis)", "Tapped-hole callout on a leader: TEXT/MTEXT like 'M8-7H↧12' (depth glyph from a symbol font or shape) or older wording 'M8-7H深12', optionally a second line for drill depth", "Exploded dimension strokes (LINE + arrowheads + TEXT) on layer 08"]
recognition = "以螺纹终止线为锚点（垂直于轴线的粗实线，外螺纹长约等于大径d，两端接牙顶粗线）。寻找平行于轴线、一个尺寸界线点落在该终止线上、另一个落在轴端面或孔口端面的线性尺寸，即螺纹长度。若另一端落在终止线外侧30°细斜线（螺尾）的末端，则为含螺尾长度，应同时找到说明文字。区分钻孔深度：钻孔深度的界线落在钻孔圆柱段末端（钻尖锥体之前），盲孔中通常比螺纹深度多约0.5d；区分台阶长度或总长：其界线落在轮廓台阶或零件最外端面，而不是螺纹终止线。"
confusions = ["钻孔深度：界线在钻孔圆柱段终点，大于螺纹深度。", "轴段长度或总长：界线在台阶面或端面，与螺纹终止线无关。", "含螺尾长度：界线落在螺尾30°细线末端，并应有说明。", "花键长度标注：针对花键工作长度及尾部，不是螺纹。"]
related = ["DC-G3-094", "DC-G3-093", "DC-G3-002", "DC-G3-086", "DC-G3-024", "DC-G3-005", "DC-G3-088", "DC-G4-052", "DC-G4-088"]
priority = "high"
text_forms = ["20", "M10-6H↧15", "M10-6H深15", "螺纹长度含螺尾"]
knowledge_units = ["K13", "K34"]
recognition_cards = ["dimension_text"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "钻孔深度约比螺纹深度多0.5d为教材比例画法的一般经验；“深15”旧式旁注写法来自一般实践。"
