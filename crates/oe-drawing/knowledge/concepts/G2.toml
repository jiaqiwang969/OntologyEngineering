[[concepts]]
id = "DC-G2-073"
name = "基本视图"
aliases = []
group = "G2"
kind = "view"
meaning = "机件向六个基本投影面投射所得的视图：主视图（自前方）、俯视图（自上方）、左视图（自左方）、右视图（自右方）、仰视图（自下方）和后视图（自后方）；按规定位置配置时不标名称。"
components = ["主视图：最能反映机件特征，是布局基准。", "其他视图（第一角）：俯视在下、左视在右、右视在左、仰视在上、后视在左视之右。", "图线：可见轮廓粗实线，必要时不可见轮廓细虚线。", "投影规律：主俯长对正、主左高平齐、俯左宽相等。", "建筑名称：正立面图、平面图、左/右侧立面图、底面图、背立面图；方向代号a～f。"]
variants = ["方向代号 a-f", "建筑名称：正立面图、平面图、左侧立面图、右侧立面图、底面图、背立面图", "first-angle arrangement (GB default)", "third-angle arrangement only where specially required", "主视图", "俯视图", "左视图", "右视图", "仰视图", "后视图"]
dxf_forms = ["No dedicated entity: each view is a cluster of LINE/ARC/CIRCLE/SPLINE on layers 01/04/05; model-projected drawings may wrap each view in a block INSERT", "Projection alignment shows as shared x (above/below) or y (left/right) extents across clusters"]
recognition = "以视图簇划分为锚点：按图元连通性与间距把图纸分成若干簇（排除标题栏、明细栏、技术要求），以最大或最能反映特征的簇为主视图候选，检查其他簇与它的长对正、高平齐（外形坐标在容差内一致），按相对方位判定俯、左、右、仰、后视图；无名称且对齐者为基本视图。第三角画法方位相反，须先读投影识别符号。"
confusions = ["向视图：同样投影，但自由配置并有字母。", "配置在基本视图位置的剖视图：有剖面线，常有X—X。", "第三角配置：方位相反。", "局部视图、斜视图。"]
related = ["DC-G2-084", "DC-G2-085", "DC-G2-072", "DC-G2-076", "DC-G2-080", "DC-G2-071", "DC-G1-099", "DC-G1-100", "DC-G9-015"]
priority = "high"
text_forms = []
knowledge_units = ["K03", "K52", "K55"]
recognition_cards = ["view_arrangement", "view_representation_facts", "view_member_relations"]
recognizer = "partial"
seen_on_drawing = []
expert_checked = false
notes = "配置细节在 GB/T 17451（不在资料集）与 GB/T 14692。"
