[package]
name = "oe-semantic"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Locked Semantica package transport and bounded premise snapshots"
license = "MIT"

[dependencies]
semantica-runtime.workspace = true
semantica-contracts.workspace = true
semantica-service.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true
oe-core.workspace = true
oe-contracts = { path = "../oe-contracts" }
chrono.workspace = true
tar.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
oe-windows-controller.workspace = true

[lints]
workspace = true

[features]
# Historical fixture selection only; it never enables Python execution.
historical-contract-tests = []

[dev-dependencies]
tempfile.workspace = true
oe-evolution = { path = "../oe-evolution" }

[target.'cfg(not(windows))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
