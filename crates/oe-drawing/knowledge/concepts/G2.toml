[[concepts]]
id = "DC-G2-007"
name = "无断裂边界线时剖面线绘制整齐"
aliases = []
group = "G2"
kind = "conventional_representation"
meaning = "只需画出剖切后图形的一部分而又不画断裂边界线时，剖面线在截止处应收齐，形成一条整齐的假想边，表示图形到此为止。"
components = ["局部图形：剖视或断面只画出一部分。", "截止边：没有断裂线，剖面线端点排成直线或光滑曲线。", "剖面线：在截止边处统一终止，不参差。"]
variants = []
dxf_forms = ["HATCH whose boundary loop contains an edge with no drawn LINE/SPLINE", "Exploded hatch LINEs whose end points are collinear along an edge where no entity exists"]
recognition = "以剖面线端点集合为锚点：一组平行剖面线的一端共线（或在同一光滑曲线上），该线上没有任何可见实体，另一端落在粗实线轮廓上。截止处有细波浪线或双折线时属于局部剖视或局部视图的断裂边界。"
confusions = ["局部剖视的波浪线边界：有可见的细实线波浪线或双折线。", "轮廓边：截止边上有粗实线。", "大面积只沿周边画剖面线：整齐的内端在区域内部，外端贴轮廓。"]
related = ["DC-G2-023", "DC-G1-029", "DC-G1-032", "DC-G2-005"]
priority = "low"
