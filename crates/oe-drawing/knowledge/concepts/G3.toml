notes = "要素组合据2017版表2图像核对（OCR只读到零散符号）；1998版内容相同，术语为“可调心/不可调心”。线段长度比例为通用绘图惯例的近似值，详细比例见滚动轴承画法尺寸比例卡；明细栏写法来自教材示例。"
