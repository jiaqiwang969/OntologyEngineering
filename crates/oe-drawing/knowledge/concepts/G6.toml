[[concepts]]
id = "DC-G6-050"
name = "表面结构要求标注在几何公差框格上方"
aliases = ["表面结构注在几何公差框格上方"]
group = "G6"
kind = "surface_indication"
meaning = "表面结构符号可立在该要素几何公差框格的上方，表示框格所指被测要素同时有这项表面结构要求。"
components = ["符号尖端（或其所在线）落在几何公差框格的上边框上。", "框格经指引线指向被测要素，表面结构要求作用于同一要素。", "2006版图20 a)、b)；教材示例为Ra 1.6、Rz 6.3立在框格上方。", "ISO 21920-1草案图11 j)、k)：也可立在远离尺寸线的框格上方。"]
variants = ["GB/T 131-2006 11.2.4 图20 a) b)", "ISO 21920-1 draft 图11 j), k) (also on a frame away from the dimension line)"]
dxf_forms = ["TOLERANCE entity (GD&T frame) or LWPOLYLINE/LINE rectangles + TEXT; roughness INSERT with its apex on the frame's top edge", "both inside one user block or one MLEADER", "frame text in gdt.shx glyph codes that need font mapping"]
recognition = "锚点：表面结构符号，其尖端落在一个分成2–5格（首格为几何特征符号）的矩形框格的上边上，符号宽度与框格同一量级；被注表面由框格指引线箭头确定。区分框格上方的补充文字（如“6×”“2个面”，为文字无V形）和附着在框格上的基准符号（方框字母+三角形）。"
confusions = ["框格上方的数量或说明文字：普通文字，无V形", "连在框格上的基准符号：方框字母+三角形", "框格内的分格内容：位于框内"]
related = ["DC-G6-047", "DC-G6-051", "DC-G6-032", "DC-G5-090", "DC-G5-009"]
