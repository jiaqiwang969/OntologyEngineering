[[concepts]]
id = "DC-G3-176"
name = "构件组成部分连接符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示构件各组成部分之间的连接方式：不可拆的永久连接（固接）、零件与轴或杆的固定连接，以及角度可调的连接。"
components = ["永久连接：两根构件粗线成一角度相交，夹角内用涂黑三角楔填满；可用符号的楔形画法略有变化，附注示例包括构件与滑块、构件与铰链小圆相接时在接角处涂黑。", "组成部分与轴（杆）的固定连接：轴线穿过一个竖立小矩形，矩形内画叉；或轴线与零件线垂直相交成十字；可用符号在十字交点处加一个叉（呈米字形）。", "可调连接：两根构件相交并带实心楔，夹角处另画一段跨角小圆弧，弧端带短横或箭头，表示夹角可调。", "2013版条号6.3～6.5，1984版3.3～3.5，图形一致。"]
variants = ["永久连接", "组成部分与轴（杆）的固定连接", "可调连接"]
dxf_forms = ["Two LINEs on layer 01 meeting at a vertex with a SOLID (3-point) or HATCH SOLID wedge filling the angle", "Fixed-to-shaft: small upright rectangle (closed LWPOLYLINE) with two diagonal LINEs inside, crossed by the axis LINE; or a plain thick cross with an extra small X at the crossing", "Adjustable: additional small ARC across the angle ending in a short tick or SOLID arrowhead", "INSERT of a connection-symbol block"]
recognition = "永久连接锚点为一个实心三角楔（SOLID/HATCH SOLID），其两条边分别与两根构件线重合，楔尖在两线交点。固定连接锚点为被轴线穿过、内画叉线的竖立小矩形，或在线交点处的小X。可调连接为实心楔加跨角小圆弧。与角焊缝符号区分：角焊缝三角形位于指引线基准线上，旁边有焊脚尺寸文字；与实心箭头区分：箭头三角形尖端在一条线的端点而非两线夹角。"
confusions = ["角焊缝符号：涂黑或空心三角形放在焊接指引线基准线上，附焊脚尺寸。", "实心箭头（尺寸线或指引线终端）：三角形位于单根线端点，长度方向与线一致。", "回转副：交点为空心小圆，表示可相对转动而不是固接。", "滚动轴承通用画法十字：十字在矩形框中央且不触框，与轴线穿过的叉形小矩形不同。"]
related = ["DC-G3-158", "DC-G3-196", "DC-G3-152", "DC-G7-144", "DC-G4-019", "DC-G3-121"]
