meaning = "机械加工工艺图中表示工件定位支承点的符号（细实线）：标在轮廓线上为带水平脚的“∧”形（顶角60°，宽2h、高h，尖点触及被定位表面），标在视图正面为圆内加中心点；活动式在符号内加波纹；联合定位用连线把两个符号相连，连线可折。"
components = ["轮廓线上（固定式）：两条斜线组成的“∧”形，夹角60°，尖点触及被定位表面（或其延长线），两侧各有一段与表面平行的短脚，高h、底宽约2h。", "视图正面（固定式）：小圆，圆心有点。", "活动式：“∧”形内画一段波纹竖线，或圆内画波纹线。", "联合定位：两符号之间以一条连线相连（连线长度按需要，可折）。", "尺寸：符号高度h为工艺图数字高度的1～1.5倍，线型为细实线。"]
