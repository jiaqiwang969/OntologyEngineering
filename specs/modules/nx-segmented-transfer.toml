schema="oev2.design-fragment/2"

[[types]]
name="NxTransferBudget"
contract_group="engineering"
identity="Explicit total and per-chunk bounds; no dispatch authority"
meaning="完整任务字节预算与单段传输预算分别声明，旧协议不变"

[[types.fields]]
name="max_total_bytes"
rust_type="u64"
required=true
format="typed"
meaning="完整任务未压缩字节上限，显式最多64GiB"
unit="字节或计数"
precision="精确整数，无截断"
write="显式声明，Rust核验"
applicability="显式分段传输计划；当前旧job/frame不自动升级"
acceptance="完整覆盖、摘要、顺序、失败终止与原上限分别验证"

[[types.fields]]
name="max_chunk_bytes"
rust_type="u64"
required=true
format="typed"
meaning="单次原始数据最多100MiB，不包括帧头"
unit="字节或计数"
precision="精确整数，无截断"
write="显式声明，Rust核验"
applicability="显式分段传输计划；当前旧job/frame不自动升级"
acceptance="完整覆盖、摘要、顺序、失败终止与原上限分别验证"

[[types.fields]]
name="max_files"
rust_type="u64"
required=true
format="typed"
meaning="完整文件数最多10000"
unit="字节或计数"
precision="精确整数，无截断"
write="显式声明，Rust核验"
applicability="显式分段传输计划；当前旧job/frame不自动升级"
acceptance="完整覆盖、摘要、顺序、失败终止与原上限分别验证"

[[types.fields]]
name="max_chunks"
rust_type="u64"
required=true
format="typed"
meaning="完整分段数最多65536，清单另受4MiB约束"
unit="字节或计数"
precision="精确整数，无截断"
write="显式声明，Rust核验"
applicability="显式分段传输计划；当前旧job/frame不自动升级"
acceptance="完整覆盖、摘要、顺序、失败终止与原上限分别验证"

[[constraints]]
id="nx_segmented_transfer_coverage"
requirement="req_engineering"
module="nx_protocol"
check="validate"
rust_path="crates/oe-nx-protocol/src/segmented.rs"
statement="显式/1分段清单绑定job/root/方向/原manifest与完整文件身份，预算/路径别名/顺序/缺重段及全文件SHA独立核验；错误后接收器终止。字节验证不授予持久化、调度或原生资格；旧100MiB合同保持。"
severity="error"

[[validations]]
id="transfer_complete_chunks_preserve_files_and_binding"
module="nx_protocol"
constraint="nx_segmented_transfer_coverage"
behavior="complete_chunks_preserve_files_and_binding"
rust_path="crates/oe-nx-protocol/tests/segmented.rs"
oracle="整文件及空文件的分段覆盖、输入排序与计划身份绑定"
scope="字节计划与内存验证；持久传输、宿主和native另验"

[[validations]]
id="transfer_corruption_gaps_and_cross_task_binding_are_terminal"
module="nx_protocol"
constraint="nx_segmented_transfer_coverage"
behavior="corruption_gaps_and_cross_task_binding_are_terminal"
rust_path="crates/oe-nx-protocol/tests/segmented.rs"
oracle="内容改变、缺段、重复、错root绑定拒绝，原接收器不能续成成功"
scope="字节计划与内存验证；持久传输、宿主和native另验"

[[validations]]
id="transfer_legacy_limit_and_new_budget_are_separate"
module="nx_protocol"
constraint="nx_segmented_transfer_coverage"
behavior="legacy_limit_and_new_budget_are_separate"
rust_path="crates/oe-nx-protocol/tests/segmented.rs"
oracle="旧100MiB仍拒绝；显式新总预算可规划完整元数据，单段上限保持"
scope="字节计划与内存验证；持久传输、宿主和native另验"

[[validations]]
id="transfer_aliases_and_manifest_tampering_are_rejected"
module="nx_protocol"
constraint="nx_segmented_transfer_coverage"
behavior="aliases_and_manifest_tampering_are_rejected"
rust_path="crates/oe-nx-protocol/tests/segmented.rs"
oracle="大小写路径别名、伪造offset和分段预算拒绝"
scope="字节计划与内存验证；持久传输、宿主和native另验"

[[constraints]]
id="nx_transfer_durable_chunks"
requirement="req_engineering"
module="windows_controller"
check="receive"
rust_path="crates/oe-windows-controller/src/transfer_store.rs"
statement="接收先持久化意图，再独占新建段文件并重读，最后持久化回执并重读。恢复从实际原件重建；完整未确认段仅显式补回执，部分写入保持hold、不覆盖。封口全量再读；Windows adapter持有根写锁、目录与文件pins。分段存储不授予job准入或native资格。"
severity="error"

[[validations]]
id="transfer_store_resume_reconstructs_and_finish_rereads"
module="windows_controller"
constraint="nx_transfer_durable_chunks"
behavior="resume_reconstructs_and_finish_rereads"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="中断后从原字节重建，完成前重新读取全部段"
scope="持久段owner与Windows适配；传输入口、完整job及NX另验"

[[validations]]
id="transfer_store_complete_chunk_needs_explicit_commit_and_partial_write_stays_held"
module="windows_controller"
constraint="nx_transfer_durable_chunks"
behavior="complete_chunk_needs_explicit_commit_and_partial_write_stays_held"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="回执写入失败后仅完整段可显式确认；短写保留不覆盖"
scope="持久段owner与Windows适配；传输入口、完整job及NX另验"

[[validations]]
id="transfer_store_tampering_unknown_members_and_wrong_root_reject_before_recovery_writes"
module="windows_controller"
constraint="nx_transfer_durable_chunks"
behavior="tampering_unknown_members_and_wrong_root_reject_before_recovery_writes"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="同长度改字节、额外文件、缺意图、坏回执和错根拒绝"
scope="持久段owner与Windows适配；传输入口、完整job及NX另验"

[[validations]]
id="transfer_store_pinned_windows_store_reopens_and_denies_change_to_received_bytes"
module="windows_controller"
constraint="nx_transfer_durable_chunks"
behavior="pinned_windows_store_reopens_and_denies_change_to_received_bytes"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="真实Windows文件保存重开及拒绝并发改写；释放后改内容重开拒绝"
scope="持久段owner与Windows适配；传输入口、完整job及NX另验"

[[constraints]]
id="nx_transfer_remote_boundary"
requirement="req_engineering"
module="nx_protocol"
check="validate"
rust_path="crates/oe-nx-protocol/src/transfer.rs"
statement="显式transfer请求只允许有界put携带绑定字节，回复绑定root/job/plan/序号且native为false；独立接收根不得接管旧native目录，也不得通过原native准入。客户端单次调用不自动重试或派发。"
severity="error"

[[validations]]
id="remote_transfer_frames_bind_payload_without_relaxing_other_commands"
module="nx_protocol"
constraint="nx_transfer_remote_boundary"
behavior="transfer_frames_bind_payload_without_relaxing_other_commands"
rust_path="crates/oe-nx-protocol/tests/transfer_endpoint.rs"
oracle="真实帧往返含空段，改变载荷摘要拒绝，Probe不得携带载荷"
scope="协议、控制器接口与目录用途；远程实传/模型重组/原生准入另验"

[[validations]]
id="remote_transfer_response_rejects_wrong_binding_or_execution_claim"
module="nx_protocol"
constraint="nx_transfer_remote_boundary"
behavior="transfer_response_rejects_wrong_binding_or_execution_claim"
rust_path="crates/oe-nx-protocol/tests/transfer_endpoint.rs"
oracle="错root、计划、序号、虚假核验状态和native声明拒绝"
scope="协议、控制器接口与目录用途；远程实传/模型重组/原生准入另验"

[[validations]]
id="remote_endpoint_keeps_transfer_and_native_admission_separate"
module="windows_controller"
constraint="nx_transfer_remote_boundary"
behavior="endpoint_keeps_transfer_and_native_admission_separate"
rust_path="crates/oe-windows-controller/tests/transfer_endpoint.rs"
oracle="真实Windows根/计划/分段接收与重读；根用途禁止native，重复begin/put拒绝"
scope="协议、控制器接口与目录用途；远程实传/模型重组/原生准入另验"

[[validations]]
id="remote_transfer_refuses_occupied_native_root_without_creating_marker"
module="windows_controller"
constraint="nx_transfer_remote_boundary"
behavior="transfer_refuses_occupied_native_root_without_creating_marker"
rust_path="crates/oe-windows-controller/tests/transfer_endpoint.rs"
oracle="存在旧任务的根在创建用途标志前拒绝，旧目录保持"
scope="协议、控制器接口与目录用途；远程实传/模型重组/原生准入另验"

[[constraints]]
id="nx_transfer_batch_boundary"
requirement="req_engineering"
module="windows_controller"
check="receive"
rust_path="crates/oe-windows-controller/src/transfer_store.rs"
statement="批量接收仅合并最多4096个连续计划段，整帧100MiB保持；先检查完整范围与长度，逐段意图/写入/重读/回执不变。中途失败保留实际前缀，禁止盲目重放；仍不授予native准入。"
severity="error"

[[validations]]
id="batch_frames_and_response_bounds"
module="nx_protocol"
constraint="nx_transfer_batch_boundary"
behavior="batch_frames_and_response_bounds"
rust_path="crates/oe-nx-protocol/tests/transfer_endpoint.rs"
oracle="批量帧绑定完整载荷；零段、过多段、序号溢出、错误回复拒绝"
scope="协议范围与持久接收；批量实传和原生执行另验"

[[validations]]
id="batch_preflight_and_partial_failure_preserve_resume"
module="windows_controller"
constraint="nx_transfer_batch_boundary"
behavior="batch_preflight_and_partial_failure_preserve_resume"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="错误总长度写入前拒绝；中途失败不重放已确认段；新会话可查询并恢复"
scope="持久接收；真实Windows批量性能及原生另验"

[[constraints]]
id="nx_transfer_batch_check_boundaries"
requirement="req_engineering"
module="windows_controller"
check="verify_scope"
rust_path="crates/oe-windows-controller/src/transfer_store_windows.rs"
statement="Windows每次读写保留根/锁/目录及当前文件检查与全部已读句柄；批量开始和成功回复前核全部保留文件，恢复末尾再次全核。单段接口保持完整前后检查，批内旧文件异常不得形成成功回执。"
severity="error"

[[validations]]
id="batch_scope_checks_are_linear_and_final_identity_failure_rejects"
module="windows_controller"
constraint="nx_transfer_batch_check_boundaries"
behavior="batch_scope_checks_are_linear_and_final_identity_failure_rejects"
rust_path="crates/oe-windows-controller/tests/transfer_store.rs"
oracle="检查计数随分段线性；批内已接收文件异常在回复前拒绝，失败会话不能封口"
scope="存储编排计数与注入反例；真实Windows身份变化和实传性能另验"

[[constraints]]
id="nx_transfer_reconstructed_tree"
requirement="req_engineering"
module="windows_controller"
check="reconstruct"
rust_path="crates/oe-windows-controller/src/transfer_reconstruct.rs"
statement="仅完整已接收计划可流式重组到独占新树，单文件8GiB保持；逐段再次核源，独立打开整文件核SHA和大小，核完整命名空间与所有保留身份后返回未发布回执。缺段、短写、内容变化、额外文件或重复目标不覆盖、不转native资格。"
severity="error"

[[validations]]
id="reconstruction_streams_and_rechecks_without_publication"
module="windows_controller"
constraint="nx_transfer_reconstructed_tree"
behavior="reconstruction_streams_and_rechecks_without_publication"
rust_path="crates/oe-windows-controller/tests/transfer_reconstruct.rs"
oracle="跨段与空文件完整还原，写入块受限，重复目标拒绝，published/native为false"
scope="重组与接口；原子发布、完整native准入及工程采用另验"

[[validations]]
id="reconstruction_rejects_missing_chunks_corruption_and_partial_write"
module="windows_controller"
constraint="nx_transfer_reconstructed_tree"
behavior="reconstruction_rejects_missing_chunks_corruption_and_partial_write"
rust_path="crates/oe-windows-controller/tests/transfer_reconstruct.rs"
oracle="缺源不创建源或目标记录，复制中源/目标损坏及部分写入拒绝且不覆盖"
scope="重组与接口；原子发布、完整native准入及工程采用另验"

[[validations]]
id="reconstruction_rejects_oversized_file_before_access"
module="windows_controller"
constraint="nx_transfer_reconstructed_tree"
behavior="reconstruction_rejects_oversized_file_before_access"
rust_path="crates/oe-windows-controller/tests/transfer_reconstruct.rs"
oracle="超过8GiB的单文件在源目标访问前拒绝"
scope="重组与接口；原子发布、完整native准入及工程采用另验"

[[validations]]
id="windows_reconstruction_reopens_complete_files_and_denies_overwrite"
module="windows_controller"
constraint="nx_transfer_reconstructed_tree"
behavior="windows_reconstruction_reopens_complete_files_and_denies_overwrite"
rust_path="crates/oe-windows-controller/tests/transfer_reconstruct.rs"
oracle="真实Windows流式写入、Unicode目录、空文件、独立回读、pin拒绝写入、异常命名空间及短写/超写拒绝"
scope="重组与接口；原子发布、完整native准入及工程采用另验"

[[validations]]
id="reconstruction_response_never_grants_publication_or_execution"
module="nx_protocol"
constraint="nx_transfer_reconstructed_tree"
behavior="reconstruction_response_never_grants_publication_or_execution"
rust_path="crates/oe-nx-protocol/tests/transfer_endpoint.rs"
oracle="重组回复绑定目标与计划，错字节/序号或published/native提升拒绝"
scope="重组与接口；原子发布、完整native准入及工程采用另验"

[[constraints]]
id="nx_source_publication_commit"
requirement="req_engineering"
module="windows_controller"
check="publish"
rust_path="crates/oe-windows-controller/src/transfer_publication.rs"
statement="发布通过原子状态记录绑定完整计划、源/目标/发布目录身份和文件摘要；每次发布/读取/恢复重新核所有输出，持有文件pins提交。pending不视作发布；仅显式恢复完整匹配的pending，部分/异物保持hold。已提交重复请求不重写。最多64个已知记录，完整孤立temp原件可保留；发布不授予native权限。"
severity="error"

[[validations]]
id="publication_revalidates_tree_and_repeats_without_rewriting"
module="windows_controller"
constraint="nx_source_publication_commit"
behavior="publication_revalidates_tree_and_repeats_without_rewriting"
rust_path="crates/oe-windows-controller/tests/transfer_publication.rs"
oracle="实际Windows发布、重复不调用写入检查点、源目标变化和未知记录拒绝"
scope="来源发布与检查点恢复；真实断电、原生执行和工程采用另验"

[[validations]]
id="publication_pending_requires_explicit_recovery_at_each_atomic_checkpoint"
module="windows_controller"
constraint="nx_source_publication_commit"
behavior="publication_pending_requires_explicit_recovery_at_each_atomic_checkpoint"
rust_path="crates/oe-windows-controller/tests/transfer_publication.rs"
oracle="pending同步、temp同步和替换回读后三处真实持久写入故障均需显式恢复；部分pending不覆盖"
scope="来源发布与检查点恢复；真实断电、原生执行和工程采用另验"

[[validations]]
id="publication_response_binds_physical_tree_and_never_grants_native"
module="nx_protocol"
constraint="nx_source_publication_commit"
behavior="publication_response_binds_physical_tree_and_never_grants_native"
rust_path="crates/oe-nx-protocol/tests/transfer_endpoint.rs"
oracle="错目录、错发布ID、错误字节、pending或native提升的回复拒绝"
scope="来源发布与检查点恢复；真实断电、原生执行和工程采用另验"
