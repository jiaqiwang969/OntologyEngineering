kind = "weld_indication"
meaning = "基本符号相对基准线位置的读法：符号在实线侧表示焊缝在接头的箭头侧；在虚线侧表示在非箭头侧；对称焊缝跨实线镜像并可省略虚线；分布明确的双面焊缝也可省略虚线。"
components = ["箭头侧：箭头线直接指向的接头一侧。", "非箭头侧：与箭头侧相对的一侧。", "实线侧符号→箭头侧焊缝；虚线侧符号→非箭头侧焊缝。", "对称或双面焊缝：符号上下都有，可不画虚线。"]
variants = ["weld on arrow side", "weld on other side", "symmetric weld with dashed line omitted", "double-sided weld with dashed line omitted", "箭头侧", "非箭头侧", "对称焊缝省略虚线"]
dxf_forms = ["no own entity: derived from the relative position of symbol strokes, the solid reference LINE and the dashed LINE", "reference line pair: thin continuous LINE plus a parallel LINE with dashed linetype (DASHED/HIDDEN/ACAD_ISO02W100) offset ≈ 3d' ≈ 0.3h, dashes ≈ 0.9h, gaps ≈ 0.3h (GB/T 12212 proportions)"]
recognition = "符号在实线侧＝焊缝在箭头侧，在虚线侧＝非箭头侧，跨实线镜像对称＝双面/对称焊缝（此时常省略虚线）。实现：取基准线实线的法向，判断符号包围盒中心在实线的哪一侧；若该侧还有虚线且符号在虚线外侧→非箭头侧；只有实线时，符号单侧→箭头侧，上下对称→对称焊缝。基准线竖直时同样按法向判断，不按“上/下”。"
confusions = ["基准线竖直时“上下”变为“左右”，需按几何法向判断。", "组合符号（如X、K）本身跨越基准线，表示双面焊缝。"]
