[[concepts]]
id = "DC-G8-027"
name = "装配图中单独画出某零件的视图"
aliases = []
group = "G8"
kind = "view"
meaning = "装配图中可以单独画出某一个零件的视图，以补充表达该零件未表达清楚的形状；必须在该视图上方注出零件名称和视图名称（如“泵盖B向”），并在相应视图附近用箭头指明投射方向、注上同样的字母。"
components = ["单独视图只画一个零件的轮廓，不画相邻零件。", "视图上方标注“零件名＋字母＋向”，如“泵盖B向”。", "相应视图附近有投射方向箭头和同一个字母（如B）。"]
variants = []
dxf_forms = ["TEXT/MTEXT '泵盖B向' above the view (layer 11)", "projection arrow as LEADER or LWPOLYLINE with tapering width / SOLID, plus TEXT 'B' near the related view"]
recognition = "以视图上方匹配“^[\\u4e00-\\u9fa5]+\\s*[A-Z]\\s*向$”的文字为锚点，其中零件名应与明细栏名称列中的某一项相同；同图存在只带该字母的投射方向箭头。与普通向视图的区别：普通向视图名称只有字母（或旧式“B向”），没有零件名，并且画出的是整个装配体。"
confusions = ["整个装配体的向视图：名称只有字母，图形包含多个零件。", "局部视图：只画部分结构，常有波浪线边界。", "拆卸画法：说明文字为“拆去××”。"]
related = ["DC-G2-072", "DC-G2-076", "DC-G8-004", "DC-G8-025"]
priority = "low"
text_forms = ["泵盖B向", "B"]
knowledge_units = ["K11", "K12", "K13"]
