[[concepts]]
id = "DC-G2-009"
name = "相邻零件剖面线的区分"
aliases = ["相邻零件剖面线方向"]
group = "G2"
kind = "conventional_representation"
meaning = "装配图中相邻零件的剖面区域用剖面线方向相反，或方向相同而间隔不等来区分；同一零件在各视图中剖面线方向、间隔一致；相邻非金属零件剖面符号相同时以疏密不同区分。"
components = ["相邻剖面区域：共享一条接触面粗实线。", "区分方式一：两侧剖面线倾斜方向相反（如45°与135°）。", "区分方式二：方向相同而间距明显不同。", "一致性：同一零件在所有剖视中剖面线角度和间距相同，可据此跨视图识别同一零件。", "非金属相邻件：同一符号用疏密差别区分。"]
variants = ["opposite direction", "same direction, different spacing", "different density for non-metals", "方向相反", "方向相同、间隔不等"]
dxf_forms = ["Separate HATCH per part: ANSI31 at angle 0 vs 90 (45° vs 135° lines) or the same angle with a different scale", "Exploded hatch LINE families on layer 10 with distinct direction/spacing per region", "AutoCAD convention: ANSI31 angle 0 draws 45° lines; spacing = 3.175 mm × pattern scale"]
recognition = "以共享边界的剖面区域对为锚点，量取两侧剖面线角度和间距：方向相差约90°或间距比≥1.3，判为不同零件；用“角度+间距”签名跨视图归并同一零件，再与序号指引线末端圆点所在区域对应。同一零件在不同视图中签名不同时应复核。"
confusions = ["同一零件相邻剖切图错开：方向、间距相同，只是相位错开。", "剖视中的剖视：同一零件内嵌套的两层剖面线。", "非金属剖面符号：本身就是两组正交线，不要误判为两零件叠加。", "狭小剖面涂黑：不用剖面线。"]
