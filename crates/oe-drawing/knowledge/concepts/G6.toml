[[concepts]]
id = "DC-G6-004"
name = "全部表面有相同要求的统一标注"
aliases = ["全部表面相同要求时的统一标注"]
group = "G6"
kind = "simplified_representation"
meaning = "零件所有表面的表面结构要求相同时，只统一标注一次符号或代号，视图中的各表面不再逐一标注。"
components = ["2006版：统一标注在标题栏附近，符号后不加圆括号（因为没有例外表面）。", "1993版：统一标注在图样右上角，符号、代号和文字的高度为图形上其他代号的1.4倍。", "视图中各表面不再出现表面结构符号。"]
variants = ["GB/T 131-1993 4.3 图12 a/b", "GB/T 131-2006 11.3.1 (case 'all surfaces': no parentheses)"]
dxf_forms = ["INSERT of the roughness block near the title block (2006) or near the upper-right frame corner (1993), with scale ≈1.4 relative to symbols in the views", "value TEXT with height ≈1.4h", "no TEXT '(' ')' or ARC parentheses after the symbol"]
recognition = "锚点：位于视图区域以外（右上角或标题栏上方/左侧）的表面结构符号，其后无括号、无“其余”二字，且视图内没有其他表面结构符号。1993版该符号和文字约为常规的1.4倍；视图中无符号可比时，以尺寸数字字高h比较（短边竖高约1.4×1.4h≈2h）。若视图中仍有其他符号，应解释为多数表面注法而非全部表面。"
confusions = ["多数表面简化注法：符号后有括号（2006）或前有“其余”二字（1993）", "标题栏内的文字或材料栏：没有V形符号", "“其余”注语：为完整句子"]
related = ["DC-G6-006", "DC-G6-001", "DC-G6-003", "DC-G9-028"]
priority = "medium"
text_forms = ["√Ra 12.5（标题栏附近，无括号）", "12.5（1993版右上角，1.4倍大小）"]
knowledge_units = ["K31", "K32"]
