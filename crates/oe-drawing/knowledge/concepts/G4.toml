kind = "simplified_representation"
meaning = "凸轮的工作曲面（端面凸轮表面、圆柱凸轮的径向曲线等）及其上的结构，把曲面沿圆周展开成平面后在展开图上注尺寸：横向为转角站位或展开长度，纵向为升程或高度。"
components = ["展开图：曲面沿圆周展开的矩形区域，内有起伏的凸轮轮廓曲线，旁注“端面凸轮表面展开”“径向曲线展开”等字样及比例", "转角站位：沿展开图一边按等差注出 0°、90°、180°、270°、360°（或 30°、60°…），作为横坐标", "高度/升程尺寸：在各站位处标注曲线至基准边的距离，或曲线段的长度与角度", "曲面上的结构：孔、螺孔（如 M10-7H）、槽等也在展开图上定位标注"]
variants = ["end-face cam development", "radial curve development"]
dxf_forms = ["SPLINE or LWPOLYLINE cam profile inside a rectangular development area bounded by LINEs", "TEXT/MTEXT angle stations like '90%%d', '180%%d', '270%%d' spaced evenly along one edge", "TEXT caption such as '端面凸轮表面展开' or '径向曲线展开' with scale '1:2'", "linear DIMENSION entities (dimtype 0) measured inside the development"]
recognition = "锚点：一组按等差递增的角度文字（含°或%%d），沿一条直线等间距排列，间距与数值差成正比；附近有含“展开”字样的说明文字。在其上方/下方矩形区内存在起伏的SPLINE或多段线。尺寸多为垂直于站位轴的线性尺寸，从基准边量到曲线。与运动线图/函数曲线区分：展开图位于零件图视图组内，带零件结构（孔、螺纹）及“展开”注语；与钣金展开图区分：钣金展开为封闭板形轮廓并常带展开长符号，而非沿角度分布的起伏曲线。"
confusions = ["从动件位移线图：属设计图表，不含零件结构尺寸", "钣金或柱面剖视的展开图：轮廓为封闭外形，注“X—X展开”或展开长", "普通线性尺寸组：无角度站位序列"]
