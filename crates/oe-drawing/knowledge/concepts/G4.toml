[[concepts]]
id = "DC-G4-047"
name = "弧长符号 ⌒"
aliases = ["弧长符号"]
group = "G4"
kind = "dimension_symbol"
meaning = "弧长符号为细实线半圆弧，标注弧长时加在尺寸数字左方，与同心圆弧状的尺寸线配合使用，表示所注数值为圆弧的长度。"
components = ["符号：以字高h为半径的细实线半圆弧（宽约2h、高约h），开口向下。", "位置：GB/T 4458.4-2003规定在尺寸数字左方（⌒30）；旧图纸可见画在数字上方。", "配套：尺寸线为与被注圆弧同心的圆弧，尺寸界线平行于该弧所对圆心角的平分线，弧度较大时沿径向引出。", "版本：GB/T 16675.2-2012表1列入此符号，1996版表1未列。"]
variants = ["arc placed before number (GB/T 4458.4-2003)", "listed in GB/T 16675.2-2012 表1, absent from 1996 表1"]
dxf_forms = ["ARC_DIMENSION entity (AcDbArcDimension, AutoCAD 2006+) with DIMARCSYM 0 (symbol before text) or 1 (above text)", "exploded: ARC dimension line + LINE extension lines + SOLID arrows + MTEXT with '\\U+2312' (⌒) or '\\U+2322' glyph", "small ARC (radius ≈ h) drawn as separate geometry left of or above a TEXT number", "layer 08 or template dimension layer"]
recognition = "锚点为尺寸数字左侧（或上方）的小半圆弧：ARC半径≈h、跨度180°、开口向下，或字符U+2312/U+2322/U+2229（OCR常读作“∩”“～”“入”）。验证其所属尺寸线为圆弧且与被注轮廓弧同心，数值≈弧半径×圆心角（长度）而非角度。排除：线轮廓度符号⌒位于几何公差框格首格；角度尺寸数字带°、圆心在角顶点；弦长尺寸为直尺寸线、无符号。"
confusions = ["线轮廓度符号⌒：位于公差框格首格，不在尺寸数字前。", "角度尺寸：同为圆弧尺寸线，但数字带°，尺寸界线沿径向且圆心在角顶点。", "弦长尺寸：尺寸线为直线，平行于弦，无符号。", "展开长符号：小圆加箭头。"]
related = ["DC-G4-025", "DC-G4-024", "DC-G4-032", "DC-G4-077", "DC-G5-077"]
