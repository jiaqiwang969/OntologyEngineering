[[concepts]]
id = "DC-G3-153"
name = "单向运动符号"
aliases = []
group = "G3"
kind = "symbol"
meaning = "机构运动简图中表示构件或点沿直线、曲线或回转方向只朝一个方向运动的符号，可在轨迹上叠加瞬时停顿、停留、局部反向等运动特征。"
components = ["直线或曲线单向运动：直线或圆弧轨迹线只在一端带箭头；可用符号为一个整圆，圆周上带一个箭头，表示单向回转。", "具有瞬时停顿：轨迹中部加一条垂直短横（呈十字），末端仍带箭头。", "具有停留：轨迹中途折成台阶（横—竖—横），末端带箭头。", "具有局部反向：轨迹中途折成Z形回折，末端带箭头；具有局部反向及停留则在Z形回折之后再接台阶。", "2013版条号4.8.1～4.8.5；1984版为1.8.1～1.8.4及1.8.9（局部反向及停留），图形一致。"]
variants = ["直线或曲线的单向运动", "具有瞬时停顿", "具有停留", "具有局部反向", "具有局部反向及停留"]
dxf_forms = ["Thin LINE or ARC path on layer 02 with an arrowhead as SOLID triangle or as an LWPOLYLINE segment tapering from width >0 to 0", "Composite path (step, zigzag) as one LWPOLYLINE with the last segment tapered as arrowhead", "Rotary alternative: CIRCLE with a small SOLID/tapered-polyline arrowhead on its circumference", "Sometimes a LEADER/MLEADER without text reused as an arrow, or an INSERT of a motion-symbol block"]
recognition = "锚点为只在一端终止于实心箭头的细线轨迹（直线、圆弧或折线），箭头前端不抵尺寸界线，附近无尺寸数值。再检查轨迹中部：垂直短横=瞬时停顿，台阶=停留，Z形回折=局部反向。与往复运动区分：往复运动两端都有箭头或去回两线平行并在端部相连；与尺寸线区分：尺寸线两端都有箭头且抵在尺寸界线上、带数字，常为DIMENSION实体；与向视方向箭头区分：后者短而旁注大写字母。"
confusions = ["往复运动符号：两端都有箭头，或去、回两线平行并在极限位置相连。", "尺寸线：两端箭头抵在尺寸界线上并带尺寸数值。", "向视图投射方向箭头：短箭头旁注大写字母。", "旋转方向注语或箭头：画在零件投影图上，旁边常有文字说明。"]
related = ["DC-G3-165", "DC-G3-198", "DC-G3-199", "DC-G4-019", "DC-G2-072", "DC-G1-069"]
priority = "rare"
