kind = "symbol"
meaning = "在机构运动简图的齿轮符号上加画的短细线，用来指明齿线方向：圆柱齿轮的直齿、斜齿、人字齿，圆锥齿轮的直齿、斜齿、弧齿。"
components = ["在齿轮符号轮辐线（基本符号）或轮体矩形/梯形（可用符号）的一端附近，加画三条等长、等距的短细线。", "直齿：三条短线与轴线平行（与轮辐线垂直）。", "斜齿：三条互相平行且相对轴线倾斜的短线。", "人字齿：三个开口朝同一方向的 V 形折线。", "圆锥齿轮：在斜端的轮辐线或梯形轮体上同样加画三条短线，直齿为平行线、斜齿为斜线、弧齿为三条同向弧线。", "不加这些短线时即为“不指明齿线”的齿轮符号；1984 版 5.2.2 与 2013 版 8.2.2 一致。"]
variants = ["圆柱齿轮：直齿、斜齿、人字齿", "圆锥齿轮：直齿、斜齿、弧齿"]
dxf_forms = ["Three short LINEs or ARCs on layer 02 near one end of the wheel line, usually inside the same block as the gear symbol", "Herringbone as three small V-shaped LWPOLYLINEs", "INSERT of a library block"]
recognition = "锚点：齿轮符号（与粗轴线垂直的轮辐线，端部为居中短横）。在轮辐线一端附近找 3 条等长等距的短细线：与轴平行→直齿；同向倾斜→斜齿；V 形→人字齿；弧线→弧齿（锥齿轮）。短线长度与端部短横相近。与零件图中用三条平行细实线表示齿线方向的画法区分：零件图画在齿轮真实外形视图上（有齿顶线、分度线和尺寸），简图画在单线轮辐线上。"
confusions = ["零件图齿轮外形视图中的齿线方向细实线：画在真实轮廓上。", "剖面线：成片均匀分布，不只三条短线。", "滚动轴承机构简图符号中矩形内的短线：位于被轴贯穿的小矩形中，通常上下各一条。"]
related = ["DC-G3-208", "DC-G3-207", "DC-G3-022", "DC-G3-071"]
