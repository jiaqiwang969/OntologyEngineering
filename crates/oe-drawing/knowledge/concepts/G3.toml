components = ["断裂边界：细波浪线，围出断裂区域。", "断裂面：在可见的断裂面内画细点，不画剖面线。", "中间折断时两段轴测投影保持原轴向对齐。", "2013版第5.5条（图13）与1984版第2.5条（图13、14）规定一致。"]
