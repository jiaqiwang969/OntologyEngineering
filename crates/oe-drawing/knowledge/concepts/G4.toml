[[concepts]]
id = "DC-G4-150"
name = "装配图中的配合代号注法"
aliases = ["配合代号", "配合代号注法"]
group = "G4"
kind = "tolerance_indication"
meaning = "装配图上的配合代号注法：在相配合的公称尺寸右边用分数形式注出，分子为孔的公差带代号、分母为轴的公差带代号（如 Ø30 H7/f6）；也可写成斜线形式，必要时每个代号后加Ⓔ或括号偏差。"
components = ["公称尺寸：孔轴共同的公称值，含Ø", "分数：分子孔代号（大写），分母轴代号（小写），中间为水平分数线；或用斜线写在一行", "制度判别：分子为H多为基孔制，分母为h多为基轴制；两者都不是为非基准制配合（如 M7/f7）", "扩展：GB/T 38762.1 示例在各代号后加Ⓔ，或在代号后括号写出偏差", "尺寸线：注在两件配合处，尺寸界线跨两件共同轮廓"]
variants = ["fraction form", "slash form H7/f6", "with Ⓔ after each class (GB/T 38762.1 图22)", "classes with bracketed deviations", "分数（上下叠写）形式", "斜线形式 H7/f6", "基孔制：分子为 H", "基轴制：分母为 h", "非基准制配合（如 M7/f7，分子分母都不是 H/h）", "分式（上下）", "斜线式 H7/g6"]
dxf_forms = ["DIMENSION override text with MTEXT stacking: '%%c30{\\SH7/f6;}' (horizontal fraction) or '\\SH7#f6;' (diagonal)", "plain TEXT 'H7/f6' after the nominal value", "exploded: nominal TEXT + two TEXTs + a short LINE as the fraction bar"]
recognition = "锚点：公称尺寸右侧出现“大写字母+数字”在上、“小写字母+数字”在下的分式（MTEXT中为\\S…/…;或\\S…#…;），或一行内“大写代号/小写代号”。在装配图中检验：尺寸界线所指轮廓为两零件共有的配合面（孔轴重叠）。与偏差叠写区分：偏差为带符号小数；与螺纹配合6H/6g区分：数字在字母前且前有M规格；与锥度比例1:5、分数尺寸区分：无字母。"
confusions = ["上下叠写的极限偏差：带符号的小数", "螺纹副标记 6H/6g、6H/5g6g", "花键副标记中的分数形式", "单个公差带代号（零件图或与标准件配合）", "比例或分数数值"]
related = ["DC-G4-114", "DC-G4-151", "DC-G4-105", "DC-G4-113", "DC-G3-087", "DC-G4-031"]
priority = "high"
