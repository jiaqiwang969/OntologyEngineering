meaning = "被注要素的名称"

[[cards.lexicon]]
concept = "DC-G4-088"
entry = "size_word"
values = ["小", "大"]
meaning = "同名要素按大小区分时写在要素名前"

[[cards.lexicon]]
concept = "DC-G3-089"
entry = "depth"
values = ["攻深", "孔深", "深"]
meaning = "螺纹深度或孔深，后接数值"

[[cards.lexicon]]
concept = "DC-G4-067"
entry = "scope"
values = ["两侧", "两端", "一周", "全周"]
