[[concepts]]
id = "DC-G3-123"
name = "滚针轴承的特征画法及规定画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "滚针轴承的特征画法用径向很薄的线框内一条平行于轴线的长粗实线加短线表示，规定画法则把滚针画成平行于轴线的细长矩形，并按有无内圈、冲压外圈、双列等结构分列。"
components = ["特征画法线框径向高度很小（滚针轴承断面薄），框内一条平行于轴线的长粗实线被一条短粗实线正交穿过表示单列；双列有两条短线。", "滚轮型（表4之4.3）线框外缘为圆弧，框内上部加一条长粗圆弧线，下部为长线加短线。", "规定画法中滚针画成细长矩形（长宽比远大于圆柱滚子），套圈画剖面轮廓；有带内圈、无内圈、冲压薄壁外圈（U形包住滚针）、满装滚针等形式。", "与其他轴承画法一样，特征画法画在轴的两侧；规定画法一般画在一侧，另一侧用通用画法。"]
variants = ["带内圈/无内圈", "冲压外圈", "满装滚针", "滚轮滚针轴承"]
dxf_forms = ["Thick LINE strokes inside a flat LWPOLYLINE frame (height much smaller than width), layer 01; mirrored pair about the shaft axis", "Specified form: long narrow LWPOLYLINE rectangles for needles, thin drawn-cup outer ring as offset polylines; HATCH ANSI31 on rings (layer 10) in assemblies", "INSERT of a needle-bearing library block (NA/NK/HK series) from GstarCAD/CAXA/AutoCAD Mechanical"]
recognition = "锚点为轴与孔之间径向很薄（高宽比常小于0.3）的粗线框，框内长线平行于轴线并贯穿大部分框宽，有1～2条短线正交穿过。与圆柱滚子轴承（表3之3.1）区分主要看框的高宽比；规定画法中滚动体为细长矩形（长宽比大于3）。冲压外圈型外圈呈薄U形包住滚针，有时无内圈而直接以轴为滚道。"
confusions = ["圆柱滚子轴承：框较高，规定画法中滚子为宽矩形（长宽比约1～1.5）。", "衬套或轴套：普通带剖面线的矩形剖面，框内无要素符号。"]
