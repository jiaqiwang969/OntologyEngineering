components = ["箭头落在轮廓线上或其延长线上，与尺寸线明显错开", "箭头落在参照线上：参照线经指引线连到被测面，指引线在面内以实心圆点终止；不可见面用虚线和空心圆", "三维标注：指引线终止于组成要素上的点，或指向延长线的箭头"]
