[[concepts]]
id = "DC-G6-048"
name = "表面结构滤波器类型符号与嵌套指数"
aliases = []
group = "G6"
kind = "surface_indication"
meaning = "ISO 21920-1草案和区域法中，用字母表示滤波器类型（G高斯、S样条、RG稳健高斯、RS稳健样条等），其后写嵌套指数（mm）；S-滤波器写在连字号前、L-滤波器写在连字号后，如S 0.0015 - RG 0.6。高斯G为缺省，不写。"
components = ["轮廓法（草案表B.1）：G高斯、S样条、RG稳健高斯、RS稳健样条、SW样条小波、CW三次小波、OD/OH开运算圆盘/水平线段、CD/CH闭运算圆盘/水平线段、AD交替系列圆盘。", "区域法（GB/T 33523.1表E.1）另有OB、CB、AB、AH等球形或段形形态滤波器、SW分割和H谐波；嵌套指数含义随滤波器不同（截止长度、球或盘半径、段长等）。", "位置：规范行第一个斜线之后，写成“S类型 指数 - L类型 指数”。", "GB/T 131-2006附录D：过渡期可在传输带前用引号写滤波器类型（如高斯，或2RC），名称未标准化。"]
variants = ["ISO 21920-1 draft 7.7-7.10 and 附录B 表B.1", "GB/T 33523.1 附录E 表E.1/E.2 (areal)", "GB/T 131-2006 附录D: filter type may be written in quotes before the band, e.g. \"X\" as Gaussian or 2RC"]
dxf_forms = ["tokens inside the specification TEXT: 'S 0.0015 - RG 0.6'", "areal: '0.008-RG2.5' inside 'S-F 0.008-RG2.5/Sa 0.5'", "2006 transitional: quoted filter name before the band, e.g. '\"X\" 0.08-0.8/Rz 8 max'"]
recognition = "词法：在第一个“/”之后，出现“(G|S|RG|RS|SW|CW|OD|OH|CD|CH|AD)? 数 - (同一组字母)? 数”。属于草案和区域法写法，普通零件图上罕见。区分管螺纹G（后接尺寸代号，如G1/2）、区域参数前缀S（紧接小写字母，如Sa）、GB/T 131-2006不带字母的传输带和材料缩写。"
