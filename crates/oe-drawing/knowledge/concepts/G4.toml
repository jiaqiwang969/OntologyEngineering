[[concepts]]
id = "DC-G4-153"
name = "距离（非尺寸要素）的±公差标注"
aliases = []
group = "G4"
kind = "tolerance_indication"
meaning = "对非尺寸要素的距离（台阶高度、非相对要素或导出要素间的距离）以及半径、弧长、倒角、棱边倒圆等注±公差，按GB/T 38762.2属于含义不确定的规范，推荐改用理论正确尺寸加位置度或轮廓度等几何规范。"
components = ["图上形式：与普通±公差相同，如台阶尺寸 L±0.1、R5±0.2", "不确定原因：实际表面的形状和方向偏差使测量起止点不唯一", "推荐替代：以一个面为基准，另一面用TED距离L加位置度公差带", "适用类别：同向组成要素距离、组成-导出距离、导出-导出距离、半径、弧长、倒角高度与角度、棱边半径"]
variants = ["step / distance ±", "R±", "arc length ±", "chamfer/round ±"]
dxf_forms = ["linear or radial DIMENSION with '%%p' tolerance between two same-direction faces (step) or two centre lines", "replacement form: boxed TED DIMENSION (DIMGAP<0) + TOLERANCE/exploded position or profile frame with datum"]
recognition = "在识别出带±（或偏差）的尺寸后再判定类型：若两条尺寸界线落在同向的两个平面（台阶、法向同向）、或至少一端为中心线/轴线、或尺寸为R、弧长、倒角，则不是两相对面构成的尺寸要素，应标记为“距离±公差（含义不确定）”；若两界线落在一对相对平行面或圆柱两侧轮廓上，则为尺寸要素的尺寸公差。"
confusions = ["尺寸要素（两相对面、圆柱直径）的尺寸公差：含义明确", "TED+位置度的替代注法", "一般公差覆盖的距离"]
related = ["DC-G4-126", "DC-G4-029", "DC-G5-041", "DC-G5-082", "DC-G4-061"]
priority = "high"
text_forms = ["L±0.1", "R5±0.2", "20±0.05（台阶）"]
knowledge_units = ["K17", "K18", "K19", "K20", "K21"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "From GB/T 38762.2-2020 4 表1, 7.2 图1 and 附录A A.2. Priority high because ± on steps and centre distances is very common on shop drawings; the card is mainly a semantic flag. Text examples illustrative."
