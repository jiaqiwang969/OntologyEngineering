recognition = "以限定性说明文字为锚点：含“仅”“只”“一侧”“左侧/右侧”“此处”等并提到孔、槽等结构及数量的短文字，位置在视图内或紧邻视图。再检查附近几何：存在对称中心线及对称符号，或几何左右镜像，而文字声明某侧独有结构，即判为本概念。区分镜像零件说明：文字含LH/RH或“左件/右件”；区分一般技术要求：位于标题栏上方的编号列表，不贴近具体结构。"
