[[concepts]]
id = "DC-G3-118"
name = "旋转轴唇形密封圈特征画法"
aliases = []
group = "G3"
kind = "simplified_representation"
meaning = "在装配图剖视中，用矩形线框内的密封要素符号组合（静态长线＋斜置的动态长线，必要时加防尘副唇短线）简化表示旋转轴唇形密封圈，表达唇口朝向、是否带副唇、单向或双向以及轴用或孔用，而不画骨架、弹簧和唇形细节。"
components = ["矩形线框：粗实线，按密封圈剖面外廓（径向高度×宽度）与图样同一比例画出，位于轴外径线与座孔线之间，一般在轴线两侧各画一个、上下镜像，框内不画剖面线。", "静态密封要素：框内紧贴一条长边、与之平行的一条长粗实线（平行于密封表面母线）；轴用型贴靠座孔一侧，孔用型贴靠轴一侧，线端不触两侧框边。", "动态密封要素：一条长粗实线从静态线的一端斜向对边的远角（成对角形式），端点不触框；1996版规定其与轮廓线成45°。倾斜方向与工作介质流向相反，左右两种斜向表示唇口朝向不同。", "带副唇型（2009表2之3.3.1.3/3.3.1.4，1996称FB/FW/FZ形）：在动态斜线上再画一条与之成90°的短粗实线表示防尘副唇；双向密封型（3.3.1.5/3.3.1.6）为两条斜线自静态线两端交叉伸向对边。", "对应的规定画法画出唇形剖面、骨架（剖面线或涂黑）和箍紧弹簧小圆，常画在轴的一侧，另一侧用简化画法。"]
variants = ["基本型（B/W/Z形）", "带副唇（FB/FW/FZ形）", "双向密封", "轴用/孔用", "2009称详细的简化表示法；1996称特征画法"]
dxf_forms = ["Exploded thick strokes on layer 01: frame as closed LWPOLYLINE or 4 LINEs, one static LINE parallel to the shaft axis just inside a long side, one or two diagonal LINEs starting at the static line; no HATCH inside", "INSERT of a seal block from a GB part library (GstarCAD/CAXA 图库 油封/密封件, AutoCAD Mechanical), often paired with a mirrored copy about the shaft centre line (layer 05)", "Specified-form counterpart: LWPOLYLINE/SPLINE lip profile, HATCH ANSI31 or SOLID on the metal case (layer 10), small CIRCLE for the garter spring", "Seal identity only in the parts list (明细栏) as TEXT/MTEXT, linked by a balloon leader"]
recognition = "锚点为夹在轴外径线与座孔线之间、在轴线两侧镜像出现的小粗线矩形框（高≈(D−d)/2，宽为密封圈宽度，通常比相邻轴承框窄）。框内应同时有：一条平行于轴线、长度接近框宽、紧贴某一长边的粗线（静态要素），以及一条从该线端点斜伸向对边角点的粗线（动态唇），两者在静态线端点相接。另有一条与斜线成90°的短线则为带副唇型；两条斜线自静态线两端交叉则为双向型。区分：通用画法X两条对角线都不与任何线相接、无静态线；滚动轴承特征画法是长线被正交短线穿过；剖面线是多条等距细线。可用明细栏中“油封/密封圈”文字和其位置（轴伸出端盖处）佐证。"
confusions = ["滚动轴承特征画法：长线被1～2条正交短线穿过、线条不与其他线相接；密封符号的斜线与静态长线端点相接。", "动密封圈通用画法：框中央两条对角线交叉成X且四端都不触框，没有平行于母线的静态长线。", "往复运动密封圈特征画法：由框中心发出的短线（30°或平行），不是从静态长线端点出发的长斜线。", "剖面线或涂黑：多条等距细线或实心填充，而密封符号只有1～3条粗线。"]
related = ["DC-G3-150", "DC-G3-202", "DC-G3-203", "DC-G3-168", "DC-G3-109", "DC-G3-013", "DC-G3-012", "DC-G3-114", "DC-G3-133"]
priority = "low"
text_forms = ["油封 B 40×62×8（明细栏写法示意）", "旋转轴唇形密封圈 FB型"]
knowledge_units = ["K13", "K36"]
recognition_cards = []
recognizer = "none"
seen_on_drawing = []
expert_checked = false
notes = "2009版称“详细的简化表示法”，1996版称“特征画法”；1996版规定动态斜线与轮廓线成45°，2009版改为对角形式。框内线条相对位置据2009版表2图例图像描述（OCR不可读）。块、图层和明细栏写法属通用CAD实践，明细栏中的规格写法随密封圈产品标准版本而异，并非出自本标准。"
