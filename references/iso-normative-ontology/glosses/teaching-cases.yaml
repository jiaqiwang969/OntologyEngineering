# 教学案例注册表——书中场景/事故的一等对象。
# teaches: 概念关键词集（刻录时与词条名/转述求交集自动建边——泛化机制，非人工逐条贴）
six-green:
  ch: ch01
  teaches: [主张, 放行, 决定范围, 证据, 通过]
  summary: 六盏绿灯僵局——六份局部通过拼不成一句可签主张；"绿色是结论的颜色，不是结论的主语"
claim-parts:
  ch: ch01
  teaches: [主张, 配置, 关注, 情境, 假设, 决定]
  summary: 主张七部件解剖——"一句不能被反驳的话，也没有资格被签署"
single-factor:
  ch: ch01
  teaches: [变更, 版本, 差异, 重开, 标定, 配置, 软件]
  summary: SW1.8.3→1.8.4 单因变式——"版本变化不把旧证据变假，它改变证据与主张的关系"
seat-cards:
  ch: ch02
  teaches: [相关项, 系统, 元素, 工件, 边界, item, system, element, 组件]
  summary: 座位牌场景——"相关项、系统、元素是分析边界的名字，不是零件的名字"
r17-chain:
  ch: ch02
  teaches: [故障, 错误, 失效, fault, error, failure, 异常, 传播]
  summary: R17 电阻裂纹链——故障是种子不是收成；"把链压成一个词，处置就会走错门"
four-100ms:
  ch: ch02
  teaches: [时间间隔, FTTI, FDTI, FRTI, FHTI, 诊断, 容忍, 检测时间, 反应时间, 处理时间]
  summary: 四个一百毫秒——"同单位同数值不等于同一种时间；每个数字都要有宿主、起点和终点"
safe-state:
  ch: ch02
  teaches: [安全状态, 关断, 关机, 运行模式, 应急运行]
  summary: "关断不自动等于安全状态"——高速失去助力本身可能制造新危害
asil-language:
  ch: ch02
  teaches: [完整性等级, ASIL, QM, 风险, 等级]
  summary: 小唐"都按 D 做"之问——"ASIL 是风险的语言，不是荣誉的语言"
three-confirmations:
  ch: ch03
  teaches: [确认措施, 评审, 审核, 评估, 独立, 工作产物, 过程, 安全文化, 能力]
  summary: 三种确认与方工旧案——评审对工作产物、审核对过程、评估对整体；"签名不制造责任，只指向责任"
two-nets:
  ch: ch04
  teaches: [危害, 危害事件, 运行情形, 失常, 识别, HARA, 风险评估]
  summary: 两道网——功能×失常得危害候选，危害×运行情形得危害事件；"先画措施"的快捷路径为何不够
three-rulers:
  ch: ch04
  teaches: [严重度, 暴露, 可控性, 分级]
  summary: 三把尺子——S 绑伤害证据、E 绑运行剖面、C 绑动作/窗口/画像，证据不可互换
context-split:
  ch: ch04
  teaches: [情境, 场景, 后果, 切分]
  summary: 高速 vs 维修工位——"失常名称不足以身份化正在评价的对象"；切分纪律
goal-inherit:
  ch: ch04
  teaches: [安全目标, 继承, 相关项定义, 功能安全概念, 功能安全要求]
  summary: 多危害事件导出同一目标取最高 ASIL；相关项定义是 HARA 之前的边界文件
hsi-2ms:
  ch: ch05
  teaches: [接口, 硬件-软件接口, 典型值, 派生, 分配, 需求]
  summary: 梁工 2ms 典型值事故——"接缝不属于任何一方"；五要素缺一下游就得靠猜
time-budget:
  ch: ch05
  teaches: [预算, 窗口, 时序, 余量, 集成, 安全确认, 技术安全]
  summary: 200ms 预算账——"窗口属于危害，不属于机制；没有账本的预算谁都可以多花"
fit-400:
  ch: ch06
  teaches: [失效率, 单点, 潜伏, 残余, 多点, 度量, 硬件, FIT, 诊断覆盖]
  summary: 吴工 400 FIT 底账——SPFM 95.00% 对 99% 门限"没过"；"度量是除法，诚实全在分母"
six-edges:
  ch: ch16
  teaches: [测量, 不确定度, 单位, 来源, 校准, 证据]
  summary: 数字六条边护照——"复制的数字过不了夜"；不确定度是已承认的无知有多宽
v-model:
  ch: ch07
  teaches: [验证, 单元, 集成测试, 覆盖率, 软件, 架构]
  summary: V 模型两侧对质——"软件没有失效率，只有还没被触发的错误"；覆盖率量的是走过不是判对
compiler-upgrade:
  ch: ch07
  teaches: [工具链, 编译, 环境, 回归]
  summary: 小林编译器十一天事故——代码零改动，节拍变了；"通过绑定的是整条链"
power-tree:
  ch: ch08
  teaches: [相关失效, 共因, 级联, 独立, 依赖]
  summary: 梁工电源树——两条通道汇于同一稳压器；"独立是有分母的结论"
decomp-credit:
  ch: ch08
  teaches: [分解, 冗余, 共存]
  summary: 分解信用账——"拆开的是承诺，不是工作量"；原级信用靠独立证明赎回
lot-recall:
  ch: ch09
  teaches: [批次, 单件, 代换, 追溯, 一致性, 生产, 现场, 报废, 维修]
  summary: 老何 2100 台追回——"等效是设计结论，不是对照表"；身份链把嫌疑圈到 683 台
cart-case:
  ch: ch10
  teaches: [安全档案, 主张, 论证, 基线, 配置管理, 变更管理, 文档]
  summary: 推车与文件塔——"一摞文件是档案，不是案例"；23:40 错基线事故
tcl-two-questions:
  ch: ch10
  teaches: [软件工具, 置信度, 资格]
  summary: TCL 两问——先定"多不放心"的档，档再决定攒多少证据
identity-three:
  ch: ch12
  teaches: [同一, 身份, 判据, 别名, 序列, 桥接]
  summary: 三族判据——物理件靠履历、软件件靠内容、候选靠配置；"同名是线索不是证明"
