group = "G3"
kind = "simplified_representation"
meaning = "推力（承受轴向载荷）滚动轴承在装配图中的特征画法和规定画法：特征画法以矩形线框内垂直于轴承轴线的长粗实线加平行于轴线的短粗实线表示滚动体；规定画法画出沿轴向叠放的两片垫圈（轴圈、座圈）及夹在其间的滚动体。"
components = ["适用类型：推力球轴承（单向、双向）、推力圆柱滚子轴承、推力调心滚子轴承、双向推力角接触球轴承、推力滚针和保持架组件。", "特征画法：线框位于轴线两侧，长粗实线垂直于轴承轴线（表示滚动体的滚动轴线），短粗实线平行于轴线并穿过滚动体中心；调心型用长粗圆弧线。", "规定画法：两片垫圈为垂直于轴线的扁矩形，沿轴向叠放，滚珠圆或滚子矩形夹在中间；滚动体不画剖面线，垫圈剖面线同向同距。", "线型与配置：符号、线框和轮廓均为粗实线；规定画法一般画在轴的一侧，另一侧可用通用画法。", "版本：1998版表6可读；2017版沿用表6，但本资料中该页扫描缺失。"]
variants = ["推力球轴承", "推力圆柱滚子轴承", "推力调心滚子轴承", "双向推力角接触球轴承", "推力滚针和保持架组件"]
dxf_forms = ["Characteristic form: thick rectangle per side of the axis with a long thick LINE perpendicular to the bearing axis and a short thick LINE parallel to it crossing at the element centre", "Specified form: two thick washer outlines (LINE + small fillet ARCs) stacked along the axis, ball CIRCLE or roller rectangle between them; ANSI31 HATCH on the washers only", "Often an INSERT from a bearing library (block name may carry the series number such as 51xxx) or exploded strokes"]
recognition = "以装配剖视中紧靠轴肩或座孔台阶的轴承区域为锚点。判别推力型的关键是方向：垫圈（剖面线区域）的长边垂直于轴线、两片沿轴向排列，滚动体位于两片之间的轴向缝隙内；特征画法中长粗实线垂直于轴线。向心轴承则相反：内外圈长边平行于轴线、沿径向叠放，特征画法长粗实线平行于轴线。推力轴承线框沿轴向的高度T通常小于径向宽度(D−d)/2。区分通用画法：正立十字两臂不贴框且不表示方向；区分平垫圈或止推垫片：垫片之间没有滚动体圆。"
confusions = ["向心轴承：套圈长边平行于轴线、沿径向叠放。", "滚动轴承通用画法：正立十字，不区分载荷方向。", "平垫圈、止推垫片：无滚动体。", "机构简图推力轴承符号：单线简图。"]
related = ["DC-G3-032", "DC-G3-119", "DC-G3-121", "DC-G3-124", "DC-G3-123", "DC-G3-128", "DC-G3-103", "DC-G3-188", "DC-G3-174", "DC-G3-225"]
